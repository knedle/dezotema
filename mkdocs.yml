site_name: DezoTema
site_description: Tematická wiki tvrzení a postojů z přepisů videí a rozhovorů

theme:
  name: material
  language: cs
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

docs_dir: wiki

hooks:
  - tools/archiv/hook.py

# změna dat přegeneruje stránky i při `mkdocs serve`
watch:
  - data

extra_javascript:
  - js/zdroje-filter.js

extra_css:
  - css/zdroje-filter.css
  - css/nav.css

markdown_extensions:
  - attr_list
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

