  nadpis: Hurikán Melissa uměle vyvolán kvůli „Vizi 2030“ pro Jamajku (Boldy, 29. 10. 2025)
  text: 'Boldy tvrdí, že hurikán Melissa, který zasáhl Jamajku (podle něj silnější než Katrina, rozsahem
    větší než celá ČR, tři čtvrtiny ostrova bez proudu), nemá „žádné přírodní rozměry“, ale byl uměle
    vyvolán — jako důkaz uvádí existenci „patentu na řízení hurikánů a tornád“. Motiv spatřuje v jamajském
    rozvojovém plánu „Vize 2030“ (připravovaném od roku 2009): katastrofa má podle něj ostrov „totálně
    vyčistit“, zlikvidovat majetek a podniky místních obyvatel a uvolnit místo pro novou infrastrukturu
    a byznys elit. Kdo považuje hurikán za přírodní jev, ať „spí dál ve své bublině“. Jde o stejný vzorec
    jako u pozdějšího výkladu [Smart Cities a zničení Nepálu](/temata/konspirace/2026.md#boldy-2026-08-27-02);
    navazuje na [geoinženýrství a patenty na modifikaci počasí](/temata/konspirace/2026.md#boldy-2026-07-17-03).'
  citace:
  - text: Jamajka je jenom další projekt elit, kde se vyčistí totálně celá Jamajka a vytvoří se nová infrastruktura
      pro tadyto ty elity a pro jejich biznis.
  podtema: Náboženský a okultní výklad moci
