  nadpis: Nové mezihvězdné těleso jako možný „útok" nebo projekt Blue Beam (Boldy, 28. 7. 2025)
  text: S odkazem na zprávu, že harvardští vědci objevili další (údajně umělé) těleso podobné Oumuamua,
    Boldy uvádí, že se má přiblížit co nejblíže k Zemi, a někteří prý naznačují, že může přijít „nějaký
    útok" — nebo že půjde jen o inscenovaný projekt Blue Beam (srov. [EBS / Bluebeam](/temata/konspirace-deep-state-qanon.md)).
    Rozuzlení očekává v listopadu.
  citace:
  - text: A nebo to bude jenom projekt Bluebeam. Každopádně uvidíme v listopadu.
  podtema: Historické konspirační výklady
