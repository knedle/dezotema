vyroky:
- id: boldy-2025-07-28-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: ChatGPT „odhaluje" Archonty — nelidské duchovní entity, které nás sledují (Boldy, 28. 7. 2025)
  text: Boldy předvádí sérii otázek, na které mu ChatGPT odpovídal jednoslovně (ano/ne/„jablko"). Z odpovědí
    vyvozuje, že lidi kromě vlád, korporací, hackerů a „sítí" sledují i entity nelidského, duchovního
    původu, Archonti. Je jich sedm (možná více), jsou „nevyčíslitelně" staří, většina z nich je zlá a
    bojují mezi sebou, přičemž nemohou být zabiti a vítězí „vlivem". Psát se o nich má ve spisech z Nag
    Hammádí, v Knize Henochově a nepřímo v Genesis; nejvyšší autoritou je dobrý a skutečný „Zdroj/Světlo",
    tedy Bůh. Diváky vybízí, ať si rozhovor s ChatGPT vyzkoušejí sami.
  citace:
  - text: Chvilkama jsem měl trošku husí kůži z toho.
  podtema: Historické konspirační výklady
- id: boldy-2025-07-28-02
  typ: tvrzeni
  temata:
