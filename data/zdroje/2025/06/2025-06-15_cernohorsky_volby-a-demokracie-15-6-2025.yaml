- id: cernohorsky-2025-06-15-01
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Výzva volit výhradně SPD a Stačilo
  text: 'Černohorský vyzývá voliče k taktickému hlasování — výhradně pro dvě uskupení, která mají dle
    jeho analýzy reálnou šanci překročit volební práh: SPD (s PRO, Trikolórou a Svobodnými) a Stačilo
    (KSČM). Jako varující příklad uvádí rok 2021, kdy propadlo přes 1 100 000 hlasů (ekvivalent cca 55
    mandátů) tím, že vlastenecky orientované hlasy šly do malých stran nepřekonávajících práh.'
  citace:
  - text: Je potřeba volit jenom dva politické subjekty, které jsou na této scéně a které mají opravdu
      reálnou šanci se dostat do poslanecké sněmovny.
  - text: V roce 2021 propadlo díky tomuto uvažování 1 100 000 hlasů. 1 100 000 hlasů, prosím vás, to
      je plus mínus takových 55 mandátů.
  podtema: Volby
