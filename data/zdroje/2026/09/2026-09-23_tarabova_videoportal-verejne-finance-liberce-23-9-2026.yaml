  nadpis: 'Komunální program bod 6: audit veřejných financí Liberce (Tarabová, 23. 9. 2026)'
  text: 'Tarabová představuje šestý bod volebního programu PRO pro Liberec — kontrolu veřejných financí.
    Tvrdí, že s hospodařením současného vedení magistrátu jsou občané nespokojeni („kutálejí se nám miliony
    nahoru dolů" na velké projekty, zatímco v okolí bydliště lidem věci chybí). Odkazuje na zářijovou
    zprávu, podle níž je Liberecký kraj druhým nejhůře hospodařícím krajem, a za hlavního viníka označuje
    samotný Liberec: rezerva města podle ní klesla z 1,27 mld. Kč v polovině roku 2024 na 413 mil. Kč
    na konci června 2026, tedy zhruba o dvě třetiny za dva roky. Navrhuje audit provozu magistrátu a městských
    společností, snížení provozních nákladů o 3–5 % během volebního období (úspory vrátit do bydlení,
    dopravy, škol, zdravotnictví a péče o seniory), důslednou kontrolu zakázek a každoroční veřejnou zprávu
    „Kam jdou peníze Liberce?".'
  citace:
  - text: S námi se miliony nerozkutálí, to mi věřte.
  podtema: USA — volební systém
