vyroky:
- id: vrabel-2026-09-30-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**30. 9.** — K britské nabídce jaderného deštníku Finsku a zemím JEF Vrabel říká, že „osobně
    nechci jít odstrašovat jadernou vzduchovkou Rusko, které má jadernou pistoli" — britský arzenál podle
    něj nelze s ruským srovnat a bez svolení USA ho Británie použít nesmí. Shromáždění 3. 10. je „na poslední
    chvíli": „jestli přijde 100 lidí, tak jaderné zbraně budou".'
- id: vrabel-2026-09-30-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Spor s Vrabelem: demonstrace 3. 9. 2022 a rozpad jednoty hnutí (Rajchl, 27. 9. 2026)'
  text: '**30. 9. (Vrabel)** — Vrabel poprvé Rajchla přímo jmenuje: šanci „vytáhnout ČR z války" podle
    něj zmařil v roce 2022 Jindřich Rajchl, „který ukradl tu naši velkou sílu Václaváku, aby ji postavil
    proti Rusku", a „vlastenci, kteří se poté, co o mně začali psát hloupé zprávy, otočili proti mně a
    celý to rozbili" — „to okno se zavřelo v roce 2022". Stranu PRO nazývá „soudruzi", kteří udávají lidi
    za symboly a jsou „vždy součástí vládní koalice". Kateřina Konečná podle něj prodala domy KSČM, aby
    zaplatila kampaň Dostálovi a Vidlákovi, a značku Stačilo! vytvořila, aby nebylo vidět, že kandiduje
    za komunisty.'
  citace:
  - text: Bohužel můžete poděkovat Jindřichu Rajchlovi, který ukradl tu naši velkou sílu Václaváku, aby
      ji postavil proti Rusku.
  osoby:
  - osoba: rajchl
    vztah: negativni
    kontext: „Ukradl sílu Václaváku, aby ji postavil proti Rusku"
  - osoba: katerina-konecna
    vztah: negativni
    kontext: Prodala domy KSČM na kampaň, Stačilo! jako zástěrka
  podtema: Politická kultura
- id: vrabel-2026-09-30-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „99% jistota, že Evropa jde do války" — teorie úderu 1000–1500 letadel; ČR doma „beránek", v
    zahraničí „rozdmýchávač války" (Vrabel, 30. 9. 2026)
  text: 'Vrabel tvrdí, že Evropa jde „s 99% jistotou" do války: narativ narušování vzdušného prostoru
    podle něj gradoval od „pravděpodobně narušuje" po „musíme se bránit", aniž by byl jediný ruský útok
    prokázán (bomba na letišti v Lipsku ani obvinění Estonska ze sabotáží podle něj „nedávají smysl" —
    „čistá válečná propaganda", aby společnost přijala válku). Opakuje teorii o úderu 1 000–1 500 letadel
    s jadernými zbraněmi na Rusko a tvrdí, že Babiš s Pavlem „pošlou dvě brigády", bude-li napadeno Pobaltí.
    ČR podle něj doma hraje „nevinňátka a beránky", ale v zahraničí vypadá jako „jeden z největších rozdmýchávačů
    války" (Koudelka, Pavel). Severní polokoule „jde do světové války", brzy se přidá i Japonsko s konflikty
    v jihovýchodní Asii; v lednu hrozí nedostatek plynu — radí pořídit si topení na dřevo. Trump dělá
    podle něj „nejhorší politiku na světě, co pamatuje"; odvolávat Babišovu vládu nemá smysl, „není koho
    jiného" — lidé „vezmou rozum do hrsti" až po válce.'
  citace:
  - text: Ono to vypadá, že jdeme do války, prostě podle mě 99% jistota, že Evropa jde do války.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-30-05
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: „99% jistota", že Evropa jde do války; v lednu nedostatek plynu
  text: Evropa s 99% jistotou vstoupí do války s Ruskem; v lednu 2027 bude v Evropě problém s plynem a
    ceny budou „katastrofické"; do konfliktů v Asii se brzy zapojí Japonsko.
  citace:
