  nadpis: Debata na VOX TV s Janem Jakobem — obvinění Otakara Foltína z nacistické rétoriky (Rajchl, 7.
    9. 2026)
  text: '**13. 9.** — Rajchl v shrnutí téže debaty dodává další detaily „demolice": Jakob opakovaně reagoval
    jen frází „jste proruský dezinformátor" a nedokázal odpovědět, jak se počítá HDP, přestože Rajchl
    argumentoval čísly z ČSÚ a OECD (Jakob je nazval „smyšlenými"). Vyvrací i Foltínovu citaci, podle
    níž měl T. G. Masaryk část národa označit za „patologickou sedlinu na demokracii" — podle Rajchla
    Masaryk v rozhovoru pro *Prager Tagblatt* tímto výrazem označil fašismus jako ideologii, ne lidi,
    a přirovnává Foltínovu/Jakobovu logiku (kolektivní nálepkování bez konkrétního adresáta, s alibismem
    „vy se k tomu hlásíte sami") k nacistickému zacházení se slovem „Židé". Cituje i Ulricha Sigmunda
    (šéf AfD pro Sasko-Anhaltsko), který otevřeně podpořil zbrojení „ne kvůli Rusku, ale kvůli migrantům"
    (aby bylo čím je „deportovat") — oceňuje to jako upřímnost, kterou staví do kontrastu s českými politiky.'
  podtema: Politická kultura
