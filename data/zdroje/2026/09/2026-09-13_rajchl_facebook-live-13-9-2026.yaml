  nadpis: Zdeněk Řip narušil televizní debatu na Primě — dvojí metr médií (Rajchl, 13. 9. 2026)
  text: 'Rajchl kritizuje vystupování předsedy Pirátů Zdeňka Řipa v debatě šesti lídrů stran na CNN Prima
    News (moderátorka Terezie Tománková): Řip podle něj opakovaně a vědomě skákal ostatním do řeči (i
    po několik minut), destruoval plynulost debaty a moderátorka na to nezasáhla dostatečně razně — v
    důsledku Tománková musela přerušit i Karla Havlíčka, který tak nedostal prostor cokoli reálně sdělit.
    Rajchl to staví do kontrastu s hodnocením vlastního vystupování v médiích: kdyby se takto chovat on,
    byl by okamžitě na titulní straně Seznamu jako „nedisciplinovaný narušovač" a volalo by se po jeho
    vyloučení z debat — u Řipa (a Pirátů obecně) podobná kritika nepřichází. Tomia Okamuru z téže debaty
    naopak chválí jako nejdisciplinovanějšího účastníka.'
  podtema: Politická kultura
