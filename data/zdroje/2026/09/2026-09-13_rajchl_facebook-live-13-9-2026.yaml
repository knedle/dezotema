  nadpis: Přímý nákup ruské ropy — cesta do Moskvy jako jediné řešení (Rajchl, duben 2026)
  text: '**13. 9.** — K rostoucím cenám nafty (kolem 50 Kč/l) a plynu (80 eur/MWh) Rajchl rozvádí argument
    o „demokratické ropě": upravená hodnota 50 Kč o inflaci od Fialovy vlády odpovídá dnešním 65 Kč, takže
    reálné zdražení je menší, než se zdá — ale hlavní bod směřuje na „liberály/pravdoláskaře", kteří dříve
    podporovali odstřižení od ruských surovin a psali, že si „rádi připlatí". Tvrdí, že ruská nafta v
    Rusku stojí kolem 20 Kč/l, takže bez sankcí by se ČR mohla dostat na cca 30 Kč/l místo 50 Kč; ruská
    ropa se navíc do Evropy stále dostává, jen přes zprostředkovatele (Turecko, Indie), kteří si účtují
    přirážku — takzvaná „demokratická ropa" je tedy podle něj stejná ruská ropa prodávaná dráž. Kritizuje
    i to, že ČR se novým zdrojem (Blízký/Střední východ) stala závislá na íránském/blízkovýchodním konfliktu
    místo diverzifikace. Uzavírá vlastní vizi evropské spolupráce jako návrat k modelu EHS (volný pohyb
    kapitálu/zboží/služeb/lidí) bez „bruselské centrály", Green Dealu a migračního paktu — a vyzývá odpůrce,
    ať vysvětlí, co konkrétně by na tomto modelu bylo horší než dnešní členství v EU.'
  podtema: Rusko a energetická krize EU
- id: rajchl-2026-09-13-02
  typ: tvrzeni
