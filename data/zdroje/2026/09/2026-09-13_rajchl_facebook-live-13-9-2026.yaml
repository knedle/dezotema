  nadpis: Odmítnutí nálepky "radikální extremismus" — obrácená definice radikalismu (Rajchl, 12. 9. 2026)
  text: '**13. 9.** — Rajchl rozšiřuje seznam toho, co je označováno za „extremismus": odmítnutí přijímat
    migranty z Afriky i Ukrajiny, uznávání jen dvou pohlaví, manželství jako svazek muže a ženy, odmítnutí
    náhradního „surogátního" macenství jako obchodu s dětmi, odmítnutí eura a zrušení Benešových dekretů.
    Naopak za skutečný extremismus (bez použití toho slova médii) označuje: zavedení eura, zrušení Benešových
    dekretů (rozvrácení majetkových vztahů v pohraničí), vznik „spojených států evropských" (zánik ČR
    — cituje v tomto smyslu i Petra Pavla), Green Deal ničící evropskou ekonomiku a vtahování ČR do konfliktu
    s jadernou velmocí. Za skutečné extremisty tak označuje Piráty, STAN, TOP 09 a zčásti KDU-ČSL a ODS.
    Doplňuje čerstvý průzkum, podle nějž SPD samo dosahuje podpory srovnatelné s výsledkem voleb (7,8
    %) a společně s Trikolórou a Svobodnými na cca 10 % — interpretuje to jako odměnu za to, že koalice
    „neuhnula" od předvolebních slibů.'
  podtema: USA — volební systém
