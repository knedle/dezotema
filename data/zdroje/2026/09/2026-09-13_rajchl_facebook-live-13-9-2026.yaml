  nadpis: Debatní spor s „Matějem z Tetína" — zpochybnění kompetence kritika rozpočtu (Rajchl, 9. 9. 2026)
  text: '**13. 9.** — Rajchl identifikuje kritika jménem — starosta Tetína Matěj Hlavatý (Piráti), který
    obec o 120 obyvatelích podle něj zadlužil o několik milionů korun a byl zachráněn jen pomocí kraje.
    V debatě na CNN Prima News (šest lídrů stran) ho srovnává nevýhodně s Jiřím Pospíšilem (TOP 09): ačkoli
    s Pospíšilovou politikou zásadně nesouhlasí, uznává ho jako „inteligentního člověka schopného formulovat
    myšlenku", zatímco Hlavatého považuje za intelektuálně i zkušenostně nezpůsobilého radit s rozpočtem
    pro 10,5milionovou zemi. Vyjadřuje nechápavost, jak mohou voliči (Piráti, STAN) dávat takovým kandidátům
    15–16 % hlasů.'
  podtema: USA — volební systém
- id: rajchl-2026-09-13-06
