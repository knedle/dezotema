  text: '**23. 9. (archiv)** — Černohorský znovu zveřejňuje svůj starší demonstrační projev (zřejmě 2015):
    Amerika je podle něj „ďábel" s „pláštěm z lidské kůže", EU jeho „prodloužená ruka", která chce zlikvidovat
    východní Evropu; Merkelová je „lidská hyena", „minimálně stejná jako Hitler, ne-li horší", protože
    pozvala imigranty, kteří „vraždí, znásilňují" („obyčejná soloč"). Uprchlíkům se Sýrie s rodinami by
    pomohl, imigrantům ne; Sobotku označuje za „vlastizrádce" a vyzývá k odchodu z EU.'
