  nadpis: Zemské volby v Sasko-Anhaltsku — AfD s přes 40 % může poprvé vytvořit samostatnou vládu (Šejna,
    5. 9. 2026)
  text: '**8. 9. (Rajchl, TV debata)** — V debatě s poslancem ODS „panem Sokolem" Rajchl obhajuje AfD
    po jejím vítězství v Sasku-Anhaltsku: kritizuje taktiku „nálepkování" (srovnávání s Putinem), kterou
    dle něj používaly i CDU, FDP a SPD v Německu — a přesto (nebo právě proto) v Sasku prohrály; AfD podle
    něj vyhrála demokraticky a nelze strany dělit na „demokratické" a „nedemokratické". Upozorňuje na
    dvojí metr Sokola, který kritizuje německé pouliční skandování, ale ignoruje silné nacistické tendence
    na Ukrajině (odkaz na Banderu). Vyjadřuje shodu s AfD v odmítání eurozóny, kritice Green Dealu a migrace
    a doufá, že se stejný trend prosadí i ve Francii a ČR — zároveň se ale explicitně distancuje od AfD
    v otázce Benešových dekretů: na rozdíl od „pěti opozice", která podpořila sjezd sudetoněmeckého Landsmannschaftu
    v Brně, PRO revizi dekretů odmítá a toto téma s AfD neřeší.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
