  nadpis: 'Komunální program: zastavení projektu „Klimaticky neutrální Liberec" (Tarabová, 7. 9. 2026)'
  text: 'Tarabová představuje bod 3 volebního programu: přehodnocení účasti Liberce v unijním programu
    Net Zero Cities (EU Mission Platform Climate Neutral and Smart Cities), k němuž se Liberec jako jediné
    české město přihlásil a jehož 195stránkový dokument si celý přečetla. Cílem programu je snížit emise
    skleníkových plynů o 82 % oproti roku 2019 do roku 2030. Kritizuje konkrétní dopady na občany: povinné
    zateplování domů, výměnu oken a kotlů bez ohledu na to, zda si to lidé mohou dovolit, důraz na elektromobilitu,
    emisní povolenky a projekty obnovitelných zdrojů — a vyjadřuje podezření, že velká část prostředků
    směřuje k „expertům" a „kulatým stolům", ne k reálnému přínosu pro obyvatele. Nekritizuje ochranu
    přírody jako takovou, ale chce projekt „nehystericky" přehodnotit a najít v něm to, co je pro Liberečany
    skutečně prospěšné; odkazuje na časopis Radix k tématu klimatické krize.'
  podtema: USA — volební systém
