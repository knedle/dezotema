  nadpis: Přímý nákup ruské ropy — cesta do Moskvy jako jediné řešení (Rajchl, duben 2026)
  text: '**29. 9. a 5. 10.** — Rajchl tvrdí, že ruskou ropu a plyn Evropa stejně kupuje, jen přes prostředníky
    a s přirážkou: ropu přes Indii (rafinerie v Gudžarátu fakticky ovládaná Rosněftí), plyn přes Turecko,
    které má s Gazpromem dlouhodobou dohodu s desetiprocentní slevou, a i „kazašská" ropa do německého
    Schwedtu teče přes Rusko — „není to o tom, jestli kupujeme ruskou ropu, ale zač ji kupujeme". Sankce
    by podle něj fungovaly, jen kdyby přestal kupovat celý svět, což se nestane. Babišovo varování před
    „hybridním útokem" Ruska označuje za „ideologickou naivitu"; vzorem je mu AfD, která prý už jedná
    se šéfem Gazpromu o obnově dodávek, a vyzývá ke zrušení Green Dealu, Schengenu a eurozóny. Nafta je
    podle něj po započtení inflace stále levnější než za Fialovy vlády; doufá, že AfD a Marine Le Penová
    vyhrají volby a „společně s nimi zrušíme i EU".'
  citace:
  - text: Když upřednostníte ideologii, naivistickou ideologii před zdravým rozumem, tak vás to vždycky
      bude stát peníze.
  podtema: Rusko a energetická krize EU
