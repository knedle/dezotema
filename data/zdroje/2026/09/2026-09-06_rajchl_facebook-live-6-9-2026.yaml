  nadpis: 'NCOZ studie: organizovaný zločin v ČR ovládli Ukrajinci — Rajchl (5. 5. 2026)'
  text: '**6. 9.** — Rajchl rozšiřuje téma podvodných telefonátů o konkrétní odhad: podle nezávislého
    institutu se sídlem v Ženevě ukrajinská call centra připraví evropské a americké důchodce o miliardu
    dolarů měsíčně (typicky falešné investice do kryptoměn). Kritizuje, že se čeští politici v Poslanecké
    sněmovně věnují spíš „potenciálním ruským hybridním hrozbám" než tomuto reálnému a vyčíslitelnému
    okrádání seniorů, a tvrdí, že ukrajinské orgány činné v trestním řízení tyto podvody vědomě neřeší,
    protože z nich samy profitují — na rozdíl od české policie a státního zastupitelství, kterým ale bez
    součinnosti ukrajinské strany chybí možnost pachatele zadržet nebo zajistit prostředky. Navrhuje,
    aby ČR vetovala jakékoli návrhy ve prospěch Ukrajiny, dokud Kyjev tuto trestnou činnost nezačne řešit.'
- id: rajchl-2026-09-06-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: „Kim-irsenizace" Petra Pavla — dvojí metr médií vůči Pavlovi a Babišovi (Rajchl, 6. 9. 2026)
  text: 'Rajchl srovnává přístup CNN Prima News k rozhovorům s prezidentem Pavlem (týden předtím) a s
    premiérem Babišem (tentýž den): vůči Pavlovi byla moderace servilní a poslušná bez jediného skočení
    do řeči, vůči Babišovi naopak tvrdá a neustále přerušující — pokud jde o objektivitu, měl by být přístup
    stejný k oběma, nebo žádný. Podobně kontrastuje nadšené tleskání moderátorky Adely Snopové (TV Nova)
    při tvrdém útoku na bývalého prezidenta Václava Klause s adorací současného prezidenta. Jako příklad
    kultu osobnosti uvádí Pavlovu jízdu na motorce Harley-Davidson v čele kolony motorkářů ve flanelové
    košili — razí pro to termín „kim-irsenizace" (odkaz na severokorejský kult osobnosti), který očekává,
    že bude jen dále sílit.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-09-06-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenskyj žádá předčasnou výplatu tranže z půjčky 90 mld. EUR; korupční zatčení nejvyššího žalobce
    Ukrajiny (akce Kraken) — Rajchl (6. 9. 2026)
  text: K probíhajícím jednáním Witkoffa a Kushnera v Moskvě Rajchl tvrdí, že skutečnými zájemci o mír
    jsou jen USA a Rusko — Evropská unie mír nechce, protože rozjela válečnou ekonomiku prospívající zbrojařským
    firmám sponsorujícím politiky, a ani Volodymyr Zelenskyj o ukončení války nestojí, protože válka mu
    umožňuje udržet se u moci a dál rozkrádat veřejné a zahraniční finance. Jako důkaz uvádí, že Zelenskyj
    požádal Evropskou unii o předčasnou výplatu jedné z tranší již schválené půjčky 90 mld. eur (rozdělené
    do několika splátek podle kalendáře) — což Rajchl čte jako signál, že „cítí, že se mu krátí čas".
    Zmiňuje také, že protikorupční akce Kraken zadržela při korupci nejvyššího státního žalobce Ukrajiny
    — s poznámkou, že by bylo rychlejší sepsat seznam ukrajinských činitelů, kteří v korupci zapojeni
    nejsou, protože takový seznam by byl velmi krátký.
  podtema: Vyjednávání a mír
