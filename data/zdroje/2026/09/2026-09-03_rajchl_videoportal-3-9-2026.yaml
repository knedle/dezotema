  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: '**3. 9. (Rajchl)** — Rajchl v krátkém sněmovním vystoupení volá po zdrženlivosti v hodnocení
    incidentu v Halle/Lipsku a odmítá ukvapeně na někoho ukazovat prstem (reakce na kolegyni, patrně z
    ministerstva zahraničí/bezpečnostního výboru, tvrdící více, než vědí německé tajné služby). Připomíná
    polský raketový incident z listopadu 2022: tehdy se po dopadu dvou raket na polské území svolávala
    bezpečnostní rada a Jana Černochová na síti X vyzývala ke zvážení aktivace článku 5 NATO — do 24 hodin
    ale prezident Joe Biden oznámil, že nešlo o ruské, ale o ukrajinskou raketu, a polský prezident Andrzej
    Duda později v podcastu uvedl, že Volodymyr Zelenskyj o ukrajinském původu rakety věděl předem a přesto
    žádal svalit vinu na Rusko, aby do konfliktu zatáhl západní státy. Rajchl to uvádí jako důkaz, proč
    je namístě počkat na ověřené informace, než se z incidentu vyvozují bezpečnostní závěry.'
  podtema: Zahraniční aktéři a precedenty
