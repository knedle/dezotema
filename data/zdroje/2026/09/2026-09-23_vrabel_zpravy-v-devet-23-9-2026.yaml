vyroky:
- id: vrabel-2026-09-23-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Rubio ovládá výnosy z venezuelské ropy přes loutkovou prezidentku — „americký Macinka" (Vrabel,
    13. 7. 2026)
  text: '**23. 9.** — K jednání Trumpa s Delcy Rodríguezovou o venezuelském dluhu: stejný model jako s
    Kanadou — „poslouchejte nás a dejte ropu, nebo vás zničíme sankcemi"; Rodríguezová „sklonila hlavu"
    a nechala Madura ve vězení, „Venezuela je dneska kolonií Spojených států".'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-23-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Írán předán Radě bezpečnosti OSN — Vrabel: předvolební divadlo pro Trumpa (10. 9. 2026)'
  text: '**23. 9.** — K projevu íránského prezidenta Pezeškjána v OSN Vrabel argumentuje, že Írán jaderné
    dohody dodržoval a případné podezření měla prověřit MAAE, v krajním případě s vojenským doprovodem
    jen na základě rozhodnutí Rady bezpečnosti; americký útok je proto válečný zločin „sám o sobě i způsobem
    provedení" (vyvražděná vláda, „200 školaček"). Zdůrazňuje, že muslimským zemím nefandí — „čeho se
    nejvíc bojím, jsou muslimové v Evropě".'
  osoby:
  - osoba: masud-pezeskjan
    vztah: pozitivni
    kontext: Írán neporušil mezinárodní právo
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-23-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Fico žádá summit EU kvůli cenám nafty — „cynismus"; jediné řešení je ruská ropa a vystoupení
    z NATO (Vrabel, 23. 9. 2026)
  text: 'K Ficově žádosti o mimořádný summit EU kvůli cenám nafty (téměř 3 EUR/l) Vrabel tvrdí, že jde
    o cynismus, protože EU ceny neovlivní — určují je dvě války: Blízký východ (Hormuz a Bab al-Mandab
    zavřené „jen kvůli USA") a útoky NATO a Ukrajiny na ruské rafinerie; hrozí navíc, že USA omezí vývoz
    ropy do Evropy. Za odstřižení od ruské ropy viní Babiše, Fialu i „Kameru" (2015); Fico je podle něj
    sám součástí „globalistických struktur" NATO. Jediné řešení: nakupovat ropu a plyn z Ruska a vystoupit
    z NATO.'
  citace:
  - text: Jediný, co má smysl, je nakupovat z Ruska ropu a plyn za dobrý ceny v dobrý kvalitě. Všechno
      ostatní je Donald Duck.
  osoby:
  - osoba: robert-fico
    vztah: rozporuplny
    kontext: Summit EU k nafě = „cynismus", sám součástí globalistických struktur NATO
  podtema: Rusko a energetická krize EU
- id: vrabel-2026-09-23-04
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Velká Británie zatýká za „verbální trestné činy" víc než Rusko a Čína dohromady (Rajchl, 27.
    9. 2026)
  text: '**23. 9. (Vrabel)** — K zatčení muže v Anglii za čepici s vlajkou a transparent Vrabel tvrdí,
    že se Anglie „pomátla" a policisté „patří do ústavu pro choromyslné"; neustálé lhaní podle něj vede
    ke schizofrenii a paranoie. Protože i v ČR se lže („Rusko agresor"), může se za dva tři roky zatýkat
    i za českou vlajku. Výstřižek z iDnes o tom, že válku rozpoutal Putin, označuje za „satanismus v přímém
    přenosu — pravda potlačovaná, převlíkaná do lži". Připomíná, že média dál označují Tomáše Čermáka
    za „největšího dezinformátora".'
  podtema: Trestání politického projevu
- id: vrabel-2026-09-23-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Komise „neumí spočítat" úroky z půjčky 90 mld. eur Ukrajině — Vrabel nabízí výpočet (11. 8.
    2026)
  text: '**23. 9.** — K napjatým jednáním Zelenského s von der Leyenovou (deficit 26 mld. EUR, úvěr 90
    mld., Patrioty) Vrabel popisuje model EU: dává peníze, podmiňuje je, přijme zemi a „přebírá pravomoci
    vládnoucí třídy" — Ukrajinci by vstupem do EU „přišli o svoji zemi kompletně, stejně tak, jako jsme
    přišli o svoji zemi my". EU podle něj nemá peníze a dluhopisy vydány nebyly; program úspor a investic
    má přesměrovat „20 bilionů eur" úspor Evropanů do zbrojení.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-09-23-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: „Ukrajina má být zrušena" — teorie o neplatnosti její územní celistvosti; paralela s Kosovem
    (Vrabel, 9. 8. 2026)
  text: '**23. 9.** — K Pavlovu projevu na summitu Krymské platformy (Krym je ukrajinský, ČR bude Ukrajinu
    podporovat) Vrabel rozvádí vlastní výklad: Krym byl ruský „od carevny Kateřiny", v roce 1954 ho Ukrajině
    předal „opilý Chruščov, který byl Ukrajinec", a v referendu se lidé přes 90 % vyslovili pro Rusko
    (jeho kamarád tam byl pozorovatelem). Ukrajina jako stát „se neosvědčila" a „měla přestat existovat";
    Rusko podle něj zasáhlo v souladu s Chartou OSN (článek o bývalých nepřátelských státech a regionálních
    dohodách) a proti územní celistvosti staví právo na sebeurčení s precedentem Kosova. Pavel si podle
    něj mezinárodní právo vykládá záměrně jednostranně, z čehož plyne, že ČR bude Ukrajinu podporovat
    „do nekonečna" a mír „není".'
  citace:
  - text: Takže pro mě je Krym ruský, a to především z hlediska mezinárodního práva a z hlediska historie.
  osoby:
  - osoba: nikita-chruscov
    vztah: negativni
    kontext: „Opilý Chruščov, který byl Ukrajinec" předal Krym
  podtema: Příčiny a odpovědnost za válku
- id: vrabel-2026-09-23-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: První ozbrojená obrana proti TCK — „za chviličku budou Ukrajinci Ukrajince střílet na ulici";
    totéž hrozí ČR (Vrabel, 23. 9. 2026)
  text: K případu z Novovolynsku, kde muž s pistolí osvobodil zadrženého z rukou náborářů TCK, Vrabel
    předpovídá, že „za chviličku budou Ukrajinci Ukrajince střílet na ulici". Je to podle něj důsledek
    „protiruské nacifikace", kterou ČR opakuje s několikaletým zpožděním — podobné scény mohou nastat
    i v ČR za rok až tři, „možná za pár měsíců", dokud bude většina společnosti tvrdit, že Rusko je agresor.
    Rozebírá, že odvodu se nelze vyhnout, a uvažuje nad dilematem člověka, který by při odporu zastřelil
    vojáky a „žil s tím, že je vrah".
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-09-23-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'USA v RB OSN: „příměří první"; USA jako strůjce konfliktu (Vrabel, 9. 6. 2026)'
  text: '**23. 9.** — K Rubiovu výroku o zájmu obou stran o omezené příměří (energetika, obilí) Vrabel
    opakuje, že USA konflikt vyprovokovaly a financovaly, v roce 2022 zabránily míru, válku „prohrály"
    a nyní se „vtipně nasunuly" do role mírotvorců — „Američani rozpoutali válku proti Rusku, použili
    Ukrajinu a Evropu jako proxy".'
  podtema: Vyjednávání a mír
- id: vrabel-2026-09-23-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: USA by mohly válku ukončit ze dne na den — vypnutím Swiftu, internetu a ropy Evropě (Vrabel,
    23. 9. 2026)
  text: K Trumpovu setkání se Zelenským (Trump chce znovu jednat s Putinem, varuje, že ukrajinské útoky
    na rafinerie zvyšují ceny nafty, a přitom dodává Patrioty) Vrabel tvrdí, že jde o „předvolební hru"
    srovnatelnou s Babišovými sliby. USA podle něj kontrolují evropský internet, energetiku i finance
    a mohly by konflikt ukončit ze dne na den, ale chtějí, aby umírali Evropané. Zelenského (jméno v přepisu
    nepadá, ale z kontextu je zřejmé) popisuje jako „narkomana v pokročilém stádiu závislosti".
  citace:
  - text: Kdyby Spojené státy dneska řekly evropským politikům, musíte ten konflikt do zítřka ukončit,
      jinak vám vypneme Swift, vypneme vám internet a nebudeme vám dodávat ropu, tak je vymalováno.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-23-10
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: v ČR se bude za 2–3 roky zatýkat za českou vlajku a dojde ke scénám jako s TCK
  text: Protože se v ČR lže jako v Británii, může se za dva až tři roky zatýkat za českou vlajku; násilné
    scény jako s ukrajinskými náboráři TCK mohou v ČR nastat do 1–3 let, „možná za pár měsíců".
  citace:
  - text: Nemůžeme se divit, když by za dva roky třeba zatýkali někoho za to, že má českou vlajku. To
      se klidně může stát, nebo za tři roky.
  predikce:
    horizont: 2027–2029
    stav: ceka
- id: vrabel-2026-09-23-11
