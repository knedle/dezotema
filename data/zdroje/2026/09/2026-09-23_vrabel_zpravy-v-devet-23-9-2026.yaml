    text: útok USA na Írán = válečný zločin, měla rozhodnout MAAE/RB OSN
    vyrok: vrabel-2026-09-23-02
  - tema: Ruský Mi-8 vletěl do polského prostoru
    text: bez paniky, ale „jedno sestřelené letadlo a už se jede".
  - tema: USA mimo prohlášení EU–Ukrajina
    text: „už jsem to komentoval".
  - tema: 'Zelenskyj a von der Leyenová: deficit, úvěr 90 mld.'
