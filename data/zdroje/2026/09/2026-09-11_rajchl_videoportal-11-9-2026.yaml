  nadpis: Debata na VOX TV s Janem Jakobem — obvinění Otakara Foltína z nacistické rétoriky (Rajchl, 7.
    9. 2026)
  text: '**11. 9.** — Ze zveřejněného přímého záznamu téže debaty Rajchl rozšiřuje argument o dvojím metru
    dalšími příklady: připomíná, že Filip Turek byl médii obviněn z „nacistické rétoriky" za výrok o „deratizaci
    parazitů" (úředníků), zatímco Foltínovo oslovení „svině" bylo přejito bez kritiky — a doplňuje další
    srovnání, která podle něj ukazují stejnou nekonzistenci: Eva Decroix použila slovo „sволoč" a Pavel
    Novotný měl prohlásit, že by Češi „potřebovali válku" a museli „podřezat ženy a děti" — u obou bez
    srovnatelné medializace. Jakob na to reaguje odchodem ze studia se slovy „jste proruský trol".'
