  nadpis: 'Pfizer: 1223 mrtvých za 3 měsíce testování — a CDC potvrdil záporný přínos'
  text: '**10. 9.** — Zítko rozšiřuje tutéž tezi citací americké autorky Naomi Wolf (autorky knihy *Pfizer
    Papers*, založené na soudně vynucených interních dokumentech firmy), která obvinění popisuje jako
    „satanské na masivní úrovni" — tvrdí, že Pfizer věděl o poškození plodnosti (otrávené mateřské mléko,
    pokles počtu spermií, poškozené placenty) a přesto v injekcích pokračoval. Zítko z toho dovozuje,
    že šlo o „úmyslný útok na reprodukci" vedoucí k propadu porodnosti (opakuje dřívější číslo −30 %/35
    tisíc dětí, viz níže) a interpretuje výsledek jako záměrné „nahrazování" původního obyvatelstva Československa
    jinými národy.'
