  nadpis: Zásah do komunálních voleb v Liberci — selektivní výběr kandidátů na debatu (Tarabová, 2. 9.
    2026)
  text: 'Tarabová kritizuje Milion chvilek pro demokracii za organizaci předvolební besedy s kandidáty
    na primátora Liberce (17. 9. 2026), na kterou z 11 kandidujících subjektů pozvali jen 7 — její stranu
    PRO (kde sama kandiduje na primátorku) vynechali s odůvodněním výsledků komunálních voleb 2022. Namítá,
    že to je nekonzistentní: PRO v roce 2022 byla zcela nová, mediálně neznámá strana, zatímco mezi pozvanými
    jsou uskupení, která v tomto konkrétním složení v roce 2022 vůbec nekandidovala — „Lepší Liberec"
    (vzniklo kolem exstarosty Bratislavic Lukáše Pohanky) a „Liberecká devítka" (společná kandidátka TOP
    09 a KDU-ČSL, v roce 2022 kandidující jako součást vítězné koalice se Starosty). Uzavírá otázkou,
    proč se politická nezisková organizace vůbec angažuje v komunálních volbách.'
  podtema: Milion chvilek — struktura a financování
