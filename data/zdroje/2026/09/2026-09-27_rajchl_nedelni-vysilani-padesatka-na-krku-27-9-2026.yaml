  nadpis: Velká Británie zatýká za „verbální trestné činy" víc než Rusko a Čína dohromady (Rajchl, 27.
    9. 2026)
  text: 'Rajchl zpochybňuje sebeobraz Západu jako „svobodného světa": ve Velké Británii je podle něj za
    verbální trestné činy („za to, že říkáte něco, co se jim nelíbí") zatčeno každý rok mnohonásobně víc
    lidí než v Rusku a Číně dohromady. Řadí to do svého výkladu o „utahování šroubů" a prosazování totalitních
    manýr na Západě.'
  citace:
  - text: A budeme si pořád říkat, že my jsme ti svobodní a oni ne?
  podtema: Trestání politického projevu
- id: rajchl-2026-09-27-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel „troubí do války" — ve sporu s Ficem o čl. 5 NATO (Rajchl, 24. 9. 2026)
  text: '**27. 9.** — Rajchl označuje za „obrovskou ostudu", že Pavel vůbec prohlásil, že NATO musí mít
    odvahu sestřelit ruské letadlo (narušující vzdušný prostor, „což se děje běžně"). Ptá se, zda si někdo
    domýšlí následky — „opravdu chcete, aby sem přiletěly ty Orešniky? Do Ostravy, do Brna, do Plzně,
    do Prahy?" — a navrhuje místo toho podívat se na konflikt „jejich očima". Opakuje tezi o ukrajinské
    provokaci (Nord Stream, Przewodów, Duda) jako pravděpodobnějším scénáři než ruský útok na Evropu a
    tvrdí, že NATO by jednotné nebylo (Turecko, USA) — zbyla by jen část „koalice ochotných" a „hlavní
    bojiště bude tady u nás".'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-09-27-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Bilance šesti let v politice: od Trikolóry k poslaneckému mandátu (Rajchl, 27. 9. 2026)'
  text: V nedělním vysílání ke svým 50. narozeninám Rajchl rekapituluje svou politickou dráhu. Do politiky
    vstoupil v roce 2018 přes Trikolóru, inspirován vítězstvím Donalda Trumpa (2016) — ČR podle něj potřebovala
    konzervativní stranu se silným ekonomickým programem, která vrátí do politiky „zdravý rozum" poté,
    co se EU a celý „kolektivní Západ" „utrhl ze řetězu" (BLM, LGBTQ, Green Deal, masová migrace). Zlom
    přinesl covid, kdy se naplno pustil do obhajoby perzekvovaných; tehdy poznal lidi, s nimiž „táhne
    káru" dodnes (Jana Zwyrtek Hamplová, Petr Vacek, prof. Beran, dr. Vajíček). Za start své kariéry považuje
    projev na demonstraci 17. 11. 2021 na Staroměstském náměstí (pořádal Chcípl PES), kde vyzval policisty,
    aby „šli s námi"; následně mu podle něj ministerstvo zdravotnictví zablokovalo účast v pořadu *Máte
    slovo*. Eurovolby označuje za zklamání — Česká televize PRO nepustila do žádné velké debaty, jen do
    „naschvál zaranžované" debaty s Moravským zemským hnutím a hnutím Lano; výsledek 2,15 % byl přesto
    nejvyšší pod čarou a stal se „vstupenkou" ke spolupráci s SPD, Svobodnými a Trikolórou (zastupitelé
    ve 12 ze 13 krajů, ve sněmovních volbách 7,8 % a jeho mandát s procentuálně druhým nejvyšším podílem
    preferenčních hlasů po Filipu Turkovi). Tvrdí, že ze sněmovní opozice rostou preference jedině klubu
    SPD, protože lidé vidí, že „myslíme ty naše cíle naprosto vážně".
  podtema: Politická kultura
- id: rajchl-2026-09-27-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Spor s Vrabelem: demonstrace 3. 9. 2022 a rozpad jednoty hnutí (Rajchl, 27. 9. 2026)'
  text: |-
    Rajchl popisuje vznik velké demonstrace na Václavském náměstí 3. 9. 2022: PRO se Zwyrtek Hamplovou plánovali vlastní akci na 11. září, ale na nabídku Jiřího Havla (spolupracujícího s Chcípl PES) spojili síly s Ladislavem Vrabelem — přišlo podle něj kolem 100 tisíc lidí, snad největší demonstrace národně-konzervativního křídla od roku 1989, o níž média „mlčela" a později „lhala". Jednotu podle Rajchla rozbil hlavně Vrabel, který se „vpasoval do role" toho, kdo lidi na Václavák dostal — ve skutečnosti prý přišli za Mirkem Ševčíkem, Vladimírem Štěpánem, Tomášem Lukavcem, Zwyrtek Hamplovou „a snad i za mnou". Po rozchodu Vrabela s Havlem se skupina rozpadla a „osobní ambice vyhrály", čímž se promarnila šance vybudovat na této platformě silný subjekt proti Fialově vládě. Odmítá Vrabelovo tvrzení, že mu „ukradl demonstrace": vlastní demonstraci podle něj odmítal pořádat, dokud Vrabel neskončí — ohlásil ji až na březen 2023, poté co Vrabel na lednové demonstraci s minimální účastí sám oznámil, že velké demonstrace už dělat nebude.

    ⚡ **Vrabelova strana sporu (26.–27. 9.):** Vrabel Rajchla jmenovitě zmiňuje jen jednou (26. 9.) — lidé podle něj nepůjdou demonstrovat, protože „Reichel nám řekl, že to nemá smysl, demonstrace"; v témže vysílání zesměšňuje Janu Hruškovou („hysterická") a Vladimíra Štěpána, jehož údajné smlouvy s Ruskem na ropu a plyn jsou „pohádky pro děti" (takovou smlouvu lze podle něj uzavřít jen na vládní úrovni). V nedělním vysílání 27. 9. — v den Rajchlových padesátin — pak bez jména mluví o „podvodníkovi", kterému se „podařilo předat" hnutí z roku 2022 a který ho „celý zahodil do kanálu", a o „klasickém psychopatovi, který zrovna slaví kulaté narozeniny" a „udělá cokoliv pro to, aby se vydrapal nahoru po zádech všech". Jde o implicitní narážky; Rajchlovo tvrzení o „ukradených demonstracích" přímo nekomentuje.
