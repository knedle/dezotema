- id: rajchl-2026-09-27-10
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: 'Senátní kandidáti PRO/koalice: Loprais, Skalický, Beran, Šorna — „ani korunu na Ukrajinu" (Rajchl,
    27. 9. 2026)'
  text: 'Rajchl vyzývá k podpoře čtyř senátních kandidátů: Milana Lopraise (Ostrava–Poruba–Hlučín), Jana
    Skalického (Děčín), Hynka Berana (Trutnovsko, „tvář boje proti větrným elektrárnám") a MUDr. Šorny
    (Příbramsko). Slibuje, že nikdo z nich nezvedne ruku pro cokoli, co by eskalovalo válku na Ukrajině
    („ani korunu na Ukrajinu"), pro výcvik ukrajinských vojáků v ČR, podporu ukrajinské migrace, směrnice
    Green Dealu ani omezování suverenity v EU — naopak podpoří vložení práva platit českou korunou, práva
    platit v hotovosti a práva „žít offline" (nebýt povinen vyřizovat věci přes internet) do Ústavy. Sám
    se prý jako jediný člen výboru pro obranu zdržel při hlasování o vzetí na vědomí zprávy o výcviku
    800 ukrajinských vojáků v ČR — „nemohl bych se vám podívat do očí".'
  podtema: Senátní kandidáti
- id: rajchl-2026-09-27-11
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: 'PRO: 110 komunálních kandidátek, varování před „Pro Plzeň"; komunální politika jako „vratky"
    z větrníků (Rajchl, 27. 9. 2026)'
  text: Rajchl vyzývá k podpoře 110 komunálních kandidátek PRO (jmenuje Šanci pro Tábor, Pro Havířov s
    Martinem Garou a libereckou kandidátku s Lenkou Tarabovou) a varuje před záměnou — „Pro Plzeň" s PRO
    podle něj nemá nic společného, jde o „pohrobky ODS". Komunální politika je podle něj až na výjimky
    o velkých zakázkách, ze kterých se dá „co nejvíc vratek vrátit do vlastní kapsy" — například za povolení
    větrných elektráren od „baronů", kteří chtějí „hyzdit krajinu"; lidé PRO podle něj pro větrníky nikdy
    hlasovat nebudou. V Chomutově kandiduje PRO v koalici s SPD, Svobodnými, Trikolórou i Motoristy a
    podle průzkumů má 17–20 %, tedy šanci být druhou nejsilnější silou po ANO. Ohlašuje předvolební turné
    včetně společné debaty s Milošem Zemanem v Chomutově.
  podtema: Komunální volby
