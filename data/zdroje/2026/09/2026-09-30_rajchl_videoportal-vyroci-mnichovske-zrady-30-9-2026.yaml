  nadpis: Výročí Mnichovské zrady — Západ by nás obětoval znovu; spoléhat jen na sebe (Rajchl, 30. 9.
    2026)
  text: 'K výročí Mnichovské dohody Rajchl kritizuje „ohlušující ticho" ČT a Seznamu: připomínka, že nás
    Západ v roce 1938 „prodal za zlámanou grešli" Hitlerovi navzdory spojenecké smlouvě s Francií („takové
    malé bilaterální NATO"), se podle něj nehodí „probruselským médiím hlásajícím jednotu NATO". Dnes
    by to podle něj dopadlo stejně — kvůli ČR by nikdo jadernou válku nezahájil, „jen by nás hodili pod
    kola". Vyzývá spoléhat se jen na sebe: „nikde v Paříži, v Londýně, v Berlíně, ve Washingtonu, v Moskvě,
    v Pekingu a už vůbec ne v Bruselu" nevstává politik s myšlenkou pomoci ČR.'
  citace:
  - text: Jediná ruka, která vám ve finále pomůže, je ta na konci vašeho ramene.
