  text: '**25. 9. (Zítko)** — Na společné fotografii s Čermákem (185 cm) je Andrej Babiš menší, přestože
    „původní" Babiš měl měřit 187 cm — to je podle Zítka „krásný důkaz o tom, že Andrej Babiš není původní
    Andrej Babiš". Toma Hankse označuje za „jednoho z největších pedofilů v Hollywoodu".'
