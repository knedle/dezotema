  nadpis: „Vítězné mocnosti" Trump, Putin, bin Salmán a Módí rozhodnou o obnově Československa; volby
    20 let falšovány (Zítko, 24. 9. 2026)
  text: V úvodu speciálu ke kauze Čermák Zítko tvrdí, že Trump, Putin, bin Salmán a Módí jsou a budou
    „vítěznými mocnostmi", které rozhodnou i o „budoucí podobě našeho právního státu a zpětvzetí Československa";
    rozkradení zlatého pokladu a podniků připisuje operaci StB/KGB pod vedením „tria Klaus, Mečiar, Havel".
    Volby jsou podle něj nejméně 20 let zfalšované přes firmy ESET a Hewlett-Packard vybrané bez tendru
    a Joe Biden byl „v době inaugurace už popraven".
