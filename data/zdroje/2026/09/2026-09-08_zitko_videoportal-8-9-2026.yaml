  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: '**8. 9.** — Zítko tutéž tezi (zákon 11/1918, UPIC/DUNS čísla úřadů, Havlovy tři přísahy, Pařížská
    dohoda 1945 a reparace 29 bilionů Kč) opakuje beze změny v rámci týdenního shrnutí.'
