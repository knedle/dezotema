  nadpis: Privatizace jako řízená likvidace čs. průmyslu Západem — Solivary Prešov (Zítko, 8. 6. 2026)
  text: |-
    **8. 9.** — Zítko k témuž výkladu doplňuje konkrétní příklad Plzeňského Prazdroje: podnik byl v roce 1990 privatizován za 2 miliardy Kč, zatímco jeho hodnota v roce 2017 (další prodej) dosáhla 125 miliard Kč — tedy „63× reálná hodnota" prodaná do zahraničí.

    ⚡ **Poznámka:** Uvedené částky u Plzeňského Prazdroje nelze ověřit z veřejně dostupných zdrojů.
- id: zitko-2026-09-08-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Měnová reforma 1953 a inflace jako „okrádání" — argument pro hotovost (Zítko, 3. 6. 2026)
  text: '**8. 9.** — Zítko tutéž tezi opakuje beze změny, jen s upřesněnými čísly (720 mld. Kč hotovosti
    + 8,72 bil. Kč na účtech, tj. shodné ~8 700násobné znehodnocení od reformy 1953).'
