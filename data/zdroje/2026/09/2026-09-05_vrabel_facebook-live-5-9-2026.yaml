  nadpis: Nová EU legislativa NGT1 umožní neoznačené GMO potraviny — srovnání se Srbskem (Vrabel, 27.
    8. 2026)
  text: '**5. 9.** — K agenturní zprávě, že index cen potravin OSN (FAO) dosáhl v srpnu 133,3 bodu — nejvyšší
    úrovně od března 2022, s růstem zejména u obilovin (pšenice, kukuřice, ječmen, rýže) — Vrabel opakuje
    beze změny svou tezi o dvou příčinách: válka na Ukrajině (nejistota vývozu přes Černé moře) a uzavřený
    Hormuzský průliv (nedostatek hnojiv a dalších komodit).'
  podtema: Elektřina — marže a ceny
- id: vrabel-2026-09-05-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Demonstrace KSČM/Stačilo „Zastavme Petra Pavla" jako opakování škodlivého vzorce „antipolitiky"
    (Vrabel, 5. 9. 2026)
  text: 'Vrabel komentuje demonstraci KSČM a Stačilo na Malostranském náměstí namířenou proti Petru Pavlovi.
    Kritizuje samotný koncept: stejně jako předchozí kampaň „proti Petru Fialovi" nahradila věcnou politiku
    pouhým odporem vůči konkrétní osobě (výsledkem bylo, že se národ „zbavil" Fialy, ale skutečná politika
    se nezměnila), i tato demonstrace je podle něj postavena na negativním vymezení, ne na věcném programu
    — takový cyklus podle něj jen vede k tomu, že po odstranění jedné osoby nastoupí někdo horší, na kterého
    se spustí další kampaň. Přesto oceňuje dva konkrétní projevy: šéfredaktora komunistického týdeníku
    Naše pravda (mluvil věcně o nutnosti zachování plurality politických názorů) a Richarda Štěpána, který
    kritizoval jmenování Jana Landovského (dříve spojeného s neziskovým sektorem) vládním poradcem dohlížejícím
    na plnění závazku 5 % HDP na obranu. Kritizuje naopak vystoupení nezletilého mluvčího na politickém
    pódiu jako nevhodné zapojování dětí do politiky.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-09-05-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: EU řeší žádost Ukrajiny o miliardy na Patriot rakety — problém je nedostatek raket, ne peněz
    (Vrabel, 5. 9. 2026)
  text: 'EU prověřuje žádost Ukrajiny o další miliardy eur na posílení protivzdušné obrany, včetně nákupu
    amerických raket PAC-3 do systému Patriot — první žádost v rámci nového evropského podpůrného úvěru,
    jenž má doplnit již schválených 90 mld. EUR (viz [EU 90 mld. EUR Ukrajině — faktický dárek, ne půjčka](#eu-90-mld-eur-ukrajině--faktický-dárek-ne-půjčka-25-5-2026)).
    Vrabel upozorňuje na klíčový detail, který podle něj v debatě chybí: **problémem není nedostatek peněz,
    ale nedostatek samotných raket** — USA vyrábí jen omezené množství (odhaduje kolem 18 kusů ročně,
    možná do tisíce), zatímco Ukrajina by jich potřebovala tisíce ročně; EU proto tlačí na Španělsko a
    Itálii, aby své zásoby PAC-3 (s odůvodněním blížící se expirace) předaly Ukrajině. Dodává, že už schválených
    90 mld. EUR z prosince Ukrajině dosud nebylo vyplaceno, protože EU peníze fyzicky nemá a nepodařilo
    se jí vydat plánované dluhopisy (nikdo o ně nemá zájem) — jedinou reálnou zásobou likvidity, na kterou
    podle něj EU cílí, jsou úspory občanů (viz program Savings and Investments a jeho český klon [Národ
    sobě](suverenita-eu.md#von-der-leyen-bez-nových-vlastních-zdrojů-klesne-rozpočet-eu-o-40--souvislost-s-financováním-ukrajiny-vrabel-4-7-2026)).'
  dalsi_zdroje:
