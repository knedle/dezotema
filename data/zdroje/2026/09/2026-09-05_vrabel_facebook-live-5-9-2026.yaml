  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-05-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: '**5. 9.** — Vrabel dokládá stejný vzorec přímým rozporem mezi klíčovými západními aktéry. Německý
    kancléř Friedrich Merz uvedl, že loňský pokus o dronový útok na německé letiště ukazuje na systematickou
    hybridní hrozbu ze strany Ruska a že reakce německé vlády (obvinění Ruska) byla „jasná a správná"
    — vyzval EU, aby omezila udělování turistických víz Rusům. Vrabel to staví do kontrastu s výrokem
    Donalda Trumpa téhož dne: na otázku, zda Putin plánuje útok na Německo/NATO, Trump odpověděl, že s
    Putinem mluví pravidelně a osobně a že Putin „nemá v úmyslu zaútočit na území NATO". Popisuje obecný
    mechanismus, jak podle něj funguje mediální/politická „salámová metoda" obviňování Ruska (nejdřív
    náznak, pak nepotvrzeno, pak nalezená DNA ruského kriminálníka jako „důkaz", nakonec všichni evropští
    politici jednohlasně opakují, že šlo o Rusko) — a poukazuje, že když se stejná otázka položí přímo
    americkému prezidentovi s přístupem k CIA a osobním kontaktem s Putinem, odpověď je opačná. Uzavírá,
    že pokud to samé řekl Trump, může to bez rizika zopakovat i on: útoky nedělají Rusové, ale někdo jiný,
    kdo chce, aby to tak vypadalo.'
  podtema: Zahraniční aktéři a precedenty
