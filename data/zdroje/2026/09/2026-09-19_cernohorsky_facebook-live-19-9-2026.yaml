  nadpis: Zákon 302/2016 o financování politických stran „zabetonoval" etablované strany (Černohorský,
    19. 9. 2026)
  text: |-
    Černohorský kritizuje novelu zákona o politických stranách č. 302/2016 Sb. (mění zákon 424/1991 Sb.), kterou podle něj podepsal Miloš Zeman a která podle něj natrvalo znevýhodnila malé politické strany. Novela podle jeho výkladu umožňuje straně/hnutí zastoupenému v Poslanecké sněmovně alespoň dvě volební období (8 let) zřídit si vlastní neziskovou organizaci, do které jí navíc plyne dalších 10 % z celkového státního příspěvku za hlasy — tedy při 100 mil. Kč za hlasy dalších 10 mil. Kč navíc „z našich peněz". V kombinaci s 5% uzavírací klauzulí to podle něj natrvalo „zabetonovalo" již usazené strany (jmenuje ODS, STAN, TOP 09, KDU-ČSL, Piráty) a znemožnilo vznik nových politických subjektů bez silného mecenáše (příklad: obtížný vstup Motoristů do Sněmovny). Navrhuje snížit uzavírací klauzuli z 5 % na 1 % a celkově revidovat systém přerozdělování stranických příspěvků, který označuje za zdroj korupce.

    ⚡ **Poznámka:** Přesné číslo zákona si Černohorský v projevu sám opravuje (nejprve uvádí 306, pak 302/2016) — mechanismus dodatečného příspěvku přidružené neziskové organizaci ve výši 10 % nelze z dostupných zdrojů ověřit v podobě, v jaké ho prezentuje.
  podtema: Volby
- id: cernohorsky-2026-09-19-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rozšířená matematika sjednocení vlastenecké scény — výsměch kandidátovi Robertu Rosenbergovi
    (Černohorský, 19. 9. 2026)
  text: 'Černohorský navazuje na svou dřívější kritiku hesla „jedině ten" (viz výše, 15. 9. 2026) podrobnějším
    propočtem: součet hlasů SPD, PRO, Trikolóry a Svobodných z voleb 2025 dává necelých 900 tisíc hlasů
    — pod hranicí potřebnou k sestavení vlády. I po připočtení Stačilo a menších „vlasteneckých" stran,
    které nepřekročily 5% práh (Přísaha, Česká republika na prvním místě, Švýcarská demokracie, Moravané
    aj.), by šlo dohromady o necelý milion voličů a odhadem 14–15 poslanců (cca 7,6 %) — pořád nedostatečně
    na to, aby taková koalice porazila ANO. Uzavírá, že psát na sociální sítě „příští volby musí vyhrát
    pro/Trikolóra/Svobodní/KSČM/Stačilo" bez Babiše je matematicky negramotné. Jako ilustraci „úpadku"
    vlastenecké scény zmiňuje kandidaturu bývalého pornoherce Roberta Rosenberga za Svobodné v Praze.'
  podtema: Volby
- id: cernohorsky-2026-09-19-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Katalog korupčních kauz ukrajinského vedení jako odpověď na „obránce Ukrajiny" — Nord Stream
    jako ukrajinsko-americký čin (Černohorský, 19. 9. 2026)
  text: 'V reakci na diváka, který ho obvinil z postoje proti „obráncům Ukrajiny", Černohorský vyjmenovává
    sérii korupčních kauz ukrajinských představitelů jako důkaz, že jde o zkorumpovaný režim, ne o hrdiny:
    Andrij Jermak (bývalý šéf kanceláře Zelenského, vyšetřován kvůli praní peněz přes výstavbu u Kyjeva,
    ~400 mld. hřiven), Oleksij Černyšov (bývalý vicepremiér, stejná kauza), Timur Mindič (obchodní partner
    Zelenského, uprchl do Izraele před razií NABU v listopadu 2025 v souvislosti s kauzou „MIDAS" kolem
    Energoatomu), Herman Haluščenko (bývalý ministr energetiky a spravedlnosti, zadržen při pokusu opustit
    Ukrajinu, obviněn z praní peněz v téže kauze), Iryna Mudra (náměstkyně šéfa prezidentské kanceláře,
    spojována s legalizací dalších 150 mld. hřiven) a Ruslan Kravčenko (generální prokurátor, který v
    noci z 13. na 14. 9. 2026 údajně uprchl ze země se služebním vozem uprostřed vyšetřování podvodných
    call center). Opakuje tezi, že sabotáž Nord Streamu provedli Ukrajinci s podporou USA, ne Rusko (→
    srov. [Sabotáž Nord Streamu jako legitimní vojenský cíl](#sabotáž-nord-streamu-jako-legitimní-vojenský-cíl--kritika-petra-pavla-a-médií-rajchl-6-7-2026)),
    a formuluje rámec „Rusko není náš nepřítel, Rusko je nepřítel nacismu" — obviňuje ukrajinské vedení
    z rozpoutání konfliktu (podpora Majdanu, nedodržení Minských dohod, ostřelování Donbasu) a vyjadřuje
    přání jejich násilné smrti (→ [stochastický teror](stochasticky-teror.md)).'
  podtema: Zahraniční aktéři a precedenty
