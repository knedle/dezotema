- id: cernohorsky-2026-09-19-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Obhajoba Babiše ohledně vysokých cen pohonných hmot — viní Izrael, USA a Velkou Británii (Černohorský,
    19. 9. 2026)
  text: Černohorský odmítá kritiku, že za rostoucí ceny pohonných hmot (přes 50 Kč/l) může vláda Andreje
    Babiše. Argumentuje, že ČR nevlastní žádné velké rafinerie (kromě menšího podílu Robin Oil), takže
    cenu neurčuje česká vláda, ale dění na Blízkém východě a globální trh s ropou. Odpovědnost připisuje
    Izraeli, USA a Velké Británii, které podle něj záměrně rozvracejí Evropu prostřednictvím podpory Ukrajiny
    a konfliktu s Íránem, aby z toho profitovaly na úkor evropské ekonomiky (odkaz na dřívější tezi, že
    si Trump a Biden „mnuli ruce" nad rozvrácenou Evropou). I kdyby Babiš cenu chtěl snížit, mohl by ji
    dle Černohorského ovlivnit maximálně o 4,50–5 Kč/l.
  podtema: Pohonné hmoty
- id: cernohorsky-2026-09-19-02
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Podezření na sledování Facebook Messengeru a shadowban (Černohorský, 19. 9. 2026)
  text: |-
    Černohorský tvrdí, že Facebook čte soukromé zprávy uživatelů v Messengeru — jako důkaz uvádí, že mu aplikace omezila možnost odeslat zprávu s „nevhodným" obsahem, což podle něj nelze vysvětlit jinak než automatickým prohledáváním obsahu zpráv. Kvůli tomu odmítá s kýmkoliv telefonovat přes Messenger. Dále popisuje opakované potíže se sdílením příspěvků na Facebooku (zpožděné zobrazení, mizející sdílení) jako projev cíleného shadowbanu — srovnává se staršími snímky obrazovky, kdy jeho videa měla statisíce zhlédnutí, než „mu začali dávat pokoj".

    ⚡ **Poznámka:** Tvrzení, že Facebook automaticky čte a blokuje obsah soukromých zpráv na základě jejich obsahu, nelze z popsaného incidentu (varování o „nevhodné" fotografii) jednoznačně odlišit od standardní automatické detekce citlivého obsahu (např. nahoty), která funguje bez lidského čtení zpráv.
- id: cernohorsky-2026-09-19-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Židé z USA" a Rothschildové jako záměrní strůjci rozvratu Evropy přes válku na Ukrajině (Černohorský,
    19. 9. 2026)
  text: V rámci obhajoby Andreje Babiše (viz [ceny-energie.md](ceny-energie.md)) Černohorský tvrdí, že
    za drahými pohonnými hmotami a rozvratem evropské ekonomiky nestojí česká vláda, ale záměrný plán
    „Židů z USA" a rodiny Rothschildů ve spojení s Velkou Británií — ti měli přes podporu Ukrajiny a konfliktu
    s Íránem cíleně připravit Evropu o levné ruské suroviny ve svůj prospěch („komu prospívá, že Evropa
    je v hajzlu"). Odkazuje na starší tezi, že si Trump a Biden „mnuli ruce" nad rozvrácenou Evropou.
    Totéž schéma aplikuje na sabotáž Nord Streamu, kterou připisuje Ukrajině „za podpory Američanů".
  citace:
  - text: Takže v tom mají zase prsty ty skurvení židé, vole, z USA.
  podtema: Globalistická agenda a další výklady
- id: cernohorsky-2026-09-19-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Jiří Drahoš — neschválená cesta na Ukrajinu jako důkaz selhání dvoukomorového systému (Černohorský,
    19. 9. 2026)
  text: Černohorský kritizuje místopředsedu Senátu Jiřího Drahoše za cestu na Ukrajinu (dle jeho zjištění
    bez svolení vlády ani parlamentu, k jednání se Zelenským), kterou nemohl zabránit ani ministr zahraničí
    Tomio Okamura. Argumentuje, že jde o doklad, jak dvoukomorový systém umožňuje jednotlivci „uzurpovat"
    zahraničněpolitickou moc bez demokratické kontroly. Připomíná svou dřívější nechuť k Drahošovi z prezidentských
    voleb 2018 („stahovač králíků") a vyjadřuje úlevu, že nezvítězil nad Milošem Zemanem.
  osoby:
  - osoba: jiri-drahos
    vztah: negativni
    kontext: Místopředseda Senátu — neschválená cesta na Ukrajinu; „stahovač králíků"; úleva, že nevyhrál
      prezidentské volby 2018
  podtema: Demokracie a politický systém
- id: cernohorsky-2026-09-19-05
  typ: tvrzeni
  temata:
