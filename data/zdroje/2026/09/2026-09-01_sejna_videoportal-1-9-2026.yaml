  nadpis: Demografická náhrada jako nevyhnutelná i v „nejlepším scénáři" (Adam Šejna, 6. 8. 2026)
  text: '**1. 9.** — V krátkém shrnujícím videu Šejna opakuje tutéž tezi ve zhuštěné podobě: nekontrolovaná
    migrace vede k násilí (včetně znásilňování), okrádání, zneužívání sociálních dávek a celkovému úpadku
    života — jako důkaz odkazuje na současnou situaci v Německu, Británii a Francii. Uzavírá, že bez možnosti
    předem zjistit, kdo z příchozích se dopustí trestné činnosti, nelze čekat, „až se něco stane", a je
    nutné migraci kontrolovat předem.'
