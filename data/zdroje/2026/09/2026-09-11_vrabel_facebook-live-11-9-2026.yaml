  nadpis: Elektřina v ČR jako „1000% marže" — Tykač a Křetínský profitují ze státního cenového stropu
    (Vrabel, 9. 8. 2026)
  text: '**11. 9.** — Vrabel opakuje totéž srovnání s doplněním pohonných hmot: benzín/nafta v ČR se blíží
    50 Kč/l, v Německu se litr benzínu prodává za víc než 2 eura, zatímco v Rusku za třetinu ceny nebo
    méně; elektřina v Srbsku je 4,5× levnější než v ČR — přestože ČR byla v roce 2022 největším vývozcem
    elektřiny v Evropě a vyráběla ji za 30–50 haléřů. Dodává, že zdražení bylo dále umocněno obsazením
    přístavu Mocha jemenskými Húsíji a jejich postupem k průlivu Bab al-Mandab (cca 10 % světové ropy),
    což popisuje jako „druhý Hormuz".'
  podtema: Elektřina — marže a ceny
- id: vrabel-2026-09-11-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Litva ruší ústavní zákaz jaderných zbraní a cizích vojenských základen (Vrabel, 3. 7. 2026)
  text: '**11. 9.** — Vrabel k opětovnému projednávání litevské ústavní změny (může se protáhnout do zimního
    zasedání) dává přímou paralelu s Českou republikou: stejnou „salámovou metodou", jakou Litva postupuje
    ke zrušení zákazu, postupuje i ČR k připojení k francouzskému jadernému deštníku (Rafale s raketami
    ASMP) — nejdřív Petr Pavel v březnu 2026, pak Andrej Babiš. Cituje mluvčího Kremlu Dmitrije Peskova,
    který k litevské ústavní změně řekl, že „litevské území se ocitne v hledáčku" ruských jaderných zbraní,
    pokud Vilnius zbraně na svém území skutečně rozmístí — protože rozmístěné jaderné zbraně jsou vždy
    namířeny proti někomu (v tomto případě proti Rusku na východ, ne na západ). Vrabel z toho vyvozuje
    přímý důsledek pro ČR: v okamžiku podpisu smlouvy s Francií o možném rozmístění francouzských jaderných
    letadel se ruské raketové síly (hypersonické Kinžaly, Sarmaty) programově zaměří na české území, bez
    ohledu na to, že samotná letadla by dorazila až později (typicky v momentě další eskalace, kdy by
    reakční čas byl minimální). Popisuje důsledky jaderného zásahu nad ČR — radioaktivní déšť, zničenou
    půdu a jídlo, dlouhodobé nemoci z ozáření — a vyzývá k účasti na demonstraci 3. 10. s požadavkem,
    aby vláda smlouvu s Francií o jaderném odstrašení nepodepsala.'
- id: vrabel-2026-09-11-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Prodej ČSA/Smartwings turecké firmě Pegasus Airlines jako další „rozprodej" Česka (Vrabel, 11.
    9. 2026)
  text: 'Turecká letecká skupina Pegasus Airlines má převzít české aerolinky ČSA a spolu s nimi (protože
    ČSA vlastní 100 % Smartwings) i Smartwings — Úřad pro ochranu hospodářské soutěže spojení podmínečně
    schválil (Pegasus musí uvolnit letní sloty na trase Praha–Antalya konkurenci), rozhodnutí ale ještě
    není pravomocné. Vrabel k tomu vypráví osobní vzpomínku: jako vyučený pilot vyrazil s manželkou uprostřed
    dovolené v Praze rovnou na letiště, aby zachytil poslední let ČSA — a přiznává, že mu na místě „ukáplo",
    jak moc se ho konec českých aerolinek osobně dotkl. Řadí prodej do dlouhého výčtu odprodaného národního
    majetku zahraničním vlastníkům (voda — Veolie/Francouzi, elektřina — E.ON/Němci v jižních Čechách
    a na Moravě, potraviny, textil, technika) a ironicky se ptá, komu bude patřit už jen „vzduch".'
  podtema: Národní fond obnovy — 40 % na Green Deal místo odškodnění zkrachovalých živnostníků (Vrabel,
    3. 9. 2026)
- id: vrabel-2026-09-11-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'BRICS vs unipolární svět: konflikt o dolar a globalistickou „chazarskou" nadvládu (Vrabel,
    8. 6. 2026)'
  text: '**11. 9.** — Vrabel cituje Vladimira Putina na obchodním fóru BRICS: země BRICS dnes vytvářejí
    více než 40 % světového HDP oproti 29 % u zemí G7, přičemž polovinu růstu světové ekonomiky zajišťují
    právě státy BRICS. Putin dále uvedl, že ruské HDP mezi lety 2023–2025 vzrostlo o 10,3 % (rychleji
    než světový průměr) navzdory cca 30 000 sankcím (dvakrát více než proti všem ostatním zemím světa
    dohromady) a zdůraznil pokles průmyslové výroby v eurozóně o 8 %. Vrabel to čte jako důkaz svého dlouhodobého
    tvrzení, že „Západ končí" a že sankční politika postihuje víc iniciátory sankcí než Rusko — kritizuje
    i to, že česká média označují Putina bez titulu „prezident", zatímco u Trumpa a Zelenského titul vždy
    uvádí.'
  podtema: Elity a jejich plány
- id: vrabel-2026-09-11-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 25. výročí 11. září — pochybnosti o oficiální verzi, sedmý mrakodrap a plán válek v sedmi zemích
    (Vrabel, 11. 9. 2026)
  text: |-
    K 25. výročí útoků z 11. září 2001 Vrabel kritizuje vyjádření vicepremiéra a ministra zahraničí Petra Macinky, že „některá data nepotřebují vysvětlení" — naopak tvrdí, že toto konkrétní datum vysvětlení potřebuje nejvíc. Argumentuje fyzikální nemožností oficiální verze: hliníkové letadlo s kerosinovým požárem podle něj nemohlo zničit masivní ocelovou konstrukci mrakodrapů navrženou na vydržení mnohem větší zátěže; sedmá budova Světového obchodního centra se zřítila, aniž do ní narazilo jakékoli letadlo; v Pentagonu nebyly nalezeny žádné trosky letadla; mezi jednotlivými útoky uplynulo přes tři čtvrtě hodiny, aniž by vzlétly americké stíhačky (na rozdíl od standardní reakce na dnešní dronové incidenty); a pasy únosců se našly na místě dřív, než budovy spadly. Připomíná, že na základě zprávy vyšetřovací komise (Kean-Hamilton) byla legitimizována invaze do Iráku a válka v Afghánistánu, a cituje generála Wesleyho Clarka, který měl krátce po útocích v Pentagonu vidět plán války v sedmi zemích (Irák, Sýrie, Libanon, Libye, Somálsko, Súdán, Írán) během pěti let — z nichž se většina později naplnila. Uzavírá, že konspirační vysvětlení („false flag" operace provedená k rozehrání „války proti terorismu") mu připadá logičtější než oficiální verze, byť připouští, že pro to nemá přímé důkazy.

    ⚡ **Konflikt:** Tvrzení o kontrolované demolici WTC a absenci trosek v Pentagonu jsou v rozporu se závěry oficiálních vyšetřování (komise NIST, 9/11 Commission), které fyzikální kolaps budov i nárazy letadel dokumentují.
  podtema: Náboženský a okultní výklad moci
