  nadpis: „Super El Niño" — varování před možným ovlivňováním počasí (Vrabel, 11. 9. 2026)
  text: Vrabel referuje mediální zprávy o rychle zesilujícím El Niño v Pacifiku, které by na podzim mohlo
    dosáhnout mimořádné intenzity (patřit k nejsilnějším zaznamenaným epizodám, s dopady až do začátku
    roku 2027) v kombinaci s kladnou fází indicko-oceánského dipólu — s možnými dopady na sucha, srážky
    a povodně od Austrálie přes Indii až po východní Afriku. Poznamenává, že všechna média jev prezentují
    jako čistě přírodní, což mu právě proto přijde podezřelé — vzhledem k tomu, co považuje za prokázané
    schopnosti ovlivňování počasí. Doporučuje divákům praktickou přípravu (zásoby vody v lahvích, konzervy,
    baterky/svíčky pro případ výpadků elektřiny) pro případ, že by jev zasáhl i ČR výpadky proudu, silným
    větrem, bouřkami nebo kroupami.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-09-11-07
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'AfD Weidelová: uzavření hranic a plán vrátit syrské uprchlíky — Německo v „nezvratném rozkladu"
    (Vrabel, 26. 8. 2026)'
  text: '**11. 9.** — Poslanecký klub AfD podal trestní oznámení na kancléře Friedricha Merze za jeho
    výrok v Bundestagu, že koncept remigrace prosazovaný AfD je „etnická čistka podle původu a barvy pleti"
    — AfD to označuje za pomlouvačné a trestně relevantní. Vrabel s AfD v podstatě souhlasí, ale zpřesňuje
    vlastní pozici k migraci obecně: rozlišuje migraci z lásky (bez hranic — dává vlastní příklad manželky
    Srbky a matky provdané v Německu) a migraci osob, které se v zemi zapojí a fungují, od masové, neintegrující
    se migrace (dává příklad dvou milionů Ukrajinců v ČR), kterou považuje za problém jak pro cílovou
    zemi, tak pro zemi původu. Remigraci samu za etnickou čistku odmítá — tou byly dle něj skutečné násilné
    vyhnání/vyvraždění (Bosna, Kosovo, Chorvatsko vůči Srbům), ne návrat nelegálních migrantů výměnou
    za finanční kompenzaci, kterou navrhuje jako praktické řešení (vyplatit odchod, případně i přijímací
    zemi). Merzovo srovnání považuje za manipulativní převrácení významu slov („to, co je nahoře, se nazve
    tím, co je dole").'
- id: vrabel-2026-09-11-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Centralizace onkologické péče — kritika ministra Vojtěcha a vlastní teorie příčin rakoviny (Vrabel,
    11. 9. 2026)
  text: 'Ministerstvo zdravotnictví chce od roku 2030 centralizovat operace zhoubných nádorů — u rakoviny
    prostaty má počet pracovišť klesnout ze 78 na 22; ministr Adam Vojtěch (ANO) to obhajuje snahou zvýšit
    kvalitu péče a srovnává ČR nevýhodně s Dánskem, nemocnice a část lékařů varují před přetížením zbylých
    center a delšími čekacími dobami. Vrabel logiku centralizace odmítá: srovnává ji s absurdním důsledkem,
    že podle stejné logiky by nejlepší léčbu zajistilo soustředění veškeré péče do jediné (nejlepší) nemocnice,
    např. IKEM — ve skutečnosti půjde jen o zánik pracovišť, pozdější diagnostiku a víc úmrtí, ne o spojení
    duplicitních kapacit. Srovnání s Dánskem odmítá jako irelevantní (jiná kultura, jiný životní styl)
    a nabízí vlastní teorii příčin rakoviny: kombinaci nezdravé stravy (cukr, přebytek masa, překyselený
    organismus) a na hlubší úrovni „zamrzlých emocí" (především nevyjádřeného hněvu), které blokují průtok
    energie tělem a spouštějí nekontrolovanou buněčnou reprodukci — namísto řešení těchto příčin podle
    něj ministerstvo (podobně jako u vakcín) jen léčí důsledky farmaceutickými produkty (např. lék Ozempic,
    který popisuje jako mimořádně rizikový).'
  podtema: USA — volební systém
- id: vrabel-2026-09-11-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajinci nechtějí bojovat — TCK „lov lidí" a úplatek 12 000 $ (Vrabel, 6. 6. 2026)
  text: '**11. 9.** — K oficiální zprávě, že mobilizace v Kyjevě „probíhá podle plánu", Vrabel opakuje
    beze změny svou tezi, že tímto plánem je bojovat „až do posledního Ukrajince" — rámuje konflikt jako
    válku ukrajinského režimu proti vlastním lidem, ne proti Rusku, financovanou západními platbami (bez
    nichž by se režim okamžitě zhroutil); pokud by Rusko dosáhlo Kyjeva a odstranilo Zelenského vedení,
    šlo by dle něj o „osvobození" Ukrajinců od jejich vlastní elity.'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-09-11-10
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Dvojí metr v dodávkách zbraní — Německo se stydí, ČR se chlubí (Vrabel, 8. 8. 2026)
  text: '**11. 9.** — Zůna nakonec v polovině září nepojede na bezpečnostní konferenci MSC v Číně (do
    Číny místo něj odjede jen pracovník ministerstva) — podle předsedy Sněmovny Tomia Okamury musí Zůna
    před pondělním jednáním koalice připravit podrobnější rozklad obranného rozpočtu. Vrabel to čte jako
    důkaz, že Zůna se řídí Okamurou, ne vlastním samostatným směrováním resortu obrany.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-11-11
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: EU schválila 6,1 mld. eur na munici a drony pro Ukrajinu — mechanismus zakázek „z ruky" bez
    výběrových řízení (Vrabel, 11. 9. 2026)
  text: 'Evropská komise schválila 6,1 mld. eur (~147 mld. Kč) na nákup protivzdušné a protiraketové obrany,
    munice a dronů pro Ukrajinu (mj. rakety PAC-3 pro systémy Patriot) — jde o další tranži z dříve schválené
    90mld. eurové půjčky, kterou Ukrajina začíná čerpat dřív, než se původně plánovalo. Vrabel varuje,
    že těchto 90 mld. na dva roky nebude stačit a Ukrajina bude potřebovat další peníze už po roce. Popisuje
    konkrétní korupční mechanismus: peníze z národních rozpočtů (rozpuštěné pro veřejnost v inflaci, aby
    si občané nevšimli přímé souvislosti) jdou do rozpočtu EU a odtud na Ukrajinu, kde se za ně nakupují
    záměrně předražené zbraně bez výběrových řízení („zakázky z ruky") — rozdíl mezi tržní a fakturovanou
    cenou pak putuje k zúčastněným politikům a zprostředkovatelům (jmenuje Okamurovo jednání s výrobci
    zbraní, Macinkovy obchodní cesty do USA). Dodává, že v Kanadě premiér Mark Carney nedávno slíbil Ukrajině
    dalších přes 300 mld. kanadských dolarů — celý Západ je dle něj v „době plundrování", kdy se země
    i občané zadlužují bez ohledu na důsledky.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-11-12
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Německo staví první trvalou zahraniční vojenskou základnu v historii Bundeswehru — 45. tanková
    brigáda v Litvě (Vrabel, 11. 9. 2026)
  text: Německo v Litvě přesouvá tanky pro 45. tankovou brigádu, která se má stát první trvale umístěnou
    bojovou jednotkou Bundeswehru v zahraničí v celé jeho historii — do roku 2027 má dosáhnout stavu cca
    4800 vojáků, umístěných jen několik set kilometrů od Petrohradu. Ministr obrany Boris Pistorius uvedl,
    že se přednostně hledají dobrovolníci, ale v některých případech může být nasazení nařízeno. Vrabel
    k tomu poznamenává, že se změnil jen název (Wehrmacht → Bundeswehr) a někdejší nacistické symboly
    (kříže u Luftwaffe), velitelská struktura i generálové zůstali stejní jen s postupnou obměnou — a
    hodnotí krok jako další stupeň eskalace bezpečnostní situace v Evropě.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-11-13
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Rutte v Berlíně vyhlašuje „obrannou průmyslovou revoluci" — Evropa jako výrobna zbraní (Vrabel,
    11. 9. 2026)
  text: Generální tajemník NATO Mark Rutte 10. 9. v Berlíně prohlásil, že spojenci výrazně zrychlují výrobu
    a inovaci v obranném průmyslu — miliardy dolarů směřují do rozšiřování výrobních kapacit, modernizace
    továren a otevírání nových výrobních linek, což Rutte nazval „obrannou průmyslovou revolucí". Vrabel
    to čte jako potvrzení své dlouhodobé teze, že se Evropa z „výrobny aut, kvalitního oblečení, kosmetiky
    a služeb" proměnila na výrobnu zbraní — a ironicky poznamenává, že zkratka NATO čtená obráceně dává
    „OTAN" (anglický/francouzský název), což mu při zmínce o „obranné" alianci připadá „přesně po satanisticku"
    (převrácení významu slov). Připomíná blízký vztah Andreje Babiše s Ruttem z dob, kdy byli oba premiéři.
  podtema: EU jako vojenská struktura
