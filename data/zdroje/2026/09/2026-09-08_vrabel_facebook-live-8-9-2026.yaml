  nadpis: „Izraelský Pearl Harbor" — Netanjahu byl varován před útokem Hamasu (Vrabel, 8. 9. 2026)
  text: |-
    Podle deníku Haaretz varoval prezident Spojených arabských emirátů izraelského premiéra Benjamina Netanjahua zhruba deset dní před útokem Hamasu 7. října 2023. Vrabel to čte jako potvrzení dlouhodobě kolující teorie o „izraelském Pearl Harboru": Izrael je podle jeho vlastní zkušenosti (cestoval zemí autem) jedno z nejstřeženějších míst na světě (ozbrojenec v každém autobuse a vlaku, checkpointy všude), takže je nepravděpodobné, že by Hamas dokázal provést takový útok bez povšimnutí a že izraelská reakce trvala 45 minut — pokud byl Netanjahu předem varován, otevírá to otázku, proč nezasáhl. Spojuje to se svou opakovanou tezí o vlivu chasidských/„chazarských" židovských sítí a organizace Chabad Lubavič na americkou (a přeneseně izraelskou) politiku — s odkazem na blízký vztah Jareda Kushnera k Netanjahuovi a na financování politických kampaní (Donalda Trumpa) těmito kruhy.

    ⚡ **Poznámka:** Tvrzení o předchozím varování je citováno z jednoho zdroje (deník Haaretz), ne ověřeno nezávisle; interpretace jako „Pearl Harbor" i propojení s tezí o vlivu Chabad Lubavič jsou Vrabelovy vlastní spekulace.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-08-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Evropský prokurátor zahájil trestní řízení kvůli dotacím Agrofertu (Vrabel, 14. 7. 2026)
  text: '**8. 9.** — Evropská komise dospěla k formálnímu závěru, že premiér Babiš je v potenciálním střetu
    zájmu — Svěřenecký fond RSVP Trust, do kterého vložil akcie Agrofertu, situaci dle komise dostatečně
    neřeší, a komise proto potvrdila pozastavení proplácení části dotací Agrofertu. Babiš na to reagoval
    slovy, že „ani kdyby se zastřelil", komise by nebyla spokojená, a tvrdí, že Agrofert nevlastní a nemá
    z něj žádný prospěch. Vrabel jeho obhajobu rozporuje přesně touto logikou: prospěch z jeho rozhodnutí
    (ovlivňujících zemědělské dotace) mají jeho děti jako budoucí dědicové fondu — a podle konceptu „osoby
    blízké" tak střet zájmu trvá, i když Babiš sám formálně firmu nevlastní.'
  podtema: Agrofert a dotace EU
- id: vrabel-2026-09-08-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Smrt Radko Mladiće — revizionistický výklad Srebrenice, Joe Biden jako strůjce bosenské války
    (Vrabel, 27. 8. 2026)
  text: '**8. 9.** — Vrabel referuje, že Bosna a Hercegovina v reakci na účast srbských ministrů na pohřbu
    Mladiće (podle agentur se ho zúčastnilo přes 200 000 lidí) omezuje vztahy se Srbskem — stahuje část
    personálu velvyslanectví v Bělehradě, zastavuje bilaterální jednání, odstupuje od několika mezinárodních
    dohod a nepřipojí se k memorandu o dobrém sousedství zemí západního Balkánu. Vrabel to čte jako důkaz,
    že Mladić „spojil Srby" (cituje projev jeho syna na pohřbu) navzdory dlouhotrvajícím protisrbským
    demonstracím, které už podruhé přimějí prezidenta Vučiće vyhlásit předčasné volby. Podává rozšířený
    historický výklad: Republika srbská (část Bosny a Hercegoviny, vytvořená mezinárodním společenstvím)
    je podle něj pod „nadvládou" muslimské Bosny řízené zahraničním vysokým představitelem (dřív Christian
    Schmidt, dosazený s podporou Angely Merkelové); tvrdí, že bosňáci jsou etničtí Srbové islamizovaní
    za 500 let osmanské vlády, na rozdíl od Srbů, kteří se islamizaci ubránili. K samotné Srebrenici opakuje
    svou revizionistickou tezi (Mladić evakuoval civilisty před bojem, žádný rozkaz k masakru nebyl prokázán)
    a připouští, že někteří vojáci mohli spáchat válečné zločiny popravou zajatých bojovníků — ale odmítá
    srovnání s vyvražďováním žen a dětí, kterého se dle něj dopouštěli mudžahedíni.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-08-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: '**8. 9.** — Vrabel spojuje pokračující sérii dronových incidentů (varování v Rumunsku a Moldavsku
    kvůli dronu identifikovanému jako ruský Shahed, který vstoupil do moldavského vzdušného prostoru z
    Ukrajiny) s varováním bývalého britského poslance Andrewa Bridgena (dříve konzervativní politik, vedl
    kampaň za brexit, znám kritikou covidových vakcín po projevu v britském parlamentu o nadúmrtnosti).
    Bridgen na síti X zveřejnil, že ho zdroje z tajných služeb varovaly před chystanou operací pod falešnou
    vlajkou, kterou má britská vláda provést s cílem zvrátit veřejné mínění (dosud nepříznivé válce s
    Ruskem) — s očekávanými dětskými obětmi. Vrabel to prezentuje jako neověřenou, ale závažnou zprávu
    od důvěryhodného zdroje a naznačuje, že podobné dronové incidenty v Evropě (Halle/Lipsko, Rumunsko/Moldavsko)
    do takového scénáře zapadají.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-08-05
