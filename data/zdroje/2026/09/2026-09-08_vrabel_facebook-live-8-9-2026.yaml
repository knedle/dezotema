  nadpis: Maďarsko vyhostilo 10 ruských diplomatů — Petr Magyar jako „maďarský Rajchl" (Vrabel, 8. 9.
    2026)
  text: Maďarsko podle ministryně zahraničí Anity Orbánové vyhostí deset ruských diplomatů, sedm z nich
    obviněných z napojení na ruské tajné služby, ostatní jsou prověřováni — Rusko v reakci hrozí „velmi
    tvrdou" odvetou (Sergej Lavrov), kterou Vrabel odhaduje jako možné omezení dodávek ropy či plynu.
    Označuje to za zásadní obrat v tradičně velmi dobrých vztazích Maďarska s Ruskou federací (za Viktora
    Orbána i dříve) a viní z toho nového premiéra Petra Magyara, kterého nazývá „maďarským Rajchlem" —
    člověkem, který si dřív budoval image vlastence organizujícího demonstrace, ale po zvolení jasně zaujal
    proevropský a protiruský postoj. Kritizuje rozpor mezi Magyarovým ujišťováním, že diplomacie „na základě
    vzájemného respektu" bude pokračovat, a jeho reálným krokem, který takový respekt popírá.
  podtema: Zahraniční aktéři a precedenty
