- id: vrabel-2026-09-06-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**6. 9. (rozhovor s Hrdličkou a advokátem Bubeníčkem)** — Vrabel do nedělního vysílání pozval
    přímo Tomáše Hrdličku a advokáta Petra Bubeníčka k právnímu rozboru. Hrdlička popisuje průběh zadržení:
    nosí trvale svatojiřskou stuhu (na památku osvobození) a asi před rokem si přidal i odznáček „Z";
    po demonstraci ho nejprve krátce legitimovali a pustili dál, na konci akce ho ale jiný policista (major
    Koláš) odvedl na stanici Bartolomějská, kde byl vyslýchán zhruba tři hodiny. Advokát Bubeníček (dotázán,
    aby zhodnotil právní stránku věci) potvrzuje, že samotné písmeno „Z" ani svatojiřská stuha nejsou
    samy o sobě nelegální, ale orgány činné v trestním řízení je od nejvyššího státního zastupitelství
    (stanovisko z počátku invaze 2022) posuzují v kontextu — kombinace stuhy a písmene na demonstraci
    už bývá vykládána jako „vyloučení náhody" a nesoucí „jasné sdělení" podpory ruské agresi. Zdůrazňuje,
    že u § 405 (a § 365) trestního zákoníku je nutné prokázat úmyslné zavinění a konkrétní pohnutku —
    důkazní břemeno leží na státu, pouhá fotografie symbolu nestačí — ale přiznává, že nedokáže predikovat
    výsledek soudu („dopadne to tak, jak se soud vyspí"), a označuje současnou právní nejistotu za problém,
    protože ústava předpokládá, že občan má vždy vědět, co je a není zákonem zakázáno. Vrabel v reakci
    navrhuje reciproční přístup — podávat trestní oznámení i na symboly spojované s ukrajinským nacionalismem
    (vlajka Pravého sektoru, hesla „Sláva Ukrajině") stejnou logikou — a zmiňuje konkrétní podněty: výrok
    německého novináře/Zelenského na tiskové konferenci v Bělehradě (dotaz, co dalšího lze udělat, aby
    bylo možné „zabíjet víc Rusů", opravený na „ruských vojáků") a dřívější Zemanův výrok, že Rusové mají
    „agresi v genech".'
  osoby:
  - osoba: tomas-hrdlicka
    vztah: pozitivni
    kontext: Host vysílání — vlastní vylíčení zadržení a výslechu na Bartolomějské za odznak „Z"
  - osoba: petr-bubenicek
    vztah: pozitivni
    kontext: Host vysílání, advokát — poskytl právní rozbor kauzy „Z", potvrdil právní nejistotu a kritizoval
      justiční praxi
  podtema: Trestání politického projevu
- id: vrabel-2026-09-06-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: ČR jako „totalita na cestě" — teorie mass formation aplikovaná na Rusko jako společného nepřítele
    (Vrabel, 6. 9. 2026)
  text: 'Vrabel rozlišuje tři systémy vlády: ideál („lidé si vládnou sami"), tyranii (jeden nebo několik
    lidí vládne ostatním násilím) a totalitu — systém, kde je jeden názor prosazovaný velkou skupinou
    lidí a každý jiný je potlačován, aniž by šlo o klasickou diktaturu. Aplikuje na to znovu teorii „mass
    formation" Matthiase Desmeta (viz [Mass Formation — základ covidové poddajnosti](/temata/covid-vakciny/2026.md#rajchl-2026-05-03-01)):
    čtyři podmínky (izolace, ztráta smyslu, volně plovoucí úzkost, volně plovoucí frustrace) byly podle
    něj po roce 2022 znovu naplněny se stejným mechanismem jako v nacistickém Německu (tam „vinen" byli
    „židovští kapitalisté") — dnešním pojmenovaným nepřítelem je Rusko. Tvrdí, že za frustraci společnosti
    ve skutečnosti nemůže Rusko, ale to, že „jsme se nechali okrást globalistickým západem" a naši politici
    rozprodávají zemi zahraničním strukturám. Argumentuje, že tento proces byl v ČR spuštěn prohlášením
    vrchního státního zástupce Igora Stříže na začátku roku 2022, že podpora Ruska může vést až ke třem
    rokům vězení — což označuje za varovný signál rozporu s právním řádem, protože podpora kterékoli strany
    cizího konfliktu nemá být trestná, pokud tato strana nevede válku proti ČR. Českou republiku (a celý
    Západ) považuje za „totalitu na cestě", ne za plnou totalitu — tou by se stala až v okamžiku, kdy
    by začala vraždit vlastní obyvatelstvo, což na rozdíl od ČR podle něj již dnes dělá Ukrajina (potlačení
    opozice, zákaz ruského jazyka, násilné odvody civilistů, mizející statisíce vojáků).'
  podtema: Demokracie a politický systém
- id: vrabel-2026-09-06-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: '**6. 9.** — Vrabel referuje o vyjádření ministra zahraničí Ruska Sergeje Lavrova, že incident
    v Lipsku a výhrůžky vůči Německu představují „skutečný začátek" reálné války — srovnává ho s operacemi
    „pod falešnou vlajkou" na počátku druhé světové války. Vrabel k tomu dodává rekapitulaci právě probíhajících
    jednání: Witkoff a Kushner strávili tři hodiny jednáním v Moskvě, poté odjeli přes Polsko vlakem do
    Kyjeva za Zelenským, který odmítl jakékoli územní ústupky s tím, že o území lze jednat jen na úrovni
    prezidentů (Putin–Zelenskyj). Trvá na své dřívější 65% predikci neúspěchu jednání a opakuje argument,
    že mírová jednání byla stejným způsobem sabotována už v dubnu 2022 (Boris Johnson v Kyjevě). Cituje
    i amerického viceprezidenta J. D. Vance, který (na rozdíl od Lavrova) navrhuje jednoduše zastavit
    boje na současné frontové linii — s tímto řešením Vrabel výjimečně souhlasí. Lavrov podmiňuje ruský
    souhlas zajištěním plných práv ruskojazyčného obyvatelstva na Ukrajině (přirovnání k hypotetickému
    zákazu arabštiny v Izraeli).'
  osoby:
  - osoba: sergej-lavrov
    vztah: neutralni
    kontext: 'Citován: incident v Lipsku označil za „skutečný začátek" reálné války, podmínil mír plnými
      právy ruskojazyčného obyvatelstva Ukrajiny'
  podtema: Zahraniční aktéři a precedenty
