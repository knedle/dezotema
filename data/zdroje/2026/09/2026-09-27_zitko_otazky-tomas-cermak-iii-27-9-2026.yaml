      text: '1. 10. se Zítko k predikci nevrátil; 2. 10. ji přerámoval na „Rudý říjen" („nikdy jsme úplně
        nevěděli přesně, jaký rok to bude… všechno běží tak, jak má") a zároveň prohlásil, že věštění
        „není jeho obor" — [ČsTV2 — Zpravodajství týdne (2. 10. 2026)](_zdroje.md#československo-tv2--zpravodajství-týdne-2-10-2026).
        18. 10. pak Zítko prohlásil „Red October je tady“: komunikace může být v rámci „největší operace
        v dějinách lidstva“ vypnuta, lidé mají mít připravené jídlo a vodu a „nenechat se zblbnout, i
        kdyby vám vysílali cokoliv“, protože „vítězství je naše“ — [ČsTV2 — „Policejní a agentská provokace“:
        zvažuje konec (18. 10. 2026)](_zdroje.md#československo-tv2--provokace-zvažuje-konec-18-10-2026)'
