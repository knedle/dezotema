  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**27. 9.** — Zítko výslovně odmítá, že by kdy řekl „klon" — to slovo podle něj používají „fízlové",
    aby ho zesměšnili; on mluví o „dvojníkovi", protože „namaskovat a připravit dvojníka není tak finančně
    náročné jako klona". Klade sérii „legitimních otázek" (proč muž nepoznal jeho ani matku, proč média
    ohlásila termín den předem, proč rodina odešla jiným směrem, proč otčím zveřejnil tři roky starou
    fotku, proč Čermáka nikdo neviděl na pivu v Holíšově) a je „čím dál víc přesvědčený", že Čermák byl
    „nahražen figurantem" — „jiným člověkem bez duše"; tvrzení, že propuštěný telefonoval, podle něj pocházejí
    jen od falešných profilů, což má podvod „usvědčovat". Tušl se podle něj od Čermáka „nehezky distancoval"
    — buď „sežral" hru na falešného Tomáše, nebo je to součást jeho dohody s policií. K prezidentské kampani
    uvádí, že se vybralo půl milionu, z čehož 300 tisíc stála ochranka, „aby mě nezabili". Slibuje bojovat
    za „očištění jména" originálního Čermáka.'
  citace:
  - text: Buďto jste na straně fízlů, hejtrů a agentů, a nebo jste na straně pravdy.
