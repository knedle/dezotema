  nadpis: Vučić oznamuje rezignaci na konci září (Vrabel, 13. 9. 2026)
  text: Vrabel referuje zprávu, že srbský prezident Aleksandar Vučić oznámil, že na svou funkci rezignuje
    na přelomu 25.–26. září. Bez vlastního rozsáhlejšího hodnocení jen poznamenává, že jde o výsledek
    dlouhodobých protivládních protestů v Srbsku.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-13-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Zelenskyj varuje před nebezpečím ruského vzdušného prostoru — Putin: „státní terorismus" (Vrabel,
    13. 9. 2026)'
  text: Volodymyr Zelenskyj varoval, že ruský vzdušný prostor je nebezpečný pro civilní letadla — Vladimir
    Putin na to reagoval obviněním Ukrajiny ze „státního terorismu". Vrabel k tomu bez rozsáhlejšího komentáře
    jen zaznamenává výměnu jako další příklad vzájemných obvinění v probíhajících mírových jednáních.
  podtema: Zahraniční aktéři a precedenty
