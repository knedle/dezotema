- id: vrabel-2026-09-13-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**13. 9.** — Vrabel se k případu Hrdličky vrací s rozšířeným právním argumentem: trvá na tom,
    že kolektivní vina je nepřípustná — nošení odznaku „Z" bez konkrétního doprovodného skutku (výzva
    k násilí, schvalování konkrétního zločinu) nelze trestat, jde jen o vyjádření politického názoru.
    Jako analogii uvádí, že příslušníci Bundeswehru dodnes nosí insignie navazující na Wehrmacht, aniž
    by tím nesli trestní odpovědnost za zločiny nacistického Německa — pouhá symbolická kontinuita tedy
    sama o sobě zavinění nezakládá. Případ zůstává u státního zástupce.'
  podtema: Trestání politického projevu
- id: vrabel-2026-09-13-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Drobná pozorování: Mengele žil ve Švýcarsku, hrníčky s Hitlerem v Praze (Vrabel, 13. 9. 2026)'
  text: |-
    Vrabel zmiňuje dvě krátká, nerozvedená pozorování jako doklad neúplné/selektivní denacifikace a bagatelizace nacistické minulosti: podle „včerejší" zprávy měl nacistický lékař Josef Mengele žít po válce ve Švýcarsku; v Praze se navíc běžně prodávají hrníčky s portrétem Adolfa Hitlera jako suvenýr pro turisty.

    ⚡ **Poznámka:** Ani jedno tvrzení Vrabel dále nerozvádí ani nedokládá zdrojem.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-09-13-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Sdílený klip z rozhovoru o životopisu 1987 — výzva přestat volit „novodobé komunisty" (Šejna,
    23. 8. 2026)
  text: '**13. 9. (Vrabel)** — Vrabel referuje zprávu ČT24, že Petr Pavel formálně převzal zastupování
    zahraniční politiky ČR od Andreje Babiše na summitu NATO v Tiraně (Albánie) — na základě dohody s
    Petrem Macinkou a Babišem. Bez vlastního hodnocení jde jen o zaznamenání posunu v dřívějším dlouhém
    sporu o to, kdo má ČR na summitech NATO reprezentovat (viz výše).'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
