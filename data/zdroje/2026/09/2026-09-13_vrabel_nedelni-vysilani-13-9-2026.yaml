- id: vrabel-2026-09-13-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Obrácená teze „genocidy" na Ukrajině — odhad 2 mil. mrtvých, Zelenskyj jako americký velkostatkář
    (Vrabel, 13. 9. 2026)
  text: |-
    Vrabel obrací obvyklé užití slova „genocida" (které dle něj Západ směřuje vůči Rusku) a tvrdí, že skutečnou genocidou je to, co se děje ukrajinskému národu z rozhodnutí vlastního i západního vedení. Cituje odhad neziskové organizace, která pomocí satelitních snímků a umělé inteligence počítala nové hroby a dospěla k číslu 2,05–2,4 milionu mrtvých nebo nezvěstných ukrajinských vojáků — číslo, které opírá i o uniklé/hacknuté interní tabulky ukrajinského ministerstva obrany. Dále tvrdí, že se v souvislosti s konfliktem legalizoval obchod s orgány v hodnotě 7 miliard dolarů na daních. K osobnímu obohacení Volodymyra Zelenského uvádí, že je podle všeho 9. největším vlastníkem zemědělské půdy v USA a držitelem podílu v britské bance v hodnotě 1,5 miliardy liber. Doplňuje tvrzení, že Ukrajina v rámci náhrady za padlé vojáky dovezla už 500 000 uprchlíků z Indie, Pákistánu a Bangladéše s plánem dovézt jich celkem až 9 milionů.

    ⚡ **Poznámka:** Čísla o obětech, obchodu s orgány i Zelenského majetku nelze nezávisle ověřit z veřejně dostupných zdrojů.
  podtema: Vyjednávání a mír
- id: vrabel-2026-09-13-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Ztrojnásobení Frontexu (300 mil. EUR, 3× personál) jako příprava na válku, ne na migraci (Vrabel,
    13. 9. 2026)
  text: Vrabel referuje o rozhodnutí EU ztrojnásobit rozpočet i personál agentury Frontex (navýšení o
    300 milionů eur, trojnásobný počet zaměstnanců). Odmítá to číst jako reakci na migrační krizi — počty
    žadatelů o azyl podle něj naopak klesají — a interpretuje krok jako přípravu na uzavření vnějších
    hranic EU v okamžiku vypuknutí konfliktu s Ruskem, obdobně jako se hranice uzavřely na Ukrajině 24.
    2. 2022. Zmiňuje také, že Polsko se předběžně zavázalo k uplatnění čl. 5 Severoatlantické smlouvy
    (kolektivní obrana) automatičtěji než dosud. Divákům radí připravit si únikovou cestu z EU do vojensky
    neutrální oblasti (dává přednost Rumunsku/Srbsku před Maďarskem) předtím, než k uzavření hranic dojde.
  podtema: EU jako vojenská struktura
