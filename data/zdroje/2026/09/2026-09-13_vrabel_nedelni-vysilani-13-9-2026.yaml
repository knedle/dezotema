  nadpis: 'Tři fáze konfliktu Západ–Rusko: od Majdanu k terorismu na ruském území (Vrabel, 31. 5. 2026)'
  text: '**13. 9.** — Vrabel opakuje tutéž třífázovou tezi (Majdan 2013 jako přípravná fáze) beze změny.'
