  nadpis: Nejvyšší státní zástupkyně Lenka Bradáčová podezřelá z propojení na bitcoinovou kauzu (Zítko,
    14. 9. 2026)
  text: |-
    Zítko tvrdí, že Lenka Bradáčová bude muset vysvětlovat, co všechno o bitcoinové kauze věděla, a zpochybňuje dosavadní roční nečinnost nejvyššího státního zastupitelství — odkazuje na vlastní trestní oznámení a zveřejněné důkazy, které označuje za „naprosto transparentní a jednoduše dohledatelné". Připomíná, že Bradáčovou do funkce nominoval ministr spravedlnosti Pavel Blažek, a spekuluje, že nástupem Babišovy vlády a jejích jmenovaných funkcionářů (ministr Jeroným Tejc, náměstek Zdeněk Koudelka, bývalá nejvyšší státní zástupkyně Renata Vesecká jako Bradáčové „dlouholetá rivalka") vzniká politický tlak k jejímu prošetření — včetně nečinnosti policejních složek NCOZ a NCTEC.

    ⚡ **Poznámka:** Jde o Zítkovu spekulaci o motivaci a propojení, ne o doložené obvinění; žádné trestní stíhání Bradáčové v souvislosti s bitcoinovou kauzou nebylo v přepisu doloženo.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-09-14-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: |-
    **14. 9.** — Zítko opakuje tutéž tezi (29 bilionů Kč / 9,5 tis. tun měnového zlata) a doplňuje nový motiv, proč Německo reparace neplatí: spekuluje, že Německo mělo prsty v tlaku na „pachatele vlastizrady" Klause, Mečiara a Havla při rozdělení Československa (výhrůžka rozpadem podle jugoslávského scénáře) a že sudetoněmecký Landsmannschaft si tím „přihříval vlastní polívčičku" směrem k obnovení nároků na sudetský majetek. Rozšiřuje také o tvrzení, že guvernéři ČNB Josef Tošovský a Miroslav Singer/Oldřich Dědek — v přepisu jmenován „Niedermayer" — v 90. letech rozprodali zlatý poklad Československa „ve výprodeji".

    ⚡ **Poznámka:** Jméno „Niedermayer" v souvislosti s rozprodejem zlatých rezerv ČNB v 90. letech nelze ověřit — Zdeněk Tůma a Josef Tošovský byli tehdejšími guvernéry; Oldřich Niedermayer se v této funkci nedohledá.
- id: zitko-2026-09-14-04
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: 25. výročí 11. září — rozšířená verze "inside job" a QAnon justice (Zítko, 12. 9. 2026)
  text: '**14. 9.** — V delší, plnější verzi téhož vysílání Zítko doplňuje řadu nových detailů. Cituje
    komentář „Jardy Štefce": budova WTC7 (zřícená za 6,5 sekundy bez zásahu letadla) obsahovala utajované
    archivy CIA, FBI, U.S. Secret Service a SEC (Komise pro cenné papíry a burzy) s vyšetřovacími spisy
    k velkým finančním podvodům na Wall Street — jejich zničení mělo ušetřit tehdejšímu vedení USA „velké
    bolení hlavy". Nájemce Larry Silverstein si komplex pronajal jen dva měsíce před útokem (červenec
    2001) a od pojišťoven obdržel dvojí plnění (celkem 4,6 mld. USD) na základě výkladu, že šlo o dvě
    nezávislé události — sám se prý toho dne vyhnul své obvyklé snídani na střeše kvůli návštěvě dermatologa.
    Zítko propojuje událost s potopením Titanicu (bankéři odpůrci soukromého Fedu, mj. John Jacob Astor,
    zahynuli poté, co J. P. Morgan svou účast na poslední chvíli zrušil) jako analogický „pojišťovací
    podvod". Ironicky poznamenává, že Usáma bin Ládin byl po deseti letech intenzivního satelitního pátrání
    v afghánských horách nakonec nalezen „doma" — skutečným cílem invaze do Afghánistánu byla dle Zítka
    a Štefce snaha oslabit Rusko a Čínu, ne dopadení bin Ládina. Doplňuje také starší tezi o dětech-sirotcích
    z válečných konfliktů (Afghánistán, Irák) jako zdroji pro mučení a výrobu adrenochromu.'
