  nadpis: Vzdání se práva veta jako velezrada — výzva Babišovi k ústavní žalobě; plat a Formule 1 (Černohorský,
    22. 9. 2026)
  text: Černohorský označuje Pavlovo „odevzdání práva veta v některých zahraničních otázkách" za velezradu
    a vyzývá Andreje Babiše, aby našel pět senátorů, kteří by proti prezidentovi podali ústavní žalobu.
    Kritizuje zvýšení prezidentského platu, z něhož si Pavel podle něj „jezdí na Formuli 1", zatímco lidé
    „chcípají hladem" a vybírají mezi léky a jídlem. Pavel si podle něj přeje válku a „jaderný holokaust",
    protože si myslí, že bude sám ochráněn, a těší se na mobilizaci — Černohorský prohlašuje, že by bojovat
    nešel („tahle země už mně nepatří"). Navazuje na [Pavel podporuje euro a chce se vzdát práva veta](suverenita-eu.md#pavel-podporuje-euro-a-chce-se-vzdát-práva-veta-v-zahraniční-politice--černohorský-3-7-2026).
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Vzdání se veta = velezrada, přeje si „jaderný holokaust" a mobilizaci
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-09-22-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Podrobný rozbor poslaneckých platů a náhrad — „ať začnou šetřit u sebe" (Černohorský, 28. 8.
    2026)
  text: '**22. 9.** — Černohorský se k tématu vrací ironickým úvodem („rok po volbách, všechno se nám
    napravuje"): nejnižší starobní důchod podle nové valorizace nesmí klesnout pod 10 325,70 Kč, nejnižší
    invalidní důchod 1. stupně je kolem 6 370 Kč a valorizace důchodců činí zhruba 320 Kč — zatímco poslancům
    a ústavním činitelům podle zákona 236/1995 vzroste plat o 5,7 % (plus další koeficienty) na zhruba
    120 tisíc hrubého, s nezdaněnými náhradami na 160–170 tisíc a s funkcemi ve výborech na 200–220 tisíc.
    Zmiňuje přeplatky za elektřinu, které si měl nechávat vracet Zdeněk Hřib (40 tisíc měsíčně), a poslance
    „vlastence" s „27 funkcemi" (jmenuje Martina Haška z PRO), jejichž jména prý zveřejní až po volbách.
    Zvýšení platů za Babišovy vlády v době, kdy „lidi padají na rypáky", označuje za „nehoráznou aroganci"
    — „tímhle, pane Andreji Babiši, říkáte těm lidem: my na vás serem". Kdo by si podle něj zasloužil
    přidat, jsou hasiči (80–100 tisíc, „víc než jakýkoliv poslanec"), dobří učitelé (ne ti, kteří „tleskají
    LGBT") a zdravotníci, kteří se za covidu „nezaprodali" — ne policisté, kteří podle něj „slouží hajzlům
    nahoře" a kryjí „Oganesjanův gang".'
  osoby:
  - osoba: zdenek-hrib
    vztah: negativni
    kontext: Přeplatky za elektřinu 40 tis./měs.; „arogantní hajzl", ale už není u moci
  podtema: USA — volební systém
- id: cernohorsky-2026-09-22-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Babišova vláda jako „menší zlo", ale servilní k Ukrajině; za chování politiků mohou „ovcoidní"
    voliči (Černohorský, 22. 9. 2026)
  text: 'Černohorský hodnotí rok Babišovy vlády: výměna vlády měla „do určité míry smysl", protože kdyby
    zůstali Fiala a Rakušan, on sám by podle něj už „dávno nemluvil a byl v kriminále" a totéž by potkalo
    aktéry kauzy kolem Ivana Přemysla Hadravy a Ivana Kratochvíla. Kritiku Fialy, Hřiba a Pirátů už považuje
    za zbytečnou — „nejsou u moci" — a kritizovat je třeba ty, kdo vládnou: Babiše uznává „v určitém směru",
    ale vyčítá mu (a Motoristům i SPD) nesplněné sliby a „servilitu", s níž vláda „leze Ukrajině a Zelenskýmu
    do prdele" (Macinka je podle něj „bourák", ale v otázce Ruska a Ukrajiny se chová „jako kunda"). Nechápe
    voliče jakékoli strany, kteří jen tleskají a přehlížejí nesplněné sliby. Babiše zároveň hájí v otázce
    dluhu: v letech 2018–2021 prý dluh mírně snížil a většina schodku šla na covid, za nějž vládu viní
    z podvodů (roušky z Číny). Politici se podle něj chovají tak, jak se chovají, protože je lidé nenutí
    jinak — „to, jak se chovají politici, je naše vina" — a stát neživí politici, ale občané, jejichž
    peníze nemají jít na Ukrajinu a dotace miliardářům. Přeje si zažít den, kdy se „Češi, Moravané a Slezané
    vzbouří", ale polovinu národa považuje za „vylágrované dementy", kterým nevadí bitcoinová kauza ani
    Dozimetr.'
  citace:
  - text: Protože my jsme takový ovcoidní kundy, že jim pořád budeme tleskat.
  osoby:
