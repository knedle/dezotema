  nadpis: Válka skončí jen ruskými podmínkami, nebo „orešníkem vedle orešníku"; porážka Ruska = konec
    světa; elity v bunkrech (Černohorský, 22. 9. 2026)
  text: 'Černohorský tvrdí, že válka může skončit jen dvěma způsoby: buď EU „odstraní všechny eurohujerské
    děvky", přistoupí na ruské podmínky a uzavře příměří (čímž se „ještě část Ukrajiny zachrání"), nebo
    přijde „orešník vedle orešníku", vybombardovaná Ukrajina a další desítky tisíc mrtvých. Rusko podle
    něj jednoznačně vítězí, byť za vysokých ztrát (Ukrajina podle něj ztrácí 30 tisíc vojáků měsíčně),
    a jadernou velmoc, za níž stojí Čína, Indie, Saúdská Arábie, KLDR, Pákistán a BRICS, porazit nelze
    — kdyby Rusko „padlo na kolena", „končí svět"; odkazuje na expertní popis rakety Sarmat (15 hlavic,
    50 klamných cílů). Politiky, kteří věří v porážku Ruska (Pavel, Kolář, Foltýn, Kupka, Fiala, Rakušan,
    Richterová, Hřib aj.), označuje za „tupé dementy" a „loutky" — „globální zmrdi, kteří ovládají svět",
    mají podle něj připravené podzemní bunkry se zásobami na sto let a klidně obětují ostatní v „jaderném
    holokaustu". Vyzývá Babiše, aby opustil „proukrajinskou rétoriku", skončil se zbrojením a přidal se
    k Ficovi v jednání s Putinem. Lidem, kteří tvrdí, že Rusko nemá rakety, podle něj chybí „důkaz" v
    podobě „vybombardovaného Kyjeva a Lvova, hnízda nacistických zmrdů". Tvrdí také, že kdyby vláda vyhlásila
    mobilizaci, spousta Čechů odejde do Ruska, vstoupí do ruské armády a politiky, kteří ničí ČR, „popraví"
    — viz [Stochastický teror](stochasticky-teror.md) a [predikce](predikce.md).'
  citace:
  - text: Evropa tleská sobě sama zničení. Evropa tleská válce.
  osoby:
  - osoba: robert-fico
    vztah: pozitivni
    kontext: Vzor — Babiš se má přidat k jeho jednání s Putinem
  podtema: Zahraniční aktéři a precedenty
