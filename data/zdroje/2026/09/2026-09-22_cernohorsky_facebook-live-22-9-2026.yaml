- id: cernohorsky-2026-09-22-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Moc elit je v médiích — návrh vlastenecké televize financované 30 tisíci členy po 100 Kč (Černohorský,
    22. 9. 2026)
  text: 'Černohorský tvrdí, že elity mají moc, protože mají „naše peníze" a jimi ovládají média, kterým
    „druhá polovina magorů" věří. Navrhuje vlastní vlasteneckou televizi: tým 5–6 lidí s využitím AI,
    dvě studia v domech vlastenců, nejprve regionální a pak celostátní licence; financovat by ji mělo
    30 tisíc členů jeho platformy (Společenství Čest Svoboda Respekt) po 100 Kč měsíčně, tj. 3 miliony
    Kč. Stěžuje si, že lidé místo toho „tleskají vůdcům" s vlastními transparentními účty. Zároveň popisuje,
    že mu Facebook „všechno omezuje" — příspěvky schovává do rámečků a sleduje ho „i v 11 večer".'
  citace:
  - text: Oni mají moc. Proč mají tu moc? Protože mají naše prachy. Mají naše prachy a těma našema penězma
      ovládají média.
  podtema: Nová alternativní média
- id: cernohorsky-2026-09-22-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: „Nemalá část" Ukrajinců v ČR vraždí, znásilňuje a nevděčně protestuje; ČR platí 600 milionů
    měsíčně (Černohorský, 22. 9. 2026)
  text: Černohorský tvrdí, že „nemalá část" Ukrajinců v ČR „dělá bordel, vraždí, znásilňuje, chlastá"
    a natáčí videa o tom, jací jsou Češi „čuráci", že je živí zadarmo; vadí mu i jejich demonstrace s
    vlajkami (Karlův most). On sám by na jejich místě podle svých slov bojoval, nenechal doma matku s
    dětmi a v cizí zemi by byl vděčný a učil se jazyk — „to jsme my, Češi, Moravané, Slezané [...] Ukrajinci
    tohle nebudou", protože „nátura národa se nemění". Zároveň výslovně říká, že netvrdí, že jsou všichni
    Ukrajinci „hajzlové nacističtí", a zmiňuje své ukrajinské kamarádky. Uvádí, že ČR živí 700 tisíc Ukrajinců
    a platí na jejich podporu 600 milionů Kč měsíčně.
  citace:
  - text: Já neříkám, že jsou všichni Ukrajinci totální zmrdi a že jsou to hajzlové nacističtí. Ne. Ale
      nemalá část ano.
- id: cernohorsky-2026-09-22-05
  typ: tvrzeni
  temata:
