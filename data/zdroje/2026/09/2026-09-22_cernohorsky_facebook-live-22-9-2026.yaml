  nadpis: Volyňský masakr jako obraz „ukrajinského národa" — výzva ke sdílení (Černohorský, 21. 9. 2026)
  text: '**22. 9.** — Černohorský popisuje, že Facebook jeho příspěvek o Volyni omezil, a tak jej sestříhal
    na TikTok (6 tisíc zhlédnutí za 12 hodin) a poslal i poslancům. Odmítá srovnání, které mu tam napsal
    jeden z diváků, že podobná zvěrstva dnes páchá „Putler" na Ukrajině: zločiny podle něj páchají „ukronacisti"
    z Azova uctívající Banderu a Šuchevyče, kteří mají zaživa zasypávat dezertéry a zraněné a mučit zajaté
    Rusy; připouští, že i Rusové páchají zrůdnosti a „mstí se", ale kdyby šlo o srovnatelné zločiny, internet
    by jich byl plný. Zelenskyj podle něj 26. 5. 2026 udělil jednotce čestný titul „UPA" právě v den výročí
    volyňského pogromu z roku 1943. Zdůrazňuje, že „nenávidí" ne všechny Ukrajince (má ukrajinské přítelkyně),
    ale Zelenského, jeho okolí a náboráře TCK, kteří unášejí muže z ulic — „ať pochcípaj" (viz [Stochastický
    teror](stochasticky-teror.md)).'
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: Titul „UPA" pro jednotku; „ať pochcípaj"
  podtema: Stav Ukrajiny a mobilizace
