  podtema: USA — volební systém
- id: cernohorsky-2026-09-22-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Jurečka „na elektrické křeslo" za invalidní důchodce; výtky Havlíčkovi (Černohorský, 22. 9.
    2026)
  text: Černohorský viní bývalého ministra práce Mariana Jurečku, že „zahájil okrádání invalidních důchodců"
    (navazuje na svou kritiku posudkových lékařů), a obviňuje ho, že dohodil bratrovi zakázky za 280–300
    milionů. Prohlašuje, že kdyby to šlo, posadil by ho na elektrické křeslo a předtím zabavil majetek
    celé jeho rodině. Kritizuje i Karla Havlíčka (ANO), kterého jinak považuje za velmi inteligentního
    a schopného ministra, že se v debatě na Primě „kroutil jak bajadéra" a Jurečkovu otázku „kdo to zaplatí"
    nesrazil připomínkou, že minulá vláda zadlužila stát o 1,2 bilionu za čtyři roky. Minulé vládě připisuje,
    že „zlegalizovala obchod s dětmi, s orgány, s vraždami, zbraněmi". Kritizuje také návrh Borise Šťastného
    (Motoristé) na neplacené první tři dny nemoci a ministra Juchelku za snížení podpory v nezaměstnanosti
    v době zvyšování politických platů. Viz [Stochastický teror](stochasticky-teror.md).
  osoby:
  - osoba: marian-jurecka
    vztah: negativni
    kontext: Okradl invalidy — „na elektrické křeslo"
  - osoba: boris-stastny
    vztah: negativni
    kontext: Návrh neplacených prvních 3 dnů nemoci
  podtema: USA — volební systém
- id: cernohorsky-2026-09-22-09
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: '„Zpoplatněné vlastenectví": Tušl a Zítko jako vyžírači dárců; vlastní vysílání bez QR kódu
    (Černohorský, 22. 9. 2026)'
  text: 'Černohorský obhajuje, proč zveřejnil informace o aktivistovi Tušlovi: ten podle něj přes soukromé
    zprávy „žebrá" o peníze s odkazem na své děti (tři jeho známí mu prý poslali 30–40 tisíc), zveřejnil
    falešné parte vytvořené AI (s datem pohřbu 21. 10.) a do vězení nešel „za hrdinství", ale za neplacení
    alimentů a výhrůžky bývalé partnerce a policistovi; stál prý i za zatažením Tomáše Čermáka do iniciativy
    „Nepodvolím se". Pavla Zítka obviňuje, že lhal lidem o dovozu vakcín (Sputnik) a „odchytávání poslanců",
    prodával „fény na vodu" a na prezidentskou kampaň vybral 750 tisíc Kč, přičemž dostal pokutu 40 tisíc
    — „to se to krásně dělá to vlastenectví"; popisuje „model" vlasteneckých influencerů (krátká videa,
    motto, QR kód). Sám zdůrazňuje, že 11 let vysílá zadarmo, QR kód „nikdy mít nebude" a raději bude
    „žrát suchej chleba, než abych prosil a žebral o peníze"; dary, které kdy dostal, podle svých slov
    poslal na transparentní účet nebo potřebným. Přiznává, že jeho vulgarita odrazuje od sdílení, ale
    „jiný nebude". Navazuje na svou kritiku [vlastenecké scény jako byznysu](#podpora-robina-čumpelíka--kritika-vlastenecké-scény-příčovy-a-vlastních-diváků-za-slepé-tleskání-politikům-černohorský-31-8-2026).'
  osoby:
  - osoba: tusl
    vztah: negativni
    kontext: „Žebrá", falešné AI parte; přání smrti
  - osoba: zitko
    vztah: negativni
    kontext: Lhal o vakcínách, 750 tis. na kampaň, „nejradši v kriminále"
  podtema: USA — volební systém
- id: cernohorsky-2026-09-22-10
  typ: tvrzeni
  temata:
