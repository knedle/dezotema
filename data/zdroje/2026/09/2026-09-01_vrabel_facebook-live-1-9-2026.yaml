- id: vrabel-2026-09-01-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Daň z nemovitosti pro vlastníky více nemovitostí — „salámová metoda" zdaňování (Vrabel, 1. 9.
    2026)
  text: 'Ministryně financí Alena Schillerová při představení návrhu rozpočtu na rok 2027 uvedla, že plošné
    zvýšení daně z nemovitosti (doporučované Evropskou komisí a MMF) nepředloží — ČR má s 70 % vlastnického
    bydlení v Evropě anomálii — ale zvažuje zdanění lidí vlastnících více nemovitostí („investiční byty").
    Vrabel to označuje za typickou „salámovou metodu" prosazování globalistických agend: nejdřív se zdaní
    ti, u nichž to vyvolá nejmenší společenský odpor („bohatí s x nemovitostmi"), zatímco vlastníci jednoho
    domku zůstanou zpočátku ušetřeni — na příkladu dvou vlastních známých (jeden Čech, jeden cizinec žijící
    v ČR), kteří dlouhodobě investují úvěry do nemovitostí jako formu podnikání, ukazuje, že nejde jen
    o „superbohaté", ale i o běžné drobné investory. Předpovídá, že po zdanění majitelů více nemovitostí
    přijde postupně řada i na ty, kdo mají jen dva byty, a nakonec i na vlastníky jediného bytu/domu —
    s odkazem na dřívější Schillerové výrok, že podnikatelé „musí mít vatu" (finanční rezervu).'
  osoby:
  - osoba: alena-schillerova
    vztah: negativni
    kontext: Návrh zdanit vlastníky více nemovitostí označen za „salámovou metodu" prosazování daňové
      agendy
  podtema: Elektřina — marže a ceny
- id: vrabel-2026-09-01-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Právo veta jako pilíř suverenity — jeho zrušení = konec ČR (Vrabel, 9. 6. 2026)
  text: '**1. 9.** — Vrabel navazuje na zprávu, že 11 členských zemí EU (Rakousko, Dánsko, Belgie, Finsko,
    Francie, Německo, Lucembursko, Nizozemsko, Rumunsko, Španělsko, Švédsko) v dopise šéfce unijní diplomacie
    Kaji Kallasové vyzvalo k přechodu na hlasování kvalifikovanou většinou v části zahraniční politiky
    (tzv. přemosťovací doložka, čl. 31 SEU). Tvrdí, že právo veta je fakticky již mrtvé, protože klíčová
    rozhodnutí (Green Deal, migrační pakt) byla schválena předchozími vládami a dnešní vláda už je nemůže
    zvrátit — pouze u budoucích rozhodnutí ještě formálně veto zůstává, než ho i tam zruší. Přirovnává
    EU k partě přátel, do které náhle přibyl „šestý člen", jenž si nárokuje rozhodovat za všechny — a
    jedinou obranou je vystoupení, protože bilaterální dohody o volném obchodu by fungovaly i bez členství
    (naopak volný pohyb osob dle něj přestal dávat smysl kvůli přijímání migrantů z islámských zemí).'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-09-01-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Dvojí metr v dodávkách zbraní — Německo se stydí, ČR se chlubí (Vrabel, 8. 8. 2026)
  text: '**1. 9.** — Ministr obrany Jaromír Zůna (SPD) v rozhovoru pro EUACTIV potvrdil, že „česká muniční
    iniciativa bude pokračovat tak dlouho, jak bude Ukrajina potřebovat pomoc" — letos má dodat zhruba
    milion kusů 155mm dělostřelecké munice za 5 mld. eur (iniciativa od založení v roce 2024 dodala kumulativně
    přes 4,3 mil. kusů). Vrabel to komentuje sarkastickým „poděkováním" celé vládní koalici (SPD, Trikolóra,
    Svobodní, ANO i Motoristé — ministr zahraničí Macinka navíc poslal 140 mil. Kč do programu PURL) za
    to, že navzdory předvolebním slibům zrušení iniciativy v ní ČR pokračuje „svým jménem" — na rozdíl
    od zemí, které dodávky munice raději neveřejní, protože se obávají ruské odvety. Připomíná, že current
    vláda je v tomto ohledu podle něj „mnohem horší" než ta předchozí, protože lhala o úmyslu iniciativu
    zrušit, zatímco Fialova vláda byla otevřeně proruská.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-01-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Erdogan na summitu podporuje PURL, Trump slibuje F-35 Turecku — znepokojení Izraele (Vrabel,
    10. 7. 2026)
  text: '**1. 9.** — Ke zprávě o neformálním setkání Erdogana s Putinem a Lukašenkem na okraji summitu
    Šanghajské organizace pro spolupráci (jednali i o válce na Ukrajině, bezpečnosti v Černém moři a hospodářské
    spolupráci) Vrabel opakuje tezi o Turecku jako klíčovém geopolitickém hráči „napůl cesty" mezi konfliktem
    v Íránu a na Ukrajině — nově s odkazem na čerstvě podepsanou tureckou-saúdskoarabsko-pákistánskou
    obrannou dohodu („první muslimská jaderná aliance", sekretariát v Rijádu) rozvádí tezi o „páté koloně":
    pokud by došlo k širšímu konfliktu, Erdogan by podle něj mohl nasadit silnou tureckou komunitu v Německu
    a Rakousku k odzbrojení místní policie, což by dané země mohly mít problém ustát.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-01-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: '**1. 9.** — Vrabel rozšiřuje pozorovaný vzorec o dva nové případy obviňování Ruska bez důkazů:
    německá vláda (ministr vnitra Alexander Dobrindt) oficiálně označila Rusko za viníka srpnového pokusu
    o útok na letiště v Halle i sabotáže elektrárny Jänschwalde v Braniborsku (provozuje ji společnost
    LEAG, patřící do skupiny EPH českého podnikatele Daniela Křetínského) — s odůvodněním, že to „zapadá
    do scénáře ruských hybridních operací", tedy bez toho, aby proběhlo dokazování a odsouzení jako u
    klasického trestního činu. Podobně v Polsku vyšetřují požár v továrně VB Electronics (vyrábí komponenty
    pro drony pro polskou a ukrajinskou armádu) po zadržení maskované osoby, která přelezla plot — vyšetřování
    zatím vinu nepotvrdilo, ale Vrabel předjímá, že k tomu dojde ze stejného politického, nikoli důkazního
    důvodu. Spojuje to se svou tezí, že druhá světová válka (jejíhož 87. výročí zahájení — 1. 9. 1939
    — si dnes připomínáme) také nezačala „jeden den", ale byla roky připravována propagandou vytvářející
    nenávist k nepříteli (tehdy k Židům/Německu, dnes k Rusku) — a že třetí světová válka již podobným
    způsobem probíhá, jen to zatím není takto pojmenováno.'
  osoby:
  - osoba: daniel-kretinsky
    vztah: negativni
    kontext: Jeho firma LEAG/EPH provozuje elektrárnu Jänschwalde, u níž Německo bez důkazů obvinilo Rusko
      ze sabotáže
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-01-06
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: Akcelerační zóny schváleny navzdory slibu zrušit Green Deal — 66 turbín na Zlínsku/Olomoucku
    (Vrabel, 1. 9. 2026)
  text: Vláda schválila akcelerační zóny pro obnovitelné zdroje, které mají urychlit povolování větrných
    elektráren — na pomezí Zlínského a Olomouckého kraje má vzniknout až 66 turbín, ve Slezsku je vyčleněno
    6 lokalit pro více než 50 elektráren; starostové požadují místo stanovených 500 metrů odstup alespoň
    1500 metrů a zvažují správní žalobu. Vrabel to označuje za podvod vlády, která před volbami slibovala
    Green Deal zrušit (ministr zahraničí prohlásil, že „klimatická krize skončila") — namísto rozvázání
    smlouvy s Bruselem a případného vystoupení z EU jen zmenšila akcelerační zóny, čímž se stejný počet
    turbín „nacpe" na menší plochu. Použitou přirovnávací metaforou (znásilnění, kde je jediným řešením
    „odmítnutí", nikoli vyjednávání o místě činu) ilustruje svůj obecný závěr, že s Evropskou unií jako
    celkem se „nedá vyjednávat" a jediná cesta je vystoupení.
  podtema: Kulturní a občanský odpor
