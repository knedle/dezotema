vyroky:
- id: vrabel-2026-09-26-01
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Papež Lev XIV. v Paříži — celibát jako příčina pedofilie, Vatikán ukrýval nacisty, Jasenovac
    (Vrabel, 26. 9. 2026)
  text: K mši papeže Lva XIV. v Paříži (700 tisíc lidí) Vrabel navrhuje „anketu", zda lidé souhlasí s
    pedofilií kněží, kterou přičítá celibátu („když se někdo takhle trýzní a trápí, no tak potom se není
    co divit, že to odnáší ti malí chlapečci"); pravoslavní kněží s rodinami jsou podle něj „normální".
    Vatikán prý za druhé světové války přesouval zlato a ukrýval nacisty, pomáhal i v jugoslávské válce
    a v chorvatském táboře Jasenovac („jediný koncentrační tábor pro děti") měl žádat ušetření těch, kdo
    konvertují z pravoslaví. Katolickou církev řadí mezi „falešné církve".
  osoby:
  - osoba: papez-lev-xiv-katolicka-cirkev
    vztah: negativni
    kontext: Celibát a pedofilie, Vatikán a nacisté, „falešná církev"
- id: vrabel-2026-09-26-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: ČT24 píše „bez důkazů" o zákazu ruštiny na Ukrajině — „diagnóza" (Vrabel, 26. 9. 2026)
  text: 'K Lavrovovu výroku v OSN, že ruština je na Ukrajině zakázaná, a k tomu, že ČT24 dodává „bez důkazů",
    Vrabel připomíná, že sama ČT v letech 2014–2022 informovala o občanské válce na Ukrajině a porušování
    práv rusky mluvících (Minské dohody): „mohli být aspoň natolik schopni, aby se podívali do vlastních
    archivů, když už tady tvrdí, že nemají důkazy. To už je opravdu diagnóza."'
  podtema: Nová alternativní média
- id: vrabel-2026-09-26-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: „už jediné, k čemu může dojít, je občanská válka"; ČR má ještě šanci „pomoct" 2 milionům
    Ukrajinců vrátit se (Vrabel, 26. 9. 2026)'
  text: 'K zatčení muže, který propíchl prázdný člun migrantů (hrozí mu 10 let), Vrabel tvrdí, že britští
    protestující brání tomu, aby „původní obyvatelstvo bylo nahrazeno přistěhovalci", a policie pomáhá
    migrantům protesty rozbíjet. V Británii je podle něj už pozdě: migranti mají občanství a nelze je
    deportovat, „jediný, k čemu může dojít, je občanská válka, jinak se těch lidí nemůžou zbavit". ČR
    má podle něj ještě šanci „pomoct" asi 2 milionům Ukrajinců vrátit se domů („nebudu říkat se těch lidí
    zbavit, protože to by hnusně znělo") a vystoupit z EU a migračního paktu, dokud je otevřené „Overtonovo
    okno" — pak prý demonstranty čeká obušek a vězení jako v Katalánsku. Pilířem EU je podle něj „zlikvidovat
    národní stát".'
- id: vrabel-2026-09-26-04
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel „troubí do války" — ve sporu s Ficem o čl. 5 NATO (Rajchl, 24. 9. 2026)
  text: '**26.–27. 9. (Vrabel)** — K Pavlovu výroku pro Fox News, že přijde čas sestřelit ruské letadlo
    či dron, Vrabel (sám pilot) namítá, že ruský vrtulník narušil hranici o 300 m na 40 sekund, což „není
    zas tak moc", a sestřel by spustil ruské rakety na stíhačky: „za hodinu krizový štáb, za dvě hodiny
    zavřené hranice, stav ohrožení a vojáci v ulicích". Pavel podle něj mluví za NATO, ne za ČR; Macinka
    a Babiš se s Hradem sladili v zahraniční politice a „přenechávají otěže generálu NATO". Stačí podle
    něj „jeden blbec s plnovousem, trénovanej nejdřív pro Moskvu, potom pro New York nebo pro Washington,
    kterej poslouchá rozkazy".'
  osoby:
  - osoba: rajchl
    vztah: negativni
    kontext: „Řekl, že demonstrace nemají smysl"
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-09-26-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: '**26. 9.** — K videím z berlínských protestů proti branné povinnosti Vrabel označuje německé
    policisty, kteří „táhnou dítě", za „opravdu zločince"; brutalita policie podle něj roste od covidu
    (ve Francii zatkli i herečku Susan Sarandon). Ironicky vyzývá nosit kytky „majoru Kolářovi", policistovi
    z jeho demonstrací, pod jehož vedením prý policie pustila ukrajinského útočníka a zatkla jeho.'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-09-26-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Ztrojnásobení Frontexu (300 mil. EUR, 3× personál) jako příprava na válku, ne na migraci (Vrabel,
    13. 9. 2026)
  text: '**26. 9.** — K navýšení rozpočtu Frontexu z 1,2 na 11,9 mld. Vrabel s odkazem na šéfredaktora
    Aeronetu („VK") opakuje, že nejde o vracení migrantů, ale o to, aby Frontex při válečném stavu zadržel
    prchající občany — „aby měli dostatek lidí potom pro ten vojenský konflikt".'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-26-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Směrnice NATO „Resilience Baseline Requirements" — příprava na hromadné oběti; nafta podle priorit
    a „energetické lockdowny" (Vrabel, 26. 9. 2026)
  text: 'Ze směrnice NATO „2026 Resilience Baseline Requirements" (15. 9.) Vrabel vybírá body: plán na
    hromadný příliv osob „přesahující 2 % celkové populace", přednost armády na silnicích před civilisty,
    plány pro hromadné oběti, zásoby krve a léčiv a rychlé přechody hranic pro síly NATO — „NATO se skutečně
    připravuje na hromadné oběti". Babišovo nové krizové centrum za více než půl miliardy dává do souvislosti
    s touto směrnicí. Až nafta dojde, bude se podle něj přidělovat podle priorit: nejvýš armáda, pak zdravotnictví
    a zbrojovky, velké podniky elit, a na konci malé a střední firmy a lidé, kteří dostanou jen minimum,
    aby „nesežrali vládu"; Babiš podle něj „umí" lockdowny a zvládne i „energetické lockdowny". Silnice
    pro tanky přitom ČR platí sama, protože NATO je do výdajů na obranu neuzná.'
  citace:
  - text: My budeme žít o kůrce a o vodě, ale tanky jezdit budou.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-26-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Až se obr ožene" — Západ ČR obětuje; Rusko se bude muset pustit do konfliktu s Evropou; ⚡ válka
    by byla dlouhá (Vrabel, 26. 9. 2026)
  text: |-
    K českému stíhacímu dronu Lovec Vrabel používá metaforu Ruska jako „obra", do kterého ČR píchá (letadla, drony, muniční iniciativa s více než polovinou munice). Až se „ožene", nastanou podle něj dva scénáře: buď se aliance po „menším jaderném úderu" na Evropu rozpadne a všichni řeknou „to ty Češi, to je ta muniční iniciativa", nebo Západ ČR „prodá", stáhne se na hranice ze studené války a Česko, Slovensko a Polsko obětuje. Proti Petrosi Michopoulosovi, který doufá v ruský útok na Finsko či Pobaltí, namítá, že pro Evropu je nejvýhodnější současný stav, kdy Rusko „můžete mlátit a on vám nesmí dát ránu zpátky" — pro Rusko je to neudržitelné, a proto „se bude muset pustit s Evropou do konfliktu", pravděpodobně útokem na dva státy a jaderným ultimátem hlavním městům. Putinovi, že se Rusko na konflikt nechystá, nevěří; Rusko ale konflikt nechce, protože je proti Evropě a USA lidnatostně malé. Ivana Davida označuje za „jediného politika, který to má v hlavě v pořádku".

    ⚡ **Posun:** Na rozdíl od svého souhlasu s Lavrovem (19.–20. 9., „krátká, ale intenzivní válka") nyní tvrdí, že „válka nikdy není rychlá" — byla by dlouhá se „spousty milionů" mrtvých; krátká jen tehdy, kdyby Rusko použilo taktické jaderné zbraně proti jedné či dvěma zemím.
  citace:
  - text: Až se ten obr ožene, že se to celý rozpadne [...] to ty Češi, to je ta muniční iniciativa, ty
      Češi, s kýma si to vyřešte.
  osoby:
  - osoba: ivan-david
    vztah: pozitivni
    kontext: „Jediný politik, který to má v hlavě v pořádku"
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-26-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Posun postoje k Číně — „velmi příjemně překvapený" její obranou mezinárodního práva (Vrabel,
    26. 9. 2026)
  text: 'K projevu Si Ťin-pchinga v OSN proti postupu USA vůči Íránu a Kubě Vrabel označuje USA za nejsilnějšího
    „lumpa", který šikanuje, vykořisťuje a napadá, zatímco Čína se jako aspirující velmoc zastává mezinárodního
    práva a malých zemí. Výslovně přiznává posun vlastního postoje: ještě před pěti lety neměl k Číně
    dobrý vztah (Tibet, Ujguři), nyní je její politikou posledních let „velmi příjemně překvapený".'
  osoby:
  - osoba: si-tin-pching
    vztah: pozitivni
    kontext: Posun postoje — „velmi příjemně překvapený" obranou mezinárodního práva
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-26-10
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Rusko se bude muset pustit do konfliktu s Evropou; válka by byla dlouhá s miliony mrtvých
  text: Aby Rusko neprohrálo, bude se muset pustit do konfliktu s Evropou (pravděpodobně útok na dva státy
    a jaderné ultimátum); pokud nepoužije taktické jaderné zbraně, bude válka dlouhá a zemřou „spousty
    milionů" lidí.
  citace:
  - text: Pro Ruskou federaci, aby Ruská federace neprohrála, tak se bude muset pustit z Evropu do konfliktu.
      To je prostě, myslím si, že jednoduchá vojenská logika.
  predikce:
    horizont: neurčeno
    stav: ceka
