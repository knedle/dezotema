  nadpis: ⚡ Laviny v Nepálu jako řízený útok raketou z letadla — analogie s 9/11 jako „největší globální
    podvod" (Černohorský, 27. 8. 2026)
  text: '**12. 9.** — Černohorský 9/11 rozsáhle rozvádí jako součást řady „falešných záminek USA" (Tonkinský
    záliv — „3,8 milionu mrtvých Vietnamců", ampulka antraxu Colina Powella a Irák, pokusy amerického
    námořnictva s rozprašováním bakterií v Sanfranciském zálivu): palivo z Boeingu se prý vejde do krychle
    3,6 m, „dutý doutník z hliníku" nemohl prorazit ocel, Boeing nemohl letět 800 km/h ve výšce 3 m, do
    Pentagonu „na tisíc procent žádný letadlo nevpálilo", v Pensylvánii byly „dva bagry a díra", WTC 7
    spadla „jak když odstřelujete barák" a pas Muhammada Atty byl „nehořlavý"; připouští i teorii „promítnutých"
    letadel. Mezi „Epsteinovy pedofily, kteří žrali děti a píchali si adrenochrom" nově řadí i Donalda
    Trumpa, hollywoodské hvězdy a politiky EU.'
  citace:
  - text: Američané tady lhali, lžou a lhát budou.
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: Řazen mezi „Epsteinovy pedofily"
  podtema: Náboženský a okultní výklad moci
- id: cernohorsky-2026-09-12-02
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: „Česko je plán" — záměrná eroze národní identity
  text: '**12. 9. (Černohorský)** — Černohorský klade počátek názvu „Česko" do roku 2016 za Sobotkovy
    vlády a spojuje ho s Newyorskou deklarací a Agendou 2030; podle něj ho schválili Zaorálek, Hamáček
    a Zeman a změna dokumentů stála „stovky miliard". Pro Moravany a Slezany je „Česko" „nepřípustné"
    — navrhuje název „Českomoravská federativní republika" a úpravu vlajky. Odvolává se na Daniela Hermana,
    který podle Parlamentních listů na sjezdu Landsmannschaftu (kde ho vyznamenal Posselt) řekl, že bychom
    byli „taková 17. spolková republika" Německa — název „Česko" to podle Černohorského umožní, možná
    „až za 10, 15, 20 let". V českých rukou je podle něj jen asi 10 % toho, co bylo za ČSFR, a „Československa
    už nikdy nebude".'
  osoby:
  - osoba: daniel-herman
    vztah: negativni
    kontext: „Kolaborant, zrádce" — „17. spolková republika"
- id: cernohorsky-2026-09-12-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Národní hrdost, zákaz mobilů ve školách, „socioekonomické vraždy"; Babiš, Motoristé a karenční
    doba (Černohorský, 12. 9. 2026)
  text: Černohorský tvrdí, že politici po rozkradení majetku ničí i národní hrdost (ČSSR byla v 70. letech
    prý „třetí nejúspěšnější ekonomika", první republika „devátá"); ročníky 1950–1980 jsou podle něj „poslední
    generace", která to může napravit, a požaduje úplný zákaz mobilů na všech stupních škol — „zničíme
    generace dětí, a jim se to podařilo". Připouští, že za socialismu se střílelo na hranicích a byly
    politické procesy, ale dnes se podle něj „vraždí socioekonomickým způsobem" — sebevraždy z bídy jako
    výsledek politiky 37 let. Kritizuje Babiše a Motoristy za plán snížit podporu v nezaměstnanosti a
    vrátit neplacené první tři dny nemocenské (Boris Šťastný je „bývalý ODSák"), zatímco politici mají
    placenou nepřítomnost; programovému prohlášení vlády se „smál". Rakušan prý bral 60 tisíc měsíčně
    v dozorčí radě České pošty, zatímco Agrofert zaměstnává 30 tisíc lidí — „v tomhle směru Babiše nechte
    na pokoji". Za zničení prezidentské standarty skupinou Ztohoven by pachatelům „napařil 20 let".
  citace:
  - text: Jsou páchány socioekonomické vraždy. Doslova dopísmene.
  osoby:
  - osoba: boris-stastny
    vztah: negativni
    kontext: Karenční doba — „bývalý ODSák"
  podtema: Politická kultura
