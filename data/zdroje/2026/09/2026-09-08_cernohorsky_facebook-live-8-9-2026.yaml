- id: cernohorsky-2026-09-08-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Chráněné dílny „parazitují" na invalidech; Radim Fiala a prodaná firma — „hyenismus" (Černohorský,
    8. 9. 2026)
  text: Černohorský čte příspěvky invalidních důchodců (rakovina s metastázemi „v remisi" snížená ze 3.
    na 1. stupeň, koxartróza 3.–4. stupně jen s 20% omezením) a kritizuje výběrová řízení do chráněných
    dílen, kde se dokládá rozhodnutí o invaliditě i valorizace a platy jsou 8–9 tisíc místo 25–30 tisíc;
    majitelé jsou podle něj „horší zmrdi než politici", „normální nacisti" parazitující na dotacích. Souhrn
    chce poslat ministru Juchelkovi a žádá zrychlenou novelu. K poslanci SPD Radimu Fialovi připomíná
    článek, podle něhož nesdělil, komu prodal firmu profitující z invalidních důchodců — pokud tam figuruje
    přes bílého koně, je to „sprostota nejvyššího kalibru, zrůdnost a hyenismus".
  podtema: Kauza Jesenicko — Stanjura obviněn ze zneužití povodňové půjčky
- id: cernohorsky-2026-09-08-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Volby bez kvóra účasti jsou podvod — strany se „zvolí samy" svými členy; zrušit peníze (Černohorský,
    8. 9. 2026)
  text: 'Černohorský tvrdí, že protože zákon nestanoví kvórum účasti, jsou volby „od základu podvod na
    nás lidi": strany se mohou „zvolit samy" svými členy, zatímco 30–36 % lidí rezignovalo. Čte z AI počty
    členů stran (KDU-ČSL 19 tisíc, SPD asi 11 tisíc, ODS 10 tisíc, ANO 2 600, STAN 2 200, TOP 09 2 100,
    Motoristé asi 1 500, Piráti 1 200). V diváckém „kvízu" říká, že by zrušil peníze a nahradil je výměnným
    obchodem („v tu chvilku se žádnej politik nebude drát") a vrátil se ke „slovanským občinám" s hodnotami
    čestnost, morálnost, poznaná pravda, hrdost a odvaha; poslanecká funkce byla podle něj za ČSR „čestnou
    funkcí". Peníze podle něj „neexistujou" — kdyby si 1–2 miliony lidí šly vybrat úspory, nedostanou
    je; Google je „vojenský projekt" a AI „nás zabije". Babiš podle něj napraví „k 30 %" a zbytek nechá.'
  citace:
  - text: Neexistuje v zákoně stanovené procentuální kvórum… To je ten další neskutečnej podvod.
  podtema: Politická kultura
- id: cernohorsky-2026-09-08-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Válku vyprovokoval Západ a „židé z Izraele"; drony nad Německem byli „ekoteroristé" — Babiš
    se má Rusku omluvit; Pavel větší hrozba než Rusko (Černohorský, 8. 9. 2026)
  text: Černohorský tvrdí, že válku vyprovokovaly EU, USA, Británie „a židé z Izraele", aby „rozparcelovaly"
    Rusko, kterému „nezbylo nic jiného"; USA ve druhé světové válce financovaly Hitlera i SSSR („čím víc
    mrtvejch, tím líp") a za vším stojí „klán satanistický, klán Rothschildů" (viz [Stochastický teror](stochasticky-teror.md)).
    Připomíná, že v dubnu 2022 předpověděl, že USA budou Evropě prodávat LNG za trojnásobek. Drony nad
    německými letišti podle něj vypustili „ekoteroristé", ne Rusko — Babiš, Macinka a Vondráček se mají
    Rusku omluvit za „křivé obvinění"; totéž prý platí o raketě v Polsku a dronech nad Polskem (ukrajinské
    provokace). Pavel („kretén na Hradě"), Kolář a Strnad jsou podle něj větší ohrožení ČR než celá Ruská
    federace, za níž stojí BRICS; jediná raketa na Moskvu by znamenala „končíme všichni". Okamura podle
    něj získává odvahu díky AfD, ale Německo se nevzpamatuje do pěti let a přijde recese.
  citace:
  - text: Rusové nejsou agresoři, rusové nikdy agresoři nebyli a rozhodně rusové nejsou nebezpečí.
  podtema: Zahraniční aktéři a precedenty
- id: cernohorsky-2026-09-08-04
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: Starosta zlomený výhrůžkami vůči dětem povolil 22 větrníků — politici jsou vydíratelní (Černohorský,
    8. 9. 2026)
  text: 'S odkazem na slovenské video („děd Vševěd") Černohorský tvrdí, že jistý český starosta, který
    byl proti větrníkům, povolil 22 turbín poté, co za ním na nátlak chodili strážníci, policie a hasiči.
    Zobecňuje: politika s rodinou systém zlomí výhrůžkami, „že prostě zlikvidujou vaši rodinu, nejlépe
    jedno dítě, pak druhý dítě" — podle vzoru USA „uplatit, zdiskreditovat, a když to nejde, převrat,
    unesou, zabijou". Větrníky podle něj zabíjejí živé tvory a nevratně ničí půdu; režim označuje za „satanistický,
    korporátně nacistický, totalitní".'
  podtema: Kulturní a občanský odpor
