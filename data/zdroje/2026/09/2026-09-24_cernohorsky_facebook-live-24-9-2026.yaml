- id: cernohorsky-2026-09-24-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Obhajoba Babiše ohledně vysokých cen pohonných hmot — viní Izrael, USA a Velkou Británii (Černohorský,
    19. 9. 2026)
  text: '**24. 9.** — Černohorský svou obhajobu reviduje a omlouvá se Miloši Komínkovi: myslel si, že
    Slovensko má levnější PHM díky vlastním rafineriím, ale Slovnaft vlastní cizinci — nafta je tam přesto
    asi za 46 Kč, tedy o 4–8 Kč levněji, ač spotřební daň je vyšší. Uzavírá, že současné ceny „jdou za
    vládou Andreje Babiše", která „pro tyhle věci dělá daleko méně a hůř, než to udělala slovenská vláda".
    Zároveň označuje za lež video Nemeta o celoplošném zdražení potravin v Německu o 30 % — potraviny
    jsou tam podle něj levnější než v ČR, dražší byla jen vejce kvůli „vymyšlené" ptačí chřipce.'
  osoby:
  - osoba: milos-kominek
    vztah: pozitivni
    kontext: Omlouvá se mu — měl pravdu o cenách PHM na Slovensku
  podtema: Pohonné hmoty
- id: cernohorsky-2026-09-24-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Elity tolerují pedofilii, adrenochrom a kanibalismus; von der Leyenová „by měla být popravena"
    (Černohorský, 24. 9. 2026)
  text: S odkazem na rozhovor Tomáše Lukavce s americkým lobbistou o Ursule von der Leyenové (chce ho
    přeposlat poslancům) Černohorský tvrdí, že svět toleruje pedofilii vrcholných představitelů, vraždění
    dětí kvůli adrenochromu, obchod s orgány, kanibalismus a satanistické obřady — „tohle všechno se děje".
    Von der Leyenovou by podle svých slov „flusnul do ksichtu" a udeřil, označuje ji za „svini", která
    by „měla být popravena" a spolu s dalšími „nemá právo na život". Viz [Stochastický teror](stochasticky-teror.md).
  osoby:
  - osoba: ursula-von-der-leyenova
    vztah: negativni
    kontext: „Měla by být popravena"
  - osoba: tomas-lukavec
    vztah: pozitivni
    kontext: Rozhovor o von der Leyenové
  podtema: Náboženský a okultní výklad moci
- id: cernohorsky-2026-09-24-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: „Kde je ta proruská propaganda?" — všude jen prozápadní; mlčení o vraždě kněze; obhajoba Rajchla
    proti Strakatému (Černohorský, 24. 9. 2026)
  text: Černohorský tvrdí, že proruskou propagandu ve veřejném prostoru nevidí, zatímco „prozápadní, eurohujerská"
    je všude — ČT, ČT24, Nova, Prima, Novinky, Lidovky, Seznam, Forum 24, Aktuálně i Deník N; proruské
    weby (AZ24, Aeronet, CZ24) prý nesleduje a s Vladimírem Frantou ze Sputniku nemluvil přes pět let.
    Popisuje, jak „rozebral" AI Google, až uznala, že proruské weby nemají dosah ČT, a ironizuje tvrzení
    Romana Máci (2016), že jeho spolek financuje Kreml. Předpovídá, že média budou mlčet o vraždě kněze,
    kterého měl během mše zavraždit Ukrajinec. Přestože s Rajchlem „není za dobře", hájí jeho právo říct,
    že Rusko není agresor, proti Čestmíru Strakatému, který Rajchla v upoutávce Hero Hero nazval „posrancem"
    — „přece máme tu demokracii, nebo nemáme svobodu slova?" Ironicky komentuje i Pavlův projev v OSN,
    kterému podle fotky naslouchalo „asi osm lidí".
  citace:
  - text: Do prdele, kde je ta proruská propaganda?
  osoby:
  - osoba: rajchl
    vztah: rozporuplny
    kontext: „Není s ním za dobře", ale hájí jeho právo na názor proti Strakatému
  - osoba: cestmir-strakaty
    vztah: negativni
    kontext: Nazval Rajchla „posrancem"; „parazit"
  podtema: Nová alternativní média
- id: cernohorsky-2026-09-24-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Podmíněné propuštění Tomáše Čermáka — nepřiměřený trest jako „zářný příklad" pro umlčení scény
    (Černohorský, 24. 9. 2026)
  text: |-
    Černohorský vítá podmíněné propuštění Tomáše Čermáka, kterého zná od „Jízd za svobodu" (2020). Trest (prakticky šest let) považuje za nepřiměřený ve srovnání s podmínkami pro „Ukroše", násilníky a pedofily: státní zástupce podle něj pracoval „s předpokladem, ne s fakty", že se slovní projevy promění v násilí, a z Čermáka i Tušla chtěli udělat „zářný příklad, aby si každej dával pozor na tu hubu" — i přesto, že „tady máme dneska totalitu a za Rakušana, za tohoto gestapáka". Čermákovi ale připisuje i díl vlastní viny a hlavním viníkem jeho uvěznění je podle něj Tušl („kdyby nebylo Tušla, Tomáš Čermák nikdy v kriminálu nebude"); o termínu soudu věděl přes rodinu přes měsíc předem, ale mlčel, aby se neopakovaly výstupy Zítka, Petrkové a Malého u soudů. Navazuje na svůj výčet [politické perzekuce](#systematická-perzekuce-kritiků--selektivní-uplatňování-práva-černohorský-17-5-2026).

    ⚡ **Konflikt:** Pavel Zítko (ČsTV2) tvrdí, že propuštěný muž nebyl skutečný Čermák, ale dvojník, a udání odmítá — viz [kauzy.md](kauzy.md#propuštění-údajného-tomáše-čermáka-jako-sehraný-justiční-podvod-s-dvojníkem-zítko-2427-9-2026).
  osoby:
  - osoba: tomas-cermak
    vztah: pozitivni
    kontext: Raduje se z propuštění, trest nepřiměřený; přiznává mu i vlastní vinu
  - osoba: petrkova
    vztah: negativni
    kontext: Údajně udala Čermáka spolu se Zítkem
  podtema: Politická perzekuce
- id: cernohorsky-2026-09-24-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: '„Zpoplatněné vlastenectví": Tušl a Zítko jako vyžírači dárců; vlastní vysílání bez QR kódu
    (Černohorský, 22. 9. 2026)'
  text: '**24. 9.** — Černohorský tvrdí, že Tušl vedle invalidního důchodu vybíral od dárců až 35 tisíc
    Kč měsíčně a že mu po zveřejnění 20–25 dárců oznámilo, že přestanou posílat; popisuje jeho „metodiku"
    — rozeslat upravené fotky Černohorského jako „fízla" a toho, kdo souhlasně zareaguje, požádat o 500–1000
    Kč „na dcerky". Nejvyšší trest podle něj Tušl dostal za alimenty a výhrůžky smrtí bývalé partnerce,
    dětem a policistovi, ne za videa o Ukrajincích. O Zítkovi prohlašuje, že „s největší pravděpodobností"
    spolu s Petrkovou Čermáka udal, aby „vyměnili jeho svobodu za tu svoji" (opírá se o „indicie" od lidí
    z hospody, kde byl Čermák zatčen), a že chystá sbírku na Čermáka bez souhlasu rodiny. Zítka označuje
    za inteligentního, ale „vychcaného" manipulátora, kterému stačí „300–500 lidí s IQ 80 a níže" věřících
    na bílé klobouky, GESARU a „nelegitimní ČR s.r.o." — tuto teorii sám vyvrací (vláda v demisi má plné
    pravomoci, zákon 424/1991). Obnovu Československa si umí představit jen po katastrofě, „spousta lidí
    se toho nedožije". Vlastní spolek podle něj má na účtu 700–750 tisíc Kč určených na pomoc lidem; z
    darů si prý jen dvakrát proplatil naftu. Úvod vysílání tvoří satirická parodie Zítkových příznivců
    („Franta Novák" „potvrzuje", že propuštěný Čermák je klon).'
  osoby:
  - osoba: zitko
    vztah: negativni
    kontext: „Vychcanej" manipulátor, „s největší pravděpodobností" udal Čermáka
  podtema: USA — volební systém
- id: cernohorsky-2026-09-24-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Zrušení tiskových mluvčích, okamžité zbavení imunity a trestní stíhání, konec poslaneckých prázdnin
    (Černohorský, 15. 9. 2026)
  text: '**24. 9.** — Černohorský svůj program „kdybych byl premiérem" doplňuje: platy politiků by nejen
    zmrazil, ale novelou zákona 236/1995 snížil na úroveň roku 2010 a zrušil paušály (33 tisíc na bydlení
    v Praze, 60–70 tisíc na PHM, telefony) — „politik je zaměstnanec nás všech, není to žádnej polobůh".
    Koncesionářské poplatky by zrušil po ročním přechodném období, ČT by se stala komerční televizí a
    zákon by všem celoplošným televizím uložil povinné politické debaty placené ze státního rozpočtu (Klempíř
    podle něj slib ohledně poplatků nesplnil). Podmínkou by bylo „vydání" Fialy, Stanjury, Blažka, Rakušana,
    Černochové a Lipavského k trestnímu stíhání (neziskovky, muniční iniciativa, Kampelička, Dozimetr);
    Stanjura podle něj čtyři roky falšoval výkazy rozpočtu a chybí 400 miliard.'
  podtema: Vlastní vládní program „kdybych byl Babišem" (Černohorský)
- id: cernohorsky-2026-09-24-07
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Kauza Terezy Vlasákové jako „spiknutí" úřadů (Černohorský, 24. 9. 2026)
  text: Černohorský tvrdí, že proti Tereze Vlasákové, které jeho spolek pomáhá, probíhá „spiknutí" školy,
    OSPOD, policie, psychiatričky, GIBS, soudu i státního zastupitelství (o dva dny dříve mluvil o tom,
    že se ředitelka a učitelka „spikly s OSPODem", aby jí vzali děti). Video Jarči Křivákové o praktikách
    policie podle něj „stoprocentně" říká pravdu.
  osoby:
  - osoba: tereza-vlasakova
    vztah: pozitivni
    kontext: Oběť „spiknutí" úřadů
  podtema: Šmírování dětí státem
- id: cernohorsky-2026-09-24-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Volyňský masakr jako obraz „ukrajinského národa" — výzva ke sdílení (Černohorský, 21. 9. 2026)
  text: |-
    **24. 9.** — Černohorský tvrdí, že kniha „Volyň" po začátku války „zmizela" z trhu (výkupci za ni nabízejí 2 700–3 000 Kč). Opakuje, že Zelenskyj udělil 26. 5. 2026 jednotce „Sever" čestný titul „UPA" v den výročí pogromu z roku 1943 — záměrně, protože „Židé milují symboliku" a „Volodymyr Zelenský je Žid"; zároveň je podle něj nacista, „to se v jeho případě nevylučuje", což prý poprvé „potvrdil" potleskem Jaroslavu Hunkovi (SS Galizien) v kanadském parlamentu. UPA podle něj zavraždila i 350–400 volyňských Čechů a ČR by se měla zachovat jako Polsko. Martina Dvořáka (STAN), který podle něj v pořadu *Máte slovo* bagatelizoval Banderu a Šuchevyče jako „věc Ukrajiny", označuje za „lidský odpad" a „zrůdu", která „má sedět v kriminále" za popírání genocidy. Svůj vulgární slovník obhajuje tím, že jinak se o takových „zrůdách" mluvit nedá.

    ⚡ **Poznámka:** Výklad Zelenského volby data přes „židovskou symboliku" je antisemitský motiv — viz [Stochastický teror](stochasticky-teror.md).
  podtema: Stav Ukrajiny a mobilizace
- id: cernohorsky-2026-09-24-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Katalog korupčních kauz ukrajinského vedení jako odpověď na „obránce Ukrajiny" — Nord Stream
    jako ukrajinsko-americký čin (Černohorský, 19. 9. 2026)
  text: '**24. 9.** — K nálezu 140 milionů USD (přepočítává na 3,22 mld. Kč) u člověka napojeného na Zelenského
    Černohorský zdůrazňuje, že ukradené peníze neokrádají „nás", ale vojáky na frontě o proviant, boty
    a vybavení; ukrajinský dobrovolník je pro něj „v určitém smyslu hrdina", byť „nacisticky vypatlaný",
    a zraněné vojáky prý Ukrajina „rovnou střílí". Opakuje, že rakety v Polsku (Przewodów) byly ukrajinské
    a Zelenskyj přemlouval polského prezidenta, aby je označil za ruské, a že Nord Stream vyhodili Ukrajinci
    s největším podílem USA; kritizuje Nerudovou a Zdechovského za volání po článku 5. Babišovi vyčítá,
    že slíbil ukončit muniční iniciativu a nedodržel to — výtky směřuje i k Macinkovi, Turkovi, Šťastnému
    a SPD.'
  podtema: Zahraniční aktéři a precedenty
- id: cernohorsky-2026-09-24-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Příměří by bylo pro Rusko hloupé — NATO překročilo hranici první; „oříšky" na Londýn, Paříž,
    Brusel i Prahu (Černohorský, 24. 9. 2026)
  text: 'K výzvě 50 států OSN (včetně ČR) k bezpodmínečnému příměří, kterou Lavrov odmítl, Černohorský
    tvrdí, že Rusové by museli být „vymydlené kundy", aby souhlasili. „Hranici" podle něj překročilo NATO
    už rozšiřováním v letech 1999, 2004 a 2008, porušením neutrality Ukrajiny zakotvené v roce 1991 a
    Minskými dohodami, které podle výroků Merkelové a Hollanda sloužily jen k vyzbrojení Ukrajiny; příměří
    by podle něj jen umožnilo doplnit zbraně a EU „pod vedením zmrdů z Izraele a USA" by pak pod falešnou
    vlajkou znovu vyhlásila Rusku válku. Ruské podmínky považuje za oprávněné: Ukrajina nikdy v NATO ani
    v EU, konec dodávek zbraní a peněz, pád režimu, dohled sousedních států, konec „biolaboratoří", kde
    prý vznikají viry zabíjející Rusy, a konec ulic pojmenovaných po Banderovi, Šuchevyčovi a Melnykovi.
    NATO označuje za „teroristickou organizaci zmrdů, kteří rozsévají válku po celém světě", poukazuje
    na obklíčení Ruska a srovnává situaci s kubánskou krizí (Kuba si spojence vybrat nesměla, Ukrajina
    ano). Varuje, že Putin při dalších provokacích pošle „oříšky" (rakety) do Londýna, Paříže, Bruselu
    — „kde by mohl přistát? V Praze? Protože tady je taky banda kreténů" — a že k tomu mlčí i Babišova
    vláda. Trumpa nazývá „kryplem", protože sliboval konec války do týdne. Viz [predikce](predikce.md).'
  citace:
  - text: Neskončí do té doby, dokud nebude Ukrajina poražena na hlavě.
  osoby:
