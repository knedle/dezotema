  nadpis: Výsměch volebním kampaním; vlastní kandidatura za Restart pro Brno (Černohorský, 24. 9. 2026)
  text: 'Černohorský zesměšňuje volební reklamy: Grolicha zná osobně („obyčejnej sráč"), Šarapatku nazývá
    psychopatem a Martina Dvořáka zesměšňuje za narozeninovou básničku pro Klempíře; naopak reklamy Ivany
    Turkové a Jana Bittnera (Litvínov) podle něj „měly úroveň". Sám volí SPD, ale její píseň a klip s
    tlačením dodávky (Rajchl, Foldyna) považuje za trapné. Oznamuje, že kandiduje na třetím místě kandidátky
    Restart pro Brno v Brně-střed.'
  podtema: Komunální volby
