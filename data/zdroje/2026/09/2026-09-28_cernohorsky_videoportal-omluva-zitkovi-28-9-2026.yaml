  nadpis: '„Zpoplatněné vlastenectví": Tušl a Zítko jako vyžírači dárců; vlastní vysílání bez QR kódu
    (Černohorský, 22. 9. 2026)'
  text: '**28. 9.** — Černohorský rozšiřuje kritiku „vlastenecké scény, která jde jen po penězích": Zítko
    „patří do kriminálu" (kryptoměna, „andělské hlídky", „fény na vodu", prezidentská kampaň); Renata
    Bernardy ho prý dvakrát udala, naznačovala, že vykradl byt jejího syna, a založila placený web; skupina
    kolem Németa (Jurneček, Sogel, Bílý) ho prý chtěla vydírat sestříhanou hlasovou zprávou; Pavel Krejčí,
    který se přidal k Vrabelovi a Sládkovi, je podle něj „úchylák" a kdysi ho s Pavlem Maškem „vyšachoval"
    ze strany. K profilu „Politický vězeň Čermák" už neuvádí Zítka jako autora, ale připouští, že ho „vytvořili
    lidé kolem Tomáše Čermáka" (téhož večera se Zítkovi v samostatném videu omluvil). Čermákovi radí,
    ať se „vyser[e] na Facebook" a „rádoby vlastenectví", myslí na dceru a práci, protože „pokud jenom
    jednou šlápneš vedle, jdeš do basy" — a výslovně odmítá násilí („zapálit pochodně, podpálit Senát,
    vyházet ty zmrdy do Vltavy — tímto způsobem ne, nikdy v životě"). Nezištně podle něj pomáhají Kateřina
    Konečná, Petra Rédová, Laďa Kytka a senátor Jaroslav Veleba.'
