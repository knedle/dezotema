  nadpis: Trestní oznámení na „genocidu národa, vakcinační holokaust a sterilizaci obyvatelstva" (Zítko,
    7. 8. 2026)
  text: '**6. 9.** — Zítko v rozhovoru zpřesňuje žádost z tohoto oznámení specificky na souvislost s autismem:
    cituje analýzu Soni Pekové (34 vzorků dovezených vládním zmocněncem SR Petrem Kotlárem, „obrovské
    množství nedeklarované DNA") a materiály Roberta F. Kennedyho ml. jako ministra zdravotnictví USA.
    Vyzývá krajské státní zastupitelství, aby kontaktovalo nejvyšší státní zastupitelství a NCOZ s žádostí
    o předběžné opatření a analýzu všech použitých vakcinačních šarží v ČR z hlediska souvislosti s autismem
    — jinak jsou dle něj tyto orgány samy trestně spoluodpovědné podle §367.'
  podtema: Volání po tribunálu
