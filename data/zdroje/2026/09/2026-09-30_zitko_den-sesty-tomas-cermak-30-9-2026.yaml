  text: '**30. 9.** — Zítko pouští archivní záznam z roku 2023, kdy se na mítinku SPD v Ústí nad Labem
    ptal Tomia Okamury, proč nevyužije „protiprávní rozdělení" Československa k odchodu z NATO a EU (ústavní
    zákon z 25. 11. 1992 prý „neměl kdo podepsat"); Okamura podle něj „všechno věděl a všechno přiznal",
    ale vymlouvá se — politiku dělá „jako výdělečnou činnost" a SPD s 15 poslanci by mohla Babiše přinutit,
    „ale ono se jim nechce".'
