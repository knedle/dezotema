- id: zitko-2026-09-15-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Smrt poslance Jaroslava Pašky připisovaná vakcinaci — kritika slovenských „odborníků" a SÚKL
  text: |-
    Zítko sdílí a komentuje video o úmrtí Jaroslava Pašky — bývalého slovenského ministra školství, europoslance a místopředsedy SNS — v přímé souvislosti s covidovou vakcinací. Vinu klade slovenským „odborníkům" a veřejným tvářím kampaně (mj. Sabaka, Krčméry, Mikas, Jarčuška, Salaj, Bražinová, Čaputová, Heger, Matovič, Lengvarský), kteří vakcínu prezentovali jako bezpečnou a „svobodu" — a požaduje, aby všichni jmenovaní stanuli před vojenským tribunálem a vysvětlili, kolik na testech a vakcínách vydělali. Odpovědnost za selhání hlásení nežádoucích účinků a úmrtí připisuje řediteli SÚKL Ireně Storové, kterou označuje za „spolupachatelku masových vražd, genocidy národa a sterilizace lidí" — s odkazem na data ÚZIS o poklesu porodnosti o 30 % u 1,3 mil. žen v produktivním věku.

    ⚡ **Poznámka:** Kauzální souvislost úmrtí Jaroslava Pašky s covidovou vakcinací není v přepisu doložena nezávislým zdrojem, jde o tvrzení sdíleného videa.
  osoby:
  - osoba: irena-storova
    vztah: negativni
    kontext: Ředitelka SÚKL — označena za „spolupachatelku masových vražd, genocidy národa a sterilizace
      lidí" za neplnění dohledové funkce
  podtema: Slovenský poslanec Jaroslav Paška a selhání SÚKL (Zítko, 15. 9. 2026)
- id: zitko-2026-09-15-02
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Aaron Rodgers (hráč NFL): covid jako „test poslušnosti", ne veřejné zdraví'
  text: |-
    Zítko cituje výrok amerického fotbalisty Aarona Rodgerse, který covidová opatření popisuje jako „celosvětový multimiliardový psychologický projekt" s cílem zjistit, jak rychle se lidé vzdají vlastního úsudku, práce, vzdělání dětí a práva říct ne — s tím, že 85 % lidí „vyhovělo" a nechalo se očkovat. Rodgers dále v citaci označuje Anthonyho Fauciho za „zločince a masového vraha, pachatele genocidy a sterilizace".

    > „Cílem nebylo veřejné zdraví. Cílem bylo změřit, jak rychle se lidé vzdají svého úsudku, své práce, vzdělání svých dětí a svého práva říci ne." — Aaron Rodgers (citováno Zítkem), [Videoportál 15. 9. 2026](/zdroje/2026-09.md#2026-09-15_zitko_videoportal-15-9-2026)
  podtema: Slovenský poslanec Jaroslav Paška a selhání SÚKL (Zítko, 15. 9. 2026)
- id: zitko-2026-09-15-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Sdílený text „vylhaný svět": Darwinova teorie, dinosauři, atomové zbraně a vesmír jako podvod
    (Zítko, 15. 9. 2026)'
  text: |-
    Zítko čte a sdílí německy psaný text (autorka „Barbara Pražská"), který shrnuje devět tezí o systematicky zfalšovaných dějinách a vědě: peníze jsou nástrojem kontroly energie lidí, dinosauři nikdy neexistovali, jídlo je úmyslně kontaminováno, lidstvo bylo/je pod nadvládou „kabaly", atomové zbraně jsou podvod („Schwindel"), vesmír je fake a NASA na této lži masivně vydělává, dějiny jsou zmanipulované a vylhané, a na vrcholu „pyramidy" moci stojí jezuité se symbolem vševidoucího oka. Text tyto teze prezentuje jako důsledek stejného mechanismu klamání, jaký Zítko dlouhodobě popisuje u covidu (viz [Původ a povaha pandemie](/temata/covid-vakciny/2026.md#zitko-2026-03-27-01)).

    ⚡ **Poznámka:** Jde o cizí text, který Zítko sdílí a schvaluje bez vlastního rozšíření o důkazy; jednotlivé teze (neexistence dinosaurů, atomových zbraní) jsou v přímém rozporu s vědeckým konsensem i historickými záznamy (jaderné testy, trinitit).
  podtema: Historické konspirační výklady
