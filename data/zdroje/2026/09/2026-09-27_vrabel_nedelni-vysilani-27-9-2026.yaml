    prostoru a sestřelem, po němž do dvou hodin přijde stav ohrožení, článek 5 a zavřené hranice.
  citace:
  - text: Podle mojho názoru je ten konflikt nevyhnutelný.
  predikce:
    horizont: neurčeno („každým dnem")
    stav: ceka
