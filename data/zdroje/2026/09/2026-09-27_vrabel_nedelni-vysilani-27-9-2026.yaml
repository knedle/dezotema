  nadpis: 'Chemtrails: sypání těžkých kovů do atmosféry; větrníky 60 kg nanočástic (Vrabel, 15. 5. 2026)'
  text: '**27. 9.** — „Blázen je ten, kdo o tom nechce mluvit"; nad Srbskem chemtrails prý skoro nevidí,
    od maďarské hranice je „celá Evropa posypaná".'
  podtema: Historické konspirační výklady
- id: vrabel-2026-09-27-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Jídlo jako otrava a ovlivňování počasí — „rozemletí červi", fluor, GMO rajčata; déšť po zničení
    amerických radarů v Íránu (Vrabel, 27. 9. 2026)
  text: Vrabel tvrdí, že lidem připadá normální, že „nám sypou červy rozemletý do jídla", fluor do zubní
    pasty a vody a geneticky upravená rajčata, která „po dešti byla jak nová"; pečivo v ČR má prý „divnou
    chuť" a v Nizozemsku umírají krávy na léky proti plynatosti, zatímco se farmy vykupují (v Srbsku je
    podle něj GMO zakázané). K ovlivňování počasí uvádí, že v Íránu „vyhodili do povětří americké radary
    a najednou jim začalo pršet" — „když nějaká země nesouhlasí, tak je tam zemětřesení nebo sucho".
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-09-27-06
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: „Donald Trump nepracuje pro Spojené státy" — uzavřením Hormuzu rozbíjí americký systém (Vrabel,
    25. a 27. 9. 2026)
  text: 'Vrabel si „není úplně jistý, že Donald Trump pracuje pro Spojené státy" — spíš podle něj spolupracuje
    na rozpadu systému „Pax Americana": uzavřel Hormuz a Bab al-Mandab a s nimi ropu, plyn, hnojiva a
    amoniak, čímž rozbíjí ekonomiku „just in time" (v Češnovicích u Budějovic prý neprodávají naftu, ve
    Francii je zavřená „asi každá devátá benzinka"). Trump je pro něj horší než Biden: „zabil malý holčičky
    v Íránu", „vyvraždil celou vládu" a „normalizoval vraždění". Současnou vládu Babiše označuje za „vládu
    podvodníků a herců", horší než Fialovu, která byla „krutá, ale rovná".'
  dalsi_zdroje:
