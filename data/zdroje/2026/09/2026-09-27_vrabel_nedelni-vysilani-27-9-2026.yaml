- id: vrabel-2026-09-27-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Fico žádá summit EU kvůli cenám nafty — „cynismus"; jediné řešení je ruská ropa a vystoupení
    z NATO (Vrabel, 23. 9. 2026)
  text: '**27. 9.** — Proč se nekupuje ruská ropa a plyn: podle Vrabela kvůli korupci — i za studené války
    se plyn vozil, dnes se nakupuje přes prostředníky (USA), „aby si na tom nakradli", a „nakonec to vede
    k válce, ta korupce". „Lumpové" Macinka a Babiš pomáhají USA udržet moc kvůli penězům; Macinka „celý
    život nosil tašku Klausovi", jehož syn „hlídá ČEZ".'
  osoby:
