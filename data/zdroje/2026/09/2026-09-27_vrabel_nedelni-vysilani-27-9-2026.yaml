- id: vrabel-2026-09-27-07
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: „Donald Trump nepracuje pro Spojené státy" — uzavřením Hormuzu rozbíjí americký systém (Vrabel,
    25. a 27. 9. 2026)
  text: '**27. 9.** — Vrabel tezi opakuje („podle mě Donald Trump nepracuje pro Spojené státy") a rozšiřuje:
    USA jsou „kopající umírající kobyla", válka na Ukrajině je boj USA s Rusem jako nástupcem multipolárního
    světa a Anglosasové vedou „válku proti Slovanům" jako za druhé světové. K výroku Zelenského o Ukrajině
    jako „velkém Izraeli" připomíná, že obnovu Ukrajiny má na starosti BlackRock — „globalismus a sionismus
    jde ruku v ruce".'
- id: vrabel-2026-09-27-08
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Legální i nelegální migrace je stejná „sebevražda Evropy" — model rotačních pracovních víz;
    kritika Konečné (Vrabel, 22. 9. 2026)
  text: '**27. 9.** — Na dotaz o bezpečnosti v Egyptě Vrabel radí vyhnout se „všem nacistickým a islámským
    státům" (Francie, Británie, Norsko, Švédsko, Egypt) — „v islámské zemi to nikdy není bezpečné"; používá
    rasovou nálepku „čmoudi" a výslovně se za ni neomlouvá.'
- id: vrabel-2026-09-27-09
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel „troubí do války" — ve sporu s Ficem o čl. 5 NATO (Rajchl, 24. 9. 2026)
  text: '**27. 9. (Vrabel)** — K Pavlovu projevu v OSN, že Krym je ukrajinský, Vrabel namítá, že „Krym
    je samozřejmě ruský" a ČR se tím zavazuje podporovat Ukrajinu až do porážky Ruska.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-09-27-10
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa jako „zrada národa" a „ani koruna na Ukrajinu" jako podvod — „posílá se víc
    než za Fialy" (Vrabel, 27. 9. 2026)
  text: 'Vrabel tvrdí, že Babiš porušením slibu zrušit muniční iniciativu (po summitu NATO v Bruselu)
    „zradil český národ": ČR hraje „užitečného idiota", za kterého se schovávají velké země — přes ČR
    jde podle něj přes polovinu veškeré munice — a Rusko si ji tak může vybrat jako terč „výstražné rány".
    Heslo „ani koruna na Ukrajinu" je podle něj podvod: Macinka „svazácky" poslal 140 milionů do PURL
    a Babiš pět dní po jmenování zvedl ruku pro půjčku 90 mld. eur (z toho 60 mld. na zbraně) — ČR za
    dluhopisy EU „nebude ručit, ale bude to platit" přes rozpočet EU; dluhopisy prý ani nebyly vydány,
    protože EU nikdo nechce půjčit, a půjčka nevydrží dva roky, „možná rok". Na Ukrajinu se podle něj
    nyní posílá víc než za Fialy.'
  citace:
  - text: Česká republika za to nebude ručit, ale bude to platit.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-27-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Konkrétní návrh: ČR podle vzoru Srbska — vojenská neutralita + obchod se všemi bloky (Vrabel,
    5. 7. 2026)'
  text: '**27. 9.** — Vojenská neutralita je podle Vrabela „jediná záruka bezpečí"; Vučić je „jediný normální
    politik v Evropě" a Fico prý řekl, že by Slovensku „svědčila neutralita". Pro případ války doporučuje
    jako jediné bezpečné místo Srbsko (neutrální, potravinově soběstačné, s levným plynem a jako jediné
    v Evropě kromě Ruska s hypersonickými zbraněmi).'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-27-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: ČR jako „nepřiznaný protivník" Ruska — konflikt je nevyhnutelný; scénář „za dvě hodiny článek
    5"; „diverzifikace" jako příprava na zničení ruské ropné infrastruktury (Vrabel, 27. 9. 2026)
  text: 'Vrabel tvrdí, že ČR je „nepřiznaný protivník" Ruska — posílá dobrovolníky, drony, letadla L-39,
    granáty a peníze. Rusko podle něj nemůže útočit na infrastrukturu NATO, zatímco Západ ničí tu ruskou;
    pokud to Rusko nezmění, prohraje vyčerpáním, a proto je přímý konflikt „nevyhnutelný" a může začít
    „každým dnem" — stačí sporné narušení vzdušného prostoru a sestřel: „během hodiny se sejdou bezpečnostní
    štáby [...] a během další hodiny vyhlásí stav ohrožení země a uplatnění článku 5" a zavřou se hranice.
    Odstřižení od ruské ropy a plynu („diverzifikace") dávalo podle něj smysl jen tehdy, když Západ plánoval
    zničit ruskou ropnou infrastrukturu, což prý posledních několik měsíců dělá — „to nám neřekli dopředu".
    Za dalšího na řadě považuje Polsko (s odkazem na „Kalergiho" plán) a ČR bude podle něj „islamizovaná
    úplně stejně" jako ostatní západní země, protože Babiš proti migračnímu paktu neudělal žádný legislativní
    krok. Posluchačům, kteří se ptají, kam utéct, říká, že jsou „už půl roku pozdě"; jediné bezpečné místo
    je Srbsko.'
  citace:
  - text: My jsme jejich protivník. Nepřiznaný, ale protivník.
  podtema: Zahraniční aktéři a precedenty
