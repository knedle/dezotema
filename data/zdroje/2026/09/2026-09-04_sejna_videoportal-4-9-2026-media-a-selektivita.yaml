  nadpis: 'Dvojí metr médií: řeší „neopatrnost" Macinky, ne Pšenákovo schválení vraždy (Šejna, 4. 9. 2026)'
  text: Šejna kritizuje, že média po zveřejnění rozhovoru Vojtěcha Pšenáka s Petrem Macinkou natočeného
    na skrytou kameru řeší jen to, jak byl Macinka „neopatrný" — ale ignorují, že tentýž Pšenák dříve
    v rozhovoru schválil vraždu politického aktivisty na opačné straně politického spektra (na otázku,
    zda je dobře, že ho zastřelili, odpověděl, že „mohlo to přijít dřív"). Tvrdí, že média by podobný
    výrok normálně odsoudila jako škodící vlastní straně, ale protože nesedí k „chvilkařskému narativu",
    o něm raději nereferují — viz i samotný výrok zaznamenaný v [stochastickém teroru](stochasticky-teror.md).
