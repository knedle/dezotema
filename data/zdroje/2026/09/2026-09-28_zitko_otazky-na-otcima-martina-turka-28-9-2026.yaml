  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: |-
    **28. 9.–2. 10. — „Čermákiáda" pokračuje (8 vysílání):**
    - **17 otázek otčímovi:** Zítko staví vysílání jako veřejný výslech Čermákova otčíma Martina Turka, který mu odpověděl komentářem („deset řečnických otázek, nula důkazů… soud v Liberci ve čtvrtek 25. 9. pustil Čermáka ven, to je fakt"). Ptá se, proč Turek zveřejnil jen starou fotku a sedm dní nic nového, proč rodina odešla od brány jiným směrem a proč Čermáka nikdo neviděl na pivu v Holíšově; vyzývá diváky, aby otázky hromadně kopírovali na Turkův profil a aby „inkognito, bez ohlášení" vyrazili „obléhat Holíšov" a monitorovat údajné bydliště i Turkovo pracoviště (viz [Stochastický teror](stochasticky-teror.md)).
    - **Falešný profil „Politický vězeň Čermák":** profil i Turek uvádějí den propuštění 25. 9., přestože líčení bylo 24. 9. — podle Zítka „kouzlo nechtěného", z něhož plyne, že profil „na 99 %" spravuje Turek („důkaz proto nemám žádný"). Černohorský podle něj nejprve tvrdil, že profil spravuje Zítko, a pak se mu „velmi teatrálně, nepřesvědčivě" několikrát omluvil a prohlásil profil za pravý — „stoprocentně ti, Jiříku, nevěřím" (⚡ viz [Černohorský, 27.–28. 9.](politicky-system.md#zpoplatněné-vlastenectví-tušl-a-zítko-jako-vyžírači-dárců-vlastní-vysílání-bez-qr-kódu-černohorský-22-9-2026)).
    - **Nové „důkazy" dvojníka:** fotka z vězeňského kurzu „Vězňova cesta" (2024) je podle něj fotomontáž — dva vězni mají „jednu ruku dlouhou" a Čermák „nemá levou ruku vůbec žádnou", tedy se „fixlovalo už tenkrát"; obličej při předávce na hraničním přechodu byl rozmazán, aby se nepoznalo, že figurant „neodpovídá fyziognomii"; jiná barva očí, kalhoty o dvě čísla větší, smích státní zástupkyně a zapisovatelky („tolik chechtání na soudu jsem nikdy neslyšel"); vězeň Pavel Novotný, který Čermáka „potvrdil" v kuchyni, byl podle něj „nasazený". Soudkyni nově jmenuje (Denisa Šmídová) a advokáta Naxeru činí „plně zodpovědným" za pravomocnost trestu; u soudu podle něj chyběl, buď kvůli kampani, do níž zapojil Rajchla, nebo aby nebyl vidět výškový rozdíl.
    - **Marie Šišáková:** ženu, která tvrdí, že s Čermákem hodinu a čtvrt telefonovala, a zveřejnila s ním fotku, označuje za „bývalou zaměstnankyni policie" a „účetní spolku" Jiřího Černohorského; fotka je podle něj montáž „policisty zručného v IT". Černohorského nazývá „jedenáctiletým exotem, který má za cíl rozložit jakékoliv aktivity", a jeho příznivce „mimoni ze sekty".
    - **Originál „v ochraně svědků":** pravý Čermák je podle Zítka „z 99,999 %" v ochraně svědků mimo ČR, „pod kontrolou bílých klobouků", a „přijde a ukáže se v ten pravý čas"; s jednou promilí počítá s jeho smrtí. Na doklad konzistence pouští archivní vysílání z února 2024 (doporučený dopis do věznice, rozporná vyjádření mluvčích Vězeňské služby, hlasová zpráva s devíti „vole" s „přehnaným plzeňským akcentem"); přidává i teorii o prázdné rakvi generála Lučanského.
    - **Obrana proti Turkovi:** k firmě eMedic Development uvádí, že byl jen menšinovým společníkem (aplikace „Doktor do kapsy"), testovací centra provozovala jiná firma; vrchní státní zastupitelství podle něj věc nadržování vrátilo policii jako nedůvodnou, telefony z razie v Doksech mu ale dodnes nevrátili. Od června 2024 na Čermáka nic nevybíral.
    - **Posun u Tušla (30. 9.):** Tušl mu prý napsal, že se mu „začíná zdát, že se bude muset veřejně hluboce omluvit" — Zítko oceňuje, že „se prokoukává".
    - **Uzavření (2. 10.):** „Náš statement je, že jim nevěříme ani slovo, které bude vydáno v souvislosti s Tomášem Čermákem" — očekává, že tajná služba „zaplaví internet" falešnými fotkami Čermáka z hospody.

    > „Tohle prostě nebyl Tomáš Čermák, tohle byl figurant, který byl dvojník podobný s podobnými rysy." — Pavel Zítko, 2. 10. 2026
