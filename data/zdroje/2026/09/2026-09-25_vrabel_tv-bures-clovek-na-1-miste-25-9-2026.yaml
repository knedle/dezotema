  nadpis: „jsme před francouzskou revolucí" — vlády začnou padat
  text: 'Evropa je „před francouzskou revolucí": vlády začnou padat a přijdou velké změny; po válce přijde
    změna systému.'
  citace:
  - text: My jsme v podstatě před francouzskou revolucí teďkon, protože to, že ty vlády začnou padat a
      že se bude, že budou velký změny, to je úplně jasný.
  predikce:
    horizont: neurčeno
    stav: ceka
