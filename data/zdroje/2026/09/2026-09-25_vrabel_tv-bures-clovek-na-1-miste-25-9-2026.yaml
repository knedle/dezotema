- id: vrabel-2026-09-25-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**25. 9. (TV Bureš)** — Cílem shromáždění 3. 10. je podle Vrabela zabránit jakékoli dohodě o
    jaderných zbraních na území ČR (s Francií, Británií, USA „nebo s kýmkoliv"); francouzský „deštník"
    přirovnává ke Kolářovu „radaru v Brdech", který byl ve skutečnosti raketovou základnou. Petra Pavla,
    který o jaderných zbraních mluvil už v roce 2014 jako generál NATO, označuje za „psychopata, který
    všude chce rozdávat jaderné zbraně". Připomíná, že Američané při bombardování Jugoslávie použili munici
    s ochuzeným uranem, což podle něj v 90. letech způsobilo v Srbsku „epidemii rakoviny" — výbuch hlavice
    ASMP by byl „statisíce násobky" horší a zásah skladu by zamořil „celou Českou republiku".'
