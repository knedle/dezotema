  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: '**25. 9. (TV Bureš)** — Nový francouzský zákon podle Vrabela dává policistům „pět důvodů", kdy
    mohou zastřelit občana; „globalistický syndikát" chce lidi zavřít do „digitálního koncentráku" řízeného
    přes AI, poslouchající „krabičky" a digitální měnu, kde by mu mohli říct: „Vrábel, ty moc mluvíš,
    tobě tady strhneme peníze".'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-09-25-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Zelenskyj v Bělehradu — chladné přivítání, Vučić odmítá zbraně (Vrabel, 7. 8. 2026)
  text: '**25. 9. (TV Bureš)** — Vrabel s odkazem na „interní zdroje" přímo ze srbské zbrojovky tvrdí,
    že před dvěma lety česká delegace přemlouvala soukromou srbskou zbrojovku, aby prodala zbraně Čechům
    k přeposlání na Ukrajinu s krytím, že jde o „cvičení ve Francii" — Srbové odmítli; zprávy o srbských
    zbraních na Ukrajině označuje za propagandu. Odmítá i argument (také Ficův), že soukromým zbrojovkám
    nelze dodávky zakázat: když EU dokáže sankcionovat RT, Sputnik a „30 tisíc subjektů" a za šíření RT
    hrozí vězení, může sankcionovat i zbraně — „můžou, jednoduše", jen se nechce. Srbsko podle něj jako
    jediná vojensky neutrální země v Evropě má díky dohodě Vučić–Putin levný plyn, elektřinu 4,5× levnější
    než ČR (mimo lipskou burzu) a od Číny hypersonické rakety.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-25-12
  typ: predikce
  temata:
