vyroky:
- id: vrabel-2026-09-25-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**25. 9. (TV Bureš)** — Cílem shromáždění 3. 10. je podle Vrabela zabránit jakékoli dohodě o
    jaderných zbraních na území ČR (s Francií, Británií, USA „nebo s kýmkoliv"); francouzský „deštník"
    přirovnává ke Kolářovu „radaru v Brdech", který byl ve skutečnosti raketovou základnou. Petra Pavla,
    který o jaderných zbraních mluvil už v roce 2014 jako generál NATO, označuje za „psychopata, který
    všude chce rozdávat jaderné zbraně". Připomíná, že Američané při bombardování Jugoslávie použili munici
    s ochuzeným uranem, což podle něj v 90. letech způsobilo v Srbsku „epidemii rakoviny" — výbuch hlavice
    ASMP by byl „statisíce násobky" horší a zásah skladu by zamořil „celou Českou republiku".'
- id: vrabel-2026-09-25-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „1 % globalistů" ovládá 99 % lidí, protože ti raději mlčí — buddhistické vysvětlení lidské pasivity
    reinkarnací ze zvířat (Vrabel, 19. 9. 2026)
  text: '**25. 9. (TV Bureš)** — S odkazem na „profesora Staňka" Vrabel uvádí, že 1 % lidí vlastní 93
    % majetku světa (údaj z doby před pěti lety, dnes prý „mnohem víc") a že covid „byl prostředek pro
    to, jak přesunout majetek od lidí směrem k těm elitám". Rozpad impéria (konec Bretton Woods, úroky
    z amerického dluhu přes bilion dolarů ročně) je podle něj „vždycky provázený válkou".'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-09-25-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Vyhráli jsme brand, ne program" — heslo „Česko na prvním místě" z demonstrací 2022 převzali
    Babiš a Okamura; Babiš jako „cizinec" zakázal referendum; „jsme před francouzskou revolucí" (Vrabel,
    25. 9. 2026)
  text: 'V pořadu TV Bureš (propagace shromáždění „Člověk na prvním místě" 3. 10.) Vrabel tvrdí, že demonstrace
    z roku 2022 prosadily do politiky heslo „Česká republika na prvním místě" — Babiš jezdil v dodávce
    s nápisem „Česko na prvním místě" a Okamura s „falešnou koalicí" SPD–PRO–Trikolóra–Svobodní ho používal
    denně —, ale politici převzali jen „brand", ne program (ropa a plyn z Ruska, potravinová soběstačnost,
    svoboda slova, vystoupení z EU, NATO a WHO). Babiše, který „není žádný rodilý Čech", označuje za „cizince
    v naší vládě", jenž „nám Čechům zakázal" rozhodnout referendem o vystoupení z EU, v rozporu s ústavním
    principem, že zdrojem moci je lid. Lidé jsou podle něj „ukolíbaní" odchodem Fialy, ale „jsme v podstatě
    před francouzskou revolucí" — vlády začnou padat. Válka podle něj vyžaduje umlčet odpůrce: „čím blíž
    jsme k té válce, tím méně svobody"; připomíná Čapka, kterého „utírali", a Goebbelsovu práci se strachem
    — k moci se dostávají ti, kdo opakují lež, že „Rusko je agresor".'
  citace:
  - text: My jsme vyhráli ten brand Česká republika na prvním místě [...] ale nevyhráli jsme to, co se
      za tím skrývá.
  - text: Prostě ta lež se vezme, postaví se takhle a řekne se, kdo nebude opakovat tu lež, toho zastřelíme.
      A kdo bude s náma opakovat tu lež, tomu dáme kus kořisti.
  podtema: Politická kultura
- id: vrabel-2026-09-25-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: '**25. 9. (TV Bureš)** — Nový francouzský zákon podle Vrabela dává policistům „pět důvodů", kdy
    mohou zastřelit občana; „globalistický syndikát" chce lidi zavřít do „digitálního koncentráku" řízeného
    přes AI, poslouchající „krabičky" a digitální měnu, kde by mu mohli říct: „Vrábel, ty moc mluvíš,
    tobě tady strhneme peníze".'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-09-25-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Zelenskyj v Bělehradu — chladné přivítání, Vučić odmítá zbraně (Vrabel, 7. 8. 2026)
  text: '**25. 9. (TV Bureš)** — Vrabel s odkazem na „interní zdroje" přímo ze srbské zbrojovky tvrdí,
    že před dvěma lety česká delegace přemlouvala soukromou srbskou zbrojovku, aby prodala zbraně Čechům
    k přeposlání na Ukrajinu s krytím, že jde o „cvičení ve Francii" — Srbové odmítli; zprávy o srbských
    zbraních na Ukrajině označuje za propagandu. Odmítá i argument (také Ficův), že soukromým zbrojovkám
    nelze dodávky zakázat: když EU dokáže sankcionovat RT, Sputnik a „30 tisíc subjektů" a za šíření RT
    hrozí vězení, může sankcionovat i zbraně — „můžou, jednoduše", jen se nechce. Srbsko podle něj jako
    jediná vojensky neutrální země v Evropě má díky dohodě Vučić–Putin levný plyn, elektřinu 4,5× levnější
    než ČR (mimo lipskou burzu) a od Číny hypersonické rakety.'
  podtema: Zahraniční aktéři a precedenty
