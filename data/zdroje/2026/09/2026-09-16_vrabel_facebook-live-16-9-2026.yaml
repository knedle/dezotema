  temata:
  - valka-nato-rusko
  nadpis: 'Lavrov: útok na Evropu by vedl k „velmi krátké" válce; ruská rozvědka tvrdí, že EU plánuje
    konfrontaci s Ruskem do 2030 (Vrabel, 9. 9. 2026)'
  text: '**16. 9.** — Vrabel k opakovanému Lavrovovu varování (tentokrát na Mezinárodním festivalu mládeže
    v Jekatěrinburgu) tentokrát nesouhlasí s tím, že by případná válka byla „krátká": očekává, že pokud
    by k útoku na Rusko došlo, potáhla by se „do posledního Evropana", stejně jako válka na Ukrajině pokračuje
    „do posledního Ukrajince" — Lavrovovo „krátká" čte jako záměrnou výhrůžku rychlým použitím zvlášť
    ničivých zbraní, ne jako věcnou předpověď délky konfliktu. V téže souvislosti srovnává rychlost eskalace:
    od majdanu (2013, kdy šlo o „patření na západ") k otevřenému konfliktu uplynulo na Ukrajině 8 let
    (2014–2022); od nástupu Petra Fialy s heslem „patříme na západ" (2021) uplynulo do dneška jen 5 let
    — z čehož usuzuje, že podobný proces v ČR postupuje podstatně rychleji než na Ukrajině.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-16-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Hašim Tači odsouzen na 25 let za válečné zločiny — UÇK, americký soudce a vynechání zločinů
    vůči Srbům (Vrabel, 16. 9. 2026)
  text: 'Zvláštní soud pro Kosovo v Haagu odsoudil bývalého kosovského prezidenta a premiéra Hašima Tačiho
    na 25 let vězení za vraždy, mučení, kruté zacházení a nezákonné věznění — spolu s dalšími třemi bývalými
    představiteli UÇK (dostali 18 a 23 let). Vrabel k tomu podává vlastní historický výklad: UÇK byla
    polovojenská teroristická organizace založená Albánií, USA ji vedly na seznamu teroristických organizací,
    než v roce 1999 (v rámci rozbíjení Jugoslávie) začaly s Tačim a UÇK spolupracovat a bombardovaly Srbsko
    — po vzniku samostatného Kosova pak Tači jako premiér a prezident nechával unášet, mučit a fingovaně
    popravovat vlastní albánskou politickou opozici. Zdůrazňuje, že tribunál (jiný soud než ICTY, který
    soudil Miloševiče/Mladiće/Karadžiće) odsoudil Tačiho výhradně za zločiny spáchané na vlastních Albáncích,
    nikoli za zločiny vůči Srbům, Romům či za obchod s orgány (viz [Nelegální obchod s lidskými orgány
    — Kosovo, Ukrajina](../konspirace.md#nelegální-obchod-s-lidskými-orgány--kosovo-ukrajina-vrabel-27-7-2026))
    — což vysvětluje poměrně mírný trest (25 let, po odečtení vazby a dobrého chování odhaduje reálný
    pobyt kolem osmi let). Za příčinu mírnosti označuje i to, že řízení vedl americký soudce, jmenovaný
    bývalou šéfkou personálu Evropské unie — s narážkou na dřívější předání dolů a telekomunikací v Kosovu
    americkým firmám po skončení konfliktu.'
  osoby:
  - osoba: hasim-taci
    vztah: negativni
    kontext: 'Bývalý prezident Kosova, velitel UÇK — odsouzen na 25 let za vraždy a mučení vlastní albánské
      opozice; Vrabel: mírný trest kvůli americkému soudci a vynechání zločinů vůči Srbům/obchodu s orgány'
