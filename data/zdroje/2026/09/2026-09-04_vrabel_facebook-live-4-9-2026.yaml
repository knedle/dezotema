  nadpis: 65% šance na neúspěch mírových jednání USA–Rusko–Ukrajina
  text: V souvislosti s chystanou cestou Witkoffa a Kushnera do Moskvy a Kyjeva Vrabel odhaduje na 65
    % pravděpodobnost, že současná mírová jednání nepovedou k úspěchu — čeká, že Rusko odmítne příměří
    bez záruk, že ho Západ nevyužije k přezbrojení Ukrajiny (odkazuje na obdobné zablokování dohody v
    Istanbulu 2022).
  citace:
  - text: Já myslím si, že 65 % pravděpodobnosti je, že mírová jednání nedopadnou dobře.
  predikce:
    horizont: nejbližší týdny (víkendová jednání, 4.–7. 9. 2026)
    stav: potvrzeno
    vyhodnoceni:
    - datum: 2026-11-20
      text: zářijová jednání k míru nevedla a dohoda nevznikla ani do 20. 11.
      stav: potvrzeno
    - datum: 2026-11-20
      text: Zelenskyj 6. 9. odmítl územní ústupky a Abú Zabí v listopadu přineslo jen výměnu zajatců.
