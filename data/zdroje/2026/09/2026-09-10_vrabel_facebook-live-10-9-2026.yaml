- id: vrabel-2026-09-10-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Írán předán Radě bezpečnosti OSN — Vrabel: předvolební divadlo pro Trumpa (10. 9. 2026)'
  text: 'Rada guvernérů Mezinárodní agentury pro atomovou energii (23 z 35 hlasů) rozhodla předat íránský
    jaderný spis Radě bezpečnosti OSN pro dlouhodobou nespolupráci Teheránu při objasňování nálezů uranu
    na nedeklarovaných místech — otevírá to možnost nových sankcí, ač Írán svůj program označuje za mírový.
    Vrabel opakuje svou dlouhodobou tezi: Rusko a Čína (které mají v Radě bezpečnosti právo veta) tvrdí,
    že Írán svou dřívější dohodu plnil bezchybně a nemá vojenský jaderný program, zatímco západní většina
    v Radě guvernérů prosadila předání věci OSN, aby vytvořila politický a mediální tlak ospravedlňující
    dřívější americký útok na Írán před listopadovými volbami v USA. Předpokládá, že než se věc v OSN
    skutečně projedná, budou už americké volby za námi a Rusko s Čínou návrh v Radě bezpečnosti „smetou
    ze stolu" vetem — celé je to tedy podle něj jen „mediální příběh".'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-10-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Malé modulární reaktory naráží na nedostatek obohaceného uranu — sankce na Rusko (Vrabel, 29.
    7. 2026)
  text: '**10. 9.** — K oznámení Státního úřadu pro jadernou bezpečnost, že povolil ČEZ zavést americké
    palivo Westinghouse do prvního bloku Temelína (odstávka na konci roku), a k vyjádření generálního
    ředitele ČEZ Daniela Beneše, že jde o „diverzifikaci dodávek a posílení energetické bezpečnosti",
    Vrabel ostře nesouhlasí: připomíná, že reaktory jsou konstruovány na ruské palivo a americké palivo
    Westinghouse v nich už dříve nefungovalo (rusové museli osobně vyměňovat vadné palivové články). Termín
    „diverzifikace" odmítá jako zavádějící — skutečná diverzifikace rizik by znamenala mít víc zdrojů
    současně, ne nahradit fungující ruské palivo nespolehlivým americkým; žádá Benešovo odvolání. Dodává,
    že podle komentářů, které četl na Facebooku pod zprávou o Westinghouse, velká část veřejnosti sdílí
    jeho kritický názor, ale bojí se ho vyjádřit nahlas — což čte jako důkaz, že český národ ve skutečnosti
    chápe, co se děje, jen na mainstreamových platformách (Seznam, iDNES, Novinky, ČT) jsou takové komentáře
    systematicky blokovány.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-09-10-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Zatčení „klimatického extremisty" v Německu jako signál blížícího se rozpadu Západu a občanské
    války v Evropě (Vrabel, 10. 9. 2026)
  text: Německá policie zadržela v obytném voze 48letého muže s poznámkami vytipovávajícími přes 160 cílů
    útoků na elektrickou infrastrukturu — vyšetřovatelé jeho motiv spojují s odporem k fosilním palivům,
    v souvislosti se sérií sabotážních útoků na rozvodny v několika spolkových zemích. Vrabel to dává
    do souvislosti s rétorikou o „hoření planety" (zmiňuje předsedu Valného shromáždění OSN, který mluvil
    o „hořících lidech") a tvrdí, že podobná násilná radikalizace bude čím dál častější, protože se „západní
    systém" ekonomicky i řídicí rozpadá a snaží se udržet mocí formou „digitálního koncentráku" (digitální
    měna, kamery, sledování, umělá inteligence). Jako doklad uvádí zatčení Tomáše Hrdličky na demonstraci
    za nošení odznaku s písmenem „Z" a rostoucí protesty po celé Evropě (Řecko, Španělsko, Británie, Irsko)
    — s výjimkou ČR, kde plánuje totéž „napravit" veřejným shromážděním 3. 10.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-09-10-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Německo chce Ukrajině předat data o ukrajinských uprchlících (Vrabel, 10. 9. 2026)
  text: |-
    Německý ministr zahraničí Johann Wadephul se podle Vrabela vyjádřil ve zprávách v tom smyslu, že se pokusí zajistit Ukrajině data o tom, kteří ukrajinští uprchlíci se nacházejí v Německu. Vrabel to čte jako signál, že podobně jako ukrajinské jednotky TCK a v poslední době i policie „loví" mobilizační věkové ročníky přímo na Ukrajině, totéž by se mohlo rozšířit i do Německa vůči tam žijícím Ukrajincům — což vnímá jako důkaz, že Ukrajině dochází vojáci a Evropa jí v hledání dalších pomáhá.

    ⚡ **Poznámka:** Přesné znění a kontext vyjádření Johanna Wadephula nelze z přepisu ověřit.
- id: vrabel-2026-09-10-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Trumpova "dividenda" 5000 dolarů voličům republikánů jako úplatek a rozklad demokracie (Vrabel,
    10. 9. 2026)
  text: Vrabel reaguje na Trumpův slib, že pokud republikáni v listopadových volbách udrží kontrolu nad
    Kongresem, dostane každý dospělý Američan jednorázově 5000 dolarů (tzv. „Trumpova dividenda", odhadované
    náklady přes 1 bilion dolarů, financování nespecifikováno; viceprezident Vance naznačil, že nejbohatší
    by platbu nemuseli dostat). Vrabel to označuje za přímý útok na demokratický systém — volby mají být
    rozhodováním na základě volebních programů, ne slibem hotovostní platby podmíněné výsledkem voleb,
    kterou navíc zaplatí sami daňoví poplatníci z veřejného rozpočtu (ne Trump ze svého). Přirovnává to
    k přímému kupování hlasů a navrhuje za to Trumpovi trest v podobě nucených prací (elektronický kotník,
    zametání ulic), nikoli vězení. Rozlišuje to od legitimních politických slibů (např. zvýšení důchodů)
    tím, že podmínka „volte nás a dostanete peníze" je bezprostřední úplatek, ne systémová změna prosazovaná
    v rámci volebního programu.
  podtema: USA — volební systém
- id: vrabel-2026-09-10-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Novela stavebního zákona rozšiřuje vyvlastňování ve prospěch soukromých investorů (Vrabel, 10.
    9. 2026)
  text: 'Poslanecká sněmovna po přehlasování Senátu schválila novelu stavebního zákona zjednodušující
    a urychlující povolování energetických staveb a infrastruktury (Senát ji v srpnu odmítl jako problematickou).
    Vrabel upozorňuje na klíčovou změnu: možnost vyvlastnění majetku za náhradu, dříve vyhrazená jen pro
    skutečně veřejný zájem, se nově rozšiřuje i na velké soukromé investiční projekty (např. výstavbu
    obchodních komplexů nebo bytových domů) — vlastníci sice dostanou finanční náhradu, ale o nemovitost
    mohou přijít proti své vůli ve prospěch developerského záměru. Kontrastuje to s dřívější praxí (osobní
    zkušenost z zastupitelstva Českých Budějovic), kde město o odkup pozemků pro obchvat jednalo s majiteli
    garáží přes rok, aby se vyvlastnění vyhnulo. Zákon podporují podle Vrabela všechny parlamentní strany
    kromě hnutí ANO, protože jde o skupiny osobně propojené se stavebními zájmy ODS.'
  podtema: USA — volební systém
- id: vrabel-2026-09-10-07
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Zemské volby v Sasko-Anhaltsku — AfD s přes 40 % může poprvé vytvořit samostatnou vládu (Šejna,
    5. 9. 2026)
  text: '**10. 9.** — Vrabel referuje o diskuzi v Bruselu o možném zmrazení části z ~295 mld. eur unijních
    fondů pro Německo (na školy, infrastrukturu, zdravotnictví), pokud by AfD po případném celostátním
    vítězství vytvořila vládu jednající v rozporu s evropským právem — analogie s dřívějším zmrazením
    fondů pro Maďarsko. Na rozdíl od Maďarska (malá země bez páky) by ale takové vydírání vůči Německu
    podle Vrabela nemohlo fungovat: Německo je čistým plátcem do rozpočtu EU (platí víc, než dostává)
    a jako 80milionová největší ekonomika unie by při hrozbě odchodu z EU dokázalo Brusel „porazit" —
    proto usuzuje, že jde spíš o vyhrožování konkrétní spolkové zemi po dohodě s kancléřem Friedrichem
    Merzem, ne o skutečný nátlak EU, s cílem zastrašit německé voliče před volbou AfD.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-09-10-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Evropu u mírových jednání budou zastupovat Německo, Británie a Francie — teorie o anglosaských
    globalistech proti Slovanům (Vrabel, 16. 8. 2026)
  text: '**10. 9.** — Vrabel tutéž tezi opakuje obecněji: evropští politici (jmenuje znovu Merze jako
    bývalého šéfa BlackRock Deutschland, i Macrona kvůli manželčině vzhledu) podle něj nejednají z vlastní
    vůle, ale na příkaz „chazarských elitářských rodin", které usilují o dlouhodobé ekonomické zeslabení
    a etnické promíchání Evropy prostřednictvím migrace a války — beze změny oproti 16. 8.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-09-10-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Dron u Zelenského letadla cestou na pohřeb norského krále — pochybnosti o autenticitě (Vrabel,
    10. 9. 2026)
  text: |-
    Norský premiér Jonas Gahr Støre bez podrobností uvedl, že letadlo s Volodymyrem Zelenským málem zasáhl dron při úterním odletu z Moldavska do Norska (cesta na pohřeb zesnulého krále Haralda V.) — zdroj z kanceláře Zelenského výrok zlehčil jako obecný letecký poplach bez skutečného ohrožení, Moldavsko incident popírá. Vrabel k tomu jen letmo poznamenává, že to považuje za možnou snahu Zelenského upoutat pozornost na sebe a médií mít „zajímavý titulek", bez dalšího rozvíjení. Doplňuje pozorování, že komentáře pod českými zpravodajskými články k tématu byly téměř výhradně ve stylu „škoda, že ho to netrefilo" — což čte jako důkaz, že v ČR už není nikdo, kdo by Zelenskému fandil (viz i navazující pozorování o cenzuře komentářů níže).

    ⚡ **Poznámka:** Incident ani jeho zlehčení Zelenského kanceláří nelze nezávisle ověřit.
  podtema: Vyjednávání a mír
- id: vrabel-2026-09-10-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Witkoff a Kushner míří (poprvé letadlem) i do Kyjeva — Vrabel dává 65 % šanci na neúspěch jednání
    (4. 9. 2026)
  text: '**10. 9.** — Mluvčí Bílého domu Anna Kellyová zprávu Financial Times popřela: žádné změny se
    neplánují, Trump nadále důvěřuje Witkoffovi a Kushnerovi, a Financial Times článek zveřejnil dřív,
    než Bílý dům mohl reagovat na jeho dotazy (Trump list označil za „bulvár"). Vrabel to interpretuje
    jako útok na Witkoffa od proukrajinské skupiny, která si s ním (na rozdíl od jeho dobrých vztahů s
    Lavrovem a Putinem) nepřeje pokračování mírových jednání.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-10-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trumpovo vysvětlení války „osobní nevraživostí" Putina a Zelenského jako „rétorika pro primitivy"
    (Vrabel, 10. 9. 2026)
  text: 'K vyjádření Donalda Trumpa, že hlavní překážkou mírové dohody je osobní nevraživost mezi Vladimirem
    Putinem a Volodymyrem Zelenským, Vrabel odmítá tento rámec jako zavádějící „rétoriku pro primitivy"
    — analogický k narativu, že za válkou stojí Putinova osobní diktátorská povaha. Souhlasí s Trumpem
    jen v tom, že Putin dohodu chce, ale zdůrazňuje, že Rusko usiluje o tutéž dohodu už od minských jednání
    (2014–2015): zajištění práv ruskojazyčného obyvatelstva Ukrajiny (jazyk, kultura, náboženství) a absence
    vojenského ohrožení Ruska — pokud by tyto podmínky byly splněny diplomaticky, „speciální vojenská
    operace" by nebyla nutná; pokud ne, Rusko je dosáhne vojenskou cestou. Opakuje Lavrovovo varování,
    že případná válka s Evropou (na rozdíl od „opatrné" operace na Ukrajině, šetřící „slovanské bratry")
    by byla vedena bez omezení a mohla by vést ke zmizení až 80 % evropské populace — sám ale pochybuje,
    že by taková válka byla „velmi krátká", jak Lavrov tvrdí, protože zoufalé evropské elity budou tlačit
    na mobilizaci celého kontinentu.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-10-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: V4 summit v Bratislavě — Tuskovo varování od CIA a Babišovo nadšení z „obnovené" V4 (Vrabel,
    10. 9. 2026)
  text: 'Na jednání zemí Visegrádské skupiny v Bratislavě (za účasti irského premiéra Michaela Martina)
    polský premiér Donald Tusk uvedl, že od šéfa CIA Johna Ratcliffa obdržel „poměrně přesnou zprávu"
    o možném vývoji v nadcházejících měsících a že Polsko i celá Evropa musí být připraveny na „různé
    scénáře"; zároveň oznámil, že Polsko s Ukrajinou odvrátilo ohrožení jednoho z hraničních přechodů
    a varoval před dalšími ruskými „provokacemi". Andrej Babiš po jednání vyjádřil nadšení z „obnovené
    silné V4". Vrabel obojí komentuje sarkasticky: Tuskovo vágní „varování o scénářích" považuje za prázdnou
    frázi sloužící k ospravedlnění dalšího zbrojení, a samotnou dnešní V4 popisuje jako sestavu poslušných
    „unijních poskoků" (Babiš, maďarský premiér Péter Magyar) plus Donalda Tuska („jeden z největších
    válečných štváčů") — jediným ještě „přijatelným" politikem v ní je dle něj slovenský premiér Robert
    Fico, o jehož politickém přežití ale pochybuje.'
  podtema: Zahraniční aktéři a precedenty
