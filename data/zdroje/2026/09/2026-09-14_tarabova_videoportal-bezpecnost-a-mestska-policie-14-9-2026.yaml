  nadpis: 'Komunální program bod 4: bezpečnost a městská policie v Liberci (Tarabová, 14. 9. 2026)'
  text: 'Tarabová představuje čtvrtý bod volebního programu, věnovaný bezpečnosti Liberce a městské policii.
    Argumentuje, že bezpečnost nelze řešit „od stolu" — je třeba mluvit se třemi skupinami: obyvateli
    míst pociťovaných jako nebezpečná, řadovými strážníky v ulicích (ne jen vedením městské policie) a
    širší veřejností. Chce zlepšit pracovní podmínky a morálku strážníků, aby svou službu nevykonávali
    jen jako „odbytí hodin procházkami", ale s vnitřním zájmem o bezpečnost — a zdůrazňuje, že mezi strážníky
    jsou rozdíly v kvalitě práce, které je třeba ocenit, ne je „hodit do jednoho pytle". Za jeden z klíčových
    problémů považuje nárůst počtu bezdomovců a lidí užívajících návykové látky, kteří podle ní mají pocit
    „nedotknutelnosti" díky společenské ochraně. Navrhuje také navýšit počet městských strážníků.'
  podtema: USA — volební systém
