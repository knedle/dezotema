  nadpis: Húsíové tvrdí, že ukončili vojenskou kampaň a ovládli Bab al-Mandab (Vrabel, 12. 9. 2026)
  text: Podle svého představitele Husama al-Assada Húsíové oznámili ukončení vojenské kampaně v Jemenu
    s tím, že ovládli část západního pobřeží včetně strategického ostrova Perim v průlivu Bab al-Mandab
    a že lodní doprava nyní probíhá běžně — hnutí chce z kontroly klíčové námořní trasy ekonomicky těžit.
    Vrabel tvrzení o „ukončení" odmítá jako předčasné — podle něj se konflikt na Blízkém východě naopak
    dál rozvíjí a je jen součástí širšího vzorce eskalace (Hormuz, Bab al-Mandab), jehož ekonomické důsledky
    (nedostatek ropy, hnojiv, jídla) se v Evropě plně projeví teprve na podzim a v příštím roce. Klade
    otázku „proč" USA (Trump) rozjely tyto konflikty, když mohly zajistit dostatek ropy i hnojiv bez nich
    — srovnává současnou globální ekonomickou krizi s covidovou pandemií, s tím rozdílem, že tuto krizi
    podle něj lidé vyvolali vědomě, ne nemoc.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-12-03
