  nadpis: Protesty na Slovensku proti otevření izraelské ambasády (Vrabel, 12. 9. 2026)
  text: Tisíce lidí demonstrovaly v Bratislavě proti otevření prvního izraelského velvyslanectví na Slovensku
    — nesly palestinské vlajky a transparenty na podporu Palestiny. Otevření ambasády představuje obrat
    v zahraniční politice vlády premiéra Janši oproti jeho předchůdci Golobovi, který Palestinu uznal
    a zavedl sankční opatření vůči Izraeli, jež Janšova vláda zrušila; opozice kvůli tomu podala návrh
    na Janšovo odvolání. Vrabel k tomu jen krátce a sarkasticky poznamenává obavu, aby lidé „nakonec nebyli
    všichni buď mrtví, nebo obřezaní".
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-12-05
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Nord Stream 2 žaluje EU u ESD; Litva/Estonsko/Polsko chtějí úplný zákaz ruské ropy — Vrabel:
    řešením je vystoupit z EU (27. 6. 2026)'
  text: '**12. 9.** — Podle Evropského účetního dvora EU neplní svůj plán na omezení závislosti na ruské
    ropě a plynu — dovoz ruského plynu sice výrazně klesl, ale hlavním důvodem podle auditorů nebyl program
    REPowerEU, nýbrž nižší spotřeba způsobená vysokými cenami energií a mírnější zimou; některé státy
    navíc ruský plyn nadále dovážejí ve velkých objemech. Vrabel k tomu dodává, že pokud to EU myslí s
    odstřižením od Ruska vážně, Rusko prostě přesměruje své dodávky do Číny a Indie — a i kdyby později
    chtěla znovu nakupovat, obnovení kontraktů může být obtížné. Zmiňuje, že Jindřich Rajchl veřejně podpořil
    nákup ruského plynu s tím, že si je vědom rizika nenávisti za tento postoj — a ironicky poznamenává,
    že o tomtéž mluví už čtyři roky.'
  podtema: Energetika a Rusko
- id: vrabel-2026-09-12-06
  typ: tvrzeni
  temata:
