  nadpis: Manželka Nicoláse Madura žádá o domácí vězení ze zdravotních důvodů (Vrabel, 12. 9. 2026)
  text: 'Cilia Floresová, manželka bývalého venezuelského prezidenta Nicoláse Madura (oba drženi ve federální
    vazbě v Brooklynu, obviněni z pašování kokainu), požádala amerického soudce o převedení do domácího
    vězení s odkazem na zhoršené srdeční onemocnění vyžadující specializovaný zákrok. Vrabel se ptá, zda
    je vůbec „normální", aby prezident a „prezidentová" suverénní země seděli v americkém vězení — navazuje
    na svou dřívější tezi, že cílem USA je ovládnout venezuelskou ropu prostřednictvím dosazené loutkové
    vlády, a obrací otázku viny: „kdo je tady zločinec — Madurovi, nebo Trump?"'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-12-04
  typ: tvrzeni
  temata:
