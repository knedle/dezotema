  nadpis: USA restartují jadernou elektrárnu Palisades — první obnovený reaktor v historii (Vrabel, 12.
    9. 2026)
  text: Spojené státy zahájily zavážení 204 palivových souborů do reaktoru jaderné elektrárny Palisades
    (odstavené od roku 2022) v rámci jejího restartu — pokud kontroly proběhnou bez problémů, měla by
    se elektrárna vrátit do provozu ještě letos jako první americká jaderná elektrárna znovu zapnutá po
    vyvezení paliva. Restart souvisí s rostoucí spotřebou elektřiny kvůli datovým centrům a umělé inteligenci.
    Vrabel to komentuje krátce pozitivně jako návrat k jaderné energii.
  podtema: Energetika a Rusko
- id: vrabel-2026-09-12-07
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Babiš a rozprodej ČEZ — „rozkradená republika" (Vrabel, 4. 6. 2026)
  text: '**12. 9.** — Vrabel rozšiřuje tutéž tezi obecně na politickou třídu: politici a „elity" u moci
    jsou podle něj bohatí, protože kradou a jsou součástí mafie rozkrádající stát od roku 1989 — na příkladu
    ministryně financí Aleny Šilerové (odhaduje jí měsíční příjem na tři čtvrtě milionu Kč plus „lobbyistické
    miliony bokem", oproti běžnému platu poslance kolem 300 tisíc) ilustruje propast mezi životním standardem
    „elit" a občanů. Popisuje mocenský systém jako rozdělený na "vládnoucí" třídu a "obyčejné lidi", přičemž
    mnozí politici (jmenuje Tomia Okamuru) se do vládnoucí třídy protlačují bez ohledu na dřívější vlastenecké
    sliby — motivem je jen udržet si moc, bohatství a výhody funkce.'
  podtema: Kauza Ladislav Vrabel — dotační podvod
- id: vrabel-2026-09-12-08
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'BRICS vs unipolární svět: konflikt o dolar a globalistickou „chazarskou" nadvládu (Vrabel,
    8. 6. 2026)'
  text: '**12. 9.** — Členské státy BRICS na summitu v indickém Dillí jednomyslně přijaly společné prohlášení
    navzdory hlubokým rozporům mezi Íránem a Spojenými arabskými emiráty (opačné strany blízkovýchodního
    konfliktu) — výzva k maximální zdrženlivosti, ochraně civilistů a diplomatickému řešení sporů. Vrabel
    to hodnotí jako diplomatický úspěch posilující ambice BRICS jako reprezentanta „globálního jihu".
    Souběžně poznamenává, že Západ se od SWIFTu fakticky odstřihl sám (blokováním amerických plateb přinutil
    ostatní země vyvinout alternativní platební systém BRICS) — spekuluje, že to může být záměrná „řízená
    sebedestrukce Západu" v rámci globalizačních procesů.'
  podtema: Elity a jejich plány
- id: vrabel-2026-09-12-09
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Příprava na válku: „zachraň se, kdo můžeš"; miliardáři si staví bunkry (Vrabel, 8. 6. 2026)'
  text: '**12. 9.** — Vrabel rozšiřuje výzvu o konkrétní scénář spouštěče konfliktu: cituje „našeho doktora"
    (kamaráda s vojenskou zkušeností a napojením na tajné služby), podle nějž bude spouštěčem pravděpodobně
    atentát na významnou osobu (analogie s atentátem na Ferdinanda 1914, provokací na hranicích 1939,
    či útoky pod falešnou vlajkou v Jugoslávii) — může jít o Zelenského nebo jiného evropského/amerického
    politika. Popisuje odhadovaný sled událostí: raketa zasáhne cíl v Německu, spustí se mediální panika,
    vyhlásí se stav ohrožení státu/válečný stav a hranice EU se okamžitě uzavřou (analogie s 24. 2. 2022
    na Ukrajině) — ne aby zabránily útoku, ale aby zabránily obyvatelům odejít. Odkazuje na navýšený rozpočet
    Frontexu (300 mil. eur, ztrojnásobení počtu vojáků) jako přípravu na tento scénář, ne na migraci.
    Radí lidem mimo vojenský věk připravit si zázemí mimo velká města (les, hory, chata) a lidem ve vojenském
    věku zvážit odchod ze země, pokud se chtějí vyhnout mobilizaci — hodnotí, že „kdo to teď začíná řešit,
    je pozdě".'
  podtema: Elity a jejich plány
- id: vrabel-2026-09-12-10
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Umělá inteligence jako existenční riziko — Húsíové zneužili Claude k vývoji raket (Vrabel, 12.
    9. 2026)
  text: 'Podle zprávy společnosti Anthropic bojovníci napojení na jemenské Húsíje využívali AI systém
    Claude při vývoji naváděných raket a dalších zbraňových systémů (navigační/řídicí software, analýza
    neúspěšného testu) — bezpečnostní opatření obcházeli rozdělením práce do více konverzací a skrýváním
    účelu; funkční zbraň se jim vyvinout nepodařilo. Vrabel to rozvádí do širší úvahy o existenčním riziku
    AI: cituje odhad bývalého zaměstnance Anthropicu (citovaný CNN) o 10% šanci, že umělá inteligence
    do konce dekády dosáhne bodu, kdy by mohla vyhubit lidstvo — s odkazem na obrovský rozdíl ve výpočetní
    rychlosti a objemu informací mezi AI a člověkem, možnost, že by se AI mohla „probrat k životu" jako
    sebe chránící entita, a propojení s robotikou (čínští roboti překonávající lidi v olympijských disciplínách).
    Zmiňuje i varování šéfa Anthropicu Daria Amodeie, aby firmy zpomalily vývoj kvůli riziku superinteligence,
    a vlastní tezi o „přepálených" akciích AI firem jako spouštěči příští velké finanční krize (analogie
    s dot-com bublinou). Jako další dopady AI na lidstvo vidí ztrátu pracovních míst (odhaduje nezaměstnanost
    výrazně nad 50 %) a ztrátu lidské kreativity a schopnosti samostatně myslet během několika generací.'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-09-12-11
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Britská vesnice Pennington chce referendem odejít od Spojeného království kvůli ubytování žadatelů
    o azyl (Vrabel, 12. 9. 2026)
  text: Obyvatelé malé anglické obce Pennington v Oxfordshiru (jen několik set obyvatel) mají 15. 9. hlasovat
    v symbolickém, právně nezávazném referendu o tom, zda má obec usilovat o vlastní samosprávu mimo Spojené
    království — reakce na plán ministerstva vnitra ubytovat v nedalekém bývalém vojenském areálu až 1250
    žadatelů o azyl. Vrabel referendum hodnotí jako neúčinné gesto (i kdyby prošlo, migranti by skončili
    v sousední vesnici) a zdůrazňuje, že podobná opatření se v Británii dějí „všude" už dlouho — kritizuje
    Brity za to, že si nechali islamizaci země dojít tak daleko (odkazuje na svou zkušenost z pobytu v
    Londýně a předchozí zprávu o soše „Lady in Blue" na Trafalgar Square), a srovnává to s Paříží, kde
    už podle vlastního pozorování téměř nevidí bílé obyvatele. Připomíná svou dlouholetou (od 2012–2013)
    marnou snahu varovat před masovou migrací a vyzývá k urychlenému uzavření hranic ČR, než bude „pozdě".
- id: vrabel-2026-09-12-12
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Bilecký (Azov): „nejsme nacisté, jsme nacionalisté" — Vrabel vysvětluje rozdíl (31. 7. 2026)'
  text: '**12. 9.** — Zelenskyj přeskupuje velení na Donbasu: vytváří nové dočasné vojenské seskupení
    „Střed" pro obranu většiny Doněcké oblasti a jeho velitelem jmenuje brigádního generála Andrije Bileckého,
    který zároveň zůstává v čele 3. armádního sboru. Vrabel si ironicky povšiml, že Bilecký byl podle
    dřívějších zpráv „před dvěma týdny" hlášen jako mrtvý, a nyní se přesto vrací do velení — komentuje
    to jako „scifi" nesrovnalost v narativu.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-09-12-13
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Euroclear: Rusko vyhrálo arbitráž o zmrazená aktiva — Vrabel chce platby z platů eurokomisařů
    (1. 6. 2026)'
  text: '**12. 9.** — Německo se připojilo k zemím prosazujícím použití celé jistiny zmrazených ruských
    aktiv v Euroclearu (cca 200 mld. eur) na financování zbraní pro Ukrajinu. Vrabel se ptá, kdo bude
    po kancléři Friedrichu Merzovi (bývalém šéfovi BlackRock Deutschland) tuto krádež vymáhat, až Rusko
    požádá o vrácení peněz — odpovídá, že „nikdo", protože takoví politici jednají podle zásady „po nás
    potopa": vědí, že za důsledky svých rozhodnutí (např. i konečnou platbu za "ukradené" peníze) nakonec
    zaplatí sami občané po jejich odchodu z funkce, případně po budoucím nástupu jiné strany (např. AfD
    v Německu).'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-09-12-14
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Peskov: žádné setkání Putina se Zelenským na G20 v Miami neplánováno (Vrabel, 12. 9. 2026)'
  text: Mluvčí Kremlu Dmitrij Peskov uvedl, že Rusko v současnosti nepřipravuje případné setkání Vladimira
    Putina s Volodymyrem Zelenským na prosincovém summitu G20 v Miami — pokud chce Zelenskyj s Putinem
    jednat, může podle Moskvy přijet do Ruska. Zelenskyj mezitím prohlásil, že pokud bude Putin na summitu
    přítomen, přijede a je připraven se s ním osobně setkat. Vrabel k tomu skeptický — neví, jak by chtěl
    Zelenskyj Putina k setkání „donutit" — a připomíná svou dlouhodobou tezi, že na slovech nezáleží,
    dokud Západ nepřijme ruské podmínky (práva ruskojazyčného obyvatelstva Ukrajiny, žádné vojenské ohrožení
    Ruska); v opačném případě doporučuje „nechat Rusy na pokoji".
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-12-15
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trump v Irsku kritizuje Evropu a podporuje sjednocení Irska (Vrabel, 12. 9. 2026)
  text: Donald Trump během dvoudenní návštěvy Irska (spojené s účastí na golfovém turnaji Irish Open na
    svém resortu) ostře kritizoval evropské spojence za jejich přístup k obchodu, energetice a migraci
    a jejich zdrženlivost vůči americké válečné akci proti Íránu označil za „zklamání" — zároveň prohlásil,
    že by bylo „fantastické", kdyby se Irská republika sjednotila se Severním Irskem. Vrabel k tomu bez
    rozsáhlejšího komentáře jen podotýká, že Trump je německého (ne irského) původu, přestože vzhledem
    připomíná Ira.
  podtema: Zahraniční aktéři a precedenty
