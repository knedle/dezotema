  nadpis: Dronový útok na saúdský ropovod Východ–Západ (Vrabel, 12. 9. 2026)
  text: Saúdská Arábie dočasně uzavřela strategický ropovod Východ–Západ (1200 km, kapacita 4–5 mil. barelů
    denně, tranzit ale reálně jen kolem 3 mil. barelů/den) po útoku dronů, které podle Rijádu a Bagdádu
    přiletěly z Iráku — jde až o 5 % světové spotřeby ropy. K útoku se nikdo nepřihlásil, Donald Trump
    uvedl, že za ním „určitě" stojí Írán. Vrabel spojuje výpadek s již probíhajícím omezením průlivu Hormuz
    (odhaduje schodek 20 mil. barelů/den) a předpovídá další zdražení pohonných hmot v ČR.
  podtema: Hormuz — aktualizace 6. 5. 2026
