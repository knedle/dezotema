  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**30. 9.** — Vrabel vysílá rozhovor s Tomášem Hrdličkou, který byl ve zrychleném řízení trestním
    příkazem odsouzen k šesti měsícům vězení s podmíněným odkladem na 18 měsíců (a programu „Vnímám i
    tebe") za schvalování válečných zločinů a popírání genocidy kvůli odznaku „Z" v barvách svatojiřské
    stuhy, který podle svých slov nosil jako symbol „osvobození utlačovaných obyvatel Doněcka" po návštěvě
    Doněcka; Hrdlička podává odpor. Vrabel z precedentu viní PRO: Rajchl a Vacek v roce 2023 podali trestní
    oznámení na tři účastníky demonstrace „Česko proti bídě" s nášivkami „Z" a Wagnerovců (pouští Vackovo
    video), a tím prý vytvořili výklad, že „Z" automaticky znamená schvalování válečných zločinů — „Reichel
    je dneska součást vládní moci". O Vackovi říká, že má „poškození minimálně na úrovni humanity".'
  podtema: Trestání politického projevu
