  nadpis: Komunální program „Podpora dětí bez rozdílu" — nerovné financování dětských talentů v Liberci
    (Tarabová, 1. 9. 2026)
  text: 'Tarabová jako kandidátka na primátorku Liberce (komunální volby 2026, strana PRO) představuje
    první bod svého patnáctibodového programu: tvrdí, že liberecký magistrát dnes finančně podporuje především
    děti v tzv. „TOP/VIP" sportovních oddílech, zatímco děti věnující se jiným sportům nebo netolika mediálně
    viditelným talentům (malování, zpěv, hra na hudební nástroj, technické obory) srovnatelnou podporu
    nedostávají. Navrhuje sjednotit městskou finanční podporu pro všechny talentované děti bez rozdílu
    oboru, s odůvodněním, že takto podpořené děti budou vzorem svým vrstevníkům (v kontrastu k trávení
    času s mobilem/tabletem) a že peníze na to lze najít úsporami v rozpočtu magistrátu (viz i její kritika
    předraženého projektu Tržního náměstí).'
