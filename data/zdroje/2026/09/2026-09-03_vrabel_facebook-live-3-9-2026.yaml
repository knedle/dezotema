  nadpis: 'Satirický postřeh: Pavel prý „kopíruje" mluvu Petra Koláře (Vrabel, 3. 9. 2026)'
  text: 'Vrabel si všímá, že bezpečnostní poradce Petr Kolář má nápadně podobný způsob mluvy (tón, „vrčení")
    jako prezident Petr Pavel, a žertem usuzuje, že se tomu Pavel od Koláře naučil — přirovnává to k epizodě
    seriálu Dr. House, kde pacient trpěl nemocí napodobování okolí. Zasazuje to do širší, opakované teze
    o Pavlovi jako „kopírce": jako rozvědčík kopíroval Sovětský svaz, v NATO kopíroval NATO, a nyní kopíruje
    Koláře.'
  osoby:
  - osoba: petr-kolar
    vztah: rozporuplny
    kontext: Satiricky zmíněn jako vzor, od kterého se Pavel „naučil" svůj řečnický styl
  - osoba: petr-pavel
    vztah: negativni
    kontext: Satirický postřeh, že „kopíruje" mluvu Petra Koláře stejně jako dřív kopíroval SSSR a NATO
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-09-03-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Právo veta jako pilíř suverenity — jeho zrušení = konec ČR (Vrabel, 9. 6. 2026)
  text: '**3. 9.** — Vrabel oznamuje vlastní iniciativu: uspořádat petici za vyhlášení referenda o vystoupení
    z Evropské unie. Připomíná, že chystaný zákon o referendu (viz výše, 29. 4.) bude vyžadovat 200–300
    tisíc podpisů a výslovně vyloučí témata EU a NATO — dokud petice za vyhlášení referenda o vystoupení
    z EU neproběhne, nebude to podle nového zákona ani možné. Argumentuje, že SPD má vystoupení z EU v
    programu, ale aktivně za něj nebojuje, a nabízí stranu v tomto tématu „zastoupit". Kritizuje Andreje
    Babiše slovy, že o suverenitě ČR nemá právo rozhodovat „nějaký cizinec" (s odkazem na jeho slovenský
    původ), a slibuje, že pokud se pro vystoupení z EU vysloví ve velké petici/referendu většina občanů,
    musí to být jako demokratický požadavek respektováno.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-09-03-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: |-
    **3. 9. (Vrabel)** — Vrabel se vrací k incidentu jako komentář k reakci ministra zahraničí Petra Macinky, který si předvolal ruskou velvyslankyni Anu Ponomarevovou a odmítl její vysvětlení (že šlo o provokaci sloužící jiným zájmům), přičemž se opřel o německou stranu a vlastní zjištění českých tajných služeb. Vrabel to považuje za ponižující gesto vůči „třináctkrát větší" a historicky významné zemi (připomíná osvobození od nacismu) — přirovnává je k učiteli, který si předvolal do sborovny žáka, a ptá se, zda by si Macinka dovolil stejné gesto vůči americkému velvyslanci. Doplňuje argument o „dvojím metru": drony a rakety používané při útocích na ruská letiště jsou částečně vyráběny v ČR nebo hrazeny z českých peněz (zmiňuje 140 mil. Kč z Macinkova ministerstva na rakety pro Ukrajinu) — útok na civilní letiště označuje sám o sobě za teroristický čin, takže ČR se podle něj sama podílí na terorismu, zatímco nevybuchlý dron u Halle (bez důkazů) se prezentuje jako důvod k předvolávání velvyslanců. Kritizuje také, že Macinka na výročí 2. světové války jel do Německa a vyjádřil se, že je poctěn pozváním.
    K tomu Vrabel líčí facebookovou aféru: aktivista Vojtěch Pšenák (pod falešnou identitou „Tomáš Paukner", údajně odhalující korupci) vylákal Macinku na schůzku s kuklou přes Signál; Macinka poslal svou ochranku pryč, ve studiu byly nalezeny makety střelných zbraní a atrapa výbušného zařízení. Vrabel to označuje za trapas měsíce a poznamenává, že podobný trik zkoušela stejná skupina i na něm (v listopadu 2024 mu nabízeli peníze od „skupiny vlastenců" za rozhovor) — on ale na rozdíl od Macinky zůstal obezřetný a na schůzku nepřijel.
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: Předvolal si ruskou velvyslankyni kvůli Halle (ponižující gesto vůči „velké" zemi); zapleten
      do trapné aféry — na falešný rozhovor s aktivistou Pšenákem přišel s odhalenými maketami zbraní/výbušniny
  - osoba: vojtech-psenak
    vztah: neutralni
    kontext: Aktivista, který pod falešnou identitou „Tomáš Paucner" vylákal Macinku na schůzku; podle
      Vrabela zkoušel podobný trik i na něm samotném (listopad 2024)
  podtema: Zahraniční aktéři a precedenty
