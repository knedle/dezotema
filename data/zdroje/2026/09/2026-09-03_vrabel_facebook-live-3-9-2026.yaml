- id: vrabel-2026-09-03-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Nová unijní regulace hotovosti (AMLR) — plán zbavit lidi hotovosti a úspor, investiční rady
    (Vrabel, 20. 8. 2026)
  text: '**3. 9.** — Vrabel podává obsáhlejší teoretický základ pro totéž doporučení. Vysvětluje konec
    zlatého standardu: od Bretton Woodského systému (1944) byl dolar směnitelný za pevné množství zlata,
    v roce 1971 USA tuto vazbu zrušily a dolar se stal čistě „fiat" měnou (papír bez krytí, jehož hodnota
    stojí jen na důvěře). Tvrdí, že dnešní dolar má už jen 3 % kupní síly dolaru z roku 1971 (milion korun
    uložený tehdy by dnes reálně odpovídal cca 30 tisícům) — důsledek neomezeného tištění peněz americkým
    Fedem (jen v letech 2020–2021 přibylo 40 % veškerých dolarů v oběhu) a rostoucího amerického dluhu
    (40 bilionů USD, splátky úroků převyšují výdaje na zbrojení). Na rozdíl od zlata (jehož množství na
    světě je fyzicky omezené — vešlo by se prý do 3,5 olympijského bazénu) lze fiat peníze tisknout neomezeně,
    což vysvětluje inflaci: podle Vrabela nerostou ceny věcí (zlato si dnes koupí stejné množství zboží
    jako kdykoliv v historii), ale klesá hodnota peněz. Označuje současnou fázi za „plundrování" — termín
    podle něj razí Catherine Austin Fitts (bývalá náměstkyně amerického ministerstva pro bydlení) — které
    má trvat, dokud nepřijde velká krize a následný „velký reset". Opět doporučuje nedržet úspory v hotovosti
    ani v bankách.'
- id: vrabel-2026-09-03-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Stát odmítl odškodnit firmy zničené covidem, fond na obnovu šel jinam
  text: |-
    Vrabel popisuje vlastní zkušenost z doby covidu: jako právník se dotazoval ministerstva (financí, nebo průmyslu), zda stát nahradí škody firmám zavřeným kvůli restrikcím, a dostal písemné vyjádření šéfa právního oddělení, že stát žádné škody vyplácet nebude — místo toho se měly vypisovat dílčí dotační programy. Ke svým žádostem o takovou dotaci byl následně (podle svých slov) odsouzen, protože v žádosti čestně zaškrtl bezdlužnost firem, ačkoli ty ve skutečnosti dlužily na sociálním a zdravotním pojištění (protože v té době musely přednostně platit jiné závazky). Jako konkrétní příklad dopadu uvádí přátele z Českých Budějovic, kteří si těsně před covidem otevřeli obchod s oblečením, po zavření podniku se zadlužili a museli odjet pracovat do Rakouska (jeden dodnes, druhá si při manuální práci zničila záda) — stát se k nim podle Vrabela nikdy nepostavil, přestože o žádnou pomoc ani nežádali.

    Klíčovým bodem kritiky je Národní fond obnovy, který měl být určen k nastartování ekonomiky poškozené covidem. Podle Vrabelova zjištění šlo 40 % prostředků fondu na „zelenou tranzici" (Green Deal) a 20 % na digitalizaci (datová centra, sledování občanů) — místo skutečné pomoci zkrachovalým malým a středním podnikatelům, kteří byli podle něj hlavními poškozenými. Fond si mezitím na svůj provoz dále půjčuje (aktuální dluh fondu odhaduje na výrazně přes 200 mld. Kč). Uzavírá, že velcí podnikatelé jako Andrej Babiš si vždy dokážou pomoci sami, zatímco malí živnostníci zůstali bez odškodnění.
  podtema: Národní fond obnovy — 40 % na Green Deal místo odškodnění zkrachovalých živnostníků (Vrabel,
    3. 9. 2026)
- id: vrabel-2026-09-03-03
  typ: tvrzeni
  temata:
