  nadpis: 'Brněnský pochod: smíření nelze vynutit, válečné reparace jako podmínka — Rajchl (24. 5. 2026)'
  text: '**2. 9.** — Rajchl reaguje na vzpomínkovou akci k 87. výročí zahájení 2. světové války (1. 9.
    1939), na které polský prezident Karol Nawrocki znovu vznesl požadavek na plnou úhradu válečných reparací
    od Německa — Polsko si škody vyčíslilo na 1,5 bilionu eur (cca 30 bilionů Kč). Rajchl kritizuje česká
    média za „ohlušující ticho" k výročí i k polskému požadavku a vyzývá, aby se ČR k polskému nároku
    bez váhání připojila — společný postup považuje za cestu k větší šanci na úspěch. Odhaduje, že i nižší
    česká částka reparací by pokryla minimálně 7 let státního rozpočtu, a navrhuje využít je na investice
    do rozvoje země.'
  osoby:
  - osoba: karol-nawrocki
    vztah: pozitivni
    kontext: 'Vzor: znovu vznesl požadavek na plnou úhradu válečných reparací od Německa (1,5 bil. eur)
      — Rajchl vyzývá ČR, aby se připojila'
  podtema: Podstata dekretů, odsun a smíření
