  temata:
  - politicky-system
  nadpis: Transparentnost místní politiky — kritika nepřehlednosti, návrh podcastů vysvětlujících rozhodnutí
    radnice (Tarabová, 5. 9. 2026)
  text: 'V rozhovoru pro TV Česko Tarabová kritizuje nedostatečnou transparentnost veřejné správy: web
    Poslanecké sněmovny (posl.cz) neumožňuje běžnému občanovi jednoduše sledovat průběh přijímání zákonů
    (hlasování nejsou popsána, je potřeba dohledávat stenoprotokoly), stejný problém má dohledávání smluv
    a rozhodnutí na úrovni místních samospráv — podle ní záměrně, aby se běžní lidé „nepídili". Jako řešení
    navrhuje, aby politici po zvolení pokračovali v komunikaci s občany formou krátkých podcastů a videí
    vysvětlujících konkrétní rozhodnutí rady města (např. velké zakázky), místo aby byli aktivní jen před
    volbami. Jako součást svého programu na primátorku Liberce slibuje intenzivnější a nepřetržitou komunikaci
    s občany po celé čtyři roky mandátu.'
  podtema: USA — volební systém
- id: tarabova-2026-09-05-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Politické strany kandidují v komunálních volbách pod jinými názvy, aby zastřely svou identitu
    (Tarabová, 5. 9. 2026)
  text: Tarabová upozorňuje, že celostátní strany v komunálních volbách často kandidují pod jinými, lokálními
    názvy, aby nebyly na první pohled rozpoznatelné — jako příklad z Liberce uvádí koalici KDU-ČSL a TOP
    09 kandidující pod názvem „Liberecká devítka". Vyzývá voliče, aby si před volbami ověřovali, kdo skutečně
    stojí za konkrétní kandidátkou, zejména pokud jde o politiky, kteří jsou ve funkcích už řadu let (4,
    8, 12 let) bez viditelného přínosu — odkazuje na vlastní příspěvek „Škatulata, batulata, hejbejte
    se", který podobné přesuny stejných tváří pod novými značkami v Liberci mapuje.
  podtema: USA — volební systém
- id: tarabova-2026-09-05-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vlastní politická historie a vstup do strany PRO (Tarabová, 5. 9. 2026)
  text: 'Tarabová popisuje svou politickou dráhu: v roce 2014 podpořila vznik komunálního politického
    hnutí v Chrastavicích a stala se součástí koalice, ale po čtyřech letech byla ze hnutí vyloučena poté,
    co začala nesouhlasit se způsobem fungování. Zpětně to hodnotí jako šťastnou náhodu vzhledem k nadcházejícímu
    covidu — během lockdownů se scházela s dalšími aktivními občany v Liberci (neformální skupina „Pocket
    Spark", později přejmenovaná na „Svobodný Liberec"), z níž vzešli budoucí členové strany PRO. Do politiky
    se vrátila loni na podzim na žádost Jindřicha Rajchla, ale hlavně na žádost této liberecké skupiny,
    která jí dala důvěru — kandidátku PRO pro Liberec postavili samostatně poté, co selhalo jednání o
    koalici s PRO ano.'
  podtema: USA — volební systém
