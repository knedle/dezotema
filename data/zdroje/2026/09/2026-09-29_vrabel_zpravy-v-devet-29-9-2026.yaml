vyroky:
- id: vrabel-2026-09-29-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**29. 9.** — Na dotaz diváka Vrabel s odkazem na nejmenovanou novinářku tvrdí, že jaderná válka
    je „do sedmi hodin ukončená"; omezená válka by mohla zůstat v Evropě („Rusové odpálí pár měst"), jinak
    Rusko s 5–6 tisíci hlavic a Mrtvou rukou zničí celý svět. Zastánci jaderného odstrašení jsou podle
    něj „psychopati" a jediným řešením je dohoda o odzbrojení. Vzorec „není to na stole" (Černochová o
    nuclear sharing 2022–23) podle něj znamená, že to na stole je — Pavel v březnu, Babiš o měsíc později.'
- id: vrabel-2026-09-29-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: „už jediné, k čemu může dojít, je občanská válka"; ČR má ještě šanci „pomoct" 2 milionům
    Ukrajinců vrátit se (Vrabel, 26. 9. 2026)'
  text: '**29. 9.** — K projevu Andyho Burnhama, „premiéra islámské země", Vrabel tvrdí, že Británie je
    dnes „poloislámská" a „za 20–30 let bude něco jako Sýrie"; kdyby tam řekl totéž co v ČR, „zastřelí
    mě hned první den". Londýn by si podle svých slov vybral k bydlení, „kdyby tam nebyli ti muslimové";
    Češi jsou za posledních 20 let „studení, uzavření, nafoukaní". Bývalá pražská jednička Stačilo! podle
    něj chodila na jeho protiislámské demonstrace (2015–16) s Antifou a křičela na ně „nacisté"; migrační
    krize je podle něj záměr politiků „podle vzoru Kalergiho".'
- id: vrabel-2026-09-29-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Bůh je mrtvý a to je ta chyba" — útok nožem ve Stážkově; ministerstvo spokojenosti a „novodobý
    feudalismus" (Vrabel, 29. 9. 2026)
  text: K útoku žáka nožem ve slovenském Stážkově (zemřela učitelka) Vrabel viní násilí v médiích a „nedostatek
    Boha ve společnosti — Bůh je mrtvý a to je ta chyba"; nejrychlejší cestou je podle něj návrat k náboženství
    (sám věří v reinkarnaci). Kdyby vládl, zřídil by podle vzoru Bhútánu ministerstvo zkoumající spokojenost
    lidí a billboardy, „aby lidi milovali svoji zemi". Současný systém podle něj „není demokracie, ale
    oligarchie, novodobý feudalismus", v němž hloupá společnost nechává vládnout „největší psychopaty".
  podtema: Politická kultura
- id: vrabel-2026-09-29-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Passerelle klauzule a kvalifikovaná většina v obraně a migraci — „Anglosasové se rozhodnou,
    Slované mašírují"; „konec České republiky" (Vrabel, 29. 9. 2026)
  text: 'K úvaze Komise o passerelle klauzulích (kvalifikovaná většina v sankcích, lidských právech, obraně
    a daních) Vrabel tvrdí, že jde o „absolutní, zásadní, nevratnou reformu" a krok k federalizaci: EU
    má být „nástupcem původních států" a ČR zůstane „jako kraj, něco jako Bavorsko — jen na mapě namalovaná".
    Malé státy ztratí veto, takže když EU řekne „jdeme do války", budou muset jít — „Anglosasové se rozhodnou,
    Slované mašírují"; v oblasti lidských práv budou velké státy posílat uprchlíky „do slovanských zemí,
    které ještě nejsou úplně zislamizované". Kritizuje „vlastence", kteří chtějí EU reformovat — „ten
    právník tam chce přijít a říct Uršule von der Leyen: teď to budeme dělat jinak" (zřejmě narážka na
    Rajchla).'
  citace:
  - text: Tohle je konec. Konec České republiky. Česká republika zůstane jako na mapě namalovaná.
  podtema: Česká suverenita
- id: vrabel-2026-09-29-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: ČR jako „nepřiznaný protivník" Ruska — konflikt je nevyhnutelný; scénář „za dvě hodiny článek
    5"; „diverzifikace" jako příprava na zničení ruské ropné infrastruktury (Vrabel, 27. 9. 2026)
  text: '**29. 9.** — Po schůzce Babiše s Pavlem (při ruském útoku na Pobaltí čl. 5 a vyslání dvou brigád)
    Vrabel tvrdí, že Babiš porušil slib nikdy neposílat vojáky za hranice — „všechno, co slíbil, už popřel"
    —, spor Hradu se Strakovkou „byla hra" a bezpečnostní politiku teď řídí „generál NATO" Pavel. Vojáci
    jsou podle něj „žoldáci, zaplacení, aby zemřeli"; Polsko má prý už asi 10 000 mrtvých a až jich bude
    10 000 v ČR, „otočí se vnímání". Rozvádí scénář: incident pod falešnou vlajkou → do hodiny bezpečnostní
    rada → stav ohrožení, čl. 5, dvě brigády (6–8 tisíc mužů), zavřené hranice → pokud to do dvou týdnů
    neutichne, mobilizace podle ročníků a „TCK jako na Ukrajině". NATO je podle něj kvůli bombardování
    Jugoslávie 1999 „teroristická organizace — byla, je a pravděpodobně i bude"; USA se mají „stáhnout
    z celého světa domů".'
  citace:
  - text: Jsou to žoldáci [...] Žoldáci v době války prostě jdou umírat.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-09-29-06
  typ: predikce
  temata:
  - migrace
  nadpis: Republika srbská se do 3–5 let spojí se Srbskem; Británie bude za 20–30 let „jako Sýrie"
  text: Do tří, nejpozději pěti let se Republika srbská spojí se Srbskem a vznikne „rozšířené Srbsko";
    Vučić i Dodik vyhrají volby. Británie bude za 20–30 let „něco jako Sýrie".
  citace:
  - text: Očekávám, že do tří let, maximálně do pěti, ale do tří let se spojí Republika Srpská se Srpskem,
      vznikne rozšířené Srpsko.
