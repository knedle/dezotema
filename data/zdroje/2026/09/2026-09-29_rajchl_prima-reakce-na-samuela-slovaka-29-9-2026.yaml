  nadpis: ODS chce „okrást občany" poplatky u lékaře — daně mají platit banky, energetické a zbrojařské
    firmy (Rajchl, 29. 9. 2026)
  text: 'V debatě na Primě s poslancem ODS Samuelem Slovákem Rajchl odmítá návrh, aby pacienti platili
    za návštěvu lékaře: ODS podle něj „jako vždycky chce okrást naše občany" a „už jednou na tom prohrála
    volby, prohraje je po druhé". Sám prý „nezvedne ruku ani pro jeden jediný návrh, který by bral další
    peníze z kapes našich občanů" — vyšší daně mají platit banky, energetické a zbrojařské společnosti,
    které za vlády ODS zvýšily zisky „o stovky procent", zatímco občané přišli o 15 % reálných mezd.'
  citace:
  - text: Vy už jste je odrbali z kůže, jak nejvíc to jenom šlo.
