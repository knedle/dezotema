  nadpis: Podrobný rozbor poslaneckých platů a náhrad — „ať začnou šetřit u sebe" (Černohorský, 28. 8.
    2026)
  text: '**2. 9.** — Černohorský staví platy politiků (opět připomíná Juchelkových 4,141 mil. Kč za rok
    2025) do přímého kontrastu s praxí posuzování invalidních důchodů: čte desítky konkrétních příspěvků
    z facebookové skupiny invalidních spoluobčanů, v nichž lidem v aktivní onkologické léčbě (včetně paliativní,
    tedy nevyléčitelné) posudkoví lékaři snížili invalidní důchod z 3. na 1. stupeň (z cca 16–17 tis.
    na 8–9 tis. Kč měsíčně) s doporučením „najít si přiměřenou práci" — přestože onkologičtí pacienti
    v léčbě mají obvykle nárok na 3. stupeň. Vysvětluje mechanismus posouzení: při souběhu více zdravotních
    postižení (např. amputovaná ruka + psychické potíže) se procenta jednotlivých diagnóz nesčítají, ale
    bere se v úvahu jen nejzávažnější z nich — což může vést k přiznání jen 1. stupně i lidem s kombinací
    vážných postižení. Cituje konkrétní příklad ženy po odebrání invalidního důchodu, která při hledání
    práce dostala od zaměstnavatele odmítnutí kvůli zdravotnímu stavu, a citaci jiné ženy, jež v reakci
    na byrokratické potíže napsala, že jí „zbývá skočit z mostu". Uzavírá otázkou, jak mohli politici
    za 37 let „pracovat pro lidi", když takto zacházejí s nejzranitelnější skupinou obyvatel.'
  podtema: USA — volební systém
