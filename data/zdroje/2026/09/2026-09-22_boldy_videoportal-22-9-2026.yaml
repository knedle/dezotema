  nadpis: „Zombie virus" — incident ve Walmartu jako utajovaný experiment (Boldy, 31. 7. 2026)
  text: '**22. 9.** — Boldy tezi rozšiřuje o „jelení zombie virus": přes 30 (dle něj už 37) států USA
    má kvůli smrtelnému, nevyléčitelnému onemocnění jelenů uzavřené zóny a jeleny odstřelují, aby se maso
    nedostalo do obchodů. Spekuluje, že se nakažené maso už do supermarketů dostalo a že právě to vysvětluje
    dříve zmiňované případy lidí, kteří se „chovali jak zombíci" a jedli syrové maso či kočky. Dodává,
    že nevíme, zda na to nebudou chtít „vymyslet nějakou spasitelskou vakcínu".'
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-09-22-06
  typ: tvrzeni
  temata:
