  nadpis: 'Boldy: 13 vědců zavražděno po odkrytí volné energie (24. 5. 2026)'
  text: '**22. 9.** — Boldy přidává příběh Američana, který měl vynalézt levné palivo z plastu („plastilina,
    gasilina"), jež by stálo „0,0 prd"; muž prý říkal, že má strach, že ho sledují, a poté zmizel. Důvod
    vidí v tom, že rafinerie a korporace nechtějí, aby lidé měli věci, které příroda nabízí „de facto
    zadarmo" — potřebují na lidech „rýžovat" a mít nad nimi kontrolu.'
  podtema: Globalistická agenda a další výklady
- id: boldy-2026-09-22-04
