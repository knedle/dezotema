  nadpis: Krize s vodou a „tokenizace vody" na blockchainu — předpověděl Bill Gates (Boldy, 6. 9. 2026)
  text: '**22. 9.** — Boldy opakuje, že voda „půjde na burzu" a bude tokenizována, a přidává konkrétní
    odhad: vodné a stočné bude za rok či dva stát „stonásobek" dnešní ceny. Znovu cituje (tentokrát jako
    „dočasného německého nástupce" Klause Schwaba ve WEF) výrok, že „voda není pro všechny". Elity („papalaši
    na vrchu") si podle něj přivlastňují vodu i půdu — Bill Gates a další „v uvozovkách farmáři" skupují
    zemědělskou půdu a vodní práva, protože vědí o přicházející krizi, kterou sami způsobují („chobotnice,
    která spolupracuje"). Připomíná Gatesův výrok, že „budou umírat miliardy lidí" — video podle svých
    slov netočí pro strach, ale aby lidi připravil na to, co „pravděpodobně nejspíš přijde". Viz [predikce](predikce.md).'
  podtema: Náboženský a okultní výklad moci
