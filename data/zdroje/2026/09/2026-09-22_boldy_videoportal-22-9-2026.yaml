  nadpis: Válka s Íránem může poslat ropu na 300 USD/barel
  text: '**22. 9.** — Boldy se k predikci vrací: připomíná, že před několika měsíci říkal, že benzín a
    nafta „poletí nahoru" a nebude to jen 50, ale 60–70 Kč za litr (v březnu přitom uváděl rozpětí 70–150
    Kč). Nyní tvrdí, že nafta bude přes 50 Kč za litr — „teď už jsme připraveni" — a podobné zdražení
    čeká i vodu.'
