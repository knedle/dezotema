  nadpis: Zařízení IceCube (Antarktida) vyvolává zemětřesení; kritika hnutí Alatra (Boldy, 19. 7. 2026)
  text: '**22. 9.** — Jako další příklad uvádí nedávný výbuch čtyř sopek v Indonésii, které podle něj
    „absolutně na sebe nenavazujou", což je „až příliš náhodné". Tvrdí, že se „jistými zařízeními" spouštějí
    zemětřesení a narušuje magma v podzemí, což narušuje i podzemní vodu — „proto mizí voda" (propojuje
    s tezí o [vodní krizi a tokenizaci vody](#krize-s-vodou-a-tokenizace-vody-na-blockchainu--předpověděl-bill-gates-boldy-6-9-2026)).'
  podtema: Náboženský a okultní výklad moci
