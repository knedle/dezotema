  nadpis: Zemské volby v Sasko-Anhaltsku — AfD s přes 40 % může poprvé vytvořit samostatnou vládu (Šejna,
    5. 9. 2026)
  text: Šejna upozorňuje na zemské volby v Sasko-Anhaltsku (6. 9. 2026), kde AfD podle průzkumů vede s
    přes 40 % hlasů, daleko před CDU — přitom ještě v roce 2021 volby jasně vyhrála CDU. Pokud by se průzkumy
    potvrdily, byla by to poprvé v historii AfD, kdy by strana získala samostatnou (nikoli koaliční) vládu
    některé německé spolkové země. Šejna to interpretuje jako signál, že velká část Němců chce změnu dosavadního
    politického směru země, a případný výsledek považuje za možný začátek nové politické éry v celém Německu,
    ne jen v jedné spolkové zemi.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
