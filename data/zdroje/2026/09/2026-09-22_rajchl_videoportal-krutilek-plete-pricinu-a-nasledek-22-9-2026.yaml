vyroky:
- id: rajchl-2026-09-22-01
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Strašení válkou kvůli zbrojení, ne zbrojení kvůli strachu — reakce na Krutílka (Rajchl, 22.
    9. 2026)
  text: |-
    V reakci na poslance ODS Jana Krutílka Rajchl tvrdí, že si Krutílek „plete příčinu a následek": evropské státy podle něj nezbrojí proto, aby odvrátily hrozbu války, ale válkou se záměrně straší, aby se mohly zbrojařským korporacím posílat „stamiliardové" částky. Tyto korporace jsou podle něj často sponzory právě těch politiků, kteří o výdajích rozhodují, což považuje za zarážející a za věc, které je třeba se věnovat. Odvolává se na varování Dwighta D. Eisenhowera před vojensko-průmyslovým komplexem jako největším nebezpečím pro demokracii v Evropě i ve světě. Navazuje na své dřívější tvrzení, že EU přesměrovává peníze zbrojním korporacím, které jsou jejími sponzory ([Brusel jako válečný štváč, 12. 5.](/temata/valka-ukrajina-prubeh/2026.md#rajchl-2026-05-12-02)).

    > „Neinvestujeme obrovské prostředky do zbrojení, abychom zamezili strachu z války. Je to přesně obráceně. Straší se válkou, aby se mohlo investovat do zbrojení." — Jindřich Rajchl, popis videa, [Videoportál 22. 9. 2026](/zdroje/2026-09.md#2026-09-22_rajchl_videoportal-krutilek-plete-pricinu-a-nasledek-22-9-2026)
  osoby:
  - osoba: jan-krutilek
    vztah: negativni
    kontext: Poslanec ODS — „plete si příčinu a následek" u zbrojení, prosazuje selhávající taktiku vůči
      Ukrajině; nabídnuta sázka o víno
  - osoba: dwight-d-eisenhower
    vztah: pozitivni
    kontext: Citováno jeho varování před vojensko-průmyslovým komplexem jako největším nebezpečím pro
      demokracii
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: rajchl-2026-09-22-02
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Selhávající taktika" od roku 2022 a sázka o láhev vína na konec války — reakce na Krutílka
    (Rajchl, 22. 9. 2026)
  text: Rajchl vyčítá Janu Krutílkovi (ODS) a jeho „souputníkům", že čtyři a půl roku prosazují „naprosto
    selhávající" strategii vůči válce na Ukrajině, která podle něj vedla k „milionům mrtvých" a velké
    ztrátě ukrajinského území. Ztráty mohly být podle něj mnohem menší, kdyby se „vzal rozum do hrsti"
    už v roce 2022 (tj. kdyby se tehdy jednalo o míru). Krutílkovi nabízí sázku o láhev červeného vína,
    že válka skončí přesně tak, jak dříve předpovídal, protože „jinak ani skončit nemůže" (srov. jeho
    predikce zhroucení Ukrajiny a míru podle aktuální kontroly území — [predikce.md](/temata/valka-ukrajina-prubeh/2026.md#rajchl-2026-07-12-02)).
  podtema: Zahraniční aktéři a precedenty
- id: rajchl-2026-09-22-03
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: válka na Ukrajině skončí tak, jak předpovídal; sázka o víno s Krutílkem
  text: Rajchl opakuje, že válka na Ukrajině skončí „přesně tak", jak dříve říkal (tj. mírem podle aktuální
    vojenské situace / neúspěchem ukrajinské strategie), a nabízí Janu Krutílkovi (ODS) sázku o láhev
    červeného vína.
  citace:
  - text: Já mu teď tady nabízím sázku o dobrou láhev červeného vína, že to skončí přesně tak, jak jsem
      říkal, protože to jinak ani skončit nemůže.
  predikce:
    horizont: neurčeno (konec války)
    stav: ceka
