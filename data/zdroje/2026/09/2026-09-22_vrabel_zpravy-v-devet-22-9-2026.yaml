- id: vrabel-2026-09-22-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: '**22. 9.** — K protestům ve Francii proti zákonu rozšiřujícímu použití zbraně policií („licence
    zabíjet") Vrabel poukazuje na paradox: proti policejnímu násilí protestující jsou brutálně mláceni
    policisty — „to je ta kolébka demokracie". Protesty jsou podle něj všude v Evropě, jen v ČR ne.'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-09-22-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Polské stíhačky zachytily ruský průzkumný letoun nad Baltem — „z komára velblouda" (Vrabel,
    1. 8. 2026)
  text: '**22. 9.** — K eskortě ruského Il-20 polskými stíhačkami 40 km od pobřeží: „to jsou fakt šašci".
    Výrok polského ministra obrany o sestřelování ruských dronů nad Ukrajinou považuje za nesmysl — ruské
    drony mají souřadnice na Ukrajině a do Polska nemíří; Polsko podle něj přesouvá prakticky celou armádu
    na východní hranici a „Poláci pravděpodobně jsou na řadě další".'
  podtema: Zahraniční aktéři a precedenty
