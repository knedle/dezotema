vyroky:
- id: vrabel-2026-09-22-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Írán předán Radě bezpečnosti OSN — Vrabel: předvolební divadlo pro Trumpa (10. 9. 2026)'
  text: '**22. 9.** — K Trumpovu projevu v OSN (Írán si má vybrat mezi válkou a mírem, dohoda až po midterms)
    Vrabel tvrdí, že Trump si chce Írán „podmanit" a že jde o „mnohem horší agresi" než ruskou na Ukrajině,
    protože začala „vyvražděním několika stovek malých dívek" a íránské vlády. Delegace, které opustily
    sál při projevu Netanjahua („Satanyahu"), podle něj reagují oprávněně: Trump slouží „sionistickým
    křesťanům a židům" usilujícím o Velký Izrael a před soudem by měl stát nejen Netanjahu, ale i další
    členové izraelské vlády; Zelenskyj je podle něj „mnohem horší" než Netanjahu, protože „dělá genocidu
    svého vlastního národa".'
  osoby:
  - osoba: benjamin-netanjahu
    vztah: negativni
    kontext: „Satanyahu", před soud s dalšími členy vlády
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-22-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Litva ruší ústavní zákaz jaderných zbraní a cizích vojenských základen (Vrabel, 3. 7. 2026)
  text: '**22. 9.** — K Pavlovu výroku o vlastenectví Vrabel namítá, že vlastenectví je bránit vlastní
    zemi, ne sloužit NATO, a rozmístění jaderných zbraní v Litvě, Finsku či ČR je „akt agrese proti Ruské
    federaci". Připomíná slib nerozšiřování NATO a tvrdí, že v roce 1968 NATO chystalo obsazení Československa,
    proto vojska Varšavské smlouvy musela obsadit bunkry „Javor". Francouzský „jaderný deštník", o němž
    jednají Babiš a Pavel s Macronem, jsou podle něj „krámy" (Rafale, ASMP) — Rusko by pak na ČR zamířilo
    Orešniky, nebo by jeden Kinžál zničil Rafaly i s hlavicemi. Proto svolává shromáždění 3. 10. na Malostranské
    náměstí.'
- id: vrabel-2026-09-22-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Odchod šéfa BIS Koudelky — Vrabel: „dvojitý agent CIA" (25. 7. 2026)'
  text: '**22. 9.** — K rozhovoru Michala Koudelky pro The Guardian, v němž šéf BIS varoval, že ruský
    útok na NATO je „otázkou měsíců", Vrabel tvrdí, že se Koudelka dopustil „minimálně dvou trestných
    činů" — zneužití pravomoci veřejného činitele a šíření poplašné zprávy: informaci prý nesdělil premiérovi
    ani bezpečnostnímu výboru, BIS i Babiš následně popřeli bezprostřední ohrožení ČR, a Koudelka tedy
    „musel vědět, že to není pravda". Staví to do kontrastu s vlastním stíháním za výrok o F-35 a očekává
    stejný postup policie a soudů — jinak prý jde o paragraf „jen na opozici".'
  osoby:
  - osoba: michal-koudelka
    vztah: negativni
    kontext: Výrok o ruském útoku „v řádu měsíců" = poplašná zpráva, měl by být stíhán
- id: vrabel-2026-09-22-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Legální i nelegální migrace je stejná „sebevražda Evropy" — model rotačních pracovních víz;
    kritika Konečné (Vrabel, 22. 9. 2026)
  text: 'K projevu britského labouristy Andyho Burnhama („migrace ano, ale kontrolovaná") Vrabel odmítá
    rozlišování legální a nelegální migrace: lidem podle něj vadí vraždy, útoky kyselinou, noži a bombami
    a znásilnění dcer „mudžahedíny", ne právní status migranta — legální příchod džihádistů je podle něj
    ještě horší. Evropa tím „páchá sociální a demografickou sebevraždu". Jako vlastní model navrhuje jen
    kulturně kompatibilní migranty (např. buddhisty z Nepálu) na půlroční až roční pracovní víza s povinným
    návratem, podle dřívějšího režimu pro Ukrajince (konzulát ve Lvově, kvóty). Kritizuje europoslankyni
    Kateřinu Konečnou, že hlasovala pro legální cesty migrace z Afriky („nevím, co vidí na těch černochách").'
  citace:
  - text: To, co dělá dneska Evropa, páchá sebevraždu, absolutně sociálně, demograficky páchá sebevraždu
      a vůbec nezáleží na tom, jestli to je legální migrace nebo nelegální migrace.
  osoby:
  - osoba: katerina-konecna
    vztah: negativni
    kontext: Hlasovala pro legální cesty migrace z Afriky
