- id: cernohorsky-2026-09-15-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 600 miliard CZK za solární dotace — za to by šly 4 jaderné bloky (Černohorský, 7. 5. 2026)
  text: |-
    **15. 9.** — V rámci vlastního vládního programu Černohorský uvádí odlišná čísla: od zavedení dotací v roce 2006 měla ČR na fotovoltaice celkem prodělat „skoro bilion" korun, s aktuálními náklady kolem 40 miliard Kč ročně. Slibuje okamžité zrušení dotací i zákaz další výstavby fotovoltaických elektráren a větrných turbín na volné krajině (malé větrné elektrárny pro vlastní spotřebu domácností by výjimku měly mít).

    ⚡ **Poznámka:** Údaj „skoro bilion Kč" neodpovídá dříve uváděné částce 600 mld. Kč (7. 5. 2026) za týž účel — rozdíl nelze z dostupných zdrojů ověřit.
  podtema: Solární energie a státní dotace
- id: cernohorsky-2026-09-15-02
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Očkování těhotných žen a chybějící odškodňovací fond — kritika Babišovy vlády (Černohorský,
    17. 8. 2026)
  text: '**15. 9.** — Černohorský opakuje výzvu ke zřízení odškodňovacího fondu beze změny v argumentaci,
    ale dokládá vlastní přímou zkušenost: díky osobní intervenci u Babiše pomohla nadace Agrofertu minimálně
    čtyřem lidem, kterým jeho vlastní spolek pomoci nedokázal — což uvádí jako důvod, proč od Babiše nadále
    očekává, že podobně vyřeší i odškodnění lidí poškozených covidovou vakcinací (viz i obhajoba Babiše
    v kauze Čapí hnízdo, [kauzy.md](kauzy.md#agrofert-a-dotace-eu)).'
  osoby:
  - osoba: andrej-babis
    vztah: pozitivni
    kontext: Obhajován v kauze Čapí hnízdo (dotace vrácena, areál slouží veřejnosti); chválena charitativní
      pomoc přes nadaci Agrofert; vyzýván ke zřízení odškodňovacího fondu za covid
  podtema: Volání po tribunálu
- id: cernohorsky-2026-09-15-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Obhajoba Babiše v kauze Čapí hnízdo — dotace vrácena, farma slouží veřejnosti (Černohorský,
    15. 9. 2026)
  text: Černohorský se ohrazuje proti opakovaným pokusům o trestní stíhání Andreje Babiše v kauze Čapí
    hnízdo a označuje je za pokrytecké vzhledem k rozsahu jiných kauz (bitcoinová kauza, Dozimetr). Argumentuje,
    že Babiš spornou dotaci vrátil, že areál Čapího hnízda je veřejně přístupný (kdokoliv tam může přijít,
    poobědvat, využít zázemí) a že do něj sám investoval víc peněz, než kolik činila sporná dotace. Připomíná,
    že kauza podle něj vznikla poté, co ministr Stanjura veřejně řekl, že velké firmy nemají nárok na
    dotace, a doporučil dělení firem na menší subjekty — což je přesně to, co podle Černohorského Agrofert
    udělal. Zároveň chválí Babišovu adresnou charitativní pomoc přes nadaci Agrofertu (konkrétně zmiňuje
    čtyři případy, kdy na jeho osobní žádost pomohla lidem, kterým nedokázal pomoci vlastní spolek) a
    argumentuje, že Agrofert v ČR živí (přímo i nepřímo přes rodinné příslušníky zaměstnanců) řádově sto
    tisíc lidí.
  podtema: Agrofert a dotace EU
- id: cernohorsky-2026-09-15-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Imigrace jako „probuzení" — Černohorský o roztržení společnosti (25. 5. 2026)
  text: '**15. 9.** — Černohorský rozvádí stejný příběh vlastního „probuzení" v roce 2015 s dalšími konkrétními
    detaily: Frontex označuje za organizaci fungující jako „normální pirátská podpora" — neziskovku, která
    si nechává draze platit za dovážení migrantů do Evropy. O migrantech v Itálii mluví silně dehumanizujícím
    jazykem (→ [stochastický teror](stochasticky-teror.md)) a jako konkrétní příklad „bezpráví" uvádí
    incident, kdy italská policie zabavila majetek majiteli hotelu a donutila ho ubytovat migranty.'
- id: cernohorsky-2026-09-15-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Osobní politická cesta a přesvědčení, že volby jsou podvod (Černohorský, 15. 9. 2026)
  text: Černohorský popisuje vlastní politickou biografii jako zdroj přesvědčení, že volební systém je
    podvod. V prvních svobodných volbách volil Miroslava Sládka (SPR-RSČ), později ČSSD a Miloše Zemana
    kvůli sociálnímu programu. Klíčový zlom nastal po volbách, kdy se znepřátelené ODS a ČSSD (Klaus,
    Zeman) dohodly na opoziční smlouvě (1998), ačkoliv měly „naprosto odlišné programy" a předtím se vzájemně
    napadaly — v tu chvíli dospěl k závěru, že volby jsou podvod sloužící jen k tomu, aby si etablované
    strany rozdělily moc, peníze a koryta. Od té doby (s výjimkou jednorázové volby ODS v roce 2012 na
    naléhání otce) k volbám nechodil až do svého vstupu do aktivismu v roce 2015.
  citace:
  - text: A to byl moment, kdy já jsem se řekl, já jsem si uvědomil, že volby jsou podvod.
  podtema: Volby
- id: cernohorsky-2026-09-15-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Kritika hesla „jedině ten" a napadení Vrábela a Sládka za udání koalic SPD+Stačilo a KSČM+Stačilo
    (Černohorský, 15. 9. 2026)
  text: |-
    Černohorský útočí na příznivce jednotlivých vlasteneckých subjektů (SPD, Stačilo, PRO, Trikolóra, Svobodní), kteří na sociálních sítích vyzývají „pojďme se všichni domluvit a volit jedině [naše strana]" — takové výzvy odmítá jako matematicky nereálné: aby SPD mohlo prosadit svůj program, potřebovalo by samo přes 25 % (aktuálně necelých 12 %), a žádný z voličů konkurenčních vlasteneckých stran by k přeběhnutí nepřesvědčil — každá strana má jen „svoje lidi", kteří jí budou tleskat bez ohledu na realitu.

    V tomto kontextu znovu ostře napadá Ladislava Vrábela a Miroslava Sládka („dva nejhorší zmrdi této scény") za to, že před volbami podali stížnosti proti údajně nedeklarovaným koalicím (SPD+Stačilo, KSČM+Stačilo a další) kvůli obcházení volebního zákona — koalice kandidující jako jediná strana potřebuje jen 5 % namísto 11 %. Tvrdí, že jediným motivem Vrábela a Sládka bylo získat přes 1,5 % hlasů coby vlastní volební uskupení a dosáhnout tak na státní příspěvek 10 mil. Kč za hlasy (případně až 40 mil. Kč při zisku nad 3 %) — ne skutečná obrana zákona.
  citace:
  - text: Vrábel se Sládkem jsou dva nejhorší zmrdi této scény.
  osoby:
  - osoba: vrabel
    vztah: negativni
    kontext: 'Nový řádek: spolu se Sládkem znovu napaden jako „nejhorší zmrd této scény" za udání koalic
      SPD+Stačilo a KSČM+Stačilo kvůli státnímu příspěvku za hlasy'
  podtema: Volby
- id: cernohorsky-2026-09-15-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Podrobný rozbor poslaneckých platů a náhrad — „ať začnou šetřit u sebe" (Černohorský, 28. 8.
    2026)
  text: '**15. 9.** — Černohorský rozšiřuje totéž téma o desítky dalších konkrétních příběhů zaslaných
    sledujícími a poprvé jmenuje konkrétního „viníka": posudkového lékaře **Petra Engela** (pracoviště
    Plzeň), kterého opakovaně přezdívá „Petr Mengele" (→ [stochastický teror](stochasticky-teror.md)).
    Mezi popsanými případy: ženě s chronickým selháním ledvin a celoživotní inkontinencí sebrali invalidní
    důchod 1. stupně; devatenáctiletému chlapci se střední mentální retardací a vzácným genetickým postižením
    snížili stupeň invalidity na nulu s odůvodněním, že nemá „těžké postižení intelektu"; ženě s implantovaným
    neurostimulátorem proti neuropatické bolesti posudkový lékař v Karviné snížil invalidní důchod o 30
    % s tvrzením, že byl „nadhodnocen"; matce umírající na glioblastom byl zamítnut příspěvek na péči,
    protože „nesplňuje tři body"; devatenáctileté dívce s mentální úrovní sedmiletého dítěte byl invalidní
    důchod snížen ze 4. na 2. stupeň. Samostatně čte příběh matky dvou autistických synů, kterou škola
    po její stížnosti na chování asistentky pedagoga opakovaně obviňovala, že si vymýšlí.'
  osoby:
  - osoba: petr-engel
    vztah: negativni
    kontext: Posudkový lékař (Plzeň) přezdívaný „Petr Mengele" za snižování invalidních důchodů — terč
      stochastického teroru
  podtema: USA — volební systém
- id: cernohorsky-2026-09-15-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Zrušení tiskových mluvčích, okamžité zbavení imunity a trestní stíhání, konec poslaneckých prázdnin
    (Černohorský, 15. 9. 2026)
  text: |-
    V rozsáhlé úvaze „co by dělal na místě Andreje Babiše" Černohorský předkládá vlastní vizi vládnutí. Navrhuje zrušit funkci tiskových mluvčích vlády a jednotlivých ministrů (ponechal by jen mluvčího na Hradě) — ministři by podle něj měli být osobně povinni odpovídat na dotazy médií, ne se skrývat za mluvčí. Žádá okamžité zbavení poslanecké imunity a trestní stíhání jmenovaných politiků vlády Petra Fialy (Fiala, Rakušan, Černochová, Lipavský, Stanjura, Blažek) za škody způsobené státnímu rozpočtu, s tím, že při velké škodě by měli rovnou putovat do vazby — v této souvislosti používá analogii „za korupci v Číně střílej" (→ [stochastický teror](stochasticky-teror.md)). Dále navrhuje zrušit „poslanecké prázdniny" a alibistické hlasování „zdržel jsem se" (jen ano/ne), snížit vlastní plat i plat všech politiků o 30 %, zrušit nedokladované paušály a zavést pro poslance stejnou cca 210denní pracovní docházku jako u běžných zaměstnanců.

    V rámci téhož programu obhajuje Andreje Babiše v kauze Čapí hnízdo (viz [kauzy.md](kauzy.md#agrofert-a-dotace-eu)) a žádá zřízení odškodňovacího fondu pro poškozené covidovou vakcinací (viz [covid-vakciny.md](covid-vakciny.md)); ekonomickou část programu (znárodnění infrastruktury, zdanění bank, konec dotací na fotovoltaiku) viz [suverenita-eu.md](suverenita-eu.md) a [ceny-energie.md](ceny-energie.md); zahraničněpolitickou část (konec podpory Ukrajiny) viz [valka-nato-rusko.md](valka-nato-rusko.md).
  podtema: Vlastní vládní program „kdybych byl Babišem" (Černohorský)
- id: cernohorsky-2026-09-15-09
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Vlastní vize ekonomické suverenity: znárodnění vody, energetiky a bank, dividendy občanům z
    ČNB (Černohorský, 15. 9. 2026)'
  text: 'V rámci vlastní představy vládnutí „kdybych byl Babišem" (viz [politicky-system.md](politicky-system.md#vlastní-vládní-program-kdybych-byl-babišem-černohorský))
    Černohorský navrhuje vrátit pod plnou státní kontrolu vodu, energetickou infrastrukturu a rafinerie
    rozprodané po roce 1989 (jmenovitě kritizuje privatizace za vlád Sobotky a Topolánka), s modelem vlastnictví
    60 % stát / 40 % soukromý sektor. Zisky z těchto podniků by podle něj měly plynout přímo občanům:
    každý občan ČR (včetně nově narozených) by měl mít vlastní účet u České národní banky, na který by
    chodily pravidelné dividendy. Součástí vize je i zdanění bankovních zisků na 40 % (oproti běžným 25
    % u fyzických osob), z čehož by měla těžit vlastní síť poboček ČNB s nízkými úrokovými sazbami pro
    občany. Uvádí také, že by se pokusil odkoupit zpět podíl ve Škodovce.'
  citace:
  - text: Bank bych zdanil 40 %. Nelíbí se vám to? Běžte do hajzlu.
  podtema: Česká suverenita
- id: cernohorsky-2026-09-15-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Fialova vláda jako „nacisti" kvůli podpoře Ukrajiny a lhostejnosti k oslavám příslušníka SS
    divize Galizien (Černohorský, 15. 9. 2026)
  text: Černohorský označuje opoziční „fialovo-modro-žlutou" koalici (ODS, STAN, TOP 09, KDU-ČSL, Piráti)
    za „normální nacisty" kvůli jejich „bezmezné" podpoře Ukrajiny. Jako důkaz uvádí, že čeští poslanci
    této koalice zamítli nebo byli lhostejní k parlamentnímu bodu kritizujícímu ovace, které kanadský
    parlament (za přítomnosti Justina Trudeaua a Volodymyra Zelenského) v roce 2023 vzdal veteránovi Jaroslavu
    Hunkovi z 14. granátnické divize Waffen-SS Galizien.
  podtema: Zahraniční aktéři a precedenty
- id: cernohorsky-2026-09-15-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Vlastní vládní program: okamžité ukončení podpory Ukrajiny a zbrojní iniciativy, rozdělení
    Ukrajiny (Černohorský, 15. 9. 2026)'
  text: V rámci vlastní vize vládnutí „kdybych byl Babišem" (viz [politicky-system.md](politicky-system.md#vlastní-vládní-program-kdybych-byl-babišem-černohorský))
    by Černohorský okamžitě zrušil českou zbrojní iniciativu na nákup munice pro Ukrajinu a snížil dávky
    ukrajinským uprchlíkům o 60 % s podmínkou najít si práci do dvou měsíců. Zdůvodňuje to přesvědčením,
    že válka na Ukrajině je „dávno v hajzlu" a že o jejím pokračování rozhoduje někdo jiný než česká vláda
    („kdo jim stojí za prdelí"), a predikuje, že Ukrajina bude nakonec rozdělena — což popisuje jako nevyhnutelné
    a nutné pro ukončení „krveprolití". Podporu Ukrajině vykresluje jako financování politiků, kteří si
    dle něj stavějí „zlaté hajzly" a jachty, zatímco jsou „hrobaři vlastního národa".
  podtema: Zahraniční aktéři a precedenty
