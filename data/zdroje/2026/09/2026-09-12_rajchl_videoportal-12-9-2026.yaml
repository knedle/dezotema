  nadpis: Odmítnutí nálepky "radikální extremismus" — obrácená definice radikalismu (Rajchl, 12. 9. 2026)
  text: 'Rajchl reaguje na televizní reportáž, která stranu PRO označila za odliv členů a „radikální extrémní
    pravici". Tvrzení o odlivu členů popírá — od svého vstupu do Poslanecké sněmovny naopak uvádí přibližně
    50% nárůst členské základny. Nálepku „radikální" obrací: požadavky na mír, zrušení Green Dealu, řešení
    migrace a odmítnutí eura nepovažuje za extremismus, ale za „zdravý rozum" — skutečně radikální je
    podle něj ztráta vlastní měny, vznik „spojených států evropských", zrušení práva veta a emisní povolenky,
    díky nimž ČR platí na hlavu nejvíc v celé EU (7000 Kč ročně).'
  podtema: USA — volební systém
