  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**5. 9.** — Vrabel rozšiřuje kauzu o podrobný popis vzniku a novou konkrétní kauzu. Vysvětluje
    vznik precedentu: po demonstraci strany PRO (kde bylo zakázáno nosit ruské vlajky) vyzvalo vedení
    strany (dle Vrabela zejména místopředseda Vacek a Jindřich Rajchl) veřejnost, aby zasílala fotografie
    a videa účastníků s odznakem „Z" nebo nášivkou Wagner Group — na základě zaslaných materiálů pak PRO
    podalo trestní oznámení pro § 405 trestního zákoníku (schvalování válečných zločinů a popírání genocidy).
    Vrabel právně rozporuje tuto konstrukci: aby šlo o schvalování válečných zločinů, musel by pachatel
    prokazatelně schvalovat konkrétní zločin (vraždění civilistů, mučení) s úmyslem — pouhé nošení odznaku
    vyjadřujícího souhlas s ruským postupem proti (dle Vrabela) ukrajinským nacionalistům vraždícím civilisty
    na Donbasu takový úmysl nenaplňuje; navíc Rusko nikdy nevyhlásilo záměr vyhladit ukrajinský národ,
    takže nejde ani o popírání genocidy. Přesto PRO tímto trestním oznámením podle Vrabela vytvořilo precedens,
    který dal policii, státním zástupcům a soudům nástroj k postihu za pouhé symboly. Uvádí aktuální stav
    postižených: Robertu Kutému (a jeho bratrovi) po třech letech skončil zákaz vstupu do Prahy, stále
    je ale v podmínce; dnes byl na několik hodin zadržen a vyslýchán další člen jeho hnutí, **Tomáš Hrdlička**
    (v samostatném videu Vrabel dodává, že byl zadržen na demonstraci KSČM/Stačilo a vyslýchán na policejní
    stanici Bartolomějská) — odznak mu byl zabaven a přiložen ke spisu, který jde ke státnímu zástupci,
    policie mu doporučila najít si advokáta. Doplňuje osud dalších postižených osob: jeho manželka žije
    v Srbsku a v ČR má stále blokováno 2,5 milionu Kč u banky v souvislosti se spornou nemovitostí — ministerstvo
    vnitra na žádost o přehodnocení odpovědělo, že trvá na svém dřívějším stanovisku (bezpečnostní hrozba
    státu) a odmítlo se omluvit nebo jí udělit občanství; **Slávek Popelka** (odsouzen k půl roku vězení
    za výzvu ke sundání ukrajinské vlajky, ač vegetarián tam byl krmen masem) se nyní léčí s leukemií.
    Vrabel z toho vyvozuje, že režim se v oblasti svobody slova nezměnil ani po výměně vlády — jen se
    posunula rétorika.'
  podtema: Trestání politického projevu
