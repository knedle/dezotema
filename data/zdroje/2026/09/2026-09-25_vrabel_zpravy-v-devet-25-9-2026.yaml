- id: vrabel-2026-09-25-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Írán „telenovela" 38× a manipulace ropy; Izrael, „Velký Izrael" a Netanjahu řídící USA — Vrabel
    (13. 6. 2026)
  text: '**25. 9.** — K výroku Jaira Lapida, že by Izrael pro Ukrajinu dělal víc, Vrabel popisuje „dva
    konflikty": globalisté přes USA tlačili Evropu a Ukrajinu proti Rusku a USA napadly Írán kvůli kontrole
    ropy a plynu. Izrael má podle něj „prakticky pod kontrolou americký kongres", Trump dostal stovky
    milionů od židovských a sionistických sponzorů, Chabad Lubavič má otevřené dveře do Bílého domu a
    ve vedení Izraele jsou „náboženští fanatici", kteří věří, že Mesiáš přijde během velké války a obnoví
    „Velký Izrael" — izraelsko-ukrajinská spolupráce může oba konflikty „velmi rychle propojit". Výslovně
    dodává, že obyčejní Izraelci jsou „skvělí lidi".'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-25-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Írán předán Radě bezpečnosti OSN — Vrabel: předvolební divadlo pro Trumpa (10. 9. 2026)'
  text: '**25. 9.** — K Rubiovu výroku, že cílem války s Íránem je „racionální vláda", Vrabel ironicky
    navrhuje obrácený scénář: kdyby se „pár zemí" spojilo a v USA nastolilo „zákonnou vládu" — „vzali
    by třeba celý kongres, celou vládu [...] jako to udělali Američani v Iránu, že by to rovnou povraždili
    všechno" — nebyl by to podle Rubiovy logiky terorismus; jinak by teroristou musel být i americký ministr
    zahraničí (viz [Stochastický teror](stochasticky-teror.md)). K projevu Pezeškjána dodává, že USA od
    druhé světové války vyměnily vládu v 78 případech „jak na běžícím pásu" a malé země se musí spojit,
    aby vymáhaly právo.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-09-25-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: Liz Truss („migrace jako zbraň"), Tommy Robinson a policejní brutalita — Vrabel (16.
    6. 2026)'
  text: '**25. 9.** — K videu migrantů vystupujících v Doveru Vrabel pronáší rasistické glosy („šikovní
    kluci na olympiádu, běh s taškou"; černí prý „vyhrávají i ve střelbě, protože tam neustále střílí
    nějaký ty bílí") a tvrdí, že Britové „spinkali" — v MHD „není jediný bílý člověk" a lidé se bojí pouštět
    děti ven. Uvádí případ spolupracovníka Tommyho Robinsona, který za šunkový sendvič položený u mešity
    skončil ve vězení, kde ho napadli migranti nožem. Totéž podle něj čeká ČR, pokud se bude volit „pro
    globalistické politiky, jako je Babiš, Macinka".'
- id: vrabel-2026-09-25-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Macinkova povinná vojna a IZS v Karlových Varech jako příprava na válku; Češi „zlí a nepřející"
    Ukrajincům (Vrabel, 25. 9. 2026)
  text: Stavbu operačního střediska IZS (112) v Karlových Varech za více než půl miliardy Vrabel označuje
    za přípravu na válku („ve válce se to bude hodit"), zbytečnou v době, kdy lidé nemají na naftu. Zatímco
    v Německu studenti protestují proti povinné službě („Rusko není náš nepřítel"), v ČR lidé podle něj
    vítají Macinkovu povinnou vojnu („zocelí se") a přejí Ukrajincům, aby byli odvedeni na frontu — takoví
    Češi si podle něj „tisknou stravenky do pekla". Mazáctví na vojně označuje za „zvrácený systém" a
    místo povinné služby navrhuje povinné školení v diplomacii.
  citace:
  - text: Neuvěřitelné, jak jsou ty lidi zlí a nepřející, jak přejí těm Ukrajincům, aby odváděli na tu
      frontu a zabíjeli je.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-09-25-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Arménie 50 mil. eur a polská žádost o americkou základnu = obkličování Ruska (Vrabel, 4. 6.
    2026)
  text: '**25. 9.** — Zrušení cel EU na arménské zboží má podle Vrabela skutečný cíl, „aby Arménie se
    zapojila do války proti Rusku po boku Evropské unie".'
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-09-25-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: USA by mohly válku ukončit ze dne na den — vypnutím Swiftu, internetu a ropy Evropě (Vrabel,
    23. 9. 2026)
  text: '**25. 9.** — Trump podle Vrabela opakovaně žádal Zelenského, aby neútočil na ruskou energetiku,
    ten přesto v den ruských voleb vyhodil do povětří moskevské rafinerie — a Trump ho místo trestu „odměnil"
    licencí na výrobu střel Patriot, takže „vůbec nemá zájem", aby útoky ustaly. Továrnu by Rusové rozbombardovali;
    Ukrajina bude podle něj „za dva roky úplně někde jinde". Finského prezidenta Stubba, který žádá Muska
    o Starlink pro zásahy na ruském území, označuje za „jednoho z největších fašistů v Evropě".'
  podtema: Zahraniční aktéři a precedenty
