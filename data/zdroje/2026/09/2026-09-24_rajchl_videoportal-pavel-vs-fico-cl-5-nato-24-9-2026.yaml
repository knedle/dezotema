  nadpis: Pavel „troubí do války" — ve sporu s Ficem o čl. 5 NATO (Rajchl, 24. 9. 2026)
  text: Rajchl viní Petra Pavla, že jako „vrchní rozvědčík a generál" ve sporu s Robertem Ficem o článku
    5 NATO „troubí do války" a patrně by si přál, aby začala co nejdříve; politici podle něj nemají občany
    strašit konfliktem, který Rajchl „absolutně vylučuje". Staví se na stranu Fica. Podrobně viz [Fico
    odmítá automatické uplatnění čl. 5 NATO](valka-nato-rusko.md#fico-odmítá-automatické-uplatnění-čl-5-nato--majstrštik-podle-vrabela-nejednota-natoeu-vrabel-18-9-2026).
  citace:
  - text: Petře Pavle, Česká republika, naši občané nechtějí válku, chtějí žít v míru.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-09-24-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Fico odmítá automatické uplatnění čl. 5 NATO — „majstrštik" podle Vrabela, nejednota NATO/EU
    (Vrabel, 18. 9. 2026)
  text: '**24. 9. (Rajchl)** — Rajchl se ve sporu Pavel–Fico staví „logicky zcela jednoznačně" na stranu
    Fica: zatímco Pavel „co by vrchní rozvědčík a generál už troubí do války a patrně by si přál, aby
    už co nejdříve začala", Fico je podle něj realista, který to má „v hlavě srovnané stokrát víc než
    všichni tito váleční štváči dohromady". Za nejpravděpodobnější spouštěč konfliktu NATO–Rusko považuje
    ukrajinskou provokaci: oba největší útoky na evropskou infrastrukturu za poslední 4,5 roku — Nord
    Stream a raketa, která dopadla na polské území (Przewodów) — podle něj provedla ukrajinská strana
    (SBU), přestože média nejprve obviňovala Rusko. Odvolává se na polského exprezidenta Andrzeje Dudu,
    který v podcastu Rymanowski Live (1. 9. 2025) uvedl, že mu po dopadu rakety volal Zelenskyj a přesvědčoval
    ho, aby společně „hodili vinu na Putina" a zatáhli tak evropské státy do horkého střetu s Ruskem —
    o totéž se Ukrajina podle Rajchla bude snažit i nyní. Představu, že by všechny státy NATO „jako jeden
    muž" zaútočily na Rusko, označuje za naivní a směšnou: USA do jaderného konfliktu nepůjdou (mají dost
    problémů s Íránem) a tomu, že by Turecko, které se samo hlásí do BRICS, „vytáhlo šavle" na Krym, „můžou
    věřit opravdu pouze pacienti v psychiatrické léčebně v Bohnicích". Konflikt „absolutně vylučuje" a
    slibuje, že udělá vše, aby Česko do války s Ruskem zataženo nebylo.'
  citace:
  - text: Česká republika se nemůže ocitnout ve válce za žádnou cenu. Říkám to jasně a jednoznačně.
  podtema: Zahraniční aktéři a precedenty
