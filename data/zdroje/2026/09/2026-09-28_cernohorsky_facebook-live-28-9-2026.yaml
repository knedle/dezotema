  nadpis: Kauza Terezy Vlasákové jako „spiknutí" úřadů (Černohorský, 24. 9. 2026)
  text: '**28. 9.** — Černohorský uvádí, že ho dva právníci „strašně zklamali", ale věc se „konečně daří
    posunout"; jmenovitě viní ředitelku a třídní učitelku, OSPOD, psychiatričku, policistu „pana Bílého",
    státní zástupkyni a soudkyni, která prý „sama sebe z podjatosti vyšetřovala" — „zatneme jim tipec".'
  podtema: Šmírování dětí státem
