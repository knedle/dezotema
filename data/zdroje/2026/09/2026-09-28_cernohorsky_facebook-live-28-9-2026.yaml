  nadpis: „Česko je plán" — záměrná eroze národní identity
  text: '**28. 9. (Černohorský)** — K Dni české státnosti žádá i den moravské a slezské státnosti — „Morava
    a Slezsko není žádné Česko".'
- id: cernohorsky-2026-09-28-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Kritika hesla „jedině ten" a napadení Vrábela a Sládka za udání koalic SPD+Stačilo a KSČM+Stačilo
    (Černohorský, 15. 9. 2026)
  text: '**28. 9.** — Černohorský útok na Vrabela a Sládka stupňuje: tím, že „udali" nepřiznané koalice
    (Okamura, Rajchl, Majerová, Vondráček, Konečná), jednali jako „kolaboranti", kteří „za druhé světové
    války udávali", zatímco memorandum Pirátů a Zelených jim nevadilo; motivem byly podle něj státní příspěvky
    (1,5 % = 10 milionů, 3 % = 35–40 milionů). Sládek je podle něj „klasický rasista", který měl v kadeřnictví
    napadnout ženu (pravomocný peněžitý trest) a ve Šlapanicích majitele pozemků. Vrabelovo tvrzení, že
    vláda dá na F-35 jaderné zbraně, označuje za „idiotské keci" (stíhačky přijdou až kolem roku 2035).
    Vlastním testem ukazuje, že programy stran jsou zaměnitelné a „právně nevymahatelné".'
  citace:
  - text: Za mě Vrábel se Sládkem jsou největší zasraný, zamrdaný kurvy na této vlastenecké scéně.
  podtema: Volby
