  nadpis: '„Zpoplatněné vlastenectví": Tušl a Zítko jako vyžírači dárců; vlastní vysílání bez QR kódu
    (Černohorský, 22. 9. 2026)'
  text: '**28. 9. (večer, samostatné video)** — Černohorský se veřejně omlouvá: podle zprávy „z důvěryhodného
    zdroje" je profil „Politický vězeň Čermák" skutečně profilem Tomáše Čermáka („ať už mu ho založil
    kdokoliv"); omlouvá se lidem, které nazval hlupáky, i Pavlu Zítkovi za vulgární nařčení, že profil
    založil on — „v tomhle případě jsem hlupák já". ⚡ Zítko omluvu v následujících dnech označil za „teatrální"
    a profil připisuje Čermákovu otčímovi (viz [kauzy.md](/temata/kauzy/2026.md#zitko-2026-09-24-02)).'
  osoby:
  - osoba: tomas-cermak
    vztah: rozporuplny
    kontext: Soucitné rady, varování před násilím; profil možná od „lidí kolem Čermáka"
  podtema: USA — volební systém
