  nadpis: 'Spor s Vrabelem: demonstrace 3. 9. 2022 a rozpad jednoty hnutí (Rajchl, 27. 9. 2026)'
  text: '**28. 9. (Černohorský)** — Černohorský ve sporu stojí proti Vrabelovi: Václavák v září 2022 (150–170
    tisíc lidí) podle něj nenaplnil Vrabel s Jiřím Havlem sami, ale SPD (Foldyna), Rajchl, Konečná, odbory
    a další; třetí den prý Vrabel natočil video, že mu Havel „nechce poslat peníze". Vrabelovy útoky na
    Rajchla označuje za „bláboly", přestože Rajchla sám kritizuje.'
  podtema: Politická kultura
- id: cernohorsky-2026-09-28-06
