  nadpis: Petr Pavel jako „velezrádce" s komunistickou minulostí
  text: 'Jiří Černohorský označuje Petra Pavla za „velezrádce", jehož slovo nestojí nic. Jako důkazy uvádí:
    Pavel sloužil komunistickému režimu v 28 letech (kdy nelze hovořit o „mladické nerozvážnosti"), lhal
    o vstupu do kontrarozvědky, schvaloval v roce 1968 sovětskou invazi a vyhýbá se přímé odpovědi, schůzky
    se Sudetoněmeckým Landsmannschaftem v Německu (jehož předseda stojí za prolomením Benešových dekretů),
    jednání s Lichtensteiny označenými za nacistické kolaboranty, ignorování ústavy. Senát měl podle Černohorského
    dávno podat ústavní žalobu.'
  citace:
  - text: Za mě tenhle velezrádce, naprostej velezrádce, který nestojí za zájmy České republiky, který
      je schopen obcházet veškerou justici — jak justici České republiky, tak mezinárodní justici. Za
      mě Petr Pavel je velezrádce.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
