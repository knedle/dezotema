vyroky:
- id: tarabova-2026-03-12-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Prudké zdražování nafty v krátkém období
  text: Lenka Tarabová upozorňuje na rychlé zdražování pohonných hmot v ČR — zejména nafty. Na základě
    osobního pozorování uvádí, že čerpací stanice, kde pravidelně tankuje (nejlevnější pumpa v Liberci),
    zdražila naftu z 30,50 Kč na 39,90–40,90 Kč za přibližně 10 dní. Benzín se v době záznamu pohyboval
    okolo 36–37 Kč/litr.
  citace:
  - text: Nejlevnější pumpa v Liberci, z 30 korun 50, tak jsou na 39–90, dneska už to bylo 40–90.
  podtema: Pohonné hmoty
- id: tarabova-2026-03-12-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Cena ropy klesá, pumpy zdražují — paradox
  text: |-
    Tarabová poukazuje na nesoulad: cena ropy za barel klesá, ale ceny pohonných hmot v ČR přesto rostou. Odvolává se na vyjádření experta z pořadu 360° z motoristů (pan Krchnavský), který tento paradox veřejně potvrdil.

    > „Cena za barel klesá, což se samozřejmě neprojevuje na cenách pohonných hmot v České republice." — Lenka Tarabová cituje experta, [Cena pohonných hmot 2026-03-12](_zdroje.md#lenka-tarabová--cena-pohonných-hmot-stále-roste)
  osoby:
  - osoba: pan-krchnavsky
    vztah: pozitivni
    kontext: Citován jako důvěryhodný expert potvrzující nesoulad ceny barelu a cen na pumpách
  podtema: Pohonné hmoty
- id: tarabova-2026-03-12-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Jak fungují ceny na čerpacích stanicích
  text: Na základě osobního průzkumu (navštívila 6 čerpacích stanic) Tarabová zjistila, že argument prodejců
    o prodeji starých, levněji nakoupených zásob není pravdivý. Zásoby se doplňují obden, u vytížených
    stanic i denně. Ceny stanovují majitelé čerpacích stanic a mohou je měnit i dvakrát denně.
  citace:
  - text: Objela jsem si 6 čerpacích stanic, oni většinou doplňují zásoby obden.
  podtema: Pohonné hmoty
- id: tarabova-2026-03-12-04
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Kritika vládní nečinnosti — zastropování cen
  text: 'Tarabová je přesvědčena, že vláda nemá dostatečnou kapacitu ani vůli kontrolovat navyšování marží
    u pohonných hmot. Vyjádření ministryně Šilerové o kontrolách označuje za pouhé uklidňování veřejnosti.
    Požaduje zastropování cen a vyzývá lidi k přímé komunikaci s ministryní (e-mail: schilerova.a@psp.cz).'
  citace:
  - text: Nemyslím si, že to dělají, myslím si, že to je jenom řečeno tak, aby lidi trošku uklidnili.
  podtema: Pohonné hmoty
- id: tarabova-2026-03-12-05
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Výzva k bojkotu čerpacích stanic
  text: Tarabová vyjadřuje politování nad neschopností Čechů sjednotit se v odporu proti zdražování. Navrhuje
    dvoudenní kolektivní bojkot čerpání pohonných hmot — včetně firem s nákladní dopravou — jako formu
    ekonomického tlaku na vládu. Zároveň sama uznává, že takový odpor je v praxi nereálný.
  citace:
  - text: Kdyby se udělalo to, že dva dny by prostě nikdo pohonné hmoty vůbec nečerpal... takže by s tím
      vláda sakra musela něco dělat.
  podtema: Pohonné hmoty
