  nadpis: Trump jako démonická entita — „Moon Child"
  text: Boldy zastává přesvědčení, že Trump není politický spasitel, ale démonická entita — tzv. „Moon
    Child" (měsíční dítě). Odvolává se na okultismus Aleistera Crowleyho, který prý rituálem usiloval
    o zrození takové bytosti, a spojuje datum Trumpova narození s krvavým měsícem. Trump je dle Boldyho
    totožný s biblickou postavou Abaddona (anděl zkázy), který shromažďuje „armádu kobylek". Boldy přiznává,
    že byl dříve příznivcem Trumpa a věřil v QAnon.
  citace:
  - text: Takže Trump vůbec není žádný spasitel, jo, je to dítě z kazy.
  - text: Trump je čistý Abaddon, který šíří svou armádu po světě jako armádu kobylek.
