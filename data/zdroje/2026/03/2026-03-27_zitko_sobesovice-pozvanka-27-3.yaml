- id: zitko-2026-03-27-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: COVID jako záměrně řízená událost — „plandémie"
  text: Kanál Pavel Zítko označuje pandemii covidu-19 za záměrně „spuštěnou" operaci, nikoliv přirozeně
    vzniklou epidemii. Virus se podle tohoto výkladu šířil zejména prostřednictvím televize — tj. mediální
    propagandou strachu. Jako paradoxní „lék" je označována ruská invaze na Ukrajinu v roce 2022, která
    covidové téma ze dne na den vytlačila z médií.
  citace:
  - text: Z toho covidu pan Vladimír Putin během pár dní vyléčil doslova celou planetu. Ta byla vykurírovaná,
      takže se zjistilo, že se covid šířil zejména televizním vysíláním.
  osoby:
  - osoba: vladimir-putin
    vztah: pozitivni
    kontext: Paradoxně přisuzován zásluhy za „ukončení" covidové pandemie svou invazí na Ukrajinu
  dalsi_zdroje:
