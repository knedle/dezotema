  nadpis: Zákon nenapsal s Vachatovou a není inspirován Ruskem
  text: 'Rajchl odmítá mediální zkratku, že zákon FARA psal s Natálií Vachatovou — zákon napsal on sám
    s Liborem a Radkem Vondráčkem; Vachatová ho dostala až posléze. Útok na Vachatovou kvůli jejímu bratrovi
    přirovnává k komunistickému pronásledování před rokem 1989, kdy rodinné vazby znamenaly problémy pro
    celou rodinu. Kategoricky odmítá přirovnání k ruskému zákonu: ruský zákon zakazuje zaměstnancům neziskovek
    kandidovat ve volbách, zasedatm ve volebních komisích nebo pracovat na ministerstvech — to v českém
    návrhu vůbec není. Klíčovým problémem je, že zaměstnanci politických neziskovek dnes ovlivňují rozdělování
    státních dotací, přičemž je v podstatě přihrávají svým organizacím.'
  citace:
  - text: Zásadní problém je v tom, že řada zaměstnanců politických neziskovek dnes ovlivňuje rozdělování
      dotací. Přitom jsou to lidé, kteří v podstatě si ty dotace přihrávají.
  podtema: FARA zákon — upřesnění autorství a klíčový problém
