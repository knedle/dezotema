- id: boldy-2026-03-12-08
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Nord Stream — Mosad nebo Ukrajina jako pachatel
  text: Boldy odmítá verzi, že za sabotáží plynovodu Nord Stream stálo Rusko, a označuje ji za absurdní
    — Rusko by sabotovalo vlastní klíčovou infrastrukturu. Za pravděpodobnými pachateli označuje Mosad
    nebo Ukrajinu, přičemž Ukrajinu označuje jako „malý Izrael".
  citace:
  - text: Jediný, kdo by to mohl tak udělat, je buď Mosad, anebo vlastně Ukrajina, což je jedno a to samé,
      protože Ukrajina je malý Izrael, jo.
  podtema: Historické konspirační výklady
- id: boldy-2026-03-12-09
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Filmy jako záměrné odhalení plánů
  text: Boldy zastává teorii, že elity záměrně vkládají své plány do filmů a seriálů (jako Westworld nebo
    Matrix), aby se na ně nevztahovala karma. Pokud lidem plán ukáží a lidé jej nepřijmou jako varování,
    karma se elit netýká. Doporučuje seriál Westworld jako klíč k pochopení toho, co nás čeká.
  citace:
  - text: Proč nám to ukazujou? No, protože jich se potom karma netýká. Když nám ukáží pravdu, to, co
      bude přicházet, tak jich se karma vyjímá.
  podtema: Elity a plánování dezinformací skrze popkulturu
- id: boldy-2026-03-12-10
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: ČT jako jednostranná propaganda
  text: Konspirátor Boldy označuje Českou televizi za „brutální jednostrannou propagandu" a TV Nova za
    ještě extrémnější případ. Mainstreamová média jsou podle něj nástrojem manipulace mas — uplatňují
    princip, že opakovaně sdělená nepravda se stává pravdou. Lidé, kteří konzumují výhradně mainstreamová
    média, pak alternativní informace automaticky odmítají.
  citace:
  - text: My víme, že česká televize je propaganda. Je to brutální jednostranná propaganda. Ale to, co
      předvádí TV Nova, hoho, to je další level.
  - text: Stokrát opakovaná lež se stává pravdou.
  podtema: Česká televize a mainstreamová média
