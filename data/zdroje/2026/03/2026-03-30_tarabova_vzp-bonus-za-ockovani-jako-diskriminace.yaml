  nadpis: Příspěvek 500 Kč od VZP jako podpora vakcinace
  text: Lenka Tarabová sdílí oznámení VZP, že pojistěnci, kteří se nechají očkovat proti chřipce, obdrží
    bonus 500 Kč na dentální hygienu, sport nebo rehabilitaci. Tarabová to komentuje jako protiprávní
    diskriminaci, odkazuje na antidiskriminační zákon č. 198/2009 Sb. (§ 1 o přístupu ke zdravotní péči,
    §2 o přímé diskriminaci) a na § 402 trestního zákoníku (apartheid a diskriminace skupiny lidí). Zpochybňuje,
    kdo odpovídá za VZP po jmenování nového ředitele Ivana Duškova (od 24. 2. 2026).
  podtema: 'VZP: bonus za očkování jako diskriminace'
