  nadpis: 'Tečka za covidem: tribunál pro odpovědné'
  text: 'Pavel Zítko formuluje podmínku, za níž se kauza covidu uzavře: „Tečka za covidem bude, až všichni
    odpovědní budou stát před tribunálem a budou čelit spravedlivému trestu." Cituje německého lékaře
    Güntera Franka. COVID tour je přímou cestou k naplnění tohoto cíle — sbírání podpisů, osvěta a tlak
    na politiky.'
