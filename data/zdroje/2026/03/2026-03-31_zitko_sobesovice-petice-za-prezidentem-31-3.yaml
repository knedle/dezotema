  nadpis: Peková a Zítko stíháni za „šíření poplašné zprávy"
  text: Soňa Peková a Pavel Zítko jsou trestně stíháni za „šíření poplašné zprávy" v souvislosti se svými
    vyjádřeními o pandemii a vakcínách. Zítko a Peková to prezentují jako politické pronásledování kritiků
    covidových opatření a vyzývají prezidenta Petra Pavla, aby se k věci vyjádřil. Peková tvrdí, že jí
    nikdo z politiků — ani Petr Kotlár, ani Robert Fico, ani prezident Pavel — nepřijal k přezkoumání
    vzorky vakcín.
