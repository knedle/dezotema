  nadpis: Sbírání podpisů pro prezidenta Pavla
  text: 'Soňa Peková (virolog, soudní znalkyně) a Pavel Zítko organizují akci: fyzicky sbírají podpisy
    pod peticí adresovanou prezidentu Petru Pavlovi, v níž ho vyzývají, aby se vyjádřil k pochybením v
    době covidu a k obžalobě Zítka a Pekové za „šíření poplašné zprávy". Peková zdůrazňuje, že jde výhradně
    o fyzické podpisy (ne elektroniku), aby bylo jasné, že nejde o robotické akce. Počet podpisů označuje
    za nepodstatný — důležité je ukázat, že veřejnost problém vnímá. Tour pokračuje po celé ČR (Doksy,
    Most, Bedřichov, Krásná Lípa, Plzeň).'
  citace:
  - text: Nemůže nám zavřít dveře před nosem pan prezident, kterého si nesmírně vážíme za jeho morální
      autoritu.
