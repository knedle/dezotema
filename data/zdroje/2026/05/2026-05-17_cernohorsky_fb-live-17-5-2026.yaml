  poznamka: 'Existuje druhý přepis téhož videa (`..._1.txt`) — obsah totožný, obě verze sloučeny. Témata:
    ČT manipulace (falešná „nevybuchlá raketa" v Kyjevě — byl to transformátor); politická perzekuce kritiků
    — Hejátko (velezrada), Hadrava (kněz, sbírka pro Donbas, 25 let), Kapal (zemřel), Skála (podmínka),
