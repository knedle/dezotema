    (2004, MV report); Vystrčil dal záštitu Landsmannschaftu — email Černohorského „nacistická kurvo";
    Weigl (IVK): Pavlův návrh USE „likviduje suverenitu"; Schwarzenberg/Hřib video; Radim Fiala pochválen.
    Přepis zkrácen (~900 z ~1500 řádků)'
