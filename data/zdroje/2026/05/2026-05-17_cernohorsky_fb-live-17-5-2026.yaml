  nadpis: Systematická perzekuce kritiků — selektivní uplatňování práva (Černohorský, 17. 5. 2026)
  text: |-
    Jiří Černohorský přináší konkrétní případy osob, které dle jeho výkladu čelí trestnímu stíhání za kritiku vlády nebo jiných postojů, zatímco osoby napojené na mocenské struktury dostávají podmíněné tresty za závažnější činy. Uvádí šest jmen:

    - **Pavel Jozefovič Hejátko**: novinář, psal články do Běloruska — obviněn z velezrady, zničené zdraví
    - **Ivan Přemysl Hadrava**: pravoslavný kněz, chtěl uspořádat sbírku pro rodiny z Donbasu — hrozí mu 25 let
    - **Vladimír Kapal**: zemřel — Černohorský říká „Fialova vláda ho zabila" (pochyboval o katyňském masakru)
    - **Jozef Skála**: dostal podmínku
    - **Tomáš Čermák**: odsouzen na 6 let za výhružky politikům
    - **Slávek Popelka**: zmíněn v kontextu perzekucí

    Jako kontrast uvádí případ Coubala — Pavlova sponzora, který za způsobení usmrcení dostal podmínku. Černohorský hodnotí: 37 let po Sametové revoluci stále neexistuje prováděcí zákon o referendu a právo je vymáháno selektivně.
  osoby:
