  nadpis: Vystrčil a Senát dali záštitu Landsmannschaftu — Černohorský (17. 5. 2026)
  text: Jiří Černohorský upozorňuje, že předseda Senátu Miloš Vystrčil udělil záštitu sjezdu Sudetoněmeckého
    Landsmannschaftu. Černohorský přehrál video ze záznamu Baudyšovy zprávy z roku 2004 o Wittikobundu
    (radikálním křídle Landsmannschaftu), který prosazuje „právní nárok na vlast." Na adresu Vystrčila
    poslal email s předmětem „nacistická kurvo" — jako přímý protest proti tomuto rozhodnutí. Zároveň
    přehrál videa Jiřího Weigla (Institut Václava Klause) a záznamy ze schůzky Schwarzenberg/Hřib.
