  nadpis: 'Biolaboratoře USA na Ukrajině: 40 z 120 — Gabbard a Hegseth potvrdili (Rajchl, 31. 5. 2026)'
  text: 'Rajchl navazuje na Vrabelovo reportování z 25. 5. 2026 a cituje článek New York Post: Tulsi Gabbard
    (ředitelka Národní rozvědky USA) a Pete Hegseth (ministr obrany USA) potvrdili, že USA financuje a
    provozuje 120 biolaboratoří po celém světě, z toho 40 na Ukrajině. Rajchl označuje tuto třetinu soustředěnou
    na jedné hranici s Ruskem za důkaz, že nejde o běžný „obranný výzkum." Gain-of-function výzkum (přidávání
    funkcí nebezpečným patogenům) má podle Rajchla jediné smysluplné vysvětlení: vývoj biologických zbraní
    namířených vůči Rusku. Připomíná výrok Viktorie Nulandové před Kongresem v roce 2022, kdy mluvila
    o nutnosti „zajistit" laboratoře, a označuje Bidenovu vládu za lhářskou. Gabbard laboratoře prý nyní
    zavírá.'
- id: rajchl-2026-05-31-06
  typ: tvrzeni
  temata:
