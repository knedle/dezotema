  poznamka: '„Matrix polopravd, propagandy a mainstreamových lží utrpěl tento týden pořádné trhliny."
    Klíčová témata: šarže Pfizer — data ÚZISu (Dobijášová), stovky nežádoucích účinků, 2 úmrtí; NOS jako
    farmabyznys; Zelenský pojmenoval jednotku po UPA — výzva Pavlovi k odebrání Řádu bílého lva; biolaboratoře
    USA na Ukrajině (Gabbard + Hegseth, 120/40); NATO Ankara — Boris Ruge vyvrátil Pavlovo exkluzivní
    postavení; 2 % HDP — Rutte nekáral; F-35 nejhorší kontrakt; Agrofert: odmítnutí politické likvidace;
    snížení odvodů OSVČ.'
