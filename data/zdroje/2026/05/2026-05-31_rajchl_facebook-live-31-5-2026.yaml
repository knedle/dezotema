  nadpis: Snížení odvodů OSVČ a plán ekonomického oživení (Rajchl, 31. 5. 2026)
  text: 'Rajchl oznamuje, že vláda schválila snížení odvodů OSVČ jako kompenzaci za navýšení provedené
    Fialovou vládou. Přeplatky od 1. 1. 2026 budou OSVČ vráceny zpětně a odvody půjdou dolů. Rajchl to
    označuje za „první střípek" širšího programu: oživit podnikání v ČR, přilákat investice z Číny, Indie
    a Ruska, zapojit „kapitány průmyslu" (Kellnerová, Tykač, Šetinský) do hospodářského ozdravení. Klíčovou
    diagnózou je paralýza ekonomiky byrokratickými překážkami.'
  podtema: Ekonomický program PRO
- id: rajchl-2026-05-31-08
