  nadpis: 'Jedna šarže Pfizer: stovky nežádoucích účinků, 2 úmrtí — data ÚZISu (Rajchl, 31. 5. 2026)'
  text: 'Rajchl ve vysílání z 31. 5. 2026 odkazuje na data ÚZISu, která zveřejnila investigativní novinářka
    Markéta Dobijášová: jedna jediná šarže vakcíny Pfizer způsobila stovky hlášených nežádoucích účinků,
    přičemž přibližně polovina z nich byla závažných (stavy bezprostředně ohrožující život, bezvědomí).
    Ve dvou případech šlo o úmrtí. Rajchl to označuje za přímý důkaz, že vakcíny „nebyly bezpečné," a
    situaci popisuje jako „absolutní hazard se zdravím mladých lidí a těhotných žen." Zároveň odkazuje
    na německé výzkumy dokazující, že šarže se lišily svou nebezpečností, a hodnotí celou akci jako „masivní
    experiment na lidech."'
  citace:
  - text: Jenom jedna šarže. Jenom jedna šarže. A nám tady bylo celou dobu vyprávěno, jak se jedná o super
      bezpečnou věc.
  podtema: Šarže vakcín
