  nadpis: Zelenský pojmenoval jednotku po UPA — důkaz nacistické ideologie, výzva k odebrání řádu Pavlovi
    (Rajchl, 31. 5. 2026)
  text: |-
    Rajchl komentuje rozhodnutí Zelenského pojmenovat jednu z vojenských jednotek po UPA (Ukrajinská povstalecká armáda) — organizaci, která za druhé světové války kolaborovala s nacistickým Německem a páchala masakry polského civilního obyvatelstva. Podle Rajchla jde o potvrzení toho, co „dezinformátoři" říkali celé roky: na Ukrajině ne náhodou vzkvétá nacistická ideologie, a mainstream to systematicky přehlíží.

    Rajchl oceňuje okamžitou reakci polského prezidenta Nawrockého, který navrhl odebrání Řádu Bílé Orlice Zelenskému, a vyzývá prezidenta Petra Pavla k totožnému kroku — má Zelenskému odebrat Řád Bílého Lva. Pavlovo mlčení označuje za důkaz dvojího standardu: ten, kdo pojmenuje jednotku po spolupracovnících nacistů, si státní vyznamenání od prezidenta demokratické země nezaslouží.

    Téma znovu otevřel **7. 6. 2026**: UPA označil za „čisté nacisty" (masakry žen a dětí, okupace části Slovenska do roku 1947), kontrastoval shodu napříč polským spektrem (Tusk i Nawrocki) s tím, že v ČR „všichni zbaběle mlčí", a připomněl korupci v Zelenského okolí (v Polsku zadržen bývalý náměstek ministra vnitra Bedrinsky za úplatek).

    Na tiskové konferenci **30. 6. 2026** Rajchl formálně oznámil, že poslanecký klub SPD přednese na koaliční radě návrh, aby Poslanecká sněmovna doporučila prezidentovi republiky odebrat Zelenskému Řád bílého lva — výslovně po vzoru Polska, kde k odebrání Řádu Bílé orlice došlo napříč celým politickým spektrem (koalice, opozice i Lech Wałęsa). Připomíná, že jednotky UPA vraždily Čechoslováky (spolu s Poláky a Židy na Volyni) až do roku 1947, kdy je porazila československá armáda v „akci B" (B = banderovci). Zdůrazňuje, že řád nese jméno T. G. Masaryka, který v roce 1926 (rozhovor pro Prager Tagblatt) označil fašismus za „sedlinu naší národní demokracie" — nikoli za okrajovou skupinu lidí, jak měl tvrdit (blíže neurčený) „pan Foltin". Vyjadřuje naději, že návrh podpoří napříč politickým spektrem i v ČR.

    O den později (**1. 7. 2026**) Rajchl reaguje na ohlasy: opoziční politici (jmenuje poslance Ženíška), kteří Turkovi vyčítali „hajlování" a SPD běžně nazývají „náckci", podle něj k pojmenování jednotky po UPA mlčí, případně zpochybňují Rajchlův duševní stav. Kontrastuje to s postojem Polska — polský prezident Nawrocki, premiér Tusk i polský ministr obrany otevřeně hrozí, že pokud Zelenskyj od pojmenování jednotky neustoupí, Polsko bude vetovat vstup Ukrajiny do Evropské unie.
  citace:
  - text: Kde jste teď? Kde jste teď? Vážení přátelé z médií, vím moc dobře, že se na tohle díváte. Proč
      nenapíšete férově, že jsme měli pravdu?
  - text: Fašismus je tou sedlinou. [...] Je vysoce neúctivé, aby řád, jenž nese jméno tohoto celoživotního
      bojovníka proti fašismu, nesl člověk, jenž naopak fašismus minimálně omlouvá, či možná dokonce adoruje.
  - text: Nevím, pane Ženíšku, jestli byste tohle řekl do očí prezidentovi Polska Nawrockému, premiérovi
      Tuskovi či jejich ministru obrany.
