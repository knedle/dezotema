  nadpis: 'Rajchl: NOS jako pumpování veřejných peněz do farmabiznisu (31. 5. 2026)'
  text: Rajchl odmítá Národní očkovací strategii jako „pumpování veřejných peněz do soukromého biznisu"
    farmaceutických firem. Stát podle něj nemá financovat propagaci a distribuci očkování pro mladé a
    zdravé lidi, kteří jej nepotřebují, a označuje celou iniciativu za servis farmaceutickému průmyslu
    na úkor daňových poplatníků. Chce strategii zastavit.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: rajchl-2026-05-31-03
