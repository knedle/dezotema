  poznamka: 'Nejpodstatnější část parlamentního projevu k sjezdu Sudetoněmeckého Landsmannschaftu. Rajchl
    čte prohlášení spolku Lidice Memory (přeživší a potomci obětí Lidic): zásadní odmítnutí sjezdu na
    území ČR; smíření ≠ zapomnění; sjezd je „demonstrace necitlivosti a neúcty." Rajchl: PS usnesení je
    obsahově totožné s prohlášením přeživších — nazvali byste přeživší z Lidic „nahnědlými nácky"? Sjezd
    měl být konat v Německu. Zhlédnutí: 61 000'
