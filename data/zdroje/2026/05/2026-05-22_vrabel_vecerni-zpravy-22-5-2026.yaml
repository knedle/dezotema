- id: vrabel-2026-05-22-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Miliardáři staví bunkry — Bezos, Zuckerberg, Kardashianové jako varovný signál (Vrabel, 22.
    5. 2026)
  text: 'Vrabel informuje, že světoví miliardáři — Jeff Bezos, Mark Zuckerberg, rodina Kardashianových
    — masivně investují do výstavby podzemních bunkrů. Vrabel to čte jako varovný signál: lidé s přístupem
    k nepublikovaným informacím se chovají podle zásady „zachraň se, kdo může." Paralelně Německo investuje
    10 mld. EUR do civilní obrany, Rusko cvičí jaderné síly. Vrabel varuje: „ty chytřejší to vědí dříve
    a připravují se."'
  osoby:
  - osoba: jeff-bezos
    vztah: neutralni
    kontext: 'Staví bunkr — Vrabel cituje jako varovný signál: ti s přístupem k nepublikovaným informacím
      se připravují'
  - osoba: mark-zuckerberg
    vztah: neutralni
    kontext: Staví bunkr — viz Bezos, stejný kontext varovného signálu
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-22-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: EU sankce jako „bonbóny na Halloween" — dojem hrozby bez efektu (Vrabel, 22. 5. 2026)
  text: Vrabel charakterizuje unijní sankce vůči Rusku i nové sankce vůči Bělorusku jako „bonbóny na Halloween"
    — vypadají hrozivě, ale nikoho nepotrestají. Ruský majetek v Evropě nelze fakticky zabavit, ruská
    ekonomika roste díky alternativním obchodním partnerům, ropa proudí přes Turecko, Indii a Čínu. Sankce
    jsou dle Vrabela nástrojem domácí politické komunikace, nikoliv reálného geopolitického nátlaku.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-22-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Trump posílá 5 000 vojáků do Polska — americká globální vojenská přítomnost (Vrabel, 22. 5.
    2026)
  text: 'Pentagon oznámil vyslání přibližně 5 000 amerických vojáků do Polska. Vrabel to komentuje v kontextu
    americké globální strategie: USA udržují vojenskou přítomnost po celém světě, protože globální hegemon
    potřebuje, aby ostatní státy nakupovaly americké dluhopisy a respektovaly americké finanční a obchodní
    podmínky. Trump tuto politiku navzdory izolacionistické rétorice v praxi pokračuje.'
  citace:
  - text: Bohužel i Donald Trump takhle funguje. Mít všude vojáky a snažit se o to zachovat to impérium.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-22-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Polsko: hluboká rusofobie jako historická mentalita (Vrabel, 22. 5. 2026)'
  text: 'Vrabel upozorňuje na specifičnost Polska v NATO: Poláci dle něj „opravdu nenávidí Rusy" — jde
    o hluboce zakořeněnou historickou mentalitu, nikoliv pouze politický postoj. Tato nenávist vysvětluje,
    proč Polsko má nejvyšší výdaje na obranu v NATO poměrem k HDP a nejagresivnější rétoriku vůči Rusku
    v celé alianci. Vrabel ji uvádí jako klíčový faktor destabilizace regionu.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-05-22-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Tulsi Gabbard rezignovala — „výjimka v Trumpově administrativě" musela odejít (Vrabel, 22. 5.
    2026)
  text: 'Ředitelka Národní zpravodajské služby USA Tulsi Gabbard rezignovala s odvoláním na zdravotní
    stav manžela. Vrabel ji označuje za „naprostou výjimku v celé Trumpově administrativě" — jako jediná
    ze všech úředníků dělala věci pro obyčejné lidi: odhalila 120 zahraničních biolaboratoří financovaných
    USA (téma podrobně v [konspirace-deep-state-qanon.md — biolaboratoře](konspirace-deep-state-qanon.md#gabbard-oficiálně-odtajnila-dokumenty-o-120-biolaboratořích--konspirace-se-stala-pravdou-vrabel-13-6-2026)),
    přinášela do agendy témata, která by jinak zůstala skryta. Vrabel tvrdí, že tato rezignace musela
    přijít, ať byl zástupný důvod jakýkoli: „kdyby nebyl tenhle důvod, tak by se našel jiný."'
  osoby:
  - osoba: tulsi-gabbard
    vztah: rozporuplny
    kontext: 'Rezignovala — Vrabel: „naprostá výjimka v Trumpově administrativě, která musela skončit;
      kdyby nebyl zdravotní důvod, našel by se jiný"; lituje odchodu'
  podtema: Zahraniční aktéři a precedenty
