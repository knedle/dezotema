- id: vrabel-2026-05-22-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Sjezd Sudetoněmeckého Landsmannschaftu proběhl — ČRNPM stánek, SPD historické pokrytectví (Vrabel,
    22. 5. 2026)
  text: 'Sjezd Sudetoněmeckého Landsmannschaftu se konal v Brně (22.–25. 5. 2026) navzdory rozsáhlé veřejné
    kritice. Iniciativa ČRNPM (Česká republika na prvním místě) měla na místě petiční stánek za prohlášení
    organizace za extremistickou, u nějž se zastavil i Jiří Černohorský. Vrabel zdůrazňuje konkrétní historické
    pokrytectví SPD: strana v opozici opakovaně říkala „vy občané demonstrujte na ulicích, my budeme dělat
    naší práci v parlamentu" — teď, co je ve vládě a má reálnou páku (koalice ANO bez SPD nemá 101 mandátů),
    místo politického zákazu znovu organizuje demonstrace. Ministerstvo vnitra přitom sjezd zakázalo v
    roce 2009 bez problémů za úřednické vlády ministra z ČSSD.'
  citace:
  - text: Jediné, co mi z toho vychází — je pro ně příjemnější mít okolo toho ten mediální humbuk a dělat
      demonstrace, ukazovat jak jsou velký vlastenci na ulicích, místo toho, aby to udělali politicky.
  podtema: Sudetoněmecký sjezd v Brně 2026
- id: vrabel-2026-05-22-02
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Dronový útok na studentskou kolej v Luhansku — teroristický útok, NATO zodpovědnost (Vrabel,
    22. 5. 2026)
  text: 'Ukrajinskě drony zaútočily ve třech vlnách na studentskou kolej Starobělské odborné školy Luhanské
    státní pedagogické univerzity — 6 studentů zahynulo, 15–18 bylo nezvěstných. Rektorka prohlásila budovy
    za neobnovitelné. Ruské MZV tvrdí, že útoky jsou technicky podporovány odborníky NATO a že západ dodává
    zpravodajské informace i navigaci. Rada bezpečnosti OSN zasedala na žádost Moskvy. Vrabel útok označuje
    za teroristický čin a zasazuje jej do vzorce eskalace: konfliktu na Ukrainěí přibývá, přestože česká
    média působí dojmem uklidnění.'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-05-22-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenský: „vracíme válku domů" — útok na rafinérii v Jaroslavli 700 km od hranic (Vrabel, 22.
    5. 2026)'
  text: 'Zelenský prohlásil „vracíme válku domů" v reakci na ukrajinskě útoky hluboko do ruského území
    — konkrétně na rafinérii v Jaroslavli, vzdálené přibližně 700 km od frontové linie. Vrabel to hodnotí
    jako zásadní eskalaci: Ukraina záměrně přenáší válku do civilní a průmyslové infrastruktury v srdci
    Ruska. Tato rétorika v kombinaci se zaniklou START smlouvou a probíhajícími ruskými jadernými cvičeními
    tvoří dle Vrabela nebezpečný eskalační vzorec bez viditelného konce.'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-05-22-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Lukašenko nabídl jednat se Zelenským — EU reaguje novými sankcemi (Vrabel, 22. 5. 2026)
  text: 'Alexandr Lukašenko veřejně prohlásil, že je připraven k přímému jednání se Zelenským. Zelenský
    nabídku nevyužil. EU odpověděla novým balíčkem sankcí vůči Bělorusku. Rusko a Bělorusko paralelně
    provádějí rozsáhlá jaderná cvičení. Vrabel hodnotí situaci ironicky: Lukašenko nabízí dialog, západ
    odpovídá dalšími sankcemi — přesně opačný postup, než by vedl k míru.'
