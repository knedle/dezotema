  poznamka: 'Nedělní živé vysílání. Hlavní téma: Sudetoněmecký Landsmannschaft sjezd v Brně jako historický
    zlom — poprvé politici preferují SdL nad přeživšími z Lidic (Havel/„Baby Fiala", Zdechovský, Vystrčil,
    Pavel). Právní framing: odsun = potrestání čsl. kolaborantů, ne česko-německý konflikt. Příští sjezd
    SdL Liberec 2027. AFD spolupráce podmíněna respektem k Benešovým dekretům. Rutte 0,25 % HDP pro Ukrainu
    = 22,5 mld. Kč ročně — odmítá. ČŠI skandál: povinný dotazník žáků o rodině, depresích a sebepoškozování.
    Větrné elektrárny: dopadová studie na znehodnocení nemovitostí neexistuje; seminář 8. 6. v PS.'
