- id: rajchl-2026-05-24-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Odsun = trest vlastizrádných kolaborantů, ne česko-německý akt — Rajchl (24. 5. 2026)
  text: |-
    Jindřich Rajchl formuluje klíčový právní argument, který odmítá rámování odsunu jako česko-německého sporu:

    Drtivá většina vysídlených Němců NEBYLA občany Německa — byli to občané Československa. Odsun proto nebyl aktem ČSR proti Německu, nýbrž potrestáním vlastizrádných kolaborantů (=českých občanů) za spolčení s hitlerovskou NSDAP a za pomoc při vyhánění a vraždění ostatních Čechoslováků.

    Právní důsledek: Zabavený majetek nebyl německý, ale majetek českých kolaborantů. Proto ho Němci nemohou jakkoliv zápočítat oproti svým válečným reparacím — ty dluží ČR v plné výši.

    Rajchl proto kategoricky odmítá argument „vzájemné viny": „Pokud by nacisté německé nevtrhli na naše území, [...] nikdy k žádnému odsunu nedošlo. Češi se nerozhodli odsunout Němce jen tak, protože je to napadlo."
  citace:
  - text: To nebyla pomsta Německu, v žádném případě ne. To bylo potrestání vlastizrádných kolaborantů,
      kteří jednoduše se spolčili s hitlerovskou NSDAP, aby vyhlazovali naše občany.
  podtema: Podstata dekretů, odsun a smíření
- id: rajchl-2026-05-24-03
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Odsun jako potrestání kolaborantů, ne česko-německý konflikt — Rajchl (24. 5. 2026)
  text: |-
    Rajchl odmítá narativ „česko-německého vzájemného provinění" a navrhuje alternativní právní rámování. Drtivá většina vysídlených Němců nebyla německými státními občany — byli to čsl. občané, kteří jako kolaboranti zradili vlastní stát a spolčili se s nacistickým Německem. Odsun proto nebyl činem ČSR vůči Německu, ale potrestáním vlastizrádných kolaborantů.

    Z toho plyne i majetkový argument: konfiskovaný majetek nebyl německý, ale majetek českých kolaborantů — Německo ho proto nemůže započítávat vůči reparačním nárokům ČR.
  podtema: Podstata dekretů, odsun a smíření
- id: rajchl-2026-05-24-05
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Sjezd SdL v Brně jako historický zlom — příští sjezd Liberec 2027 (24. 5. 2026)
  text: |-
    Rajchl označuje konání sjezdu Sudetoněmeckého Landsmannschaftu v Brně (22.–24. 5. 2026) za historický zlom v ČR: poprvé se část politiků a veřejnosti postavila na stranu SdL OPROTI přeživším a pozůstalým z Lidic. Říká, že si nic podobného neumí představit ještě před deseti lety — tehdy by každý politik automaticky respektoval přání lidických přeživších.

    Odhaluje skutečný cíl SdL: společné tanečky a zádušní mše jsou „kouřová clona" — skutečným cílem je zrušení Benešových dekretů a následná série hromadných soudních sporů o majetek v pohraničí (hodnota: několik bilionů korun). Češi by na tyto spory neměli prostředky.

    Varuje, že SdL plánuje příští sjezd na rok 2027 v Liberci. Cílem je postupně přizpůsobovat mladou českou generaci myšlence zrušení dekretů.

    Jako analogii uvádí prezidentskou volbu 2013: Schwarzenberg prohrál právě na tématu Benešových dekretů. Rajchl predikuje, že totéž téma rozhodne volby 2028 v neprospěch Pavla: „Ten sjezd [...] bude nakonec tím jazyčkem na vahách, který mu zlomí vaz."
  citace:
  - text: Kdykoliv, kdo říká, že se jedná o nějaké vzájemné provinění, přepisuje naši historii. Nejednalo
      se o žádné vzájemné provinění. Nastala žádná vzájemná vina.
  podtema: Sudetoněmecký sjezd v Brně 2026
- id: rajchl-2026-05-24-06
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: 'SPD/PRO: spolupráce s AFD podmíněna respektováním Benešových dekretů — Rajchl (24. 5. 2026)'
  text: |-
    Rajchl veřejně přiznává shodné programové vize s německou AFD (odpor vůči Green Dealu, masové migraci, válce na Ukraině, federalizaci EU) a deklaruje ochotu ke spolupráci. Zároveň stanoví jasnou podmínku: AFD nesmí jakýmkoli způsobem zpochybňovat Benešovy dekrety ani zasahovat do českých vnitrostátních záležitostí. Pokud by v tom bavorská odnož AFD (která vyzvala ke zrušení dekretů) pokračovala, spolupráce by skončila.

    Bavorský zemský sněm, jenž podpořil sjezd SdL usnesením, Rajchl označuje za nepřípustné vměšování — jako by Česko bylo stále protektorátem. Příští sjezd SdL je plánován na rok 2027 v Liberci.
  podtema: Parlament, politické a stranické reakce
- id: rajchl-2026-05-24-07
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Prezidentská imunita — Pavel nelze stíhat, jedinou cestou jsou volby 2028 (24. 5. 2026)
  text: |-
    Rajchl vysvětluje právní situaci: prezident republiky je ze zákona imunní vůči jakémukoliv trestnímu stíhání (nemůže být stíhán ani za vraždu). Jediný ústavní delikt, který mu lze přičíst, je velezrada — a žalobu za velezradu může vznést pouze Senát Parlamentu ČR. Nikdo jiný, ani advokát, ani poslanec, tuto pravomoc nemá.

    Rajchl proto vyzývá: „Jediná, kdo má reálně možnost dostat z Pražského hradu, dát mu tu výpověď, jste vy občané České republiky v prezidentských volbách v roce 2028." Označuje to nejen za právo, ale za občanskou povinnost — zvláště na pozadí kauzy SdL sjezdu a Pavlovy pomoci Liechtensteinům. Miloš Zeman vyzval k nevolbě Pavla 2028; Rajchl říká: nejen právo, ale povinnost.

    Jako historický precedens uvádí prezidentské volby 2013: Karel Schwarzenberg prohrál právě kvůli tématu Benešových dekretů. Rajchl předpovídá, že sjezd SdL v Brně bude „tím jazyčkem na vahách, který Pavlovi zlomí vaz."
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-05-24-08
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: 'Česká školní inspekce: povinný dotazník o rodině, depresích a sebepoškozování — Rajchl (24.
    5. 2026)'
  text: |-
    Rajchl upozorňuje na skandál s dotazníkem České školní inspekce (ČŠI) pro žáky 5. a 9. tříd. Test měl ověřovat znalost českého jazyka a matematiky, ve skutečnosti obsahoval otázky o rodinné situaci (máma/táta, jejich zaměstnání), počtu knížek doma, depresích žáků a myšlenkách na sebepoškozování. Účast škol byla povinná.

    Rajchl to označuje za „absolutní zneužití pozice" ČŠI — stát bez souhlasu rodičů sbíral citlivé psychosociální informace o dětech a jejich rodinách pod záminkou znalostního testu. Kolega Petr Vacek podal podnět na příslušné orgány. Ministr školství Plaga reagoval veřejně rozčileně.
  podtema: Šmírování dětí státem
- id: rajchl-2026-05-24-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'NATO: Rutte navrhuje 0,25 % HDP ročně pro Ukrajinu = 22,5 mld. Kč — Rajchl odmítá (24. 5. 2026)'
  text: Generální tajemník NATO Mark Rutte navrhl, aby každá členská země přispívala 0,25 % HDP ročně
    přímo na podporu Ukrajiny. Při HDP ČR ~9 bilionů korun by to znamenalo 22,5 miliardy Kč ročně. Rajchl
    návrh zcela odmítá — za tyto peníze by šly krajské nemocnice, školy, byty a dálnice. NATO dle Rajchla
    nemá právo diktovat národním vládám, kolik mají dát Ukrajině, protože to nemá nic společného se společnou
    obranou.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: rajchl-2026-05-24-10
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: 'SPD: dopadová studie na znehodnocení nemovitostí neexistuje — Rajchl (24. 5. 2026)'
  text: |-
    Rajchl byl přítomen na veřejném zasedání k akceleračním zónám větrných elektráren. Na dotaz, zda existuje dopadová studie na znehodnocení nemovitostí občanů v blízkosti plánovaných turbín (250 m vysokých), dostali odpověď, že taková studie nebyla vypracována. Rajchl: dům s výhledem přes větrný park se nebude prodávat za původní cenu a majitelé nemají žádnou kompenzaci.

    Na přímou otázku, zda by si někdo z přítomných (~10 lidí, kteří o výstavbě rozhodují) přál větrné elektrárny u svého domu, odpověděli všichni záporně.

    Rajchl pozval na navazující seminář **8. 6. 2026 v PS (10:00)** s Hynkem Beranem a Janou Zvěřetek-Gamplovou.
