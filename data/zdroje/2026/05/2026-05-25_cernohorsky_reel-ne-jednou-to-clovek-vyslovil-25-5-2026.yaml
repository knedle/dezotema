vyroky:
- id: cernohorsky-2026-05-25-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Odsun byl spravedlivý — Černohorský odmítá smíření (25. 5. 2026)
  text: |-
    Jiří Černohorský v emotivním monologu odmítá požadavky sudetoněmeckého Landsmannschaftu na smíření a zároveň odmítá vinu Čechů za poválečný odsun. Byl osobně přítomen na pochodu v Brně, kde žádní sudetští Němci pochod netvořili — šlo o Čechy, Moravany a Slezany.

    Centrální argument Černohorského: Němci nebyli vyháněni kvůli Čechům, ale kvůli tomu, co jejich předkové (Henleinovi stoupenci, sudetští Němci) a nacistické Německo šest let dělali — vyháněli, vraždili, odvlékali Čechoslováky do koncentračních táborů. Pochod smrti, Postoloprty a odsun byly reakcí na tuto hrůzu. „Kdyby se to nestalo, tak to by nebyl jeden pochod smrti. To by nebyly jedny postoloprty. To by byly hrůzy." Po Čechách nelze chtít omluvu za to, co způsobili druzí.

    Kritizuje „pokrytce" — Čechy, kteří „jdou ruku v ruce se sudetoněmeckým Landsmannschaftem a s těmi, jenž pod jejich předkové vraždili naše občany." Jmenovitě cituje Radima Fialu ze SPD: „vy tady celou dobu hájíte sudetoněmecký Landsmannschaft do krve, místo těch, kteří byli zavražděni v koncentračních táborech."

    Ke spojení SPD–AfD: Černohorský tvrdí, že od roku 2016–2017 opakovaně upozorňoval, že v AfD jsou politici s projevy proti ČR a Benešovým dekretům — byl tehdy označován za lháře, nikoliv ještě dezinformátora. Dnes mu to „protistrana" dává sežrat SPDákům.

    Ohledně prezidenta Petra Pavla: záštita nad sjezdem Landsmannschaftu navzdory protestní nótě vlády je podle Černohorského porušením demokratického parlamentního systému a „jde proti vládě České republiky."

    > „Vy tady celou dobu hájíte sudeto německý Landsmannschaft do krve, místo těch, který byli zavražděni v těch splinovaných koncentračních táborech." — Radim Fiala, citováno Černohorským
  citace:
  - text: Odsun nebyli jsme my — byli odsunuti. A po právu byli odsunuti. A můžou děkovat Pánu Bohu, že
      byli odsunuti.
  podtema: Podstata dekretů, odsun a smíření
- id: cernohorsky-2026-05-25-02
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Šarže jako kontrolovaný pokus na lidech — Černohorský (25. 5. 2026)
  text: |-
    Jiří Černohorský zastává přesvědčení, že různé šarže vakcín byly záměrně navrženy jako experiment na lidech: výrobci prý museli vědět, které šarže jsou placebo, které obsahují látku v nižší dávce a které v plné. Z toho vyvozuje, že farmaceutický byznys záměrně testoval dávkování na nic netušící populaci.

    Jako klíčový doklad uvádí záběr z Evropského parlamentu: europoslanci si vyžádali smlouvy od Pfizeru, ale dostali „začerněné papíry" — Černohorský osobně označuje Ursulu von der Leyen jako osobu, která tyto smlouvy vydala v této podobě. Říká, že přes tuto evidentní záměrnost „se tady najdou idioti, kteří tomu nebudou věřit."
  citace:
  - text: Jestli je to pojaté jako pokus na lidech, tak oni museli vědět, jaké šarže do které země a v
      jakém počtu posílají. Který jsou třeba to placebo. Nebo kteří tam té látky mají míň a pak víc. Oni
      věděli moc dobře, co dělají.
  osoby:
  - osoba: ursula-von-der-leyen
    vztah: negativni
    kontext: „Svině Vondelénová" — dodala europoslancům začerněné smlouvy s Pfizerem; odpovědná za 90
      mld. EUR na Ukrajinu
  podtema: Šarže vakcín
- id: cernohorsky-2026-05-25-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Imigrace jako „probuzení" — Černohorský o roztržení společnosti (25. 5. 2026)
  text: |-
    Jiří Černohorský popisuje, jak ho v roce 2015 „probudila" migrační vlna: sledoval, co se děje v Itálii, Německu, Francii a Švédsku, zatímco česká společnost to ignorovala jako vzdálený problém. Upozorňuje, že Německo je „na dohled", ne „v pohádce". Jako hlavní hnací sílu rozdělení společnosti označuje média a neziskové organizace financované penězi — „z lidí dělají na prostý svině." Kritizuje tehdejší „vítače" (CEMPR, Piráti, Bartoš, hnutí Refugees Welcome): tvrdili, že islám je kompatibilní s křesťanstvím a v Švédsku a Norsku žádné no-go zóny neexistují. Dnes prý Němci „hulákají, že mají imigrantů plný zuby" — kriminalita bodných a sečných zbraní vzrostla o 300–400–500 %, přibyly znásilnění, vraždy a rabování.

    Černohorský zároveň přiznává, že i na jeho straně kolují dezinformace: jako příklad uvádí „Svobodnou Ukrajinu" — ta je neziskovou organizací, nikoli politickou stranou (politická strana musí mít zakladatele s českým státním občanstvím).
  citace:
  - text: Mě to probudilo to, že jsem viděl, co se děje v Itálii, co se děje v Německu, ve Francii, pak
      ve Švédsku. [...] Pamatujete Refugees will come? Honem rychle imigranti sem. Bartoš, kterej se halil
      do vlajky Antify a šel v tom průvodu. Všichni popírali no-go zóny ve Švédsku, v Norsku.
  osoby:
  - osoba: pavel-bartos
    vztah: negativni
    kontext: Označen za „vítače" imigrantů — šel průvodem obalený vlajkou Antify; spoluoznačen jako „sráč"
      a „pitomec"
- id: cernohorsky-2026-05-25-04
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Petr Pavel — „nejhorší svině na hradě od návštěvy Adolfa Hitlera" (25. 5. 2026)
  text: |-
    Jiří Černohorský v reakci na záštitu Petra Pavla nad sjezdem Sudetoněmeckého Landsmannschaftu — záštitu danou navzdory vládní protestní nótě — označuje Pavla za nejhorší osobnost, která seděla na Pražském hradě „od dob Emanuela Moravce." Doslova říká: „od návštěvy Adolfa Hitlera většího hajzla skurvených sviní na hradě nebylo."

    Jako konkrétní pochybení uvádí: Pavel věděl, že vláda má s konáním sjezdu rozpor a vyzvala ho k zásahu — přesto záštitu udělil, čímž „jde proti demokratickému parlamentnímu systému a jde proti vládě České republiky." Navíc byl vyloučen ze summitu NATO v Ankaře na přání vlády, přesto se dál chová protikladně k vládní zahraničněpolitické linii.
  citace:
  - text: Petr Pavel, odpornost sama. Nejhorší svině skurvená od dob Emanuela Moravce České republice.
      Největší odporná svině skurvená na hradě od návštěvy Adolfa Hitlera.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Mu by člověk nejradši rošlapal rypák, flusil mu do ksichtu" — bezprostředně dodal „ale to
      nemůžete udělat, tenhle hajzl je chráněnej"
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-05-25-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vlastenecká scéna jako byznys — transparentní účty místo vlastenectví (25. 5. 2026)
  text: |-
    Jiří Černohorský kritizuje, že i tzv. vlastenecká scéna podléhá komerční logice: každý tvůrce má transparentní účet, výzvy k finančním příspěvkům a provozuje svoji aktivitu jako „business." Tím se podle Černohorského scéna rozděluje a nedokáže se sjednotit — přesně to, co oponenti chtějí. Jako pozitivní protiklad uvádí Petra Černého Orteka, který od roku 2009 dělal vlasteneckou práci bez transparentního účtu a „měl to srdce."

    Paradoxně z toho vyvozuje, že se vůbec nedivil výsměchu Blujové a Pšenáka na demonstraci: „Blujová měla pravdu, když říkala, to je super, že se tady ty dezoláti dohadují." Vnitřní rozpad vlastenecké scény je přímý důsledek toho, že každý vydělává na vlastní iniciativě místo spolupráce.
  citace:
  - text: Tady máte každý transparentní účet, podpořte mě, podpořte mě. [...] Každej z toho má jenom business
      skurvenej. Takže čemu já se to vlastně do hajzlu divím?
  podtema: Volby
- id: cernohorsky-2026-05-25-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Drony z Ukrajiny zabily studenty — Kyjev si „zaslouží Sylvestra" (25. 5. 2026)
  text: |-
    Černohorský komentuje útok ukrajinskych dronů, při němž bylo na ruském území zabito 21 studentů. Označuje tento útok za dílo EU a NATO, nikoli jen Ukrajiny. Predikuje, že Kyjev jako odplatu zažije masivní ruské bombardování — přirovnává ho k novoročnímu ohňostroji. Otáčí kritiku na „prourkajinské": „Tohle jste chtěli vy, ty proukrajinští? Aby se zabíjeli školáci?"

    Zároveň upozorňuje na ekonomické vykrvácení EU: EU poslala Ukrajině 90 miliard EUR — 60 miliard na zbraně a 30 miliard ukrajinskym úředníkům. Ruská ekonomika přes sankce roste (sankce 3758. balíček ji neporazily), zatímco EU si hospodářsky škodí. Média prý falsely tvrdila, že Rusko nemá čipy a musí je vybírat z praček — dnes je realita opačná.
  citace:
  - text: Já vám říkám, v Kijevě zažijou Sylvestra. V Kijevě zažijou Sylvestra. To bude ohňostroj. To
      bude strašný.
  - text: 90 miliard Evropské unie na Ukrajinu. 60 miliard na zbraně a 30 miliard pro ukrajinskéúředníky.
      Ty vole, to je neuvěřitelný.
  podtema: Průběh války, útoky a „terorismus"
- id: cernohorsky-2026-05-25-10
  typ: predikce
  temata:
  - politicky-system
  nadpis: Ukončení veřejné činnosti k 20. 6. 2027
  text: 'Černohorský veřejně oznamuje, že pokud se nic zásadního nezmění — lidé nepřestanou být pasivní
    a nepřestanou čekat na spasitele — ke dni 20. 6. 2027 definitivně ukončí svoji veřejnou činnost. O
    tomto kroku prý přemýšlí 8 let. Jako paralelu uvádí Petra Černého Orteka, který po 7 letech skončil
    se stejným zdůvodněním: „za těch sedm let se nic nezměnilo."'
  citace:
  - text: 20. 6. 6. 2027, 2027 — pokud se něco radikálně nezmění v naší společnosti, pokud vy lidé nezačnete
      přemýšlet jinak, nedokážete prostě udělat ten krok, že to budete vy, jenž budou tvořit tu budoucnost
      — tak ano, 20. 6. 6. 2027 končím definitivně. Už mě nebude.
  predikce:
    horizont: 20. 6. 2027
    stav: ceka
    horizont_do: 2027-06-20
- id: cernohorsky-2026-05-25-11
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: Masivní ruský útok na Kyjev
  text: Po útoku ukrajinskych dronů, které zabily studenty na koleji v Luhansku, Černohorský predikuje
    masivní ruskou odvetnou akci přímo na Kyjev.
  citace:
  - text: Já vám říkám, v Kijevě zažijou Sylvestra. V Kijevě zažijou Sylvestra. To bude ohňostroj. To
      bude strašný.
  predikce:
    horizont: neurčeno (implicit brzy po útoku na Luhansku)
    stav: ceka
