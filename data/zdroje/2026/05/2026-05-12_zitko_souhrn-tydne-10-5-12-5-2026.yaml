  poznamka: 'Nedělní souhrn týdne (10/5). Témata: Bitcoin kauza — Tic/Blažek/Daňhel podali stížnost, skutečná
    částka >100 mld. (Nucleus + SHIB Marketplace), Jiříkovský dříve odsouzen 9,5 roku; COVID vakcíny —
    BioNTech zastavuje výrobu v Německu, Pfizer-BioNTech toxikolog odhaduje 60 000 mrtvých; chozen bosou
    nohou (Harvard studie, Nike kritika); Hantavirus — americký patent 1997 + 2022; COVID tour Peková
    na Slovensko (14. 5. Zlaté Moravce, s Kotlebou); Rainer Füllmich narozeniny (5. 5.); válečné reparace
    ČR vůči Německu — Zítko odhaduje 9 700 tun zlata. Zhlédnutí: 587'
