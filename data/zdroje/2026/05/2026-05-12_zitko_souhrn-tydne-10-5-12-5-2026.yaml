  temata:
  - kauzy
  nadpis: 'Tic, Blažek a Daňhel podali stížnost: částka nesouhlasí — ČsTV2 (12. 5. 2026)'
  text: 'V pondělí 12. 5. podali Karim Tic, Pavel Blažek a Radomír Daňhel stížnost proti sdělení obvinění.
    Zítko se domnívá, že stížnost nesouvisí s popřením viny, ale s tím, že **obviněná částka nesouhlasí
    se skutečným rozsahem** — stát jim klade za vinu méně, než kolik skutečně odcizili. Skutečný objem
    činí přes 100 miliard Kč (dva darknetová tržiště: Nucleus Market + SHIB Marketplace, odkud pocházelo
    39 918 BTC). Jiříkovský byl již dříve pravomocně odsouzen Vrchním soudem v Olomouci k 9,5 roku odnětí
    svobody za krádež bitcoinů ze SHIB Marketplace — tato část bitcoinů nebyla do aktuálního obvinění
    zahrnutá. Zítko: NCOZ by stačilo převzít jeho tříhodinovou analýzu z 20. 4. a do týdne by mohli uzavřít
    případ a rozdat sdělení obvinění všem hlavním pachatelům.'
  podtema: Korupce na Ukrajině — Mindić, Firepoint, Kvartal 95
