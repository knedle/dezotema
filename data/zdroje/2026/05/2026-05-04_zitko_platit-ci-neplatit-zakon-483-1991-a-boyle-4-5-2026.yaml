  poznamka: 'Zítko s tématem „Platit či neplatit" koncesionářské poplatky ČT. Tři zdokumentované příklady
    porušení zákona č. 483/1991 Sb.: (1) jednostranná COVID propaganda; (2) ignorování prezidentské kandidatury
