      Pavel
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-05-31-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Parlamentní strany jako součást systému — opozice i vláda chrání status quo (Vrabel, 31. 5.
    2026)
  text: |-
    Vrabel tvrdí, že všechny parlamentní strany — ODS, TOP 09, Piráti, PRO, SPD, Tricolora, ANO, KSČM — slouží zachování systému. Kateřina Konečná ztratila svůj potenciál tím, že v parlamentních volbách prokaučovala šanci KSČM/Stačilo; místo kandidatury na předsedkyni KSČM zůstane s třetím mandátem v EP a tučným důchodem. SPD vstoupila do koalice jako „opozice ve vládě," ale po 12 letech v parlamentu nic nezměnila.

    Vrabel odmítá politické rozdělení na anti-Babiš vs. anti-Pavel jako nejhloupější možnou situaci: „Mezi tím co se hádej, je okrádej ze všech stran." Média o parlamentní opozici „píšou trochu proti nim, aby jim zachovali tu aureolu opozice" — de facto jsou součástí systému.
  citace:
  - text: Lidi prostě si zvolili to, co jim řekli v televizi. Média nám řekly, tady máte 10 stran, ty
      mají šanci se tam dostat. Lidi si vybrali z těch 10 stran. Jsme hloupí.
  osoby:
  - osoba: katerina-konecna
    vztah: negativni
    kontext: Prokaučovala šanci KSČM/Stačilo; místo kandidatury na předsedkyni zůstane s třetím mandátem
      v EP; její „aureola je pryč"
  podtema: Ekonomický program PRO
- id: vrabel-2026-05-31-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Brněnská demonstrace — zklamání z vlastenecké scény (Vrabel, 31. 5. 2026)
  text: |-
    Vrabel hodnotí demonstraci v Brně jako hluboké zklamání. Miloš Zeman, který na ní vystoupil, je dle Vrabela „normální nácek, špinavý nácek": ocenil Zelenského Řádem Bílého Holodomoru, prohlásil, že Rusové mají agresi v genech (= rasová definice národa), a v roce 1997 nechal zatknout Miroslava Sládka za kritiku česko-německé deklarace — která dle Vrabela otevřela dveře sudetoněmeckým majetkovým nárokům.

    Sládek byl na demonstraci napaden — neznámý muž mu vytrhl megafon (Vrabela vlastnictví). Celá situace je pro Vrabela důkazem, že vlastenecká scéna „naskočila" na systémové figury Okamury, Rajchla a Majerové v médiích místo skutečné občanské akce.
  osoby:
  - osoba: milos-zeman
    vztah: negativni
    kontext: Na demonstraci v Brně označen za „normální nácek, špinavý nácek" — ocenil Zelenského Holodomorem,
      prohlásil že Rusové mají agresi v genech, v 1997 nechal zatknout Sládka
  - osoba: milos-zeman
    vztah: negativni
    kontext: Označen za napojení na elity (byl „udělán prezidentem" osobou z 89.) — potvrzení, že všechny
      elity jsou propojeny bez ohledu na politický tábor
  - osoba: miroslav-sladek
    vztah: pozitivni
    kontext: Na demonstraci v Brně mu neznámý muž vytrhl megafon (Vrabela majetek) — Vrabel vyzývá k identifikaci
      útočníka; oceňuje Sládkovu přítomnost
  dalsi_zdroje:
