vyroky:
- id: vrabel-2026-05-31-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: CBDC a digitální euro jako nástroj kontroly — Velký Reset (Vrabel, 31. 5. 2026)
  text: Vrabel tvrdí, že digitální euro a CBDC jsou součástí záměrného projektu elit (Velkého Resetu)
    s cílem zbavit lidi skutečného vlastnictví peněz. Digitální měna bude pouze na internetu, bude programovatelná
    a veškeré platby budou podmíněny souhlasem autority. Dnes již banky vyžadují zdůvodnění výběrů hotovosti;
    za pár let bude každá platba podmíněna povolením. Paralelně přichází síť 6G, která bude sledovat lidi
    v reálném čase bez potřeby telefonu. Vrabel spojuje tyto technologie s Palantírem (Peter Thiel), který
    sbírá data Evropanů prostřednictvím vládního backdoor přístupu.
  citace:
  - text: V okamžiku, kdy bude digitální měna, tak ta bude jenom někde na internetu. Dokud je nemáme ve
      fyzický podobě, jako papírky, tak je to chiméra.
- id: vrabel-2026-05-31-02
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: 'Kryptoměny: sledování státem a hrozba kvantových počítačů (Vrabel, 31. 5. 2026)'
  text: |-
    Vrabel je opatrný vůči kryptoměnám ze dvou důvodů. Za prvé: státy zavedly povinnou identifikaci (KYC) při nákupu i prodeji — projekt, který začínal jako decentralizovaný nástroj svobody, se stává nástrojem centralizace a sledování. Za druhé: kvantové počítače mohou v budoucnu prolomit šifrovací bezpečnost kryptopeněženek, což při panice způsobí masové výprodeje a krádež velkých částek.

    Přesto nevylučuje krátkodobé investice: předpokládá, že v roce 2026 kryptoměny ještě porostou z nízkých hodnot. Doporučuje — pokud vůbec — investovat do silných měn (Bitcoin, Solana, XRP) spíše než do malých altcoinů.
  dalsi_zdroje:
  - 2026-05-31_rajchl_facebook-live-31-5-2026
- id: vrabel-2026-05-31-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Oriešník jako demonstrace jaderné schopnosti Ruska (Vrabel, 31. 5. 2026)
  text: 'Rusko v rámci největšího útoku od začátku konfliktu (Oriešník, 2 kinžály, 3 zirkony, iskandeři,
    stovky dronů) demonstrovalo jadernou kapacitu. Oriešník je tak rychlý, že protivzdušná obrana nedokáže
    určit, zda nese konvenční nebo jadernou nálož. Vrabel tvrdí, že tímto krokem Rusko vyslalo jednoznačnou
    zprávu Západu: „Můžeme vám poslat jadernou nálož kdykoliv." ČR a Západ dodávají zbraně z vlastního
    území — Rusko deklarovalo, že území, z nichž létají zbraně na Rusko, jsou legitimním cílem.'
- id: vrabel-2026-05-31-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Deportace ukrajinských mužů z Evropy — Vrabel odmítá jako nehumánní (31. 5. 2026)
  text: 'Vrabel odmítá nucené vracení Ukrajinskych mužů z Evropy zpět na Ukrainu. Zelenský nemá vojáky
    a loví je na autobusových zastávkách, z autobusů a obchodů — což Vrabel označuje za trestné činy a
    terorismus vůči vlastnímu obyvatelstvu. Diváci vyzývající k posílání Ukrajinskych mužů „na smrt" Vrabel
    odmítá: „Jestli si neumíte udělat ve svojí zemi pořádek, jste zbabělci." Jako humanista nemůže podpořit
    násilné odvlékání tří milionů mužů k jejich postřílení.'
  dalsi_zdroje:
  - 2026-05-31_rajchl_facebook-live-31-5-2026
- id: vrabel-2026-05-31-05
