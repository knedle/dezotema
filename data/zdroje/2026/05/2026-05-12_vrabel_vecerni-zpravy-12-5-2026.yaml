- id: vrabel-2026-05-12-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Sarmat (Satan 2): test a zařazení do ruské armády — Vrabel (12. 5. 2026)'
  text: 'Velitel ruských strategických raketových sil oznámil úspěšné testování mezikontinentální balistické
    rakety Sarmat (přezdívaná „Satan 2"). Do bojové služby má být do konce roku 2026 zařazen první pluk.
    Parametry: 35 metrů, hypersonická rychlost, až 16 samostatně naváděných jaderných hlavic, dosah 18
    000 km, prakticky nezestřelitelná díky úhybným manévrům a falešným návnadám. Vrabel: Rusko touto zprávou
    sděluje Evropě, že nemá žádnou účinnou obranu.'
- id: vrabel-2026-05-12-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Copenhagen AI summit: digitální ID pro děti — zárodek plošné identifikace — Vrabel (12. 5.
    2026)'
  text: 'VdL prezentovala na kodaňském summitu o AI a dětech plán povinné evropské aplikace ověřování
    věku na internetu, technologicky vycházející z covidové doby. Oficiálním důvodem je ochrana dětí před
    návykovými algoritmy a nevhodným obsahem. Vrabel tvrdí, že skutečným cílem je plošná identifikace
    všech uživatelů internetu — analogie s čínským systémem sledování obličejem. Propojuje to s čistkou
    fake účtů Meta: Rajchlův Instagram klesl z 230 000 na 8 000 sledujících.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-05-12-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Macron 2022: požádal Rusko o stáhnutí z Kyjeva, pak to vojensky zneužil — Vrabel (12. 5. 2026)'
  text: Putin veřejně odhalil, že v roce 2022 mu volal Emmanuel Macron s žádostí, aby Rusko stáhlo vojska
    z okolí Kyjeva — bez toho prý nešlo jednat o dohodě. Rusko poslechlo. Macron tuto vojenskou ústupnost
    využil jako taktickou výhodu k pokračování bojů. Vrabel přirovnává Macronovo jednání k Angele Merkelové,
    která přiznala, že Minské dohody sloužily jen ke koupení času na vyzbrojení Ukrajiny — dle Vrabela
    jde o dokladovaný vzorec podvodných dohod.
  osoby:
  - osoba: emmanuel-macron
    vztah: negativni
    kontext: '2022 podvod: stáhl vlastní vojáky z Kyjeva, ale tento ústup záměrně zneužil k přesvědčení
      Ukrainy, aby bojovala dál — Vrabel: politický zločin'
  podtema: Příčiny a odpovědnost za válku
- id: vrabel-2026-05-12-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Mendelová: Zelenský uživatel kokainu — Vrabel (12. 5. 2026)'
  text: 'Bývalá tisková mluvčí Zelenského Julie Mendelová vydala knihu, ve které popisuje, že lidé z Zelenského
    okolí ho označují za uživatele kokainu. Sama ho při požívání nepřistihla, ale popisuje vzorec chování:
    před každým rozhovorem odešel na 15 minut na toaletu a vrátil se zcela energetizovaný. Mendelová se
    za to ocitla na ukrajinskéom seznamu Mirotvorce — Vrabel tvrdí, že jde o seznam určený k fyzické likvidaci
    osob. Hodnotí situaci jako „odrovnání zbytku Zelenského kariéry."'
  osoby:
  - osoba: mendelova
    vztah: neutralni
    kontext: Autorka knihy o Zelenského kokainu; po vydání umístěna na ukrajinský seznam Mirotvorce —
      Vrabel to cituje jako důkaz Zelenského totalitní povahy
  - osoba: volodymyr-zelensky
    vztah: negativni
    kontext: 'Dal novinářku Mendelovou na seznam Mirotvorce za knihu o jeho kokainové závislosti — Vrabel:
      důkaz fašistické diktatury'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-05-12-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Tulsi Gabbard: 120 zahraničních biologických laboratoří financovaných USA — Vrabel (12. 5.
    2026)'
  text: Šéfka americké národní rozvědky Tulsi Gabbard oznámila vyšetřování více než 120 zahraničních biologických
    laboratoří financovaných USA. Cílem je zjistit, jaké patogeny uchovávají, a ukončit gain-of-function
    výzkum. Část laboratoří se nachází na Ukrajině. Pentagon označení za program biologických zbraní popřel.
    Vrabel tuto zprávu hodnotí jako potvrzení konspirační teorie o biolaboratořích, o níž informoval od
    roku 2022.
  osoby:
  - osoba: tulsi-gabbard
    vztah: pozitivni
    kontext: Odhalila 120 zahraničních biolaboratoří USA financovaných Pentagonem — Vrabel cituje jako
      potvrzení biologické válečné hrozby ze strany USA
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-12-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'EU ministři obrany + španělský FM: jednotná evropská armáda — Vrabel (12. 5. 2026)'
  text: 'Ministři obrany EU zasedali v Bruselu; Kalas vyzývala k urychlení výroby zbraní a EU zvažuje
    novou vojenskou misi v Libanonu (nahrazující operaci OSN Unifil). Španělský ministr zahraničí José
    Manuel Alvarez vyzval EU k vytvoření jednotné evropské armády — 27 samostatných armád je dle něj neefektivních.
    Českou republiku zastupoval náměstek Radovan Vích, neboť ministr Zuna byl na zbrojním veletrhu v Bratislavě.
    Vrabel interpretuje: záměrná hádka USA s Evropou sloužila k tomu, aby se Evropa dobrovolně sjednotila
    do vojenského paktu, přičemž USA budou vyrábět zbraně a Evropa za ně platit.'
  podtema: EU jako vojenská struktura
