  nadpis: 'Peter Magyar: nový maďarský premiér s EU vlajkou na parlamentu — Vrabel (9. 5. 2026)'
  text: Vrabel informuje, že Peter Magyar — lídr opozice, který vyhrál volby — nastoupil jako nový maďarský
    premiér a jedním z prvních kroků bylo vyvěšení vlajky EU na parlamentu. Zároveň dal prezidentovi ultimátum
    do 31. května k rezignaci. Vrabel ho označuje jako „tvrdého fašounka" — v jeho podání jde o politika
    loajálního bruselské linii, který po Orbánově éře přinese Maďarsku rychlou reintegraci do mainstreamu
    EU.
  podtema: Zahraniční aktéři a precedenty
