  poznamka: 'Večerní zprávy. Témata: Macinka v Berlíně 8. 5. — setkal se s Wageführem (čestný člen Sudetoněmeckého
    landsmannschaftu), omluvil se za „deficit v návštěvách Německa", zveřejnil video s Rammstein „Du hast
    mich" = „historicky nejhorší diplomatický akt od Havlovy humanitární bombardování"; Fico v Moskvě
    — Putin nabídl jadernou elektrárnu Slovensku + energetickou spolupráci; Putinův projev ke Dni vítězství:
    „Vyhráli jsme WWII, vyhrajeme i tuto válku"; EU Den — Robert Schuman dle Vladimíry Výtové byl spolupracovník
    nacistů (strůjce Mnichovského diktátu, žil pod ochranou gestapa, zahájena beatifikace); Zelenský slaví
    EU den jako hlava státu spojeného ve WWII s nacisty; Peter Magyar (nový maďarský PM): vlajka EU na
    parlamentu, ultimátum prezidentovi do 31. 5.; Mélenchon: Francie opustí NATO (prezidentské volby 2027);
    Venezuela vydala 13,5 kg obohaceného uranu USA (Írán ne); česká policie chránila Ukraince útočícího
    na Čecha kvůli fašistickému symbolu.'
