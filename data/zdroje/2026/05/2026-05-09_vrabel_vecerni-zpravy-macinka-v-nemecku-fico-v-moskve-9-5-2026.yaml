  nadpis: 'Mélenchon: pokud vyhraje prezidentské volby 2027, Francie opustí NATO — Vrabel (9. 5. 2026)'
  text: 'Vrabel cituje výrok Jean-Luca Mélenchona, lídra levicové aliance La France Insoumise: pokud vyhraje
    francouzské prezidentské volby v roce 2027, Francie pod jeho vedením opustí NATO. Vrabel to zmiňuje
    jako jednu ze sil, které mohou v blízkých letech přeformovat atlantické spojenectví — vedle Trumpových
    výroků o NATO jako „papírovém drakovi."'
