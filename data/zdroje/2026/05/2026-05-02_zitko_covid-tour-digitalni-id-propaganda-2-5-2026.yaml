vyroky:
- id: zitko-2026-05-02-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'COVID lockdowny: Srbsko versus ČR — Zítko (2. 5. 2026)'
  text: |-
    Zítko ve vysílání z 2. května 2026 srovnává průběh covidových opatření v různých zemích. Srbsko označuje za pozitivní vzor: vláda sice lockdowny zavedla, ale lidé se vzbouřili a nakonec stormed parlament v Bělehradě — a lockdowny byly zrušeny. Srbsko podle Zítka prošlo pandemií s výrazně menšími restrikcemi než ČR, Španělsko nebo Čína (Shanghai). ČR naopak přijala přísné lockdowny bez odporu veřejnosti.

    Zítko opakuje tezi, že zdravotní ministerstvo za covidu řídili vojenští důstojníci (plukovník jako ministr, armáda po celé zemi) — to byl podle něj signál, že se nejednalo o zdravotní krizi, ale o vojenskou operaci. Vakcínové smlouvy podepsal Ursula von der Leyen za 100+ miliard EUR bez výběrových řízení a bez odpovědnosti výrobců za škody.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: zitko-2026-05-02-02
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'EU digitální ID do konce 2026: povinné pro všechny státy — Zítko (2. 5. 2026)'
  text: |-
    Zítko ve vysílání z 2. května 2026 informuje o direktívě EU, která ukládá všem členským státům zavést do konce roku 2026 digitální identitu (eIDAS 2.0). Digitální ID bude povinné pro každého občana EU. Zítko to spojuje s digitální peněženkou (digital wallet): stát bude moci sledovat pohyb, nákupy a přístup ke službám; při nevhodném chování lze peněženku zablokovat — a občan pak nemůže platit ani tankovat. Jako možný scénář uvádí: „Dneska ne, vakcína je dobrovolná, ale zítra nevíte."

    Zítko tuto direktívu zasazuje do vzoru opakujícího se po covidu: krok za krokem jsou zaváděny kontrolní mechanismy prezentované jako pohodlí nebo bezpečnost, ale v záloze fungují jako nástroje nátlaku.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: zitko-2026-05-02-03
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Digitální peněženka jako nástroj sledování a blokace — Zítko (2. 5. 2026)
  text: |-
    Zítko ve vysílání z 2. května 2026 popisuje EU direktívu o digitální identitě (eIDAS 2.0) a navazující digitální peněženku jako mechanismus, který přesahuje pouhé pohodlí. V digitální peněžence budou uloženy doklady, platební prostředky a přístup ke státním službám. Zítko upozorňuje na riziko zneužití: stát — nebo ten, kdo systém ovládá — může peněženku zablokovat a občan pak nemůže nakupovat, tankovat, ani se prokázat. Jako analogii cituje čínský systém sociálního kreditu.

    Propojuje to s příkladem lockdownů: byl zaveden „přechodně" a „dočasně" — a to, co bylo jednou normalizováno, se zpět nevrátilo. Digitální peněženka bude „dočasně dobrovolná", dokud nebude povinná. Zítko varuje před přijetím systému bez veřejné debaty o jeho kontrolních důsledcích.
- id: zitko-2026-05-02-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Rusko prohlašuje výrobce dronů v Evropě za legitimní vojenské cíle — Zítko (2. 5. 2026)
  text: |-
    Zítko ve vysílání 2. května 2026 komentuje prohlášení Sergeje Lavrova, podle nějž Rusko považuje výrobce dronů a bezpilotních prostředků v evropských zemích za legitimní vojenské cíle — a to včetně zemí, jejichž vzdušný prostor tyto drony využívají k útokům na ruské území. Zítko upozorňuje, že to se může týkat i pobaltských států (Estonsko, Lotyšsko, Litva), přes jejichž vzdušný prostor prý procházejí ukrajinskě drony míří na Rusko.

    Zítko tuto eskalaci zasazuje do vzoru: stejně jako byl COVID použit ke grantování výjimečných pravomocí vládám, je nyní válečná rétorika využívána k ospravedlnění zásahů proti civilní a průmyslové infrastruktuře třetích zemí.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
