  - osoba: pavel-jozefovic-hejatko
    vztah: pozitivni
    kontext: Promo nového CD „Vlaštovky v Petroleji" — 149 Kč, e-shop česuarespekt.cz; Černohorský ho
      označuje za „vzácnou duši"
  - osoba: klara-samkova
    vztah: pozitivni
