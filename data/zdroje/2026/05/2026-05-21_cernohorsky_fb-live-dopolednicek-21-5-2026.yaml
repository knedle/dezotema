  poznamka: 'Monolog nahrávání cestou za tátou. Témata: Pavel Jozefovič Hejátko — promo nového CD Vlaštovky
    v Petroleji; policie — podání vysvětlení k sovětské vlajce (fotka z Olšan), v průběhu výpovědi přišlo
    nové udání za výhrůžky Petru Pavlovi; Černohorský vysvětluje, že "Pavel by byl adeptem trestu smrti"
    = konstatování historického práva, nikoliv výhruška; LM Brno — magistrát dal ~15M Kč Meeting Brno
    na sjezd; Klára Samková pochválena za zapojení; Rajchl — jen plní svou povinnost; Vrabel — distancování
    od srovnání; sraz 24.5. Brno, ulice Bašty 13:00.'
