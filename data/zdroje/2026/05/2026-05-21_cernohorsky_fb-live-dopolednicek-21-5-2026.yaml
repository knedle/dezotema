      povinnost, prosím vás, co jako"
  - osoba: vrabel
    vztah: negativni
    kontext: 'Distancování: „nechci být srovnáván s Vrábelem" — nesouhlasí s jeho přístupem, ač jsou přátelé'
  - osoba: marketa-vankova
    vztah: negativni
    kontext: Primátorka Brna — „dostaly ty peníze" za organizaci LM sjezdu; obhajuje sjezd historickými
