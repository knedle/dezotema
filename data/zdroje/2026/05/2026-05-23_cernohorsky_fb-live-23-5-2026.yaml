  nadpis: Izraelská vlajka vedle česko-slovenské na LM sjezdu — Černohorský (23. 5. 2026)
  text: 'Černohorský na brněnské demonstraci spatřil kombinaci česko-slovenské a izraelské vlajky nesenou
    účastníky LM sjezdu. Označuje to za absurdní provokaci: Sudetoněmecký Landsmannschaft jsou pro něj
    potomci nacistů, kteří vyvražďovali Židy, a nemohou tedy mluvit jménem obětí holocaustu ani se za
    ně symbolicky skrývat.'
  citace:
  - text: Nacisti a židi, to je neuvěřitelné... nacisti, kteří vyhlazovali židi, tak oni vám tady nesou
      [vlajku]. Jak kdyby oni mohli mluvit za všechny ty, kteří byli v koncentrátu splinováni.
  podtema: Sudetoněmecký sjezd v Brně 2026
