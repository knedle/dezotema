  nadpis: 'LM plán: krajský předseda SdL — příští generace Benešovy dekrety zruší sama (Černohorský, 24.
    5. 2026)'
  text: 'Černohorský cituje (přes video Michala Svatoše) krajského předsedu Sudetoněmeckého Landsmannschaftu:
    organizace údajně tvrdí, že nepotřebuje aktivně rušit Benešovy dekrety, protože příštím generacím
    se to „vymydlí z hlavy" a samy dekrety odmítnou. Černohorský to označuje za cílenou, nebezpečnou strategii
    historické manipulace.'
  podtema: Podstata dekretů, odsun a smíření
- id: cernohorsky-2026-05-24-02
