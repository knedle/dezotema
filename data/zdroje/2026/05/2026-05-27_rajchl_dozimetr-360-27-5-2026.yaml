  nadpis: 'Dozimetr: komise konečně volena, STAN jako právnická osoba pod hrozbou zrušení — Rajchl (26.
    5. 2026)'
  text: 'Rajchl v krátkém klipu z pořadu 360 stupňů informuje, že volba členů parlamentní vyšetřovací
    komise v kauze Dozimetr by měla proběhnout 28. 5. 2026. Uvádí klíčový právní argument: pět spolupracujících
    obviněných jednoznačně prohlašuje, že korupční peníze končily u hnutí STAN. Pokud státní zástupce
    tomuto uvěří, měl by jednat — buď jim zbavit status spolupracujícího obviněného, nebo zahájit trestní
    stíhání pro křivé obvinění, anebo zahájit trestní stíhání STAN jako právnické osoby. Zákon přitom
    umožňuje soudu jako trest i zrušení právnické osoby.'
  podtema: Kauza Bojana Vrabelová — politické zničení aktivisty přes rodinu
