  poznamka: Živé vysílání z Brna v průběhu sjezdu Sudetoněmeckého Landsmannschaftu. Obrana národa 2 (Martin
    Říha, Anička Štofanová) čte jména 1 518 brněnských obětí nacistické okupace z knihy „Brněnští občané
    v boji proti fašismu"; 240+ ulic v Brně pojmenováno po padlých hrdinech — Černohorský překvapen ztrátou
    historické paměti. Vlastenecká scéna rozbita okolo 2015–2016 vstupem Okamury, SPD, bloku proti islamizaci;
    spolek jako nepolitická alternativa sjednocení. Provokátor Ponert narušoval akci. Panevropská unie
    na Moravě (Posselt, 1990) — Fiala v tomto projektu.
