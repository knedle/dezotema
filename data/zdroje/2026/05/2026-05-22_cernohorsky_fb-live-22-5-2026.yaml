  poznamka: 'Monolog z auta po brněnské akci (Svobodák / Národní obroda 2, pan Říha). Incident s provokátory
    (Pšenák, Blujová, Ponert) — policie radí nenechat se vyprovokovat; Černohorský ji poslechl, ale hranice
    si nenechá překračovat. Kritika vlády Babiše: ministr Juchelka (ANO/MPSV) navrhl VR brýle jako úlevu
    pro sestřičky v sociálních zařízeních = "odtrženi od reality." Návrh: ČR by měla dát NATO max. 1,2–1,3
