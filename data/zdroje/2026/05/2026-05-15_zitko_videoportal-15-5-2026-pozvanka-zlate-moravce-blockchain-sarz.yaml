  poznamka: 'Zítko zve na slovenskou beseda (14. 5. Zlaté Moravce s Pekovou). Prezentuje blockchain analýzu
    ~12 000 šarží vakcín: 3 vrstvy (placebo/střední/smrtící), 5 % šarží = 70 % všech zemřelých, 10 % =
    99 %; šarže „E" = 96 % fatálních případů. Data nahrána na blockchain, podána vojenskému tribunálu
    GT-2026-0441. Boyle označen za „záhadně zemřelého". Zítko líčí věznění a hrozbu nucené injekce proti
    tetanu.'
