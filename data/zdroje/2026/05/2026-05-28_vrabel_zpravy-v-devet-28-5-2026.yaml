vyroky:
- id: vrabel-2026-05-28-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Netanyahu ignoruje příměří: cíl 70 % Gazy — Vrabel (28. 5. 2026)'
  text: 'Benjamin Netanyahu rozkázal armádě, aby ignorovala podmínky příměří a dosáhla kontroly nad 70
    % pásma Gazy (nyní 60 %). Zároveň prohlásil, že nedopustí, aby se USA stáhly z konfliktu s Íránem.
    Vrabel rozlišuje: není antisemita a respektuje Izraelce, ale nesouhlasí se sionistickým programem
    „Velkého Izraele" a jeho vojenskými prostředky.'
- id: vrabel-2026-05-28-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rektorka JAMU odvolaná za sundání ukrajinské vlajky — „Česko-Ukrajinsko" (Vrabel, 28. 5. 2026)
  text: 'Vláda schválila návrh akademického senátu JAMU (Janáčkova akademie muzických umění v Brně) na
    odvolání rektorky Barbary Marie Willi — jedním z důvodů bylo sundání ukrajinské vlajky z budovy školy.
    Vrabel interpretuje případ jako symptom toho, co označuje termínem „Česko-Ukrajinsko": česká veřejná
    instituce je potrestána za to, že trvala na vlastní identitě. Uvádí paralelu: Slávek Popelka seděl
    6 měsíců ve vězení za pokus sundat ukrajinskoji vlajku z Národního muzea.'
  podtema: Ekonomický program PRO
- id: vrabel-2026-05-28-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Macinka nabídl USA výrobu dronů v ČR — paralela s Heydrichem (Vrabel, 28. 5. 2026)
  text: 'Ministr zahraničí Petr Macinka při jednání s americkým viceprezidentem J.D. Vancem nabídl, že
    Česká republika bude vyrábět drony pro Spojené státy. Vrabel kreslí historickou paralelu: Heydrich
    byl do protektorátu poslán mj. s úkolem přeměnit českou průmyslovou infrastrukturu na výrobnu zbraní
    pro Německo v boji proti Rusku. „A dneska tam máme takovýhleho vysmátýho ministra zahraničních věcí,
    který to dělá za podpisování. V den výročí atentátu na Heydricha."'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-28-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Nariškin (šéf ruské rozvědky): EU se stane centrem světového konfliktu (Vrabel, 28. 5. 2026)'
  text: 'Šéf ruské civilní rozvědky (SVR) Sergej Nariškin prohlásil, že NATO podniká praktické přípravy
    na rozsáhlý konflikt na východě EU a že EU se rychle blíží k tomu, aby se stala středem světového
    konfliktu — nikoliv místem, kde se o konfliktu mluví, ale kde se fyzicky odehraje. Vrabel zdůrazňuje:
    Nariškin není analytik, je to šéf zpravodajské služby se skutečnými zdroji; pokud to říká veřejně,
    bylo rozhodnuto tuto informaci zveřejnit, protože situace je vážná.'
  podtema: Eskalace a hrozba rozšíření konfliktu
