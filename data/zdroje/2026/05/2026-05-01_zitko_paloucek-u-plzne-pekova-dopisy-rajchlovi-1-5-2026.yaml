  poznamka: 'Krátký záznam z COVID tour finále na Paloučku u Plzně. Peková popisuje, že dala Rajchlovi
    dva hotové dopisy (jeden prezidentu Pavlovi, druhý evropskému ombudsmanovi Anginovi) k odeslání —
    ten je nikdy neodeslal. Nakonec je odeslala sama doporučeně poštou. Kotlár (slovenský antikruptní
    úřad): parlamentní seminář o COVID tématice neměl žádný praktický efekt. Minimální nový wiki obsah.'
