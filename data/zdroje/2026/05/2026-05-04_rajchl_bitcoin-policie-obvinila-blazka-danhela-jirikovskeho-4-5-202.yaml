  poznamka: 'Klíčové: policie obvinila Pavla Blažka (ex-ministr spravedlnosti), Radomíra Daňhela (jeho
    náměstek) a Tomáše Jiříkovského (alias Kára Matice, brněnský advokát). PRO tuto situaci veřejně odhalilo
    11 měsíců dříve (tiskovka 6. 6. 2025), bez výsledku. Eva Decroix kryla situaci z ministerstva spravedlnosti.
    Stanjura: věděl o původu bitcoinů, umožnil převod ze státu na soukromou aukci přes ÚZSVM = stejný
    trestný čin, měl by být také obviněn. Petr Fiala: Blažek mu kauzu vyprávěl „jako vtipnou historku."
    Hrozba parlamentní vyšetřovací komise pokud nebudou podána další obvinění. Zhlédnutí: 38 386'
