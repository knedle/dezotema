  nadpis: Policie obvinila Blažka, Daňhela a Jiříkovského — Rajchl (4. 5. 2026)
  text: |-
    Dne 4. května 2026 Rajchl oznámil, že policie formálně obvinila tři osoby v kauze Bitcoin:
    - **Pavel Blažek** — bývalý ministr spravedlnosti ODS
    - **Radomír Daňhel** — jeho náměstek (brněnský)
    - **Tomáš Jiříkovský** — brněnský advokát, alias „Kára Matice"

    PRO tuto situaci veřejně pojmenovalo již 11 měsíců dříve — tiskovka PRO proběhla 6. 6. 2025 a nikdo tehdy nejednal. Eva Decroix dle Rajchla po celou dobu kryla situaci z ministerstva spravedlnosti.

    **Stanjura jako spolupachatel:** Rajchl tvrdí, že Stanjura věděl o původu bitcoinů (z trestné činnosti) a přesto umožnil jejich převod ze státní správy na soukromou aukci prostřednictvím ÚZSVM — to je dle Rajchla tentýž trestný čin jako u Blažka a Daňhela. Stanjura by proto také měl být obviněn.

    **Fiala v obraze:** Blažek prý Petru Fialovi o celé kauze vyprávěl „jako vtipnou historku" — Rajchl komentuje: „Moc vtipné, pane Fialo." Rajchl pohrozil zahájením parlamentní vyšetřovací komise pro kauzu Bitcoin, pokud nebudou podána další obvinění.
