  nadpis: Posselt jako „přetlustá karikatura Hitlera" — Vrabel, potvrzeno Rajchlem (15. 5. a 17. 5. 2026)
  text: 'Vrabel při komentáři k sjezdu v Brně popisuje Bernda Posselta jako někoho, kdo se záměrně stylizuje
    do Adolfa Hitlera: češe se jako on, nosí knírek jako on, snaží se vypadat jako „přetlustý Hitler."
    Vrabel tvrdí, že Rajchl tento výraz zopakoval o dva dny později (volal Posselta „karikaturu tlustého
    Hitlera") — a komentuje to ironicky jako Rajchlovo opakování jeho výroků.'
