  poznamka: 'Reakce na článek Seznam Zprávy, který Rajchla obvinil z „kreslení terčů na záda ženám novinářkám."
    Rajchl uvádí tři fakty o Zuzaně Černé: (1) nahlásila Tomáše Elnera policii; (2) napsala, že Rajchl
    bojoval proti „národní očkovací strategii", přitom šlo o pandemickou smlouvu WHO — „nerozumí ani psanému
    textu"; (3) nikdy nenapsala o hrozbě Jakuba Hedia (ODS): „ví, kde bydlím a teď stačí škrtnout zápalkou"
    — ODS nikdy neodsoudila. Adéla Urbanová vedla sledující: „Budeš viset ty zmrdě, my si tě najdeme."
    Natálie Vachatová označena za „ruskou kolaborantku" jen kvůli bratrovi v Rusku — Rajchl: „bolševické
    manýry." Zhlédnutí: 34 998'
