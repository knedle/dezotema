- id: vrabel-2026-05-27-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Belgický poslanec Van Langeboij odsouzen za zveřejnění pravdivých migračních statistik (Vrabel,
    27. 5. 2026)
  text: |-
    Vrabel cituje případ belgického bývalého poslance Van Langeboije, odsouzeného za podněcování nenávisti. Podstata: poslanec zveřejnil statistiky trestných činů spáchaných migranty v Belgii. Soud výslovně konstatoval, že nezáleží na tom, zda jsou data pravdivá — trestný čin spočívá v záměru podněcovatele. Citace rozsudku: „i kdyby všechna tvrzení byla založena na vědeckých datech a statistikách, nemá to pro trestný úmysl žádný význam."

    Vrabel hodnotí: západ dospěl do bodu, kdy jsou fakta trestná nikoli pro svou nepravdivost, ale pro politicky nevhodný záměr. Srovnává s britským systémem, kde byl aktivista uvězněn za uložení sendviče se šunkou na mešitu.
  podtema: 'COVID rozsudky: odsouzení za varování'
- id: vrabel-2026-05-27-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'EU-USA obchodní dohoda: EU ruší cla, USA si nechají 15 % — deadline 4. 7. (Vrabel, 27. 5. 2026)'
  text: 'Velvyslanci EU schválili klíčový krok k obchodní dohodě s USA odstraňující cla na americké průmyslové
    zboží vstupující do EU. Deadline: Trump pohrozil 25% cly na evropská auta, pokud dohoda nevstoupí
    v platnost do 4. července 2026. Vrabel hodnotí asymetrii: EU bude mít nulová cla na americké zboží,
    USA si zachovají 15% cla na evropské vývozy.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-05-27-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'OSN: 50+ zemí odsoudilo útok na Kyjev — USA se nepřipojily (Vrabel, 27. 5. 2026)'
  text: Po masivním ruském útoku na Kyjev (ze soboty na neděli) vydalo 50+ zemí společné prohlášení v
    OSN odsuzující útok a vyzývající k okamžitému bezpodmínečnému příměří. USA se k prohlášení nepřipojily
    — pokoušely se vystupovat jako prostředník mezi Kyjevem a Moskvou. Velvyslanec Melnyk paradoxně mluvil
    o bezpodmínečném příměří, přestože den před tím ukrajinskě strany oslavovaly útok na internátní školu
    v Luhansku.
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-05-27-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'OSN: USA se nepřipojily k odsudění útoku na Kyjev — signál zprostředkování (27. 5. 2026)'
  text: |-
    Více než 50 partnerských zemí odsoudilo v OSN ruský útok na Kyjev ze sobotní noci a vydalo společné prohlášení. Připojily se EU, Australie, Kanada, Francie, Německo, Japonsko, Polsko, Velká Británie a pobaltské státy. USA se k prohlášení nepřipojily.

    Vrabel komentuje: v předchozích dnech se USA snažily vystupovat jako prostředník mezi Kyjevem a Moskvou. Nepřipojení k odsudění je z tohoto pohledu logickým krokem — USA si nechtějí uzavřít cestu k jednání s Ruskem. „Dneska už nemám ten pocit, že by stáli všichni za ukrajinským režimem." Zároveň upozorňuje, že Zelenský a jeho režim „to přehnali" — a nyní v OSN získali podporu jen přibližně 25 % zemí.
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-05-27-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Česká muniční iniciativa: Pavel chce, aby ČR sama přispívala (Vrabel, 27. 5. 2026)'
  text: 'Pavel oznámil záměr jednat s vládou o finančním příspěvku ČR do vlastní muniční iniciativy —
    v současnosti ČR iniciativu pouze spravuje, ale nevkládá vlastní peníze. Západ to vnímá jako absurdní:
    zakladatel, který sám neplatí. Babiš dříve slíbil iniciativu zrušit, nyní ji zachovává. Vrabel naznačuje
    zákulisní spor o kontrolu toku peněz zbrojním firmám.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
