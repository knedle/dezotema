  nadpis: 'Brněnská petice: 13 000 podpisů proti sjezdu — Obrona Národa (Černohorský, 10.–13. 5. 2026)'
  text: Černohorský informuje, že Milan Říha ve spolupráci s organizací Obrona Národa sesbíral z Brna
    přes 13 000 podpisů na petici proti konání sudetoněmeckého sjezdu. Petice musí být dle zákona projednána
    v Petičním výboru PS. Černohorský ji hodnotí jako příklad přímé občanské akce, které se politici nemohou
    vyhnout.
