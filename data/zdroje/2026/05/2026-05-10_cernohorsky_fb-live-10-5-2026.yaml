- id: cernohorsky-2026-05-10-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 90 mld. EUR „půjčka", oligarcha Mindić a zbrojní firma Firepoint (Černohorský, 10.–13. 5. 2026)
  text: |-
    Jiří Černohorský sdílí a komentuje video Kateřiny Konečné o korupci na Ukrajině. Konečná dokumentuje propojení:

    - **Firepoint** — v době záznamu největší výrobce raket a dronů na Ukrajině
    - **Majitel:** oligarcha Mindić, napojený na Zelenského produkční studio Kvartal 95
    - **90 mld. EUR** — „půjčka" EU Ukrajině je dle Konečné fakticky nevratný dar, jelikož Ukrajina ji za daných podmínek nemůže splatit
    - **Mindić** uprchl do Izraele

    Černohorský video opakovaně sdílí jako doklad, že válka na Ukrajině korupci neodstranila, ale prohloubila — a evropské veřejné peníze ji živí.
  dalsi_zdroje:
  - 2026-05-13_cernohorsky_fb-live-13-5-2026
  podtema: Korupce na Ukrajině — Mindić, Firepoint, Kvartal 95
- id: cernohorsky-2026-05-10-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Petr Pavel: Posselt 2023 na motorce, Lichtensteinové, bavorský hejtman na Hradě — systémové
    propojení (Černohorský, 10.–13. 5. 2026)'
  text: |-
    Jiří Černohorský opakovaně shrnuje propojení prezidenta Petra Pavla s Landsmannschaftem a agendou oslabení suverenity:

    - **2023:** Bernd Posselt navštívil Pavla na motorce; Pavel mu veřejně poděkoval za „zlepšování česko-německých vztahů."
    - **Lichtensteinové:** Pavel údajně vyjednával o fondu 35 mld. Kč na uspokojení nároků rodu Lichtensteinů (označovaných za nacistické kolaboranty).
    - **Bavorský hejtman na Hradě:** Bavorský premiér přijal pozvání — přímá vazba na Landsmannschaft.
    - **EU superstat:** Pavel veřejně prosazoval vznik Spojených států evropských a vzdání se práva veta ČR.

    Černohorský tyto kroky označuje za části jediného plánu: Landsmannschaft + Lichtensteinové + EU superstat + ztráta veta = systematické podkopávání české suverenity.
  dalsi_zdroje:
  - 2026-05-13_cernohorsky_fb-live-13-5-2026
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
