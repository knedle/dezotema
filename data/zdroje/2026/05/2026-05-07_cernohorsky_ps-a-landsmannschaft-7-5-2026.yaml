  nadpis: 'Jiří Černohorský: koaliční poslanci — „nacistické podrštašky" a kolaboranti (7. 5. 2026)'
  text: 'Jiří Černohorský v krátkém videu reagoval na jednání PS k sudetoněmeckému sjezdu. Koaliční poslance
    (ODS, TOP 09, STAN, KDU-ČSL, Piráti) označil za „nacistické podrštašky", „kolaboranty" a „vlastní
    zrádce." Zástupcům německé strany vzkázal: „Vy tady nejste doma, vy jste tady hosté." Obhajuje Babišovu
    vládu — lidé si ji demokraticky zvolili. Kritizuje ty, kdo po hlasování „volali do Bavorska."'
