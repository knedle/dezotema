  text: 'Černohorský sdílí video, v němž politik hnutí Žít Brno vysvětluje genezi sjezdu: v roce 2015
    se Žít Brno dostalo do vedení Brna s primátorem Petrem Vokřálem (ANO), který dlouho žil ve Vídni a
    dobře znal německé prostředí. Vokřál automaticky souhlasil s tím, aby Brno bylo prvním městem postkomunistického
    bloku, které se omluví Němcům za poválečné excesy. Za to obdržel nejvyšší státní vyznamenání Německa
    (od prezidenta Gauka) i Rakouska. Andrej Babiš o celé věci věděl od roku 2015 a nikdy s ní neměl problém.
    ANO se „probudilo" a začalo se prezentovat jako antiněmecké teprve těsně před brněnskou demonstrací.'
  podtema: Sudetoněmecký sjezd v Brně 2026
- id: cernohorsky-2026-05-29-02
