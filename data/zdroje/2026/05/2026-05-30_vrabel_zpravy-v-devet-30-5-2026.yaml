vyroky:
- id: vrabel-2026-05-30-01
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: USA opět plně podporuje Ukrajinu po zdánlivém ústupu — Vrabel (30. 5. 2026)
  text: 'Pentagon (ministr Hegseth) oznámil, že USA výrazně navýší výrobu zbraní pro Ukrajinu a v rozpočtu
    na rok 2027 plánuje 56 miliard dolarů do dominance v oblasti dronů. Vrabel to komentuje jako paradoxní
    obrat: poslední dva měsíce americká strana signalizovala distancování od Ukrajiny, teď opět plnou
    podporu. Vrabel interpretuje: byl to záměrný cyklus k přeprogramování evropské veřejnosti — nejprve
    strach z opuštění, pak stmelení kolem NATO a plná zbrojní integrace.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-05-30-02
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: EU vyšetřuje frakci ESN (AFD) za extremismus — hrozba zrušení 2 mil. EUR — Vrabel (30. 5. 2026)
  text: 'Evropský orgán odpovědný za dohled nad evropskými politickými stranami zahájil řízení, které
    může vést ke zrušení statusu frakce Evropa suverénních národů (ESN) — hlavní iniciátorkou je AFD.
    Důvody: extremistická rétorika, antisemitismus, vazby na Rusko. Pokud ztratí status, přijdou o dotace
    přesahující 2 miliony EUR; mandáty europoslanců by zůstaly nedotčeny. Vrabel komentuje: důsledek toho,
    že vlastenecká opozice v ČR odmítala spolupracovat s AFD a pomáhala likvidovat skutečnou suverenistickou
    opozici.'
  podtema: Zahraniční aktéři a precedenty
