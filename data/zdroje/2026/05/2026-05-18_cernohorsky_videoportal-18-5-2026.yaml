  text: 'Jiří Černohorský věnoval celé video (13:07) skandálu, že prezident Petr Pavel udělil záštitu
    sjezdu Sudetoněmeckého Landsmannschaftu. Označuje to za porušení článku 1 Ústavy ČR (ČR je svrchovaný
    stát). Vedle záštity Vystrčila a Senátu jde dle Černohorského o systémové propojení: Pavel vyjednával
    o fondu pro rod Lichtensteinů, kteří prohráli všechny české i mezinárodní soudy jako nacistické kolaboranty.
    Posselt veřejně prohlásil, že se mu Benešovy dekrety nelíbí. Martina Dvořáka, který záštitu Landsmannschaftu
    obhajoval, označil za „hajzla."'
