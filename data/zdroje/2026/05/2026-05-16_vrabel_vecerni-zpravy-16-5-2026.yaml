- id: vrabel-2026-05-16-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Tribunál EU pro ruské zločiny: 10M EUR, ale bez jurisdikce — k ničemu (Vrabel, 16. 5. 2026)'
  text: 'Vrabel komentuje zprávu, že Česká republika přispěla 10 milionů EUR na mezinárodní tribunál EU
    pro zločiny Ruské federace. Tribunál označuje za zbytečný: jurisdikce platí pouze pro státy, které
    ji uznaly — Rusko ji nikdy nepodepíše, takže tribunál nemá na koho soudit. Je to politické divadlo
    se skutečnými finančními náklady.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-16-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Fico po návštěvě Moskvy: kritika západních médií, EU hrozí Slovensku dotacemi (Vrabel, 16.
    5. 2026)'
  text: |-
    Vrabel informuje, že Robert Fico po návštěvě Moskvy (9. 5. 2026) veřejně kritizoval západní media za způsob, jakým jeho cestu referovaly. Zároveň EU začala hrozit Slovensku pozastavením zemědělských dotací jako nástrojem nátlaku. Vrabel hodnotí EU postup jako vydírání — klasický bruselský mechanismus: kdo se chová suverénně, ztrácí peníze.

    Ve vysílání z 18. 5. Vrabel spekuluje, že Slovensko začíná jednat o nahrazení ruského plynu ázerbájdžánským — pokud se Fico vydá touto cestou a vzdá se ruské ropy, Vrabel predikuje, že ztratí politické zázemí: „Až se Fico zbaví ruské ropy, zbavíme se Fica."
  dalsi_zdroje:
  - 2026-05-18_vrabel_vecerni-zpravy-18-5-2026
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-05-16-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Srbsko jako model suverenity — multivektorová politika (Vrabel, 15.–17. 5. 2026)
  text: |-
    Vrabel opakovaně označuje Srbsko za vzor pro ČR v otázce státní suverenity. Srbsko nakupuje hypersonické rakety z Číny, stíhačky z Francie, drony vyrábí z Izraele, vojenská cvičení pořádá s Ruskem, Čínou i NATO — a přitom odmítá dát sankce Rusku. Předseda vlády Vučić jedná přímo s Putinem a vyjednal pro Srbsko cenu plynu přibližně na polovinu tržní ceny na tři měsíce dopředu. Čína masivně investuje do srbské infrastruktury (vlaky, silnice, mosty). USA mají taky dobré vztahy. Srbsko vyváží nejvíce přes Ázerbájdžán do EU.

    V 16. 5. Vrabel informuje, že Vučić jede do Číny — komentuje to jako potvrzení srbského kurzu: přátelství se všemi, závazky k nikomu. Vučić odmítl vstup do EU jako nereálný a nevýhodný. Srbsko podle Vrabela ukazuje, že svoboda = možnost obchodovat s kýmkoli bez vydírání.

    Ve vysílání 24. 5. Vrabel dodává nový detail z Vučičovy návštěvy v Číně: srbský prezident bydlel ve stejném paláci, ve kterém přijímali Trumpa a Putina — Vrabel to interpretuje jako symbol toho, jak vysoko je Srbsko u Číny váženo. Vučić tam pronesl, že Srbsko je suverénní stát, odmítá poslouchat „seznamy" od EU/Bloomberg o tom, s kým si smí povídat, a bude jednat v zájmu vlastního lidu. Vrabel oceňuje Srbsko také za zákaz GMO potravin v celé zemi.
  citace:
  - text: Takhle si představuji tu svobodu — že můžete dělat obchod s kým chcete a nikdo vás netlačí.
