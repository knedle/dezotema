- id: vrabel-2026-05-16-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Digitální euro: závazné pro všechny členské státy EU (Vrabel, 16. 5. 2026)'
  text: 'Vrabel referuje o vyjádření Valdise Dombrovskise (EU komisaře), že digitální euro bude závazné
    pro všechny členské státy Evropské unie bez možnosti opt-outu. Vrabel spojuje digitální euro s digitální
    kontrolou: hotovost = svoboda; digitální peníze = dokonalý nástroj sledování, přidělování a omezování
    spotřeby (benzín na příděl, maso na příděl, omezené kredity). Dřívější proticovidové zkušenosti s
    digitálními certifikáty označuje za prototyp systému.'
  osoby:
  - osoba: valdis-dombrovskis
    vztah: negativni
    kontext: 'Citován jako zdroj: digitální euro bude závazné pro všechny členské státy EU — Vrabel to
      označuje za ohrožení finanční svobody'
