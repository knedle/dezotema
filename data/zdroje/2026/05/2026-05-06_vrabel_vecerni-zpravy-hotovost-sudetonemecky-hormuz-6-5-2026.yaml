  temata:
  - blizky-vychod
  nadpis: Německo a Francie nasazují námořní síly do oblasti Hormuz — Vrabel (6. 5. 2026)
  text: |-
    Vrabel ve vysílání 6. 5. potvrzuje eskalaci evropské námořní přítomnosti:

    - **Německo:** minolovka *Fulda* vyplula do Středomoří — součást přesunu do oblasti Perského zálivu
    - **Francie:** letadlová loď *Charles de Gaulle* směřuje do Rudého moře

    Írán sestřelil 2 americké vojenské lodě. Írán ve stejné době jednal s Wang Yim v Pekingu — potvrzení čínsko-rusko-íránské strategické jednoty.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-05-06-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Daniela Kovářová: ústavní ochrana koruny a práva na hotovost odmítnuta — Vrabel (6. 5. 2026)'
  text: |-
    Senátorka Daniela Kovářová předložila návrh na ústavní zakotvení tří práv: (1) právo na českou korunu, (2) právo na hotovost, (3) právo na nedigitální život. Záměr byl chránit tyto principy před legislativní erozí nebo unijními direktivami.

    Senát ale hlasoval **2 hlasy z 71** — pro pouhou debatu o návrhu. Ani samotné projednání se nestalo.

    Vrabel to komentuje jako demonstraci toho, kde skutečně stojí česká politická elita: „Právo na korunu v ústavě, právo na hotovost, to je naprosto zásadní, a právo na nedigitální život." Odmítnutí i debaty jej nechává bez komentáře.
  osoby:
  - osoba: daniela-kovarova
    vztah: pozitivni
    kontext: Senátorka, navrhla ústavní ochranu koruny + hotovosti + nedigitálního života — Senát odmítl
      2/71 hlasů i samotnou debatu
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-05-06-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenský: Rusko porušilo příměří 1 180× — hrozí přesunout válku do Ruska — Vrabel (6. 5. 2026)'
  text: |-
    Vrabel ve vysílání 6. 5. 2026 cituje Zelenského prohlášení: Rusko porušilo příměří **1 180krát** — proto Zelenský říká, že není důvod ho dodržovat z ukrajinské strany. Zároveň Rusko varovalo, že pokud Ukraina zaútočí na Moskvu 9. 5., bude „tvrdá odpověď."

    Ukraina navíc vypálila raketu s doletem **přes 1 000 km** na cíl uvnitř Ruska (možná Jekatěrinburg, vzdálenost 1 900 km). Zelenský prohlásil: „Jsme schopni přesunout válku do Ruska."

    Vrabel to hodnotí jako zásadní eskalaci — válka se fyzicky přesouvá na ruské území, přičemž USA schválily pro Ukrainu přesné bomby J-DAM v hodnotě 374 mil. USD.
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: 1 180 porušení příměří; hrozí útokem na Moskvu 9. 5.; odpálil 1 000km raketu do Ruska; chce
      „přesunout válku do Ruska"
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-05-06-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Friedrich Merz: vojenský proslov v uniformě — „Německo bude řídit evropské armády" — Vrabel
    (6. 5. 2026)'
  text: |-
    Vrabel referuje, že Friedrich Merz přednesl vojenský projev v uniformě, v němž prohlásil, že Německo převezme vedení evropských armád. Vrabel spojuje tuto rétoriku s opakovaným motivem německé hegemonie v EU.

    V témže vysílání Vrabel cituje sarkastický komentář k ruské 9. 5. oslavě Dne vítězství: Rusko zakázalo Němcům účast na berlínských oslavách, na což Vrabel reaguje: „Druhá světová válka přece pokračuje — mezi těmi potomky nacistů."
  osoby:
  - osoba: friedrich-merz
    vztah: negativni
    kontext: 'Vojenský proslov v uniformě: „Německo bude řídit evropské armády" — Vrabel: hegemonie'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
