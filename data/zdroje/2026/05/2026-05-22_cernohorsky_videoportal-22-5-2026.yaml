  nadpis: Sudetoněmečtí účastníci LM sjezdu hodující u brněnské historické sochy — „zneúctění, ne smíření"
    (Černohorský, 22. 5. 2026)
  text: Černohorský zachytil skupinu sudetoněmeckých účastníků sjezdu Landsmannschaftu, jak hodují u sochy
    Markraběte (historický symbol Brna). Odmítá to jako zneúctění — jakýkoli argument o pokoře nebo smíření
    považuje za nepřijatelný.
  citace:
  - text: Tohle mě někdo jako chce považovat za to, že to je v pořádku, jo, že tohle je jako nějaká pokora,
      že to je nějaká ta úcta k tomu, že nějaké smíření, ani omylem, ani omylem.
  podtema: Sudetoněmecký sjezd v Brně 2026
