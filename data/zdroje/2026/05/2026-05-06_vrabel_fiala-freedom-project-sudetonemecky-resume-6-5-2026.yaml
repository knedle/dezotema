  nadpis: SPD rezoluce o Sudetoněmeckém sjezdu — „nejtvrdší výzva je upustit od sjezdu" — Vrabel (6. 5.
    2026)
  text: |-
    Vrabel přečetl celý text 8-odstavcové SPD rezoluce o Sudetoněmeckém sjezdu v Brně. Rezoluce oceňuje česko-německé vztahy, vyzdvihuje deklaraci z roku 1997 a „vyzývá Meeting Brno a Landsmannschaft, aby upustili od sjezdu." Vrabel hodnotí: „Konec. To je to nejtvrdší."

    Vrabel zastává radikálnější pozici: Landsmannschaft musí být prohlášen za extremistickou organizaci a zakázán. Parlamentní rezoluce bez právních důsledků jsou podle něj jen „divadlo."
  podtema: Parlament, politické a stranické reakce
