  podtema: Kauza Bojana Vrabelová — politické zničení aktivisty přes rodinu
- id: vrabel-2026-05-24-05
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Facebook backdoor: EU vlády mají přístup do obsahu (Vrabel, 24. 5. 2026)'
  text: |-
    Vrabel uvádí, že Mark Zuckerberg veřejně přiznal existenci zadních vrátek pro evropské vlády: ty si vymínily otevřený přístup do Facebooku, aby mohly ovlivňovat, komu se obsah zobrazí a komu ne. Vrabel to dokládá vlastní zkušeností: jeho stránce jsou příspěvky potlačovány, zatímco jiní komentátoři říkají totéž a mají desítky tisíc lajků. Označuje to za systematickou manipulaci veřejného mínění, která dnes funguje efektivněji než tradiční média.

    Vrabel upozorňuje, že sociální sítě pravděpodobně přejdou k digitální identitě — každý bude vystupovat pod svým jménem a bude monitorován. Pro ty, kdo dnes nevystupují pod svým jménem, se prostor zúží.
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-05-24-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Demonstrace 2022 zlikvidovány — opozice je dnes součástí vlády (Vrabel, 24. 5. 2026)
  text: |-
    Vrabel ve dvouhodinovém vysílání (24. 5. 2026) rozebírá zánik autentického občanského odporu. Demonstrace roku 2022 označuje za jedinečný spontánní fenomén — financovaný z příspěvků tisíců obyčejných lidí, bez stranického zadání. Tyto akce byly podle Vrabela cíleně zlikvidovány zevnitř i zvenčí: nasazením falešných lidí, „mafiánským právníkem", a mediální diskreditací Vrabela a jeho manželky.

    Dnes probíhající demonstrace jsou naopak politicky organizované (SPD, Rajchl, Okamura, Zeman) — politici tam říkají jen jedno: „dejte nám mandát ve volbách." Volební cesta ale podle Vrabela nefunguje: aby se politik dostal do struktur, musí spolupracovat s médii a sponzory, kteří ho pak drží závislého na systému.

    Vrabel formuluje klíčovou tezi: opozice přestala být opozicí. SPD a ANO jsou součástí vládního systému — příležitostně vysloví kritiku, ale nikdy nepřehlasují koalici, protože pak by přišli o místa ve hře. „Teď je koalice a opozice ve vládě."
  citace:
  - text: To už není koalice a opozice, jako to byla dřív. Teď je koalice a opozice ve vládě.
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: Jako předseda parlamentu 300 tisíc měsíčně; SPD má 15 poslanců — „nás je málo"; v koalici
      i opozici zároveň
  podtema: Ekonomický program PRO
