- id: vrabel-2026-05-24-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Brněnský pochod — zklamání z účasti a programu (24. 5. 2026)
  text: |-
    Vrabel sledoval pochod proti sjezdu LM v Brně (24. 5.) živě a hodnotí ho kriticky:

    **Počet účastníků:** zklamal — čekal výrazně více lidí. Demonstrace ukázala, že „vlastenci se neumí spojit, postavit za svoji zemi."

    **Program:** Nejvíce vadil kněz v úvodu, který vyzýval k odpuštění a pochopení vůči „kolaborantům" — Vrabel označuje tento postoj za nevhodný v dané situaci: „to učí lidi nastavit druhou tvář, takovej nesmysl."

    **Rajchlův projev:** líbil se, ale ne závěr — „Dejte nám mandát a sjezd LM nikdy nebude." SPD+PRO jsou ve vládě a sjezd přesto proběhl. Slib o budoucím mandátu považuje za anachronický.

    **Zeman:** „katastrofa" — odbyl to odkazem na volby jako řešení. Vrabel: pokud by volby řešily problémy, sjezd by se nekonal.

    Vrabel obecně: lidé demonstrovali „jenom proti Fialovi" — to nestačí. Skutečným problémem je globalistická struktura likvidující suverenitu, ne konkrétní vládní garnitura.
  osoby:
  - osoba: aleksandar-vucic
    vztah: pozitivni
    kontext: V Číně bydlel ve stejném paláci jako Trump a Putin; prohlásil, že Srbsko je suverénní stát
      odmítající instrukce EU; zákaz GMO potravin; vojenská neutralita
  - osoba: rajchl
    vztah: negativni
    kontext: 'Zlikvidoval autentický občanský odpor z 2022; na demonstracích říká jen „dejte mi mandát";
      Vrabel: „opozice je součástí vlády"'
  - osoba: milos-zeman
    vztah: negativni
    kontext: 'Na demonstraci v Brně (24. 5.) jen vyzval lidi k volbám — Vrabel: prázdné gesto, zklamal'
  podtema: Sudetoněmecký sjezd v Brně 2026
- id: vrabel-2026-05-24-02
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: 'Posselt a Benešovy dekrety: útok na svrchovanost ČR — Vrabel (24. 5. 2026)'
  text: |-
    Vrabel po sjezdu SdL v Brně podrobně vysvětluje právní argumentaci pro označení SdL za extremistickou organizaci. Sudetoněmecký Landsmannschaft je sdružení osob odsouvaných po 2. světové válce za kolaboraci s nacisty — v jejich stanovách stojí „curik nachajmat" (zpátky do domoviny) a ČR označují za svoji domovinu. Tím podle Vrabela útočí na svrchovanost ČR.

    Bernd Posselt jako mluvčí SdL veřejně vyzývá ke zrušení Benešových dekretů, které jsou součástí ústavního pořádku ČR. Vrabel zmiňuje, že Vitiko Bund (radikálnější křídlo) se se SdL soudí proto, že SdL tyto přímé požadavky ze stanov vypustilo — ale reálně je většina členů stále zastává.

    Petice za prohlášení SdL za extremistickou organizaci měla ke dni vysílání ~700 podpisů; potřeba 10 000 pro legislativní efekt. Vrabel vyzývá ke sdílení.
  osoby:
  - osoba: bernd-posselt
    vztah: negativni
    kontext: 'Veřejně vyzývá ke zrušení Benešových dekretů; SdL má ve stanovách „curik nachajmat" — Vrabel:
      útok na svrchovanost ČR'
  podtema: Bernd Posselt a požadavky na zrušení dekretů
- id: vrabel-2026-05-24-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Uhlíkové kredity: chudí prodají, bohatí koupí — prohloubení nerovnosti (Vrabel, 24. 5. 2026)'
  text: |-
    Vrabel popisuje plánovaný systém osobní uhlíkové stopy: každý člověk by dostal omezený počet kreditů za emise CO₂ (letenky, maso, pohonné hmoty). Kdo nepotřebuje kredity plně využít, může přebytky prodat těm, kteří chtějí žít nadstandardně.

    Vrabel upozorňuje, že to zní solidárně, ale výsledek bude opačný: chudí lidé budou nuceni prodávat své kredity, aby vůbec měli na živobytí, zatímco bohatí si za peníze koupí libovolný životní standard. Systém tedy nezabrání emisím, ale udělá z chudoby přímý předpoklad omezené svobody pohybu a spotřeby. Zasadí do kontextu digitální ID → digitální peněženka → uhlíkové kredity jako postupnou konsolidaci kontroly nad životem občanů.
  citace:
  - text: Ty chudí lidi budou prodávat tu svoji uhlíkovou stopu, aby měli nažerádlo, a ty bohatí lidi
      budou lítat dál a jezdit si autama.
  podtema: Ekonomika, sankce a BRICS
- id: vrabel-2026-05-24-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Insolvenční správce, soud bez důkazů, Rakušan: bezpečnostní ohrožení státu (Vrabel, 24. 5.
    2026)'
  text: |-
    Vrabel podrobně líčí kauzu své manželky Bojany (srbská státní příslušnice), která se stala nástrojem likvidace Vrabelovy aktivisty role. V roce 2022 dala svůj bankovní účet jako záchytné místo pro výběr darů na demonstrace; peníze přeposílala na příslušné účely.

    Průběh kauzy:
    1. Hospodářská kriminálka šetřila případ přes rok a v závěrečné zprávě konstatovala, že vše bylo v souladu s právem — Bojana vystupovala jako příkazník, dárci jako příkazci, peníze byly použity dle určení.
    2. Insolvenční správce Vrabelových dluhů přesto žádal po Bojaně vydání přijatých peněz s tvrzením, že šlo o Vrabelovy prostředky. Bojana odmítla. Správce ji zažaloval.
    3. Soud odmítl připustit jakékoli důkazy a uložil Bojaně zaplatit miliony insolvenčnímu správci.
    4. Bojana podala trestní oznámení na správce — policie je zamítla a pohrozila jí trestním stíháním za křivé obvinění.
    5. Ministr vnitra Vít Rakušan označil Bojanu za „bezpečnostní ohrožení státu" bez jakéhokoliv odůvodnění — a tím jí bylo zamítnuto udělení českého státního občanství.
    6. Hnutí ČR na prvním místě podalo podnět ústavněprávnímu výboru PS; výbor (doktorka Vesecká) odpověděl, že parlament se takovými věcmi nemůže zabývat — přitom týden poté výbor zřídil komisi pro kauzu Bitcoin a Dozimetr (ačkoliv komise nemá právo vstupovat do trestních řízení).

    Vrabel označuje celý řetězec (insolvenční správce, policie, státní zastupitelství, soud) za organizovaný zločin.

    V nedělním vysílání **21. 6. 2026** kauzu zopakoval s dalšími detaily: insolvenční správce si prý část nároku „vymyslel" (570 tis. Kč chybným sečtením), soud uložil platbu „bez jakéhokoliv dokazování" a s příslušenstvím dluh dnes dosahuje ~3 milionů Kč. K Evropskému soudu (ESLP) lze podle něj jít až po vyčerpání všech opravných prostředků v ČR (nejvyšší + ústavní soud); ve věci „bezpečnostního ohrožení" je to navíc zákonem vyňato ze soudního přezkumu. Bojanu označuje za srbskou nacionalistku, která jen pomáhala jemu — není „český vlastenec" ani ohrožení ČR.
  osoby:
  - osoba: vit-rakusan
    vztah: negativni
    kontext: Označil Vrabelovu manželku Bojanu za „bezpečnostní ohrožení státu" bez zdůvodnění — zablokoval
      jí udělení čs. občanství
