  text: 'Na summitu Evropského politického společenství (EPS) v Jerevanu s účastí 40+ lídrů Babiš při
    setkání s Jensem Ruttem prohlásil, že ČR NATO výdajům „podřídí vše." Vrabel to interpretuje jako potvrzení
    svého opakovaného argumentu: Babišova vláda se zahraničně-politicky neliší od předchozí Fialovy koalice.
    Babiš se na stejném summitu bilaterálně setkal i se Zelenským.'
