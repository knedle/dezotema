  text: 'Experti Daniel Prokop (sociolog) a Daniel Hulé (Člověk v tísni) navrhli udělení rodičovské dovolené
    ukrajinským ženám v ČR jako způsob, jak zvýšit českou natalitu. Vrabel návrh komentuje sarkasticky:
