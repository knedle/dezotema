  nadpis: 'Náklady na ukrajinskce pracovníky v ČR: 250 miliard Kč — Rajchl (3. 5. 2026)'
  text: |-
    Rajchl polemizuje s ministrem Jurečkou (MPSV), který tvrdí, že Ukrainci v ČR jsou pro ekonomiku přínosem. Rajchl namítá, že Jurečkovy výpočty jsou chybné metodologicky:
    - Jurečka započítává jen daňové příjmy a DPH z výdajů (odhadované hodnoty), ale nezapočítává náklady na zdravotní péči, policii, hasiče a sociální dávky
    - Kiel Institut + NYT vypočetly, že ČR dosud vynaložila přibližně **250 miliard Kč** na podporu Ukrajinců v zemi (v kontrastu k deklarovaným přínosům)
    - Od roku 2022 přišlo do ČR celkem 404 000 Ukrajinců; v květnu 2026 jich pracuje přibližně 214 000 — zbytek nepracuje nebo již odešel

    Rajchl z toho vyvozuje: tvrzení, že „Ukrainci pomáhají naší ekonomice", je neúplné; reálné náklady jsou podstatně vyšší než uváděný příjem. Opakuje přitom svoji pozici: chápe zájem korporací (nižší mzdy), ale z pohledu českých zaměstnanců jde o hospodářskou soutěž, která snižuje mzdy.
  podtema: Ekonomický program PRO
- id: rajchl-2026-05-03-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'EU válečná ekonomika: Evropa utrácí 7× více než Rusko — Rajchl vs. Pospíšil (3. 5. 2026)'
  text: |-
    Rajchl vystoupil v TV debatě proti Jiřímu Pospíšilovi (Spolu/TOP 09). Ústřední teze Rajchla: Evropa již nyní utrácí na zbrojení 7× více než Rusko — přesto se Rusko drží na frontě a v ekonomice. Válečná ekonomika nevede k vítězství; vede buď k bankrotu nebo ke skutečné válce. Rajchl odmítá logiku, že zvyšováním výdajů Rusko zastraší.

    **Konkrétní příklady zbrojního předražení:**
    - **F-35:** provozní náklady dosahují přibližně 1 milionu Kč na hodinu letu; jde o jedno z nejdražších letadel v historii
    - **Leopard 2:** příliš těžký pro velkou část českých mostů; tanky jsou obecně zastaralou platformou v moderní válce (drony, přesné řízené střely)
    - **Jana Černochová 2024:** za pouhých 1,5 měsíce schválila zálohy 80 miliard Kč za F-35 od Lockheed Martin — dle Rajchla bez řádné parlamentní debaty

    Rajchl z toho vyvozuje: investice do F-35 a Leopardů je primárně v zájmu zbrojařů, nikoliv obrany ČR. Skutečná obrana by vyžadovala jiné priority (odolnost infrastruktury, zásoby, autonomní schopnosti).
  podtema: NATO, zbrojení a militarizace ČR/Evropy
