  nadpis: 'Babušíková (ČRo): Posselt je „největší český patriot" — Černohorský pohoršen (9. 5. 2026)'
  text: Jiří Černohorský sdílel video Jiřiny Babušíkové — komentátorky Českého rozhlasu a někdejší pracovnice
    Radio Free Europe — v němž Babušíková označila Bernda Posselta za „největšího českého patriota." Posselt
    je předsedou Sudetoněmeckého Landsmannschaftu a dlouhodobě prosazuje revizi Benešových dekretů. Černohorský
    výrok považuje za příklad toho, jak mainstreamová média systematicky normalizují Landsmannschaft a
    jeho agendu.
  osoby:
  - osoba: jirina-babusikova
    vztah: negativni
    kontext: Komentátorka ČRo, dříve Radio Free Europe — označila Posselta za „největšího českého patriota"
  podtema: Bernd Posselt a požadavky na zrušení dekretů
- id: cernohorsky-2026-05-09-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Lipská burza jako podmínka skutečného partnerství s Německem — Černohorský (9. 5. 2026)
  text: Černohorský požaduje zrušení závislosti na Lipské burze (Leipzig Energy Exchange, EEX) jako podmínku
    rovnoprávného partnerství s Německem. EEX je hlavním místem obchodování s elektřinou v Evropě — dokud
    ČR nakupuje elektřinu přes tuto burzu, nemohou být česko-německé vztahy dle Černohorského skutečně
    rovnoprávné.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
