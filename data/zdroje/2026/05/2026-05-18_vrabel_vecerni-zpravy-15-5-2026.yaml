  temata:
  - vetrniky
  nadpis: 'Větrníky: 60 kg nanočástic, vibrace a degradace půdy — Vrabel (15. 5. 2026)'
  text: 'Vrabel tvrdí, že každý větrník produkuje přibližně 60 kg nanočástic, které se dostávají do půdy
    a ovzduší v okolí. Tyto nanočástice znehodnocují zemědělskou půdu pod větrnými turbínami a způsobují
    zdravotní rizika. Větrníky navíc produkují vibrace, jež negativně ovlivňují zvěř v okolí. Vrabel tato
    tvrzení zasazuje do širší kritiky Green Dealu: ze záminky ochrany přírody dochází k faktickému poškozování
    přírody i zdraví lidí.'
  podtema: Technická a environmentální kritika
