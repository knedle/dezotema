  nadpis: 'Chemtrails: sypání těžkých kovů do atmosféry; větrníky 60 kg nanočástic (Vrabel, 15. 5. 2026)'
  text: 'Vrabel tvrdí, že chemtrails (kondenzační stopy letadel) jsou záměrné sypání těžkých kovů do atmosféry.
    Větrné elektrárny pak označuje za druhý zdroj kontaminace: každý větrník prý produkuje přibližně 60
    kg nanočástic, které se dostanou do půdy a ovzduší. Větrníky navíc způsobují vibrace a degradaci zemědělské
    půdy pod nimi. Vrabel to zasazuje do kritiky Green Dealu: ze záminky ochrany přírody dochází ke skutečnému
    poškozování přírody.'
  podtema: Historické konspirační výklady
- id: vrabel-2026-05-18-06
