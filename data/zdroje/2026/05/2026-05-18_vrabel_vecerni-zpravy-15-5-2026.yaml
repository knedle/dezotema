  nadpis: 'Lavrov na BRICS: Donbas — jazyková práva, Ukraina 4× překročila MMF limit (Vrabel, 15. 5. 2026)'
  text: 'Vrabel informuje, že ruský ministr zahraničí Lavrov na konferenci BRICS kritizoval porušování
    jazykových práv rusky mluvících obyvatel v Donbasu na Ukraině. Zároveň Lavrov poukázal na to, že Ukraina
    čtyřikrát překročila limit dluhu stanoveného MMF. Vrabel tyto dvě informace propojuje: Ukraina je
    ekonomicky závislá na Západu a z tohoto důvodu nemá skutečný zájem na mírovém urovnání.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-18-08
