  poznamka: 'Přeskočeno — soubor zjevně označen jako Rajchl, ale obsah je jiného mluvčího. Speaker se
    sám identifikuje jako „Ladislav" a hovoří spolu s moderátorkou „Zuzkou" — zřejmě Vrabelův večerní
    pořad ze 14. 5. Témata odpovídají Vrabelovu formátu (Trump-Xi, dluhopisy, Rubio/NATO, EU chudoba).
    Rajchl se v přepisu neobjevuje. Zpracováno: přeskočeno'
