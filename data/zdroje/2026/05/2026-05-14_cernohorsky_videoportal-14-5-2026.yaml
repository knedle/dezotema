  text: 'Jiří Černohorský se v krátkém videu (4:24) ostře ohrazuje proti výroku Tomia Okamury, který v
    televizi prohlásil, že vláda „nemůže zakázat" sjezd Sudetoněmeckého Landsmannschaftu. Černohorský
    to odmítá: Bernd Posselt na akci veřejně prohlásil, že se mu Benešovy dekrety nelíbí — a vláda má
    na to dle Černohorského zákonné nástroje. Jako precedent uvádí motorkáře Night Wolves, kteří byli
    zakázáni přijet uctít Rudou armádu — zatímco Landsmannschaft je bez omezení. Odkazuje na Česko-německou
    deklaraci z roku 1997 a požaduje, aby vláda vyslala Německu formální protestní nótu.'
