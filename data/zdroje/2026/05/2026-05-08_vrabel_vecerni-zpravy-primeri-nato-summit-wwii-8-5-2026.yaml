vyroky:
- id: vrabel-2026-05-08-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: 'Macinka v Berlíně: Posselt „podcenil reakci" — dialog pokračuje — Vrabel (8. 5. 2026)'
  text: |-
    Ministr zahraničí Petr Macinka navštívil 8. května 2026 Berlín a podepsal memorandum o pokračování Česko-německého fondu budoucnosti do roku 2037. Jako komentář k sjezdu v Brně řekl pouze, že Posselt „podcenil reakci, kterou sjezd vyvolal" a „nezvolil vhodného partnera" (Meeting Brno je dle Macinky pro toto téma „nedostatečná" organizace). Macinka zdůraznil, že sjezdová debata česko-německé vztahy „neohrozí."

    Vrabel hodnotí ironicky: „Největší útok na Posselta byl, že si vybral špatnou agenturu — vyměň agenturu a je všechno v pořádku." Označuje to za projev tradiční české podřízenosti vůči Německu.
  podtema: Parlament, politické a stranické reakce
- id: vrabel-2026-05-08-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'NATO summit: Pavel vs. Babiš jako falešná narativní distrakce — Vrabel (8. 5. 2026)'
  text: 'Vrabel v komentáři ke sporu o účast na summitu NATO (8. 5. 2026) odmítá interpretaci konfliktu
    mezi prezidentem Pavlem a premiérem Babišem jako skutečného politického střetu. Oba politiky označuje
    za „hráče na stejné straně": oba slouží NATO a atlantickým strukturám, debata o tom, kdo pojede na
    summit, je záměrnou mediální distrakcí zakrývající, že pro výsledek summitu nezáleží na tom, zda ČR
    zastupuje Pavel nebo Babiš — oba by prosazovali identické pozice. Vrabel tak popírá, že volba Babišovy
    vlády přinesla skutečnou změnu zahraničně-politické orientace.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-05-08-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenský: příměří 9–11. 5. a výměna 1 000 zajatců — Vrabel (8. 5. 2026)'
  text: 'Vrabel ve vysílání z 8. května 2026 informuje, že Zelenský oznámil dočasný klid zbraní od 9.
    do 11. května 2026 a výměnu válečných zajatců v poměru 1 000:1 000. Vrabel hodnotí pozitivně — každý
    den klidu zachrání stovky životů. Avšak za předchozí dočasné příměří bylo zaznamenáno 1 630 porušení
    zastavení palby (dle ruského MO). Výzvu k evakuaci diplomatů z Kyjeva EU ignorovala — Vrabel komentuje
    sarkazmem: „Evropští diplomaté jsou nesmrtelní — jsou čistí jako oko Boží."'
  podtema: Vyjednávání a mír
