  nadpis: 'Migrační pakt: české vládní odmítnutí je formálně prázdné (Vrabel)'
  text: 'Vrabel upozorňuje (1. 5. 2026), že česká vláda sice deklaruje odmítnutí migračního paktu, ale
    neprovedla žádný formální opt-out — pakt začíná platit přibližně 10. května 2026. Pokud vláda začne
    odporovat (odmítne přijímat migranty nebo platit), EU ji zažaluje u Evropského soudního dvora, vyhraje
    a ČR zaplatí pokuty navíc k původním závazkům. Vrabel to uvádí jako příklad toho, jak EU funguje:
    deklarace v médiích nestačí, k reálnému vyvázání je třeba formální právní krok.'
- id: vrabel-2026-05-01-05
