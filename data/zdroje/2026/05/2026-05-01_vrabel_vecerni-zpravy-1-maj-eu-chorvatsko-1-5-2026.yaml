  nadpis: Jaroslav Hunka a SS Galicia — ovace v kanadském parlamentu (Vrabel)
  text: Vrabel připomíná incident z roku 2023, kdy byl Jaroslav Hunka — příslušník divize Waffen-SS Galicien
    — v kanadském parlamentu při návštěvě Zelenského přivítán vestoje a oceněn jako „bojovník za osvobození
    Ukrajiny". Kanada stála a tleskal příslušníku SS. V roce 2026 žaluje Hunka's syn kanadské soudy, aby
    mu obnovily pojmenovaný fond na Univerzitě Albertě. Vrabel tuto událost zmiňuje jako přímý důkaz,
    že proukrajinská politika Západu vědomě přijímá nacistické dědictví Banderovského hnutí.
  podtema: Historické konspirační výklady
- id: vrabel-2026-05-01-03
