  poznamka: 'Večerní zprávy 1. máje se Zuzkou. Klíčová témata: prvomájový průvod Praha (Antifa, SPD, PRO,
    KSČM); Vrabel: Ukrajina = fašistický stát z definice (Zelenský jako kult vůdce, Bandera, zakázaná
    opozice, militarismus); Vrabel neplánuje demonstrace (online vzdělávání); predikce: 40 % světa bez
    dostatku jídla 2027 (Hormuz → fosílie → amoniak → hnojiva); ČR jako zbrojní výrobna (WWII analogie);
    Operation Oluja 1995 (Chorvatsko — 200 tisíc Srbů vyhnáno, 283 mrtvých, dodnes nikdo nepotrestán);
    Hunka SS Galicia — ovace v kanadském parlamentu; Palantir = Thiel (napojení na britský fašismus, sponsor
    JD Vance); Trumpovi synové: wolfram v Kazachstánu; US-Írán 60denní lhůta — Trump ji obešel; migrační
    pakt ČR — vládní odmítnutí bez formálního opt-outu; vstup Ukrajiny do EU (Vrabel: kategoricky ne).'
