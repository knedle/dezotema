  poznamka: 'Interview s Ivanem Noveským a Hynkem Beranem v poslanecké sněmovně při semináři o dolech.
    Větrné elektrárny v akceleračních zónách umístěny na bonitní zemědělské půdě; zóny skrývají chráněné
    krajinné prvky (Blaník, Říp). Větrníky pokryjí jen 5 z 15–20 mld. kWh (1/3 výkonu uhlí). Rajchl: „zločinný
    nesmysl." Termíny pro veřejnost: obce do 15. 5., ostatní do 1. 6. Mapy: MPO + MMR.'
