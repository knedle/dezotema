  nadpis: Rajchlův skandál s falešnými sledujícími — Vrabel (10. 5. 2026)
  text: 'Vrabel ve vysílání 10. 5. 2026 informuje, že Facebook smazal Rajchlovi falešné sledující: jeho
    stránka klesla z přibližně 100 tisíc na 35 tisíc fanoušků a Instagram z neznámého počtu na přibližně
    8 tisíc. Vrabel to komentuje kriticky — nakupování sledujících považuje za podvod na vlastním publiku.'
  osoby:
  - osoba: rajchl
    vztah: negativni
    kontext: Facebook smazal falešné sledující — stránka klesla z ~100 k na 35 k, Instagram na ~8 k; Vrabel
      to označuje za podvod na vlastním publiku
  podtema: Ekonomický program PRO
- id: vrabel-2026-05-10-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 400 tisíc mladých Ukrajinců na Západě jako zárodek evropské armády — Vrabel (10. 5. 2026)
  text: |-
    Vrabel tvrdí, že přibližně 400 tisíc mladých Ukrajinců ve věku 18–24 let odešlo na západ Evropy přes schéma „dočasné ochrany." Dle jeho interpretace to není náhoda — jde o záměrný plán, jak tuto skupinu integrovat do budoucí evropské armády, místo aby byla nasazena na frontě. Ukrajina tak dle Vrabela vyměnila možné vojáky za diplomatický kapitál v jednáních s EU.

    Souběžně zmiňuje mobilizační krizi na Ukraině: zprávy o jednotkách TCK (Územní centrum doplňování), falšování invalidních průkazů a existenci seznamů Ukrajinců v zahraničí, které by mohly být použity k organizaci jejich návratu.
  podtema: Ekonomický program PRO
- id: vrabel-2026-05-10-04
