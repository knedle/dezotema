  poznamka: 'Nedělní dlouhé vysílání. Témata: hantavirus — Deutsche Welle, přenos člověk-člověk, Moderna
    má vakcínu (podezřelé), Vrabelův příběh o příteli zemřelém za 2 dny, srovnání s covidem; Macinka v
    Německu résumé + detailní analýza; Fico v Moskvě — Putin navrhl Gerharda Schrödera jako zprostředkovatele
    EU; Putinův projev ke Dni vítězství; Marco Rubio: USA odstupuje od mírových jednání; Rajchlův skandál
    s falešnými sledujícími (Facebook smazal: 100k→35k, Instagram ~8k); Ukraina mobilizace — TCK, falešné
    invalidní průkazy, seznamy Ukrajinců na Západě; 400 tisíc mladých Ukrajinců (18–24) odešlo přes „dočasnou
    ochranu" na Západ — plán zařadit je do evropské armády; demonstrace na Staroměstském náměstí 9. 5.'
vyroky:
- id: vrabel-2026-05-10-01
  typ: tvrzeni
