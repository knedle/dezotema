  nadpis: Rajchlův skandál s falešnými sledujícími — Vrabel (10. 5. 2026)
  text: 'Vrabel ve vysílání 10. 5. 2026 informuje, že Facebook smazal Rajchlovi falešné sledující: jeho
    stránka klesla z přibližně 100 tisíc na 35 tisíc fanoušků a Instagram z neznámého počtu na přibližně
    8 tisíc. Vrabel to komentuje kriticky — nakupování sledujících považuje za podvod na vlastním publiku.'
  podtema: Ekonomický program PRO
