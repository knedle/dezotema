  nadpis: 'Marco Rubio: USA odstupuje od mírových jednání — Vrabel (10. 5. 2026)'
  text: Vrabel informuje, že americký ministr zahraničí Marco Rubio oznámil, že USA odstupují od aktivního
    zprostředkování mírových jednání mezi Ruskem a Ukrainou. Vrabel to hodnotí jako důsledek Trumpovy
    frustrace z neochoty obou stran ke kompromisu — USA přestávají hrát roli mediátora, čímž se válka
    ve střednědobém horizontu přesouvá výhradně do evropské geopolitické sféry.
  osoby:
  - osoba: marco-rubio
    vztah: negativni
    kontext: 'Oznámil, že USA odstupují od aktivního zprostředkování mírových jednání — Vrabel: válka
      se přesouvá výhradně do evropské geopolitické sféry'
  podtema: Vyjednávání a mír
- id: vrabel-2026-05-10-05
