  nadpis: Hantavirus jako příští pandemie
  text: Vrabel na základě reportáže Deutsche Welle o hantaviru s přenosem člověk-člověk varuje, že jde
    o potenciální zárodek příští pandemie — srovnatelný s ranou fází covidu. Podezřelé je, že Moderna
    má vakcínu připravenou ještě před globálním rozšířením.
