  nadpis: Brusel jako „hlavní světový válečný štváč" — Rajchl (12. 5. 2026)
  text: 'Rajchl tvrdí, že špičky EU jsou v současnosti hlavním světovým válečným štváčem. Rusko prý nechce
    pokračování konfliktu (proto navrhuje Schrödera), Amerika má jiné priority, Zelenský je unavený a
    obyčejní Ukrajinci trpí. Jedinou silou, která konflikt drží při životě, jsou Brusel a zelenský okruh.
    Motivací je finanční: EU si může bez kontroly půjčovat astronomické částky a přesměrovávat je na zbrojní
    korporace, které jsou jejími sponzory. Konflikt zároveň zakrývá ekonomický propad EU způsobený Green
    Dealovou politikou.'
  citace:
  - text: Špičky EU sedící v Bruselu jsou v tuto chvíli hlavním světovým válečním štváčem. Oni za každou
      cenu chtějí, aby ten vojenský konflikt pokračoval. Bez ohledu na to, že tam denně umírají stovky
      nevinných lidí.
  podtema: Příčiny a odpovědnost za válku
