- id: vrabel-2026-05-07-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Sudetenland sjezd jako „záměrná mlha" — Vrabel (7. 5. 2026)
  text: 'Vrabel ve vysílání ze 7. května 2026 označil veškerý mediální hluk kolem Sudetoněmeckého sjezdu
    za záměrné odvádění pozornosti od skutečné politiky vlády: „Ten celý příběh o Landsmannschaftu je
    jenom strašná mlha, abyste koukali někam jinam a neviděli, co dělá ta vláda" — konkrétně prolamuje
    dluhovou brzdu a zadlužuje ČR pro zbrojení do NATO.'
  podtema: Bernd Posselt a požadavky na zrušení dekretů
- id: vrabel-2026-05-07-02
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Česko-německá deklarace 1997 jako vzdání se válečných reparací — Vrabel (7. 5. 2026)
  text: 'Vrabel tvrdí, že česko-německá deklarace z roku 1997 představuje faktické vzdání se nároku na
    válečné reparace. Přestože jde jen o politické prohlášení (reparace stanovené vítěznými mocnostmi
    jsou dle Vrabela stále právně vymahatelné), každá česká vláda ji používá jako argument, proč Německo
    nepožádat o plné odškodnění — ČR dostala jen asi 0,5 % dlužného. Vrabel: „Pořád jim lezou do pozadí,
    aby nechtěli po Německu ty peníze."'
  podtema: Germanizace, restituce a „Česko je plán“
- id: vrabel-2026-05-07-03
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: USA útočí na Írán — třetí fáze konfliktu (Vrabel, 7. 5. 2026)
  text: |-
    Ve večerních zprávách 7. května 2026 Vrabel informoval, že Spojené státy přešly do třetí fáze konfliktu s Íránem: podnikly vojenský útok na ostrov Qešm a přístav Bandar Abbas; íránský ministr potvrdil útok i na lodě v Hormuzském průlivu. Izrael zároveň zaútočil na Libanon (12 mrtvých, vč. 2 dětí a 1 medika). Vrabel hodnotí: „Konflikt pokračuje a bude se rozvíjet dál."

    USA zastavily „Project Freedom" (vojenský doprovod tankerů Hormuzem) po pouhých 36 hodinách poté, co Saúdská Arábie a Kuvajt pozastavily přístup americké armádě ke svým základnám a vzdušnému prostoru. Vrabel komentuje: „Nakonec ty Iránci dosáhnou svého a Američané odejdou z Blízkého východu."
- id: vrabel-2026-05-07-04
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Medvedev: při válce NATO–Rusko by Rusko udeřilo na Evropu jako první — Vrabel (7. 5. 2026)'
  text: |-
    Vrabel komentuje článek Dmitrije Medvěděva v ruské agentuře TASS: v případě přímé války NATO–Rusko by Rusko nechtělo opakovat rok 1941, kdy čekalo na německý útok a ztratilo miliony. Medvěděv explicitně píše, že Rusko musí být připraveno na „prvotní teror Evropy" — útok jako první, aby se válka odehrávala na evropském, nikoliv ruském území.

    Vrabel tuto logiku zasazuje do kontextu: stejný přístup Rusko aplikovalo v roce 2022 na Ukrajině — udeřilo jako první, aby se válka nevedla na ruské půdě. Vrabel varuje, že válka s Ruskem by pro Evropu byla existenční.
  citace:
  - text: Pokud půjdou do války s Evropou, udělají to samé — udeří jako první, aby se válka odehrávala
      na území Evropy, ne na území Ruska.
  osoby:
  - osoba: dmitrij-medvedev
    vztah: negativni
    kontext: 'Doktrína preventivního úderu: při válce NATO–Rusko by Rusko udeřilo na evropská území jako
      první; Vrabel to uvádí jako varování před eskalací'
- id: vrabel-2026-05-07-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Česká dluhová brzda prolomena kvůli NATO 5 % — Vrabel (7. 5. 2026)
  text: 'Vrabel ve vysílání 7. 5. 2026 komentuje rozhodnutí České republiky navýšit výdaje na obranu na
    5 % HDP. Poukazuje na to, že ČR kopíruje německý vzor: Merz a koaliční partneři dohodli mimořádný
    fond mimo běžný rozpočet, čímž fakticky obešli ústavní dluhovou brzdu. Babišova vláda plánuje podobný
    způsob navýšení vojenských výdajů — formálně neporušit, ale fakticky obejít fiskální pravidla. Vrabel
    to hodnotí jako souběh NATO tlaku, zájmů zbrojního průmyslu a opuštění původních předvolební slibů
    o nepřekračování fiskálních limitů.'
  podtema: Ekonomický program PRO
- id: vrabel-2026-05-07-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Arménie: EU ji přitahuje do NATO kvůli obklíčení Ruska — Vrabel (7. 5. 2026)'
  text: Vrabel ukazuje mapku Arménie — zemí obklopenou Tureckem, Ázerbájdžánem, Gruzií a Íránem — a komentuje,
    proč EU investuje 30 milionů EUR do arménské výzbroje. Tvrdí, že západ systematicky buduje řetězec
    zemí kolem Ruska ze všech světových stran (Finsko, Polsko, Rumunsko, Arménie, Gruzie), aby mohl na
    Rusko útočit ze všech stran současně.
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-05-07-07
  typ: predikce
  temata:
  - blizky-vychod
  nadpis: 'Eskalace v Íránu: třetí fáze přeroste v regionální válku'
  text: Vrabel označuje útoky USA na ostrovy Qešm a Bandar Abbas a na oblast Hormuzského průlivu za „třetí
    fázi" konfliktu v Íránu, z níž hrozí přerůst v plnohodnotnou válku na Středním východě. Predikuje,
    že uzavření Hormuzského průlivu způsobí globální ropnou krizi a navazující potravinovou krizi (kvůli
    výpadku hnojiv závislých na fosilních palivech).
  predikce:
    horizont: v průběhu roku 2026
    stav: ceka
