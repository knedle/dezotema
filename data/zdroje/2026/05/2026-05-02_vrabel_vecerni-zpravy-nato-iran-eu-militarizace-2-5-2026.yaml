  poznamka: 'Sobotní večerní zprávy se Zuzkou. Klíčová témata: Zelenský-Fico telefonát (Fico podporuje
    vstup Ukrajiny do EU, Orbán blokáda pryč); Babiš jmenoval Landovského vládním zmocněncem pro NATO
    („třetí NATO člověk ve vládě"); Kolby (USA): Evropa musí převzít obranu a financování Ukrajiny; US
    stahuje 5 000 vojáků z Německa; Írán 16 poškozených US zařízení (CNN potvrdila); Amazon datová centra
    v SAE zasažena drony; Hormuz: průtok klesl z 20M na 4M barelů/d (IEA); Karel III v Kongresu; Trump
    25% cla na EU auta; Německo modernizuje Bremerhaven (1,35 mld EUR, vojenská logistika); EU ADDV —
    kamera v autech pro sledování řidiče od července 2026; 6G síť jako planetární sledovací organismus
    (AI real-time tracking); Kuwait zastavil vývoz ropy.'
