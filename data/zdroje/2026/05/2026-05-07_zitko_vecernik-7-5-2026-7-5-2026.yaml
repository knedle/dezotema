  nadpis: 'ČsTV2: kampaň za vrácení televizních poplatků od 12. 3. 2020 (7. 5. 2026)'
  text: 'Vedle Zítka spustila kampaň za vrácení poplatků i ČsTV2. V pořadu z 7. 5. 2026 vyzvala diváky,
    aby písemně požadovali od ČT vrácení koncesionářských poplatků zaplacených od 12. března 2020 (datum
    vyhlášení nouzového stavu), s odkazem na porušování zákona č. 483/1991 Sb. o České televizi. Argumentace
    ČsTV2 souzní se Zítkovou: veřejnoprávní médium ze zákona musí poskytovat vyvážené, ověřené a objektivní
    informace — to přestalo platit s nástupem COVID propagandy. Viz také: [Zákon č. 483/1991: Zítkovy
    tři příklady porušení (4. 5. 2026)](#zákon-č-4831991-tři-zdokumentované-příklady-porušení--argument-zítka-proti-placení-poplatků-4-5-2026).'
  podtema: ČT poplatky a omezování na sociálních sítích
