- id: cernohorsky-2026-05-19-03
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: 'Bavorský CDU Holetšek a poslanec Hopp: zasahování do vnitřních věcí ČR (Černohorský, 19. 5.
    2026)'
  text: 'Černohorský reagoval s rozhořčením na zprávu, že předseda frakce CDU v bavorském zemském sněmu
    Klaus Holetšek označil usnesení Poslanecké sněmovny ČR odsuzující sjezd Landsmannschaftu za „politování
    hodné" a varoval před „špatným signálem pro česko-německé vztahy." Bavorský poslanec Gerhard Hopp
    následně vyzval české poslance, aby usnesení odmítli. Černohorský hodnotí toto vyjádření jako nepřijatelné
    zasahování cizího regionálního politika do suverénních rozhodnutí českého parlamentu. Jako kontrast
    říká: „Dovedete si představit, že bychom se srali Němcům do rozhodnutí Bundestagu?"'
  podtema: Politici a Landsmannschaft
- id: cernohorsky-2026-05-19-04
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Parlamentní a prezidentský slib vs. skutečnost — Černohorský (19. 5. 2026)
  text: 'Černohorský cituje text ústavního slibu prezidenta (čl. 59) a slibu poslance (čl. 23): obě formule
    obsahují „věrnost České republice" a dodržování ústavy — bez zmínky o Evropské unii nebo cizích státech.
    Ptá se: co z tohoto slibu Petr Pavel a koaliční poslanci fakticky plní, když podporují záštitu sjezdu
    Landsmannschaftu a reagují na pokyny bavorských politiků? Označuje fakt, že koaliční poslanci „bonzovali"
    Němcům ještě v průběhu sněmovní schůze, za přímou kolaboraci s cizí mocností.'
  podtema: Parlament, politické a stranické reakce
