  - benesovy-dekrety
  nadpis: 'Michal Svatoš (Landsmannschaft): „vymydlit palice pár jedinců" = Benešovy dekrety padnou (Černohorský,
    19. 5. 2026)'
  text: |-
    Černohorský přehrál video Michala Svatoše — zástupce krajského vedení Sudetoněmeckého Landsmannschaftu — v němž Svatoš popisuje strategii: stačí „vymydlit palice pár jedinců" (indoktrinovat klíčové osoby) a mladé generace přestanou o Benešových dekretech uvažovat jako o podstatné věci, čímž cesta k jejich zrušení bude otevřená. Černohorský komentuje: „Mají to připravený v šuflíku" — přirovnává k tomu, jak se propagovala EU se sliby prosperity, které se nenaplnily.

    > „Stačí jenom vymydlit palice pár jedinců v České republice, respektive mladým generacím, a dekrety půjdou do hajzlu, protože je to nebude zajímat." — Michal Svatoš (citováno Černohorským), [Videoportál 19. 5. 2026](/zdroje/2026-05.md#2026-05-19_cernohorsky_videoportal-19-5-2026-hradni-svine)
  osoby:
  - osoba: michal-svatos
    vztah: negativni
    kontext: Zástupce LM — citován pro strategii „vymydlit palice pár jedinců" = dekrety padnou
  podtema: Podstata dekretů, odsun a smíření
