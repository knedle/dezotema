  text: Černohorský informuje, že předsedkyně PS Markéta Pekarová Adamová se chystá osobně účastnit sjezdu
    Sudetoněmeckého Landsmannschaftu v Brně (22.–25. května 2026). Považuje to za skandál — předsedkyně
    parlamentu reprezentuje Českou republiku na akci organizace, jejímž cílem je revize Benešových dekretů.
  osoby:
