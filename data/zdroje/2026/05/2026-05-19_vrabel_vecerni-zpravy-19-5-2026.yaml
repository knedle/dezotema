  poznamka: 'Úterní večerní zprávy. Témata: Izrael Saar v ČR — diplomatická osa USA/EU/NATO/Izrael; Putin
    v Číně — 25 let partnerství, 40 dokumentů; Trump a Írán — útok odložen, WSJ: zálivové státy nevěděly,
    Trump ztrácí kredibilitu; EU kravský hnoj jako náhrada ruského plynu; Musk vs. OpenAI soud zamítnut;
