- id: vrabel-2026-05-19-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'EU: kravský hnoj jako náhrada levného ruského plynu (Vrabel, 19. 5. 2026)'
  text: |-
    Vrabel ironicky komentuje plán Evropské komise (Politico) využít zemědělský odpad včetně kravského hnoje jako součást strategie snižování závislosti na dovozu energií — konkrétně jako náhradu za ruský plyn při výrobě hnojiv a energie.

    Vrabel to považuje za absurdní: EU sama odpojila Evropu od levného ruského plynu, na jehož základě byla vybudována plynofikace měst, čisté ovzduší a průmysl. Nyní hledá náhradu v bioplynových technologiích. Doplňuje paradox: krávy se mají likvidovat, protože „prdí" (emise metanu) — a zároveň by jejich hnoj měl nahradit ruský plyn.
  citace:
  - text: To, že nemáme ruský plyn, tak to budeme řešit kravským hnojem. A to je vynikající, to je geniální.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-05-19-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Kybernetický útok na weby ČRNPM/Vrabela (19. 5. 2026)
  text: |-
    Vrabel ve vysílání 19. 5. informuje, že všechny jeho weby byly kyberneticky napadeny a smazány — včetně záloh:

    - **CRI1.cz** — smazán kompletně
    - **CRI1.live** — videa a online televize smazány
    - **Mafie v kravatách** — projekt od roku 2022, celý smazán vč. databáz
    - **Jedna rodina** — sociální síť pro registrované uživatele, smazána

    Útočník není znám. Hosting provider potvrdil, že vše je smazáno a obnova není možná ze serveru. Vrabel doufá, že zálohy existují mimo server u IT kamaráda. Zároveň upozorňuje, že tím byla zničena online petice proti sjezdu Sudetoněmeckého Landsmannschaftu — platí pouze papírové podpisy; nové sběrné místo v Brně 24.–25. 5. 2026.

    Vrabel nespeculuje o pachateli, ale kontext jeho vysílání implikuje, že jde o cílený útok na opozičního aktivistu.
  podtema: 'COVID rozsudky: odsouzení za varování'
- id: vrabel-2026-05-19-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Jaderné zbraně v ČR: Babiš i Pavel shodně za, START smlouva skončila (Vrabel, 19. 5. 2026)'
  text: |-
    Vrabel varuje před plány na umístění jaderných zbraní na území ČR. Klíčové body:

    - **Rusko zahájilo cvičení jaderných sil** s Běloruskem: 64 000 vojáků strategických raketových sil, námořnictvo, ponorky, letectvo; scénáře zahrnují i jaderné zbraně umístěné v Bělorusku.
    - **START smlouva skončila v únoru 2026** — nebyla prodloužena. Obě strany mohou zbrojit bez limitů.
    - **Babiš i Pavel = stejná politika:** Pavel prosazoval jaderné odstrašení v NATO již v roce 2014. Babiš po několika dnech ve funkci souhlasil s tím, že ČR přijme „francouzský jaderný deštník." Vrabel: „Ta skvělá změna, ta skvělá vláda, kterou jsme si zvolili v roce 25."
    - **F-35A jako jaderný nosič:** koupě F-35A dělá z ČR platformu pro jaderné taktické zbraně — Vrabel varoval před tím od roku 2022.
    - **Logika je obrácená:** přijetím jaderných zbraní se ČR nestane bezpečnější, ale stane se prioritním cílem Ruska.
  citace:
  - text: 'Jenom se staneme cílem pro Ruskou federaci, protože řeknou: ano, ty Češi, oni tam mají taky
      nějaké jaderné zbraně.'
- id: vrabel-2026-05-19-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: SPD v koalici pořádá demonstrace proti vlastní vládní politice — Vrabel (19.–22. 5. 2026)
  text: |-
    Vrabel poukazuje na strukturální pokrytectví SPD a jejích poslanců (Rajchl, Okamura): jsou součástí vládní koalice, ale zároveň pořádají demonstraci v Brně 24. 5. 2026 proti sjezdu Sudetoněmeckého Landsmannschaftu a Rajchl napsal veřejnou výzvu ministrovi vnitra (ze stejné koalice), aby sjezd zakázal.

    Vrabel to označuje za „show pro lidi" — v koalici se věci řeší interně přes koaliční smlouvu a kluby, ne veřejnými výzvami. SPD přitom má silnou páku: ANO nemá bez SPD parlamentní většinu (potřeba 101 křesel). Pokud by SPD vyhrožovalo odchodem z koalice, Babiš by byl nucen jednat.

    Konkrétní historické pokrytectví SPD v den konání sjezdu (22. 5. 2026): strana v opozici opakovaně říkala „vy občané demonstrujte na ulicích, my budeme dělat naší práci v parlamentu" — SPD s Vrabelem na velkých demonstracích nikdy nešla. Teď, co je ve vládě a má reálný politický nástroj (zakázání sjezdu jako v roce 2009), místo toho organizuje demonstrace, a to na stejné ulici, na níž k předchozím demonstracím sama nechodila.
  citace:
  - text: Kdyby mu řekli, zakážete Sudetoněmecký Landsmannschaft, nebo nebudeme z vlády — tak co myslíte,
      že udělá Andrej Babiš?
