- id: rajchl-2026-05-24-02
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Dialog mezi pachatelem a obětí nelze vynutit — smíření musí být autentické (25. 5. 2026)
  text: |-
    Rajchl ve svém projevu z brněnského pochodu formuluje zásadní princip: smíření, které odmítá pojmenovat jednoznačného pachatele a oběť, není smíření — je to nucení oběti, aby zapomněla. „Dialog mezi pachatelem a obětí nelze vynutit. To není smíření, to je snaha o to, abychom zapomněli, abychom rezignovali na naší národní pamět."

    Kdokoliv, kdo se tváří jako mediátor a přitom trvá na termínu „vzájemná vina", je dle Rajchla fakticky diktátorem bez empatie — neboť nerespektuje trauma těch, kteří prožili nacistickou okupaci nebo ztratili blízké. V případě SdL sjezdu Posselt sám ukázal, že mu o smíření nejde: označil usnesení PS za „karikaturu a frašku" — to odhaluje nadřazenost, nikoliv smířlivost.

    Závěr: SdL je nepřátelské sdružení vůči českým zájmům — Němci a sudeto-němečtí občané, kteří respektují ČR, jsou vítáni kdykoli; organizace Bernda Posselta „nemá co dělat nikdy, ani za tisíc let."
  podtema: Podstata dekretů, odsun a smíření
- id: rajchl-2026-05-24-04
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: 'Brněnský pochod: smíření nelze vynutit, válečné reparace jako podmínka — Rajchl (24. 5. 2026)'
  text: |-
    Rajchl promluvil na demonstraci proti sjezdu Sudetoněmeckého Landsmannschaftu v Brně. Ústřední teze: dialog mezi pachatelem a obětí nelze nikdy vynutit — kdo se tak tváří, není mediátorem, ale diktátorem bez soudce a bez empatie k obětem nacistické okupace. Smíření, které nevychází z upřímné omluvy, označuje za záměrnou snahu o to, aby Češi zapomněli a rezignovali na národní paměť.

    Za nejhanebnější označuje české přísluhovače, kteří se staví na stranu SdL místo přeživších z Lidic. Za největšího přísluhovače ze všech označuje prezidenta Pavla, který nad sjezdem převzal záštitu a zároveň prosazuje zánik ČR v Evropském superstátu.

    Podmínku jakéhokoli smíření formuloval jednoznačně: Německo musí nejprve zaplatit válečné reparace. Vůči AFD deklaruje ochotu ke spolupráci, ale s varováním: jakmile jakákoli část AFD sáhne na Benešovy dekrety, spolupráce skončí. Slibuje, že pokud by SPD bylo na ministerstvu, sjezd Landsmannschaftu by bezpodmínečně zakázalo. Připomíná, že Polsko by si takový sjezd na svém území nikdy nedovolilo.
  citace:
  - text: Dialog mezi pachatelem a obětí nelze vynutit. To není smíření, to je snaha o to, abychom zapomněli,
      abychom rezignovali na naší národní pamět.
  - text: Smíření a odpuštění od nás, kterým jste ublížili, tak začněte tím, že nám zaplatíte škody, které
      jste tady způsobili.
  osoby:
