  nadpis: 'Boldy: 13 vědců zavražděno po odkrytí volné energie (24. 5. 2026)'
  text: Boldy tvrdí, že v posledních dvou letech záhadně zemřelo 13 vrcholových vědců ze dvou nebo tří
    stejných korporací, kteří přišli na antigravitaci a volnou energii. Tato oblast je dle Boldyho systematicky
    potlačována — přesně jako byl potlačen Nikola Tesla — protože by zbavila korporace příjmů z emisních
    povolenek a fosilních paliv. „Vědecký vývin civilizace je kontrolován korporacemi."
  podtema: Globalistická agenda a další výklady
