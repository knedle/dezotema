vyroky:
- id: vrabel-2026-05-18-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Írán a Hormuz: nová mýtná pravidla průjezdu (Vrabel, 18. 5. 2026)'
  text: 'Vrabel informuje, že Írán zavedl nová pravidla pro průjezd lodí Hormuzským průlivem — lodě musejí
    předem získat povolení íránských úřadů a pohybovat se ve vymezených koridorech. Vrabel to hodnotí
    jako očekávaný krok: Írán jasně deklaroval, že bude vybírat mýtné a kontrolovat průjezd. Trump reagoval
    AI-generovaným obrázkem potopených íránských lodí — Vrabel ho interpretuje jako opakované vyhrožování
    útokem na Írán.'
- id: vrabel-2026-05-18-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: EU ekonomika vybudována na levném ruském plynu — vzdáváme se jí dobrovolně (Vrabel, 18. 5. 2026)
  text: 'Vrabel připomíná výrok Ursuly von der Leyen, která sama přiznala, že Evropa byla „vybudována
    na levném plynu z Ruska." Vrabel poukazuje na absurditu: desetiletí fungující a ekonomicky výhodné
    energetické partnerství bylo přerušeno dobrovolně a bez racionálního ekonomického důvodu. Místo levného
    ruského plynu dovážíme dražší a méně kvalitní LNG z USA, ropu z Venezuely nebo Kazachstánu. Vrabel
    k tomu dodává: od Nord Streamu, který byl zničen, Trump sám prohlásil, že žádný takový plynovod nebude
    fungovat — a nefunguje.'
  citace:
  - text: Dávno, ještě před pár lety, jsme měli stabilní ekonomiku [...] postavenou na dodávkách ropy
      a plynu z Ruska. A teď se toho dobrovolně zbavujeme. Naprosto bezdůvodně.
  podtema: Energetika a Rusko
- id: vrabel-2026-05-18-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Babiš/digitální ID: věkové ověření na soc. sítích = sledování všech dospělých (Vrabel, 18.
    5. 2026)'
  text: |-
    Vrabel tvrdí, že Babiš svou schůzkou s Globální Leadership Exchange (organizace pro duševní zdraví a digitální závislost dětí) de facto zahájil prosazování digitálního ID v ČR. Logika kroků: 1) soc. sítě škodí dětem, 2) zavést věkový zákaz do 14 let, 3) aby se ověřilo, kdo má 14+, musí se ověřit každý uživatel digitální identitou. Výsledkem bude, že každý přihlášení na soc. síti bude vázán na občanský průkaz — stát i platformy budou vědět, kdo, kdy a co napsal, komu a o čem.

    Vrabel poukazuje, že von der Leyen o digitálním ID mluvila v Oslu a covidové digitální certifikáty byly přímým prototypem tohoto systému. Babiš přitom veřejně sliboval, že žádné digitální ID nebude.
  citace:
  - text: Teďka on právě začíná prosazovat [...] a to právě dneska večer, tím lidským oznámením.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: Účast na Global Leadership Exchange → prosazování digitálního ID přes věkové ověření na soc.
      sítích = zárodek plošného sledování
  podtema: Historické konspirační výklady
- id: vrabel-2026-05-18-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Zbrojení jako korupce: ceny zbraní +50–60 %, výběrová řízení neexistují (Vrabel, 18. 5. 2026)'
  text: 'Vrabel poukazuje na to, že ceny zbraní v Evropě vzrostly za poslední dva roky o 50–60 % (uvádí
    estonský ministr obrany). Vrabel to nevysvětluje jako výsledek trhu, ale jako záměrnou korupci: vlády
    neprovádějí výběrová řízení, sjednávají kontrakty „tamhle s tím zbrojařem" a výsledkem je, že ČR koupila
    F-35A skoro dvakrát dráže než Izrael. Srovnává s COVIDem: stejný mechanismus — vyděsit obyvatelstvo,
    obejít výběrová řízení, realizovat stamilionové kšefty. Odhaduje, že za každý miliardový kontrakt
    si politik vezme 10–20 %.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-18-09
  typ: predikce
  temata:
  - nato-zbrojeni-militarizace
  nadpis: ČR jako cíl preventivního ruského útoku
  text: Vrabel cituje výrok ruského profesora, že Rusko mělo v roce 2022 „preventivně zničit jednu evropskou
    zemi", aby se Evropa probrala a přestala zbrojit. Vrabel spekuluje, zda tímto cílem by mohla být ČR
    kvůli muniční iniciativě. Výslovně říká, že „to není alegrace" — považuje to za reálnou eventualitu,
    ne hrozbu.
  predikce:
    horizont: neurčeno (v průběhu konfliktu)
    stav: ceka
- id: vrabel-2026-05-18-10
  typ: predikce
  temata:
  - blizky-vychod
  nadpis: Fico ztratí post po vzdání se ruské ropy
  text: 'Vrabel komentuje zprávu, že Slovensko jedná o ázerbájdžánském plynu jako náhradě ruského. Predikuje,
    že jakmile se Fico vzdá ruské ropy, ztratí zázemí a bude odstraněn z funkce: „Až se Fico zbaví ruské
    ropy, zbavíme se Fica."'
  osoby:
  - osoba: robert-fico
    vztah: pozitivni
    kontext: Jedná s Ázerbájdžánem o plynu jako náhradě ruského — Vrabel predikuje, že jakmile se Fico
      vzdá ruské ropy, ztratí zázemí a bude odstraněn
  predikce:
    horizont: neurčeno (krátkodobé)
    stav: ceka
