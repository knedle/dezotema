  poznamka: 'Středa večerní zprávy s Zuzkou. Témata: Německo 10 mld. EUR civilní obrana (kryty, 110k polních
    lůžek, sirény, aplikace) — příprava na válku na vlastním území; Landsmannschaft — Reichlův zákon o
    shromážděních jako špatný přístup, MV odpovědělo správně, jedině extremistická organizace funguje;
    Ebola v Bulovce — americký lékař, USA platil soukromý let; česko-izraelský obchodní fórum (Macinka
    + Saar); Putin-Xi — podpis dokumentu podporující ruské pojetí konfliktu; Senát USA 50:47 pro ukončení
    konfliktu v Íránu; NATO přechod od odstrašení k řeči o použití jaderných zbraní; Sarmat/Satan-2 parametry
    (16 hlavic, 2000km rozptyl, 18 Mach); vojenské cvičení NATO na Slovensku/Maďarsku; dočasná ochrana
    pro Ukraince — ČR není první bezpečná země, ale nelze je posílat Zelenskému.'
