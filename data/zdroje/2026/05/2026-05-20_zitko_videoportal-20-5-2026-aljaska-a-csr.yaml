  poznamka: 'Ohlédnutí za besedou; opakování teorie šarží. Případ Aljaška: pronajata na 99 let (1867),
    nikoliv prodána; Bělousov nalezl originál smlouvy; loď „Orkney" s $7,2M zlatem nikdy nedoplula; pronájem
    vypršel 1967; Rusko žádá $50 bilionů nebo vrácení území; Trump-Putin schůzka v Anchorage jako důkaz;
    Melania Trump = potomek Romanovců, Barron = dědic. ČSR právní teorie: zákon 11/1918 stále platí; reparace
    29 bilionů CZK (9 500 tun zlata) náleží jen ČSR, ne SR; jírovec u Vily Tugendhat zemřel rok po rozdělení.
    Poslední COVID tour: Velemín u Lovosic 22. 5. s Dr. Henzlem.'
