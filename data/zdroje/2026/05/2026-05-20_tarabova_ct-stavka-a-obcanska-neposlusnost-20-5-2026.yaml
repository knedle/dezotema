  nadpis: 'ČT zaměstnanci: výzva k stávce a varování před vládním násilím — Tarabová (20. 5. 2026)'
  text: 'Lenka Tarabová v krátkém klipu vyzývá zaměstnance ČT, aby nešli jen do stávkové pohotovosti,
    ale rovnou do stávky — nejlépe do **okupační stávky**. Deklaruje, že pokud k tomu dojde, společnost
    je musí plně podpořit, což by podle ní znamenalo občanskou neposlušnost přesahující mírová shromáždění.
    Varuje, že je třeba počítat s tím nejhorším: „vládní moc se může uchýlit k násilí." Zároveň se vyjadřuje
    ke smíření ministra kultury Macinky a MEP Turka se situací ČT: „myslí, že to projde, budou mít chleba
    namazaný po obou stranách — tak to říkám, že nebudou."'
  osoby:
  - osoba: mikulas-macinka
    vztah: negativni
    kontext: Ministr kultury — dle Tarabové si myslí, že „bude mít chleba namazaný po obou stranách" v
      otázce ČT; to nevyjde
  podtema: Mainstream jako politický aktivismus
