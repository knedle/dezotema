  poznamka: 'Záznam besedy ze 14. 5. ve Zlatých Moravciach. Hosté: Soňa Peková, Ľubomír Šlosár (slovenský
    právník), Marian Kotleba, Zítko. Peková: dvouvláknová DNA v šaržích, Turánek detekoval grafen (Raman
    + el. mikroskopie); Slovenská AV použila jiné ampule k protianalýze. Šlosár: trestní kvalifikace ublížení
    na zdraví → genocida; 7 úředních SV úmrtí vs. ~400 dle VAERS; Kotlár odmítl TO. Slovensko: soběstačnost
    98 %→38 %, dluh +800 %, 2 000 letadel→14. Zítko: zatčen 24. 6. 2024 ve Zlatých Moravciach, 17 000
    hodin videa, hrozba nucené vakcinace ve vazbě.'
