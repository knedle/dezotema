  nadpis: 'EU Cyprus summit: 90 mld. EUR pro Ukrainu — 60 % na zbraně — Vrabel (6. 5. 2026)'
  text: 'Vrabel komentuje summit EU na Kypru, kde bylo schváleno 90 mld. EUR pro Ukrainu, přičemž 60 %
