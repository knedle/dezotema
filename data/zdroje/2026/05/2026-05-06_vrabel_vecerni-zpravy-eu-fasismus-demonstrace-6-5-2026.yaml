- id: vrabel-2026-05-06-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: SPD a KSČM zakázaly loga ČRNPM a Miroslava Sládka na demonstraci v Brně — Vrabel (6. 5. 2026)
  text: |-
    Na protisudetoněmecké demonstraci v Brně organizované SPD a KSČM bylo zakázáno vstoupit s logy hnutí „Česká republika na prvním místě" (ČRNPM) a zakázán vstup Miroslavu Sládkovi. Vrabel to označuje jako doklad totality uvnitř samotné opozice.

    Vrabel spojuje toto chování s příkladem z roku 2024: člen Svobodných mu na Václavském náměstí řekl: „Kdybychom se dali dohromady s tebou, tak oni by nás do televize nevzali, naši sponzoři se to nelíbí." Podle Vrabela jsou všechny takzvané patriotické strany zbabělé a podřízené sponzorům — proto nejsou schopny sjednotit se ani na demonstraci.
  citace:
  - text: Komanči. Vždycky takoví byli, jsou takoví a vždycky takoví budou.
  dalsi_zdroje:
