vyroky:
- id: vrabel-2026-05-21-01
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Petr Pavel na GLOBSECu: EU se má stát investičním a logistickým sektorem NATO (Vrabel, 21.
    5. 2026)'
  text: 'Na bezpečnostní konferenci GLOBSEC prezident Pavel argumentoval, že NATO a EU nejsou konkurenti,
    ale doplňkové pilíře. EU má podle Pavla investovat do vojenské infrastruktury tak, aby odpovídala
    požadavkům NATO — přístávky, mosty, železnice, letiště. Vrabel čte toto jako plán, aby se EU stala
    de facto vojensko-ekonomickým blokem podřadným NATO, přičemž NATO si zachová operační velení. Zároveň
    se USA stahují z přímých závazků — Rutte to „chápe." Výsledek: Evropa ponese větší tíhu případné války
    s Ruskem bez USA.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: 'Na GLOBSEC: EU se má stát investičním a logistickým sektorem NATO — Vrabel: potvrzení, že
      Pavel prosazuje globalistický program'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-05-21-02
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Zelenský hrozí preventivním útokem na Bělorusko — Vrabel: rétorika se posouvá ke skutečné válce
    (Vrabel, 21. 5. 2026)'
  text: |-
    Zelenský prohlásil, že Ukrajina je připravena jednat preventivně, pokud by hrozba vycházela z běloruského území. Vrabel hodnotí: dříve se aspoň dělaly útoky pod falešnou vlajkou; teď se mluví přímo o preventivním útoku na třetí stát. Paralelně litevský ministr zahraničí Landsbergis vyzývá k útoku na Kaliningradskou oblast jako způsobu tlaku na Moskvu. Vrabel říká: tato rétorika je extrémně nebezpečná — Kaliningrad je ze všech stran obklopen NATO a snadno napadnutelný, ale bránit by se muselo tvrdě.

    Pozitivně hodnotí, že Putin i Lukašenko opakovaně prohlásili, že nezaútočí jako první, pokud nebudou napadeni — to ztěžuje eskalaci ze strany Zelenského/pobaltských zemí.
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: 'Hrozí preventivním útokem Bělorusku — Vrabel: eskalace konfliktu na nová území, destabilizace
      regionu'
  - osoba: gabrielius-landsbergis
    vztah: negativni
    kontext: 'Litevský ministr zahraničí volá po útoku na Kaliningrad — Vrabel: nebezpečná eskalace tlačící
      Evropu k přímé válce s Ruskem'
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-05-21-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Kaja Kalas označila Čínu za „nemocnou" — EU se distancovala, 5 států podalo stížnost (Vrabel,
    21. 5. 2026)
  text: Kaja Kalas v debatě o politice EU vůči Číně prohlásila, že „Evropa zná diagnózu nemoci, pokud
    jde o Čínu, ale není shoda na léčbě." EU Komise se od výroku distancovala, 5 členských států podalo
    stížnost. Vrabel hodnotí jako ukázku diplomatického selhání — základem diplomacie je hledat dohody
    výhodné pro všechny strany, ne veřejně urážet obchodního partnera. Srovnává s „nacistickým vzorcem
    chování" politiků — nejdříve militarizace, pak ztráta soudnosti.
  osoby:
  - osoba: kaja-kallas
    vztah: negativni
    kontext: 'Označila Čínu za „nemocnou" — EU se distancovala, 5 členských států formálně protestovalo;
      Vrabel: dalibortismus EU diplomacie'
  podtema: Zahraniční aktéři a precedenty
