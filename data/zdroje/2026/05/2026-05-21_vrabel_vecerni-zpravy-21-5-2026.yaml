  poznamka: 'Noční zprávy z auta (23:43). Pavel na GLOBSEC — EU jako investiční a logistický sektor NATO;
    česká mobilizační/branná legislativa — meziválečná stavba, nefunkční pro 21. st., nutnost odvodů;
    Macinka na NATO ministerial Helsingborg; Beneš socha červená barva (Tomáš Kočko); ČR zdržení UN klimatické
    rezoluce (134-0); Zelenský hrozí preventivním útokem Bělorusku; Landsbergis volá útok na Kaliningrad;
    Rusko-Bělorusko jaderná cvičení — Putin: „výjimečné opatření"; Trump prodává zbraně Tajwanu den po
    odletu z Číny; Kaja Kalas prohlásila Čínu za „nemocnou" — EU se distancovala, 5 států protestovalo;
    EU-USA obchodní dohoda (asymetrická); Ebola Bulovka — Adam Vojtěch: „velká čest"; Alatra v EP; flat
    earth tangent.'
