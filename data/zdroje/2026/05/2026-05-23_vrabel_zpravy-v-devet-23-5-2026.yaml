  poznamka: '„Zprávy v devět s komentářem." Klíčová témata: Sudetoněmecký pochod smíření v Brně (~2000
    účastníků, CSU Dobrind, Vystrčil); Babiš-Explosia — den po zahájení francouzského vyšetřování Babiše
    nabídky na prodej státní zbrojovky Explosia francouzům (predikce: bude prodána, prokuratura ztichne);
    Petr Pavel v The Guardian — navrhoval sestřelování ruských letadel, odpojení internetu a bank; útok
    dronů na Starobělsk (studentská kolej, 18 mrtvých); F-35 jako jaderné nosiče B-61 — ČR vstupuje do
    Nuclear Sharing (6,25 mld. EUR, dodání 2031); Zelenský odmítá přidružené členství EU; Landovský —
    ČR hrozí, že nesplní 2% HDP pro NATO; Německo 5% HDP pro NATO; Francie-Německo-UK rakety 2000+ km.'
