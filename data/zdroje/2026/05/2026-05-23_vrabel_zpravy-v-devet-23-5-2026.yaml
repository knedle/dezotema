- id: vrabel-2026-05-23-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: F-35 jako jaderné nosiče B-61 — ČR vstupuje do Nuclear Sharing — Vrabel (23. 5. 2026)
  text: |-
    Vrabel tvrdí, že česká veřejnost nerozumí skutečnému účelu nákupu F-35. Na rozdíl od Gripenů (lehké stíhačky) jsou F-35 primárně těžké bombardéry určené k letům na nepřátelské území s jadernými náložemi B-61. ČR jejich nákupem vstupuje do Nuclear Sharing — schématu, kde zúčastněné země uchovávají ~20 jaderných zbraní a jsou připraveny je doručit v případě rozkazu.

    Cenové srovnání: ČR platí 6,25 mld. EUR za 24 letadel (dodání 2031) vs. Jižní Korea/Švýcarsko 5,5 mld. EUR (dodání 2027–28). Mediální debata je dle Vrabela záměrně stočena k otázce „proč dostaneme letadla pozdě" namísto „proč je vůbec kupujeme" — přestože Babiš před volbami slíbil nákup zrušit.
  dalsi_zdroje:
  - 2026-09-27_vrabel_nedelni-vysilani-27-9-2026
- id: vrabel-2026-05-23-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Babiš-Explosia: prodej státní zbrojovky den po zahájení francouzského vyšetřování — Vrabel
    (23. 5. 2026)'
  text: |-
    Ladislav Vrabel upozorňuje na podezřelé načasování: v den, kdy francouzská prokuratura oznámila vyšetřování Andreje Babiše pro finanční machinace (vyvádění peněz, nákup majetku ve Francii), Babiš v živém vysílání zmínil, že „jsou tady nabídky" na prodej státní zbrojovky Explosia francouzským kupcům — Macron prý loboval přímo u Babiše. Explosia (výroba dynamitu a střelného prachu) je jedním z nejziskovějších státních podniků.

    Vrabel navrhuje paralelu se staršími kauzami: výměnou za správné ústupky (F-35, muniční iniciativa) mizely problémy s EU dotacemi Agrofertu. Predikce: Explosia bude prodána a francouzská prokuratura svou aktivitu uklidní.
  citace:
  - text: Myslím, že nás o ten podnik připraví a nebude problém s francouzskou prokuraturu, ale to je
      jenom můj tip.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: Den po zahájení francouzského vyšetřování nabídl prodej Explosia francouzům; Vrabel čte jako
      ústupkový vzorec — analogie s mizením EU-dotačních problémů Agrofertu
  podtema: Meeting Brno — 15 milionů na sudetoněmecké akce
