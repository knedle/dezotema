vyroky:
- id: vrabel-2026-10-09-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Macinka na Chanuce hnutí Chabad Lubavič; Kushner, Lutnick a Adelsonová jako financiéři Trumpa;
    „Velký Izrael“ (Vrabel, 8. 10. 2026)
  text: '**9. 10.** — K americkým sankcím proti Mezinárodnímu trestnímu soudu (Rubio ho označil za „lidský
    odpad“) Vrabel tvrdí, že tribunály USA vyhovovaly, dokud soudily jugoslávské vůdce, ale „vymkly se
    z rukou“ zatykačem na Netanjahua. To si podle něj Chabad Lubavič, který chrání „svého hlavního koně“,
    nemohl nechat líbit, a „musel zaklepat u Trumpa“, aby soud zrušil. Silná pozice islámských zemí v
    OSN je podle něj důsledkem petrodolaru, který islámským zemím od roku 1972 dal peníze a „hodně dětí“.'
  osoby:
  - osoba: marco-rubio
    vztah: negativni
    kontext: „Satanisti, všechno otáčí“
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-10-09-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Letní energetická krize 2026: sucho omezuje jádro a vodní zdroje, uhlí se vrací (Vrabel, 19.
    8. 2026)'
  text: '**9. 10.** — K varování britského premiéra před zimním nedostatkem plynu Vrabel tvrdí, že nedostatek
    hrozí celé Evropě: „kdyby ještě v lednu byl plyn v celé Evropě, byl bych velmi překvapený“. Do tří
    týdnů podle něj přijdou přinejmenším doporučení topit maximálně na 21 °C. Radí pořídit si kamna a
    dřevo, elektrické topení, nebo „domek někde pryč“ (v Srbsku za půl milionu), společně se sousedy či
    na venkově u příbuzných, také kvůli „moru z Ruska“. Dětem do škol doporučuje teplé ponožky. „Vedení
    země vypadá, že chce, aby lidi umrzli.“'
  podtema: Energetika a Rusko
- id: vrabel-2026-10-09-03
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**9. 10.** — Vrabel vypráví, že „nejmenovaný překvapivý člověk“ odmítl uvěřit, že zatýkání za
    „Z“ má na svědomí Rajchl („ne, to bych neříkal“). Voliče, kteří stále věří SPD, Trikolóře, Svobodným
    a PRO, přirovnává k „ovcím běžícím na porážku“, které „ušlapou toho, kdo je varuje“. S hostem VK se
    shodl, že v současném systému žádná změna možná není a „pravděpodobně nebude, dokud si neprojdeme
    válkou“.'
  podtema: Trestání politického projevu
- id: vrabel-2026-10-09-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Globalisté používají k převratům studenty; Green Deal a útoky na ropu jako plán depopulace na
    „jednu miliardu“ (Vrabel, 6. 10. 2026)
  text: '**9. 10.** — Vrabel opakuje, že „studentské demonstrace jsou vždycky globalistické“: studenti
    nemají životní zkušenost, snadno se jim „naprogramuje liberální progresivismus“ a „na děti se nikdo
    neodváží sáhnout“, kdežto na jeho demonstrace chodí důchodci, „kteří vědí, co se děje“. K útokům dětí
    ve školách (Polsko nasadilo 24 tisíc policistů, Francie, Itálie, USA) spekuluje, zda „dětem nesypou
    něco do vody“ nebo zda „umělá inteligence nevymyslela kód“, který přes TikTok podprahově vede děti
    k násilí, protože „lidský mozek nejde změnit ze dne na den“.'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-09-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: USA rozeštvávají slovanské národy a „vydělávají na válkách“; „chabad-lubavičská sionistická
    pyramida moci“; Hitler jako „levoboček Rothschildů“ (Vrabel, 8. 10. 2026)
  text: '**9. 10.** — Na Rubiův výrok, že USA „nikdy neporušily suverenitu žádné země“, Vrabel odpovídá,
    že „jsou to satanisti, všechno otáčí“. USA podle něj zlikvidovaly mezinárodní právo v Kosovu, únosem
    Madura, „vyvražděním íránského vedení“ a útoky na Venezuelu a Kubu. Rusko má naopak pro operaci na
    Ukrajině „oporu v Chartě OSN“ jako vítěz druhé světové války vůči státu, kde „bují nacismus“, a „minimálně
    prvotně to bylo po právu“. Za to, že spor trvá, podle něj může Rada bezpečnosti. Svět se USA bojí
    od Hirošimy a petrodolaru (Kaddáfí, Husajn) a teprve Rusko se jim postavilo. Těší se, „až lidé udělají
    plot okolo Spojených států“. Na začátku vysílání přirovnává „globalistickou mafii“ k mafii vybírající
    výpalné, která „uplácí soudce a politiky“ a „postřílí“ ty, kdo se jí postaví (Husajn, Kaddáfí, Maduro,
    Írán, Rusko přes Ukrajince a pak celou Evropu).'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-09-06
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Zadržení Michaila Zvinčuka (Rybar) v Černé Hoře — Vrabel odmítl s ním natáčet kvůli sankcím
    (Vrabel, 9. 10. 2026)
  text: K zadržení zakladatele ruského telegramového kanálu Rybar Michaila Zvinčuka a jeho spolupracovníků
    v Černé Hoře (u zadržených měly být drony) Vrabel uvádí, že ho Zvinčuk nedávno kontaktoval kvůli společné
    reportáži. Odmítl, protože Rybar je pod sankcemi EU a sám je „v podmínce“, takže by mu za porušení
    sankcí hrozilo vězení. Zvinčuka popisuje jako bývalého „headhuntera pro Wagnera“ a člověka, který
    „vyhledával lidi pro Putina“. Zadržení je podle něj „velký politický skandál“ srovnatelný se zatčením
    Durova, a pokud ho Černá Hora vydá Ukrajině, „to je poprava“. Černá Hora to podle něj udělala kvůli
    vstupu do EU, stejně jako „Rumuni za bombardování Jugoslávie dostali vstup do EU“. Lukáše Valáška
    (Aktuálně.cz), který dřív „naháněl“ lidi z Rybaru v Praze, označuje za „jednoho z nejhorších českých
    novinářů, který likviduje lidi“.
  osoby:
  - osoba: michail-zvincuk
    vztah: pozitivni
    kontext: „Vysoce postavený člověk“, jeho zadržení je skandál
  podtema: Nová alternativní média
- id: vrabel-2026-10-09-07
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel na volby z Maroka a zpět soukromým tryskáčem; „generál NATO dosazený vést zemi ve válce“
    (Vrabel, 9. 10. 2026)
  text: 'K zprávě, že prezident Pavel přiletěl 9. 10. z dovolené v Maroku k volbám soukromým tryskáčem
    spojeným s rodinou podnikatele Pavla Hubáčka a týž den odletěl zpět, Vrabel poznamenává, že „by mu
    radši dal karabáčem“. Tryskáč je podle něj úplatek „globalistické mafie“, která „uplácí všechny, kdo
    pro ni pracují“: „za co asi mu to platí, protože má krásné šedé vlasy?“ Pavel je podle něj „generál
    NATO dosazený do ČR, aby vedl zemi v době války“. Babiš proto „dělá zpátečku“, aby nemusel rozhodovat
    o smrti „100 000 lidí“, a nechává to na Pavlovi. Připomíná Kolářovu radu Američanům z WikiLeaks, ať
    o brdské základně mluví jako o radaru. Stejně se podle něj dnes „jaderným deštníkem“ maskují útočné
    jaderné zbraně. O Babišovi tvrdí, že po revoluci „dostal 550 milionů“ od otce, šéfa komunistů v Bratislavě.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Tryskáč jako úplatek, „radši bych mu dal karabáčem“, „generál NATO pro válku“
  dalsi_zdroje:
  - 2026-10-22_vrabel_zpravy-v-devet-22-10-2026
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-10-09-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'TCK na Ukrajině: násilná mobilizace a úmrtí na odvodové komisi (Vrabel, 12. 6. 2026)'
  text: '**9. 10.** — K zprávě Washington Post o dvou milionech mužů, kteří se vyhýbají mobilizaci, a
    200 tisících dezertérů pouští Vrabel videa náborářů v Charkově (strčení do 74leté ženy) a lidí přivázaných
    a zmlácených za krádež „za posvěcení policie“. Komentuje to slovy „co to je prostě za dobytek“. Až
    se to budou děti učit v dějepise, „odplivnou si, co je Ukrajina“, podle něj „absolutně zkorumpovaná
    země, kde se obchoduje s lidskými orgány“. Dodává, že „ne všichni Ukrajinci jsou špatní“. Rusové podle
    něj šli na Ukrajinu „chránit lidi, kteří jsou tam vyvražďováni“, a „my jsme se měli hned na začátku
    připojit k Rusku a ten nacistický režim odstranit“. ČR to neudělala, protože vlády „pracují pro globalistickou
    mafii, která chce Rusko rozbít“.'
  podtema: Stav Ukrajiny a mobilizace
