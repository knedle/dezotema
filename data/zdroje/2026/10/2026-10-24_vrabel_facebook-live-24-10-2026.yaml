  nadpis: Protest za poplatky ČT „aby mohli platit vlastní válečnou propagandu“ — umělá bublina a dvojí
    metr policie (Vrabel, 24. 10. 2026)
  text: '**24. 10. (Facebook Live)** — Ve večerním vysílání z Bělehradu Vrabel kritiku vyostřuje. Lidé
    podle něj „obsazují náměstí kvůli 200–300 korunám“ za vlastní válečnou propagandu, ale nezajímají
    je jaderné zbraně, cizí vojáci, válka ani „rozprodaná země“. Nazývá to „idiocií“ a lidi „idioty nejvyššího
    kalibru“ s mozky „vygumovanými“ televizí. V ČR se podle něj rozehrává totéž co na Ukrajině, jen bez
    Majdanu, protože lidé se „na povel“ podřídí „pár prodejným podvodníkům“.'
  citace:
  - text: Tomu opravdu říkám idiocie. Toto se nedá už jinak, to už se jinak nedá nazvat.
  podtema: Česká televize a mainstreamová média
