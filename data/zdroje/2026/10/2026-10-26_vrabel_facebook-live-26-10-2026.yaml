    kontext: Vypráví „nesmysly“ o demonstraci 2022, aby dostal funkci v SPD
  prehled:
  - tema: Varování diváků před „majdanem“ v Praze
    text: poprvé varování nezlehčuje, „to nebezpečí je vážné“; násilí rozehrávají maskovaní policisté,
      aby se lidé nespojili proti chystané válce
    vyrok: vrabel-2026-10-26-02
  - tema: Migranti a násilí
    text: lidé z Afriky „vyrůstali s mačetama v ruce“, mají jiný „práh násilí“, rabují kvůli „iPhonům
      zadarmo“ (opakuje) → viz [Stochastický teror](../stochasticky-teror.md)
  - tema: Babiš a Milion chvilek k poplatkům
    text: se zrušením poplatků „musí souhlasit“, kampaň Milionu chvilek je rozeštvávání za zahraniční
      peníze; Babiš je nově „obětí“ (25. 10. ještě 50:50)
    vyrok: vrabel-2026-10-26-03
  - tema: Srbsko po volbách
    text: smutný z Vučićovy porážky, ale bude klid; referendum o EU podle něj neprojde, prozápadní studenty
      by lidé „za rok“ sundali → viz [Predikce](../predikce.md)
  - tema: Euforie po porážce Fialy
    text: lidé rok „nejsou schopni vidět“ negativní kroky Babiše (opakuje).
  - tema: Globalisté ovládají lidi
    text: sociální sítě a AI dělají psychologické profily a manipulují davy (opakuje).
  - tema: Svatoš a SPD
    text: Svatoš na Svobodném rádiu vypráví „nesmysly“, aby dostal funkci v SPD; SPD je „falešná opozice“
      (opakuje).
  - tema: Energetická krize 2021
    text: Fiala věděl, že přijde „něco mnohem horšího“ (opakuje).
vyroky:
- id: vrabel-2026-10-26-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Násilné protesty v Evropě jako řízené odvedení pozornosti před válkou; Babiš má od tajných služeb
    informace o 17. listopadu (Vrabel, 26. 10. 2026)
  text: '**26. 10. (Facebook Live)** — Ve večerním vysílání Vrabel poprvé v historii svých demonstrací
    nezlehčuje varování diváků před násilím: „to nebezpečí je vážné“. Násilí v Evropě podle něj nevychází
    od studentů. Rozdmýchávají ho maskovaní policisté jako „mezičlánek“ režimu a migranti ho pak zneužívají
    k rabování. Kvůli emisním povolenkám by se podle něj násilí nerozehrávalo, a tak jediné vysvětlení
    vidí ve válce: lidé se mají rozhádat, aby se proti ní nedokázali spojit. Jeho pochod 17. 11. má proběhnout
    klidně, ale „někde se něco … rozehrávat bude“.'
  citace:
  - text: A tady jediné, co mě napadá, je jako válka, protože ta válka je prostě ten největší brutál.
      A proto se ty lidi manipulujou proti sobě a rozeštvávají proti sobě, aby se nebyli schopní spojit
      proti válce.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-26-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Demonstrace proti zrušení poplatků jako „český Majdan“; ČT mu před volbami „stáhla hlas“ (Vrabel,
    25. 10. 2026)
  text: '**26. 10. (posun)** — Vrabel se zrušením poplatků „musí souhlasit“ a noční projednávání považuje
    za normální. Kampaň Milionu chvilek („prodají nás Rusku“, „sovětská kolonie“) je podle něj nejbrutálnější
    propaganda placená zahraničním globalistickým kapitálem, demonstrace prý stála půl až tři čtvrtě milionu.
    Živý přenos na ČT24 označuje za „klasický globalistický projekt rozjíždění demonstrací“ jako N1 v
    Srbsku. Na rozdíl od nedělního vysílání (50 na 50) si po Babišově tiskové konferenci myslí, že Babiš
    „v tom nejede s nima, je obětí“. Majdan v ČR nečeká, protože „Babiš není Orbán“.'
  citace:
  - text: Ale v tomhle s tím musím souhlasit s Andrejem Babišem, že tohle je snaha organizací, které pracují
      za zahraniční kapitál, globalistický kapitál, rozeštvat společnost.
  osoby:
  - osoba: andrej-babis
    vztah: rozporuplny
    kontext: V poplatcích a kritice Milionu chvilek mu dává za pravdu, je „obětí“; jinak proti jeho vládě
  podtema: Česká televize a mainstreamová média
