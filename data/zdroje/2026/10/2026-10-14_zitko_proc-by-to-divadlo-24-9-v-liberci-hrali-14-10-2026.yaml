  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: |-
    **14. 10.** — Blok o Čermákovi na akci podle Zítka „vypadal skoro jako stand-up komedie“. Čermák „v rámci hry na Čermáka opět nedorazil“, přestože prý mohl sbírat podpisy pod svou petici. Zítko uvádí nové „podvrhy“:
    - **Nový falešný profil „Tomáš Kvatro Čermák 2026“:** na fotce chlapci jedí hamburgery v gumových rukavicích a pijí zelené pivo, které se „u nás podává pouze o svátcích jara“, ne v říjnu. Profil má podle Zítka „jediný cíl naložit Zítkovi“.
    - **Fotomontáž otčíma Turka:** Turek měl zveřejnit fotku se známým a vmontovaným Zítkem („Tomáš je na záchodě a sekera je zakopaná“) a za pár hodin ji smazat. Zítko má screenshot.
    - **Video s Naxerou:** v nestříhaném videu ze 3. 10. z Přeštic, zveřejněném „záhadně“ až 6. 10., řekl „údajný“ Čermák 17× „jakoby“. Zároveň prý porušil slib soudkyni Šmídové, že se vyvaruje politických projevů.
    - **Fotka se Šišákovou:** má být „jakoby v Holíšově“, ale v pozadí je prý most z Prahy a Šišáková má československou placku z demonstrace.

    Hru na Čermáka podle Zítka hraje i „jedna z komunit, která o sobě tvrdí, že má nejchytřejší diváky“; fotomontáže prý sdílí i Bob Acer.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
