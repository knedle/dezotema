vyroky:
- id: vrabel-2026-10-18-01
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**18. 10.** — Babišův výrok „kdo u nás bude žít… nenecháme si do toho mluvit“ Vrabel vykládá
    jako obhajobu dovozu pracovníků z Filipín, Indie a Ukrajiny: „Andrej Babiš není proti migraci… jenom
    on jí chce kontrolovat.“ Jemu samotnému vadí „migrace jako taková“, protože stát má být soběstačný.
    Zavřít hranice podle něj nejde bez vystoupení z EU (zadržený migrant požádá o azyl, migrační pakt
    je díky čl. 10 Ústavy závazný). Pokud se systém nezmění, stanou se z Francie, Británie a dalších zemí
    „islámský země“, „a nebude to trvat zas tak dlouho“, ledaže by přišla občanská válka nebo válka s
    „miliony mrtvých“; ČR v EU čeká „islamizace“ a „za deset let ty naše města budou k nepoznání“. Babiš
    od něj kolem roku 2015 prý přes kameramana Patrika Kořenáře dostal knihu o šaríi pro nemuslimy, takže
    ví, co islamizace znamená. Migraci líčí i jako ohrožení „krásných holek v Čechách“ ze strany „tvrdý,
    snědý kluky“ ze západu. Lidé podle něj propadli „netečnosti“, protože cítí, že země „už není jejich“,
    a bojí se Ukrajinců (vražda mladíka v brněnské šalině, propuštění útočníka, který ho polil barvou).
    Na dotaz k „ukrajinizaci“ odhaduje, že kvůli eskalaci války a zimě přijdou „párset tisíc, ne-li v
    milionech“ dalších Ukrajinců, kteří po získání občanství budou volit a zakládat strany. Jsou prý „víc
    temperamentní, řekněme, abych neříkal agresivní“, mají „trošičku blíž k takovým těm ozbrojeným mafím“,
    přinesou zbraně z Ukrajiny a budou se cítit, že jim Češi dluží: „budou chtít, aby Češi šli sloužit
    na tu frontu“ (viz [Stochastický teror](stochasticky-teror.md), [Predikce](predikce.md)). Z Československa
    se tak podle něj stane „Česko-Ukrajinsko“.'
- id: vrabel-2026-10-18-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Suverenisté jsou postupně likvidováni — Orbán „zlikvidován“, Fico „na řadě“, Vučič jako poslední;
    Babiš má „max. 5 %“ (Vrabel, 15. 10. 2026)
  text: '**18. 10.** — Za „lakmusový papírek“ vlastenectví Vrabel považuje postoj k vystoupení z EU a
    NATO. EU už podle něj „není obchodní společenství“, ale geopolitický projekt, který má nahradit národní
    státy a migračním paktem „naředit“ obyvatelstvo. Babiš jako „EU patriot“ proto „není žádný patriot“
    a Okamura v Srbsku přesvědčoval tamní politiky ke vstupu do EU, „místo toho, aby se učil, jak se dělá
    suverenita“. Obavy ze „sankcí“ za vystoupení odmítá: jde o vypořádání závazků ve splátkách jako u
    Brexitu a vystoupit je podle něj „ekonomicky výhodný“. „Podle mě bychom se měli bát toho nevystoupit
    z EU, protože Evropská unie hoří dneska.“ Času prý zbývá málo, protože EU „za chviličku“ zruší právo
    veta a bude rozhodovat kvalifikovanou většinou. Na společný postup V4 nevěří: Poláci jsou „absolutní
    nacisti“, Szijjártó „velmi komplikovaný politik“ a Fica prý „nahradí nějaký evropští politici“. EU
    se podle něj rozpadne pod tlakem lidí na ulicích či občanskou válkou, nebo válkou s Ruskem, anebo
    do té doby bude „absolutně totalitním nástrojem“: „jediný, na co mi to nevypadá, je klid, mír, pohoda.“'
  podtema: Česká suverenita
- id: vrabel-2026-10-18-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**18. 10.** — K infografice o rozšiřování NATO Vrabel opakuje, že aliance po studené válce „začala
    napadat cizí země“ (Jugoslávie) a z ruského pohledu Rusko obkličuje. Rusové proto útok „předsunuli“
    na Ukrajinu, „aby to nebylo v Rusku“. Ruskému ujištění, že Evropu napadnout nechtějí, věří, ale nevylučuje,
    že pokud „dojdou k tomu, že ten boj je nevyhnutelný“, dají „první ránu“ jako na Ukrajině. Samotné
    Rusko proti celému Západu by podle něj vyhrát nemuselo, kdyby se ale přidaly Čína a Indie, „smetou
    Západ“. Za čtyři roky se podle něj válka ve společnosti „normalizovala“. Trump prý nezrušil protiruské
    sankce, jen zákon Lindseyho Grahama, a „za dva roky demokrati vyhrajou ve Spojených státech“. Evropa
    ale podle něj může do války jít i bez nich: „ta válka opravdu je za dveřma“ (viz [Predikce](predikce.md)).
    K útoku tisíce ukrajinských dronů na rafinerie u Petrohradu říká, že Rusko si nemůže dovolit, aby
    Západ útočil na Rusko a ono jen na Ukrajinu: „Rusko recipročně musí prostě jít a válčit na území Evropy.
    Jinak prostě prohrajou.“ Kdo chce porazit největší jadernou velmoc, musí podle něj počítat s jadernými
    zbraněmi, „vždyť i ty blbí amici použili jadernou zbraň“. Pavel a Babiš přesto chtějí francouzské
    jaderné zbraně na českém území, „a národ mlčí a jde na porážku“; vzorem je mu neutrální Srbsko bez
    sankcí a bez zbraní pro Ukrajinu. Východní křídlo NATO a Vanceova slova o evropské odpovědnosti za
    bezpečnost vykládá tak, že na frontu půjdou nejdřív země Bukurešťské devítky, hlavně „úplně militarizované“
    Polsko, pak Češi, Slováci, Maďaři a další.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-18-04
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: 'Nízká účast ve 2. kole Senátu: politici z protestů se „otočili“ kvůli funkcím; Hamplová „to
    zobchodovala“ (Vrabel, 16. 10. 2026)'
  text: '**18. 10.** — V nedělním vysílání Vrabel vítá, že se do Senátu nedostal nikdo z vládní koalice
    ani z „ex-vlastenecké scény“ (Drulák jako „falešná opozice“ a „elitář prosystémový“, Svatoš, Zítko
    a Čermák). Neuspěli podle něj ne proto, že by posílali málo zbraní na Ukrajinu, ale protože nesplnili
    sliby a „lidi jim nevěří“. Hlavní zradou je pro něj ústup od referenda o vystoupení z EU a NATO (jako
    první prý couvlo SPD) a výroky Pavla a Babiše, že ho nepovolí: „Už jenom za tohle by zasloužili prostě,
    aby je národ hnal ulicama.“ Za nezrušenou muniční iniciativu by Babiše lidé měli hnát „možná tunelama
    metra. Přes celou Prahu tam a zpátky“ (viz [Stochastický teror](stochasticky-teror.md)). Opakuje požadavek
    soudní odvolatelnosti politiků, kteří neplní volební program, a ilustruje ho „indiánským kmenem“,
    jehož stařešinové náčelníka, který zradil, odvolají „ke kůlu“, kde na něm mladíci trénují střelbu
    z luku. SPD na ministerstvu obrany (Jaromír Zůna) podle něj „jede rozkazy od NATO“ stejně jako předchozí
    ministryně a Babišova vláda je „mnohem horší“ než Fialova, protože dělá totéž, ale „lže“ (na Ukrajinu
    prý posílá víc peněz i zbraní). Divačce váhající mezi Karlem Řehkou a kandidátkou ANO ani divákovi
    z Chicaga před volbami do Kongresu USA neporadil: „každá rada drahá“, problémem je systém, demokraté
    i republikáni jsou „lumpové“.'
  podtema: Komunální volby
