  text: '**30. 10.** — Zítko tvrdí, že „globální vojenské stanné právo“ platí od 9. 8., že na Guantánamu
    už proběhly první popravy „covidových lékařů, kteří píchali do lidí injekce“ (v USA má být obviněno
