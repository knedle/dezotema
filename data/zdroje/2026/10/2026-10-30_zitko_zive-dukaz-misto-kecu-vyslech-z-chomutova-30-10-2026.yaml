  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**30. 10.** — Zítko pouští a komentuje vlastní nahrávku výslechu na policii v Chomutově z 13.
    11. 2023 (asi 1 h 40 min) jako „důkaz“, že Čermáka neudal: policii podle ní žádné číslo nedal, měl
    jen staré vypnuté číslo a jeho telefon policie prohledala už 10. 10. 2023; telefon s nahrávkou mu
    zabavili 3. 2. 2025 a vrátili 12. 10. Video z „polské chodby“ (14. 11. 2023) považuje za policejní
    provokaci, Tušla, Bernardy, Černohorského a Svobodu za „policí řízené zmrdy“ a Tušlovo dřívější propuštění
    za „daň za kolaboraci“. Po telefonátu do firmy TKO mu večer volala Čermákova matka a asi 20 minut
    „hlas Tomáše Čermáka“, který prý potvrdil, že se s Bernardy nikdy osobně nepotkal; Zítko totožnost
    nepřijímá, protože „identita se potvrzuje naživo“ a hlas lze napodobit AI z 20–30 sekund záznamu.
    Hospoda v Holýšově jim rezervaci odmítla, setkání má být na usedlosti „u Holýšova“.'
  citace:
  - text: A pokud nepřijde, tak je to jenom potvrzení, že to nebyl Tomáš Čermák.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-30-06
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**31. 10. (záznam výslechu z 13. 11. 2023)** — V nesestříhaném záznamu z roku 2023, který zveřejnil
    Jiří Hradil, Zítko Čermáka označuje za „spolubojovníka za svobodu a obnovení Československa“, trest
    5,5 roku za nespravedlivý (soudci Humena a Lněnička mu prý nepovolili roli „zmocněnce-důvěrníka“)
    a uvádí, že Jana Peterková pro Čermáka žádá politický azyl a 10 000 Kč z transparentního účtu má jít
    na jeho mezinárodní právní pomoc. Srovnává ho s Pavlem Novotným, který podle něj díky krytí Fialy
    a Rakušana zůstal bez trestu, a Čermákův výrok „vezmeme je za držky a hodíme je do řeky“ označuje
    za „adekvátní“. O pravosti Čermáka v záznamu nepadne nic.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
