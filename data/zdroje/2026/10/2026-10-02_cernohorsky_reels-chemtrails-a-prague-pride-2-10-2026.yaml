  nadpis: 'Chemtrails: sypání těžkých kovů do atmosféry; větrníky 60 kg nanočástic (Vrabel, 15. 5. 2026)'
  text: '**2. 10. (Černohorský)** — Černohorský natáčí oblohu a tvrdí, že útvary, které stojí při bezvětří
    na místě, nemohou být kondenzační stopy („tohle nevytváří příroda… toto je lidská činnost"); popírače
    chemtrails, mezi něž dřív sám patřil, označuje za hlupáky. Účelem je podle něj zastínit slunce, aby
    lidé neměli vitamin D a byli nemocní, ve prospěch farmaceutických firem — „satanistů"; těžké kovy
    se prý „chemicky vážou na molekuly vody", padají s deštěm a kontaminují vše včetně bio potravin (známá
    prý nechala rozebrat dešťovou vodu s „celou Mendělejevovou tabulkou"). Sám si podle svých slov vyléčil
    „otravu krve" bylinkami a mentálním nastavením; glyfosát označuje za „povolený rakovinotvorný jed".'
  podtema: Historické konspirační výklady
