vyroky:
- id: cernohorsky-2026-10-05-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**⚡ Konflikt — Černohorský (5. 10.)** — Černohorský Vrabelovo obvinění PRO odmítá: Jakuba Jaška
    podle něj neudali Rajchl ani Vacek, ale „proukrajinské kurvy od muzea" (jmenuje Smrčku) půl hodiny
    před Rajchlovou demonstrací, a trestní oznámení PRO na neznámého pachatele přišlo až tři dny po zadržení.
    Celou kauzu podle něj „rozjel Vrabel", kterého označuje za „krypla", jemuž shromáždění „sype peníze",
    a obviňuje ho, že před volbami „udal SPD a Stačilo". K zatčením na shromáždění „Člověk na prvním místě"
    zaujímá rozpolcený postoj: nošení „Z" ze svatojiřské stuhy považuje za zbytečné „strkání hlavy do
    oprátky" a nahrávání provokatérům (Pšenák, Oganesjan) — muž, který s ním přišel, „si za to může sám"
    (zatčení bylo podle něj na udání). Zatčení ženy se „Z" v barvách trikolóry ale označuje za absurdní:
    „Z" z trikolóry „nemá s Ruskem nic společného", je to „slovanský symbol, spojení nebe a země".'
  citace:
  - text: Proč mám strkat hlavu do oprátky dobrovolně? [...] Svatojiřská stuha vedle trikolóry — na to
      mě nikdo nemůže říct.
  podtema: Trestání politického projevu
- id: cernohorsky-2026-10-05-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Stát od A do Z prorostlý mafií" — politická, podnikatelská, policejní a soudní (Černohorský,
    5. 10. 2026)
  text: 'Černohorský tvrdí, že Česká republika je „od zvrchu jedna skurvená mafie": lidé na ministerstvech
    vnitra, financí či průmyslu od 90. let republiku „rozprodali a rozkradli", mají „neuvěřitelné miliardy"
    a stojí za podobnými případy, jako je kauza Terezy Vlasákové. Stát je podle něj „od A až do Z" prorostlý
    politickou, podnikatelskou, policejní a soudní mafií až „do nejvyšších míst". Jako příklad uvádí nejmenovaného
    bývalého ministra financí, který měl jistému „Viktorovi" nabídnout pomoc k jeho penězům za úplatek
    300 tisíc eur — jméno slibuje zveřejnit ve společném vysílání s tímto Viktorem.'
  citace:
  - text: Od A až do Z je tenhle ten stát prorostlý mafií, mafií skurvenou politickou, skurvenou podnikatelskou,
      skurvenou soudní, policií, soudní mafií.
  podtema: Organizovaný zločin a mafie
- id: cernohorsky-2026-10-05-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Facebook záměrně přerušuje vysílání; výhrůžné hovory připisuje Štítu demokracie a „gangu Oganesjana"
    (Černohorský, 5. 10. 2026)
  text: Černohorský je „naprosto jistý", že Facebook úmyslně přerušil jeho předchozí živé vysílání ve
    chvíli, kdy do něj telefonicky vstoupila Tereza Vlasáková („zrušili signál, abyste to neslyšeli"),
    a že Vlasákové video odstranil z profilu. Během vysílání mu opakovaně volají neznámá čísla, aby živák
    přerušila — volající označuje za lidi ze Štítu demokracie, bývalého Ilumiketu a „bandy od Oganesjana".
    Facebooku vyčítá i to, že k jeho videím schválně vybírá nelichotivé náhledové fotky.
  citace:
  - text: Chápete tu rychlost? Chápete, kdo toho Černohorskýho tak asi sleduje?
  podtema: Nová alternativní média
- id: cernohorsky-2026-10-05-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Spory uvnitř vlastenecké scény: Bernardy, Tušl, Novas, Vidra, Galligardy (Černohorský, 5. 10.
    2026)'
  text: Černohorský popisuje „štvavou kampaň" vlastenců proti sobě (že ho „živí ženské", že krade z příspěvků
    na společenství) a tvrdí, že spory nejdřív řeší soukromě — na důkaz čte vlastní zprávy Zdeňku Vidrovi
    (prosinec 2025), Tušlovi (duben 2026) a Sonie Galligardy. Kampaň podle něj rozjela Bernardy (osobní
    motiv připisuje odmítnutému vztahu), která na příspěvek dala jeho fotku vedle Tarabové a Rajchla;
    Tušla označuje za „žebráka" vybírajícího peníze od stovek lidí, Novase obviňuje ze zveřejňování jeho
    soukromých hlasovek (spekuluje, že Novas je sám autorem urážek Petry Rédové pod jménem „Jaroslav Jahodář").
    Galligardy, kterou opakovaně zmiňuje s odkazem na „romský, cigánský původ", obviňuje z krádeže u „Dagi".
    Tarabovou zesměšňuje, ale odmítá, že by byla „falešná opozice" spolupracující s policií.
  citace:
  - text: Nejdřív se spojí všichni velcí vlastenci, a jak dosáhnou svého cíle, tak v tu ránu všichni —
      peníze, peníze, peníze.
  podtema: USA — volební systém
- id: cernohorsky-2026-10-05-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Babišova vláda nic nevyšetřuje: dluh 4 biliony, bitcoin, Dozimetr, Kampelička, Lex Ukrajina
    (Černohorský, 5. 10. 2026)'
  text: 'Černohorský tvrdí, že se po roce nové vlády „nic nezměnilo": Lex Ukrajina nebyl zrušen, podpora
    Ukrajinců prý stojí „580 milionů měsíčně" a dalších 22 tisíc Ukrajinců má údajně získat pobyt (sám
    uvádí, že neověřil). Politici za 37 let zadlužili stát „bezmála čtyřmi biliony" (400 tis. Kč na každé
    narozené dítě), ale žádná vláda nestíhá předchozí: bitcoinová kauza je podle něj „legalizace toho
    nejhoršího zločinu" (obchod s dětmi, orgány, drogy), Decroix ji „zametla pod koberec", Stanjura „lítá
    po svobodě", ačkoli prý čtyři roky falšoval rozpočet, Rakušan (dehumanizačně „gestapák, Sturmbannführer")
    a Hřib měli „jet" v kauze Dozimetr, a u kauzy Kampelička tvrdí, že ODS rozkrádala peníze určené Ukrajině
    a „když už to málem praskne, tak zabijou ředitele". Proto je „nasraný" na Babiše, Macinku i Okamuru.'
  citace:
  - text: Jakýkoliv člověk, který by obelhal tento stát na daních o deset tisíc korun, jde okamžitě do
      basy. A politici mají na všechno imunitu.
  podtema: USA — volební systém
- id: cernohorsky-2026-10-05-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Až se nasere pět milionů lidí" — lid má vzít moc do svých rukou (Černohorský, 5. 10. 2026)
  text: 'Černohorský doufá, že „se jednou pět milionů lidí nasere a konečně vezme tu moc do svých vlastních
    rukou": pokud by si lidé sami zvolili kontrolovatelné a odpovědné zástupce, „nemůže to být horší"
    než 37 let vlády politiků. Lidé podle něj „ve většině nejsou hloupí" a při skutečné možnosti volby
    by si „další a další zmrdy" nezvolili. Vysílání ale končí pesimisticky: cituje příspěvek, že až budou
    Češi „znova narváni do dobytčáků", budou se hádat, „kdo bude u okna" — „tohle je tenhle národ".'
  podtema: USA — volební systém
- id: cernohorsky-2026-10-05-08
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Kauza Terezy Vlasákové jako „spiknutí" úřadů (Černohorský, 24. 9. 2026)
  text: '**5. 10. (navazující vysílání)** — Černohorský doplňuje, že Varhanová policii hlásila, že Vlasáková
    „kličkuje" a je „pod drogou nebo ožralá"; kamerový záznam z okolí má podle něj prokazovat, že nabourání
    bylo záměrné („to už není přestupek, to je trestný čin"). Nově tvrdí, že během výpadku systému InfoSoud
    (když byl ministr Tejc v zahraničí) někdo zpětně přepsal data a časy soudních rozhodnutí o rozvodu
    a majetku Vlasákové; že ředitelka a třídní učitelka se s OSPOD domluvily zmanipulovat drogový test
    13leté dcery (spolužačky to prozradily a matka test nechala udělat sama předem); a že dcera dostala
    soudní obsílku k výpovědi proti matce s hrozbou pokuty 50 tisíc Kč. Motivem jejího bývalého manžela
    a bývalého přítele má být „uražené mužské ego" a dva rodinné domy. Tři právníci případ podle něj odmítli
    — spekuluje, že kvůli odposlechům a vydírání — nyní má Vlasáková „těžkou váhu" advokátku placenou
    ze sbírky na transparentní účet. Slibuje jmenovitě zveřejnit ředitelku, učitelku, policisty, státní
    zástupkyni, soudkyni, psychiatričku i pracovnici GIBS a natočit s Vlasákovou seriál „paní Kolombová".'
  citace:
  - text: Budu jmenovat tu ředitelku školy, budu jmenovat tu třídní učitelku [...] budu jmenovat tu státní
      zástupkyni z Prahy, budu jmenovat tu soudkyni a budu jmenovat i tu lékařku, tu psychiatričku, všechny
      je budu jmenovat.
  podtema: Šmírování dětí státem
- id: cernohorsky-2026-10-05-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Kde jste byli osm let?" — Donbas, Minsk jako podvod, biolaboratoře; vláda Babiše a Macinky
    jako „rusobijci" (Černohorský, 5. 10. 2026)
  text: 'Černohorský odmítá rámování Ruska jako jednostranného agresora: podle něj „nacistický Azov" osm
    let (2014–2022) vraždil civilisty na Donbasu, Ukrajina bombardovala Donbas kazetovou municí a ještě
    v lednu 2022 ČT, Aktuálně.cz a Hospodářské noviny informovaly o „probouzejícím se neonacismu" na Ukrajině.
    Minské dohody byly podle něj „záměrně ušitý podvod", aby se Ukrajina vyzbrojila, a existence biolaboratoří
    na Ukrajině prý zazněla „letos v americkém Kongresu". Na Donbas podle něj upozorňovali jen Kateřina
    Konečná a Josef Skála. Kritiku směřuje nově i na Babišovu vládu (Babiš, Macinka, Turek, Šťastný) jako
    na „rusobijce", kteří přebírají narativ „ruského agresora" — výslovně vyjímá SPD; v EU pak na Kallasovou,
    von der Leyenovou, Niedermayera, Vondru, Gregorovou a Šimečku.'
  citace:
  - text: To si jako měli nechat srát pořád na hlavu? [...] Tadle celá vláda, s Andrejem Babišem, s Macinkou,
      s Turkem, s Borisem Šťastným, všichni tady tyhlenstí rusobijci, běžte do piče.
  dalsi_zdroje:
