  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**18. 10. (živě, Peterková) — „nikdo tam nebyl“:** Zítko rozebírá úvod rozhovoru TV Šalingrad
    ze 14. 10., kde „údajný“ Čermák řekl, že u soudu čekal Českou televizi, „naštěstí tam byla, ale nikdo
    jiný tam nebyl“. Pro Zítka je to „šachmat celého vylhaného konstruktu Renaty Bernardy“: jeho záběry
    ze síně ukazují kameru ČT, matku, otčíma Turka, pravděpodobně dědu, novináře i jeho s Kačenkou ve
    druhé řadě. „Figurant“ se prý po celé líčení nepodíval do sálu, ani na matku, která čekala u zábradlí
    na objetí. Z psychologického hlediska to je podle Zítka horší než odlišné uši a oči. Měl prý oblečení
    velikosti XXL, ze kterého mu „padaly kalhoty“, a po „divadle“ se v síni ženy smály jako nikdy předtím.
    Nově uvádí historku z odvolacího líčení v roce 2023: šéf justiční stráže Vrchního soudu v Praze mu
    o přestávce řekl, že rozsudek „bude blbej“, a požádal ho, aby uklidnil přes sto Čermákových příznivců.
    Justiční stráž tedy podle něj výsledek znala předem. Na fotce z kurzu Vězňova cesta je podle popisu
    9 vězňů, Zítko jich ale napočítal 7 (zbylí dva jsou lektor a vedoucí projektu). Certifikát, který
    Čermák slíbil 5. 10. zveřejnit, prý dosud nikdo neviděl. Bernardy podle něj Čermáka tři roky neviděla,
    a přesto je „stoprocentně přesvědčená“; buď ji „někdo vydírá, anebo podplatil“. Ověřit identitu podle
    něj mohou jen ti, kdo ho znali (Mišus, Jiří Hradil, Zítko), jako „princ se střevíčkem“ v Popelce,
    ne „kámošky Macechy“. Mluví o „honu na Zítka“: „falešnému profilu“ trvalo 23 dní, než si „vzpomněl“,
    že ho Zítko udal. Na staré plačtivé video z Kadaně (2022, výročí úmrtí matky) ukazuje jako na důkaz,
    že ho hejtři vydávají za aktuální.'
  citace:
  - text: Čekal jsem Českou televizi, ta tam byla, a nikdo tam nebyl. Ty vole, to je šachmat celého vylhaného
      konstruktu Renaty Bernardy.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
