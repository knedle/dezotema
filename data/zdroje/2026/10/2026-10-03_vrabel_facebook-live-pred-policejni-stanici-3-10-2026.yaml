  text: '**3. 10.** — Po skončení Vrabelova shromáždění „Člověk na prvním místě" na Malostranském náměstí
    zatkla policie (podle Vrabela „20 těžkooděnců se zbraněmi") účastnici Katku Blahníkovou kvůli písmenu
    „Z" na oblečení. Vrabel vyzývá účastníky, aby se s policií nehádali, ale šli s ním před policejní
    stanici (Vlašská), dokud ji nepropustí, a shání advokáta — „Babišova vláda nás terorizuje dál".'
