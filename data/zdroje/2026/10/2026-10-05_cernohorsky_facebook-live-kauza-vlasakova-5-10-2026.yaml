  nadpis: Kauza Terezy Vlasákové jako „spiknutí" úřadů (Černohorský, 24. 9. 2026)
  text: '**5. 10.** — Spolek Čest Svoboda Respekt podle Černohorského sehnal Tereze Vlasákové advokátku
    (záloha 48 tisíc Kč z transparentního účtu). Popisuje novou událost: Vlasákovou prý záměrně nabourala
    partnerka jejího bývalého přítele („Varhanová"), která předtím volala policii, že jede bez řidičáku
    (ten byl podle Černohorského platný, jen uložený na úřadě); policie místo vyšetření nehody Vlasákovou
    „šikanovala", provedla „lízací" test na drogy a prohledala auto. Na Příbramsku (Dobříš, Příbram, Knín)
    podle něj funguje „domluvená banda" — státní zástupkyně je prý příbuzná jejího bývalého manžela, propojeni
    jsou OSPOD, škola, policista Bílý, GIBS a soud.'
  podtema: Šmírování dětí státem
