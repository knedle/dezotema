  nadpis: 'Boldy: vakcíny jako biologická zbraň a nástroj snižování populace (17. 7. 2026)'
  text: '**3. 10.** — Na začátku sezony očkování proti chřipce Boldy tvrdí, že lidé se jdou očkovat „jako
    stupidní ovce", protože to slyšeli ve zprávách, na iDnes či „od Prymuly"; očkovaní jsou podle něj
    každoročně nemocní, zatímco on sám chřipku 15–20 let neměl. Propaganda kolem očkování podle něj „funguje
    několik století". Covidová vakcína měla zachránit životy, místo toho přišla náhlá úmrtí, infarkty
    u mladých a kolabující sportovci — je to „biologická zbraň, která je potvrzená i v patentu".'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
