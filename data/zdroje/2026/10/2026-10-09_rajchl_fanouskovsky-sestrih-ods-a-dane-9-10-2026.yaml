  text: '**9. 10. (fanouškovský sestřih)** — Rajchl sdílí střih z debaty, kde opakuje tezi, že „ODS chce
    okrást občany“: Fialova vláda podle něj zrušila školkovné a slevu na manželku, zvýšila daň z nemovitostí,
    snížila valorizaci důchodů a mladým rodinám vzala jen na daňových změnách 135 tisíc Kč za čtyři roky;
    „pomáhali jste sobě a Ukrajině v rámci bitcoinové kauzy“. Slibuje snížení daní pro všechny a zastavení
    zadlužování bez zvyšování daní. *(Střih z více mluvčích, přesná atribuce jednotlivých vět není jistá.)*'
