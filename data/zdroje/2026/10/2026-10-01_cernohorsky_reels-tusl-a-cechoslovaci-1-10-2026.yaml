- id: cernohorsky-2026-10-01-01
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Čechoslováci" a suverénní občané „patří do klece"; selhání policie a výzva ministru Metnarovi
    (Černohorský, 1. 10. 2026)
  text: K videu, na němž muž při policejní kontrole tvrdil, že je „živý člověk z Československa", že ČR
    je korporace registrovaná na Slovensku, v Anglii a USA a že zákon o policii neplatí (měl prý zákaz
    řízení a propadlou STK, a policisté ho přesto nechali odjet), Černohorský označuje tyto „Čechoslováky"
    za „debily", kteří by neměli volat policii, hasiče ani lékaře ČR, a „nepatří nikam jinam než do klece".
    Policisté podle něj nedodrželi předpisy; vyzývá ministra vnitra Metnara, aby zastavil odchod kvalitních
    policistů, i když policie podle něj „šla na ruku takovým zmrdům jako Rakušan". Systém je podle něj
    „totalita a diktát z Bruselu", ale změna má přijít bez „občanské války a krve v ulicích", cestou jeho
    spolku.
  citace:
  - text: Běžte třeba za šimpanzama do zoologické zahrady, vy debilové, protože vy nepatříte nikam jinam
      než do klece.
  podtema: Politická kultura
- id: cernohorsky-2026-10-01-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: '„Zpoplatněné vlastenectví": Tušl a Zítko jako vyžírači dárců; vlastní vysílání bez QR kódu
    (Černohorský, 22. 9. 2026)'
  text: '**1. 10.** — Černohorský chystá žalobu za pomluvu na Patrika Tušla, který o něm napsal, že ho
    „živí diváci" a „čeká na další katastrofu, aby mohl vybírat prachy"; nově jmenuje Moniku Špoulovou,
    jejímž dětem měl Tušl vyhrožovat zabitím. Dokládá vlastní sbírky: na tornádo na Moravě se vybralo
    „skoro 900 tisíc" (47 udání, vše doloženo policii, mimo pomoc šla jen nafta) a na povodně šlo podle
    něj „99,8 %" na pomoc.'
  osoby:
