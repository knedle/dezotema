  text: '**29. 10. (záznam telefonátu, zveřejněn 3. 11.)** — ⚡ Na záznamu, který zveřejnil Jiří Hradil,
    „údajný“ Čermák obhajuje petici za ČSR jako zákonnou formu, která podmínku neporušuje, a vysvětluje,
    že „ostřejší projev“ si kvůli podmínce nemůže dovolit. Jako ověření nabízí společnou vzpomínku na
    „pána s černou hondou“, který ho v roce 2023 vezl na Valašsko, a starou vojenskou bundu od něj; výšku
    podle fotky ze soudu považuje za odpovídající a na setkání přistoupil. Zítko to odmítá s tím, že hlas
    „je to nejjednodušší, co můžeš namodulovat“ pomocí AI, a „tohle nejsou důkazy“ — rozhodne jen setkání
    naživo.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
