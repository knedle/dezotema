- id: rajchl-2026-10-22-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Stížnost k Radě ČT na Jana Moláčka za „kukaččí mládě“; ČT zrušit, „ani korunu“ (Rajchl, 22.
    10. 2026)
  text: Moláčkův výrok, že je třeba „pohlídat, aby se v ČT nevylíhlo kukaččí mládě“, chápe Rajchl jako
    přiznání cenzury jakéhokoli oponentního názoru ve veřejnoprávní televizi. Moláček tím podle něj porušil
    zákon o České televizi i její etický kodex, a Rajchl proto oznamuje stížnost na jeho osobu k Radě
    ČT. Moláček podle něj není majitelem média, jen zaměstnancem placeným lidmi, z nichž část „právě tuhle
    pravdu“ chce vidět. Uvidí se prý, zda ČT zůstane „cenzorským médiem“, nebo se „lidí jako jste vy“
    co nejrychleji zbaví. Dokud ji takoví lidé řídí, bude Rajchl usilovat o zrušení ČT a o to, aby od
    daňových poplatníků „nikdy už nedostala ani jednu korunu“. Spor se týká dokumentu o původu covidu,
    viz [covid-vakciny.md](/temata/covid-vakciny.md).
  citace:
  - text: Vy nejste majitelem tohoto veřejnoprávního média. Vy jste pouze zaměstnancem, kterého si platí
      naši lidé.
