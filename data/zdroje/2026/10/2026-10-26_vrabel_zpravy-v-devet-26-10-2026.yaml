vyroky:
- id: vrabel-2026-10-26-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Násilné protesty v Evropě jako řízené odvedení pozornosti před válkou; Babiš má od tajných služeb
    informace o 17. listopadu (Vrabel, 26. 10. 2026)
  text: Vrabel tvrdí, že protesty od Albánie po Irsko, které vznikly během dvou týdnů, nemohou být spontánní
    a jsou „řízenou akcí“ globalistů, stejně jako covid a migrace. Na rozdíl od šéfredaktora Aeronetu
    („VK“), který čeká výjimečný stav, předpokládá útok v Pobaltí, Polsku nebo Rumunsku, aktivaci článku
    5 a vyhlášení válečného stavu. Babišovo varování, že opozice a Milion chvilek chtějí zneužít 17. listopad,
    podle něj spíš vychází z informací tajných služeb. Globalisté ale Babiše svrhnout nechtějí, protože
    „šlape jak hodinky“ (půjčka Ukrajině, muniční iniciativa, F-35). Cílem je podle něj rozdělit společnost,
    aby se lidé „nezabývali tím, co se připravuje“. Do stejného rámce řadí ČT, ČRo a Minářovu demonstraci
    na Staroměstském náměstí („čisté štvaní“).
  citace:
  - text: Co mě se týče, tak předpokládám velmi podobný scénář, ale spíš si myslím, že dojde nejdřív nějakému
      útoku a potom půjde rovnou článek 5 a pak vyhlášení válečného stavu.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-26-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Brazílie: soud prodloužil volby o dvě hodiny, „aby vyhrál Lula“ — jako Georgescu v Rumunsku;
    „satanismus a absolutní lži“ (Vrabel, 26. 10. 2026)'
  text: Vrabel tvrdí, že Bolsonaro o půlnoci vyhrával a volební soud prodloužil hlasování o dvě hodiny,
    během nichž Lula získal náskok 4,5 milionu hlasů. Srovnává to se zrušenými volbami v Rumunsku (Georgescu
    podle něj „nemohl být prezident, protože byl proruský“). Mezinárodní právo podle něj neplatí, „kdo
    vyhrává, vyhrává z pozice síly“, a západní lídři (Macron) okamžitě gratulují, aby výsledek legitimizovali.
    Paralelu vidí v Rajchlovi, který podle něj „udával lidi za Z“, a teď se prezentuje jako bojovník za
    svobodu slova přes zesnulého Kapala, což nazývá „hyenismem“.
  citace:
  - text: Šup, to tam nasypali Lulovi a vyhrál Lula. A to je ta demokracie, kterou my dneska si tady žijeme.
  osoby:
  - osoba: jair-bolsonaro
    vztah: pozitivni
    kontext: Skutečný vítěz voleb
  podtema: Politická kultura
- id: vrabel-2026-10-26-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Srbské volby: vítězství studentů — od „barevné revoluce“ k „pronárodnímu“ hnutí (Vrabel, od
    25. 10. 2026)'
  text: '**26. 10.** — Ve zprávách Vrabel výsledek hodnotí jako možná „dobrý“, protože jinak by protesty
    eskalovaly. Nejde podle něj o rok 1989 ani o Ukrajinu, ale o souboj, „kdo je víc pronárodní“. Studentské
    hnutí slibuje tvrdší postoj ke Kosovu, žádné sankce proti Rusku a referendum o EU. Nenávist k Vučićovi
    podle něj vytvořily „západní televize“, politicky se ale Západu Srbsko „zobchodovat“ nepodaří. Kosovo
    a Republiku srbskou podle něj čeká řešení po válce na Ukrajině v rámci „další Jalty“.'
  citace:
  - text: Takže tam je to boj o to, kdo je víc pronárodní, jestli Vučić, nebo studenti.
  podtema: Česká suverenita
- id: vrabel-2026-10-26-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenskyj nabízí 25 % území výměnou za vojska NATO — jednání „stoprocentně neúspěšná“; ukrajinskou
    armádu v „Evropské kolektivní obraně“ zaplatíme my (Vrabel, 26. 10. 2026)
  text: Vrabel odmítá výklad, že Zelenskyj kapituloval. Ochota postoupit 25 % území je podle něj podmíněna
    rozmístěním vojsk NATO na Ukrajině, armádou 600–800 tisíc mužů a odmítnutím neutrality, což jsou pro
    Rusko nepřekročitelné linie (Rusko podle něj připouští nejvýš 80 tisíc vojáků). Armáda této velikosti
    by stála 35–65 mld. eur ročně, zhruba třetinu předválečného HDP Ukrajiny, a platila by ji EU. Ukrajina
    bude podle něj „skoro se stoprocentní jistotou“ do roku 2029 v EU a její armáda bude jádrem „Evropské
    kolektivní obrany“ (NATO bez USA), ledaže Rusko vyhraje. Ze „zákulisních zdrojů“ uvádí, že Rusové
    chtějí být v Kyjevě do poloviny března.
  citace:
  - text: Takže budoucnost, tak jak se před náma rýsuje, … s skoro stoprocentní jistotou je, že Ukrajina
      bude součástí Evropské unie, bude mít velkou armádu a my ji budeme platit.
  podtema: Vyjednávání a mír
- id: vrabel-2026-10-26-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: ČR klidně může spadnout do ruské sféry vlivu — „protáhly by se obličeje nácečkům“; SSSR nám
    nechal majetek, Západ všechno vzal (Vrabel, 26. 10. 2026)
  text: 'Vrabel tvrdí, že až bude Evropa „na kolenou“ a USA se dohodnou s Čínou a Ruskem, může se znovu
    vést dělicí čára jako za studené války a ČR, Polsko, východní Německo a Maďarsko mohou připadnout
    Rusku. Srovnává obě nadvlády: SSSR nám podle něj nechal podniky, banky a vlastnictví a nebyli jsme
    zadlužení, kdežto pod USA, NATO a EU „nám všechno vzali“. Tvrdí, že si to nepřeje, ale bylo by „vtipné“
    vidět reakce oponentů, které nazývá „malými nácečky“. Sám chce samostatnou ČR s dobrými vztahy se
    všemi.'
  citace:
  - text: Tak aspoň by se mi líbilo, jak by se protáhli obličeje těm všem nácečkům tady, jak by koukali.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-26-09
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina bude do roku 2029 v EU s velkou armádou, kterou zaplatíme my
  text: Ukrajina se „skoro stoprocentní jistotou“ vstoupí do EU (2029) a její armáda o 600–800 tisících
    mužích bude jádrem Evropské kolektivní obrany placené z evropských peněz.
  citace:
  - text: S skoro stoprocentní jistotou je, že Ukrajina bude součástí Evropské unie, bude mít velkou armádu
      a my ji budeme platit.
  predikce:
    horizont: '2029'
    stav: ceka
    vyhodnoceni:
    - datum: 2026-11-03
      text: 3. 11. naopak tvrdí, že Ukrajinu členské státy v EU „nebudou chtít“, protože by EU „stáhla
        ke dnu“ ([Zprávy v devět 3. 11. 2026](_zdroje.md#ladislav-vrabel--zprávy-v-devět-3-11-2026)).
- id: vrabel-2026-10-26-10
  typ: predikce
  temata:
  - konspirace
  nadpis: po útoku v Pobaltí, Polsku nebo Rumunsku přijde článek 5 a válečný stav
  text: Nejdřív dojde k útoku v Pobaltí, Polsku nebo Rumunsku, pak se aktivuje článek 5 a vyhlásí válečný
    stav; „nebude to trvat až zas tak dlouho“.
  citace:
  - text: Spíš si myslím, že dojde nejdřív nějakému útoku a potom půjde rovnou článek 5 a pak vyhlášení
      válečného stavu.
  predikce:
    horizont: „v nejbližší době“
    stav: ceka
- id: vrabel-2026-10-26-11
  typ: predikce
  temata:
