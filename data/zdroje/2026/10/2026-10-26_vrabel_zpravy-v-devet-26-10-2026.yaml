  nadpis: koruna v ústavě neprojde
  text: Vládní návrh zakotvit korunu do ústavy nezíská ústavní většinu ve Sněmovně ani v Senátu.
  citace:
  - text: Nepočítejte s tím, protože k tomu je potřeba ústavní většina … v žádném případě mít nebudou.
  predikce:
    horizont: toto volební období
    stav: ceka
