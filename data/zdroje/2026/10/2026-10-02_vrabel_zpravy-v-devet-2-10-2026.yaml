vyroky:
- id: vrabel-2026-10-02-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Fico žádá summit EU kvůli cenám nafty — „cynismus"; jediné řešení je ruská ropa a vystoupení
    z NATO (Vrabel, 23. 9. 2026)
  text: '**2. 10.** — K polské dani z mimořádných zisků palivářů a Trumpově výzvě, aby Evropa uvolnila
    zásoby nafty, Vrabel tvrdí, že Evropa vyčerpá rezervy kvůli Trumpovým volbám a pak „si nechají tu
    ropu v Americe a Evropa bude mrznout" — za čas se prý „autem zajezdíte, jenom když se domluvíte se
    sousedy". Jediné řešení je levná ruská ropa přes Družbu, kde „není prostor pro úplatky"; skutečným
    cílem západní „byznys kliky" je vzít Rusku obchod a „napálit nám 4×, 5× takové ceny", a zároveň likvidovat
    ropu kvůli Green Dealu, „abychom jezdili na kole".'
  podtema: Rusko a energetická krize EU
- id: vrabel-2026-10-02-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**2. 10.** — Ministerstvo obrany podle Vrabela oficiálně zahájilo jednání s Francií o vstupu
    do jejího jaderného odstrašení — vláda „si to naplánovala krásně k našemu shromáždění". K Putinovu
    varování z Valdaje před eskalační spirálou mezi jadernými mocnostmi říká, že Babiš je „vychytralý,
    ale tak hloupej", když bez referenda a proti slibu míru tahá jaderné zbraně z Francie, a uvádí alegorii
    o Ferdovi Mravencovi: mravenec, který přivede od termitů „speciálního sršně", by měl být „exkomunikován
    ze země, nebo rovnou sežrán" (viz [Stochastický teror](stochasticky-teror.md)).'
- id: vrabel-2026-10-02-03
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: „Donald Trump nepracuje pro Spojené státy" — uzavřením Hormuzu rozbíjí americký systém (Vrabel,
    25. a 27. 9. 2026)
  text: '**2. 10.** — K incidentu na palubě FlyDubai (útočník „pravděpodobně džihádista") Vrabel doufá,
    že ho Trump nepoužije jako záminku proti Íránu a že „to není skutečný Trump, kterého jsem měl rád
    — že ho vyměnili za nějakého robota nebo dvojníka, že mu ten scénář píše někdo z Bilderberg Group".
    Babiš podle něj sliboval neposílat vojáky, teď „bude akční" a pošle dvě brigády, kdyby Rusko napadlo
    Pobaltí; Macinka by Trumpovi „boty leštil".'
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: „Velmi nepovedený prezident", možná dvojník (dříve ✅)
- id: vrabel-2026-10-02-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Tři cesty ke světovému míru" — zničit USA by přineslo mír; „Rusové by mohli dojít až do Bruselu
    vyčistit Evropu od nacismu" (Vrabel, 2. 10. 2026)
  text: 'V parodii Trumpovy logiky („zničíme Írán a bude mír") Vrabel popisuje tři cesty k míru: odzbrojení
    je nereálné, protože „většina společnosti jsou prostě mentálně zaostalí lidi" ovládaní médii; druhou
    cestou by bylo zničit USA, „největšího agresora od 2. světové války" — „kdyby se zničily Spojené státy,
    tak je velká pravděpodobnost, že by mohl nastat na celém světě mír", to ale nechce kvůli 330 milionům
    lidí; třetí je jaderná válka, která zničí celý svět — „docela reálná možnost". Připomíná, že od roku
    2022 říká, že ČR bude znovu suverénní za 5–10 let a mezitím „si možná na dva, tři roky projde válkou",
    a že už v roce 2023 si v Bruselu dokázal představit, že „Rusové došli až do Bruselu, abychom vyčistili
    celou tu Evropu od nacismu". Polsko a ČR (přes polovinu munice pro Ukrajinu) podle něj čeká „bumerang".
    Válečná ekonomika „nemá žádnou hodnotu ze své podstaty", skutečná inflace je „samozřejmě dvouciferná".'
  podtema: Zahraniční aktéři a precedenty
