      Mravencovi [...] tak by mravenci z té země normálně měli jít a měli by ho normálně exkomunikovat
      ze země a nebo rovnou sežrat.
  - text: Roztrhat a sežrat.
  - text: Nebo ho zakopat dohluboko do mraveniště [...] umlátit jehličkama
