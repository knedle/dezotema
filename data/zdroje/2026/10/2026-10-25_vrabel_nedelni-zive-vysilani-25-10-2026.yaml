vyroky:
- id: vrabel-2026-10-25-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Anton Klobučkin: útok barvou na Vrabela (2023) jako „terorismus“, konflikt s Foldynou — „režim
    si pěstuje teroristy“ (Vrabel, 25. 10. 2026)'
  text: Vrabel tvrdí, že mladík, který se před Sněmovnou dostal do fyzického konfliktu s poslancem Jaroslavem
    Foldynou, je Anton Klobučkin. Ten ho podle něj v roce 2023 s přítelkyní polil na pochodu „ČR na prvním
    místě“ žlutou a modrou barvou. Útok na vedoucího veřejného shromáždění s politickým motivem („Vrábel
    není nedotknutelný“) podle něj splňuje definici terorismu. Přesto byl vyřízen jako přestupek s pokutou
    1 000 Kč a policie útočníkovi prý „pomohla v útěku“, zatímco Tomáš Čermák dostal 5,5 roku za slova.
    Klobučkinovy cesty do Jordánska (evakuace slovenským vojenským letadlem) považuje za „velmi podezřelé“
    a spekuluje, zda nepracuje pro tajné služby nebo policii. Trestní oznámení Vladimíry Vítové prý zůstalo
    bez odezvy.
  citace:
  - text: Takže tenhle režim si tady vypěstovává svoje vlastní teroristy.
  osoby:
  - osoba: anton-klobuckin
    vztah: negativni
    kontext: Útok barvou v roce 2023, „terorista“ vypěstovaný režimem, podezřelé cesty do Jordánska
  - osoba: tomas-cermak
    vztah: pozitivni
    kontext: Nespravedlivě 5,5 roku za slova
  podtema: Kauza Jesenicko — Stanjura obviněn ze zneužití povodňové půjčky
- id: vrabel-2026-10-25-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Demonstrace proti zrušení poplatků jako „český Majdan“; ČT mu před volbami „stáhla hlas“ (Vrabel,
    25. 10. 2026)
  text: 'Vrabel označuje nedělní demonstraci Milionu chvilek na Staroměstském náměstí za „největší propagandu
    na ulicích“, jakou viděl. Minář podle něj otáčí realitu: noční hlasování ve 4:36 líčí jako praktiky
    „sovětského politbyra“ a zrušení poplatků jako zaprodání ČR Rusku, čímž společnost „brutálně“ štěpí
    na Rusko a Západ („nám dělají Majdan“). Babišův spěch se zrušením poplatků podle něj buď „přišel z
    EU“, aby se rozpoutaly nepokoje, nebo šlo o hloupost (dává tomu 50 na 50). ČT podle něj není nezávislá:
    v covidu prý brala peníze od vlády USA a před volbami mu dala tři minuty, a když mluvil o vystoupení
    z NATO, zvukaři mu „stáhli hlas a moderátorovi ho zvýšili“. ČT je podle něj „soukromá globalistická
    organizace, která dělá válečnou propagandu“ a měla by se buď celá vyměnit, nebo zrušit.'
  citace:
  - text: Hele, nám dělají Majdan. Nám tady nás začínají jako rozdělovat Rusko-Západ úplně brutálně.
  osoby:
  - osoba: mikulas-minar
    vztah: negativni
    kontext: Demonstrace na Staroměstském náměstí = „největší propaganda na ulicích“, „dělají Majdan“
  - osoba: andrej-babis
    vztah: negativni
    kontext: Skrytý zrádce, poplatky zrušil možná na pokyn EU (50:50), pro článek 5 zvedne ruku první
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-10-25-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Návrat socialismu: „velmi brzo začnou vlát rudé vlajky“ po Evropě (Vrabel, 25. 10. 2026)'
  text: 'Vrabel poprvé předpovídá, že se na Západě „velmi brzo“ začnou objevovat myšlenky socialismu a
    po Evropě budou vlát rudé vlajky. Neví, zda je to naplánované, nebo jde o přirozený cyklus střídání
    socialismu a kapitalismu. Odkazuje na vyprávění své babičky: po válce byli lidé tak zničení, že hledali
    nový systém, a proto přišel socialismus, „a to je možný, že se to stane znova“. Řadí to do „horké
    fáze přeměny systému“, která podle něj trvá od roku 2015. Výsledkem současného vývoje bude podle něj
    částečně občanská válka a částečně válka s Ruskem a potom buď „temno“ technologické totality, nebo
    nový systém.'
  citace:
  - text: Uvidíte prostě velmi brzo začnou vlát rudý vlajky všude, po Evropě, na západě a začnou se objevovat
      myšlenky socialismu. Je to poprvé, kdy vám to říkám.
  podtema: Politická kultura
- id: vrabel-2026-10-25-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: '**25. 10.** — Vrabel tvrdí, že brutální protesty, které se během jednoho týdne objevily od Itálie
    po Irsko i v Tunisu, nemohou být spontánní. Jsou podle něj „řízené a vyprovokované“ režimy, protože
    jen ty ovládají média a sociální sítě. Odkazuje na americké video, podle něhož byli lidé v černém
    ve Francii napojení na policii a začali házet dlažební kostky. Policie podle něj nemlátí lidi bez
    rozkazu shora a brutalita se stupňuje záměrně, aby se násilí normalizovalo a „přelilo v občanskou
    válku“. Druhým motivem je podle něj odvést pozornost od „něčeho mnohem závažnějšího“, co se v Evropě
    chystá. Sám to označuje za spekulaci.'
  citace:
  - text: Policie nikdy není brutální, pokud nedostane rozkaz shora.
  podtema: Represe a policejní brutalita na Západě
