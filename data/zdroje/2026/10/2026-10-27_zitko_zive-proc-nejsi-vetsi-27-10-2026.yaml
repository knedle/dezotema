  text: '**27. 10.** — Zítko přidává „důkaz“ výškou: podle lišty obložení v liberecké soudní síni je „menší“
    Čermák o 10–17 cm nižší než původních 185 cm; výrok, že se mu „stresem ve vězení zkroutilo ucho“,
    zesměšňuje fotkou jednookého kocoura. Profil „Politický vězeň Čermák“ podle něj „na 99 %“ spravuje
    Martin Turek, který prý ohlásil politickou stranu a petici k rozdělení ČSFR, ačkoli se Čermák od politiky
    distancoval. Odmítá, že by kdy vybíral peníze pro Patrika Tušla („Tušl je kokot, to není klon“, patří
    prý Rajchlovi), na manžele Maruškovy z Jablonce podal trestní oznámení kvůli zadrženým penězům a podpisům
    a vyvrací tvrzení Renaty Bernardy o příjmu 400 tisíc měsíčně a podílu v testovacích centrech. Sčítáním
    písmen mu vychází, že FOX = 666, takže „Fox News z Přehrady“ (Bernardy, TV Šalingrad) je „liška“ s
    číslem šelmy. Pokud Čermák do Holýšova nepřijde, „přestává hra na Čermáka fungovat“.'
