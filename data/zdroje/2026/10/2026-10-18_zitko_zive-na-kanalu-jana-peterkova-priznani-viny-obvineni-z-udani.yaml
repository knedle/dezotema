- id: zitko-2026-10-18-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Remdesivir a ventilátory: skutečná příčina covidových úmrtí'
  text: '**18. 10.** — Zítko k historii smrti matky doplňuje, že šla do nemocnice „s celkem banální bolestí
    břicha“, do tří týdnů byla mrtvá a její smrt byla impulzem k jeho prvnímu vysílání (13. 10.). Odvolává
    se na video amerického lékaře Petersona Pierra a na Sucharita Bhakdiho, „hlavního toxikologa Pfizeru“
    Helmuta Sterze a Bryana Ardise: remdesivir podle nich zabil 53 % pacientů při ebole a u covidu byl
    „hlavním zabijákem“. V USA se podle Zítka za zabití pacienta tímto protokolem „kasírovalo v průměru
    100 000 dolarů“, u nás „patrně o dost levněji“, ale stále šlo o „obrovský kšeft“ pro nemocnice, lékaře
    i sestry. Starší video z jeho truchlivé chvíle (říjen 2022, druhé výročí matčiny smrti) podle něj
    „fízlové“ šíří na falešných profilech jako aktuální reakci na kauzu Čermák.'
  podtema: Vakcíny
- id: zitko-2026-10-18-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**18. 10. (živě, Peterková, odpoledne) — „přiznání viny“:** Na obvinění, zveřejněné 17. 10. na
    profilu „Politický vězeň Čermák“, že Čermáka udal, Zítko reaguje ironickým „přiznáním“. Je prý vinen
    tím, že celou dobu „hry na pandemii“ stál na straně lidí a „od bolestivé smrti uchránil stovky, možná
    tisíce lidí“. Ukazuje cestu „z područí Evropské unie“, protože ČSR „podle zákona 11 z roku 1918 stále
    platí“. Díky alternativním informacím byla podle něj ČR „číslo jedna ze 43 sledovaných zemí“ v odrazování
    lidí od očkování. Šestkrát se ho prý pokusili uvěznit a „už to nestihnou“. Tajné služby ho chtějí
    „dostat do tepláků, zabít, otrávit, zničit“ už šest let. Obvinění je podle něj „test vaší inteligence,
    empatie, selského rozumu“, který zatím „nedopadá dobře“: „probuzení lidstva“ trvá tak dlouho, protože
    existuje „spousta debilů nebo duševně omezených lidí“, kteří neprokouknou policejní provokaci. „Jedenáctiletý“
    Černohorský a Bernardy jsou podle něj, ač dřív nesmiřitelní, v „honu na Zítka“ „jeden šik“. Nově tvrdí,
    že má protokol a nahrávku z výslechu v Chomutově, které ukazují, kdo Čermáka skutečně udal („kluci
    teď budou mít trošku honičku“). Pustil Čermákovo video z roku 2023 (14 lidí nasazených na něj, rodina,
    „polopřítelkyně“) jako ukázku „autentického“ Čermáka, u něhož je změna názorů, např. na Rusko, „krajně
    nepravděpodobná“. Pravý Čermák by podle něj „už dávno zavolal“. Hlásí, že se připravuje „zcela nová
    vysílací platforma pro alternativní média“ a že „jsme ve finále, tohle je vojenská operace a velké
    probuzení“.'
  citace:
  - text: Tohle není žádnej test na Zítka, tohle je test na vás, co všechno jste jim schopný zkousnout.
