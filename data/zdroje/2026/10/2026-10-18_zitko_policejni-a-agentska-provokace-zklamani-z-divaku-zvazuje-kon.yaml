  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**18. 10. — „provokace“ a zvažovaný konec vysílání:** V emotivním krátkém videu Zítko reaguje
    na další „policejní a agentskou provokaci“, podle popisu videa spojenou s „falešným otčímovým profilem“.
    Nejvíc ho podle jeho slov nezklamali „hejtři“ a „fízlové“, ale diváci: jak rychle byli schopni ho
    „odepsat“, kolik lidí se pod textem radovalo („konečně ho dostal“) a jak málo se ho zastalo. Útočníka
    a jeho „loutkovodiče“ Černohorského označuje za „čisté zlo“. Tvrdí, že jeho videa „zachránila lidi
    nejenom od covidu, ale i od sebevražd“, a cení si 15 % hlasů v anketě „žebříčku dezinformátorů“. Do
    ulic prý lidé vyšli, „když šlo o prachy, ale ne o děti“: „to je ta bída té skurvené společnosti“.
    Dává si devět dní (zmiňuje i 13., dvouleté výročí), podle ohlasů pak rozhodne, zda bude dál točit.
    Diváky vyzývá, ať přestanou „lavírovat“ a napíšou, co si myslí, ironicky jmenovanému „Čistému“ Václavu
    Radovi, „Nezdolnému“ Jiřímu Černohorskému (který si prý „začal velmi rozumět“ s Lenkou Tarabovou),
    „budoucímu panu premiérovi“ Jindřichu Rajchlovi a „zabodanému“ Vrábelovi.'
  citace:
  - text: To zklamání nebylo, že po mně jdou hejtři, šílenci. To zklamání bylo, že se tam postavilo málo,
      moc málo lidí.
  osoby:
