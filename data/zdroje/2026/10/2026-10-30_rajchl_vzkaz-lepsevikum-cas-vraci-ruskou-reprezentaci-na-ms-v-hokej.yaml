  nadpis: 'Návrat ruské reprezentace na MS v hokeji: „politika do sportu nepatří“, kritici jsou „pokrytci
    a farizejové“ (Rajchl, 30. 10. 2026)'
  text: Rozhodnutí Mezinárodního sportovního arbitrážního soudu (CAS), že ruská reprezentace se může vrátit
    na mistrovství světa v hokeji, Rajchl označuje za „zcela správné“. Politika podle něj do sportu nepatří,
    kolektivní vina je zlo a sport má národy sbližovat, „nikoli hloubit příkopy“. Kritikům rozhodnutí
    („lepševikům“) vyčítá dvojí metr. Nikdo prý nežádal vyloučení USA po invazi do Iráku, kde „zemřel
    milion lidí bez jakékoliv příčiny“. Česko se podle něj v roce 1999 podílelo na „protiprávní agresi
    vůči Srbsku“, protože přes jeho území létala letadla shazující bomby s ochuzeným uranem. Připomíná
    také, že tíž lidé po předběžném opatření Ústavního soudu, které Petru Pavlovi umožnilo cestu na summit
    NATO do Ankary, žádali respektovat nezávislý soud. Rozhodnutí sportovního soudu ale podle něj respektovat
    nechtějí, protože „se jim nehodí do krámu“.
  citace:
  - text: Jste pokrytci a farizejové, nic víc, nic míň.
  podtema: Zahraniční aktéři a precedenty
