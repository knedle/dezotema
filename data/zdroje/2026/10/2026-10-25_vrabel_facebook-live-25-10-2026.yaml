  nadpis: 'Srbské volby: vítězství studentů — od „barevné revoluce“ k „pronárodnímu“ hnutí (Vrabel, od
    25. 10. 2026)'
  text: '**25. 10.** — Vrabel komentuje vítězství studentského hnutí v srbských volbách (podle něj 52–53
    %, Vučić přes 30 %) přímo z oslav v Bělehradě. Sám přiznává „rozporuplný pocit“, protože si přál pokračování
    Vučiće jako „záruky stability“ v době, kdy se „celá Evropa chystá do války“. Na rozdíl od svého tvrzení
    z 21. 10. o zahraničně placené barevné revoluci teď říká, že hnutí není prounijní, proukrajinské ani
    pro NATO. Lidé mají podle něj jen srbské vlajky a pokusy EU studenty ovlivnit „nevzali“. Vítězství
    studentů podle něj přinese klid, protože jinak by protestovali „divoce“ jako v západní Evropě. Novou
    sílu přesto považuje za „nebezpečnou“, protože „nikdo neví, co od těch lidí čekat“. Vojenská neutralita
    je podle něj v ústavě, takže se Srbsko nepostaví na žádnou stranu konfliktu. Jediná vlajka EU v Bělehradě
    prý visí na české ambasádě.'
  citace:
  - text: Na druhou stranu rozhodně tenhle studentský pokret není něco, co by bylo proti srbský, nebo
      pro ukrajinský, nebo nedej bože pro Evropskou unii, nebo nedej bože pro NATO. To vůbec nepřipadá
      v úvahu.
  podtema: Česká suverenita
