  prehled:
  - tema: Studentské hnutí vyhrálo srbské volby (52–53 %, Vučić přes 30 %)
    text: „rozporuplný pocit“; hnutí ale „není proti srbský, ani pro ukrajinský, pro EU nebo NATO“, pokusy
      EU studenty ovlivnit „nevzali“, což je odklon od tvrzení o barevné revoluci z 21. 10.
    vyrok: vrabel-2026-10-25-06
  - tema: Vojenská neutralita Srbska zůstane
    text: ústavní většinu studenti mít nebudou, Srbsko se nepostaví na žádnou stranu → viz [Predikce](../predikce.md)
  - tema: Vučić jako státník
    text: lidé by mu měli „líbat ruce“; noví politici budou v OSN a EU „beněmínci“ jako Babiš s „vykulenýma
      očima“ (opakuje).
  - tema: Vláda se musí lidí bát (Srbsko vs. ČR)
    text: Srbové dvakrát vynutili volby a vyhráli, ČR v roce 2022 „slušně protestovala“ a nevydržela (opakuje).
  - tema: Covid v Srbsku
    text: „všude na světě byli lidi v krvi…, jenom v Srbsku byli v krvi policajti“ (opakuje).
  - tema: Jediná vlajka EU v Bělehradě visí na české ambasádě
    text: vlajky EU, USA ani Ukrajiny „v Srbsku nemají co dělat“.
  - tema: Orbán v opozici
    text: doufá, že Vučić nedopadne jako Orbán, kterého Magyar „chce dostat do vězení“ (opakuje).
  - tema: Skandování proti Vučićovi
    text: paradox, že mu vyčítají „prodávání země“, ačkoli je podle Vrabela „velmi silně pronárodní“.
  - tema: České mediální podání
    text: přenos dělá, protože česká média „budou vyprávět příběhy, které chtějí“ (opakuje).
vyroky:
- id: vrabel-2026-10-25-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Srbské volby: vítězství studentů — od „barevné revoluce“ k „pronárodnímu“ hnutí (Vrabel, od
    25. 10. 2026)'
  text: '**25. 10.** — Vrabel komentuje vítězství studentského hnutí v srbských volbách (podle něj 52–53
    %, Vučić přes 30 %) přímo z oslav v Bělehradě. Sám přiznává „rozporuplný pocit“, protože si přál pokračování
    Vučiće jako „záruky stability“ v době, kdy se „celá Evropa chystá do války“. Na rozdíl od svého tvrzení
    z 21. 10. o zahraničně placené barevné revoluci teď říká, že hnutí není prounijní, proukrajinské ani
    pro NATO. Lidé mají podle něj jen srbské vlajky a pokusy EU studenty ovlivnit „nevzali“. Vítězství
    studentů podle něj přinese klid, protože jinak by protestovali „divoce“ jako v západní Evropě. Novou
    sílu přesto považuje za „nebezpečnou“, protože „nikdo neví, co od těch lidí čekat“. Vojenská neutralita
    je podle něj v ústavě, takže se Srbsko nepostaví na žádnou stranu konfliktu. Jediná vlajka EU v Bělehradě
    prý visí na české ambasádě.'
  citace:
  - text: Na druhou stranu rozhodně tenhle studentský pokret není něco, co by bylo proti srbský, nebo
      pro ukrajinský, nebo nedej bože pro Evropskou unii, nebo nedej bože pro NATO. To vůbec nepřipadá
      v úvahu.
  podtema: Česká suverenita
