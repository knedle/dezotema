  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**3. 10. (před stanicí)** — Před policejní stanicí, kde čeká „minimálně sto lidí", Vrabel označuje
    situaci za „historický moment": když ho v lednu 2023 zatkli kvůli výroku o F-35, přišli pro něj jen
    tři lidé, nyní se lidé „postavili za jednoho z nás". Policie podle něj zatýká lidi za „Z", aby jim
    „působila strach" a odradila je od demonstrací proti válce — „to dělá tenhle brutální stát pod vládou
    Andreje Babiše". Precedent podle něj opět vytvořila „politická strana PRO", která „ukradla naše vlastenecké
    demonstrace na Václavském náměstí" a začala „udávat lidi" za písmeno „Z".'
  citace:
  - text: To je to, co dělá tenhle brutální stát pod vládou Andreje Babiše.
  podtema: Trestání politického projevu
