vyroky:
- id: vrabel-2026-10-17-01
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**17. 10.** — Babišovo varování, že ČR možná bude muset chránit hranice před nelegálními migranty
    ze západní Evropy, Vrabel označuje za „mistrovský podvod“. „Nelegální migrace“ je podle něj politická
    hantýrka: lidé si pod ní představí ty, které tu nechtějí, ale kdo projde azylovým řízením nebo legalizací
    (Sánchez prý ve Španělsku legalizoval 800 tisíc lidí), dostane razítko a může se volně pohybovat po
    EU. Babiš tak navenek mluví proti migraci a zároveň zakazuje referendum o vystoupení z EU, která stojí
    na otevřených hranicích. „Odhaduju, že 95 % lidí tohle není schopných pochopit, protože jsou politicky
    nevzdělaní.“ Pochopí to prý až ve chvíli, kdy v ČR bude spousta lidí „barvy pleti trošku tmavší, než
    je tamhle to polínko… asi o čtyři odstíny“, s názory, že ženy mají chodit „tři metry za mužem“, a
    když neposlouchají, „je potřeba je bít“ (viz [Stochastický teror](stochasticky-teror.md)). Babiš je
    podle něj „naprosto promigrační politik“ (Ukrajinci, nová povolení pro pracovníky z Filipín). Protesty
    ve Francii jsou podle něj počátek „nějaké občanské války“, Západ „padnul“ a jedinou šancí je „utéct
    z Evropské unie a zavřít hranice“. Ve Francii a Británii nakonec podle něj „vyhrají… muslimové, kteří
    tam přicestovali“, stejně jako v Kosovu a Sýrii. Za rabováním při protiimigračních nepokojích v Dublinu
    vidí „gangy… tím přídavným jménem, které začíná na M, druhé písmeno je U“, protože Irové jsou „strašně
    milí“. Přistěhovalci se podle něj k protestům vždy přidají a „pomalu je přebírají“. U turecké plynové
    platformy Osman Gazi varuje, že Erdoğan tíhne k islámskému právu, a kdyby v Evropě vypukl větší konflikt,
    mohl by vyzvat Turky v Rakousku a Německu k mobilizaci.'
  osoby:
  - osoba: recep-tayyip-erdogan
    vztah: negativni
    kontext: Tíhne k islámskému právu, mohl by mobilizovat Turky v Evropě
- id: vrabel-2026-10-17-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Státní zástupce, který zastavil stíhání Čecha z ukrajinské armády, „má jít do vězení“ (Vrabel,
    5. 10. 2026)
  text: '**17. 10.** — Protesty v Albánii podle Vrabela ukazují konflikt „lidi proti režimu… a stát proti
    lidem“, který začal tím, že si elity (Ivanka Trumpová, Jared Kushner) berou chráněné pobřeží a stát
    jim asistuje. Podobný konflikt podle něj „dříve nebo později může přijít“ v USA, Británii či Francii.
    Západ je podle něj „možná před změnou systému skrze občanskou válku“. Sám prosazuje nenásilnou změnu
    systému zevnitř ČR („Česká republika na první místě“), ale „pokud se nepodaří nenásilná revoluce…
    tak to pravděpodobně bude násilnou cestou. A to buď tou válkou s Ruskem, nebo nějakou občanskou válkou
    v Evropě“ (viz [Predikce](predikce.md)). Ke zprávě, že ANO v senátních volbách „spočítali“, říká:
    „Jako kdyby bylo po mém, tak bych si vzal nějakej karabáč nebo bejsbolovou pálku a takhle bych mu
    to přes záda začal počítat.“ Upřesňuje, že „samozřejmě na nástěnce“, kde visí Babiš „jako zrádce“,
    a že nikoho k násilí nevyzývá. Výrok pak obhajuje: Babiš je podle něj zodpovědný za životy lidí v
    covidu („s těma vakcínama“) i ve válce, protože posílá peníze „fanatizovanému nacistickému režimu
    Zelenského“, a proto „by zasluhoval větší trest, než přetáhnout po zádech karabáčem“ (viz [Stochastický
    teror](stochasticky-teror.md)). Očekává, že politiky „budou soudit… až ta válka skončí“. Ke zprávě
    o nalezené letecké bombě ve Vratislavi připomíná 52 milionů mrtvých druhé světové války a vyčítá lidem,
    že politiky a novináře s „válečnou propagandou“ nechávají ve funkcích. Jeho umírající babička prý
    o takovém politikovi řekla, že by ho „pověsila za žebro“: „nedivím se tomu“.'
  podtema: Kritika soudnictví
- id: vrabel-2026-10-17-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**17. 10.** — Trumpovo pozastavení balíku sankcí proti Rusku (Kirill Dmitrijev mluví o „historickém
    okamžiku“) Vrabel bere jako potvrzení svých „tří týdnů… optimismu“ (viz 13. 10.) a za „čistě jenom
    předvolební gesto“: Trump nesplnil sliby o míru, zdražil Američanům život a před volbami chce vypadat
    jako mírotvůrce, ale „po volbách dělá další a další války“, takže historický okamžik „může velmi brzo
    opadnout“ (viz [Predikce](predikce.md)). Pétera Magyara, který chce pro Maďarsko také roční výjimku
    ze sankcí, označuje za „nejvypočítavějšího politika v Evropské unii“, na úrovni Jindřicha Rajchla.
    Z toho, že politici před volbami vždy zlepšují vztahy s Ruskem, vyvozuje, že „většina lidí by chtěla
    mít s Ruskem dobrý vztahy“.'
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: Pozastavení sankcí jen předvolební gesto, „po volbách dělá další a další války“
  - osoba: peter-magyar
    vztah: negativni
    kontext: „Nejvypočítavější politik v Evropské unii“
  - osoba: rajchl
    vztah: negativni
    kontext: Srovnán s Magyarem jako vypočítavý politik
  - osoba: kirill-dmitrijev
    vztah: neutralni
    kontext: „Historický okamžik“ zbytečně veřejně oslavuje, může brzy opadnout
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-17-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**17. 10.** — K Tuskově výzvě nesnižovat výdaje na obranu Vrabel říká, že Poláci Rusy „historicky
    nenávidí“, a proto jsou „přirozeně další na řadě, hned po těch Ukrajincích“, spolu s pobaltskými státy.
    ČR podle něj peníze do NATO dostane „befelem“, protože Babiš a Pavel („původně agent nebo rozvědčík
    pro Sovětský svaz, poté rozvědčík pro NATO a pro Ameriku“) „zakázali“ referendum o vystoupení z NATO.
    Za muže své generace, kteří si to nechají líbit, se „hluboce stydí“: „co jsme za zbabělce“. K výroku
    náčelníka britské armády, že se veřejnost má připravit na válku a oběti, poznamenává, že v ČR naopak
    politici „mlží“, možná proto, „aby jim z republiky nezmizeli dřív, než vláda vyhlásí, že jsou zavřené
    hranice“. K sestřelení dvou dronů nad Rumunskem sarkasticky líčí „popcornovou“ podívanou na výbuchy
    u Škodovky, kde se prý mají vyrábět drony, až po jaderný výbuch u Řípu.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: S Babišem „zakázal“ referendum o NATO, „agent… pro Sovětský svaz“; ironicky „náš skvělý prezident“
  - osoba: donald-tusk
    vztah: negativni
    kontext: Poláci „nenávidí Rusy“ a tlačí se do války
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-17-05
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: 'Nízká účast ve 2. kole Senátu: politici z protestů se „otočili“ kvůli funkcím; Hamplová „to
    zobchodovala“ (Vrabel, 16. 10. 2026)'
  text: '**17. 10.** — Porážku ANO ve 2. kole senátních voleb (ze 13 kandidátů neuspěl žádný) Vrabel nepřičítá
    spojení ostatních stran, jak tvrdí Babiš, ale tomu, že „společnost už si uvědomila, že Andrej Babiš
    je podvodník“. Babiš podle něj „všechno, co slíbil, tak porušil“: muniční iniciativa pokračuje, na
    Ukrajinu jde 60 mld. eur na zbraně a 30 mld. na „fungování Zelenského režimu“, na summitu NATO v Istanbulu
    přislíbil další peníze a chystá se přijmout dalších 150 tisíc ukrajinských uprchlíků. Babiš „pracuje
    pro Evropskou unii, pro NATO… pro Američany a pro Ukrajinu a nepracuje pro Českou republiku“. Místo
    vymlouvání na krajské organizace by od něj čekal sebereflexi, protože výsledek je „odrazem vlády“.'
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: „Podvodník“, porušil sliby, „mistrovský podvod“ s nelegální migrací; „karabáčem“ na nástěnce
      (→ [stoch. teror](../stochasticky-teror.md))
  podtema: Komunální volby
