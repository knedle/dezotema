  nadpis: 'Zítkův vlastní soudní spor: zákaz pobytu v Praze, soudkyně Rajfová (Zítko, 4. 8. 2026)'
  text: '**24. 10.** — Zítko (z části slovy textu Boba Acera) uvádí, že Krajský soud v Ústí nad Labem
    18. 6. 2026 zrušil chomutovský rozsudek (3 roky nepodmíněně za šíření poplašné zprávy) a vrátil věc;
    podle Acerova textu tím soud uznal svobodu slova a to, že izolace SARS-CoV-2 nebyla doložena, „tudíž
    virus neexistuje“. Okresní soud pro Prahu 2 mu 19. 2. za vyražené dveře uložil 12 měsíců podmíněně
    a zákaz pobytu v Praze do září 2027; vrchní státní zastupitelství 3. 8. vrátilo podezření z napomáhání
    Čermákovu útěku policii jako nedůvodné. Při razii 3. 2. prý přišli „čtyři těžkooděnci se samopaly“,
    telefony mu vrátili 12. 10.; celkem strávil 110 dní ve vazbě, z toho 34 dní hladovky. Popírá, že by
    z testovacích center E-Medic Development měl „ani korunu“ — jeho podíl byl obstaven exekucí a centra
    provozoval majoritní vlastník přes jinou firmu.'
  citace:
  - text: V šesti případech to na mě upletli tak, aby mě dostali.
