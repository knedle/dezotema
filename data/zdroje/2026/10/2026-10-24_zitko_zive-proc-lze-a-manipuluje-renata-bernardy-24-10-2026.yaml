  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**24. 10.** — Zítko Renatu Bernardy označuje za „lhářku a manipulátorku“: nejprve prý vyzývala
    „sejděte se jako chlapi, jeďte za Tomem jako Pepa z Plzně“, pak to nazvala stalkingem a kyberšikanou,
    a šíří podle něj lži, že je „fízl a udavač“ s příjmem 400 tisíc měsíčně za covidu; naznačuje, že ji
    „krmí“ tajné služby. V rozhovoru „údajného“ Čermáka na TV Šalingrad napočítal „pět lží za pět minut“
    (řízek s tatarkou ve vězení, mzda 9,50 Kč/h, „zkroucené ucho“ ze stresu, „nikdo na mě nečekal“) a
    video je podle něj „dabované“; firma TKO v Líních o něm prý mezi 25 zaměstnanci neví. Nařčení z udání
    podle něj přišlo až po 23 dnech, protože „kluci z tajných služeb a policie koumali, jak na Zítka vyzrát“;
    policie zdroj nikdy neprozradí. Předpovídá, že pokud Čermák „není pravý“, do Holýšova nepřijede (viz
    [predikce](/predikce/index.md)).'
  citace:
  - text: Pokud není pravý Tomáš Čermák, tak za boha na to setkání nebude chtít přijít.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
