  nadpis: Macinka na Chanuce hnutí Chabad Lubavič; Kushner, Lutnick a Adelsonová jako financiéři Trumpa;
    „Velký Izrael“ (Vrabel, 8. 10. 2026)
  text: K zprávě, že ministr zahraničí Petr Macinka loni v prosinci vystoupil na veřejné oslavě Chanuky
    pořádané ultraortodoxním hnutím Chabad Lubavič a podpořil přesun ambasády do Jeruzaléma, Vrabel tvrdí,
    že Chabad má za „jeden z hlavních cílů vytvořit Velký Izrael“ a očekává mesiáše, jehož příchodu musí
    předcházet velká válka, která „vyvolenému lidu“ dá území Sýrie, Libanonu a dalších zemí. Proto se
    podle něj na Blízkém východě děje „z velké části, možná z největší části“ to, co se děje. Chabad podle
    něj podporuje rodina Kushnerů a Trumpa finančně podporovali Lutnick a Miriam Adelsonová. Na fotkách
    s Macinkou je prý i Boris Šťastný, což vysvětluje Macinkův slib blokovat jakékoli sankce EU proti
    Izraeli. U jednání Kushnera s Dmitrijevem o americkém vstupu do Nord Streamu naznačuje, že „Velký
    Izrael“ by se mohl „posunout i směrem na Ukrajinu“ a že „se mluví“ i o Zelenském. Pak se zarazí, „aby
    ho nezavřeli za antisemitismus“.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-10-08-02
  typ: tvrzeni
