  nadpis: Manželka Nicoláse Madura žádá o domácí vězení ze zdravotních důvodů (Vrabel, 12. 9. 2026)
  text: '**8. 10.** — K nové obžalobě Madura a jeho manželky v New Yorku (represe, únosy, mučení) Vrabel
    tvrdí, že hlava státu je podle mezinárodního práva nedotknutelná. Americké „napadení suverénní země,
    zabití desítek lidí a únos prezidenta“ je podle něj válečný zločin a „barbarství“. Americký soud nemá
    jurisdikci, soudit by mohl jen tribunál zřízený Radou bezpečnosti OSN.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-10-08-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: USA rozeštvávají slovanské národy a „vydělávají na válkách“; „chabad-lubavičská sionistická
    pyramida moci“; Hitler jako „levoboček Rothschildů“ (Vrabel, 8. 10. 2026)
  text: 'K Rubiovu varování před eskalací Vrabel tvrdí, že USA se tváří jako mírotvůrci, ale samy válku
    připravily: od oranžové revoluce 2004 přes Majdan 2013 („jejich koně“, stanice CIA, výcvik) až po
    zbraně pro Azov, které podle něj po zákazu Kongresu v roce 2018 dodávaly Kanada a Izrael („náckům
    do Azova pistole z Izraele“). Za podporou Ukrajiny proti Rusku stojí podle něj „globalistická, chabad-lubavičská,
    sionistická pyramida moci“, která chce světovou vládu. Totéž podle něj platilo pro druhou světovou
    válku: Hitler, „o kterém se mluví, že byl levoboček rodiny Rothschildů“, dostal peníze od stejných
    kruhů, které pak přišly jako „mírotvůrci“, převzaly nacistické vědce, patenty a zlato a přes Marshallův
    plán a brettonwoodský systém si Evropu zavázaly. I nyní podle něj USA s Ruskem obchodují, Evropě prodávají
    zbraně, „těší se, že se Evropa zničí“, a nakonec převezmou evropský i ruský byznys. „My jsme vždycky
    takoví kreténi, že nás poštvou proti sobě slovanské národy.“'
  osoby:
  - osoba: marco-rubio
    vztah: negativni
    kontext: „Mírotvůrce“ země, která válku připravila
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-08-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Dohra shromáždění 3. 10.: spor s Hájkem, Svatošem a Štěpánem; „vlastence nezajímají jaderné
    zbraně“ (Vrabel, 8. 10. 2026)'
  text: 'Vrabel si stěžuje, že výzva proti jadernému vyzbrojení „neoslovila české vlastence“ a pozornost
    na sebe strhlo až zatčení Blahníkové (jeho video před stanicí mělo podle něj 400–500 tisíc zhlédnutí).
    Pouští rozhovor Petra Hájka s Michalem Svatošem (Protiproud), kde zaznělo, že na shromáždění přišlo
    „pár desítek lidí“, že si Vrabel „staví haciendu v srbských horách“ a přijel kvůli volbám, a Svatoš
    ho přirovnal k Pavlovi. Vrabel to označuje za „lež“: přišlo podle něj nejméně 500 lidí, výzvu podepsalo
    přes 300 a hnutí ve volbách nekandiduje, což oba pozvaní věděli. Hájka popisuje jako bývalého „politruka“
    Květů z roku 1985, poradce Václava Klause napojeného přes Klausův institut na Macinku, jehož Protiproud
    je dnes „provládní médium“ (spekuluje o příjmech z prodeje čínských léků). Odmítá i výtku Svobodného
    rádia (podle něj „rádia SPD“), že by „pracoval s vládou Fialy“. Sarkasticky komentuje tvrzení Vladimíra
    Štěpána, že byl v roce 2022 domluven s Fialovou vládou na koalici a „klíčových ministerstvech“, které
    padly jen proto, že Vrabel neudělal další demonstraci s odborníky. Podle Vrabela tehdy existovala
    nabídka založit stranu ČR na 1. místě s penězi „přes Radima Fialu“ pod podmínkou, že v ní nebude on.'
  osoby:
  - osoba: petr-hajek
    vztah: negativni
    kontext: Šíří „lež“ o shromáždění; bývalý „politruk“ Květů, Protiproud je „provládní médium“
  - osoba: michal-svatos
    vztah: negativni
    kontext: Přirovnal Vrabela k Pavlovi, „zkreslené informace“
  - osoba: vladimir-stepan
    vztah: negativni
    kontext: Tvrdí, že byl v roce 2022 domluven s Fialovou vládou na ministerstvech (sarkasmus)
  podtema: USA — volební systém
- id: vrabel-2026-10-08-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenskyj podmiňuje energetické příměří ruským ústupkem jako první — Vrabel: žádné příměří
    nebude (Vrabel, 15. 9. 2026)'
  text: '**8. 10.** — K prohlášení ruského zástupce při OBSE Poljanského, že Rusko na příměří nepřistoupí,
    Vrabel souhlasí: „taky bych jim žádné příměří nedal… normálně tvrdou kapitulaci Ukrajiny“. Příměří
    by podle něj po zkušenosti s Minskem posloužilo jen k dozbrojení Ukrajiny. Nejdřív se podle něj musí
    dohodnout, co bude ruské, jaká budou práva menšin, výzbroj Ukrajiny a hranice NATO, a teprve pak zastavit
    boje. Do té doby Rusko „zvítězí a nastaví to z pozice síly“. Zmiňuje video, na kterém Ukrajinci údajně
    týrali mladou Rusku, a „nacistické projevy“ ukrajinských představitelů. Babišovi vyčítá, že souhlasil
    s tím, že Krym a Donbas jsou ukrajinské.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-10-08-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Po Ukrajincích jsou „na řadě Poláci“ — globalisté chtějí zničit silné národy a promíchat Evropu
    migranty (Vrabel, 8. 10. 2026)
  text: K tomu, že Polsko kvůli ruskému útoku na Ukrajinu aktivovalo letectvo a rozeslalo varovné SMS,
    Vrabel opakuje, že konflikt se podle něj rozroste na území NATO, spíš přes malé pobaltské republiky,
    ale „pod falešnou vlajkou“ to může být i větší země. Z „dlouhodobé logiky“ globalistů, kteří chtějí
    zničit silné národy, promíchat je s migranty, vytvořit „evropského člověka“ a superstát, jsou podle
    něj „další na řadě po Ukrajincích Poláci“. Ti jsou totiž jediný silný, nezislamizovaný národ, který
    „se postaví chlapi na hranici“. Na Ukrajinu se podle něj už teď dováží „čistí valci“ z Asie, plánovaně
    9 milionů lidí. O dalších zemích tvrdí, že ČR „není překážka“ (Babiš migrační pakt odmítl jen „výkřikem“,
    vymahatelný bude od ledna 2027), Fico vozí 250 tisíc migrantů z Kazachstánu, „Rumuni se vždycky nechají
    koupit“ a Chorvaté jsou „etnicky nejčistší, náckové“, ale „dají se koupit“.
  citace:
  - text: Obávám se, že další na řadě po Ukrajincích jsou Poláci.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-08-07
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: po Ukrajincích budou „na řadě Poláci“; migrační pakt nám začnou „lifrovat“ od ledna 2027
  text: Pokud se válka rozšíří na území NATO, globalisté se podle něj zaměří na Polsko jako na poslední
    silný evropský národ. Migrační pakt bude od ledna 2027 vymahatelný a ČR začnou dřív nebo později přidělovat
    migranty.
  citace:
  - text: Obávám se, že pokud se ten konflikt rozběhne, že Poláci jsou další na řadě.
  predikce:
    horizont: neurčeno (Polsko); od ledna 2027 (migrační pakt)
    stav: ceka
