- id: zitko-2026-10-15-02
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Rozdělení ČSFR jako nulitní akt + „velká aliance" čistí Deep State (Zítko, 12. 6. 2026)
  text: '**15. 10.** — Zítko přidává „další rozměr podvodu", na který prý přišel pan Hlásenský: Václav
    Klaus kandidoval ve volbách 5.–6. 6. 1992 do Federálního shromáždění, ne do České národní rady. Tam
    kandidoval Jan Stráský, a funkce si tak podle Zítka „protiprávně, protizákonně, podvodně rozdělili",
    když se Klaus s Mečiarem domluvil, že „stále existující" ČSR (zákon 11/1918) roztrhne. Obnova unitárního
    státu je podle něj „daleko důležitější než Čermákiáda", aby někdo „korporaci Česko" „neprodal pod
    prdelí předluženou, třeba na Ukrajinu". Zbytek je rekapitulace beze změny: zákon 542/1992 nepodepsal
    prezident, poslanci byli jen kooptováni a volby proběhly až v roce 1996, Havel „křivě přísahal" třikrát
    (29. 12. 1989, 5. 7. 1990, 2. 2. 1993) a rozdělení proběhlo bez referenda (ústavní zákon 327/1991),
    takže lid byl „okraden".'
  osoby:
  - osoba: vaclav-klaus
    vztah: negativni
    kontext: Kandidoval 1992 do FS, ne do ČNR — s Mečiarem „roztrhl“ ČSR podvodem
