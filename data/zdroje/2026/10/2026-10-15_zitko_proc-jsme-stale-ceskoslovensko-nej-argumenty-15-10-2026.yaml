- id: zitko-2026-10-15-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: |-
    **15. 10.** — Vysílání TV Šalingrad (Renata Bernardy) s „údajným" Čermákem na Zítkově „selském rozumu a kognitivním myšlení nezměnilo vůbec nic". On a Kačenka ho jako jediní z veřejnosti viděli naživo, zatímco Bernardy ho tři roky neviděla. Diváky vybízí: „vyražte do Holíšova a mrkněte se na něj". Zpochybňuje svědectví bývalého starosty Řepojišť Pavla Novotného, „dvou falešných policejních profilů" i Šišákové. Za zvláštní považuje, že Bernardy i Černohorský shodně tvrdí, že pravý je profil „Politický vězeň Čermák"; Bernardy prý ví, kdo stojí za profilem „Tomáš Kvatro Čermák 2026", a má tedy „nějaké zpravodajské informace". Jako jediný férový důkaz požaduje konfrontaci naživo u stolu, při níž by se diváci, Zítko i Hradil mohli ptát na detaily, které znají „jen my dva". Odkazuje na Bidenova dvojníka a dodává: „Já už jsem třeba viděl dvacet prezidentů Trumpů, možná ještě víc prezidentů Putinů… už šestý rok se nacházíme v informační válce."

    Spory v hnutí přirovnává k fanouškům znepřátelených fotbalových klubů, kteří by měli „kopat za národní tým". Za útoky na sebe hledá motiv: „můžou za tím být peníze, může za tím být korupce, může za tím být třeba vydírání, což je ovládací mechanismus našich politiků". Celé to podle něj „zavání odváděním pozornosti od podstatně důležitějších věcí".
  osoby:
