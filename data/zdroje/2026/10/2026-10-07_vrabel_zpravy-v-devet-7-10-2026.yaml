vyroky:
- id: vrabel-2026-10-07-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: „Izraelský Pearl Harbor" — Netanjahu byl varován před útokem Hamasu (Vrabel, 8. 9. 2026)
  text: '**7. 10. (3. výročí útoku Hamasu)** — Vrabel opakuje, že saúdský král údajně Netanjahua předem
    varoval a že v nejstřeženější zemi světa je selhání obrany „prakticky nemožné“. Opatrně, „aby ho nikdo
    nezastřelil nebo nezavřel“, naznačuje, že události na Blízkém východě mohou být „záměrně vyvolávány“
    kruhy jako Chabad Lubavič a křesťanští i židovští sionisté. Ti podle něj věří, že příchodu Mesiáše
    musí předcházet velká válka, a chtějí naplnit proroctví o vzniku „Velkého Izraele“.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-10-07-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Letní energetická krize 2026: sucho omezuje jádro a vodní zdroje, uhlí se vrací (Vrabel, 19.
    8. 2026)'
  text: '**7. 10.** — Na slova eurokomisaře Jørgensena, že řešením drahých energií je energetická účinnost
    a obnovitelné zdroje, Vrabel odpovídá, že energetická krize začala uměle na trzích už v roce 2021
    a dnes ji „způsobuje člověk“ útoky na rafinerie a uzavřením Hormuzu. Drahá nafta a benzín jsou podle
    něj „schválně“, aby se v rámci Green Dealu přestala používat ropa. Za „účinností“ se podle něj skrývají
    úspory: von der Leyenová už k nim vyzývá, a „jakmile se ochladí“, čeká v ČR „úsporné procesy“, které
    poškodí ekonomiku i blahobyt („bez energie není ekonomika, bez ekonomiky není bohatství“).'
  osoby:
  - osoba: dan-j-rgensen
    vztah: negativni
    kontext: Řešení přes „účinnost“ a OZE je „úplně obráceně“
  podtema: Energetika a Rusko
- id: vrabel-2026-10-07-03
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Údajný mor v Irkutsku jako protiruská propaganda; covid „pravděpodobně udělali Američané“ (Vrabel,
    6. 10. 2026)
  text: '**7. 10.** — K Trumpovu oznámení, že bude mor řešit s Putinem, Vrabel dodává, že západní a polská
    média „rozjíždějí“ možnost smrtonosné epidemie, snad kvůli americkým volbám nebo ruským úspěchům na
    Ukrajině. Nevylučuje, že „je naplánováno, aby po epidemii covidu byla válka a po válce zase epidemie“.'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: vrabel-2026-10-07-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: „už jediné, k čemu může dojít, je občanská válka"; ČR má ještě šanci „pomoct" 2 milionům
    Ukrajinců vrátit se (Vrabel, 26. 9. 2026)'
  text: '**7. 10.** — Ke koncepci výstavby armády do roku 2040, která má zohlednit „ukrajinské zkušenosti“,
    Vrabel tvrdí, že Ukrajina během několika let „absolutně proroste do Evropy“: Ukrajinci, kteří tu zůstanou,
    začnou zakládat politické strany a pronikat do armády i policie. Policisté, kteří dnes zatýkají lidi
    za „Z“ z trikolóry, budou proto „velmi brzo“ zčásti Ukrajinci („samé dobré zprávy, bude nás chránit“).'
- id: vrabel-2026-10-07-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Program SAFE jako skryté zbrojení z peněz ČR; Rumunsko (Vrabel, 17. 6. 2026)
  text: '**7. 10.** — Babišův výrok, že Češi mají v úsporách „biliony“ a mohli by si koupit státní dluh
    a „vlastnit republiku“, je podle Vrabela jen způsob, jak v ČR „prodat“ unijní program Savings and
    Investments, který má úspory nasměrovat do zbrojení. Evropa podle něj „vsadila všechno na válečnou
    ekonomiku“, a pokud válku s Ruskem prohraje, „půjdeme do chudoby“. Lidem doporučuje „nemít všechna
    vajíčka v jednom košíku“ a varuje před inflací typu měnové reformy, „řeckým“ zdaněním vkladů s limity
    výběru a ztrátou peněz v bankách. Babiše přirovnává k Trumpovi („jaký jsou to fráři“) a ironicky ho
    nazývá „svým robotem“, který jeho výzvu proti jaderným zbraním „prezentuje jako svůj nápad“.'
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: „Můj robot“, chce vzít lidem úspory, s Trumpem „fráři“
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-10-07-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Válka Ruska s Evropou „na 99 %“ začne v Pobaltí a bude vleklá; Evropa chystá jaderné obklíčení
    Ruska; „zachraň se, kdo můžeš“ (Vrabel, 6. 10. 2026)
  text: '**7. 10.** — Vrabel tezi rozvíjí. USA podle něj do války „kvůli Lotyšsku nebo ČR“ nepůjdou (cituje
    Petra Robejška), jsou „prakticky odzbrojené“ po Íránu, a s Ruskem tak bude bojovat Evropa sama. Konflikt
    se podle něj rozvine „postupně, přes nějakou pobaltskou zemi“. Nesouhlasí s Lavrovem, že USA „podlehly
    tlaku Evropy“: o válce podle něj nerozhodují Trump ani von der Leyenová, ale „lidé v pozadí, kteří
    to financují“. Dohoda z Anchorage byla americký „úskok“, aby se Rusko uklidnilo a Západ se mohl dozbrojit,
    a Merzova podmínka zastavit nejdřív boje je záměrně nepřijatelná. Schůzku 32 vojenských představitelů
    NATO v Kyjevě komentuje „dobrý pocit z toho nemám“.'
  osoby:
  - osoba: sergej-lavrov
    vztah: rozporuplny
    kontext: Nesouhlasí, že USA podlehly tlaku Evropy
  - osoba: friedrich-merz
    vztah: negativni
    kontext: Podmínka zastavit boje je záměrně nepřijatelná, oblíbenost pod 15 %
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-07-07
  typ: predikce
  temata:
  - migrace
  nadpis: „jakmile se ochladí“ přijdou v ČR nařízené energetické úspory; Ukrajinci budou „velmi brzo“
    i v české policii
  text: S příchodem zimy EU a vláda zavedou „úsporné procesy“ v energetice, které poškodí ekonomiku. Ukrajinci
    během pár let „prorostou“ do české politiky, armády i policie a „velmi brzo“ budou i mezi policisty,
    kteří zatýkají demonstranty.
  citace:
  - text: Očekávejte, jakmile se ochladí, že se budou dělat nějaké úsporné procesy v naší republice.
  predikce:
    horizont: zima 2026/27 (úspory); „během příštích pár let“ (Ukrajinci)
    stav: ceka
