- id: vrabel-2026-10-05-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**5. 10.** — Vrabel rozvádí právní argument: za schvalování válečných zločinů (§ 405) nelze nikoho
    odsoudit, dokud žádný mezinárodní tribunál ani Rada bezpečnosti OSN neodsoudila ruskou armádu za válečné
    zločiny nebo genocidu, protože platí presumpce neviny. Vysvětluje to podobenstvím o „Karlovi“, který
    údajně vykradl drogerii, a „Pepíkovi“, který mu to přeje: Pepíka nelze soudit, dokud nebyl odsouzen
    Karel. Zatýkání za „Z“ podle něj „vytvořil Rajchl s Vackem na objednávku“ spolu se státním zástupcem
    Střížem. Varuje, že pokud se zatýkání za písmeno na tričku stane normou, „pak někdo může začít střílet
    na lidi“.'
  podtema: Trestání politického projevu
- id: vrabel-2026-10-05-02
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Globalisté dosazují „falešné mesiáše" napříč Západem — Magyar, Trump, Merz, Babiš (Vrabel, 6.
    6. 2026)
  text: '**5. 10.** — K tomu, že armáda odebrala záštitu konferenci Future Air Force kvůli organizátorům
    (mj. Petr Marquardt, řečník na konferenci Svatopluk) „zpochybňujícím euroatlantické závazky“, Vrabel
    tvrdí, že jde o „příběh z dílny globalistů“. Ti podle něj hledají zkušené politiky (Trump, Petr Drulák)
    a dělají z nich „národní ikony“, které před volbami mluví pronárodně, ale po volbách dělají stejnou
    globalistickou politiku (Trump „zabírá Venezuelu, útočí na Írán“). Polarizace kolem konference je
    podle něj „nejlepší kampaň Petra Druláka do prezidentské kampaně“.'
- id: vrabel-2026-10-05-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Španělsko legalizuje ~1 mil. migrantů; EU „bojuje jen s nelegální migrací" (Vrabel, 17. 6. 2026)
  text: '**5. 10.** — Masové protesty ve Španělsku (70 tisíc lidí v Madridu kvůli bydlení) a ve Francii
    (5 tisíc zatčených středoškoláků, uzavřené školy, útok plynovým hořákem na učitelku) jsou podle Vrabela
    ve skutečnosti o migraci. Ve Španělsku chybí byty, protože Sánchez „dal 800 tisícům migrantů razítko“,
    a ve Francii protesty „přebírají migranti“. Média podle něj prodávají „začínající občanskou válku
    v Evropě“ pod „nesmysly“ o nedostatku učitelů. Evropské země podle něj „dávají svou zemi zdarma“ (Němci
    Syřanům a Afgáncům, Britové Pákistáncům a „černochům“, Francouzi Alžířanům) a ve Švédsku jsou „mladé
    Švédky v menšině“. Lidé to podle něj vědí, a přesto vyhrávají politici, kteří tuto politiku dělají,
    takže „by to možná chtělo změnu systému“.'
- id: vrabel-2026-10-05-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: '**5. 10.** — Vrabel tvrdí, že policie má na demonstracích v ČR „nějaký úkol rozehrát konflikt“:
    těžkooděnci strkají do lidí, dlouze a posměšně zírají na „nejsilnější jedince“ a exemplárně zatýkají
    ženu, která „nikoho neoslovila“. Přirovnává to k roku 1989 a „agentovi Šmídovi“ i k Majdanu a Gruzii
    („rozděl a panuj“). Dnešní režim podle něj „není o moc lepší než v roce 89, jestli není horší“. Na
    Západě (Španělsko, Francie, Německo, Británie) už jde podle něj o boje mezi policií, „která brání
    globalistický režim, protože je za to placená“, a občany.'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-10-05-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Státní zástupce, který zastavil stíhání Čecha z ukrajinské armády, „má jít do vězení“ (Vrabel,
    5. 10. 2026)
  text: 'Státní zastupitelství zastavilo stíhání Čecha, který v roce 2022 vstoupil bez souhlasu prezidenta
    do ukrajinské armády, s odůvodněním, že obrana Ukrajiny je „předsunutá obrana ČR“. Vrabel v tom vidí
    „politický aktivismus“: státní zástupce podle něj „nezastupuje stát, likviduje právní systém“, a měl
    by být sám stíhán za zneužití pravomoci a odsouzen. Srovnává to se stíháním Ivana Kratochvíla kvůli
    podpoře bojovníka na straně Donbasu, protože podle něj „nelze bojovat ani na jedné, ani na druhé straně“.
    Státní zástupci podle něj politicky zasahují i proti němu, jeho manželce, Blahníkové a Hrdličkovi.
    Úvahu uvádí větou, „jestli by byl odsouzen, kdyby řekl, že by měl být ten státní zástupce zastřelen
    na místě“, a popisuje fantazii o tom, jak by ve vězení „myl záchody“ před odsouzenými, které tam poslal,
    „a kamery by měly být vypnuty“ (viz [Stochastický teror](stochasticky-teror.md#přehled-výroků)).'
  citace:
  - text: Ten státní zástupce by měl být odstíhaný trestně za zneužití pravomoci veřejného činitele [...]
      Měl by být odsouzený. Měl by jít mýt záchody do vězení.
  podtema: Kritika soudnictví
- id: vrabel-2026-10-05-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Program SAFE jako skryté zbrojení z peněz ČR; Rumunsko (Vrabel, 17. 6. 2026)
  text: '**5. 10.** — K tomu, že ČR získala z programu SAFE úvěr 2,06 mld. € (asi 50 mld. Kč, z toho 23
    mld. na dálnici D11 a 20 mld. na tanky Leopard), Vrabel ironicky volá „hurá, jednou za Českou republiku,
    jednou za Německo“. Tvrdí, že EU „nemá vlastní peníze“: státy jí nejdřív víc zaplatí, aby si pak mohly
    půjčit (vidí v tom „uroboros“). Skutečným cílem je podle něj dostat „deset bilionů eur“ úspor Evropanů
    přes fondy Savings and Investments Union do zbrojení. To odmítá eticky i ekonomicky, protože zbraně
    „nevytvářejí hodnotu“ a jejich nákup je jako peníze spálit. Hrozí podle něj ztráta úspor inflací nebo
    krach projektů, „až EU začne prohrávat ve válce“.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
