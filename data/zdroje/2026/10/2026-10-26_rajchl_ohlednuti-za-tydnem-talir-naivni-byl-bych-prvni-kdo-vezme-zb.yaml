  nadpis: „Byl bych první, kdo vezme zbraň do ruky“ — zastánci války by „utíkali do Německa“ (Rajchl,
    26. 10. 2026)
  text: V debatě s poslancem Talířem Rajchl odmítá výzvy, ať „brnkne Putinovi“ a ten zastaví válku, jako
    naivní. Taková varianta je podle něj „ze stolu“ a znovu odkazuje na nepodepsanou Istanbulskou dohodu.
    Na otázku, zda by sám bránil zemi, odpovídá, že by byl první, kdo vezme zbraň a půjde bránit Českou
    republiku proti jakémukoli nepříteli. Zastánci podpory Ukrajiny by naopak podle něj „utíkali do Německa“,
    protože umějí bojovat jen slovy a nikdy nenasadí vlastní život.
  citace:
  - text: Já bych byl první, kdo by vzal zbraň do ruky a šel by bránit Českou republiku proti jakémukoliv
      nepříteli. To vy byste utíkali do Německa.
  podtema: Zahraniční aktéři a precedenty
