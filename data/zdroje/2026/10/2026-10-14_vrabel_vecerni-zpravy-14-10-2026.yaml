- id: vrabel-2026-10-14-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa jako „zrada národa" a „ani koruna na Ukrajinu" jako podvod — „posílá se víc
    než za Fialy" (Vrabel, 27. 9. 2026)
  text: '**14. 10.** — K italskému záměru umístit radary na Balkáně (Crosetto v Prištině) Vrabel označuje
    Kosovo za „další americkou kolonii“ a připomíná radar v Brdech. Podle Wikileaks prý tehdejší velvyslanec
    Petr Kolář („přítel po boku současného prezidenta“) bez vědomí MZV radil Američanům počkat na Topolánkovu
    vládu a prosadil, aby se raketové základně říkalo „radar“: „Čechům se mělo říct, že půjde o radar,
    aby se nebáli.“ Paroubek mu to prý osobně vyprávěl u snídaně. Obává se, že na Balkáně (Černá Hora,
    Albánie) půjde také o raketové základny nebo letiště. Každodenní vzlety stíhaček a sirény (Rumunsko,
    Polsko, Norimberk) podle něj „ještě nejsou válka s Ruskem“, ale „vytváření strachu“.'
  osoby:
  - osoba: petr-kolar
    vztah: negativni
    kontext: „Přítel po boku prezidenta“, za zády MZV radil USA k radaru (Wikileaks)
  - osoba: jiri-paroubek
    vztah: pozitivni
    kontext: Postavil se proti radaru, „patří mu dík“
  podtema: EU jako vojenská struktura
- id: vrabel-2026-10-14-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**14. 10.** — K Rutteho slovům v Tallinnu Vrabel tvrdí, že NATO není obranná aliance (rozbití
    Jugoslávie): „North Atlantic Terroristic Organization. Severoatlantická teroristická organizace.“
    Na rozdíl od generála Kryvonose („NATO je mrtvě narozený organismus“) i Lavrova (krátká válka) je
    přesvědčen, že evropská část NATO válku s Ruskem vést může: má „spoustu lidského materiálu, který
    může být užitý na frontě“ (550 mil. lidí), úspory a ekonomiku přecházející na zbrojení. „Může vést
    pěkně 10 let válku s Ruskem.“ Jaderné zbraně podle něj nikdo nebude chtít použít, „ale že jsou ochotní
    nechat zemřít miliony lidí… to ochotní jsou“. „Psychopati z NATO“ jsou podle něj schopni jít „do posledního
    Evropana“. Celý příběh o porážce Ruska si podle něj vymyslela úzká elita, „aby si z občanů Ukrajiny
    a EU udělala svoje vojáky, aby ukradly nerostné bohatství Ruska“. „My jsme v době drancování před
    válkou.“ Kaliningrad je „hora dynamitu“ a záměr Estonska uzavřít záložní plynovod je „první vlaštovka“.'
  osoby:
  - osoba: mark-rutte
    vztah: negativni
    kontext: Válečná propaganda, NATO není obranné
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-14-06
  typ: predikce
  temata:
  - migrace
  nadpis: ČR bude za deset let „země nikoho a všech“; policie bude v regionu brutální
  text: Kvůli migračnímu paktu a příchodu muslimů bude ČR za deset let „země nikoho a všech“; v ČR, Polsku,
    na Slovensku a v Maďarsku bude policie „v následujících měsících až letech“ brutální vůči občanům.
  citace:
  - text: Za deset let Česká republika bude vypadat úplně jinak. To už vůbec nebude Česká republika, tak
      jak my ji známe dneska. To bude země nikoho a všech, a bude se v ní mluvit různými jazyky.
  predikce:
    horizont: 2036; brutalita policie „měsíce až roky“
    stav: ceka
- id: vrabel-2026-10-14-07
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: válka Evropy s Ruskem by trvala „pěkně 10 let“ a byla krvavá, bez rychlého nasazení jaderných
    zbraní
  text: Pokud evropská část NATO vstoupí do války s Ruskem, bude to dlouhá (kolem 10 let), krvavá konvenční
    válka; jaderné zbraně se rychle (nebo vůbec) nepoužijí.
  citace:
  - text: Může vést pěkně 10 let válku s Ruskem. […] Nemyslel bych si, že dojde na ty jaderné zbraně nějak
      rychle, nebo jestli vůbec na ně dojde, ale obávám se, že by to mohlo být velmi krvavé.
  predikce:
    horizont: neurčeno (délka ~10 let)
    stav: ceka
