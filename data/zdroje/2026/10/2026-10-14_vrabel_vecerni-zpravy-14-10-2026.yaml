vyroky:
- id: vrabel-2026-10-14-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: EU ekonomika vybudována na levném ruském plynu — vzdáváme se jí dobrovolně (Vrabel, 18. 5. 2026)
  text: '**14. 10.** — Trumpova prohlášení o energetickém příměří mezi Ruskem a Ukrajinou podle Vrabela
    hýbou burzami a „on a lidé kolem něj“ na tom vydělávají stovky milionů dolarů: „toto je obrovská kriminální
    činnost, to, co dělá Donald Trump. On zneužívá svoji funkci.“ „Ten Trump by zasloužil prostě, nevím,
    ani nechci říkat, co by zasloužil.“ Ruské suroviny se podle něj mají kupovat přes Američany za čtyřnásobek
    a peníze jdou na volby a tajné operace, což je „korupce na úrovni států“.'
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: Burzovní machinace jako „obrovská kriminální činnost“, Grónsko „podmanil“
  podtema: Energetika a Rusko
- id: vrabel-2026-10-14-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**14. 10.** — Protesty ve Francii, Itálii, Španělsku, Nizozemsku, Belgii, Británii a Německu
    podle Vrabela nejsou studentské, ale „počátek občanské války v Evropě“, a znovu vyzývá uzavřít hranice
    ČR, „dřív, než se to přelije“. Migranti z Eritreje a střední Afriky „mají nejvíc odstínů oproti tomu
    polínku… a taky, když je vidíte, tak tam bývá nejvíc útoků“, a „bojují proti tomu systému, jako kdyby
    ho chtěli zničit“ (viz [Stochastický teror](stochasticky-teror.md)). S migračním paktem podle něj
    přijde „strašný kvantál“ muslimů a ČR bude za deset let „země nikoho a všech“ („Česko-Ukrajinsko“).
    Pokud Hútíové zničí odsolovací zařízení v Perském zálivu, mohou do Evropy vyrazit „další velké migrační
    vlny“, které pakt „přerozdělí“. Ke Grónsku tvrdí, že se „naplnila jeho slova“: dohoda s USA ho fakticky
    podmanila kvůli surovinám, možná i s jadernými zbraněmi (Golden Dome).'
- id: vrabel-2026-10-14-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Státní zástupce, který zastavil stíhání Čecha z ukrajinské armády, „má jít do vězení“ (Vrabel,
    5. 10. 2026)
  text: '**14. 10.** — Celostátní cvičení pořádkových jednotek ve Spolaně podle Vrabela míří na průvod
    17. listopadu. Vyjmenovává „teror“ proti lidem ze svého okruhu: pro Tomáše Hrdličku si přišlo 14 policistů,
    pro Katku Rovnou těžkooděnci se samopaly, u Pavla Zýbka proběhl ranní zásah. Tomáš Čermák byl vězněn
    „jako nejtěžší zločinec“ za facebookový výrok. Slávek Popelka byl půl roku ve vězení, kde ho jako
    vegetariána prý krmili masem, a teď má leukémii. Zmiňuje i odsouzení své manželky (dluh, který si
    prý „vymyslel insolvenční správce“) a vlastní podmínku. „Bohužel za vlády Andreje Babiše přituhuje.“
    Policie bude podle něj „v následujících měsících až letech“ brutální i v ČR, Polsku, na Slovensku
    a v Maďarsku. Rajchla „museli poslat, aby to zničil“ a „rozdělil lidi, kteří by podporovali Rusko“
    (zatýkání za Z, „díky, Jindro Rajchle“). Policisty vyzývá: „Vy byste se měli postavit proti režimu,
    který je proti lidem.“ Vadí mu, že o jeho shromáždění 3. 10. „ani jedno médium nenapsalo“, zatímco
    ruskojazyčná RTVi s ním natočila rozhovor o trojvýzvě (bez jaderné dohody, mírový vyjednavač, konec
    dodávek zbraní).'
  osoby:
  - osoba: rajchl
    vztah: negativni
