  podtema: Trestání politického projevu
- id: vrabel-2026-10-04-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**4. 10.** — Po shromáždění 3. 10. Vrabel uvádí, že výzvu proti jaderné dohodě podepsalo přes
    300 lidí (další to kvůli zatýkání nestihli) a hnutí je „minimálně silnější" než Stačilo! a strany,
    které na Malostranském náměstí demonstrovaly před měsícem; řada lidí (i ze SPD) podle něj nepřišla
    ze strachu, že je před volbami uvidí „s Vrabelem". Chce brzy další demonstraci s „alespoň deseti tisíci
    lidí".'
- id: vrabel-2026-10-04-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: „Národ je mentálně poškozený" — 99 % Čechů „v lobotomii"; strach v publiku; Radiožurnál jako
    placená propaganda (Vrabel, 4. 10. 2026)
  text: 'Vrabel tvrdí, že na Čechy se neútočí fyzicky, ale mentálně: čtyři a půl roku válečné propagandy
    a zákazu ruských médií poškodilo „všechny, směrem k nacismu" — 99 % národa podle něj žije v „lobotomii"
    a chodí „jako zombie", zdraví zůstali jen jeho diváci, „určitě ne lidi z dalších politických stran,
    které schvalují udávání za písmeno Z"; ptá se, zda „nám sypou něco do mraků nebo do vody". Na demonstraci
    podle něj publikum nereagovalo na politicky nekorektní vtipy — „časová prodleva mezi tím, kdy se něco
    řekne, a reakcí, to je strach", a to i u jeho nejbližších přátel. Nedělní pořad zahraničních zpravodajů
    Radiožurnálu (festival „České sny" ve Lvově, zmrzlina, chili con carne) označuje za propagandu, za
    niž účinkující dostávají „sto, dvě stě tisíc" — „my si sami platíme propagandu" —, zatímco o demonstraci
    proti jaderným zbraním nepadlo ani slovo.'
  citace:
  - text: Ten národ je mentálně poškozený. Všichni.
  podtema: Nová alternativní média
- id: vrabel-2026-10-04-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: „už jediné, k čemu může dojít, je občanská válka"; ČR má ještě šanci „pomoct" 2 milionům
    Ukrajinců vrátit se (Vrabel, 26. 9. 2026)'
  text: '**4. 10.** — Po návštěvě Prahy Vrabel tvrdí, že se Praha stává „česko-ukrajinským městem" (ze
    tří taxikářů byl „hrozný" jen Ukrajinec) a že se naplňuje jeho výrok o „České Ukrajině" z roku 2022:
    v ČR bude „dva miliony Ukrajinců, možná přijde pět", budou Čechům „dělat šéfy" a založí si politickou
    stranu, protože „Češi jsou submisivní". Na Ukrajině podle něj ubylo obyvatel z 51 na „možná 18 milionů"
    a plánuje se jejich náhrada migranty („prvních 900 000, plán asi na 8 milionů") — ptá se, co čeká
    „zbytek Slovanů v Evropě".'
- id: vrabel-2026-10-04-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Spor s Vrabelem: demonstrace 3. 9. 2022 a rozpad jednoty hnutí (Rajchl, 27. 9. 2026)'
  text: '**4. 10. (Vrabel)** — Vrabel opakuje, že Rajchl a Vacek „v roce 2023" nalákali lidi na blokádu
    Úřadu vlády „dokud vláda neustoupí", pak „si zatančili, jede jede mašinka" a šli domů, a mezitím vyrobili
    strach, že za „Z" či nášivku Wagnerovců půjdou lidé k soudu. Nabídku Aleše Svobody k usmíření („co
    jsme si, to jsme si") odmítá — Svoboda podle něj „ublížil mně, našim lidem, našemu hnutí" a podrazil
    ho „velmi brutálním způsobem"; výzvy „musíme se všichni spojovat" považuje za pokrytectví. Na dotační
    kauzu ani na nálepku „kolaboranti" od Černohorského nereaguje.'
  osoby:
  - osoba: ales-svoboda
    vztah: negativni
    kontext: Nabídl smír, Vrabel odmítá — „podrazil mě"
  podtema: Politická kultura
- id: vrabel-2026-10-04-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa jako „zrada národa" a „ani koruna na Ukrajinu" jako podvod — „posílá se víc
    než za Fialy" (Vrabel, 27. 9. 2026)
  text: '**4. 10.** — Vrabel zrádu ilustruje podobenstvím o indiánském kmeni, jehož „náčelník ze Slovenska"
    (Babiš) podvedl lid kvůli byznysu s „americkými kmeny" a dohodl se s „náčelníkem z Francie" na jaderných
    zbraních — „spravedlivý kmen" by ho podle Vrabela přivázal ke kůlu a mučil (viz [Stochastický teror](/stochasticky-teror.md)).'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-10-04-07
  typ: stoch-teror
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Andrej Babiš
  text: podrobná fantazie o mučení a popravě jmenovaného premiéra jako trestu … za zradu (muniční iniciativa,
    jaderné zbraně)
  citace:
  - text: No ten indiánskej kmen by šel, přivázal by ho ke kůlu a začal by na něm trénovat mladý hochy,
      jak střílí z luku. Jo, normálně nejdřív do stehna, do lýtka, pak do rukou [...] stáhli by mu kůži
      někde [...] tak by začali trénovat hod oštěpem.
  - text: spravedlivého kmene
  teror:
    terc: Andrej Babiš
    hranicni: false
