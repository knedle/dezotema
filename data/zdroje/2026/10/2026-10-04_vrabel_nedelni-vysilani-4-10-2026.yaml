vyroky:
- id: vrabel-2026-10-04-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**4. 10.** — Vrabel zvažuje, že si sám začne nosit „Z" jako podporu lidí stíhaných za názor (Hrdlička,
    Blahníková), ačkoli dřív ne, protože „není fanouškem války"; se „částí" ruské speciální vojenské operace
    — ochranou ruskojazyčných před „neonacisty páchajícími genocidu" — podle svých slov souhlasí. Argumentuje,
    že válečné zločiny ani genocidu na Ukrajině žádný příslušný mezinárodní tribunál neodsoudil, takže
    chybí, co by bylo možné „schvalovat"; Rajchl a Vacek podle něj „nejsou takoví idioti" a výklad „Z"
    jako schvalování zločinů vytvořili „na zakázku režimu". Odpovědnost za represe nese podle něj Babiš
    a Metnar, ne major Kolář („poslušný fízl"). Popisuje, jak se policisté vysmívali důchodcům a jeden
    mířil pistolí na Lucku Zajícovou; srbský přítel prý řekl, že v Srbsku by takoví policisté „skončili
    v krvi" — jako v Bělehradě, kde lidé při covidovém lockdownu vtrhli do parlamentu a Vučić lockdown
    po dvou dnech zrušil. Pokud by režim zavíral lidi za upozorňování na nespravedlnost, „nemá právo existovat,
    má padnout, a lidi mají právo postavit se na odpor"; soudci, kteří „odsuzují lidi neprávem, by měli
    být všichni potrestáni".'
  citace:
  - text: Tak ten režim nemá právo existovat. Tak ten režim má padnout. A lidi mají právo se postavit
      na odpor.
  osoby:
  - osoba: andrej-babis
