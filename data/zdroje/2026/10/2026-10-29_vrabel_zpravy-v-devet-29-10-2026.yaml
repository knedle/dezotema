- id: vrabel-2026-10-29-07
  typ: predikce
  temata:
  - suverenita-eu
  nadpis: Rusko použije jaderné zbraně, až bude prohrávat (9:1)
  text: Rusko sáhne po jaderných zbraních, až začne prohrávat válku s Evropou, a okamžitě, kdyby je použila
    Evropa; válka Evropy s Ruskem je „na 99 %“ (opakuje).
  citace:
  - text: Tak sázím devět ku jedné, že použijou jadernou zbraň. A kdyby náhodou Evropa použila nějakou
      jadernou zbraň, tak ji použijou okamžitě.
  predikce:
    horizont: neurčeno
    stav: ceka
