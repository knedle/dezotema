    vztah: pozitivni
    kontext: Spolu rozebrali „17 důvodů, proč to není Tomáš Čermák“
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-12-05
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Facebook zablokoval živé vysílání ČsTV2 — „kyberšikana" kvůli fotce z UFC (Zítko, 17. 6. 2026)
  text: '**12. 10.** — Místo konání setkání ve Frýdku-Místku (10. 10.) oznámili až v pátek 9. 10. v 15:00
    „z hlediska bezpečnosti“. Nechtěli prý dopadnout jako „vládní poslanec“ Rajchl, kterému v Havířově
    po „množství nepřejících telefonátů“ zrušili sál. Akci podle zápisů sledovalo 71 lidí; „kvalita převážila
    kvantitu“. Připomíná, že 13. 10. slaví šest let vysílání na Facebooku, který mu minulý týden zablokoval
    všechny čtyři kanály.'
  osoby:
  - osoba: rajchl
    vztah: neutralni
    kontext: „Vládní poslanec“, kterému v Havířově zrušili sál — důvod utajení místa akce
  podtema: ČT poplatky a omezování na sociálních sítích
