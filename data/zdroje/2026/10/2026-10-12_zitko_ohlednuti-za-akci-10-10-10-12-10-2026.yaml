  nadpis: Studie „očkované vs. neočkované děti" — nemocnější ve 22 kategoriích (Zítko, 16. 7. 2026)
  text: '**12. 10.** — Na setkání ve Frýdku-Místku zazněl blok o tom, jak bránit děti a vnoučata „před
    tlakem na zaočkování většinou koktejlem jedů v injekcích“, které jim „píchají tak, aby mohly navštěvovat
    třeba školku“. Návod je podle Zítka zveřejněný na Galerii pravdy (Pavel Přib).'
  podtema: „Pfizergate" a rod von der Leyenových (Zítko, 16. 7. 2026)
- id: zitko-2026-10-12-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Trestní oznámení na chemtrails a sítě 5G/6G/7G jako nástroj genocidy (Zítko, 7. 8. a 26.–27.
    8. 2026)
  text: '**12. 10.** — Na setkání ve Frýdku-Místku přednášel o chemtrails, HAARP a sítích 5G jako „použití
    počasí jako zbraně proti lidem“ Kamil z Prešova. Zítko ho vítá jako zástupce „velmi potěšitelné generace“
    dvacátníků až třicátníků, „kteří si uvědomují, že s rozdělením a s vlastizradou okolo rozdělení Československa
    nebylo něco v pořádku“. Jeho rodiče byli se Zítkem na demonstraci v Bratislavě v roce 2020.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-12-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**12. 10.** — V ohlédnutí za setkáním ve Frýdku-Místku Zítko uvádí, že „údajný“ Čermák i přes
    pozvánku se vším zaplaceným nedorazil, přestože o ní podle komentářů věděl. Na závěr akce prý Zítko
    s Jiřím Hradilem rozebrali „minimálně sedmnáct důvodů, proč to není Tomáš Čermák“: „těch věcí, který
    jsou brutálně divný, byla celá spousta“.'
  osoby:
