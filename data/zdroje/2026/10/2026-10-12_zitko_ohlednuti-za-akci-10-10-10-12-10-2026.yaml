  nadpis: 'Zítkovo odvolání: Krajský soud v Ústí n. L. odmítl důkazy jako „nebylo v televizi" (2. 7. 2026)'
  text: '**12. 10.** — Zítko rekapituluje „výročí“ svých kauz. 10. 10. uplynuly tři roky od „zakleknutí“
    u Postoloprt, kde byl obviněn „ze zpronevěry nebo něco“ (věc byla odložena). 11. 10. uplynuly dva
    roky od propuštění z vězení, kde byl „protiprávně uvězněn“ za údajné šíření poplašné zprávy, „což
    byla pravda o sračkách v injekcích COVID-19“; krajský soud věc vrátil do Chomutova. 12. 10. mu NCTEKK
    po roce a osmi měsících vrátila telefony zabavené při zásahu „samopalníků“ 3. 2. 2025.'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: zitko-2026-10-12-02
