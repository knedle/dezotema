  titul: Zprávy v devět 27. 10. 2026
  datum: 2026-10-27
  url: https://www.facebook.com/100087923704145/videos/4612807472375860
  prepis: prepisy/done/2026-10-27_Ladislav-Vrabel_27-10-2026-Zprávy-v-devět-s-komentářem.txt
  rezim: vrabel
  poznamka: 1 h 37 min, zprávy čte Zuzana; krátký srbský klip (28:14–29:06) nezpracován.
  osoby:
  - osoba: studentske-hnuti
    vztah: pozitivni
    kontext: „Možná bude dobré“, nenásilná revoluce podle jeho plánu (posun od skepse)
  - osoba: vladimir-putin
    vztah: pozitivni
    kontext: Vždy klidný, má „vnitřní sílu“
  - osoba: j-d-vance
    vztah: negativni
    kontext: „Herec“ vyrobený a zaplacený
  prehled:
  - tema: Babiš přijal Fica, asi 20 demonstrantů
    text: demonstranti jsou „zmatení“; obnova Československa by musela vzejít od Slováků.
  - tema: Pavel vyzval diplomaty k tlaku na Rusko
    text: „orwellovský“ mír válkou; k míru vedou jen dohody o odzbrojení (opakuje).
  - tema: Stubb a Støre volali Putinovi
    text: volali oni jemu; Putin bude s Evropou jednat „za ruských podmínek“, zástupce EU v Abú Zabí jen
      „pozoruje“, což je „ostuda“.
  - tema: Izraelské volby, účast 74 %
    text: čeká, že voliči „Satanjahua“ „vypískají“ (opakuje) → viz [Predikce](../predikce.md)
  - tema: Vláda chce zakotvit korunu do ústavy
    text: „padělek“; podle čl. 10 Ústavy má přednost smlouva s EU, korunu uhájí jen vystoupení z EU
    vyrok: vrabel-2026-10-27-05
  - tema: Okamura pro zrušení ČT a ČRo, ministři SPD proti zápočtu let Ukrajincům
    text: „hezká prohlášení“, SPD 13 let falešnou opozicí (opakuje).
  - tema: Fialova vs. Babišova vláda
    text: Fialova „nás terorizovala, ale upřímně“, současná lže (opakuje).
  - tema: Studentská vláda v Srbsku nezavede sankce proti Rusku
    text: „možná bude dobrá“, studenti provedli „nenásilnou revoluci, to, co my jsme chtěli“; Vučić uznal
      porážku, „takhle to má být“
    vyrok: vrabel-2026-10-27-04
  - tema: Protesty v Evropě
    text: jádrem jsou studenti proti válce, přidala se Antifa, propalestinské skupiny a muslimové (opakuje).
  - tema: Německé KSK trénuje dlouhé operace v mrazu
    text: „Stalingrad“; po třech týdnech „uvolnění“ přijde vystřízlivění, Rusové chtějí být do března
      v Kyjevě, konflikt s Evropou bude dlouhý a vleklý (opakuje).
  - tema: 'Putin: Nord Stream byl teroristický útok'
    text: říká to „od roku 2022 z Václaváku“, Rajchl si to „trapně“ přivlastňuje (opakuje).
  - tema: Lula porazil Bolsonara, Bolsonaro hledaný policií
    text: politika je „mafiánský systém“, který likviduje opozici (Magyar, Trump, Čapí hnízdo, jeho manželka)
    vyrok: vrabel-2026-10-27-02
  - tema: Ukrajinští lékaři odmítají rusky mluvící pacienty
    text: ČR je „taky nacistická“; Zeman by měl za výrok o „genech“ do vězení či uklízet ulice v oranžovém
      mundúru, křiklouni na Fica do vězení → viz [Stochastický teror](../stochasticky-teror.md)
  - tema: Útok na Vrabela na demonstraci (2023)
    text: „teroristický akt“, policie útočníkovi pomohla utéct, „za to by měly padat hlavy“ (opakuje).
  - tema: Německo kupuje ukrajinské střely Bars
    text: „absolutní rabování“, platíme to my (opakuje).
  - tema: Rekordní zájem firem o Filipínce, kvóty pro Indii
    text: s uprchlíky z islámských zemí od ledna ČR „za pět let nikdo nepozná“ → viz [Predikce](../predikce.md)
  - tema: Nizozemsko ruší 16 % míst ve státní správě kvůli AI
    text: nezaměstnanost se „dělá schválně“, aby lidé šli do armády; nutný nepodmíněný příjem a vyšší
      daně firmám s AI
    vyrok: vrabel-2026-10-27-01
  - tema: Volný trh, „jsem absolutní levičák“
    text: k trhu „velmi pravicový“, jinak „absolutní komunista“; levice a pravice neexistují, USA jsou
      „klasičtí opresoři“
    vyrok: vrabel-2026-10-27-03
  - tema: Lidé od Muska pronikli do systémů Anthropicu (řízený test)
    text: nic není neprolomitelné, kvantové počítače prolomí zabezpečení „v řádu sekund“.
  - tema: Ropná skvrna u SAE
    text: ironie na Green Deal (papírová brčka vs. ropná skvrna).
  - tema: Vance o „malých diktátorech“
    text: Vance je „herec“; Putin, Trump i Babiš mají „vnitřní sílu“, Zelenskyj a Okamura ne.
  - tema: 'Trump: válku s Íránem nezačaly USA'
    text: „čisté lži“, Írán je oběť (opakuje).
  - tema: Nová SZP po roce 2027
    text: EU věci vždy zkomplikuje.
  - tema: Rumunsko, Georgescu, Brazílie
    text: EU neuznává jen ruské volby (opakuje).
vyroky:
- id: vrabel-2026-10-27-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Nizozemsko nahrazuje 16 % úředníků AI — nezaměstnanost se „dělá schválně“ před válkou, nutný
    nepodmíněný příjem (Vrabel, 27. 10. 2026)
  text: 'Ke zprávě, že Nizozemsko kvůli AI ruší 25 tisíc míst ve státní správě, Vrabel tvrdí, že války
    nevznikají kvůli nezaměstnanosti, ale naopak: deindustrializace a likvidace národních hospodářství
    se podle něj dělají záměrně, aby lidé bez peněz byli ochotni jít do armády. Globalisté podle něj mají
    dlouhodobé plány (Agenda 2030 a 2050) a covid, války i zelená tranzice jsou jejich naplněním, kdežto
    „my žádné“. Bez „změny systému“ (zdanění finančních převodů, nepodmíněný příjem, vyšší daně pro firmy
    nahrazující lidi AI) se podle něj při nezaměstnanosti „mnohem větší než 50+“ zhroutí sociální systém
    a lidé „umřou hladem“. Současné politiky označuje za „bandu imbecilů“.'
  citace:
  - text: Ne, ta vysoká nezaměstnanost se dělá schválně, deindustrializace, likvidace národních hospodářství,
      proto, aby lidi byli ochotní do války, protože budou potřebovat nějaké peníze.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-27-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Brazílie: soud prodloužil volby o dvě hodiny, „aby vyhrál Lula“ — jako Georgescu v Rumunsku;
    „satanismus a absolutní lži“ (Vrabel, 26. 10. 2026)'
  text: '**27. 10.** — K odebrání pasu a pátrání policie po Flávio Bolsonarovi Vrabel tvrdí, že politika
    je dnes „mafiánský systém“, v němž strana u moci likviduje opozici. Totéž vidí u Magyara a Orbána,
    u soudů s Trumpem, u Čapího hnízda i u „organizovaného zločinu“ proti své manželce. Za vzor férového
    chování dává Vučićovo uznání porážky.'
  citace:
  - text: My jsme se dostali do systému politického, který je mafiánský. Tady, když někdo má jiný politický
      názor, tak ho ta druhá strana, pakliže má moc, likviduje.
  osoby:
  - osoba: flavio-bolsonaro
    vztah: pozitivni
    kontext: „Ve skutečnosti měl být prezident“, oběť podvodu
  podtema: Politická kultura
- id: vrabel-2026-10-27-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Jsem absolutní levičák“ — levice a pravice už neexistují, USA jako „klasičtí opresoři“ (Vrabel,
    27. 10. 2026)
  text: 'Vrabel prohlašuje, že je ve vztahu k trhu „velmi pravicový“: odmítá dotace a státem určené ceny
    a firmy by si podle něj měly shánět pracovníky v ČR. Zároveň o sobě říká, že je „absolutní levičák“
    či „absolutní komunista“, protože odmítá současný „kapitalistický, elitářský“ systém. Rozdělení na
    levici a pravici podle něj zaniklo a zůstal jen střet globalistických elit s obyčejnými lidmi. V tom
    souhlasí s levicovými aktivisty (Antifa, Josef Kupčík), že USA jsou „klasičtí opresoři“: připomíná
    vyhlazení Indiánů, otroctví, atomovou bombu, napalm a výměny vlád v „78 zemích“. Za oběť napadení
    USA označuje i Írán.'
  citace:
  - text: Dneska jediné, co existuje, jsou elity globalistické, které okrádají lidi, anebo boj o práva
      nás, obyčejných lidí, a o naší zem.
  osoby:
  - osoba: josef-kupcik
    vztah: rozporuplny
    kontext: „Super kluk“ a „kovaný komunista“, neměl pouštět čs. hymnu; souhlasí s ním, že USA jsou opresoři
  podtema: Politická kultura
- id: vrabel-2026-10-27-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Srbské volby: vítězství studentů — od „barevné revoluce“ k „pronárodnímu“ hnutí (Vrabel, od
    25. 10. 2026)'
  text: '**27. 10.** — Vrabel připouští, že protesty byly „vyprovokované“ západními globalisty přes srbskou
    CNN (N1). Představitelé hnutí ale podle něj odmítají sankce proti Rusku, chtějí vojenskou neutralitu
    a trvají na tom, že Kosovo je srbské. Otevřeně proevropské strany prý dostaly 0,3 %. Studenti podle
    něj dokázali „nenásilnou revoluci“, kterou chtěl on: postupovali podle stejných tří pilířů jako jeho
    plán „ČR na 1. místě“ (spojit lidi, připravit změnu systému, dostat lidi do vlády). Vučićovo uznání
    porážky dává za vzor: „takhle to má být“.'
  citace:
  - text: Oni skutečně udělali nenásilnou revoluci, to, co my jsme chtěli.
  podtema: Česká suverenita
- id: vrabel-2026-10-27-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Koruna v ústavě jako „padělek“ — čl. 10 Ústavy dává přednost smlouvám s EU, jediná cesta je
    vystoupení (Vrabel, 27. 10. 2026)
  text: 'Vrabel tvrdí, že vládní návrh zakotvit korunu do ústavy nemá žádný význam, dokud ČR zůstane v
    EU. Podle čl. 10 Ústavy má ratifikovaná mezinárodní smlouva přednost před českým právem, takže by
    v případném sporu o euro rozhodl Evropský soud ve prospěch EU. Totéž podle něj platí pro migrační
    pakt. Členství v EU přirovnává k manželské smlouvě: povinnosti nejde odmítnout a zůstat v ní, svobodu
    dává jen odchod. Vláda podle něj ústavní většinu nemá, Senát návrh shodí a jde jen o prohlášení k
    odvedení pozornosti, které v lidech budí falešnou naději („mrtvé nenarozené dítě“). Návrh přirovnává
    k padělku trička koupenému na hranici.'
  citace:
  - text: Jediná možnost, jak si zachovat placení korunou, je vystoupit z Evropské unie.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-10-27-06
  typ: predikce
  temata:
  - konspirace
  nadpis: ČR „za pět let nikdo nepozná“
  text: S tempem příchodu cizinců a s uprchlíky z islámských zemí od ledna 2027 se ČR během pěti let k
    nepoznání promění.
  citace:
  - text: A do toho začnou k nám vozit od ledna uprchlíky z islámských zemí, no tak to teprve uvidíte,
      jak se začne proměňovat Česká republika. Za pět let ji nikdo nepozná.
  predikce:
    horizont: '2031'
    stav: ceka
- id: vrabel-2026-10-27-07
  typ: predikce
  temata:
  - politicky-system
  nadpis: Netanjahu izraelské volby prohraje
  text: Izraelští voliči „Satanjahua“ „vypískají ven“ (s výhradou „můžu se plést“).
  citace:
  - text: Typu, že to lidi tomu Benjaminovi, Satanjahuovi, spočítají a že ho vypískají ven, ale můžu se
      plést.
  predikce:
    horizont: výsledek voleb 27.–28. 10. 2026
    stav: castecne
    vyhodnoceni:
    - datum: 2026-11-20
      text: Netanjahuův blok ve volbách 27. 10. ztratil většinu (53 mandátů proti 48 opozice), zůstal
        ale největším blokem a výsledkem je patová situace, ne jasná porážka
      stav: castecne
    - datum: 2026-11-20
      text: Podle Al Jazeery (1. 11. 2026) nemá žádný blok většinu a jednání o vládě pokračují.
- id: vrabel-2026-10-27-08
  typ: stoch-teror
  temata:
  - suverenita-eu
  nadpis: Miloš Zeman
  text: 'Terč: Miloš Zeman.'
  citace:
  - text: Miloš Zeman, který řekl, že Rusko je agresor nebo agresivní, že to mají v genech, by měli do
      vězení. Já nejsem proto, aby lidi chodili do vězení, tak bych mu dal náhradní trest, oblíknul bych
      ho do oranžového munduru a nechal bych ho tam o opilce, ať prostě uklízí ulice.
  osoby:
  - osoba: milos-zeman
    vztah: negativni
    kontext: Za výrok o „agresivitě v genech“ by měl do vězení či uklízet ulice v oranžovém mundúru
  teror:
    terc: Miloš Zeman
    hranicni: false
- id: vrabel-2026-10-27-09
  typ: stoch-teror
  temata:
  - suverenita-eu
  nadpis: demonstranti proti Ficovi v Praze
  text: 'Terč: demonstranti proti Ficovi v Praze.'
  citace:
