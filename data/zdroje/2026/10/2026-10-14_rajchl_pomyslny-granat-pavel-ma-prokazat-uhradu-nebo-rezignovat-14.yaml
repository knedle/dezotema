  nadpis: '„Cestovní agentura Petra Pavla“: let do Maroka jako klientelismus; Eva Pavlová jako „soukromá
    osoba“ nemá dostávat 106 tisíc (Rajchl, 11. 10. 2026)'
  text: '**14. 10.** — Rajchl tvrdí, že návrhem „odpálil pomyslný granát“, který „spustil lavinu hysterických
    názorů všech možných libtardů a nohsledů Petra Pavla“. Náklady cesty odhaduje „v řádech milionů korun“
    a ptá se, zda je zaplatil Pavel sám, Orlen, „v jehož reklamním spotu figuroval“, nebo „někdo jiný,
    kdo si chtěl získat jeho náklonnost“. U něj jako „pouhého místopředsedy výboru pro obranu“ by už „stála
    fronta novinářů“, u Pavla je „ticho po pěšině“. Na Západě podle něj odchází každý, na kom ulpí byť
    jen podezření na quid pro quo („pay for play“), jako Wulff. Pavel by proto měl „jasně prokázat, že
    to byl on, kdo hradil náklady… anebo následovat cestu německého prezidenta a rezignovat“.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Má prokázat, kdo platil lety do Maroka (Orlen?), „anebo rezignovat“
