  nadpis: 'Polsko: „ústavní puč“ Tuskovy vlády jako boj EU o polskou suverenitu (Vrabel, 31. 10. 2026)'
  text: '**31. 10. (večerní zprávy)** — Vrabel dodává, že akce byla připravena den předem (rozkaz ozbrojené
    policii) a „probruselské klice“ jde o kontrolu nad Ústavním soudem, který „nakonec rozhoduje volby“.
    Hrozí podle něj zfalšování voleb a výměna prezidenta Nawrockého, který jako vrchní velitel nemusí
    chtít poslat vojáky do války s Ruskem. Jako paralely uvádí ČR (ÚS nechal kandidovat nepřiznané koalice),
    Rumunsko (Georgescu) a Brazílii. ČR je podle něj „už převrácená“: vláda, Hrad i ÚS stojí na straně
    NATO a EU. Za převratem v Polsku vidí britskou tajnou službu. Kaczyńského řeči o vystoupení z EU jsou
    podle něj jen slova, jedinou suverenistickou silou zůstává Konfederacja Korony Polskiej.'
  citace:
  - text: U nás už není potřeba převracet žádnou politickou sílu. U nás je politická síla už převrácená.
  podtema: Česká suverenita
