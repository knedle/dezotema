  nadpis: '„Cestovní agentura Petra Pavla“: let do Maroka jako klientelismus; Eva Pavlová jako „soukromá
    osoba“ nemá dostávat 106 tisíc (Rajchl, 11. 10. 2026)'
  text: '**15. 10.** — V debatě na CNN Prima News Rajchl tvrdí, že Pavlova neúčast u voleb nebyla „chyba
    v kalendáři“, ale „naprosto jednoznačný úmysl“, protože termín voleb byl ze zákona znám dva roky.
    Pavlova slova v Černoučku, že toho lituje, označuje za „damage control“: „Prezident republiky nemůže
    dát přednost soukromé dovolené před volbami.“ Podle něj jde o druhý případ, kdy se hlava státu „nedopatřením
    ocitla v reklamní kampani“: poprvé s bundami Alpine Pro, teď s klipem pro Orlen z rallye. Čtyři lety
    stály „miliony korun“. Kromě Wulffa připomíná Stanislava Grosse, který odstoupil z funkce premiéra,
    když „nebyl schopen vysvětlit původ jednoho milionu“.'
