vyroky:
- id: vrabel-2026-10-28-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Británie: za příspěvky o islámu už ne „hate speech“, ale terorismus — případ Ryana Williamse
    (Vrabel, 28. 10. 2026)'
  text: 'Ke zprávě, že britský facebookový tvůrce Ryan Williams byl zadržen pro podezření z terorismu,
    Vrabel tvrdí, že Británie přešla „na novou úroveň“. Za výroky, že jen jedna kultura lije ženám kyselinu
    do obličeje a že Mohamed byl pedofil, prý už nehrozí stíhání za nenávistné projevy, ale za terorismus
    s tresty až 20 let (zmiňuje Čermákových 5,5 roku). S obsahem výroků se ztotožňuje: Mohamed byl podle
    něj pedofil a jde o „historický fakt“, který prý nezpochybňuje žádný imám.'
  citace:
  - text: A to, co řekl, je věc, kterou říkám taky. Někdo, kdo si vezme za ženu šestiletou holčičku a
      sexuálně ji konzumuje v jejích devíti letech, pro mě je taky pedofil.
  osoby:
  - osoba: ryan-williams
    vztah: pozitivni
    kontext: „Sympatický kluk“, s jeho výroky o islámu souhlasí
  podtema: Trestání politického projevu
- id: vrabel-2026-10-28-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Přistání na Měsíci zpochybněno, plochá Země „v šedé zóně“ (Vrabel, 28. 10. 2026)
  text: 'S odkazem na scénu ze seriálu Fargo a na Stanleyho Kubricka Vrabel naznačuje, že přistání Američanů
    na Měsíci bylo zinscenované. Ironicky dodává, že kdyby tam byli, „lítají tam dnes běžně“, a žádá diváky,
    ať napíšou, kdo tomu věří. Poprvé se veřejně vyjadřuje i k ploché Zemi: argumenty jednoho známého
    ho přiměly odložit jistotu o kulaté Zemi „do šedé zóny“. Uvádí zakřivení, upravené fotky NASA, rybí
    oko, staré mapy a vzdálenost New York–Sydney. Sám se kloní ke kulaté Zemi, protože gravitace „spojuje
    hmotu do koule“, ale „ruku do ohně nedá“.'
  citace:
  - text: Prostě těch argumentů je spousta, takže jistý si tím, že by Země byla kulatá, rozhodně nejsem.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-28-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Srbské volby: vítězství studentů — od „barevné revoluce“ k „pronárodnímu“ hnutí (Vrabel, od
    25. 10. 2026)'
  text: '**28. 10.** — Srbsko je podle Vrabela jediné místo, kde se nenásilnou revolucí „opravdu změnil
    režim“: protesty sice rozpoutali globalisté přes CNN, ale lidé tři roky protestovali se srbskými vlajkami
    a vyhráli volby, „přesně jak jsem si to představoval“. Za kandidáty sám neručí. Kontrastem je ČR:
    po pěti letech nenásilné revoluce předseda koaliční strany Libor Vondráček (Svobodní) sbírá podpisy
    pod otevřený dopis von der Leyenové, místo aby vyjednal suverenitu. „Gratuluju všem vlastencům, kteří
    volili SPD v roce 25.“ Sankce proti Rusku podle něj Srbové nedají, kdo by je navrhl, toho „lidi roztrhají“.'
  citace:
  - text: Takže to je jediný, kde se zatím podařilo jako tím bojem proti těm elitám, nenásilnou revolucí,
      opravdu změnit režim.
  osoby:
  - osoba: libor-vondracek
    vztah: negativni
    kontext: Sbírá podpisy pod dopis von der Leyenové místo vyjednání suverenity
  - osoba: ursula-von-der-leyenova
