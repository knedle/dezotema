  text: Srbsko sankce proti Rusku nezavede; kdyby je nová vláda navrhla, budou ulice znovu plné.
  citace:
  - text: Kdyby někdo z nich přišel s takovým nápadem, jakože by Srbsko mělo dát Rusku sankce, no tak
