vyroky:
- id: vrabel-2026-10-10-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: EU ekonomika vybudována na levném ruském plynu — vzdáváme se jí dobrovolně (Vrabel, 18. 5. 2026)
  text: '**10. 10.** — K Trumpovu poděkování Putinovi za dodávky ruské ropy Vrabel tvrdí, že Evropa je
    „za největší hlupáky“. Zatímco EU zakazuje ruskou ropu a plyn a von der Leyenová podepsala s USA nákup
    energií za 800 mld. €, „Američani otevřeně nakupují od Rusů a my přiznaně od Američanů“, čtyřikrát
    dráž a s neekologickou dopravou LNG tankery. Zároveň evropské zboží platí v USA clo, americké v EU
    ne. Jediné vysvětlení, které mu „při sledování peněz vychází“, je korupce: přirovnává to k „Pepíkovi“,
    který přeprodává „Karlova“ vajíčka za čtyřnásobek a nákupčímu „dá z toho deset korun“. Politiky podle
    něj někdo „zaplatil“ a „diverzifikace rizik“ je zástěrka. Kritizuje to od roku 2015, kdy s tím podle
    něj začali komunisté, přes všechny vlády. Varuje, že Američané teď chtějí koupit i Nord Stream, takže
    budeme „ruský plyn z vlastních trubek přeplácet Američanům“.'
  podtema: Energetika a Rusko
- id: vrabel-2026-10-10-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: Vrabel vysvětluje svůj výrok z 9. 10., aby „někdo neřekl, že schvaluje válečné zločiny“. Podle
    něj „všichni víme“ z ČT, Rozhlasu i iDNES, že Ukrajinci od roku 2014 „vraždili a vraždí Rusy, kteří
    žijí na Ukrajině“. ČR se tehdy připojila k Minským dohodám, tedy k „ruským snahám, aby Rusové nebyli
    vražděni“. V roce 2021 měl Západ vyslyšet ruskou žádost o jednání a záruky a společně s Ruskem tlačit
    na Ukrajinu, případně přes Radu bezpečnosti OSN rozhodnout o intervenci. Když to nikdo neudělal, Rusové
    „šli ty lidi zachránit“ a lidé na Donbasu se v referendu rozhodli pro Rusko. „Z lidského, morálního
    i zákonného hlediska jsme se měli přidat na ruskou stranu“, také proti rozšiřování NATO a hrozbě jaderných
    zbraní na ruských hranicích. Politici podle něj místo toho dali přednost „obchodním zájmům globalistů“
    a překupování energií přes USA, „pravděpodobně za obrovské úplatky“. Válku podle něj „rozpoutali Američani“
    (CIA, cvičení, výcvik, Zelenskyj). Kritizuje Turka („Putin krysa“), Rajchla (od Václaváku „udávání“
    za „Z“), Zemana (vyznamenal Zelenského) i Babiše. Připomíná, že Putina považuje za „jednoho z nejlepších
    politiků na světě“ a že kvůli tomu na něj lidé na ulici plivou a polévají ho barvou.
  citace:
  - text: Mentálně jsme se měli snažit o to, aby se nevraždili lidi na Ukrajině, a politicky a diplomaticky
      jsme se měli snažit o to, aby se nerozehrávala ta válka.
