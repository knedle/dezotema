  poznamka: '1 h 11 min (vysílání od 3:00), zprávy čte Zuzana, Vrabel vysílá ze studia v Bělehradě; krátké
    sdílené klipy: Jana Bobošíková o Babišově ukrajinské klinice, Vackova tisková konference PRO z roku
    2023, Rajchlova TK k novele trestního zákoníku (20. 10.) a Witkoff u Putina; na konci soutěž o plakáty
    na pochod 17. 11.'
vyroky:
- id: vrabel-2026-10-21-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Koaliční shoda na úpravě § 405: trestat jen podněcování k násilí a nenávisti, ne „odchylný
    názor“ (Rajchl, 20. 10. 2026)'
  text: '**⚡ Konflikt — Vrabel (21. 10.)** — Vrabel Rajchlovo oznámení označuje za otočení „kabátku“:
    Rajchl je podle něj „velmi rychle proměnný objekt“, který se svým „pohůnkem“, místopředsedou PRO Vackem,
    v roce 2023 trestnost písmene Z „vymyslel“ — po demonstraci „Česko proti bídě“ podali trestní oznámení
    podle § 405 (Vrabel pouští Vackovo video) a od té doby jsou lidé odsuzováni (Robert Kutý a jeho bratr,
    Jakub Jašek, Katka Blahníková). K Rajchlově větě o absurdním trestání za odchylný názor poznamenává:
    „To je škoda, že to ten Rejchl nevěděl v tom roce 23, 24, 25.“ Novelu považuje za svůj „další zářez
    na pažbě“: Rajchl podle něj musel reagovat na Vrabelův plakát s písmenem Z k pochodu „za svobodu politického
    projevu Donalda Trumpa“, protože režim by jinak musel buď Vrabela (v podmínce) zavřít, nebo přiznat,
    že si to Rajchl vymyslel. Změna zákona je podle něj jen „obezlička“: omluvu a rehabilitaci mají dostat
    všichni zatčení a odsouzení za Z, ale i lidé stíhaní za první Babišovy a Fialovy vlády (Luboš Volný
    kvůli ivermektinu, jeho manželka), a pochod 17. listopadu bude proto i „pochodem za očištění všech
    politicky persekvovaných osob“. Rajchla v pořadu nazývá „posrancem“ a „hajzlem“ a připomíná, že v
    letech 2020–2021 žádal potrestání Babišovy vlády, ale po covidovém semináři ve Sněmovně s Janou Zwyrtek
    Hamplovou Babiše chválil jako „velkého politika“.'
  citace:
  - text: Oni se musí omluvit všem, který zatkli, musí se omluvit všem, který odsoudili a musí všechny
      rehabilitovat.
  podtema: Trestání politického projevu
- id: vrabel-2026-10-21-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Babiš jako nepřímý spolumajitel ukrajinské kliniky — „brutální střet zájmů“; banky jako obětní
    beránek (Vrabel, 21. 10. 2026)
  text: |-
    Vrabel pouští video Jany Bobošíkové, podle níž Andrej Babiš figuruje jako nepřímý skutečný majitel společnosti, která vlastní 51 % ukrajinské kliniky, a je jedním ze skutečných majitelů Hartenberg Holdingu; klinika za války více než zdvojnásobila tržby a má smlouvu s ukrajinskou státní zdravotní službou, zatímco Babiš jako premiér spolurozhoduje o vztazích s Ukrajinou. Vrabel z toho vyvozuje, že Babiš je „v brutálním střetu zájmů“: „ždímá“ české daňové poplatníky, peníze posílá přes evropský rozpočet na Ukrajinu (podle něj „60 miliard eur“) a pak z nich „těží“ přes podíly ve firmách, které dostávají státní peníze. Ujištění, že ČR za půjčku Ukrajině ručit nebude, označuje za „čistou lež“, protože ji platíme stejně jako ostatní státy. Bobošíkovou chválí jako „vynikající novinářku“ (v politice je podle něj „průšvih“). Babiš je pro něj „nenasytný“ „podvodník nejvyššího kalibru“, který si před volbami nalepil „Česko na prvním místě“ a po volbách se prohlásil za „europatriota“; po skončení války by podle něj měl vést Ukrajince zpět „s ukrajinskou vlajkou“ a „měli by si ho tam nechat“.

    Babišův záměr jednat s bankami o nižších sazbách hypoték kvůli jejich ziskům a vyzvat obce, aby ukládaly peníze u ČNB, Vrabel vykládá jako typický postup „klasického komouše“: drahé hypotéky podle něj způsobil sám schodkem rozpočtu, který zvedl sazby ČNB (to prý předpověděl „první den“), a teď ukazuje na banky, stejně jako dřív na pumpaře a v roce 2015 na hospodské. Babiš je podle něj „slibotechna na rok“ a jeho slib snižovat deficit znamená opak (viz [Predikce](predikce.md)). Připomíná, že Babiš je sedmý nejbohatší Čech a začínal s penězi, které mu podle něj „posehnal“ otec po „kamarádech komunistech“.
  citace:
  - text: Měli by ho lidi normálně pověsit na nástěnku největších lhářů, podvodníků České republice.
- id: vrabel-2026-10-21-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: |-
    **21. 10.** — K Macronovu slibu zabránit dalším nepokojům a k jeho kritice Trumpa Vrabel říká, že Trump to „pojmenoval správně“, Francie hoří kvůli migraci, ale USA mají stejný problém: podle jednoho „experta“ vznikají no-go zóny i v Detroitu. Odmítá mluvit o „ilegální migraci“: největší problémy jsou podle něj s druhou a třetí generací přistěhovalců z islámských zemí, kteří jsou francouzskými občany, a většina nových migrantů dostala razítko, že jsou legální; „ten problém je migrace“ a odlišná kultura. Lidé z Eritreje, Somálska či Rwandy podle něj vyrůstají „s mačetama v rukách“ a v Evropě vidí „slabý, vyčpělí, vycuclí Evropany“; v islámských zemích si podle něj nezakrytou ženu „vezmou“, „to prostě už mají od Mohameda“ (viz [Stochastický teror](stochasticky-teror.md)). Oslo označuje za „rape city“ s tvrzením, že v roce 2004 tam ze 4 tisíc nahlášených znásilnění nespáchal ani jedno původní obyvatel. Francouzské občany už podle něj vyhostit nelze, ČR ale může „dostat pryč Ukrajince“, kteří mají jen dočasnou ochranu: nedat jim občanství a poslat je budovat svou zemi, „klidně bych jim dal i nějaký peníze, jenom ať odjedou“; jinak s vládou, jako je Babišova, „už nikdy nebude Česká republika Česká“. Babiš podle něj „lže“, že vláda odmítla migrační pakt, který je právně závazný, a od roku 2027 sem budou jezdit lidé „se stejnou mentalitou“ jako ti, kdo podpalují Francii (opakuje z 19. 10.). Jediným řešením je od roku 2015 „vystoupit z Evropské unie a zavřít hranice“. Macrona, „který zlikvidoval Francii“, zesměšňuje transfobním „návrhem“, aby ho na pařížském stadionu před lidmi „tloukla“ jeho manželka (viz [Stochastický teror](stochasticky-teror.md)): „Prostě ty lidi se budou smažit v pekle.“

    ⚡ **Poznámka:** Údaj o 4 tisících znásilnění v Oslu v roce 2004 Vrabel nedokládá.
- id: vrabel-2026-10-21-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Suverenisté jsou postupně likvidováni — Orbán „zlikvidován“, Fico „na řadě“, Vučič jako poslední;
    Babiš má „max. 5 %“ (Vrabel, 15. 10. 2026)
  text: '**21. 10.** — K blokádám v Srbsku před nedělními volbami Vrabel z Bělehradu popisuje billboard
    studentského hnutí „volte vítězství“ přepsaný na „volte zradu“ a ptá se, kde studenti vzali peníze
    na tak velkou kampaň: „pravděpodobně z nějakých zahraničních fondů, z nějaké Evropské unie“, od někoho,
    „kdo chce dostat Srbsko pod Evropskou unii“. „Globalistické struktury“ podle něj investují „desítky
    miliard“ proti Vučićovi, aby vyprovokovaly „barevnou revoluci jako na Ukrajině“. Vučić slibuje pokračovat
    v politice bez sankcí proti Rusku, s vojenskou neutralitou a suverenitou, tedy „to všechno, co bychom
    se my měli učit od Srbska“; Vrabel doufá v jeho vítězství. Referendum o vstupu do EU, které studenti
    slibují, by podle něj neprošlo a uznat nezávislost Kosova by si nikdo netroufl, protože by se „musel
    bát, aby ho nepověsili“.'
  podtema: Česká suverenita
- id: vrabel-2026-10-21-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**21. 10.** — K Witkoffově schůzce s Putinem v Petrohradu, na níž Witkoff poděkoval za propuštění
    Američana Stephena Hubbarda a podle médií označil Putina za „humanitáře“, Vrabel poznamenává, že za
    podobné postoje v ČR Rajchl a „celý ten režim“ roky trestali a teď z toho „vybruslí“ změnou paragrafu.
    Dohodu o obnovení mírových rozhovorů (nejdříve 10. 11. v Abú Zabí) bere jako potvrzení své předpovědi
    tří týdnů „euforie“ do amerických voleb, po nichž přijdou mírová jednání, „atentát na někoho“ a „pravděpodobně…
    ta válka s Evropou“ (viz [Predikce](predikce.md), 12. a 13. 10.). K Zelenského ochotě zmrazit frontu
    (Fox News) uvádí, že Ukrajina podle Zelenského dostává od USA jen 12 Patriotů měsíčně, tedy „na 6
    raket“, zatímco Rusové jich někdy vypálí 60 za den; Ukrajina nemá vojáky („loví je na ulicích“) ani
    protivzdušnou obranu a z ČR má jen granáty a drony, „takže můžou dělat teroristické útoky na ruské
    území“. Zmrazení fronty má podle něj jen umožnit bezpečnostní záruky v podobě vojsk NATO na Ukrajině,
    o nichž Zelenskyj jednal v Oslu, a to „znamená válku s Ruskem“ (opakuje z 20. 10.). K razii protikorupčního
    úřadu NABU v ukrajinské centrální bance ironicky dodává, že o peníze českých daňových poplatníků je
    „velmi dobře postaráno“: mají je Babiš přes firmy na Ukrajině i Zelenskyj (podíl v anglické investiční
    bance, hotely, jachty, vily). Zbraně se podle něj z poloviny rozkradou a použijí „při jiných teroristických
    akcích“: „Doufám, že to nebude proti českému obyvatelstvu.“'
  citace:
  - text: Stačí jedny volby v Americe a podívejte, Putin je humanista.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-21-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**21. 10.** — K tomu, že Bundeswehr poprvé zvýšil stupeň hrozby ruských sabotáží na druhý nejvyšší,
    mimo jiné kvůli dronu s výbušninou u letecké základny Wunstorf, Vrabel (po doplnění moderátorky, že
    dron tam podle německé kriminální policie mohl ležet asi dva roky) celou věc zesměšňuje: Putin prý
    dva roky „mačká“ všechny kombinace, „aby to bouchlo“, a nakonec zjistí, že došly baterky, „to prostě
    je klasika Rusové“. Ironicky navrhuje vyhlásit „válečný stav“, protože „dva roky tady leží nějakej
    dron“; navazuje na své tvrzení z 19. 10., že hybridní hrozba „se nezvyšuje“.'
  podtema: Zahraniční aktéři a precedenty
