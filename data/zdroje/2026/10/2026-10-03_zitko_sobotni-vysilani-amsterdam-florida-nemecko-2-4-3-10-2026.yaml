  nadpis: 'Pfizer: 1223 mrtvých za 3 měsíce testování — a CDC potvrdil záporný přínos'
  text: '**3. 10.** — Zítko spojuje stejná čísla s žalobou floridského generálního prokurátora z 1. 10.
    2026 (49 stran, klamavé obchodní praktiky): 158 893 nežádoucích událostí ve 42 086 hlášeních, 1 223
    úmrtí za první tři měsíce a 52 potratů u 458 exponovaných těhotných. Cituje slovenského lékaře Michala
    Pijáka, který se podle něj „přepřáhl“. Data jsou prý uložena ve spisu u okresního soudu v Chomutově,
    kde je soudkyně Dvořáková označila za dezinformaci. Bourlu nazývá „masovým vrahem, pachatelem genocidy“.
    Odkazuje na Kennedyho: vakcíny za 60 mld. USD, léčba poškozených za 500 mld. USD, takže jde o „obchodní
    model“.'
  osoby:
  - osoba: michal-pijak
