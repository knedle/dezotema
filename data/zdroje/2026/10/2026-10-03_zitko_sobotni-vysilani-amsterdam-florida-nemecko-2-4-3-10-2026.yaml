  nadpis: Sjednocení Německa 1990 jako protiprávní; dodávky zbraní Ukrajině mohou zrušit smlouvu 2+4 (Zítko,
    3. 10. 2026)
  text: 'K výročí sjednocení Německa Zítko tvrdí, že šlo o protiprávní akt: ke Spolkové republice se podle
    něj mohly připojit jen spolkové země, které ale na východě „nebyly založeny“ (odvolává se na signatáře
    smlouvy „Rainera Dudka“). Spolková republika je podle něj dodnes „okupovaná korporace“ pod USA. Smlouvu
    2+4 uzavřely čtyři vítězné mocnosti. Pokud Německo dodává zbraně proti Rusku jako nástupci jedné z
    nich, je to podle Zítka důvod k vypovězení smlouvy, k návratu okupačních zón „a k jednání o obnově
    Československé republiky“. Odvolává se i na slovenský soud v kauze Harabin (13. 1.), který měl konstatovat,
    že „Rusko není agresor“. Popisuje také „kolonizaci“ východního Německa západními firmami po roce 1990.'
