  nadpis: „Czexit" je iluze, jedinou cestou je obnova ČSR; vítězné mocnosti budou chtít „chcimíry" (Zítko,
    3. 10. 2026)
  text: Zítko zesměšňuje představu, že by ČR mohla z EU vystoupit „protestní nótou Uršule“ jako „vlhký
    sen“ politiků. Jedinou reálnou cestou, jak „sundat smyčku“ EU, je podle něj obnova Československé
    republiky podle „stále platného“ zákona č. 11/1918, protože ČSR „nikdy nebyla členem EU ani NATO“.
    Rozhodovat o tom budou vítězné mocnosti (USA, Rusko, Čína, Indie, BRICS). Rusko si podle něj na své
    západní hranici vybere pacifistický „národ Švejků a chcimírů“, ne „chciválky“, kteří vybírají na dronové
    a muniční iniciativy (Dan Vávra). Pro Čechoslováky má mluvit i to, že Trumpovy děti s Ivanou jsou
    „poloviční Čechoslováci“. Demonstrace na náměstích podle něj nic neřeší a politici z nich mají „velkou
    prdel“. Okamura a Rajchl jsou mezi „patnácti SPDáky“, kteří nesplnili sliby (Rajchlovo „desatero o
    covidu“ z 26. 1. o vystoupení z WHO a zrušení očkovací strategie), takže jsou jen „služebníci globalistů“.
  citace:
  - text: Jediná šance pro nás a pro budoucnost našich dětí je Československo.
