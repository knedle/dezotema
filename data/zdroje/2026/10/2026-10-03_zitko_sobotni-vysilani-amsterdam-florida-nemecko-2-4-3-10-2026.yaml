  nadpis: Klony, herci a Guantanamo — EBS narativ
  text: '**3. 10.** — Zítko ukazuje „úmrtní list královny“: Alžběta II. byla podle něj popravena oběšením
    na Guantánamu (2019). Na Gitmo podle něj „vydechli“ i aktéři 11. září: George W. Bush (4. 1. 2022)
    a Dick Cheney (29. 1. 2022); Donald Rumsfeld měl spáchat sebevraždu na základně Diego García. Joe
    Biden byl „popraven ještě než nastoupil do úřadu“ a celé funkční období vládl dvojník (důkazem má
    být gesto s automatickým perem při návštěvě Si Ťin-pchinga). Ivana Trump podle něj žije a „vyskočí
    z dortu“.'
