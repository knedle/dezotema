  nadpis: 'Bitcoinová kauza: Jiříkovský odvolal „dar" ministerstvu ze „vzdoru"; notář Míka nově obviněn
    z krytí (Zítko, 5. 9. 2026)'
  text: '**3. 10.** — Zítko opakuje, že bitcoinů bylo „za více než 100 miliard“ a že to „už přes rok a
    čtvrt“ říká jen on. NCOZ ani NCTEKK si toho prý nevšimly, protože by musely „zavřít Blažka, Stanjuru,
    možná i Fialu, Decroix… skoro půlku ODS“. Na zásah se samopaly u Zítka v Doksech ale „užili“ dost.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
