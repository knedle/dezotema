  nadpis: 'Soud v Amsterdamu: Gates, Bourla a Rutte jako obžalovaní'
  text: '**3. 10.** — Zítko ohlašuje „hearing“ 22. října v Amsterdamu, kde mají Gates, Bourla a Rutte
    usednout na lavici obviněných. Tým vede podle něj advokát Peter Stassen, jako svědek vystoupí bývalý
    viceprezident Pfizeru Mike Yeadon a „báječné“ by bylo, kdyby byl do té doby propuštěn Reiner Fuellmich.
    Proces má být „signálem“ i pro Prymulu, Kubka, Flegra, Chlíbka a „další gaunery, kteří tu prováděli
    vakcinační holokaust, genocidu národa a sterilizaci“. Zmiňuje i „Čákovu věštbu“ o Amsterdamu, kalendáře,
    které „končí 4. října a začínají 15.“, a Trumpovo „to začne v pondělí“.'
  osoby:
  - osoba: reiner-fuellmich
    vztah: pozitivni
    kontext: Má být propuštěn a připojit se k amsterdamskému procesu
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
