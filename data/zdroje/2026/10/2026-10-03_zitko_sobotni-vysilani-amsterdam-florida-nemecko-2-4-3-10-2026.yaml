  nadpis: „Vítězné mocnosti" Trump, Putin, bin Salmán a Módí rozhodnou o obnově Československa; volby
    20 let falšovány (Zítko, 24. 9. 2026)
  text: '**3. 10.** — Zítko doplňuje, že Joe Biden byl do úřadu „instalován“ zfalšovanými volbami 2020
    přes Smartmatic. V ČR prý volby zajišťuje HP „vybraný bez výběrového řízení“ (Rakušan za to zaplatil
    „asi milion“ pokuty), na Slovensku ESET. Cituje Stalina: „nezáleží na tom, kdo hlasuje, ale kdo hlasy
    počítá“. Mezi Babišem a Fialou, Metnarem a Rakušanem či Zůnou a Černochovou „se skoro nic nezměnilo“.'
- id: zitko-2026-10-03-06
  typ: tvrzeni
  temata:
