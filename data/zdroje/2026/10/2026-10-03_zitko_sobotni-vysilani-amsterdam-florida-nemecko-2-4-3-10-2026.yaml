  nadpis: Antiparazitika (ivermektin, fenbendazol) proti rakovině i covidu jsou potlačována (Zítko, 3.
    10. 2026)
  text: 'Zítko cituje kanadského lékaře Williama Makise: antiparazitika jako ivermektin, mebendazol a
    fenbendazol jsou „napadána, jakmile se objeví v onkologické péči“, a jeho článek o třech pacientech
    ve 4. stadiu byl po recenzi stažen kvůli „procedurální stížnosti“. Ivermektin a hydroxychlorochin
    byly podle Zítka účinné i na covid, a „experimentální vakcíny“ proto „nikdy neměly být schváleny“.
    Fauci a jeho okolí podle něj účinnost zatajili a ivermektin zesměšnili jako „pastu pro koně“. Zájemcům
    nabízí kontakt na ivermektin a esenciální oleje firmy Bewit, se kterou spolupracuje. Očkovaným s „horšími
    šaržemi“ (rtuť, formaldehyd, SV-40, grafen) mají přírodní preparáty „zlepšit zdravotní stav“.'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
