vyroky:
- id: vrabel-2026-10-15-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: EU ekonomika vybudována na levném ruském plynu — vzdáváme se jí dobrovolně (Vrabel, 18. 5. 2026)
  text: '**15. 10.** — Macinka a Havlíček se podle Vrabela chválí, jak zabránili růstu cen ropy, plynu
    a emisních povolenek, ale „vymyslí si nějakou hovadinu“, zatímco lidé nemají na benzín a země nemá
    zásoby plynu. Macinka se podle něj „naučil od Trumpa“ chválit sám sebe. „Benzín a nafta stojí padesát.
    Za chvilku po volbách bude stát šedesát, v zimě možná už sedmdesát.“ Brzy prý lidé budou řešit, čím
    budou doma topit. Írán označuje za „konflikt Donalda Trumpa“.'
  podtema: Energetika a Rusko
- id: vrabel-2026-10-15-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Musk jako „nasazený kůň“ armády a globalistů, politici jako figurky; zelená ideologie vede k
    novému světovému řádu s kredity (Vrabel, 15. 10. 2026)
  text: 'Ke zprávě, že Musk vyzval Zelenského k odchodu, Vrabel tvrdí, že „Stargate, Star Shield a Starlink
    jsou vojenské armádní programy“ a Musk „pracuje pro armádu Spojených států, a to od počátku“. Je to
    podle něj „nasazený kůň, který pracuje pro ty globalisty“, už od PayPalu se šéfem Palantiru. Všichni
    politici (Trump, Zelenskyj, Macron, Burnham, von der Leyenová, Kallasová) jsou podle něj figurky těch,
    kdo je platí, a „ty války rozehrávají ti, kdo je platí“. Kdo neposlouchá, toho zničí média a policie.
    Ke studii KfW, podle níž Německo potřebuje do roku 2045 šest bilionů eur na klimatickou neutralitu,
    říká, že peníze půjdou z úspor Němců: „celá zelená ideologie a válka znamená v podstatě ožebračit
    Němce… ožebračit a zadlužit“. Cílem je podle něj „nový světový řád, kde budou všude kamery“, sledování,
    místo peněz kredity od státu a práce nahrazená AI a robotizací.'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-15-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**15. 10.** — Ke sdílenému videu protestů ve Francii, Itálii, Británii a Belgii Vrabel tvrdí,
    že „studentské protesty“ převzali migranti s palestinskými vlajkami: „vidíte migranty s barvou pleti
    trošku světlejší, než je moje černá obrazovka na telefonu. Dneska nejsem doma, abych to přirovnával
    k polínkům“ (viz [Stochastický teror](stochasticky-teror.md)). Jde podle něj o konflikt islámského
    světa se Západem, který má „velký potenciál přerůst v občanskou válku“ a „začne se přelévat k nám“.
    Proto by ČR měla „co nejrychleji uzavřít hranice… a vystoupit z Evropské unie“.'
- id: vrabel-2026-10-15-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Suverenisté jsou postupně likvidováni — Orbán „zlikvidován“, Fico „na řadě“, Vučič jako poslední;
    Babiš má „max. 5 %“ (Vrabel, 15. 10. 2026)
  text: 'Ke summitu Evropské rady Vrabel uvádí, že Babiš sice některé věci označuje za nepřijatelné, ale
    za svým slovem si nikdy nestojí. Muniční iniciativa podle něj pokračuje, „přestože to slíbil v předvolebním
    programu“. Šanci, „že by Andrej Babiš udělal něco pro Čechy a pro Českou republiku v Evropské unii“,
    odhaduje na „maximálně 5 %“. Ke zprávě o obnovení slovensko-ruské mezivládní komise by uvítal, kdyby
    Slovensko „spadlo pod sféru“ Ruska a vystoupilo z EU, ale nečeká to. Suverenistické politiky podle
    něj systém postupně odstraňuje: Viktor Orbán „už byl zlikvidován“ a jeho nástupce chce Orbána i Szijjártóa
    dostat do vězení. „Robert Fico je podle mě na řadě.“ Jediným zbylým suverenistou je Aleksandar Vučić:
    protesty proti němu sponzorují „západní globalisté“ a kandidáti jsou „placení z Evropské unie“. Na
    jeho výhru sází „osmdesát ku dvaceti“. Slovensko je podle něj na tom se svobodou slova mnohem lépe
    než ČR. EU je podle něj „na vrcholu svojí existence a teď už to půjde jenom dolů“.'
  citace:
  - text: Viktor Orbán… ten už byl zlikvidován. […] Robert Fico je podle mě na řadě.
  podtema: Česká suverenita
- id: vrabel-2026-10-15-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**15. 10.** — K soudu s Ukrajincem v Hamburku kvůli Nord Streamu Vrabel tvrdí, že to „muselo
    jít na pokyn nejvyššího vedení Spojených států přes nejvyšší vedení Ukrajiny“ (s odkazem na Bidenův
    výrok), protože to nemohli provést „tři frajeři“. Pokud by se měl někdo přirovnávat k Hitlerovi, „měl
    by to být spíš Volodymyr Zelenskyj“, ne Putin. Sikorskému, podle něhož bylo trestným činem už postavení
    Nord Streamu, by „dal normálně pavilon C a každý den třikrát fialovou tabletku“. Usnesení parlamentu
    Saska-Anhaltska (AfD a BSW) o ukončení pomoci Ukrajině a zrušení sankcí vítá jako „vyslyšení naší
    výzvy“ a připisuje si zásluhu: jeho hnutí prý uspořádalo „první demonstrace vůbec na světě“ za mír.
    Ukrajinského velvyslance Makejeva nazývá „velvysrancem“. Ukrajinský režim podle něj „vyhazuje lidi
    jako přezrálé hrušky“ a válku nemůže vyhrát bez zapojení celého NATO a jaderných zbraní. Zelenskyj
    je „diktátor bez voleb“, který se bojí, „kdo ho oddělá první“.'
  podtema: Stav Ukrajiny a mobilizace
