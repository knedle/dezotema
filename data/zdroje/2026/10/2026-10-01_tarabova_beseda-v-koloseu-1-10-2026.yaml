  nadpis: 'Liberec — beseda v Koloseu: rozpad koalice s GEN, „nevolitelné" strany (Tarabová, 1. 10. 2026)'
  text: 'Tarabová popisuje, že chtěla v Liberci vytvořit silnou „čtvrtou nohu" koalice konzervativních
    stran: ze sedmi oslovených (SPD, Motoristé, PRO, Svobodní, Trikolóra, GEN, Volt) zbyly tři, a když
    GEN po podpisu koalice 4. 5. vydal článek „s extremistickou PRO nikdy, s dezinformátorkou Tarabovou
    nikdy", tým PRO odmítl jít dál bez ní a postavil vlastní kandidátku (číslo 3). STAN, ODS, TOP 09,
    KDU-ČSL a Piráty označuje za „nevolitelné", senátnímu kandidátovi Martinu Půtovi přeje, aby neuspěl.
    Podrobněji viz [politicky-system.md](politicky-system.md#beseda-v-koloseu-obstrukce-opozice-nevolitelné-strany-kampaň-za-2-tisíce-a-polovina-platu-na-rajchlův-spolek-tarabová-1-10-2026).'
