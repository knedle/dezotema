- id: tarabova-2026-10-01-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Tarabová: Davidova hvězda „zachránila spoustu životů"; „17 milionů úmrtí po vakcínách" = až
    1,7 miliardy (1. 10. 2026)'
  text: 'Na besedě v Koloseu Tarabová obhajuje svou akci s Davidovou hvězdou a nápisem „neočkovaný": šlo
    podle ní o jediný způsob, jak „zbořit mýtus systému", když neměli přístup do médií, a „zachránili
    jsme spoustu životů"; připomíná, že ODS v roce 2017 použila Davidovu hvězdu s nápisem EET „a nikomu
    to nevadilo". Tvrdí, že národní systémy hlášení nežádoucích účinků (SÚKL, VAERS aj.) evidují 17 milionů
    úmrtí po covidových vakcínách; protože se podle ní hlásí jen 1–10 % případů, jde o „170 milionů až
    1,7 miliardy možných příčin úmrtí po vakcínách". Odvolává se na Mezinárodní úmluvu o lidských právech
    a biomedicíně (právo rozhodnout o vlastním těle) a věří, že se to jednou prošetří i v ČR.'
  citace:
  - text: Mnozí mi dneska říkají, po bitvě každý generál, tak jim opakuju, že já jsem byla generálem před
      bitvou.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: tarabova-2026-10-01-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Ukrajinci v Liberci: „1,2 milionu podle cizinecké policie", revize městských bytů (Tarabová,
    1. 10. 2026)'
  text: Tarabová tvrdí, že podle dat cizinecké policie žije v ČR 1,2 milionu Ukrajinců, výrazně víc než
    oficiální čísla. Ukrajincům nevyčítá, že „otevřenou náruč" využili, ale podle ní „od nátury nejsou
    moc občany, kteří by se zapojili do našeho žití" a většina lidí s tím má „velké problémy". Jako bývalá
    členka komise pro přidělování městských bytů se ptá, kde se pro ně najednou vzalo tolik bytů, když
    dřív bylo na jeden byt 30 zájemců; jako primátorka chce provést revizi přes neziskovky, městské byty,
    pracovní agentury a úřad práce a s klubem SPD „dotlačit" Babiše k řešení „ukrajinské krize". Téma
    podle svých slov nezařadila do programu, aby „nedráždila novináře".
- id: tarabova-2026-10-01-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Beseda v Koloseu: obstrukce opozice, „nevolitelné" strany, kampaň za 2 tisíce a polovina platu
    na Rajchlův spolek (Tarabová, 1. 10. 2026)'
  text: 'Na předvolební besedě v libereckém Koloseu (Rajchl nedorazil kvůli jednání sněmovny) Tarabová
    kritizuje opozici, která podle ní „nechutně obstruuje" a zneužívá sněmovnu ke komunální kampani, místo
    aby si „zametla před vlastním prahem" (Dozimetr, Kampelička, bitcoin, pražský dopravní podnik). STAN
    označuje za „zločinnou organizaci", ODS spojuje s bitcoinovou kauzou a „Stanjurovým šméčkem", TOP
    09 s Dozimetrem, lidovcům upírá křesťanství a Piráty považuje za projekt evropských neziskovek — Hřib
    je podle ní „psychopat"; všechny označuje za „nevolitelné". Hejtman Martin Půta, kandidující do Senátu,
    by podle ní „už dávno měl sedět". Kritizuje vedení Liberce za „předražené betonové pomníky": Tržní
    náměstí za 63 mil. Kč (návrh PRO by prý stál 8 mil.), „nejdražší bazén v Evropě", zničené rododendrony
    na Masarykově třídě; k bydlení připomíná, že se v letech 1968–1992 postavilo 800 tisíc převážně družstevních
    bytů, a družstva chce podporovat. Sama slibuje, že jako primátorka věnuje polovinu platu (kolem 130
    tisíc) nově založenému Rajchlovu spolku na pomoc nemocným a zbytek alternativním médiím; kampaň PRO
    prý stála „necelé 2 tisíce", zatímco Starostové měli 5 milionů. Popisuje i rozpad liberecké koalice:
    GEN (Tibor Batthyány, předseda Rivola) podepsal 4. 5. koalici s PRO a o čtyři dny později vydal článek
    „s extremistickou PRO nikdy, s dezinformátorkou Tarabovou nikdy"; Trikolóra prý odešla kvůli místům
    na kandidátce SPD. Rajchla označuje za „budoucího premiéra".'
  citace:
  - text: Takhle se dá dělat politika. Když se dělá srdcem.
