  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: '**28. 10.** — Reparace 29 bilionů Kč (9 500 tun zlata) by podle Zítka zajistily zlaté krytí měny
    obnoveného Československa — „k tomu se všechno schyluje“. Josef Tošovský a Niedermayer podle něj rozprodali
    zlatý poklad za 300–350 USD za unci a numismatické mince jen za cenu zlata; Tošovského nehodu ve Ferrari
    v USA uvádí jako důkaz „bakšiše“. Kandidáty ve volbách podle něj vybírá počítač — v ČR Hewlett Packard
    bez výběrového řízení, na Slovensku ESET.'
