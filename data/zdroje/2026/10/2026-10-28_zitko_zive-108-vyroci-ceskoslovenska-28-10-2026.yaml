  nadpis: Rodný list jako obchodní papír na burze v New Yorku — admirality law (Zítko)
  text: '**28. 10.** — Všichni advokáti mají podle Zítka smlouvu „BAR – British Association Register“,
    čímž naplňují nový trestný čin neoprávněné činnosti pro cizí moc (§ 318), a soudy podléhají britskému
    „námořnímu právu“; Babiš podle něj „nekecal“, když říkal, že řídí stát jako firmu, protože ČR firmou
    opravdu je.'
