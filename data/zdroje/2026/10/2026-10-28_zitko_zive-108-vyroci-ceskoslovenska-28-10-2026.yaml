  nadpis: Rozdělení ČSFR jako nulitní akt + „velká aliance" čistí Deep State (Zítko, 12. 6. 2026)
  text: '**28. 10.** — Ve vysílání ke 108. výročí Zítko tvrdí, že Havel 20. 7. 1992 abdikoval, aby se
    vyhnul povinnosti poslat 160tisícovou armádu proti „pučistům“ Klausovi a Mečiarovi; do 2. 2. 1993
    nebyl prezident, a proto „nejsou platné žádné zákony přijaté po datu 20. července“. Podle průzkumů
    chtělo v listopadu 1992 referendum 80 % Slováků a 72 % Čechů, ale konat se nemohlo, protože by „nešlo
    zfalšovat“; aktéři rozdělení jsou podle něj „stále trestněprávně odpovědní“. Poslanci měli být uplaceni
    penězi z kauzy lehkých topných olejů (asi 100 mld.), „pravděpodobně z Anglie a z Německa“, aby Německo
    nemuselo platit reparace, a příklad Jugoslávie měl sloužit k vydírání Klause a Mečiara. Česko-německá
    deklarace z roku 1997 je podle něj neplatná a v OSN zůstává neobsazená „židle“ Československa. Harabinův
    názor, že rozdělení bylo správné, odmítá, a Rajchla kritizuje za zlehčování („byli bychom ještě Rakousko-Uhersko“).'
  citace:
  - text: Nejsou platné žádné zákony přijaté po datu 20. července.
  osoby:
  - osoba: stefan-harabin
    vztah: negativni
    kontext: Mylně považuje rozdělení za správné
