  text: '**28. 10.** — Putin bude podle Zítka „milovat chcimíry z Československa“, ne ty, kdo dodávají
    Ukrajině rakety a sbírají na drony; za znamení považuje sochu přátelství odhalenou Ficem a Babišem
    a Lavrovovo tričko „SSSR“ na Aljašce. Rozpad SSSR i Jugoslávie (ta podle něj „operací CIA“) proběhl
    protiprávně a obnova ČSR je „jenom otázka času“; k nápisu „Československo 15.12–24.12“ říká, že „nepredikuje
    žádná data“.'
