  text: Zítko tvrdí, že politická rozhodnutí řídí „bezbřehá korupce a vydírání“ — nahrávky zneužívání
    dětí v duchu kauzy Epstein a úplatky, k nimž mají politici své „nosiče peněz“ (Dalík u Topolánka,
    Dymun u Paroubka, Faltýnek u Babiše). Evropskou unii podle něj ovládají „vnoučátka nacistických pohlavárů“;
    operací Paperclip mělo do Ameriky uniknout 7–8 tisíc důstojníků SS „včetně Adolfa Hitlera“. Karel
    Kryl podle něj „viděl zlodějům do karet“ (koncert v Chomutově 25. 2. 1994) a „možná i to mohlo být
    příčinou“ jeho předčasné smrti.
  citace:
