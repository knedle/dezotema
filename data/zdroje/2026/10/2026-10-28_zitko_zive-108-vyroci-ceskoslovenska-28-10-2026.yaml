  text: '**28. 10.** — Zítko vládu a poslance označuje za „masové vrahy, kteří propagovali pokusy na lidech“,
    které není důvod respektovat, a od 12. 3. 2020 mluví o „vládou a poslanci řízené genocidě a sterilizaci“;
    Karel Havlíček mu prý mimo kameru řekl: „kdybychom to tenkrát neudělali, oni by nás zabili“. Španělská
    chřipka byla podle něj obdobou covidu, kdy lidé umírali „za očkováním“.'
