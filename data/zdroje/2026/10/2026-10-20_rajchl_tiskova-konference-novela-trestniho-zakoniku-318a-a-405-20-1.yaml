- id: rajchl-2026-10-20-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Koaliční shoda na úpravě § 405: trestat jen podněcování k násilí a nenávisti, ne „odchylný
    názor“ (Rajchl, 20. 10. 2026)'
  text: |-
    **21. 10. (FB Live)** — V samostatném vysílání po Rajchlově tiskové konferenci Vrabel připouští, že je „fajn“, že SPD změnu chystá, ale označuje ji za „povinnost“, za kterou nemají být vděční. Rajchl podle něj nezmínil lidi, „za kterým může on“, a změna paragrafu nestačí: dokud se Babiš (za covidu), Fiala a znovu Babišova vláda neomluví a stát politicky persekvované neodškodní a nezruší rozsudky, „mají na rukou ty podmínky, […] ty tresty, […] ty vězení“ (výraz „krev na rukou“ sám bere zpět jako přehnaný). Jako příklady uvádí Slávka Popelku, který má podle něj po půlroce ve vězení leukémii (zima, „psychické násilí“ a krmení masem, ač je vegetarián), pětiapůlletý trest Tomáše Čermáka a stíhání Luboše Volného; rehabilitaci žádá i pro sebe a manželku (viz [Kauzy a korupce](kauzy.md)). Odmítá argument nezávislosti soudů: „to jsou politický případy a ty se musí vyčistit“. Rajchla nazývá „psychopatem“ bez svědomí, který je „prodejnej“ a „vždycky bude otáčet kabát“; dokud neodškodní stíhané, „budeme ho tepat a budeme prostě jeho černý svědomí“. Rajchl, Okamura a Majerová podle něj dlouhodobě „ničí vlasteneckou scénu“ a „zobchodují“ vlastenectví za funkce. Pochod 17. 11. proto pokračuje i jako pochod „za očištění a rehabilitaci politicky persekvovaných osob“ všech tří vlád.

    > „To nejde smáznout tím, že vystoupí na tiskový konferenci a řeknou, my jsme teď trošku změnili trestní zákon.“ — Ladislav Vrabel
  podtema: Trestání politického projevu
