- id: rajchl-2026-10-29-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Prymula „největší covidový pokrytec a lhář“ — „jednou si vás před komisi pozvu, ve vězení budete
    schnout“ (Rajchl, 29. 10. 2026)
  text: Na výrok Romana Prymuly, že pořad ČT s Rajchlem šíří „fantasmagorické teorie“ o původu viru, Rajchl
    odpovídá, že fantasmagorií je přeskok viru z netopýra na člověka. Laboratorní původ podle něj dnes
    zastává americký Kongres i FBI a Tulsi Gabbardová prý přiznala, že to USA věděly od začátku. Sám se
    prý v pořadu k původu viru nevyjádřil, mluvil jen o právních aspektech senátního slyšení Anthonyho
    Fauciho (Rand Paul). Prymulu nazývá „největším covidovým pokrytcem a lhářem v ČR“, protože kázal nošení
    roušek, sám je nenosil a jeho rodina prý „vydělala na pandemii na lidském utrpení miliony“. Fauciho
    by podle Rajchla bez Bidenovy milosti čekalo doživotí a Prymulovi se „jednou poštěstí to samé“. Slibuje,
    že ho jako politik „na začátku kariéry“ jednou předvolá před vyšetřovací komisi (viz [stochastický
    teror](/stochasticky-teror.md) a [predikce](/predikce/index.md)).
  citace:
  - text: Tak za to si vás před tu komisi jednou pozvu já. To je můj velký závazek. A až skončí, tak vy
      v tom vězení jednou schněte, protože vám nikdo žádnou milost nedá.
