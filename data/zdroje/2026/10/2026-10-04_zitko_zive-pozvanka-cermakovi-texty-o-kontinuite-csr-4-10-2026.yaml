  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: '**4. 10.** — Zítko opravuje Kateřinu Konečnou („Němci nám dluží 20 bilionů"): se složeným úrokem
    jde podle něj o 29 bilionů Kč, tedy asi 9 500 tun měnového zlata, což by z Československa „udělalo
    velmoc". Nárok má ale jen ČSR, které reparace přiřkla Pařížská reparační konference 21. 12. 1945,
    ne „korporace Česko a Slovensko" vzniklé 1. 1. 1993.'
- id: zitko-2026-10-04-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Rozdělení ČSFR jako nulitní akt + „velká aliance" čistí Deep State (Zítko, 12. 6. 2026)
  text: '**4. 10.** — Zítko předčítá a schvaluje texty z profilu „Politický vězeň Čermák" („skoro stejně
    jako Bob Acer"). Nález Ústavního soudu 55/1995 k Benešovým dekretům podle nich říká, že akty učiněné
    pod nátlakem „nemohou zničit existenci státu", a to musí platit i pro federalizaci 1968 a rozdělení
    1992. Mezinárodní uznání nástupnických států bylo prý získáno „uvedením OSN v omyl". Pithart měl potvrdit,
    že Klaus a Mečiar neměli mandát. Havel přísahal věrnost třem různým subjektům, což Zítko označuje
    za „křivopřísežnictví, velezradu a vlastizradu". Soudy jsou podle něj „soukromé firmy" s obchodními
    čísly DUNS. Návratem k ČSR z roku 1918 bychom byli „mimo jurisdikci EU a NATO", které ovládají „potomci
    fašistů a nacistů".'
