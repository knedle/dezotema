  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**4. 10.** — Zítko posílá „údajnému" Čermákovi „neodmítnutelnou" pozvánku na akci ve Frýdku-Místku
    10. 10. se vším zaplaceným (doprava, hotel, plná penze), aby se „ukázala pravda a lež". Muž u soudu
    byl podle něj menší než 185 cm, měl jiné uši, oči i nos, a hlas lze pomocí AI napodobit z 20–30 vteřin
    záznamu. Pravý Čermák může podle něj poslat zdravici „přes kontaktéra White Hats" na Zítkův proton
    e-mail. Upozorňuje, že dva politické texty na profilu odporují slibu u soudu.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-04-02
  typ: tvrzeni
  temata:
