  poznamka: 45 min, monolog z procházky po Subotici (Srbsko); potlačování dosahu na Facebooku, Srbsko
    jako vzor, kritika Rajchla a Svatoše; bez sdílených videí.
  osoby:
  - osoba: michal-svatos
    vztah: negativni
    kontext: Nepřišel na demonstraci proti jadernému vyzbrojení, u Petra Hájka šíří „podvraťácké lži“
      (hacienda v Srbsku), aby získal funkci v SPD či PRO
  - osoba: petr-hajek
    vztah: negativni
    kontext: Z „Klausovy rodiny“ jako Macinka, proto se staví proti Vrabelovi
  - osoba: dr-vitova
    vztah: pozitivni
    kontext: Jediní, kdo na „zaprodané“ vlastenecké scéně zůstali „rovní“
  - osoba: miroslav-sladek
    vztah: pozitivni
    kontext: Jediní, kdo na „zaprodané“ vlastenecké scéně zůstali „rovní“
  - osoba: aleksandar-vucic
    vztah: pozitivni
    kontext: Odmítá sankce proti Rusku i zbraně pro Ukrajinu, „pracuje jen pro Srby“ — vzor pro ČR
  prehled:
  - tema: Facebook potlačuje dosah (25 diváků z 34 tisíc sledujících)
    text: sociální sítě dělají každému „média na míru“, jsou silnější než televize; přes Palantir a Stargate
      cílí politiku a nadhánějí „schopné politiky“; stojí i za studentskými protesty v Evropě; odpovědní
      by měli jít „do vězení na 20–30 let“ → viz [Stochastický teror](../stochasticky-teror.md)
    vyrok: vrabel-2026-10-23-03
  - tema: Plán „ČR na 1. místě“ a Srbsko jako vzor
    text: ruský plyn na dlouhodobé kontrakty, potravinová a léková soběstačnost, vojenská neutralita;
      v Srbsku „pohoda“, nikdo se nebojí války, Vučić se nepoddá; jediná šance je „utéct“ z globalismu
      (opakuje).
  - tema: Zprávy od Čechů v Subotici
    text: na Ostravsku končí hutě a doly, firmy přecházejí na válečnou výrobu (Strnad), přibývá Ukrajinců;
      „ukrajinizaci“ si lidé „udělali sami“ ukrajinskými vlajkami.
  - tema: SPD jako falešná opozice
    text: v Karviné „nemá jedno křeslo“, SPD už 13 let „legitimizuje vlády“, hlasy voličů se tak „spláchnou
      do WC“ (opakuje).
  - tema: Totalita a „zaprodaná“ vlastenecká scéna
    text: prý ho ničí ekonomicky, mediálně i tajnými službami, Eric Best mu v roce 2022 řekl, že ho „nahradí
      jiný člověk“; zůstali jen Vítová a Sládek; Michal Svatoš u Petra Hájka šíří „podvraťácké lži“, aby
      dostal funkci; Rajchl je „robot“, který ho kopíruje, otočil Václavák proti Rusku a udával lidi za
      „Z“, Vacek „absolutní globalista“ (opakuje).
  - tema: 1 % vlastní 99 % bohatství
    text: elity jsou „satanisti“, kteří chtějí přes transhumanismus nesmrtelnost; Rusko se drží jako poslední,
      Čína je přetechnizovaná; obává se, zda bude za rok či dva ve městech jídlo (opakuje).
vyroky:
- id: vrabel-2026-10-23-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Facebook „nebezpečnější než média" — řízené potlačování dosahu Vrabela, nadhánění Rajchla (Vrabel,
    21. 6. 2026)
  text: '**23. 10.** — V živém vysílání ze Subotice, kde ho po několika minutách sledovalo 25 lidí z 34
    tisíc sledujících (dřív prý okamžitě 200), Vrabel tezi rozvádí: jeho příspěvky s 300 sdíleními vidí
    10–30 tisíc lidí, u nepotlačovaných autorů 300 tisíc. Sociální sítě podle něj každému vytvářejí „média
    na míru“, takže nikdo neví, co vidí ostatní, a jsou proto „mnohem silnější nástroj“ politické propagandy
    než televize nebo zpravodajské weby. Nově to propojuje s Palantirem a Stargate: z profilů lidí AI
    vyhodnotí, „jakým způsobem mají cílit politicky“, a podle toho se vybírají a nadhánějí „schopní politici“
    (lajky Rajchla, příspěvky SPD), zatímco SPD v Karviné ve skutečnosti „nemá jedno křeslo“. Sociální
    sítěmi vysvětluje i studentské protesty od Itálie po Irsko, Albánii a Tunisko — „to dělají globalisté“,
    kteří studenty zneužívají k politice. Potlačování dosahu je podle něj v rozporu s ústavním právem
    na informace, „za to by všichni ty lidi, kteří tohle dělaj, měli jít do vězení minimálně na 20–30
    let“ (viz [Stochastický teror](stochasticky-teror.md)); Česko označuje za „hlubokou totalitu“, kterou
    nelze prorazit, a jako jedinou cestu vidí přivádět lidi na pravidelné Zprávy v devět.'
  citace:
  - text: Ten Facebook prostě každému udělá na míru ty jeho média. A my to nevíme, jak to udělají.
  osoby:
  - osoba: rajchl
    vztah: negativni
    kontext: „Robot“, který ho kopíruje slovo od slova, otočil Václavák proti Rusku a udával lidi za „Z“;
      novela § 405 „pičovina“
  podtema: Česká televize a mainstreamová média
