vyroky:
- id: vrabel-2026-10-06-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Údajný mor v Irkutsku jako protiruská propaganda; covid „pravděpodobně udělali Američané“ (Vrabel,
    6. 10. 2026)
  text: K úmrtí výzkumnice protimorového ústavu v Irkutsku Vrabel uvádí, že riziko šíření je podle lékařů
    velmi nízké a že americká média z toho dělají „velkou věc“, aby si lidé „na podvědomé úrovni“ spojili
    Rusko s morem. Zároveň připouští, že pokud by globalisté chtěli novou epidemii, „klidně by mohla přijít
    z Ruska“, tak jako covid „přišel z Číny“. Covid podle něj „pravděpodobně udělali Američané“ v laboratoři
    řízené Faucim a v prosinci 2019 ho „přivezli američtí vojáci“. Šlo o „vojenskou operaci se svými cíli“
    (zákaz chodit k lékaři, ventilátory). Víc se k tomu prý nevyjádří, „aby mu nezrušili YouTube“.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: vrabel-2026-10-06-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**6. 10.** — Vrabel oznamuje, že kromě tří výzev ze shromáždění pošle za hnutí a spolek dopis
    Babišovi a ministrovi spravedlnosti kvůli stíhaným členům (Tomáš Hrdlička, Robert Kutý a jeho bratr,
    dřívější člen Jakub Jašek, Katka Blahníková). Za dodržování lidských práv podle něj odpovídá vláda,
    protože „to, co dělají soudy dneska, je politika“. Vláda má buď přijmout zákon a veřejně zdůvodnit,
    proč je symbol „Z“ protiprávní, nebo za něj nelze soudit. Lidé podle něj „Z“ nosili hlavně na protest
    proti „teroru pomocí ozbrojenců se samopaly“, ne kvůli Rusku. Pokud se vláda „v přiměřeném čase“ nevyjádří
    a neomluví, zvažuje velkou demonstraci 17. listopadu („ukradený svátek svobody“) s celostátní placenou
    kampaní. Právní rozbor chystá se Štefanem Harabinem.'
  osoby:
  - osoba: stefan-harabin
    vztah: pozitivni
    kontext: Chystá s ním právní rozbor stíhání za „Z“
  podtema: Trestání politického projevu
- id: vrabel-2026-10-06-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**6. 10.** — K testu francouzské ponorkové střely M51-3 Vrabel (s odkazem na rozhovor s Michalou
    Gánovskou) zdůrazňuje, že o použití francouzských jaderných zbraní v ČR by rozhodoval Emmanuel Macron.
    Ten podle něj „není emocionálně stabilní“, pracuje pro „Alexandra de Rothschilda“ a v roce 2022 Rusko
    „podvedl“, když ho požádal o stažení od Kyjeva kvůli míru, který pak Johnson zablokoval. Macronův
    vztah s manželkou, kterou označuje za „pravděpodobně přestavěného chlapa“, považuje za „psychickou
    poruchu, diagnózu“. Ironizuje, že „deštník“ k nám ponorkami po Vltavě nedopraví. Výzvu „nepodepisovat
    dohodu o jaderných zbraních“ ze shromáždění 3. 10. podává 7. 10. na Úřad vlády a do Sněmovny.'
  osoby:
  - osoba: emmanuel-macron
    vztah: negativni
    kontext: „Emocionálně nestabilní“, „psychická porucha“, podvedl Rusko 2022, pracuje pro Rothschilda
  - osoba: michala-ganovska
    vztah: pozitivni
    kontext: Zdroj informací o jaderném deštníku a ruském vnímání ČR
- id: vrabel-2026-10-06-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Zatčení „klimatického extremisty" v Německu jako signál blížícího se rozpadu Západu a občanské
    války v Evropě (Vrabel, 10. 9. 2026)
  text: '**6. 10.** — Vrabel tvrdí, že Evropa „páchá harakiri“, „jako kdyby ji někdo chtěl zničit“. Odstřihla
    se od levné ruské energie, kupuje čtyřikrát dražší americkou, pohádala se s USA, přechází na válečnou
    ekonomiku, chce omezit levné čínské zboží (francouzsko-německý návrh nástroje proti dumpingu) a otevřela
    „stavidla milionů migrantů“. Proto „se Evropa vaří“ a „bude občanská válka“. Británie podle něj zatkla
    „50 tisíc lidí“ za příspěvky na sítích, takže Rusko je proti ní „země svobody“. ČR je „na povrchu
    krásná, uvnitř prohnilá“. Inflace se podle něj zrychluje, protože „končí systém amerického petrodolaru“,
    a „to, co nás čeká, je ekonomický držkopád“.'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-06-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Globalisté používají k převratům studenty; Green Deal a útoky na ropu jako plán depopulace na
    „jednu miliardu“ (Vrabel, 6. 10. 2026)
  text: |-
    K tomu, že se studentské protesty z Francie šíří do Itálie, Vrabel tvrdí, že „když globalisté dělají převrat v nějaké zemi, vždycky používají studenty“: v ČR v roce 1989 (student Šmíd), na Majdanu i nyní v Srbsku proti Vučićovi (studentské hnutí kandiduje ve volbách). Šíření protestů z jedné země do druhé je podle něj „naplánované, organizované přes sociální sítě a neziskovky, placené“, což ví „jako organizátor jednoho z největších protestů v ČR“.

    V závěru vysílání Vrabel spekuluje, že energetická krize, Green Deal i útoky na ropnou infrastrukturu po světě jsou „cílené“: „chtějí udělat svět bez ropy a bez benzínu“. Popisuje, co by sám dělal, kdyby chtěl snížit lidstvo z 8–9 miliard na jednu miliardu. Nevraždil by, ale udělal by vakcínu způsobující neplodnost, plastové kelímky s mikroplasty, „sypal by do oblohy těžké kovy“, otrávil životní prostředí a provedl deindustrializaci a likvidaci ropy, protože ženy v krizích „nejsou tak plodné“. A „měl by dobrý pocit z toho, že je liberální progresivista, který zachránil planetu“.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-06-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Passerelle klauzule a kvalifikovaná většina v obraně a migraci — „Anglosasové se rozhodnou,
    Slované mašírují"; „konec České republiky" (Vrabel, 29. 9. 2026)
  text: '**6. 10.** — K návrhům Komise na rozšíření EU (Černá Hora, Albánie, Ukrajina, Moldavsko), mj.
    možnosti pozastavit novému členovi hlasovací práva až na 15 let, pokud „nerespektuje hodnoty EU“,
    Vrabel tvrdí, že „hodnotami“ se myslí podpora Ukrajiny, zákaz obchodu s Ruskem a Čínou nebo migrační
    pakt. Rozšiřování je podle něj jen „salámová metoda“, jak zavést kvalifikovanou většinu, aby žádný
    „hrdina se svědomím“ typu Fica nemohl zablokovat vstup Ukrajiny. Později se to má stát obecným pravidlem
    a změnit Lisabonskou smlouvu. Kvalifikovanou většinou pak bude možné rozhodnout o „přesunu muslimů“
    do ČR, Polska, Maďarska a na Slovensko, protože pro EU už to nejsou státy, ale „regiony“. Babiše označuje
    za „EU patriota“ a připomíná, že Okamura přesvědčoval Srbsko ke vstupu do EU.'
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: „Pravý vlastenec“ (ironicky), který přesvědčoval Srbsko ke vstupu do EU
  podtema: Česká suverenita
- id: vrabel-2026-10-06-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Válka Ruska s Evropou „na 99 %“ začne v Pobaltí a bude vleklá; Evropa chystá jaderné obklíčení
    Ruska; „zachraň se, kdo můžeš“ (Vrabel, 6. 10. 2026)
  text: |-
    K útoku 900 ukrajinských dronů na Rusko a k přesunu švédských Patriotů do Polska Vrabel tvrdí, že „až Rusové řeknou, že trpělivost přetekla, bude nám to líto“. Na rozdíl od Lavrova nevěří, že válka s Evropou bude rychlá a hned jaderná. Podle něj „na 99 %“ začne v Pobaltí, ČR v ní bude „okamžitě“ díky článku 5 a „dvěma Babišovým brigádám“ (uzavřené hranice), a půjde o vleklý konflikt raket a dronů, který „se bude pomalu rozrůstat na celou Evropu“. Jaderné zbraně se podle něj budou rozmisťovat a eskalace bude postupná. Plánem Evropy je podle něj „obklíčit Rusko od Finska po Gruzii“, vyzbrojit okolní státy jadernými střelami na letadlech (F-35, Rafale, ASMP, nuclear sharing) a provést koordinovaný útok. To se ale nemůže povést kvůli ruské rozvědce a systému „Mrtvá ruka“. Jediné řešení je vzájemné odzbrojení.

    Rusové podle něj (s odkazem na Gánovskou a Zacharovovou) vnímají ČR a Slovensko „en bloc jako Evropu, jako nepřítele“. Reagovat budou na to, co dělá vláda, ne na to, co chtějí občané, a je „naše chyba“, že jsme si tuto vládu zvolili. Na shromáždění 3. 10. přišlo jen „asi 500 lidí“, „falešná opozice“ (SPD, Trikolóra, Svobodní drží ministerstvo obrany) dělá opak slibů a „celá republika vypadá, že se pomátla“. Proto opakuje „zachraň se, kdo můžeš“.
  citace:
  - text: Myslím si, že to začne tam [v Pobaltí] a bude to pokračovat velmi podobně jako na Ukrajině [...]
      že ten konflikt se pomalu bude rozrůstat na celou Evropu, že bude vleklý.
  osoby:
  - osoba: sergej-lavrov
    vztah: rozporuplny
    kontext: Nevěří mu, že válka s Evropou bude rychlá a jaderná
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-06-08
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: válka Ruska s Evropou „na 99 %“ začne v Pobaltí, ČR v ní bude okamžitě a konflikt bude vleklý;
    čeká nás „ekonomický držkopád“
  text: Válka Ruska s Evropou podle něj „na 99 %“ bude. Začne v pobaltských zemích, ČR se do ní kvůli
    článku 5 zapojí okamžitě a půjde o pomalu se rozšiřující vleklý konflikt raket a dronů, ne o okamžitou
    jadernou válku. Ekonomicky Evropu kvůli konci petrodolaru čeká „držkopád“.
  citace:
  - text: Když se ta válka bude rozbíhat, a myslím si, že na 99 % bude, tak to začne v pobaltských zemích
      [...] takže v té válce budeme okamžitě, protože se aktivuje článek 5.
  predikce:
    horizont: neurčeno
    stav: ceka
