  nadpis: 'Senátní kandidáti PRO/koalice: Loprais, Skalický, Beran, Šorna — „ani korunu na Ukrajinu" (Rajchl,
    27. 9. 2026)'
  text: '**11. 10. — výsledky 1. kola a podpora ANO ve 2. kole:** Rajchl hodnotí výsledky senátních kandidátů
    PRO jako „naprosto úžasné“: Loprais 12,75 % (třetí místo proti Šimetkovi z ODS a Baránkové z ANO),
    Skalický 10,35 % v Děčíně (Linhart zvolen v 1. kole), Šorna 9,4 % na Příbramsku a Beran přes 5 % na
    Trutnovsku. Podle něj nikdo „nepropadl“ a ve všech obvodech šli proti kandidátovi ANO. Pro 2. kolo
    vyjadřuje „jasnou podporu všem kandidátům hnutí ANO“ a vyzývá voliče PRO, aby v Ostravě volili Lucii
    Baránkovou a na Příbramsku Barboru Daňhovou. Hlasy PRO se ve 2. kole podle něj „fakticky zdvojnásobují“,
    protože klesá účast; půjde o to, „jestli to budou ODSáci, nebo zástupci hnutí ANO“.'
  osoby:
