- id: rajchl-2026-10-11-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: '„Cestovní agentura Petra Pavla“: let do Maroka jako klientelismus; Eva Pavlová jako „soukromá
    osoba“ nemá dostávat 106 tisíc (Rajchl, 11. 10. 2026)'
  text: |-
    Rajchl označuje Pavlovo létání „Maroko–Praha, Maroko–Praha“ kvůli rallye v době komunálních voleb za „šarádu a tragikomedii“. Připomíná, že Pavel v roce 2022 označil komunální volby za „ty nejdůležitější“. Podstatné je podle něj, kdo soukromý tryskáč platil: pronajímatel, majitel banky Creditas, jméno nesdělil, a novináři by u Babiše, Okamury nebo Rajchla „byli čilí jako ohaři“. Je „přesvědčen, že Petr Pavel určitě ne“, a ohlášené dělení nákladů označuje za „damage control“: „Je evidentní, že si tady Petra Pavla někdo vydržuje.“ Jde podle něj o „ukázku jasného klientelismu“ a podezření na střet zájmů. Let vyprodukoval asi 30 t CO₂, roční spotřebu pěti občanů, „ale on může, protože je papaláš“.

    Eva Pavlová podle něj výrokem, že za prezidentovu neúčast u voleb „může stát“, „nasadila korunu všemu“. Zákon, že komunální volby jsou vždy první víkend v říjnu, platí dva roky a volba ze zahraničí by vyžadovala hlasovací lístky všech asi 6 000 obcí na každé ambasádě. Mluvčí Hradu Vít Kolář ji označil za „soukromou osobu“. Rajchl proto bude „jednoznačně pracovat na tom, aby jí byla apanáž odejmuta“: „Proč jí tedy dáváme 106 tisíc korun měsíčně? … Za to, že je něčí manželkou.“
  citace:
  - text: Pokud se jedná o soukromou osobu, tak jí nemá už platit stát.
  osoby:
  - osoba: eva-pavlova
    vztah: negativni
    kontext: Výrok, že za neúčast prezidenta u voleb může stát, je „výsměch“; jako „soukromé osobě“ jí
      má být odebrána apanáž 106 tis.
  - osoba: petr-pavel
    vztah: negativni
    kontext: Let do Maroka soukromým tryskáčem — „klientelismus“, „někdo si ho vydržuje“, „papaláš“
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-10-11-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**11. 10.** — Rajchl odmítá zdanit české miliardáře, protože by odešli: Hollande tím ve Francii
    jen zdražil nemovitosti v Belgii a po Stanjurově windfall tax se energetické firmy (Křetínský, Tykač)
    přesunuly do Lichtenštejnska, „jsme je vyhnali“. Chce je naopak „táhnout do hry“ k reinvesticím. Zdanit
    chce zahraniční vlastníky bank (Erste, Société Générale), kteří prý odvádějí přes 100 mld. Kč ročně
    a vnitropodnikovými transakcemi „blíží se to bilionu“. Zbrojaře by sektorově zdanil výměnou za přednost
    v zakázkách ministerstva obrany: „nebudeme to kupovat u Rheinmetallu, u Saabu, u Lockheed Martinu“.
    Za současného nastavení podle něj dvojnásobná práce nezbohatí ČR, „jenom z ní odejde dvakrát více
    dividend do Německa, Francie, Ameriky“.'
  podtema: Ekonomický program PRO
- id: rajchl-2026-10-11-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Mír bude odrážet aktuální kontrolu území — čím déle válka trvá, tím hůř pro Ukrajinu (Rajchl,
    12. 7. 2026)
  text: '**11. 10.** — Válka je podle Rajchla „fakticky u konce“: Trump „už Zelenského obětoval“ a je
    „jen otázka času“, než se s Putinem dohodne na míru. Rusko podle něj „dostane ještě Kramatorsk a Slovjansk
    a bude po válce“, a „mohli jsme si ušetřit dva miliony mrtvých“. Kdo to nevidí, je „blázen, naivista
    a idiot“. Zelenský je podle něj „nejzkorumpovanější člověk asi na celém světě“: okrádání spoluobčanů
    v době války (Mindič a „zlaté záchody a bidety“ z evropských peněz na energetiku) je „největší možný
    hyenismus“, který „si zaslouží trest smrti“ (viz [Stochastický teror](/stochasticky-teror.md)). Trump
    podle něj na Zelenského výtky reagoval jen „huh, kdo?“.'
  podtema: Vyjednávání a mír
- id: rajchl-2026-10-11-05
