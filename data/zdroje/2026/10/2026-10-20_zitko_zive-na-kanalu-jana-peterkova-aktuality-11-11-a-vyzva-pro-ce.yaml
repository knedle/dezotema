  nadpis: Quantum Financial System a MedBeds
  text: '**20. 10.** — Zítko čte další texty o „největším návratu bohatství v historii“. V den, „kdy zaniknou
    banky rothschildovského typu“, zaniknou podle nich i „fiktivní dluhy“ (hypotéky, energie, studentské
    půjčky), protože každý dluh byl „postaven na podvodu“. Rodný list podle nich zakládá „tajný trust
    CESTUI QUE VIE“ v hodnotě milionů dolarů, z něhož banky, soudy a věznice „inkasují“. Jméno psané velkými
    písmeny je „mrtvá právní fikce“ podle námořního práva a soudí se podle „BAR – British Association
    Register“. Duchovním centrem systému je podle nich Vatikán, finančním City of London a „exekutorem“
    Washington DC. Cenu elektřiny označuje za „ojeb“ (Tykač ji prý vyrábí za 15 haléřů, lidé platí přes
    10 Kč). Daňové úřady podle něj „berou provize“, proto Trump „jde po IRS“. Čte také „naléhavou zprávu“
    (Christian B. Wallace) o dohodě o mlčenlivosti, kterou prý podepisují účastníci „skupiny Tier 4b“
    při čerpání peněz z QFS: nesmějí sdělit místo centra, jména ani výši alokace. QFS podle Zítka už v
    některých lokalitách USA běží; přijdou i kvantové telefony a med beds.'
- id: zitko-2026-10-20-05
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: 'Stanné právo, „500 tisíc rozsudků k vykonání“ a Q: „tajná vojenská operace je dokončena“ (Zítko,
    20. 10. 2026)'
  text: |-
    Záběry vojáků v ulicích Albánie a Milána (500 vojáků) jsou podle Zítka začátkem „tolik očekávaného“ vojenského stanného práva („military law“) pod velením „vrchního velitele“ Donalda Trumpa. Při něm má být „dočištěno, co zbývá“ z deep state. Čelní představitelé jsou podle něj už „vyřešeni, to znamená popraveni“ (Guantánamo, „evropské Guantánamo“, Diego Garcia) a lidé sledují „film v repríze“ s 200 000 dvojníky („Central Casting“; „dvojník s maskou je levnější než klon“). Na řadě je „garnitura posluhovačů a přicmrdávačů“: připraveno je prý 500 tisíc rozsudků, „které budou přímo vykonány“, a „vocasy“ z policie, tajných služeb a „hejtrů“ jejich „páníčci“ neochrání. Bill Gates byl podle něj popraven už v roce 2013 „za zvěrstva a očkování v Indii“. Zítko k tomu přidává transfobní poznámky („jsou to většinou buzeranti“, Michelle Obama „Mike Robinson“ i Brigitte Macron „tam mají pindíka“). Proces proti Gatesovi, šéfovi Pfizeru Bourlovi a generálnímu tajemníkovi NATO Ruttemu má podle něj začít 22. 10. v nizozemském Leeuwardenu (žaloba právníka Petera Stassena). TRUMP podle něj znamená „True Republic Under Military Power“. Lavrovovo tričko „CCCP“ na Aljašce vykládá jako signál, že i SSSR byl rozdělen protiprávně, „stejně jako Československo“.

    Předčítá text připisovaný „interpretovi Q“ Miku Kingovi (zdroj „Lion White“): „tajná vojenská operace proti spiknutí deep state již byla v zákulisí zcela provedena“. Podle textu proběhly tisíce zatčení, veřejné osoby nahradili klony či dvojníci, podzemní základny (DUMBs) byly zničeny a přísun adrenochromu zastaven. EBS je připraven zveřejnit důkazy o volebních podvodech a biologických zbraních, aktivace NESARA je „na spadnutí“ a „k žádnému velkému resetu nedojde, čeká nás jen velké probuzení a zlatý věk“. Hru na „falešného Čermáka“ Zítko řadí do téže logiky: dvojník má zachovat „iluzi kontinuity“ justice.

    ⚡ **Poznámka:** O údajném procesu s Gatesem, Bourlou a Ruttem v Leeuwardenu nejsou k datu zpracování dostupné ověřitelné zprávy. Žaloby nizozemského advokáta Petera Stassena proti týmž osobám se v minulosti řešily u soudu v Leeuwardenu jako civilní řízení.
  citace:
  - text: Vy sledujete film v repríze, protože už všichni čelní představitelé deep state byli vyřešeni,
      to znamená byli popraveni. […] Takže je údajně připraveno 500 tisíc rozsudků, které budou přímo
      vykonány.
