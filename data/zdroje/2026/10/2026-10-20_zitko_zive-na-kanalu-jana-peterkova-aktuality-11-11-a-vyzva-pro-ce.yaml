  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**20. 10. (živě, Peterková) — výzva „falešnému Čermákovi“:** Zítko vyzývá „údajného“ Čermáka
    k živé konfrontaci bez záznamu („kdykoliv, kdekoliv“) se sebou, Jiřím Hradilem a dalšími skutečnými
    přáteli, kteří „nevěří“. Navrhuje ji na nové platformě alternativnimedia.cz (prý 130 alternativních
    webů a přes 90 slovenských vysílačů), kam se chystá přesunout z Facebooku. Ověřovat totožnost nemají
    „kámošky Dóry a Macechy“, tedy Bernardy a „šaliňáci“. Popisuje i 27. 8. 2023: Čermáka s Hradilem jen
    „popovezli“ na Moravu, v kraťasech a s poloprázdnou igelitkou („rodinné balení Durexu“). O nástupu
    do výkonu trestu prý nevěděli a celostátní pátrání bylo vyhlášeno až 29. 8. Kvůli tomu je 3. 2. přepadlo
    protiteroristické komando (4 auta, 10 policistů, 4 samopalníci), telefony mu vrátili až 15. 10. po
    roce a osmi měsících a vrchní státní zastupitelství věc podle něj „odložilo a vrátilo policii k došetření“.
    Obvinění z udání je podle něj absurdní: kdo je obviněn z napomáhání k útěku, by „toho dotyčného nesundal“.
    Navíc podle něj Bernardy i Tušl na TV Šalingrad dříve tvrdili, že Čermáka „udala žena“. Parodické
    video („Fénovič… klidně vám prozradím, kde je Čermák“) a grafiky s nápisem „Zítko udavač“ podle něj
    „chystali fízlové tři neděle“. Pravý Čermák je podle něj „na 99,99 %“ v ochraně svědků a „nikdy by
    se proti Rusku neobrátil“.'
  citace:
  - text: Míč, tak jak byl předán v roce 2018 Vladimírem Putinem Donaldu Trumpovi, je na straně Čermáka.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
