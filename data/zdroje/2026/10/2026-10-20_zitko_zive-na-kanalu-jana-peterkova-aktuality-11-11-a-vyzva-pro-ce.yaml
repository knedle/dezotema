  nadpis: Quantum Financial System a MedBeds
  text: '**20. 10.** — Zítko čte další texty o „největším návratu bohatství v historii“. V den, „kdy zaniknou
    banky rothschildovského typu“, zaniknou podle nich i „fiktivní dluhy“ (hypotéky, energie, studentské
    půjčky), protože každý dluh byl „postaven na podvodu“. Rodný list podle nich zakládá „tajný trust
    CESTUI QUE VIE“ v hodnotě milionů dolarů, z něhož banky, soudy a věznice „inkasují“. Jméno psané velkými
    písmeny je „mrtvá právní fikce“ podle námořního práva a soudí se podle „BAR – British Association
    Register“. Duchovním centrem systému je podle nich Vatikán, finančním City of London a „exekutorem“
    Washington DC. Cenu elektřiny označuje za „ojeb“ (Tykač ji prý vyrábí za 15 haléřů, lidé platí přes
    10 Kč). Daňové úřady podle něj „berou provize“, proto Trump „jde po IRS“. Čte také „naléhavou zprávu“
    (Christian B. Wallace) o dohodě o mlčenlivosti, kterou prý podepisují účastníci „skupiny Tier 4b“
    při čerpání peněz z QFS: nesmějí sdělit místo centra, jména ani výši alokace. QFS podle Zítka už v
    některých lokalitách USA běží; přijdou i kvantové telefony a med beds.'
  osoby:
  - osoba: pavel-tykac
    vztah: negativni
    kontext: Elektřinu prý vyrábí za 15 haléřů, lidé platí přes 10 Kč
- id: zitko-2026-10-20-05
  typ: tvrzeni
  temata:
