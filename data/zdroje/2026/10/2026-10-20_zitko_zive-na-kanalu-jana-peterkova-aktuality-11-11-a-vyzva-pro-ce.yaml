  text: '**20. 10.** — Zítko sdílí banner Ivy Millerové, podle níž jsou neplatné všechny zákony vydané
    po přejmenování republiky 29. 3. 1990. Opakuje, že Klaus kandidoval do Federálního shromáždění a Stráský
    do ČNR, po dohodě s Mečiarem si prý „prohodili role“ a Stráský „doklepal“ rozdělení jako premiér bez
    důvěry. Nově dodává, že „nezákonnost“ začala už tím, že Beneš v roce 1948 nepodepsal komunistickou
    ústavu.'
