  text: '**20. 10.** — Zítko opakuje tezi s doplňky: děti „zabodaných“ matek se podle něj rodí pod 2 kg,
    „míra potratovosti u očkovaných je vyšší než 80 %“ a politici, pandemické komise a celebrity dostali
    placebo. Hlavním cílem operace „COVID-19 = Certificate of Vaccination, 19 = AI“ byla podle něj „depopulace
    lidstva“, zisk až druhotný.'
