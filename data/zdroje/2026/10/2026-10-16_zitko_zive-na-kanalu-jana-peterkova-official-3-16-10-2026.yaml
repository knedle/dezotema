  nadpis: Klony, herci a Guantanamo — EBS narativ
  text: '**16. 10. — „krádež identity" a Popelka:** Zítko tvrdí, že „speciální vojenská operace" běží
    přes šest let a některé tahy jsou vidět už od roku 2017. V rámci „central castingu" vystupuje 200
    000 herců, „dablérů" a dvojníků; sám viděl „přes dvacet Donaldů Trumpů" a „přes dvacet Vladimírů Putinů"
    a vše bude zveřejněno při „velkém odhalení". Krádež identity podle něj „není nic nového": dokládá
    ji scénou z pohádky *Tři oříšky pro Popelku*, v níž macecha podstrčí princi pod pláštěnkou Doru místo
    Popelky. Popelku přirovnává k „původnímu" Čermákovi. Podle „snímků, kteří herci hrají které osobnosti",
    má JD Vance hrát zesnulý herec Paul Walker: „živí budou mrtví a mrtví budou živí".'
- id: zitko-2026-10-16-04
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Klony, herci a Guantanamo — EBS narativ
  text: '**16. 10. — EBS do 72 hodin:** Zítko čte zprávu přeposlanou od Barbary Pražské, Vladimíry Avdičové
    nebo „Jany Jany", podle níž bude EBS „potvrzeně ze dvou nezávislých zdrojů" aktivováno do 72 hodin.
    Sám data „nemá rád", protože je zná „asi 10 lidí na světě", ale odhaduje, že by se to mělo stát před
    americkými volbami do Kongresu (midterms), s možným posunem o 13 dní kvůli rozdílu gregoriánského
    a juliánského kalendáře. Text slibuje 3 až 10 „dní temnoty" a osmihodinové smyčky 24 hodin denně na
    všech kanálech, šířené přes Starlink. Nemá jít o varování, ale o „odhalení", a vše má být součástí
    přechodu na QFS (Tier 4b / ISO 20022, „návrat ke krytí aktiv zlatem"). Pokyny zní: nepropadat panice
    („zatemnění není konec, je to brána"), zůstat doma, nechodit do nemocnic ani na policii, nepřekážet
    armádě, která „není váš nepřítel", a mít nabitá zařízení a zásoby vody a jídla. Zítko dodává, že se
    dlouho čekalo kvůli hrozbě občanské války „kvůli těm vymletým NPCčkům" a že mu NCTEKK možná proto
    vrátila telefony. Rakušan prý posílal instrukce „na 72 hodin".'
