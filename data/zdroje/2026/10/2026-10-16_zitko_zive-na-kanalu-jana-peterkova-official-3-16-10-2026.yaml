  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: |-
    **16. 10. — „vylákat a zavřít" a seznam „mediálních hrobníků":** Zítko na půjčeném kanálu Jany Peterkové předkládá novou verzi. Podmíněné propuštění „údajného" Čermáka má podle něj vylákat pravého Čermáka z úkrytu („pod dojmem, že už to není trestné") a zavřít ho. Podle policejního prezidia je totiž propuštění po polovině trestu u odsouzeného, který nenastoupil do výkonu trestu, téměř vyloučené: hrozí mu prý maření výkonu úředního rozhodnutí (2 roky) a za „video z lesa" dalších 5–15 let. Pravému Čermákovi vzkazuje, ať zůstane v úkrytu, a čekají ho „na tanku s Prigožinem nebo s Kadyrovem".
    - **Požadavky na důkaz:** biometrická data, změření, DNA a test otcovství nebo otisky prstů, ovšem ne v „cinknuté" laboratoři typu Slovenské akademie věd. Jinak jen živá konfrontace u jednoho stolu se Zítkem a Hradilem. Pravý Čermák by to měl „obrovsky jednoduchý", ale figurant se podle něj setkání „bojí jako kříže".
    - **Justice:** Pavel Novotný, starosta Řeporyj, který podle Zítka „vybízel k zabíjení žen, dětí, zapálit barák", dostal jen tři měsíce, kdežto Čermák 5,5 roku. Justiční stráž mu prý už v červenci 2023 u Vrchního soudu v Praze o přestávce řekla, že rozsudek bude potvrzen, takže „rozsudky jsou napsány dopředu". Připomíná, že po výslechu ho NCTEKK po půlnoci „vyplivla" na Zbraslavi do mrazu bez telefonu a počítače.
    - **Bernardy a Novas:** Renata Bernardy má prý „zpravodajské informace", že za profilem „Tomáš Kvatro Čermák 2026" stojí Dan Novas, „údajný přítel" Lenky Tarabové. Zítko odmítá její tvrzení, že za covidu bral 400 tisíc měsíčně, a TV Šalingrad nazývá „uzavřenou sektou".
    - **„Mediální hrobníci":** Bernardy podle něj zařadil do dlouhé řady těch, kdo ho „mediálně pohřbili": Jiří Černohorský („jedenáctiletý"), Jan Macháček, Libor Malý („kulatozemec" s pokusem „Globus a baterka"), Vlasta Mádlo, David Nemeth („ochrankář ze supermarketu"), Zdeněk Mojmír Ponert („pan Klobouk"), „korporátník" Jindřich Rajchl, Petula Rédová z Kapky krve (kauzu použila „jako výtah do senátu"), Lenka Tarabová a Patrik Tušl („nosí tričko Česko a ne Československo"). Manžele z Jablonce nad Nisou viní, že „ukradli" pergamen deklarace a podpisové archy i peníze, které mu lidé posílali do vazby; předali mu prý jen 5 000 Kč na telefon a tisícovku. Spravovali podle něj i peníze ze sbírky pro Čermáka.
  citace:
  - text: Tomáši, pokud mě posloucháš, rozhodně nikde nevylejzej a zůstaň v bezpečí tam, kde seš, protože
      tvůj čas teprve přijde.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-16-03
  typ: tvrzeni
