- id: rajchl-2026-10-18-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Dovoz pracovníků z Filipín a Indonésie tlačí dolů mzdy; pracovní agentury jako „vyděračské gangy“;
    zrušit dávky (Rajchl, 18. 10. 2026)
  text: |-
    Rajchl nesouhlasí s plánem Babišovy vlády zvýšit kvóty pro pracovníky z Indonésie a Filipín. Cizinci zvyklí na jiné podmínky nebo Ukrajinci, kteří k mzdě pobírají 10–15 tisíc Kč dávek, jsou ochotni pracovat za 20 tisíc, za které Čech „nezaplatí ani nájem, energie, potraviny a léky“. Vzniká tak nerovnováha, kdy Češi buď práci nemají, nebo pracují za neadekvátní mzdu a musí brát druhou a třetí práci, „cesta do pekel“. Přínos mají jen velcí zaměstnavatelé a „nadnárodní korporace“, kterým se líbí „otrocká mzda“ přes pracovní agentury, jež „nejsou ničím jiným než vyděračskými gangy“. ČR podle něj nemá nedostatek práce, ale „nedostatek adekvátně zaplacené práce“.

    Jako řešení navrhuje snížit dávky „notorickým nemakačenkům“ a přebudovat sociální systém na adresný, zeštíhlit stát a zrušit zbytečné agendy diktované EU. Snížení dávek Ukrajincům na polovinu, které prosadil klub SPD, je podle něj málo: dávky by „už neměly být žádné“ (kromě zdravotně postižených). Nezaměstnanost Ukrajinců v produktivním věku uvádí na 25 % oproti 5 % u Čechů: kdo tvrdí, že jsou výdělečnější, „je prostě blázen“. Navazuje na [Ukrajinská migrace: rozsah, kriminalita a plán revize pobytu, 16. 8.](#ukrajinská-migrace-rozsah-kriminalita-a-plán-revize-pobytu-rajchl-16-8-2026).
  citace:
  - text: U nás je nedostatek adekvátně zaplacené práce.
- id: rajchl-2026-10-18-04
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: '„Cestovní agentura Petra Pavla“: let do Maroka jako klientelismus; Eva Pavlová jako „soukromá
    osoba“ nemá dostávat 106 tisíc (Rajchl, 11. 10. 2026)'
  text: '**18. 10.** — Pavlovo vysvětlení přineslo podle Rajchla „víc otázek než odpovědí“ a jde o větší
    skandál než ten, kvůli němuž odstoupil Ondřej Prokop z čela pražské kandidátky ANO. Pavel podle něj
    tvrdí, že za místo v letadle do Maroka zaplatil 2 750 € a za let na volby do Černoučku a zpět 15 000
    €, přestože komerční cena speciálně objednaného letu Casablanca–Praha–Casablanca je asi trojnásobná
    („pod milion korun to nepořídíte“). S Pavlem letěli dva jeho známí tam i zpět. Jediné logické vysvětlení
    je podle Rajchla, že dvě třetiny ceny zaplatil někdo jiný, aby Pavel nemusel přiznat milion, a „to
    je také forma korupce… pay for play, quid pro quo“. Je přesvědčen, že Pavel měl letět zdarma jako
    host miliardáře a zaplatil až dodatečně kvůli kritice („damage control“). Ptá se, kdo letadlo objednal
    („co když to byl nějaký zbrojař… někdo z nepřátelské moci?“) a zda cestu nezaplatil Orlen výměnou
    za reklamní spot. Pokud platil někdo jiný, měl by Pavel „rezignovat a abdikovat“. Opakuje žádost podle
    zákona 106/1999 o vyúčtování doprovodu placeného z daní a srovnání s Wulffem a Grossem. Pavla označuje
    za „bolševického papaláše“, „falešného do morku kostí“: flanelová košile je „jenom maska“, a „jakmile
    zhasnou světla kamer“, přichází „luxus, šampaňské, miliardáři, soukromá letadla“. Pokud si může dovolit
    soukromé lety, je podle něj „na čase se zamyslet nad výší jeho platu a apanáže jeho manželky“. Média
    podle něj téma pojala „povrchně“ a uplatňují „dvojí metr“: jeho cesta autem do Maďarska, kterou si
    platil sám, byla na titulních stranách.'
  citace:
  - text: Ta flanelová košile je jenom maska. On se je snaží prezentovat jako člověk z lidu, ale ve skutečnosti
      je to prostě bolševický papaláš.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Bolševický papaláš“, „falešný do morku kostí“; při cizí úhradě letu má abdikovat
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-10-18-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Mír bude odrážet aktuální kontrolu území — čím déle válka trvá, tím hůř pro Ukrajinu (Rajchl,
    12. 7. 2026)
  text: |-
    **18. 10.** — „Trump si vybral stranu, a není to Zelenský“: Zelenský podle Rajchla „kousal do ruky, která ho krmí“, a Trump nad ním „zlomil hůl“, „a je to dobře“. Konec války podle něj nastane jen odchodem Zelenského a zastavením „pumpování peněz“ jeho „korupčním kamarádíčkům“. Kromě nákupu ruské ropy a pozastavení sankcí (viz [Ceny energií](ceny-energie.md)) Trump s Muskem omezili Ukrajině Starlink, takže ukrajinská armáda „poslepla“. Důvodem je podle něj, že Trump nechce útoky na ruské rafinérie. Ukrajina podle něj prohrála, „což bylo jasné od počátku“. Boris Johnson jako „emisar“ zmařil mírovou dohodu, kterou navrhla ukrajinská strana a obě strany parafovaly, protože Evropa odmítla dát bezpečnostní záruky. Dva miliony mrtvých, stovky miliard a zničená Ukrajina jsou podle něj výsledkem „arogance a vyčuranosti“ evropských politiků, kteří vyměnili lidské životy za „zbrojařské kšefty“ a za strašení Ruskem ve volebních kampaních („ruské tanky na Smíchově“, Petr Fiala). Strach podle něj „vypíná lidem mozek“: Rusko by na obsazení Ukrajiny potřebovalo 6 milionů vojáků, ale má 1,5 milionu. Předpověď mírové dohody zpřesňuje: až padne Kramatorsk a Slovjansk, Rusko dostane zbytek Doněcké oblasti a vrátí část Charkovské (viz [predikce](predikce.md)). „Chcimíři“ podle něj navrhovali nejlepší řešení pro Ukrajinu, ne pro Rusko: „Vy jste tu Ukrajinu obětovali, vy máte na rukou takovou krev.“

    K Zelenského žádosti o dalších 70 mld. € k dubnové půjčce 90 mld. € připodobňuje jeho chování k narkomanovi, který si stále půjčuje „na jídlo a práci“ a vše „profetuje“. Zelenský podle něj peníze utratí za „luxusní vily, sportovní auta, zlaté záchody, zlaté bidety“. Babišovo prohlášení, že ČR nebude za půjčku ručit, je podle něj málo a ČR by se měla přidat k Maďarsku a Slovensku proti další půjčce, protože „krmit narkomana je cesta do pekel“. Zelenský s Timurem Mindičem podle něj rozkradli peníze na energetickou infrastrukturu („hyenismus naprosto nejtěžšího kalibru“) a „pokud někdo patří do Haagu, tak zcela jistě Zelenský na prvním místě“.
  osoby:
  - osoba: boris-johnson
    vztah: negativni
    kontext: Zmařil mírovou dohodu parafovanou Ukrajinou i Ruskem
  - osoba: petr-fiala
    vztah: negativni
    kontext: Strašení „ruskými tanky na Smíchově“ kvůli politickým bodům
  podtema: Vyjednávání a mír
- id: rajchl-2026-10-18-06
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: 'Senátní kandidáti PRO/koalice: Loprais, Skalický, Beran, Šorna — „ani korunu na Ukrajinu" (Rajchl,
    27. 9. 2026)'
  text: |-
    **18. 10. — výsledky 2. kola:** Do Senátu neprošel ani jeden kandidát koalice. Fakticky to podle Rajchla znamená ztrátu jediného senátora ANO, ale to je „jenom chlácholení se“. První příčinou je, že se strany nedohodly na společných kandidátech: měsíce předtím navrhoval rozdělit 27 obvodů (18 ANO, 3–4 SPD, 3 Motoristé, po jednom Svobodní, PRO a Trikolóra). Voliči favoritů vyřazených v prvním kole pak do druhého nepřijdou. Totéž bude platit pro prezidentskou volbu. Opozice podle něj nepotřebuje program, stačí jí „zastavte Babiše, udržte Senát demokratický“, což je „oxymoron“. Všechny strany jsou demokratické, „kromě mafiánského hnutí STAN“. Pecková „ani žádný program nemá v hlavě“. Druhou příčinou je frustrace voličů z pomalého plnění slibů (Česká televize, zákon FARA). Rajchl uznává, že je „nejvyšší čas“ je splnit, ale dřívější řešení ČT by podle něj zablokovalo služební i stavební zákon a jednací řád. Ohlašuje návrh, „který napraví některé křivdy“, a představí ho na tiskové konferenci.

    Výtky má i k voličům: při účasti 21 % „můžeme si za to sami“. Výzvu podpořit Baránkovou a Daňhovou mnozí odmítli, a teď budou šest let nadávat, že Karel Řehka „bude chodit do televize a vyprávět, že je potřeba připravovat se na válku s Ruskem“. Ve druhém kole se volí „reálně menší zlo“ a postoj „mně je to jedno“ je „poraženecký“. Politik, který si drží „židličku“ místo spojení, je „sobec, který nemá v politice co dělat“. Jemu samému je jedno, kde bude na kandidátce, nesmí ale vládnout „Rakušan a spol.“. Kladně hodnotí, že ze Senátu vypadli Piráti („extremistická strana“; konfrontační politika Zdeňka Hřiba „neslaví úspěch“) a Martin Dvořák, „nejzbytečnější ministr na nejzbytečnějším ministerstvu“, který označil korunu za „pidiměnu“: „o každého chciválka v Senátu míň, o to lépe“.
