- id: rajchl-2026-10-18-07
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'po pádu Kramatorsku a Slovjansku mírová dohoda: Rusku zbytek Doněcké oblasti, Ukrajině kus
    Charkovské'
  text: 'Za pár měsíců padne Kramatorsk a Slovjansk a „přijde na stůl mírová dohoda“: Rusko dostane zbytek
    Doněcké oblasti a vrátí část Charkovské oblasti, „o kterou nestojí“. Zpřesnění predikce z 11. 10.'
  citace:
  - text: Vzpomeňte si na mě za pár měsíců, až padne Kramatorsk a Slovjansk, tak přijde na stůl mírová
      dohoda, že v podstatě Rusku se přiklepne zbytek Doněcké oblasti, Rusko vrátí kousek té Charkovské
      oblasti, o kterou nestojí, a konečně bude mír.
  predikce:
    horizont: „za pár měsíců“
    stav: ceka
