vyroky:
- id: vrabel-2026-10-16-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Hybridní válka počasím“ — USA manipulují počasí ve všech státech; záplavy v Istanbulu (Vrabel,
    16. 10. 2026)
  text: 'Ke zprávě o záplavách v Istanbulu (4 oběti) Vrabel tvrdí, že v Íránu „50 let nepršelo“ a začalo
    pršet, až když Íránci sestřelili americký „radar“. „Řekněte mi, že Američani nekontrolujou a nemanipulují
    počasí ve všech státech světa. Všechny ty zemětřesení, chemtrails, to, co na nás sypou, sucha, povodně.
    Řekněte mi, že v tom nemají prsty.“ Istanbulské záplavy podle něj nebyly přírodní, ale „nějaká hybridní
    válka skrze počasí, kterou dělají Spojené státy, respektive globalisti“. Sám dodává: „Nemám pro to
    žádný důkaz, je to jenom něco, co si myslím.“'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-16-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**16. 10.** — Vrabel poprvé otevřeně („mluvím dneska o tom poprvé“) líčí Ukrajince v ČR jako
    bezpečnostní riziko. V ČR je jich podle něj „nějaké dva miliony“, a „v okamžiku, kdy ty Ukrajinci
    začnou něco požadovat a budou si za tím tvrdě stát, tak se celá Evropa bude bát Ukrajinců na ulicích“.
    Odkazuje na Polsko (zapalování bytů, výhrůžky po omezení dávek). Kdyby ČR zrušila muniční iniciativu,
    mohl by přijít „tlak zdola… třeba nějaký terorismus“: „Vemte si, kolik je tady Ukrajinců, a kolik
    z nich bude pravděpodobně ozbrojených.“ Dvacet milionů Ukrajinců rozprostřených po Evropě je podle
    něj „dynamit, který čeká na to, aby byl odpálený“. „Nestrkejte Ukrajince do České republiky po milionech.
    Nestrkejte, může to chytnout.“ (viz [Stochastický teror](stochasticky-teror.md))'
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: V Srbsku přemlouval ke vstupu do EU, „podřízenost globálním strukturám“
- id: vrabel-2026-10-16-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Státní zástupce, který zastavil stíhání Čecha z ukrajinské armády, „má jít do vězení“ (Vrabel,
    5. 10. 2026)
  text: '**16. 10.** — Ke stíhání švýcarského novináře Lukase Hässiga (bankovní tajemství, Raiffeisen)
    Vrabel připomíná vlastní boj proti korupci v Českých Budějovicích od roku 2003, kvůli němuž byl prý
    „zlikvidován ekonomicky“: „ze státu se vždycky stane příšera, která žere vlastní lidi“. Mezi oběti
    „režimu“ řadí Reinera Fuellmicha („náš kamarád“, ve vězení ho prý „velmi týrají“), Assange, Russella
    Branda a jednoho ze šéfů AfD. Fuellmichův záměr vytvořit „lidové soudy, které by byly silnější než
    ten státní aparát, které by soudily tuhle mafii, kde by padaly rozsudky a potom by se vykonávaly“,
    označuje za „velmi dobrou myšlenku“. Sám je v podmínce a „každý den se modlí, aby nešel do vězení“.
    Albánské protesty (Rama, resort Jareda Kushnera) podle něj ukazují, že „dneska už je to boj státu
    proti lidem“, a Babiš „je proti lidem v České republice“.'
  osoby:
  - osoba: reiner-fuellmich
    vztah: pozitivni
    kontext: „Náš kamarád“, týraný ve vězení; „lidové soudy“ jako dobrá myšlenka
  - osoba: lukas-hassig
    vztah: pozitivni
    kontext: Novinář pronásledovaný za odhalení korupce
  podtema: Kritika soudnictví
- id: vrabel-2026-10-16-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Suverenisté jsou postupně likvidováni — Orbán „zlikvidován“, Fico „na řadě“, Vučič jako poslední;
    Babiš má „max. 5 %“ (Vrabel, 15. 10. 2026)
  text: '**16. 10.** — Na Babišův výrok, že „Trump nás podrazil“ dohodou s Putinem o ruských palivech,
    Vrabel odpovídá, že Trump podrazil všechny tím, že „řekl, že bude mírovým prezidentem… a mezitím rozjíždí
    nové obrovské války“. Dohodou o ruské ropě ale nepodrazil, „protože to je to, co my vám tady říkáme
    od roku 2022“. Babiš podle něj místo výzvy z Malostranského náměstí (ČR jako zprostředkovatel míru)
    přenechává mír EU, která „žádný mír nechce“, a dostává od něj „pětku“. Fica, který odjel ze summitu
    podpořit Vučiće, chválí: „takhle se má dělat politika“. Babiš je naopak „Slovák, který ani neumí česky“
    a „měl vždycky zastupovat jenom Slovensko“. Okamura podle něj v Srbsku přemlouval politiky ke vstupu
    do EU, což je „podřízenost globálním strukturám“. V Srbsku „to, co Srbové vydělají, zůstává doma“,
    ČR to „odvádí na Ukrajinu, do USA nebo do EU“. K neshodě o rozpočtu EU říká, že se lídři stejně dohodnou,
    ale EU nakonec rozloží občanská válka, „říkám to už 20 let“. ČR by proto měla vystoupit dřív, „protože
    každý rozpad takhle velkého celku doprovází většinou spousta krve“. Rozkol USA–EU je podle něj sehraný,
    aby „do té války šla Evropa, a ne Spojené státy“. Babiš se přiklonil k EU kvůli chemičkám v Německu
    a dotacím Agrofertu. Ukrajina bude „součástí EU velmi rychle“ a „bude trénovat a částečně řídit naše
    armády“.'
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: „Pětka“, „Slovák, neumí česky“, přiklonil se k EU, „je proti lidem v ČR“
  - osoba: robert-fico
    vztah: pozitivni
    kontext: Podpořil Vučiće, „takhle se má dělat politika“
  podtema: Česká suverenita
- id: vrabel-2026-10-16-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**16. 10.** — Trump má podle Vrabela pravdu, že zbraně pro Ukrajinu (350 mld. USD) skončily na
    černém trhu, ale je pokrytec: konflikt se nejvíc rozehrával za jeho prvního mandátu (výcvik, „buňky
    CIA“) a i dnes posílá zbraně, zpravodajské informace a internet, jen to nechává platit Evropany. Ukrajinské
    zbraně jsou podle něj „v České republice někde v různých bytech poschovávané a čekají, nebo v Německu,
    nebo v Polsku“ a objevují se v Jižní Americe a při teroristických útocích. Evropští politici jsou
    „lumpové“, kteří Trumpovi peníze z daní „odlifrujou“, když jim dá „20 % do kapsy“. Zelenskyj je „diktátor
    bez mandátu“, ale „psychologicky udělal velmi dobře“, když se Trumpovi postavil.'
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: „Diktátor světa“, „potřebuje dostat ránu mezi oči“ (→ [stoch. teror](../stochasticky-teror.md))
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-16-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**16. 10.** — Ke zprávě Reuters o íránském vývozu paliv navzdory americké blokádě se Vrabel ptá
    „cui bono“: z drahé ropy profitují USA, a proto válku na Blízkém východě rozpoutaly („za A Spojené
    státy, za B Spojené státy, za C Spojené státy“). Vyzývá, aby se „všechny státy spojily proti Spojeným
    státům a daly jim sankce, embargo… popřípadě nějakým jiným způsobem je dotlačily“, aby přestaly být
    „bully“. K Lukašenkovu odmítnutí Trumpova výroku o novém ukrajinském prezidentovi říká: „Donald Trump
    se chová absolutně jako diktátor… diktátor světa“ (Grónsko, Venezuela, Írán). Respektuje jen sílu,
    Putina a Kima, a „to je člověk, který potřebuje dostat prostě ránu mezi oči, aby přestal. A on přestane“
    (viz [Stochastický teror](stochasticky-teror.md)).'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-16-07
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: 'Nízká účast ve 2. kole Senátu: politici z protestů se „otočili“ kvůli funkcím; Hamplová „to
    zobchodovala“ (Vrabel, 16. 10. 2026)'
  text: 'Nízkou účast ve 2. kole senátních voleb Vrabel vysvětluje tím, že řečníci z protestů let 2021–2023
    se „otočili“ a kandidují kvůli funkcím: „Všichni jsou ochotní jít s Babišem… s Evropskou unií… s NATO…
    proti Rusku… s globalisty, jenom aby měli nějakou funkci.“ Výjimkou jsou senátorka Kovářová („snad
    jediný normální senátor“) a europoslanec Ivan David („jediný normální“). Popisuje zákulisí demonstrace
    3. 9.: senátorka Jana Zwyrtek Hamplová ho prý s pláčem prosila, aby směla demonstraci zakončit, a
    lobboval za ni i Rajchl. Druhý den se ale od účastníků distancovala, protože zprávy mluvily o „proruských
    kolaborantech“, a v Senátu nic neprosazovala: „ta to zobchodovala“, „obrovské zklamání“. Kladně zmiňuje
    energetického odborníka Ivana „Noveského“, „Vladimíru Výtovou“ a Davida Tesáře, kteří se „nezkazili“.
    Ke zprávě, že Zelenskyj žádá 70 mld. eur, dodává, že Babiš „zvedne pravačku, odmává dalších 70 miliard“
    a „Češi to v klidu zaplatí“.'
  osoby:
  - osoba: hamplova
    vztah: negativni
    kontext: „Zobchodovala to“, „obrovské zklamání“
  - osoba: ivan-david
    vztah: pozitivni
    kontext: „Jediný normální europoslanec“
  podtema: Komunální volby
- id: vrabel-2026-10-16-08
  typ: predikce
  temata:
  - migrace
  nadpis: do roka hrozí v ČR „tlak zdola“ a terorismus ze strany Ukrajinců
  text: Pokud by ČR omezila podporu Ukrajiny (např. zrušila muniční iniciativu), může do roka přijít „tlak
    zdola“ až terorismus ze strany (zčásti ozbrojených) Ukrajinců v ČR.
  citace:
  - text: Za rok, jak se ta situace postupně mění, možná už to nebude tak jednoduchý udělat. Protože možná
      už tam bude tlak nejenom ze strany Evropské unie, ale může tam být taky tlak zdola. Taky jako myslím
      třeba na nějaký terorismus nebo na něco takovýho. To se může stát na území České republiky.
  predikce:
    horizont: do října 2027
    stav: ceka
- id: vrabel-2026-10-16-09
  typ: predikce
  temata:
  - suverenita-eu
  nadpis: EU rozloží občanská válka; Ukrajina bude „velmi rychle“ v EU a bude řídit evropské armády
  text: Evropskou unii nakonec rozloží občanská válka; Ukrajina se velmi rychle stane členem EU a bude
    trénovat a částečně řídit evropské armády; rozkol USA–EU je sehraný, aby do války šla Evropa.
  citace:
  - text: Osobně si myslím, a říkám to už 20 let, že to nakonec k rozpadu Evropské unie povede, protože
      v Evropě bude občanská válka. […] Takže Ukrajina bude součástí Evropské unie velmi rychle. […] Ukrajina
      bude trénovat. A částečně řídit naše armády.
  predikce:
    horizont: neurčeno
    stav: ceka
