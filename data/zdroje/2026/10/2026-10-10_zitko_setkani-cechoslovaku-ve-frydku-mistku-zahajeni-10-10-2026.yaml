  nadpis: Klony, herci a Guantanamo — EBS narativ
  text: '**10. 10.** — Zítko při zahájení setkání ve Frýdku-Místku varuje, že se „to“ (blackout nebo jiné
    „překvapení“) blíží; „už to dokonce bylo i v nějakém seriálu“. Na otázku, kdy to bude, odpovídá, že
    „to ví asi deset lidí na světě“ a on mezi nimi není, proto sleduje ty, kdo to vědí, i když nevystupují
    v televizi a působí jako „naprostá menšina“. Opakuje i dvojníka prezidenta USA (původní „byl popravený“).'
