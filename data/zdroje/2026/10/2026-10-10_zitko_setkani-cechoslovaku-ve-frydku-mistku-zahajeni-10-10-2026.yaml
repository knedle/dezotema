  text: '**10. 10.** — Při zahájení setkání ve Frýdku-Místku Zítko poznamenává, že by sázkové kanceláře
    mohly vypsat kurz „je to on, není to on“. Opírá se o tezi, že lidem čtyři roky „servírovali dvojníka
    jako prezidenta Spojených států“, zatímco původní byl popraven: „no tak co by to nezkusili s nějakým
    Čermákem“. Totéž vztahuje i na Petra Pavla („ten náš vojtý agent“): na zveřejněné fotografii má být
    vidět „natažená maska“, což prý někdo vysvětluje „rýmou v krční oblasti“.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
