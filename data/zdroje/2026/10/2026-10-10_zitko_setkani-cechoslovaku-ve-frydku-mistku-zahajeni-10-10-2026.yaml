  nadpis: „Vítězné mocnosti" Trump, Putin, bin Salmán a Módí rozhodnou o obnově Československa; volby
    20 let falšovány (Zítko, 24. 9. 2026)
  text: '**10. 10.** — V den setkání ve Frýdku-Místku Zítko poznamenává, že „nenáhodou“ právě probíhají
    volby „do korporátních orgánů, nikoliv do státních“, a s odkazem na svého „nadělání“ dodává, že „není
    koho volit“. Pravda podle něj „vůbec není záležitostí většiny“: i jediný člověk může mít správné řešení,
    zatímco ostatní se mýlí.'
- id: zitko-2026-10-10-04
