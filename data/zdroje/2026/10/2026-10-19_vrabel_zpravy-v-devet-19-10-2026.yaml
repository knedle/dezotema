vyroky:
- id: vrabel-2026-10-19-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Húsíové tvrdí, že ukončili vojenskou kampaň a ovládli Bab al-Mandab (Vrabel, 12. 9. 2026)
  text: '**19. 10.** — K odložení saúdské investiční konference Future Investment Initiative („Davos v
    poušti“) na rok 2027 kvůli útokům Húsíů (mj. na sídlo Aramca a letiště v Rijádu) Vrabel říká, že za
    tím „zase zatím stojí Donald Trump a Spojené státy“. Saúdská Arábie podle něj nechtěla prodloužit
    dohodu o americké ochraně výměnou za prodej ropy pouze v dolarech, a tak USA zaútočily na Írán a rozpoutaly
    válku, která míří i proti Saúdům, Emirátům a dalším zemím v oblasti: „Takhle funguje mafie… když se
    nenecháte chránit, tak vám tam rozpoutají válku.“ Obává se, že válka na celém Blízkém východě vyvolá
    „velkou migrační vlnu“ (viz [Predikce](predikce.md)).'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-10-19-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Babišova výzva médiím: „média zdivočela“ — licence a likvidační pokuty za válečnou propagandu
    (Vrabel, 19. 10. 2026)'
  text: 'K výzvě premiéra Babiše, aby česká média nemanipulovala veřejným míněním a vyhýbala se osobním
    útokům, Vrabel říká, že s ním „obecně“ musí souhlasit: média „zdivočela“ a člověk neví, zda stát řídí
    vláda, nebo média. Patří podle něj oligarchům s podíly ve výrobě dronů nebo je sponzorují výrobci
    zbraní, proto dělají „válečnou propagandu“ a jdou proti politikům, kteří jim „nechtějí jít na ruku“.
    Opakovanou lží o „bezdůvodném“ ruském útoku na Ukrajinu jsou podle něj lidé po čtyři a půl roku zmatení.
    Navrhuje nový mediální zákon: oddělit zpravodajství od publicistiky, zavést pro všechna média licence
    a za porušení novinářské etiky, manipulaci či „nedej bože válečnou propagandu“ je „okamžitě ekonomicky
    zlikvidovat na pokutách“ a sebrat jim licenci. Babišovi vyčítá, že mu to „začalo vadit až teď“ a že
    vláda žádnou mediální reformu nepřipravila. Vyjmenovává mediální „popravy“: Vít Bárta se podle něj
    stal „nepřítelem číslo jedna“, protože se nepohodl s kmotry s přístupem k tajným službám, dále Petr
    Nečas, David Rath i Babiš (kauza syna), který ale dnes „jde ruku v ruce s tajnýma službama“. Sám je
    podle svých slov příkladem: od roku 2002 byl v Českých Budějovicích „miláčkem médií“, po demonstracích
    v roce 2022 z něj média udělala „kriminálníka“ (jízda bez lístku jako student, údajné dotace na neexistující
    firmy, otázka Bastlové, zda neukradl peníze na demonstrace). Žalovat média podle něj nemá smysl, odrazoval
    ho od toho i Jiří Paroubek.'
  citace:
  - text: Média jsou velmi nebezpečný nástroj, pakli, že dělají válečnou propagandu a to je to, co dělají
      dneska prakticky všechna média v České republice.
  osoby:
  - osoba: vit-barta
    vztah: pozitivni
    kontext: Oběti mediálních „poprav“; Bárta se stal „nepřítelem číslo jedna“ kvůli sporu s kmotry s
