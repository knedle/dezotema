    kontext: Odrazoval ho od žalob na média (roky soudů, omluva „někde vzadu“)
  podtema: Nová alternativní média
- id: vrabel-2026-10-19-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**19. 10.** — K nepokojům ve Francii (zákazy vycházení, možný výjimečný stav) Vrabel opakuje,
    že nejde o studenty, ale že protesty „vždycky přeberou… muslimové, migranti“. Rozlišuje tři skupiny:
    levicové radikály („antifa, poblázněnci“), kteří protestují z přesvědčení; migranty, kteří chtějí
    chaos, protože „nemají rádi Francii“, chtějí, „aby tam platilo právo šaria“, a nenávidí Macrona kvůli
    Palestině; a rabující. Podle videí, na nichž „demonstranti, pravděpodobně migranti“ napadají kladivy
    obyvatele bránící svá auta nebo zbijí promigrační majitelku obchodu, už jde o „občany proti občanům“,
    tedy o „občanskou válku“ v malém a „první příznaky“ toho, co prý předpovídá 20 let. Pokud ČR nezavře
    hranice a nevystoupí z EU, „vlak dojede“ i sem, protože migrační pakt od roku 2027 přinese migranty
    z islámských zemí (viz [Predikce](predikce.md)). V souvislosti s 70 mld. eur pro Ukrajinu navrhuje
    ponechat Ukrajincům v ČR jen status válečných uprchlíků bez sociálních dávek, ať „makají“, a po válce
    „mažete zpátky na Ukrajinu“. Rusové v Srbsku se podle něj chovají slušně, „protože Srbové by umlátili
    čepicema, kdyby začali se chovat jako Ukrajinci v České republice“ (viz [Stochastický teror](stochasticky-teror.md)).
    K odložení saúdské konference FII varuje, že válka na celém Blízkém východě může vyvolat „velkou migrační
    vlnu“.'
- id: vrabel-2026-10-19-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Demokracie = vláda elit, ne lidu" — Vrabel (19. 6. 2026)
  text: '**19. 10.** — K tomu, že vláda nesníží daň z příjmu firem z 21 na 19 %, ačkoli to slíbila, Vrabel
    říká, že by se nemělo mluvit o „nesplněných slibech“. Volební program i programové prohlášení vlády
    jsou podle něj „dvoustrannou smlouvou“ mezi voličem a politikem, politici jsou „našimi zaměstnanci“
    s pracovní smlouvou v podobě programu, a pokud ho neplní, „mají být odvolení“; bez této změny systému
    „se nepohneme z místa“. Peníze na snížení daní podle něj chybí, protože jdou na zbraně pro Ukrajinu
    a do „rekordního“ rozpočtu EU. K problémům amerických farmářů opakuje, že západní demokracie „nemá
    vůbec co dělat s demokracií“: lidé si jen mohou vybrat, kdo je bude podvádět, volby se ovlivňují médii,
    pětiprocentní hranicí a Ústavním soudem a z „rabování“ se po roce 2019 přešlo k „drancování“, z něhož
    profitují lidé jako Křetínský a Strnad. Zároveň popisuje, co by udělal, kdyby ho lidé zvolili: nejdřív
    by si pořídil „soukromou ochranku, která by byla něco jako armáda“, pak by si pozval významné podnikatele
    a řekl jim, „tak jak to udělal Putin, že buď budou spolupracovat s tím státem, anebo budou mít problém“,
    a zajistil by si loajalitu armádních generálů. „A pak bych teprve šel vládnout. Protože myslím si,
    že by mi usilovali o život každej den.“'
  osoby:
  - osoba: daniel-kretinsky
    vztah: negativni
    kontext: Profitují z drahé elektřiny a zbraní, zatímco 99,9 % lidí trpí
  - osoba: michal-strnad
    vztah: negativni
    kontext: Profitují z drahé elektřiny a zbraní, zatímco 99,9 % lidí trpí
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-10-19-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Suverenisté jsou postupně likvidováni — Orbán „zlikvidován“, Fico „na řadě“, Vučič jako poslední;
    Babiš má „max. 5 %“ (Vrabel, 15. 10. 2026)
  text: '**19. 10.** — K Babišovu ujištění, že vláda nezavede emisní povolenky ETS2 pro budovy a silniční
    dopravu, Vrabel opakovaně klade otázku „proč nevystoupí z Evropské unie?“: totéž podle něj platí pro
    migrační pakt, další peníze na Ukrajinu (70 mld. eur) i zemědělské dotace, které EU použije „na zbraně“,
    a Babiš přesto lidem brání v referendu. Babiš podle něj vždy dělá opak toho, co řekl (muniční iniciativa,
    F-35, daně pro podnikatele, schodek), takže je „99 ku 1“ jisté, že jakmile EU povolenky zavede, vláda
    je přijme „100 %“: „Andrej Babiš sklapne krovky a udělá to.“ Odklad pro firmy je podle něj rozhodnutím
    EU, ne Babiše. „Brusel je nadřízený Praze“, suverénní by Praha byla teprve po vystoupení (viz [Predikce](predikce.md)).'
  osoby:
  - osoba: andrej-babis
    vztah: rozporuplny
    kontext: S výzvou médiím „obecně“ souhlasí („média zdivočela“), ale nesnížil daně firmám, ETS2 přijme,
      až EU řekne („sklapne krovky“), a brání referendu o vystoupení z EU
  podtema: Česká suverenita
- id: vrabel-2026-10-19-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**19. 10.** — Požadavek von der Leyenové na dalších 70 mld. eur pro Ukrajinu na příští rok Vrabel
    bere jako potvrzení své prosincové předpovědi, že půjčka 90 mld. eur „do konce roku nevydrží“. Babiš,
    Fico a Orbán podle něj tehdy lidem namluvili, že za půjčku nebudou ručit: „tak za to neručíme, ale
    platíme tu půjčku“. Peníze jdou z rekordního rozpočtu EU, do kterého přispívá ČR, proto vláda nemůže
    snížit daně a vše bude ještě dražší. Řešením je podle něj vystoupit z EU a NATO. K tvrzení Zelenského,
    že USA dočasně přerušily sdílení zpravodajských informací kvůli útokům na ruské rafinerie, a k Rubiovu
    vysvětlení „chybou softwaru“ říká, že to je „samozřejmě nesmysl“. Zelenskyj („zelenýho kokainovýho
    krále“) se podle něj Trumpovi postavil už podruhé a Trump, „bojovník urputný a těžký a zákeřný“, si
    ho „vychutná“, nejspíš po volbách (viz [Predikce](predikce.md)). Putinův návrh trojstranného summitu
    s Trumpem a Si Ťin-pchingem vykládá jako chytré využití Trumpovy předvolební kampaně, jímž si Putin
    Trumpa „zavazuje“ a snaží se dostat další dvě jaderné velmoci na ruskou stranu. Zelenskyj je naopak
    „idiot politický“ a „politický negramot“, protože před volbami útočí na toho, kdo ho drží u moci.
    Summit podle Vrabela konflikt nezastaví, „maximálně… nějaká obchodní dohoda“; hlavním nepřítelem USA
    je Čína a k roku 2030 se podle něj chystá vojenský konflikt.'
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: „Zelenýho kokainovýho krále“, „idiot politický“ a „politický negramot“, který před volbami
      útočí na Trumpa
  - osoba: donald-trump
    vztah: rozporuplny
    kontext: Před volbami hraje „mírového prezidenta“, „bojovník urputný a těžký a zákeřný“; USA jednají
      vůči Saúdům jako „mafie“
  - osoba: vladimir-putin
    vztah: pozitivni
    kontext: Situaci „pochopil“ a chytře využívá Trumpovu kampaň k summitu s USA a Čínou
  - osoba: marco-rubio
    vztah: negativni
    kontext: Vysvětlení výpadku zpravodajských informací „chybou softwaru“ je „nesmysl“
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-19-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa jako „zrada národa" a „ani koruna na Ukrajinu" jako podvod — „posílá se víc
    než za Fialy" (Vrabel, 27. 9. 2026)
  text: '**19. 10.** — Ke zprávě o české střele s plochou dráhou letu Narval (LPP Holding, dolet přes
    700 km, bez satelitní navigace) a k varování Tomáše Kopečného před nedostatečnou státní podporou zbrojařů
    Vrabel tvrdí, že média to „navlíknou“ jako válečnou propagandu, aby lidé cítili vinu, že střela ještě
    nebyla poslána proti Rusku: „Zapálíte, nestrkejte ty sirky zpátky na ty krabičky, že vám to chytnou.“
    Útočná střela s doletem 700 km dodaná na Ukrajinu podle něj poletí do Ruska. Srovnává to s válkou,
    kdy sem podle něj musel přijet Heydrich, aby Češi rychleji vyráběli zbraně pro Hitlerovu armádu; dnes
    „žádnýho Heydricha“ není potřeba, protože lidé kvůli válečné propagandě a nedostatku peněz na jídlo
    jdou do zbrojovek sami. To, že se místo o Starlinku začíná mluvit o „Star Shield“, podle něj prozrazuje,
    že jde (jako u Stargate) o vojenské projekty.'
  osoby:
  - osoba: tomas-kopecny
    vztah: negativni
    kontext: Varování před slabou podporou zbrojařů (střela Narval) jako válečná propaganda
  podtema: EU jako vojenská struktura
- id: vrabel-2026-10-19-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**19. 10.** — K jednání NATO v Bukurešti o rostoucí hrozbě ruských sabotáží, kyberútoků a dronů
    Vrabel tvrdí, že hrozba „se nezvyšuje“ a jde jen o rétoriku: „Myslím, že Rusové by udělali cokoliv
    pro to, aby se vyhnuli válce s Evropou“, zatímco někteří evropští politici by udělali „cokoliv pro
    to, aby Evropa byla co nejrychleji ve válce s Ruskem“. NATO se podle něj na válku připravuje dál,
    i když Trump před volbami vystupuje jako mírotvůrce. Rusové budou podle něj potřebovat dobýt celou
    Ukrajinu, dojít do Kyjeva a vyměnit vládu, tím ale konflikt neskončí: politici NATO a EU pak řeknou,
    že Rusko jde na ně, „a vyprovokujou válku pravděpodobně, anebo tu válku vyprovokujou ještě před tím“.
    S odkazem na Kissingera tvrdí, že USA nikdy nechtěly spojení Německa s Ruskem, a proto rozšiřovaly
    NATO s vědomím, že dojde ke konfliktu. Ve chvíli, kdy končí Pax Americana a Čína s Indií předhánějí
    USA ekonomicky, je pro ně „velmi výhodný poštvat proti sobě Rusko a Evropu“.'
  osoby:
