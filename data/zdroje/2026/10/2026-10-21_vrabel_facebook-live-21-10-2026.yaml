  nadpis: 'Insolvenční správce, soud bez důkazů, Rakušan: bezpečnostní ohrožení státu (Vrabel, 24. 5.
    2026)'
  text: '**21. 10. (FB Live)** — Vrabel kauzu zařazuje mezi případy, jejichž rehabilitaci a odškodnění
    žádá od státu v souvislosti s novelou trestního zákoníku. Nově líčí i vlastní insolvenci: řádně ji
    splácel, ale po velkých demonstracích v roce 2022 insolvenční správce a soudce podle něj „vymysleli“,
    že když je schopen pořádat takové demonstrace, může platit víc, a insolvenci zrušili — nyní je v konkurzu,
    což označuje za „absolutně protiprávní“. Postup správce, soudce a policisty vůči manželce (dluh dnes
    kolem 3 milionů Kč) nazývá „politicky organizovaný zločin“. Rehabilitaci chce i za zničené podniky
    (pět na Vltavě, dvě pizzerie a kavárna v Českých Budějovicích) a za odsouzení za dotační podvod, které
    podle něj byly kompenzace za Babišem zavřené podniky.'
  podtema: Kauza Bojana Vrabelová — politické zničení aktivisty přes rodinu
