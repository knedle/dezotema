- id: vrabel-2026-10-20-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Macinka na Chanuce hnutí Chabad Lubavič; Kushner, Lutnick a Adelsonová jako financiéři Trumpa;
    „Velký Izrael“ (Vrabel, 8. 10. 2026)
  text: '**20. 10.** — K neohlášené návštěvě amerického ministra války Peta Hegsetha u Netanjahua na letecké
    základně Ovda Vrabel označuje Hegsetha za „absolutního psychopata, absolutního zločince“ a „odpornou
    bytost“, jejíž jmenování ministrem války ho „vůbec nepřekvapuje“. Návštěvu vykládá jako podporu Netanjahuovi
    (kterého nazývá „Satanjahu“) před izraelskými volbami: Trump se sice teď tváří, „že je svatý“, chválí
    Rusy a Čínu a chce mír, ale Izrael si „nedovolí nepodpořit“, protože je „až moc zavázaný penězi“ ze
    sionistických kruhů, především od Chabad Lubavič, a od křesťansko-sionistických organizací, a proto
    „musí podporovat velký Izrael“.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-10-20-02
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Pražský projekt Bubny-Zátory jako „15minutové město" — riziko omezení volného pohybu (Vrabel,
    20. 8. 2026)
  text: '**20. 10.** — K varování šéfa Ryanairu Michaela O''Learyho, že letenky v Evropě v příštím roce
    zdraží až o 20 % kvůli cenám paliv, Vrabel říká, že 20 % „není žádné zdražení“ ve srovnání s reálnou
    inflací potravin. Podstatné je podle něj, že se „v rámci omezování pohybu lidí“ chystají i obchodní
    „útoky“ proti letecké dopravě, „aby do budoucna letadly mohli lítat papalášové, ale aby obyčejní lidé
    tolik nelítali“. Kdo chce vidět pyramidy, Peru nebo Bódhgaju, má to podle něj udělat, „dokud ještě
    můžete“ (viz [Predikce](predikce.md)).'
- id: vrabel-2026-10-20-03
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: '⚡ Konflikt: Vrabel obviňuje Rajchla z pokrytectví ve svobodě slova — zákaz ruských vlajek a
    sběr kompromitujících materiálů (Vrabel, 18. 8. 2026)'
  text: '**20. 10.** — Trumpův výrok, že Rusko mohlo na Ukrajině postupovat „úplně jinak“ a zachovalo
    se způsobem, který Trump „oceňuje“, Vrabel vykládá jako předvolební obrat, ale zároveň jako zpochybnění
    genocidy a ruských válečných zločinů. V jeho hnutí je podle něj už pět lidí souzeno za písmeno Z,
    které státní zástupci a soudy berou „přesně tak, jak to řekl Jindřich Rajchl“, tedy jako schvalování
    válečných zločinů a popírání genocidy, a proto by Trump „v České republice měl být odsouzený“. Pochod
    17. listopadu za svobodu politického projevu navrhuje zčásti pojmout jako recesi, „pochod za svobodu
    politického projevu Donalda Trumpa“, a vyzývá k soutěži o nejlepší plakáty. Trump podle něj před volbami
    říká jen to, co lidé chtějí slyšet (má průzkumy i svodky tajných služeb ze sociálních sítí), což je
    „důkaz o tom“, že Vrabelovy názory jsou „v absolutní většině“ i na Západě. V ČR je naopak veřejný
    prostor „pokřivený“: kdo „šlape chodník pro NATO“ a je zásadně proti Rusku, může do parlamentu i vlády,
    kdo popisuje, co se na Ukrajině reálně děje, je blokován a potlačován. K Trumpově zmínce, že Ukrajina
    chce uvěznit bývalou mluvčí Zelenského Julii Mendelovou, dodává, že by Trump mohl mluvit i o tom,
    „jak u nás zatýkají lidi za to, že prostě mají svůj politický názor“; díky Trumpovi je teď „docela
    otevřené okno“ a je potřeba „tlačit“.'
  citace:
  - text: Donald Trump by v České republice měl být odsouzený za popírání válečných zločinů a za schvalování
      válečných zločinů a popírání genocidy.
  podtema: Trestání politického projevu
- id: vrabel-2026-10-20-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**20. 10.** — K Babišovu ujištění, že zprávy o nové migrační vlně z Ukrajiny nejsou pravda (podle
    ministerstva vnitra kolony na hranicích způsobují letecké poplachy), Vrabel vzkazuje: „Andrej, tebe
    jednou pověsej na nástěnku největších lhářů v České republice.“ Babiš podle něj „lhal vždycky a lže
    dál“ (muniční iniciativa, F-35, schodek, peníze a zbraně pro Ukrajinu, daně podnikatelům, důchody)
    a zároveň chce dovážet Filipínce. Rusové podle Vrabela postupují, útoky na Kyjev sílí a lidé kvůli
    zimě odejdou do Evropy, kde je čeká „teplo, sociální dávky, pohoda“; čím dál Rusové půjdou, tím víc
    budou Ukrajinci utíkat (navazuje na predikci z 18. 10., viz [Predikce](predikce.md)). Babiše podle
    něj „docela dobře rozstřelila“ Jana Bobošíková.'
- id: vrabel-2026-10-20-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**20. 10.** — Trumpův výrok, že Ukrajinu by při jednáních měl zastupovat někdo jiný než Zelenskyj,
    Vrabel bere jako potvrzení, že Trump „půjde po“ Zelenském, který mu kazí kampaň, a zároveň jako to,
    co „lidi chtějí slyšet“: Zelenského podle něj lidé nenávidí, protože je „fašista“, „nacista“, „neustále
    vyfetovaný“ (v americké televizi prý v přímém přenosu „šňupal něco, pravděpodobně kokain“) a diktátor,
    který nerespektuje volby. Bývalá mluvčí Julie Mendelová podle něj Zelenského „odkryla“ jako „bezcharakterního
    člověka a zbabělce“ (v roce 2022 se prý schovával v bunkru a nařídil zničit mosty do Kyjeva, což generálové
    odmítli). Vanceův výrok, že Ukrajina není formálním spojencem USA a nemá být v NATO, označuje za „bomby“,
    Vance si ale podle něj nechává otevřené dveře pro dobu, kdy po Trumpovi přijdou demokraté a budou
    ve válce pokračovat „mnohem tvrdším způsobem“. Kallasová a von der Leyenová prý „pláčou do polštáře“,
    zatímco politici typu Rajchla nebo Babiše, podle něj „psychopati“ bez emocí, obdivují, jak rychle
    Vance dokáže otočit; i čeští politici budou otáčet, „ale ono to nebude trvat dlouho“ (viz [Predikce](predikce.md)).
    K setkání Zelenského s Witkoffem v Oslu a k Rubiovu přiznání zpožděných dodávek říká, že USA ani ČR
    nemají povinnost dávat Ukrajině zbraně ani peníze: Ukrajinci nevyužili Minské dohody, Rusové přišli
    chránit lidi „vražděné“ ukrajinskými nacisty, a kdyby Ukrajina přijala istanbulskou nabídku z roku
    2022, zůstala by jí „prakticky celá Ukrajina“ a nebyla by „prodaná BlackRocku“. Vyhlášení roku 2027
    rokem UPA, Romana Šuchevyče a Oleha Olžyče Lvovskou oblastní radou (polský Ústav národní paměti ho
    odsoudil kvůli Volyni) bere jako důsledek toho, že se v ČR „čtyři a půl roku“ lže, že na Ukrajině
    není nacismus; připomíná, jak Zelenského oslavovali Turek („hrdina“), Miloš Zeman (Řád Bílého lva),
    Babiš („frajer“) i Rajchl: „No tak potom ty Ukrajinci říkají, no tak v pohodě, tak asi můžeme náckovat
    dál.“'
  citace:
  - text: Ukrajinci si můžou za to, že jsou v konfliktu s Ruskou federací sami. To není náš problém, to
      je jejich problém.
  - text: To není tak, že my jim pomáháme. My jim pomáháme do hrobu.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-20-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**20. 10.** — K výbuchu ukrajinského dronu s výbušninou v Litvě, který přiletěl z Polska, a k
    Tuskovu požadavku na vysvětlení od Ukrajiny Vrabel říká, že kdyby totéž udělali Rusové, „byli bychom
    ve válce“; Tusk dělá „tvrďáka“ a jde o „trapnou komedii“. Poláci a Litevci si to podle něj „můžou
    sami“, protože Ukrajině posílají zbraně, a drony se elektronickým rušením mohou odchýlit u kterékoli
    strany; žádá, aby se stejným metrem měřilo i u ruských dronů, místo řečí o hybridní válce. Sikorského
    tvrzení, že ruské drony nesestřelené nad Ukrajinou dopadnou do Polska, zesměšňuje („jako když pošlete
    něco z praku“); Tusk a Sikorski se podle něj do funkcí dostali „nějakým omylem“, zatímco lidé z Konfederace
    Korony Polské Grzegorze Brauna jsou „naši kamarádi, kolegové“. Obdobně ke 14 narušením řeckého vzdušného
    prostoru tureckými drony a průzkumným letounem tvrdí, že kdyby šlo o Rusko, „už by byla válka“; Turecko
    si jako silná země podle něj bere vlastní sféru vlivu stejně jako USA, Rusko a Čína, protože ho všichni
    potřebují. K vyslání dalších hlídkových letounů a dronů NATO do Černého moře opakuje varování o „sirkách“
    a o nebezpečí jakéhokoli přesunu vojsk k ruským hranicím. K listopadovému cvičení 1 500 britských,
    francouzských, německých a polských vojáků v Polsku, jímž se „koalice ochotných“ připravuje na nasazení
    na Ukrajině po příměří, říká: „Vyslání vojsk NATO na Ukrajinu neznamená žádné bezpečnostní záruky
    mírové, ale znamená to začátek války mezi Ruskem a NATO. Tečka.“'
  podtema: Zahraniční aktéři a precedenty
