  nadpis: '„Cestovní agentura Petra Pavla“: let do Maroka jako klientelismus; Eva Pavlová jako „soukromá
    osoba“ nemá dostávat 106 tisíc (Rajchl, 11. 10. 2026)'
  text: '**16. 10.** — Pavlovo vysvětlení, že si cestu zaplatil z vlastních zdrojů a doklady nepředloží,
    protože jde o soukromou věc, Rajchl označuje za „naprosto nedostatečné“: „Není to jeho soukromá věc.“
    Chce vidět konkrétní vyúčtování: kdy platil („jestli to náhodou nebylo až teď po návratu, aby se mediálně
    očistil“), komu, kdo letadlo objednal a kdo s ním cestoval. Pokud letěla ochranka, zaplatili prý daňoví
    poplatníci 3 750 € za každého jejího člena, a podá proto žádost podle zákona 106/1999 na Kancelář
    prezidenta. Kdyby Pavel letěl linkou, „zcela jistě by to stálo méně“, a soukromým letem z Casablanky
    si podle něj „za 15 tisíc euro“ neodletíte. Zpátky letěl linkou, „aby se snažil vyvinit vůči našim
    občanům“. Pavla označuje za pokrytce, který „se prezentuje jako člověk z lidu“ a létá soukromými tryskáči,
    jaké si „99 % našich občanů nemůže dovolit“: „je to jenom ukázka papalášství“. Sám se brání: do Maďarska
    za ministrem zahraničí jel autem, pozemky v Hradci Králové dostal před 30 lety od rodičů a transakce
    nad 500 tisíc zveřejňuje každý poslanec, což „by mělo platit pro každého politika, a o to více pro
    nejvyššího ústavního činitele“. Média vyzývá, aby vyúčtování po Pavlovi požadovala.'
