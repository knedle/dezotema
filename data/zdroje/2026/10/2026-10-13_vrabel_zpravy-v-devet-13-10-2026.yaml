vyroky:
- id: vrabel-2026-10-13-01
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**13. 10.** — Protesty v západní Evropě (Brusel, Francie, Itálie, Británie, Německo) podle Vrabela
    nejsou kvůli učitelům ani bytům, jak tvrdí média, ale z „strachu o život“ kvůli migraci. Zároveň v
    nich migranti protestují za Palestinu: „Z toho je takový chaos, který podle mě je začátkem nějaké
    občanské války.“ Varuje, že „muslimský džihad v Evropě může propuknout“, a v Británii se prý „zavírají
    desetitisíce lidí za příspěvky“. Recept pro ČR je „utéct z té pyramidy… zabednit se a nikoho k nám
    nepustit“. Ke zprávě o 358 dětských sňatcích v Bádensku-Württembersku předpovídá, že s migračním paktem
    (od ledna 2027, Babiš „urychluje“ Syřany a Afghánce) budou „za 5–7 let“ sňatky 11–12letých dívek v
    ČR „běžný standard“. Deportace kriminálníků (Mette Frederiksenová, Safe Europe Act) problém neřeší:
    deportuje se prý „Srb bez papírů“, ne lidé „o dva odstíny tmavší barvy pleti, než je tamhle ten kousek
    dřeva“, a „co je těm holkám do toho, jestli ten kluk, co je znásilnil, má v pořádku papíry“. Západní
    Evropa je podle něj „hotová“. Ke zprávě o britských kazatelích ospravedlňujících bití manželek připomíná
    dokument „Jan Muslim“ (imám v pražské mešitě prý učil, jak bít ženu, aby to nebylo vidět): islám je
    podle něj „taková jako mafie, která drží pospolu… ale islám je strašný pro ženy“ (viz [Stochastický
    teror](stochasticky-teror.md)). Ženy v ČR by „měly křičet, že chtějí vyměnit vládu… vystoupit z EU
    a uzavřít hranice“.'
  osoby:
  - osoba: mette-frederiksenova
    vztah: rozporuplny
    kontext: „Hezké řeči“, ale deportace problém neřeší
- id: vrabel-2026-10-13-02
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**13. 10.** — Čtyřbodový mírový plán USA a Evropy (podle Washington Post), tedy obnovu Ukrajiny
    s BlackRockem a Světovou bankou, bezpečnostní záruky, energetickou spolupráci a příměří na frontové
    linii, Vrabel odmítá jako bezperspektivní. Obnova přes BlackRock podle něj z Ukrajiny udělá „naprosto
    zglobalizovanou“ zemi a zastavení na frontové linii Rusko nepřijme, protože „nenechá Ukrajinu, aby
    si dál náckovala“ a ještě nemá celý Donbas. Srovnává to s Anchorage (celý Donbas Rusku, ukrajinská
    armáda do 80 tisíc, bez NATO). „Můj odhad toho, že by tenhle mírový plán prošel, je 0 %.“ Očekává
    tři týdny „naděje“, potom „nějaký atentát na nějakou důležitou osobu“ a spuštění konfliktu. Trumpův
    argument, že se Putin a Zelenskyj nenávidí, je „argument pro malé děti“: válka podle něj potrvá, „dokud
    Západ nehodí zpátečku od jeho snahy rozbít Rusko… anebo Rusko nedobije Ukrajinu“. Vadí mu, že ČR vyrábí
    střely, které se používají proti Rusku: „to je špatně“.'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-13-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa jako „zrada národa" a „ani koruna na Ukrajinu" jako podvod — „posílá se víc
    než za Fialy" (Vrabel, 27. 9. 2026)
  text: '**13. 10.** — Ministr obrany Zůna podle Vrabela „spadá přímo pod americké velení“ a jezdí k americkým
    generálům pro příkazy: „ministerstvo obrany samozřejmě není ministerstvo obrany České republiky, ale
    je to podružené ministerstvo Spojených států amerických“. Totéž platí pro Petra Pavla. Koalice ANO,
    SPD, Trikolóry a Svobodných je s Hradem „zajedno“, Motoristé „musí poslouchat“ západní globalismus,
    „jinak budou vyměněni“. Strategii „3B“ (Block, Blunt, Break) generála Grynkewiche zesměšňuje: „klidně
    můžeme jít do války proti Rusku, protože prostě máme strategii vítězství“. Stíhačky nad letišti (Norimberk,
    falešný poplach o únosu v Německu) podle něj jen „děsí lidi“: mají si zvyknout a uvěřit, že „Rusko
    se chystá napadnout Evropu a že je potřeba víc peněz na zbraně“.'
  osoby:
  - osoba: jaromir-zuna
    vztah: negativni
    kontext: „Spadá přímo pod americké velení“, jezdí pro příkazy
  - osoba: alexus-grynkewich
    vztah: negativni
    kontext: Strategie „3B“ jako naivní plán na porážku Ruska
  podtema: EU jako vojenská struktura
- id: vrabel-2026-10-13-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: '**13. 10.** — Ke slovům šéfa MI5 McCalluma o stupňování ruských hybridních útoků a k Michalu
    Koudelkovi (BIS) Vrabel prohlašuje, že by tajné služby zrušil, „protože to jsou ty největší lumpové…
    který si myslí, že můžou jednat mimo rámec zákona“. Tajné služby jsou podle něj „globalistický konglomerát“
    zneužívaný k politickému boji, „tentokrát k rozjitření války“. Připomíná Koudelkovu zprávu o ruském
    agentovi, který „kultivoval vztah“ s pořadatelem demonstrací, a tvrdí, že se s ním nikdy neviděl.
    Řeči o stupňování útoků bez důkazu prvního útoku jsou podle něj „šílená válečná propaganda“. Útoky
    dronů na lodě u Bulharska podle něj „pravděpodobně ani Rusko nebylo“: média to tak podávají, „aby
    lidem pořád dávali do hlavy, že Rusko na nás útočí“.'
  osoby:
  - osoba: michal-koudelka
    vztah: negativni
    kontext: Tajné služby „největší lumpové“, zpráva o „kultivování vztahu“ podle něj lživá
  - osoba: ken-mccallum
    vztah: negativni
    kontext: „Šílená válečná propaganda“ o stupňování ruských útoků
  podtema: Zahraniční aktéři a precedenty
