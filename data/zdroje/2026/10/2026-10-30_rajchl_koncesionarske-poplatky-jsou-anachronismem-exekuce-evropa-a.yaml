  nadpis: 'Rajchl: dobrovolné koncesionářské poplatky jako jediné spravedlivé řešení'
  text: '**30. 10.** — Ve sněmovní debatě Rajchl uvádí, že ČT od roku 2023 poslala do exekuce 41 881 lidí.
    Poplatky považuje za nespravedlivé i proto, že za demonstrující studenty je podle něj z 95 % platí
    rodiče. Žádná země EU prý nepřechází z rozpočtového financování na poplatky, zatímco opačným směrem
    šly Francie, Dánsko a Slovensko a chystá se Polsko. Ironicky zmiňuje Izrael („neuvěřitelně nedemokratická
    země“): ten poplatky zrušil v roce 2015, veřejnoprávní televizi IBA nahradil novou KAN, nyní chce
    její financování výrazně omezit „a dokonce tam mají zákon FARA“.'
  citace:
  - text: 41 881. Tolik lidí poslala Česká televize do exekuce. Naprosto šílené.
