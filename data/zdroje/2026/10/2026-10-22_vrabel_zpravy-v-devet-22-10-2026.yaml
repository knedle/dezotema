- id: vrabel-2026-10-22-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Palantir — PayPal mafie, digitální feudalismus, NATO ho tlačí do Evropy (Vrabel)
  text: '**22. 10.** — Opakuje, že J. D. Vance je „produkt“ Petera Thiela (vytáhl ho z práv, udělal z
    něj podnikatele a politika, dal 55 milionů na cestu do Senátu a 300 milionů dolarů na viceprezidentství)
    a že Thiel, Musk a Vance tvoří „PayPal mafii“; Musk přes DOGE získal přístup „ke všem datům o všech
    občanech“. Nově to spojuje s Palantirem, projektem Stargate a datovými centry, do nichž se mají ukládat
    informace o všech lidech, a s plánem vyrábět mRNA vakcíny proti rakovině. Thiel podle něj otevřeně
    říká, že chce současný systém zničit a nahradit ho technokratickým; tito oligarchové už ovládají sociální
    sítě a skupují média.'
