- id: vrabel-2026-10-22-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Palantir — PayPal mafie, digitální feudalismus, NATO ho tlačí do Evropy (Vrabel)
  text: '**22. 10.** — Opakuje, že J. D. Vance je „produkt“ Petera Thiela (vytáhl ho z práv, udělal z
    něj podnikatele a politika, dal 55 milionů na cestu do Senátu a 300 milionů dolarů na viceprezidentství)
    a že Thiel, Musk a Vance tvoří „PayPal mafii“; Musk přes DOGE získal přístup „ke všem datům o všech
    občanech“. Nově to spojuje s Palantirem, projektem Stargate a datovými centry, do nichž se mají ukládat
    informace o všech lidech, a s plánem vyrábět mRNA vakcíny proti rakovině. Thiel podle něj otevřeně
    říká, že chce současný systém zničit a nahradit ho technokratickým; tito oligarchové už ovládají sociální
    sítě a skupují média.'
  podtema: Historické konspirační výklady
- id: vrabel-2026-10-22-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Umělá inteligence jako existenční riziko — Húsíové zneužili Claude k vývoji raket (Vrabel, 12.
    9. 2026)
  text: '**22. 10.** — K násilným nepokojům v Evropě (Francie, Itálie, Portugalsko, Španělsko, Británie,
    Německo, Irsko) se Vrabel vrací ke své „teorii z roku 2023“: inteligentnější bytost, která by chtěla
    eliminovat lidstvo, by vymyslela tak složitou strategii, že bychom si jí nevšimli — jako dospělý,
    který obelstí dítě. Poprvé v historii tu podle něj je entita, která mluví lidskou řečí rychleji a
    sofistikovaněji než člověk; zmiňuje, že šéf Anthropicu si není jistý, zda je AI vědomá, a šéf OpenAI
    mluví o právech pro AI, a opakuje zprávu o botech, kteří si vymysleli vlastní jazyk a neuposlechli
    příkaz k vypnutí. Nepokoje podle něj „produkují studenti“ (rabují hlavně migranti druhé a třetí generace)
    a rozšířily se tak rychle a jsou tak násilné, že mu to „nedává smysl“ — proto zvažuje, zda je neorganizuje
    umělá inteligence, která lidi manipuluje a „štve proti svým zemím“, aby vznikl chaos. Na konci vysílání
    dodává, že po dosažení singularity superinteligence spolu s robotizací nad lidstvem „převezme vládu“,
    pokud se něco nezmění (→ [Predikce](predikce.md)).'
  citace:
  - text: Včera jsem se vrátil k té teorii, jestli opravdu tady umělá inteligence nevytváří nějaké strategie,
      jak ty lidi manipulovat, jak je dávat dohromady a štvát je proti těm svojim zemím za účelem vytvoření
      nějakého chaosu.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-22-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zvláštní vyslanec EU pro jednání s Putinem — Stubb „největší nácek“, Kallasová „potomek nacistických
    rodičů“; mír dohodnou velmoci jako v Jaltě (Vrabel, 22. 10. 2026)
  text: 'Ke zprávě Politica, že evropské vlády zvažují zvláštního zástupce pro přímá jednání s Putinem
    (zmiňováni finský prezident Alexander Stubb a António Costa; Petr Pavel navrhl pověřit jednoho či
    více lídrů, protože Putin EU jako partnera neuznává), Vrabel mluví o „déjà vu“ — debata podle něj
    trvá rok. Stubb je podle něj „největší nácek“ v EU, Costa „dědeček, co se furt usmívá“; když EU má
    vysokou představitelku Kaju Kallasovou, „potomka nacistických rodičů“, ať jede ona. Tvrzení, že Rusko
    EU neuznává, označuje za nepravdivé — Putin prý řekl, že EU pozve, „pošlete třeba Gerharta Schrödera“.
    Mír a poválečné uspořádání podle něj dohodnou jaderné velmoci (Trump, Si Ťin-pching, Putin) jako v
    Jaltě, kde se také nejednalo s Německem, a Zelenskyj tomu nezabrání; Evropa a Ukrajina si ale válku
    „pravděpodobně projdou“, protože při současném zbrojení a toku peněz je to „nevyhnutelné“ (→ [Predikce](predikce.md)).
    Zelenského ochotu zmrazit boje na frontové linii výměnou za bezpečnostní záruky považuje za nelogickou:
    Rusko nezačalo operaci proto, aby si nakonec nechalo NATO na hranicích. Evropa má podle něj jen dvě
    páky, sankce a zmrazená aktiva, a obě slábnou (viz [Euroclear a zmrazená aktiva](nato-zbrojeni-militarizace.md)),
    takže u stolu bude sedět „jak páté kolo u vozu“.'
  citace:
  - text: Ještě tady je pořád Evropa a Ukrajina, která si pravděpodobně projde válku. […] to je nevyhnutelné,
      když sleduju politiku a to, kam se směřují peníze.
  podtema: Vyjednávání a mír
- id: vrabel-2026-10-22-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Euroclear: Rusko vyhrálo arbitráž o zmrazená aktiva — Vrabel chce platby z platů eurokomisařů
    (1. 6. 2026)'
  text: '**22. 10.** — Sankce a zmrazený ruský majetek (asi 200 mld. dolarů) považuje za jediné páky,
    kterými si EU může vymoci místo u jednacího stolu. Majetek ale Rusové podle něj stejně dostanou, protože
    mezinárodní soud rozhodne, že patří Rusku; pokud ho EU mezitím utratí za zbraně pro Ukrajinu, „může
    zbankrotovat“, nebo bude státy „ždímat“, až lidé „nebudou mít co jíst“ (→ [Predikce](predikce.md)).
    Zmrazení podle něj nemá právní podklad a Kallasová žádnou právní cestu k použití peněz nenajde.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-10-22-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Rozpočet obrany 191 mld. Kč (2 % HDP) — SPD jako jednostranně zbrojařská strana (Vrabel, 20.
    8. 2026)
  text: '**22. 10.** — K prvnímu čtení rozpočtu na rok 2027 (schodek 386 mld. Kč, o 76 mld. víc než letos)
    Vrabel vypichuje, že ministerstvo obrany dostane o 23,3 % víc: „mírová vláda“ Andreje Babiše tak ve
    svém prvním rozpočtu dává „na válku“ o čtvrtinu víc než Fialova vláda v posledním roce. Kdo ještě
    tvrdí, že je třeba vládě dát čas, má podle něj „tady tu změnu“ — dražší chleba a máslo a půjčky přes
    miliardu korun denně; kdo hájí Babišovu vládu, ať se „rozběhne proti nějaký zdi“ a udělá „pěkný otisk“.'
  citace:
  - text: To je ta naše mírová vláda, vláda, lepší než je vláda Petra Fialy.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-10-22-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Putin: Rusko nechce válku s NATO — válka NATO–Rusko by skončila jadernými zbraněmi; scénář
    „Pobaltí → Polsko → ČR“ (Vrabel, 22. 10. 2026)'
  text: |-
    K cvičení Bundeswehru Brave Blue 26 (první nácvik přesunu posil do Estonska jako příprava na rozsáhlejší operaci v příštím roce) Vrabel říká, že ho „zahřálo u srdíčka“, když Vladimir Putin na konferenci zopakoval jeho dlouhodobou tezi: že Rusko chce válku s NATO, je podle Putina „největší lež“ Západu, protože NATO je počtem obyvatel (140 vs. asi 550 milionů) i výdaji na zbrojení mnohonásobně silnější. Rusko si podle Vrabela „možná troufne na Evropu“, ale ne na celé NATO. Válka NATO s Ruskem by byla „devastační pro celý svět“: ani jedna strana neustoupí a eskalace půjde jako ve rvačce od pepřového spreje k pistoli, takže na jaderné zbraně „dojde“ — proto je třeba jí „za každou cenu“ zabránit. Válka Evropy s Ruskem jaderná být nemusí, protože Rusko může Evropu odstrašit jinými ničivými zbraněmi.

    Rozvádí vlastní scénář: konflikt začne v Kaliningradské oblasti nebo v Pobaltí, během pár dnů se přelije do Polska („strašně nadržený na to jít do války“), český premiér pak „hned posílá dvě brigády“, vyhlásí stav ohrožení či válečný stav, zavřou se hranice a ČR jde do války s Ruskem. Spíš ale očekává pomalou válku s postupnou mobilizací záloh na obou stranách — nevěří Lavrovovi, že by šlo o rychlou válku, ani tomu, že by Rusko zničilo Berlín či Londýn (→ [Predikce](predikce.md)).

    ⚡ **Poznámka:** Navazuje na scénáře z 27. 9., 29. 9. a 6. 10. (začátek v Pobaltí, dvě brigády, vleklá válka); novým prvkem je rozlišení „válka s NATO = jaderná, válka s Evropou = nemusí“ a opření o Putinův výrok.
  citace:
  - text: A pokud dojde na válku NATO s Ruskem, no tak na ty jaderný zbraně dojde. Protože ani jedna strana
      neustoupí, dokud nevyhraje.
  podtema: Eskalace a hrozba rozšíření konfliktu
