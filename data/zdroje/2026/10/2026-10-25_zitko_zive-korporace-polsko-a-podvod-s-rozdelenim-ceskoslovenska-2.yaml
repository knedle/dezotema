  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: '**25. 10.** — Kuponovou privatizaci a výprodej zlatého pokladu (za 300–350 dolarů za unci) Zítko
    označuje za organizovaný zločin „korporace“; majetek ČSR je podle něj po 630 letech v miliardových
    hodnotách a lidé si o jeho náhradu mohou zažádat na ministerstvech financí v Praze a Bratislavě, s
    čímž jim „poradí“. Mezi další zlodějiny řadí kauzu lehkých topných olejů a bitcoinovou kauzu za „víc
    než 100 miliard“; dluh 3,791 bilionu je podle něj kryt lidmi jako zástavou a z „korporace Česko“ prý
    ročně odchází asi bilion korun do zahraničí.'
- id: zitko-2026-10-25-05
  typ: tvrzeni
  temata:
