  nadpis: Rozdělení ČSFR jako nulitní akt + „velká aliance" čistí Deep State (Zítko, 12. 6. 2026)
  text: '**25. 10.** — Zítko rozvádí, že zákon 542/1992 byl přijat bez referenda v rozporu s ústavním
    zákonem 327/1991 a nepodepsal ho prezident (Havel abdikoval 20. 7. 1992, Stráského vláda od 1. 10.
    neměla důvěru), takže vše přijaté potom je „nulitní“ a zákon 11/1918 stále platí. Podle „nálezu“ Alojze
    Hlásenského si Klaus a Stráský protiprávně prohodili mandáty; Klaus s Mečiarem se 26. 8. 1992 dohodli
    u vily Tugendhat pod stromem, který „do roka uschnul“. Havel je podle něj „třikrát křivopřísežník“
    (přísahal ČSSR, ČSFR i „korporaci“ ČR, což je trestný čin) a zbabělec, protože proti „puči“ nenasadil
    armádu; Pavel Rychetský podle něj „jako žába na prameni“ 30 let na Ústavním soudu obnovu blokoval.
    Smyslem rozdělení bylo podle něj, aby nástupnické „firmy“ nemohly žádat válečné reparace ve výši 29
    bilionů Kč (9,5 tisíce tun zlata); oslabena byla i 300tisícová armáda.'
  citace:
  - text: Právní stát ČSR neboli Československá republika funguje bez přerušení stále dál.
- id: zitko-2026-10-25-06
