  nadpis: Facebook zablokoval živé vysílání ČsTV2 — „kyberšikana" kvůli fotce z UFC (Zítko, 17. 6. 2026)
  text: '**25. 10.** — Facebook podle Zítka po setkání Čechoslováků „sekal“ vysílání v pětivteřinových
    intervalech, včetně Večerníčku; kontrolují ho prý „fízláci a tajné služby“. Ohlašuje přechod na platformu
    alternativnimedia.cz „bez sekaček a bez cenzury“.'
