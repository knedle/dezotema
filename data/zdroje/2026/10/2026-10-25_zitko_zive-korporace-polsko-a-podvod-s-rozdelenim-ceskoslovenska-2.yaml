  nadpis: Klony, herci a Guantanamo — EBS narativ
  text: '**25. 10.** — Zítko opakuje, že strany a výsledky voleb „vybírá počítač“ (v ČR HP, ve světě Dominion
    a Smartmatic), že Biden „nebyl ani vteřinu prezidentem“, ale herec, a že v rámci „central castingu“
    je nasazeno 200 tisíc herců; stejně tak mohli „katastrofální selhání justice“ v případu Čermáka „smáznout“
    nasazením dvojníka.'
