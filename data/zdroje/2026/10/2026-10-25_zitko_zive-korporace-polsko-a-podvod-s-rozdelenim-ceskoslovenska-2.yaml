- id: zitko-2026-10-25-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Soud v Amsterdamu: Gates, Bourla a Rutte jako obžalovaní'
  text: '**25. 10.** — Zítko tvrdí, že advokát Peter Stassen 22. 10. v Nizozemsku použil „úplně stejnou
    argumentaci“ jako on u okresního soudu v Chomutově v roce 2024: injekce covid-19 jsou podle definice
    Francise Boylea biologickou zbraní hromadného ničení, kterou se v ČSR „pokusili vyhladit původní obyvatelstvo“,
    sterilizovat ho a udělat z lidí doživotní klienty farmacie. Od 12. 3. 2020 se podle něj v nemocnicích
    „zabíjelo“ remdesivirem, na ventilátorech umíralo 8 z 10 lidí a virus nebyl nikdy izolován; Gates,
    Bourla a Rutte „se budou zodpovídat ze zločinů proti lidskosti“.'
  citace:
  - text: Probíhala tady genocida původního československého obyvatelstva a probíhala tady sterilizace
      a vyhlazování Čechoslováků injekcemi biologické zbraně.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: zitko-2026-10-25-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**25. 10.** — V čele „útočné formace“ proti němu je podle Zítka Renata Bernardy, „na křídlech“
    Patrik Tušl a Jiří Černohorský, „v záloze“ Patrik Svoboda (Morpheus); útok vedou policie a tajné služby
    přes falešný profil spravovaný otčímem Martinem Turkem. Na TV Šalingrad podle něj funguje „brainwashing,
    možná MK Ultra“, protože v roce 2023 nikdo nevěřil, že muž na „polské chodbě“ je Čermák, a teď věří
    všemu. Rozhovor Čermáka s Bernardy přirovnává kvůli nesouladu pohybu úst a zvuku k „pornofilmu z NDR“.
    Schůzku s Čermákem „jeden na jednoho“ odmítá, protože se ho už „několikrát pokusili zabít“; pokud
    Čermák do Holýšova nepřijde, „není originál“, a jinak pohrozil „místním šetřením“ ve firmě TKO, kde
    o něm prý nevědí.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-25-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Rodný list jako obchodní papír na burze v New Yorku — admirality law (Zítko)
  text: '**25. 10.** — Zítko pouští video polské ženy, podle níž polské ministerstvo financí potvrdilo,
    že Polsko je korporace registrovaná v New Yorku; ČR je podle něj „Česká republika LTD“ registrovaná
    v Anglii a všechny úřady, soudy i policie jsou firmy s číslem Dun & Bradstreet (UPIK), takže je třeba
    zjišťovat, „koho jménem jednají“. Rodný list byl podle něj vydán jako cenný papír obchodovaný na burze,
    lidé se tím stali „mrtvou právní fikcí“ ručící za dluh a výnosy šly na cizí „kolaterální účty“; polské
    úřady mají podle něj stejnou právní subjektivitu jako McDonald''s, v jehož hamburgerech byla podle
    Reuters a Bildu nalezena lidská DNA. Dodává, že originál státního znaku zmizel nejpozději 14. 8. 2006,
    takže policejní „korporátní průkazky“, bankovky i mince nesou padělaný znak v rozporu se zákonem o
    padělcích; policie je podle něj soukromá „ochranka“ a ministerstvo zdravotnictví by se mělo jmenovat
    „ministerstvo smrti“.'
  citace:
  - text: Takže právní subjektivita Polska jako korporace je stejná právní subjektivita jako KFC nebo
      McDonald's.
- id: zitko-2026-10-25-04
