- id: vrabel-2026-10-24-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Francie a Británie cvičily jaderný úder — Rafale z českého území by Rusové sestřelili „do tří
    minut“ a ČR zasypal spad (Vrabel, 24. 10. 2026)
  text: 'Ke zprávě o prvním společném francouzsko-britském cvičení jaderného úderu Vrabel tvrdí, že válka
    „se eskaluje brutálním způsobem“: dříve se odmítaly F-16 i Storm Shadow, dnes Storm Shadow podle něj
    zabíjí civilisty v Rusku. Francie podle něj po Babišově podpisu nedodá jaderné zbraně do ČR hned,
    ale „až to bude potřeba“, tedy v nejnebezpečnější chvíli. Rusové by pak jaderné nosiče okamžitě ničili:
    letouny Rafale s hlavicemi by byly sestřeleny do tří minut, ještě nad ČR nebo u slovenské hranice,
    a při východním větru by radioaktivní spad zasáhl celou republiku. Umístění jaderných zbraní proto
    nepovažuje za odstrašení, ale za „vabank“ (odkazuje na Čechovovu pušku). Francouze a Brity nazývá
    „satanisty“.'
  citace:
  - text: Jestli vzlítne letadlo Rafal s jadernýma zbraněma z území České republiky a rusové to budou
      vědět, tak podle mojého názoru do tří minut budou sestřelený ty letadla Rafal.
- id: vrabel-2026-10-24-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Protest za poplatky ČT „aby mohli platit vlastní válečnou propagandu“ — umělá bublina a dvojí
    metr policie (Vrabel, 24. 10. 2026)
  text: 'Vrabel tvrdí, že lidé, které nezajímají cizí vojáci ani francouzské jaderné zbraně v ČR, vyšli
    do ulic až kvůli zrušení poplatků ČT a ČRo. Podle něj tím hájí financování „hlavní válečné propagandy“.
    ČT popisuje z vlastní zkušenosti jako „elitářský snobský podnik“ a „vrchol politické korektnosti“.
    Zrušení poplatků považuje za kosmetické, protože peníze stejně půjdou ze státního rozpočtu. Mediální
    „bublina“ má podle něj odvést pozornost od války a jaderných zbraní a štvát lidi proti sobě („klasický
    satanismus“). Policii vyčítá dvojí metr: Kateřinu Blahníkovou kvůli „Z“ zatkli těžkooděnci, kdežto
    útočníky na Foldynu nechala jít. Beztrestností útoku Ukrajince na něj samotného v roce 2023 si podle
    něj stát „pěstuje teroristy“. Babišovo srovnání s útokem na Kapitol označuje za „legrační“, protože
    politici jsou podle něj „všichni stejní“.'
  citace:
  - text: Ale prostě vadí jim, že by jejich válečná propaganda, médium hlavní válečné propagandy, nebylo
      ovině financováno z rukou každého občana. To je naprosto šílená schizofrenní situace.
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-10-24-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: „Evropa bude muslimská“ — Jugoslávie rozbita kvůli Kalergiho plánu, ČR islámskou zemí do 20–30
    let (Vrabel, 24. 10. 2026)
  text: 'K útoku na pravoslavný pohřeb v Jordánsku Vrabel popisuje, „jak funguje islám“: nejdřív kebaby
    a uprchlíci, pak šaría zóny a no-go zóny, při 5 % populace požadavek práva šaría a při 20 % se země
    stává muslimskou. Za příklad dává Sýrii, kterou dnes vede bývalý „terorista“ přijímaný v ČR i USA.
    Jugoslávie podle něj historicky chránila Evropu před Turky a byla rozbita v rámci „Kalergiho plánu“,
    aby přes Balkán mohli proudit migranti. Migranty, často druhé a třetí generace s občanstvím, už podle
    něj z Evropy nikdo nevyveze. „Evropa bude muslimská“ nevyhnutelně a ČR se tomu vyhne jen zavřením
    hranic a odchodem z EU. Na čísla Tuckera Carlsona navazuje tím, že Evropa už „nebude bílá“ a v Praze
    prý slyší ukrajinštinu zhruba stejně často jako češtinu. Babišův plán dovážet pracovníky z Indie a
    Filipín podle něj přivede „samozřejmě muslimy“.'
  citace:
  - text: Evropa bude muslimská úplně stejně, jako se to děje dneska v Jordánsku, jako se to stalo v Sýrii.
      To je prostě nevyhnutelný.
