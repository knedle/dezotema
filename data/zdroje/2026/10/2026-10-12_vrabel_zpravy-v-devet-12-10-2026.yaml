vyroky:
- id: vrabel-2026-10-12-01
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: '**12. 10.** — Ke zprávě, že Babišova vláda udělila dlouhodobý pobyt více Ukrajincům než Fialova,
    Vrabel ironizuje, že Babiš „urychluje příchod připrchlíků“. Od ledna (migrační pakt) bude podle něj
    „urychlovat příchody z Afriky… tak jak si to hezky vymyslela Kačenka z Nového Jičína“ (Kateřina Konečná).
    Přicházející pracovní migranty zesměšňuje rasovými stereotypy: „inženýra poznáte tak, že má v ruce
    buď kyselinu, nebo bombu, lékaře tak, že má v ruce skalpel“, řidiče tak, že „vjede do davu“, a obecně
    o „každém, kdo má odstín barvy pleti trošku tmavší, než je tamhle ten kousek dřeva“ (viz [Stochastický
    teror](/stochasticky-teror.md)). Lidé, kterým se to nelíbí, budou podle něj „potlačováni“.'
  osoby:
  - osoba: katerina-konecna
    vztah: negativni
    kontext: „Kačenka z Nového Jičína“ vymyslela legální migrační cesty z Afriky
- id: vrabel-2026-10-12-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Dohra shromáždění 3. 10.: spor s Hájkem, Svatošem a Štěpánem; „vlastence nezajímají jaderné
    zbraně“ (Vrabel, 8. 10. 2026)'
  text: '**12. 10.** — Okamurovu výzvu, aby EU jednala s Ruskem o míru, Vrabel označuje za „blbost“: EU
    stojí na straně Ukrajiny, a kdo ji k jednání vyzývá, ve skutečnosti „bojuje za Ukrajinu“. Připomíná,
    že jeho shromáždění 3. 10. žádalo zřídit funkci mírového vyjednavače ČR, kterého vláda ignoruje. Okamurovi
    vyčítá, že v Srbsku vyzýval Srby ke vstupu do EU: „Od Tomia Okamury jsem ještě nikdy neslyšel žádnou
    chytrou větu… to je asi tolik Tomiovi Okamurovi a jeho obrovské japonské mozkovně.“ Jako protiklad
    chválí Ivana Davida (SPD).'
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: „Nikdy chytrou větu“, „japonská mozkovna“, v Srbsku agitoval pro EU
  - osoba: ivan-david
    vztah: pozitivni
    kontext: Protiklad Okamury — odmítal EU
  podtema: USA — volební systém
- id: vrabel-2026-10-12-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa jako „zrada národa" a „ani koruna na Ukrajinu" jako podvod — „posílá se víc
    než za Fialy" (Vrabel, 27. 9. 2026)
  text: '**12. 10.** — K výrobě dronů „Charlie One“ v Plzni, kterou propaguje Karel Řehka, Vrabel tvrdí,
    že „obranný dron“ je nesmysl, protože drony slouží k doručování náloží „hluboko do Ruska“: „to může
    vymyslet zase jenom takový zelený mozek, jako je Karel Řehka“. Výroba podle něj udělá z Plzně cíl
    raket a sarkasticky připomíná, že Plzeňáci jsou na bombardování zvyklí z války.'
  osoby:
  - osoba: karel-rehka
    vztah: negativni
    kontext: „Zelený mozek“, drony v Plzni
  podtema: EU jako vojenská struktura
- id: vrabel-2026-10-12-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Po Ukrajincích jsou „na řadě Poláci“ — globalisté chtějí zničit silné národy a promíchat Evropu
    migranty (Vrabel, 8. 10. 2026)
  text: '**12. 10.** — Tuskův projev Vrabel označuje za „předválečný“: „Teď se bude rozhodovat o tom,
    jestli Evropa půjde do války… osobně nevidím moc šancí, že by se to podařilo zabránit.“ Je „úplně
    jistý“, že proti lidem, „kteří nejsou úplně na straně Ukrajiny“, začnou „tvrdé postihy, tak jako to
    bylo na Ukrajině“. Opakuje, že „Polsko je další na řadě“, a změny čeká „někdy na přelomu roku“. „Šílenci“,
    kteří zatahují Evropu do války, budou podle něj souzeni. Tuska a Sikorského nazývá „stejnou pakáží“:
    Sikorského návrh zavřít ruské konzuláty a omezit víza podle něj ruší diplomatické kanály (odvolává
    se na své postgraduální studium diplomacie), takže se z omylu s dronem může stát válka. „Poláci nás
    zatahují do války.“ Prospěje to zbrojařům (Michal Strnad) a USA, „nejvíc válečnému národu“, jejichž
    strategií je oslabit Evropu i Rusko vzájemnou válkou. Ke zprávě o zadržení muže, který vyhrožoval
    atentátem Tuskovi, říká, že se mu „ani nediví“. Popisuje představu, jak míří na jelena, „a šel tam
    okolo Tusk… a ten Tusk by byl vedle“. Světu by podle něj „možná bylo líp, kdyby tady nebyl… to bych
    takhle neřekl, ale kdyby třeba vyvážel popelnice“ (viz [Stochastický teror](/stochasticky-teror.md)).
    Prohlášení generála NATO Grynkewiche, že útok na NATO bude zmařen, je podle něj lež, protože NATO
    nemá protivzdušnou obranu proti zbraním typu Sarmat: „ty lidi by se měli buď léčit“.'
  osoby:
  - osoba: donald-tusk
    vztah: negativni
    kontext: „Předválečný“ projev, „pakáž“, „světu by bylo líp, kdyby tady nebyl“ (→ [stoch. teror](/stochasticky-teror.md))
  - osoba: rados-aw-sikorski
    vztah: negativni
    kontext: „Stejná pakáž“ jako Tusk, ruší diplomacii, „Poláci nás zatahují do války“
  - osoba: alexus-grynkewich
    vztah: negativni
    kontext: „Ani jedno slovo pravda“, „měli by se léčit“
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-12-05
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: do amerických voleb „euforie“, pak obrat
  text: Následující 2–3 týdny do amerických voleb budou ve znamení „euforie“, že vše jde správným směrem;
    poté se situace změní (navazuje na predikci z 10. 10.).
  citace:
  - text: Teď budeme mít všichni pocit tři týdny, že se všechno ubírá správným směrem. Stejně tak, jako
      jsme měli před posledními americkými volbami.
  predikce:
    horizont: americké volby do Kongresu (3. 11. 2026)
    stav: castecne
    horizont_do: 2026-11-03
    vyhodnoceni:
    - datum: 2026-11-20
      text: předvolební „euforie“ (energetické příměří, jednání) se dá doložit, jednoznačný obrat po volbách
        ale zatím nenastal
      stav: castecne
    - datum: 2026-11-20
      text: Po 3. 11. Trump dál mluvil o „velké dohodě“ a 19. 11. jednal s Putinem a Si. Vrabel 19. 11.
        tvrdí, že „euforie“ trvala 4–5 týdnů a summitem končí.
    - datum: 2026-11-20
      text: 'Vrabel 20. 11. tvrdí, že „období klidu skončilo“ a první den po summitu to ukázal incident s úlomky raket a dronů v Polsku (viz [zdroj](/zdroje/2026-11.md#2026-11-20_vrabel_zpravy-v-devet-20-11-2026)).'
      stav: castecne
- id: vrabel-2026-10-12-06
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Evropa půjde do války; tvrdé postihy pro ty, kdo nestojí za Ukrajinou; Polsko „na řadě“ kolem
    přelomu roku
  text: Válce Evropy s Ruskem se podle něj téměř nedá zabránit. Proti lidem, kteří nejsou na straně Ukrajiny,
    „začnou přicházet tvrdé postihy“ a Polsko je „další na řadě“, s prvními změnami kolem přelomu roku
    2026/27.
  citace:
  - text: Říkám vám, že Polsko je další na řadě a nemyslím si, že to bude trvat dlouho… osobně bych viděl,
      že jako někdy na přelomu roku, že už by se mohly nějaké věci začít měnit.
  predikce:
    horizont: přelom roku 2026/27; jinak neurčeno
    stav: ceka
- id: vrabel-2026-10-12-07
  typ: stoch-teror
  temata:
  - valka-nato-rusko
  nadpis: Donald Tusk (a Radosław Sikorski)
  text: k zadržení muže, který vyhrožoval Tuskovi atentátem; fantazie o zamíření v blízkosti Tuska
  citace:
  - text: Ne, že bych to chtěl schvalovat, jo, to ne, ale jako ani se nedivím. […] a šel tam okolo Tusk,
      jo, a teď jsem měl zamířenýho takhle toho jelena. A ten Tusk by byl vedle. […] možná by světu bylo
      líp, jak kdyby tady nebyl, to bych jako takhle neřekl, ale kdyby pracoval někde jinde, kdyby třeba
      vyvážel popelnice.
  - text: A Sikorský to samý.
  teror:
    terc: Donald Tusk (a Radosław Sikorski)
    hranicni: false
