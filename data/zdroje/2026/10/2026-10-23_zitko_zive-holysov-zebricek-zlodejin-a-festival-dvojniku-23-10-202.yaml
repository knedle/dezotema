  nadpis: „Vítězné mocnosti" Trump, Putin, bin Salmán a Módí rozhodnou o obnově Československa; volby
    20 let falšovány (Zítko, 24. 9. 2026)
  text: '**23. 10.** — K divácké anketě „největších zlodějin“ (Dozimetr, IKEM, Kampelička, dluh a další)
    Zítko přidává vlastní tři: krádež bitcoinů „z drog“ ODS a „Brňáky“ za „víc než 100 miliard“, „zradu
    1992“ — rozdělení Československa a rozkradení majetku bez referenda — a „evidentní genocidu a sterilizaci“
    vakcínami covid-19. Skutečný dluh „korporace Česko“ je podle něj 3,791 bilionu a zástavou jsou lidé
    „jako živé bytosti“; jedinou cestou z „oprátky EU“ (povolenky, energetické štítky) je obnova „stále
    platné“ Československé republiky. Trumpovy děti Ivanka, Eric a Donald junior jsou podle něj díky babičce
    Zelníčkové „Čechoslováci“, takže v rámci dohody vítězných mocností s Putinem bude obnova Československa
    „už jen formalitou“.'
  citace:
  - text: Ve spojení s Vladimírem Putinem v rámci dohody vítězných mocností bude obnova Československa
      už jen formalitou.
- id: zitko-2026-10-23-03
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Klony, herci a Guantanamo — EBS narativ
  text: '**23. 10. — „festival dvojníků“:** Zítko prochází koláže „před tím a potom“ a tvrdí, že popraveni
    a nahrazeni dvojníky byli mj. Biden (místo něj „automatické pero“), Kamala Harris, Kerry, Fauci (od
    roku 2021), Kissinger a Hillary Clintonová, jejíž oběšení za přítomnosti Trumpa prý popsal Real Raw
    News, i celebrity jako Simon Cowell, Kevin Spacey či John Cusack, často s obviněním z pedofilie a
    „adrenochromu“. Trump má podle něj „200 tisíc dvojníků v oběhu“ (central casting) a sám viděl „20
    Donaldů Trumpů“; hlas lze dnes podle něj snadno napodobit pomocí AI. Dále tvrdí, že Stanley Kubrick
    zemřel kvůli přiznání falešného přistání na Měsíci, že McDonald''s používá lidské maso, že Michelle
    Obamová, Brigitte Macronová a modelky Victoria''s Secret jsou muži a že ukradené peníze vrátí kvantový
    finanční systém (QFS). Rozdíly v očích a výšce mají dokazovat i „výměnu“ Tomáše Čermáka.'
  citace:
  - text: Vidíte, jsou si podobný, ale stejný nejsou.
