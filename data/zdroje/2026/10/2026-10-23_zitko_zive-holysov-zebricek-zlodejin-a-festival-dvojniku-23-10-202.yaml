  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**23. 10.** — Zítko ohlašuje, že s Jiřím Hradilem pojede 30. 10. – 1. 11. na „setkání přátel
    Tomáše Čermáka“ do Holýšova, čímž podle něj „vyslyší“ přání Renaty Bernardy, aby se „kluci osobně
    setkali“; Bernardy a Martina Turka žádá o Čermákovo číslo, aby nemusel volat do firmy TKO, kde o něm
    prý nevědí. Odmítnutí schůzky by podle něj bylo důkazem, že „všechno nemusí být tak, jak vypadá“.
    Obvinění, že Čermáka udal, označuje za „předem připravenou policejní akci“ a „vymývání mozků“ Bernardy;
    zveřejní protokol a audio ze svého výslechu (Chomutov, 13. 11.) a podle něj ho hájí i Marcela Marušková.
    Ptá se, jak mohl Čermák zjistit, kdo ho udal, když jemu slovenští policisté při jeho zatčení v červnu
    2024 zdroj neprozradili; Turkovy příspěvky o možném trestním oznámení (údajný „únos“ Čermáka) považuje
    za „vyhrožovačky“.'
  citace:
  - text: Pokud by se náhodou ten podezřelý falešný Tomáš Čermák odmítal sejít, no tak je to takový důkaz,
      že všechno nemusí být tak, jak vypadá.
  osoby:
