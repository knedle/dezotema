  nadpis: Emisní povolenky jako spekulativní derivátový trh; Němci „v kleštích" — válka povolenkám (Rajchl,
    7. 6. 2026)
  text: '**4. 10. (Partie)** — Rajchl označuje Green Deal za „chobotnici, která škrtí evropskou ekonomiku"
    — jako by sprinter na olympiádě „dobrovolně nasadil pouta na nohy" — a emisní povolenky za jeho „nejsilnější
    chapadlo". Srovnává ceny povolenek (EU 84 €, USA 27 €, Čína 12 €) a jejich nárůst o 355 % a tvrdí,
    že Češi platí na hlavu nejvíc (Švédové asi 230 Kč, Němci přes 380 Kč, Češi 7 000 Kč ročně) — „platíme
    za to, že jim dodáváme elektřinu", bez níž by Německo bylo „v blackoutu každý druhý den". Zrušit to
    podle něj nejde, protože německé investiční a penzijní fondy mají vsazeno do futures, forwardů a derivátů
    — „je to okrádací model".'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
