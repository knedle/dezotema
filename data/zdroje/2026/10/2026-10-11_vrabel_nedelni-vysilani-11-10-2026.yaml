  nadpis: válka Evropy s Ruskem začne kolem přelomu roku, ne až 2030; Rusko nakonec zaútočí na Evropu
    nebo zabere Ukrajinu
  text: Konflikt Evropy s Ruskem (nejaderný, „oťukávací“, s mobilizací východních zemí) se podle něj rozjede
    kolem přelomu roku 2026/27, ne až v roce 2030 (jak tvrdí „VK“). Rusko pak bude muset buď zabrat celou
    Ukrajinu, nebo zaútočit na Evropu.
  citace:
  - text: Osobně si myslím, mně to připadá někde na přelom roku, na přelom roku, že by mohlo něco spustit,
      spíš než v roce 2030.
