  - ceny-energie
  nadpis: EU ekonomika vybudována na levném ruském plynu — vzdáváme se jí dobrovolně (Vrabel, 18. 5. 2026)
  text: '**11. 10.** — Vrabel petrodolarovou tezi rozšiřuje: Kissingerova dohoda s OPEC z roku 1972 je
    „největší podvod na světě“, protože svět dodává skutečné zboží za „prázdné papírky“ nekryté zlatem.
    Dohoda prý před rokem vypršela a BRICS mají větší obchod než G7. Irák byl podle něj zničen, protože
    Saddám prodával ropu v eurech. Za globalismem stojí „Rothschildové a Rockefellerové a Warburgové…
    bankéřské rodiny“. Covid a uzavření Hormuzu podle něj narušily globální trh a „i kdyby nebyly války,
    čeká nás kolaps“. Trumpovi „už nevěří ani nos mezi očima“, protože „jakmile projdou volby, tak budou
    věci zase úplně jinak“. Mezi Fialou a Babišem „není rozdíl“, všichni jezdí na „školení do Aspenu“
    a řídí je „loutkovodiči nad Amerikou“.'
  podtema: Energetika a Rusko
- id: vrabel-2026-10-11-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Státní zástupce, který zastavil stíhání Čecha z ukrajinské armády, „má jít do vězení“ (Vrabel,
    5. 10. 2026)
  text: '**11. 10.** — Vrabel výrok zostřuje. Podle něj nelze „schvalovat válečný zločin“, dokud ho neodsoudí
    tribunál zřízený Radou bezpečnosti OSN, a soudci, kteří trestali za písmeno Z, „to jsou zločinci…
    nezávislí na právu“. Státní zástupce, který zastavil stíhání Čecha z ukrajinské armády, „by měl viset
    na nástěnce státních zástupců, kteří likvidují právní systém“, s odkazem na Sládkovo „když se nevěší,
    tak není revoluce… aby to nebylo tak tvrdé, jak to říká doktor Sládek“ (viz [Stochastický teror](stochasticky-teror.md)).
    Stíhání za Z podle něj „vymyslel“ Rajchl, který „začal udávat lidi“; odsouzení prý padla „jenom proto,
    že Rajchl a Wacek řekli, že písmeno Z rovná se schvalování válečných zločinů… To muselo být domluvené,
    aby se vytvářel strach“. ESLP označuje za „pseudosoud, politický soud“. ČR je podle něj v předposlední
    fázi totality: protesty vznikají, když se „láme svoboda“, a až je zlomená, totalita „vždycky vraždí
    vlastní obyvatelstvo. A na Ukrajině to vidíte.“ V ČR byla svoboda zlomena v roce 2022 a „jsme blízko
    likvidaci politické opozice“, zatímco parlamentní opozice (SPD, PRO, Trikolóra, Svobodní) je podle
    něj falešná. S odkazem na Mattiase Desmeta tvrdí, že poslední fáze nastane, až umlčí „posledních 5
    %“ lidí, kteří říkají pravdu. Jako „změnu systému“ navrhuje odvolatelnost politiků (petice a porota
    náhodně vybraných občanů; příklad Zuzany Majerové, která pro referendum o vystoupení z EU „neudělala
    ani čárku“), zákaz politické reklamy a trestnost lobbingu jako úplatku. Janě Černochové by „dal oranžový
    mundur“ s nápisem a nechal ji zametat ulice.'
  podtema: Kritika soudnictví
- id: vrabel-2026-10-11-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Vysvětlení výroku „měli jsme se připojit k Rusku“: podpořit ochranu Rusů na Ukrajině jako u
    Minských dohod (Vrabel, 10. 10. 2026)'
  text: '**11. 10.** — V nedělním vysílání Vrabel tezi „měli jsme se přidat k Rusku“ rozvádí do ucelené
    podoby. Rusko podle něj šlo na Ukrajinu ze dvou důvodů: kvůli denacifikaci, tedy ochraně ruského obyvatelstva
    Donbasu („prakticky genocida“, 14 000 mrtvých, nesplněné Minské dohody, Porošenkův výrok o dětech
    ve sklepích, Lavrova všichni „posílali do háje“), a kvůli demilitarizaci, aby Západ s Ukrajinou nezaútočil
    na Rusko. ČR se podle něj měla k Rusku přidat diplomaticky v obou bodech, a pokud by diplomacie selhala,
    „rozhodně neposílat zbraně“: „My jsme měli slyšet v tom roce 2020 ty výzvy Sergeje Lavrova, že se
    tam vraždí obyvatelstvo.“ Invazi označuje za „naprosto odůvodněnou“ s oporou v mezinárodním právu
    jako „regionální dohodu“ proti nacismu, současně ale připouští, že „je to proti mezinárodnímu právu…
    nejsem rád, že tam přišli“. Válka byla podle něj „vymyšlená, aby odbili Rusko, aby ho okradli“, a
    Anglosasové „poštvali Slovany proti sobě“. Ukrajinci jsou „chudáci“, kteří se nechali sfanatizovat
    nacismem jako Chorvati v 90. letech; v Bosně podle něj „rozehrál válku Joe Biden“ (81 mil. dolarů
    na samopaly pro bosenské muslimy).'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-10-11-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Po Ukrajincích jsou „na řadě Poláci“ — globalisté chtějí zničit silné národy a promíchat Evropu
    migranty (Vrabel, 8. 10. 2026)
  text: '**11. 10.** — K prohlášení ruské delegace v OBSE, že ČR je s Ruskem ve válce, Vrabel souhlasí:
    ČR válku financuje (90 mld. přes evropský rozpočet, PURL, utajené programy), dodává „víc než polovinu
    munice“ (muniční iniciativa, společná výroba 155 mm s Polskem, střela Narwhal), posílá dobrovolníky
    a cvičí a léčí vojáky. Rusové válku podle něj nechtějí, chtějí ji ti, kdo na ní vydělají: „Američani
    jsou skety, který se snaží na všem vždycky vydělat. A nechat krvácet ostatní národy.“ USA a Rusko
    spolu válčit nebudou, ale obchodovat. Evropa podle něj „vsadila“ na válku za podíl z kořisti. Válka
    nebude jaderná, ale „oťukávací“ s mobilizací východních zemí, a na rozdíl od „VK“ (2030) ji čeká „někde
    na přelom roku“. Rusko nakonec bude muset buď zabrat Ukrajinu, nebo „zaútočit na Evropu. Jinak prohraje.“'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-11-05
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: Komunální volby jako volba „proti hajzlům“; Drulák a Svatopluk, „absolutní elitář“ s prezidentskými
    ambicemi (Vrabel, 11. 10. 2026)
  text: |-
    Vrabel vysvětluje výsledek komunálních voleb (vítězství STAN a ODS) tím, že lidé vždy volí proti někomu: za covidu proti Babišovi, Vojtěchovi a Hamáčkovi, pak proti Fialovi a Rakušanovi. „Oni nám dávají podat nové hajzly a ještě horší“: ODS a STAN jsou podle něj „mafiánské strany“. Martin Kuba v Budějovicích znovu vyhrál, přestože ho Vrabel jako aktivista dřív „dostal pryč“, protože lidé volí podle billboardů: „Na to jsou ty lidi idioti úplně.“

    Na dotaz z chatu označuje platformu Svatopluk za podporu prezidentské kandidatury Petra Druláka „od roku 2022“. Druláka nazývá „absolutním elitářem“ a „protekčním děckem“, „sortou jako Petr Hájek, proplouvat“. V roce 2022 prý odmítl přijít na jeho demonstraci, protože ji pořádá „týpek s insolvencí“. Jana Bogušíková ho dřív podporovala, „udělala pár chyb“; Ilona Švihlíková se bála přijít, „ale aspoň umí mluvit“; Petr Robejšek je „chytrý“ a „rovnější“. Do čela státu podle něj patří lidé, kteří „padli, dělali biznis, krachovali“.
  citace:
  - text: Celý Svatopluk je podpora Petra Druláka do prezidentských voleb. Od roku 2022, kdy to vzniklo.
  podtema: Komunální volby
