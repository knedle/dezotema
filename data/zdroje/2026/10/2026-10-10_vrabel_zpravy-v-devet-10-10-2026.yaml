  nadpis: Susan Dell jako „ještěr“ — Vrabel připouští, že „ještěrky mezi námi“ mohou být (10. 10. 2026)
  text: Ke zprávě o setkání manželů Michaela a Susan Dellových s Trumpem v Bílém domě (program „Trumpových
    účtů“ pro děti) Vrabel pouští video a upozorňuje, že „celý internet, média po celém světě“ řeší, zda
    je Susan Dell „ještěr“. Na detailu záběru má podle něj „opravdu divně“ mrkat („jako kdyby mrkala zdola
    nahoru“); lidé poukazují na široká ramena, hýbající se ohryzek, oči a „ještěří ruce“. Zdůrazňuje,
    že tím netvrdí, „že Spojené státy ovládají ještěři“, a že to neví. Zároveň ale „ani nemůže říct, že
    by to tak nebylo“, protože David Icke „o tom mluví velmi otevřeně a velmi dlouho a třeba to možný
    je, že jsou tady nějaké ještěrky mezi náma“. Svou spolumoderátorku Zuzanu prý „objímal“ a „připadalo
    mi docela, že to je ženská“. Uzavírá, že „ty její plastiky… se té ještěrce úplně nepovedly“.
  citace:
  - text: Neptejte se mě, jestli svět ovládají ještěři nebo ne, protože to nevím.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-10-05
  typ: tvrzeni
