  nadpis: EU ekonomika vybudována na levném ruském plynu — vzdáváme se jí dobrovolně (Vrabel, 18. 5. 2026)
  text: '**10. 10. (Zprávy v devět)** — Vrabel vysvětluje obrat USA „petrodolarem“: od roku 1972 se ropa
    obchoduje v dolarech, a když BRICS přešly na národní měny (dolar už jen na „60–65 %“ světového obchodu),
    snaží se USA „získat zpět kontrolu nad palivy“. Proto podle něj „udělali konflikt na Blízkém východě“
    a podporují ukrajinské útoky na ruské rafinerie, aby zvedli ceny a mohli prodávat „zadrahé“. Nákup
    ruské nafty je jen „předvolební tah“, aby Trump před volbami v USA srazil ceny. „Typnu si 80 %“, že
    se po volbách vše „velmi rychle změní“ a USA budou znovu dodávat zbraně Zelenskému. Evropa „páchá
    ekonomickou sebevraždu“, protože politikům z levných dlouhodobých kontraktů s Ruskem „nekáplo tolik
    na předvolební kampaně a na úplatky“. Sám prý nákup ruské ropy a plynu prosazuje od roku 2022 (Václavské
    náměstí, ČT 2023). Ukrajinci jsou podle něj „největší kavky“, kteří byli „nahnáni do války“ a „vyždímáni“
    Spojenými státy, a válku „prohrávají a prohrajou“. Zelenský je přesto pro něj „největší zrádce svého
    národa, největší fašista a nacista“.'
  podtema: Energetika a Rusko
