  nadpis: 'Šok z výsledků: „vyhrály STAN a ODS“, Kuba v Budějovicích jako „pravá ruka kmotra Dlouhého“,
    „čistá mafie“ (Vrabel, 10. 10. 2026)'
  text: 'Večer po volbách je Vrabel „totálně v šoku“ z výsledků: „vyhrává STAN a ODS… ty asi vyhrály volby“.
    V Českých Budějovicích podle něj vyhrál Martin Kuba („Naše Česko“), „pravá ruka kmotra Dlouhého“,
    který „ukazuje na ten trojzubec ukrajinský na tričku“. Budějovickou politiku (tlak na majitelku hokejového
    klubu) označuje za „naprosto brutální mafii… normálně čistou mafii“ a odkazuje na své články na webu
    „Pomoc Budějovice“. Ironicky dodává, že je „naprostá pohoda… pojďme do války“. Výsledky spojuje s
    militarizací: když vidí, „jak dopadly volby“, je asi „bojovat za demokracii potřeba“. Ze zprávy o
    odsouzeném starostovi, kterého lidé volí znovu, vyvozuje, že i on byl „odsouzen za podvody“, protože
    za covidu zaškrtl, že firmy nemají dluhy vůči státu.'
  podtema: Komunální volby
