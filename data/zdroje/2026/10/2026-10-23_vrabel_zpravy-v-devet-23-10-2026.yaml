    stav: ceka
    vyhodnoceni:
    - datum: 2026-11-04
      text: '4. 11. Fico podle zpráv ztratil parlamentní většinu (75 ze 150) po přestupu poslance k Tarabovi;
        Vrabel: „prakticky Robert Fico skončil“ ([Ladislav Vrabel — Zprávy v devět 4. 11. 2026](_zdroje.md#ladislav-vrabel--zprávy-v-devět-4-11-2026)).
        Fico zatím neodstoupil.'
- id: vrabel-2026-10-23-10
  typ: predikce
  temata:
  - konspirace
  nadpis: nezaměstnanost kvůli robotizaci a AI může přesáhnout 90 %
  text: Dřívější odhad nezaměstnanosti nad 50 % označuje za příliš optimistický — kvůli digitalizaci,
    robotizaci a AI může být „klidně 90+“.
  citace:
  - text: Když jsem říkal před několika lety, že to bude nezaměstnanost 50+, jsem byl velmi optimistický,
      ta nezaměstnanost může být klidně 90+.
  predikce:
