vyroky:
- id: vrabel-2026-10-23-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: 'Digitální euro: konkrétní scénáře kontroly nákupů, expirujících peněz a vynucené poslušnosti
    (Vrabel, 26. 6. 2026)'
  text: '**23. 10.** — K jednání EU s Pekingem o omezení dovozu čínského zboží Vrabel tvrdí, že v EU „nemáte
    volný trh nikde“: zemědělství přežije jen s dotacemi a vše je „centrálně řízené“, ale bez skutečného
    plánování, takže další regulace povedou „jen k rychlejšímu krachu“. Až se předlužený systém zhroutí
    pod nezaměstnaností z robotizace a AI, globalisté podle něj řeknou, že „vlády byly špatné“, nastolí
    technokratickou vládu a digitální měnu, kde „stát bude přidělovat lidem peníze, kolik můžou utratit
    a za co“ — jako 8 000 smart kontraktů v Číně; kredity uschované „u nich“ označuje za „novodobé otroctví“.
    Předtím je prý potřeba lidi „odmaterializovat“: uměle snížené ceny zlata a stříbra, inflace, Savings
    and Investments a na nemovitosti energetické štítky, ETS2, vyšší daně a cenová regulace nájmů (příklady
    z Vídně a Berlína) — levné domy v Německu a Francii jsou podle něj důsledkem toho, že je lidé nemají
    na udržení. Navazuje na projekt Stargate a Palantir jako „obrovskou šmírovací mašinu“, 6G sítě sledující
    pohyb každého a Schwabovo „nebudete nic vlastnit a budete šťastní“.'
  citace:
  - text: Že budeme mít nějaký kredity, ty kredity budou u nich uschovaný a oni nám řeknou, na co ty kredity
      můžeme použít. To je prostě v podstatě něco jako otroctví novodobí.
- id: vrabel-2026-10-23-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Umělá inteligence jako existenční riziko — Húsíové zneužili Claude k vývoji raket (Vrabel, 12.
    9. 2026)
  text: '**23. 10.** — Ke zprávě o 200 milionech dolarů pro firmu Warhound (geneticky upravení a klonovaní
    psi pro armádu; Palmer Luckey z Anduril) opakuje, že chaos v Evropě, který se podle něj šíří už i
    do Albánie a Tuniska, řídí lidé skrze AI, nebo AI sama „jako útok proti lidstvu“ (s odkazem na seriál
    Black Mirror). Varuje před „hraním si na bohy“ s geny (AI by mohla navrhnout gen, aby vlčáci „neměli
    rádi lidi“) a před transhumanismem Thiela, Gatese, Muska (čip v mozku opice) a Schwaba, podle něhož
    budou lidé bez propojení s technologií „podřadná rasa“. Svůj starší odhad nezaměstnanosti „50+“ kvůli
    robotizaci a AI označuje za „velmi optimistický“, může být „klidně 90+“ (→ [Predikce](predikce.md));
    sám je rád, že má dům v horách s vodou a půdou, a posluchačům radí plánovat na 5–20 let dopředu.'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-23-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Umělý konflikt vláda vs. prezident; Babiš/Macinka „předstírají opozici" vůči Fialovi — Vrabel
    (13. 6. 2026)
  text: '**23. 10.** — Na Okamurovo sdělení, že ministři SPD na jaře hlasovali proti novému režimu pobytu
    Ukrajinců, Vrabel reaguje, že „opozice a koalice“ se teď hraje přímo uvnitř vlády, aby lidé s národními
    zájmy měli pocit, že SPD „dělá, co může, ale nemůže“. Podle klienta z Ostravy a Karviné SPD v těchto
    „baštách“ v komunálních volbách „úplně prolítla“ a „nikdo už jim nevěří“, aktivní jsou jen lidé s
    funkcemi, kteří na sítích křičí, že „Vrábel je hajzl“ a štěpí vlasteneckou scénu. Babiš podle něj
    na rozdíl od Orbána nikdy nehájil národní zájmy; svobodnější je Slovensko, kde Fico bude „další na
    řadě, koho je potřeba odstranit“ a nahradit loutkami, případně mu nechají roli „vlasteneckého křoví“
    v opozici (→ [Predikce](predikce.md)).'
  podtema: Demokracie a politický systém
- id: vrabel-2026-10-23-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zvláštní vyslanec EU pro jednání s Putinem — Stubb „největší nácek“, Kallasová „potomek nacistických
    rodičů“; mír dohodnou velmoci jako v Jaltě (Vrabel, 22. 10. 2026)
  text: '**23. 10.** — ⚡ Po zprávě Telegraphu, že Petr Pavel patří mezi pět kandidátů na hlavního evropského
    vyjednavače, a po reakci Moskvy, že se evropští lídři „zdiskreditovali“ a jejich přítomnost u stolu
    je „nevhodná“, Vrabel přiznává „změnu oproti tomu, co jsem říkal včera“: Rusko podle něj kvůli stále
    ostřejší evropské rétorice Evropany u stolu nechce, a on to „docela chápe“ — Evropa stojí na straně
    Ukrajiny, takže ji zastoupí Ukrajina, a později ji možná přizvou, „aby kapitulovala taky“. Mírová
    jednání podle něj ve skutečnosti „neprobíhají“: jde o Trumpovo předvolební „vrtění psem“, které má
    odvést pozornost od Blízkého východu a ropy Brent nad 110 dolarů, za kterou je Trump „čistě“ odpovědný;
    po izraelských volbách a vítězství Netanjahua prý USA znovu zaútočí na Írán (→ [Predikce](predikce.md)).
    Velmoci (USA, Čína, Rusko) budou jednat o obchodu a sférách vlivu — „uvidíme, jestli Česká republika
    spadne do sféry vlivu Ruska nebo jenom Slovensko“. Postoje Ruska (denacifikace, demilitarizace na
    80 tisíc vojáků, žádné západní základny) a Ukrajiny (území, vojska NATO, vstup do NATO) se podle něj
    zcela míjejí, takže válka bude pokračovat, dokud Rusové nezaberou celou Ukrajinu (→ [Predikce](predikce.md)).
    Evropští lídři mír nechtějí, protože jsou „absolutně podřízení globalistickým strukturám“ — Macron
    „pracuje pro Alexandra Rothschilda“, Merz pro BlackRock — a Pavel jako vyjednavač „tam nemá co dělat“,
    je to „další globalista“ a generál NATO. Ke konci vysílání (k Putinovu rozhovoru pro Vesti) opakuje,
    že Západ měl Rusko podpořit v Minských dohodách, v denacifikaci i demilitarizaci, „my za to můžeme“;
    válku s Ruskem nelze vyhrát (Mrtvá ruka) a čím déle trvá, tím méně Ukrajině zůstane.'
  citace:
  - text: Jednání o míru v zásadě ani neprobíhají. To, co probíhá, je jakási politická snaha o to, aby
      to vypadalo, že se o míru jedná.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Jako vyjednavač s Putinem „tam nemá co dělat“, „další globalista“ a generál NATO
  - osoba: emmanuel-macron
    vztah: negativni
    kontext: „Pracuje pro Alexandra Rothschilda“, evropští lídři „absolutně podřízení globalistickým strukturám“
  - osoba: donald-trump
    vztah: rozporuplny
    kontext: V jednáních o Ukrajině „hraje poměrně kladnou roli“, ale „mírová jednání“ jsou jen předvolební
      „vrtění psem“ a za Blízký východ a drahou ropu je „čistě“ odpovědný
  - osoba: melania-trumpova
    vztah: negativni
    kontext: 'Zesměšněna: „neumí ani anglicky“, příměří v Oleškách jako „předvolební akt“'
  - osoba: benjamin-netanjahu
    vztah: negativni
    kontext: „Benjamin Satanyahu“, Izraelci „satanisti“, kteří bourají Palestincům domy
  podtema: Vyjednávání a mír
- id: vrabel-2026-10-23-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: ČR jako „nepřiznaný protivník" Ruska — konflikt je nevyhnutelný; scénář „za dvě hodiny článek
    5"; „diverzifikace" jako příprava na zničení ruské ropné infrastruktury (Vrabel, 27. 9. 2026)
  text: '**23. 10.** — K uzavření všech čtyř moskevských letišť kvůli dronům opakuje, že Rusko „nemá čas“:
    nemůže donekonečna snášet, že na něj přes Ukrajinu útočí „půl světa“, zatímco samo útočí jen na Ukrajinu,
    takže bude muset zaútočit na zdroje zbraní, peněz a vojáků — rozpoutat válku s Evropou je podle něj
    „v určité části zájmu“ Ruska a „z určitého úhlu pohledu nevyhnutelné“ (opakuje).'
  podtema: Zahraniční aktéři a precedenty
