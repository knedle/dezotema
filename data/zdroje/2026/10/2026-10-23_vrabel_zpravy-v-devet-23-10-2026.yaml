  nadpis: Robert Fico bude jako další „odstraněn“ a nahrazen loutkou EU
  text: 'Po pádu Orbána je Fico „další na řadě“: bude odstraněn a nahrazen politiky poslušnými EU, případně
    mu nechají roli „vlasteneckého křoví“ v opozici.'
  citace:
  - text: Robert Fico, podle mojho názoru, je další na řadě, koho je potřeba odstranit, protože nejde
      úplně se Evropskou unii.
  osoby:
