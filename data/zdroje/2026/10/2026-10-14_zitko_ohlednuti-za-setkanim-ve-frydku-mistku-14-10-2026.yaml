  nadpis: Facebook zablokoval živé vysílání ČsTV2 — „kyberšikana" kvůli fotce z UFC (Zítko, 17. 6. 2026)
  text: '**14. 10.** — Zítko utajení místa vysvětluje snahou předejít „haváriím, poruchám kanalizace,
    odstávkám vody nebo něčemu nežádoucímu“, čemu prý v minulosti už několikrát čelili. „Útoky“ proti
    ČSR, proti „covidové mafii“ i proti kritikům chemtrails a 5G podle něj pokračovaly v den akce i po
    ní. Ivan Masaryk „s partičkou dalších škůdců“ měl pronajímatelce poslat e-mail s cílem akci narušit
    a pronajímatelka pak odpověděla, že je „už tam nechce“. Bez utajení by prý jako v minulosti došlo
    ke stornu prostor „na základě zlých e-mailů a telefonátů“. Facebook podle něj místo konání skrýval,
    i když ho Zítko posílal, což je „porušování ústavy“ a čl. 17 Listiny. Odmítá i příspěvek, podle kterého
    si „uslintaný podvodník Pavel Zítko namastil kapsu“ a BEWIT si akci odepsal z daní: vstupné bylo dobrovolné
    a prostory si pronajala a 14 dní předem zaplatila jiná firma než BEWIT.'
  osoby:
