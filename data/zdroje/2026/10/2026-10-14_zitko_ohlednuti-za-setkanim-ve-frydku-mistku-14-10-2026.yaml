  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**14. 10. (odpoledne)** — Zítko slibuje vysvětlit, „komu to má prospět“ a jaká byla „strategie“
    libereckého jednání. Podle informací policejního prezidia měla být možnost podmíněného propuštění
    po polovině nebo dvou třetinách trestu předem vyloučena, protože Čermák včas nenastoupil do výkonu
    trestu; hrozilo mu prý dokonce dalších 5–15 let. Že k propuštění po polovině trestu přesto „neuvěřitelným
    způsobem došlo“, bere jako další doklad sehrané „habaďůry“. Samotné vysvětlení v přepisu chybí (poškozený
    úsek).'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-10-14-05
