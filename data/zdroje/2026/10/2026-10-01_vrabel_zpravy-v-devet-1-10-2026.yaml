vyroky:
- id: vrabel-2026-10-01-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**1. 10.** — K oficiální žádosti ČR o zapojení do francouzského jaderného odstrašení Vrabel říká,
    že jde „zaručeně o nejhorší krok proti ČR, který vláda Andreje Babiše dělá"; jadernou válku nelze
    vyhrát, jedinou cestou je odzbrojení jako za Reagana a Gorbačova, a vláda dělá „užitečného idiota"
    globalistů, kteří chtějí „rozkrást Rusko". Putinovo varování z Valdaje, že Rusko při útoku použije
    vše, je podle něj „rozumné varování, ne vyhrožování" — cedulka „pozor, zlý pes"; Japonsko je po Hirošimě
    „banka USA", a v ČR by se po jaderném úderu mohly rodit děti „se dvěma hlavami nebo čtyřmi rukama".
    Peníze ze zrušeného tendru na 185 obrněnců jdou podle něj do útočných zbraní „globalizované armády",
    ne na obranu.'
- id: vrabel-2026-10-01-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Novela VZP jako „korporátní fašismus"; elity chtějí „zlatou půl miliardu" — covid a náhlá úmrtí
    jako „předvoj" (Vrabel, 1. 10. 2026)
  text: 'K novele zdravotního pojištění ministra Vojtěcha Vrabel tvrdí, že jde o „korporátní fašismus"
    podle WEF: propojení veřejného a soukromého, v němž korporace řídí svět a politici jsou jejich „náměstci";
    malé nemocnice zaniknou a přijde centralizace, „15minutová města", kamery a AI. Elity podle něj chtějí,
    aby na světě zůstala „maximálně 1,5, ale nejlépe 0,5 miliardy" lidí („zlatá půl miliarda") — covid,
    náhlá úmrtí a ztráta plodnosti „mohly být jenom takový malý předvoj"; energetická krize je „vyvolaná
    uměle" (Green Deal, války) a letos v zimě podle něj přijdou „energetické lockdowny". Chemtrails nad
    Rakouskem kontrastuje s modrou oblohou v Srbsku.'
  citace:
  - text: To, co jsme tady měli v covidu, a to, že dneska lidi umírají na náhlá úmrtí nebo ztrácí plodnost,
      tak to mohlo být jenom takový jako malý předvoj.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-10-01-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migraci 2015 jsme zastavili my, „ne Okamura, který se na tom napakoval"; mešita učí „jak bít
    ženu"; migrační pakt od 2027 (Vrabel, 1. 10. 2026)
  text: 'K protimigračním protestům v Irsku Vrabel připomíná, že migraci v letech 2015–2016 v ČR zastavil
    s Martinem Konvičkou, Jiřím Bartákem a dalšími — „ne díky Okamurovi, který se na tom napakoval". Ve
    Vídni prý vidí „samý alláhisty", v pražské mešitě prý v pořadu „Já muslim" učili, „jak bít ženu, aby
    to nebylo vidět", a protesty ve Francii podle něj vždy „převezmou muslimové" a skončí pálením aut.
    Migrační pakt je podle čl. 10 Ústavy závazný a od roku 2027 začnou do ČR přerozdělovat migranty; výjimku
    máme jen díky „ukrajinizaci ČR". Volbu vlády v roce 2025 označuje za „obrovskou chybu" — Babiš podle
    něj porušil všechny sliby včetně neposílání vojáků („dvě brigády"). Navracení migrantů EU je podle
    něj dvojí metr: deportují pracujícího Srba bez jízdenky, zatímco ti, kdo „s nožem běhají a křičí,
    že bůh je velký", dostanou léčbu a další šanci.'
  citace:
  - text: Nepodařilo se to kvůli takovým lidem, jako je Tomio Okamura. Ti se na tom jenom napakovali.
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: „Napakoval se" na boji proti migraci
  - osoba: martin-konvicka
    vztah: pozitivni
    kontext: Spolu zastavili migraci 2015–16
- id: vrabel-2026-10-01-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by mělo „právo" na proxy útoky na území EU v rámci reciprocity; tajné služby „banda amatérů"
    (Vrabel, 1. 10. 2026)
  text: K jednání Rady EU o hybridních hrozbách a k Rutteho návrhu žádat po Rusku náhradu Vrabel tvrdí,
    že nezná „ani jeden" prokázaný ruský útok (včetně Vrbětic a Lipska) a tajné služby jsou „banda amatérů,
    která na objednávku dělá politiku a válečnou propagandu" i falešné akce proti němu a Petru Bystroňovi.
    Při recipročním přístupu by podle něj Rusko mělo „naprosto jednoznačně právo na to, aby někdo útočil
    na území Evropské unie ruskými zbraněmi, kdyby si našli nějaký proxy" — tak jako Západ podporuje útoky
    na Rusko. Rozkol USA–EU je podle něj záměrný, aby „Evropská unie šla do války sama". Nucená renovace
    budov a daně z nemovitostí mají podle něj donutit Čechy (70 % vlastní bydlení) prodat domy „Hansovi
    a Johnovi", protože „Evropa potřebuje peníze na válku".
  citace:
  - text: Rusko by mělo v rámci reciprocity naprosto jednoznačně právo na to, aby třeba někdo útočil na
      území Evropské unie ruskýma zbraněma. Kdyby si našli nějaký proxy.
  osoby:
  - osoba: petr-bystron
    vztah: pozitivni
    kontext: „Kamarád", oběť falešných akcí tajných služeb
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-10-01-05
  typ: predikce
  temata:
  - konspirace
  nadpis: energetické lockdowny „letos v zimě"; přerozdělování migrantů od 2027
  text: V zimě 2026/27 přijdou v Evropě „energetické lockdowny"; od roku 2027 začne podle migračního paktu
    přerozdělování migrantů do ČR.
  citace:
  - text: Myslím si, že už letos v zimě zažijeme nějaké energetické lockdowny [...] To si myslím, že bude
      letos v zimě.
  predikce:
    horizont: zima 2026/27; 2027
    stav: ceka
