    vztah: negativni
    kontext: Tehdy vzkázal „žádné slitování“ s organizátory; lže o zrušení § 405
  podtema: Trestání politického projevu
- id: rajchl-2026-10-25-03
  typ: tvrzeni
  temata:
  - fara-neziskovky
  nadpis: Politické neziskovky jako „mor, zlo, cholera“; zrušit mediální gramotnost (Rajchl, 25. 10. 2026)
  text: Rajchl v nedělním vysílání popisuje debatu na CNN Prima News o zákoně FARA. Neziskovky zaměřené
    na mediální gramotnost podle něj lidem diktují, co je pravda a co lež, a „vypínají kritické myšlení“.
    Označuje je za politické neziskovky, které je třeba „vyhnat karabáčem a bičem“. Spolu s médii prý
    „drží lež při životě“, podněcují nenávist a násilí a „aktivizují dav“. Navrhuje zrušit jakoukoli mediální
    gramotnost a nechat lidi číst cokoli (Al Jazeera, TASS, Fox News, Politico), protože právo vyhledávat
    informace zaručuje Listina. Fialův výrok o právu na „korigované informace“ chápe jako návrat před
    rok 1989, kdy „pravdu určovala strana a vláda“. Zákon FARA je podle něj teprve začátek cesty.
  citace:
  - text: Politické neziskovky jsou mor, zlo, cholera téhle společnosti a právě společně s médii drží
      ty opratě, ty lži.
  osoby:
  - osoba: petr-fiala
    vztah: negativni
    kontext: Poplatky jako další daň, „koupil si přízeň redaktorů ČT“; „právo na korigované informace“
  podtema: Milion chvilek — struktura a financování
- id: rajchl-2026-10-25-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Rajchl: dobrovolné koncesionářské poplatky jako jediné spravedlivé řešení'
  text: '**25. 10.** — V nedělním vysílání Rajchl argument rozvádí. V Nizozemsku po oznámení škrtů prý
    hrozí propuštění 80 zaměstnanců a nikdo neprotestuje. Nejsvobodnější veřejnoprávní média jsou podle
    něj v 17 zemích EU placených z rozpočtu a stejný model se chystá i v Polsku. Námitku, že i pojištění
    platí všichni, odmítá: pojištění je solidární fond pro případ potřeby, ČT je služba jako dálnice.
    Navrhuje předplatné ČT „na rok, na měsíc, na den“. Demonstranti na Staroměstském náměstí si prý mají
    ČT zaplatit sami, třeba i rozpočtem 80 miliard. Zpravodajství a publicistika tvoří podle něj jen asi
    10 % rozpočtu ČT a zbytek živí „neskutečné množství parazitů“, jejichž „umělecké projektíky“ by trh
    nezaplatil. Kdyby ČT skončila nebo stávkovala, „za měsíc to nikomu nebude chybět“. Převod pod rozpočet
    podpoří jako koaliční kompromis, sám ale dál prosazuje dobrovolné poplatky. Piráty a ODS, kteří zrušení
    poplatků měli v programu, nazývá „farizeji“.'
  citace:
  - text: Pokud mě někdo nutí platit za službu, kterou nevyužívám, není to svoboda. To je diktatura. To
      je totalita.
  podtema: Česká televize a mainstreamová média
- id: rajchl-2026-10-25-05
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Stížnost k Radě ČT na Jana Moláčka za „kukaččí mládě“; ČT zrušit, „ani korunu“ (Rajchl, 22.
    10. 2026)
  text: '**25. 10.** — Rajchl se k tématu vrací v nedělním vysílání. Dokument „Rozpolceno“ Jany Škopkové
    („jedna z nejlepších žurnalistek“) podle něj dal prostor oběma stranám a týkal se jen původu viru,
    ne očkování. Kritici prý nenašli jedinou nepravdu a útočili jen ad hominem: že vystupovali Beran,
    Rajchl a Peková (ta přitom zazněla jen z archivu ČT). Odmítá titulky „Rajchl jako odborník na covid“,
    protože mluvil jen jako právník o senátním slyšení Anthonyho Fauciho. Na dotaz Deníku N odpověděl,
    že s „propagandistickou žumpou“ mluvit nebude. Moláček by podle něj „za komunismu udělal kariéru“,
    je „etalonem úpadku ČT“ a jeho výroky přisuzuje „zadání z Bruselu“. Na Radu ČT chce dorazit osobně.
    Pokud ČT bude v Moláčkově přístupu pokračovat, podle Rajchla „by neměla existovat vůbec“.'
  citace:
  - text: Moláček, kdyby byl za komunismu, tak vám garantuju, že udělal kariéru, protože slepě jednoznačně
      prosazuje jenom a pouze názor strany a vlády.
  osoby:
  - osoba: jana-skopkova
    vztah: pozitivni
    kontext: Autorka dokumentu „Rozpolceno“, „jedna z nejlepších žurnalistek“
  - osoba: jan-molacek
    vztah: negativni
    kontext: „Největší cenzor“, „etalon úpadku ČT“, za komunismu by „udělal kariéru“
  podtema: Česká televize a mainstreamová média
- id: rajchl-2026-10-25-06
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: '„Tady jste na České“: moderátoři ČT skáčou hostům do řeči; Michal Půr jako vzor profesionality
    (Rajchl, 25. 10. 2026)'
  text: 'Rajchl odkazuje na video politologa Lukáše Valeše, kterému moderátor ČT opakovaně vstupoval do
    řeči. Na Valešovu námitku, že na Primě ani Nově se mu to neděje, prý moderátor odpověděl: „Ale tady
    jste na České.“ V té větě je podle Rajchla „úplně všechno“, protože moderátoři ČT podle něj „korigují“,
    ačkoli k tomu většinou nemají znalosti. Naopak Michal Půr (CNN Prima News) je podle něj nejvzdělanější
    moderátor, jehož názory při moderování „absolutně nepoznáte“. Rajchl tvrdí, že by z něj byl lepší
    předseda ODS než „teflonový panák“ Kupka.'
  citace:
  - text: Kdyby Michal Půr vstoupil do politiky, tak by byl dneska nejlepším předsedou ODS. Garantuju
      vám to.
  osoby:
  - osoba: lukas-vales
    vztah: pozitivni
    kontext: 'Moderátor ČT mu skákal do řeči: „tady jste na České“'
  - osoba: martin-kupka
    vztah: negativni
    kontext: „Teflonový panák“, s ním ODS skončí pod 5 %
  podtema: Česká televize a mainstreamová média
- id: rajchl-2026-10-25-07
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Pavel jako vyjednavač EU s Ruskem: „bezcharakterní korouhvička“ (Rajchl, 25. 10. 2026)'
  text: Zprávu, že Petr Pavel patří mezi pět možných kandidátů na vyjednavače EU s Ruskem, a „chvalozpěvy“
    liberální scény Rajchl označuje za neuvěřitelný názorový obrat. Pavel podle něj 4,5 roku tvrdil, že
    s agresorem se nevyjednává, že Ukrajina musí totálně zvítězit a že každý zastánce jednání je „kolaborant“
    a „Putinův agent“. Tento obrat podle něj předčí i schválení invaze z roku 1968 v Pavlově životopise
    z roku 1987 a zapadá do řady jeho dalších „otoček“ (Maroko, komunistická minulost). Místo přiznání
    chyby by měl Pavel podle Rajchla uznat, že s ním Rusko jednat nebude. Dnes už prý může „vyjednat jen
    kapitulaci“. „Vlastizrádce“ je podle Rajchla Pavel, ne ti, kdo k jednání vyzývali.
  citace:
  - text: To je tak neuvěřitelná názorová otočka, že i to schválení invaze v roce 68 v tom jeho životopise
      z roku 1987 bledne.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: 'Kandidát na vyjednavače EU s Ruskem: „bezcharakterní korouhvička“, otočka o 180°, „vlastizrádce
      je on“'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-10-25-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: '„Šibenice nikdy nebyly na mé demonstraci“: atmosféru rozpoutala bývalá vláda (Rajchl, 24. 10.
    2026)'
  text: '**25. 10.** — V nedělním vysílání Rajchl páteční protest na Malostranském náměstí popisuje jako
    „útok na Sněmovnu“. Když se po půlnoci vracel z Nizozemska, „zběsilí fanatici“ (podle něj z části
    opilí) mu tvořili hradbu a policie je musela fyzicky odtlačovat. Slovně i fyzicky se prý útočilo na
    Jaroslava Foldynu, a nebýt policie, „došlo by k fyzickému lynči“. Odmítá článek Seznamu, že na záznamech
    není vidět pokus o vniknutí, protože mluvčí policie podle něj tvrdí opak. Dlažební kostku připisuje
    režisérce Kateřině Dudové, kterou ostře osobně napadá (viz [stochastický teror](stochasticky-teror.md)).
    Dvojí metr vidí v tom, že jeho demonstraci se 100 tisíci lidmi (11. 3. 2023) média ignorovala a pokus
    pár lidí strhnout ukrajinskou vlajku z Národního muzea (se kterým sám nesouhlasil) líčila jako „útok
    lůzy na demokracii“. Dnešní menší protest na Staroměstském náměstí naopak přenáší živě. Pětikoalice
    podle něj tehdy s demonstranty odmítla jednat s odkazem na volební mandát a Rakušan vzkázal, že s
    organizátory „nebude mít slitování“. Pětikoalice přitom podle Rajchla porušila program (zdražení plynu,
    daň z nemovitostí, valorizace, Ukrajina), kdežto současná koalice plní, co slíbila. Opozici (Urbanová)
    vzkazuje, ať „sklidí, co zasela“, a zákon FARA prý koalice prosadí, „i kdybyste se postavili na hlavu“.'
  citace:
  - text: To je to skutečné ohrožení té demokracie. […] Ne to, že převedeme financování České televize
      pod státní rozpočet.
  osoby:
  - osoba: katerina-dudova
    vztah: negativni
    kontext: Připisuje jí dlažební kostku; „opilá, zneuznaná ženská“ živená z peněz ČT
  - osoba: jaroslav-foldyna
    vztah: pozitivni
    kontext: Oběť slovního i fyzického útoku protestujících
  - osoba: barbora-urbanova
    vztah: negativni
    kontext: „Občanská společnost chce diskutovat“ vs. odmítnutí jednat s jeho demonstranty, ať „sklidí,
      co zasela“
  podtema: Politická kultura
