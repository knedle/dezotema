  - osoba: jaroslav-flegr
    vztah: negativni
    kontext: „Blázen s toxoplasmózou“, „mrazáky v ulicích“ = dezinformace
  podtema: Původ a povaha pandemie
- id: rajchl-2026-10-25-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Koaliční shoda na úpravě § 405: trestat jen podněcování k násilí a nenávisti, ne „odchylný
    názor“ (Rajchl, 20. 10. 2026)'
  text: '**25. 10. (Rajchl)** — V nedělním vysílání Rajchl argumentaci opakuje: § 318a je „kladivo na
    čarodějnice“ a vyzvědače lze stíhat podle § 316. Rakušan podle něj lže, že koalice chce § 405 zrušit,
    protože jde jen o jeho úpravu. Ostře kritizuje Nejvyšší soud za výklad, že úmysl pachatele je dán
    už vědomím odchylky „od většinového názoru demokratické společnosti“, protože podle něj „to už je
    zase ta strana a vláda“.'
  osoby:
