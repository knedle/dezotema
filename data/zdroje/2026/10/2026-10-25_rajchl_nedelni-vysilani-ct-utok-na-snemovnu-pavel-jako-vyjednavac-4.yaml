- id: rajchl-2026-10-25-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Ukrajina: co média „zamlčují" — Majdan, Donbas, Minsk II, dekret č. 117, Istanbul (Rajchl,
    27. 9. 2026)'
  text: '**25. 10.** — Rajchl argument rozvíjí. Istanbulská dohoda, kterou podle něj potvrdil i ukrajinský
    vyjednavač David Arachamija, by Ukrajině ponechala kontrolu nad celým územím kromě Krymu. Donbas by
    získal autonomii s vlastní vládou a parlamentem jako v Československé federaci a federalizace by Ukrajině
    jen prospěla. Ti, kdo jednání odmítali a odpůrce války nazývali „chcimíry“, nesou podle něj vinu za
    „dva miliony lidských životů“, miliony uprchlíků, zadlužení a „chybějící dvě generace mužů“. Kyjevské
    vedení označuje za „šmejdy“, kteří rozkrádají zahraniční pomoc: v ukrajinské vládě prý „všichni kradou“
    a Zelenskyj je „král zlodějů“, jak podle něj nyní říkají i Elon Musk a starosta Kyjeva Vitalij Kličko.'
  citace:
  - text: Vy máte tu krev na rukou. Vy jste zodpovědní za to utrpení obyčejného ukrajinského lidu.
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
