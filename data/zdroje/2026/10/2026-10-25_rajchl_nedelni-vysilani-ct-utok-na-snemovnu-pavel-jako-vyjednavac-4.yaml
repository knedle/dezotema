- id: rajchl-2026-10-25-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Dokument ČT „konečně odvysílal pravdu“: SARS-CoV-2 uměle vytvořen ve Wu-chanu za peníze USA
    (Rajchl, 22. 10. 2026)'
  text: '**25. 10.** — Rajchl doplňuje, že původ viru z laboratoře dnes podle něj uznává FBI i americké
    tajné služby a že Tulsi Gabbardová přiznala, že to Američané věděli od začátku. Odvolává se i na Luca
    Montagniera (nobelista, objevitel HIV), podle něhož šlo o nepovedený a uniklý laboratorní experiment.
    Z dokumentu vyvozuje odpovědnost médií: kdyby neumlčovala prof. Berana a informovala o Isoprinosinu
    (prý během hodin zvyšuje počet bílých krvinek a imunitu) a o Ivermectinu (Nobelova cena 2015), „mohly
    tu dnes být tisíce lidí naživu“. Dezinformace podle něj šířili Blatný („kdo se naočkuje, nenakazí
    se“) a Flegr („mrazáky v ulicích, 40 000 mrtvých“). Pfizer podle něj žaluje šest amerických států
    za zatajování nežádoucích účinků.'
  citace:
  - text: A i vy máte tu krev na rukou, přátelé. I vy. Protože kdybyste neumlčovali profesora Berana […]
      tak tady mohly dneska být tisíce lidí naživu.
  osoby:
