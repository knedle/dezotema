  nadpis: '„Cestovní agentura Petra Pavla“: let do Maroka jako klientelismus; Eva Pavlová jako „soukromá
    osoba“ nemá dostávat 106 tisíc (Rajchl, 11. 10. 2026)'
  text: '**13. 10.** — Rajchl ve Sněmovně navrhl zařadit bod „Výzva Poslanecké sněmovny prezidentovi Petru
    Pavlovi ke zveřejnění způsobu úhrady nákladů jeho soukromé dovolené v Maroku“. Prezident podle něj
    letěl soukromým proudovým letadlem do Maroka, jiným zpět na volby, znovu tam a „zřejmě přicestuje
    dalším“ (25–30 t CO₂; „kolegové ze Zelených by měli protestovat jako první“). Letadlo patřilo Creditasu,
    ale nevíme, kdo ho objednal ani jak Pavel hradil svou „údajnou část“. Když se „neustále bavíme o střetu
    zájmů Andreje Babiše“, musí platit transparentnost „padni komu padni“. Připomíná německého prezidenta
    Christiana Wulffa, který v roce 2012 rezignoval mimo jiné kvůli tomu, že mu dovolené platily spřízněné
    subjekty: „Tak jestli chceme patřit na Západ, tak ať nám pan prezident vysvětlí… jestli tady není
    náhodou podezření na quid pro quo.“'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
