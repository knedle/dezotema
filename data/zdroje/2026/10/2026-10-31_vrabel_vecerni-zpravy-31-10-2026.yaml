  nadpis: ve velkých českých městech bude za 10 let víc migrantů než původních obyvatel
  text: Přes migrační pakt a dovoz pracovníků bude do deseti let ve velkých českých městech žít víc migrantů
    než původních obyvatel.
  citace:
  - text: Za takových deset let určitě se dočkáme toho, že naše hlavní města, že tam bude žít víc imigrantů,
      víc migrantů než původního obyvatelstva.
  predikce:
    horizont: cca 2036
    stav: ceka
