  text: (výslovně dodává, že k terorismu nevyzývá)
  citace:
  - text: Ale na druhou stranu, kdyby mě někdo vyvraždil moji rodinu, […] no tak bych řekl, OK, tak oko
      za oko, zub za zub, jako to přece nemůžeme jen tak nechat. Takže ani bych se nedivil, kdyby byl
