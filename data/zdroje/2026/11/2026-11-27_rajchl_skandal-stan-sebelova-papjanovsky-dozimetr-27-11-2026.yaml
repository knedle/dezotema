- id: rajchl-2026-11-27-01
  typ: tvrzeni
  temata:
  - kauzy
  podtema: Dozimetr
  nadpis: Šebelová prozradila, že Papjanovský vynesl neveřejné informace z komise k Dozimetru — podnět imunitnímu výboru (Rajchl, 27. 11. 2026)
  text: |
    Místopředsedkyně STAN Michaela Šebelová podle Rajchla ve Sněmovně v reakci na časopis zobrazující
    Rakušana jako „Dona Vita“ prozradila, že její stranický kolega Jan Papjanovský vědomě porušil § 48
    odst. 8 zákona o jednacím řádu Sněmovny, když vynesl informace z neveřejného zasedání vyšetřovací
    komise k Dozimetru (výpověď ředitele NCOZ Jiřího Mazánka). Rajchl podal podnět mandátovému a
    imunitnímu výboru a věří, že vyvodí důsledky.
  citace:
  - text: Prozradila, ono mi to ulétlo v návalu těch emocí, na svého kolegu Jana Papajanovského, že porušil zákon vědomě.
    cas: "00:27"
  osoby:
