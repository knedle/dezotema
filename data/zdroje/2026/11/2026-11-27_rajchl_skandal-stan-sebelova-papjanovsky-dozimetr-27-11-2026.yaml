- id: rajchl-2026-11-27-02
  typ: postoj
  temata:
  - kauzy
  podtema: Dozimetr
  nadpis: STAN opakovaně vědomě porušuje zákony — „to samé v bledě modrém“ jako schůzka u Rakušana v dubnu 2022 (Rajchl, 27. 11. 2026)
  text: |
    Únik z komise podle Rajchla zapadá do vzorce: už v dubnu 2022 se podle médií v Rakušanově kanceláři
    konala schůzka vedení STAN, kde se probíraly tajné informace z živého policejního spisu a Rakušan
    sděloval, že „se píše 6 až 8 sdělovaček“. „Neúcta k našim zákonům, jejich vědomé porušování — přesně
    to je hnutí STAN.“ Kdo chce ve vedení státu takové lidi, ať je volí, on ne.
  citace:
  - text: Dnes to máme to samé v bledě modrém. Neúcta k našim zákonům, jejich vědomé porušování, přesně to je hnutí STAN.
    cas: "01:25"
  osoby:
  - {osoba: vit-rakusan, vztah: negativni, kontext: 'Na schůzce v roce 2022 měl sdílet tajné informace z policejního spisu'}
  vazby:
  - {na: rajchl-2026-06-17-01, typ: posun}
- id: rajchl-2026-11-27-03
  typ: stoch-teror
  temata:
  - kauzy
  nadpis: STAN jako „mafiánské hnutí“ a „mafiánský klan“ v parlamentu (Rajchl, 27. 11. 2026)
  text: |
    Opakovaně označuje STAN za „mafiánské hnutí“ a „mafiánské sdružení“ pokračující v „mafiánských
    praktikách“; v popisku příspěvku píše, že „v jiných zemích nesedí mafiánský klan v jejich
    parlamentech“. Kriminalizace pojmenované politické strany bez výzvy k trestu či násilí — hraniční
    případ.
  citace:
  - text: Místopředsedkyně tohoto mafiánského sdružení a rekordmanka v čerpání poslaneckých náhrad Michaela Šebelová …
    cas: "00:08"
  - text: Lidi, kteří nerespektují naše zákony, kteří se jim vysmívají, kteří si dělají, co chtějí, a pokračují v těch mafiánských praktikách.
    cas: "02:00"
  teror:
    terc: hnutí STAN
    hranicni: true
