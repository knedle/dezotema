  text: '**15. 11. (11:11)** — V nedělním vysílání Zítko z velké části předčítá texty Jiřího Křížka (podle
    Judy Byington), Rinuse Verhagena a anonymních autorů a doplňuje je vlastním komentářem. Do zviditelnění
    „finále“ zbývá podle něj „33 dní časový okno“. Tribunály prý pracují „nepřetržitě 24 hodin denně“,
    nejnebezpečnější zločinci byli popraveni a nahrazeni dvojníky. MedBeds jsou nainstalované „už v Japonsku“
    a v roce 2027 „to bude viditelný“. Cílem „zrůdiček“ byla depopulace na „zlatou miliardu“. Na reset
    do kvantového systému se musí „všechno vypnout“: přijde výpadek internetu a funkční zůstane jen armádní
    síť. Zpráva o odstávce tří bank je podle něj příprava a nové peníze budou kryté zlatem jako před zrušením
    zlatého standardu za Nixona v srpnu 1971. QFS „vrátí bohatství, ne všem“: nedostanou ho „loutky a
    slouhové režimu“ (soudci, policisté, očkující zdravotníci), ale jen ti, kdo „pozitivně vibrují“. Opakuje,
    že viděl „minimálně 20 Trumpů, 20 Putinů“ a že v Central Casting hraje asi 200 tisíc herců-dvojníků.
    Případný pád Air Force One nebo atentát na Trumpa by byl divadlem, protože Trump je od 20. 1. 2021
    „vrchním velitelem aliance“ („starter Kennedy, finisher Trump“). Moc má převzít armáda a „v oknu do
    120 dnů budou vypsány nové volby“, i v ČR: „bude to armáda“, ne Pavel („šikovnej turista“) ani Babiš,
    „který je jak vyměněnej“ a „vypadá trošku jinak“. Nově tvrdí, že „všechny falešné jaderné zbraně na
    světě“ zneškodnily už v roce 2019 americké a „myslím si, že i ruské“ vesmírné síly, takže strach z
    třetí světové války je „falešná událost“, která „do falešných Vánoc skončí“ (viz [predikce.md](predikce.md)).
    Ve čteném textu zazní i 800 tisíc ztracených dětí ročně v USA a 8 milionů ve světě (odkaz na film
    „Sound of Freedom“).'
