    konec „falešné války“ do Vánoc. Stochastický teror nezjištěn (hraniční: souhlasné líčení poprav a
    tribunálů bez konkrétního terče). Zpracováno podle shrnutí pomocného agenta, klíčové citace ověřeny
    v přepisu.'
