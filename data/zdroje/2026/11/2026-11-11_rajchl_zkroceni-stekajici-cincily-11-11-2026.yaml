  nadpis: 'Merzovo „brutální vydírání“: blokace rozpočtu EU, aby ČR platila Ukrajině 60–70 mld. Kč ročně
    — vláda nesmí ustoupit „ani o milimetr“ (Rajchl, 10. 11. 2026)'
  text: '**11. 11.** — V televizní debatě Rajchl souhlasí s Babišem a Ficem, že jde o vydírání, a oceňuje
    „pevnou pozici“ premiéra Babiše. Opozici vyčítá dvojí metr: když Petr Macinka poslal Petru Pavlovi
    SMS, že bez dohody čeká „extrémní kohabitace“, opozice podle něj dva měsíce křičela o vydírání prezidenta
    a podávala trestní oznámení. Merzův tlak je podle něj „stokrát horší“, a přesto ho tíž lidé nazývají
    „stylem vyjednávání“. Nejde prý o mír, ale o to, že ukrajinský rozpočet bude v hlubokém deficitu ještě
    mnoho let.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
