vyroky:
- id: vrabel-2026-11-09-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Dovolání Bradáčové v kauze plakátů SPD — „měla by být souzená“; britské poměry se „přelijí“
    k nám (Vrabel, 9. 11. 2026)
  text: 'K dovolání nejvyšší státní zástupkyně Lenky Bradáčové v kauze předvolebních plakátů SPD z roku
    2024 (odvolací soud hnutí osvobodil) Vrabel uvádí, že jde o „jedinou věc“, v níž za dlouhou dobu SPD
    podpořil: lidé musí mít právo varovat před bezpečnostním rizikem migrace z Afriky a Blízkého východu.
    Kdo politicky zakazuje mluvit o nebezpečí pro národ, ten podle něj národ do nebezpečí uvádí, a Bradáčová
    by proto „měla být souzená“. Komolí její jméno („Bradavkáčová“), za což se omlouvá, a dodává, že ve
    „svobodné, slušné a normální společnosti“ by „pravděpodobně visela na nějaké nástěnce“ lidí, kteří
    vytvořili nebezpečné situace pro ČR (viz [Stochastický teror](/stochasticky-teror.md)). V Británii
    by za takové plakáty podle něj všichni šli sedět; britské poměry (desetitisíce zatčených za výroky
    na sítích, opakovaně zatčený Tommy Robinson, jehož kolega byl podle Vrabela za sendvič s vepřovým
    u mešity uvězněn a ve vězení zabit muslimy) se přes Německo „postupně přelévají k nám“.'
  citace:
  - text: Podle mě by měla být souzená Lenka Bradáčová.
  osoby:
  - osoba: lenka-bradacova
    vztah: negativni
    kontext: Dovolání v kauze plakátů SPD; „měla by být souzená“, „visela by na nástěnce“ (→ stoch. teror)
  podtema: Trestání politického projevu
- id: vrabel-2026-11-09-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Konec dočasné ochrany a potvrzení o odsloužení v armádě pro zaměstnanecké karty Ukrajinců —
    „fašistický přístup“ vlády, který povede k šedé zóně a mafii (Vrabel, 9. 11. 2026)
  text: 'K vládnímu záměru zrušit Ukrajincům dočasnou ochranu a podmínit zaměstnanecké karty podle něj
    potvrzením ukrajinské armády o odsloužení Vrabel říká, že jde o „normálně fašistický přístup“: tito
    lidé jsou „odsouzení prakticky k smrti“, protože by je na Ukrajině „okamžitě zavřeli do autobusu a
    nahnali na frontu“. Přestože se mu nelíbí, že je v ČR „tolik Ukrajinců“, nesouhlasí s tím, aby byli
    posíláni „rovnou na smrt“. Důsledkem podle něj bude šedá zóna, nelegální práce a mafie, které budou
    lidi skrývat před úřady. Připomíná, že v březnu 2022 sám s Jiřím Janečkem vezl autobusem ukrajinské
    ženy a děti z hranic do bezpečí, a proto by bylo „docela nefér“, kdyby ho Ukrajina zařadila na seznam
    webu Myrotvorec, který podle něj funguje jako „dead list“.'
  citace:
  - text: Nelíbí se mi, že je u nás tolik Ukrajinců, ale nemůžeme je posílat rovnou na smrt.
  osoby:
  - osoba: jiri-janecek
    vztah: neutralni
    kontext: V březnu 2022 s ním vezl ukrajinské ženy a děti z hranic
- id: vrabel-2026-11-09-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Globální vzorec perzekuce kritiků globalistické agendy (Vrabel, 9. 7. 2026)
  text: '**9. 11.** — K vynesení trestu (10 let a 6 měsíců vězení) Vrabel rozebírá jednotlivé skutky.
    Podle něj jde o „tvrzení proti tvrzení“ bez důkazů: za položení hlavy do klína maskérky dostal devět
    měsíců, znásilnění spočívalo v análním styku s 21letou fanynkou, kterou popisuje jako „velmi promiskuitní
    holku“, jež „musela vědět, do čeho jde“ — to podle něj „úplně není“ znásilnění. Porotci podle něj
    rozhodli pod vlivem dokumentu s herci, který z Branda udělal predátora, a „polehčující okolnosti“
    (18 let spořádaného života) mu přesto vynesly přes deset let v nejhorším londýnském vězení. Rozsudek
    označuje za „černý den“ a jednu z „nejotřesnějších věcí“, které zažil. Režim podle něj kritiky, které
    nemůže odsoudit za slova, likviduje sexuálními obviněními (Brand, Assange) nebo vykonstruovanými finančními
    podvody (Fuellmich, šéf AfD, on sám), a „tohle bude horší a horší“.'
  citace:
  - text: Režim, když někde mluvíte proti něčemu […] tak samozřejmě proti takovým lidem se nebojuje tím,
      že by byli odsouzení za to, co říkají.
  osoby:
  - osoba: russell-brand
    vztah: pozitivni
    kontext: Odsouzení k 10,5 roku „černý den“; „jeden z nejinteligentnějších lidí“, umlčen za kritiku
  - osoba: reiner-fuellmich
    vztah: pozitivni
    kontext: Oběť vykonstruovaných finančních obvinění
  podtema: Politická perzekuce
- id: vrabel-2026-11-09-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vládní návrh ústavního zákona o referendu bez otázky EU a NATO jako „pokus o diktaturu“ — srovnání
    s rokem 1968 (Vrabel, 9. 11. 2026)
  text: K vládou schválenému návrhu ústavního zákona o celostátním referendu (300 tisíc podpisů nebo souhlas
    obou komor, předchozí posouzení Ústavním soudem, ke schválení téměř 3 miliony hlasů) Vrabel říká,
    že zákon je „retardovaný“. Na jednu stranu uznává lid jako zdroj moci, na druhou mu upírá rozhodnout,
    zda chce být „vlastněn Evropskou unií“ a být „protektorát“, nebo suverénní a vojensky neutrální zemí.
    Vyloučení otázek členství v EU a NATO označuje za „pokus o diktaturu“ ze strany vlády a přirovnává
    ho k situaci, kdy by vláda v roce 1968 lidem upřela právo vyjádřit se k sovětským vojskům nebo k tomu,
    že o rozpočtu a daních rozhoduje Moskva. Navazuje na [prezentaci změny systému (8. 11.)](/temata/politicky-system/2026.md#vrabel-2026-11-08-04).
  citace:
  - text: Ten návrh zákona je retardovaný v tom, že na jednu stranu připouští referendum […] Na druhou
      stranu ten zákon říká, lidé v České republice nemají svobodu rozhodnout se o tom, jestli chtějí
      být vlastněni Evropskou unií.
  podtema: Vlastní vládní program „kdybych byl Babišem" (Černohorský)
- id: vrabel-2026-11-09-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Trumpova „nenávist mezi Putinem a Zelenským“ jako „argument pro třetí třídu“; Finsko s jadernými
    Rafaly znemožňuje návrat k architektuře 1997, Evropa „užitečný idiot“ mimo jednací stůl (Vrabel, 9.
    11. 2026)
  text: 'Trumpovo tvrzení, že hlavní překážkou míru je vzájemná nenávist Putina a Zelenského, označuje
    Vrabel za „argument pro děti ve třetí třídě“. Skutečné důvody podle něj Rusko jasně oznámilo: „denacifikaci“
    Ukrajiny (zákony proti ruskému jazyku a kultuře, pokuta Budanovovi za ruštinu) a rozšiřování NATO
    navzdory slibu z konce studené války. Návrat k bezpečnostní architektuře z roku 1997 s pásem neutrálních
    zemí je podle něj nemožný, protože Finsko je v NATO, odhlasovalo si možnost jaderných zbraní a zapojí
    se do Macronovy iniciativy s letouny Rafale nesoucími rakety ASMP. Situace je proto „patová“. Trumpovi
    nevěří, protože válku slíbil ukončit do 24 hodin, a pochybuje, že by ji dokázal ukončit, i kdyby Ukrajinu
    odřízl od zbraní, zpravodajských informací a internetu, protože Evropa „zbrojí až po uši“. Mír nebude
    „spravedlivý“ ve smyslu evropského „just and lasting peace“, protože Rusko si dobytá území ponechá.
    Očekává, že si USA, Rusko a Čína rozdělí sféry vlivu jako na Jaltě a dohodnou se, že spolu nepůjdou
    do velké války. Evropa podle něj měla v letech 2021–2022 podpořit ruské požadavky; protože se postavila
    na stranu Ukrajiny, nemá u jednání žádný vliv. Válka je ve skutečnosti konfliktem USA s Ruskem, Ukrajina
    je „proxy“ a Evropa „užitečný idiot“, který přišel o ekonomiku, levné energie i svobodu. V Abú Zabí
    budou zástupci EU a NATO podle něj jen „na chodbě“ jako „psychická podpora Ukrajiny“.'
  citace:
  - text: Války se nevedou kvůli tomu, že má nenávist mezi sebou jeden prezident a druhý prezident. To
      je prostě nesmysl.
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: Nenávist Putina a Zelenského jako „argument pro třetí třídu“; nevěří mu, válku slíbil ukončit
      do 24 hodin
  podtema: Vyjednávání a mír
- id: vrabel-2026-11-09-08
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: USA, Rusko a Čína si rozdělí sféry vlivu a dohodnou se, že spolu nepůjdou do velké války; Trump
    „dlouhý a trvalý mír“ na Ukrajině nezajistí
  text: Velmoci si podle vzoru Jalty rozdělí sféry vlivu a dohodnou se na tom, že mezi sebou nepovedou
    velkou světovou válku (zda dohoda vydrží, neví). Trump nedokáže válku na Ukrajině ukončit trvalým
    mírem.
  citace:
  - text: Samozřejmě, že si bude Ruská federace, Čína a Spojené státy rozdělovat sféry vlivu […] a dohodnou
      se na tom, že nepůjdou do velké světové války mezi sebou. […] Ale nemyslím si, že Donald Trump je
      schopný v tuhle chvíli ukončit ten konflikt na Ukrajině.
  dalsi_zdroje:
