      text: Po summitu Vrabel říká, že jednání „dopadla přesně tak, jak jsem očekával“. Trumpův výrok
        „Putin je můj kamarád“ chápe jako signál, že USA nebudou zasahovat. Zda jde o rozdělení sfér („Trump
        do Íránu, Putin do Evropy, Čína Tajvan“), nechává otevřené („těžko říct“).
