  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: |-
    **1. 11. — Holýšov:** Čermák na setkání nepřišel. Podle Zítka v pátek nikdo nebral telefon a v sobotu odpoledne matka oznámila, že Tomáš není doma a ona ho shánět nebude; v kulturním domě čekali 1. 11. od 1:11 do 3:33 a zbylá jídla nechali na baru pro Čermáka, matku a otčíma, kteří podle něj bydlí „přes ulici“ a „báli se sejít“. Zítko prohlásil, že „hru na Čermáka“ od této chvíle nehraje, ale banner chce předat „skutečnému Tomáši Čermákovi“ — tezi o dvojníkovi tedy neopouští. (Matka předtím v telefonátech uvedla, že žádné setkání domluvené nebylo.)

    Během čekání měl Zítko pro případ, že by přišel muž z Liberce, Přeštic či TV Šalingrad, připraveného „Oscara za nejlepší herecký výkon“ v roli Čermáka; Tomáš se podle něj „schovává za máminou sukní“.
  citace:
  - text: Hru na Čermáka, na rozdíl od všech ostatních, už tedy od teďka nehrajeme.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
