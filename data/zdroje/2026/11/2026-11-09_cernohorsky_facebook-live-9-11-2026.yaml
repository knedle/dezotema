  nadpis: 'Spory uvnitř vlastenecké scény: Bernardy, Tušl, Novas, Vidra, Galligardy (Černohorský, 5. 10.
    2026)'
  text: '**9. 11.** — Černohorský tvrdí, že ho neporazí protistrana, obžaloba ani kriminál. Na rozdíl
    od „Bartoka“ či Čermáka by prý nikdy nepřiznal lež výměnou za svobodu, „kdybych měl v kriminále zdechnout“.
    Porazí ho jen vlastní scéna. Přiznává, že změnil názor na rozdělení Československa i na některé politiky
    a lidi, ale zásady má od roku 2015 neměnné. Jako jediný na scéně se prý veřejně přiznal k tomu, co
    před rokem 2015 dělal špatně. Scéna podle něj „živí parazity“ (Zítko, Bernardy) a tleská „zmrdům“
    (Vrabel, Sládek), zatímco jeho projekty (vlastní média, „Pošli to dál“) shodila řečmi, že si chce
    platit exekuce. Ve „společenství“ je podle něj jen asi 350 lidí. Ještě chce dořešit případy Terezy
    Vlasákové a Ivy Rosické (viz [výše](politicky-system.md#nemate-penize-nemate-spravedlnost-cernohorsky-7-11-2026))
    a pak „mám z toho chuť se na to vysrat“. K volbám ať lidé chodí, „ale beze mě“.'
  citace:
  - text: Víte, kdo mě porazí? Vy, vy mě porazíte. Tadle scéna mě porazí.
