  poznamka: 49 min, živé vysílání (částečně z auta). Macinka a „mužatky“, rusofobie a sport, příčiny války,
    „třetí světová“, zrušení ČT, Babišova vláda bez alternativy, spory na scéně. 1 predikce, 3 výroky
    stochastického teroru (Fiala, Rakušan, hraničně dárci „Dárku pro Putina“).
vyroky:
- id: cernohorsky-2026-11-09-01
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: ČT zrušit, ani ze státního rozpočtu — „postkomunistický moloch s třemi tisíci parazitů“; ČT
    odpovědná za stav politiky (Černohorský, 9. 11. 2026)
  text: 'Černohorský nechce ČT platit ani ze státního rozpočtu, protože za posledních deset let podle
    něj „nepřinesla nic pozitivního“, jen „gender“ a „propagaci úchylárny“. Jako příklady uvádí YouTube
    pořad „Čiči na gauči“ s „transvestitou“ a znělkou „dobrá číča, nejsou žádná píča“ a příspěvek (s výhradou
    „jestli to je pravda“), že si ve studiu po desáté hodině „lajnovali“ a někdo se pozvracel. Když Prima
    a Nova fungují s 500–700 zaměstnanci, nevidí důvod živit „postkomunistický moloch“ se „třemi tisíci
    parazitů“ a ředitele s platem 300 tisíc měsíčně a odměnami 12 milionů ročně. Poplatky jsou podle něj
    „socialistický výdobytek z roku 1955“. Média a ČT jsou podle něj zodpovědná za to, co se děje v politice:
    „kdyby média chtěla“, nebyla by válka, pandemie ani chudoba. Moderátorky nazývá „kundami“ a „stupidní
    pičou“ bez novinářské nestrannosti. Macinkovi přiznává, že díky „výchově“ v Institutu Václava Klause
    v televizi obstojí.'
  citace:
  - text: Nevidím jedinej důvod, proč, kurva, živit moloch, postkomunistický moloch s třema tisícama parazitů.
  podtema: Nová alternativní média
- id: cernohorsky-2026-11-09-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Macinkův výrok o „ruských mužatkách“ je „extrémně nešťastný“; „věk ani pohlaví není zásluha“
    (Rajchl, 8. 11. 2026)
  text: '**9. 11. — Černohorský** výrok kritizuje ještě ostřeji. Macinka je podle něj vtipný a pohotový
    vůči „fialovým“, ale v otázce Ruska „pitomec“. Spolu s Borisem Šťastným jsou podle něj „vymydlení“
    rusofobové, kdežto Filip Turek se „uklidnil“. Tahat do sporu sport ho „sere“. Mužatky jsou podle něj
    k vidění spíš na Prague Pride, kdežto hokejistky, proti nimž sám kdysi hrál, byly „nádherné holky“.
    ⚡ Na rozdíl od Rajchla ale ženský hokej vnímá jako produkt „poženštěné“ doby: za socialismu si ho
    nepamatuje a ženy podle něj přebírají mužské role, protože „chlapi přestali být chlapama“ („mamánci
    na kolobrndách v růžových košilkách“). Za to podle něj mohou muži, tedy i Macinka.'
  citace:
  - text: Takže mužatky? I kdyby. Tak kdo za to teda může? […] No třeba právě ty, Macinko.
  osoby:
