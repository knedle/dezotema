- id: cernohorsky-2026-11-09-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Návrat ruské reprezentace na MS v hokeji: „politika do sportu nepatří“, kritici jsou „pokrytci
    a farizejové“ (Rajchl, 30. 10. 2026)'
  text: '**9. 11. — Černohorský** považuje vyřazování ruských sportovců za „rusofobii“ a pokrytectví.
    Podle stejné logiky by USA musely vrátit všechny medaile z mistrovství i olympiád, protože od roku
    1946 nepřestaly vést války. „Masoví vrazi“ jsou podle něj američtí prezidenti, Bush mladší, Obama
    i Trump (jen ve Vietnamu prý zemřely 4 miliony lidí), a Ameriku nikdo nevylučoval. Sportovci podle
    něj zasvětili sportu život a jsou „persekuováni“ za to, co „v roce 2015 rozpoutali zmrdi na Ukrajině“.
    Babišovi, vládě a Motoristům vzkazuje, ať s „rusofobií“ přestanou.'
  podtema: Zahraniční aktéři a precedenty
- id: cernohorsky-2026-11-09-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Kde jste byli osm let?" — Donbas, Minsk jako podvod, biolaboratoře; vláda Babiše a Macinky
    jako „rusobijci" (Černohorský, 5. 10. 2026)
  text: '**9. 11.** — Černohorský opakuje, že Putin za válku „nemůže“: speciální operace měla podle něj
    „osmiletý“ důvod. Uvádí Majdan, Minské dohody (přiznání „té svině Merkelové“), referenda z let 1991
    a 1994, v nichž podle něj východ Ukrajiny chtěl federalizaci, a krymské referendum, při němž byli
    ruští vojáci na Krymu podle smlouvy. Krym je podle něj reakcí na „koketování“ Ukrajiny s EU a NATO,
    USA by se v opačné situaci zachovaly stejně. Babiše vyzývá, ať nechá zveřejnit šestidílný dokument
    ČT o neonacismu na Ukrajině. O „bujícím neonacismu“ psala podle něj ještě v lednu 2022 i Aktuálně,
    Novinky, Lidovky či Hospodářské noviny. Jako aktuální doklad uvádí státní pohřeb veterána divize SS
    Galizien. Připomíná, že ho za podobné výroky v roce 2022 obvinil z popírání genocidy „vojenský komunistický
    prokurátor“ Igor Stříž, on ale věděl, co říká, „aby mě zavřít nemohli“. Zdůrazňuje, že válku nechce
    a nemá radost z „tří milionů“ mrtvých Ukrajinců.'
  osoby:
  - osoba: angela-merkelova
    vztah: negativni
    kontext: „Svině“, přiznala podvod s Minskem
  - osoba: igor-striz
    vztah: negativni
    kontext: „Vojenský komunistický prokurátor“, obvinil ho z popírání genocidy
  podtema: Zahraniční aktéři a precedenty
- id: cernohorsky-2026-11-09-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Válka neskončí kvůli von der Leyenové, Kallasové a Zdechovskému — „maximálně třetí světovou“;
    dárci „Dárku pro Putina“ jsou „skurvený kundy“ (Černohorský, 9. 11. 2026)
  text: Černohorský chce, aby válka skončila, ale podle něj neskončí, dokud v Evropě rozhodují von der
    Leyenová, Kallasová, Zdechovský „a další“ s „progresivním Slovenskem“ v Evropském parlamentu. Skončí
    podle něj „maximálně třetí světovou válkou“. Lidstvo ji možná „potřebuje“, aby ti, kdo si na profil
    píšou „chci válku“, pochopili, že nejde o videohru, ale o životy. Dárce sbírek typu „Dárek pro Putina“
    nazývá „čuráky“ a „obyčejnými skurvenými kundami“, „bez empatie, bez srdce, bez rozumu“. Na operaci
    nemocného chlapce Jiříka za 100 milionů se podle něj nevybere, ale na „vraždění Rusáků“ se vyberou
    miliardy. Zelenskyj a ukrajinští oligarchové podle něj rozkradli „takové miliardy, až to tříská dveřmi“.
    Výroky viz [Stochastický teror](stochasticky-teror.md).
  citace:
  - text: Neskončí to. Co si kurva myslíte? Jo, skončí, tak maximálně třetí světovou válkou.
