- id: cernohorsky-2026-11-09-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Kritika vlády bez alternativy — nic lepšího než Babiš, Okamura a Macinka; SPD devět let nic,
    Konečná u Patriotů „není zrada“ (Černohorský, 6. 11. 2026)
  text: '**9. 11.** — Komentáři, že Babišova vláda je „to stejné“ jako Fialova, Černohorský oponuje. Kdyby
    dál vládla „fialová, žluto-modrá banda“, lidé by „neměli co žrát“, v chudobě by nebyl „jen milion
    lidí“ a nastal by státní bankrot, „to vám garantuju“. Fialova strana je podle něj ráda, že „svinstva“
    musí napravovat Babiš. Babiše sám kritizuje („vyserte se na rusofobii“, „jednoho dne budete za stejného
    idiota jako ten idiot na Hradě“), ale odvolání vlády nechce, protože „není jiné možnosti“. Ministra
    Juchelku by „okamžitě vyměnil“ jako „neschopného“ a na ministerstvu zdravotnictví nechce „Vojtěchovou“
    (patrně hanlivě míněn Adam Vojtěch). Superdávku kritizuje: když systém potřebuje peníze, „tak ty prachy
    tam prostě nasypte“, protože lidé nemají na nájem ani jídlo, zatímco politici řeší ruské hokejisty
    a přidávají si platy. Uvádí příběh dcery kamarádky z pardubické nemocnice, kde podle něj „nebyl jediný
    Čech“, ukrajinský personál pohrdal Čechy a pacientku nechal po vyšetření celý den hladovět. Fialu
    a Rakušana uráží a pro Rakušana žádá vězení (viz [Stochastický teror](stochasticky-teror.md)).'
  citace:
  - text: Máte, je tady nějaká jiná možnost, byla nějaká jiná možnost než ten Andrej Babiš? Nebyla.
  osoby:
  - osoba: andrej-babis
