  podtema: Reiner Fuellmich
  nadpis: Fuellmich bude propuštěn po dvou třetinách trestu — „bondovský únos z Mexika“ a „bojovník proti COVID mafii číslo 1“ (Zítko, 24. 11. 2026)
  text: |
    Podle zprávy převzaté od Rogera Bittela soudce ve věznici v Lingenu oznámil Reineru Fuellmichovi, že
    nemá námitky proti jeho propuštění po odpykání dvou třetin trestu, pokud se neodvolá státní zástupce.
    Zítko uvěznění označuje za protiprávní, „na základě křivých obvinění“ — Fuellmicha podle něj německá
    tajná služba vylákala na ambasádu v Mexiku a „bondovsky“ unesla do Německa. Fuellmicha nazývá
    „bojovníkem světovým číslo 1 proti COVID-19 mafii“ a připomíná svou protestní nótu z roku 2024
    adresovanou „tehdejšímu sluhovi Deep Statu“ Olafu Scholzovi.
  citace:
  - text: Jeho protiprávní uvěznění, jeho doslova bondovský únos z Mexika, kdy německá tajná služba ho vylákala na ambasádu pod záminkou, že má prošlej pás.
    cas: "01:12"
  - text: A adresoval jsem ji tehdejšímu sluhovi Deep Stateu a spolkovému kancléři Olafu Scholzovi.
    cas: "23:38"
