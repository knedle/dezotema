  podtema: Plán a Central Casting
  nadpis: Propuštění Fuellmicha jako součást „scénáře“ — „juliánské jedničky“, viditelných 20 % a 200 000 nahrazených v Central Casting (Zítko, 24. 11. 2026)
  text: |
    Zítko zdůrazňuje, že soudce přišel 24. 11., což je podle juliánského kalendáře 11. 11., „den, kdy jsou
    tam samý jedničky“. Propuštění je podle něj součástí „scénáře“ změn při přechodu do „nového věku“:
    „vrchní velitel armády aliance“ řekl, že 20 % z toho, co se bude dít, uvidíme, a ten čas „právě
    nastal“. V rámci Central Casting bylo podle něj nahrazeno 200 000 jedinců po celém světě a události
    sledujeme „v repríze“. Mainstreamová média budou zprávu blokovat — „důvěřujte plánu“.
  citace:
  - text: Vrchní velitel armády aliance vám řekl, že 20 % z toho, co se bude dít, určitě uvidíte, a ten čas právě nastal. Takže důvěřujte plánu.
    cas: "27:44"
  - text: Nestačí, že v rámci Central Casting bylo nahrazeno dvě stě tisíc jedinců po celém světě a vy ty události sledujete v repríze.
    cas: "29:15"
