  text: '**16. 11.** — V pondělním vysílání Zítko většinou předčítá příspěvky „Sofie Esmeraldy“, „Trump
    TV“ a dalších. Test EBS má podle nich proběhnout 17. 11. ve 14:20 východního času (20:20 u nás) a
    může být „naostro“. Pak má přijít globální výpadek ve vlnách, „desetidenní zástava komunikace“ a Starlink
    bude nepřetržitě vysílat dokumenty o satanismu a kanibalismu. „Na konci tohoto očistného procesu budeme
    svobodní a osvobozeni od dluhu.“ Ohlášené odstávky bank Unicredit, Raiffeisen a J&T jsou podle něj
    „předzvěst první vlny“. Současně radí „neupínejte se na datumy“: pokud se „nějakých třeba 10–20 %
    informací, které jsem predikoval“, ještě nestalo, „neznamená to, že to není pravda“. Na schůzce velké
    trojky budou podle něj dvojníci, protože „skutečný Donald Trump“ je jako vrchní velitel aliance „dobře
    ukryt“ před atentátem. Podle Trump TV byli globální lídři a „konstruktéři Deep State“ už „popraveni
    a vyřešeni“ a teď běží „repríza“. Rusko podle něj „zrušilo zákaz vraždy Zelenského“, takže „možná
    toho dvojníka vyřeší Ukrajinci sami“. Mezi „top bílé klobouky“ řadí bin Salmána, Si, Orbána, Módího,
    Bolsonara, Kima, Putina a Melanii s Donaldem. Mladý JFK Jr. se podle něj „brzo objeví“, kolem svých
    65. narozenin. Sestavuje kalendář: 18. 11. je „5. listopad podle juliánského kalendáře“ („V jako vendeta“),
    22. 11. výročí atentátu na JFK („JFK starter, Trump finisher“) a 27. 11. konec Trumpova „pětiměsíčního
    přechodného období“. Opakuje teze o „USA Incorporation“ od roku 1871, o Titanicu jako cestě k Fedu
    a o 11. září jako „dvou hologramech letadel“. Většinu lidí považuje za „entity a NPCčka“, jejichž
    názor ho „vůbec nezajímá“, a nálepku „placatozemec“ odmítá otázkou „jak víte, že je kulatá?“.'
  citace:
  - text: Pokud se to ještě nestalo, tož je platný pro nějakých třeba 10–20 % informací, kterých jsem
      predikoval, no tak to ještě neznamená, že to není pravda.
