  text: Zítko tvrdí, že ČT nedodržuje zákon a ve zpravodajství „lže“; za covidu se podle něj nechala sponzorovat
    4,2 milionu dolarů ze Spojených států. Stávka zaměstnanců by podle něj mohla trvat i roky, aby lidé
    zjistili, že o nic nepřicházejí.
