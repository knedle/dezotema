- id: zitko-2026-11-04-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**4. 11.** — Zítko předčítá trestní oznámení pro nebezpečné pronásledování (§ 354) podané na
    Okresní státní zastupitelství v Chomutově, jehož autor podle něj z textu nevyplývá, a bod po bodu
    ho vyvrací (do firmy volal jednou, matce jednou a ta volala jemu); při vyostření sporu bude trvat
    na „biologických testech pravosti“ v nezávislé laboratoři a sám podá oznámení pro křivé obvinění a
    pomluvu kvůli profilu „Politický vězeň Čermák“. Renata Bernardy má podle něj přístup k policejním
    odposlechům — „Čermák“ prý znal počet 20 objednaných obědů a Bernardy zveřejnila historky, které jeho
    známý předtím říkal do telefonu. Falešný Čermák měl podle něj „vystřídat“ Zítka v agendě obnovy ČSR,
    až se bude jednat o hranicích v Evropě; skutečný Čermák je prý „v ochraně svědků“ a jednou se objeví
    — „a bude to teprve sláva“.'
  citace:
  - text: Pravděpodobně tenhle falešnej Čermák měl mě vystřídat.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-11-04-02
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**4. 11.** — Už den předtím Zítko tvrdil, že stížnost na krádež voleb podalo „40 z 50 států“
    a Trump využije výkonné příkazy 13848, 14248 a 14399 jako „šachmat demokratickým podvodníkům“, což
    povede k aktivaci stanného práva „v globálním měřítku“. Ve floridském vězení „Alligator Alcatraz“
    s 3 000 lůžky podle něj skončí soudci, právníci, lékaři a policisté, kteří spáchali „zločiny proti
    lidskosti“, a útěk znemožní krokodýli; hlavní aktéři Deep State jsou prý „dávno popraveni“ a je potřeba
    „odkopat zrádce i na nižších úrovních“. Film V jako vendeta (2005) podle něj „směřuje k velkému odhalení
    na pátého listopadu“.'
