    Hraniční: Rutte jako „hysterická buzna na steroidech“ (urážka bez výzvy k trestu) a tvůrci systému
    poplatků by „měli být odsouzení“ a „zametat ulice“ (bez jmenovaného terče). Zpracováno podle podkladů
    pomocného agenta, citace ověřeny v přepisu.'
