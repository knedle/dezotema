- id: vrabel-2026-11-19-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Útok na Krymský most jako dílo „koalice ochotných skrze Ukrajinu“ — Rusové „vyvodí zodpovědnost“
    i vůči plátcům zbraní (Vrabel, 16. 11. 2026)
  text: '**19. 11.** — Nizozemská firma Destinus oznámila, že na Krymský most byly použity její střely
    Ruta. Vrabel to bere jako potvrzení své teze, že most „zničili Ukrajinci a Evropané“, a Nizozemsko
    je podle něj po Francii (mise Volia) další zemí „potenciálně ve válce s Ruskem“. Situace podle něj
    „eskaluje naprosto brutálním způsobem“. Připomíná vlastní předpověď z doby před americkými volbami,
    že po několika týdnech „euforie“ přijde výrazné zhoršení. Euforie podle něj trvala čtyři až pět týdnů
    a končí právě summitem.'
  citace:
  - text: Obávám se, že tím ta euforie končí.
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-11-19-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by Evropu dobylo bez jaderných zbraní — 3 000 dronů a 100 iskanderů denně; „Rusko vyhraje
    s 99,9% pravděpodobností“ (Vrabel, 15. 11. 2026)
  text: '**19. 11.** — Vrabel podrobně přebírá ruský výklad příčin války: převrat v roce 2013, „neonacisté“
    ve vládě, Minsk 1 a 2 a odmítnuté ruské návrhy z roku 2021 (návrat NATO k roku 1997). Podobný problém
    podle něj hrozí v Estonsku a Litvě s asi 30 % Rusů. Popisuje tři scénáře: diplomacii přes Trumpův
    obrat, které dává malou šanci, pokračování války, nebo rozšíření konfliktu do evropských zemí, „a
    to je to, co předpokládám“. Evropa podle něj nekapituluje „po dvou týdnech“, válka potrvá „minimálně
    pár měsíců“ a z 99 % vyhraje Rusko. Pak Rusové nadiktují novou bezpečnostní architekturu s nárazníkovou
    zónou, ale Evropu okupovat nebudou. EU ustoupit nemůže, protože je „jeden velký vojenský pakt“ proti
    Rusku a její politici by se zhroutili. Putinovo pozvání Evropanů do Moskvy podmíněné „konstruktivními
    návrhy“ vykládá jako jedinou cestu k jednání. Výrok Mette Frederiksenové, že Trumpovo setkání s Putinem
    je „nepochopitelné“, glosuje slovy „je to jasné jako facka“.'
  citace:
  - text: A předpokládám, z 99 % předpokládám, že je jasné, že vyhraje Ruská federace, tak až Ruská federace
      vyhraje, tak se bude dělat nová bezpečnostní architektura skutečně.
  osoby:
  - osoba: mette-frederiksenova
    vztah: negativni
    kontext: 'Setkání „nepochopitelné“, Vrabel: „jasné jako facka“'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-19-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Po summitu Trump–Putin–Si: „nový světový pořádek“, EU „propadla do bezvýznamnosti“, USA „nebudou
    zasahovat“ — Rusko má „otevřené dveře“ (Vrabel, 19. 11. 2026)'
  text: 'První trojstrannou schůzku USA, Ruska a Číny Vrabel označuje za potvrzení multipolárního světa,
    o kterém mluví od roku 2022, a jednání podle něj „dopadla přesně tak, jak jsem očekával“. EU se podle
    něj od roku 2015 „propadla do bezvýznamnosti“ politicky, ekonomicky i technologicky a ČR by měla zvažovat
    BRICS. Místo toho Babiš zakázal referendum o EU a Havlíček podepíše dlouhodobé kontrakty na energie
    z USA, které jsou podle něj zhruba čtyřikrát dražší než ruské. Trumpův výrok „Vladimir Putin je můj
    kamarád“ chápe jako vzkaz Evropě i koalici ochotných: Rusko „může pokračovat s Ukrajinou tak, jak
    potřebuje“ a USA do toho „prakticky nebudou zasahovat“. Rusko tak má „otevřené dveře“ na Ukrajině
    i „směrem k Evropě“, což by mohl změnit jen Kongres s demokratickou většinou. Putinovo prohlášení,
    že po útocích na Krymský most „nebudou žádné dohody“, bere jako potvrzení. Zprávy o „poníženém Putinovi“
    v Číně odmítá jako výmysl „progresivistických lživých hlupáků“: Si byl na summitu „nejsilnější“, ale
    pro Rusko šlo o historický moment. Obrannou dohodu USA s Venezuelou přirovnává k mafiánské „ochraně“
    z Kmotra.'
  citace:
  - text: Je to ukázka především toho, že tady máme nový světový pořádek, že tady máme multipolární svět.
