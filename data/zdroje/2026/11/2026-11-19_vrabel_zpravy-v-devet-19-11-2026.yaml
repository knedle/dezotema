- id: vrabel-2026-11-19-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Sankce EU na irského novináře: „proruský narativ“ je vše, co není v ČT; na české novináře to
    přijde „do půl roku, maximálně do roku“ (Vrabel, 18. 11. 2026)'
  text: '**19. 11.** — Po irském novináři je podle Vrabela pod tlakem norský profesor Glenn Diesen, „jeden
    z nejlepších podcasterů“: ministerstvo prý zveřejnilo fotografie jeho domu a on odchází z Norska.
    V EU podle něj „jede jedna lež“, že Rusko bezdůvodně zahájilo válku a chystá se napadnout Evropu,
    „a kdokoliv, kdo má mozek, tak musí být likvidovaný“. Uvádí případy Tommyho Robinsona a Russella Branda
    a tvrdé tlaky čeká i na sebe.'
  citace:
  - text: Kdokoliv, kdo má mozek, tak musí být likvidovaný.
