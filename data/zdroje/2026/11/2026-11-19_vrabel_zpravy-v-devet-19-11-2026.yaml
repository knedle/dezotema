  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-19-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trump z NATO nevystoupí, protože ho „ovládá“ a prodává mu zbraně; Rutte „ohebný jako chobotnice“
    (Vrabel, 19. 11. 2026)
  text: 'Spekulace, že zrušení summitu NATO v Albánii souvisí s Trumpovým odchodem z aliance, Vrabel odmítá:
    USA NATO vytvořily, řídí ho a prodávají mu zbraně, takže „proč by z ní pro boha vystupovali, když
    ji ovládají“. Generální tajemník Rutte, který tvrdí, že schůzka USA, Ruska a Číny „není problém“,
    je podle něj „velmi ohebný“ a „jede na všechny strany“ (Zelenskyj, Babiš, Trump jako „náš táta“).
    K „ohebným“ řadí také Babiše, Pavla a Rajchla, kdežto Fiala a Rakušan jsou podle něj „lemplové“, kteří
    se neohnou. Rutteho pak hrubě uráží jako „hysterickou buznu na steroidech“ (hraniční výrok, viz poznámku
    ve zdroji).'
  citace:
  - text: Proč by z ní pro boha vystupovali, když ji ovládají. To je naprostý nesmysl.
