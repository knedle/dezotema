vyroky:
- id: vrabel-2026-11-19-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Summit Trump–Putin–Si: Vrabel vítá shodu, že jaderná válka nesmí být vedena, a Siho návrh „zlikvidovat
    všechny jaderné zbraně“; jaderný deštník s Francií je dál „špatná cesta“ (Vrabel, 19. 11. 2026)'
  text: 'Shodu tří lídrů, že jaderná válka nesmí být vedena, a dialog o snižování jaderných rizik Vrabel
    vítá jako „jedinou správnou cestu k míru“. S návrhem Si Ťin-pchinga zlikvidovat všechny jaderné zbraně
    „absolutně“ souhlasí a navrhuje jaderný materiál použít jako palivo do elektráren. Opakuje, že jaderné
    odstrašení nefunguje a memorandum s Francií o „jaderném deštníku“ je špatná cesta: omylem zasažená
    hlavice na území ČR by znamenala katastrofu na desetiletí. Babišova odpověď, že vláda žádné rozmístění
    „neplánuje“, podle něj nesedí s tím, že se o memorandu s Francií mluví přes půl roku. Za zastánce
    odstrašení označuje Pavla i Babiše.'
  citace:
  - text: Absolutně s ním souhlasím, prostě, že by se měly zlikvidovat všechny jaderné zbraně, rozebrat
      ten jaderný obsah.
  osoby:
