  rezim: vrabel
  poznamka: '1 h 14 min, v den summitu Trump–Putin–Si. 23 témat v denním přehledu, 15 s vlastním úhlem
    (⚡) v 7 sekcích. Predikce: doplněna vyhodnocení k 7., 9., 15. a 16. 11. Stochastický teror nezapsán.
    Hraniční: Rutte jako „hysterická buzna na steroidech“ (urážka bez výzvy k trestu) a tvůrci systému
    poplatků by „měli být odsouzení“ a „zametat ulice“ (bez jmenovaného terče). Zpracováno podle podkladů
    pomocného agenta, citace ověřeny v přepisu.'
vyroky:
- id: vrabel-2026-11-19-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Summit Trump–Putin–Si: Vrabel vítá shodu, že jaderná válka nesmí být vedena, a Siho návrh „zlikvidovat
    všechny jaderné zbraně“; jaderný deštník s Francií je dál „špatná cesta“ (Vrabel, 19. 11. 2026)'
  text: 'Shodu tří lídrů, že jaderná válka nesmí být vedena, a dialog o snižování jaderných rizik Vrabel
    vítá jako „jedinou správnou cestu k míru“. S návrhem Si Ťin-pchinga zlikvidovat všechny jaderné zbraně
    „absolutně“ souhlasí a navrhuje jaderný materiál použít jako palivo do elektráren. Opakuje, že jaderné
    odstrašení nefunguje a memorandum s Francií o „jaderném deštníku“ je špatná cesta: omylem zasažená
    hlavice na území ČR by znamenala katastrofu na desetiletí. Babišova odpověď, že vláda žádné rozmístění
    „neplánuje“, podle něj nesedí s tím, že se o memorandu s Francií mluví přes půl roku. Za zastánce
    odstrašení označuje Pavla i Babiše.'
  citace:
  - text: Absolutně s ním souhlasím, prostě, že by se měly zlikvidovat všechny jaderné zbraně, rozebrat
      ten jaderný obsah.
- id: vrabel-2026-11-19-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Protest za poplatky ČT „aby mohli platit vlastní válečnou propagandu“ — umělá bublina a dvojí
    metr policie (Vrabel, 24. 10. 2026)
  text: '**19. 11.** — Ke zprávě, že dluhy na poplatcích dosáhly 349 mil. Kč (189 tisíc upomínek, 20 tisíc
    případů k vymáhání), Vrabel říká, že povinné poplatky jsou nesmysl a že je „zločinné“ tahat lidi do
    exekucí a brát jim domy kvůli tomu, „že nezaplatili za válečnou propagandu“. Zavřít ČT by byla škoda
    a komercializace by ji vydala „oligarchům a globalistům“. Navrhuje model „jako Národní divadlo“: dobrovolné
    příspěvky nebo platbu z rozpočtu, volenou radu a kontrolu ze strany lidí. Kdyby byl generálním ředitelem,
    „všechno by vyházel“ a angažoval by mimo jiné Janu Bobošíkovou a Petra Bureše. Lidé, kteří systém
    vymysleli, by podle něj „měli všichni být odsouzení“ a „jít zametat ulice“. K výroku mluvčího německé
    vlády, že koalice ochotných má důležitější témata než financování českých veřejnoprávních médií, poznamenává,
    že Češi „řeší nepodstatné věci“.'
  citace:
  - text: Ty lidi by měli všichni být odsouzení za to, co vymysleli a prosazují tenhle systém. Ty by měli
      jít normálně zametat ulice.
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-11-19-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Sankce EU na irského novináře: „proruský narativ“ je vše, co není v ČT; na české novináře to
    přijde „do půl roku, maximálně do roku“ (Vrabel, 18. 11. 2026)'
  text: '**19. 11.** — Po irském novináři je podle Vrabela pod tlakem norský profesor Glenn Diesen, „jeden
    z nejlepších podcasterů“: ministerstvo prý zveřejnilo fotografie jeho domu a on odchází z Norska.
    V EU podle něj „jede jedna lež“, že Rusko bezdůvodně zahájilo válku a chystá se napadnout Evropu,
    „a kdokoliv, kdo má mozek, tak musí být likvidovaný“. Uvádí případy Tommyho Robinsona a Russella Branda
    a tvrdé tlaky čeká i na sebe.'
  citace:
  - text: Kdokoliv, kdo má mozek, tak musí být likvidovaný.
  podtema: Blokace zahraničních médií v ČR
- id: vrabel-2026-11-19-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Útok na Krymský most jako dílo „koalice ochotných skrze Ukrajinu“ — Rusové „vyvodí zodpovědnost“
    i vůči plátcům zbraní (Vrabel, 16. 11. 2026)
  text: '**19. 11.** — Nizozemská firma Destinus oznámila, že na Krymský most byly použity její střely
    Ruta. Vrabel to bere jako potvrzení své teze, že most „zničili Ukrajinci a Evropané“, a Nizozemsko
    je podle něj po Francii (mise Volia) další zemí „potenciálně ve válce s Ruskem“. Situace podle něj
    „eskaluje naprosto brutálním způsobem“. Připomíná vlastní předpověď z doby před americkými volbami,
    že po několika týdnech „euforie“ přijde výrazné zhoršení. Euforie podle něj trvala čtyři až pět týdnů
    a končí právě summitem.'
  citace:
  - text: Obávám se, že tím ta euforie končí.
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-11-19-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by Evropu dobylo bez jaderných zbraní — 3 000 dronů a 100 iskanderů denně; „Rusko vyhraje
    s 99,9% pravděpodobností“ (Vrabel, 15. 11. 2026)
  text: '**19. 11.** — Vrabel podrobně přebírá ruský výklad příčin války: převrat v roce 2013, „neonacisté“
    ve vládě, Minsk 1 a 2 a odmítnuté ruské návrhy z roku 2021 (návrat NATO k roku 1997). Podobný problém
    podle něj hrozí v Estonsku a Litvě s asi 30 % Rusů. Popisuje tři scénáře: diplomacii přes Trumpův
    obrat, které dává malou šanci, pokračování války, nebo rozšíření konfliktu do evropských zemí, „a
    to je to, co předpokládám“. Evropa podle něj nekapituluje „po dvou týdnech“, válka potrvá „minimálně
    pár měsíců“ a z 99 % vyhraje Rusko. Pak Rusové nadiktují novou bezpečnostní architekturu s nárazníkovou
    zónou, ale Evropu okupovat nebudou. EU ustoupit nemůže, protože je „jeden velký vojenský pakt“ proti
    Rusku a její politici by se zhroutili. Putinovo pozvání Evropanů do Moskvy podmíněné „konstruktivními
    návrhy“ vykládá jako jedinou cestu k jednání. Výrok Mette Frederiksenové, že Trumpovo setkání s Putinem
    je „nepochopitelné“, glosuje slovy „je to jasné jako facka“.'
  citace:
  - text: A předpokládám, z 99 % předpokládám, že je jasné, že vyhraje Ruská federace, tak až Ruská federace
      vyhraje, tak se bude dělat nová bezpečnostní architektura skutečně.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-19-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Po summitu Trump–Putin–Si: „nový světový pořádek“, EU „propadla do bezvýznamnosti“, USA „nebudou
    zasahovat“ — Rusko má „otevřené dveře“ (Vrabel, 19. 11. 2026)'
  text: 'První trojstrannou schůzku USA, Ruska a Číny Vrabel označuje za potvrzení multipolárního světa,
    o kterém mluví od roku 2022, a jednání podle něj „dopadla přesně tak, jak jsem očekával“. EU se podle
    něj od roku 2015 „propadla do bezvýznamnosti“ politicky, ekonomicky i technologicky a ČR by měla zvažovat
    BRICS. Místo toho Babiš zakázal referendum o EU a Havlíček podepíše dlouhodobé kontrakty na energie
    z USA, které jsou podle něj zhruba čtyřikrát dražší než ruské. Trumpův výrok „Vladimir Putin je můj
    kamarád“ chápe jako vzkaz Evropě i koalici ochotných: Rusko „může pokračovat s Ukrajinou tak, jak
    potřebuje“ a USA do toho „prakticky nebudou zasahovat“. Rusko tak má „otevřené dveře“ na Ukrajině
    i „směrem k Evropě“, což by mohl změnit jen Kongres s demokratickou většinou. Putinovo prohlášení,
    že po útocích na Krymský most „nebudou žádné dohody“, bere jako potvrzení. Zprávy o „poníženém Putinovi“
    v Číně odmítá jako výmysl „progresivistických lživých hlupáků“: Si byl na summitu „nejsilnější“, ale
    pro Rusko šlo o historický moment. Obrannou dohodu USA s Venezuelou přirovnává k mafiánské „ochraně“
    z Kmotra.'
  citace:
  - text: Je to ukázka především toho, že tady máme nový světový pořádek, že tady máme multipolární svět.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-19-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trump z NATO nevystoupí, protože ho „ovládá“ a prodává mu zbraně; Rutte „ohebný jako chobotnice“
    (Vrabel, 19. 11. 2026)
  text: 'Spekulace, že zrušení summitu NATO v Albánii souvisí s Trumpovým odchodem z aliance, Vrabel odmítá:
    USA NATO vytvořily, řídí ho a prodávají mu zbraně, takže „proč by z ní pro boha vystupovali, když
    ji ovládají“. Generální tajemník Rutte, který tvrdí, že schůzka USA, Ruska a Číny „není problém“,
    je podle něj „velmi ohebný“ a „jede na všechny strany“ (Zelenskyj, Babiš, Trump jako „náš táta“).
    K „ohebným“ řadí také Babiše, Pavla a Rajchla, kdežto Fiala a Rakušan jsou podle něj „lemplové“, kteří
    se neohnou. Rutteho pak hrubě uráží jako „hysterickou buznu na steroidech“ (hraniční výrok, viz poznámku
    ve zdroji).'
  citace:
  - text: Proč by z ní pro boha vystupovali, když ji ovládají. To je naprostý nesmysl.
  podtema: Zahraniční aktéři a precedenty
