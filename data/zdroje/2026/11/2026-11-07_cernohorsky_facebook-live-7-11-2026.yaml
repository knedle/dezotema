    kontext: Vyslýchala dceru Vlasákové bez vědomí matky
  podtema: Šmírování dětí státem
- id: cernohorsky-2026-11-07-03
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Rodiče, kteří dceru věznili v psí boudě, odešli s podmínkou — „nemají právo na život“, obnovit
    trest smrti; „nežijeme v právním státě“ (Černohorský, 7. 11. 2026)
  text: 'Černohorský reaguje na příspěvek Davida Škardy o rodičích, kteří prý přes tisíc dní věznili svou
    14letou dceru v psí boudě. Podle něj dostali v prvním stupni tři a dva roky natvrdo, ale po odvolání
    jen podmínku, protože dosud nebyli trestáni, a dívce mají zaplatit 500 tisíc korun, což při celoživotním
    traumatu považuje za výsměch. Takové lidi by „popravil elektrickým křeslem“ a trest smrti by obnovil:
    kdo ublíží dítěti, „nemá právo na život“. Na vlastní zkušenosti (jako mladý otec jednou dceru zbil
    a od té doby nikdy) ukazuje, že takové jednání si normální člověk nedovede představit. Soudce, kteří
    dávají podmínky za týrání či znásilnění dětí, označuje za „kvíči“, která do justice nepatří, i když
    v každém oboru jsou podle něj i skvělí profesionálové. Případ je pro něj důkazem, že „nežijeme v právním
    státě“ (viz [stochastický teror](stochasticky-teror.md)).'
  citace:
  - text: Jestliže ublíží někdo dítěti, tak nemá právo na život. Hotovo. Tečka.
  osoby:
  - osoba: david-skarda
    vztah: pozitivni
    kontext: Zveřejnil případ dívky v psí boudě, „se mnou to mává stejně“
  podtema: Eutanazie
