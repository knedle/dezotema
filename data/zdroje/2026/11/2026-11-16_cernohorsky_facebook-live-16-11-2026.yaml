  nadpis: 'Macron 2022: požádal Rusko o stáhnutí z Kyjeva, pak to vojensky zneužil — Vrabel (12. 5. 2026)'
  text: '**16. 11. 2026 — Černohorský** tentýž narativ dovádí k závěru, že Rusko „není a nikdy nebylo
    agresorem“. Výjimkou připouští jen útok u Kyjeva po 24. 2. 2022 mimo území Luhanské a Doněcké republiky.
    Po mírových dohodách, které podle něj „domluvil Macron“, se Rusové 30. dubna stáhli. Zelenský („zmrd
    vyfetovaný“) pak po příjezdu Borise Johnsona „s notičkama z EU a USA“ dohodu odmítl. „K 30. dubnu
    2022 přestalo být Rusko agresorem. Tečka.“ Proto ho „serou“ Motoristé i ANO, když o Rusku mluví jako
    o agresorovi. Macinku přitom chválí, že „rozmázl ty idioty na Letné“.'
  osoby:
