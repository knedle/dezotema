  nadpis: „Vlastenecká scéna" rozbita politiky — Okamura, SPD, blok proti islamizaci (Černohorský, 22.
    5. 2026)
  text: '**16. 11.** — V reakci na příspěvek Václava Šinágla o rozhádané scéně Černohorský tezi přiostřuje:
    „Žádná vlastenecká scéna neexistuje.“ „Vlastenci“, kteří slepě tleskají vůdcům, jsou podle něj „ty
    samý ovce“ jako příznivci Fialovy koalice. Politika je pořád stejná, jen „režisér a scénárista dal
    těm druhým politikům jinej scénář“, aby mluvili „pronárodně“. Část scény podle něj „prodala čest“
    za QR kódy, netransparentní účty a místa ve straně PRO. Jedinou výhodou „své“ scény je, že nekonzumuje
    mainstream. Okamuru, Vítězslava Nováka, Kobzu, Volného, Rajchla a Wolfovou vyjmenovává jako ty, kdo
    „podráželi“ a „lhali do ksichtu“.'
  citace:
  - text: Tady na téhle z té vlastenecké scény jsou ty samý ovce.
  osoby:
  - osoba: vaclav-sinagl
    vztah: rozporuplny
    kontext: Kamarád, přijal kritiku, ale vede „žabomiší války“
  podtema: Ekonomický program PRO
