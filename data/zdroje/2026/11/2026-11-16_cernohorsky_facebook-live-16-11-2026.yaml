- id: cernohorsky-2026-11-16-08
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Kauza Terezy Vlasákové jako „spiknutí" úřadů (Černohorský, 24. 9. 2026)
  text: '**16. 11.** — Černohorský chce s Vlasákovou sestavit „rodokmen“ aktérů „mafie“ z Příbramska,
    kteří mají usilovat o to, aby skončila v psychiatrické léčebně nebo ve vězení a dcery přešly k otcům.
    Nový motiv vidí v majetku: má prý jít o to, „aby tam vznikly svěřenecké fondy“. Stížnost na policistu
    Bílého podle něj GIBS vrátila k prošetření jemu samotnému („prošetřoval se ze stížnosti na sebe sama“)
    a někdo na GIBS je podle něj „v tom zapojený“. Policista prý také předal jeho osobní údaje panu Vlasákovi.
    Slibuje, že „hradby té mafie“ dobudou právní cestou.'
  citace:
  - text: My dobíváme hradby té mafie, který oni si myslí, že jsou neprolomitelný.
