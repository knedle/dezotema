  nadpis: Vlastní politická vize „Čest Svoboda Respekt" — decentralizované společenství místo politiky
    (Černohorský, 28. 8. 2026)
  text: '**16. 11.** — Společenství popisuje jako „naprosto čistou, přímou demokracii“: návrh může podat
    kdokoli a on sám má jen jeden hlas. Jediné „diktátorské“ veto (proti odměně pro jednu členku) chce
    převést do pravidel, podle nichž návrh nesmí jít proti čestnosti, poctivosti, morálce a pravdě. Jako
    doklad uvádí sbírky (tornádo na Moravě, povodně 2024, nemocný kamarád, léčba rakoviny). Změnu systému
    „bez revoluce a anarchie“ popisuje jako „deset stupňů ke zlatej“, jejichž podmínkou je, že lidé přestanou
    být „ovcemi“. Platy poslanců přes 250 tisíc měsíčně označuje vůči lidem s 15–25 tisíci čistého za
    „naprostou sprostotu“ a zmrazení platů za alibismus. Kdyby jeho hnutí bylo ve Sněmovně, dávali by
    poslanci 50 % platu na transparentní účet. Okamura by podle něj měl dát 150 tisíc ze svého. Za své
    selhání považuje, že má jen asi 350 členů místo 3–5 tisíc.'
  citace:
  - text: Ve společenství máte naprosto čistou, přímou demokracii.
  podtema: USA — volební systém
- id: cernohorsky-2026-11-16-06
  typ: tvrzeni
