  text: '**16. 11.** — Opakuje, že ČT dostává 8,5 miliardy ročně „bez jakékoliv kontroly hospodaření“.
    Voliče Fialovy koalice, kteří v transparentnosti vidí konec demokracie, nazývá „dementy“: „dneska
    věřit v Českou televizi, to může fakt jenom imbecil.“'
  podtema: Ekonomický program PRO
