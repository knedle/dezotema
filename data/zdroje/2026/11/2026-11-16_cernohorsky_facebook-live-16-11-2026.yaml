  - politicky-system
  nadpis: Babišova vláda jako „menší zlo", ale servilní k Ukrajině; za chování politiků mohou „ovcoidní"
    voliči (Černohorský, 22. 9. 2026)
  text: '**16. 11.** — Žijeme podle něj v „korporátní, nacistické mafii“, kde „ruka ruku myje“ a politici
    se drží v šachu „kostlivci ve skříni“. Voliči pořád volí „menší zlo“ a doufají, že se promění v dobro.
    Čestnost, morálku, pravdu a odvahu „v Poslanecké sněmovně vůbec nehledejte“. Za doklad osobní odvahy,
    kterou „nikdo nikdy neprokázal“, považuje, že v roce 2015 veřejně přiznal vlastní minulost.'
  podtema: USA — volební systém
- id: cernohorsky-2026-11-16-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: SPD „podráží nohy“ Babišovi, kritika z koalice je „na hovno“; Babiš jako jediný politik, který
    mluví s kritiky, ale covid byl „svinstvo“ (Černohorský, 16. 11. 2026)
  text: |-
    Černohorského překvapilo, že Radek Vondráček (ANO), podle něj jinak „až moc korektní“, na Primě řekl, že SPD hází vládní koalici „klacky pod nohy“. Vykládá to tak, že Vondráček byl „opravdu už naštvaný“. To, co SPD a Okamura předvádějí na tiskovkách, podle něj „nepatří“ do koaličního partnerství: chovají se, „jak kdyby Okamura byl předseda vlády“, a „podráží nohy Andreji Babišovi“. Rajchl podle něj zní jako „remix skupiny Olympic: Já, já, já, jenom já“. Připomíná, že SPD s Trikolorou a Svobodnými získala jen 7,76 %, zatímco ANO dva miliony hlasů, takže Babiš nemůže kvůli partnerovi opustit svůj program. Spory se mají řešit „za zavřenýma dveřma“. Okamurova otevřenost je podle něj „odvážná“, ale v této době škodlivá. Kdo chce pád vlády a předčasné volby, ať řekne, koho by volil, protože SPD „nezíská 37 %“. Spekuluje, že kdyby ODS vedl Martin Kuba a zbavila se Kupky, Černochové, Decroix, Stanjury a Fialy (všechny hrubě uráží), byla by ve vládě ODS místo SPD.

    Babiše přitom označuje za „jediného politika“, který je ochoten mluvit i s tak ostrým kritikem, jako je on. Covidové období jeho vlády ale bylo „neskutečný svinstvo“, které „nesmí vyšumět“, a Babiš se k němu má postavit „jako chlap“. Babiš i Zeman podle něj „podlehli strachu“, i když premiér k tomu „neměl právo“. Kdyby „nehrál hru na covid“, měl by dnes podle něj přes 40 %. ⚡ Proti 6. a 9. 11., kdy kritikům vlády vyčítal, že nemají alternativu, se teď obrací proti SPD jako koaličnímu partnerovi, ačkoli ji sám volí (viz [volby-2026.md](/temata/volby-2026.md)).
  citace:
  - text: Ať se mi to líbí, nelíbí, tak SPD nemůže mít takovouhle hubu, i když je to dejme tomu odvážný,
      dobře, ale v téhle době je to na hovno.
  osoby:
