zdroj:
  id: 2026-11-24_vrabel_zpravy-v-devet-24-11-2026
  mluvci: vrabel
  kanal: Ladislav Vrabel
  titul: Zprávy v devět 24. 11. 2026
  datum: 2026-11-24
  url: https://www.facebook.com/100087923704145/videos/1608653121278923
  prepis: prepisy/done/2026-11-24_Ladislav-Vrabel_24-11-2026-Zprávy-v-devět-s-komentářem.txt
  delka: "01:07:45"
  rezim: vrabel
  poznamka: |-
    1 h 8 min, vysílání se spolumoderátorkou Zuzkou. Neobvykle dlouhý úvod (cca 30 min) ke dvěma zprávám
    (projev náčelníka generálního štábu a Rajchlova novela § 405). 20 témat v denním přehledu, 15 z nich
    odkazuje na výrok (13 plných ⚡, 2 krátké opakování). Predikce: 2 (následky podpory Ukrajiny, „tlak bude zesilovat“
    a kritici budou likvidováni). Stochastický teror nezapsán; hraniční případy zvažovány, ale nezapsány:
    „kdyby ten Jindra Rechel nevymlátil těm třem držku“ (metafora o Rajchlovi, bez výzvy k násilí) a
    výzva občanům k „milionovým protestům“ (není terč). Záznam je fragmentovaný a s komolenými jmény
    (Kolin Drodesku = Calin Georgescu, Hedlička/Hrlička/Žedlička = Tomáš Hrdlicka, Rechel/Reichl = Rajchl).
    Zpracováno podle podkladů pomocného agenta, citace ověřeny v přepisu.
  prehled:
  - tema: Priority armády na rok 2027 (náčelník generálního štábu Hlaváč)
    text: projev označuje za šíření poplašné zprávy a válečnou propagandu; před válkou prý režim vždy
      vytváří dojem obrany a umlčuje zastánce míru.
    vyrok: vrabel-2026-11-24-01
  - tema: Ministerstvo obrany pod SPD
    text: SPD je podle něj kontrolovaná „měkká“ opozice, která vzbuzuje naději a drží systém pohromadě.
    vyrok: vrabel-2026-11-24-02
  - tema: Komentáře „my do války nepůjdeme“
    text: nazývá je hloupými a trpnými, lidé by se měli okamžitě vzbouřit a vyvést ČR z NATO.
    vyrok: vrabel-2026-11-24-03
  - tema: Účast ČR ve druhé fázi programu SAFE
    text: půjčky na zbraně jsou „z našich kapes“ a odpovídá za ně každý z nás.
    vyrok: vrabel-2026-11-24-04
  - tema: Rajchlova novela § 405 trestního zákoníku
    text: novelu označuje za „pragmatickou“ reakci na odsouzení Tomáše Hrdličky, protože podle něj
      Rajchl sám vytvořil zneužívání paragrafu proti písmenu Z.
    vyrok: vrabel-2026-11-24-05
  - tema: Režim před válkou a hranice debaty
    text: režim musí tvrdě trestat náklonnost k protistraně a nepřipustí diskusi o výstupu z EU a NATO.
    vyrok: vrabel-2026-11-24-06
  - tema: Mlčící většina a salámová metoda
    text: největším problémem jsou kompromisy mezi pravdou a lží, které vedou k válce po tenkých plátcích.
    vyrok: vrabel-2026-11-24-07
  - tema: Evropský parlament proti zrušení poplatků ČT a ČRo
    text: výsměšně komentuje, že Brusel bude diktovat, jak naložit s ČT, a říká, že lidé se
      nechávají zaměstnávat dílčími tématy (dřív sudetští Němci, nyní ČT).
  - tema: Dům zahraniční spolupráce a boj proti dezinformacím
    text: boj proti dezinformacím je podle něj propaganda placená z obrovských sítí, jeho samotného
      označuje za „dezinformátora“ a vláda Babiše ho podporuje.
    vyrok: vrabel-2026-11-24-08
  - tema: Ruský dron nad Polskem nesestřelen
    text: NATO se prý jen dívalo a zamávalo Rusům (opakuje).
    vyrok: vrabel-2026-11-24-09
  - tema: Napětí od Libye po Finský záliv
    text: Ukrajina podle něj přenáší válku k cizím břehům a nemá právo útočit na ruská plavidla ve
      výsostných vodách třetích států.
    vyrok: vrabel-2026-11-24-10
  - tema: Georgescu přeložen do domácího vězení
    text: je pro něj důkazem, že kdo chce dobré vztahy s Ruskem, je likvidován; to samé prý čeká i
      jeho (další soud za dva dny).
    vyrok: vrabel-2026-11-24-11
  - tema: Libyjský politik chce Zelenského na seznam teroristů
    text: poznamenává, že by ho mohli dát spíš na seznam „mírotvorců“.
  - tema: Případ Reinera Fuellmicha
    text: kamarád a kolega z dob covidu, vězněn za „nesmysl“ s domem koupeným z darů; za udáním
      prý stojí tajné služby.
    vyrok: vrabel-2026-11-24-12
  - tema: Slovensko ruší hlasování poštou ze zahraničí
    text: je to „malé zrnko“, potřeba je nový mediální zákon a kompletní změna politického systému.
    vyrok: vrabel-2026-11-24-13
  - tema: Rozsudek ESLP o vrácení migranta do Běloruska
    text: ironicky se ptá, zda ukrajinským uprchlíkům po návratu nehrozí „násilné zacházení“.
  - tema: Británie zatýká za příspěvky na internetu, meče sikhů
    text: 30 tisíc zatčení ročně za příspěvky a přísné limity na nože (opakuje).
    vyrok: vrabel-2026-11-24-14
  - tema: 22. balík sankcí EU proti Rusku (i sportovci)
    text: "„Konečně“ ironicky; odbočuje k Mačinkovým „mužatkám“ a spekulacím o sexuální orientaci politiků."
  - tema: Zelenský mimo Ukrajinu
    text: je prý možné, že mu britské služby brání v návratu kvůli hrozbě atentátu, a nedivil by se
      mu, kdyby se schovával.
    vyrok: vrabel-2026-11-24-15
  - tema: Dohoda Británie a Ukrajiny o výrobě dronů
    text: stručně „Super“, bez dalšího komentáře.
vyroky:
- id: vrabel-2026-11-24-01
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - nato-zbrojeni-militarizace
  podtema: Příprava na válku
  nadpis: 'Projev náčelníka generálního štábu je „šíření poplašné zprávy“; před válkou režim vždy vytváří dojem obrany a umlčuje hlasy za mír (Vrabel, 24. 11. 2026)'
  text: |
    K Hlavačově projevu o prioritách armády pro rok 2027 a ruské hrozbě Vrabel tvrdí, že jde o válečnou
    propagandu, protože od žádného oficiálního představitele Ruské federace neslyšel, že by na ČR chtěla
    zaútočit. Popisuje schéma, kterým podle něj režim před válkou postupuje: vytvoří pocit, že jde o obranu,
    zajistí jednostrannost, umlčí zastánce diplomacie (jako „kolaboranty“ nebo „pátou kolonu“, jak o něm
    mluvil Fiala) a lidé do armády dospějí k přesvědčení, že jsou „unášeni“ režimem, jak podle něj vidí
    na Ukrajině u pracovníků TCK. Má za to, že čím blíže válce, tím nebezpečnější je být proti.
  citace:
  - text: A je potřeba umlčet ty hlasy, které by volali po nějaké obou stranosti. Válka musí být jednostrana.
    cas: "07:52"
  - text: Podle mě jsou na úrovni šíření poplašné zprávy,
    cas: "14:17"
  osoby:
  - {osoba: miroslav-hlavac, vztah: negativni, kontext: 'Jeho projev o ruské hrozbě označuje za poplašnou zprávu a válečnou propagandu'}
  - {osoba: petr-fiala, vztah: negativni, kontext: 'Připomíná, že ho v roce 2022 označil za „pátou ruskou kolonu“'}
  - {osoba: jaromir-zuna, vztah: neutralni, kontext: 'Uvádí, že schůzi zahajoval ministr obrany z kvóty SPD'}
  vazby:
  - {na: vrabel-2026-10-26-02, typ: posun}
- id: vrabel-2026-11-24-02
  typ: tvrzeni
  temata:
  - politicky-system
  - nato-zbrojeni-militarizace
  podtema: Kontrolovaná opozice
  nadpis: 'SPD, Trikolora, PRO a Svobodní jsou „kontrolovaná“ opozice, která ministerstvo obrany drží a vytváří lidem falešnou naději (Vrabel, 24. 11. 2026)'
  text: |
    Vrabel vykládá, že režim před válkou potřebuje tvrdou opozici umlčet policií a soudy, ale měkčí
    opozici nechat reprezentovat politickou stranou, která prohlašuje, že je proti zbrojení a posílání
    vojáků. Tou je podle něj SPD s Trikolorou, PRO a Svobodnými, jež stojí pod kontrolou stejných
    lobbistických skupin jako ostatní. Má za cíl udržovat „mantinely“ a vzbuzovat naději, že se válka
    nestane. Upozorňuje, že ministerstvo obrany i nový náčelník generálního štábu patří do vlády pod
    vedením SPD, a kdo si myslí, že SPD cokoli změní, se mýlí.
  citace:
  - text: To je SPD v České republice, SPD s trikolorou, s pro a ze svobodnými.
    cas: "15:35"
  - text: Jestli si někdo myslíte, že SPD je nějaká politická síla, která něco změní v tom, aby Česká republika šla do války, tak samozřejmě není.
    cas: "16:04"
  osoby:
  - {osoba: spd, vztah: negativni, kontext: 'Podle Vrabela kontrolovaná opozice, která drží ministerstvo obrany a jen „vyvažuje“'}
  - {osoba: rajchl, vztah: negativni, kontext: 'Zmiňuje, že po demonstraci na Václavském náměstí začal udávat lidi za písmeno Z'}
  vazby:
  - {na: vrabel-2026-07-05-03, typ: posun}
- id: vrabel-2026-11-24-03
  typ: postoj
  temata:
  - valka-ukrajina-prubeh
  - nato-zbrojeni-militarizace
  podtema: Odpor proti válce
  nadpis: 'Komentáře „my do války nepůjdeme“ jsou „hloupé a trpné“ — lidé se mají okamžitě vzbouřit, vyvést ČR z NATO a usmířit se s Ruskem (Vrabel, 24. 11. 2026)'
  text: |
    Vrabel říká, že komentáře pod videi, jimiž lidé odmítají jít do války, označil za hloupé a trpné, protože
    se ho nikdo ptát nebude, jak ukazuje Ukrajina (uzavřené hranice, unášení mužů, desítky tisíc měsíčně,
    odhady 1,5 až 2,5 milionu mrtvých). Podle jeho známého, který byl ve válce, by v ČR stačilo prvních
    deset tisíc mrtvých v rakvích a zmizelo by nadšení. Vyzývá všechny, aby okamžitě povstali, vyšli
    v milionových protestech do ulic, stáhli ČR z financování zbraní pro Ukrajinu i z NATO a co nejrychleji
    se usmířili s Ruskou federací; spor Ruska a Ukrajiny má řešit Rada bezpečnosti OSN.
  citace:
  - text: Stačí prvních deset tisíc mrtvých, který se vrátí v rakvých a všechno se změní.
    cas: "21:27"
  - text: Okamžitě by měli jít a v milionových protestích jít do ulic a vytáhnout Českou republiku s financování zbraní na Ukrajinu.
    cas: "22:10"
  - text: A měli by vytáhnout Českou republiku z NATO.
    cas: "22:22"
  osoby:
  - {osoba: volodymyr-zelenskyj, vztah: negativni, kontext: 'Slíbil mír, a pak podle Vrabela vytvořil situaci, v níž se hranice uzavřely a muži nemohli odejít'}
  vazby:
  - {na: vrabel-2026-11-21-18, typ: posun}
- id: vrabel-2026-11-24-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  podtema: Financování zbrojení
  nadpis: 'SAFE: půjčky na zbraně bere Babiš „z našich kapes“ — každý z nás je za to odpovědný (Vrabel, 24. 11. 2026)'
  text: |
    K oznámení, že ČR se zapojí do druhé fáze programu SAFE a vezme další desítky miliard korun půjček
    na zbrojení, Vrabel říká, že státní půjčky se platí z peněz všech občanů, takže jsou „naše“ a
    „zodpovědní jsme za ně my“. Babiš prý nenakupuje zbraně za své, ale za peníze, které lidé vydělávají
    a mají v bankách, a posílá je „proti Rusku“.
  citace:
  - text: Andrej Babiš si bere tu půjčku z našich kapes. To jsou naše peníze.
    cas: "24:08"
  osoby:
  - {osoba: andrej-babis, vztah: negativni, kontext: 'Kupuje zbraně za peníze občanů, ne za své'}
  vazby:
  - {na: vrabel-2026-06-17-09, typ: opakovani}
- id: vrabel-2026-11-24-05
  typ: tvrzeni
  temata:
  - dsa-cenzura
  - politicky-system
  podtema: Politická perzekuce
  nadpis: 'Rajchlova novela § 405 je „pragmatická“ — podle Vrabela sám vytvořil zneužívání paragrafu proti písmenu Z (Vrabel, 24. 11. 2026)'
  text: |
    K zprávě, že Rajchl připravuje novelizaci trestního zákoníku (zrušit trestnost schvalování a
    zlehčování genocidy) a že má podporu i v koalici, Vrabel tvrdí, že paragraf původně sloužil proti
    nacistické propagaci a že zneužívat ho proti znaku Z a nášivkám Wagnerovy skupiny začal až Rajchl
    s Miroslavem Vackem po demonstraci na Václavském náměstí, když identifikovali několik lidí a podali
    podněty policii. Odsouzení Tomáše Hrdličky den předtím a mediální propagace novely je prý
    „pragmatický“ krok, srovnává to s dentistkou, jejíž syn mlátí lidi, aby měla máma práci. Podle něj
    za desítkami zničených životů (veřejné práce, advokáti, převýchovné kurzy) stojí Rajchl a média
    píšou jen o „mediálním politickém vězni“ Martině Bednářové, protože ji zastupoval Rajchl; sama
    Bednářová je podle něj „fajn ženská“, ale měla se na Rajchla neobracet, protože jej tím
    legitimizuje.
  citace:
  - text: To prostě vytvořil Jindřich Rechel s Miroslavem Vackem.
    cas: "27:09"
  - text: A je to velmi pragmatické z jeho strany, velmi pragmatické.
    cas: "28:03"
  - text: ale ty desítky případů k těch lidí, co jsou odsouzený a mají veřejný práce a zničený životy a desetí tisíce za advokáty a převýchovný programy a ztrátu zaměstnání, tak to je práce Jindřicha Reichla.
    cas: "29:08"
  osoby:
  - {osoba: rajchl, vztah: negativni, kontext: 'Obviňován z vytvoření zneužívání § 405 proti písmenu Z; novela je „pragmatická“'}
  - {osoba: tomio-okamura, vztah: neutralni, kontext: 'Podle zprávy tvrdí, že novela má podporu i v koalici'}
  - {osoba: martina-bednarova, vztah: rozporuplny, kontext: 'Omlouvá její vyhazov z práce jako nefér, ale vytýká jí, že se obrátila na Rajchla'}
  - {osoba: jakub-jasek, vztah: neutralni, kontext: 'Mezi lidmi, které Rajchl podle Vrabela po demonstraci identifikoval'}
  vazby:
  - {na: vrabel-2026-10-21-01, typ: posun}
  - {na: vrabel-2026-08-18-04, typ: posun}
- id: vrabel-2026-11-24-06
  typ: tvrzeni
  temata:
  - politicky-system
  - suverenita-eu
  podtema: Příprava na válku
  nadpis: 'Režim před válkou musí tvrdě trestat kritiky a nesmí připustit diskusi o výstupu z EU a NATO; Babiš sliboval, že referendum se „nepovede“ (Vrabel, 24. 11. 2026)'
  text: |
    Vrabel tvrdí, že ČR je „prakticky ve válce s Ruskem“ (platí Ukrajincům, posílá zbraně, trénuje
    vojáky, hostí jejich rodiny a má s nimi desetiletou vojenskou smlouvu), a proto musí režim držet
    společnost v tlaku: kritiky likviduje soudními a exekučními postihy (jeho manželka prý dluží 2,5 milionu
    bez půjčky), zatímco mírnější mohou nadávat. Hranice svobody projevu je ta, aby neohrozila režim;
    nesmí se vystoupit z EU ani z NATO a neutralita nesmí být předmětem diskuse, což prý řekli Babiš i
    Pavel. Zároveň Babišův slib o referendu vykládá tak, že vznikne zákon, aby se žádné referendum
    o EU či NATO nepovedlo. Neříká, že ČR do války určitě půjde, ale přirovnává situaci k rozjetému
    vlaku s malým dítětem 50 metrů před ním.
  citace:
  - text: prakticky jsme ve válce s Ruskem, co si budeme tady nalhávat.
    cas: "30:42"
  - text: Může se spousta věcí dělat, ale nesmí se vystoupit z Evropské unie, nesmí se vystoupit z NATO.
    cas: "32:24"
  - text: Uděláme vám takový zákon, aby se vám žádný nepovedlo.
    cas: "32:55"
  osoby:
  - {osoba: andrej-babis, vztah: negativni, kontext: 'Podle Vrabela nepřipustí referendum o EU ani o NATO'}
  - {osoba: petr-pavel, vztah: negativni, kontext: 'Spolu s Babišem prý vylučuje změnu západního kurzu'}
  vazby:
  - {na: vrabel-2026-11-21-18, typ: posun}
- id: vrabel-2026-11-24-07
  typ: postoj
  temata:
  - politicky-system
  podtema: Příprava na válku
  nadpis: 'Největší problém je „mlčící většina“ a kompromisy s pravdou — válka přichází „salámovou metodou“ (Vrabel, 24. 11. 2026)'
  text: |
    S odkazem na Sophie Scholl Vrabel říká, že největším problémem je mlčící většina a „odvracení se
    od reality“. Kompromisy mezi pravdou a lží, svobodou a udáváním či propagandou a bojem za mír podle
    něj vedou k tomu, že nakonec válka vyhrává, protože se nepřijímá „tenký plátek salámu“ a nakonec
    se zkrájí celý salám. Soudí, že už jsme od tenkých plátků přešli k tlustým.
  citace:
  - text: největší problém podle Sofie Scholl, největší problém je mlčící většina.
    cas: "35:07"
  - text: to, že nám nevadí ten tenkej plátek salámu, to je ten problém, protože takhle se skrájí ten salám celý.
    cas: "36:38"
  osoby:
  - {osoba: sophie-scholl, vztah: pozitivni, kontext: 'Cituje její výrok o mlčící většině a připomíná její popravu za protinacistický odboj'}
  vazby:
  - {na: vrabel-2026-08-30-03, typ: posun}
- id: vrabel-2026-11-24-08
  typ: tvrzeni
  temata:
  - dsa-cenzura
  - media-propaganda
  podtema: Boj proti dezinformacím
  nadpis: 'Boj proti dezinformacím je placená propaganda a nástroj likvidace svobodně myslících lidí, včetně Vrabela — podporuje ho vláda Babiše (Vrabel, 24. 11. 2026)'
  text: |
    K zprávě o grantech Domu zahraniční spolupráce pro neziskovky Vrabel tvrdí, že na „boj proti
    dezinformacím“ teče z evropských programů obrovské množství peněz, kterými se financují spolky, weby
    a konference pomáhající vládám a médiím; podle něj to začalo v covidu u desítek tisíc lidí placených
    za potlačování kritiky očkování. Dezinformací je dnes podle něj i tvrzení, že Rusko nechce válku,
    proto je prý označován za „dezinformátora“, snižuje se mu dosah na Facebooku a YouTube a rušily se
    mu kanály. Skutečným cílem boje je zabránit lidem svobodně myslet i mluvit a podporuje ho vláda
    Andreje Babiše (stejně jako za covidu); kritizuje i bývalou komisařku Jourovou a Konečnou
    za hlasování v Evropském parlamentu.
  citace:
  - text: A dneska dezinformace jsou, když vám řeknu, že Rusko nechce válku, tak to je dezinformace.
    cas: "44:41"
  - text: Ten boj proti dezinformací má ve skutečnosti za cíl zabránit lidem svobodně myslet a svobodně mluvit.
    cas: "45:11"
  - text: A tohle je něco, co podporuje současná vláda Andreje Babiša.
    cas: "45:24"
  osoby:
