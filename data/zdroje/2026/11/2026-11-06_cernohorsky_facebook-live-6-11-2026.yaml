vyroky:
- id: cernohorsky-2026-11-06-01
  typ: tvrzeni
  temata:
  - fara-neziskovky
  nadpis: Lobbisté mimo zákon, zahraniční financování neziskovek jako trestný čin; Šebelová a eutanazie
    nezletilých (Černohorský, 5. 9. 2026)
  text: '**6. 11.** — Černohorský popisuje politiku jako obchod: korporace s miliardovými zájmy působí
    přes lobbisty na politiky, kteří „zvednou pracky“, jak se jim řekne; předsedové stran se podle něj
    domluví přes šifrované telefony a poslanci dostanou „milion na Kajmany“. Šebelová podle něj za návrh
    eutanazie pro nezletilé „z největší pravděpodobností dostala nasypáno“. Média podle něj vlastní miliardáři
    (Tykač, Křetínský) a „solí“ je Západ a EU přes Člověka v tísni, Soros a Bill Gates; stávkující za
    ČT, kteří si „vzali čepičky a hráli si na Večerníčka“, tak podle něj hájí „svobodná média“ placená
    systémem.'
  citace:
  - text: Za mě z největší pravděpodobností dostala Šebelová nasypáno. S dalšíma. Aby tohle svinstvo prosazovali.
      A takhle funguje politika.
  podtema: Milion chvilek — struktura a financování
- id: cernohorsky-2026-11-06-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Migrační pakt: 30 000 migrantů ročně, nebo 15 miliard Kč pokuty (Černohorský, 27. 8. 2026)'
  text: '**6. 11.** — Černohorský opakuje, že „od příštího roku“ bude v ČR 30 tisíc migrantů („verbeže“),
    za což viní Rakušana, globální kompakty a voliče STAN a ODS; „nestačí nám 700 tisíc Ukrajinců“. Rekapituluje,
    že od roku 2015 stál vždy „na opačné straně než média“: proti migraci a islámu, proti LGBT a „manželství
    pro všechno“ (za tradiční rodinu), proti covidovým opatřením, která podle něj média využila k rozdělení
    společnosti, a proti válečné rétorice Petra Pavla, kterému dnes prý „není cizí ani ruská ropa“. Jako
    důsledek uvádí porodnost: loni 77 tisíc dětí, z toho 12 % cizinců. Zastánce migrace by „dal do těch
    táborů, do těch get“ v západní Evropě (viz [stochastický teror](stochasticky-teror.md)).'
- id: cernohorsky-2026-11-06-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Petr Pavel: Posselt 2023 na motorce, Lichtensteinové, bavorský hejtman na Hradě — systémové
    propojení (Černohorský, 10.–13. 5. 2026)'
  text: '**6. 11.** — Černohorský sdílí tříminutový výstřih videa o Lichtenštejnech a vracení majetku:
    Pavel („kripl z Hradu“) podle něj jde s Lichtenštejny „ruku v ruce“, a pokud se nárok prolomí, mohou
    být Benešovy dekrety „úplně vymazány“ — „konečná“. Média (ČT, Nova, Prima, Seznam, iDNES) to podle
    něj nezajímá. Proto se ptá, co chtějí lidé 28. října slavit, když „nám nic nepatří“ a republika „už
    neexistuje“.'
  citace:
  - text: Jestliže tohle se prolomí, konečná. Konečná. Hotovo.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-11-06-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Podmíněné propuštění Tomáše Čermáka — nepřiměřený trest jako „zářný příklad" pro umlčení scény
    (Černohorský, 24. 9. 2026)
  text: '**6. 11. (Černohorský)** — Černohorský tvrdí, že Čermák nebyl vinen: státní zástupce a soud podle
    něj nepracovali s fakty, ale s „předpokladem“, že by Čermák a Tušl dokázali zburcovat desítky tisíc
    lidí k násilí proti politikům. Sám by se na Čermákově místě nepřiznal ani neutíkal, ale „rval by se
    za svoje práva“; Čermáka přitom odsuzovat nechce. Vinu dává Zítkovi, který podle něj Čermáka udal
    a nyní ho s Jiřím Hradilem „stalkuje“ (telefonáty s jeho matkou, zveřejnění jejího čísla), čímž ohrožuje
    jeho podmínku a práci. Na oba sepsal trestní oznámení a předal ho dotčenému, který rozhodne o jeho
    podání. Zítko se podle něj v posledním telefonátu „usvědčil sám“, že věří, že mluví s pravým Čermákem;
    kdo věří teorii o „vyměněném“ Čermákovi, je podle něj „idiot“.'
  citace:
  - text: Tady se nepracuje s fakty. Tady se pracuje, prosím vás, s předpokladem.
  podtema: Politická perzekuce
- id: cernohorsky-2026-11-06-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Babišova vláda nic nevyšetřuje: dluh 4 biliony, bitcoin, Dozimetr, Kampelička, Lex Ukrajina
    (Černohorský, 5. 10. 2026)'
  text: '**6. 11.** — Černohorský se vrací ke kampeličce, které ČNB odebrala licenci: „banda ODS a STAN
    pod vedením Petra Fialy“ z ní podle něj vyvedla 660 milionů v hotovosti „v pytli“ a ptá se, zda nešlo
    o peníze na pomoc Ukrajině. Moderátoři ČT (Jiří Hynek, Fridrichová) a další média se podle něj na
    nic neptají a o kauze mlčí, stejně jako o tom, že Robert Fico během voleb odletěl soukromě na dovolenou.'
  citace:
  - text: 'Viděli jste ze zpravodajství ČT: kam jste, Fialo, dali tohle tady, 660 milionů?'
  podtema: USA — volební systém
- id: cernohorsky-2026-11-06-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Až se nasere pět milionů lidí" — lid má vzít moc do svých rukou (Černohorský, 5. 10. 2026)
  text: '**6. 11.** — Jako důkaz „síly lidí“ uvádí, že za Babišovy vlády (2018) skupina dobrovolníků bez
    stran a bez peněz zastavila Istanbulskou úmluvu (kterou označuje za „ideologii džendru“ s organizací
    GREVIO řídící 100–150 neziskovek; přeložil ji a důvodovou zprávu zpracoval Zdeněk Chytra, on ji s
    letáky a peticí předal Ovčáčkovi, Zemanovi a Babišovi), jeden z globálních kompaktů a „manželství
    pro všechny“ — vše neprošlo ani prvním čtením. Totéž ukazují sbírky na Moravě 2021 a 2024, kde lidé
    sami rozhodli o penězích bez vlády a výborů. Předčítá „morální kodex“ Společenství Čest a Respekt
    (čestnost, poctivost, pravdomluvnost, bezúhonnost; zástupci volení na dobu neurčitou a kdykoli odvolatelní
    „radou kulatého stolu“; lidé by jim určovali i odměny) — „v ústavě nic takového nenajdete“. Ostatní
    „guru“ scény (Zítko, Bernardy, Vrabel, Volný, Wolfová) podle něj kromě vybírání peněz nikomu konkrétně
    nepomohli; Štefan Bartoš je podle informací, které má, „jednoznačně vinen“.'
  citace:
  - text: V čem je síla lidí? […] A udělalo to pár desítek lidí. A pořád to nechcete pochopit.
  podtema: USA — volební systém
- id: cernohorsky-2026-11-06-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Kritika vlády bez alternativy — nic lepšího než Babiš, Okamura a Macinka; SPD devět let nic,
    Konečná u Patriotů „není zrada“ (Černohorský, 6. 11. 2026)
  text: 'Černohorský přiznává, že sám kritizuje Babiše i vládu a vývoj se mu nelíbí, ale kritikům na Facebooku
    vyčítá, že nenabízejí řešení: „Máte něco lepšího než Andrej Babiš, Tomio Okamura a Petr Macinka?“
    Psaní komentářů podle něj nic nevyřeší. SPD podle něj za devět let ve Sněmovně nic neudělala, porušovala
    vlastní návrhy a referendum ani odvolatelnost politiků nepřišly ani teď, když je ve vládě; kdyby pracovala
    s lidmi a pro lidi, nemusela by se s nikým spojovat. Vstup Kateřiny Konečné k Patriotům naopak hájí:
    nejde o zradu, ale o politický vývoj — v parlamentu byla osamocená, Patrioti mají sílu a ona slíbila
    dál hájit sociální program KSČM. Vlastenci se podle něj „označkují jako dobytek“ stranami (SPD, PRO,
    Trikolora, Svobodní, Stačilo, ČR na prvním místě „s Vrabelem“) a pak se nenávidí a udávají; jako nevyužitou
    sílu uvádí 600 tisíc lidí hlásících se k moravské národnosti.'
  citace:
  - text: Kritika? Jasně. Je potřeba. A co dál? Co dál? Co chcete dělat dál?
  podtema: Vlastní vládní program „kdybych byl Babišem" (Černohorský)
- id: cernohorsky-2026-11-06-08
  typ: tvrzeni
  temata:
  - volby-2026
  nadpis: Kandidatura „Adriany“ na prezidentku jako „nenormální“; scéna potřebuje jedno známé jméno (Černohorský,
    6. 11. 2026)
  text: Černohorský odmítá ohlášenou kandidaturu ženy jménem Adriana (příjmení neuvádí) na prezidentku.
    Může být „úžasná, pracovitá a inteligentní“, ale politické zkušenosti, celostátní známost i finance
    má podle něj nulové — stejně jako on sám; úřad hlavy státu vyžaduje politické vzdělání a odolnost
    a nestačí mít „správné názory“. Lidé si podle něj myslí, že může být prezidentem kdokoli, protože
    na Hradě vidí „stupidní figuru“ Petra Pavla. Připomíná, že v roce 2022 (Mikulčice) předpověděl druhé
    kolo Pavel–Babiš, protože vlastenecká scéna sbírala podpisy pro pět kandidátů (mj. Bašta) a žádný
    neměl jednotnou podporu. Pokud scéna nenajde jedno přijatelné, důstojné a známé jméno s jednoznačnou
    podporou a znovu se rozdrobí, „jsme jednoznačně v hajzlu“.
  citace:
  - text: Úřad prezidenta, úřad hlavy státu, na to nestačí být milej, na to nestačí být usměvavej, na
      to nestačí mít jenom ty správný názory.
  podtema: Prezidentské volby
