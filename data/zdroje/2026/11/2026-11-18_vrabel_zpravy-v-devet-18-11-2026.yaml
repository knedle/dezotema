  - osoba: benjamin-netanjahu
    vztah: negativni
    kontext: „Prohraný“
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-11-18-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Americký plyn místo ruského: dohoda za 800 mld. eur a Havlíčkova smlouva na jaře — dlouhodobé
    kontrakty, ale „třikrát dražší“ (Vrabel, 18. 11. 2026)'
  text: K Lavrovovu výroku, že USA vytlačují Rusko z energetických trhů, Vrabel dodává, že Trump v posledních
    měsících zablokoval vývoz energií z Blízkého východu, zvedl ceny ropy, plynu a čpavku a na sankcích
    proti Rusku vydělává. Proto podle něj vznikla dohoda s von der Leyenovou o nákupu amerického plynu
    a ropy za 800 mld. eur. K oznámení ministra Havlíčka, že ČR na jaře podepíše smlouvu na plyn z USA,
    říká, že konečně budou dlouhodobé kontrakty, po kterých volá od roku 2022, jenže „třikrát dražší“,
    než by byl ruský plyn.
  citace:
  - text: Konečně budeme mít ty dlouhodobý kontrakty na plyn, po kterých křičím veřejně už od roku 2022,
      akorát, že budeme mít prostě třikrát tak dražší, protože budou ze Spojených států.
  podtema: Plyn v ČR — diverzifikace zásobování
- id: vrabel-2026-11-18-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Chemtrails: sypání těžkých kovů do atmosféry; větrníky 60 kg nanočástic (Vrabel, 15. 5. 2026)'
  text: '**18. 11.** — Vrabel pouští video Radovana Dluhého k petici spolku Čistá obloha, voda, půda,
    která žádá Senát o prošetření „modifikace počasí“. Podle petice bývalý pracovník ČHMÚ naměřil v dešťové
    vodě za osm dní 560 kg kovů na km², tedy desítky tisíc tun na celou ČR. Vrabel vyzývá k podpisu (při
    10 000 podpisech se jí Senát musí zabývat). Dluhého prý nezná, chce jen, aby Senát „zjistil, jestli
    je to pravda, nebo ne“, protože hliník je jedovatý. Ironizuje vládního zmocněnce Filipa Turka, který
    „sype tady ty větráky“.'
  citace:
  - text: Tak ať to prověří, ať udělají rozbory, ať pověří příslušné úřady, ať víme, jaký je tady bezpečí.
  osoby:
  - osoba: radovan-dluhy
    vztah: pozitivni
    kontext: Petice o geoinženýrství, „asi dělá dobrou práci“
  podtema: Historické konspirační výklady
- id: vrabel-2026-11-18-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Čínu neřídí Kneset, ale globalistické finance působí i v Rusku a Číně; „ne za vším stojí chazarští
    židé“; Zelenskyj „se bude smažit v pekle“ (Vrabel, 18. 11. 2026)
  text: 'Na tvrzení z diskuzí, že Čínu řídí Kneset nebo Chabad Lubavič, Vrabel odpovídá, že skupina „chazarských
    židů“, která podle něj vytvořila systém Fedu a centrálních bank, působí přes velké finance a nadnárodní
    korporace i v Rusku a Číně. Čtrnáctisetmilionový národ se ale izraelským parlamentem řídit nenechá
    a v Číně se zkorumpovaní politici popravují. Sociální kredit, kontrola přes AI a digitální platby
    v Číně jsou podle něj „globalismus“, ne vláda Knesetu. Zelenského označuje za „chazarského žida“,
    ale „ne za vším stojí chazarští židé“ a někteří Ukrajinci jsou „prostě jenom náckové“. Na dotaz diváka
    dodává, že mu nezáleží na tom, zda je Zelenskyj Žid, ale na výsledcích: válka, za kterou platí celá
    Evropa, a „miliony mrtvých“.'
  citace:
  - text: Takže ono to nebude úplně tak jednoduché, jako že by rodina Rothschildovic a Rockefellerovic
      řídila kompletně celou Čínu.
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: „Se bude smažit v pekle tisíce a tisíce let“, „miliony mrtvých“
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-18-05
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Sankce EU na irského novináře: „proruský narativ“ je vše, co není v ČT; na české novináře to
    přijde „do půl roku, maximálně do roku“ (Vrabel, 18. 11. 2026)'
  text: Ke zprávě, že EU zmrazila majetek a zakázala cestování irskému novináři (pravděpodobně Chayi Bowesovi)
    za „proruskou propagandu“, Vrabel říká, že za „proruský narativ“ dnes establishment považuje cokoli,
    co není v ČT. Je rád, že v EU nemá žádný majetek, a moderátorce i kolegům radí převést nemovitosti
    a účty mimo EU. V ČR podobné sankce očekává do půl roku, nejpozději do roka.
  citace:
  - text: Jestli to je dneska v Irsku, tak bych čekal, že v České republice to přijde tak do půl roku,
      maximálně do roku.
  osoby:
  - osoba: chay-bowes
    vztah: pozitivni
    kontext: Sankce EU za „proruské narativy“ jako umlčení
  podtema: Blokace zahraničních médií v ČR
- id: vrabel-2026-11-18-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Islám jako „největší problém světa“ a „systém, ne náboženství“: studie Pew, Mohamed a šaría
    (Vrabel, 18. 11. 2026)'
  text: Ke studii Pew, podle níž bude islám do roku 2035 nejrozšířenějším náboženstvím, Vrabel opakuje,
    že od roku 2013 tvrdí, že „největší problém našeho světa je islám“. Globalizaci, která podle něj chystá
    „otroctví s lidskou tváří“ s digitální měnou, označuje za druhý problém. Islám podle něj nelze oddělit
    od Mohameda. Tvrdí, že Mohamed měl ženu Ájšu od jejích šesti let, že podle výkladů šaríi smí být dívka
    provdána před první menstruací a že je to „naprosto běžné v dnešní západní Evropě“. „Správný muslim“
    podle něj nerespektuje sekulární právo a chodí pro rozsudky do mešit. Islám je podle něj z větší části
    ekonomický, politický, sociální a právní systém (zákaz úroků, zakát), a proto je jeho početní převaha
    nad křesťanstvím „alarmující“. Zdůrazňuje, že se nevyjadřuje k víře, ale k právu.
  citace:
  - text: Takže islám je z velký částky ekonomický, politický, sociální a právní systém. Z větší částky,
      než je to náboženství.
  osoby:
  - osoba: prorok-mohamed
    vztah: negativni
    kontext: Vzor islámského práva, údajné sňatky s dětmi
- id: vrabel-2026-11-18-07
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: '„Brusel je Kyjev 2“: 99 % agendy EU je Ukrajina; nová půjčka 45 mld. eur ručená rozpočtem EU,
    Evropa vyloučená z jednání (Vrabel, 17. 11. 2026)'
  text: '**18. 11.** — Vrabel opravuje zprávu, že Ukrajina půjčku 45 mld. eur splatí z ruských reparací.
    Jsou to podle něj „dvě půjčky“: EU si půjčí a splatí to z rozpočtu, tedy „z našich kapes“, a pak půjčí
    Ukrajině, která splácí jen reparacemi s „velmi, velmi malou“ pravděpodobností. Babišovo „nebudeme
    ručit“ je proto „samozřejmě nesmysl“ a ČR fakticky „platí ukrajinský státní rozpočet“. Babiš se od
    Fialy liší jen tím, že Fiala podporu Ukrajiny říkal otevřeně, kdežto Babiš říká „všechno pro ČR“ a
    platí.'
  citace:
  - text: To je to, za co říkal Andrej Babiš, že nebudeme ručit. To je ta první půjčka, což je samozřejmě
      nesmysl.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: „Neručíme“ je nesmysl, od Fialy se liší jen slovy; nechává „spolehlivé“ lidi globalistů
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-11-18-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Jakub Landovský jako „spojka mezi globalisty, Aspen Institutem a NATO“ napříč vládami; přes
    60 % munice pro Ukrajinu z ČR (Vrabel, 18. 11. 2026)
  text: 'Ke zprávě, že česká muniční iniciativa dodává přes 60 % dělostřelecké munice pro Ukrajinu, Vrabel
    poznamenává, že za Fialy to byl problém a za Babiše je to „v pohodě“. Rozebírá kariéru Jakuba Landovského:
    náměstek ministra obrany v první Babišově vládě, velvyslanec při NATO, ředitel Aspen Institute Central
    Europe a od května 2026 vládní zmocněnec pro plnění závazků vůči NATO. Vlády se podle něj mění, ale
    „prověření a spolehliví“ lidé globalistů zůstávají. Sarkasticky dodává: „Děkujeme, pane Babiši.“'
  citace:
  - text: Jak se nám to tady hezky mění, ty vlády, ale soudruh Landovský zůstává jako spojka mezi globalisty,
      Aspen Institutem a NATO a Českou republikou pořád.
  osoby:
  - osoba: jakub-landovsky
    vztah: negativni
    kontext: „Spojka mezi globalisty, Aspen Institutem a NATO“
  podtema: EU jako vojenská struktura
- id: vrabel-2026-11-18-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Schůzka Trump–Putin–Si v Šen-čenu 19. 11.: dělení sfér vlivu, ne Ukrajina — USA Evropě v konfliktu
    „na pomoc nepůjdou“ (Vrabel, 14. 11. 2026)'
  text: '**18. 11.** — Summit APEC v Šen-čenu je podle Vrabela „milník“: po něm je „celému světu jasné“,
    že USA nejsou jediným lídrem a „dneska je tady nový multipolární svět“, o kterém Putin mluvil už 24.
    2. 2022. Poděkovat se má Rusku, které se postavilo „primárně americké válce proti Rusku skrze Ukrajinu“,
    a Číně, která je technologicky „velmoc číslo jedna“ (roboti, budovy řízené AI, Pás a stezka). Evropa
    se ještě „musí probrat“, „možná, že to způsobí nějakou ještě vojenskou konfrontaci“. Od schůzky čeká
    dohodu o vzájemném neútočení a nepoužití jaderných zbraní. Trump chce volnou ruku proti Íránu, Si
    jasno o Tajvanu a Putin „záruku, že v případě, že by použil nějaké zbraně proti Evropě, Amerika nezasáhne“.
    Pak se podle něj USA vrátí k válce s Íránem, „chytí Kubu“ a další státy „až po Grónsko“, Rusko bude
    mít „silnější lokty“ vůči Evropě a Čína si vezme Tajvan. Dodává, že jsou to „jenom moje představy,
    nemám žádné informace“. Během summitu čeká klid i navzdory výzvám k odvetě Orešnikem za Krymský most.'
  citace:
  - text: Dneska je tady nový multipolární svět.
  osoby:
  - osoba: vladimir-putin
    vztah: pozitivni
    kontext: Popularita kolem 60 %, multipolární svět
  - osoba: si-tin-pching
    vztah: pozitivni
    kontext: „Velmoc číslo jedna“
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-18-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Colby: ukrajinské údery hluboko v Rusku nefungují, štvaní Rusů proti Putinovi selhalo; „zmařený
    ruský útok“ v Polsku — „musí to být Rusové“, riziko false flag (Vrabel, 18. 11. 2026)'
  text: Kritiku ukrajinských úderů hluboko v Rusku od amerického náměstka Elbridge Colbyho Vrabel vykládá
    jako přiznání neúčinnosti. Západ podle něj doufal, že teroristické útoky obrátí Rusy proti Putinovi,
    ale Rusové se naopak „semkli“, Putinova popularita je kolem 60 %, kdežto Merz a Macron jsou „hluboko
    pod patnáct“. Ke zprávám o zadrženém Ukrajinci, který rozesílal bombové výhrůžky, o údajně zmařeném
    ruském útoku na civilisty u kaliningradské hranice v Polsku (podle Sikorského) a o „sabotérech placených
    Ruskem“ v Estonsku ironizuje, že viníky jsou vždy automaticky Rusové. Varuje, že může jít o false
    flag proti Rusku a že je to „velmi nebezpečná hra“.
  citace:
  - text: I kdyby v životě nebyli v Rusku, v životě nepotkali Rusa, nikdy neviděli ruskej pas a nikdy
      neviděli ani rubl, tak to musí být Rusové.
  osoby:
  - osoba: friedrich-merz
    vztah: negativni
    kontext: Popularita „hluboko pod patnáct“
  - osoba: emmanuel-macron
    vztah: negativni
    kontext: Popularita „hluboko pod patnáct“
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-18-11
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: po Šen-čenu se USA vrátí k válce s Íránem a „chytí Kubu“ až po Grónsko, Rusko dostane volnou
    ruku vůči Evropě; sankce EU na české novináře do roka
  text: Trump, Putin a Si se podle Vrabela dohodnou na vzájemném neútočení a nepoužití jaderných zbraní.
    Putin dostane záruku, že USA nezasáhnou, kdyby použil zbraně proti Evropě. Pak se USA vrátí k válce
    s Íránem, „chytí Kubu“ a další státy „až po Grónsko“ a Čína si vezme Tajvan. Během summitu bude klid
    (bez odvety Orešnikem). Sankce EU podobné těm proti irskému novináři dopadnou na české novináře „do
    půl roku, maximálně do roku“.
  citace:
  - text: A pak, když se tohle stane, a předpokládám, že se to stane, tak předpokládám potom, že USA bude
      zpátky do války na Írán, bude chytat Kubu, samozřejmě i ostatní státy okolo v celý té oblasti až
      po Grónsko.
