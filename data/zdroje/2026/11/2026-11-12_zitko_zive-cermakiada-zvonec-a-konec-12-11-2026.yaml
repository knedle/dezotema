  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**12. 11. — „Čermákiáda: Zvonec a konec“** — Ve dvouhodinovém vysílání Zítko odpovídá na článek
    Renaty Bernardy (TV Šalingrad) „Co když je všechno jinak?“. Bernardy podle něj lže a manipuluje s
    daty a Čermáka nikdy neviděla. Muže propuštěného 24. 9. považuje za figuranta, kterého „vypustily“
    policie a tajné služby. Jako důkazy uvádí, že je o 10–17 cm menší než 185 cm, má jinou barvu očí a
    tvar uší, malé a hubené ruce na videu z Polska a rozpixelovaný obličej při předání na hranici a že
    se nepodíval na matku. V „central castingu“ je podle něj 200 tisíc dvojníků. Zdůrazňuje, že nikdy
    nemluvil o „klonu“ ani „hologramu“, jen o „dvojníkovi“. Chce anulovat to, že se dvojník u libereckého
    soudu vzdal stížnosti i odškodnění za pět a půl roku věznění, aby odškodnění mohl žádat skutečný Čermák.
    Ten je podle něj „z 99,999 %“ v ochraně svědků a „bude svědčit, až nastane čas“. Popisuje svou verzi:
    Čermáka vezl 27. 8. 2023 dobrovolně a bez pout, pátrání bylo vyhlášeno až 29. 8. Zásah „zakuklenců“
    se samopaly 3. 2. 2025 označuje za policejní zvůli, jeho telefony měla rok a osm měsíců NCTEKK a státní
    zástupce věc 3. 8. 2026 vrátil policii. Zadržení v Polsku 14. 11. 2023 bylo podle něj „divadlo“ s
    figuranty a obvinění, že Čermáka udal, je připravená policejní operace. Peníze ze sbírek šly podle
    něj na právní pomoc v Polsku. Petici za obnovu Československa, kterou podepsal propuštěný, považuje
    podle svého „osobního právního názoru“ za možné porušení podmínky nepolitických vyjádření. Propuštěný
    podle něj „pětkrát za pět minut zalhal“. V Turkově záznamu telefonátu s matkou (2. 11.) prý v pozadí
    slyší Čermáka, proto „matka je lhářka“ a Čermák s otčímem „použili údajnou maminku“. Profil „Politický
    vězeň Čermák“ je podle něj na 99 % falešný. Čte trestní oznámení na sebe pro nebezpečné pronásledování
    (§ 354) z Chomutova a odmítá ho: šlo o veřejnou restauraci s dárky a pohoštěním, iniciátorkou „ověření“
    v Holýšově byla podle něj Bernardy. Připomíná vlastní podmínku 12 měsíců a dvouletý zákaz Prahy za
    „vysazené dveře“ a své zvolení „generálním konzulem ČSR“ 28. 10. 2023.'
