  text: '**16. 11. — Černohorský** zpochybňuje i oficiální záběry Letné z dronu. Zvuk k obrazu podle něj
    „nesedí“, a hlavně na nich nevidí jedinou vlajku, ani „hadr Evropské unie“, ani „hadr ukrajinský“,
    ani českou. Naznačuje tím, že záběry nejsou z akce a údaj o 450 tisících účastnících („oveček“) je
    vymyšlený.'
  citace:
  - text: Nevidím tam jedinou vlajku, jo, jedinou vlajku, ten hadr Evropské unie. Nevidím tam jedinej
