  nadpis: Ozempic pro děti „jeden z nejnebezpečnějších léků"; nová AI DNA vakcína — Vrabel (13. 6. 2026)
  text: '**7. 11.** — Vrabel avizuje přeložené video o Ozempicu. Proti výrobci jsou podle něj tisíce žalob
    a lékům na hubnutí přisuzuje řídnutí kostí (úbytek kostní hmoty „až v desítkách procent“), oslepnutí
    bez předchozích příznaků, poruchy mozku a trvalé poškození trávicího traktu.'
  podtema: Hantavirus
- id: vrabel-2026-11-07-03
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Nová unijní regulace hotovosti (AMLR) — plán zbavit lidi hotovosti a úspor, investiční rady
    (Vrabel, 20. 8. 2026)
  text: '**7. 11.** — Ke krachu banky (v přepisu „Unobank“) v Paraguayi (asi 3 miliony klientů bez přístupu
    k úsporám, protesty, pád prezidenta, pojištění vkladů kolem 36–37 tis. dolarů) Vrabel opakuje radu,
    kterou dává od roku 2021: nenechávat si peníze v bankách. Paraguay je podle něj „začátek“, bankovní
    problémy budou pokračovat a „čeká nás Francie“, která má na dluhopisech úrok 5,4 %, příští rok potřebuje
    350 mld. eur a v eurozóně si nemůže tisknout peníze. Vysvětluje, že při runu na banku dostanou vkladatelé
    jen pojištěnou částku (kolem 50 000 eur) a zbytek závisí na insolvenci. Stát může zpočátku vkladatele
    vyplatit („bail-out“), ale jakmile se systém začne „sypat“, nebude na to mít.'
  citace:
  - text: Takže znovu vám říkám, buďte opatrní, nenechávejte si v bance moc peněz.
- id: vrabel-2026-11-07-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Protest za poplatky ČT „aby mohli platit vlastní válečnou propagandu“ — umělá bublina a dvojí
    metr policie (Vrabel, 24. 10. 2026)
  text: |-
    **7. 11.** — K pochodu spolku Svatopluk za reformu veřejnoprávních médií (v čele Kateřina Konečná, Petr Drulák, Jan Skalický a Jiří Kobza; dále mj. Lenka Procházková, Jaroslava Obermaierová, Ivan David a Oldřich Kaiser) Vrabel poznamenává, že šla „celá ta parta“ z jeho demonstrací v roce 2022. Vlastní kritiku ale odmítá, protože podobný pochod na ČT sám pořádal. Výhradu má k heslu „Dost bylo dezinformací“, které podle něj evokuje „boj proti dezinformacím“, jenž v Evropském parlamentu prosazuje Konečná („Rajchl s lidskou tváří“), a nechápe, proč Kaiser recitoval báseň o Leninovi. Jeho hostka Vladimíra Vítová označila Svatopluk za „VIP spolek“, který nemá zájem koordinovat odpor, a za připravovanou „druhou garnituru“ falešné opozice. Jádro problému podle ní není ve financování ČT, ale v členství v EU, která určuje informační a ideologický obsah. ČT podle ní za covidu dostala od USA 4 miliony dolarů, je tedy „placená cizí státní mocí“ a měl by se na ni vztahovat zákon o spolupráci s cizí mocí. Zrušení či privatizaci ČT odmítá, protože každý stát má mít vlastní sdělovací prostředek.

    > „Tak to prostě není, protože my nejsme samostatný stát, nemáme samostatný jako stát zpravodajský kanál.“ — Vladimíra Vítová (hostka u Vrabela)
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-11-07-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: EK zařadila ČR mezi státy pod migračním tlakem — vláda pakt „odmítla“ jen slovy a sama zvyšuje
    kvóty pro pracovníky z Asie (Vrabel, 7. 11. 2026)
  text: 'K zařazení ČR mezi státy ohrožené migračním tlakem (kvůli Ukrajincům může požádat o snížení či
    odpuštění příspěvků do mechanismu solidarity; Petr Fiala to označil za důkaz, že koalice před volbami
    strašila migranty) Vrabel říká, že zpráva je dobrá i špatná. Dobrá proto, že se ČR může vyhnout následkům
    paktu; špatná proto, že vláda, která pakt v prosinci 2025 „rezolutně odmítla“, za 11 měsíců neudělala
    žádný právní krok a nepožádala ani o výjimku — vyzývat ji k tomu musí sama EU. ČR podle něj pakt „plní
    dobrovolně“ přijatými Ukrajinci („Česko-Ukrajinsko“). K vládnímu plánu zvýšit od ledna 2027 kvóty
    pro pracovníky z Filipín (12 000), Indie (1 600) a nově Indonésie (300) tvrdí, že potřeba firem je
    jen „výmluva“ pro migraci: stát, který nedokáže pokrýt práci vlastními lidmi, „nefunguje“, a „celý
    západ hoří“. Varuje, že část příchozích mohou být muslimové, kteří podle něj postupně zabírají ulice
    a čtvrti, vytvářejí no-go zóny a zavádějí právo šaría. Navazuje na [Migrační pakt vstoupil v platnost
    (12. 6.)](#migrační-pakt-vstoupil-v-platnost--vláda-ho-podle-vrabela-neodmítla-12-6-2026).'
  citace:
  - text: Migrační pakt můžeme odmítnout, ale my si je budeme prostě přivážet sami, protože naše vláda
      o tom rozhodne, že si můžeme přivážet víc a víc přistěhovalců z Asie.
- id: vrabel-2026-11-07-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Globální vzorec perzekuce kritiků globalistické agendy (Vrabel, 9. 7. 2026)
  text: '**7. 11.** — K vládou schválené novele trestního řádu, podle níž bude moci policie na žádost
    jiného státu EU bez souhlasu soudu či státního zástupce až na sedm pracovních dnů zablokovat podezřelý
    majetek (účty, vozidla, nemovitosti), Vrabel tvrdí, že jde o další krok „režimu proti lidem“ a že
    takové nástroje se „velmi často“ používají proti politické opozici — tou nemyslí parlamentní opozici,
    ale odpůrce režimu. Jako příklad uvádí zmrazení účtů lidem, kteří za covidu podporovali kanadské kamioňáky
    (Trudeau a ministryně financí Freelandová, kterou označuje za „vnučku ukrajinského nacisty“). Ke zprávě
    o zastavení stíhání Tomáše Čermáka za výroky z útěku upřesňuje, že státní zástupce jen vrátil věc
    policii k doplnění důkazů; Čermáka nazývá „skutečně politickým vězněm“.'
  citace:
  - text: Takže tady lze jednoznačně předpokládat, že to bude zase používáno proti nám.
  podtema: Politická perzekuce
- id: vrabel-2026-11-07-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Spojení všech „vlastenců“ je „cesta do pekla“; politiku diktují sponzoři — dnes zbrojaři (Vrabel,
    7. 11. 2026)
  text: 'Na divácký dotaz, zda by se opoziční politici neměli spojit, Vrabel odpovídá, že spojení všech
    je „cesta do pekla“, protože pak nelze prosazovat konkrétní program. Spojovat se mají jen ti, kdo
    chtějí totéž; proto on ve volbách spolupracuje s Vladimírou Vítovou na programu vystoupení z EU, NATO
    a WHO a „absolutní suverenity“. Široké spojení podle něj slouží jen k udržení „u koryta“: tak vznikla
    pětikoalice a tak se s ANO spojily SPD, Trikolora, Svobodní a Motoristé, kteří tím přestali plnit
    vlastenecký program. Politiku podle něj diktují sponzoři. Kamarád, místopředseda jedné parlamentní
    strany, mu prý otevřeně řekl, že na jeho demonstraci nemohou jít, protože by přišli o sponzory; podobně
    Kateřina Konečná zveřejnila SMS Jindřicha Rajchla, že spolu nemohou kandidovat kvůli sponzorům. Dnes
    jsou hlavními sponzory výrobci zbraní, a proto evropští politici tlačí na pokračování války (viz [Rutte
    a kompromisní mír](valka-ukrajina-prubeh.md#rutte-kompromis-vrabel-7-11-2026)).'
  citace:
  - text: Je to cesta do pekla, spojit se všichni v politice. To je dobrý jenom pro ty, jako byla pětikoalice,
      aby se udrželi u koryta.
  podtema: Vlastní vládní program „kdybych byl Babišem" (Černohorský)
- id: vrabel-2026-11-07-08
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Polsko: „ústavní puč“ Tuskovy vlády jako boj EU o polskou suverenitu (Vrabel, 31. 10. 2026)'
  text: '**7. 11.** — Ke střelbě v centru Krakova (6 mrtvých, mladý útočník ve vojenském oblečení se zbraněmi
    svého otce, podle některých zpráv se znakem SS divize na helmě) Vrabel motiv nechává otevřený, ale
    řadí ji do „velmi černého týdne“ Polska: německá policie ve Varšavě, „ústavní puč“, zprávy o střelbě
    „Černých Rusů“ na hranici s Kaliningradskou oblastí a kolony Bundeswehru. Příjezd Bundeswehru přirovnává
    k srpnu 1968 a připisuje mu dva úkoly: pomoci v ústavním puči a zabránit eskalaci ze strany Poláků,
    protože cizí vojáci „nebudou držet s polským národem“, a případně se přesunout k hranici s Kaliningradskou
    oblastí, kterou považuje za nejpravděpodobnější místo začátku konfliktu.'
  citace:
  - text: Takže to vypadá podle mého názoru s tím Bundeswehrem, že spíš armáda německá přijela zasahovat
      do Polska. Něco, jako jsme měli my v 68.
  podtema: Česká suverenita
- id: vrabel-2026-11-07-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Trumpova „velká dohoda“: ruská energie pro Evropu přes USA a stažení vojsk od ruských hranic;
    Abú Zabí bez průlomu, Budanov „motyka“ (Vrabel, 6. 11. 2026)'
  text: '**7. 11.** — Ke zprávě, že se ČR přiblížila dlouhodobému kontraktu na americký plyn a stát chystá
    záruky pro obchodníka (projekt ministra Karla Havlíčka „pro energetickou bezpečnost“), Vrabel tvrdí,
    že jde o přípravu na Trumpovu dohodu z předchozího dne. Rusové budou podle něj posílat plyn do Evropy
    přes Ukrajinu jako vždycky, ČR ale nebude mít smlouvu na levný plyn s Ruskem, nýbrž na drahý plyn
    s USA, které budou jen „papírový mezičlánek“. Plyn tak může být „klidně třikrát dražší“; nazývá to
    „megapodvodem“ a „největší zlodějinou“, horší než zdražená elektřina přes lipskou burzu, kterým se
    Amerika zachraňuje před bankrotem. „Diverzifikace“ podle něj znamenala odstřihnout se od jediného
    spolehlivého dodavatele, takže evropské zásobníky jsou před zimou jen zhruba z poloviny plné.'
  citace:
  - text: Takže vzdálená Amerika bude jenom papírově nějaký mezičlánek, který nás bude kasírovat za obrovský
      peníze.
  podtema: Vyjednávání a mír
- id: vrabel-2026-11-07-10
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Rutte: válka skončí kompromisem — Vrabel: válečná ekonomika a zbrojařská lobby konflikt drží,
    trvalý mír až po „denacifikaci“ a odzbrojení Ukrajiny; cvičení koalice ochotných v Polsku (Vrabel,
    7. 11. 2026)'
  text: 'K výroku generálního tajemníka NATO Marka Rutteho, že válka nebude mít jednoznačného vítěze a
    skončí kompromisní mírovou dohodou, Vrabel říká, že politikům „nemůžete věřit ani nos mezi očima“,
    protože každou chvíli říkají něco jiného. Kompromis podle něj nepřichází v úvahu: Evropa zlikvidovala
    svou ekonomiku a přešla na válečnou, která bez použití zbraní a zisku území zkrachuje, a zbrojařská
    lobby má obrovský politický vliv (zmiňuje Michala Strnada, který podle něj chodí na návštěvy za Okamurou
    do Sněmovny, a prezidenta Pavla „zlobbovaného“ zbrojaři; viz [sponzoři diktují politiku](politicky-system.md#sponzori-cesta-do-pekla-vrabel-7-11-2026)).
    Trvalý mír by podle něj vyžadoval „denacifikaci“ a odzbrojení Ukrajiny, konec budování základen kolem
    Ruska a otevření příčin od let 2013–2014 a minských dohod. Podmínky ukrajinského ministra zahraničí
    Andrije Sybihy pro Abú Zabí (žádné omezení armády, volba zahraniční politiky, silné bezpečnostní záruky)
    považuje za neslučitelné s ruskými požadavky, a proto na trvalé řešení v Abú Zabí ani na schůzce USA–Rusko–Čína
    v Šen-čenu (summit APEC 18.–19. 11.) „velká šance není“. Chystané první velké cvičení koalice ochotných
    v Polsku (9.–22. 11., 2800 zahraničních a 2000 polských vojáků), které má nacvičit rozmístění západních
    vojsk na Ukrajině po válce, popisuje jako zneužití řečí o míru k přiblížení vojsk k Rusku. Současný
    chaos podle něj připomíná „ticho před bouří“.'
  citace:
  - text: Ten konflikt skončí, až se vyřeší ten nacismus, který na Ukrajině je, až se vyřeší to, že se
      okolo Ruska staví vojenský základny.
  podtema: Vyjednávání a mír
