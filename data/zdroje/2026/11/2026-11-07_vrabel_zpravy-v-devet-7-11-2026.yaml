- id: vrabel-2026-11-07-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Muž s „hlasy“, které mu přikazovaly zabít Trumpa — Vrabel se „nediví“; Trumpovy „neodpustitelné“
    činy (Vrabel, 7. 11. 2026)
  text: 'Ke zprávě, že Secret Service ve Washingtonu zadržela Venezuelana, který tvrdil, že mu hlasy přikazují
    zabít prezidenta Trumpa, Vrabel nejprve žertuje o vlastních „hlasech“ a dodává, že kdyby mu něco takového
    říkaly, neřekl by to, aby nebyl odsouzen jako Tomáš Čermák. Pak vyjmenovává Trumpovy „neodpustitelné“
    činy posledních dvou let: americký útok, při kterém v Íránu zahynuly „malé holčičky“ ve škole, zabití
    ajatolláha Chameneího a „vyvraždění“ íránského vedení, zabití ochranky a únos venezuelského prezidenta
    s manželkou, nevýhodné obchodní smlouvy pro Evropu, cla až 100 % a „zničení světové ekonomiky“ uzavřením
    Hormuzského průlivu. Uznává, že Trump „určitě vykonal spoustu dobrého“, ale „vůbec se nediví“ hlasům,
    které někomu říkají, že by ho měl „dostat z tohohle světa“ (viz [stochastický teror](stochasticky-teror.md)).'
  citace:
  - text: Takže se vůbec nedivím tomu, že někde existují tady v prostoru nějaké hlasy, které občas někomu
      říkají, že by ho měl jít z tohohle světa dostat pryč.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-11-07-02
  typ: tvrzeni
  temata:
