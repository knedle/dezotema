  nadpis: po „velkých mírových jednáních“ přijde teroristický útok na mezinárodně významnou osobu a pak
    válka v Evropě
  text: Po velkých mírových jednáních bude spáchán teroristický útok na „někoho mezinárodně významného“
    a „pak to začne“, tedy válka, která se rozšíří i na území EU.
  citace:
  - text: Ale to budou velká mírová jednání. Pak bude teroristický útok na někoho významného, mezinárodně
