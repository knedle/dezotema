  poznamka: 1 h 27 min, zprávy čte Zuzka; den summitu EU v Dublinu, dva dny před demonstrací na Letné.
    23 témat v denním přehledu, 10 s vlastním úhlem (⚡). Stochastický teror nezjištěn. Zpracováno podle
    podkladů pomocného agenta.
vyroky:
- id: vrabel-2026-11-13-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Mossad žádá USA o obnovu operací proti Íránu — válka potrvá, „dokud neudělají velký Izrael“
    (Vrabel, 13. 11. 2026)
  text: Ke zprávě o cestě šéfa Mosadu Barnei do USA a zvýšené pohotovosti v Izraeli Vrabel tvrdí, že válka
    s Íránem bude pokračovat, „dokud neudělají velký Izrael“, a „globalisté“ podle něj vyhrávají na všech
    frontách. Zmiňuje přitom „chazarská židovská jména“ amerických vyjednavačů (Witkoff), což je formulace
    s antisemitským podtextem.
  citace:
  - text: Dokud prostě neudělají velký Izrael, tak budou pokračovat dál.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-11-13-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Studentské protesty za ČT jako revoluce „řízená CIA přes českou tajnou službu“ podle srbského
    scénáře; řečníka by trestně stíhal (Vrabel, 10. 11. 2026)
  text: '**13. 11.** — Před demonstrací na Letné 15. 11. Vrabel opakuje, že jde o „politický převrat“
    řízený CIA a českou tajnou službou přes iniciativy Veřejnoprávní a Studentstvo, rektory a divadla,
    podle srbského a majdanského scénáře. Poplatky jsou podle něj jen „záminka“, protože financování z
    rozpočtu by znamenalo stejnou částku, jen zaplacenou z daní. Studenti podle něj dostávají „vysoké
    kapesné“ a demonstrace má stát 8 milionů korun. Policie podle něj nechává FAMU „dělat bordel“. Vyvrcholení
    čeká 17. 11. Svůj pochod 17. 11. zrušil po telefonátu majora Koláře, který měl z odvolání podle něj
    radost.'
  citace:
  - text: To, co se chystá, je politický převrat.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-13-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Podpálené auto Juliana Reichelta (NIUS) — policie bagatelizuje, kdyby šlo o ředitele ČT, byl
    by to terorismus (Vrabel, 13. 11. 2026)
  text: Podpálení auta šéfa berlínského média NIUS Juliana Reichelta policie podle Vrabela bagatelizuje
    jako „podezření na žhářství“, kdežto u ředitele ČT by mluvila o terorismu. Srovnává to s tím, když
    ho polil barvou Anton Klobučkin, a s policejní razií u Zítka. Reichelta nazývá „naším člověkem“ a
    nezávislým novinářem, sebe a moderátorku Zuzku také, kdežto „Česká televize není nezávislé médium“.
    Brand podle něj „gentleman“ odsouzený bez důkazů.
  citace:
  - text: Jediný, čím jsme omezený, je vězení.
  podtema: Nová alternativní média
- id: vrabel-2026-11-13-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Soud EU zamítl polské žaloby proti Fit for 55 — „vždy rozhodne proti státu“; koruna v ústavě
    jako „krmení voličů“ (Vrabel, 13. 11. 2026)
  text: 'Zamítnutí sedmi polských žalob proti klimatickému balíčku Fit for 55 je pro Vrabela důkazem,
    že nařízení EU jsou závazná a soud EU „vždy rozhodne“ proti suverenitě státu, stejně jako u migračního
    paktu a eura. Zakotvení koruny v ústavě je podle něj jen „krmení voličů“, aby si nepřipadali podvedení,
    euro se stejně přijme. ČR podle něj bude muset „solidárně“ přijímat migranty a Ukrajinci jsou způsob,
    jak národní suverenitu ztratit: „až budete mít třetinu Ukrajinců, pošlou vám migráčky“.'
  citace:
  - text: Tak pak vám pošleme migráčky, jak to máte pěkně z obou stran promíchaný, ať už vůbec nemáte
      šanci na nějakou národní suverenitu.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-11-13-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Příměří jako „kopice dynamitu“, EU „finančně závislá“ na válce, ruská aktiva jako krádež; Ukrajina
    „nacistický režim“ (Vrabel, 13. 11. 2026)
  text: Požadavek Kaji Kallasové „nejdřív příměří, pak mír“ je podle Vrabela záměrné zablokování míru,
    protože Rusko příměří dlouhodobě odmítá. Příměří s evropskými vojsky a zárukou typu „článku 5“ pro
    Ukrajinu by bylo „kopicí dynamitu“, ke které stačí jiskra. Evropský vyjednávací tým (Francie, Německo,
    Itálie, Polsko, Británie, Komise a Rada) nazývá „šaškárnou“ „největších válečných štváčů“ (Merz, Tusk).
    EU podle něj věnuje „90 % času“ Ukrajině, protože její představitelé jsou „až moc závislí“ na toku
    peněz do zbrojení a na vizi poraženého, „rozparcelovaného“ Ruska a jeho nerostného bohatství na Donbase.
    Výslovně dodává, že jde o jeho názor bez zákulisních informací. Varování šéfky Euroclearu před použitím
    zmrazených 210 mld. eur pokládá za oprávněné, protože vyvlastnění by bylo „krádeží“ a vyhnalo by investory.
    Na dalších 70 mld. eur pro Ukrajinu má podle něj „někdo eminentní zájem“ a „bůh ví, kolik se rozkrade“.
    Vyslání britských a francouzských vojsk (Rasmussen) by podle něj přineslo teroristické útoky a hořící
    rafinerie i do ČR. K obžalobě 22 lidí v Chorvatsku za nacistická gesta říká, že Ukrajina je naproti
    tomu „samozřejmě nacistická země, nacistický režim“, i když ne všichni Ukrajinci jsou nacisté.
  citace:
  - text: Evropská unie […] prostě tlačí dál tu svoji představu, možná ne svojí, možná někoho jinýho,
      že Rusko by mělo být poraženo, rozparcelováno.
  podtema: Vyjednávání a mír
- id: vrabel-2026-11-13-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 454 mld. eur na obranu za jediný rok jako vysvětlení drahoty; úspory Evropanů (10 bilionů eur)
    skončí ve zbrojních firmách „za zády lidí“ (Vrabel, 10. 11. 2026)
  text: '**13. 11.** — K výpadkům Microsoftu, propadu stříbra a kryptoměn a k německému rozpočtu na rok
    2027 (dluh 4,64 % HDP proti 4,67 % v ČR) Vrabel říká, že „jsme ve stádiu drancování“. Ceny papírového
    zlata jsou podle něj uměle stlačovány a dluhy, které dělají Babiš i Merz, se zaplatí majetkem lidí
    jako v Řecku (omezení výběrů, bail-in), každý Čech bude v roce 2027 dlužit 36 tisíc korun. Akcie a
    fondy označuje za „ultra nebezpečné“, kryptoměny za nebezpečné a věří, že zlato „se vrátí nahoru“.
    „Když přijde run na banku“, mohou lidé o peníze přijít.'
  citace:
  - text: Protože jsme ve stádiu drancování.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-11-13-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Po „velkých mírových jednáních“ přijde teroristický útok na významnou osobu „a pak to začne“
    (Vrabel, 13. 11. 2026)
  text: 'K atentátům na ruské důstojníky v Petrohradu a Moskvě Vrabel připomíná proroctví „tibetského
    doktora“, se kterým mluvil v Alpách v roce 2022: nejdřív budou velká mírová jednání, pak teroristický
    útok na někoho mezinárodně významného, a pak začne válka. „Běhá mu mráz po zádech“, protože dřív čekal
    válku v letech 2023 a 2024 a teď se scénář podle něj naplňuje. Vypráví i vlastní sen o frontě v domě
    a tanku. Věří, že se válka rozšíří na území EU.'
  citace:
  - text: Ale to budou velká mírová jednání. Pak bude teroristický útok na někoho významného, mezinárodně
      významného, a pak to začne.
  podtema: Zahraniční aktéři a precedenty
