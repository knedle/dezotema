  titul: Tomáš Hrdlička ODSOUZEN
  datum: 2026-11-23
  url: https://www.facebook.com/100087923704145/videos/1709152920734519
  prepis: prepisy/done/2026-11-23_Ladislav-Vrabel_62K-views-705-reactions-Tomáš-Hrdlička-ODSOUZEN-Ladis.txt
  delka: "00:06:49"
  rezim: vrabel
  poznamka: 'Krátký monolog Vrabela (6 min 49 s) k odsouzení Tomáše Hrdličky za symbol Z. 7 témat v přehledu,
    5 z nich s vlastním úhlem (⚡) ve 5 výrocích, z toho 1 predikce (zatýkání a odsuzování za písmeno Z bude pokračovat).
    Stochastický teror: žádný. Citace ověřeny v přepisu.'
  prehled:
  - tema: Odsouzení Tomáše Hrdličky za písmeno Z
    text: Hrdlička dostal podmíněný trest a povinnou „převýchovu“, odvolává se i státní zástupce; šanci vidí jen
      u Nejvyššího či Ústavního soudu.
    vyrok: vrabel-2026-11-23-41
  - tema: Odpovědnost Rajchla a Vacka za kriminalizaci symbolu Z
    text: Rajchl a Vacek podle něj od roku 2023 trestním oznámením na „tři individua“ dali režimu „munici“
      k odsuzování lidí.
    vyrok: vrabel-2026-11-23-42
  - tema: Svoboda slova a zrušený pochod 17. listopadu
    text: u Ústavního soudu uspěl jen s rušením poplašné zprávy, § 405 přetrvává; zrušení pochodu 17. 11. je
      rád, aby nikdo další nebyl zatčen.
    vyrok: vrabel-2026-11-23-43
  - tema: Zatčená důchodkyně s písmenem Z u soudu
    text: u soudu na Ovocném trhu prý zatkli důchodkyni s písmenem Z a odvezli ji na Bartolomějskou, což podle
      něj ukazuje, co by čekalo pochod.
    vyrok: vrabel-2026-11-23-43
  - tema: Eskalace války, Francouzi v Mariupolu a výroky prezidenta
    text: francouzské jednotky prý operují v Mariupolu, útoky na ruské rafinérie a fregatu eskalují, Pavel připouští
      dopady ruských raket na ČR; připravit se na přímou válku.
    vyrok: vrabel-2026-11-23-44
  - tema: Katka Blahníková a stuha se Z u soudu
    text: Blahníková zatím nedostala od policie ani soudu žádné vyjádření; pokud dostane, uspořádá se demonstrace
      za svobodu slova.
  - tema: Závěr, příprava na těžkou dobu a policejní praxe
    text: zachraň se, kdo můžeš, policie bude zatýkat každého se Z, soudy rozhodnou stejně, dokud to neprolomí
      Nejvyšší nebo Ústavní soud.
    vyrok: vrabel-2026-11-23-45
