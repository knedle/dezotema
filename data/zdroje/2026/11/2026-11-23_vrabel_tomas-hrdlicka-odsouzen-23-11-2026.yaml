- id: vrabel-2026-11-23-41
  typ: tvrzeni
  temata:
  - politicky-system
  - kauzy
  nadpis: Hrdlička odsouzen za písmeno Z — podmínka a „převychovávání“, šance jen u Nejvyššího a Ústavního soudu
    (Vrabel, 23. 11. 2026)
  text: 'Vrabel oznamuje, že Tomáš Hrdlička byl odsouzen za nošení písmene Z na demonstraci a dostal podmíněný trest
    (podle něj 6 měsíců na 18 měsíců podmíněně) i povinnou docházku na „převýchovu“, kde mu prý budou „vymývat mozek“.
    Státní zástupce argumentoval letošním rozsudkem Nejvyššího soudu, a proto podle Vrabela nemá Hrdlička u okresního
    a krajského soudu velkou šanci; odvolal se Hrdlička i státní zástupce (kvůli nízkému trestu). Jedinou cestu
    k výhře vidí u Nejvyššího nebo Ústavního soudu.'
  citace:
  - text: Bude muset povinně docházet někam, kde mu budou vymývat mozek.
    cas: "01:16"
  - text: Tam to nevypadá, že by Tomáš měl nějakou velkou šanci k tomu, aby vyhrál.
    cas: "00:54"
  osoby:
  - {osoba: tomas-hrdlicka, vztah: pozitivni, kontext: 'Líčen jako oběť výkladu symbolu Z, odsouzen k podmínce a „převýchově“'}
- id: vrabel-2026-11-23-42
  typ: tvrzeni
  temata:
  - politicky-system
  - kauzy
  nadpis: Rajchl a Vacek „dali do rukou munici“ — od roku 2023 se za symbol Z zatýká a odsuzuje (Vrabel, 23. 11. 2026)
  text: 'Vrabel „děkuje“ Jindřichu Rajchlovi a prvnímu místopředsedovi PRO Vackovi za to, že od roku 2023 jsou
    lidé zatýkáni a odsuzováni za symbol Z, protože na demonstraci identifikovali tři lidi a podali na ně trestní
    oznámení. Tvrdí, že Rajchl tím udělal totéž co Rakušan, Stříž a Fiala, tedy označil symbol Z za trestný,
    a dal tak „obrovskou munici“ soudům, které od té doby rozhodují stejně. Sám se od odpovědnosti distancuje:
    „na triku to má Rajchl“.'
  citace:
  - text: když Rajchlovi převzal demonstrace a udělal to samé co Rakušan, Stříž a Fiala, tedy, že písmene Z je
      trestní, tak jim dal do rukou prostě obrovskou munici, obrovský náboj a od té doby soudy rozhodují v této
      věci takhle.
    cas: "02:20"
  - text: Ne, že bych to měl na triku, na triku to má Rajchlo.
    cas: "03:12"
  osoby:
  - {osoba: rajchl, vztah: negativni, kontext: 'Obviněn, že trestním oznámením z roku 2023 umožnil odsuzování za symbol Z'}
  - {osoba: petr-vacek, vztah: negativni, kontext: Jmenován spolu s Rajchlem jako spoluodpovědný za trestní oznámení}
  - {osoba: vit-rakusan, vztah: negativni, kontext: Přirovnán k Rajchlovi v kriminalizaci symbolu Z}
  - {osoba: igor-striz, vztah: negativni, kontext: Přirovnán k Rajchlovi v kriminalizaci symbolu Z}
  - {osoba: petr-fiala, vztah: negativni, kontext: Přirovnán k Rajchlovi v kriminalizaci symbolu Z}
  - {osoba: tomas-hrdlicka, vztah: pozitivni, kontext: 'Jeden z lidí, na které bylo podáno trestní oznámení'}
- id: vrabel-2026-11-23-43
  typ: postoj
  temata:
  - politicky-system
  - kauzy
  nadpis: Svoboda slova — jediné vítězství u Ústavního soudu a „rád, že jsme zrušili pochod 17. listopadu“ (Vrabel,
    23. 11. 2026)
  text: 'Vrabel uvádí, že od roku 2022 se boj o svobodu slova podařilo vyhrát jen jemu u Ústavního soudu, který
    zrušil trestný čin šíření poplašné zprávy, zatímco § 405 se zrušit nepodařilo. Je rád, že byl zrušen pochod
    17. listopadu, protože by na něm podle něj zatýkali a odsuzovali další lidi, a nechce být za to spoluzodpovědný.
    Jako doklad zmiňuje zatčení důchodkyně s písmenem Z u soudu na Ovocném trhu a tvrdí, že represe sílí, čím blíž
    je válka.'
  citace:
  - text: Dokonce u soudu dneska na ovocným trhu zatkli nějakou důchodkyni, která přišla a měla na sobě nějaký
      písmeno Z, tak ji zatkli a odvezli ji na Bartolomějskou
    cas: "03:20"
  - text: nemyslete si, že se to nějakým způsobem lepší, horší se to, čím blízme válce, tím je to horší a tvrdší
      likvidace a opozice
    cas: "03:37"
  osoby: []
- id: vrabel-2026-11-23-44
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - valka-ukrajina-prubeh
  - nato-zbrojeni-militarizace
  nadpis: Eskalace války — francouzské jednotky v Mariupolu, útoky na ruské cíle; „připravte se na přímou válku“
    (Vrabel, 23. 11. 2026)
  text: 'Vrabel tvrdí, že francouzské jednotky už operují v Mariupolu a že Ukrajinci spolu s dalšími evropskými
    vojsky, včetně zemí financujících a vyzbrojujících Ukrajinu, útočí na ruské rafinérie a potopili 100metrovou
    fregatu. Situace se podle něj nelepší, ale eskaluje, politici se bojí a odmítají se k útokům hlásit. Uvádí,
    že prezident Pavel řekl, že na české území mohou dopadat ruské rakety a drony, což je podle něj to, co říká
    celou dobu. Vyzývá posluchače, aby se připravili na možnost přímé války a těžké doby; po jejím skončení
    prý bude třeba znovu bojovat za lepší společnost.'
  citace:
  - text: protože už francouzské jednotky normálně operují v Mariupolu, tam už se lidi stěžují, že tam žoldáci
      francouzskí chodí do barů a neplatí
    cas: "03:53"
  - text: teď je opravdu doba na to, abyste si připravili na to, že ta doba může být velmi tvrdá, že se můžeme dostat
      do přímý války
    cas: "05:43"
  osoby:
  - {osoba: petr-pavel, vztah: neutralni, kontext: 'Cituje jeho slova o možnosti dopadu ruských raket a dronů na ČR jako potvrzení svých varování'}
- id: vrabel-2026-11-23-45
  typ: predikce
  temata:
