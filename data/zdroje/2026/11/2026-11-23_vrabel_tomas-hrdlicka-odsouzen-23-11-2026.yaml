  nadpis: Policie bude zatýkat každého se symbolem Z, soudy ho odsoudí — dokud to nerozbije Nejvyšší nebo Ústavní
    soud (Vrabel, 23. 11. 2026)
  text: Vrabel předpovídá, že policie bude zatýkat všechny, kdo mají na sobě písmeno Z, ti budou souzeni a prohrají
    v první i odvolací instanci, dostanou podmínku a „převýchovu“, a že se to změní jen případným rozhodnutím
    Nejvyššího či Ústavního soudu.
  citace:
  - text: policie prostě bude zatýkat každýho, kdo má na sobě písmeno Z, bude je brát k výslechům a budou je posílat
      k soudu, a tam prohrajou i prvou instanční, i odvolací soud z nejvyšší pravděpodobnosti
    cas: "06:20"
