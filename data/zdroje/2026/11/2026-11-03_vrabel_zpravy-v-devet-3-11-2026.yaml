vyroky:
- id: vrabel-2026-11-03-01
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Globální vzorec perzekuce kritiků globalistické agendy (Vrabel, 9. 7. 2026)
  text: '**3. 11.** — K podezření SBU, že bývalá mluvčí Zelenského Julia Mendelová spáchala velezradu,
    Vrabel tvrdí, že jen „řekla pravdu“ (o Zelenského rozkazech a o istanbulské dohodě zmařené Západem).
    Hrozí jí podle něj „trest smrti“ nebo „nájemný zabiják“. Sám prý cítí, že by měl držet „low profile“,
    protože na Západě jsou v bezpečí jen ti, kdo „jedou s NATO a s Evropskou unií“. Jako příklady uvádí
    odsouzené ze svého hnutí za odznak „Z“, zákaz RT a Sputniku, Assange, Russella Branda, Reinera Füllmicha
    a dluh své manželky. Celé to podle něj ukazuje „boj elit proti lidem“, v němž elity mají peníze, média,
    policii i armádu.'
  citace:
  - text: Bohužel to, to, čím procházíme, je boj elit proti lidem.
  osoby:
  - osoba: julia-mendelova
    vztah: pozitivni
    kontext: „Řekla pravdu“, „je mi to opravdu líto“
  - osoba: reiner-fullmich
    vztah: pozitivni
    kontext: Chtěl soudy „proti té západní mafii“, je ve vězení
  podtema: Politická perzekuce
- id: vrabel-2026-11-03-02
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'TCK na Ukrajině: násilná mobilizace a úmrtí na odvodové komisi (Vrabel, 12. 6. 2026)'
  text: '**3. 11.** — Ke střetům u objektu Azovu v Petropavlivské Borščahivce u Kyjeva, kde podle protestujících
    věznili mobilizované, Vrabel tvrdí, že šlo o dům pro muže, kteří se snažili utéct z války; dva z nich
    měli zlomenou páteř a mezi zadrženými byl čtrnáctiletý chlapec. Video označuje za „první důkazy“ o
    tom, jak „ukrajinský režim“ mučí vlastní lidi, a oznámené stíhání protestujících za snahu je „umlčet“.
    Ukrajinu znovu označuje za pravděpodobně největší zdroj lidských orgánů. Svou dřívější tezi upřesňuje:
    Rusko jsme podle něj měli podpořit „především diplomaticky“ a že bychom s Ruskem měli napadnout Ukrajinu,
    „nikdy neřekl“ (srov. výrok z 9. 10.). Muži z fronty podle něj po válce přijdou hlavně do Polska a
    ČR.'
  citace:
  - text: Takže prostě tady jsou první důkazy o tom, jakým způsobem mučí vojáci, ten ukrajinský režim,
      lidi na Ukrajině, svoje vlastní.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-11-03-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenskyj nabízí 25 % území výměnou za vojska NATO — jednání „stoprocentně neúspěšná“; ukrajinskou
    armádu v „Evropské kolektivní obraně“ zaplatíme my (Vrabel, 26. 10. 2026)
  text: '**3. 11.** — Schůzku Západu o bezpečnostních zárukách pro Kyjev (4. 11.) a americko-rusko-ukrajinská
    jednání v Abú Zabí (10.–11. 11.) Vrabel považuje za Trumpovo „předvolební PR“ bez pozitivního výsledku.
    Účast Witkoffa a Kushnera — „realitních makléřů“ a nevolených obchodních partnerů Trumpa — i ruského
    vyjednavače Medinského z toho podle něj dělá „Béčkové, spíš Céčkové setkání“; o skutečném míru by
    museli jednat nejméně ministři zahraničí. Jedinou možnou bezpečnostní zárukou je podle něj vojenská
    neutralita Ukrajiny s nejvýš 100 tisíci vojáky po vzoru Srbska. Vstup do EU zárukou být nemůže: státy
    ho podle něj nebudou chtít, protože zadlužená Ukrajina by EU „stáhla ke dnu“, a EU se mění ve „vojenskou
    unii“, kterou Rusko na hranici nepřijme. ⚡ 26. 10. přitom tvrdil, že Ukrajina bude v EU „skoro se
    stoprocentní jistotou“.'
  citace:
  - text: Tohle to je jediná možná bezpečnostní záruka pro Ukrajinu, že bude vojensky neutrální.
  osoby:
  - osoba: steve-witkoff
    vztah: negativni
    kontext: S Kushnerem „realitní makléři“, nevolení; setkání kvůli nim „Cčkové“
  - osoba: jared-kushner
    vztah: negativni
    kontext: „Realitní makléř“ bez mandátu
  podtema: Vyjednávání a mír
