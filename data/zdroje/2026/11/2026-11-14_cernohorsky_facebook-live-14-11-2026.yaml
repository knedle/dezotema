  nadpis: „Nemáte peníze, nemáte spravedlnost“ — případ Ivy Rosické (Černohorský, 7. 11. 2026)
  text: '**14. 11.** — Černohorský opakuje, že bez peněz na právníka „nemáte právo“, a vybírá na právníky
    pro Ivu Rosickou a Terezu Vlasákovou. Těžce nemocní podle něj přicházejí o invalidní důchod 2. a 3.
    stupně a na příspěvky čekají měsíce. Ministra Juchelku by vyměnil za „člověka s empatií“. Exekutory
    označuje za „mafii“.'
  osoby:
  - osoba: ales-juchelka
    vztah: negativni
    kontext: Vyměnit za „člověka s empatií“
  podtema: Vlastní vládní program „kdybych byl Babišem" (Černohorský)
