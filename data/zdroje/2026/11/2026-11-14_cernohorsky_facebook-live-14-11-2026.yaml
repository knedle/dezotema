- id: cernohorsky-2026-11-14-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel nevrátil důchodovou reformu, „cestovka“ a Hungaroring, Lichtenštejnové, souhlas se zrušením
    veta — ústavní žaloba (Černohorský, 14. 11. 2026)
  text: Černohorský vyčítá Pavlovi, že důchodovou reformu nevrátil Ústavnímu soudu. Miloš Zeman, který
    podle něj dával plat Klokánku, byl proti němu „diamantový člověk“. Pavla nazývá „cestovkou“ a ptá
    se, kdo mu platil akreditaci na okruhu Hungaroring. Jeho žádost podle zákona 106/1999 Sb. podle něj
    zůstala bez odpovědi. Evě Pavlové vyčítá, že si „vyžebrala“ odpočinek v Karibiku, a uráží ji. Dále
    tvrdí, že Pavel jednal s Lichtenštejny o fondu 35 miliard, dal záštitu sudetoněmeckým akcím v Brně,
    „daruje plyn“ Německu a souhlasil by se zrušením práva veta ČR v zahraniční politice, takže by o ČR
    „mohli rozhodovat bývalí nácci jako Merz“. Chystá proti Pavlovi ústavní žalobu. Vulgární výroky viz
    [Stochastický teror](stochasticky-teror.md).
  citace:
  - text: Bez problému by nechal zrušit právo veta pro Českou republiku v zahraničních otázkách. […] Takže
      by vlastně o nás mohli rozhodovat bývalí nácci jako Merz.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Nevrátil důchodovou reformu, „cestovka“, veto; Pavlová „do Lidlu k pokladně“
  - osoba: eva-pavlova
    vztah: negativni
    kontext: Nevrátil důchodovou reformu, „cestovka“, veto; Pavlová „do Lidlu k pokladně“
  - osoba: milos-zeman
    vztah: pozitivni
    kontext: „Diamantový člověk“ oproti Pavlovi
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-11-14-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 17. listopad „ukradli“ pravdoláskaři — svátek plurality názorů proměnili ve svůj „vítězný únor“
    (Rajchl, 8. 11. 2026)
  text: '**14. 11. — Černohorský** jde dál. „Rádoby sametovou revoluci“ označuje za podvod, který připravil
    Západ se „zkorumpovanými parchanty z KSČ a StB“, aby se rozkradl národní majetek vybudovaný dnešními
    seniory z trosek. Průmysl podle něj na konci války cíleně rozbombardovali Američané (Škodovka, generál
    Patton: „dobrá práce“). Rozdělení Československa podle něj „se bohužel muselo stát“, jinak byl naplánován
    „balkánský scénář“. Fialovu vládu považuje za nejzkorumpovanější „za celých 37 let“, horší než kupónová
    privatizace. ⚡ Na rozdíl od Rajchla, který pád režimu považuje za správný, chápe Černohorský celý
    listopad 1989 jako řízený podvod. Na svého dědu, který „opravdu věřil“ v socialismus a z KSČ odešel
    kvůli „zlodějům“, vzpomíná s uznáním.'
  citace:
  - text: Ta rádoby sametová revoluce, tady tenhle ten podvod, který připravoval samozřejmě Západ se zkorumpovanýma
      parchantama z KSČ a samozřejmě StB.
  podtema: Politická kultura
- id: cernohorsky-2026-11-14-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Porušené sliby a ústava — Fialova vláda „rozkradla bilion dvě stě miliard“; trest smrti za korupci
    „jako v Číně“ (Černohorský, 14. 11. 2026)
  text: Černohorský předčítá slib poslance, člena vlády, prezidenta a senátora i preambuli Ústavy a tvrdí,
    že je Fiala, Rakušan, Černochová a další porušili. Za čtyři roky podle něj „rozkradli bilion dvě stě
    miliard“, zvýšili si platy, okradli důchodce a peníze poslali na zbraně. S Ústavou si podle něj „vytírají
    anál“. Požaduje obnovit trest smrti za vlastizradu, velezradu a „státní korupci, jako v Číně“ pro
    všechny, kdo se podíleli na Dozimetru, kampeličce, rozkrádání zbrojních zakázek a bitcoinové kauze.
    Alternativou by byly elektronické obojky a nucené práce. Trest má viset „jako Damoklův meč“. Současná
    vláda podle něj „90 % těch hajzlů“ do vězení nepošle, protože sama „má špinavé ruce“. Konkrétní výroky
    viz [Stochastický teror](stochasticky-teror.md).
  citace:
  - text: Já jsem jednoznačně pro obnovu trestu smrti za vlastizradu, velezradu a za korupci, za státní
      korupci, jako v Číně.
  podtema: Politická kultura
- id: cernohorsky-2026-11-14-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Senátor Grolich a „rozhodne ulice“ jako výzva k násilí — proč byli odsouzeni Čermák a Tušl,
    a on ne? (Černohorský, 14. 11. 2026)
  text: Nově zvoleného senátora Grolicha (podle Černohorského 5,6 milionu ročně, tedy „466 666 Kč měsíčně
    hrubého z našich daní“) Černohorský uráží a jeho televizní výrok, že o poplatcích „rozhodne ulice“,
    označuje za šíření nenávisti, výzvu k násilí a „znaky terorismu“. Připomíná, že Tomáš Čermák a Tušl
    byli odsouzeni (byl u soudu), a ptá se, zda je Grolich jako senátor „nad právem“. Fiala a Rakušan
    prý za demonstrací proti nim tvrdili, že žádnému nátlaku nepodlehnou, a teď opoziční politici dělají
    opak. Vlastenecká scéna podle něj nikdy nenesla transparenty urážející Fialu, jaké se objevují dnes.
    Kritiku nočního hlasování o poplatcích (ve 4:36) považuje za účelovou, protože Fialova vláda hlasovala
    ve 3–5 ráno běžně.
  citace:
  - text: Pan Grolich, protože je senátor, tak je nad člověk? On je nad právem?
  osoby:
  - osoba: grolich
    vztah: negativni
    kontext: „Rozhodne ulice“ jako výzva k násilí
  podtema: Politická kultura
- id: cernohorsky-2026-11-14-06
  typ: tvrzeni
