  poznamka: 1 h 52 min, živé vysílání z auta. Rok 1989 jako podvod, ČT a demonstranti, porušené sliby
    a trest smrti za korupci, Pavel a ústavní žaloba, Grolich, spravedlnost bez peněz. Sovětská vlajka
    na profilovce je podle něj úcta rudoarmějcům, ne obdiv k Rusku. 6 výroků stochastického teroru (3
