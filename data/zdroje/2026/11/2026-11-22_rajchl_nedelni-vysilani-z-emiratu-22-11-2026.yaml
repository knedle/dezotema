  nadpis: Emiráty vyřizují vše přes mobil, Bartošova digitalizace stavebního řízení selhala (Rajchl, 22. 11. 2026)
  text: |
    Emiráty podle něj ČR technologicky „utekly“ — občanku, řidičák i platby vyřídíte přes aplikaci,
