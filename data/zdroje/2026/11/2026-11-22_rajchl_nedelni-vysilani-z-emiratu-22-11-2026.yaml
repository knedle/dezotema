- id: rajchl-2026-11-22-20
  typ: stoch-teror
  temata:
  - migrace
  nadpis: „Parta afrických chirurgů v Paříži“ — migranti „rabující“ ve Francii (Rajchl, 22. 11. 2026)
  text: |
    Ironickým označením „afričtí chirurgové“ (narážka na rétoriku o migrantech jako kvalifikované pracovní
    síle) a líčením „afrických migrantů rabujících ve Francii“ paušalizuje skupinu migrantů jako
    kriminální, v kontextu výzvy k „remigraci“. Bez výslovné výzvy k násilí — hraniční případ.
  citace:
  - text: Nejsme schopni se vypořádat s africkými migranty rabujícími ve Francii v jejich obchodech.
