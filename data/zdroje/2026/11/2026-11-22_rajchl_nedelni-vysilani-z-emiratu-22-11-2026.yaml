  nadpis: 17. listopad jako „vítězný únor“ pravdoláskařů; rok 1989 nebyl dějinným zlomem (Rajchl, 22. 11. 2026)
  text: |
    Opakuje myšlenky svého projevu k 17. listopadu: rok 1939 je pro něj zásadnější než rok 1989, který
    nepovažuje za velký dějinný zlom. Oslavy na Národní třídě si podle něj „zprivatizovali“ lidé, kteří
    se vykupují ze špatného svědomí, a mladí studenti znající dobu „z kreslených učebnic“. Původním
    poselstvím byla pluralita názorů; dnešní stav (ostrakizace odlišných názorů, vyhazování z práce)
    přirovnává k totalitě a „bruselský režim“ k režimu před rokem 1989. Chybou po roce 1989 bylo podle něj
    vpuštění zahraničního kapitálu, který nás „zotročil“.
  citace:
  - text: Oni si ze 17. listopadu udělali vítězný únor.
    cas: "03:44"
