  nadpis: Moderátoři veřejnoprávních médií nejsou „majitelé pravdy“, ČT reformovat, nebo zrušit (Rajchl, 22. 11. 2026)
  text: |
    Rozvádí ranní srovnání: moderátorka ČRo nechala Mináře „vyprávět bludy“ a „podkuřovala mu“, zatímco
    moderátorka ČT nenechala Ivana Davida domluvit ani jednu větu, když tvrdil, že Rusko chce mír.
    Veřejnoprávní moderátoři podle něj nemají „uvádět věci na pravou míru“, ale klást otázky a pozvat
    případně jiného hosta. S odkazem na průzkum (52 % lidí ČT nevěří) prohlašuje, že ČT je nutné
    zreformovat, nebo zrušit — dnes ji podle něj díky internetu „vůbec k ničemu nepotřebujeme“.
  citace:
  - text: Vy nejste majitelé pravdy. Většinou jste hlupáci, kteří vůbec netušíte, jaký geopolitický vývoj v současné době probíhá. Jenom opakujete titulky … a jak ovce je papouškujete dál.
    cas: "14:34"
  osoby:
  - {osoba: ivan-david, vztah: pozitivni, kontext: 'V ČT nedostal prostor domluvit'}
  - {osoba: mikulas-minar, vztah: negativni, kontext: 'V ČRo mohl „vyprávět bludy“'}
  - {osoba: david-arachamija, vztah: neutralni, kontext: 'Citován jako doklad, že Rusko chtělo mír už v Istanbulu 2022'}
  vazby:
  - {na: rajchl-2026-11-22-02, typ: posun}
  - {na: rajchl-2026-11-15-03, typ: opakovani}
- id: rajchl-2026-11-22-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - valka-ukrajina-prubeh
  nadpis: Dron v Polsku je další provokace proti míru — jako Převodov 2022 (Rajchl, 22. 11. 2026)
  text: |
    Vždy, když se svět blíží k míru, „něco dopadne do Polska“. Připomíná rakety v Převodově, kdy prezident
    Duda mluvil o ruských raketách a chtěl aktivovat čl. 5 NATO, než Biden řekl, že byly ukrajinské;
    Rajchl je přesvědčen, že tomu tak je i tentokrát, protože si nedovede představit, že by dron
    přeletěl celou Ukrajinu. Jde podle něj o snahu „evropských válečných štváčů“ zabránit míru, k němuž
    se blíží USA, Čína a Rusko. Proto ČR podle něj správně neposílá vojáky na cvičení v Polsku.
  citace:
  - text: Vždycky, když se svět blíží k míru, když to vypadá, že už ta mírová dohoda je na spadnutí, tak něco dopadne do Polska.
    cas: "17:06"
  osoby:
  - {osoba: donald-tusk, vztah: negativni, kontext: 'Jeho tvrzení o cíleném ruském útoku zpochybňuje'}
  - {osoba: andrzej-duda, vztah: negativni, kontext: 'V případě Převodova mylně obvinil Rusko'}
  - {osoba: joe-biden, vztah: neutralni, kontext: 'Potvrdil, že rakety v Převodově byly ukrajinské'}
- id: rajchl-2026-11-22-10
  typ: postoj
  temata:
  - valka-ukrajina-prubeh
  - suverenita-eu
  nadpis: Ukrajinu zradili evropští lídři, ne Trump; „přestaňte posílat peníze na Ukrajinu“ jako program (Rajchl, 22. 11. 2026)
  text: |
    Odmítá, že by Trump zradil Ukrajinu — zradili ji evropští lídři, kteří ji zbraněmi a penězi „nahnali
    do neštěstí“. Trump podle něj teď říká totéž co on od února 2022 (za což dostával nálepky „ruského
    kolaboranta“): dodávky zbraní jen prodlužují „nevyhnutelné“. Trumpovu větu „přestaňte posílat peníze
    na Ukrajinu, začněte je utrácet doma“ prohlašuje za svůj politický program. Ručení za 60 miliard
    (návrh Merze) by pro něj znamenalo konec setrvání v jakékoli vládní koalici.
  citace:
  - text: Přestaňte posílat peníze na Ukrajinu, začněte je utrácet u nás doma. Tohle je, dámy a pánové, můj politický program.
    cas: "19:38"
  - text: Nikdy nezvednu ruku pro to, aby naše děti spláceli 60 miliard korun za to, že Zelenský ukradne. Nikdy.
    cas: "20:24"
  osoby:
  - {osoba: donald-trump, vztah: pozitivni, kontext: 'Podle Rajchla teď říká to, co on od začátku války'}
  - {osoba: friedrich-merz, vztah: negativni, kontext: '„Vydírání“ kvůli ručení 60 mld. za Ukrajinu'}
  - {osoba: volodymyr-zelenskyj, vztah: negativni, kontext: 'Peníze by „ukradl“'}
  vazby:
  - {na: rajchl-2026-11-15-06, typ: posun}
- id: rajchl-2026-11-22-11
  typ: postoj
  temata:
  - suverenita-eu
  - nato-zbrojeni-militarizace
  nadpis: Návrh rozpočtu EU je proválečný, genderový a green-dealový — Babiš ho správně odmítl (Rajchl, 22. 11. 2026)
  text: |
    Vyzývá odmítnout „vydírání Friedricha Merze a EU“ i návrh rozpočtu EU, který podle něj bere peníze
    zemědělcům a na rozvoj kontinentu a je zaměřen „proválečně, progenderově, progreendealově“; uvrhne
    Evropu do ještě většího chaosu. Oceňuje, že Babiš rozpočet označil za nepřijatelný.
  osoby:
  - {osoba: andrej-babis, vztah: pozitivni, kontext: 'Správně odmítl návrh rozpočtu EU'}
  - {osoba: friedrich-merz, vztah: negativni, kontext: '„Vydírání“'}
- id: rajchl-2026-11-22-12
  typ: postoj
  temata:
  - suverenita-eu
  - migrace
  nadpis: Šen-čen jako „Jalta 2.0“ bez Evropy — Evropa je „slon na hliněných nohou“ (Rajchl, 22. 11. 2026)
  text: |
    Na summitu v Šen-čenu seděly USA, Rusko a Čína, Evropa ne — podle Rajchla to není náhoda, ale odraz
    ztráty ekonomické síly a respektu, za kterou si Evropa může sama „nesmyslnou zelenou politikou“.
    „Dělá ramena“ na jadernou velmoc Rusko, a přitom nezvládá migranty „rabující ve Francii“. Aby znovu
    seděla u stolu velmocí, musí odmítnout Green Deal, masovou migraci, provést remigraci, odmítnout
    „genderismus“ a směřovat rozpočet k porodnosti, „ne k zabíjení lidí na Ukrajině“.
  citace:
  - text: Děláme ramena na jadernou velmoc, ale parta afrických chirurgů v Paříži je pro nás absolutně neskrotitelná. Vidíte, jak je Evropa jenom slon na hliněných nohou?
    cas: "22:35"
- id: rajchl-2026-11-22-13
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  - suverenita-eu
  nadpis: EU chystá do aut povinný měřič emisí, který auto zastaví, a hlídání rychlosti — „otroctví“ (Rajchl, 22. 11. 2026)
  text: |
    Tvrdí, že EU chce zavést povinné zařízení v autech, které bude měřit emise a při jejich překročení
    po naměření „2400 km“ auto zastaví, a také povinné měření (a zřejmě omezování) rychlosti. Označuje
    to za „otroctví na každém kroku“, které odmítá.
  citace:
  - text: Stroj vám zastaví auto, protože budete mít příliš vysoké emise. … Otroctví na každém jednom kroku.
    cas: "23:13"
- id: rajchl-2026-11-22-14
  typ: postoj
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Smysl má jen protivzdušná obrana, tanky a F-35 jsou „vyhazování peněz“ — raději sestrám a seniorům (Rajchl, 22. 11. 2026)
  text: |
    Peníze chce raději investovat do podpory mladých rodin, důstojného stáří seniorů a lepších platů
    zdravotních sester a pečovatelek než do raket a tanků. Smysl podle něj má jen protivzdušná,
    protiraketová a antibalistická obrana; nákup tanků, BVP a F-35 je „totální vyhazování peněz“.
  citace:
  - text: Kupovat v tuhletu chvíli tanky, BVPčka, F-35, to je totální vyhazování peněz. Pojďme dát raději peníze opravdu do lidí.
    cas: "25:50"
- id: rajchl-2026-11-22-15
  typ: postoj
  temata:
  - politicky-system
  - fara-neziskovky
  - migrace
  nadpis: Politici na zásadní reformy tu jsou, chybí odvaha voličů — FARA, konec dotací, zrušení Evropské komise, remigrace (Rajchl, 22. 11. 2026)
  text: |
    Nesouhlasí s ekonomkou Švihlíkovou (jíž si váží), že v ČR nejsou politici schopní systémových změn:
    on sám je připraven „zásadním způsobem překopat ekonomiku“, odmítnout dotační ekonomiku a centrální
    plánování. Chybí podle něj odvaha voličů dát takovým politikům šanci. Spory o koncesionářské
    poplatky, „Turkovy jogurty, Macinkovy SMSky a Babišův střet zájmů“ jsou podružné; klíčové je zavést
    zákon FARA, zrušit Evropskou komisi, odejít od Green Dealu a provést remigraci.
  citace:
  - text: Klíčové je zavést zákon FARA, odmítnout dotační ekonomiku, zrušit Evropskou komisi, odejít od Green Dealu, provést remigraci a vrátit Evropu na její pevné nohy.
    cas: "29:54"
  osoby:
  - {osoba: ilona-svihlikova, vztah: rozporuplny, kontext: 'Váží si jí, ale nesouhlasí, že chybí politici pro zásadní reformy'}
- id: rajchl-2026-11-22-16
