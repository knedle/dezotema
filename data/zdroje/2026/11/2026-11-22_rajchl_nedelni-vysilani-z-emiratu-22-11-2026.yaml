  nadpis: Letná — „smrt oligarchii“ a pak oligarchové jako sponzoři; chvilkaři jsou „hlupáci“ (Rajchl, 22. 11. 2026)
  text: |
    Vysmívá se tomu, že na Letné jeden z vystupujících volal „smrt oligarchii“ a o pár minut později
    Minář představoval sponzory, kteří jsou podle Rajchla oligarchové. Zesměšňuje i požadavek odvolání
    ministra obrany Zůny na akci, která měla být podle pořadatelů o koncesionářských poplatcích, ne
    protivládní. Organizátory označuje za „hlupáky, kteří jen slouží svým chlebodárcům“.
  citace:
  - text: Oni jsou skutečně směšní, jsou to hlupáci, kteří jenom slouží svým chlebodárcům, nic víc, nic míň.
    cas: "10:23"
  osoby:
  - {osoba: mikulas-minar, vztah: negativni, kontext: 'Volá proti oligarchii a představuje sponzory-oligarchy'}
  - {osoba: jaromir-zuna, vztah: pozitivni, kontext: 'Hájí ho proti požadavku na odvolání'}
  vazby:
