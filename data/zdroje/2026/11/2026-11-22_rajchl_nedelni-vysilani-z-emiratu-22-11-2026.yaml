- id: rajchl-2026-11-22-17
  typ: tvrzeni
  temata:
  - blizky-vychod
  - media-propaganda
  nadpis: V Hormuzském průlivu je klid, napětí média „vyhánějí“ kvůli ziskům mocných (Rajchl, 22. 11. 2026)
  text: |
    Z dovolené v Emirátech hlásí, že u Hormuzského průlivu (Fudžajra) je „absolutní klid“ a že se s nohama
    v průlivu fotil bez problémů. Situaci podle něj média jako vždy eskalují, „aby to hýbalo s trhy“ a
    „správní a mocní“ na tom vydělali obrovské peníze.
  citace:
  - text: Je to celé trošku médii vyhnané a eskalované do výšin takových, aby to hýbalo s trhy, aby samozřejmě zase ti správní a mocní na tom vydělávali obrovské peníze.
    cas: "00:31"
