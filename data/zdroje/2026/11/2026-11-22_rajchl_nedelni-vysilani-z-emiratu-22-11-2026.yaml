  nadpis: Minář nezná Ústavu, nebo lže; Rajchl přijde do Švandova divadla a „zválcuje je“ (Rajchl, 22. 11. 2026)
  text: |
    Opakuje ranní kritiku Mináře (Babiš je po nevydání nestíhatelný, Minář tedy buď nezná Ústavu, nebo je
    „absolutní lhář“, a „chvilkaři“ jsou s ním „pro smích“). Nově reaguje na chystanou debatu 2. prosince
    ve Švandově divadle, kam jsou zváni Babiš a ministři: sám ministrem není, ale přijde a protistranu
    „argumentačně totálním způsobem zválcuje“, protože ona má jen „ideologii a floskule“. Minář je podle
    něj „zbabělec“, který se debatě s ním opakovaně „vylhal“.
  citace:
  - text: Já tam klidně přijdu. A garantuju vám, že je tam prostě argumentačně totálním způsobem zválcuju.
    cas: "12:02"
  osoby:
