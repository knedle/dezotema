  nadpis: Vylučování ruských sportovců z OH a MS v hokeji je „malé a nízké“ (Rajchl, 22. 11. 2026)
  text: Opakuje, že postoj ČR proti účasti ruských sportovců na olympijských hrách či MS v hokeji je „malý a nízký“; ČR má být naopak „tahounem diplomacie“.
