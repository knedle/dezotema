  nadpis: Od Lisabonu jde Evropa „zu grunt“ — návrat ke spolupráci suverénních národů (Rajchl, 22. 11. 2026)
  text: |
    Od přijetí Lisabonské smlouvy v roce 2009 a centralizace moci v Bruselu se podle Rajchla Evropě daří
    čím dál hůř: „technokraté“ vymýšlejí Green Deal, masovou migraci, LGBTQ, proválečné akce a povinné
    očkování, a Evropa tak ztrácí konkurenceschopnost vůči Americe a Asii. Varuje před „naivním
    probruselstvím“ — von der Leyenová, Kallasová, Merz ani Macron podle něj nejednají v zájmu ČR a budou
    nás vždy považovat za levnou pracovní sílu. Jedinou cestou je spolupráce suverénních národů.
  citace:
  - text: Nenechat se ovládat těmi bruselskými soudruhy, kteří už tady neplánují na pětiletky, ale na dvacetiletky dopředu.
    cas: "08:11"
  osoby:
