  poznamka: 'Nedělní živé vysílání z dovolené v Ras al-Chajmě (SAE). Zpracováno všech 15 témat (výběr uživatele
    „vše“). Témata Minář/nestíhatelnost Babiše a veřejnoprávní moderátoři navazují na ranní spot téhož dne
    (opakování). Stochastický teror: 2 hraniční případy („zloději z Kyjeva“ kolem Zelenského; „parta
    afrických chirurgů v Paříži“). Označení chvilkařů a moderátorů za „hlupáky“ / „ovce“ hodnoceno jako
    urážka bez dehumanizace či výzvy k trestu — nezapsáno jako teror. Ověřeno v přepisu.'
