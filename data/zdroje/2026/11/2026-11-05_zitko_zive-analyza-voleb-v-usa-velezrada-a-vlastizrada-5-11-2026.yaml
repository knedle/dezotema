  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**5. 11.** — Zítko Holýšov označuje za „tečku za případem Čermák“: to, že se „dvojník schoval
    za máminou sukní“, je podle něj „mega důkaz“, že nejde o Čermáka (přirovnává to ke zkoušce střevíčku
    v Popelce); nahrávku matky zveřejněnou Turkem přímo nekomentuje. Uvádí, že na něj někdo podal trestní
    oznámení za stalking, a je rád, že nikdo nešel ke dveřím, protože „na to se asi čekalo“ a policie
    by je zatkla. Nově celou kauzu rámuje jako operaci policie a tajných služeb, které měly „nastrčit“
    nového „hrdinu“ pro jednání vítězných mocností o obnově ČSR a „zlikvidovat“ Zítka; k „útočné sestavě“
    nově řadí i Černohorského a Bernardy s ním nazývá „bandou kryplů“.'
  citace:
  - text: Tady je snaha ze strany policejních složek, tajných služeb ovlivnit hru o Československo.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
