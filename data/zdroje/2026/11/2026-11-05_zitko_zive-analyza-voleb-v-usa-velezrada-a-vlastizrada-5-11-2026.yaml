  nadpis: „Vítězné mocnosti" Trump, Putin, bin Salmán a Módí rozhodnou o obnově Československa; volby
    20 let falšovány (Zítko, 24. 9. 2026)
  text: '**5. 11.** — Zítko chce referendum Rusínů na Zakarpatí o připojení k ČSR „ve tvaru hranic roku
    1933“; z roku 2020 si připomíná výrok „dávám bolševikovi rok, maximálně dva“ s tím, že „už jsme ve
    finální fázi“.'
- id: zitko-2026-11-05-03
  typ: tvrzeni
