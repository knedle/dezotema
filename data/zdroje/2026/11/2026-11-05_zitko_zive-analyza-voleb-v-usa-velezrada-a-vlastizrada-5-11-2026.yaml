  nadpis: „Vítězné mocnosti" Trump, Putin, bin Salmán a Módí rozhodnou o obnově Československa; volby
    20 let falšovány (Zítko, 24. 9. 2026)
  text: '**5. 11.** — Zítko chce referendum Rusínů na Zakarpatí o připojení k ČSR „ve tvaru hranic roku
    1933“; z roku 2020 si připomíná výrok „dávám bolševikovi rok, maximálně dva“ s tím, že „už jsme ve
    finální fázi“.'
- id: zitko-2026-11-05-03
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: 'Výsledek amerických voleb 3. 11., v nichž vyhráli demokraté, Zítko vykládá jako záměrnou past:
    aliance podle něj nechala Deep State volby zfalšovat „pod drobnohledem“, aby ho mohla odhalit, a teď
    začne fáze stíhání za „velezradu a vlastizradu“ s „velmi tvrdými tresty“ v „45denním okně“ podle Executive
    Order 13848; Trump prý o podvodech mlčí, protože jedná ministerstvo spravedlnosti. Demokratům a „Deep
    State“ přeje „jednosměrnou letenku“ na „Gitmo Express“, který je „už brzy všechny naloží“. Z předčítaného
    seznamu 17 bodů přebírá 700 000 zapečetěných obžalob, NESARA/GESARA a smazání dluhů „každým dnem“,
    med-beds a tvrzení, že všechny země před Trumpem kapitulovaly v roce 2017; Clintonovi, Obama, Bush,
    Cheney a Rumsfeld jsou podle něj už popraveni na Guantánamu, J. D. Vance prý hraje Paul Walker, 11.
    září byla „hologramy letadel“ a na Super Bowlu 2027 se objeví „mrtvé“ celebrity z programu ochrany
    svědků, „možná Elvis“. Volby by podle něj měly probíhat na blockchainu.'
  citace:
  - text: Vánoce letos přicházejí brzy.
