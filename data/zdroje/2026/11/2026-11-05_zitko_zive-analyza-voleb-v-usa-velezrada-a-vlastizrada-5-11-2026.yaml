  text: V „45denním okně“ podle Executive Order 13848 budou demokraté odhaleni a odsouzeni za „velezradu
    a vlastizradu“ a „Gitmo Express“ je „brzy naloží“; „Vánoce letos přicházejí brzy“. NESARA/GESARA se
    smazáním dluhů bude oznámena „každým dnem“ a na Super Bowlu 14. 2. 2027 se objeví „mrtvé“ celebrity
    z programu ochrany svědků.
