  poznamka: 'Krátký spot reagující na Minářův rozhovor pro ČRo. Zpracována všechna 3 témata. Stochastický
    teror nezjištěn (Minář pojmenován jako „defraudant“, „mamlas“, „blbec“ — urážky bez dehumanizace
    či výzvy k trestu; v popisu příspěvku „ovečky z Letné“).'
vyroky:
- id: rajchl-2026-11-22-01
  typ: tvrzeni
  temata: [politicky-system]
  nadpis: Babiš je po nevydání nestíhatelný do konce volebního období — Minářovo tvrzení o Čapím hnízdu je „blbost“ (Rajchl, 22. 11. 2026)
  text: |
    Minář v rozhovoru pro Český rozhlas řekl, že Babiš je „nejslabším premiérem“, protože ho drží v šachu
    Okamura a Macinka, které potřebuje kvůli ochraně před pokračováním kauzy Čapí hnízdo. Rajchl to odmítá:
    podle čl. 27 odst. 4 Ústavy je po nevydání Sněmovnou trestní stíhání vyloučeno až do konce volebního
    období a „nelze hlasovat podruhé“, takže Babiš by byl nestíhatelný i při pádu vlády. Mináře označuje
    za „vrchního defraudanta“ a „mamlasa“, který by si měl Ústavu přečíst, „než ji roztrhal“.
  citace:
  - text: Takže Mikuláš Minář by si možná mohl tu ústavu předtím, než ji roztrhal, přečíst, aby ze sebe nedělal úplného blbce.
    cas: "01:41"
  osoby:
  - {osoba: mikulas-minar, vztah: negativni, kontext: '„Vrchní defraudant“ a „mamlas“, který nezná Ústavu'}
  - {osoba: babis, vztah: pozitivni, kontext: 'Hájí ho proti tvrzení o závislosti na koaličních partnerech'}
  - {osoba: okamura, vztah: neutralni, kontext: 'Zmíněn v Minářově tvrzení'}
  - {osoba: petr-macinka, vztah: neutralni, kontext: 'Zmíněn v Minářově tvrzení'}
