  nadpis: Nevyváženost veřejnoprávních médií — ČT skáče do řeči Davidovi, ČRo se Mináři „servilně usmívá“ (Rajchl, 22. 11. 2026)
  text: |
    Rajchl srovnává „mladou snaživou redaktorku“ ČT, která Ivanu Davidovi skákala do řeči a „korigovala“ ho,
