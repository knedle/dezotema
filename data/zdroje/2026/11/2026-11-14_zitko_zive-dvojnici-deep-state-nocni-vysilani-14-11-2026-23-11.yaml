  poznamka: '1 h 33 min, „14/11 Dvojníci Deep State noční 11:11“. Vlastní komentář tvoří asi 50–55 %,
    zbytek jsou videa dvojníků, sestřihy covidových výroků politiků, video Romana Kovaříka a předčítaný
    údajný „Trumpův projev“ (text Q / Jiřího Křížka). Zpracováno 10 témat, predikce jako doplnění k 13.
    11. Stochastický teror: Válek („zmrdeček… před vojenským tribunálem“, ověřeno v přepisu jako Zítkův
    komentář). Hraniční „zrůda“ (Vojtěch, Vašáková) a urážky Obamových nezapsány. Zpracováno podle shrnutí
    pomocného agenta.'
