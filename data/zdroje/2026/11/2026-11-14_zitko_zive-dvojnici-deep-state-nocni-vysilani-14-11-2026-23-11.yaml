  nadpis: Vakcíny „jen pro Babišovu vládu“, Rothschildův patent na covid a placebo pro politiky (Zítko,
    27. 10. 2026)
  text: '**14. 11. (23:11)** — Konec covidu podle Zítka bude, „až budou všichni pachatelé masových vražd
    stát před vojenským tribunálem“. Nad sestřihem výroků politiků jmenuje Babiše, Blatného, Prymulu,
    Vojtěcha, Kubka, Schillerovou a Válka. Vojtěcha a Kateřinu Vašákovou nazývá „zrůdami“ a o Válkovi
    říká, že „by měl skončit před vojenským tribunálem“. Viry podle něj nebyly izolovány a jsou to exosomy,
    „virologie je podvod“ a šlo o „epidemii očkovaných“. Herečku Danielu Kolářovou kritizuje za veřejné
    očkování a výroky o neočkovaných. Sám byl podle svých slov „110 dnů protiprávně vězněn“, dohodu o
    vině a trestu by neuzavřel a podepisování Anticharty bylo „existenční nutností“. Video Romana Kovaříka
    s daty ÚZIS o porodnosti (pokles ze 112 tisíc na 77 tisíc narozených) považuje za „jednoznačný materiál,
    který obviní z genocidy vládu Andreje Babiše a ze sterilizace vládu Petra Fialy“ a použil ho prý v
    žalobách o odškodnění. Kritizuje, že ČR na rozdíl od Trumpa po 11 měsících stále nevystoupila z WHO.
    Reinera Fuellmicha označuje za „bijce covidové mafie číslo jedna“ a uvádí, že byl přesunut do jiné
    věznice. Výrok o Válkovi viz [Stochastický teror](/stochasticky-teror.md).'
  citace:
