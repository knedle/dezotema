  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**14. 11. (11:11)** — Zastavení letů v USA nařízené úřadem FAA a výpadky Amtraku v pátek 13.
    11. vykládá Zítko jako signál Q a „zelenou“ k závěrečné fázi: „pokud chcete někoho pochytat, musíte
    mu zamezit možnost zdrhnout“. Vojenské lety na Guantánamo a Diego Garcia podle něj mizí z radarů,
    protože „palubní lístek je jednosměrný“, a „krysy tentokrát neopouští loď, ale v panice prchají z
    letišť“. Výpadky Microsoftu, bank (UniCredit, Raiffeisen, J&T) a hrozby bombami řadí do jednoho řetězu.
    Situace je podle něj výjimečná „potřetí za 25 let“ po 11. září 2001, kdy „dva hologramy letadel zbořily
    tři budovy“. Předčítá a komentuje text, podle něhož Hegseth a Miller vstupují do „další fáze“ a „určité
    zákony byly předem zrušeny, aby poskytly prostor armádě“. EBS je podle něj „na standby“, MED-BEDS
    jsou rozmístěny a 650 vojenských letadel odvezlo zlato z Vatikánu. Od 1. 12. půjde vše přes „QFone“,
    „aktiva musí být krytá zlatem, jinak šlus“ a bankovní problémy se budou „rozšiřovat jako domino“.
    Solární záblesk podle něj lidi „posune“, ale ne všechny: „bude váženo a měřeno, na jakých frekvencích
    a vibracích tikáte“, a to rozhodne i o přístupu ke kvantovému účtu. CIA podle něj „nebyla zpravodajskou
    agenturou“, „kočírovala celosvětový obchod s drogami“, Facebook byl jejím projektem a má se vrátit
    OSS. RFK Jr. podle něj zatýká zástupce farmaceutických firem a „řada z nich je už dokonce popravena“.
    Biden byl podle něj „maskot“ a dvojníky jsou i Harris, Macron a Obama. Varuje, že EBS test 17. 11.
    se „možná přetočí na ostré vysílání“ tří osmihodinových smyček a že zbývá „35 dnů“ na napadení volebního
    podvodu.'
