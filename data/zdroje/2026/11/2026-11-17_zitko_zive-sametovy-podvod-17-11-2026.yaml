  nadpis: Sametová revoluce jako řízený rozpad StB a KGB
  text: '**17. 11.** — Ve speciálu „Sametový podvod“ k 37. výročí Zítko opakuje, že šlo o „operaci StB,
    KGB a dalších tajných služeb… pod taktovkou iluminátů, židozednářů a globalistů“, jejímž cílem bylo
    rozbít a vykrást Československo a „zlikvidovat paměť lidí“. Studenti podle něj dostali ve škole volno,
    „aby cinkání klíčů mělo takovou tu sílu lidí“. Promítá rozhovor s Ludvíkem Zifčákem z roku 2019 a
    nově jmenuje jako „velitele“ operace důstojníka StB Aloise Lorenze. Fámu o „mrtvém studentu Šmídovi“
    podle něj záměrně roztroubila agentka Drahomíra Dražská přes Petra Uhla do zahraničních médií. Komunisté
    nebyli potrestáni, protože to byla „domluva“ (příklad Vasila Mohority). Stejný „trik se zabitými demonstranty“
    se podle něj opakoval na Majdanu 2014. Havla nazývá „zednářem 33. stupně“, který „třikrát křivě přísahal“.
    Slíbený rozbor klipu Evy Farné a Miraie Navrátila „Vzpomeneš si“ provádí po sekvencích: Mirai a Farná
    podle něj hrají „agenta Šmída“ a „agentku Šmídovou“, moderátor Honza Dědek „padoucha, zástupce entity
    reptiliánů v médiích“, šachovnicová podlaha je „židozednářská“ a „slamák“ je „strawman“, právní fikce
    z „admirality law“. Výzvu „chceme domů do Československa“ chápe jako výzvu k obnově ČSR a „Q“ se „17“
    jako důkaz, že „operace Q17“ funguje. Při EBS se podle něj lidé dozvědí pravdu a „dostanou koňskou
    dávku vakcíny pravdy“. V odbočce opakuje, že „země je rovina topografická… žádný zakřivení tam není“,
    a že WTC 7 spadl „řízenou demolicí“ po nárazu „dvou hologramů“. „Asi to brzo bouchne s tím agentem
    Šmídem, dojde k velkému odhalení.“'
  citace:
  - text: A proč tam ty študenti byli? No, protože jim ve škole dali volno, jo, aby cinkání klíčů mělo
