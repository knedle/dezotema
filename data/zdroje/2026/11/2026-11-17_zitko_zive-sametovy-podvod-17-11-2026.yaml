  nadpis: „Czexit" je iluze, jedinou cestou je obnova ČSR; vítězné mocnosti budou chtít „chcimíry" (Zítko,
    3. 10. 2026)
  text: '**17. 11.** — Schůzka v Šen-čenu „18., 19.“ podle Zítka „zrovna vychází na Remember 5. november“
    podle juliánského kalendáře. Vítězné mocnosti mají ukončit konflikt na Ukrajině a „chcimíři v rámci
    Československé republiky budou velkým favoritem“, zatímco ti, kdo „dodávali zbraně proti Rusku“, se
    „neschovají před vojenskou jurisdikcí“. Volby v ČR podle něj už 20 let ovlivňují Smartmatic a Dominion,
    „jakékoliv volby včetně prezidentských jsou organizovaný podvod“ a řešením je blockchain. Jako doklad
    líčí svůj neúspěšný pokus z roku 2021 (Wolfová, „Langáškova finta“ s lhůtou, „přehozená čísla 51 a
    15“).'
  osoby:
  - osoba: jana-wolfova
    vztah: negativni
    kontext: Selhala při jeho pokusu o volební protest 2021
