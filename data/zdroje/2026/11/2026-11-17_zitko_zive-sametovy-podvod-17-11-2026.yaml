  nadpis: Privatizace jako řízená likvidace čs. průmyslu Západem — Solivary Prešov (Zítko, 8. 6. 2026)
  text: '**17. 11.** — Ve speciálu ke 17. listopadu Zítko asi hodinu předčítá článek Eduarda Kuly o vykrádání
    bank v 90. letech: IPB a KB, prodej zlata ČNB za Tošovského, role Livie Klausové, politici ODS, ČSSD
    a ODA v dozorčích radách, Alon Barak („krytí Mossadu“), škody IPB 160–400 mld. Kč a stát ručící ČSOB.
    Od sebe dodává, že z „korporace Česká republika“ se ročně „vytuneluje jeden bilion korun“, že kupónovou
    privatizaci provedly „předem připravené kádry z Prognostického ústavu“ („tyhle ty zmrdi“) a že Rajchl
    se „vyučil“ u Chvalovského. Obnově právní kontinuity podle něj bránil Pavel Rychetský („žába na prameni“)
    a „Langáškova finta“. Nejúčinnější metodou je podle něj obnova ČSR, „kde jsme okamžitě mimo EU a mimo
    NATO“, a reparace „29 bilionů“ by z ní udělaly „světovou velmoc“.'
  citace:
  - text: Každý rok je… z korporace Česká republika vyvedeno, vytunelováno, vykradeno jeden bilion korun.
