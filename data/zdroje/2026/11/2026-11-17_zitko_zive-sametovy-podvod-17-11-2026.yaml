  poznamka: '2 h 36 min, „17/11 Sametový podvod 11:11“. Vlastní řeč Zítka tvoří asi 40 %. Zbytek je cizí
    obsah: rozhovor se Zifčákem (Prima 2019), Ivan Mládek, klip Mirai a Farná, dobové záběry a asi 57
    minut čteného článku Eduarda Kuly o vykrádání bank. Zpracováno 9 témat, většinou jako doplnění. Predikce:
    doplněno k EBS 17. 11. a k „V jako vendeta“ (juliánský 18. 11.). Stochastický teror nezjištěn (hraniční:
    „západní Němci… jsou to všechno svině“, „velezrádci po zásluze potrestáni“ bez konkrétního terče).
    Zpracováno podle shrnutí pomocného agenta, klíčové citace ověřeny v přepisu.'
