  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**17. 11.** — Ve speciálu ke 17. listopadu Zítko spojuje „Deep State“ s rokem 1989 (viz [konspirace-ceskoslovensko.md](konspirace-ceskoslovensko.md)).
    JFK byl podle něj „startérem boje proti Deep Stateu“ kvůli Fedu a krytí měny zlatem a Melania Trump
    je potomkem Romanovců a „dědičkou Ruského impéria a Velké Tartárie“. Podvody ve volbách 2020 i „2026“
    budou podle něj „objasněny a po zásluze budou tyto velezrádci a vlastizrádci potrestáni“. Kdo o covidu
    mluví jako o „zabíjení lidí biologickými zbraněmi v injekcích“, může být podle něj „bezdůvodně uvězněn“
    (míní sebe). Po soudu 24. září je podle něj proti němu nasazeno „all in, všechno ke zničení Zítka“.
    Odpoledne se má konat test EBS: „věřte, že jsme ve finále a že se možná budou dít velký věci už dneska“.'
