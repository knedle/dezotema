vyroky:
- id: vrabel-2026-11-17-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Druhé kolo války USA s Íránem bude „tvrdší“; Írán zvažuje útoky na Trumpovy lidi (Vrabel, 17.
    11. 2026)
  text: Ke zprávě CNN, že Írán zvažuje útoky na představitele Trumpovy administrativy včetně „špinavé
    bomby“, Vrabel poznamenává, že USA mají „vypnutou zlatou kopuli“ a jsou arogantní i vůči vlastním
    obyvatelům. Podle „různých zdrojů z Pentagonu“ by „někde mezi 19. až 20.“ mohl nastat zlom a otevřít
    se druhé kolo války. Jaderné zbraně nečeká a doufá, že je schůzka Trump–Putin–Si „nechá ještě chvilku
    spát“. Je si ale „skoro až jistý“, že válka bude pokračovat a ze strany USA bude tvrdší. Írán je podle
    něj „velmi nazbrojený“.
  citace:
  - text: Jsem docela si skoro až jistý, bych řekl, že ta válka bude pokračovat druhým kolem, že to druhé
      kolo bude trošku tvrdší ze strany Spojených států.
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: „90 % toho, co řekne, se nestane“; tvrdší druhé kolo války s Íránem
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-11-17-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Odvod 90 % příjmů výrobců nad cenovým stropem je „drbání se pravou rukou za levým uchem“ — řešením
    je vystoupit z EU a na několik let dát rodinám elektřinu zdarma (Vrabel, 10. 11. 2026)
  text: '**17. 11.** — Ke zprávě, že Evropa vstupuje do zimy se zásobníky plynu naplněnými na 70 % (o
    14 bodů méně než loni) a vláda zvažuje zastropování cen, Vrabel číslu nevěří („ještě nedávno 55“)
    a upozorňuje, že zásobník nelze vyčerpat do dna. Důchodci podle něj umírají podchlazením v Rakousku
    „i v Čechách, akorát o tom nikdo nemluví“. Je podle něj „kriminální“ přivést republiku do stavu, kdy
    lidé doma mrznou, a zároveň se zadlužovat na zbraně a Ukrajinu. Vlády Fialy i Babiše mají nejdřív
    postarat o lidi: pokud víc než 3 % lidí nemůže zatopit, stát to musí řešit.'
  citace:
  - text: A jestli to neřeší, tak nedělá svoji práci.
  podtema: Elektřina — marže a ceny
- id: vrabel-2026-11-17-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Insolvenční správce, soud bez důkazů, Rakušan: bezpečnostní ohrožení státu (Vrabel, 24. 5.
    2026)'
  text: '**17. 11.** — Vrabel vyhlašuje sbírku spolku „Rodina — Česká republika na prvním místě“ na odkup
    pohledávky za Bojanou, která vzrostla na 2,5 mil. Kč a je ve veřejném prodeji do 23. 12. Opakuje,
    že Bojana jen poskytla účet pro peníze na demonstrace v roce 2022, soud jí přisoudil 1,3 mil. Kč a
    úroky bez připuštění důkazů a insolvenční správce podle něj dvakrát započítal 450 tisíc a „přidal
    nulu“. Trestní oznámení na správce policista podle něj „zlehčil“ varováním před křivým obviněním.
    Celou věc nazývá „organizovaným zločinem“ policie, soudu, insolvenčního správce, ministra Rakušana
    a ředitele BIS Koudelky a „politickým procesem“, který pokračuje i za současné vlády. Nová Sněmovna
    se podle něj odmítla věcí zabývat a Libor Vondráček mu „přestal brát telefony“. Pohledávku považuje
    za nevymahatelnou, protože Bojana v ČR nemá majetek a srbské soudy by ji neuznaly.'
  citace:
  - text: Organizovaný zločin, kterýho se dopouští policie, soud a insolvenční správce, plus ministr vnitra
      Rakušan, který v tom asistoval.
  osoby:
  - osoba: vit-rakusan
    vztah: negativni
    kontext: Podle něj součást „organizovaného zločinu“ proti Bojaně
  - osoba: michal-koudelka
    vztah: negativni
    kontext: Podle něj součást „organizovaného zločinu“ proti Bojaně
  - osoba: libor-vondracek
    vztah: negativni
    kontext: Sněmovna se kauzou Bojany nezabývala, „přestal brát telefony“
  podtema: Kauza Bojana Vrabelová — politické zničení aktivisty přes rodinu
- id: vrabel-2026-11-17-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Studentské protesty za ČT jako revoluce „řízená CIA přes českou tajnou službu“ podle srbského
    scénáře; řečníka by trestně stíhal (Vrabel, 10. 11. 2026)
  text: '**17. 11.** — V den výročí Vrabel tvrdí, že 17. listopad nahradil dřívější svátky osvobození
    a 28. října a slaví se proto, že jsme po roce 1989 „prodali“ Škodovku a další firmy Němcům, Francouzům,
    Britům a Američanům. V roce 1989 podle něj „nevím, jestli tam je zase tak moc, co slavit“: každý třetí
    v čele průvodu byl z tajných služeb a student Šmíd byl agent StB. Svíčky si zaslouží jen studenti
    zabití Němci v roce 1939. Dnešní oslavu na Národní, kde svíčky zapalují „agenti“, nazývá s Krylem
    „trapnost na trapnost“. Ironicky vyjmenovává „zvláštní svobody“ po 37 letech: schvalovat válečné zločiny
    USA ve Venezuele a Íránu, „svobodu nacismu“ (Bandera party), blokování webů v rozporu s ústavou, ukrajinské
    vlajky, zákaz ruských sportovců, soudy „nezávislé na zákonech“ a zatýkání za písmeno Z.'
  citace:
  - text: Dneska, když se dívám na 17. listopadu, tak mám takový pocit, že lež vyhrála nad pravdou a nenávist
      vyhrála nad nějakým smířením s ostatníma spoluobčanama nebo nad nějakou láskou.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-17-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Výpadek letecké dopravy v USA, Microsoftu a propady trhů jako „první příznaky pádu Západu“ —
    „z historického hlediska následuje velká válka“ (Vrabel, 14. 11. 2026)
  text: '**17. 11.** — K výpadku utajené komunikační sítě NSA, o němž informovala CNN, Vrabel přiřazuje
    další události: výpadek Microsoftu ve 47 zemích, desítky amerických bank bez výdeje hotovosti, propad
    akcií CSG Michala Strnada o 70 % a odchod ředitele Nvidie. Připomíná, že od roku 2021 varuje, že americké
    úřady nemají na pojištění vkladů. Nabízí tři vysvětlení: teroristické útoky („nejspíš to budou Rusové“,
    ironicky), trénink umělé inteligence, nebo „z největší pravděpodobnosti“ uměle vyvolanou krizi jako
    v letech 2018–2020, která má vytvořit poptávku po digitální měně a dalších omezeních svobody.'
  citace:
  - text: Podle mýho názoru, z největší pravděpodobnosti, je to něco uměle vytvořené, aby se vytvořila
      poptávka po nějakých nových procesech, po nových procedurách, po centrální digitální měně.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-17-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: '„Brusel je Kyjev 2“: 99 % agendy EU je Ukrajina; nová půjčka 45 mld. eur ručená rozpočtem EU,
    Evropa vyloučená z jednání (Vrabel, 17. 11. 2026)'
  text: 'Witkoff a Kushner jedou jednat do Berlína a Rusko podle Vrabela pozve EU k jednání, „až bude
    čas“. EU přitom chystá 22. balíček sankcí a platí zbraně, například rakety Flamingo, kterými byl poškozen
    Krymský most. Komise navrhuje novou půjčku Ukrajině 45 mld. eur na rok 2027 ručenou rozpočtem EU.
    Vrabel čeká schválení kvalifikovanou většinou navzdory Ficovi a ručení je podle něj „úplně stejné
    jako před rokem v prosinci“: ČR, Slovensko a Maďarsko ručí, až by se EU rozpadla, „i když předpokládám,
    že se rozpadne“. EU, původně obchodní unie, podle něj řeší už jen Ukrajinu a mlčí k postupu USA vůči
    Íránu, Venezuele, Kubě a Grónsku.'
  citace:
  - text: 99 % veškerý aktivity Evropské unie spočívá v tom, že řeší Ukrajinu. To prostě, to je Kyjev
      2. Brusel je Kyjev 2 dneska.
  osoby:
  - osoba: robert-fico
    vztah: pozitivni
    kontext: Jediný, kdo chce blokovat půjčku 45 mld. eur
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-11-17-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Mise EUMAM přímo na Ukrajině jako „otevřené dveře“ pro vojáky EU; ruská nabídka bilaterálních
    smluv o neútočení je „dobrý nápad“, který by ČR měla podepsat (Vrabel, 11. 11. 2026)
  text: '**17. 11.** — Ke zprávě, že francouzští vojáci už několik měsíců působí na Ukrajině v tajné misi
    „Volia“ (výcvik a údržba techniky) bez vědomí parlamentu a že Moskva to označila za přímé zapojení
    do války, Vrabel říká, že Rusko a Francie jsou „prakticky ve válce“. Zpráva byla v médiích až sedmá
    nebo osmá v pořadí a nikdo se neptá na článek 5: „rychle dál, než nad tím lidi začnou přemýšlet“.
    Když Západ posílá zbraně, vojáky i zpravodajské informace, je podle něj ruská odpověď očekávatelná.'
  citace:
  - text: Nevím, jestli jste si toho všimli, jestli jste to slyšeli, zavnímali, že Rusko s Francií jsou
      prakticky ve válce.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-17-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Schůzka Trump–Putin–Si v Šen-čenu 19. 11.: dělení sfér vlivu, ne Ukrajina — USA Evropě v konfliktu
    „na pomoc nepůjdou“ (Vrabel, 14. 11. 2026)'
  text: '**17. 11.** — Američané podle Vrabela už pochopili, že válka „je prohraná“, a snaží se vytěžit,
    co se dá. Evropa je pro ně kolonie (s odkazem na Kissingera). Trumpova „skóre“ je podle něj takové,
    že „90 % z toho, co řekne, že se stane, se nestane“. Při příjezdu Putina do Šen-čenu chválí Čínu (Pás
    a stezka, kanály, železnice): proti ní jsou USA a Evropa „zapadákov sto let za opicema“.'
  citace:
  - text: Zatím mám takový pocit, že skóre jeho je 90 % z toho, co řekne, že se stane, se nestane.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-17-09
  typ: predikce
  temata:
  - blizky-vychod
  nadpis: druhé, „tvrdší“ kolo války USA s Íránem; půjčka 45 mld. eur projde kvalifikovanou většinou;
    první zkrachuje Francie
  text: Válka USA s Íránem bude podle Vrabela pokračovat druhým, tvrdším kolem, zlom má nastat „někde
    mezi 19. až 20.“ (bez jaderných zbraní). Nová půjčka Ukrajině 45 mld. eur na rok 2027 bude schválena
    kvalifikovanou většinou navzdory Ficovi. „První stát, který zkrachuje v Evropě, bude Francie.“
  citace:
  - text: Jsem docela si skoro až jistý, bych řekl, že ta válka bude pokračovat druhým kolem.
