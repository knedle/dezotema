  poznamka: '19 min, mimořádné vysílání před zprávami: zrušení pochodu za svobodu slova 17. 11.; bez stochastického
    teroru.'
  osoby:
  - osoba: katerina-blahnikova
    vztah: pozitivni
    kontext: Zatčena za trikoloru ve tvaru Z, její případ „čistě o svobodě slova“
  prehled:
  - tema: Odložení pochodu za svobodu slova 17. 11.
    text: podle majora Koláře bude policie zatýkat lidi s písmenem Z na transparentech; svoboda slova
      je podle něj v ČR zneužita k boji za poplatky ČT, a proto se akce odkládá „z bezpečnostních důvodů“.
  - tema: Vláda schválila návrh ústavního zákona o referendu
    text: vyloučení otázky EU a NATO je „pokus o diktaturu“, srovnání se sovětskými vojsky v roce 1968
    vyrok: vrabel-2026-11-09-05
  - tema: 'Trump: dohoda je blízko, brání jí nenávist Putina a Zelenského'
    text: „argument pro třetí třídu“, důvody války jsou „denacifikace“ a NATO; Finsko s jadernými Rafaly
      znemožňuje architekturu 1997, situace je „patová“
    vyrok: vrabel-2026-11-09-06
  - tema: Zelenskyj varuje před novou Jaltou
    text: velmoci si sféry vlivu rozdělí a dohodnou se, že nepůjdou do velké války; Trump trvalý mír nezajistí
      → viz [Predikce](../predikce.md)
    vyrok: vrabel-2026-11-09-06
  - tema: Aleksandar Vulin na seznamu Myrotvorec
    text: seznam je podle něj „rozsudek smrti“ a „dead list“ s AI rozpoznáváním obličejů; sám tam podle
      všeho není, protože v roce 2022 vezl ukrajinské ženy a děti z hranic.
  - tema: Ukrajinci přijdou o dočasnou ochranu, karty jen s potvrzením o odsloužení
    text: „fašistický přístup“ vlády, posílání na smrt, vznikne šedá zóna a mafie
    vyrok: vrabel-2026-11-09-02
  - tema: Británie musí víc zbrojit, Starmer chce zvrátit brexit
    text: generálové připravují lidi na umírání ve válce s Ruskem, „protiruské šílenství“ (opakuje).
  - tema: 'Ministři G7 v Paříži, Meloniová: Evropa může ztratit vliv'
    text: Evropa měla v letech 2021–2022 podpořit ruské požadavky; válka je konflikt USA s Ruskem a Evropa
      „užitečný idiot“
    vyrok: vrabel-2026-11-09-06
  - tema: Merz podmiňuje rozpočet EU 45 mld. eur pro Ukrajinu
    text: „Šmerc“ (německy bolest) drží EU „v šachu“; připomíná jeho minulost v BlackRocku, který má práva
      na obnovu Ukrajiny (opakuje).
  - tema: Maďarská prokuratura proti Orbánovu bratrovi
    text: Magyar („maďarský Rajchl“) jde tvrdě po Orbánovi; boj proti opozici se přiostřuje, sám se cítí
      „veřejným nepřítelem číslo jedna“ (opakuje).
  - tema: Dovolání Bradáčové v kauze plakátů SPD
    text: „měla by být souzená“, ve „slušné společnosti“ by „visela na nástěnce“ → viz [Stochastický teror](../stochasticky-teror.md)
    vyrok: vrabel-2026-11-09-01
  - tema: Abú Zabí bez Evropy (Peskov)
    text: zástupci EU a NATO budou „na chodbě“ jako psychická podpora Ukrajiny; z „pračkových čipů“ je
      Rusko, které rozhoduje (opakuje).
  - tema: Stávka francouzských odborů 17. 11.
    text: 'listopad bude „zajímavý“: 11. 11. protesty v Polsku (převrat?), u nás „zajímavé věci“ 15. a
      17. 11.'
  - tema: 22. balíček sankcí, Kallasová
    text: sankce zničily jen Evropu, lidé mrznou, Rusko roste; Kallasová „udělala spoustu zla“; Francie
      může příští rok spustit pád evropských ekonomik (opakuje, viz [predikce 7. 11.](../predikce.md)).
  - tema: Putinovo poselství SNS o rostoucím napětí
    text: bez komentáře.
  - tema: Russell Brand odsouzen k 10,5 roku
    text: „černý den“, znásilnění podle něj „úplně není“ znásilnění, porota ovlivněná filmem; vzorec likvidace
      kritiků (Assange, Fuellmich, on sám)
    vyrok: vrabel-2026-11-09-04
  - tema: Zrušení pochodu za svobodu slova 17. 11.
    text: 17. 11. se podle něj „bude dít něco vážného“, „liberálně progresivistický dav“ chystá „něco
      velmi zlého“; policie (major Kolář) by lidi se Z zatýkala; varování Tarabové, sen o Rajchlovi s
      želízky → viz [Predikce](../predikce.md)
    vyrok: vrabel-2026-11-09-04
  - tema: Soud Kateřiny Blahníkové a Tomáše Hrdličky (23. 11.)
    text: demonstraci za svobodu slova přesune na den soudu s Blahníkovou, jejíž případ je „čistě o svobodě
      slova“; u Hrdličky je to „spojené s Donbasem“.
vyroky:
- id: vrabel-2026-11-09-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Výměna vlády 17. 11. „nesmysl“ — globalisté potřebují rozdělenou společnost, ne novou vládu;
    strany jako „odnože ODS“ (Vrabel, 31. 10. 2026)
  text: '**9. 11.** — Vrabel ruší (podle svých slov poprvé) svůj pochod za svobodu slova 17. 11. Hlavním
    důvodem je, že se ten den „bude dít něco vážného, něco velkého“: demonstrace Mikuláše Mináře na Letné
    15. 11. na podporu ČT má podle něj sloužit k tomu, aby „to mohlo pokračovat 17. listopadu“, a „nahněvaný
    liberálně progresivistický dav“ se podle něj chystá „rozpoutat něco velmi zlého“. Boj za svobodu slova
    podle něj „ukradli“ ČT, umělci a školy (falešný boj za povinné poplatky). Nechce, aby jeho lidé s
    transparenty s písmenem Z byli „rozbuškou“: major Kolář mu podle jeho slov řekl, že policie bude lidi
    se Z ztotožňovat a předvolávat, případně zatýkat. Trestnost písmene Z podle něj „dal dohromady“ Jindřich
    Rajchl. Jako další důvod uvádí varování Lenky Tarabové, ať lidé na jeho akci nechodí; protože je Tarabová
    blízká Rajchlovi, předpokládá, že „se tam chystá něco, o čem nevíme“. Zmiňuje i „špatný pocit“ a sen
    z července 2022, v němž na něj Rajchl čekal s želízky.'
  citace:
  - text: 17. listopadu se něco bude dít a bude se dít něco vážného, bude se dít něco velkého.
