  nadpis: Výměna vlády 17. 11. „nesmysl“ — globalisté potřebují rozdělenou společnost, ne novou vládu;
    strany jako „odnože ODS“ (Vrabel, 31. 10. 2026)
  text: '**9. 11.** — Vrabel ruší (podle svých slov poprvé) svůj pochod za svobodu slova 17. 11. Hlavním
    důvodem je, že se ten den „bude dít něco vážného, něco velkého“: demonstrace Mikuláše Mináře na Letné
    15. 11. na podporu ČT má podle něj sloužit k tomu, aby „to mohlo pokračovat 17. listopadu“, a „nahněvaný
    liberálně progresivistický dav“ se podle něj chystá „rozpoutat něco velmi zlého“. Boj za svobodu slova
    podle něj „ukradli“ ČT, umělci a školy (falešný boj za povinné poplatky). Nechce, aby jeho lidé s
    transparenty s písmenem Z byli „rozbuškou“: major Kolář mu podle jeho slov řekl, že policie bude lidi
    se Z ztotožňovat a předvolávat, případně zatýkat. Trestnost písmene Z podle něj „dal dohromady“ Jindřich
    Rajchl. Jako další důvod uvádí varování Lenky Tarabové, ať lidé na jeho akci nechodí; protože je Tarabová
    blízká Rajchlovi, předpokládá, že „se tam chystá něco, o čem nevíme“. Zmiňuje i „špatný pocit“ a sen
    z července 2022, v němž na něj Rajchl čekal s želízky.'
  citace:
