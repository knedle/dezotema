  nadpis: Chystá opozice svržení Babišovy vlády? Korčovo „Hitler taky vyhrál volby“ (Tarabová, 19. 11.
    2026)
  text: 'Tarabová reaguje na komentář Petra Korče, primátora Frýdku-Místku a nově zvoleného senátora.
    Korč ve videu z Národní 17. 11. řekl, že byl i na Letné a že se „nemusíte bát, všechno dobře dopadne“
    ve Frýdku-Místku i v celé republice. Pod příspěvkem mu někdo připomněl „prohráli jste volby“ a Korč
    odpověděl: „Hitler taky vyhrál volby, ujal se vlády.“ Tarabová se ptá, co tím myslel a co strany kolem
    něj (KDU-ČSL, TOP 09, ODS, STAN) chystají na zvolenou Babišovu vládu, když všechny „jedou jak přes
    kopírák“ stejnou „mantru“: „Tanky? Válku?“ Jako doklad vkládá záběr účastnice akce na Národní, která
    říká, že se „připravují“ a že vláda „to do konce nedotáhne“. Souvisí s Vrabelovým výkladem [Letné
    jako výměny vlády](#letna-vymena-vlady-vrabel-15-11-2026).'
  citace:
  - text: Takže co chystají na vládu Andreje Babiše? Tanky? Válku? Takovážně?
  osoby:
  - osoba: petr-korc
    vztah: negativni
    kontext: Jeho komentář „Hitler taky vyhrál volby“ vykládá jako náznak, že opozice chystá svržení vlády
  - osoba: andrej-babis
    vztah: pozitivni
    kontext: Hájí jeho „zvolenou vládu“ proti údajným plánům opozice
