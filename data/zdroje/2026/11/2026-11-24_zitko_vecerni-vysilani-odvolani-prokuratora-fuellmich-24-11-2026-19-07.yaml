  nadpis: Central Casting — 200 000 dvojníků a herců, Vance hraje Paul Walker, „popravení“ Biden, Clintonová i papež; maskami CIA od 90. let (Zítko, 24. 11. 2026)
  text: |
    Nad koláží fotografií tvrdí, že v Central Casting je 900 hollywoodských hvězd a celkem 200 000 dvojníků
    a herců: J. D. Vance je prý mrtvý a hraje ho Paul Walker, Trump na páteční tiskovce byl „o kus menší“,
    původní Biden byl „popraven ještě před“ volbami 2020 (proto v Bílém domě visí místo jeho fotky
    automatické pero), Hillary Clintonová i papež František byli „popraveni“, dvojníky mají Putin, RFK jr.,
    Netanjahu či král Karel. Klonování je podle něj jen „zlomeček“ — stačí hyperrealistické masky, které CIA
    používá od začátku 90. let (šéfka maskování Jonna Mendez před G. Bushem). Kdo to nevidí, je pod
    „brainwashingem nebo MK Ultra“.
  citace:
  - text: Sleepy Joe, ten dokonce nemá ani fotku v Bílém domě. To je ten napravo, protože ten nalevo byl popraven ještě před začátkem podvedeného volebního masakru.
    cas: "13:43"
  - text: Klonování je velmi úzký zlomeček, protože masky udělají tuto službu naprosto dokonale za podstatně nižší náklady.
    cas: "32:21"
