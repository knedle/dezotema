  nadpis: Prokurátor se odvolal proti propuštění Fuellmicha; Vivian Fischer „hlavní zrádkyně“ (Zítko, 24. 11. 2026)
  text: |
    Prokurátor Philipp John podle Zítka v 18:00 podal odvolání proti rozhodnutí soudce o propuštění
    Fuellmicha po dvou třetinách trestu, takže rozhodne soud vyšší instance a Díkůvzdání s manželkou Fuellmich
    „nestihne“ — nastala „horší varianta“, kterou prý předpovídal. Bývalou kolegyni Vivian Fischer označuje za
    „hlavní zrádkyni“, na základě jejíž „křivé výpovědi“ byl Fuellmich odsouzen, ačkoli sama „zpronevěřila
    prachy“; vyzývá diváky k účasti na jejím soudním líčení v Berlíně 27. 11. Odpovědní budou podle něj „po
    zásluze potrestáni“.
  citace:
  - text: V osmnáct hodin bohužel se ukázala zpráva, že využil prokurátor svého práva a vlastně podal odvolání proti rozhodnutí soudce o propuštění.
    cas: "35:04"
  - text: Hlavní zrádkyně taková s tou sponkou ulízlou Vivian Fischer bude mít soudní líčení v Berlíně 27. listopadu.
    cas: "37:16"
