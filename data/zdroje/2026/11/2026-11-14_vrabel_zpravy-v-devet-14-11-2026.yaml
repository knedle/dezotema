vyroky:
- id: vrabel-2026-11-14-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Výpadek letecké dopravy v USA, Microsoftu a propady trhů jako „první příznaky pádu Západu“ —
    „z historického hlediska následuje velká válka“ (Vrabel, 14. 11. 2026)
  text: Zastavení letů v USA, výpadek Microsoftu v 75 zemích, mrazy ve Francii a propady akcií a kryptoměn
    při vysokých úrokových sazbách vykládá Vrabel jako „první příznaky pádu Západu“. Podle něj se systém
    hroutí a „z historického hlediska následuje velká válka“. Trumpa v této souvislosti nazývá „pilotem
    bez motorů“, kterému se nic nedaří, přičemž pád akcií technologických a AI firem teprve přijde.
  citace:
  - text: Z historického hlediska následuje velká válka.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-14-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Přísnější slučování rodin uprchlíků má jen udržet Ukrajince na frontě — „zbabělé, nehumánní“;
    Hitler se prý „inspiroval krutostí islámu“ (Vrabel, 14. 11. 2026)
  text: Návrh devíti států EU včetně ČR na přísnější slučování rodin uprchlíků Vrabel odmítá jako „zbabělý,
    nehumánní“ a neřešící problém. Jeho skutečným cílem je podle něj udržet ukrajinské muže na frontě.
    Řešením je ukončit válku a umožnit Ukrajincům návrat. Ke zprávě ze Švédska, že EU financovala organizaci
    napojenou na Muslimské bratrstvo, říká, že islám je „politický systém dobývání“ a Hitler se „velmi
    inspiroval u té krutosti Mohameda a vůbec celého islámu jako systému“.
  citace:
  - text: Za prvý to je zbabělý, za druhý je to nehumánní a za třetí to vůbec neřeší problém.
- id: vrabel-2026-11-14-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Babiš jako stejný „herec“ jako Fiala, referendum Senátem neprojde, systém je „zločinný“ — jen
    probudit 7 % lidí (Vrabel, 14. 11. 2026)
  text: 'Babiše, který se v Dublinu usmíval na Zelenského, a Havlíčka, který Ukrajině nabízí letadla,
    Vrabel nazývá „pitomci“ a „herci“ a ptá se, proč byl špatný Fiala, a ne Babiš s Havlíčkem. Zdražování
    (voda o 250 %) podle něj jde na Ukrajinu. Vlastencům, kteří ho kritizovali, vzkazuje, že se mu budou
    muset omluvit. Referendum o vystoupení z EU a NATO by podle něj neprošlo Senátem a politika „menšího
    zla“ nefunguje: „jediné, co se dá“, je probudit 7 % lidí, vytáhnout je do ulic a systém změnit. K
    poplatku za dešťovou vodu říká, že daňový systém je „džungle“, stát bere 75 % příjmů, přijatelná by
    byla daň 1 % z převodů a politici jsou na stát napojeni přes veřejné zakázky (Hrdlička). „Parazitů“
    je podle něj asi 20 %. Zabavení 20 milionů dolarů u Šestáka v Maďarsku komentuje tím, že „ti, co to
    umějí“ (Babiš, Fiala, kampeličky), zůstávají nepotrestáni.'
  citace:
  - text: Ten systém je zločinej. Sám od sebe prostě v celý svý podstatě se všema těma hercema… je zločinej.
  podtema: Politická kultura
- id: vrabel-2026-11-14-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: ČR nepozvána do Bergen Group — vlastní vina „onuce“ v „nejpodřízenější roli“; první půjdou záložáci
    (Vrabel, 14. 11. 2026)
  text: 'To, že ČR nebyla přizvána do skupiny Bergen Group v rámci NATO, je podle Vrabela vina samotné
    ČR, která se staví do role „onuce“ a „toho nejpodřízenějšího“: muniční iniciativa, prezident Pavel,
    který podle něj „slouží NATO“, a premiér, kterého nazývá „Slovákem“. V případě války podle něj „první
    půjdou záložáci“.'
  citace:
  - text: Prostě se stavíme do role úplně toho nejpodřízenějšího.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-11-14-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Schůzka Trump–Putin–Si v Šen-čenu 19. 11.: dělení sfér vlivu, ne Ukrajina — USA Evropě v konfliktu
    „na pomoc nepůjdou“ (Vrabel, 14. 11. 2026)'
  text: 'Na schůzce Trumpa, Putina a Si Ťin-pchinga v Šen-čenu (APEC) se podle Vrabela nebude řešit Ukrajina,
    ale sféry vlivu a jaderná dohoda. Rozvíjí tím svou představu „nové Jalty“ z 9. 11.: Evropa se podle
    něj „může těšit“, že jí Američané v případném konfliktu nepomohou. K ruským požadavkům na návrat NATO
    ke stavu z roku 1997 připomíná, že jde o návrhy smluv z roku 2021, které Západ odmítl projednat.'
  citace:
  - text: Evropa se může těšit na to, že Američani v případě, že by došlo k nějakému konfliktu, prostě
      na pomoc Evropě nepůjdou.
  podtema: Zahraniční aktéři a precedenty
