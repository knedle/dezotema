  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**10. 11.** — Zítko vykládá obrázek vojenského štítu se „klíčem 1789“ (netopýr, váhy, 13 hvězd
    jako hrot kopí) jako „pravou republiku pod vojenskou mocí“. Klíč UPU má podle něj Trump jako „nejvyšší
    pošťák“ po anglické královně, hvězdy obrácené dolů tvoří „V jako vendeta“ a krok má zrušit měnový
    systém FEDu. Q byla podle něj „zkouška vědomí“: kdo neuvěřil, „zamíří jinam“ do paralelní časové linie
    (s odkazem na Dolores Cannon) a ti, kdo se o Q dozvěděli nedávno, se po midterms „snadno vzdají“.
    Opakuje, že podvod hlásilo 40 států, a tvrdí, že „posledních 20 let jsou všechny volby vojeb“ i v
    „korporaci Česko“, protože výsledky vybírají počítačové firmy. Klaus a Fico podle něj přiznali, že
    slovenské referendum o vstupu do EU bylo upravené. Období 45 dnů po volbách bude podle něj „o dost
    víc vzrušující“ než samotné volby. Některé státy už podle něj „fasují“ kartičky QFS a v Japonsku má
    128 bank ohlásit až 30denní výpadek. ISO 20022 má platit od 22. 11., výročí atentátu na JFK, který
    byl podle něj „uklizen do ochrany svědků“. Z článku o „globalistickém bankovním kartelu“ (City of
    London, Vatikán, Washington) vyvozuje, že „tohle končí a padá“, včetně Izraele z roku 1948. Dnešní
    Putin je podle něj „k nepoznání“ jiný člověk a Biden byl „čtyři roky dvojník“. Hlavním cílem je podle
    něj „konec obchodování s dětmi, konec výroby adrenochromu“ (prý mizí 8 milionů dětí ročně).'
