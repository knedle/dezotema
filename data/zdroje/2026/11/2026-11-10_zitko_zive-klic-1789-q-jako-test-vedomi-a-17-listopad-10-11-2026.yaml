  text: '**10. 11.** — Zítko označuje 17. listopad 1989 za puč StB a KGB „za pomoci zahraničí“ a rozdělení
    ČSFR (Klaus, Mečiar) za nepromlčitelnou velezradu. Zákon 542/1992 je podle něj neplatný, protože pod
    ním chybí podpis prezidenta. Opakuje, že „z 99,9% pravděpodobností se opět obnoví Československo“,
    a „mírová smlouva směřující k ukončení následků druhé světové války se blíží“. Spojení ČSR podle něj
    nebude problém, protože protektorát a Slovenský stát se po válce také znovu spojily. Americký celostátní
    test nouzového varování 17. 11. může být podle něj test, nebo „na tvrdo“ („důvěřujte plánu“).'
