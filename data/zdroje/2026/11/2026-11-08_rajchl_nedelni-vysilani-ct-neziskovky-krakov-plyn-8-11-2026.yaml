  nadpis: 'Střelba v Krakově: pachatel byl „levicový radikál“ jako David Kozák, ne pravicový extremista
    (Rajchl, 8. 11. 2026)'
  text: Rajchl kondoluje obětem střelby v Krakově a oceňuje oba zasahující policisty, kteří podle něj
    s nasazením vlastního života zachránili mnoho dalších. Odmítá ale „mantru“ okruhu kolem Štítu demokracie
    a „pana Mácy a spol.“, že šlo o pravicového radikála. S odkazem na „nezávislá média“ a Tomase Pauknera
    tvrdí, že šlo naopak o levicového radikála s podobným zázemím i pohnutkami jako střelec z FF UK David
    Kozák. Pachatel byl podle něj „jednoznačně produktem“ nesnášenlivé rétoriky „probruselských, progendrových,
    proklimatických“ aktivistů. Na rozdíl od Vrabela (viz výše) nezpochybňuje průběh útoku, ale jeho politické
    zařazení.
  citace:
  - text: Takže hanba vám, že jste schopní i na pozadí této tragédie takhle neuvěřitelně lhát.
  osoby:
  - osoba: tomas-paukner
    vztah: pozitivni
    kontext: Ukázal, že krakovský střelec byl levicový radikál; rozpracoval téma financování Stárkové
  podtema: Náboženský a okultní výklad moci
- id: rajchl-2026-11-08-05
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Stížnost k Radě ČT na Jana Moláčka za „kukaččí mládě“; ČT zrušit, „ani korunu“ (Rajchl, 22.
    10. 2026)
  text: '**8. 11.** — Rajchl vysvětluje, proč se s Janou Zwyrtek Hamplovou nezúčastnil demonstrace spolku
    Svatopluk. Měl prý informace o chystané provokaci vůči poslancům a téma podle něj nepatří „do ulic“,
    ale do parlamentu. Koalice má podle něj mandát „3 milionů hlasů“, většinu ve Sněmovně a podporu „přes
    60 %“ lidí, takže poplatky „zrušíme a tečka“ („projedeme to jak vlak“), i kdyby na Letné bylo 200
    tisíc lidí. Bere si příklad z Fialova výroku, že nebude jednat pod tlakem demonstrací. Zrušení poplatků
    označuje za „technickou věc“: 8,5 miliardy bez kontroly, 41 tisíc exekucí za tři roky, 17 z 27 zemí
    EU platí veřejnoprávní média z rozpočtu, Polsko a Slovinsko se chystají, Nizozemsko škrtá 150 mil.
    eur. S Filipem Turkem souhlasí, že ideální by bylo ČT zprivatizovat, jak se to podle něj chystá i
    v Izraeli. Stávku zaměstnanců ČT považuje za nelegitimní: smějí stávkovat za platy a pracovní podmínky,
    ne kvůli financování instituce, a „nejsou žádní strážci demokracie“. ČT podle něj musí vysílat podle
    „eurohodnotového“ kodexu Bruselu a je méně vyvážená než Prima a Nova. Odmítá prý platit „speciální
    daň na propagandu“ ve prospěch EU a Kyjeva.'
  citace:
  - text: Já nehodlám jednat pod tlakem, já hodlám co nejdříve zrušit koncesionářské poplatky.
  osoby:
  - osoba: filip-turek
    vztah: pozitivni
    kontext: Souhlasí s ním, že ČT zprivatizovat
  - osoba: hamplova
    vztah: pozitivni
    kontext: Společně se rozhodli nejít na demonstraci Svatopluku
  podtema: Česká televize a mainstreamová média
