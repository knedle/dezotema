  nadpis: 'Návrat ruské reprezentace na MS v hokeji: „politika do sportu nepatří“, kritici jsou „pokrytci
    a farizejové“ (Rajchl, 30. 10. 2026)'
  text: '**8. 11.** — Rajchl opakuje, že start ruských týmů na válce „nezmění vůbec nic“ a kvůli němu
    nezemře „ani o jednoho člověka víc“. Nově uvádí, že na fotbalovém MS v USA hrály USA i Írán, přestože
    si v té době vyměňovaly rakety. Krev na rukou mají podle něj „ideologičtí fanatici“, kteří 4,5 roku
    „posílají Ukrajince na smrt“, přestože válka je dávno prohraná. Doplňuje právní argument: pokud by
    ČR nezajistila ruskému týmu start na mistrovství juniorek, hrozí jí finanční sankce i penalizace nebo
    vyloučení vlastního týmu. Kritiku výroku Petra Macinky o „mužatkách“ viz [politicky-system.md](politicky-system.md#macinka-muzatky-rajchl-8-11-2026).'
  podtema: Zahraniční aktéři a precedenty
