- id: rajchl-2026-11-08-07
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'NCOZ studie: organizovaný zločin v ČR ovládli Ukrajinci — Rajchl (5. 5. 2026)'
  text: '**8. 11.** — Rajchl tvrdí, že ukrajinská tajná služba přebírá informace od rakouské tajné služby
    a předává je „vlastní mafii“. Ta pak přes podvodná call centra okrádá Rakušany, Čechy, Slováky, Američany
    i Němce, takže se z českých daní podle něj nepřímo financuje okrádání českých důchodců. Zelenskyj
    podle něj pomoc „rozkrádá“, EU Ukrajině půjčila 90 miliard a ta teď chce dalších 70. Ukrajinu nazývá
    „zločinným, kriminálním režimem“ (zmiňuje i odhalený dům, kde se mučili vlastní občané). Kritikům
    startu ruských hokejistů vyčítá, že nekřičí, že Ukrajině „už nedáme ani korunu“.'
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: Rozkrádá pomoc, jeho tajná služba spolupracuje s mafií
- id: rajchl-2026-11-08-08
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Pavel jako vyjednavač EU s Ruskem: „bezcharakterní korouhvička“ (Rajchl, 25. 10. 2026)'
  text: '**8. 11.** — Rajchl se k obratu vrací. Pavel podle něj před dvěma lety tvrdil, že s Ruskem lze
    jednat až poté, co ustoupí. Rusko mezitím naopak postoupilo a Pavel dnes navrhuje „dát Putinovi bonbon“
    v podobě obnovení hospodářských vztahů. Kdyby totéž řekl Rajchl, který to tvrdí čtyři roky, opozice
    by ho prý označila za ruského agenta a vlastizrádce. Pavel to podle něj říká jen proto, že „mu dorazily
    nové notičky“. Připomíná také výrok Jana Farského, že o ruském plynu a ropě „může uvažovat jen vlastizrádce“.
    Dnes o nich podle Rajchla uvažuje i Pavel.'
  citace:
  - text: A Petr Pavel to říká jenom, protože mu dorazily nové notičky, protože před dvěma lety říkal
      úplně o 180 stupňů něco jiného.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Dejme Putinovi bonbon“ až po „nových notičkách“; „bolševický rozvědčík“
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-11-08-09
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Macinkův výrok o „ruských mužatkách“ je „extrémně nešťastný“; „věk ani pohlaví není zásluha“
    (Rajchl, 8. 11. 2026)
  text: 'Rajchl se veřejně vymezuje vůči výroku Petra Macinky (Motoristé), že se mistrovství juniorek
    obejde bez „ruských mužatek“. Macinku přitom považuje za kamaráda a přínos pro politiku. Nazývat ženy
    hrající hokej či fotbal mužatkami podle něj není férové a je to urážlivé. Sportovkyně jsou podle něj
    „ty nejkrásnější ženy“ (připomíná, že jeho manželka hrála první volejbalovou ligu). Druhou výhradu
    má k samotnému výpadu proti ruskému týmu (viz [valka-nato-rusko.md](valka-nato-rusko.md)). Trvá na
    zásadě, že „věk ani pohlaví není zásluha“: kritika má být faktická a smí mířit na kohokoli. Dnes prý
    bez obvinění z „odporného útoku“ lze kritizovat jen muže nad 40 let z „národně konzervativní scény“.
    Odmítá tvrzení Matěje Hlavatého, že útočí jen na ženy: kritizuje i jeho (obec Tetín podle něj zachránila
    před bankrotem jen předčasná dotace a úvěr kraje). Hlavatý se s ním podle něj bojí jít do debaty,
    protože by z něj „za dvě minuty“ udělal „úplného pitomce“.'
  citace:
  - text: Věk ani pohlaví není zásluha.
  osoby:
  - osoba: petr-macinka
    vztah: rozporuplny
    kontext: Kamarád a přínos politice, ale výrok o „ruských mužatkách“ „extrémně nešťastný“
  - osoba: matej-hlavaty
    vztah: negativni
    kontext: Lže, že útočí jen na ženy; Tetín zachránila jen dotace; bojí se debaty
  podtema: Politická kultura
- id: rajchl-2026-11-08-10
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 17. listopad „ukradli“ pravdoláskaři — svátek plurality názorů proměnili ve svůj „vítězný únor“
    (Rajchl, 8. 11. 2026)
  text: Demonstrace k 17. listopadu bere Rajchl „naprosto v klidu“, asi pojede na dovolenou a napíše nebo
    natočí komentář o tom, jak byl svátek „ukraden a zcizen“. Listopad 1989 podle něj oslavoval pluralitu
    názorů a demokracii, „pravdoláskaři“ si z něj ale udělali „svůj vítězný únor“ a šíří „jednu jedinou
    možnou pravdu“. Pád režimu byl podle něj správný. Chybou bylo, že se pak za slib rychlého zbohatnutí
    rozprodalo „rodinné stříbro“. Slavit nebude, dokud se na Národní třídě bude pískat na Babiše a Turka
    a tleskat „bolševickému rozvědčíkovi“ (Petru Pavlovi). Kdo píská, podle něj zrazuje odkaz svátku,
    který byl o toleranci všech názorů. Výročí 17. listopadu 1939 uznává.
  citace:
  - text: Jak ze svátku, který v podstatě oslavoval pluralitu názorů a demokracii, si ti pravdoláskaři
      udělali svůj vítězný únor.
  podtema: Politická kultura
- id: rajchl-2026-11-08-11
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Merz z BlackRocku plní „zadání“; Evropa neporazí „tříocasou příšeru“ migrace, Green Dealu a
    proválečného fanatismu (Rajchl, 4. 11. 2026)
  text: '**8. 11.** — Rajchl mluví o „dvouhlavé sani“ migrace a Green Dealu a podepisuje se pod výrok
    Jarosława Kaczyńského: buď zrušit Evropskou komisi v čele s von der Leyenovou, nebo z EU vystoupit.
    Hned odcházet nechce, protože na to ČR sama nemá a musí spolupracovat s Polskem a Slovenskem. Nejdřív
    je podle něj třeba zkusit změnu směrem ke „spolupráci suverénních států“. Pokud se nepodaří, je podle
    něj rozumnější odejít než zůstat na „špatné trajektorii“, která „vede do pekla“. Hlavní brzdou je
    podle něj „bruselské centrum moci“, které vymýšlí „jednu idiotskou agendu za druhou“. Energetické
    argumenty viz [ceny-energie.md](ceny-energie.md#plyn-12x-green-deal-rajchl-8-11-2026).'
  citace:
  - text: Já se podepisuju pod výrok Jaroslava Kačinského, buď zrušíme Evropskou komisi v čele s von der
      Lejenovou, nebo pojďme vystoupit z Evropské unie.
  osoby:
  - osoba: jaros-aw-kaczynski
    vztah: pozitivni
    kontext: Podepisuje se pod „zrušit Komisi, nebo vystoupit z EU“
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
