  nadpis: Bezpečnost zajišťují policisté, hasiči a vojáci víc než tanky a F-35 — peníze investovat do
    lidí (Rajchl, 8. 11. 2026)
  text: Na příkladu policistů zraněných při zásahu v Krakově Rajchl děkuje českým policistům, hasičům
    a vojákům. Tvrdí, že bezpečnost zajišťují „stokrát více a důsledněji“ než zbraně, tanky a F-35 nakupované
    za obrovské peníze. Kdyby se tyto prostředky investovaly do lidí, aby byli dobře vybavení, zabezpečení
    a spokojení, prospělo by to bezpečnosti podle něj „mnohonásobně“ víc než „všechny zbraně a všechna
    železa dohromady“.
  citace:
  - text: …myslím si, že ji zajišťují stokrát více a důsledněji než nějaké zbraně, než nějaké tanky nebo
      F-35, které kupujeme za obrovské peníze.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
