  text: |-
    **8. 11.** — Před odvysíláním reportáže Newsroomu ČT Rajchl znovu předčítá svůj příspěvek o Stárkové (Aspen, ocenění z roku 2025, „Sorošem vycvičená a Sorošem do naší země dosazená pastýřka všech zmanipulovaných oveček“). Trvá na tom, že „ani jedno slovo není lež“, že nezveřejnil adresu a k nadávkám nevyzýval. Výčet výroků, u kterých ČT „nebyla“, rozšiřuje o tyto:
    - Foltýnovo „svině“, „svoloč“ Evy Decroix, Farského „vlastizrádce“ a Moravcovo „nácek“;
    - Forum24 („temná tvář proruské kolaborace“), Reflex („mazlíček Kremlu“) a „proruská sebranka“ Danuše Nerudové;
    - vulgární reakce Davida Matáska v den atentátu na Fica a komentáře typu „škoda, že nemířil lépe“ či „konečně to někoho napadlo střílet“. Policie jeho trestní oznámení odložila jako svobodu projevu podle čl. 17 Listiny;
    - SMS „smrt českým podlidem“, kterou policii předal i s telefonním číslem, zůstala podle něj bez odezvy.

    Komentář „na každou svini se vaří voda“ pod jeho příspěvkem přitom policie po upozornění Pirátů („bonzáci největšího kalibru“) prověřuje hned druhý den. Sám tento výrok odsuzuje, ale buď má být trestný v obou případech, nebo v žádném, a podle něj v žádném. Proto jeho asistenti nabízejí stíhaným komentujícím právní radu. Předem tvrdí, že reportáž bude „zmanipulovaná“ a redaktoři jsou „zbabělci“ a „lháři“.
