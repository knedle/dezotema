- id: rajchl-2026-11-08-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Plyn 12× dražší než v USA, povolenky 4× — Evropa se „zbláznila“; „zelení fanatici“ mlčí o emisích
    zbrojení a tankerů (Rajchl, 8. 11. 2026)
  text: 'Podle Rajchla je plyn na burze TTF v Rotterdamu 12× dražší než na americkém Henry Hub. Emisní
    povolenka ETS1 stojí v EU kolem 90 eur, v USA kolem 25 eur a v Číně či Koreji je podle něj asi devětkrát
    levnější. Evropa tak podle něj nemůže konkurovat USA ani Asii, „sama si staví překážky“ a deindustrializace
    bude pokračovat (letos prý odešly Baťa, Zetor a další firmy). Navrhuje zrušit Green Deal a zavést
    nízkou ekologickou daň kolem 5 eur za tunu CO₂, kterou by energetika podle něj unesla. Peníze by místo
    „zeleným aktivistům“ a větrným elektrárnám šly do celoevropského výzkumného centra pro jadernou fúzi
    a recyklaci. Nechce „živit“ spekulanty s deriváty povolenek. „Zeleným fanatikům“ vyčítá pokrytectví:
    výroba zbraní je podle něj na špičce produkce CO₂ a jeden tanker na mazut vyprodukuje víc emisí než
    všechna česká auta se spalovacím motorem, a přesto mlčí. Žádá proto brát ruský plyn a ropu stávajícím
    potrubím, jak podle něj radí i Trump. Tranzit by státnímu Net4Gas vynesl miliardy, plyn by zlevnil
    a emise by klesly „o stovky procent“. Green Deal a migraci nazývá „dvěma hlavami saně“, které ničí
    Evropu (viz [suverenita-eu.md](suverenita-eu.md#triocasa-prisera-rajchl-4-11-2026)).'
  citace:
  - text: Pojďme začít nakupovat levný plyn a levnou ropu, jinak Evropa spěje ke svému průmyslovému zániku.
  podtema: Elektřina — marže a ceny
- id: rajchl-2026-11-08-02
  typ: tvrzeni
  temata:
  - fara-neziskovky
  nadpis: 'Spolek Díky, že můžeme: Soros, Obama Foundation a sponzoři STAN — protesty za ČT jako připravený
    pokus svrhnout vládu (Rajchl, 2. 11. 2026)'
  text: '**8. 11.** — Rajchl opakuje, kdo podle něj spolek financuje (norské fondy, Obama Foundation,
    Open Society a 83 tisíc eur na „Samet ve školách“, který nazývá „komsomolskou přípravkou“ aktivistů).
    Tleská ministru kultury Klempířovi, že spolku odmítl dotaci na akce k 17. listopadu. Jako premiér
    by ministra, který by dal politické neziskovce peníze z daní, „vyhodil“. Demonstrace podle něj nejsou
    spontánní, ale placené ze zahraničí a Janem Bartou, který financuje i STAN a Petra Pavla. Zákon FARA
    označuje za svůj „hlavní cíl“: koalice ho podle něj předloží (podrobnosti zatím neprozradí). Z registru
    pak bude vidět, kdo neziskovky financuje, a on už „nebude muset psát tyto příspěvky“.'
  citace:
  - text: Musíme za každou cenu prosadit zákon FARA.
  osoby:
  - osoba: oto-klempir
    vztah: pozitivni
    kontext: Správně odmítl dotaci spolku Díky, že můžeme
  podtema: Milion chvilek — struktura a financování
- id: rajchl-2026-11-08-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: '„Fialova kampelička“: NCOZ vyšetřuje praní peněz, přes záložnu měly téct „vratky“ z ukrajinských
    zbrojních kontraktů (Rajchl, 8. 11. 2026)'
  text: Rajchl uvádí, že se potvrdilo vyšetřování NCOZ pro praní špinavých peněz v podnikatelské záložně,
    kde měli vklady vysocí politici ODS. Vybírat se z ní podle něj měly miliony eur v hotovosti a nosit
    „v brašně“ či „v igelitkách“. Přes záložnu se podle něj procesovaly „vratky“ ze zbrojních kontraktů.
    Ukrajina prý poslala neznámé chorvatské firmě peníze za munici, ta ji nikdy nedodala, zmizelo asi
    14 milionů eur a Ukrajina je nevymáhala. Rajchl spekuluje, že šlo o vratky lidem, kteří rozhodovali
    o pomoci Ukrajině z českých daní. Protože to „mělo blízko k ODS“, „asi logicky víme, kteří ti lidé
    by to měli být“. Kampelička podle něj nesmí zůstat opomenuta, stejně jako bitcoinová kauza a Dozimetr
    (tam prý „udělali posun“). Pokud policie neuspěje, navrhne další vyšetřovací komise. Srovnej s Černohorským
    v [politicky-system.md](politicky-system.md).
  osoby:
  - osoba: petr-fiala
    vztah: negativni
    kontext: Kampelička ODS; ironicky přebírá jeho „nebudu jednat pod tlakem demonstrací“
  podtema: Kauza Jesenicko — Stanjura obviněn ze zneužití povodňové půjčky
- id: rajchl-2026-11-08-04
  typ: tvrzeni
  temata:
