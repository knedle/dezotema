  poznamka: 1 h 6 min, „O vylhaném světě z Kavčích hor a politických neziskovkách coby vysoce chráněnému
    druhu“. Zpracováno všech 15 témat. Citované výhrůžky a komentáře (Hedija, SMS, komentáře k Ficovi)
    nejsou Rajchlovy výroky, proto nejsou ve stochastickém teroru. Hraniční „zločinný, kriminální režim“
    (Ukrajina) a „pokrytci, farizejové… krev na rukou“ nesplňují kritérium dehumanizace ani výzvy k trestu.
