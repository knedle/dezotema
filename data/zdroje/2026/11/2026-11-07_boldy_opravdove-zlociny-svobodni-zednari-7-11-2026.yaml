  nadpis: Protest za poplatky ČT „aby mohli platit vlastní válečnou propagandu“ — umělá bublina a dvojí
    metr policie (Vrabel, 24. 10. 2026)
  text: '**7. 11. (Boldy)** — Konspirátor Boldy považuje domácí politiku („Babiš, Okamura“) za „stupidní
    věci“, se kterými lidé stejně nic nezmění, a protesty za poplatky ČT za „frašky“, které organizují
    neziskové organizace: „vyšleme blbečky do ulic a musí protestovat, chceme poplatky“.'
