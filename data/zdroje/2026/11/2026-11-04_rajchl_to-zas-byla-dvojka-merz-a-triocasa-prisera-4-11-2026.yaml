  - suverenita-eu
  nadpis: Merz z BlackRocku plní „zadání“; Evropa neporazí „tříocasou příšeru“ migrace, Green Dealu a
    proválečného fanatismu (Rajchl, 4. 11. 2026)
  text: 'V televizní debatě Rajchl tvrdí, že německý kancléř Friedrich Merz, bývalý šéf BlackRocku pro
    Německo, „jednoznačně pokračuje ve svém zadání“ a Němci jeho vládě přezdívají „Schmerz“ (bolest).
    Evropa ani ČR podle něj nebudou prosperovat, dokud budou vládnout „zelení fanatici“: je třeba porazit
    „dvouocasou příšeru“ migrace a Green Dealu, jak ji pojmenoval Donald Trump, ke které on přidává třetí
    ocas — „proválečný fanatismus“; do té doby k Evropě nebude Amerika přistupovat jako k silnému partnerovi.
    Jako kontrast uvádí Bidenova „sanctuary cities“ a omezování ICE, kdy hranice přecházely statisíce
    nelegálních migrantů, zatímco za Trumpa „nepřechází nikdo“.'
  citace:
  - text: Jakmile neporazíme tu dvouocasou příšeru, kterou pojmenoval Donald Trump, migraci a Green Deal,
      a já bych tomu přidal ještě třetí ocas, a to je válka, ten proválečný fanatismus, tak do té doby
      Evropa nemůže být silným kontinentem.
