  nadpis: Vrabel — při tomto vyostřování „do měsíce bychom byli ve válce“ (25. 11. 2026)
  text: Vrabel podmíněně předpovídá, že pokud se bude eskalace vyvíjet stejným tempem, bude Evropa do měsíce
