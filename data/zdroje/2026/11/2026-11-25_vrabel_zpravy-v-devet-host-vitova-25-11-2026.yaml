  poznamka: 'Zprávy čte spolumoderátorka Zuzka, Vrabel komentuje; hostka Vladimíra Vítová komentuje v úvodu
    (cca 6:56–20:08) kauzu Valderode a Ústavní soud. 29 témat v denním přehledu, 24 z nich s vlastním
    úhlem (⚡) v 30 výrocích (výroky hostky 02–05 s mluvci: vladimira-vitova). Predikce: 8 (válka do měsíce,
    Babiš na summitu 26. 11., Trump–Írán/Kuba, žádný mír bez rozpadu EU, nukleární/„špinavý“ útok na
    Ukrajině, konec možnosti mluvit, Zelenský zabit s 80 %, Maďarsko nakonec povolí půjčku). Stochastický
    teror: 1 hraniční (Boris Johnson — „babička s hákem“, vtipná narážka bez výslovné výzvy k násilí).
    Citace ověřeny v přepisu, ASR zkomoleniny ponechány (např. „Voldemort“ = Valderode).'
  prehled:
  - tema: Miroslav Sládek chce kandidovat na prezidenta
    text: s rodinou ČR1 mu pomáhá sbírat podpisy, šanci mu nedává kvůli médiím a agenturám v soukromých rukou,
      ale považuje ho za jediného kandidáta s programem odchodu z EU a NATO.
    vyrok: vrabel-2026-11-25-01
  - tema: Ústavní soud a nárok dědičky rodu Valderode (Benešovy dekrety)
    text: Vítová označuje rozhodnutí za začátek zpochybnění dekretů a návratu majetků nacistických kolaborantů.
    vyrok: vrabel-2026-11-25-02
  - tema: Ústavní soud jako „kolona“ EU
    text: Vítová popisuje Ústavní soud, Senát a hrad jako „zákopy“ prounijních sil a kraje jako „malé vladyky“.
    vyrok: vrabel-2026-11-25-03
  - tema: Zásah Ústavního soudu do voleb 2025
    text: podle Vítové měl soud zrušit registraci SPD a Stačilo a tím usurpuje právo měnit věci proti zákonu.
    vyrok: vrabel-2026-11-25-04
  - tema: Prezidentští kandidáti vlastenecké scény
    text: Vítová míní, že prezidentem nemůže být někdo bez zkušeností, a kritizuje množství „bublinových“
      kandidátů; Sládka označuje za vhodného.
    vyrok: vrabel-2026-11-25-05
  - tema: Poslanecká sněmovna zvýšila poplatek za odběr podzemní vody
    text: zdražování vody, tepla i energií je podle něj jen další způsob, jak získat peníze na financování
      války.
    vyrok: vrabel-2026-11-25-06
  - tema: Von der Leyenová před summitem o financování Ukrajiny (deficit 70–75 mld. eur na 2027)
    text: zdražování všeho je podle něj pro peníze Ukrajině, vystupování „na city“ s dětmi války označuje
      za „citové vydírání“.
    vyrok: vrabel-2026-11-25-07
  - tema: Rusko prý útočí na Evropu hybridními útoky a drony
    text: kdyby na Evropu Rusko útočilo, byla by už rozbombardovaná; strach slouží k získání peněz.
    vyrok: vrabel-2026-11-25-08
  - tema: Eskalace po schůzce Trump–Si–Putin; Medvěděv a jaderné zbraně
    text: situace se podle něj rychle vyostřuje a při tomto tempu by do měsíce byla válka.
    vyrok: vrabel-2026-11-25-09
  - tema: Senát vyzval vládu k podpoře evropské půjčky Ukrajině; Havlíček
    text: ručení nic nemění, protože půjčku z rozpočtu EU stejně 100 % zaplatí členské státy.
    vyrok: vrabel-2026-11-25-10
  - tema: Babiš na summitu EU
    text: sází se, že Babiš půjčku odhlasuje a řekne, že ČR neručí.
    vyrok: vrabel-2026-11-25-11
  - tema: Senát proti sportovním utkáním s Ruskem a Běloruskem; 22. balíček sankcí
    text: sankce jsou „nová moderní železná opona“ a Senát je „hlásná trouba“ EU.
    vyrok: vrabel-2026-11-25-12
  - tema: Evropské země jednají o F-16 pro Ukrajinu
    text: Zelenský je prý „nutně potřebuje“, Američané „dělají jenom mír plus F-16“.
  - tema: Trump navrhuje nová cla 20–40 % na 14 partnerů
    text: „klasický příběh Donalda Trumpa“, čeká další válku s Íránem a tipuje Kubu jako další cíl.
    vyrok: vrabel-2026-11-25-13
  - tema: Ukrajinský útok na leteckou základnu v Nižním Novgorodu
    text: Ukrajina má právo se bránit, útoky na ruskou fregatu u Libye či ropná zařízení však odmítá; ČR
      má stát mimo konflikt.
    vyrok: vrabel-2026-11-25-14
  - tema: Zelenský k Donbasu a válečný projev von der Leyenové
    text: žádný mír nebude, dokud se EU nerozpadne.
    vyrok: vrabel-2026-11-25-15
  - tema: Boris Johnson chce vyslat evropské vojáky na Ukrajinu před příměřím
    text: je to totéž jako vyhlásit Rusku válku; Ukrajina je „otloukánek“ Evropy, ČR „užitečný idiot“.
    vyrok: vrabel-2026-11-25-16
  - tema: Násilná mobilizace na Ukrajině
    text: únosy lidí z ulic označuje za „nejhorší formu fašismu“ (opakuje).
    vyrok: vrabel-2026-11-25-19
  - tema: Estonsko uzavírá hranice s Ruskem
    text: Rusko to prý může považovat za vstup do války, protože v Estonsku žije přes 20 % Rusů.
  - tema: Komentář diváka o neschopnosti Čechů spojit se proti zlořádu
    text: nespojí se nikdo na Západě, jde o duchovní válku dobra a zla a brzy ztratí možnost mluvit.
    vyrok: vrabel-2026-11-25-20
  - tema: Sikorski navrhuje bezletovou zónu nad západní Ukrajinou
    text: logický krok, ale „dva prstíčky“ povedou k bojům nad Ukrajinou.
    vyrok: vrabel-2026-11-25-22
  - tema: Lukašenko označil Zelenského za nezkušeného a vyzval k jednání v Moskvě
    text: Rusko by Ukrajinu mohlo zničit hned, ale nechce; Zelenskému radí jet vyjednávat.
    vyrok: vrabel-2026-11-25-23
  - tema: Zelenský k dalším mírovým jednáním (SAE či Švýcarsko)
    text: Zelenský nemá pozici diktovat Rusku podmínky, jde o „show pro západ“.
    vyrok: vrabel-2026-11-25-25
  - tema: Peskov o dalším kole jednání v Abú Zabí
    text: bez komentáře.
  - tema: Maďarsko se nezúčastní půjčky Ukrajině (45 mld. eur)
    text: jde podle něj o vyjednávací taktiku Magyara, nakonec povolí.
    vyrok: vrabel-2026-11-25-26
  - tema: Merz o cílech Ruska přesahujících Ukrajinu
    text: jeho slova jsou „naprostý nesmysl“.
    vyrok: vrabel-2026-11-25-27
  - tema: Húsíové útočí na saúdskou rafinérii
    text: „hořelo to tam fajně“.
  - tema: Německo zadrželo tři nezletilé podezřelé z pravicového terorismu
    text: ironicky pochybuje, že by 14–15letí plánovali útoky.
  - tema: Rutte vyzývá k přípravě na válku s Ruskem
    text: „to řekl hezky“, zmiňuje svou dřívější úvahu z roku 2023 v EP.
  - tema: Stíhání profesora Glenna Diesena v Norsku
    text: obává se, že by ho za podobné výroky mohli zavřít také; každá válka má příčiny a Rusko mělo důvody.
    vyrok: vrabel-2026-11-25-28
  - tema: Rusko odmítlo americké nabídky v energetice a letectví
    text: Trump, Kushner a Witkoff jsou obchodníci, jejich mírové snahy jsou i byznys.
    vyrok: vrabel-2026-11-25-29
  - tema: Video z Německa o „odzdobování“ vánočního stromku
    text: ukazuje to „současné Německo“ a migranty přijedou brzy i do ČR; vláda nepodnikla právní krok proti
      migračnímu paktu.
    vyrok: vrabel-2026-11-25-30
vyroky:
- id: vrabel-2026-11-25-01
  typ: postoj
  temata:
  - politicky-system
  nadpis: Sládek jako prezidentský kandidát — „osamocená hvězda na tmavém nebi“ s programem odchodu z EU a
    NATO (Vrabel, 25. 11. 2026)
  text: Vrabel říká, že nápad na Sládkovu kandidaturu v roce 2028 vzešel od jeho manželky a že rodina ČR1 mu
    pomáhá sbírat podpisy. Šanci mu nedává, protože politiku podle něj dělají média a volební agentury
    ve vlastnictví soukromých finančních struktur, které o Sládka nemají zájem. Sládka popisuje jako
    vlastence, odvážného a v soukromí kultivovaného člověka a tvrdí, že jako jediný má program vystoupení
    z EU, NATO a WHO, s nímž spolu s Vítovou dříve kandidovali.
  citace:
  - text: protože konec konců je to nápad mojí manželky, že by pan doktor Sládek měl kandidovat na prezidenta.
    cas: "04:15"
  - text: Takže pan doktor Sládek v tuto chvíli je taková osamocená hvězda na tmavém nebi, jak bych řekl.
    cas: "06:36"
  osoby:
  - {osoba: miroslav-sladek, vztah: pozitivni, kontext: "Označen za vlastence, odvážného a kultivovaného člověka; Vrabel mu pomáhá sbírat podpisy"}
  - {osoba: vladimira-vitova, vztah: pozitivni, kontext: "Společná kandidatura do parlamentu s programem odchodu z EU a NATO"}
  - {osoba: jiri-ovcacek, vztah: neutralni, kontext: "Zmíněn jako Sládkův soupeř v „zápase na páku“"}
  podtema: Prezidentská volba 2028
- id: vrabel-2026-11-25-02
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  - kauzy
  nadpis: Vítová — rozhodnutí Ústavního soudu u Valderode otevírá dveře zpochybnění Benešových dekretů
    (Vítová, 25. 11. 2026)
  text: Hostka Vítová k rozhodnutí Ústavního soudu o nároku dědičky rodu Valderode tvrdí, že soud nepovažoval
    službu ve Wehrmachtu a v rozvědce za kolaboraci. Podle ní je to začátek, který může umožnit návrat
    majetků nacistickým kolaborantům a zpochybnit celé dekrety prezidenta Beneše. Ty podle ní vyjadřují
    diskontinuitu s nacistickým Německem, takže jejich zrušení by znamenalo „stát se součástí“ nacistického
    Německa a povinnost platit reparace. Průvodci na zámcích prý o kolaboraci majitelů nemluví.
  citace:
  - text: A ohromný problém je, že vlastně tato kauza je začátkem toho, že by se mohly otevřít dveře pro ty
      nacistické kolaboranty, jako byly Lichtenstejnové, aby dostali zpět ten majetek.
    cas: "09:26"
  - text: Takže vlastně, když by to všechno bylo zrušeno, tak my se staneme součástí toho nacistického
      Německa.
    cas: "10:09"
  osoby:
  - {osoba: josef-baxa, vztah: negativni, kontext: "Ústavní soud pod jeho vedením potvrdil nárok dědičky Valderode"}
  - {osoba: eduard-benes, vztah: pozitivni, kontext: "Jeho dekrety hájí jako diskontinuitu s nacistickým Německem"}
  mluvci: vladimira-vitova
- id: vrabel-2026-11-25-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  - politicky-system
  nadpis: Vítová — Ústavní soud je „osmá kolona“ EU a prounijní síly se „zakopaly“ v Senátu, na hradě a v
    krajích (Vítová, 25. 11. 2026)
  text: Vítová tvrdí, že je téměř jedno, kdo sedí v Poslanecké sněmovně, protože EU má „poslední páku“ v
    Ústavním soudu, hlavě státu a Senátu. Odvolává se na analýzy, podle nichž se prounijní skupiny
    zakopaly v „středním managementu“ (Senát, hrad, kraje) a hejtmani se mění v „malé vladyky“. Spojování
    krajů vůči vládě i kauzu Valderode popisuje jako „plíživé rozbití“ České republiky.
  citace:
  - text: To je, já nevím kolikátá, to je pátá, šestá, sedmá, osmá kolona.
    cas: "12:49"
  - text: Prostě ta Evropská unie má tu poslední páku, i kdyby ji nechtěl jakoby nikdo poslechnout, tak
      vždycky v tom ústavním soudu.
    cas: "12:59"
  - text: Takže tady dochází k takovému jako plíživému rozbití úplně té České republiky.
    cas: "14:39"
  osoby:
  - {osoba: josef-baxa, vztah: negativni, kontext: "Ústavní soud označen za nástroj EU"}
  mluvci: vladimira-vitova
- id: vrabel-2026-11-25-04
  typ: tvrzeni
  temata:
  - politicky-system
  - suverenita-eu
  nadpis: Vítová — Ústavní soud porušil zákon, když nezrušil registraci SPD a Stačilo ve volbách 2025
    (Vítová, 25. 11. 2026)
  text: Vítová tvrdí, že koalice SPD a Stačilo kandidovaly pod společnou „protizákonnou registrací“ a Ústavní
    soud je měl podle zákona zrušit nebo vypsat nové volby. Soud podle ní naopak povolil kandidaturu,
    a tím zasáhl do voleb a „usurpuje si“ právo měnit věci proti zákonu. Vrabel doplňuje, že podobně se
    to podle něj dělo v Rumunsku a Polsku a že bez dělby moci „není demokracie“.
  citace:
  - text: že ústavní soud tady zasahuje do voleb a usurpuje si právo měnit cokoliv ve státě proti zákonu.
    cas: "16:31"
  - text: Jakmile tato věc je zrušená, tak není demokracie, protože není rozdělená moc ve státě.
    cas: "16:47"
  osoby:
  - {osoba: spd, vztah: neutralni, kontext: "Kandidovala pod sloučenou registrací, kterou měl soud podle Vítové zrušit"}
  mluvci: vladimira-vitova
- id: vrabel-2026-11-25-05
  typ: postoj
  temata:
  - politicky-system
  nadpis: Vítová — prezidentem nemůže být „traktorista“; Sládek jako jediný vhodný kandidát z vlastenecké
    scény (Vítová, 25. 11. 2026)
  text: Vítová kritizuje množství kandidátů na prezidenta z vlastenecké scény, kteří podle ní nemají zkušenosti
    ani šanci a budou se volit navzájem v bublinách. Prezident musí mít „historii“ a roky zkušeností
    jako odborník v oboru. Sládka označuje za vhodného, protože „prošel ohněm“ a jde o jeho myšlenky,
    ne o „impertinentní poznámky“; politickou kariéru mu i Paroubkovi podle ní zlikvidovali.
  citace:
  - text: Asi v politice patrně to nemůže být traktorista nebo zámečník nebo zdravotní sestra.
    cas: "18:21"
  osoby:
  - {osoba: miroslav-sladek, vztah: pozitivni, kontext: "Má podle ní zkušenosti a myšlenky, jeho kariéru „zlikvidovali“"}
  - {osoba: jiri-paroubek, vztah: pozitivni, kontext: "Podle ní mu zlikvidovali politickou kariéru, když hrozilo, že vyhraje"}
  mluvci: vladimira-vitova
- id: vrabel-2026-11-25-06
  typ: tvrzeni
  temata:
  - ceny-energie
  - valka-ukrajina-prubeh
  nadpis: Zdražení vody, tepla a energií slouží k financování války na Ukrajině (Vrabel, 25. 11. 2026)
  text: K zprávě o zvýšení poplatku za podzemní vodu Vrabel tvrdí, že stát nefunguje hůř než dřív a že
    reálné důvody zdražování jsou dva, inflace po covidu a válka. Zdražování vody, tepla, elektřiny i
    potravin a daní je podle něj především kvůli penězům pro Ukrajinu, protože náklady zbraní jsou řádově
    vyšší než v covidu.
  citace:
  - text: když se zdražuje voda, tak je jasný, že to je především kvůli tomu, aby bylo na financování
      války.
    cas: "22:39"
  - text: A zdražuje se to kvůli tomu, aby z našich kapes vytáhli peníze a mohli je dát Ukrajinců.
    cas: "26:04"
  osoby:
  - {osoba: ursula-von-der-leyen, vztah: negativni, kontext: "Její vyjádření o dalším financování Ukrajiny použito jako důkaz tlaku na zdražování"}
- id: vrabel-2026-11-25-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  - suverenita-eu
  nadpis: Von der Leyenová — deficit Ukrajiny 70–75 mld. eur na 2027 a „citové vydírání“ dětmi války
    (Vrabel, 25. 11. 2026)
  text: Vrabel komentuje projev von der Leyenové, podle níž je Ukrajina na rok 2026 pokryta a na rok 2027
    jí chybí 70–75 mld. eur, z čehož EU zaplatí 45 mld. Roční „90 miliard na dva roky“ z loňska se podle
    něj ukázalo jako nedostatečné a částky narůstají skokově. Apel na děti, které nezažily nic než válku,
    označuje za neetické citové vydírání politiků, kterému EU podle něj podléhá.
  citace:
  - text: A to je prostě absolutně citový vydírání a to je to, kde dneska stojí Evropská unie.
    cas: "27:14"
  osoby:
  - {osoba: ursula-von-der-leyen, vztah: negativni, kontext: "Obviněna z citového vydírání při žádosti o další peníze pro Ukrajinu"}
- id: vrabel-2026-11-25-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - media-propaganda
  nadpis: Rusko „útočí na Evropu“ je podle Vrabela vytváření strachu — kdyby to byla pravda, byla by Evropa
    rozbombardovaná (Vrabel, 25. 11. 2026)
  text: Vrabel o tvrzeních, že Rusko útočí na Evropu hybridními a kybernetickými útoky, drony a raketami,
    říká, že kdyby tomu tak bylo, měla by být Evropa už zničená. Šíření strachu podle něj slouží k vynucení
    peněz pro Ukrajinu a vyostřilo se od setkání Trumpa se Si Ťin-pchingem a Putinem.
  citace:
  - text: tak si to představte, že na nás Rusko útočí drony, raketami, hybridní útoky a kybernetické útoky
      a nevím co všechno, tak bychom tady už pravděpodobně měli rozbombardovanou Evropu, kdyby to tak bylo.
    cas: "27:46"
  osoby:
  - {osoba: donald-trump, vztah: neutralni, kontext: "Zmíněn jako účastník summitu v Šen-čenu"}
  - {osoba: vladimir-putin, vztah: neutralni, kontext: "Zmíněn jako účastník summitu v Šen-čenu"}
