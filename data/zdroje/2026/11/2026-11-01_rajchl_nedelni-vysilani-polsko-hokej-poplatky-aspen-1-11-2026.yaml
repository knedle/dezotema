vyroky:
- id: rajchl-2026-11-01-01
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Stížnost k Radě ČT na Jana Moláčka za „kukaččí mládě“; ČT zrušit, „ani korunu“ (Rajchl, 22.
    10. 2026)
  text: '**1. 11.** — Rajchl prohlašuje, že v otázce poplatků „neuhne ani o centimetr“, a navrhuje ve
    druhém čtení snížit rozpočet ČT na 1,5 miliardy na zpravodajství a publicistiku, zbytek z dobrovolných
    poplatků. ČT podle něj „není zárukou demokracie“ — tou je svoboda projevu —, jde jen o „8 miliard
    v příšeří“, které si „rodinné klany“ a „parazité“ rozdělují v externích kontraktech; na reportáž prý
    jezdí pět lidí místo dvou. Jako příklady uvádí Izrael (veřejnoprávní KAN placená z rozpočtu, uvažuje
    se o privatizaci, a tvrdší zákon FARA), 17 zemí EU bez poplatků (s ČR, Polskem a Slovinskem by jich
    bylo 20 z 27) a Nizozemsko, kde škrty 150 mil. eur nikoho nezajímají. Mandát má vláda od voličů, protesty
    jsou „frustrace menšiny, která prohrála volby“; jeho vlastní protesty proti Fialově vládě byly legitimní,
    protože ta podle něj vyhrála „podvodem“. Studentům vyčítá, že demonstrují za poplatky a odstřižení
    od ruského plynu, které sami neplatí („mama hotel“); kvůli zákazu vstupu ministrům Šťastnému a Klempířovi
    na DAMU navrhne zastavit její financování. Mikuláše Mináře znovu označuje za člověka, který „zdefraudoval“
    7 milionů a „měl by sedět ve vězení“, a za „sraba“, který se „vylhal“ z debaty pořádané Novinkami.'
  citace:
  - text: Česká televize není zárukou demokracie. To je lež, kterou tady neustále šíří libtardi, kteří
      nemají žádný věcný argument.
  osoby:
  - osoba: mikulas-minar
    vztah: negativni
    kontext: „Zdefraudoval“ 7 mil., „měl by sedět ve vězení“, „srab“
  - osoba: boris-stastny
    vztah: rozporuplny
    kontext: Respektuje jeho jiný názor na start Rusů; DAMU mu zakázala vstup
  podtema: Česká televize a mainstreamová média
- id: rajchl-2026-11-01-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Mediální lynč vs. selektivní ticho
  text: '**1. 11.** — K reakcím na svůj příspěvek o Báře Stárkové (Starkové), jedné z tváří protestů za
    ČT, Rajchl trvá na tom, že napsal jen „holá fakta“: prošla Aspen Institute a v roce 2025 tam získala
    ocenění pro mladé lídry. Aspen je podle něj „novodobá VUML“, která si testuje a „vymývá hlavy“ mladým
    kádrům, „eurokomsomolcům“, a pak je s penězi a médii vysílá do jednotlivých států — „geniální systém,
    klobouk dolů“. Hysterie kolem příspěvku podle něj prozradila, že protest „není spontánní“, ale řízený
    ze zahraničí. Odpůrcům (Štít demokracie, Milion chvilek) vyčítá „štvavé kampaně“ s nálepkami „nácek“
    a „zloděj“ na Babiše, Turka, jeho samého a jeho rodinu a zejména „bolševický“ lynč Natálie Vachatové
    kvůli bratrovi v Rusku včetně zveřejnění adresy její rodiny.'
  citace:
  - text: Aspen je VUML, novodobým VUML, který si řídili oni, velmi chytře, pozor, to si musí nechat.
  osoby:
  - osoba: bara-starkova
    vztah: negativni
    kontext: Absolventka Aspenu, „eurokomsomolka“ vyslaná řídit protest
  - osoba: natalie-vachatova
    vztah: pozitivni
    kontext: „Mladá, skvělá, inteligentní žena“, oběť „bolševického“ lynče
  podtema: Dvojí metr v médiích
- id: rajchl-2026-11-01-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Vyznamenání 28. října jako „fraška“: Hřebejk místo Zemana a Kundery; na Hrad nepůjde, dokud
    tam je „komunistický rozvědčík“ (Rajchl, 1. 11. 2026)'
  text: 'Rajchl tvrdí, že Pavel v projevu 28. října „zmotal“ Den české státnosti (28. září) se dnem vzniku
    Československa, což je další „degradace“ úřadu. Výběr vyznamenaných označuje za „frašku“: oceněn byl
    režisér Jan Hřebejk, kterého nazývá „notorickým alkoholikem“ a „ochlastou“ a jenž podle něj napsal,
    že „jsme propásli možnost vybombardovat hotel Štekl“, kde slavil Miloš Zeman s Ficem, Orbánem, Babišem
    i Rajchlem — což Rajchl vykládá jako výzvu k atentátu na politiky. Oceněn byl i fact-checker, „mladý
    svazák“, zatímco Zeman ani Milan Kundera ne; u Kundery spekuluje, že na něj Pavel jako příslušník
    rozvědky „možná chtěl získávat informace“. Na Hrad chodit nebude, dokud tam bude „komunistický rozvědčík“,
    který roku 1987 v životopise souhlasil s okupací. Současně kritizuje, že policie prověřuje komentáře
    pod jeho příspěvkem o Báře Stárkové, zatímco výroky typu Hřebejkova zůstávají bez trestu; komentujícím
    nabízí bezplatnou právní pomoc a k věci chystá interpelaci ministra vnitra Metnara.'
  citace:
  - text: My na jednu stranu oceňujeme člověka, který tady reálně vyzývá k atentátu na politické představitele,
      na druhé straně budeme trestněprávně stíhat […] nějaké komentující jedince na mém facebookovém profilu.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Komunistický rozvědčík“, „etalon pokleslosti“, vyznamenání jako „fraška“
  - osoba: jan-hrebejk
    vztah: negativni
    kontext: „Notorický alkoholik“, „ochlasta“, vyzval k „vybombardování“ hotelu Štekl
  - osoba: milos-zeman
    vztah: pozitivni
    kontext: Jedna ze tří nejvýznamnějších postav po listopadu, měl být vyznamenán
  - osoba: milan-kundera
    vztah: pozitivni
    kontext: Jeden z nejvýznamnějších literátů, měl být vyznamenán
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-11-01-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Polsko: „ústavní puč“ Tuskovy vlády jako boj EU o polskou suverenitu (Vrabel, 31. 10. 2026)'
  text: '**1. 11. (Rajchl)** — Rajchl označuje dění v Polsku za „puč přes Ústavní soud“: Tusk se svými
    „kumpány“ využil Nawrockého cesty do Senegalu a suspendoval předsedu soudu, aby uvedl do funkce tři
    soudce, které prezident podle ústavy nepotvrdil a jejichž jmenování podle něj nařídila EU. Nawrocki
    „není Petr Pavel“ a zachoval se „nesmírně statečně“; připomíná i video údajného policejního provokatéra
    s nožem v davu. V ČR se podle něj „hraje o totéž“ přes poplatky, v Polsku přes Ústavní soud — jde
    o koordinovanou snahu sesadit vlády odmítající „bruselskou nadvládu“ a hrozí „rumunský scénář“. Podepisuje
    výzvu Jarosława Kaczyńského zrušit Evropskou komisi, nebo odejít z EU; pokud v Polsku vyhraje PiS
    s Konfederacemi, stane se Polsko „hlavním hybatelem rozštěpení EU“ a ČR, Slovensko a Maďarsko by se
    měly přidat.'
  citace:
  - text: Buď to zrušíme Evropskou komisi a centralizaci moci z Bruselu, nebo pojďme odejít z Evropské
      unie.
  osoby:
  - osoba: karol-nawrocki
    vztah: pozitivni
    kontext: „Prezident na svém místě“, zachoval se „nesmírně statečně“
  - osoba: donald-tusk
    vztah: negativni
    kontext: S „kumpány“ provádí puč přes Ústavní soud
  - osoba: jaros-aw-kaczynski
    vztah: pozitivni
    kontext: „Absolutně podepisuju“ jeho výzvu zrušit Komisi, nebo odejít z EU
  podtema: Česká suverenita
- id: rajchl-2026-11-01-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Návrat ruské reprezentace na MS v hokeji: „politika do sportu nepatří“, kritici jsou „pokrytci
    a farizejové“ (Rajchl, 30. 10. 2026)'
  text: '**1. 11.** — V nedělním vysílání Rajchl tezi rozvádí: jako bývalý sportovec a komentátor NFL
    by nechtěl vyhrát turnaj bez favoritů a připomíná olympiádu v Soulu 1988, která podle něj po bojkotech
    Moskvy a Los Angeles přispěla k ukončení studené války. Ruští hráči sdílejí kabiny v NHL a zákaz startu
    je „kolektivní vina“. ČR podle něj není s Ruskem ve válce, jde o konflikt podobný studené válce, a
    v historii nikdo nevylučoval sportovce kvůli válkám vlastní země (Afghánistán, Libye, Falklandy);
    útok USA na Írán bez mandátu RB OSN je podle něj „z právního hlediska naprosto totožný“ s útokem Ruska
    na Ukrajinu. Kritikům vyčítá dvojí metr: rozhodnutí Ústavního soudu o cestě Pavla do Ankary se „musí
    respektovat“, rozhodnutí CAS chtějí bojkotovat. Mistrovství by využil k apelu na příměří; chválí Filipa
    Turka, s nesouhlasem ministra Šťastného (Motoristé) se míjí.'
  citace:
  - text: Tak buď tedy respektujeme všechno, nebo nic.
  podtema: Zahraniční aktéři a precedenty
