    rozštěpení Evropské unie“.
  citace:
  - text: Protlačíme tu změnu, tak všichni po roce, po dvou letech uvidí, že se nestalo vůbec nic a bude
      po hysterii.
  predikce:
    horizont: 1–2 roky; polské parlamentní volby 2027
