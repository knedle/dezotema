- id: vrabel-2026-11-21-02
  typ: postoj
  temata:
  - politicky-system
  nadpis: Anarchie je pro Vrabela přijatelnější než „dnešní diktatura“; kapitalismus je „peklo“ a „feudální
    fašismus“ musí skončit (Vrabel, 21. 11. 2026)
  text: 'Na okraj protestů Vrabel říká, že anarchii, pokud by v ní existovalo právo, ideologicky neodsuzuje
    a je pro něj přijatelnější než „diktatorství“, které podle něj dnes máme. S lidmi z krajní levice se
    částečně shoduje v požadavku svobody a v kritice kapitalismu, který „je peklo a vede do pekla“. Systém,
    v němž 1 % drží 99 % majetku a ostatní splácejí hypotéky 40 let, nazývá „feudálním fašismem“, který
    musí skončit; předpokládá, že lidé budou kvůli pokračující politice vlád povstávat dál a může dojít
    ke změně systému. Zároveň předjímá, že mu tento výrok někdo vystřihne a bude ho prezentovat jako propagaci
    demonstrací.'
  citace:
  - text: Rozhodně je pro mě anarchie přijatelnější, než nějaký diktátorství, který máme dneska.
    cas: "10:50"
  - text: tak částečně se s nima shoduju, protože ten současný kapitalismus prostě je peklo a vede do pekla.
    cas: "11:42"
  - text: Ten feudální fašismus tak musí skončit.
    cas: "23:14"
  vazby:
  - {na: vrabel-2026-10-25-04, typ: posun}
  podtema: Politická kultura
- id: vrabel-2026-11-21-03
  typ: postoj
  temata:
  - politicky-system
  - valka-ukrajina-prubeh
  nadpis: Okamura po dlouhé době „kredit“ za odmítnutí vojáků na Ukrajině; Ivan David „jediný normální politik“
    (Vrabel, 21. 11. 2026)
  text: 'Vrabel poslouchal Okamuru v televizi a po „dlouhé době“ mu dává „nějaký kredit“, protože je proti
    posílání vojáků na Ukrajinu; za příčinu pokládá jeho zapletení do cvičení v Polsku a „velkým bojovníkem“
    ho nevidí. Ivana Davida, který v televizi tvrdil, že Putin válku nechtěl, označuje za „jediného normálního
    politika ve veřejné funkci“ a poznamenává, že moderátorka mu skákala do řeči jako kdysi jemu v ČT. Tím
    se částečně vzdaluje od dřívějšího hodnocení Okamury jako součásti systému, který má být odstaven.'
  citace:
  - text: Takže po dlouhé době prostě dávám nějaký kredit Tomě Okamurovi.
    cas: "19:15"
  - text: Ivan David je podle mě jediný normální politik v nějaký veřejný funkci, kterýho máme v tuto chvíli
    cas: "24:41"
  osoby:
  - {osoba: tomio-okamura, vztah: rozporuplny, kontext: 'Po dlouhé době „kredit“ za odmítnutí vojáků na Ukrajinu, ale „ne velký bojovník“'}
  - {osoba: ivan-david, vztah: pozitivni, kontext: '„Jediný normální politik“ ve veřejné funkci'}
