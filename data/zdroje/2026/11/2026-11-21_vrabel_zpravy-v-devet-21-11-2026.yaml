  - {osoba: ivanka-trumpova, vztah: negativni, kontext: 'Vypráví o soukromém ostrově: „takhle by měl žít každý člověk“'}
  - {osoba: edi-rama, vztah: negativni, kontext: 'Kushner ho chválil jako „skvělého vůdce, umělce“'}
  - {osoba: ned-rothschild, vztah: negativni, kontext: 'Jachta, na které Ivanka Trumpová ostrov objevila'}
