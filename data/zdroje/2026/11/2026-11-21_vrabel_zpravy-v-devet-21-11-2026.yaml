  nadpis: Putin a Rusové válku nechtěli — chtěli jednat od roku 2021, video „nacistů“ v Kyjevě (Vrabel, 21.
    11. 2026)
  text: 'Ke zprávě o Trumpově telefonátu s koalicí ochotných (Putin má zájem o mír, Trump pochybuje o dalších
    miliardách pro Ukrajinu) Vrabel opakuje své vysvětlení války: Putin a Rusové ji nechtěli, chtěli jednat
    už od roku 2021, nesouhlasili s „nacisty“ na Ukrajině a s vojenskými základnami kolem Ruska a invazí
    chtěli posunout frontu dál od Moskvy. Ukazuje video z Kyjeva, kde podle něj Ukrajinci pochodují v nacistických
    uniformách se symboly Pravého sektoru, a tvrdí, že stačí věci veřejně pojmenovat a řešení se najde.'
  citace:
  - text: Vladimír Putin a Rusové nechtěli válku.
    cas: "26:47"
