  nadpis: Finské vyšetřování ruského vrtulníku při záchranné akci je „trapné a ubohé“ (Vrabel, 21. 11. 2026)
  text: 'K podezření, že ruský vrtulník při záchraně posádky zasažené lodi narušil finský vzdušný prostor
    o 4,1 km, Vrabel říká, že jako pilot ví, že 4 km je „kousek“ a nelze to přesně změřit; při záchraně
    životů se podle něj nikdo neohlíží na „imaginární čáru“. Finům vyčítá, že z toho dělají tragédii.'
  citace:
