- id: vrabel-2026-11-21-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  - valka-nato-rusko
  nadpis: NATO „nebude bránit každý centimetr“ — neumí sestřelit raketu ani dron při špatném počasí; Rusko
    by Evropu rozmlátilo za pár měsíců (Vrabel, 21. 11. 2026)
  text: 'Ke Rutteho slibu ve Varšavě, že NATO ubrání každý centimetr polského území, Vrabel namítá, že dvě
    ruské rakety a dron dopadly na polské území a NATO je podle oficiálního vyjádření nesestřelilo kvůli
    špatnému počasí. Z toho usuzuje, že Evropa nemá protivzdušnou obranu a že by ji Rusko při opakovaných
    náletech třech tisíc dronů a stovky raket Iskander rozbilo během několika měsíců; armády by se sice
    daly postavit, ale ne se bránit dronům. Rutteho prohlášení označuje za „silácká vyjádření“ a doporučuje
    politikům říct pravdu, že je nutné udělat s Ruskem mír, protože válka by znamenala „po Evropě“.'
  citace:
  - text: protože NATO není schopný střílet, když je špatný počasí.
    cas: "41:54"
  - text: tak rozmlátí tu Evropu během pár měsíců, na cimpr-campr nezůstane kámen na kameni.
    cas: "43:43"
  osoby:
  - {osoba: mark-rutte, vztah: negativni, kontext: 'Slibuje bránit „každý centimetr“, ale NATO neumí sestřelit rakety a drony'}
