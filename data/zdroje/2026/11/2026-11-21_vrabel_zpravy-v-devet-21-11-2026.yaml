  nadpis: Strach z války jako způsob, jak čerpat peníze „z ruky“ bez výběrových řízení — stejně jako u covidu
    (Vrabel, 21. 11. 2026)
  text: 'K mimořádnému jednání NATO opakuje, že válečný i covidový strach slouží k čerpání peněz od lidí
    bez veřejných zakázek a s přirážkami, tedy ke korupci; politici si podle něj nepočítají, že to nejde
    donekonečna. Přiznává, že téma je pro posluchače nudné, ale tlačit na mír je nutné.'
  citace:
