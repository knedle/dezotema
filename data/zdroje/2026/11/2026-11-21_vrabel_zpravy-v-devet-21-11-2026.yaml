  nadpis: Protesty v Albánii a Srbsku proti Kushnerovi a „papalášům“, kteří si „mohou koupit, co chtějí“
    (Vrabel, 21. 11. 2026)
  text: 'K týdenním protestům v Tiraně Vrabel připomíná příběh Ivanky Trumpové o ostrově u Albánie, který
    s Nathanem Rothschildem objevili, a o setkání s premiérem Ramou, kterého Kushner chválil jako „skvělého
    vůdce, umělce“. Takoví „papaláši“ si podle něj myslí, že si mohou koupit, co chtějí, ale v Albánii ani
    v Srbsku jim to nevyšlo: Kushner byl v Srbsku vypískán a smlouva na jeho hotel byla zrušena bez nároku
    na náhradu. Dodává, že je třeba se postavit okrádání a že o tom mluví od roku 2022.'
  citace:
  - text: Jsou to prostě papaláši, kteří si myslí, že si můžou koupit, co chtějí a v Albánie jim na to neskočili.
    cas: "22:08"
  osoby:
