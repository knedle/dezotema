  rezim: vrabel
  poznamka: '1 h 28 min, sobotní vysílání se spolumoderátorkou Zuzkou (od 3:01). 25 témat v denním přehledu,
    21 z nich s vlastním úhlem (⚡) ve 18 výrocích. Predikce: 4 (Trump odsouzen za podvody, Kushnerův projekt
    v Albánii, ČR bez výstupu z EU a hranic, rozpad EU a konec možnosti protestovat). Stochastický teror:
    1 hraniční (Trump „bude odsouzený za podvody, mělo by to tak být“ — výzva k trestnímu postihu bez násilí
    a bez dehumanizace).
    Zpracováno podle podkladů pomocného agenta, citace ověřeny v přepisu.'
  prehled:
  - tema: Návrh rozpočtu EU na 2028–2034
    text: Costův návrh (1,582 bil. eur, 3% digitální daň) komentuje jen tím, že rozpočet má dělat samostatná
      ČR a s EU stačí obchod bez cel; společný rozpočet by dával smysl jen v obnoveném Československu.
  - tema: Protiválečné studentské stávky v Evropě
    text: studenti ve 25 zemích protestují proti válce, čeští studenti na Letné naopak za zbrojení, a jsou
      prý zmanipulovaní shora.
    vyrok: vrabel-2026-11-21-01
  - tema: Antifa, anarchie a kapitalismus
    text: anarchie je pro něj přijatelnější než „diktatura“, současný kapitalismus je „peklo“ a „feudální
      fašismus“ musí skončit.
    vyrok: vrabel-2026-11-21-02
  - tema: Protest studentů v Bratislavě
    text: demonstrace studentů proti Ficovi je podle něj řízená po celém Západě přes média a sociální sítě (opakuje).
    vyrok: vrabel-2026-11-21-01
  - tema: Okamura v televizi
    text: za odmítnutí posílat vojáky na Ukrajinu mu po dlouhé době dává „kredit“.
    vyrok: vrabel-2026-11-21-03
  - tema: Protesty v Tiraně
    text: Albánci se nenechají okrást; příběh Ivanky Trumpové, Rothschilda a Kushnera na ostrově a Rama jako
      „skvělý vůdce“.
    vyrok: vrabel-2026-11-21-04
  - tema: Trump s koalicí ochotných o dalším financování Ukrajiny
    text: Putin podle něj válku nechtěl (Ivan David má pravdu), ukazuje video z Kyjeva s „nacistickými“ uniformami
      (opakuje).
    vyrok: vrabel-2026-11-21-05
  - tema: Protiválečná studentská demonstrace v Praze
    text: aspoň někteří studenti protestují proti válce, nabízí podporu a zvolání lidí na další akci.
    vyrok: vrabel-2026-11-21-01
  - tema: Trump chce s Íránem trvalou dohodu
    text: Trump „strašná lumpárna“, válka s Íránem byla o ropě, plynu a zisku jeho přátel, po dohodě s Putinem
      by ho podrazil.
    vyrok: vrabel-2026-11-21-06
  - tema: Íránský ministr zahraničí o diplomacii
    text: Íránci chtějí být bez války jako Rusové; Trump už dvakrát zaútočil během jednání, překvapení znovu
      nevyužije.
    vyrok: vrabel-2026-11-21-06
  - tema: Ruská loď Sparta 2 zasažena drony ve Finském zálivu
    text: Rusko je ve válce, ztráty se musejí čekat; ať válka skončí.
  - tema: Ruský vrtulník u finského vzdušného prostoru
    text: finské vyšetřování při záchranné akci označuje za „trapné a ubohé“.
    vyrok: vrabel-2026-11-21-07
  - tema: Hegseth omezuje vojenskou spolupráci USA s Kanadou
    text: bez komentáře.
  - tema: Obnoven železniční provoz na Krymském mostě
    text: „most je spravený“, silniční provoz bude náročnější.
  - tema: Rutte ve Varšavě
    text: NATO neubránilo ani polské území před raketami, protože bylo „špatné počasí“; Evropa je bezbranná.
    vyrok: vrabel-2026-11-21-08
  - tema: Mimořádné jednání NATO v pondělí
    text: válečný strach slouží k čerpání peněz „z ruky“ bez výběrových řízení jako u covidu (opakuje).
    vyrok: vrabel-2026-11-21-09
  - tema: Poplach v Kaliningradu
    text: „nejslabší místo“ pro rozehrání války; připomíná dvě brigády Babiše a hrozbu mobilizace.
    vyrok: vrabel-2026-11-21-10
  - tema: Návrh Kushnera a Witkoffa (Donbas za záruky)
    text: pro Rusko by to muselo znamenat „mnohem větší kapitulaci Ukrajiny“, dohoda by byla křehká.
    vyrok: vrabel-2026-11-21-11
  - tema: EU chce usnadnit pobyt ukrajinským uprchlíkům
    text: „Česká republika si mění na Česko-Ukrajinsko“, Ukrajince je třeba podpořit k návratu.
    vyrok: vrabel-2026-11-21-12
  - tema: FBI vyšetřuje další hackerský průnik
    text: kyberútoky a problémy s bankami mají podle něj připravit půdu pro digitální měnu.
    vyrok: vrabel-2026-11-21-13
  - tema: Německo druhým největším cílem migrantů v OECD
    text: migrační politika je „poředění národa“ a vlády (Merz, Trump, Babiš) slib zastavit migraci nesplňují.
    vyrok: vrabel-2026-11-21-14
  - tema: Le Penová a zbraně pro Ukrajinu
    text: volby nefungují, politici jsou závislí na médiích, sponzorech a zbrojařích; nutná změna systému
      a závazné předvolební programy.
    vyrok: vrabel-2026-11-21-15
  - tema: Vánoční trhy a bezpečnostní opatření
    text: za zátarasy stojí „džihád“; vystoupit z EU a uzavřít hranice, jinak je šance, že se to u nás
      nestane, „0 %“.
    vyrok: vrabel-2026-11-21-16
  - tema: Případ Russella Branda
    text: trest 10,5 roku a návrh zákazu styku s rodinou po vzkazu z vězení označuje za nedoložený a pomstychtivý
      systém.
    vyrok: vrabel-2026-11-21-17
  - tema: Výstup z EU a kritika „čekání“
    text: dnes je výstup z EU ještě možný, později ne; kritizuje Rajchla a další, kteří chtějí „počkat rok“.
    vyrok: vrabel-2026-11-21-18
