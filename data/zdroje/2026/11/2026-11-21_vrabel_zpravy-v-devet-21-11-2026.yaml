- id: vrabel-2026-11-21-06
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Trump a Írán: „strašná lumpárna“ kvůli ropě, plynu a zisku přátel; Vrabel mu „nevěří nos mezi očima“
    (Vrabel, 21. 11. 2026)'
  text: 'Trumpovu nabídku trvalé dohody s Íránem a slova, že změna režimu není priorita, Vrabel odmítá jako
    krytí prohry: Trump podle něj „vyvraždil“ íránské vedení, nepodařilo se mu vyměnit režim a teď hledá
    dohodu, aby neztratil tvář, přestože předchozí jadernou dohodu Írán dodržoval. Celou válku vykládá jako
    akci kvůli ropě a plynu, uzavření Hormuzu a zisku Trumpových přátel a akcií. Dvakrát prý Trump zaútočil
    během mírových jednání, takže „moment překvapení“ už Íránci nepustí; označuje to za „zákeřné“ a Trumpa
    za člověka, který se klidně dohodne s Putinem a pak ho podrazí. Írán podle něj chce válku ukončit diplomaticky
    stejně jako Rusko.'
  citace:
  - text: Takže tady prostě Donald Trump, tohleto, co vytvořil Donald Trump, je strašná lumpárna.
    cas: "31:28"
  - text: A říkal jsem vám, že prostě Donaldu Trumpovi nevěřím nos mezi očima.
    cas: "58:40"
  osoby:
  - {osoba: donald-trump, vztah: negativni, kontext: '„Strašná lumpárna“ na Blízkém východě, nespolehlivý a zákeřný'}
  vazby:
  - {na: vrabel-2026-09-27-06, typ: posun}
  podtema: Írán a Hormuz
