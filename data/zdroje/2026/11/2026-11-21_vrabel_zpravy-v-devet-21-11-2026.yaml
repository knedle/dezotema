  nadpis: Studenti v 25 evropských zemích protestují proti válce, čeští na Letné „za zbrojení“ — zmanipulovaní
    shora; Vrabel nabízí podporu protiválečným studentům (Vrabel, 21. 11. 2026)
  text: 'Ke zprávě o britské protiválečné stávce a protestech v Bratislavě a Praze Vrabel tvrdí, že v 25 zemích
    studenti demonstrují proti válce a zbrojení, kdežto čeští studenti na Letné 15. 11. žádali víc zbraní,
    odvolání SPD a ministra obrany. Letnou podle něj nařídili shora děkani a rektoři, studenti jsou „zmanipulovaní“
    a „zneužitelní“, protože v době řízených sociálních médií se dá po celém Západě snadno vyvolat protivládní
    vlna; Fico je prý „další na řadě“ a v Česku jde o Babiše a SPD (agenda 2030). Studenty, kteří zbrojení
    podporují, označuje za „idioty“ a vyzývá je, aby se přidali k evropskému hnutí. Menší pražskou protiválečnou
    demonstraci (podle komentářů 150–300 lidí) vítá a nabízí, že pokud mu někdo sežene kontakt na organizátory,
    pomůže s mobilizací dalších lidí.'
  citace:
  - text: U nás studenty v podstatě demonstrují za to, aby se víc zbrojilo proti Rusku, aby se víc zbrojilo,
      aby se víc pomálo Ukrajině.
    cas: "12:55"
  - text: Všude jinde studentstvo, i když je zmanipulovaný a jde proti těm vládám, tak si ale uvědomuje, že
      zároveň nechce jít do války.
    cas: "19:59"
  osoby:
  - {osoba: robert-fico, vztah: pozitivni, kontext: 'Podle Vrabela „další na řadě“ při řízených studentských protestech'}
  - {osoba: andrej-babis, vztah: neutralni, kontext: 'V Česku „na řadě“ spolu s Okamurou a SPD'}
  - {osoba: spd, vztah: pozitivni, kontext: 'Studenti na Letné požadovali její odstavení kvůli omezování zbrojení'}
