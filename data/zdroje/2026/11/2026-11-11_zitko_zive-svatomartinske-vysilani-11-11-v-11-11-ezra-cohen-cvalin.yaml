  poznamka: '1 h 25 min, „svatomartinské vysílání“ k „portálu 11.11.“. Vlastní řeč tvoří asi 35–40 %,
    zbytek je předčítání (meditační texty, 17 bodů Ezry Cohena, článek Petra Cvalína, Quantum Mesh) a
    promo. Zpracováno 10 témat a 1 nová predikce, k predikci z 5. 11. doplněn Super Bowl. Stochastický
    teror nezjištěn, „Obama už byl popravený, bude s ním proces“ je tvrzení, ne výzva. Zpracováno podle
    shrnutí pomocného agenta. Soubor: (shodný duplikát s jinou URL: [přepis _1](prepisy/done/2026-11-12_Československo-TV2_jana-peterkova-official-3-vysílala-živě_1.txt),
