  text: 'Zítko tvrdí, že elity plánovaly lidi „vypnout“ frekvencemi 5G a držet je v „15minutových městech“
    jako v „digitálním koncentráku“, protože se šíří myšlenka „přebytečných jedlíků“. Že je Země přelidněná,
    je podle něj „kec“: Země je „podstatně větší“ a „za ledovou stěnou“, kterou podle něj střeží 56 zemí,
    je další svět. Firma Cetin Petra Kellnera stála podle něj před dilematem Huawei, nebo americký Ericsson,
    a „možná“ to byl důvod nehody vrtulníku na Aljašce. Kellner podle něj „možná je v ochraně svědků“.
    Předčítá text, podle kterého se sítě 5G 27. 10. přepnuly na „Quantum Mesh“ napojený na Starlink (340
    tisíc věží, 78 milionů chytrých měřičů), což má lidem zlepšit spánek.'
