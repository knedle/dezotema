  text: '**11. 11.** — Ve „svatomartinském“ vysílání v 11:11 (z velké části předčítané meditační texty
    k „portálu 11.11.“) Zítko komentuje „17 bodů Ezry Cohena“. Tvrdí, že přes 900 „mrtvých“ celebrit vystoupí
    veřejně, „věří“, že se objeví na Super Bowlu 14. 2. 2027, a komunita Q prý slíbila koncert, proti
    kterému bude Super Bowl „dětská zábava“. Uvádí 700 tisíc zapečetěných obžalob, 200 tisíc „bytostí“
    z central castingu a NESARA/GESARA se zlatým krytím, smazáním dluhů, kvantovým telefonem, MED-BEDS
    a 6 000 patenty (Tesla). Trump má podle něj díky „red pill“ deskám vojenské pravomoci, armáda řídí
    USA od roku 2017 a všechny země se mu tehdy podřídily. Špička deep state byla podle něj popravena
    v prvním Trumpově období a dnes „vidíte pouze herce“. Stephen Miller podle něj „právě jmenoval osoby,
    které budou podrobeny vojenskému soudu za zradu“ a „Obama už byl dávno popravený, ale bude s ním proces“,
    vše „v repríze, aby nevznikla občanská válka“. Trump a Putin jsou podle něj proti deep state „naprosto
    jednotní“ („ples upírů skončil“). EBS se „může aktivovat brzo“ a „někteří predikují 17. listopadu,
    jako dárek k výročí puče StB a KGB“. Státy prý připravují karanténu na 3–33 dní, během níž se přesune
    globální bohatství (zlato z tunelů pod Vatikánem, „43 kvadrilionů“). QFS bude podle něj možná oficiálně
    zapnut 22. 11. a SWIFT je „už v podstatě mrtvý“. V Abú Zabí je Ukrajina podle něj jen „sekundant“
    a „karty rozdávat bude Donald Trump“. Elity podle něj své plány roky oznamovaly symbolikou ve filmech
    a na olympiádách (Barcelona 1992, Londýn 2012) a mlčení lidí bylo „karmickým souhlasem“.'
  citace:
