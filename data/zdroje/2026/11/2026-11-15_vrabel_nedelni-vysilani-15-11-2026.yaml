- id: vrabel-2026-11-15-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 454 mld. eur na obranu za jediný rok jako vysvětlení drahoty; úspory Evropanů (10 bilionů eur)
    skončí ve zbrojních firmách „za zády lidí“ (Vrabel, 10. 11. 2026)
  text: '**15. 11.** — Pokles cen zlata, stříbra a kryptoměn je podle Vrabela „plundrování lidí“ vysokými
    úroky a záměrně drahými energiemi („to všechno je extrémně drahé schválně“). Velké banky podle něj
    stlačují cenu papírového zlata a skupují fyzické. Radí zlato a stříbro neprodávat, držet fyzické kovy
    v malých mincích a nemovitosti mimo EU, hotovost, akcie a banky považuje za riziko, protože se připravují
    digitální měny CBDC. Pro většinu lidí je podle něj nejdůležitější bezpečné místo, jídlo, voda a teplo.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-11-15-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by Evropu dobylo bez jaderných zbraní — 3 000 dronů a 100 iskanderů denně; „Rusko vyhraje
    s 99,9% pravděpodobností“ (Vrabel, 15. 11. 2026)
  text: Vrabel rozvíjí scénář, v němž se Trump, Putin a Si dohodnou na sférách vlivu a USA veřejně vyloučí
    jaderné krytí Evropy. Rusko by pak podle něj dokázalo Evropu porazit konvenčně, protože zvládne 3
    000 dronů a 100 iskanderů denně, zatímco Evropa nemá protivzdušnou obranu. Ruská sféra vlivu by podle
    něj sahala „na východ od Prahy nebo až po Prahu“. S odkazem na Scotta Rittera tvrdí, že Rusko si nemůže
    dovolit čekat do let 2029–2030, až se Evropa nazbrojí, a rozhodnutí podle něj už padlo. Jadernou válku
    považuje za „velmi málo pravděpodobnou“, obává se ale náhodného zásahu jaderného skladu v ČR. Válka
    podle něj není jen o nerostech, ale o novém světovém systému (digitální měny, DSA, chat control, tokenizace
    přírody), kvůli kterému je třeba zničit „pravoslavný suverénní ruský národ“. Globalisté podle něj
    ovládli USA („zabili Kennedyho“, Deep State, Fed) a Evropu a teď chtějí Rusko a Čínu. Vystoupení z
    NATO podle něj obchod neohrozí a odchod z EU by nahradily bilaterální smlouvy, opačná tvrzení (Vladimír
    Štěpán) jsou „strašák“.
  citace:
  - text: Rusko si nemůže dovolit čekat do roku 2029, do roku 2030 a nechat se bombardovat Evropou.
  osoby:
