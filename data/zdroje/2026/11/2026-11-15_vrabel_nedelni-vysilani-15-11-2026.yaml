  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-15-05
  typ: predikce
  temata:
  - politicky-system
  nadpis: vláda nevydrží, přijdou předčasné volby s odstavením SPD, Trikolory, PRO, Svobodných a možná
    Motoristů; Rusko vyhraje „s 99,9% pravděpodobností“ a Evropa vstoupí do konfliktu
  text: Babišova vláda podle něj nevydrží celé volební období. Přijdou „pravděpodobně předčasné“ volby,
    v nichž budou „vyměněni“ SPD, Trikolora, PRO, Svobodní a možná Motoristé, a Babiš zůstane s Fialou
    a Rakušanem, nebo bude vyměněn. Studentstvo bude dál sílit. Rusko válku vyhraje „s 99,9% pravděpodobností“
    a Evropa se do konfliktu zapojí.
  citace:
  - text: Dopadne to volbama, pravděpodobně předčasnýma, kde budou vyměněný SPD, Trikolora, Pro a Svobodný
      a možná i Motoristy.
