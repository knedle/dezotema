- id: vrabel-2026-11-20-01
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - jaderne-zbrane
  nadpis: 'Po summitu Trump–Putin–Si skončilo „období klidu“: USA a Rusko si slíbily nepoužití jaderných zbraní, každý jde „svou cestou“ (Vrabel, 20. 11. 2026)'
  text: |
    Vrabel říká, že před týdny předpovídal, že po amerických volbách a mezinárodních jednáních „skončí období klidu“, a to se stalo. Putin podle něj dostal od USA ujištění, že na Rusko neútočí jaderně, pokud se Rusko dostane do konfliktu s Evropou, a Trump naopak ujištění, že Rusko nepoužije jaderné zbraně, kdyby USA zaútočily na Írán. Trumpovo „to je můj kamarád“ prý ukázalo světu, že USA se do války proti Rusku nechystají. Po obnově závazků si podle něj „zase každý jde svou cestou“.
  citace:
  - text: Ty nám včera skončily a říkal jsem vám, že nám to skončilo, to období klidu.
    cas: "08:06"
  - text: A teď nám skončila doba klidu.
    cas: "09:20"
  osoby:
  - {osoba: donald-trump, vztah: negativni, kontext: 'Dal Putinovi ujištění o nepoužití jaderných zbraní výměnou za volnou ruku proti Íránu'}
  - {osoba: vladimir-putin, vztah: neutralni, kontext: 'Podle Vrabela dostal od USA jaderné ujištění ve vztahu k Evropě'}
  vazby:
  - {na: vrabel-2026-11-18-09, typ: posun}
- id: vrabel-2026-11-20-02
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - nato-zbrojeni-militarizace
  nadpis: 'Ruské úlomky v Polsku: dopadly jen kusy raket a dronů, „není to útok“; Tusk mluví o provokaci, Rutte o posilování odstrašení (Vrabel, 20. 11. 2026)'
  text: |
    K zprávě o ruských raketách a dronu, které dopadly v Polsku, Vrabel říká, že přesně odpovídá jeho předpovědi: nespadl celý dron, jen „tři úlomky“ a zbytky dvou dronů, takže nejde o výbuch ani o útok. Polský premiér Tusk mluví o „provokaci“, což podle něj znamená, že není důvod aktivovat článek 5, a incident posílí jednotu koalice ochotných a EU. Prezidentovo varování, že rakety a drony mohou dopadat i na ČR, bere vážně, protože ho vyslovuje armádní generál. Rutteho cestu do Varšavy a řeči o posilování odstrašení srovnává s odzbrojováním, o kterém se mluvilo v Šen-čenu.
  citace:
  - text: konec konců, ono se toho zase tak moc nestalo. Oni spadli jenom tři úlomky,
    cas: "10:11"
  - text: Což je fajn, protože jestli to je provokace, tak to není útok. To znamená, není potřeba aktivovat za tím článek 5.
    cas: "13:08"
  - text: tak Mark Rutek mluví o tom, že budeme posilovat odstrašující schopnosti.
    cas: "15:21"
  osoby:
  - {osoba: donald-tusk, vztah: negativni, kontext: 'Označil incident za „provokaci“, ironicky, že tím odpadá článek 5'}
  - {osoba: petr-pavel, vztah: negativni, kontext: 'Varoval před dopady ruských raket na ČR; Vrabel ironicky „děkuje“, ale varování bere vážně'}
  - {osoba: andrej-babis, vztah: rozporuplny, kontext: 'Odsoudil narušení vzdušného prostoru a nabídl Polsku pomoc, čekal by od něj jiný postoj než od Fialy'}
  - {osoba: ursula-von-der-leyen, vztah: negativni, kontext: 'Vyjádřila Polsku „solidaritu“, Vrabel ironizuje odkaz na polské hnutí Solidarita'}
  - {osoba: mark-rutte, vztah: negativni, kontext: 'Mluví o posilování odstrašení, přestože se v Šen-čenu mluvilo o odzbrojování'}
  - {osoba: wes-streeting, vztah: negativni, kontext: 'Britský ministr obrany označil incident za ruskou provokaci, Vrabel ironizuje, že se to naučil od Tuska'}
  vazby:
  - {na: vrabel-2026-11-16-05, typ: posun}
- id: vrabel-2026-11-20-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  - valka-nato-rusko
  nadpis: 'Americké základny a vojska koalice na Ukrajině: Rusko je nepřipustí, kvůli tomu válku zahájilo; „patová situace“ (Vrabel, 20. 11. 2026)'
  text: |
    Zelenský říká, že by uvítal americké základny na Ukrajině jako na Blízkém východě, a Vrabel dodává, že Lavrov označil právě to za důvod zahájení „speciální vojenské operace“. Představu, že by Rusové po příměří souhlasili s vojsky koalice ochotných na Ukrajině, označuje za „prostý nesmysel“: Rusko chce nárazníkovou zónu a Evropa s Ukrajinou naopak co nejvíce vojáků v zemi. Výsledkem je podle něj „patová situace“, boje pokračují a vojska koalice „trénují blíž a blíž“ k Ukrajině; Francouzi už vojáky poslali a EU její misi otevřela, takže se postupně „otvírají dveře“. Zelenského je podle něj „normálně líto“, protože je „brutálně nateklej“ a musí mít „játra z toho kokainu úplně zničený“.
  citace:
  - text: no tak to je samozřejmě na prostý nesmysel.
    cas: "19:59"
  - text: Ale celá ta operace přece začala, jedním z těch cílů speciální vojenské operace byl, aby Rusko zajistilo bezpečnost pro sebe.
    cas: "21:58"
  - text: Je ho normálně líto, když ho vidím, jak je úplně brutálně nateklej, ten musí mít játra z toho kokainu úplně zničený chudák.
    cas: "18:39"
  osoby:
  - {osoba: volodymyr-zelenskyj, vztah: negativni, kontext: 'Chce americké základny na Ukrajině; Vrabel o něm hovoří jako o uživateli kokainu s poškozeným zdravím'}
  - {osoba: sergej-lavrov, vztah: pozitivni, kontext: 'Cituje jeho výklad, že západní základny na Ukrajině jsou důvodem války'}
  - {osoba: wes-streeting, vztah: negativni, kontext: 'Prohlásil, že síly koalice jsou připravené nastoupit na Ukrajině po skončení bojů'}
  vazby:
  - {na: vrabel-2026-11-03-03, typ: posun}
  - {na: vrabel-2026-11-13-05, typ: souhlas}
- id: vrabel-2026-11-20-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  - petr-pavel
  nadpis: 'Cvičení Koalice 26.2 a česká účast; „normalizace války“ — lidé si nevšimnou, že mizí, nejdřív „vlastenci“, pak další (Vrabel, 20. 11. 2026)'
  text: |
    Ke cvičení koalice ochotných v Polsku Vrabel tvrdí, že politici nejdřív řekli, že se ČR neúčastní a nebyla pozvána, a pak se ukázalo, že tam čeští důstojníci jsou; jmenuje Babiše a dalšího politika, jehož jméno přepis zkomolil. Armádní generál na čele státu a poslušnost, kterou dříve přisuzovali Němcům, podle něj znamenají, že Češi půjdou do války „jako vlaky“. Jakmile začne válka Evropy s Ruskem, lidé podle něj budou dál chodit do práce a do kina a nevšimnou si, že „mizí“. Nejdřív půjdou „vlastenci“, pak další, a protože ostatní nebudou stíhat reagovat, nebude odpor, stejně jako na Ukrajině, kde dnes muže „loví jako zvěř“ a vyhazují je z EU. Za zlom označuje až „prvních deset tisíc rakví“.
  citace:
  - text: když začne, jestli začne prostě válka mezi Evropou a Ruskem, takže lidi budou chodit dál do práce a budou dál chodit do kina, nakupovat a ani si nevšimnou,
    cas: "26:43"
  - text: Nejdřív budou vlastenci, super, jak to říkal generál Pavel,
    cas: "28:23"
  - text: Nejdřív prostě šli dobrovolně, běželi, pak je to a dneska je loví jako zvěř a vyhazují z Evropské unie,
    cas: "28:46"
  osoby:
  - {osoba: petr-pavel, vztah: negativni, kontext: 'Vrabel o něm mluví jako o armádním generálovi NATO v čele státu, pod nímž prý „zavelí“ k válce'}
  - {osoba: andrej-babis, vztah: negativni, kontext: 'Podle Vrabela nepravdivě řekl, že o cvičení vláda nejednala'}
  vazby:
  - {na: vrabel-2026-11-04-08, typ: posun}
- id: vrabel-2026-11-20-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  - nato-zbrojeni-militarizace
  nadpis: 'Berlín a Trump: závazek podporovat Ukrajinu o rok nic nemění, Trump „nevyjednává žádný mír“, vyjednal si volnou ruku proti Íránu, Kubě a Grónsku (Vrabel, 20. 11. 2026)'
  text: |
    K berlínské schůzce lídrů Německa, Francie, Británie a Ukrajiny, která podpořila právně závazné záruky a další vojenskou i finanční pomoc, Vrabel říká, že to znamená jen podpis dokumentů o podpoře zbraněmi na další rok. Schválená další miliarda eur z Evropského mírového fondu mu připadá logická, protože fond je k nákupu zbraní. Setkání Putina, Trumpa a Si Ťin-pchinga nepovažuje za zázrak: americkým prezidentům se podle něj „nevěří z principu“ a USA válku rozehrály a podporují ji zbraněmi, jen to teď platí Evropa. Trump podle něj nevyjednává mír, ale podmínky, aby mohl válčit s Íránem, ovládnout Venezuelu a Kubu a získat Grónsko. Jediné, co se změnilo, je konec amerických voleb a tím „klidu“.
  citace:
  - text: To nevyjednává žádný mír. On si vyjednal to, aby mohl válčit s Iránem, aby mohl zajmout Venezuelu, aby si mohl vzít Kubu, aby si mohl vzít Gronsko,
    cas: "31:44"
  - text: Jediný, co se změnilo, že skončili v Americe volby, takže ten čas, kdy jsme si oddechli, kdy to vypadalo hezky, tak prostě skončil.
    cas: "33:40"
  osoby:
  - {osoba: donald-trump, vztah: negativni, kontext: 'Není podle Vrabela mírotvůrce, vyjednal si volnou ruku proti Íránu, Venezuele, Kubě a Grónsku'}
  - {osoba: volodymyr-zelenskyj, vztah: negativni, kontext: 'Účastník berlínského jednání, které podpořilo závazky vůči Ukrajině'}
  vazby:
  - {na: vrabel-2026-11-18-09, typ: opakovani}
- id: vrabel-2026-11-20-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Dohoda EU–Británie: otevření pro mladé vítá, ale „Evropská unie funguje jako mafie“ a Burnham zatáhne Británii zpět (Vrabel, 20. 11. 2026)'
  text: |
    K dohodě EU a Británie o odstranění části obchodních překážek, programu pro až 100 tisíc mladých z každé strany a návratu Britů do Erasmu Vrabel říká, že otevření hranic mladým vítá a že to byl „jediný důvod, co jsem viděl jako dobrý na EU“. Dohodu ale popisuje jako první „hezký krok“, aby Británie přijala další těsnější vazby, protože Andy Burnham se podle něj bude Británii zatahovat do EU víc. EU přirovnává k mafii: nabízí peníze (předvstupní fondy, jejichž značná část byla podle něj rozkradena), a kdo si vezme, „nemůže říct ne“, když se pak chtějí migranty, daně, zbraně i podíl z rozpočtu. Britské politiky označuje za stejné jako české, kteří pracují pro „globalistické struktury“.
  citace:
  - text: Evropská unie funguje jako mafie. Mafie k vám přijde a něco vám dá.
    cas: "36:45"
  - text: Tak už prostě nemůžeme říct ne. Takhle funguje Evropská unie jako mafie.
