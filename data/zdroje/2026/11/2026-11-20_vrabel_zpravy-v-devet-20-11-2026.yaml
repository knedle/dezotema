  prepis: prepisy/done/2026-11-20_Ladislav-Vrabel_20-11-2026-Zprávy-v-devět-s-komentářem.txt
  delka: "01:17:44"
  rezim: vrabel
  poznamka: '1 h 18 min, den po summitu Trump–Putin–Si; spolumoderuje Zuzka (čte zprávy), Vrabel komentuje. 27 témat
    v denním přehledu, 17 s vlastním úhlem (⚡) ve 17 sekcích. Predikce: 7 nových; doplněna vyhodnocení ke starším
    (10-12-05, 11-16-05, 11-18-11). Stochastický teror nezapsán. Hraniční (nezapsáno, bez výzvy k trestu/násilí):
    poznámka o Zelenském, že „musí mít játra z toho kokainu úplně zničený“ (ponižování zdravotního stavu), označení
    Zdechovského za „břídila, co neumí ani chodit pořádně“, hypotetický vtip o člověku, který „skočí z mostu“,
    a tvrzení, že by „Hitler skákal radostí“ z evropských lídrů. Přepis zkomolil některá jména (Mirze Edis,
    „Doměm Okamorou“, Čupič). Zpracováno podle podkladů pomocného agenta, citace ověřeny v přepisu.'
  prehled:
  - tema: Už jsme ve válce? Konec „období klidu“ po summitu
    text: USA a Rusko si podle něj vzájemně slíbily nepoužití jaderných zbraní (Rusko proti USA při útoku na Írán, USA proti Rusku
      při konfliktu s Evropou), „doba klidu“ skončila a vše odpovídá jeho předpovědi.
    vyrok: vrabel-2026-11-20-01
  - tema: Úlomky ruských raket a dronů v Polsku
    text: nespadl celý dron, jen „tři úlomky“ a zbytky dronů, takže jde o nepříjemnou věc, ne o útok; ukazuje ale, jak by eskalace probíhala.
    vyrok: vrabel-2026-11-20-02
  - tema: Reakce Tuska, Pavla, Babiše, von der Leyenové, NATO a ministrů obrany
    text: Tusk mluví o „provokaci“, tedy ne o útoku a není potřeba článek 5; Pavlovo varování bere vážně a Rutteho cestu do Varšavy staví
      proti odzbrojování ze summitu.
    vyrok: vrabel-2026-11-20-02
  - tema: Překlad „koalice ochotných“
    text: „coalition of the willing“ je podle něj špatně přeloženo, jde spíš o koalici těch, kdo „chtějí“ (opakuje).
  - tema: Francie svolá Radu bezpečnosti OSN
    text: označuje to za „velmi zásadní“ a dál nerozvádí.
  - tema: Zelenský chce americké základny na Ukrajině
    text: Zelenského ponižuje (kokain, „nateklej“), Lavrov podle něj dal jasně najevo, že západní základny na Ukrajině Rusko nepřipustí.
    vyrok: vrabel-2026-11-20-03
  - tema: Britské a evropské síly připravené nastoupit po skončení bojů
    text: Rusové vojska koalice na Ukrajině nepovolí, Evropa se zatím dostává do patové situace a Francouzi už vojáky na Ukrajinu poslali.
    vyrok: vrabel-2026-11-20-03
  - tema: Cvičení Koalice 26.2 a česká účast
    text: tvrdí, že politici mluvili o pozvání na cvičení nekonzistentně a nakonec se ukázalo, že tam čeští důstojníci jsou.
    vyrok: vrabel-2026-11-20-04
  - tema: Normalizace války a mobilizace
    text: lidé si podle něj nevšimnou, že začínají mizet, nejdřív půjdou „vlastenci“, pak další, a na Ukrajině je dnes „loví jako zvěř“.
    vyrok: vrabel-2026-11-20-04
  - tema: Berlín — právně závazné bezpečnostní záruky a další miliarda eur z Mírového fondu
    text: závazek podporovat Ukrajinu o rok dál nic nemění, jediná změna je konec amerických voleb a tím „klidu“.
    vyrok: vrabel-2026-11-20-05
  - tema: Trump jako „mírotvůrce“
    text: Trump podle něj nevyjednává mír, vyjednal si volnou ruku proti Íránu, Venezuele, Kubě a Grónsku.
    vyrok: vrabel-2026-11-20-05
  - tema: Dohoda EU–Británie (mládež, Erasmus, bariéry)
    text: otevření hranic pro mladé vítá, ale EU přirovnává k mafii a čeká, že Burnham Británii zatáhne zpět.
    vyrok: vrabel-2026-11-20-06
  - tema: Němec Edis z Die Linke zve Afričany a Asiaty do Evropy
    text: ČR podle něj nenese vinu za kolonialismus a hypoteticky varuje před ukrajinskou politickou stranou a statisíci „ilegálních“ Ukrajinců.
    vyrok: vrabel-2026-11-20-07
  - tema: Islám překročil počet křesťanů
    text: islám je podle něj „politicky, sociálně náboženský systém“, který se šíří a po vstupu do země už neodejde.
    vyrok: vrabel-2026-11-20-08
  - tema: Masivní ruský útok na Ukrajinu a mosty přes Dněpr
    text: přes 400 dronů a 110 raket je očekávaná odveta za Krymský most a návrat do „starých kolejí“.
    vyrok: vrabel-2026-11-20-24
  - tema: Levice, pravice a „korporátní fašismus“
    text: pravice znamená svobodu jednotlivce, levice potřebu společnosti, důležitá je rovnováha a dnes se bojuje jen mezi globalismem a národními státy.
    vyrok: vrabel-2026-11-20-09
  - tema: Zelenský a útok na Krymský most
    text: nesouhlasí s odstřelováním mostu, protože po něm jezdí civilisté; vtip o stavebních úřadech byla „recese“.
    vyrok: vrabel-2026-11-20-10
  - tema: Dánsko schválilo dohodu s USA o Grónsku
    text: ironicky konstatuje, že Trump Grónsko získal a může tam rozmístit základny, Grónsko ale „zachovalo suverenitu“.
    vyrok: vrabel-2026-11-20-11
  - tema: Nový srbský parlament a Aleksandr Čupič
    text: zvolení studentského kandidáta za předsedu parlamentu hodnotí jako „dobrou zprávu“ a Čupiče jako „fajn typa“.
    vyrok: vrabel-2026-11-20-12
  - tema: Klimatická konference OSN v Turecku bez dohody o fosilních palivech
    text: jen krátce poznamenává, že je to „zajímavý“.
  - tema: Zatopené české uhelné doly
    text: zatopení považuje za „sabotáž“ a vinu přičítá vládě Andreje Babiše i „lidské hlouposti“.
    vyrok: vrabel-2026-11-20-13
  - tema: Z prohlášení summitu v Šen-čenu vypuštěn bod o Ukrajině
    text: podle něj Trump mír nevyjednává, summit nebyl příjemný a evropští „protiruští válečníci“ by potěšili i Hitlera.
    vyrok: vrabel-2026-11-20-14
  - tema: Britské útočné kybernetické operace proti Rusku, Číně, Íránu a KLDR
    text: je podle něj „velmi zajímavý“, že se k nim Británie přiznala.
  - tema: Banky, hotovost a digitální euro
    text: varuje, aby lidé nenechávali velké částky v bankách, a předpokládá, že při přechodu na digitální euro bude povolená hotovost jen 10 tisíc eur.
    vyrok: vrabel-2026-11-20-15
  - tema: Vyšetřování Depardieua, Houellebecqa a Niklouxe
    text: obvinění podle něj může zneužít kdokoli „kdo chce peníze“, a případ srovnává s Russellem Brandem, jehož odsouzení označuje za „nesmysly“.
    vyrok: vrabel-2026-11-20-16
  - tema: Novela ministra Tejce o náhradě škody po soudcích a státních zástupcích
    text: nevěří, že by to byla snaha o spravedlnost, a navrhuje odškodnit politicky stíhané z doby vlády Petra Fialy.
    vyrok: vrabel-2026-11-20-17
  - tema: Závěr vysílání — VK a zákaz zpráv
    text: pochvaluje „ostrý“ týdenní komentář VK, o kterém má dobrý vztah, a předpovídá, že jejich zprávy zakážou do roku, maximálně do dvou let.
    vyrok: vrabel-2026-11-20-23
