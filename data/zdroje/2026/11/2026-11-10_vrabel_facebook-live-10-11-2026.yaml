  osoby:
  - osoba: andrej-babis
    vztah: rozporuplny
    kontext: Jeho vláda „nebojuje za mír“ a je „servilní“, ale globalisté ji podle něj chtějí svrhnout,
      protože se ČR neúčastní cvičení koalice ochotných
  prehled:
  - tema: „Začíná nová revoluce pod vedením CIA“
    text: výzva FAMU k „bordelu“ je „svým způsobem terorismus“, demonstrace za „půl milionu“, Babiš má
      padnout kvůli neúčasti na cvičení koalice ochotných; příští vláda „promigrační a prounijní“
    vyrok: vrabel-2026-11-10-02
