  text: '**16. 11.** — V televizní debatě opakuje, že 17 z 27 zemí EU financuje veřejnoprávní média z
    rozpočtu, Polsko a Slovensko se k tomu chystají a eurokomisař McGrath potvrdil soulad s právem EU.'
  podtema: Česká televize a mainstreamová média
