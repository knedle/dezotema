  rezim: vrabel
  poznamka: 1 h 44 min, mluví jen Vrabel (bez hosta a moderátorky), čte dotazy diváků z komentářů; první
    polovina výklad plánu „ČR na prvním místě“, konec logistika pochodu 17. 11.; krátká němá videa z protestů.
vyroky:
- id: vrabel-2026-11-01-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Tisíc let stará proroctví Padmasambhavy o velké válce 2024–2034 — „99% jasný, že velká válka
    bude“; Blue Beam jen „hra“ k odvedení pozornosti (Vrabel, 1. 11. 2026)
  text: Vrabel tvrdí, že získal asi čtyři buddhistické „termy“ Gurua Rinpočheho (Padmasambhavy), staré
    zhruba tisíc let, které popisují období 2024–2034 a mluví o velké válce; mistr podle něj neřekl všechno,
    protože by to lidé „psychicky neunesli“. Buddhismus podle něj není náboženství, ale stav mysli, ve
    kterém mistr vidí minulost i budoucnost. Na tomto základě považuje velkou válku za „99% jasnou“ a
    vyzývá diváky zajistit si útočiště a počítat s jadernými zbraněmi a nedostatkem jídla. K diváckému
    dotazu na operaci Blue Beam (údajně 2027, projekce mimozemských lodí vyvolávající paniku) uvádí, že
    o ní slyšel od americké lékařky z okolí Trumpovy kampaně, sám ji nestudoval a považuje ji za „hry“
    k odvedení pozornosti.
  citace:
  - text: Takže co mě se týče, tak si myslím, že je 99% jasný, že velká válka bude.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-01-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: „Žádný migranty na práci“ — 80 tisíc pracovních migrantů při 340 tisících nezaměstnaných; nezaměstnaným
    snížit dávky (Vrabel, 1. 11. 2026)
  text: K diváckému upozornění, že se na příští rok plánuje 80 tisíc pracovních migrantů, přestože úřady
    práce evidují přes 340 tisíc nezaměstnaných, Vrabel tvrdí, že dovozem pracovníků „jsme si zničili
    naši zemi“. Firmy mají podle něj nabídnout víc peněz a nezaměstnaným, kteří práci odmítají, by snížil
    dávky. Na příkladu Kolína ukazuje, že lidé na Západě už nemají pocit, že je to jejich země, a proto
    „Západ hoří“. Vládě vyčítá, že problémy „hasí migrantama“ místo plánu soběstačného státu (potraviny
    bez GMO jako v Srbsku, léky, průmysl); EU podle něj přidává do jídla „prášek z hmyzu“, lidé jsou pak
    nemocní a odkázaní na západní léky.
  citace:
  - text: A v okamžiku, kdy budeme brát migranty na práci, tak jsme si zničili naší zemi.
- id: vrabel-2026-11-01-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Návrat socialismu: „velmi brzo začnou vlát rudé vlajky“ po Evropě (Vrabel, 25. 10. 2026)'
  text: '**1. 11.** — Velkou část protestů v Itálii, Španělsku, Francii a Německu podle Vrabela koordinuje
    Antifa, která po Evropě „rozjíždí socialistickou revoluci“. S jejím cílem výslovně souhlasí: vzít
    elitám peníze a rozdat je chudým, protože 1 % lidí ovládá 99 % majetku. Vedle Antify podle něj protestují
    Němci proti migrantům, studenti hlavně proti válce (což média podle něj zamlčují) a propalestinské
    skupiny.'
  citace:
  - text: Chtějí udělat to, co my chceme taky. Vzít těm bohatým, těm elitám, ty jejich peníze a rozdar
      je chudým.
  podtema: Politická kultura
- id: vrabel-2026-11-01-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Plán „ČR na prvním místě“: zrušit všechny daně, jediná 1% daň z bankovních převodů, peníze
    emitovat lidem na účty — v EU nemožné (Vrabel, 1. 11. 2026)'
  text: Vrabel představuje daňovou část svého plánu. Drahotu podle něj nezpůsobuje nedostatek bohatství,
    ale přerozdělování ve prospěch několika bohatých přes daňový systém, který je „schválně“ nepřehledný,
    „aby se tam mohlo krást“; korporace podle něj odčerpávají zisky „daňovou optimalizací“ (Facebook daní
    v Irsku). Navrhuje zrušit všechny daně a zavést jedinou — 1 % z převodů přes bankovní účty; firmy
    by platily vše přes účet, lidé by měli „právo na hotovost“ a z hotovosti by neplatili nic. Peníze
    by podle něj místo bank vytvářel stát a jednou či dvakrát ročně je emitoval přímo na účty lidí. Myšlenku
    připisuje nobelistovi z ekonomie (1973) a dánskému příteli, bývalému bankéři z londýnské City. Provedení
    podle něj brání smlouvy EU, předpokladem je tedy vystoupení z EU.
  citace:
  - text: A to, co bych chtěl udělat, je zrušit ten špatný daňový systém a zrušit všechny daňe. A udělat
      jenom jednu daň.
  podtema: Politická kultura
- id: vrabel-2026-11-01-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Polsko: „ústavní puč“ Tuskovy vlády jako boj EU o polskou suverenitu (Vrabel, 31. 10. 2026)'
  text: '**1. 11.** — Vrabel doplňuje, že Tusk nechal do Varšavy přijet policii z celého Polska, ozbrojenou
    i „automatickými zbraněmi s ostrými náboji“, a že policie protiprávně nepustila předsedu ÚS do budovy.
    Z videa německých policejních aut mířících k Varšavě a z Braunova upozornění na policisty bez čísel
    usuzuje, že tam „pravděpodobně“ zasahují němečtí policisté. Ústavní soud je podle něj „velmi silný
    mocenský nástroj“ ve volbách: v ČR v roce 2025 podle něj nerespektoval volební zákon a ponechal ve
    volbách SPD a Stačilo!, aby se do Sněmovny nedostalo jeho hnutí — 31. 10. přitom tomuto rozhodnutí
    přiznával „nějakou logiku“. Obává se, že EU a Tusk vyhrají, a nevylučuje střet „armáda proti policii“.'
  citace:
  - text: A proto musel ústavní soud podržet SPD a i stačilo, aby šlo SPD pro Trikolora a Svobodný do
      parlamentu, aby jsme tam nešli my.
  podtema: Česká suverenita
- id: vrabel-2026-11-01-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: EU „dotace“ jsou naše vlastní peníze vrácené s podmínkami — „podvod“; i na drahé energie Babiš
    čeká „evropské řešení“ (Vrabel, 1. 11. 2026)
  text: 'Vrabel tvrdí, že peníze, které EU poskytuje ČR jako dotace, nejsou penězi EU, ale české odvody
    do unijního rozpočtu, které se vracejí s podmínkou, na co se smějí použít, a s hrozbou, že se budou
    vracet „i s pokutou“. Označuje to za „podvod“ a doklad, že ČR nemá suverenitu. Paralelu vidí ve vlastním
    odsouzení za „dotační podvod“, které podle něj bylo odškodněním firem nezákonně zavřených za covidu.
    Stejně podle něj dopadnou drahé energie: místo zastropování cen a kompenzací firmám premiér čeká na
    „evropské řešení“ — stát pošle peníze do EU a ta část vrátí, což čeká za měsíc až dva. Velkou daňovou
    reformu podle něj nelze provést kvůli Lisabonské smlouvě, předpokladem je proto samostatnost.'
  citace:
  - text: …a říkají tomu dotace, no tak to je podvod. A takhle funguje Evropská unie.
  podtema: Česká suverenita
- id: vrabel-2026-11-01-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Putin: Rusko nechce válku s NATO — válka NATO–Rusko by skončila jadernými zbraněmi; scénář
    „Pobaltí → Polsko → ČR“ (Vrabel, 22. 10. 2026)'
  text: '**1. 11.** — Vrabel považuje za „dost pravděpodobné“, že Rusko zaútočí nebo že dojde k útoku
    „pod falešnou vlajkou“ připsanému Rusku; měsíce zpráv o ruských dronech, kyberútocích a sabotážích
    bez důkazů podle něj sloužily k tomu, aby si na to lidé zvykli. Následovat má článek 5, válečný stav
    (ne výjimečný), uzavření hranic a vyslání dvou brigád. Velení armády podle něj převezme prezident
    Pavel jako „generál NATO“, ne Babiš; jako první budou povoláni záložníci ročníků, které prošly základní
    vojenskou službou, teprve pak mladší. Nikdo to podle něj nebrzdí — Babiš, Macinka (140 mil. do PURL)
    ani Zůna.'
  citace:
  - text: což předpokládám, že je dost pravděpodobný, že Rusko zautočí nebo bude útok pod falešnou vlajkou,
      jakože Rusko zautočilo.
  podtema: Eskalace a hrozba rozšíření konfliktu
