  poznamka: '1 h 4 min, den po Letné a den před 17. listopadem. 20 témat v denním přehledu, 4 s vlastním
    úhlem (⚡). Stochastický teror nezjištěn (hraniční: Rusové si „můžou vzpomenout“ na plátce zbraní,
    Ukrajincům „musí někdo účet vystavit“). Zpracováno podle podkladů pomocného agenta, citace ověřeny
    v přepisu.'
vyroky:
- id: vrabel-2026-11-16-01
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Změnu v Polsku, ČR a na Slovensku přinesou jen Braun, Harabín a „kluci z Republiky“ — „televizní
    politické síly“ nic nezmění (Vrabel, 16. 11. 2026)
  text: K hlasování polského Sejmu o nedůvěře Tuskově vládě (návrh Morawieckého, kandidát na premiéra
    Marek Jurek) Vrabel říká, že „moc tomu nevěří“. I kdyby prošlo, dopadne to podle něj jako v Británii,
    kde Starmera nahradil Andy Burnham, který „dělá naprosto to samé“. Změnu může přinést jen Grzegorz
    Braun s Romanem Fritzem a Konfederací Korony Polské. Dokud Poláci volí PiS jako „hlavní opozici“ dodanou
    televizí, nic se nezmění. Stejně je to podle něj v ČR (dříve Babiš, dnes SPD) a na Slovensku, kde
    je „jediný“ Štefan Harabín, případně „kluci z Republiky“. „Televizní politické síly“ podle něj žádnou
    změnu neudělají, nabízejí jen populistická hesla.
  citace:
  - text: Jedinej, kdo může něco udělat v Polsku, je Grzegorz Braun a Roman Fritz.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-11-16-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Konec evropského autoprůmyslu: čínská auta za půlku ceny, Volkswagen ruší 100 tisíc míst —
    Evropa „jde vyrábět zbraně“ (Vrabel, 16. 11. 2026)'
  text: Ze zprávy, že Volkswagen zruší přes 100 tisíc míst (šéf Oliver Blume uvádí dvojnásobné personální
    náklady v Německu), Vrabel vyvozuje, že evropská ekonomika postavená na autech „je pryč“. Čínská auta
    stojí podle něj polovinu až dvě třetiny ceny a nová čínská auta konkurují ojetým Audi a BMW i „předražené“
    Škodě Kodiaq. Na německém autoprůmyslu přitom visí desetitisíce firem v ČR. Češi si podle něj „hrají
    na pupek světa“. Evropa teď podle něj „jde vyrábět zbraně“, ačkoli akcie Rheinmetallu a CSG Michala
    Strnada podle něj spadly o 70 %.
  citace:
  - text: Co se týče té evropské ekonomiky postavené na automobilovém průmyslu, to je pryč. To je pryč.
      Chápete?
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-11-16-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Útok na Krymský most jako dílo „koalice ochotných skrze Ukrajinu“ — Rusové „vyvodí zodpovědnost“
    i vůči plátcům zbraní (Vrabel, 16. 11. 2026)
  text: Ke zprávě o rekordních 1 336 dronech sestřelených nad Ruskem a o útoku na Krymský most Vrabel
    připomíná, že Friedrich Merz před nástupem do úřadu hrozil Putinovi desetidenním ultimátem a raketami
    Taurus a že prvním cílem měl být právě Krymský most kvůli zásobování fronty. Ukrajina podle něj bez
    západních peněz (právě schválených 8 mld. eur) a zbraní nic nezmůže a chybí jí vojáci, takže útok
    provedla „koalice ochotných“ jejím prostřednictvím. Rusové útoky „vždycky opětují“ a je „jenom otázka
    času“, kdy vyvodí odpovědnost. Pak si podle něj „můžou vzpomenout taky na to, kdo ty zbraně kupuje,
    kdo ty zbraně platí“, včetně českých politiků a občanů, kteří posílají peníze na zbraně pro Ukrajinu.
  citace:
  - text: Osobně bych řekl, že zaútočila koalice ochotných společně s Ukrajinou, skrze Ukrajinu na Krymský
      most.
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-11-16-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko by Evropu dobylo bez jaderných zbraní — 3 000 dronů a 100 iskanderů denně; „Rusko vyhraje
    s 99,9% pravděpodobností“ (Vrabel, 15. 11. 2026)
  text: '**16. 11.** — Vrabel tezi rozvádí. Rusové podle něj „nikomu ubližovat nechtějí“, ale jsou denně
    napadáni drony, raketami a sabotážemi, takže „budou muset změnit taktiku“, a „nedává tomu moc času“.
    S odkazem na Scotta Rittera („nevím, jestli to pravda je“) uvádí, že v Rusku už padlo rozhodnutí o
    konfliktu s Evropou. Rusko podle něj denně skladuje nejméně 700 dronů a 100 iskanderů, u Finska má
    asi 70 tisíc vojáků, může mobilizovat 2,2 milionu lidí a modernizovalo systém „Mrtvá ruka“, zatímco
    Evropa nemá protivzdušnou obranu ani vojáky. Na schůzce Trump–Si–Putin očekává dohodu USA a Ruska
    o vzájemném nepoužití jaderných zbraní, která „otevře širokou cestu“ Rusku, „aby si mohlo vyřídit
    účty s Evropou“ konvenčně. Jaderná válka podle něj nebude. Čína si podle něj vezme Tajvan a USA se
    buď stáhnou, nebo začnou válku s Čínou. Kdyby Rusko vedlo „plnohodnotnou invazi“, Ukrajina by podle
    něj kapitulovala do dvou dnů. Na rozdíl od dřívějška si „není úplně jistý, že to ti Rusové zvládnou
    bez té války s Evropou“, a „docela se toho obává“.'
  citace:
  - text: Jestli prostě Evropa nedá pokoj a Rusové začnou to brát tak, že teda jako je čas se nějakým
      způsobem poprat s Evropou, tak to udělají takhle.
  podtema: Zahraniční aktéři a precedenty
