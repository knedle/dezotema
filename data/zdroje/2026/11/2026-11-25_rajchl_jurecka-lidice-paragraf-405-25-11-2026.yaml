- id: rajchl-2026-11-25-02
  typ: postoj
  temata:
  - benesovy-dekrety
  - politicky-system
  nadpis: Jurečka „největší lhář“ — kdo podporuje sjezd landsmanšaftu, nemá mluvit o Lidicích (Rajchl, 25. 11. 2026)
  text: |
    Jurečku nazývá „prokazatelně největším lhářem v historii české politické scény“, protože v den
    střelby na Filozofické fakultě popíjel a „trsal do čtyř do rána na hity Michala Davida“ a pak o tom
    lhal. Na jeho výzvu, ať jede do Lidic, odpovídá, že tam letos na vzpomínkovém aktu byl, zatímco
    Jurečku tam neviděl — snad mu to „páníčkové ze sudetoněmeckého landsmanšaftu nedovolili“. Kdo mluví
    o Lidicích a zároveň podporuje sjezd landsmanšaftu v Brně, „organizace, která vznikla z členů SS“,
    by si měl před zrcadlem „pořádně nafackovat“.
  citace:
  - text: Pokud někdo hovoří o Lidicích a současně ten člověk podporuje sjezd sudetoněmeckého landsmannschaftu v Brně, tedy organizace, která vznikla z členů SS, … tak by si měl dojít před zrcadlo a pořádně si tam nafackovat.
    cas: "02:10"
  osoby:
  - {osoba: marian-jurecka, vztah: negativni, kontext: '„Největší lhář“, podporovatel sjezdu landsmanšaftu'}
  vazby:
