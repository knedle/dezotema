  rezim: standard
  poznamka: 'Krátký spot — odpověď Jurečkovi na kritiku návrhu úpravy § 405. Zpracována všechna 3 témata.
    Stochastický teror nezjištěn („největší lhář“, „amorální dno“, „nafackovat si před zrcadlem“ —
    urážky a obrazná výzva k sebereflexi). Ověřeno v přepisu.'
vyroky:
- id: rajchl-2026-11-25-01
  typ: postoj
  temata:
  - dsa-cenzura
  podtema: Trestání politického projevu
  nadpis: Schvalování nacistických zločinů zůstane trestné, zúžení § 405 má jen ukončit kriminalizaci názorů na Ukrajinu (Rajchl, 25. 11. 2026)
  text: |
    V reakci na Jurečkovo označení návrhu za „amorální dno“ ujišťuje, že zúžení § 405 nemá umožnit
    schvalování holokaustu ani jiných nacistických zločinů — to bude „i nadále trestné, protože to je
    odporná věc“. Cílem je zabránit tomu, aby byl kriminalizován každý, kdo měl „jiný pohled na válku na
    Ukrajině“ nebo se postavil „oficiálnímu narativu“, jak se to podle něj dělo čtyři roky za minulé
    vlády. Takové stíhané lidi sám obhajoval a označuje to za „čistou cenzuru“.
  citace:
  - text: Schvalování nacistických zvěrstev bude i nadále trestné, protože to je odporná věc.
    cas: "02:00"
  osoby:
  - {osoba: marian-jurecka, vztah: negativni, kontext: 'Návrh označil za „amorální dno“'}
  vazby:
