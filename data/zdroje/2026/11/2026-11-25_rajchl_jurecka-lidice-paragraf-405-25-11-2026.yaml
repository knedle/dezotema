- id: rajchl-2026-11-25-03
  typ: postoj
  temata:
  - valka-ukrajina-prubeh
  - politicky-system
  nadpis: Navrhne usnesení Sněmovny odsuzující „projevy nacismu na Ukrajině“ — test pokrytectví (Rajchl, 25. 11. 2026)
  text: |
    Na příští schůzi Sněmovny chce navrhnout usnesení, kterým by Sněmovna odsoudila „projevy nacismu na
    Ukrajině“, před nimiž podle něj Jurečka a jeho strana „zavírají oči“. Hlasování má ukázat, komu
    skutečně vadí nacistická zvěrstva a kdo je „jenom pokrytec“, který chce kriminalizovat názorové
    odpůrce.
  citace:
  - text: Ta zvednutá ruka, respektive ta ruka nechaná dole, nás oba dva velmi rychle rozsoudí.
    cas: "03:23"
