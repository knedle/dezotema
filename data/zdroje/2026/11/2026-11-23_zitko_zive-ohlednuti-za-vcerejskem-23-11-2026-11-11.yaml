    režimu na Ukrajině diskvalifikovaly“.
  citace:
  - text: O tom nebude rozhodovat 107čkový rozvědčík na Hradě ani Babiš, ani nikdo jiný, ale tato rozhodovací úroveň o podobě budoucích hranic v Evropě i ve světě bude na úrovni vítězných mocností.
