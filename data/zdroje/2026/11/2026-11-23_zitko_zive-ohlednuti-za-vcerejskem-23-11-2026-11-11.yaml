  nadpis: Rozdělení ČSFR jako „akt velezrady a vlastizrady“ organizované zločinecké skupiny (Zítko, 23. 11. 2026)
  text: |
    Rekapituluje kroky po roce 1989: OF a VPN „instalovaly do parlamentu bez voleb svoje koně“ kooptací,
    5. 7. 1992 Havel „zradil přísahu“ a do února 1993 bylo „absolutní bezvládí“. Rozdělení bylo
    protiústavní, „zločinné rozdělení Československa organizovanou zločineckou skupinou“ pod tlakem ze
    zahraničí. Připomíná krádeže „100 miliard na lehkých topných olejích“ a cituje Fica, podle něhož bylo
    referendum o vstupu do EU zmanipulované.
  citace:
  - text: Bylo to zločinné rozdělení Československa organizovanou zločineckou skupinou, ještě pod tlakem ze zahraničí, kdy tento akt nejde popsat jiným způsobem než akt velezrady a vlastizrady.
    cas: "14:11"
  - text: Občanské fórum a Veřejnost proti násilí tam instalovalo do parlamentu bez voleb a bez vůle lidu svoje koně, kteří se měli tímto způsobem dostat ke korýtkům.
    cas: "05:28"
