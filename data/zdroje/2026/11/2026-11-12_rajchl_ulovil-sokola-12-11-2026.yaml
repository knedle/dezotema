  nadpis: 'Merzovo „brutální vydírání“: blokace rozpočtu EU, aby ČR platila Ukrajině 60–70 mld. Kč ročně
    — vláda nesmí ustoupit „ani o milimetr“ (Rajchl, 10. 11. 2026)'
  text: '**12. 11.** — V další debatě Rajchl upřesňuje, že 45 miliard eur nemá jít na obnovu Ukrajiny,
    ale na zalepení deficitu jejího státního rozpočtu na jediný rok. Záruka ČR za tento jeden rok dělá
    podle něj zhruba 60 miliard korun. Opozici, která „nechce zadlužovat naše děti“, vyčítá, že je ochotna
    ručit za tuto částku každý rok, aby se na Ukrajině peníze „rozkrádaly“ na „zlaté záchody a bidety“.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
