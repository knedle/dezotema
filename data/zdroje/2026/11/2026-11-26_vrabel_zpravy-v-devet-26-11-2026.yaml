  podtema: Finanční trhy a AI
  nadpis: "Firmy kolem AI jsou „přepumpované“ a trhy se hroutí; zlato, stříbro a papíry ve ztrátě (Vrabel, 26. 11. 2026)"
  text: |
    K varování Bank of England před zadlužením AI společností Vrabel tvrdí, že firmy vyrábějící umělou inteligenci jsou přepumpované, financují se navzájem neprůhlednými půjčkami a poklesem cen akcií se může zhroutit i další napojený kapitál. Aktuální pohyb trhů (zlato, stříbro, krypto, akcie) označuje za katastrofu na začátku větších problémů a připomíná, že své publikum varuje od roku 2021.
  citace:
  - text: "ty firmy, které vyrábí umělou inteligenci, jsou prostě přepumpované"
    cas: "33:34"
  - text: "jakmile to jde dohou, tak všichni začnou prodávat"
    cas: "33:59"
