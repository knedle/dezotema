  delka: "01:05:43"
  rezim: vrabel
  poznamka: "Čtvrteční vysílání se spolumoderátorkou Zuzkou, která čte zprávy (od 2:58). 19 témat v denním přehledu, 13 z nich s vlastním úhlem (⚡) v 16 plných výrocích (+ 2 výroky o stochastickém teroru). Predikce: 3 (EU schválí půjčku Ukrajině kolem Vánoc i s Babišem, kolaps trhů s AI a první zadlužená Francie, růst cen zlata a stříbra). Stochastický teror: 2 hraniční (opavský primátor a ruské kolo; migranti na Kanárských ostrovech jako „svrabaví styliky“). Na konci pouští video z Německa (nezpracováno, přepis je nesrozumitelný). Citace ověřeny v přepisu."
  prehled:
  - tema: Půjčka Ukrajině 45 mld. eur a rozpočet EU 2028–2034
    text: souhlasí s Babišem, že podmiňovat rozpočet půjčkou je absurdní, ale označuje jeho postoj za divadlo, žádá veto a výstup z EU.
    vyrok: vrabel-2026-11-26-01
  - tema: Trump a Rutte na Floridě
    text: „klasický Trump“, tvrzení o ruské agresi jsou prý jen politická prohlášení, o nichž žádný soud nerozhodl.
    vyrok: vrabel-2026-11-26-03
  - tema: Kushnerův rozhovor s Döpfnerem
    text: Kushner potvrdil „proxy válku“ a ruské obavy z NATO, ale NATO prý napadlo Jugoslávii, a Zelenského záruky jsou přehnané.
    vyrok: vrabel-2026-11-26-04
  - tema: Nový prezident ECB Hernández de Cos
    text: nezná ho, takže se nevyjadřuje.
  - tema: Ukrajinský student se zapálil před ministerstvem kultury ve Varšavě
    text: podle něj protestoval proti vydávání uprchlíků Ukrajině, jejíž TCK je posílají na frontu.
    vyrok: vrabel-2026-11-26-06
  - tema: Bank of England varuje před zadlužením AI firem
    text: AI firmy jsou přepumpované, trhy se zhroutí a první padne Francie, zlato a stříbro půjdou nahoru.
    vyrok: vrabel-2026-11-26-07
  - tema: Pavel, Hlaváč a Zůna v Senátu
    text: ironicky je označuje za „príma trojku“, která chce víc zbrojit.
    vyrok: vrabel-2026-11-26-10
  - tema: Maďarský premiér žádá odstranění trojzubce z hradu v Mukačevu
    text: Petr Maďar bude možná „na stejné úrovni jako Zelenský“.
  - tema: Odkud Vrabel bere informace
    text: jeho komentáře jsou soukromé, zprávy čerpá z různých zdrojů a divákům doporučuje si udělat vlastní názor.
  - tema: Kim Čong-un a taktické jaderné zbraně
    text: pro Severní Koreu je to „naprosto logické“, pro ČR ne, protože by dopadla jako člověk s plynovou pistolí.
    vyrok: vrabel-2026-11-26-11
  - tema: Evropský parlament a geneticky modifikované mikroorganismy
    text: obává se GMO a zmiňuje i údajnou směrnici o povinném očkování mRNA; označuje to za špatný krok.
    vyrok: vrabel-2026-11-26-12
  - tema: Lavrov zpochybňuje účast Evropanů na jednáních
    text: Lavrovova pozice je „stoprocentně logická“, evropská „0 % logiky“, a Evropa musí uznat ruské důvody (rozšiřování NATO).
    vyrok: vrabel-2026-11-26-13
  - tema: ZDF o šikaně konzervativních muslimských žáků
    text: šikana původních dětí je podle něj to, co čeká ČR s migračním paktem.
    vyrok: vrabel-2026-11-26-15
  - tema: Libyjští důstojníci zabiti ukrajinským dronem v Benghází
    text: Ukrajinci nemají právo vést válku na libyjském území.
    vyrok: vrabel-2026-11-26-14
  - tema: Precedent Kosova a sebeurčení Donbasu a Krymu
    text: Kosovo je podle něj precedens, a na rozdíl od něj se obyvatelé Donbasu a Krymu sebeurčují zpět k Rusku (opakuje).
    vyrok: vrabel-2026-11-26-14
  - tema: Finsko prodlužuje zákon o ochraně hranic s Ruskem
    text: nechápe, proč Finsko uzavírá hranici a mluví o válečné propagandě, hranice s Ruskem je 1340 km.
  - tema: Opava vyřadila ruské kolo z vánočních trhů
    text: fantazíruje, jak by primátora nechal tři hodiny točit na ruském kole.
    vyrok: vrabel-2026-11-26-17
  - tema: Kanárské ostrovy, rekordních 2100 migrantů za den
    text: migranti podle něj ničí turismus a platí je daně, přičemž ČR leží mezi „dvěma šílenými zeměmi“ (Ukrajina a Německo).
    vyrok: vrabel-2026-11-26-16
  - tema: Závěrečné video z Německa
    text: pouští satirické video jako ukázku „současného Německa“ a omlouvá se, že předchozí video s muslimy a ozdobami bylo z Egypta.
vyroky:
- id: vrabel-2026-11-26-01
  typ: postoj
  temata:
  - suverenita-eu
  - valka-ukrajina-prubeh
  podtema: Rozpočet a půjčka EU
  nadpis: "Souhlasí s Babišem proti půjčce Ukrajině z rozpočtu EU, ale jeho postoj je prý jen „divadlo“; zná řešení: veto, nebo výstup z EU (Vrabel, 26. 11. 2026)"
  text: |
    Ke zprávě o jednání EU o půjčce Ukrajině 45 mld. eur na rok 2027 Vrabel říká, že podmiňovat evropský rozpočet 2028–2034 garancí půjčky je absurdní, a v tom s Babišem souhlasí. Zároveň tvrdí, že Babiš za celou dobu ve funkci neudělal pro mír nic (nezrušil muniční iniciativu ani vojenskou dohodu s Ukrajinou, ČR prý posílá víc než polovinu munice) a že se chová jako někdo, kým není, protože jeho slova míří jen k českým médiím. Vrabel tvrdí, že Babiš má Merze jmenovat a říct mu, ať Ukrajinu platí z německých peněz, případně ať Německo z EU odejde, nebo odejde ČR či V4. Babiše označuje za „diktátora“, který zakázal referendum o výstupu z EU, a EU popisuje jako moloch, který si usurpuje nové daně (z elektroniky, emisní povolenky).
  citace:
  - text: "To je taky absurdní, že my, když řešíme evropský rozpočet, co jsou peníze pro evropské státy, které to samozřejmě platí, tak někdo přichází s návrhem, že pokud nebudeme souhlasit s garancí půjčky pro Ukrajiny, tak nebude rozpočet."
    cas: "04:22"
  - text: "že zakázal občanům České republiky vůbec se vyjádřit v referendu o tom, že by chtěli vystoupit z Evropské unie a drží nás násilím jako diktátor"
    cas: "09:53"
  - text: "To není ta suverénní politika, to není ta politika pro Českou republiku. To je prostě jenom divadlo."
    cas: "12:05"
  osoby:
  - {osoba: andrej-babis, vztah: rozporuplny, kontext: "V odporu k půjčce s ním souhlasí, ale jeho postoj označuje za divadlo a diktátorství"}
  - {osoba: friedrich-merz, vztah: negativni, kontext: "Podle Vrabela vydírá zbytek EU požadavkem financovat Ukrajinu"}
