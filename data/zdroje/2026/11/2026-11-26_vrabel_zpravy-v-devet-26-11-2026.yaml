- id: vrabel-2026-11-26-10
  typ: postoj
  temata:
  - nato-zbrojeni-militarizace
  - petr-pavel
  podtema: Zbrojení v ČR
  nadpis: "Pavel, Hlaváč a Zůna jako „príma trojka“, která prosazuje zbrojení za vládu SPD (Vrabel, 26. 11. 2026)"
  text: |
    Ke Pavlovu vystoupení v Senátu o krizové legislativě a pomalých nákupech techniky Vrabel ironicky konstatuje, že Pavel (za Hrad), Hlaváč (za armádu) a Zůna (za vládu, respektive SPD) jsou „príma parta“, která společně tvrdí, že se nezbrojí dost a že je třeba víc peněz. Poznamenává, že Zůna sice patří k SPD, ale reprezentuje celou vládu.
  citace:
  - text: "Petr Pavel, Miroslav Hlaváč a Jaromír Zuna je prostě príma parta, je to trojka, príma trojka"
    cas: "35:10"
  - text: "Prostě Petr Pavel za hrad, Hlaváč za armáru České republiky a Zuna za SPD"
    cas: "35:27"
  osoby:
  - {osoba: petr-pavel, vztah: negativni, kontext: "Ironicky označen za člena „príma trojky“ prosazující zbrojení"}
  - {osoba: miroslav-hlavac, vztah: negativni, kontext: "Náčelník generálního štábu, součást „príma trojky“"}
  - {osoba: jaromir-zuna, vztah: negativni, kontext: "Ministr obrany, reprezentuje za SPD celou vládu v zbrojení"}
  - {osoba: spd, vztah: negativni, kontext: "Její ministr Zůna podle Vrabela podporuje zbrojení"}
- id: vrabel-2026-11-26-11
  typ: postoj
  temata:
  - jaderne-zbrane
  podtema: Jaderné odzbrojení
  nadpis: "Jaderný program Severní Koreje je „naprosto logický“, pro ČR by ale vlastní jaderná zbraň logiku neměla (Vrabel, 26. 11. 2026)"
  text: |
    Ke Kim Čong-unovu volání po rozmístění taktických jaderných zbraní Vrabel říká, že mu to připadá rozumné, protože denuklearizace by musela proběhnout u všech jaderných států najednou; dokud k ní nedojde, má každý stát v pozici Severní Koreje logiku se zbrojit. Pro ČR to logické není, protože leží uprostřed konfliktu s největší jadernou mocností, a její jaderná zbraň by byla jako „plynová pistole“ proti reálné. Trump je podle něj s Kimem „kamarád“ kvůli severokorejskému arzenálu a dosahu raket.
  citace:
  - text: "Ale to musí udělat všichni, kdo ty jaderné zbraní mají"
    cas: "38:48"
  - text: "A dokud se tohle neděje, no tak každý stát, který je na tom třeba jako Severní Kore, tak tam mi to připadá naprosto logický."
    cas: "39:01"
  osoby:
  - {osoba: kim-cong-un, vztah: pozitivni, kontext: "Jeho jaderné zbrojení označuje za logické"}
  - {osoba: donald-trump, vztah: neutralni, kontext: "Podle Vrabela je s Kimem „kamarád“ kvůli jadernému arzenálu"}
  - {osoba: si-tin-pching, vztah: neutralni, kontext: "Zmíněn jeho výrok o denuklearizaci před summitem APEC"}
- id: vrabel-2026-11-26-12
  typ: postoj
  temata:
  - covid-vakciny
  - suverenita-eu
  podtema: GMO a mRNA v EU
  nadpis: "Povolování geneticky modifikovaných mikroorganismů v EU je „špatný krok“; zmínka o nařizování očkování mRNA (Vrabel, 26. 11. 2026)"
  text: |
    K hlasování Evropského parlamentu o zjednodušení schvalování geneticky modifikovaných mikroorganismů Vrabel říká, že se takových věcí osobně obává, a dodává, že si není jistý, zda GMO potraviny nemohou poškozovat lidskou genetiku, když lidé genetice nerozumějí. Zmiňuje také údajnou směrnici, která má Evropské komisi umožnit v epidemiích nařizovat povinné očkování mRNA, přičemž přiznává, že rozhodnutí nečetl, a slibuje to prověřit pro další zprávy.
  citace:
  - text: "aby v případných epidemích mohla nařizovat povinné očkování mRNA."
    cas: "42:49"
  - text: "Takže mě se tohleto úplně nedíbí, že Evropská unie tohleto umožňuje, ale jak říkám, za mě to je špatný krok."
    cas: "43:52"
  vazby:
  - {na: vrabel-2026-07-26-02, typ: souhlas}
- id: vrabel-2026-11-26-13
  typ: postoj
  temata:
  - valka-ukrajina-prubeh
  - valka-nato-rusko
  podtema: Jednání o míru
  nadpis: "Lavrovova odmítavá pozice je „stoprocentně logická“, evropská „0 % logiky“; Evropa musí uznat ruské důvody (Vrabel, 26. 11. 2026)"
  text: |
    K Lavrovovu zpochybnění účasti Evropanů v jednáních Vrabel tvrdí, že pozice Ruska je logická, protože Evropané chtějí mír bez vyslechnutí ruských důvodů, a proto Rusové pokračují v operaci, v níž podle něj vyhrávají. Evropské požadavky (nejdřív zastavit boje, pak závazné záruky pro Ukrajinu) označuje za nelogické a varuje, že Ukrajina by po zastavení bojů mohla vyvolat provokaci pod falešnou vlajkou, do níž by se Evropa kvůli závazku zapojila, což by vedlo k jaderné válce. Evropští politici podle něj musí připustit, že se Rusové obávají rozšiřování NATO, a hledat nový bezpečnostní systém; Babiš, Pavel i ministr obrany by to měli říct.
  citace:
  - text: "To, co říkají Rusové, pro mě stoprocentně logické"
    cas: "47:23"
  - text: "a to, co říká většina Evropanů, je pro mě 0% logiky."
    cas: "47:25"
  - text: "prostě Evropaní, pokud chtějí evropškí politici jednat o míru, tak nejdřív musí připustit realitu."
    cas: "45:56"
  osoby:
  - {osoba: sergej-lavrov, vztah: pozitivni, kontext: "Jeho pozici označuje za logickou"}
  vazby:
  - {na: vrabel-2026-10-30-04, typ: souhlas}
- id: vrabel-2026-11-26-14
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  - valka-nato-rusko
  podtema: Kosovo jako precedens
  nadpis: "Kosovo jako precedens pro sebeurčení Donbasu a Krymu; Ukrajina nesmí vést válku na libyjském území (Vrabel, 26. 11. 2026)"
  text: |
    K ukrajinskému útoku na ruskou loď v Benghází Vrabel tvrdí, že Ukrajinci nemají právo vést válku do jiných zemí. Pak opakuje svůj výklad, že Západ vytvořil precedens uznáním Kosova, a proto mají právo na sebeurčení i Donbas a Krym, jež Rusko uznalo stejně jako Západ Kosovo. Rozdíl vidí v tom, že Kosovo bylo podle něj „uloupeno migranty“, kdežto na Donbase a na Krymu zůstali původní obyvatelé, kteří se sebeurčují zpět k Rusku. Zdůrazňuje, že popisuje jejich pohled na Ukrajinu jako na „fašistický vynález“.
  citace:
  - text: "Na území Libie Ukrajinci nemají žádné právo táhat válku do jiných zemí."
    cas: "52:21"
  - text: "Podívejte, vy jste prostě tady vytvořili precedent"
    cas: "53:50"
  - text: "že Kosovo je uloupené těmi migranty, kdežto ty lidi na Donbasa a na Krymu se sebe určují"
    cas: "55:09"
  vazby:
  - {na: vrabel-2026-09-23-06, typ: opakovani}
- id: vrabel-2026-11-26-15
  typ: tvrzeni
  temata:
  - migrace
  podtema: Muslimská šikana ve školách
  nadpis: "Šikana původních dětí muslimskými spolužáky je to, co čeká ČR s migračním paktem (Vrabel, 26. 11. 2026)"
  text: |
    Ke zprávě ZDF o šikaně konzervativních muslimských žáků vůči spolužákům jiné víry Vrabel tvrdí, že s migrací přichází teroristické útoky, znásilnění a krádeže, a šikana původních dětí migranty je podle něj jedna z nejhorších věcí, která může vést k trvalým následkům i sebevraždám. Zprávu zařazuje proto, aby si lidé uvědomili, co čeká Českou republiku s migračním paktem.
  citace:
  - text: "a podle mě to je jedna z těch nejhorších věcí"
    cas: "50:46"
  - text: "Proč o tom mluvíme ve zprávách? Je proto, abyste si uvědomili, co čeká Českou republiku s migračním paktem."
    cas: "51:16"
- id: vrabel-2026-11-26-16
  typ: postoj
  temata:
  - migrace
  podtema: Náklady migrace
  nadpis: "2100 migrantů za den na Kanárských ostrovech: ničí turismus a platíme je z daní; ČR leží mezi „dvěma šílenými zeměmi“ (Vrabel, 26. 11. 2026)"
  text: |
    K rekordnímu příchodu přibližně 2100 migrantů za den na Kanárské ostrovy Vrabel tvrdí, že každý migrant stojí daňové poplatníky velké částky (ubytování, vzdělání, léčba, telefon, účet) a že Kanáry jsou tím „zničené“. Česko podle něj leží mezi dvěma „šílenými zeměmi“, Ukrajinou, kde lidé loví vlastní občany na frontu, a Německem, a pouští na závěr satirické video z Německa jako ukázku.
  citace:
  - text: "prostě zničený místo těmi migranty"
    cas: "01:02:23"
  - text: "aby jsme zaplatili jednoho takovýhle týpka, a jich jezdí pořád tisíce, tisíce, tisíce"
    cas: "01:02:38"
  vazby:
  - {na: vrabel-2026-11-21-14, typ: opakovani}
- id: vrabel-2026-11-26-17
  typ: stoch-teror
  temata:
  - media-propaganda
  nadpis: "Opavský primátor Petr Čudek: fantazie o tom, jak by ho nechal „tři hodiny točit“ na ruském kole (hraniční)"
  text: "Vrabel fantazíruje, že by opavského primátora, který nezařadil ruské kolo, vzal do baru s „pěknou holkou“, připil ho a nechal ho tři hodiny točit na ruském kole se zrychlením, aby si to užil. Jde o satirický scénář; hraniční, protože terč je pojmenovaný (jmenován ve zprávě) a výhrůžka je ponižující, ale bez dehumanizace nebo výzvy k násilí."
  citace:
  - text: "a nechal ho tři hodiny točit aspoň na tom ruským kole"
    cas: "59:18"
  - text: "aby mu trošku přidali na rychlosti"
    cas: "59:27"
  osoby:
  - {osoba: petr-cudek, vztah: negativni, kontext: "Primátor Opavy, který odmítl ruské kolo na trzích z důvodu solidarity s Ukrajinou"}
  teror:
    terc: Petr Čudek
    hranicni: true
- id: vrabel-2026-11-26-18
  typ: stoch-teror
  temata:
  - migrace
  nadpis: "Migranti jako „styliky“, které „musíme platit“ a vyléčit „ze svrabů“ (hraniční)"
  text: "V monologu o Kanárských ostrovech Vrabel označuje migranty jako „kousky“ a „styliky“, které je třeba vyléčit „ze všech svrabů“. Hraniční: terč je skupina (migranti), je přítomná dehumanizace, ale chybí výzva k trestu nebo násilí."
  citace:
  - text: "musíte ho vylečit ze všech svrabů, který si sebou přiveze"
    cas: "01:00:32"
  - text: "na každý den prostě přijedou tyhle styliky, který musíme platit"
    cas: "01:02:29"
  teror:
    terc: migranti přijíždějící na Kanárské ostrovy
    hranicni: true
