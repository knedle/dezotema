    stav: ceka
- id: vrabel-2026-11-26-03
  typ: postoj
  temata:
  - valka-ukrajina-prubeh
  - nato-zbrojeni-militarizace
  podtema: Jednání o míru
  nadpis: "Trump a Rutte: „klasický Trump“; označení ruské agrese je jen politické prohlášení, o kterém žádný soud nerozhodl (Vrabel, 26. 11. 2026)"
  text: |
    K setkání Trumpa s Ruttem na Floridě Vrabel říká, že Trump na jedné straně chápe, co se děje, a o Putinovi mluví jako o kamarádovi, na druhé straně prosazuje vyzbrojování NATO a ruskou agresi. Podle Vrabela Rusové uvádějí, že zahájili speciální vojenskou operaci na základě mezinárodního práva, a o tom, kdo agresi spáchal, dosud nerozhodl žádný příslušný soud, takže jde o politická prohlášení, která vedou k válce. Opakující se sliby o brzkém míru označuje za nic neznamenající, protože nebyly oznámeny žádné konkrétní kroky, a jedinou jistou dohodou podle něj bude prodej amerických zbraní do NATO, jehož východní křídlo (tedy „my“) půjde do případného konfliktu.
  citace:
  - text: "No tak vidíte, to je prostě klasický Trump."
    cas: "15:17"
  - text: "To znamená, to jsou pořád politická prohlášení a ta politická prohlášení bohužel vedou k válce."
    cas: "16:01"
  osoby:
  - {osoba: donald-trump, vztah: rozporuplny, kontext: "Chápe situaci, ale prosazuje zbrojení NATO a označuje Rusko za agresora"}
  - {osoba: mark-rutte, vztah: negativni, kontext: "Jednal s Trumpem o zbrojení a bezpečnosti Evropy"}
- id: vrabel-2026-11-26-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  - valka-nato-rusko
  podtema: Rozšiřování NATO
  nadpis: "Kushner potvrdil „proxy válku“ a ruské obavy z NATO, ale NATO prý útočilo na Jugoslávii a stalo se útočnou aliancí (Vrabel, 26. 11. 2026)"
  text: |
    Vrabel referuje o rozhovoru Jareda Kushnera s Mathiasem Döpfnerem a tvrdí, že Kushner označil válku za zástupnou (proxy), v níž Evropa financuje a vyzbrojuje Ukrajince proti Rusku, a potvrdil, že Rusové věří v hrozbu rozšiřování NATO. Vrabel to bere jako potvrzení svých dosavadních výkladů a oddechl si, že ho za to policie nebude stíhat. S Kushnerem ale nesouhlasí v tvrzení, že NATO nikdy nikoho nenapadlo, protože podle něj útok na Jugoslávii v roce 1999 bez souhlasu Rady bezpečnosti OSN a bez článku 5 byl agresí a precedentem, který z NATO udělal útočnou alianci. Rusové proto mají podle Vrabela důvodnou obavu o svou existenci.
  citace:
  - text: "protože NATO napadlo, NATO útočilo minimálně ve třech operacích v Afganistánu a Jugoslávii"
    cas: "18:44"
  - text: "a to je precedent, který prostě z NATO udělal útočnou alianci."
    cas: "19:08"
  osoby:
  - {osoba: jared-kushner, vztah: rozporuplny, kontext: "Chválí ho za potvrzení proxy války a ruských obav, kritizuje tvrzení, že NATO nikdy nezaútočilo"}
- id: vrabel-2026-11-26-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  podtema: Bezpečnostní záruky
  nadpis: "Zelenského bezpečnostní záruky jsou přehnané (víc než článek 5); Rusové s nimi prý nebudou souhlasit (Vrabel, 26. 11. 2026)"
  text: |
    Vrabel převypráví Kushnerovo tvrzení, že Zelenský chce víc než článek 5 NATO, tedy právně závaznou povinnost států poslat na Ukrajinu vlastní armády při novém konfliktu s Ruskem. Podle Vrabela Kyjevu nestačí zbraně a vojáci a chce západní státy přímo zapojit do války, přičemž osobně pochybuje, že by Rusové s takovou smlouvou souhlasili. Dodává, že po zastavení bojů by se Ukrajinci mohli nazbrojit, zahájit provokaci pod falešnou vlajkou a dojít by mohlo i na jaderné zbraně.
  citace:
  - text: "Jemu nestačí to, že mu západ dává zbraně a posílá vojáky, ale on chce, aby ty státy byly přímo zapojené do té války, jakmile by vzniknul konflikt s Ruskou federací."
    cas: "21:10"
  - text: "Takže tam si osobně úplně nejsem jistý, že Rusové budou souhlasit s něčím takovým"
    cas: "21:36"
  osoby:
  - {osoba: volodymyr-zelenskyj, vztah: negativni, kontext: "Podle Vrabela požaduje záruky nad rámec článku 5 NATO"}
  vazby:
  - {na: vrabel-2026-11-21-11, typ: souhlas}
- id: vrabel-2026-11-26-06
  typ: postoj
  temata:
  - valka-ukrajina-prubeh
  - migrace
  podtema: Ukrajinští uprchlíci a mobilizace
  nadpis: "Vydávání ukrajinských uprchlíků je „barbarské“; TCK je lapají a posílají na frontu; v ČR se to může stát také (Vrabel, 26. 11. 2026)"
  text: |
    Ke zprávě o ukrajinském studentovi, který se ve Varšavě zapálil, Vrabel tvrdí, že důvodem nemohl být požadavek rovného zacházení, ale spíš protest proti vracení uprchlíků na Ukrajinu. Ukrajinské TCK podle něj lidi lapají na ulicích, bijí je, ničí jim auta a berou na frontu, kde přežití hrozí s pravděpodobností „87 %“ (jeho odhad), a ukrajinský režim označuje za zločinný. Evropské státy, které uprchlíky vydávají, jednají podle něj „jako barbaři“ a prodlužují válku a on se označuje za možná jediného politika, který proti tomu veřejně vystupuje. Z auta ukrajinské policie v Polsku usuzuje, že by v rámci spolupráce mohli Ukrajinci někdy „nabírat“ i české vojáky a že tvrzení „my nepůjdeme“ je naivní.
  citace:
  - text: "před tím zločinným režimem Volodomira Zelenského, který ti lidi bije, mlátí, používá na ně zbraně, aby je donutil sednout do toho auta"
    cas: "25:46"
  - text: "A my jako barbaři, jako barbarské státy, je vydáváme ukrajinskému režimu."
    cas: "27:20"
  - text: "možná jsem jediný politik v této republice, který je proti tomu veřejně."
    cas: "27:39"
  osoby:
  - {osoba: volodymyr-zelenskyj, vztah: negativni, kontext: "Jeho režim označen za zločinný kvůli násilné mobilizaci"}
  vazby:
  - {na: vrabel-2026-11-05-08, typ: opakovani}
- id: vrabel-2026-11-26-07
  typ: tvrzeni
  temata:
