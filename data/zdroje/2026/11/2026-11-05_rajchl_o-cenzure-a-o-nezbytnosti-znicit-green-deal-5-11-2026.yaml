  nadpis: 'Koaliční shoda na úpravě § 405: trestat jen podněcování k násilí a nenávisti, ne „odchylný
    názor“ (Rajchl, 20. 10. 2026)'
  text: '**5. 11.** — V televizní debatě Rajchl uvádí případy klientů stíhaných podle něj „za naprostý
    nesmysl“: Martinu Bednářovou, Radima Panenku (kvůli kondolenci k úmrtí Radka Mladějovského) a nejhorší
    podle něj odsouzení Josefa Skály a Vladimíra Kapala za debatu o původci masakru v Katyni. Jeho návrh
    na zrušení § 318a (spolupráce s cizí mocí) prošel do koalice a bude ho jen „precizovat“; nesmyslnost
    tohoto „gumového paragrafu“ podle něj dokazuje údajný čínský špion, kterého soud po měsících ve vazbě
    zprostil obžaloby. Úpravu § 405 považuje za odstranění „největšího kladiva na čarodějnice“.'
  citace:
  - text: Ten paragraf je natolik extenzivně vykládatelný, že tam můžete obvinit téměř každého.
