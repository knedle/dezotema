- id: rajchl-2026-11-15-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Merzovo „brutální vydírání“: blokace rozpočtu EU, aby ČR platila Ukrajině 60–70 mld. Kč ročně
    — vláda nesmí ustoupit „ani o milimetr“ (Rajchl, 10. 11. 2026)'
  text: '**15. 11.** — V nedělním vysílání nazývá Rajchl Merzův požadavek „historickým milníkem“: německý
    kancléř si podle něj opět bere, co chce, „silou vydírání“. Deficit ukrajinského rozpočtu na příští
    rok odhaduje na 70 miliard eur, EU podle něj chce zaplatit 145 miliard a celkem už to stálo kolem
    500 miliard eur. Z peněz by se podle něj platily ukrajinské důchody, zdravotnictví a školství a část
    „rozkrade Zelenskyj“. Skutečný důvod vidí v tom, že většinu ukrajinských dluhopisů drží německé banky,
    které by bankrot Ukrajiny (ratingy jsou podle něj už na úrovni bankrotu) nepřežily. Merz podle něj
    chce také dřívější zavedení povolenek ETS2, do nichž investovaly německé penzijní a investiční fondy,
    a rozhodování o společných finančních závazcích kvalifikovanou většinou. To by podle něj znamenalo
    ztrátu práva veta a o českých penězích by rozhodovali „technokrati, šílenci, ideologové“ v Bruselu
    či Berlíně. Pavlova slova o „finanční stabilizaci Ukrajiny“ odmítá: jde podle něj o vykrývání prohlubujícího
    se deficitu a peníze by šly lidem, „kteří adorují nacistický režim“. Petru Sokolovi z ODS, který v
    debatě příspěvek hájil, podle něj „reálně přeskočilo“. Babiše a Fica chválí za ostré odmítnutí. Pokud
    by vláda ustoupila, Rajchl prohlašuje, že by v koalici „nemohl pokračovat“ a pro takový krok by „ruku
    nezvedl, i kdyby mi ji měli useknout“. ČR by se podle něj stala „finančním vazalem Německa“ ve vztahu
    „poddanský vůči feudálovi z Berlína“. Letná je proti tomu podle něj „čajíček“.'
  citace:
  - text: Pokud to udělá, tak to bude fakticky konec Evropské unie. Zablokujte ten rozpočet a zrušte ten
      cirkus. Udělejte to, pane Merzi.
  - text: Tohle je přece stokrát horší. Tady nejde, prosím vás pěkně, o nějaký mír.
  osoby:
  - osoba: friedrich-merz
    vztah: negativni
    kontext: „Soudruh Merz“, „feudál z Berlína“ vydírající ČR
  - osoba: petr-sokol
    vztah: negativni
    kontext: Hájil placení Ukrajině, „reálně mu přeskočilo“
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: rajchl-2026-11-15-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Abú Zabí: dřív „kolaborant“, dnes chtějí jednat všichni — za Evropu by vyslal Fica; Rusko vítězí
    a Evropa „vykrvácí“ (Rajchl, 15. 11. 2026)'
  text: 'Rajchl připomíná, že od začátku války tvrdil, že půjde o opotřebovací válku za statisíce životů,
    kterou Ukrajina nemůže vyhrát, a volal po jednání. Proto byl označován za „největšího proruského kolaboranta“.
    Dnes podle něj jednat chtějí titíž lidé: Petr Pavel, který v roce 2023 říkal, že s Ruskem se nejedná,
    dokud neustoupí, i Zelenskyj, který si jednání zakázal vlastním dekretem. Lipavského „dětinské výkřiky“
    („Ukrajina zvítězí“, „dovolená na Krymu se blíží“) zesměšňuje a nabízí mu, že mu letenku na Krym zaplatí.
    Plán, že by EU na jednání vyslala zástupce Británie, Německa, Francie, Itálie a Polska, odmítá, protože
    jde o „největší válečné štváče“, kteří z války „mají biznis“. Za Evropu by vyslal Roberta Fica, který
    si udržel dobré vztahy s Ruskem i Ukrajinou a od začátku prosazoval mír. Výměnu zajatců, „asi největší
    v novodobé historii“, vítá. Realpolitika je podle něj taková, že Rusko válku „jednoznačně vyhrává“,
    přežilo sankce a nemá důvod ustupovat. Bulharsko podle něj zastavuje veškerou pomoc Ukrajině, Němci
    už nedají Patrioty, evropské sklady jsou vyprázdněné a pokladny „plajté“, a přesto se volá po dalším
    válčení. Za fanouška Ruska ani Ukrajiny se nepovažuje, „jediným fanouškem“ je podle svých slov České
    republiky. Putin podle něj nemůže ustoupit, protože domácí opozice od něj chce co nejrychlejší vítězné
    ukončení konfliktu.'
  citace:
  - text: Já myslím, že by u toho stolu měli sedět lidé, kteří od začátku říkali pojďme jednat. A proto
      si myslím, že za Evropu by měl být vyslán Robert Fico.
  osoby:
  - osoba: robert-fico
    vztah: pozitivni
    kontext: Měl by vyjednávat mír za Evropu
  - osoba: jan-lipavsky
    vztah: negativni
    kontext: „Dětinské výkřiky“ („dovolená na Krymu“)
  podtema: Vyjednávání a mír
- id: rajchl-2026-11-15-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Ukrajina: co média „zamlčují" — Majdan, Donbas, Minsk II, dekret č. 117, Istanbul (Rajchl,
    27. 9. 2026)'
  text: '**15. 11.** — V souvislosti s jednáním v Abú Zabí, kde podle něj za Ukrajinu sedí stejní vyjednavači
    jako v Istanbulu (Rustem Umerov, David Arachamija), Rajchl cituje Arachamiju z ukrajinské televize
    1+1. Ruská delegace podle něj „do poslední chvíle doufala“, že Ukrajinu dotlačí k podpisu dohody o
    neutralitě „jako Finsko“. Ukrajina by si kromě Krymu ponechala celé území a Donbas by získal autonomii.
    Poté přijel Boris Johnson a řekl, že se nic podepisovat nebude. Nově cituje i tehdejšího izraelského
    premiéra a zprostředkovatele Naftaliho Bennetta: Západ podle něj jednání přerušil, protože jeho prioritou
    bylo „crush Putin“, a Bennett to považuje za chybu. Tehdy se podle Rajchla daly vyjednat „stokrát
    lepší“ podmínky, dnešní jednání jsou „faktická kapitulace“. Ti, kdo mu vyčítali, že chce kapitulaci
    Ukrajiny, ji podle něj svým „hloupým, krátkozrakým, dětinským jednáním“ sami způsobili („neuvěřitelní
    hlupáci“).'
  citace:
  - text: Byl to Západ, který bohužel přerušil ta jednání, který zmařil možnost dosažení míru v Istanbulu.
  osoby:
  - osoba: david-arachamija
    vztah: neutralni
    kontext: Citováni jako svědci, že Západ zmařil mír v Istanbulu
  - osoba: naftali-bennett
