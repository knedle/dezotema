  nadpis: Stížnost k Radě ČT na Jana Moláčka za „kukaččí mládě“; ČT zrušit, „ani korunu“ (Rajchl, 22.
    10. 2026)
  text: '**15. 11.** — Veřejná služba ČT podle Rajchla stojí „nějakou miliardu“, zbylých asi 7 miliard
    jsou peníze, „do kterých vůbec nevidíme“. Fialova vláda půl roku před volbami poplatky zvýšila a rozšířila
    okruh plátců, ačkoli to měla v programu opačně, a tím si ČT podle něj „šla koupit“ (návrh ministra
    Baxy: „my vám dáme poplatky a vy budete o nás hezky mluvit“). S odkazem na Lubomíra Zaorálka tvrdí,
    že Rakušan v ČT sliboval poplatky výměnou za to, že se nebude mluvit o střelbě na FF UK, a připomíná
    zastavenou reportáž o Dozimetru. Eurokomisař Michael McGrath (demokracie a právní stát) podle něj
    v Evropském parlamentu prohlásil, že změna financování ČT je plně v souladu s evropskými předpisy
    a neohrožuje nezávislost médií. Nerudová, která projednávání iniciovala, tak „dostala vyprásknuto“
    a Milan Mazurek ji „argumentačně smetl“. ČT ani „mediální výspa STAN“ Seznam to podle něj nezveřejnily.
    Kampaň s Večerníčkem v papírové čepici označuje za „nechutné“ zneužití symbolu, protože Večerníček
    nikdo neruší. Exekuce kvůli poplatkům podle něj vymáhá kancelář Roberta Nerudy, manžela Danuše Nerudové.
    Financování ze státního rozpočtu je pro něj kompromisní mezistupeň. Pokud dostane silnější mandát,
    bude prosazovat privatizaci ČT jako „přežitého“ média v době internetu. Zrušení poplatků je podle
    něj povinnost vůči voličům ANO, SPD i PRO.'
  citace:
  - text: Oni si tu Českou televizi šli půl roku před volbami koupit. Koupit její přízeň.
