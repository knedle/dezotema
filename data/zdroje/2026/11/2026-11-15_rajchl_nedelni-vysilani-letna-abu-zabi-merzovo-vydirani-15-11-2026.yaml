  nadpis: Zdanit nadnárodní korporace (Google platí 18 milionů), plán rozvoje s Křetínským, Tykačem a
    Kellnerovou — „české peníze do českých rukou“ (Rajchl, 15. 11. 2026)
  text: Rajchl by chtěl zvýšit důchody a peníze na ně by našel ve škrtech a v sektorových daních. Například
    Google má podle něj miliardové zakázky ze státního rozpočtu, ale zaplatí jen 18 milionů korun na daních.
    Pokud PRO dostane ve volbách víc síly, „první na pořadu“ budou nadnárodní korporace, banky a rafinerie,
    které „vyvádějí kapitál do zahraničí“. Místo amerických a německých investorů chce podporovat české
    podnikatele a přizvat Daniela Křetínského, Karla Tykače, Renátu Kellnerovou a další k plánu rozvoje
    ČR, protože „tu zemi milují“ a mají tu děti. Křetínskému gratuluje, že „hlouposti“ německé Energiewende
    využije ke stavbě plynových elektráren. Pokud ČR opustí Green Deal, vrátí se k ruskému plynu, odejde
    z lipské burzy a dá podnikům levnou elektřinu, podle něj „zbohatne jako nikdy předtím“. Patriotismus
    musí podle něj zvítězit nad „globalismem a paneuropeismem“.
  citace:
  - text: České peníze patří do českých rukou a já odmítám, abychom s nimi nakládali podle toho, co si
      soudruh Merz v Berlíně usmyslí.
