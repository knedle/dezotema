  poznamka: '1 h 5 min, „8/11 Nedělní chvilka poezie 8:11“. Zhruba polovinu tvoří předčítání cizích QAnon
    textů a přehrávání (Q-drop, EBS, Ron Star, Charlie Ward/Pi, „Lion White“, hymna RF). Zpracováno všech
    12 témat, 1 souhrnná predikce. Stochastický teror nezjištěn (hraniční: předčítané „krádež voleb je
    trest smrti“ a žertovný „gulag“ bez pojmenovaného terče). Zpracováno podle shrnutí pomocného agenta.'
