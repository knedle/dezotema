  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**8. 11.** — Zítko opakuje, že „hra na Čermáka“ skončila 1. 11. („tři dny jsme čekali jako na
    Godota a nepřišel“). Tím se podle něj „na tisíc procent“ potvrdilo, že „politický vězeň Čermák“ není
    původní Tomáš Čermák. Dál to rozebírat nebude, dokud nepřijde „další zdrcující důkaz“. Do Holýšova
    podle svých slov nejel, protože mu Tušl vyhrožoval, že „dostane do držky“. Fanoušky ironicky vyzývá
    k „sázce na Čermáka“ na kanálech „hejtrů“. Připomíná také svůj záběr z 8. 3. 2023, kdy se u soudu
    s Čermákem a Tušlem redaktorka ČT „lekla mikrofonu“.'
