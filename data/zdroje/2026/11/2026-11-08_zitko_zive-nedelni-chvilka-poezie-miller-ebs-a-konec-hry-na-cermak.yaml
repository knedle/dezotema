  text: '**8. 11.** — Zítko opakuje, že o obnově Československa nerozhodnou Babiš ani Fiala, ale „vítězné
    mocnosti“ (Trump, Putin, Si). Prezidentské volby v „korporaci Česká republika“ podle něj zmanipuloval
    Aspen Institute a podvody trvají asi 20 let, proto se podle něj nekonalo referendum o rozdělení ČSFR.
    K výročí smrti Alexandra Dubčeka (nehoda u Humpolce 1. 9. 1992) tvrdí, že nesla „rysy práce tajných
    služeb“ a Dubček byl „odstraněn“, protože by bojoval za Československo proti „vlastizrádcům“.'
  citace:
  - text: Pravděpodobně z tohoto důvodu byl odstraněn.
