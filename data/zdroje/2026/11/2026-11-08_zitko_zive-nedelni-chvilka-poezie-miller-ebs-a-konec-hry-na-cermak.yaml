  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**8. 11.** — V nedělním vysílání (zhruba polovinu tvoří předčítání cizích QAnon textů) Zítko
    tvrdí, že 9. 11. nastoupí „Stephen Miller 2.0“ jako šéf kanceláře Bílého domu. Miller podle něj není
    původní identita, protože v „central castingu“ bylo nahrazeno asi 200 tisíc lidí. Nahradí prý Susie
    Wiles, která byla „spojkou“ Billa Gatese na lobbisty a farmaceutické firmy, a Trump o její zradě věděl.
    Datum 9. 11. mu připomíná „11. 9.“ v americkém zápisu. Předčítá, že armáda chystá 10denní výpadek
    komunikací se systémem EBS („blíží se okamžik EBS, a to nezadržitelně“), a radí mít zásoby. Fotku,
    na níž Trump „líbá“ J. D. Vance, vykládá jako „polibek smrti“ z Kmotra II: odhalení Vance jako zrádce
    je podle něj „velmi blízko“ a Vance prý „hrál Paul Walker“. Opakuje, že podvod v amerických volbách
    zdokumentovalo „40 států“ a že běží 45denní lhůta. Předčítané memy hlásají, že „krádež voleb je trest
    smrti“. Hlavní postavy deep state jsou podle něj „už vyřešeny a popraveny“ a chytají se „gauneři nižší
    kategorie“. Dlouhé trvání operace přičítá „žalostné“ úrovni vědomí lidstva. Výklad, že vše je „spiknutí
    Chabad Lubavič, židů a židozednářů“, odmítá, protože by pak „byli všichni úplně v prdeli“. Z cizího
    textu přebírá, že „kristovskou DNA“ má 17 % lidí v ČSR, ale jen 0,08 % v Číně a že „95 % lidí je mimo“
    (NPC, „hybridi“). Tvrdí také, že banky „budou padat jako domino“ (Paraguay, 128 zavřených poboček
    v Japonsku), a předčítá text „Všechno se musí stát dvakrát“: nejdřív tajné tribunály a popravy, pak
    veřejné odhalení s dvojníky a klony (Guantánamo přesunuto do Everglades, pro Evropu Island).'
