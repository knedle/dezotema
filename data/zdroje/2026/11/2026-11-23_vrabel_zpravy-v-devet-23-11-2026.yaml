- id: vrabel-2026-11-23-02
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - nato-zbrojeni-militarizace
  nadpis: Ruské rakety v Polsku nebyly útok — spadly po přesměrování ukrajinskou obranou; NATO to zneužívá k eskalaci
    (Vrabel, 23. 11. 2026)
  text: 'Ke zprávě o mimořádném zasedání Severoatlantické rady a posílení polské protivzdušné obrany Vrabel
    tvrdí, že ruské rakety a dron spadly na polské území omylem, protože je přesměrovala ukrajinská protivzdušná
    obrana, anebo je tam hodili Ukrajinci jako falešný útok. Poukazuje na to, že u ukrajinských raket, které
    dopadly mimo Ukrajinu, státy omyl akceptovaly, kdežto v případě ruských z toho vytvářejí „útok Ruska
    na Polsko“. Podobně vykládá sabotáže, drony a kybernetické útoky, o nichž mluvil Rutte na zasedání NATO
    v Berlíně: nikdo prý neví, kdo je skutečně vypustil. Dodává, že to neříká na podporu Ruska, ale aby ČR
    zůstala v míru a politici neeskalovali.'
  citace:
  - text: To nebyl žádný útok, to bylo nedopatření, byl to omyl, bylo to přesměrování těch raket, ukrajinskou protivzdušnou
      raketou,
    cas: "33:18"
  - text: Poslali ji tam Ukrajinci, buď to protivzdušnou obranou nebo nějakým jiným způsobem, ale neposlali ji tam
      Rusové, proto to není ruský útok.
    cas: "35:50"
  - text: Takže byl bych rád, aby naši politici to tak vzali a neeskalovali tu situaci.
    cas: "36:43"
  osoby:
  - {osoba: mark-rutte, vztah: negativni, kontext: 'Varoval před sabotážemi a kybernetickými útoky; Vrabel to pokládá za zneužívání nejasných incidentů'}
  vazby:
  - {na: vrabel-2026-11-21-08, typ: posun}
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-11-23-03
  typ: postoj
  temata:
  - suverenita-eu
  - politicky-system
  nadpis: V4 je „absolutně mrtvý projekt“ — Babiš je „diktátor“, který lidem zakázal rozhodnout o výstupu z EU (Vrabel,
    23. 11. 2026)
  text: 'Ke schůzce V4 s rakouským kancléřem v Bratislavě Vrabel tvrdí, že nic nebrání Česku a dalším zemím,
    aby z EU vystoupily a rozhodovaly o penězích samy, aniž by byly „protektorát“. V4 podle něj dávala smysl
    jen v protimigrační agendě z roku 2016, protože její země nebyly zislamizované; dnes by měla smysl jen
    při společném výstupu z EU, ale v Polsku vládne Tusk a Babiš EU podporuje. Babiše označuje za diktátora,
    který podle něj zakázal referendum o EU a uzurpoval právo lidu, a odhlíží přitom od jeho sympatického
    veřejného obrazu. Pro Vrabela je V4 „mrtvý projekt“ a je třeba bojovat o přežití země.'
  citace:
  - text: nikdo jim nebrání, aby vystoupili z Evropské unie.
    cas: "37:52"
  - text: Andrej Babiš se postavil do role diktátora a usurpoval si právo, který má lid,
    cas: "40:48"
  - text: V4 pro mě v tuhle chvíli je absolutně mrtvý projekt.
    cas: "41:34"
  osoby:
  - {osoba: andrej-babis, vztah: negativni, kontext: 'Označen za diktátora, který zakázal referendum o EU'}
  - {osoba: donald-tusk, vztah: negativni, kontext: 'Překážka případného výstupu Polska z EU, apeluje na podporu Ukrajiny'}
  - {osoba: robert-fico, vztah: neutralni, kontext: 'Měl výhrady k rozpočtu EU'}
  - {osoba: martin-konvicka, vztah: neutralni, kontext: 'V roce 2016 s ním Vrabel prosazoval V4 jako protimigrační formát'}
  vazby:
