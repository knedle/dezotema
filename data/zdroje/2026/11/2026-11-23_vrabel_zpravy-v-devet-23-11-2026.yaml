  nadpis: S Babišem souhlasí, že se nemá platit Ukrajině z rozpočtu EU — ale ČR má z EU vystoupit (Vrabel, 23. 11. 2026)
  text: K schválení rozpočtu EU na rok 2027 Vrabel říká, že důležitější je sedmiletý rozpočet. S Babišovými výhradami
    proti financování Ukrajiny z rozpočtu souhlasí, protože podle něj ať Ukrajině platí Němci, Francouzi a Britové
    ze svého. Nesouhlasí však s tím, že by ČR měla být v EU a rozhodovat o penězích v Bruselu; měla by vystoupit
    a řídit si zemi sama, „už bylo dost protektorátů“.
  citace:
  - text: Taky nechci, aby se platilo Ukrajině.
    cas: "1:13:01"
  - text: Vystoupit z Evropské unie a řídit si svoji zemi sami. Už bylo dost protektorátů.
    cas: "1:13:57"
