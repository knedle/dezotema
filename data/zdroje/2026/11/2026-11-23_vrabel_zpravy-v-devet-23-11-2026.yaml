  nadpis: Evropští politici se začínají bát války a budou „vyskakovat“ s mírovými slovy — převahu ale mají válečníci
    (Vrabel, 23. 11. 2026)
  text: K Tajaniho varování před válkou ve Středomoří Vrabel říká, že 24. 2. 2022 apeloval na deeskalaci, ale nikdo
    ho neposlechl, a nyní se politici (Itálie, Litva) začínají bát, protože vidí rychlou eskalaci. Očekává,
    že začnou vyskakovat politici s tvrzením, že jen pomáhají Ukrajině a varují před válkou, což bude vypadat
    jako naděje, ale převahu politickou, ekonomickou i mediální mají podle něj „válkychtiví“ politici (Merz,
    vlády Británie, Francie, Dánska, Finska a Pobaltí).
  citace:
  - text: Proč? Protože se začínají bát.
    cas: "59:33"
  - text: Problém je v tom, že větší sílu mají ty politici, který jedou jako rozjetý vlak dál
    cas: "1:00:05"
  osoby:
