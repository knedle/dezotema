  nadpis: Rusko už nejspíš nasadilo Sarmat, nikdo by na jaderný úder neodpověděl; Pavel a Babiš jsou „hloupí šašci“ (Vrabel,
    23. 11. 2026)
  text: 'K Medveděvovým slovům o jaderných zbraních Vrabel tvrdí, že podle západních analytiků Rusko s velkou
    pravděpodobností už nasadilo raketu Sarmat („Satan 2“) s 15 hlavicemi a modernizovalo systém „mrtvá ruka“.
    Nejde podle něj o právo, ale o možnost nejsilnější jaderné velmoci; na ruský úder na Ukrajinu by nikdo
    neodpověděl a Evropa nemá technologii, aby se postavila. Generála Pavla a Babiše, kteří mluví o jaderném
    odstrašení Ruska, označuje za „hloupé šašky“, kteří ohrožují ČR; Babiš naštěstí po jeho výzvě odepsal,
    že vláda žádné rozmístění jaderných zbraní neplánuje, a Vrabel doufá, že už nepřijde s nápadem na jadernou
    alianci s Francií.'
  citace:
  - text: tak pravděpodobně rusové s velkou pravděpodobností nasadili Sarmat, ten takzvaný Satan 2.
    cas: "1:01:58"
  - text: Takže Evropa je prostě na pospas v tomhle tom.
    cas: "1:04:44"
  - text: to jsou prostě hloupí šašci, který vůbec nerozumí tomu,
    cas: "1:04:55"
  osoby:
  - {osoba: dmitrij-medvedev, vztah: neutralni, kontext: 'Referuje o jeho prohlášení, že Rusko zatím nemělo důvod použít jaderné zbraně'}
  - {osoba: petr-pavel, vztah: negativni, kontext: 'Spolu s Babišem „hloupý šašek“ mluvící o jaderném odstrašení'}
  - {osoba: andrej-babis, vztah: rozporuplny, kontext: 'Označen za „šaška“, ale uznání, že odepsal, že vláda jaderné zbraně neplánuje'}
  - {osoba: vladimir-putin, vztah: neutralni, kontext: 'Rozhodnutí o jaderném úderu podle Medveděva přísluší jemu'}
  - {osoba: donald-trump, vztah: neutralni, kontext: 'V Šen-čenu se s Putinem domluvil na jaderném nepoužití'}
