  - {na: vrabel-2026-11-20-01, typ: posun}
  podtema: Jaderné odstrašení
- id: vrabel-2026-11-23-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Zachraň se, kdo můžeš“ — posluchači se mají připravit na zavřené hranice, válečný stav a možný dopad raket
    v ČR (Vrabel, 23. 11. 2026)
  text: Ke zprávě o omezení dopravy ve Finském zálivu Vrabel vyzývá posluchače, aby se připravili na zavřené hranice,
    válečný stav, nedostatek elektřiny, internetu či topení a pokles hodnoty nemovitostí; podle něj už v lednu
    říkal, že přichází doba „zachraň se, kdo můžeš“. Odvolává se na prezidenta, který prý před dvěma dny říkal,
    že mohou dopadat rakety a drony i v ČR. Obyvatelům Prahy, velkých měst či okolí letišť a muničních skladů
    radí mít připravené místo, kam odjet autem. Neříká, že se to stane, jen že je třeba být připraven.
  citace:
  - text: Chci slyšet, že jste všichni připraveni, že prostě s kým počítáte, že se něco takového může stát, že
      víte, kde budete, co budete jíst, co budete pít,
    cas: "1:08:22"
  - text: Neříkám, že se to stane, ale každý z vás musí být připravený na to, že taková věc se může stát.
    cas: "1:09:48"
  osoby:
  - {osoba: petr-pavel, vztah: neutralni, kontext: 'Podle Vrabela mluvil o možném dopadu raket a dronů v ČR'}
  vazby:
