  nadpis: Hypotetický Havlíček, který by schvaloval útok na Írán, „by měl jít k soudu a měl by být potrestaný“ (hraniční)
  text: Při srovnání s Hrdličkovým případem Vrabel říká, že kdyby místopředseda vlády Karel Havlíček veřejně schvaloval americký
