  - {na: vrabel-2026-11-09-05, typ: opakovani}
  podtema: Výstup z EU
- id: vrabel-2026-11-23-04
  typ: tvrzeni
  temata:
  - blizky-vychod
  - ceny-energie
  nadpis: Trump každé pondělí vyvolá krizi s Íránem a ve čtvrtek ji uvolní — na cenách ropy vydělávají on a jeho kolegové
    (Vrabel, 23. 11. 2026)
  text: Ke Trumpovu prohlášení o íránských podmínkách Vrabel tvrdí, že Trump už od června opakuje týdenní schéma,
    v němž v pondělí vyvolá problém, ve čtvrtek přislíbí otevření Hormuzu a dohodu a v neděli Írán ji popře. Ceny
    ropy a akcií podle něj lze takto cíleně pohybovat a Trump i jeho kolegové na tom „rejžují neuvěřitelný
    peníze“, zatímco trpí celý svět.
  citace:
  - text: Pondělí je problém a ve čtvrtek už bude hormůský průliv otevřený a dohoda bude na stole, aby jsme v neděli
      slyšeli od Iránu, že není.
    cas: "42:43"
  - text: Trpí kvůli tomu celý svět.
    cas: "43:11"
  osoby:
  - {osoba: donald-trump, vztah: negativni, kontext: 'Podle Vrabela týdně manipuluje trhem s ropou a na tom vydělává'}
