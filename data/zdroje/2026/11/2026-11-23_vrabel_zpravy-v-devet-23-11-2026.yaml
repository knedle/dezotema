  poznamka: 'Pondělní vysílání se spolumoderátorkou Zuzkou (čte zprávy, Vrabel komentuje; od 2:59). 17 témat v
    denním přehledu, 15 z nich s vlastním úhlem (⚡) v 15 výrocích. Predikce: 4 (odsouzení za symbol Z,
    Rusko a Čína vs. EU, Evropa bez jaderné odvety, migrační vlny ze Sýrie). Stochastický teror: 1 hraniční
    (hypotetické potrestání Karla Havlíčka za schvalování válečného zločinu; podmíněné, výzva k trestu bez
    násilí). Nezapsáno jako teror: označení Babiše a Pavla za „hloupé šašky“ (urážka bez dehumanizace
    nebo výzvy k trestu) a líčení Merze jako dosazence „chazarsko-židovských a sionistických“ finančních
    skupin (konspirační rámování bez výzvy k násilí či trestu). Ke zprávám Vrabel i Zuzka (host/spolumoderátorka)
    přidávají krátké reakce; zapsány jen Vrabelovy komentáře. Citace ověřeny v přepisu.'
  prehled:
  - tema: Rozsudek nad Tomášem Hrdličkou (symbol Z, § 405)
    text: označuje ho za „absolutně politický rozsudek“ v duchu 50. let, soudkyně podle něj nepokrývá úmysl a
      Hrdlička symbol nosil jako poděkování Rudé armádě; zatčení důchodkyně před soudem a obžaloba odvolání.
    vyrok: vrabel-2026-11-23-01
  - tema: Severoatlantická rada kvůli ruským raketám v Polsku
    text: rakety a dron spadly podle něj omylem po přesměrování ukrajinskou protivzdušnou obranou, nejde o ruský
      útok, politici nemají eskalovat.
    vyrok: vrabel-2026-11-23-02
  - tema: Parlamentní shromáždění NATO v Berlíně (Rutte, Zelenskyj)
    text: sabotáže a drony nad Německem a Polskem nikdo neumí přiřadit původci, tvrdí, že to NATO zneužívá jako
      záminku k eskalaci.
    vyrok: vrabel-2026-11-23-02
  - tema: Summit V4 v Bratislavě (Babiš, Fico, Tusk)
    text: V4 je pro něj „mrtvý projekt“, Babiš je „diktátor“, který zakázal referendum o EU, a země V4 mohou z EU
      kdykoli vystoupit.
    vyrok: vrabel-2026-11-23-03
  - tema: Trump o dohodě s Íránem
    text: Trump podle něj každý týden vyvolá pondělní krizi a ve čtvrtek ji uvolní, aby manipuloval cenou ropy a vydělali
      on a jeho kolegové.
    vyrok: vrabel-2026-11-23-04
  - tema: Merz — nepřijetí Ukrajiny do NATO v roce 2008 byla chyba
    text: souhlasí jen s tím, že chyba byla z pohledu BlackRocku a globalistů; Merz je podle něj dosazenec finančních
      rodin.
    vyrok: vrabel-2026-11-23-05
  - tema: Kořeny konfliktu Rusko–Západ (diskuse se Zuzkou)
    text: konflikt podle něj začal vyhnáním Chazarů z Ruska, studená válka nikdy neskončila a Západ chce Rusko
      rozložit; Rusko bude ekonomicky na tom lépe než EU.
    vyrok: vrabel-2026-11-23-06
  - tema: Trump omezuje přístup Kongresu k informacím
    text: přirovnává to k vládě, která zakáže parlamentu ji kontrolovat.
    vyrok: vrabel-2026-11-23-07
  - tema: Turecko varuje před izraelskou intervencí v Sýrii
    text: vidí tři problémy — umírání lidí, nové migrační vlny a propojení konfliktů v Íránu a na Ukrajině ve
      velkou válku.
    vyrok: vrabel-2026-11-23-08
  - tema: Útoky na ruské lodě u Libye, Finského zálivu a Kaliningradu
    text: Ukrajinci podle něj nebrání území, ale chtějí rozpoutat velkou světovou válku.
    vyrok: vrabel-2026-11-23-09
  - tema: Itálie varuje před válkou ve Středomoří
    text: politici se začínají bát eskalace a budou „vyskakovat“ s mírovými slovy, převahu ale mají válečníci.
    vyrok: vrabel-2026-11-23-10
  - tema: Medveděv o jaderných zbraních
    text: tvrdí, že Rusko už nasadilo Sarmat, nikdo by na jaderný útok neodpověděl a Pavel s Babišem jsou „hloupí
      šašci“.
    vyrok: vrabel-2026-11-23-11
  - tema: Finsko omezuje dopravu ve Finském zálivu
    text: vyzývá posluchače, aby se připravili na zavřené hranice, válečný stav a možný dopad raket i v ČR.
    vyrok: vrabel-2026-11-23-12
  - tema: Rusko–Estonsko, uzavření hraničních přechodů
    text: Evropa byla natlačena do války globalisty a sankcemi izoluje sebe, ne Rusko.
    vyrok: vrabel-2026-11-23-13
  - tema: Rada EU schválila rozpočet na rok 2027
    text: s Babišem souhlasí, že se nemá platit Ukrajině, nesouhlasí s tím, že by ČR měla zůstat v EU.
    vyrok: vrabel-2026-11-23-14
  - tema: Sbírka spolku Rodina Česká republika na prvním místě (Bojana)
    text: IBAN pro odkup pohledávky za Bojanou, aby ji nekoupili srbští vymahači.
  - tema: Zacharovová o stránce Mírotvorce
    text: Evropané podle ní netuší, že financují ty, kdo je zabíjejí; stránka sestavuje seznamy lidí k zabití
      a komentovat politiku je prý nebezpečné.
    vyrok: vrabel-2026-11-23-15
