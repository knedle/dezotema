- id: vrabel-2026-11-23-01
  typ: postoj
  temata:
  - dsa-cenzura
  - politicky-system
  nadpis: Rozsudek nad Tomášem Hrdličkou za symbol Z je „absolutně politický rozsudek“ — soudkyně trestá názor, ne
    úmysl (Vrabel, 23. 11. 2026)
  text: 'Vrabel komentuje podmíněný rozsudek (6 měsíců na 18 měsíců, resocializační program, propadnutí odznaku
    Z) nad Tomášem Hrdličkou za veřejné schvalování válečných zločinů podle § 405. Tvrdí, že soudkyně uznala
    právo mít jiný politický názor, ale ne právo ho veřejně vyjadřovat, nedoložila úmysl schvalovat válečné
    zločiny a hodnotí mezinárodní situaci, k čemuž podle něj nemá oprávnění. Hrdlička podle něj nosil Z
    jako poděkování Rudé armádě za osvobození a jako podporu lidí na Donbasu; svatojiřskou stuhu policie
    při zatčení nezabavila. Vrabel soudy přirovnává k padesátým letům a tvrdí, že za příklad vzorce stojí
    trestní oznámení z roku 2022 podané za PRO (Rajchl), jehož označuje za původce zneužívání § 405. Kdo
    si dnes vezme Z, bude podle něj téměř jistě odsouzen v prvé i odvolací instanci, dokud věc nezmění Nejvyšší
    či Ústavní soud; proto zrušil demonstraci 17. 11., zatímco Katku Blahníkovou, která stuhu vyskládala do
    Z na podporu Hrdličky, chce hájit „zuby nehty“.'
  citace:
  - text: Ale ona řekla, že Tomáš Ředlička má samozřejmě právo mít jiný politický názor, ale nemá právo ho vyjadřovat.
    cas: "05:31"
  - text: Tomáš Hedlička taky půjde na převýchovu, aby mu vysvětlili, jak politicky má přemýšlet a jak se politicky
      má chovat.
    cas: "12:30"
  - text: Politický soud. Není to nezávislý soud, který by rozhodoval na základě zákona.
    cas: "29:21"
  osoby:
  - {osoba: tomas-hrdlicka, vztah: pozitivni, kontext: 'Odsouzen za odznak Z, podle Vrabela jen za názor a za nevěru oficiálnímu výkladu'}
  - {osoba: rajchl, vztah: negativni, kontext: 'Podle Vrabela jeho strana PRO podáním trestního oznámení z roku 2022 vytvořila precedent trestnosti Z'}
