    politiku je „nebezpečné“ (Vrabel, 23. 11. 2026)'
  text: Vrabel cituje Marii Zacharovou, že Evropané netuší, že finančně podporují ty, kdo je budou zabíjet, v souvislosti
    se stránkou Mírotvorce. Tvrdí, že stránka vytváří seznamy českých lidí ve veřejném prostoru, kteří mají
    být zabiti, a že proto je i pro něj nebezpečné komentovat politiku, protože někdo chce politiku „zkroutit“
    do válečné propagandy.
  citace:
