  nadpis: Ukrajinské útoky na ruské lodě u Libye a Finska nejsou obrana — Ukrajinci chtějí rozpoutat velkou válku (Vrabel,
    23. 11. 2026)
  text: K zprávám o ukrajinských útocích na ruské lodě u Libye, ve Finském zálivu a v Kaliningradu Vrabel říká,
    že právo Ukrajinců bránit své území chápe, ale bombardování ruské fregaty u Libye podle něj konflikt jen eskaluje
    a nepomáhá obraně fronty. Jediné vysvětlení vidí v tom, že se Ukrajina snaží rozpoutat velkou světovou
    válku. Ruský vstup na ukrajinské území vysvětluje tím, že Ukrajina byla zatažena do konfliktu s hrozbou
    jaderných zbraní.
  citace:
  - text: ale Ukrajinci jako kdyby chtěli rychle rozpoutat válku, jako velkou světou válku.
    cas: "56:32"
  - text: Protože se snaží rozpoutat velkou válku. Jinej důvod k tomu nevidím.
    cas: "58:07"
