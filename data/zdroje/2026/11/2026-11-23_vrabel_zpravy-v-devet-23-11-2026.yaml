  nadpis: 'Sankce a hranice: „My izolujeme sebe“ — Evropa byla natlačena do války globalisty a likviduje si ekonomiku
    (Vrabel, 23. 11. 2026)'
  text: K ruské protestní notě Estonsku Vrabel tvrdí, že globalisté (hlavně z USA) Evropu do války natlačili,
    USA se pak stáhly a prodávají jen zbraně, zatímco Evropa staví miny, ploty a armády na hranicích. Sankce
    podle něj Rusko neoslabily, naopak ho posílily přesunem prodeje do Asie a růstem ekonomiky; Evropa se tak
    izoluje sama a ničí si ekonomiku.
  citace:
  - text: A to není tak, že my izolujeme Rusko. My izolujeme sebe.
    cas: "1:11:32"
  - text: Rusko díky těm sankcím posílilo.
    cas: "1:11:43"
