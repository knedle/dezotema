- id: vrabel-2026-11-23-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  - konspirace
  nadpis: Nepřijetí Ukrajiny do NATO (2008) byla chyba jen pro BlackRock a globalisty — Merz je jejich „generál“ dosazený
    do funkce (Vrabel, 23. 11. 2026)
  text: 'Ke slovům Friedricha Merze o historické chybě z Bukurešti Vrabel souhlasí jen v tom, že šlo o chybu pro
    Německo, BlackRock a „elitáře“, kteří se přes proxy válku v Ukrajině snaží Rusko rozbít; z pohledu míru
    a práva Rusů na vlastní zemi ji za chybu nepovažuje, protože s Ukrajinou v NATO by Rusko možná už neexistovalo.
    Merze popisuje jako bývalého šéfa BlackRock Deutschland, „generála nebo plukovníka v poli“ globalistů,
    kterého podle něj dosadily stejné finanční rodiny (označuje je jako chazarsko-židovské a sionistické)
    a tajné spolky, jaké v minulosti řídily Německo před válkou. Konstatuje, že nežijeme v demokratickém systému
    a že tyto skupiny dlouhodobě opakují stejný postup (zvyšování sazeb, inflace, globalizace, válka, změna
    centrální měny). Americké prohlášení o proxy válce podle něj potvrdil i Musk.'
  citace:
  - text: Minimálně pro ty globalisty a pro ty elitáře světové, kteří se snaží teďkon poslední roky Rusko rozbít
      skrze tu proxy válku skrze Ukrajinu.
    cas: "44:16"
  - text: To je bývalý předseda představenstva společnosti BlackRock.
    cas: "46:25"
  - text: Oni ho dosadili do funkce kancléře Německa.
    cas: "47:16"
  osoby:
  - {osoba: friedrich-merz, vztah: negativni, kontext: 'Bývalý šéf BlackRock Deutschland, dosazený „rodinami“ do funkce kancléře'}
  - {osoba: elon-musk, vztah: neutralni, kontext: 'Podle Vrabela potvrdil, že v roce 2014 Američané svrhli vládu na Ukrajině'}
  - {osoba: mark-rutte, vztah: neutralni, kontext: 'Merz mluvil na společné tiskovce s ním'}
  vazby:
  - {na: vrabel-2026-11-18-04, typ: posun}
  podtema: Vyjednávání a mír
- id: vrabel-2026-11-23-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  - konspirace
  nadpis: Konflikt Rusko–Západ začal vyhnáním Chazarů a nikdy neskončil — Západ chce Rusko rozložit, nová železná opona
    nebo velká válka (Vrabel, 23. 11. 2026)
  text: 'Na Zuzčinu poznámku, že konflikt začal v roce 2008, Vrabel odpovídá, že podle něj začal už tehdy, když
    Rusové vyhnali Chazary, kteří se usadili v Londýně, Francii a New Yorku a vybudovali tamní centra moci.
    Druhá světová válka podle něj fakticky neskončila (plán Unthinkable, tajná organizace vojáků v Evropě),
    studená válka byla „podvod“ vůči Sovětskému svazu, jehož rozpad Západ vyvolal a během něj rozšiřoval
    NATO. Rusko se díky Putinovi ekonomicky zvedlo, proto Západ odmítl jeho vstup do NATO, protože ho chce
    „podmanit, rozkrást, rozložit“. Dnes podle něj vzniká nová železná opona, která může přejít ve velkou
    válku, protože na rozdíl od studené války už je konflikt na Ukrajině prolomen.'
  citace:
  - text: tak ten konflikt začal, když Rusové vyhnali Chazary,
    cas: "49:53"
  - text: Ten východní blok měl pravdu, že ten západ se celou dobu chystá, ty imperialisté rozloží ten východní blok.
    cas: "51:22"
  - text: Protože prostě ten západ chce to Rusko dobít, chce si ho podmanit, chce ho rozkrást, chce ho rozložit,
    cas: "52:22"
  osoby:
  - {osoba: vladimir-putin, vztah: pozitivni, kontext: 'Za jeho vlády se Rusko ekonomicky zvedlo a řeklo „a dost“'}
  vazby:
  - {na: vrabel-2026-11-18-04, typ: posun}
  podtema: Vyjednávání a mír
