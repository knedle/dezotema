  nadpis: Izraelská hra v Sýrii by přinesla umírání, nové migrační vlny a propojení konfliktů v Íránu a na Ukrajině
    (Vrabel, 23. 11. 2026)
  text: 'Ke zprávě tureckého ministra, že Izrael vyzbrojuje drúzskou skupinu na jihu Sýrie, Vrabel říká, že pokud
    je to pravda, vidí tři problémy: umírání lidí, další migrační vlny do Evropy a propojení ohnisek v Íránu
    a na Ukrajině, které se může změnit ve velkou světovou válku.'
