  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**9. 11.** — Zítko tvrdí, že „dvojník Tomáše Čermáka se prokázal tím, že nepřišel“: v Holýšově
    prý měl šest lidí schopných ověřit totožnost a hospodu asi 100 metrů daleko. Na Patrika Tušla, který
    podle něj sdílí „fízlácké materiály“ proti němu, reaguje otázkou, zda je „pod vlivem drog“, „zkorumpovaný“,
    nebo ho „něčím vydírají“. Obvinění, že jeho firma E-Medic Development provozovala očkovací centra,
    odmítá jako „fízláckou provokaci“ (firma prý vyvíjela aplikaci pro telemedicínu). Zdenku Křešťákovou
    ze spolku „Společně jsme silnější“ řadí mezi „čarodějnice“, které mu bránily ve financování prezidentské
    kampaně. Soně Gagliardi navrhuje, ať mu Čermáka „přiveze“ k ověření totožnosti.'
  osoby:
  - osoba: patrik-tusl
    vztah: negativni
    kontext: Šíří „fízlácké materiály“, „zoufalství nezná mezí“
  - osoba: zdenka-krestakova
    vztah: negativni
    kontext: „Čarodějnice“, bránila financování jeho kampaně
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-11-09-03
  typ: tvrzeni
