  nadpis: „Czexit" je iluze, jedinou cestou je obnova ČSR; vítězné mocnosti budou chtít „chcimíry" (Zítko,
    3. 10. 2026)
  text: '**9. 11.** — Zítko tvrdí, že „Peking se vyjádřil, že na 99 % bude obnoveno Československo“. Obnova
    proběhne podle „platného zákona číslo 11 z roku 1918“ bez referenda a bez chaosu, Benešovy dekrety
    stále platí a zákon 542/1992 o zániku federace je „od začátku neplatný“, protože „akt vlastizrady
    je nepromlčitelný“. Referendum by mělo proběhnout jen na východě, o případném připojení Zakarpatské
    Ukrajiny v hranicích z roku 1918. Po skončení konfliktů v Íránu a na Ukrajině přijde podle něj „definování
    nových hranic v Evropě i na světě“ v rámci mírového plánu Trumpa, Putina a Si Ťin-pchinga, který bude
    „co nevidět na stole“. Nerozhodnou o tom „ani Babiš, ani Pávek, ani Fiala, ani Rakušan“. Lidé si mají
    zvolit zástupce pro jednání „jako ve Versailles“. Zesměšňuje, že prezidentem ČSR by teď chtěli být
    i „falešný Čermák“ a Jiří Černohorský.'
  citace:
  - text: Stejně jako za druhé světové války, kdy jsme byli 6 let rozdělený, se zase Československo podle
      platného zákona číslo 11 z roku 1918 zase spojí.
  osoby:
  - osoba: cernohorsky
