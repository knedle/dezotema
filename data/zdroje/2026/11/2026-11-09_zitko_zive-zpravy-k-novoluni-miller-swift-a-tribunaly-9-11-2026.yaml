  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**9. 11.** — Vlastní řeč tvoří asi čtvrtinu vysílání, zbytek je předčítání. Zítko prohlašuje,
    že Stephen Miller „dneska, 9. listopadu, úplnou náhodou“ nahradil ženu spolupracující s „farmaceutickou
    mafií“, a „sekačka teď jede jako blázen“ („zapamatujte si tohohle chlapíka, bude to jízda“). Podle
    sdílených seznamů prý asi 900 celebrit (Diana, Elvis, Monroe, JFK, Cobain, Jackson) žije v ochraně
    svědků a JFK mladší se objeví. „Židé a zednáři“ podle něj převedli státy na korporace a z lidí udělali
    „právní fikce“. Trump prý řekl, že 80 % vojenské operace proti deep state zůstane skryto a 20 % bude
    „velmi viditelných“. Z cizího článku čte, že systém SWIFT byl 9. 11. 2026 vyřazen a přechází se na
    „kvantový finanční systém“ (QFS, ISO 20022, „úroveň 4B“). Sám dodává, že „bouře je tady“: přijde kybernetický
    útok, bankovní kolaps, výpadek internetu a EBS „ve třech osmihodinových smyčkách“, instituce „padají
    jako kostky domina“ a „XRP usedá na trůn“. Ukrajina byla podle něj s biolaboratořemi „laboratoří pro
    transhumanistické sny Jeffreyho Epsteina“, obchod s lidmi a orgány odhalí EBS. Musk podle něj zveřejnil
    příjemce peněz USAID v Česku (Bakalova nadace, STEM, Prague Pride, Člověk v tísni, vysoké školy) a
    na Slovensku (Šimečkovi). EBS bude podle Zítka spuštěn „pravděpodobně teď v listopadu“.'
  citace:
  - text: Starý finanční systém umírá, skorumpované instituce padají jako kostky domina a Fénix vstává
      z popela.
