  poznamka: 1 h 11 min, „9/11 Zprávy k novoluní 9:11“. Vlastní řeč tvoří asi 25–30 %, zbytek je předčítání
    cizích příspěvků (Lion White, Sofia Esmeralda, Telegram, článek o SWIFT/QFS) a promo (Essence, Bewit).
    Zpracováno 12 témat, 1 predikce, 3 výroky stochastického teroru (Tedros, Babiš a vláda, von der Leyenová).
    Zpracováno podle shrnutí pomocného agenta, citace stochastického teroru ověřeny v přepisu.
