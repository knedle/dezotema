- id: vrabel-2026-11-22-01
  typ: postoj
  temata:
  - valka-nato-rusko
  nadpis: Úlomky raket v Polsku nejsou útok Ruska — není důvod začínat třetí světovou válku; Polsko je podle
    Vrabela samo ve válce (Vrabel, 22. 11. 2026)
  text: 'K zprávě, že na Polsko dopadly dva úlomky raket a dron, kvůli čemuž se schází Rada bezpečnosti OSN
    a Poláci chtěli aktivovat článek 5, Vrabel tvrdí, že nejde o útok na Polsko: rakety nebo drony mohly
    být sestřeleny či odkloněny při ruském útoku na Ukrajinu a mohly dopadnout jinam, stejně jako ukrajinské
    drony občas dopadnou v EU. Vyčítá politikům, že u ruských střel reagují jako na agresi, a volá po tom,
    aby se tak nevyjadřovali. Zároveň soudí, že Polsko je „naprosto jasně“ ve válečném konfliktu, protože
    vyrábí drony a posílá je na Ukrajinu.'
