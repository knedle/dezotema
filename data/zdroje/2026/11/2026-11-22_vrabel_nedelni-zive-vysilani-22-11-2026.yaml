- id: vrabel-2026-11-22-04
  typ: tvrzeni
  temata:
  - dsa-cenzura
  - politicky-system
  nadpis: Státy ovládají nadnárodní organizace, cenzura je „absolutní“ a suverenisté jsou ničeni — sankční seznam
    EU pro novináře Chaye Bowese (Vrabel, 22. 11. 2026)
  text: 'Vrabel tvrdí, že v rámci agendy 2030 jsou státy kontrolované nadnárodními organizacemi (EU, MMF,
    Světová banka, NATO, Aspen Institute, CNN), v médiích i na sociálních sítích existuje jediná povolená
    „pravda“ a kdo se postaví proti režimu za svou zemi (národovec, suverenista), je ničen. Jako příklady
    uvádí Russella Branda a irského novináře Chaye Bowese, který se po životě v Rusku ocitl na sankčním seznamu
    EU, takže mu podle Vrabela nikdo nesmí nic prodat ani poskytnout hmotné či nehmotné plnění a banka mu
    nevydá peníze; podobně prý dopadl norský profesor Glenn Diesen. Sám zažívá ekonomický tlak i trestní
    řízení a Lukáše Valáška (Aktuálně, Seznam Zprávy) označuje za novináře, který dostává podklady od BIS
    a „evidentně spolupracuje s tajnými službami“.'
  citace:
  - text: a už je tady prakticky absolutní cenzura,
    cas: "20:43"
  - text: že ta situace se velmi zhoršuje, velmi rapidně se zhoršuje, co se týče svobody a boje proti nám lidem,
      kteří bojujeme za suverenitu.
    cas: "24:48"
  - text: a zprávy dostává evidentně od BIS, evidentně spolupracuje s tajnýma službama,
    cas: "23:26"
  osoby:
