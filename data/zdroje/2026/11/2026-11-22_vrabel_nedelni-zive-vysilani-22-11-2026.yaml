- id: vrabel-2026-11-22-07
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Investiční zlato — spread, „papírové zlato“ srážející cenu a hrozba evidence a odzlacení v EU (Vrabel,
    22. 11. 2026)
  text: 'Na dotaz posluchačky Vrabel říká, že hlavním mínusem zlata je likvidita (spread kolem 5–7 %) a kolísání
    ceny, které podle něj způsobuje obchodování s „papírovým zlatem“; JP Morgan prý prodává papírové zlato
    a stříbro a nakupuje fyzické, čímž ceny uměle tlačí dolů, zatímco Čína prý obchod s papírovým zlatem
    omezila. Dlouhodobě je zlato podle něj nejstabilnějším uchovatelem hodnoty. Varuje, že koupené zlato
    se eviduje a EU chystá evidenci takových aktiv, takže při potřebě peněz na válku by ho mohla „odzlatit“;
    doporučuje zvážit nákup zlata bez papírů a jako dlouhodobou investici nemovitosti.'
  citace:
  - text: Takže třeba JP Morgan dává na trh spoustu papírového zlata i z papírového stříbra a zkupuje místo
      toho to fyzické.
    cas: "1:08:48"
  - text: A Evropská unie chystá evidenci takových věcí, jako je třeba i zlato.
    cas: "1:11:37"
