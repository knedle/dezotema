  - text: To je všechno politická objednávka.
    cas: "49:54"
  - text: Tohle to je nejhorší podvodník, kterýho jsem v životě potkal.
    cas: "48:54"
  - text: rozhodli, že dají dohromady peníze a odkoupí tu pohledávku,
    cas: "51:36"
