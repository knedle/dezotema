  - {osoba: glenn-diesen, vztah: pozitivni, kontext: 'Norský profesor v „podobné situaci“ jako Bowes'}
  - {osoba: russell-brand, vztah: pozitivni, kontext: 'Odsouzení označuje za příklad likvidace suverenistů'}
  - {osoba: lukas-valasek, vztah: negativni, kontext: 'Novinář, který podle Vrabela dostává zprávy od BIS a spolupracuje s tajnými službami'}
