- id: vrabel-2026-11-22-05
  typ: tvrzeni
  temata:
  - kauzy
  - politicky-system
  nadpis: Kauza manželky Bojany — insolvenční správce, soudce, policista a novinář jako „organizovaný zločin“;
    sbírka na odkup pohledávky do 23. 12. (Vrabel, 22. 11. 2026)
  text: 'Vrabel znovu vypráví, že peníze, které lidé posílali na jeho demonstrace přes účet manželky Bojany,
    chtěl insolvenční správce zahrnout do jeho majetkové podstaty; zablokoval jí účet, banka ho po upozornění
    na předmanželskou smlouvu odblokovala, ale správce Bojanu zažaloval a soud bez dokazování uložil zaplatit
    asi 1,2 milionu (dnes kolem 2,5 milionu s úroky). Tvrdí, že hospodářská kriminálka přitom konstatovala,
    že peníze nikdy nepatřily jemu, správce měl údajně v podkladech chyby (připsaná nula, dvakrát započtených
    450 tisíc) a trestní oznámení proti němu skončilo u stejného policisty z Českých Budějovic, Petra Michala,
    který ho tři dny po demonstraci začal stíhat na základě článků Lukáše Valáška. Celý řetězec (správce,
    soudce, policista, novinář, Rakušan, Fiala) označuje za „moloch“ a „organizovaný zločin“ a politickou
    objednávku, který kauzy „zametá pod koberec“. Správce nyní pohledávku nabízí k prodeji; rodina Česká
    republika na prvním místě proto sbírá peníze, aby ji odkoupila, a vybranou částku nemůže zveřejnit,
    protože jde o soutěž nabídek.'
  citace:
