  kanal: Ladislav Vrabel
  titul: Nedělní živé vysílání 22. 11. 2026
  datum: 2026-11-22
  url: https://www.facebook.com/100087923704145/videos/1917200756310966
  prepis: prepisy/done/2026-11-22_Ladislav-Vrabel_Nedělní-živé-vysílání-ve-21h.txt
  delka: "02:28:30"
  rezim: vrabel
  poznamka: 'Pravidelné nedělní vysílání (2 h 28 min), Vrabel mluví sám (Zuzka se připojila až kolem 17. minuty,
    jen podává dotazy). Přibližně prvních 25 minut komentuje svět (eskalace, protesty, cenzura), pak 1 h
    věnuje kauze manželky Bojany (insolvenční správce, sbírka na odkup pohledávky do 23. 12.), odpovědím na
    dotazy (zlato, nemovitosti, Facebook, Musk) a Russellu Brandovi; od 1:41 vypráví autobiografický příběh
    (podnikání v Českých Budějovicích, kmotři ODS, cesta do insolvence). 22 témat v denním přehledu, 14
    výroků (z toho 3 predikce a 1 hraniční stochastický teror). Stochastický teror: hraniční je jen naznačená
    výhrůžka insolvenčnímu správci („jen proto, že jsem buddhista, jsem klidný a nezakročil jsem jinak“);
    pojmenovaný terč chybí (jméno neuvedeno), dehumanizace ani otevřená výzva k násilí nezazněly. Čistě
    osobní části příběhu (rodina, vor s pivem, podnikatelské začátky) jsou jen v přehledu. Zpracováno vlastním
    čtením celého přepisu, citace ověřeny.'
  prehled:
  - tema: Soud s Tomášem Hrdličkou (23. 11.)
    text: vyzývá k podpoře u Obvodního soudu pro Prahu 1 (souzený za nošení odznaku s písmenem Z); sám nepřijede,
      pokud ale budou soudit Katku Blahníkovou, přijede a udělá demonstraci.
  - tema: Video o ruských dětech počítajících „na počítadle v hlavě“
    text: ukazuje krátké video s dětmi, které rychle počítají z hlavy, a je jím nadšený.
  - tema: Ukrajinský diplomat Perebyjnis o Rusech
    text: označuje za „zásadní výrok“, že všichni občané Ruské federace jsou hrozbou pro Evropu, protože
      nevíme, kdo je agentem tajných služeb.
  - tema: Eskalace mezi Ruskem a koalicí ochotných
    text: situace je „naprosto brutální“, Kaliningrad, Finsko a Litva ukazují zostřování, opakuje své varování
      před velkou válkou.
    vyrok: vrabel-2026-11-21-10
  - tema: Úlomky raket a dron v Polsku, Rada bezpečnosti OSN
    text: nejde o útok Ruska na Polsko a politici nemají dělat silná prohlášení; Polsko je podle něj
      ve válce nepřímo, protože vyrábí drony pro Ukrajinu.
    vyrok: vrabel-2026-11-22-01
  - tema: Trump o vztahu k Putinovi
    text: Trump řekl, že za Ameriku nemůže mluvit, ale že s Putinem má dobrý osobní vztah ještě z „Russia
      Gate“.
  - tema: Setkání Trumpa, Si Ťin-pchinga a Putina v Šen-čenu
    text: tři velmoci si podle něj řekly, že na sebe nebudou útočit jadernými zbraněmi a každá si bude
      dělat své ve své sféře; po setkání se situace začala rychle eskalovat.
    vyrok: vrabel-2026-11-22-02
  - tema: Válka s Evropou a horizont 2030
    text: válka s Evropou podle něj nemusí čekat na rok 2030 a situace ještě nikdy nebyla tak vážná.
    vyrok: vrabel-2026-11-22-03
  - tema: Protesty proti válce v Evropě a Letná
    text: půl milionu lidí v Itálii, studenti v 25 zemích EU i čeští studenti proti válce, zatímco na Letné
      se demonstrovalo „za víc zbrojení“ (opakuje).
    vyrok: vrabel-2026-11-21-01
  - tema: Protesty ve Španělsku po smrti vystěhované seniorky
    text: demonstrace vyvolala smrt Marie Carmen Abascal, kterou investiční firma vystěhovala z bytu na
      invalidním vozíku; k tomu se přidávají Palestina a Antifa.
  - tema: Agenda 2030, cenzura a tlak na suverenisty
    text: státy jsou ovládané nadnárodními organizacemi a média i sociální sítě cenzurují; případy Branda,
      Chaye Bowese a Glenna Diesena mají ukazovat, že suverenisté jsou likvidováni.
    vyrok: vrabel-2026-11-22-04
  - tema: Kauza manželky Bojany — dluh 2,5 milionu a sbírka
    text: insolvenční správce prodává pohledávku a rodina Česká republika na prvním místě sbírá do 23. 12.
      peníze na její odkup; Vrabel vypráví celou kauzu jako dílo „organizovaného zločinu“.
    vyrok: vrabel-2026-11-22-05
  - tema: Dotaz na investiční zlato
    text: největší mínus zlata je spread a „papírové zlato“ srážejí ceny; dlouhodobě je to nejstabilnější
      uchovatel hodnoty, ale kupované zlato je evidováno a EU prý chystá evidenci.
    vyrok: vrabel-2026-11-22-07
  - tema: Dotaz na investice do nemovitostí
    text: nemovitosti v Praze, Kyjevě a Berlíně už ceny neženou, pro „našince“ je nejlepší Srbsko mimo EU.
    vyrok: vrabel-2026-11-22-08
  - tema: Dotaz „agenti Putina a Soroše“ a Facebook
    text: většina lidí je podle něj na straně suverenistů, ale Facebook a sociální sítě mají pod kontrolou
      jejich odpůrci a potlačují jeho dosah (opakuje).
    vyrok: vrabel-2026-11-22-09
  - tema: Migrace, Manchester, vánoční trhy a grooming
    text: globalisté nám „nandali do zemí cizí lidi“, kteří chtějí prosazovat šáriu; Británie je „úplně
      špatná“ (případ Rotherhamu a Tommyho Robinsona).
    vyrok: vrabel-2026-11-22-10
  - tema: Russell Brand a vzkaz z vězení
    text: Brand je podle něj odsouzen bez jediného důkazu a je „jednoznačně nevinný“; britská vláda ho
      za vzkaz z vězení trestá zákazem styku s rodinou (rozvíjí).
    vyrok: vrabel-2026-11-22-11
  - tema: Rainer Fuellmich a vlastní dotační případ
    text: Fuellmich sedí za údajné zpronevěry po udání kolegyně, podobně byl vykonstruován „dotační podvod“
      jemu (stát měl vyplatit náhradu škody, ne dotace).
    vyrok: vrabel-2026-11-22-12
  - tema: Dotaz na Muskův výrok o převratu na Ukrajině 2014
    text: Musk podle dotazu přiznal, že USA zorganizovaly převrat; Vrabel to pokládá za známou věc, kterou
      mainstream nikdy nenapíše.
    vyrok: vrabel-2026-05-31-08
  - tema: Československo, počty na demonstracích a „hon na čarodějnice“
    text: společný stát by pomohl, protože na Slovensku je méně lidí ovlivněných médii; své demonstrace
      označuje za větší, než tvrdí Rajchl, a o sobě říká, že ho média nyní „vymlčují“.
  - tema: Autobiografie — podnikání, České Budějovice a insolvence
    text: rozsáhle vypráví o 8 letech boje s městem a kmotry ODS v Českých Budějovicích, přes které přišel
      o podniky a do insolvence; vše uzavírá tvrzením „korupce je základ toho“.
    vyrok: vrabel-2026-11-22-13
  - tema: Závěr — prosba o pomoc manželce k Vánocům
    text: žádá o příspěvky na odkup pohledávky, protože i jemu by to dalo „jinou pozici pro boj“.
