vyroky:
- id: rajchl-2026-11-14-01
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Merzovo „brutální vydírání“: blokace rozpočtu EU, aby ČR platila Ukrajině 60–70 mld. Kč ročně
    — vláda nesmí ustoupit „ani o milimetr“ (Rajchl, 10. 11. 2026)'
  text: '**14. 11.** — Rajchl se obrací proti opozici, která podle něj Merzovu požadavku nechce vzdorovat,
    protože je složena ze „servilních slabochů“, kteří „budou vždy plnit to, co jim Němci řeknou“. Peníze
    za jediný rok, které „zaplatí jednou naše děti“, by podle něj šly kromě rozkradené části na ukrajinské
    důchody, zdravotnictví, školství a „oligarchům na zlaté toalety“. Kdyby je chtěla vláda dát českým
    důchodcům, zdravotním sestrám nebo školám, opozice by prý křičela o nezodpovědném zadlužování. Postoj
    opozice nazývá „vlastizrádnou mentalitou“, „podrazem na naši zemi“ a „definitivním důkazem“, že jí
    jde víc o Ukrajinu než o Českou republiku. Slibuje, že z daní „už na Ukrajinu nepůjde ani koruna“.'
  citace:
  - text: Chápete tu vlastizrádnou mentalitu? Peníze z našich daní, které zaplatí jednou naše děti, dáme
      radši Ukrajincům než Čechům?
  osoby:
  - osoba: opozice
    vztah: negativni
    kontext: „Servilní slaboši“, „vlastizrádná mentalita“, dali by peníze Ukrajině místo Čechům
