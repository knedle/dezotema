vyroky:
- id: vrabel-2026-11-06-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Francouzská daň z internetu (5,5 centu/GB) jako „budoucnost“ a protesty proti datovým centrům
    jako odpor proti „digitálnímu koncentráku“ (Vrabel, 6. 11. 2026)
  text: 'Návrh francouzských poslanců zdanit každý přenesený gigabajt podle Vrabela neprošel jen proto,
    že byl součástí odmítnutého rozpočtu; pravděpodobně ale projde a je zvědavý, kdy se přidá Babiš. Předlužená
    Francie je podle něj „katastrofa pro celý západ“ a může být prvním padajícím kamenem domina. Daň firmy
    přenesou na uživatele a přibude k dalším způsobům „obírání“ — útoku na nemovitosti a úspory, registru
    majetku a digitální měně, kterou podle něj budou státy mít v roce 2027 a občané „během několika let“.
    K vniknutí demonstrantů na staveniště datového centra Microsoftu v Amsterdamu tvrdí, že nejde o ekologii:
    maskovaní protestující podle něj na rozdíl od „zelených dementů“ „přemýšlí podobně jako my“ a nechtějí
    „digitální koncentrák“, jehož procesy poběží v datových centrech.'
  citace:
  - text: Myslím si, že to jsou spíš lidi, který přemýšlí podobně jako my, kteří nechtějí žít v digitálním
      otrodství, které se tady staví, v digitálním vězení nebo v digitálním koncentráku,
- id: vrabel-2026-11-06-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Násilné protesty v Evropě jako řízené odvedení pozornosti před válkou; Babiš má od tajných služeb
    informace o 17. listopadu (Vrabel, 26. 10. 2026)
  text: '**6. 11.** — K sérii bombových výhrůžek (odklon letu Praha–Řím, redakce v několika zemích, odesílatel
    „Michail Andropov“) Vrabel zvažuje AI nebo ruskou kampaň, za nejpravděpodobnější ale považuje operaci
    CIA a MI6 pod falešnou vlajkou. Spolu s údajným ohřátím mrazáků v asi 6000 obchodech jde podle něj
    o nový typ „teroristických útoků“ bez požadavků; podle principu cui bono z nich má užitek jen ten,
    kdo z nich později někoho obviní. Chaos, ve kterém „nikdo neví, co bude následovat“, je podle něj
    situace před začátkem války.'
  citace:
  - text: Podle měho názoru nejpravděpodobnější bude to, co jsem říkal poslední, nějaká CIA M6, nějaká
      operace, která má být nějaká operace pod falešnou vlajkou.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-11-06-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Globální vzorec perzekuce kritiků globalistické agendy (Vrabel, 9. 7. 2026)
  text: '**6. 11.** — K polskému zákonu, který umožní dávat osoby na sankční seznamy kvůli „zahraničnímu
    vměšování a manipulaci s informacemi“ (zmrazení majetku, vyloučení ze zakázek), Vrabel tvrdí, že totalita
    vzniká postupným omezováním svobod. Když režim někoho nemůže odsoudit za slova, zlikviduje ho finančně
    (odkazuje na vlastní zkušenost a na Molodovou) nebo obviněním ze sexuálních deliktů. K odsouzení Russella
    Branda dodává, že ženu, kterou měl znásilnit, popisuje jako „promiskuitní“ fanynku, a trest považuje
    za „velmi nespravedlivý“; Brand je podle něj „skutečná opozice“.'
  citace:
  - text: odsoudit teďko neho do vězení na několik let mi připadá velmi nespravdlivý.
  podtema: Politická perzekuce
- id: vrabel-2026-11-06-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Polsko: „ústavní puč“ Tuskovy vlády jako boj EU o polskou suverenitu (Vrabel, 31. 10. 2026)'
  text: '**6. 11.** — K Tuskově výzvě „nepanikařte“ po videích vojáků Bundeswehru ve Varšavě Vrabel připomíná
    srpen 1968 a nevěří, že jde o ceremoniál. Němečtí policisté a vojáci tam podle něj jsou, protože Poláci
    jsou „nacionalisté“ a polští policisté a vojáci by proti vlastním občanům nezasáhli. Polsko je podle
    něj „hromada dynamitu“, která čeká na jiskru.'
  citace:
  - text: Myslím si, že je to kvůli tomu, že Poláci jsou nacionalisty a bude strašně těžký přesvědčit
      polskí policisty a polskí vojáky, aby zasáhli proti polským občanům.
  podtema: Česká suverenita
- id: vrabel-2026-11-06-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: V4 je zase jednotná, protože i Maďarsko souhlasí s válkou — Vrabel (23. 6. 2026)
  text: '**6. 11.** — K deklaraci prezidentů V4 z Trenčína (podpora rozšíření EU a vojenské pomoci Ukrajině,
    za účasti von der Leyenové) Vrabel V4 jako vlasteneckou myšlenku odepisuje. Mantru „V4 nás zachrání“
    podle něj na vlastenecké scéně kolem roku 2015 rozšířil Martin Konvička, později ji převzali Okamura
    a Rajchl; dnes je V4 podle něj „rádoby spolek“, který podporuje nenávist proti Rusku a zbrojení.'
  citace:
  - text: prostě V4 je pro mě mrtvá, co se týče nějakého vlastenectví nebo nějakého patriotismu.
  podtema: Evropský parlament a V4 strategie
- id: vrabel-2026-11-06-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zvláštní vyslanec EU pro jednání s Putinem — Stubb „největší nácek“, Kallasová „potomek nacistických
    rodičů“; mír dohodnou velmoci jako v Jaltě (Vrabel, 22. 10. 2026)
  text: '**6. 11.** — Na divácký dotaz, koho by zvolil za lídra Evropy, Vrabel odpovídá, že nikoho, protože
    do vedoucích funkcí se dostane jen ten, kdo „absolutně slouží“ globalistům; za ČR by k jednání „poslal
    sebe“. Za vhodné vyjednavače považuje Štefana Harabina a Andrewa Bridgena. Formálně by EU měli zastupovat
    Kallasová, Costa a von der Leyenová, ale Costu označuje za „naivního strejdu“ a Kallasovou i von der
    Leyenovou za nacistky; Evropa podle něj stejně nemá co vyjednávat, protože není pozvaná.'
  citace:
  - text: Kaja Kalas je absolutní nacistka a co se týče Uršuli von der Leyen, no tak ta je taky.
  podtema: Vyjednávání a mír
- id: vrabel-2026-11-06-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Trumpova „velká dohoda“: ruská energie pro Evropu přes USA a stažení vojsk od ruských hranic;
    Abú Zabí bez průlomu, Budanov „motyka“ (Vrabel, 6. 11. 2026)'
  text: 'K Trumpovu oznámení „mimořádně rozsáhlé“ dohody po schůzce s Dmitrijevem Vrabel očekává dvě roviny.
    První je obchod: Evropa bude kupovat ruskou ropu a plyn přes Spojené státy a Ukrajinu, Ukrajina dostane
    tranzitní poplatky, USA „výpalné“ a evropští politici si zachovají tvář; podpoří to i demokraté, protože
    by byli „šílenci“, kdyby nechtěli „podojit“ „hloupou“ Evropu. Druhou rovinou je stažení vojsk z okolí
    Ruska ve smyslu „návratu NATO do roku 1997“, kterého se bojí Brusel i Ukrajina. Delegace v Abú Zabí
    podle něj nemají mandát — Budanov je „motyka“, Witkoff a Kushner nevolení „realitní makléři“, Medinskij
    poradce — takže průlom nebude; skutečně se bude jednat mezi USA, Ruskem a Čínou o sférách vlivu.'
  citace:
  - text: Takže myslím si, že ta krásná dohoda bude o tom, že se Američani a Rusové dohodnou na tom, že
      Evropa bude přes Spojené státy nakupovat energie z Ruska a přes Ukrajinu,
  podtema: Vyjednávání a mír
