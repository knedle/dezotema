  text: '**13. 11.** — V pátek 13. v 11:11 Zítko tvrdí, že potopení lodi SS United States je „jasná zpráva“,
    že „korporace USA“ z roku 1871 jde ke dnu a nahrazuje ji „republika pod vojenskou mocí“. „Konec Fedu
    se stává realitou a bude turbulentní, děsivý“. Titanic podle něj nebyl potopen, šlo o pojistný podvod
    s lodí Olympic kvůli založení Fedu. Letadla 11. září byla podle něj hologramy, WTC 7 padla řízenou
    demolicí a organizátory byli Bush, Rumsfeld a Cheney. USA, Rusko a Čína jsou podle něj pod jediným
    velením a Trumpovo gesto prsty je logo Space Force. Přebírá tvrzení, že Paul McCartney zemřel v roce
    1966 a nahradil ho William Campbell. Biden byl podle něj „o 30–40 cm větší“ dvojník a „Paul Walker
    už nebude muset hrát J. D. Vance“. Herci z central castingu budou podle něj o Vánocích doma. Výpadky
    Microsoftu a Fox News bere jako znamení, že „se něco děje“, a Stephen Miller podle něj začal „čistit“
    neziskový sektor (zatčení Heidi Beirich ze SPLC). Předčítá svědectví, podle nichž se už distribuují
    „Q-phony“ napojené na QFS a biometrii a od 1. 12. bude „Q-phone centrem“ bez osobních schůzek. Dále
    předčítá text o „satanských sítích“, mizení 8 milionů dětí ročně a „pádu Babylonu“. 45denní okno po
    volbách zkracuje na „maximálně 35 dní“ od 13. 11., kdy „musí být zločinci viditelným způsobem vzati
    ke spravedlnosti“. Zmiňuje i možný „pád letadla s Trumpem, simulovaný atentát nebo Blue Beam“. Poté
    mají podle něj přijít dočasné vojenské vlády bez Babiše, Fialy a Rakušana a do 120 dnů „regulérní“
    československé volby. Bez ochrany „White Hats“ by byl podle svých slov dávno mrtvý.'
