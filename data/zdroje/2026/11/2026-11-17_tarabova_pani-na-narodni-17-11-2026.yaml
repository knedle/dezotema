vyroky:
- id: tarabova-2026-11-17-01
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel se v listopadu 1989 „550 metrů od Národní“ učil na rozvědčíka; demonstranti mu tleskají,
    ale opozici vyčítají komunismus (Tarabová, 17. 11. 2026)
  text: 'Ve videu z pouliční hádky na Národní třídě 17. 11. Tarabová namítá paní z demonstrace, která
    vzpomíná na zásah proti studentům v roce 1989, že Petr Pavel v té době „550 metrů odsud“ dělal kurz
    na rozvědčíka. Šlo podle ní o vojenské zpravodajství pro komunistickou stranu, a kdyby revoluce nebyla,
    dokončil by ho „za komunisty“. Demonstrantům vyčítá dvojí metr: „plivou“ na Okamuru, Rajchla nebo
    Schillerovou kvůli komunismu, ačkoli ti v KSČ možná ani nebyli, a zároveň tleskají člověku, který
    by dělal špionáž proti „nepřátelským buržoazním státům“. Námitku, že to Pavel svým dalším životem
    odčinil, odmítá. Do NATO se podle ní dostal právě díky „vzdělání z východních mocností“. Hlasy obou
    účastnic se v přepisu nedají spolehlivě rozlišit.'
  citace:
  - text: Proto stojí za zmínku říct, že Petr Pavel v době, kdy vás tady mlátili, tak támhle dělal kurz
      na rozvědčíka.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
