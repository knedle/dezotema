  text: '**14. 11. (23:11)** — V nočním vysílání „Dvojníci Deep State“ Zítko čte zkratku TRUMP jako „true
    republic under military power“. Tvrdí, že armáda brzy viditelně převezme moc a v rámci „představení“
    může být sehrána nehoda Air Force One i atentát na Trumpa, „ale všechno je tohleto naplánováno“. S
    odkazem na Real Raw News a „Donalda Younga“ předvádí „festival dvojníků“: originální Biden byl podle
    něj popraven ještě před nástupem do funkce a dvojníky nebo nahrazení mají být také Trudeau, Fauci,
    Gates, Kamala Harris, Tom Cruise, Netanjahu, Zuckerberg, Merkelová, Macron, Pelosi, Comey, Chelsea
    Clinton a Hunter Biden. Tom Hanks byl podle něj popraven 27. 7. 2021 a Oprah Winfrey v lednu 2024.
    J. D. Vance podle něj hraje Paul Walker, „Muska 2.0“ představitel Supermana a Mileie Robbie Williams.
    Obamu označuje za „muslima z Keni“ dosazeného, „aby zničil Ameriku“, a jeho manželku za muže. Organizátoři
    11. září byli podle něj popraveni: Cheney 29. 1. 2022 na Guantánamu, Bush mladší oběšen 4. 1. 2022,
    Rumsfeld spáchal sebevraždu. Do Pentagonu podle něj nenarazilo letadlo, ale raketa. Popravy podle
    něj proběhly za „těžké zločiny proti lidskosti“ včetně pedofilie a adrenochromu. Peníze v bance podle
    něj „jsou peníze banky“ a banky se budou zachraňovat bail-inem z úspor. JP Morgan podle něj v září
    nakupoval bitcoin a na konci roku prodává. Velká trojka Trump, Putin a Si se podle něj sejde 19. 11.
    a EBS „se bude testovat“ 17. 11. Jsme podle něj „velmi blízko velkému finále“ a „konec filmu se vám
    bude líbit“.'
