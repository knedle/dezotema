  nadpis: „Czexit" je iluze, jedinou cestou je obnova ČSR; vítězné mocnosti budou chtít „chcimíry" (Zítko,
    3. 10. 2026)
  text: '**18. 11. (21:21)** — Vítězné mocnosti podle Zítka „teď aktuálně“ jednají v Šen-čenu „o mírové
    smlouvě pro celý svět“ včetně hranic Izraele, Íránu, Ukrajiny a Evropy. Vše je „dopředu domluveno“
    a „koukáte na film“, EU je „úplně mimo“ a v Evropě je potřeba „dokončit denacifikaci“. „Konflikt na
    Ukrajině se chýlí k závěru a začíná mír na zemi.“ Souhlasně čte text, podle něhož Moskva „spouští
    nevratný proces systémového vymazání západního vojenského kódu“ a ČR, Polsko a Maďarsko se „musí vrátit
    do stavu před rokem 1997“, tedy před vstupem do NATO. V případě Československa to podle něj znamená
    návrat před rok 1992. S odkazem na ruského analytika Pjakina uvádí „přes 99% pravděpodobnost“, že
    se Česko a Slovensko znovu spojí. Lze pak žádat 29 bilionů Kč reparací od Německa a každý Čechoslovák
    má nárok na odškodnění „v miliardách“. Pro Klause a Mečiara „neexistuje žádná akceptovatelná omluva“,
    protože „vyvrcholením byla genocida COVID-19“. Babiše, Fialu, Pavla, Rajchla a Okamuru, kteří „melou
    furt stejný kokotiny“, vyzývá k online debatě o Československu.'
  citace:
  - text: Takže konflikt na Ukrajině se chýlí k závěru a začíná mír na zemi.
