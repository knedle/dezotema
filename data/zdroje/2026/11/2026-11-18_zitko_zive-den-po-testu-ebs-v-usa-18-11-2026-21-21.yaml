- id: zitko-2026-11-18-04
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**18. 11. (21:21)** — Den po testu EBS Zítko tvrdí, že šlo o „pouze test“, který „proběhl, aby
    se ukázalo, kdo z těch rozhlasových a televizních stanic spolupracuje a kdo ne“, a že „splnil svůj
    účel“. Námitku, že „nebyl blackout“, tím odmítá. Vojenskou techniku mířící k Washingtonu a plot kolem
    Kapitolu vykládá jako znamení, že „se brzo něco sebere“. Radí nikam necestovat a „sedět doma“, protože
    přijdou výpadky platebních karet a internetu. Q je podle něj „operace vojenské rozvědky Spojených
    států“, Trump „finisher“ a JFK „starter“. Proč se osvobození zatím neprojevuje mimo USA, vysvětluje
    (s čteným textem) „sekvenční likvidací“: nejdřív USA, pak ostatní země. Deep State „přestává existovat“
    a supervelmoci budou „zodpovědné za své regiony“. Na všechny, kdo podporovali „vyzbrojování ukronácků“,
    lockdowny, roušky a „zapíchávání biologickou zbraní“, „jednoznačně dojde“. Xi podle něj „srovnal Čínu
    likvidací Chazarské komunistické strany“ a „pohlavárů sloužících globální lichvě“. Operace „Hellstorm“
    je „rozjetá naplno“: Putinovy síly prý odkryly tunely pro obchod s dětmi a „výroba a konzumace adrenochromu
    z krve dětí“ musí být vykořeněna. Na „sestřelení“ volebního podvodu demokratů zbývá „ještě měsíc“
    a Biden byl už v roce 2020 „popravená loutka a dvojník“. Doporučuje film „Oni žijí“ (1988): „kouzelné
    brýle ukazují, kdo má lidskou DNA a kdo ne“ a podobné brýle „Aura“ jsou prý k mání na Amazonu. Facebook
    mu podle něj zablokoval zmínku o moderátorovi Dědkovi jako „reptiliánovi“. Opakuje, že Kubrick natočil
    přistání na Měsíci v Nevadě a zemřel krátce po dokončení filmu „Eyes Wide Shut“, v němž chtěl jmenovat
    účastníky satanistických rituálů.'
  citace:
  - text: Byl to pouze test a ten proběhnul a proběhnul, aby se ukázalo, kdo z těch rozhlasových a televizních
      stanic spolupracuje a kdo ne.
