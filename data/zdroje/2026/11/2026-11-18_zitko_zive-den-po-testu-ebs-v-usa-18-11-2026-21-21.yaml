  poznamka: '1 h 9 min, „18/11 Den po testu EBS v USA 21:21“. Mluví jen Zítko, asi třetinu času předčítá
    cizí texty (Q, Cvalín, „Daniel R.“, Juan O. Savin, Pleticha). Úvodní spor o falešné kanály, vánoční
    přání a reklama na Bevit nezpracovány. Zpracováno 13 témat. Predikce: EBS 17. 11. označena ❌ (Zítko
    test zpětně vydává za „splnění účelu“), nový záznam o mírové smlouvě a „návratu před rok 1997“. Stochastický
    teror nezjištěn (hraniční: „na všechny jednoznačně dojde“ bez jmen, Dědek jako „reptilián“, antisemitské
    obraty „Chazarská strana“ a „globální lichva“). Zpracováno podle shrnutí pomocného agenta, klíčové
    citace ověřeny v přepisu.'
