  text: '**7. 11.** — Ke každému jeho kanálu podle Zítka od roku 2021 vznikají klony s ukradenou identitou
    „pod kontrolou fízlů, hejtrů, agentů“ (Československo.tv, Svobodné Československo, „Pavel Zítko prezident“
    aj.) a Facebook originály schovává a ukazuje jen falešné; jako možného správce jednoho z nich jmenuje
    Konstantina Stanka.'
