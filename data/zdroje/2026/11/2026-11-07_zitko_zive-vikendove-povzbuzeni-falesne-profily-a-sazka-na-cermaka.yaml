  nadpis: Propuštění „údajného" Tomáše Čermáka jako sehraný justiční podvod s dvojníkem (Zítko, 24.–27.
    9. 2026)
  text: '**7. 11.** — Zítko „sázku na Čermáka“ snižuje ze 17 000 na 170 Kč a téma uzavírá s tím, že „neexistuje
    reální Tomáš Čermák“ (odmítl si „vyzkoušet střevíček v podobě otázek“); „falešný Čermák“ se podle
    něj 24. 9. vzdal stížnosti proti rozsudku, aby přišel o odškodné. Bernardy, Černohorského, Tušla a
    Svobodu nazývá „liščí smečkou“.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-11-07-02
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Výhra demokratů v amerických volbách jako „past“ — stíhání za velezradu, „Gitmo Express“ a NESARA
    „každým dnem“ (Zítko, 5. 11. 2026)
  text: '**7. 11.** — Zítko tvrdí, že se „80–90 %“ jeho předpovědí o covidu a rozdělení ČSR splnilo a
    zbytek „se teprve stane“. Z předčítaných příspěvků přebírá, že šlo o „červenou vlnu“ ukradenou demokraty,
    že USA za Obamy, Bushe a Clintona zabily 11 milionů lidí a že končí „triumvirát“ Vatikán, City of
    London a Washington; Stephen Miller „bude kosit“ a volební podvod odhalí, TRUMP podle něj znamená
    „True Republic Under Military Power“. Přichází prý „viditelných 20 %“ vojenské operace (páteční výpadek
    proudu v Praze „možná ledacos naznačil“), JFK Jr. žil v ochraně svědků a „co nevidět vystoupí na veřejnost“,
    Netanjahu a Musk jsou „už vyměnění“. Odpadlíky z MAGA (Carlson, Massie, Owensová, Greeneová) podle
    něj obrátil proti Trumpovi „jediný důvod: Izrael“, který „kontroloval Ameriku po mnoho desetiletí“.
    Assange podle něj chce odhalit „operativce z Obamovy éry“. Dále tvrdí, že Titanic byl ve skutečnosti
    Olympic potopený kvůli odpůrcům Fedu (JP Morgan prý na poslední chvíli zrušil plavbu), že do WTC narazily
    jen „hologramy letadel“ a že v pátek spadly akciové indexy ve 42 zemích (Island −76 %, Ukrajina −64
    %).'
  citace:
  - text: Kdy dva hologramy letadel sundaly 11. září tři baráky v New Yorku.
