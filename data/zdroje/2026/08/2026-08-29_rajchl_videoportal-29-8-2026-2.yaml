  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**29. 8.** — V rozhovoru s Petrem Hájkem na Protiproudu Rajchl žádá, aby ČR přestala být vůči
    EU „poslušným dítětem" a začala jednat stejně nekompromisně jako Polsko či Maďarsko (Orbán) — vyjadřuje
    přání jednou v Bruselu přibouchnout dveře tak razantně, že by z něj i Orbán působil umírněně. Argumentuje,
    že dobrovolná poslušnost žádnou zemi k ničemu nedovedla, zatímco ti, kdo si podmínky vyvyjednávají
    tvrdě (Polsko), dostávají víc. K dosavadním úsporám z výdajové strany rozpočtu (viz vzor Irska/Argentiny
    výše) dodává konkrétní souhrnný odhad: navrhované úpravy by ušetřily zhruba 250 mld. Kč na výdajové
    straně, aniž by bylo nutné zvýšit o korunu příjmovou stranu občanům — místo toho by podle něj měly
    banky a zbrojařské korporace (jejichž zisky za vlády Petra Fialy vzrostly o stovky, respektive tisíce
    procent) platit „férový podíl" na chodu státu.'
  podtema: Ekonomický program PRO
