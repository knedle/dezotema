- id: vrabel-2026-08-13-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Německá reforma zpravodajských služeb jako nástroj proti AFD, ne proti „hybridním hrozbám" (Vrabel,
    13. 8. 2026)
  text: Německá vláda schválila reformu zpravodajských služeb (rozšiřuje pravomoci v boji proti špionáži,
    sabotáži a kybernetickým útokům; návrh nyní jde do Bundestagu) — dle oficiálního zdůvodnění ministra
    vnitra Alexandra Dobrindta jde o reakci na rostoucí bezpečnostní hrozby. Vrabel prochází konkrétní
    nová oprávnění (aktivní pronikání do cizích systémů a mazání/měnění dat, přesměrování datových toků,
    rušení serverů „dezinformačních" skupin, sabotáž výroby v továrnách, širší přístup k telefonům a počítačům,
    uchovávání komunikace 6 měsíců a metadat 12 měsíců, využití AI a biometrie, sdílení dat s policií/armádou
    i soukromými subjekty) a tvrdí, že skutečným cílem je AFD a suverenistické hnutí — ne Rusko. Odůvodňuje
    to tím, že AFD vede předvolební průzkumy a měla by vyhrát příští volby, což je pro „globalisty, kteří
    dnes řídí Německo" nepřijatelné; kancléře Friedricha Merze označuje za bývalého předsedu představenstva
    BlackRock Deutschland, tedy „absolutního globalistu", nikoli zástupce německých zájmů. Srovnává to
    s vlastní zkušeností (pokus české tajné služby zdiskreditovat ho přes nastrčeného „ruského agenta",
    veřejné mediální napadení bývalým ředitelem BIS, prohlášení manželky za „bezpečnostní ohrožení státu"
    bez možnosti obrany) a se šikanou europoslance AFD Petra Bystroně (šest domovních prohlídek, vykonstruované
    trestní stíhání člena vedení AFD, který skončil ve vězení).
  osoby:
  - osoba: friedrich-merz
    vztah: negativni
    kontext: Německý kancléř označen za bývalého šéfa představenstva BlackRock Deutschland — „absolutní
      globalista", nehájící německé zájmy; reforma zpravodajských služeb pod jeho vládou míří proti AFD
- id: vrabel-2026-08-13-02
  typ: tvrzeni
