  poznamka: 'Vrabel — deník (delší video). Plně zpracována 4 ze 16 témat: Německá reforma zpravodajských
    služeb jako nástroj proti AFD — [digitalni-kontrola.md](digitalni-kontrola.md); Ceuta — zdravotní/bezpečnostní
    krize, organizovaná islamizace — [migrace.md](migrace.md); Rotterdam — koordinované útoky na energetickou
    infrastrukturu — [konspirace.md](konspirace.md); Agenda 2030 — jediná cesta jsou protesty, sebereflexe
    k roku 2022 — [politicky-system.md](politicky-system.md); zbytek (Zelenskyj/mír, Sevastopol, Hormuz/Írán-USA,
    Kuba, rozpočet USA na obranu, USS Abraham Lincoln, Zelenskyj/rakety, Varšava přehlídka, Libanon/Velký
    Izrael, USA elektrošokové rukavice, zemědělství ČR/Srbsko, IKEM útok) jen v deníku — viz [zpravodajstvi-vrabel/2026-08.md](zpravodajstvi-vrabel/2026-08.md).
    Predikce (AFD jako SPD, ČR chudší za 20 let) extrahovány bezvýjimečně; bez stoch. teroru.'
