  nadpis: „Koordinované" útoky na energetickou infrastrukturu po celém světě (Vrabel, opakovaně, naposledy
    13. 8. 2026)
  text: Vrabel při zprávách o jednotlivých útocích na ropná/plynová zařízení — naposledy výbuch na ropném
    terminálu společnosti Gunvor Energy v přístavu Rotterdam (1 mrtvý, více zraněných) — opakovaně upozorňuje,
    že podobné útoky (Bulharsko, Libye, Sevastopol a další) se dějí „po celém světě" a „každý den" už
    několik měsíců, a naznačuje, že jde o koordinovanou kampaň, nikoli o nesouvisející náhodné incidenty,
    aniž by však uvedl, kdo za koordinací stojí nebo jaký je motiv. Dodává ironicky, že doufá, že lidé
    nebudou nakonec nuceni jezdit „všichni jenom na kole".
  podtema: Elity a jejich plány
- id: vrabel-2026-08-13-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Ceuta: sexuální napadení nezletilých migrantů jako „kulturní" jev — apel na ochranu dětí (Vrabel,
    10. 8. 2026)'
  text: '**13. 8.** — Vrabel rozšiřuje zprávu (zdravotníci hlásí případy svrabu, tuberkulózy a gastrointestinálních
    infekcí, potvrzují nejméně 4 případy sexuálního napadení nezletilých) o tezi, že islamizace Evropy
    je organizovaný proces „shora", nikoli náhodný důsledek klimatické krize v Africe — připomíná zapojení
    americké administrativy do organizace migračních vln. K nemocem dokládá vlastní zkušenost: kamarádka
    jeho matky, která v roce 2015 vedla zdravotnictví kraje Švábsko v Německu, měla za úkol tajně schvalovat
    extrémně nákladné léčby (až čtvrt milionu marek na pacienta) exotických nemocí přivezených migranty.
    Podobně tvrdí, že po příchodu ukrajinských uprchlíků do ČR (od 2022) propukla neveřejně tutlaná epidemie
    černého kašle (týdny trvající kašel u řady lidí) — mimo to zmiňuje spalničky a další nehlášené nákazy.
    Varuje, že nově umožněný vstup ukrajinských veteránů do ČR (dřívější vojáci s potvrzením o odsloužení)
    přinese další riziko — tentokrát psychologické, protože tito veteráni budou Čechy vnímat jako ty,
    kdo je posílali bojovat a platili tuto válku.'
- id: vrabel-2026-08-13-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Jediná reálná cesta proti Agendě 2030 jsou masové protesty, ne volby — sebereflexe k roku 2022
    (Vrabel, 13. 8. 2026)
  text: 'Na divácký dotaz, zda existuje řešení, jak globalistům překazit realizaci Agendy 2030, Vrabel
    odpovídá, že možnost teoreticky existuje (masové pokojné protesty, které donutí vlády padnout, následované
    nástupem lidí chápajících skutečnou situaci), ale reálná proveditelnost je nízká — vyžadovalo by to
    aktivní zapojení alespoň 7 % populace. Volby jako cestu odmítá jako fakticky nefunkční, protože zvolení
    politici (v ČR, Německu, USA) nakonec vždy slouží „globalistům", a médii kontrolovaná politická scéna
    neumožní projít stranám, které by agendu skutečně chtěly zrušit. Vlastní demonstrace „Česká republika
    na prvním místě" z roku 2022 hodnotí jako úspěšné v tom smyslu, že vlastenecké téma se stalo hlavním
    předvolebním tématem všech vládních stran — problém je, že po zvolení sliby neplní; lituje, že lidé
    nevydrželi demonstrovat dostatečně dlouho na to, aby se celý plán prosadil. Predikuje s odhadovanou
    pravděpodobností přes 75 %, že AFD v Německu (podobně jako Marine Le Pen ve Francii nebo Nigel Farage
    v Británii) nakonec dopadne jako SPD v ČR — silné řeči bez skutečné změny po zvolení. Uzavírá vlastní
    prognózou: pokud lidé nezareagují masovým odporem, je pravděpodobnější, že Agenda 2030 projde a ČR
    bude za 20 let jednou z chudších zemí světa, stejně jako celá Evropa.'
  podtema: USA — volební systém
