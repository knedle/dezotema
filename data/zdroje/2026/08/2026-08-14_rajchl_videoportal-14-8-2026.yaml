  nadpis: Chat Control a bezhotovostní společnost jako nástroje totální kontroly — ústavní ukotvení hotovosti
    (Rajchl, 14. 8. 2026)
  text: 'Rajchl kritizuje schválenou unijní regulaci Chat Control, která podle něj umožňuje číst i nedokončené,
    nikdy neodeslané zprávy rozepsané v aplikacích jako Messenger nebo WhatsApp a z jejich obsahu vyvozovat
    trestní řízení. Ptá se, kdo má zájem na tom, takto občany „šmírovat". Propojuje to s tezí o postupném
    rušení fyzických peněz: placení hodinkami, telefonem nebo kartou je záměrně prosazováno, protože každá
    taková platba je sledovatelná — stát díky ní ví, kam člověk jezdí, kde a kolik tankuje, co kupuje
    a jaké má životní návyky. Strana PRO proto chce zakotvit právo platit hotovostí a českou korunou přímo
    do Ústavy.'
