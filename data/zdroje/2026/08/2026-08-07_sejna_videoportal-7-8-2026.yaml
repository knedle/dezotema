  text: '**7. 8.** — Šejna reaguje na policejní vyjádření, že některé starší Turkovy sdílené příspěvky
    jsou reálné a podněcovaly k nenávisti (dosud šlo o neprokázaná tvrzení) — média podle něj Turka rovnou
    označují za vinného, ačkoli o vině má rozhodovat soud, nikoli policie nebo média. Kritizuje výběrovost
    mediální pozornosti: zatímco se znovu řeší Turek, kauzy s podle něj závažnějším dopadem (bitcoinová
    kauza, Pauknerova odhalení, Blažkovo přiznání) zůstávají na vedlejší koleji.'
