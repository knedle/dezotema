- id: rajchl-2026-08-23-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Emisní povolenky: ČR platí 30× víc než Švédsko a 17× víc než Německo (Rajchl, 23. 8. 2026)'
  text: 'Rajchl v FB Live shrnuje čísla o emisních povolenkách, která prezentoval i v televizní debatě:
    cena vzrostla o 355 %, ETS1 se aktuálně obchoduje přes 80 eur a ETS2 přes 70 eur — slibované zastropování
    na 40 eur nikde není. V Asii i USA jsou obdobné vstupy (emise, plyn, elektřina) podle něj mnohem levnější,
    což dělá Evropu nekonkurenceschopnou. Podle jím citovaného článku zaplatí každý Čech na emisních povolenkách
    7 000 Kč ročně (čtyřčlenná rodina 21 000 Kč), zatímco Švédové jen 200 Kč a Němci zhruba 400 Kč na
    hlavu — tedy ČR platí 30× víc než Švédsko a 17× víc než Německo, přestože Němci mají třikrát vyšší
    platy. Negativní dopad na české HDP odhaduje s odkazem na Varšavský institut na přes 100 mld. Kč přímo,
    k tomu připočítává nepřímé dopady (odrazování od podnikání energeticky náročných provozů kvůli vysoké
    byrokracii a pomalým odpisům). Přirovnává model k sousedovi, který znečišťuje vlastní zahradu produkcí
    pro souseda a ještě mu za to platí — řešením je odchod z Lipské burzy s emisními povolenkami.'
  citace:
  - text: Chápete, jak je ten model zkorumpovaný? Jak je to celé nastavené jenom na to, aby... okrádala
      západní Evropa nás, tu střední a východní Evropu.
  podtema: Ekonomika, sankce a BRICS
- id: rajchl-2026-08-23-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**23. 8. (sněmovní vystoupení)** — v přímém sněmovním klipu Rajchl opakuje totéž srovnání (Bulharsko
    +36 %, Polsko +9 %, Maďarsko +13,5 % vs. ČR v mínusu, poslední zemí s dohnaným předcovidovým HDP)
    v reakci na opoziční obvinění, že ČR je „nejvíce zadluženou zemí" — namítá, že jiné západní země mají
    dluh přes 100 % HDP, a jako zdroj úspor navrhuje zrušit emisní povolenky (viz [Emisní povolenky](/temata/ceny-energie.md#rajchl-2026-08-23-01))
    místo škrtů u občanů — beze změny oproti 22.–23. 8.'
  podtema: Ekonomický program PRO
