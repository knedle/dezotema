  nadpis: Odsouzení za „zaškrtnutí okýnka" jako politická perzekuce (Vrabel, 4. 6. 2026)
  text: '**30. 8.** — Nová vlna smear kampaně tentýž případ znovu přerámovává jako „daňové podvody" —
