  podtema: Kauza Ladislav Vrabel — dotační podvod
- id: vrabel-2026-08-30-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rekonstrukce Václavského náměstí jako záměrné znemožnění demonstrací — vlastní perzekuce po
    roce 2022 (Vrabel, 2. 8. 2026)
  text: '**30. 8.** — Vrabel popisuje novou vlnu téže kampaně, spuštěnou krátce po ohlášení shromáždění
    3. 10.: znovu se šíří obvinění, že je agentem BIS (šíří ho mj. Ivan David a „Standa Novotný", dříve
    i Jindřich Rajchl a Lenka Tarabová), nově navíc tvrzení, že okradl táborskou buňku hnutí Česká republika
    na prvním místě — což odmítá s tím, že k jedinému účtu hnutí má přístup jen on a místopředseda Pavel
    Fíla. Samostatně rozebírá kampaň novináře Petra Hájka (Protiproud): připomíná jeho dlouholeté propojení
    s ODS (kampaně pro stranu i osobně pro Václava Klause) a s Petrem Macinkou (oba pracovali jako Klausovi
    asistenti/sekretáři) a fakt, že Hájka bezplatně právně zastupuje Jindřich Rajchl od roku 2022 výměnou
    za jeho podporu — což podle Vrabela vysvětluje, proč Hájek musí současnou vládu hájit a jeho kritiky
    (včetně Vrabela) nálepkovat jako spojence Milionu chvilek. Zmiňuje, že na Hájkovu kampaň veřejně reagovala
    Korina Rybářová (obhájila Vrabela a financování demonstrací sbírkami mezi lidmi).'
  osoby:
  - osoba: petr-hajek
    vztah: negativni
    kontext: Novinář Protiproud — dlouholeté propojení s ODS a Václavem Klausem, bezplatně zastupován
      Rajchlem od 2022, což vysvětluje jeho kampaň proti Vrabelovi
  - osoba: korina-rybarova
    vztah: pozitivni
    kontext: Veřejně reagovala na Hájkovu kampaň a obhájila Vrabela
  - osoba: ivan-david
    vztah: negativni
    kontext: Šíří obvinění, že Vrabel je agentem BIS
  podtema: USA — volební systém
- id: vrabel-2026-08-30-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Teorie „řízené nenávisti k vládci" — psychologická technika před válkou, teď „anti-Pavel" místo
    „anti-Fiala" (Vrabel, 30. 8. 2026)
  text: 'Vrabel popisuje, co považuje za opakující se psychologickou techniku „globalistů" před válkou:
    cíleně vytvořit v obyvatelstvu masovou nenávist vůči konkrétnímu vládci (uvádí příklady — nenávist
    k Bidenovi v USA, k Merzovi dnes v Německu, k Fialovi v ČR), díky níž se každý, kdo se postaví „proti"
    této osobě, automaticky stane v očích lidí zachráncem bez ohledu na to, co skutečně prosazuje — a
    jakmile je zvolen, davová psychóza ho chrání před kritikou po dlouhou dobu. Tvrdí, že tuto techniku
    v ČR jako první uplatnila Kateřina Konečná kampaní „anti-Fiala" před volbami 2025, a že totéž nyní
    opakuje ve verzi „anti-Pavel" (KSČM, Zuzana Majerová prohlašující odstranění Petra Fialy/Pavla za
    „nejvyšší prioritu"). Podle Vrabela jde o odklon od „politiky věcí" (co je třeba prosadit) k neplodné
    „politice osobností" (koho odstranit) — poukazuje, že klíčové zahraničněpolitické postoje (podpora
    NATO/EU, označení Ruska za agresora, podpora Ukrajiny) sdílí napříč celým politickým spektrem v ČR
    včetně SPD a Okamury, takže v této otázce reálně neexistuje žádná opozice.'
  osoby:
  - osoba: katerina-konecna
    vztah: negativni
    kontext: Označena za průkopnici techniky „řízené nenávisti" — kampaň „anti-Fiala" před volbami 2025
  - osoba: zuzana-majerova
    vztah: negativni
    kontext: Prohlásila odstranění Petra Fialy/Pavla za „nejvyšší prioritu" — příklad schématu „anti-Pavel"
  podtema: USA — volební systém
- id: vrabel-2026-08-30-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Podpora demonstrace KSČM 5. 9. na Malostranském náměstí — s výhradou vůči rámování „proti Pavlovi"
    (Vrabel, 30. 8. 2026)
  text: Vrabel oznamuje, že hnutí Česká republika na prvním místě podpoří demonstraci KSČM plánovanou
    na 5. 9. na Malostranském náměstí (organizátor Richard Štěpán), protože souhlasí s jejím postojem
    proti zbrojení a proti protiruské nenávisti. Distancuje se však od rámování akce jako útoku výhradně
    na Petra Pavla (kritizuje konkrétně komentář Richarda Štěpána, že Pavel je „militantní") — argumentuje,
    že jde o odpor vůči zbrojení obecně, nikoli jen vůči jedné osobě, a varuje před opakováním schématu
    „anti-Pavel" popsaného výše. Zdůrazňuje, že jedinou politickou stranou dlouhodobě a programově usilující
    o vystoupení ČR z EU a NATO je jeho vlastní hnutí, nikoli KSČM (která podle něj referendum o vystoupení
    před volbami 2025 nakonec nekomunikovala).
  osoby:
  - osoba: richard-stepan
    vztah: rozporuplny
    kontext: Organizátor demonstrace KSČM 5. 9. — Vrabel podporuje akci, ale odmítá jeho rámování Pavla
      jako „militantního"
  podtema: USA — volební systém
