  nadpis: Odmítá adopci dětí stejnopohlavními páry (Šejna, 4. 8. 2026)
  text: Adam Šejna u příležitosti výročí Prague Pride odmítá adopci dětí stejnopohlavními páry — argumentuje,
    že rodič musí být schopen zajistit dítěti výchovu od obou pohlaví, protože „testosteron" (přisuzovaný
    otci) musí být vyvážen emoční stránkou (přisuzovanou matce), jinak dítě o tuto část výchovy ochudí.
    Odlišuje to od situace, kdy dítě přirozeně přijde o jednoho z rodičů (rozvod, odchod) — to podle něj
    společnost nemůže ovlivnit a měla by takové rodiny podporovat, ale nemělo by se jí to stát záměrně
    vytvářeným standardem. Uzavírá výzvou, aby si každý upřímně odpověděl, zda je touha stejnopohlavních
    párů po adopci sobecká, nebo ne.
  podtema: Eutanazie
