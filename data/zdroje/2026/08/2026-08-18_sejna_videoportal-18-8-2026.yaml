  nadpis: Nora Fridrichová a Daniel Cortus — urážky za odmítnutí rozhovoru, aktivismus schovaný za profesi
    (Šejna, 18. 8. 2026)
  text: 'Adam Šejna popisuje vlastní zkušenost: odmítl pozvání Nory Fridrichové do jejího podcastu, protože
    nerespektuje její tvorbu a nechtěl svou účastí zvyšovat její dosah — místo věcného přijetí odmítnutí
    ho začala urážet. Dává to do souvislosti s tím, že Fridrichová do podcastu pozvala Daniela Cortuse
    (vystupujícího pod přezdívkou „klimatomluva"), který si opakovaně veřejně stěžuje, že mu Filip Turek
    neodpovídá na zprávy a odmítá s ním jít do rozhovoru — přičemž ho zároveň dlouhodobě veřejně napadá
    a podle Šejny o něm šíří nepravdivá tvrzení. Šejna z toho vyvozuje obecnější vzorec chování: obě osobnosti
    podle něj urážejí každého, kdo s nimi odmítne debatovat, a zároveň svůj politický aktivismus schovávají
    za novinářskou/odbornou profesi.'
  podtema: Nová alternativní média
