  nadpis: Noční zastavení, sporný „lízací test" a odebrání řidičáku (Černohorský, 17. 8. 2026)
  text: '**27. 8.** — Černohorský podává aktualizaci: dva oslovení právníci případ odmítli převzít (jeden
    měl podle něj lhát a maskovat vlastní alibi e-maily, druhý přestal komunikovat úplně) — v jednání
    je nyní další, třetí právní kancelář, se kterou se „Tereska" již sešla. Vyjadřuje přesvědčení, že
    spor nakonec vyhrají díky podpoře diváků a členů spolku Čest Svoboda Respekt, kteří přispívají na
    transparentní účet.'
  podtema: Kauza „Terezy" — podezření na koordinovaný postup policie, soudu a školy proti matce
- id: cernohorsky-2026-08-27-03
  typ: tvrzeni
  temata:
