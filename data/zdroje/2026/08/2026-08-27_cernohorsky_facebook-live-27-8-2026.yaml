  nadpis: Nezodpovězená žádost o informace k Pavlově účasti na Velké ceně Maďarska F1 (Černohorský, 27.
    8. 2026)
  text: Černohorský uvádí, že podal žádost o informace (dle zákona 106/1999 Sb.) ohledně účasti prezidenta
    Pavla na Velké ceně Maďarska Formule 1 na okruhu Hungaroring — konkrétně kdo cestu financoval a kdo
    mu zajistil akreditaci. Konstatuje, že zatímco na obdobnou žádost týkající se větrných elektráren
    mu odpovědělo Ministerstvo životního prostředí, Kancelář prezidenta republiky na jeho dotaz dosud
    nereagovala, a oznamuje záměr podat další žádost.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-08-27-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Arogance koaličních politiků — STAN radní o parkování, poslankyně Urbanová a „wellness" na Ukrajině
    (Černohorský, 27. 8. 2026)
  text: Černohorský dokládá na dvou příkladech, co považuje za typickou aroganci koaličních politiků vůči
    občanům. Zaprvé cituje radního za STAN (v přepisu neúplně identifikovaného jako „Hlaváček"/"Hlavíček"),
    který veřejně řekl, že rodiny nepotřebují dvě auta a mohou jezdit MHD — na přímý dotaz novináře Jana
    Tuny, zda tím půjde sám příkladem, však jasně neodpověděl. Zadruhé cituje (s odkazem na příspěvek
    Aleše Svobody) poslankyni STAN Kateřinu Urbanovou, která měla plánovat pracovní cestu na Ukrajinu
    zahrnující pobyt ve wellness centru luxusního hotelu (uvedená cena cca 330–360 USD za osobu a noc)
    placenou ze státních prostředků. Srovnává to s vlastními čísly o výši poslaneckého platu a náhrad
    (89 000 Kč čistého + 215–250 000 Kč náhrad) a uzavírá, že takové výdaje by si politici měli hradit
    sami. V této souvislosti ironicky chválí Tomia Okamuru za sliby omezit náklady na politické cestování
    a financování neziskových organizací.
  osoby:
  - osoba: katerina-urbanova
    vztah: negativni
    kontext: Poslankyně STAN — kritizována za plánovanou pracovní cestu na Ukrajinu se zastávkou ve wellness
      centru za státní peníze
  podtema: USA — volební systém
- id: cernohorsky-2026-08-27-09
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Kritika zadlužení za Fialovy vlády a návrh zrušit ODS, STAN, Piráty, KDU-ČSL a TOP 09 (Černohorský,
    27. 8. 2026)
  text: Černohorský obviňuje bývalou Fialovu vládu ze systematického zadlužení státu a zdražování (mj.
    zvýšení DPH na potraviny z 12 na 15 %, následně vrácené na 12 %) a jmenuje jako klíčové kauzy Dozimetr,
    bitcoinovou kauzu a opakované falšování rozpočtu ministrem financí Zbyňkem Stanjurou. Argumentuje,
    že namísto navrhovaného zákazu komunistických symbolů by mělo dojít ke zrušení a soudnímu stíhání
    ODS, STAN, Pirátů, KDU-ČSL a TOP 09 jako stran odpovědných za tento stav. Současnou vládu Andreje
    Babiše naopak obhajuje v souvislosti s přehlasováním prezidentova veta rozpočtu — nutnost upravit
    zákony kvůli rozpočtové díře zděděné po předchozí vládě označuje za logickou, ne za vinu Babišovy
    vlády, a kritizuje opozici za záměr napadnout rozpočet u Ústavního soudu jako zneužití instituce,
    která podle něj nemá do rozpočtových otázek zasahovat.
  podtema: USA — volební systém
- id: cernohorsky-2026-08-27-10
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Pochvala projevu Petra Macinky k velvyslancům — pragmatismus místo „hodnotové politiky" (Černohorský,
    27. 8. 2026)
  text: Černohorský, ač sám dlouhodobě nesouhlasí s tezí, že Rusko je agresorem (invazi datuje k 15. dubnu
    2014 a skutečnými agresory označuje USA, Spojené království a Izrael, kteří dle něj zorganizovali
    kyjevský Majdan), chválí projev ministra zahraničí Petra Macinky pronesený na poradě velvyslanců.
    I přes formální trvání na negativním hodnocení Ruska v projevu oceňuje odklon od „přiteplené" hodnotové
    zahraniční politiky směrem k pragmatismu — staví ho do kontrastu s bývalým ministrem Janem Lipavským,
    kterého označuje hanlivou narážkou na sexuální orientaci. Vyzývá i diváky nesouhlasící s hodnocením
    Ruska jako agresora, aby si projev přesto poslechli.
  osoby:
  - osoba: petr-macinka
    vztah: pozitivni
    kontext: Pochválen za projev k velvyslancům — pragmatismus místo „hodnotové politiky" vůči Rusku,
      i přes nesouhlas s tvrzením o Rusku jako agresorovi
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: cernohorsky-2026-08-27-11
  typ: tvrzeni
  temata:
