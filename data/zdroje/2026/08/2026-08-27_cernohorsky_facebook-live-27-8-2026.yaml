  nadpis: Ukrajina se blíží kolapsu, Kyjev „nedopadne dobře" (Černohorský, 27. 8. 2026)
  text: 'Černohorský reaguje na zprávy o plánované ruské eskalaci s tím, že se potvrzuje jeho dlouhodobé
    varování „chcimírů": Ukrajina nemá šanci porazit jadernou velmoc v koalici s „posranou Evropskou unií"
    a situace bude už jen horší, včetně rostoucích civilních obětí. Zmiňuje, že podle jím sledovaných
    videí sílí v Kyjevě demonstrace a nespokojenost s Volodymyrem Zelenským. Zodpovědnost za pokračování
    a eskalaci konfliktu připisuje západním vládám (jmenovitě Fialově a Rakušanově politice), které podle
    něj svým postojem umožnily, aby válka vůbec nastala a pokračovala.'
  podtema: Vyjednávání a mír
