  nadpis: Bitcoinová kauza jako „největší korupce za 37 let" — legalizace špinavých peněz (Černohorský,
    27. 8. 2026)
  text: Černohorský staví do kontrastu mediální pozornost věnovanou Filipu Turkovi (házení jogurtů, dopravní
    nehoda) s podle něj mnohem závažnějšími kauzami, které mainstream „umlčel" — zejména bitcoinovou kauzu,
    kterou označuje za největší korupční aféru za celých 37 let od pádu komunismu. Tvrdí, že přijetím
    zkonfiskovaných bitcoinů do státní pokladny vláda fakticky „legalizovala" špinavé peníze pocházející
    z pedofilie, dětské pornografie, obchodu s lidskými orgány, prostituce, obchodu s drogami, objednávek
    vražd a nelegálního obchodu se zbraněmi. Vedle toho zmiňuje předražené zbrojní zakázky ministryně
    obrany Jany Černochové (těžké kulomety za 1,4 mil. Kč oproti 380 tis. Kč u Dánska, tanky Leopard 2A4
    jako „předražený šrot") a demolici stavebního zákona za ministra Bartoše jako příklady škod v řádu
    miliard, které média podle něj běžně přechází mlčením.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: cernohorsky-2026-08-27-02
