  nadpis: ⚡ Laviny v Nepálu jako řízený útok raketou z letadla — analogie s 9/11 jako „největší globální
    podvod" (Černohorský, 27. 8. 2026)
  text: |-
    V reakci na sdílené video Michala Boldyho o katastrofálních lavinách v Nepálu (stovky mrtvých a pohřešovaných) Černohorský spekuluje, že laviny nezpůsobilo zemětřesení, ale záměrně vypálená střela „vzduch-země" z letadla ve výšce kolem šesti kilometrů — všímá si, že katastrofa přišla těsně před výročím (necelé dva roky) nepálských protestů, při nichž obyvatelé svrhli vládu a vypálili vládní budovy. Srovnává to se svým dlouhodobým přesvědčením, že útoky z 11. září 2001 byly „inside job" americké vlády (zpochybňuje pád třetí budovy WTC, neexistenci záběrů letadla u Pentagonu, kráter v Pensylvánii) — a z toho vyvozuje, že podobně „řízená" katastrofa v Nepálu je pravděpodobnější než náhoda. Viníkem označuje kolektivně „globální hajzly" a explicitně „tyhle židy", kteří podle něj ovládají svět a událost byla jejich „pomstou" nebohým Nepálcům za loňské povstání.

    ⚡ **Poznámka:** Tvrzení je nepodloženou spekulací kombinující sdílené video, teorii o 9/11 jako řízené operaci a explicitně antisemitské přisouzení viny neurčité skupině „Židů" za přírodní katastrofu — viz [Stochastický teror](stochasticky-teror.md). Samotný Boldy o den později totéž video označil za AI podvrh — viz [⚡ Konflikt níže](#-konflikt-nepál--virální-stíhačka-je-ai-podvrh-ale-zemětřesení-bylo-uměle-vyvoláno-haarpem-boldy-27-8-2026).
  podtema: Náboženský a okultní výklad moci
- id: cernohorsky-2026-08-27-04
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: „Česko je plán" — záměrná eroze národní identity
  text: '**27. 8.** — Černohorský tento postoj vyostřuje na osobní rovině: prohlašuje, že se hlásí k moravské
    (nikoli české) národnosti, a nekompromisně odmítá jakékoli pojmenování země jako „Česko" nebo „Čechie"
    — trvá výhradně na „Česká republika" tvořená třemi zeměmi (Čechy, Morava, Slezsko). Kdokoliv tato
    jména nerespektuje, má být podle jeho slov „poslán do prdele"; zdůrazňuje, že v tomto bodě nepřipouští
    žádný kompromis.'
- id: cernohorsky-2026-08-27-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Migrační pakt: 30 000 migrantů ročně, nebo 15 miliard Kč pokuty (Černohorský, 27. 8. 2026)'
  text: Černohorský tvrdí, že od poloviny roku 2027 (v přepisu uvádí „za 8–10 měsíců") bude Česká republika
    na základě migračního paktu EU povinna ročně přijímat 30 000 migrantů z Afriky a Blízkého východu,
    nebo místo toho zaplatit 15 miliard Kč — každý další rok znovu. Vinu za přijetí paktu přisuzuje ministru
    vnitra Vítu Rakušanovi. Dává to do souvislosti s obecnou kritikou správy státního dluhu (kterou označuje
    za dluh vytvořený generacemi politiků za posledních 30+ let, ne současnou vládou) a s obavou z opakování
    situace v Německu, kde má být ve školních třídách až 40 % dětí přistěhovalců.
  osoby:
  - osoba: vit-rakusan
    vztah: negativni
    kontext: Označen za odpovědného za přijetí migračního paktu EU (30 000 migrantů ročně nebo 15 mld.
      Kč pokuty)
- id: cernohorsky-2026-08-27-06
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavlův projev u Českého rozhlasu 21. 8. jako pokrytectví — vlastní revizionistický výklad invaze
    (Černohorský, 27. 8. 2026)
  text: 'Černohorský ostře napadá projev prezidenta Pavla u budovy Českého rozhlasu k výročí 21. srpna
    1968, v němž Pavel srovnával invazi vojsk Varšavské smlouvy se současným Ruskem. Nabízí vlastní verzi
    události: tvrdí, že násilnosti v Liberci, Prostějově a na Vinohradské třídě byly z většiny vyprovokovány
    samotnými Čechoslováky (útoky kostkami a Molotovými koktejly, zapalování tanků) na vojáky — mladé
    kluky ve věku 20–25 let, mezi nimiž byli dle něj převážně Ukrajinci, ne Rusové — kteří byli pod „neskutečným
    tlakem". Odmítá to jako obhajobu invaze, ale trvá na tom, že oficiální verze je „naprostá lež", a
    připomíná, že Putin opakovaně uznal odpovědnost tehdejšího SSSR, zatímco oficiální ruská omluva chybí.
    Hlavní část výpadu ale směřuje k obvinění z pokrytectví: zatímco Pavlova generace „nenávidí" Rusko
    za 137 mrtvých a 500 zraněných z roku 1968, tentýž establishment (jmenuje bývalého ministra kultury
    Daniela Hermana) se veřejně smiřuje se Sudetoněmeckým Landsmannschaftem — potomky nacistů odpovědných
    za smrt asi 360 000 Čechů, Moravanů, Slezanů a Romů za 2. světové války — bez srovnatelně formálního
    státnického aktu omluvy.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Kritizován za projev u ČRo 21. 8. srovnávající invazi 1968 se současným Ruskem — obviněn
      z pokrytectví vůči smíření s Landsmannschaftem; nezodpovězená žádost o informace k financování cesty
      na F1 v Maďarsku
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-08-27-07
  typ: tvrzeni
