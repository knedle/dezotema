  nadpis: Debata s Piráty (Volpe) — Ceuta a „ruské dezinformační weby" (Rajchl, 4. 8. 2026)
  text: Rajchl komentuje televizní debatu s pirátským poslancem Samuelem Volpem (CNN Prima News) o Ceutě
    a migrační politice EU — ironizuje Volpeho tvrzení, že za přílivem Maročanů do Ceuty stojí „ruské
    dezinformační weby", a poukazuje, že Volpe navíc nevěděl, že Ceuta ani není součástí schengenského
    prostoru. Z toho vyvozuje, že s takto nekompetentním partnerem nemá smysl o řešení migrace diskutovat.
    Opakuje svůj závěr, že celoevropské řešení migrace je „mrtvé" — EU migraci podle něj fakticky podporuje
    (financuje neziskovky přivážející migranty), takže jedinou cestou je, aby si ČR společně s V4 a jihovýchodní
    Evropou zavedla vlastní migrační politiku a ochranu hranic, nezávisle na vyděračském migračním paktu.
  osoby:
  - osoba: samuel-volpe
    vztah: negativni
    kontext: Pirátský poslanec — v debatě o Ceutě tvrdil, že Maročané přišli kvůli „ruským dezinformačním
