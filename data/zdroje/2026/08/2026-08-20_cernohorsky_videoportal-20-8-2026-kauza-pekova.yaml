  nadpis: Snaha odebrat Pekové soudně-znalecké oprávnění — stížnost slovenského poslance SaS (Černohorský,
    20. 8. 2026)
  text: Černohorský v rozhovoru popisuje, že poslanec slovenské strany SaS (Sloboda a Solidarita) podal
    na Slovensku formální stížnost směřující k tomu, aby Soňa Peková přišla o oprávnění soudní znalkyně
    — v reakci na to, že poskytla vlastní odborný posudek pro proces s Kolárem/Falcim, jehož závěry byly
    následně publikovány i v amerických a německých médiích. Černohorský tvrdí, že za snahou Pekovou takto
    umlčet stojí čeští úředníci z doby Babišovy vlády, kteří byli zapojeni do neprůhledných covidových
    zakázek (např. předražený nákup roušek) — Pekové posudek podle něj ohrožuje právě je, ne současnou
    vládu, a jejich motivací je, aby vše bylo promlčeno dřív, než by pravda vyšla najevo.
  citace:
  - text: Naše instituce v době Babiše provede tohle, co bych očekával od Fialy.
  osoby:
  - osoba: pekova
    vztah: pozitivni
    kontext: Hájena proti snaze o odebrání soudně-znaleckého oprávnění po jejím posudku v procesu s Kolárem/Falcim
      — srovnáno s Rajchlovou kritikou stejné kauzy
  podtema: Trestní stíhání kritiků covidu
