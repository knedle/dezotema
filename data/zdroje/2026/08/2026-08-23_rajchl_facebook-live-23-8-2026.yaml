  nadpis: STAN a TOP 09 jako „dozimetrické strany" — v normální zemi by byly u soudu (Rajchl, 23. 8. 2026)
  text: V reakci na televizní debatu, v níž vystupovali zástupci STAN a TOP 09, Rajchl opakuje označení
    obou stran za „dozimetrické" (viz [Kauza Dozimetr](#kauza-dozimetr)) a tvrdí, že v „normální zemi"
    by už dávno byly u soudu, který by rozhodoval o jejich zrušení nebo o astronomické pokutě. Zároveň
    odmítá, že by extremistické byly strany SPD/PRO — extremistickými nazývá naopak STAN, TOP 09 a Piráty,
    kterým vyčítá prosazování migrace, emisních povolenek a dalších opatření (např. EPBD) vedoucích dle
    něj k ochuzení občanů ve prospěch Bruselu.
  podtema: Kauza Ladislav Vrabel — dotační podvod
- id: rajchl-2026-08-23-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migrace jako „rakovina, která metastázuje" — úvaha o opuštění Schengenu (Rajchl, 23. 8. 2026)
  text: 'Rajchl k pokračujícímu přílivu migrantů z Ceuty opakuje svou tezi o migraci (africké i ukrajinské)
    jako největším bezpečnostním riziku ČR a poprvé ji doplňuje metaforou nemoci: migrace je jako rakovina,
    která „nejdřív si vybere ty nejslabší orgány, ale nakonec požere úplně všechny" — postupně zasáhne
    i státy, které dosud považuje za bezpečné, protože sociální dávky a tolerance v Německu, Francii a
    Španělsku jsou pro migranty výhodnější než v ČR, takže je to jen otázka času. Navrhuje ochranu vlastních
    hranic a v krajním případě zvažuje vystoupení ze schengenského prostoru — bezpečnost staví nad výtky
    z „nesolidárnosti", s tím, že je ochoten pomáhat finančně a lidsky při přírodních katastrofách, ale
    migraci označuje za politicky vyvolaný, nikoli přírodní jev.'
- id: rajchl-2026-08-23-05
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Projev u Českého rozhlasu 21.8. — „nejbizarnější moment české politiky od roku 1918" (Rajchl,
    23. 8. 2026)
  text: Rajchl ostře kritizuje projev Petra Pavla u budovy Českého rozhlasu při vzpomínkové akci na výročí
    okupace 1968 a označuje ho za „nejbizarnější okamžik historie české politické scény od roku 1918".
    Argumentuje Pavlovým vlastním životopisem z roku 1987 (dostupným na webu e15/e-dnes), v němž Pavel
    podle Rajchla neschvaluje okupaci jen mimoděk, ale opakovaně vyjadřuje obdiv k Sovětskému svazu a
    jeho metodám, popisuje měsíční pobyt v SSSR jako inspirativní zkušenost a slibuje důsledné prosazování
    stranické linie — v té době jako 27letý dospělý, nikoli sedmiletý chlapec, jak podle Rajchla namítají
    Pavlovi obhájci. Pavla nepovažuje za přesvědčeného komunistu, ale za „celoživotního oportunistu",
    který nikdy neriskoval nic ve prospěch nepopulárního postoje a vždy sloužil aktuálnímu režimu u moci
    — na rozdíl od statisíců lidí (včetně svého otce), kteří odmítli vstup do strany i za cenu ztráty
    kariéry. Přirovnává situaci k tomu, jako by se 36 let po válce u Lidic omlouval bývalý člen NSDAP
    usilující o kariéru v nacistické rozvědce. Za obzvlášť pobuřující považuje, že Pavel v projevu srovnával
    rok 1968 se současností (namítal „útoky na demokratická média" dnes) — což Rajchl odmítá jako srovnání
    s reálnou vojenskou okupací a umlčením médií tanky. Uzavírá tezí, že prosazování „Spojených států
    evropských" je dnes srovnatelné, možná i horší, než tehdejší schvalování vstupu Československa do
    sféry SSSR.
  citace:
  - text: On je celoživotní oportunista. On bude vždycky sloužit každému režimu, který bude zrovna u moci.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Projev u Českého rozhlasu 21.8. „nejbizarnější moment české politiky od 1918" — „celoživotní
      oportunista" bez páteře, přirovnán k nacistovi omlouvajícímu se za Lidice
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-08-23-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**23. 8.** — Rajchl v FB Live rozvádí čísla z televizní debaty: přesná kumulovaná inflace za
    Fialovy vlády 36,49 %, nárůst platů ve státní sféře jen 22,81 % (reálný propad 15 %), v soukromé sféře
    27,1 % (propad 10 %) — tedy „jediný, kdo prodělal", jsou občané, zatímco banky poprvé v historii ČR
    překročily zisk 100 mld. Kč a nadnárodní korporace jako Google podle něj na daních v ČR odvádí jen
    18 mil. Kč. Navrhuje jako řešení digitální daň (odhad přínosu 15 mld. Kč) a jednoprocentní sektorovou
    daň z aktiv bank. Doplňuje srovnání reálných mezd: v Bulharsku vzrostly o 36 %, v Maďarsku o 13,5
    %, v Polsku o 9 %, zatímco v ČR klesly. Jako symbolické „šetření u sebe" navrhuje koalice PRO/SPD/Svobodní
    zmrazení (Rajchl osobně by šel i pro snížení) platů politiků — opozici, která tento návrh odmítá jako
    „populismus", obviňuje z neochoty šetřit tam, kde by to bolelo ji samotnou.'
  podtema: Ekonomický program PRO
- id: rajchl-2026-08-23-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Odstrašování vede k válce, řešením je dialog po vzoru START/SALT — Rajchl (22. 8. 2026)
  text: '**23. 8.** — v reakci na televizní debatu Rajchl rozvádí odmítnutí slova „odstrašení" — označuje
    ho za termín vzniklý „v dílnách zbrojařských lobbistů", který má ospravedlnit nákup dalších zbraní
    (např. 49 tanků Leopard nebo stíhačky F-35 s dodáním až v roce 2035) místo skutečného odstrašení nepřítele.
    Tvrdí, že jediné reálně odstrašující jsou jaderné zbraně, které ČR nemá a mít nechce, protože by se
    tím stala terčem; klasické zbrojení proto o odstrašení nejde, ale o kamufláž pro přesun peněz zbrojařským
    korporacím (odhaduje polovinu z cca 200 mld. Kč plánovaných výdajů na zbrojení jako zbytnou, s tím,
    že by mohla jít na zdravotnictví, školství a důchody). Navrhuje, aby se ČR profilovala jako neutrální
    „most mezi Východem a Západem" a mediátor mírových jednání, po vzoru role, kterou si při konfliktech
    vzaly Turecko, Izrael a Maďarsko — s tím, že první krok k usmíření musí někdo udělat, jinak bude nepřátelství
    eskalovat donekonečna jako u manželů čekajících, kdo se omluví první.'
  citace:
  - text: Já jsem jednoznačným příznivcem dialogu... My musíme budovat přátelství, ne nepřátelství.
  podtema: Vyjednávání a mír
