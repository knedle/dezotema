- id: vrabel-2026-08-05-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Saúdský princ žádá Trumpa o deeskalaci — Írán popírá tvrzení o jednáních (Vrabel, 3. 8. 2026)
  text: '**5. 8.** — Jednání mezi Íránem a USA (a spojenci) o Hormuzském průlivu zůstávají podle WSJ na
    mrtvém bodě: Teherán požaduje bezpečnostní záruky, zrušení sankcí a ukončení americké námořní blokády,
    Washington trvá na tom, že se nejdřív musí obnovit volná plavba. Vrabel v tom vidí stejný vzorec jako
    u Ruska/Ukrajiny a Izraele/Hamásu — Západ oznámí, že se druhá strana na podmínkách shodla, aby se
    posléze ukázalo, že žádná ze stran ve skutečnosti neustoupila, protože obě si drží svou vyjednávací
    páku (Írán uzavřený průliv, Rusko vojenskou převahu). Předpokládá, že žádný z těchto tří konfliktů
    se v dohledné době (spíš měsíce až roky) nevyřeší, dokud jedna strana vojensky nezvítězí.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-08-05-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Ceuta: sexuální napadení nezletilých migrantů jako „kulturní" jev — apel na ochranu dětí (Vrabel,
    10. 8. 2026)'
  text: '**5. 8.** — Podle deníku ABC se na marockých sociálních sítích šíří výzvy k nové hromadné akci
    proti Ceutě plánované na 15. 8. 2026 (organizují ji stejné účty jako minulý nájezd, hlásí se k ní
    řádově statisíce lidí; hesla typu „poslední příležitost" Vrabel přirovnává k rétorice organizátorů
    demonstrací z roku 2023). Rozvíjí tezi o cíleném útoku administrativy USA (skrytě přes CIA) na španělskou
    vládu za to, že odmítla poskytnout Trumpovi vojenské základny a jakoukoli podporu ve válce s Íránem,
    a naopak jej kritizovala — dokládá to časovou návazností (Meloni oznámila uzavření hranic, pak Švédsko
    a Andrej Babiš vyzvali k vyřazení Španělska ze Schengenu, poté už 22 zemí EU). Cílem podle něj není
    zastavit nelegální migraci (na tu vyřazení ze Schengenu nemá žádný vliv, protože nelegální migranti
    hranice stejně neprochází legálně), ale podkopat politickou podporu současné španělské vlády u vlastních
    občanů a připravit její pád — analogicky k odstranění Viktora Orbána a rumunského kandidáta Călina
    Georgescu, tedy vynutit si vládu ochotnou plně podporovat NATO a poskytnout USA základny pro válku
    na Blízkém východě. Označuje to za „teroristický útok na španělskou suverenitu".'
- id: vrabel-2026-08-05-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: EU zúží dočasnou ochranu pro ukrajinské muže (18–60) — Vrabel (18. 6. 2026)
  text: '**5. 8.** — Opatření nabylo účinnosti: od dneška ukrajinští žadatelé ve věku 18–60 let, kteří
    nedoloží průkazku o splnění vojenské povinnosti, už nemohou žádat o dočasnou ochranu (mohou požádat
    jen o azyl, který jim ale pravděpodobně nebude udělen, protože jsou schopni bojovat na Ukrajině).
    Vrabel to označuje za „barbarské a fašistické" a jedinečné v porovnání s jinými skupinami uprchlíků
    (Eritrejce, Syřany, Afghánce nikdy nikdo nevracel bojovat do jejich zemí s odkazem na Ženevskou úmluvu)
    — tvrdí, že tak Evropa postupuje výhradně vůči Ukrajincům. Předpovídá, že to výsledně zvětší v ČR
    a Evropě šedou ekonomiku (lidé bez dokladů budou pracovat „na černo" pro mafie ze strachu z odhalení)
    a vytvoří nebezpečné hony na tyto lidi ze strany státu, při nichž může přijít o život i řada policistů
    — protože dotyční se budou bránit tomu, aby byli posláni na frontu, kde na ně podle zpráv čeká i násilí
    od domácí vojenské mafie (braní zlata, dokladů, karet, zastřelení při odmítnutí).'
- id: vrabel-2026-08-05-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Teorie o cílené likvidaci Slovanů/bílého muže skrze válku — Poláci „další na řadě" (Vrabel,
    5.–9. 8. 2026)
  text: 'Vrabel líčí debatu se svým známým o tom, zda je skutečným cílem ukrajinského konfliktu záměrná
    likvidace Slovanů, respektive útok na „slovanského bílého muže" obecně. Ukrajinci byli podle něj první
    proto, že jde o početný a militantní národ; předpovídá, že dalším cílem „snížení populace" budou Poláci,
    protože jsou v Evropě dalším silným a jednotným národem. Propojuje tezi s paralelním „útokem na bílou
    rasu" skrze islamizaci Evropy i USA a připouští, že obětí by mohli být i Němci. V nedělním vysílání
    9. 8. teorii rozvádí explicitně rasovým rámováním: mluví o „potřebě Slovanů" jako protiváhy k tomu,
    že „Germány a anglosasy" míchají s muslimy, přičemž slovanské ženy si podle něj muslimové „neberou
    tolik" — proto je třeba je poslat na frontu. Odhad, že po Ukrajincích budou příštím cílem právě Poláci,
    opírá i o vlastní zkušenost (dvouletý vztah s Polkou, časté pobyty v Polsku) — popisuje je jako „tvrdý,
    silný národ", srovnatelný se Srby.'
  citace:
  - text: Jestli ano, tak další budou Poláci. [...] já předpokládám, že další, kdo je na řadě k tomu,
      aby se snížili populace, jsou Poláci, jako obvykle, jako v každých válkách.
