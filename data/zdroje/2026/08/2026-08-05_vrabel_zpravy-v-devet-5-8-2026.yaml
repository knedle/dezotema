  poznamka: 'Vrabel — deník. Plně zpracováno 9 z 15 témat: 1600 vojáků na východní křídlo NATO, dron na
    letišti v Lipsku, Ceuta 15.8., EU 1,4 mld. eur ze zmrazených aktiv, teorie o likvidaci Slovanů, zákaz
    dočasné ochrany pro ukrajinské muže, ČR na „ukrajinské cestě", Hormuzský průliv v patu, Lotyšsko SS
    pohřeb/Thompson — viz [zpravodajstvi-vrabel/2026-08.md](zpravodajstvi-vrabel/2026-08.md). Predikce
    (Rusko do Kyjeva) a stoch. teror („Černoch") extrahovány bezvýjimečně.'
