  nadpis: 'Bitcoinová kauza: rekonstrukce předání elektroniky — přesný časový sled (Zítko, 5. 8. 2026)'
  text: 'Ve více než dvouhodinovém videorozboru reportáží ČT (Reportéři ČT, Rozpleteno) Zítko po záběrech
    postupně opravuje řadu dílčích nepřesností (datum propuštění Jiříkovského na podmínku — listopad 2020,
    ne jaro 2021; pravomocný rozsudek 9,5 roku, ne 9; vydání elektroniky v prosinci 2024, ne v březnu
    2025) a doplňuje přesný časový sled předání zabavené elektroniky: Krajský soud v Brně rozhodl o vydání
    13. 12. 2024, Jiříkovský si zapečetěnou techniku (46 nosičů) vyzvedl už 23. 12. 2024, ale znalci Bergerovi
    ji k „rozpečetění" a fotodokumentaci přinesl až začátkem března 2025 — a to jen jeden jediný notebook
    z 46. Znalec Jiří Berger (soudní znalec na kybernetickou bezpečnost z Brna, provozující zároveň cestovní
    kancelář vozící brněnské politiky do zahraničí) měl podmínku, že elektroniku dostane od policie stále
    zapečetěnou — Zítko namítá, že se to nedá ověřit, protože u samotného otevírání počítače v Bergerově
    kanceláři nebyl přítomen žádný nezávislý svědek za stát ani notář Míka (rovněž z Brna), ačkoli mělo
    jít o miliardovou hodnotu; scéna byla později pro účely dokumentu rekonstruována najatými komparzisty.
    Cituje bývalého soudce Davida Uhlíře (koordinátora kauzy, kterého na pozici dosadila Eva Decroix),
    který sám označil praxi podmiňování přijetí státního daru výsledkem soudního řízení dárce za postup
    „podvracející důvěru v právní stát" — Uhlíř za nedokončenou zprávu dostal zaplaceno 160 000 Kč. Na
    dokreslení srovnává postup s údajnou švýcarskou praxí, kde kriminalisté vyjednávají vydání přístupových
    hesel ke kryptoměnovým peněženkám pod hrozbou až tří let vězení.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
