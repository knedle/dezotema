  nadpis: 'Bitcoinová kauza: údajný poměr Decroix a Havránka jako další „brněnská frajeřina ODS" (Zítko,
    12. 8. 2026)'
  text: |-
    **28. 8.** — K rekapitulaci bitcoinové kauzy (opakování dřívějších čísel a jmen beze změny — Jiříkovský, Blažek, Daňhel, Tic, vrácení 46 počítačů) Zítko přidává novou spekulaci: bývalý poradce prezidenta Miloše Zemana Martin Nejedlý měl mít v srpnu 2023 obchodní vztah s advokátem Karimem Ticem (Jiříkovského obhájcem) — spekuluje, že Pavel Blažek se v té době skrýval v hospodě, kde náhodou probíhala Nejedlého oslava.

    ⚡ **Poznámka:** Propojení Martina Nejedlého s kauzou je nepodložená spekulace bez uvedených důkazů.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-08-28-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Privatizace jako řízená likvidace čs. průmyslu Západem — Solivary Prešov (Zítko, 8. 6. 2026)
  text: |-
    **28. 8.** — Zítko rozšiřuje tezi o řízené likvidaci na bankovní sektor: české banky byly v 90. letech nejprve sanovány z veřejných peněz (uvádí IPB a Ekoagrobanku jako příklady bank zachraňovaných státem), a jakmile byly „vyčištěné", prodány zahraničním vlastníkům — Česká spořitelna rakouské Erste, Komerční banka francouzské skupině, ČSOB belgické KBC, UniCredit italským vlastníkům. Odhaduje, že tímto mechanismem (zisky bank odcházející mimo ČR) ročně mizí ze země přibližně 1 bilion Kč. Doplňuje jmenovitý seznam dalších postav 90. let spojených s privatizačním rozkrádáním — Saša Novák (Chomutov), Patrik Oulický (Ústí nad Labem), Marek Dalík a Aleš Zbíček.

    ⚡ **Poznámka:** Konkrétní odhad „1 bilion Kč ročně" a jmenovité role uvedených osob nelze ověřit z veřejně dostupných zdrojů.
- id: zitko-2026-08-28-04
  typ: tvrzeni
  temata:
