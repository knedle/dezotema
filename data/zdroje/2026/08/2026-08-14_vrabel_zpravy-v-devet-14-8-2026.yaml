  poznamka: 'Vrabel — deník (dlouhé páteční video, natočeno z auta cestou na festival). Plně zpracováno
    5 z 15 témat: požáry/drony jako příprava „false flag" narativu + Tucker Carlson — [valka-nato-rusko.md](valka-nato-rusko.md);
    Catherine Austin Fitts — USA potřebují válku kvůli dolaru — [valka-nato-rusko.md](valka-nato-rusko.md);
    Lavrov přitvrzuje, plán vyždímat/zdevastovat Evropu — [valka-nato-rusko.md](valka-nato-rusko.md);
    Conor Kennedy na ruském seznamu hledaných — [valka-ukrajina-prubeh.md](valka-ukrajina-prubeh.md);
    zbytek (ministr Zuna/2% HDP, audit F-35, výbuch KNDS Itálie, Japonsko/Kurily, Británie/jaderný deštník,
    EU obaly, ukrajinské obilí, generál Grynkewich, USA popravy) jen v deníku — viz [zpravodajstvi-vrabel/2026-08.md](zpravodajstvi-vrabel/2026-08.md).
    Predikce (Babiš podepíše francouzský jaderný deštník) extrahována bezvýjimečně; bez stoch. teroru.'
