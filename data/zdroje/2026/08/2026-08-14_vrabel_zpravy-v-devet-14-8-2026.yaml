- id: vrabel-2026-08-14-01
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Conor Kennedy na ruském seznamu hledaných za boj na straně Ukrajiny — spekulace o „mentálním
    poškození" rodiny (Vrabel, 14. 8. 2026)
  text: Rusko zařadilo na mezinárodní seznam hledaných osob 32letého Conora Kennedyho, syna amerického
    ministra zdravotnictví Roberta F. Kennedyho juniora, za jeho účast v ukrajinské cizinecké legii (dle
    vlastních dřívějších výpovědí bojoval několik měsíců v Charkovské oblasti v roce 2022) — v nepřítomnosti
    mu hrozí až 10 let vězení, Moskva stíhá obdobně i další zahraniční dobrovolníky na straně Ukrajiny.
    Vrabel se pozastavuje nad tím, že syn vysoce postavené americké politické rodiny veřejně přizná boj
    za „fašistický režim" Zelenského i s odstupem let, kdy je už podle něj každému jasné, oč v konfliktu
    jde — a spekuluje (s odkazem na vyjádření svého známého lékaře, který doprovázel RFK Jr. na jednu
    z jeho akcí) o možném „mentálním poškození" v rodině, případně psychosomatických následcích atentátu
    na prezidenta Johna F. Kennedyho. Srovnává Conora Kennedyho co do „hlouposti" s českým europoslancem
    Filipem Turkem.
