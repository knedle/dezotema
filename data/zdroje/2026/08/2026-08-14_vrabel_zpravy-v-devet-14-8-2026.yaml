  nadpis: Babiš potichu podepíše dohodu o francouzském jaderném deštníku
  text: Vrabel předpovídá, že Andrej Babiš „potichu", bez veřejné debaty, podepíše dohodu s Francií o
    rozmístění francouzských jaderných zbraní (nosičů Rafale se střelami ASMPA) na území ČR výměnou za
    přístup k výhodám jednotného evropského trhu podobně jako navrhovaná britsko-unijní dohoda — možná
    dříve, než se stihne uskutečnit ohlášené veřejné shromáždění „Člověk na prvním místě" (3. 10. 2026).
  predikce:
    horizont: před 3. 10. 2026 nebo krátce po (neurčeno přesně)
    stav: vyvraceno
    vyhodnoceni:
    - datum: 2026-11-20
      text: (k 20. 11.) — dohoda o francouzském jaderném deštníku nebyla podepsána
      stav: vyvraceno
    - datum: 2026-11-20
      text: Babiš v odpovědi na výzvy z demonstrace 3. 10. uvedl, že vláda jaderné zbraně „neplánuje“.
        Ministerstvo obrany podle Vrabela s Francií jen jedná.
