  nadpis: 'Catherine Austin Fitts: USA potřebují pokračování války na Ukrajině kvůli dolarové dominanci
    (Vrabel, 14. 8. 2026)'
  text: Americká investiční bankéřka a bývalá vládní úřednice Catherine Austin Fitts (Vrabel s ní referuje
    o osobním setkání) tvrdí, že Spojené státy potřebují udržet konflikt na Ukrajině v chodu kvůli zachování
    globálního postavení dolaru jako rezervní měny a kontroly nad světovým finančním systémem — někteří
    představitelé amerického establishmentu jsou dle ní kvůli tomuto zájmu ochotni jít do extrémních kroků.
    Vrabel odkazuje na společné video s Tuckerem Carlsonem (zveřejněné s titulky na jeho Facebooku) jako
    doklad této teze.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-14-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Lavrov: Rusko „přitvrdí" proti všemu, co ze Západu živí ukrajinské válečné úsilí — Vrabel:
    plán vyždímat a zdevastovat Evropu (Vrabel, 14. 8. 2026)'
  text: Ruský ministr zahraničí Sergej Lavrov v rozhovoru pro ruskou státní televizi oznámil, že Moskva
    použije „mnohem tvrdší metody", aby zničila vše, co ze Západu živí „kyjevskou válečnou mašinu", a
    odmítl zastavit boje jinak než dosažením dlouhodobého a udržitelného řešení konfliktu. Vrabel to popisuje
    jako logické vyústění dlouhodobého „houpání" Ruska Západem (odmítnutí přijetí do NATO, nedodržované
    Minské dohody — dle Angely Merkelové sloužily jen k vyzbrojení Ukrajiny, zdržování po summitu na Aljašce
    Marcem Rubiem) a předpovídá další eskalaci ze strany Ruska. Spojuje to s tezí, že USA se snaží z konfliktu
    formálně „vycouvat" (Elon Musk odpojuje Ukrajině Starlink) nikoli proto, aby přestaly být zapojené,
    ale aby na financování dozbrojení dotlačily výhradně Evropu (Trump žádá po EU zaplatit 300 mld. dolarů
    za Bidenovu vojenskou pomoc Ukrajině) a nechaly ji „vyždímat" a případně i vojensky zdevastovat, zatímco
    USA by si zachovaly roli vítězné mocnosti. Dodává otevřenou nejistotu, do jaké míry je i vedení Ruska
    a Číny skutečně suverénní, nebo součástí téže globalistické struktury (Chabad-Lubavič vliv v Rusku)
    — po vlastní zkušenosti s Trumpem a českými politiky odmítá „dát ruku do ohně" za jakéhokoli politika,
    že bojuje za suverenitu, byť cituje srbského režiséra Emira Kusturicu, že v Rusku se bojuje „za zbytky
    normálního světa".
  podtema: Zahraniční aktéři a precedenty
