  nadpis: 'Eskalace NATO–Rusko: „není to Ukrajina, je to Západ"; AI drony vraždící bez člověka — Vrabel
    (14. 6. 2026)'
  text: '**14. 8.** — Vrabel rozvíjí tutéž tezi do podoby ucelené „false flag" teorie: každodenní zprávy
    o záhadných výbuších v rafinériích a zbrojovkách, požárech po celé Evropě a dronech narušujících vzdušný
    prostor (Rumunsko, Lotyšsko) interpretuje jako přípravu veřejného mínění na okamžik, kdy bude možné
    říct „už je to tady" — tedy jako needukovanou munici pro budoucí ospravedlnění protiruské eskalace,
    nikoli nesouvisející náhodné incidenty (odkazuje na svou tezi o [koordinovaných útocích na energetickou
    infrastrukturu](konspirace.md#koordinované-útoky-na-energetickou-infrastrukturu-po-celém-světě-vrabel-opakovaně-naposledy-13-8-2026)).
    Cituje souhlasně komentátora Tuckera Carlsona, který ve vysílání u Ricka Sancheze tvrdí, že ukrajinské
    útoky na ruské území mají za cíl vyprovokovat Moskvu k odpovědi na území členského státu NATO (hypersonický
    úder na Varšavu nebo Hamburk, případně taktická jaderná zbraň) — což by otevřelo přímý konflikt Rusko–NATO.
    Vrabel to ilustruje vlastní metaforou „velkého Pepíka", který postrkuje „malého Karla" (Ukrajinu)
    do rvačky s většími kluky, dokud ti nakonec neuhodí přímo Pepíka — a předpovídá, že jakmile Rusko
    napadne členskou zemi NATO/EU, je třeba okamžitě „mazat" z EU nejlépe do vojensky neutrálního Srbska,
    protože poté už státy uzavřou hranice a vyhlásí stav ohrožení.'
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-08-14-03
