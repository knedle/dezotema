  nadpis: Kritika moderátorky Adély Snopové — nedostatek respektu k Václavu Klausovi (Rajchl, 9. 8. 2026)
  text: Rajchl kritizuje moderátorku Adélu Snopovou (CNN Prima News) za rozhovor s Václavem Klausem v
    pořadu Napřímo — vytýká jí taktiku „otázka–odpověď–vlastní komentář–jdeme dál" (zabraňující hostovi
    reagovat), stejnou, jakou dle něj použila i na něj samotného v debatě o Rusku. Zásadní problém vidí
    v tom, že si dovolila Klause coby bývalého prezidenta věcně konfrontovat a prosazovat vlastní názory
    na válku na Ukrajině, které označuje za zjednodušující — na rozdíl od moderátora Michala Půra, kterého
    chválí za to, že hostům dává prostor a své názory prezentuje jen na vlastním podcastu, ne v roli moderátora.
    Přirovnává ji k bývalé redaktorce ČT Zuzaně Černé, jejíž vlastní projekt po odchodu z ČT rychle zkrachoval
    pro nezájem.
  podtema: Nová alternativní média
- id: rajchl-2026-08-09-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migrační pakt jako „vyděračský pakt"; Belfast jako varování — Rajchl (14. 6. 2026)
  text: '**9. 8.** — Rajchl shrnuje dozvuky obou debat (úterní s Piráty zástupcem Samuelem Volpem, páteční
    s Ondřejem Kolářem). Volpe podle něj tvrdil, že Ceuta je součástí Schengenu (80 tisíc obyvatel), a
    když ho Rajchl opravil, za dvě minuty přiznal, že Ceuta má „jiný režim" a že Maročané „uvěřili dezinformaci"
    o jejím schengenském statusu. Kolář v debatě argumentoval, že vyjednávání o migraci na úrovni EU je
    „realizací přímé demokracie" — Rajchl to označuje za fatální neznalost základních politologických
    termínů u obou debatujících. Zopakoval i argument o rozsudku španělského Nejvyššího soudu z r. 2020
    (zákaz deportace nezletilých bez doprovodu), který podle něj motivuje dospělé migranty vydávat se
    za nezletilé.'
- id: rajchl-2026-08-09-04
