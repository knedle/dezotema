  nadpis: Návrh na deportaci nezaměstnaných ukrajinských mužů v odvodovém věku (Rajchl, 9. 8. 2026)
  text: 'Rajchl oznamuje, že sám připraví a předloží ve Sněmovně návrh podle vzoru polské strany Právo
    a spravedlnost (PiS): každý Ukrajinec v odvodovém věku, který v ČR legálně nepracuje, nebo který spáchá
    dva přestupky či jeden trestný čin, by měl být automaticky deportován zpět na Ukrajinu, aby mohl bojovat
    za svou vlast. Argumentuje, že je nekonzistentní tvrdit současně, že ukrajinská migrace je pro ČR
    přínosem i zátěží (cituje Stachovo přetížení a rozhodnutí EU ukončit dočasnou ochranu právě s odůvodněním
    zátěže na sociální/zdravotní systém), a uzavírá, že jde jednoznačně o zátěž. Klíčovým motivem k rychlému
    jednání je podle něj obava, že pokud Polsko přijme svůj návrh dřív než ČR, nezaměstnaní ukrajinští
    muži v odvodovém věku z Polska (protože do Německa a Běloruska by neprošli) uprchnou právě do České
    republiky — ČR má už dnes nejvyšší podíl Ukrajinců na obyvatele v Evropě. Zvýhodňování Ukrajinců oproti
    občanům ČR (bydlení, zdravotnictví, školství, mírnější tresty u soudu) označuje za „macešské" chování
    státu k vlastním lidem.'
- id: rajchl-2026-08-09-05
  typ: tvrzeni
