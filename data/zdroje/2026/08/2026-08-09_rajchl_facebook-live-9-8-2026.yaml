  nadpis: Výzva gayům a lesbám, aby se distancovali od Prague Pride jako „festivalu perverze" (Rajchl,
    9. 8. 2026)
  text: Rajchl tvrdí, že česká společnost nemá s homosexualitou problém — podle něj se v 95 % případů
    homosexuálové neliší od heterosexuální většiny — ale Prague Pride podle něj přestal být oslavou homosexuální
    orientace a stal se „přehlídkou úchylek a perverzí" (líčí muže v kostýmech psů, ženy s hadičkami vedenými
    do kanystrů), která poškozuje vnímání gayů a leseb obecně. Vyzývá samotné gaye a lesby, aby se od
    festivalu veřejně distancovali a řekli, že je nereprezentuje — to by podle něj byl skutečný krok k
    „jednotě společnosti" a konci homofobie. Kritizuje, že akce je částečně financována z veřejných peněz,
    a srovnává reakci na coming-out fotbalisty Jakuba Jankta (nadšené ovace) s ideálem, aby taková zpráva
    vyvolávala jen reakci „no a co".
  podtema: Eutanazie
- id: rajchl-2026-08-09-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Trump nevnímá EU jako relevantního partnera — ekonomická slabost, Green Deal a migrace (Rajchl,
    7. 7. 2026)
  text: '**9. 8.** — Rajchl rozvíjí vizi V4/střední a jihovýchodní Evropy jako poslední obranné linie
    proti „dvouocasé přišeře" (Green Deal a migrace). Tvrdí, že Německo, Francie a Španělsko jsou vůči
    tomuto dvojímu ohrožení „nenávratně ztraceny", protože si migraci i energetiku podle něj zničily samy
    — na rozdíl od střední Evropy, která si migraci „nezaplevelila" a energetický sektor si nezničila
    Green Dealovými nařízeními. Vyzývá k budování silné V4 (ČR, Polsko, Maďarsko, Slovensko) jako regionu
    s ještě reálnou šancí na přežití.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
