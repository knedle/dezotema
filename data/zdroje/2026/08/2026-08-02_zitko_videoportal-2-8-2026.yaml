    na rodinné vazby: dcera Ellison Fauciová pracovala pro Twitter a podílela se na cenzuře kritických
    názorů v éře Bidenovy administrativy; manželka Christine Grady vede oddělení bioetiky NIH schvalující
    léky pro FDA. Samostatně zmiňuje případ amerického lékaře Kirka Moora, který místo covid vakcín aplikoval
    pacientům fyziologický roztok — podle Zítka byla proti němu vedená obvinění „v plném rozsahu" zrušena,
    což prezentuje jako vindikaci jeho postupu a paralelu k vlastnímu trestnímu stíhání.'
