  text: 'Zítko rozšiřuje narativ o dvojnících/hercích na senátory účastnící se slyšení Anthonyho Fauciho
    (29. 7.): domnívá se, že velmi razantní senátoři mohli být ve skutečnosti hollywoodští herci vystupující
    „v rámci dohody o vině a trestu" — konkrétně senátora Joshe Hawleyho ztotožňuje s hercem Ryanem Reynoldsem
    a senátora Bernieho Morena s Tomem Cruisem. Navazuje na svou dřívější tezi, že dítě přítomné při Trumpově
    přísaze byl ve skutečnosti herec Paul Walker v roli J. D. Vanceho. Dále identifikuje ženu v civilu
    za Fauciho jako možnou Caroline Kennedyovou (podle světle modré kšiltovky s nápisem „Carolina") a
    poukazuje, že ke konci slyšení se na jejím místě objevila žena v uniformě americké armády — což čte
    jako signál, že „všechno je pod kontrolou armády".'
