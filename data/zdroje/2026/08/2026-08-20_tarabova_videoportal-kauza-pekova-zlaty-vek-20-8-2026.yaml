  nadpis: '⚡ Konflikt: odebrání znaleckého razítka jako formální otázka nestrannosti, ne umlčování (Tarabová,
    20. 8. 2026)'
  text: 'Na rozdíl od Černohorského rámování (viz výše) — kde snaha odebrat Pekové znalecké oprávnění
    je politicky motivovaná snaha úředníků z Babišovy éry ji umlčet — Tarabová cituje a vykládá stanovisko
    Ministerstva spravedlnosti odlišně. Podle ní ministerstvo nijak nezpochybnilo vědecké závěry ani odbornost
    Soni Pekové, ani o nich vůbec nerozhodovalo. Šlo čistě o formální porušení zákona o znalcích: znalec
    musí být nepodjatý a nesmí ve stejné věci zároveň veřejně vystupovat jako aktivista prosazující určitý
    názor. Peková podle citovaného stanoviska opakovaně vystupovala v médiích kriticky ke covidu (spolu
    se slovenským zmocněncem Kolárem) a tentýž postoj pak formalizovala jako „znalecký posudek" — čímž
    porušila princip nestrannosti, za což dostala pokutu a pokárání. Tarabová dodává, že takto podjatě
    postupuje podle jejích zkušeností velká část znalců (jmenovitě v porodnictví a vakcinologii), kteří
    by měli čelit stejné kritice. Uzavírá, že Peková na razítku není závislá a bude ve výzkumu pokračovat
    i bez něj.'
  podtema: Trestní stíhání kritiků covidu
- id: tarabova-2026-08-20-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Kritika Rajchlova semináře v PS ke covidu jako „hrané divadlo" (Tarabová, 20. 8. 2026)
  text: Tarabová hodnotí seminář na půdě Poslanecké sněmovny věnovaný covidovým nesrovnalostem, na němž
    vystoupil Jindřich Rajchl, jako zklamání. Ačkoli podle ní Rajchl řekl řadu věcí, které mohly vzbudit
    naději, po vlastním prozkoumání situace uzavírá, že žádný reálný efekt tato snaha nemá — jde o „hranou
    snahu odhalovat nesrovnalosti", nikoli upřímný pokus o nápravu. Takové akce podle ní slouží jako divadlo
    odvádějící pozornost veřejnosti k jiným tématům.
  podtema: Trestní stíhání kritiků covidu
- id: tarabova-2026-08-20-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Převrácení jachty" a příchod „nového zlatého věku" (Tarabová, 20. 8. 2026)
  text: 'Tarabová uzavírá video nejasně formulovanou, mysticky laděnou předpovědí blížící se dramatické
    proměny světa: mluví o tom, že „to, co je před náma, bude velkolepé, velké, hutné, husté", přirovnává
    současnou situaci k jachtě, která se má „převrátit vzhůru nohama" a znovu narovnat, po čemž má následovat
    „nový zlatý věk" — dobu, kdy se lidem bude „dobře spát" a diváci budou z celého srdce děkovat „stvořiteli",
    že mohli tuto proměnu zažít. Předpověď je bez konkrétního data či ověřitelného obsahu (žádná konkrétní
    událost, jen obrazná řeč o transformaci).'
  podtema: Náboženský a okultní výklad moci
