  nadpis: TOP 09 a státní pozemky pro levnější bydlení — bydlení je odpovědnost jednotlivce, ne státu
    (Šejna, 21. 8. 2026)
  text: 'Šejna reaguje na návrh TOP 09 využít státní pozemky k výstavbě levnějšího bydlení. Uznává, že
    jde o legitimní úhel pohledu (stát má nevyužité pozemky, které by mohly lidem pomoci s bydlením),
    ale odmítá ho: bydlení je podle něj odpovědností jednotlivce, ne státu, a státní pozemky by měly sloužit
    spíš investicím, které státu vydělávají peníze, než výstavbě bytů. Jako skutečné řešení nedostatku
    a zdražování bytů navrhuje přestat šikanovat developery zdlouhavým povolovacím procesem — právě umělé
    prodlužování výstavby vytváří podle něj umělý nedostatek bytů, který zvyšuje jejich cenu; řešením
    je umožnit rychlejší výstavbu.'
  podtema: Politické strany — kritika STAN
