  nadpis: Kritika státního financování Prague Pride — ohrožení morální výchovy dětí (Šejna, 7. 8. 2026)
  text: Šejna rozlišuje mezi podporou LGBT lidí v tom, aby byli „hrdí na to, jací jsou", a financováním
    pražského Pride průvodu ze státních peněz — druhé odmítá jako škodlivé „kulturní obohacení", které
    dlouhodobě poškozuje společnost a ohrožuje morální výchovu dětí. Argumentuje, že veřejné peníze by
    neměly podporovat nic, co dětem škodí, ale naopak jim pomáhat, protože děti jsou „budoucnost státu".
