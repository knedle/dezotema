vyroky:
- id: vrabel-2026-08-10-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Zemětřesení v Kolumbii — spekulace o HAARP a geopolitickém motivu (Vrabel, 10. 8. 2026)
  text: 'K zemětřesení v Kolumbii (70 mrtvých) Vrabel nejprve připomíná svou tezi o lidském vlivu na klima
    (kácení lesů, betonizace měst, větrníky ovlivňující vlhkost a srážky) a odmítá Petra Macinku, který
    podle něj tvrdí, že „klimatická změna skončila". U samotného zemětřesení jde dál: spekuluje, že příčinou
    by mohly být „harpy" globalistů (odkaz na HAARP), a hledá politickou souvislost — napadá ho, že by
    mohlo jít o odvetu za to, že Kolumbie nedostatečně podporuje Trumpův plán vytvořit „TechNate" v Jižní
    Americe směrem ke Grónsku. Sám dodává, že to může být i čirá náhoda nebo přirozený jev. Připojuje
    k tomu obecné pozorování, že hoří tankery v Černém moři a obzor je v plamenech.'
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: Odmítá jeho tvrzení, že „klimatická změna skončila" — Vrabel trvá na tom, že člověk má vliv
      na podnebí (kácení lesů, betonizace, větrníky)
  podtema: Historické konspirační výklady
- id: vrabel-2026-08-10-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Ceuta: sexuální napadení nezletilých migrantů jako „kulturní" jev — apel na ochranu dětí (Vrabel,
    10. 8. 2026)'
  text: Ke zprávě, že se španělská enkláva Ceuta potýká s přeplněnými zařízeními pro nezletilé migranty
    a že byly nejméně čtyři marocké děti mladší 14 let hospitalizovány kvůli údajnému sexuálnímu napadení
    (během dvou týdnů dorazilo přes 2 500 migrantů, převážně z Maroka, úřady řeší přesun ~1 000 nezletilých
    na španělskou pevninu), Vrabel líčí sexualizaci malých dívek jako součást kultury, se kterou přicházející
    vyrůstají „u strejčka, táty, souseda, bratra", byť dodává, že většina mužů takové jednání odsuzuje.
    Uzavírá apelem, že tuto kulturu by Evropa neměla vpouštět „minimálně kvůli našim malým holčičkám"
    — navazuje na svou dřívější tezi o [obchodu s dětmi v souvislosti s Ceutou (30. 7.)](/temata/migrace/2026.md#vrabel-2026-07-30-06).
- id: vrabel-2026-08-10-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Dronový útok na ruský Tatarstán — „naše ruce jsou od krve" (Vrabel, 10. 8. 2026)
  text: 'K útoku, při němž zahynulo nejméně třináct lidí po rozsáhlém dronovém útoku na ruský Nižnekamsk
    v Tatarstánu (ruská strana hlásí zničení 456 ukrajinských dronů nad svým územím té noci, v Tatarstánu
    vyhlášen den smutku), Vrabel zdůrazňuje přímou spoluodpovědnost ČR a Západu: drony jsou podle něj
    placeny z peněz EU, ČR a NATO, Ukrajinci coby žoldáci je jen posílají — proto je podle něj potřeba
    si uvědomit, že „my máme ruce tady v tom odkrvi", a čím dřív si to Češi uvědomí, tím dřív může konflikt
    skončit. Navazuje na dřívější tezi o přímé zodpovědnosti ČR za útok na kolej ve [Starobělsku (1. 6.)](/temata/valka-ukrajina-prubeh/2026.md#vrabel-2026-06-01-05).'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-08-10-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: FPV drony zabíjejí civilisty; kritika odmítání ochrany ukrajinským mužům v ČR — „karma" pro
    operátory (Vrabel, 10. 8. 2026)
  text: Ke zprávě, že organizace Strong Europe pořádá v ČR kurzy létání s FPV drony pro ukrajinské válečné
    veterány i české zájemce (bezpečnostní komunita i laici), Vrabel varuje, že jde o zbraň, ne o koníček
    — ukazuje záběry civilních obětí (prodavač zeleniny, řidiči aut, útok na pláž se sedmi mrtvými dětmi)
    a tvrdí, že operátor dronu, který zabije civilistu, je vrah a nese za to „karmu" stejně jako dron
    sám. Zároveň kritizuje, že ČR odmítá vydávat víza a dočasnou ochranu ukrajinským mužům ve vojenském
    věku, dokud nedoloží potvrzení o odsloužení v armádě — na rozdíl od uprchlíků z Blízkého východu a
    Afriky, kterým je vstup do Evropy podle něj otevřený bez dokladů. Zastává názor, že všichni Ukrajinci
    odmítající bojovat pro „fašistický režim" Zelenského by měli utéct ze země a žádná země by neměla
    vracet válečné uprchlíky zpět. Predikuje, že až Ukrajincům dojdou „lidské baterie" na frontě, budou
    muset na frontu ti, kdo je tam posílali.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-08-10-05
  typ: predikce
  temata:
  - migrace
  nadpis: 'postupná demografická proměna ČR: za 20 let jako Rakousko, za 35 let jako Británie, za 50 let
    „islámská"'
  text: Pokud ČR nadále setrvá u „západních" hodnot a přístupu k migraci, bude podle Vrabela do 20 let
    vypadat jako dnešní Rakousko, o dalších 15 let (tedy za 35 let) jako dnešní Británie, a do 50 let
    už nebude většinově osídlena „původními bílými obyvateli", ale bude islámská — jeho syn se prý ještě
    může dožít okamžiku, kdy ČR přestane být „Česká". Anglii už považuje za „ztracenou" bez ohledu na
    to.
  citace:
  - text: Za 50 let můj syn se možná ještě dožije toho, že Česká republika už nebude Česká, už tam nebude
      většinově osídlená původními bílými obyvateli, ale bude islámská.
  predikce:
    horizont: 20 let (Rakousko), 35 let (Británie), 50 let (demografická většina)
    stav: ceka
