  nadpis: Policie obvinila Blažka, Daňhela a Jiříkovského — Rajchl (4. 5. 2026)
  text: '**5. 8.** — Rajchl upřesňuje, proč vyšetřování ztratilo měsíce: trestní řízení proti Blažkovi
    se rozjelo až po nástupu Jeronýma Tejce na ministerstvo spravedlnosti. Uvádí, že koordinátor Uhlíř
    dostal za zpracování zprávy o kauze zaplaceno „několik set tisíc korun z peněz daňových poplatníků",
    ale žádnou nezpracoval — Decroix jeho práci označila za duplicitní k internímu/externímu auditu, který
    sama nakonec také nezveřejnila v netransparentní podobě. Novým tvrzením je, že díky tomuto zdržení
    (protaženému až za volby) si Stanjura mohl od státu odkoupit svůj služební mobil a počítač za zbytkovou
    cenu — Rajchl se domnívá, že jejich obsah „buď smazal, nebo došlapal", ještě než mohly být zajištěny
    jako důkaz.'
  osoby:
