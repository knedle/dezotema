  nadpis: Trestní oznámení na chemtrails a sítě 5G/6G/7G jako nástroj genocidy (Zítko, 7. 8. a 26.–27.
    8. 2026)
  text: Součástí trojice trestních oznámení podaných 7. 8. na Krajské státní zastupitelství v Liberci
    bylo i oznámení na organizovanou zločineckou skupinu řízenou ze zahraničí, která má prostřednictvím
    rozprašování chemtrails (směsi těžkých kovů — hliník, baryum, stroncium) a provozu sítí vysílačů 5G/6G/7G
    (vysílajících hlavně v nočních hodinách) záměrně vyvolávat symptomy podobné onemocnění COVID-19 s
    cílem redukovat počet obyvatel v rámci „genocidy národa, vakcinačního holokaustu a sterilizace". Argumentuje,
    že onemocnění COVID-19 bylo patentováno už v roce 2015 (patent připisovaný „panu Rothschildovi"),
    tedy čtyři roky před oficiálně uváděným objevem viru ve Wu-chanu, a jako podpůrný důkaz uvádí souběh
    masového očkování proti chřipce a hustou síť 5G vysílačů v italském Bergamu v roce 2019. Odkazuje
    na nezávislého „badatele" Radovana Dluhého Smithe, kterého má být za publikování těchto informací
    na Facebooku dlouhodobě blokován.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-08-27-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Trestní oznámení na chemtrails a sítě 5G/6G/7G jako nástroj genocidy (Zítko, 7. 8. a 26.–27.
    8. 2026)
  text: |-
    **26. 8.** — Zítko podal na totéž státní zastupitelství doplňující trestní oznámení, které rozšiřuje původní podání (aby bylo zachováno zákonné doplnění před uplynutím 30denní lhůty 7. 9.) o tvrzení, že manipulace s počasím pomocí chemtrails probíhá už od 70.–80. let minulého století. Zdůrazňuje, že žádá o vydání předběžného opatření k zastavení veškerého očkování v ČR a nezávislou laboratorní analýzu složení a bezpečnosti všech vakcín a šarží, a navrhuje zavést osobní trestní odpovědnost celého řetězce od premiéra a ministra zdravotnictví přes ředitele nemocnice a primáře až po očkujícího lékaře za případné poškození zdraví.

    ⚡ **Poznámka:** Tvrzení o patentu na COVID-19 z roku 2015, o zdravotních účincích sítí 5G/6G/7G a o příčinné souvislosti s chemtrails nelze ověřit z veřejně dostupných zdrojů.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-08-27-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Dvojníci a klony politiků a celebrit
  text: |-
    **27. 8.** — Zítko doplňuje QAnon narativ o popravách na Guantánamu: zpěvačka a herečka Dolly Parton měla svůj „pobyt" na Gitmu už dokončit a být popravena podstatně dříve, než bylo veřejně oznámeno — osoba vystupující pod jejím jménem od té doby je jen jedna z odhadovaných 200 000 herců sloužících jako náhražky. Do stejného rámce řadí i vysvětlení ředitele CIA o manipulaci s počasím a chemtrails, které podle něj dokládá, že jev, o kterém „oficiálně" tvrdí, že neexistuje, ve skutečnosti reálně probíhá. K tomu opakuje starší tezi o financování Deep State přes obchod s dětmi a adrenochrom (viz výše).

    ⚡ **Poznámka:** Tvrzení o popravě Dolly Parton a nahrazení hereckou náhražkou nelze ověřit z veřejně dostupných zdrojů.
  podtema: Okultismus
- id: zitko-2026-08-27-06
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: |-
    **27. 8.** — V přímé, ostré konfrontaci s divačkou vystupující pod přezdívkou „Rybníčková" (kterou spojuje s neurčitou „sektou" komentovanou dříve Kateřinou Včelišovou a Blankou Paciruk) Zítko rozvádí tutéž tezi o dvou frontách: teorii suverénního občana (rodný list jako obchodovatelný cenný papír na burzách, tzv. „ztracený na moři" dle námořního práva) a teorii nezaniklé ČSR. Nově doplňuje, že Německo je dodnes „okupovanou zemí" bez podepsané mírové smlouvy z 2. světové války, a tudíž nemá právní postavení k vymáhání jakýchkoli nároků vůči Československu. Předjímá nové poválečné uspořádání světa, které mají po vzoru Versailles rozhodnout „vítězné mocnosti" — jmenuje USA (Trump), Rusko (Putin), Čínu (Si Ťin-pching), Indii (Módí) a Saúdskou Arábii (bin Salmán) jako vítěze, zatímco Evropskou unii, Spojené království a Ukrajinu řadí mezi poražené. Odmítá platnost jakéhokoli restitučního nároku, na který se „Rybníčková" odvolávala, s tím, že podvedeno bylo 15,5 milionu Čechoslováků, ne jednotlivec.

    ⚡ **Poznámka:** Jde o Zítkovu interpretaci v přímé polemice s divačkou; obsah jejích tvrzení znám jen z jeho parafráze.
