  nadpis: Sdílený klip z rozhovoru o životopisu 1987 — výzva přestat volit „novodobé komunisty" (Šejna,
    23. 8. 2026)
  text: Šejna sdílí a doplňuje krátkým komentářem tentýž úryvek rozhovoru, v němž je Pavel konfrontován
    s pasáží ze svého ručně psaného životopisu z roku 1987 (viz výše) o vlivu léta 1968 a přátel ze Sovětského
    svazu na jeho tehdejší názory — na přímou otázku, zda tomu v roce 1987 věřil, Pavel odmítá odpovědět
    s tím, že šlo o „nějaký výklad ruské invaze". Šejna to uvádí slovy, že Pavel „bude vyvracet svá vlastní
    tvrzení", a uzavírá výzvou, aby ČR přestala do ústavních funkcí volit ty, kdo se nechali „vyškolit
    na rozvědčíka" a okrádali o tajné informace státy, které dnes nazývá spojenci — označuje to za „tragédii".
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Konfrontován se svým životopisem z 1987 (obdiv k SSSR), odmítl odpovědět, zda tomu tehdy
      věřil; přirovnán k „novodobému komunistovi" a bývalému rozvědčíkovi okrádajícímu dnešní spojence
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
