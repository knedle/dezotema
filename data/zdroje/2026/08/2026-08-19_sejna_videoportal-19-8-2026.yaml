  nadpis: Piráti a regulace krátkodobého ubytování v Praze jako „komunistický" zásah do vlastnictví (Šejna,
    19. 8. 2026)
  text: Adam Šejna reaguje na video dokládající, jak pražští zastupitelé za Piráty postupují proti nelegálnímu
    krátkodobému ubytování typu Airbnb v bytech kolaudovaných k bydlení. Argumentuje, že mezi takovým
    bytem a hotelem není z pohledu nájemníka žádný praktický rozdíl, a kritizuje Piráty za to, že si osobují
    právo určovat občanům, jak mohou nakládat s vlastním majetkem — srovnává tento přístup s komunismem
    („pražští komunisté"). Uzavírá výzvou volit v komunálních volbách podle vlastní představy o budoucí
    podobě Prahy.
  podtema: USA — volební systém
