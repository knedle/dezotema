- id: vrabel-2026-08-12-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Elektřina v ČR jako „1000% marže" — Tykač a Křetínský profitují ze státního cenového stropu
    (Vrabel, 9. 8. 2026)
  text: '**12. 8.** — K půlroční zprávě ČEZ (nižší tržby i provozní zisk, ale vyšší čistý zisk díky konci
    daně z neočekávaných zisků a vyšším cenám elektřiny; vyšší výroba z uhelných a paroplynových zdrojů)
    Vrabel opakuje, že zisk vznikl jen díky uměle navýšené ceně elektřiny pro domácnosti (~4,5× dražší
    než v Srbsku při srovnatelných nákladech) — jde tedy o přesun peněz od běžných občanů k majitelům
    elektráren. K plánu vlády Andreje Babiše na „zestátnění" ČEZ dodává, podle svého čtení mediálního
    komentáře, že ve skutečnosti jde o opak: stát by měl převzít ztrátové (neziskové) části výroby, zatímco
    ziskové části by byly privatizovány ve prospěch soukromých hráčů (v komentáři jmenovaní, ale jména
    si nepamatuje — patrně Tykač/Křetínský) — tedy „zestátnění" jako zástěrka pro privatizaci zisku a
    socializaci ztrát.'
  podtema: Elektřina — marže a ceny
- id: vrabel-2026-08-12-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Národní plán obnovy jako nástroj přesunu peněz k elitám, ne obnovy ekonomiky (Vrabel, 12. 8.
    2026)
  text: 'Evropská komise oznámila vyplacení 897 mil. eur (~21,8 mld. Kč) České republice z Nástroje pro
    oživení a odolnost — ČR tak vyčerpala 88 % svého celkového přídělu (8,67 mld. eur), zbývající cíle
    musí splnit do konce srpna. Vrabel k tomu rozvíjí kritiku Národního plánu obnovy jako celku: fond
    vznikl oficiálně k obnově ekonomiky po covidu, ale peníze (40 % Green Deal, 20 % digitalizace) ve
    skutečnosti slouží stejnému účelu jako všechny „finanční nástroje globalizace" posledních desetiletí
    — přesunu bohatství k elitám na úkor běžných lidí. Konkrétně: v energetice fond financuje přechod
    od soběstačnosti (ČR byla čistým vývozcem elektřiny) k závislosti na dovozu (cílem má být energetická
    velmoc Německo, ne ČR); v „digitalizaci" jde o infrastrukturu digitální kontroly občanů (kamery, sběr
    dat, příprava sítě 6G), nikoli jen o elektronizaci úřadů; ve zdravotnictví fond podle Vrabela financuje
    centralizaci (viz jeho kritiku zavírání menších onkologických pracovišť a nedostatku léků z předchozího
    dne), nikoli skutečné zlepšení péče. Zdůrazňuje, že ČR je čistým plátcem do rozpočtu EU — peníze,
    které „dostává", jsou ve skutečnosti její vlastní prostředky vrácené s podmínkami, na co je smí použít.'
