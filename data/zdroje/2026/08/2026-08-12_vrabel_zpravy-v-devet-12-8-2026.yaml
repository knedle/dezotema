- id: vrabel-2026-08-12-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Teorie o cílené likvidaci Slovanů/bílého muže skrze válku — Poláci „další na řadě" (Vrabel,
    5.–9. 8. 2026)
  text: '**12. 8.** — K výroku ruského ministra zahraničí Sergeje Lavrova, že případný vstup Ukrajiny
    do EU by mohl vést k rozpadu celého bloku (unie se dle něj čím dál víc profiluje jako bezpečnostně-obranná
    struktura), Vrabel rozšiřuje svou tezi o záměrné likvidaci na celou Evropu. Tvrdí, že Ukrajinci, až
    pochopí, že jejich zemi „rozprodal a zadlužil" Zelenský a že ji rozvrátili západní globalisté (BlackRock,
    Boeing, Lockheed Martin, Palantir) pro vlastní zisk, budou plakat — ale Evropané budou plakat ještě
    víc, až zjistí, že tentýž Deep State vyvolal válku s Ruskem, aby si Evropu (550 milionů lidí — desetkrát
    víc než ukrajinská populace) ekonomicky podmanil a vykořistil. Uzavírá, že „Evropa jako Evropská unie"
    už prošla svým civilizačním i ekonomickým vrcholem a od covidu „jde jenom dolů".'
  citace:
  - text: Ještě víc budeme plakat my, Evropané, až pochopíme, že globalisté ze Západu [...] vymysleli
      to, aby v Evropě byla válka s Ruskem, aby si absolutně podmanili a ekonomicky zdominovali a vykořistili
      Evropu.
  podtema: Příčiny a odpovědnost za válku
- id: vrabel-2026-08-12-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Rusko uzavřelo přístavy u Oděsy — ukrajinský obilný koridor prakticky zastaven (Vrabel, 29.
    7. 2026)
  text: '**12. 8.** — Vrabel doplňuje, že i náhradní dunajská trasa přes Rumunsko je nyní ohrožena rekordním
    suchem a výrazným poklesem hladiny řeky — lodě musí plout jen částečně naložené, což dále omezuje
    kapacitu jediného zbylého vývozního koridoru. Kombinaci ruského uzavření černomořských přístavů a
    přírodní kalamity na Dunaji shrnuje pesimisticky: „obávám se, že Ukrajinci své obilí prostě vyvážet
    nebudou" — a že podobné problémy postihnou i další komodity, nejen obilí.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-12-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Dvojí metr v dodávkách zbraní — Německo se stydí, ČR se chlubí (Vrabel, 8. 8. 2026)
  text: '**11. 8.–12. 8.** — Vrabel navazuje na téma dvakrát. K nominaci Jaromíra Zuny (SPD) do funkce
    ministra obrany dodává zklamání: SPD si nejvíc nárokovala nálepku vlastenecké strany vzešlé z demonstrací
    roku 2022, ale místo prosazení slibované politiky obsadila resort obrany ministrem, který chce muniční
    iniciativu ještě posílit. Vrabel odmítá Babišovo tvrzení (že členství v „koalici ochotných" nepřineslo
    žádné výsledky) jako účelové gesto pro voliče — ve skutečnosti podle něj muniční iniciativa reálné
    výsledky přinesla: za vlády Petra Fialy byla ČR na 10. místě žebříčku „nepřátelských zemí" Ruska,
    s Babišem se posunula na 5. místo. K rozhovoru náměstka MO Jakuba Landovského pro ČT24 (přiznává pokračující
    českou vojenskou pomoc Ukrajině — munice, drony, peníze do PURL — přestože vláda navenek vystupuje
    zdrženlivě) dodává, že jde o „přímé zapojení do války", byť se hledá jen to, kdo to zaplatí.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-08-12-06
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: Rusko po vyřešení Ukrajiny sjednotí Srbsko s Kosovem
  text: Vrabel k brutálnímu napadení Srba kosovskou policií předpovídá, že se kosovská otázka „vyřeší,
    až Rusko vyřeší problémy na Ukrajině a Evropa bude rozbitá" — v horizontu „pár let" pak podle něj
    Rusko přijde a sjednotí Srbsko zpět s Kosovem a s Republikou srbskou (v Bosně). Islámskou část bývalé
    Jugoslávie (Bosnu, Albánii) podle něj Rusko řešit nebude.
  predikce:
    horizont: několik let po vyřešení konfliktu na Ukrajině (neurčeno přesně)
    stav: ceka
