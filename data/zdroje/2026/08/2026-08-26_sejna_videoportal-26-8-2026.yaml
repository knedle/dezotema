  nadpis: Podpora vražedkyně Lindsay Clancy jako důkaz radikalizace feminismu (Šejna, 26. 8. 2026)
  text: 'Šejna komentuje americký případ Lindsay Clancy, která podle zveřejněných informací uškrtila své
    tři děti (5 let, 3 roky, 8 měsíců) — sám poznamenává, že nemá přímý přístup k reálným informacím a
    jde o jeho názor založený na dostupných zprávách. Kritizuje reakci části veřejnosti: feministické
    demonstrace na její podporu (tvrzení, že za čin nemůže, včetně odkazů na horoskop), sbírku na GoFundMe
    (přes milion dolarů) a trend na sociálních sítích, kdy se ženy fotí s dítětem v náručí s popiskem
    „me too Lindsay". Tento trend označuje za „absolutní retardaci" a uzavírá, že jde o důkaz radikalizace
    moderního feminismu jako jedné z „nejšílenějších skupin v celé západní společnosti".'
  podtema: Eutanazie
