  nadpis: 'Ukrajinská migrace: rozsah, kriminalita a plán revize pobytu (Rajchl, 16. 8. 2026)'
  text: '**27. 8.** — K článku na Aktuálně.cz o kritických čekacích dobách na diagnostická vyšetření (3/4
    občanů čeká déle než měsíc, každý třetí déle než čtvrt roku — u nádorových onemocnění může jít o rozdíl
    mezi uzdravením a smrtí) Rajchl tvrdí, že se tím potvrzuje jeho dřívější „proruská dezinformace":
    příčinou přetížení je nápor ukrajinských migrantů na zdravotní systém přetížený už od roku 2022. Kromě
    revize pobytů a rychlého návratu migrantů na Ukrajinu nově navrhuje převést peníze z „Národní očkovací
    strategie" (kterou označuje za pouhý výdělek pro farmaceutické firmy, viz [Covid a vakcíny](/temata/covid-vakciny/2026.md#tarabova-2026-04-30-01))
    do obnovy počtu lékařů a zdravotních sester — s odkazem na to, že do deseti let odejde do důchodu
    třetina z nich.'
