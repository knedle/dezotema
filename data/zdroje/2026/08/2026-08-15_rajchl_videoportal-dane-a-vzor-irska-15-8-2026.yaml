  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**15. 8.** — Rajchl opakuje vzor Irska (růst HDP 12,3 % v roce 2025, korporátní daň 12,5 %, přebytkový
    rozpočet) a rozšiřuje o konkrétní zdůvodnění, proč zvyšování daní v ČR škodí: doplňuje odchod Zetoru
    z ČR jako příklad firmy, kterou k odchodu dotlačily vysoké ceny energií a Green Deal. Propojuje nižší
    korporátní daň s požadavkem na odchod z Lipské (evropské) burzy s emisními povolenkami a jejich zrušením
    jako podmínkou obnovení konkurenceschopnosti a přílákání zahraničních investorů k danění v ČR.'
  citace:
  - text: Ten recept funguje a já nerad vymýšlím kolo, já se rád inspiruju v zemí, kde to funguje.
  podtema: Ekonomický program PRO
- id: rajchl-2026-08-15-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**16. 8.** — Rajchl opakuje odmítnutí zvyšování daní (odkazuje na neúspěšné zavedení tzv. windfall
    tax ministrem Stanjurou, který sliboval 80 mld. Kč navíc, reálně vybral necelou třetinu) a doplňuje
    k dosavadnímu vzoru Irska nově i **Argentinu** jako druhý referenční příklad deregulace a snížení
    daňové zátěže. Opakuje adresné dluhopisy (D3, Dukovany, přefinancování státního dluhu) jako nástroj,
    jak zabránit odchodu přes 100 mld. Kč ročně zahraničním bankám za obsluhu státního dluhu, a přirovnává
    současný model (velká část výsledku české práce odchází do zahraničí) k ekonomické kolonizaci — konkrétně
    k těžbě nerostného bohatství v Rwandě, kde zisk zůstává mimo zemi.'
  podtema: Ekonomický program PRO
