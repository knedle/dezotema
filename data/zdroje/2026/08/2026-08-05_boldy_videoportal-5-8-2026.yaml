  text: Boldy sarkasticky komentuje připravovaný komerční humanoidní robot pro řemeslníky (odhadovaná
    cena 5–20 mil. Kč), jehož vzhled přirovnává k bafometovi a kentaurovi. Ironicky zpochybňuje oficiální
    prezentaci coby neškodného pomocníka a naznačuje skryté vojenské využití zbraňových systémů a riziko
    hacknutí — přičemž ujištění výrobce o bezpečnosti a nemožnosti zneužití označuje za nevěrohodná.
