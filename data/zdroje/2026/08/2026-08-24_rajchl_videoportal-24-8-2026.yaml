  nadpis: 'Petr Pavel: kritická bilance čtyř let prezidentství — Rajchl (3. 5. 2026)'
  text: '**24. 8.** — V krátkém debatním klipu Rajchl týž seznam opakuje beze změny (Lichtenštejnové,
    vzdání se veta, euro, USE) a rámuje ho jako obranu proti Pavlově kritice vládního závazku nepřekročit
    2 % HDP na obranu (na rozdíl od Pavlem preferovaných 5 %) — s tezí, že „prezident není náš nadřízený",
    nýbrž občané, kteří vládě dali mandát v říjnových volbách.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
