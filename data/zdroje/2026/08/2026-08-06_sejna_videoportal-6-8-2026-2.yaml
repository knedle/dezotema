  text: '**6. 8.** — Adam Šejna informuje, že kauza přešla do trestního řízení, což prodlouží dobu do
    vydání rozhodnutí z původně odhadovaného jednoho měsíce na 6–12 měsíců — což čte jako nestandardní
    postup policie. Zdůrazňuje, že Turek se funkce vládního zmocněnce pro Green Deal (nehonorované) vzdal
    dobrovolně, aniž by k tomu měl morální či právní důvod (šetření nebylo uzavřeno), a interpretuje to
    jako gesto pokory. Lituje ztráty „největšího bojovníka proti Green Dealu" v kritické fázi boje o průmysl
    a odmítá „politizaci" nehody s odkazem na to, že v ČR se loni stalo přes 85 tisíc dopravních nehod.'
  podtema: Filip Turek — dopravní nehoda a tlak na rezignaci
