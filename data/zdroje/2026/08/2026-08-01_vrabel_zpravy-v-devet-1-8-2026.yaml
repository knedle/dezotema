vyroky:
- id: vrabel-2026-08-01-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: USA/Izrael připravují rozsáhlé bombardování Íránu — odkaz na Žirinovského předpověď (Vrabel,
    1. 8. 2026)
  text: Podle amerických médií (CBS, CNN) USA a Izrael připravují rozsáhlou bombardovací kampaň zaměřenou
    především na íránskou energetickou infrastrukturu, útoky by mohly začít už během víkendu — Trump o
    tom mluvil den předem. Teherán varoval, že zásah nezůstane bez odvety a má připravený plán útoků na
    izraelské a americké cíle. Vrabel připomíná dřívější předpověď (dle Zuzky od Vladimira Žirinovského),
    že třetí světová válka nezačne na Ukrajině, ale na Blízkém východě, a vyjmenovává státy už zatažené
    do konfliktu (Egypt, Irák, Izrael, Libanon, Írán, Kuvajt, Saúdská Arábie, SAE, Bahrajn, Katar) — s
    tím, že brzy přijde na řadu i Sýrie. Doplňuje otevřené zklamání z Donalda Trumpa, kterého dříve podporoval
    a vychvaloval, ale nyní jej hodnotí jako „největšího válečného prezidenta", co pamatuje.
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: Otevřené zklamání — „největší válečný prezident, co pamatuju"; chystá bombardování Íránu
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-08-01-02
