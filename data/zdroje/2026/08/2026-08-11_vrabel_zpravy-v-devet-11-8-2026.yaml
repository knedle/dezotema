vyroky:
- id: vrabel-2026-08-11-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Írán „telenovela" 38× a manipulace ropy; Izrael, „Velký Izrael" a Netanjahu řídící USA — Vrabel
    (13. 6. 2026)
  text: '**11. 8.** — Vrabel opakuje tentýž cyklus k aktuálnímu růstu ceny ropy Brent (+5 % za týden,
    ~80 $), tentokrát s číslem „40× za sebou": očekává, že cena bude růst do čtvrtka/pátku, kdy Trump
    (možná až večer) oznámí otevření Hormuzského průlivu k obohacení „svých kamarádů", kteří si vsadili
    na pokles ceny. K souběžné zprávě o „blížící se dohodě" (dle pákistánského ministra obrany) dodává,
    že „v Pákistánu neví, jaký je den" — obě strany (Írán, USA) zprávu o jednání popírají.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-08-11-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: EU platí influencery a tlačí na Meta/TikTok kvůli „dezinformacím" o Ceutě (Vrabel, 11. 8. 2026)
  text: 'Ke zprávě, že eurokomisařka Henna Virkkunen vyzvala platformy Meta a TikTok k intenzivnějšímu
    zásahu proti dezinformacím v krizových situacích (v reakci na příliv migrantů do Ceuty, který podle
    agentury AFP částečně podpořila falešná zpráva o „otevřené hranici") a že Evropská rada spustila roční
    pilotní program dávající influencerům omezený přístup na summity a ministerská jednání (bez práv novinářů
    — bez účasti na briefinzích a kladení otázek), Vrabel to shrnuje jako oboustrannou strategii: EU si
    sama platí influencery výměnou za příznivé zpravodajství, zatímco zároveň tlačí na přísnější kontrolu
    Meta/TikTok a spojuje to s chystaným „chat control" (kontrola veškeré komunikace). Skutečnou příčinu
    přílivu migrantů do Ceuty (jednostranné rozhodnutí španělské vlády legalizovat 700 000 nelegálních
    migrantů) považuje za zamlčovanou ve prospěch narativu o „dezinformaci na Facebooku". Dodává, že ústava
    sice zaručuje svobodný přístup k informacím, ale nikoli k tomu, co úřady označí za „dezinformaci"
    — pojem, který v ústavě vůbec není definován, ale prosazuje se skrze nadřazenost mezinárodních smluv
    (čl. 10a/10b ústavy).'
  podtema: DSA — Digital Services Act
- id: vrabel-2026-08-11-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Komise „neumí spočítat" úroky z půjčky 90 mld. eur Ukrajině — Vrabel nabízí výpočet (11. 8.
    2026)
  text: 'Podle deníku Berliner Zeitung Evropská komise v odpovědi na dotaz europoslance Fabia De Masiho
    uvedla, že v současnosti nedokáže určit, kolik bude EU stát úhrada úroků z plánovaného úvěru 90 mld.
    eur pro Ukrajinu, ani zda na to bude v rozpočtu na rok 2027 dost prostředků; De Masi zároveň vyjádřil
    obavu, že část peněz skončí u zkorumpovaných oligarchů. Vrabel připomíná, že o tomto problému mluví
    od prosince 2025, kdy Andrej Babiš v Evropské radě odsouhlasil půjčku s odůvodněním, že „Česká republika
    za ni neručí" — což je podle Vrabela zavádějící: ručení se týká jen případu krachu EU, jinak úroky
    i jistinu (Ukrajina ji dle něj nikdy nesplatí) platí členské státy z rozpočtu, tedy běžní občané.
    Vrabel zpřesňuje svůj prosincový odhad úrokové sazby (do 4 %) na cca 3,35 % a nabízí Komisi výpočet
    nákladů zdarma.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-08-11-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Szijjártó opouští politiku k čínskému BYD — další příznak „ukrajinizace" Maďarska (Vrabel, 15.
    7. 2026)
  text: '**11. 8.** — Maďarský parlament formálně zvolil Andráse Baku prezidentem (140 hlasů, jediný kandidát;
    volbu i inauguraci bojkotovali poslanci opozičního Fideszu a křesťanských demokratů) — dle agentury
    Reuters jde o další krok premiéra Magyara k oslabení mocenských struktur spjatých s Orbánem. Vrabel
    k tomu sarkasticky dodává, že by si bojkotující poslanci měli dávat pozor, aby neskončili ve vězení
    jako obviněný Szijjártó, a popisuje probíhající „brutální čistky" v Maďarsku (cílené na Szijjártóa
    i Orbána) jako předváděné navenek coby „revoluce" osvobozující zemi od údajně totalitního a zkorumpovaného
    režimu Orbána — odměnou je uvolnění zadržovaných peněz z programu Erasmus a dalších dotací pro Maďarsko.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-08-11-05
  typ: predikce
  temata:
  - blizky-vychod
  nadpis: Trump do čtvrtka/pátku oznámí otevření Hormuzu, cena ropy pak klesne
  text: Vrabel předpovídá, že rostoucí cena ropy Brent (+5 % za týden) bude dál stoupat do čtvrtka, nejpozději
    pátku, kdy Donald Trump oznámí otevření Hormuzského průlivu — čímž umožní „svým kamarádům" vydělat
    na předem uzavřených sázkách na pokles ceny. Jde o 40. opakování téhož cyklu, který podle Vrabela
    pozoruje od května 2026.
  predikce:
    horizont: do 13.–14. 8. 2026
    stav: vyvraceno
    vyhodnoceni:
    - datum: 2026-11-20
      text: Trump otevření Hormuzu neoznámil, průliv prohlásil za území pod kontrolou USA a zůstal z velké
        části uzavřen
      stav: vyvraceno
    - datum: 2026-11-20
      text: 'Vrabel 13. a 15. 8.: spor o kontrolu průlivu, průliv „z velké části uzavřen“.'
