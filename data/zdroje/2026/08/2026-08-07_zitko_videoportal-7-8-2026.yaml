  nadpis: Trestní oznámení na Petra Fialu za „přípravu útočné války" (Zítko, 7. 8. 2026)
  text: |-
    Zítko podal na krajské státní zastupitelství trestní oznámení na bývalého premiéra Petra Fialu a (mj.) Janu Černochovou za přípravu útočné války (§406) a podněcování útočné války (§407), dále za zneužití pravomoci úřední osoby (§329) a porušení povinnosti při správě cizího majetku (§220). Argumentuje, že ČR dodávala Ukrajině zbraně už začátkem února 2022 — tedy před zahájením ruské „speciální operace" 24. 2. 2022 — což podle něj naplňuje skutkovou podstatu přípravy útočné války; upozorňuje, že Ukrajina navíc nebyla členem NATO. Za tento trestný čin hrozí podle §406 trest odnětí svobody 12–20 let nebo výjimečný trest.

    ⚡ **Poznámka:** Tvrzení o dodávkách zbraní „začátkem února 2022" nelze ověřit z veřejně dostupných zdrojů; oficiálně zdokumentované dodávky vojenské pomoci ČR Ukrajině probíhaly až po 24. 2. 2022.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-08-07-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Spor se advokátem Patrikem Tušlem — teorie o zfalšovaném zatýkacím videu Tomáše Čermáka (Zítko,
    7. 8. 2026)
  text: Advokát Patrik Tušl (dříve obhajovaný Zítkem v kauze Tomáše Čermáka) veřejně obvinil Zítka, že
    je „fízl" a že stojí za uvězněním Čermáka na základě policejní provokace z listopadu (výslech, při
    kterém policie o Čermákovi nic nezmínila). Zítko obvinění odmítá a v reakci předkládá vlastní teorii,
    že záznam Čermákova zadržení na polsko-české hranici je zfalšovaný — záběry osoby v policejní vestě
    nikdy nezachytily obličej zepředu, postava i chůze podle něj neodpovídají Čermákovi a osoby na videu
    viditelně čekají na pokyn kameramana, než se rozejdou. Uzavírá, že o Tušlovi coby obhájci přestal
    mít zájem poté, co Jindřich Rajchl veřejně oznámil, že bude Tušla zastupovat on.
