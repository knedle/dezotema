  nadpis: Trestní oznámení na „genocidu národa, vakcinační holokaust a sterilizaci obyvatelstva" (Zítko,
    7. 8. 2026)
  text: Zítko podal na krajské státní zastupitelství čtyřstránkové trestní oznámení označené jako „genocida
    národa, vakcinační holokaust a sterilizace obyvatelstva" — o podání informoval i nejvyšší státní zástupkyni
    Lenku Bradáčovou a velitele NCOZ Mazánka. Oznámení uzavírá formulací, že kdokoli se s obsahem dokumentu
    seznámí a nebude okamžitě a bez odkladu konat, stává se sám trestně odpovědným podle §367 trestního
    zákoníku (nepřekažení trestné činnosti).
  podtema: Volání po tribunálu
