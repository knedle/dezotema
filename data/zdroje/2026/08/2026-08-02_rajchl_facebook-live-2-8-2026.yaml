  nadpis: Fauci se odvolal na 5. dodatek — kontrast s beztrestností v ČR (Vrabel, 30. 7. 2026)
  text: '**2. 8.** — Rajchl doplňuje k témuž slyšení právní a faktickou argumentaci. Tvrdí, že Fauciho
    odvolávání se na pátý dodatek je právně sporné, protože už má od Joea Bidena milost — a judikát Nejvyššího
    soudu USA z roku 1896 (*Brown v. Walker*) říká, že se svědek nemůže dovolávat ochrany před sebeobviněním,
    pokud mu žádné trestní stíhání nehrozí; senátní výbor (Rand Paul) má proto příští týden hlasovat o
    obvinění Fauciho z pohrdání Senátem. Z odtajněného deníku cituje formulaci „deliberately inserted"
    (úmyslně vloženo) o sekvenci, která vytvořila SARS-CoV-2 — a poukazuje, že Fauciho milost byla podepsána
    zpětně od roku 2014, což čte jako nepřímé přiznání, že od tohoto roku (nikoli od roku 2019/2020) financoval
    gain-of-function výzkum ve Wu-chanu. Senátor Ron Johnson prezentoval data o vedlejších účincích (ivermectin
    ~17 úmrtí/rok vs. vakcíny ~7 000/rok) jako důkaz, že potlačení informací o ivermectinu/hydroxychlorochinu/izoprinozinu
    bylo nutnou podmínkou k udělení nouzového povolení vakcínám (které by jinak vyžadovalo roky klasického
    testování). Zmiňuje žaloby na Pfizer v 5 státech USA (nejdále stát Kansas) za lhaní o vedlejších účincích
    u těhotných žen a o přenosu nákazy. Uzavírá, že obdobné slyšení by si zasloužili i čeští „odborníci"
    (jmenuje Primulu), kteří by podle něj u podobné konfrontace „dopadli úplně stejně" jako Fauci.'
