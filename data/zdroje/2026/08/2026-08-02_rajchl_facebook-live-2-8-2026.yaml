  nadpis: Neudělení akreditace Zdislavě Pokorné vs. blokace webů v únoru 2022 — pokrytectví mainstreamu
    (Rajchl, 2. 8. 2026)
  text: 'K hysterické reakci mainstreamových médií na rozhodnutí Petra Macinky neudělit akreditaci Zdislavě
    Pokorné (Deník N) na tiskovou konferenci ministerstva zahraničí Rajchl staví ostrý kontrast s únorem
    2022, kdy Národní centrum kybernetických operací vyzvalo poskytovatele (NIC.cz) k blokaci webů opozičních/alternativních
    médií (mj. „První zprávy CZ") s jediným odůvodněním, že jsou „proruské a dezinformační", bez jakéhokoli
    ověřování — tehdy mainstream mlčel, protože šlo o jejich politické oponenty. Neudělení jedné akreditace
    na jednu tiskovku podle něj v žádném případě nelze srovnávat s úplným zablokováním webu a zničením
    obchodní činnosti. Připomíná vlastní zkušenost: ministr vnitra Vít Rakušan mu veřejně vyhrožoval,
    že s ním (jako organizátorem demonstrace) „nebude mít slitování" — a dokládá řadou konkrétních kauz,
    že běžní občané byli trestně stíháni za „šíření poplašné zprávy" jen za vyjádření názoru na sociálních
    sítích (Martina Bednářová, Jakub Netík, Tomáš Elner, muži z Plzně) — na rozdíl od skutečných výhrůžek
    násilím vůči jeho osobě a dětem, které policie odmítla řešit jako „netrestný čin". Uzavírá, že kdyby
    se politici jemu blízcí chovali recipročně (blokovali weby, vyhrožovali novinářům), mainstream by
    to nikdy nepřipustil mlčet — a vyzývá k tomu, aby si veřejnost tento rozdíl v metru uvědomila.'
  podtema: Trestání politického projevu
- id: rajchl-2026-08-02-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
  text: '**2. 8.** — Rajchl k téže debatě dodává rozbor nákladů na ukrajinskou migraci: odmítá tvrzení
    Grolicha, že Ukrajinci jsou pro ČR ekonomickým přínosem, s odkazem na policejní vyjádření o dávkové
    turistice jako „špičce ledovce" a na tabulku MPSV, kterou označuje za metodicky zkreslenou — na straně
    příjmů počítá se všemi daněmi placenými Ukrajinci (včetně odhadů u DPH), na straně výdajů ale jen
    s přímými dávkami, nikoli s náklady na zdravotnictví, školství či platy úředníků. Institut ekonomických
    studií v Kielu (metodika OECD) a New York Times odhadují reálné náklady na cca 250 mld. Kč ročně —
    3–4× víc než číslo MPSV. Argumentuje analogií desátého nájemníka bytového domu, který platí nájem,
    ale ne podíl na společných službách (úklid, výtah, ostraha), a poukazuje na to, že 20 % Ukrajinců
    v ČR jsou děti/senioři a jen 60 % pracuje — ekonomicky srovnatelné s 20% nezaměstnaností, což nemůže
    být pro stát čistým přínosem.'
  osoby:
  - osoba: jan-grolich
    vztah: negativni
    kontext: V debatě o nákladech na ukrajinskou migraci označen za „naprostého ekonomického analfabeta
      a notorického lháře"
- id: rajchl-2026-08-02-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Ceuta jako „invaze, ne migrace" — ČT lže o návratu migrantů (Rajchl, 2. 8. 2026)
  text: Rajchl odmítá rámování dění v Ceutě (do 80tisícové oblasti proniklo cca 50 tisíc marockých migrantů)
    jako „migraci" nebo „doplňování lidských zásob" (parafráze Angely Merkelové) — trvá na tom, že jde
    o „čistou invazi" a „občanskou válku", srovnatelnou s dřívějšími nájezdy v Lampeduse a na Lesbosu,
    jen ve větším měřítku. Tvrdí, že Česká televize v pátek/sobotu lživě informovala o tom, že se situace
    uklidnila a většina migrantů se vrátila zpět — na základě vlastní komunikace s lidmi na místě to označuje
    za „absolutní lež". Řešením není dočasné vyloučení Španělska ze Schengenu (Itálie, 1 měsíc) ani žádné
    podobné gesto, ale to, aby si ČR chránila vlastní hranice a byla připravena vystoupit ze Schengenu,
    pokud bude třeba.
- id: rajchl-2026-08-02-05
  typ: tvrzeni
  temata:
