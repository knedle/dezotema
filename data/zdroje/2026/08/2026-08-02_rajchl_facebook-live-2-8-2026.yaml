  nadpis: Migrační pakt — první zpráva Vysoké komise 15. 10.; Johansson dnes vyslankyní EU pro Ukrajinu
    (Rajchl, 2. 8. 2026)
  text: 'K tématu, které už dříve podrobně rozebíral (viz [Migrační pakt jako „vyděračský pakt"](/temata/migrace/2026.md#rajchl-2026-06-14-04)),
    Rajchl doplňuje dva konkrétní nové detaily: (1) první hodnotící zpráva Vysoké komise pro migraci (přidružené
    k Evropské komisi) o migračním tlaku v jednotlivých zemích má být hotová 15. 10. 2026 — od té chvíle
    podle něj skončí česká výjimka založená na přijetí Ukrajinců a začne skutečné přerozdělování; čísla
    30 000 migrantů/rok nebo 500 tis. Kč za osobu (~15 mld. Kč/rok) jsou přitom jen **minima**, komise
    může přidělit i víc. (2) Ylva Johansson, bývalá eurokomisařka pro vnitřní věci, která veřejně prosazovala
    přijetí milionu migrantů ročně a tvrdě prosazovala migrační pakt i chat control, dnes zastává funkci
    zvláštní vyslankyně Evropské komise pro Ukrajinu — Rajchl to čte jako důkaz, že bude tlačit na masový
    příliv Ukrajinců do EU i po skončení války.'
