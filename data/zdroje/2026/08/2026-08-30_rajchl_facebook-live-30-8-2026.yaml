  nadpis: Chat Control a bezhotovostní společnost jako nástroje totální kontroly — ústavní ukotvení hotovosti
    (Rajchl, 14. 8. 2026)
  text: '**30. 8.** — Rajchl doplňuje, že vedle práva platit hotovostí chce PRO do Ústavy zakotvit i obecnější
    „právo žít offline" — a vysvětluje, proč k tomu nutně potřebuje senátní křesla: bez souhlasu Senátu
    nelze Ústavu měnit vůbec, ať se jakkoli mluví o zbytečnosti této komory. Jako další příklady ústavních
    změn, které bez Senátu nejsou možné, uvádí definici manželství jako svazku muže a ženy a ústavní ukotvení
    dvou pohlaví (vzor Slovenska) — v kampani před komunálními a senátními volbami 2026 na to váže podporu
    vlastních senátních kandidátů (Milan Loprajs, Jan Skalický, Hynek Beran, Josef Šorm).'
- id: rajchl-2026-08-30-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Bitcoinová kauza: rekonstrukce předání elektroniky — přesný časový sled (Zítko, 5. 8. 2026)'
  text: '**30. 8.** — Rajchl rozšiřuje roli znalce Jiřího Bergera o novou vazbu: byl to právě on, kdo
    v restauraci s Jiříkovským, Tycem a směnárníkem Stránským osobně domlouval podmínky směny bitcoinů,
    a byl to on, kdo doporučil, že zapečetěný počítač má projít přes notáře Míku (podle Rajchla Blaškova
    spolužáka) — přestože počítač k notáři nakonec dorazil nezapečetěný a den předtím, než notář poslal
    miliardu na ministerstvo spravedlnosti, měl (pravděpodobně Jiříkovský) převést přes 2 miliardy Kč
    na jiný účet. Rajchl zdůrazňuje, že Berger byl zároveň spolužákem i dlouholetým poradcem ministra
    financí Zbyňka Stanjury (2022 až do vypuknutí kauzy, firma E-Fractal s.r.o. si u ministerstva financí
    a jím řízené Generální finanční inspekce naúčtovala přes 10 mil. Kč) — a přesto nebyl obviněn, ačkoli
    u výslechu využil práva nevypovídat kvůli riziku vlastního trestního stíhání. Žádá vysvětlení, proč
    obžaloba míří jen na Jiříkovského, Tyce, Blažka a Daňhela, ale ne na Bergera, a spojuje to s vlastní
    tezí, že by to vedlo přímo ke Stanjurovi.'
  osoby:
  - osoba: jiri-berger
    vztah: negativni
    kontext: Znalec propojující účastníky bitcoinové kauzy (Jiříkovský, Tyc, směnárník Stránský), spolužák
      a dlouholetý poradce Zbyňka Stanjury — přesto neobviněn; Rajchl žádá vysvětlení
  - osoba: zbynek-stanjura
    vztah: negativni
    kontext: Propojení s Bergerem (spolužák, poradce od 2022, firma E-Fractal fakturovala 10+ mil. Kč
      ministerstvu financí) jako důvod, proč case Bergera nesmí být rozkryt
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: rajchl-2026-08-30-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Bitcoinová kauza: údajný poměr Decroix a Havránka jako další „brněnská frajeřina ODS" (Zítko,
    12. 8. 2026)'
  text: '**30. 8.** — Rajchl se vrací k roli Evy Decroix jako koordinátorky kauzy, konkrétně k tomu, že
    najala bývalého soudce Davida Uhlíře na zpracování zprávy o postupu policie a justice (viz [Bitcoinová
    kauza: rekonstrukce předání elektroniky, 5. 8.](#bitcoinová-kauza-rekonstrukce-předání-elektroniky-přesný-časový-sled-zítko-5-8-2026)),
    ale poté jeho hotovou práci odmítla přijmout s odůvodněním, že by duplikovala interní a externí audit
    — Uhlíř přesto dostal zaplaceno (v přepisu neuvedena přesná částka, „400 tisíc nebo kolik"). Rajchl
    nekritizuje Uhlíře (dokončenou práci by si nechal zaplatit každý), ale žádá, aby takové rozhodnutí
    neslo osobní důsledky pro Decroix, která kontrakt uzavřela i zrušila — jako příklad obecnějšího principu
    hmotné a trestní odpovědnosti politiků a úředníků, které chce prosazovat: kdo jako manažer v soukromé
    firmě udělá chybné rozhodnutí stojící peníze, nese za ně odpovědnost, veřejná správa by podle něj
    měla fungovat stejně. Zmiňuje i to, že Decroix od doby, kdy se provalil její vztah s Havránkem, dlouho
    nebyla ve Sněmovně vidět a při televizní debatě o kauze na CNN Prima News ODS raději vyslala zástupce
    z Pirátů.'
  osoby:
  - osoba: eva-decroix
    vztah: negativni
    kontext: Rozšíření kauzy Uhlíř — najala ho, pak jeho hotovou zprávu odmítla proplatit s odůvodněním
      duplicity auditu; Rajchl žádá její osobní finanční odpovědnost
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: rajchl-2026-08-30-04
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Rozhovor na CNN Prima News jako „tragikomedie" — návrh na snížení počtu nemocnic a přístrojů
    (Rajchl, 30. 8. 2026)
  text: 'Rajchl ostře kritizuje nedělní rozhovor Petra Pavla s Petrem Kováčem na CNN Prima News, který
    označuje za „tragikomedii" plnou hlouposti, prázdnoty a „argumentační zoufalosti" — kdyby to viděl
    na internetu bez kontextu, myslel by si, že jde o AI generované video. Za nejtragičtější považuje
    Pavlovo vyjádření ke zdravotnictví: prezident řekl, že ČR má příliš mnoho nemocnic a příliš mnoho
    přístrojů (magnetické rezonance), a navrhl jejich počet snížit. Rajchl to označuje za odtržené od
    reality lidí, kteří čekají na vyšetření magnetickou rezonancí i tři měsíce a na operace kloubů (kyčel,
    koleno) i přes rok v bolestech. Staví proti tomu vlastní program „přesně obráceně": posílení počtu
    zdravotních sester a lékařů (mj. návrat k dostatečnosti čtyřletého středoškolského vzdělání pro všeobecnou
    sestru bez nutnosti dalších nástaveb, vyšší platy), a systém školného a stipendií pro strategické
    obory (medicína, právo, ekonomie, technika) — stát zaplatí studium (u medicíny odhaduje náklad 5–6
    mil. Kč) nejlepším studentům podle výsledků přijímaček, výměnou za závazek minimálně 10 let pracovat
    v ČR, jinak musí stipendium splatit; obory jako „genderová a klimatická studia" si mají studenti platit
    sami. Argumentuje, že to sníží odchody čerstvých absolventů do zahraničí (po 5–10 letech v ČR už si
    člověk obvykle založí rodinu a zůstane) a zmírní závislost zdravotnictví na zahraničním personálu
    — kritizuje jazykovou bariéru ukrajinských zdravotních sester zejména v psychiatrii, kde je verbální
    porozumění pacientovi klíčové.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Rozhovor na CNN Prima News — návrh na snížení počtu nemocnic a přístrojů označen za „tragikomedii"
      odtrženou od reality
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-08-30-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**30. 8.** — Rajchl shrnuje kompletní výdajovou a příjmovou stránku programu PRO v jednom přehledu.
    Výdajová strana: plošný škrt 5–10 % pro všechny resorty kromě ministerstva práce a sociálních věcí
    (kvůli důchodům); zrušení vybraných armádních nákupů — konkrétně tanků Leopard (39 mld. Kč + cca 60
    mld. Kč na provoz a údržbu, přičemž na Ukrajině již dodané tanky stojí nevyužité v poli) a stíhaček
    F-35 (další ~150 mld. Kč pořizovacích nákladů plus provoz — jedna letová hodina F-35 stojí přes milion
    Kč, čtyřikrát víc než u Gripenu); okamžité zastavení národních dotačních programů pro politické a
    „zelené" neziskové organizace („ani korunu" — v opačném případě slibuje rezignaci); zrušení emisních
    povolenek ETS1 a ETS2, které podle něj stojí každého občana 7000 Kč ročně (Švédsko 200 Kč, Německo
    370 Kč), tj. 21 000 Kč na tříčlennou rodinu a přes 100 mld. Kč negativního dopadu na rozpočet. Příjmová
    strana beze zvýšení daní občanům: 1% sektorová daň z aktiv bank, 1% sektorová daň z obratu zbrojařských
    firem (obě odvětví podle něj vydělaly za poslední čtyři roky stovky miliard Kč) a dorovnávací digitální
    daň pro firmy jako Google a X (Google dosud odvedl jen 18 mil. Kč na daních).'
  podtema: Ekonomický program PRO
- id: rajchl-2026-08-30-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Šéf CIA Ratcliffe v Moskvě — spekulace: Rusko předem varuje USA před akcí proti „koalici ochotných"
    (Vrabel, dovětek, 26. 8. 2026)'
  text: '**30. 8. (Rajchl, jiná interpretace)** — Rajchl nabízí odlišný výklad téže návštěvy: podle něj
    Ratcliffe (spolu se šéfem vatikánské diplomacie) vyjednával konkrétní podmínky ukončení války na Ukrajině,
    protože pro Trumpa je konflikt už jen „přítěží" — americké firmy mají výhodné kontrakty se Zelenským
    na ukrajinské nerostné bohatství a půdu, takže pokračování války nemá pro USA další hodnotu, zatímco
    fronta se Rusům podle Rajchla rychle láme u Sloviansku a Kramatorsku. Odhaduje podmínky dohody: Rusko
    získá zbytek Doněcké oblasti (silou, nebo dohodou), vrátí část Charkovské oblasti a ponechá si Luhaňskou,
    Chersonskou a Záporožskou oblast v současném rozsahu — výměnou za americkou žádost o pomoc s ekonomickým
    tlakem na Írán (přes Rusko a Čínu). Zmiňuje také, že se na Ukrajině denně konají masové protivládní
    protesty kvůli korupční aféře „Forrest Gump" (zasáhla i šéfa prezidentské kanceláře Kirila Budanova,
    zachyceného na nahrávce s výrokem, že korupci nechce potírat, ale „řídit a usměrňovat") — dohoda by
    tak podle něj mohla znamenat i konec Zelenského u moci. Opakuje svou dřívější tezi, že mnohem lepší
    dohoda (zachování autonomie Doněcka/Luhaňska v rámci Ukrajiny, plná kontrola Záporoží/Chersonu) byla
    na stole už v Istanbulu na jaře 2022, než ji odmítl Boris Johnson, a viní z prodloužení války (a padlých
    „zhruba dva miliony lidí") politiky typu Martina Dvořáka, kteří mluvili o vítězství místo jednání.'
  osoby:
  - osoba: john-ratcliffe
    vztah: neutralni
    kontext: Ředitel CIA — jeho návštěva Moskvy interpretována jako vyjednávání mírových podmínek pro
      Ukrajinu
  podtema: Zahraniční aktéři a precedenty
