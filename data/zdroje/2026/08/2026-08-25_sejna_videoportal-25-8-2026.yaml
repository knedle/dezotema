  nadpis: ÚS rozhodl o Pavlovi rychleji než v případech násilných trestných činů — Šejna (29. 7. 2026)
  text: '**25. 8.** — Šejna shrnuje v krátkém klipu (recitace prezidentského slibu) seznam údajných porušení
    slibu: nejmenování Turka, „zneužití" Ústavního soudu k účasti na summitu NATO (viz výše), podpora
    „Spojených států evropských" (viz [Kritika Pavlova výroku o „Spojených státech evropských"](#petr-pavel-a-spojené-státy-evropské-útok-na-českou-suverenitu-26-4-2026))
    a zavedení eura/digitálního eura jako ztráty svobody. Nově dodává tvrzení, že Pavel podporuje zavedení
    konstituční monarchie v ČR.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
