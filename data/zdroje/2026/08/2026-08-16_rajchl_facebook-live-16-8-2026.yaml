  nadpis: 'Debata s moderátorkou Čermákovou (Prima, K věci): očkování v lékárnách a nedůvěra po covidu
    (Rajchl, 16. 8. 2026)'
  text: 'Rajchl komentuje debatu s moderátorkou Čermákovou na Primě (pořad K věci) o Národní očkovací
    strategii a plánu umožnit očkování v lékárnách. Vytýká jí vnitřní rozpor: když tvrdil, že díky ukrajinské
    migraci roste výskyt nakažlivých chorob (žloutenka, záškrt, HIV), odmítla to jako tvrzení bez datové
    opory — ale zároveň sama argumentovala, že neočkovaní lidé (včetně Ukrajinců, kteří mají výrazně nižší
    proočkovanost než ČR) zvyšují náklady systému kvůli vyšší nemocnosti; obojí prý nemůže platit zároveň.
    Očkování v lékárnách odmítá jako nebezpečnou banalizaci lékařského zákroku — lékárník nezná zdravotní
    kartu, alergie ani aktuální stav pacienta (např. probíhající nachlazení), a mělo by mu vždy předcházet
    vyšetření protilátek, jejichž nezohlednění bylo podle něj jedním z „největších průšvihů" covidové
    doby. Iniciativu čte jako další ústupek farmaceutické lobby. Na otázku, proč by lidé měli věřit jemu
    více než odborníkům ministerstva zdravotnictví, odpovídá analogií se špatným právníkem nebo lékařem,
    který jednou zklame důvěru — tvrdí, že odborníci opakovaně lhali (nutnost roušek, tvrzení že dvě dávky
    vakcíny „udělají tečku za covidem", že očkování brání přenosu viru na rodiče/prarodiče), částečně
    kvůli mediální pozornosti, částečně kvůli platbám od farmaceutických firem.'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: rajchl-2026-08-16-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Rajchl: dobrovolné koncesionářské poplatky jako jediné spravedlivé řešení'
  text: '**16. 8.** — Rajchl doplňuje argument konkrétními příklady bývalých moderátorů ČT, kteří po odchodu
    z veřejnoprávní stanice ztratili sledovanost: Nora Fridrichová vysílá podcasty na Hero Hero pro „pár
    stovek" diváků, Marek Volner píše pro Forum24 a „vymýšlí si jeden nesmysl za druhým", Zuzana Černá
    „zkrachovala". Václav Moravec podle něj sám selhal jako moderátor (neuvěřitelně ukončil debatu s Rajchlem
    kvůli vlastní neschopnosti ji zvládnout, ne kvůli Rajchlovým „výstřelkům") a jeho kanál dosahuje nižší
    sledovanosti než konkurenční alternativní kanály (XTV, Petr Bureš, Vox TV, KTV) — na rozdíl od ČT
    musí tyto kanály bojovat o každého diváka. Moravcovi navíc vydělává i angažmá v „nezávislé" fact-checkingové
    neziskovce placené rovněž z veřejných peněz. Závěr: kdyby ČT musela soutěžit o diváky jako komerční
    kanály, dostali by prostor tvůrci jako Petr Holec, Xaver, Radim Panenka, Markéta Dobijášová nebo Tomáš
    Paukner.'
  podtema: Česká televize a mainstreamová média
- id: rajchl-2026-08-16-03
  typ: tvrzeni
  temata:
