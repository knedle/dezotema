  nadpis: 'Dvojí metr v kauzách: byty vs. Pauknerovy korupce; demaskování pseudonymu — Rajchl (21. 6.
    2026)'
  text: '**16. 8.** — Rajchl se vrací ke kauze předraženého vrtulníku (přezdívaného „Čestmír") — Seznam
    Zprávy podle něj měsíce ignorovaly zjištění Tomáše Pauknera, jako by neexistoval, a teprve poté, co
    přišla „protivlna" (patrně vlna kritiky vůči Seznamu), věnovaly kauze najednou několik dní intenzivní
    pozornosti. Za obzvlášť podezřelé považuje odůvodnění novináře Martina Ondráčka, proč v rozhovorech
    nesdělil SPZ vrtulníku — údajně utajovaná informace, která by Rusku pomohla vrtulník identifikovat
    a zacílit. Rajchl namítá, že to je nevěrohodná výmluva zakrývající skutečný důvod mlčení, protože
    Ondráček dříve ve stejném médiu bez obav zveřejnil polohu české drone-výrobní firmy i tvář její šéfky.'
  podtema: Dvojí metr v médiích
- id: rajchl-2026-08-16-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Dvojí metr v kauzách: byty vs. Pauknerovy korupce; demaskování pseudonymu — Rajchl (21. 6.
    2026)'
  text: '**16. 8.** — Rajchl reaguje na rozhovor Martina Ondráčka (zakladatel sbírky Dárek pro Putina)
    s Radkem Bartoníčkem, kde Ondráček na otázku, zda je lepší být novinářem nebo organizovat sbírku,
    odpověděl, že sbírka je lepší, „protože za mou prací zůstává spousta mrtvejch rusáků" — a z toho se
    radoval. Rajchl to označuje za projev psychopatie bez ohledu na vlastní postoj k válce na Ukrajině:
    sám by nikomu nepřál smrt, byť se mu nelíbí chování ukrajinských ani afrických migrantů. Dokládá dvojí
    metr justice srovnáním s vlastní obhajobou klienta v Chebu, trestně stíhaného za jedinou větu „Sláva
    Rusku, popel Ukrajině" (protest proti Zelenského režimu, ne přání smrti Ukrajincům) — zatímco Ondráčkův
    výrok o radosti z mrtvých Rusů zůstává bez postihu. Zvažuje na něj podat trestní oznámení, ale očekává,
    že se „nestane vůbec nic", protože justice v rusko-ukrajinském konfliktu jednostranně straní jen jedné
    straně.'
  podtema: Dvojí metr v médiích
- id: rajchl-2026-08-16-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Ukrajinská migrace: rozsah, kriminalita a plán revize pobytu (Rajchl, 16. 8. 2026)'
  text: |-
    Rajchl věnuje hlavní část vysílání shrnutí a rozšíření svého postoje k ukrajinské migraci v reakci na velký ohlas dříve zveřejněného dopisu zdravotní sestry. Aktualizovaná čísla: podle oficiálních statistik je v ČR 1,1 milionu cizinců, podle odhadů organizací až 1,5 milionu — rozdíl (300–400 tisíc lidí) tvoří podle něj ti, kdo tu žijí a pracují „na černo" bez jakékoli evidence. To dává do souvislosti s nezaměstnaností, která po 9 letech poprvé přesáhla 5 % (viz [Zetor a nezaměstnanost, 11. 8.](suverenita-eu.md#zetor-přesouvá-výrobu-z-čr-kvůli-green-dealu--rajchl-slibuje-tvrdý-boj-proti-eu-rajchl-14-7-2026)) — zaměstnavatelé podle něj tlačí mzdy dolů hrozbou nahrazení Ukrajinci ochotnými pracovat za méně. K nákladům opakuje a navyšuje dřívější odhad (viz [MPSV: tabulka je „absolutně lživá", 5. 5.](#mpsv-tabulka-ekonomického-přínosu-migrace-je-absolutně-lživá--rajchl-5-5-2026)) na „dávno přes čtvrt bilionu Kč" ročně kvůli nezapočítaným nákladům na infrastrukturu a veřejné služby. Ke kriminalitě znovu cituje studii Institutu pro kriminologii (61 expertů NCOZ a Národní protidrogové centrály, viz [NCOZ studie, 5. 5.](#ncoz-studie-organizovaný-zločin-v-čr-ovládli-ukrajinci--rajchl-5-5-2026)) — organizovaný zločin, obchod s drogami a podvody po telefonu v ČR podle ní ovládli Ukrajinci. Popisuje také zhoršující se stav zdravotnictví (čekací doby na operace kloubů rok až rok a půl) a nevděk části migrantů vůči lidem, kteří jim poskytli bydlení či zaměstnání (dopisy diváků o poškozených bytech, šikaně a vydírání).

    Navrhované řešení, které dosud nejpodrobněji shrnuje: (1) okamžitá remigrace/deportace ukrajinských mužů v odvodovém věku bez zaměstnání, dle vzoru polské strany PiS — s důrazem na to, aby ČR tento krok provedla dřív než Polsko (jinak přijme jejich přesun) — viz [Návrh na deportaci, 9. 8.](#návrh-na-deportaci-nezaměstnaných-ukrajinských-mužů-v-odvodovém-věku-rajchl-9-8-2026); (2) úplné zrušení institutu dočasné ochrany, včetně pravidla, že odjezd na Ukrajinu „na dovolenou" znamená ztrátu nároku na návrat v tomto režimu (kdo skutečně před válkou prchá, na dovolenou tam nejezdí); (3) plošná revize povolení k pobytu pro všechny, kdo přišli po 24. 2. 2022 na základě dočasné ochrany — návrat na Ukrajinu jako výchozí pravidlo, výjimka jen při prokázání dlouhodobé práce a placení daní, uzavření manželství s českým občanem nebo založení rodiny; (4) bezvýjimečné vyhoštění za spáchaný trestný čin nebo přestupek.
- id: rajchl-2026-08-16-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Martin Dvořák o Ceutě: „lidé mají právo hledat lepší život" — Rajchl odmítá jako nebezpečný
    relativismus (16. 8. 2026)'
  text: 'Rajchl reaguje na rozhovor Martina Dvořáka (STAN) k invazi marockých migrantů do Ceuty. Dvořák
    podle něj uznal, že vlna je „problematická", ale zároveň ji obhajoval jako výkon základního práva
    migrantů „hledat lepší život" a jako vítaný přínos pro vylidňující se Evropu. Rajchl to odmítá jako
    fatální popření reality — migraci z Afriky považuje za „totální zkázu" evropské bezpečnosti, ekonomiky
    i sociálního systému, s odkazem na útoky bodnou/sečnou zbraní v Německu (prý každých 18 minut); místo
    integrace a asimilace mají podle něj migranti cíl „plundrovat", čerpat dávky a měnit Evropu v „islámský
    chalifát", který nikdy nebude respektovat křesťanství. Označuje Dvořáka za „sociálního inženýra horšího
    než bolševici" a opakuje starší nálepku „pidiministr" (za dřívější označení koruny za „pidiměnu").
    K euru dokládá na příkladu Itálie: Giorgia Meloniová by prý chtěla vůči Bruselu vystupovat razantněji,
    ale nemůže, protože bez vlastní měny je Itálie na Bruselu/Frankfurtu existenčně závislá — euro tak
    podle Rajchla brání členským zemím prosazovat vlastní zájmy.'
