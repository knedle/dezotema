  nadpis: Dvojí metr policie u Prague Pride — tolerance nahoty na veřejnosti (Šejna, 10. 8. 2026)
  text: Šejna tvrdí, že se na Prague Pride pohybovali lidé oblečení jen ve spodním prádle, a osobně se
    na to ptal přítomných policistů — pouze dva mu z „velkého množství" oslovených přiznali, že jde o
    přestupek, ale že dostali pokyny nezasahovat a nechat to na Pride „v pořádku"; ostatní odmítli komunikovat
    a odkázali ho na tiskovou mluvčí. Doplňuje pozorování muže tančícího na Václavském náměstí „prakticky
    striptýz" v průvodu. Slibuje zveřejnit záznam s policisty následující den (s utajenou identitou).
  podtema: Eutanazie
