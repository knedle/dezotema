  nadpis: 'Bitcoinová kauza: detaily obžaloby a rozšířený okruh podezřelých (Zítko, 4. 8. 2026)'
  text: |-
    K podané obžalobě v bitcoinové kauze (viz [Obžalování v bitcoinové kauze jako „vrtěti psem"](/temata/kauzy/2026.md#vrabel-2026-08-03-05)) Zítko rozebírá konkrétní navržené tresty — Jiříkovský 20 let (jen za Nucleus Market, tržiště SHIB Marketplace s odhadovanou hodnotou 90 mld. Kč není v obžalobě vůbec zmíněno), Karim Tyc 8 let, Blažek a Daňhel po 6,5 roku. Obžaloba obsahuje jen dva trestné činy (praní špinavých peněz, zneužití pravomoci úřední osoby) — Zítko vyjmenovává devět, které podle něj měly být zahrnuty (mj. legalizace výnosů z prodeje drog/zbraní/dětské pornografie, porušení povinnosti při správě cizího majetku, podvod, možná korupce, nepřekažení trestné činnosti, nadržování). Jmenuje další osoby, které podle něj dosud unikly vyšetřování: Anna Bednářová (ředitelka právního odboru ministerstva spravedlnosti, která ověřila převod bitcoinů jen na základě zaslaného screenshotu), náměstek ministra spravedlnosti Karel Dvořák (STAN), ředitel kabinetu ministra financí Filip Benda, a jmenovitě neurčení soudci Nejvyššího a Krajského soudu v Brně i policisté Krajského ředitelství, kteří zvrátili původní rozhodnutí o zničení zabavené výpočetní techniky a v prosinci 2024 ji (aniž zjistili obsah) vrátili Jiříkovskému. Zpochybňuje darovanou částku 468,5 BTC (méně než 1 % z celkového odhadovaného objemu) jako podvodně sníženou — Jiříkovský měl den před oficiálním předáním rozeslat bitcoiny z peněženek na jiné adresy a poté musel na výzvu vrátit část zpět, aby smluvená částka „seděla", což proběhlo bez přítomnosti zástupce státu. Zmiňuje také, že kárný senát zprostil viny jak olomouckého žalobce Radima Dragouna (obviňovaného z prozrazení informací médiím), tak předtím odvolanou žalobkyni Petru Lastoveckou, která chtěla obvinit Blažka už začátkem roku — což čte jako důkaz vnitřního konfliktu ve státním zastupitelství. Upozorňuje na loňský poslanecký návrh ODS (autor Havránek) osvobodit od daně zisky z dlouhodobě držených kryptoměn nad 40 mil. Kč jako podezřele načasovaný.

    V navazujícím krátkém videu téhož dne (pozvánka na živý speciál) srovnává rozsah kauzy s kauzou Tomáše Paucnera (miliardové kšefty se stanem a helikoptérami) — ty označuje za „čučkaření pro malé děti" ve srovnání s víc než 100 miliardami v bitcoinové kauze; zmiňuje i tlak, který podle něj na Paucnera vyvíjeli (ztráta řidičáku, vazba), jako paralelu k vlastní situaci.
