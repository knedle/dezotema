  text: '**1. 8.** — Zítko doplňuje konkrétní detaily téhož slyšení (29. 7.): Fauci se na dotazy Randa
    Paula (předsedy výboru) odvolal na pátý dodatek celkem 111×, včetně banálních otázek (jaký je den,
    jaká barva kravaty/koberce) — Paul mu k tomu řekl, že opakované odvolávání se na výsadu mlčení je
    „nezákonné" a že jeho odmítnutí vypovídat bude mít „následky a důsledky", s odkazem na §192 hlavy
    2 amerického zákoníku (trestní odpovědnost svědka za odepření odpovědi). Přenos byl podle Zítka tak
    nepříjemný pro Facebook, že platformu ke konci vysílání zcela vypnula. Zítko rámuje celé slyšení jako
    „trapas" a součást „velkého probuzení" (viz [Klony, herci a Guantanamo](konspirace-deep-state-qanon.md#klony-herci-a-guantanamo--ebs-narativ))
    — tuto QAnon interpretaci ale nelze ověřit a je oddělená od výše popsaných reálně doložených procesních
    detailů slyšení.'
