  nadpis: Únik sítě „Dialog" Petera Thiela — 200 vlivných lidí rozhoduje bez demokratické kontroly (Vrabel,
    29. 6. 2026)
  text: '**21. 8. (Boldy)** — Boldy rozšiřuje téma o další detaily: klub existuje už 20 let, založil ho
    Peter Thiel (zakladatel Palantiru, firmy sledující obyvatelstvo pro americký vojenský průmysl), vstupní
    poplatek činí zhruba 16 000 USD a za dvě dekády klubem prošlo přes 2 500 nejvlivnějších lidí světa.
    Ke jménům účastníků přidává Elona Muska, generála Alexuse Grynkewiche (velitele US European Command),
    Jareda Kushnera (označen za sionistu), šachového velmistra Garriho Kasparova, estonskou eurokomisařku
    Kaju Kallasovou, senátora Teda Cruze i zástupce mediálních a technologických firem (šéfka Xboxu/Microsoftu,
    zakladatel Groku/OpenAI). Tvrdí, že klub se už 20 let snaží řídit „třetí světovou válku" a plánuje
    založit novou politickou stranu s názvem „Kult", jejímž cílem má být zotročení celé planety. Dodává,
    že plánované srpnové setkání v Dublinu bylo po úniku informací zrušeno hotelem a nové místo/datum
    zatím není známo.'
