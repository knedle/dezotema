  nadpis: Petr Pavel a „Spojené státy evropské" — útok na českou suverenitu (26. 4. 2026)
  text: '**22. 8.** — Šejna reaguje na totéž Pavlovo tvrzení (nazývá ho ironicky „agent Pávek") a odmítá,
    že by „Spojené státy evropské" byly jediným východiskem pro ČR — podle něj existuje spousta alternativ,
    které nikdo z kritiků nevylučuje spolupráci v EU jako takovou, jen chce zachovat suverenitu, soukromí
    a vlastní kulturu při zachování společných hranic. Rozvíjí to do civilizační chvály Evropy: „99 %"
    světových vynálezů pochází z Evropy a i americká kultura je podle něj v jádru evropská (Američané
    jsou „Evropané, kteří se přestěhovali na jiný kontinent"), přičemž evropskou kulturu dnes „ctí líp"
    než sama Evropa.'
