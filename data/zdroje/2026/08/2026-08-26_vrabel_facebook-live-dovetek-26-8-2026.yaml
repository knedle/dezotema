  nadpis: 'Šéf CIA Ratcliffe v Moskvě — spekulace: Rusko předem varuje USA před akcí proti „koalici ochotných"
    (Vrabel, dovětek, 26. 8. 2026)'
  text: 'V krátkém dovětku k hlavnímu vysílání Vrabel rozvádí vlastní spekulaci k tajné návštěvě šéfa
    CIA Johna Ratcliffa v Moskvě (oficiální verze Trumpa i Peskova: „rutinní jednání tajných služeb").
    Argumentuje, že o Ukrajině dlouhodobě jednají Witkoff s Kushnerem, takže cesta šéfa CIA musí souviset
    s něčím větším — buď s Íránem, nebo s novým ruským krokem vůči Evropě. Nabízí scénář: rusko-americká
    diplomacie posledních měsíců naznačuje snahu vyhnout se vzájemnému konfliktu, takže pokud by Rusko
    plánovalo vojenskou akci nejen proti Ukrajině, ale i proti některé zemi z „koalice ochotných", dávalo
    by smysl, že by o tom předem informovalo Washington — aby se USA do případného konfliktu nezapojily.
    Podle Vrabela je Rusko připraveno na konflikt s Evropou, ale rozhodně nechce válku se Spojenými státy.
    Zdůrazňuje, že jde o čistou spekulaci bez potvrzení, kterou zapomněl zmínit v hlavním vysílání.'
  podtema: Zahraniční aktéři a precedenty
