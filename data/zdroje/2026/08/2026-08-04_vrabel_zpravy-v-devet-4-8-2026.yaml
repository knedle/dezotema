  poznamka: 'Zpracováno 4 témata: (2) Nová pravidla EU pro dočasnou ochranu Ukrajinců (jen se splněnou
    vojenskou povinností) — [migrace.md](migrace.md). (3) Host Michala Gánovská — organizované svážení
    migrantů do Ceuty, geopolitický tlak USA/Izraele na Španělsko — [migrace.md](migrace.md). (5) Nedostatek
    léku Tamoxifen — „léková soběstačnost" — [kauzy.md](kauzy.md). (6) Rainer Füllmich — mučení ve vazbě,
    nemohl se rozloučit s umírající matkou — [kauzy.md](kauzy.md). Nezpracováno (jen zpravodajský deník):
    rekordní vojenský výcvik studentů, Dánsko losuje branky, Írán chystá odvetu na Ukrajinu, 6G síť (opakování),
    Karpatská iniciativa, výročí Oluji (opakování), jezídská genocida, polský dálkový plavec. Bez predikcí
    a stoch. teroru.'
