vyroky:
- id: vrabel-2026-08-04-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Nedostatek léku Tamoxifen na rakovinu prsu — Vrabel propaguje „lékovou soběstačnost" (4. 8.
    2026)
  text: Lék Tamoxifen EBV používaný při léčbě rakoviny prsu v ČR chybí už více než rok, od června chybí
    i jeho náhrada — ministerstvo zdravotnictví minulý týden rozeslalo do lékáren jen asi tisíc balení,
    které rychle došly (např. ve fakultních nemocnicích Homolka a Motol). Vrabel to dává do souvislosti
    se svým vlastním politickým plánem „Česká republika na prvním místě" (prosazovaným od demonstrací
    v roce 2022), jehož součástí byl požadavek na lékovou soběstačnost ČR (vlastní výroba/nákup licencí)
    — tvrdí, že kdyby vláda tento požadavek naplnila, nedostatek základních léků (dříve penicilin, nyní
    lék na rakovinu prsu) by nenastal. Označuje současný stav za „absolutní selhání" jak předchozí, tak
    současné vlády, obzvlášť v kontrastu s tím, že na zbraně a peníze pro Ukrajinu prostředky vždy najdou.
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: vrabel-2026-08-04-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Rainer Füllmich — mučení ve vazbě, nemohl se rozloučit s umírající matkou (Vrabel, 4. 8. 2026)
  text: 'Podle obhájců byl německý právník Rainer Füllmich (bývalý host Vrabelových demonstrací v roce
    2022) během vazby držen v izolaci s omezeným přístupem k ostatním vězňům, telefonování i k podkladům
    pro obhajobu, a k soudu byl převážen v poutech jako vysoce rizikový vězeň — ačkoli je obviněn „jen"
    z majetkové trestné činnosti (nákup domu z peněz od podporovatelů jeho organizace, kterou označuje
    za vykonstruovanou kauzu vzniklou na základě obvinění ženy, kterou sám dosadil do vedení). Nejtvrdší
    detail: když mu umírala matka, německé úřady mu umožnily návštěvu jen pod podmínkou, že bude opět
    spoutaný jako těžký kriminálník — Füllmich nakonec návštěvu odmítl, aby matce nezpůsobil takové trauma
    před smrtí, a nezúčastnil se ani jejího pohřbu. Vrabel jeho případ srovnává s vlastním stíháním (v
    obou případech měly být zapojeny bezpečnostní/zpravodajské složky) a s Julianem Assangem jako dalším
    „zničeným" kritikem systému.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: vrabel-2026-08-04-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Členské státy EU zruší ochranu ukrajinským mužům v bojeschopném věku — Vrabel: nehumánní dvojí
    metr (24. 7. 2026)'
  text: '**4. 8.** — Nová konkretizace pravidla EU platná od 1. 8. 2026: dočasnou ochranu nově získají
    jen ti žadatelé o ukrajinskou dočasnou ochranu, kteří doloží splnění vojenské povinnosti vůči Ukrajině
    (na starší žádosti se nevztahuje; institut jako celek je prodloužen do 4. 3. 2028). Vrabel opakuje
    svůj závěr, že jde o vracení válečných uprchlíků přímo na frontu — a doplňuje konkrétní statistiku:
    dle jeho odhadu byl loni podíl vojáků zemřelých/těžce zraněných do 48 hodin od nasazení na frontu
    kolem 75 %.'
- id: vrabel-2026-08-04-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Host Michala Gánovská: organizované svážení migrantů do Ceuty, geopolitický tlak USA/Izraele
    na Španělsko (Vrabel, 4. 8. 2026)'
  text: 'Vrabelovým hostem byla slovenská mezinárodní komentátorka Michala Gánovská, spolupracující i
    s marockými a španělskými médii. Podle jejích informací nešlo o klasickou migrační vlnu, ale o mladé
    muže z celého Maroka organizovaně svážené autobusy se souhlasem marocké vlády — přislíbeno jim bylo
    razítko umožňující pohyb po celém Schengenu. Zpochybňuje slovenská/česká médiální čísla (80 000 příchozích,
    jen 2 000 zbylo) jako nepodložená — ani španělská média takové počty neuvádí. Spouštěčem byl podle
    ní rozsudek nejvyššího španělského soudu (rozdílné zacházení s migranty přes plot vs. přes moře) v
    kombinaci s dlouhodobým geopolitickým tlakem: od března 2026 americké osobnosti a instituce (analytik
    Michael Rubin, kongresman Mario Díaz-Balart, výbor Sněmovny reprezentantů, izraelský velvyslanec při
    OSN) postupně zpochybňovaly španělskou suverenitu nad Ceutou a Melillou — poté, co Španělsko odmítlo
    poskytnout USA vojenské základny pro operace v regionu (mj. proti Íránu). Krizi interpretuje jako
    „varovný prst" pro Španělsko, koordinovaný USA, Izraelem a Marokem, nikoli živelnou událost — přičemž
    oficiální (EU) média o tomto geopolitickém pozadí nepíšou, zatímco mimoevropská a marocká média o
    roli Trumpovy administrativy mluví otevřeně. Předpokládá, že požadavek na vyloučení Španělska ze Schengenu
    (22 zemí EU vedených Meloniovou) reálně nepovede k žádné legislativní změně, jen k symbolickým prohlášením
    a případně zesíleným hraničním kontrolám.'
