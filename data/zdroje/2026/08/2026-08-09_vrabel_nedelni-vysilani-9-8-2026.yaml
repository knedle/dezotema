  nadpis: Elektřina v ČR jako „1000% marže" — Tykač a Křetínský profitují ze státního cenového stropu
    (Vrabel, 9. 8. 2026)
  text: Vrabel tvrdí, že výroba elektřiny v ČR stojí přibližně 40–50 haléřů za kWh, zatímco domácnosti
    v maloobchodní ceně platí až 10 Kč/kWh — což vyčísluje jako zhruba „1000% marži". Srovnává to se Srbskem,
    kde je elektřina podle jeho dřívějších tvrzení výrazně levnější při srovnatelných výrobních náladech
    (viz [Sucho odstavuje jaderné elektrárny — kontrast se 4× levnější energií v Srbsku](/temata/ceny-energie.md#vrabel-2026-07-30-01)).
    Za viníky označuje energetické magnáty Pavla Tykače a Daniela Křetínského a státní politiku cenových
    stropů, kterou popisuje jako nástroj, který chrání zisky „energetických baronů" na úkor domácností,
    místo aby snížil ceny přímo u zdroje.
