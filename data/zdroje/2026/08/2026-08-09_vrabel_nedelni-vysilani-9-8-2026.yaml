  nadpis: Sociální sítě jako navrhovaná závislost a nástroj politické manipulace — volání po zákonné regulaci
    (Vrabel, 9. 8. 2026)
  text: 'Vrabel tvrdí, že sociální sítě jsou cíleně navrženy jako závislost srovnatelná s drogou — odkazuje
    na výpovědi bývalých zaměstnanců Facebooku, podle nichž firmy záměrně využívají psychologické poznatky
    (dopaminová odezva z „feedu", scrollování) k prohlubování návykovosti, aby uživatelé strávili na platformě
    víc času, viděli víc reklam a poskytli víc dat k trénování AI a cílení reklamy. Popisuje sociální
    sítě jako silnější politický nástroj než klasická média: algoritmus podle něj může jednoho kandidáta
    zobrazit tisíckrát častěji než druhého a fakticky tak rozhodovat výsledek voleb. Kritizuje, že stát
    nijak nereguluje, aby platformy fungovaly podle českého práva a ústavní svobody informací, a nechává
    „globalisty" prosazovat přes algoritmy vlastní agendu (LGBT, protiruskou) na úkor opačných názorů
    — včetně programování dětí, kterým je ve školách sdělováno, že důvěryhodná jsou jen „prověřená" média.'
- id: vrabel-2026-08-09-03
