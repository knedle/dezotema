  nadpis: „Hadička" — systematické odčerpávání národního bohatství od roku 1989 (Vrabel, 9. 8. 2026)
  text: Vrabel používá metaforu „hadičky" pro popis mechanismu, kterým je od roku 1989 systematicky odčerpáváno
    národní bohatství ČR ve prospěch zahraničního/globalistického kapitálu. Na podporu tvrzení promítá
    archivní záznam z roku 1997 o korupci při privatizaci — konkrétně privatizaci pražských vodáren —
    s odkazem na schéma úplatků („sedm milionů/milion") a na moderátora Františka Ringo Čecha, který o
    kauze tehdy informoval. Řadí to k [tezi o rostoucí nerovnosti v ČR a centralizaci moci „shora"](/temata/konspirace/2026.md#vrabel-2026-07-02-03)
    jako historický precedens téhož procesu.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-08-09-04
  typ: tvrzeni
  temata:
