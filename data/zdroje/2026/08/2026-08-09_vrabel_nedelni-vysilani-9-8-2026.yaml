  nadpis: Rekonstrukce Václavského náměstí jako záměrné znemožnění demonstrací — vlastní perzekuce po
    roce 2022 (Vrabel, 2. 8. 2026)
  text: '**9. 8.** — Vrabel k tématu dodává, že byl následně i trestně stíhán, ale Ústavní soud ho na
    základě práva na svobodu slova zprostil. Popisuje také, jak byly podle něj infiltrovány a rozloženy
    navazující demonstrace na Václavském náměstí, aby se rozšířil narativ, že „demonstrace nemají smysl"
    — jde o stejný program „Kryt", který podle něj koordinovalo Ministerstvo vnitra cíleně proti němu.'
  podtema: USA — volební systém
- id: vrabel-2026-08-09-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Ohlášení veřejného shromáždění „Člověk na prvním místě" (3. 10. 2026) — bez politiků s placenou
    funkcí (Vrabel, 9. 8. 2026)
  text: 'Vrabel ohlašuje nástupnickou akci svého hnutí „Česká republika na prvním místě" z roku 2022 pod
    názvem „Člověk na prvním místě" — veřejné shromáždění (výslovně odmítá termín „demonstrace") na Malostranském
    náměstí 3. 10. 2026, s možností přesunu na Letnou při vysoké účasti. Termín zdůvodňuje potřebou dvou
    měsíců na přípravu a propagaci, aby akce „měla hlavu a patu" a nebyla jen další z řady nekoncepčních
    demonstrací. Na rozdíl od roku 2022, kdy pódiu se 100 000 lidmi podle něj „vytěžili" politici, kteří
    dnes sedí v Parlamentu a Senátu, na pódiu nebude nikdo, kdo kdy měl jakoukoli placenou politickou
    funkci, ani současní kandidáti do Senátu — místo politiků slibuje intelektuály a odborníky z relevantních
    oborů. Celou výzvu rámuje historickou paralelou: připomíná husitské války (spouštěné dle něj korupcí
    katolické církve, ne komunismem, jak si podle něj mylně vykládá český ateismus) a národní obrození
    jako doklad schopnosti českého národa „udělat revoluci" — plán „Česká republika na prvním místě" popisuje
    jako běh na 5 až 10 let, který může zahrnovat i „dva, tři roky války", s cílem, aby na konci byl národ
    „plný sebevědomých lidí" a EU i nadnárodní korporace se z ČR začaly rozpadat.'
  podtema: USA — volební systém
- id: vrabel-2026-08-09-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Národ má právo takovou vládu svrhnout" — výzva podle srbského modelu za nedodržení volebních
    slibů (Vrabel, 9. 8. 2026)
  text: 'Vrabel tvrdí, že národ má právo svrhnout vládu, pokud politici po zvolení nedodrží klíčové sliby
    (referendum o vystoupení z EU/NATO, zrušení muniční iniciativy apod.) — jako vzor uvádí Srbsko, kde
    opakované masové demonstrace vynutily nové volby. Vyčítá porušení volebních slibů napříč celou tzv.
    vlastenecko-suverenistickou scénou: Babišovi, Okamurovi a SPD, Motoristům, Trikolóře, straně PRO i
    Svobodným. Zdůrazňuje, že změnu nesmí čekat od žádné „hvězdy" nebo politika („ani Babiš to neudělá,
    nikdo to neudělá") — musí ji podle něj vybojovat samotný národ, sjednocený a bez očekávání, že to
    za něj vyřeší někdo jiný.'
  citace:
  - text: Nečekejte na nikoho. Nikdo to neudělá. [...] To musí udělat ten národ. To musí udělat každej
      z nás.
  podtema: USA — volební systém
- id: vrabel-2026-08-09-07
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: EU propojuje podporu LGBT agendy s potřebou financovat Rearm Europe (Vrabel, 9. 8. 2026)
  text: Vrabel spojuje podporu rozpadu tradiční rodiny a LGBT+ agendy (mj. Prague Pride) s výroky Ursuly
    von der Leyen o potřebě „uvolnit" úspory evropských domácností a přeměnit je na investice do zbrojního
    programu Rearm Europe (800 mld. eur). Argumentuje, že rozpad rodinných a mezigeneračních vazeb brání
    dlouhodobému hromadění majetku v rodinách, které by jinak mohlo ohrožovat zájmy globalistického kapitálu
    — LGBT agendu tak čte jako jeden z nástrojů, jak zabránit vzniku silných, majetkově nezávislých rodinných
    struktur.
  podtema: Eutanazie
- id: vrabel-2026-08-09-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: „Ukrajina má být zrušena" — teorie o neplatnosti její územní celistvosti; paralela s Kosovem
    (Vrabel, 9. 8. 2026)
  text: |-
    Vrabel rozvíjí právní argumentaci (navazuje na [vlastní tezi o poválečných hranicích SSSR](/temata/valka-nato-rusko/2026.md#vrabel-2026-08-07-02)): Ukrajina jako samostatný stát vznikla teprve v roce 1991 rozpadem SSSR — předtím podle něj „neexistovala", šlo jen o součást sovětského území („okrajina", přirovnává k českému Pošumaví). Záruky územní celistvosti udělené po druhé světové válce (od 1946–48) proto podle Vrabela náležely Sovětskému svazu, ne nově vzniklé Ukrajině — tudíž se dnešní Ukrajina nemůže odvolávat na právo na územní celistvost, které „nikdy nezískala". Zároveň tvrdí, že Ukrajina „se neosvědčila jako stát" (analogie se zkušební dobou v zaměstnání), protože nezajistila svým obyvatelům život v souladu s mezinárodním právem — a proto by měla být coby stát „zrušena". Rozlišuje to od práva na sebeurčení: obyvatelům západní Ukrajiny by dle něj sebeurčení náleželo, ale ne nárok mít ve „své" zemi Rusy na Donbasu a Krymu, kteří se hlásí k Rusku — tam by se sebeurčení i územní celistvost mělo uplatnit ve prospěch Ruska, protože jde o historicky ruské obyvatelstvo. Stejnou logiku obrací u Kosova: Kosovo je podle něj historické centrum Srbska (první pravoslavné kostely), kam se od 70. let stěhovali (albánští) migranti, kteří většinovou srbskou populaci postupně vytlačili s podporou USA (vyřazení UČK ze seznamu teroristických organizací, bombardování Jugoslávie 1999) — zde by tedy měla platit územní celistvost ve prospěch Srbska, ne právo na sebeurčení pro albánskou většinu, protože jinak by podle něj vznikl precedens pro jakoukoli migrantskou komunitu kdekoli v Evropě (zmiňuje hypotetické „Německo-Afrika", „Británie-Pákistán"). Uzavírá, že Česká republika je „už docela dost ukrajinizovaná", a vládní zákon Lex Ukrajina 7 (viz [Migrace](/temata/migrace.md)) označuje za „plánovanou ukrajinizaci České republiky".

    ⚡ **Poznámka:** Tvrzení, že by se poválečné garance územní celistvosti SSSR nevztahovaly na Ukrajinu jako jeho nástupnický stát, a že by mezinárodní právo umožňovalo „zrušení" existujícího uznaného státu, neodpovídá platnému mezinárodnímu právu — Ukrajina je od roku 1991 mezinárodně uznaným státem s vlastními, mezinárodně garantovanými hranicemi (viz i [poznámka u Vrabelovy dřívější verze téže teze](/temata/valka-nato-rusko/2026.md#vrabel-2026-08-07-02)).
  citace:
  - text: Ukrajina má být zrušena, protože se neosvědčila jako stát. [...] Tady by měla být uplatněná
      ta územní celistvost. Proč? No protože historicky tam ty lidi žijou. Srbové.
  podtema: Příčiny a odpovědnost za válku
- id: vrabel-2026-08-09-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Okamura by poslal mladíka na frontu za „vystrčení se z auta"; srovnání s Ivanem Davidem v Srbsku
    (Vrabel, 9. 8. 2026)
  text: 'Vrabel navazuje na dřívější kritiku Okamurovy nedůslednosti v otázce financování zbraní pro Ukrajinu
    ([Okamura kritizuje příspěvek do PURL, ač SPD řídí ministerstvo obrany](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-10-09))
    další epizodou údajného pokrytectví: připomíná, že Okamura dříve navrhoval poslat na frontu mladého
    muže jen za to, že se „vystrčil z okna auta" v koloně (podle Vrabela projev jiné mentality, ne provinění)
    — a odpovídá, že prvního na frontu by poslal samotného Okamuru. Dává do souvislosti Okamurovo vystupování
    v Srbsku, kde měl srbské politiky přemlouvat ke vstupu do EU, s postojem Ivana Davida, který podle
    Vrabela naopak srbským politikům řekl otevřeně, že jejich cílem v Evropském parlamentu je EU „rozbít"
    — z toho vyvozuje, že Okamura jen předstírá suverenistickou a vlastenskou pozici.'
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: Za dřívější výrok o poslání mladíka na frontu Vrabel odpovídá, že prvního na frontu by poslal
      jeho — v Srbsku měl místo Ivana Davida přemlouvat politiky ke vstupu do EU
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-09-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: „Posloupnost mobilizace" — Vrabelův scénář cesty k válce v ČR; kritika francouzského „jaderného
    deštníku" (Vrabel, 9. 8. 2026)
  text: 'Vrabel popisuje vlastní odhad, jak by podle něj vypadala cesta ČR k mobilizaci: současné každodenní
    zprávy o „ruských hybridních útocích" jsou dle něj přípravou narativu; v určitém okamžiku dojde k
    incidentu, po kterém se vyhlásí „stav ohrožení státu" nebo válečný stav, uzavřou hranice a začnou
    létat „rakety trošičku víc"; když se pak na frontě ukáže nedostatek vojáků, přijdou na řadu nejdřív
    aktivní zálohy a následně mobilizace podle vojenských ročníků (uniformy prý „se najdou nebo ušijou",
    odkazuje na nedostatečně vybavené ukrajinské odvedence). Za jedno z nejdůležitějších rizik, kterému
    má zabránit ohlašovaná demonstrace [„Člověk na prvním místě"](/temata/politicky-system/2026.md#vrabel-2026-08-09-05),
    označuje chystanou dohodu Andreje Babiše o „jaderném deštníku" s Francií: argumentuje, že jaderné
    zbraně jsou z podstaty útočné (nasazují se vždy daleko od vlastního území, ne „nad sebou"), takže
    umístění francouzských jaderných hlavic v ČR by z republiky učinilo prioritní cíl ruského preventivního
    úderu právě ve chvíli, kdy by byly nejvíc potřeba. Popisuje i vlastní osobní „posloupnost při mobilizaci"
    — dopředu sjednanou plnou moc pro blízkou osobu a připravený „čundrácký" batoh — s cílem být do dvou
    dnů v Srbsku, jediné vojensky neutrální zemi, která se do války nezapojí.'
  citace:
  - text: Za dva dny jsem v Srbsku. V jediné vojensky neutrální zemi, která do té války nepůjde.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-09-11
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: 'scénář cesty k mobilizaci v ČR: incident → uzavření hranic → odvody podle ročníků'
  text: 'Vrabel popisuje explicitní scénář, jak podle něj bude vypadat cesta ČR k mobilizaci: zesilující
    zprávy o „ruských útocích" jsou přípravou narativu; dojde k nespecifikovanému incidentu, po kterém
    se vyhlásí stav ohrožení státu nebo válečný stav a uzavřou hranice; na frontě začne chybět dostatek
