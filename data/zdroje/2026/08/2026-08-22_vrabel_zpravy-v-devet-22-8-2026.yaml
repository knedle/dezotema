  nadpis: Malé modulární reaktory naráží na nedostatek obohaceného uranu — sankce na Rusko (Vrabel, 29.
    7. 2026)
  text: '**22. 8.** — K analýze společnosti Sprott, podle níž evropské jaderné firmy navzdory sankcím
    dál nakupují ruský uran a související služby (dodávky uranu +7 %, konverze +9 %, obohacování +12 %
    meziročně; Rusko pokrývá ~16 % evropského trhu s uranem, 24 % konverzních a 23 % obohacovacích služeb),
    Vrabel rozšiřuje tezi o SMR: nejde jen o britský projekt Rolls-Royce, ale i o Temelín a Dukovany —
    reaktory jsou technicky konstruovány pro ruské palivo („trojhránky, kostičky, které do sebe zapadají")
    a přechod na americké palivo Westinghouse nefungoval. Uzavírá, že ČR má jen dvě možnosti: nechat ekonomiku
    zkolabovat, nebo nakupovat tam, kde palivo skutečně je — tedy z Ruska. Cituje i vlastní starší rozhovor
    s Ivanem Noveským o tom, že i západní Německo v době studené války stavělo svou ekonomiku na levném
    ruském plynu. Za viníka označuje především českou vládu, která podle něj měla po odklonu od Fialovy
    agendy prosadit energetickou suverenitu (vystoupení z EU) — namísto toho „naši politici" i nadále
    ideologicky odmítají ruské dodávky na úkor konkurenceschopnosti ČR.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-08-22-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Marocký nárok na Ceutu a Melillu — hranice jako „uměle vytvořené", srovnání s Donbasem, Krymem,
    Kosovem a Republikou srbskou (Vrabel, 22. 8. 2026)
  text: 'Marocký ministr spravedlnosti označil nárok Rabatu na španělské enklávy Ceuta a Melilla (uplatňovaný
    od marocké nezávislosti v roce 1956) za „historické a geografické právo" a navrhl společnou komisi
    k jednání o jejich budoucnosti — zpráva přišla v době hromadného pokusu migrantů proniknout do Ceuty
    a probíhajících jednání Madridu s Rabatem o migraci a ochraně hranic. Vrabel odhaduje, že Maroko enklávy
    díky přátelství s Trumpem nakonec získá, a sám s tím nemá problém — rozvádí obecnější tezi (v reakci
    na diskusi s kamarádem-filozofem o „uměle namalovaných hranicích"): národnostní a státní hranice jsou
    skutečně politický konstrukt, ale problém není samotné překreslení hranic, nýbrž rozdělení lidí, kteří
    spolu chtějí žít v jednom státě, a jejich následné potlačování. Jako příklady „správného" sjednocení
    uvádí sjednocení Ruskem ovládaných obyvatel Donbasu a Krymu (kterým „nacionalisté" po roce 2014 zakazovali
    ruský jazyk a církev) a jako paralelní křivdy zmiňuje Kosovo (etničtí Srbové utlačováni pod správou
    NATO/Albánců) a Republiku srbskou v Bosně (dle Daytonské dohody podřízena bosňácké většině). Uzavírá,
    že problém marocké migrace do Evropy nespočívá v marockém nároku na vlastní historické území, ale
    v „děravých hranicích" a politice evropských vlád, které migranty na evropském území zadržují a integrují
    místo návratu.'
- id: vrabel-2026-08-22-05
  typ: tvrzeni
