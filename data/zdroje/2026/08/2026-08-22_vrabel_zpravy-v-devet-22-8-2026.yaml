  nadpis: CHEPS a přenos elektřiny z Německa přes ČR — Ivan Noveský a likvidace české energetiky (Vrabel,
    22. 8. 2026)
  text: 'Bývalý zakladatel Energetického regulačního úřadu Ivan Noveský kritizuje plánované investice
    společnosti ČEPS (přenosová soustava) do sítě, které podle něj slouží především přenosu německé elektřiny
    přes české území — pokud je ERÚ uzná za „oprávněné náklady", promítnou se v řádu desítek miliard korun
    do regulovaných cen elektřiny pro české spotřebitele. Vrabel tvrdí, že o tomto mechanismu informuje
    už od podzimu 2025: ČEPS vybudovalo vedení z Německa přes jižní Čechy/Moravu dál do Rakouska a náklady
    na to už zaplatili čeští spotřebitelé v ceně drahé elektřiny. Doplňuje, že ČEPS zadává zakázky (nové
    řídicí systémy pro přenosovou soustavu) bez výběrového řízení firmám jako Bosch — na rozdíl od stíhání
    „malých lidí" tyto „obří krádeže" prý neřeší žádná policie ani státní zástupci. Skutečným cílem je
    podle Vrabela udělat z Německa "energetickou velmoc": Česko bylo dřív čistým vývozcem elektřiny, ale
    záměrnou likvidací vlastní energetické soustavy (viz i [„Bateriový zákon"](#bateriový-zákon-po-solárních-baronech-přicházejí-baterioví-baroni-vrabel-17-6-2026)
    výše) má být donuceno nakupovat přebytky z plánovaného německého 1000GW solárního programu. Vrabel
    oznamuje, že podpoří Noveského případnou kandidaturu do Senátu za SPD, přestože stranu jinak nemá
    rád.'
  podtema: Energetika a Rusko
- id: vrabel-2026-08-22-03
