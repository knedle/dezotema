  nadpis: 'Mélenchon: pokud vyhraje prezidentské volby 2027, Francie opustí NATO — Vrabel (9. 5. 2026)'
  text: '**22. 8.** — K průzkumu z jara 2026 (54 % Francouzů by hlasovalo pro setrvání v alianci) Vrabel
    upřesňuje pozice kandidátů před volbami 2027: Marine Le Pen prosazuje jen odchod z integrovaného vojenského
    velení NATO (ne z celé aliance), zatímco Mélenchon žádá úplné vystoupení a větší nezávislost evropské
    bezpečnostní politiky. Připomíná, že Francie je jedinou jadernou mocností v EU s jednou z nejsilnějších
    armád, takže by její odchod výrazně ovlivnil evropskou bezpečnost — sám to ale považuje za nepravděpodobné
    a nevěří, že by Le Pen volby vyhrála; odhaduje, že z NATO by naopak spíš mohly vystoupit malé země
    jako ČR nebo Slovensko po vzoru vojensky neutrálního Rakouska, Švýcarska či Srbska.'
  podtema: Zahraniční aktéři a precedenty
