  nadpis: 'Macinka v Berlíně: omluva Wageführovi, video s Rammstein — Vrabel (9. 5. 2026)'
  text: '**22. 8.** — Vrabel doplňuje jméno hostitele: pozvání do Berlína na 9. 5. Macinkovi vystavil
    německý ministr zahraničí Johann Wadephul, kterého Petr Pavel následně přijal na Hradě. K aktuální
    zprávě, že Wadephul navštívil Kyjev kvůli jednání o posílení ukrajinské protivzdušné obrany (bez konkrétního
    příslibu nových systémů), Vrabel řadí Pavla, Babiše i Macinku do „jedné sebranky" politiků, kteří
    dělají „úplně to samé" — podporují zbrojaře v USA, plní pokyny EU a „lezou do pozadí" Německu; jejich
    vzájemné hádky označuje za „divadlo pro lidi", aby vypadalo, že mají odlišné názory.'
  podtema: Parlament, politické a stranické reakce
- id: vrabel-2026-08-22-02
