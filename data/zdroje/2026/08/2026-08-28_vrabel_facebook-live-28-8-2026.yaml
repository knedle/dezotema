- id: vrabel-2026-08-28-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Jádro: prodloužení Temelína a Dukovan, taxonomie a „zelený parlament" (Vrabel, 12. 6. 2026)'
  text: '**28. 8.** — Vrabel čte a komentuje divácký příspěvek Vladimíra Štěpána (zakladatel hnutí Česká
    republika na prvním místě): americké palivové články se v Dukovanech zkoušely s fiaskem (praskaly,
    blokovaly regulační tyče), takže se ČR vrátila k ruským; zásoby ruského paliva vydrží jen 12–16 měsíců;
    v Dukovanech je odstaven blok 1 kvůli vadné armatuře, v Temelíně jedna ze čtyř chladicích cest kvůli
    nefunkčnímu náhradnímu ventilu (dovezenému mimo Rusko kvůli embargu); EU má ČR vyhrožovat zastavením
    plynu/ropy při odchodu z Lipské burzy. Vrabel s věcnou kritikou souhlasí, ale klade Štěpánovi dvě
    otázky: (1) proč viní jen vládu Petra Fialy a Pavla, když stejnou politiku (odklon od ruských energií)
    dělala i vláda Babiše — obě jsou podle něj „proti lidem", ne jedna vláda vinná víc; (2) proč Štěpán
    před volbami objížděl republiku s tvrzením, že vystoupení z EU by druhý den zkrachovalo všechny firmy,
    když dnes sám mluví o „vydírání" ze strany EU — ptá se, zda „prozřel", a připomíná, že sám volal po
    vystoupení z EU už od roku 2022.'
  podtema: Energetika a Rusko
- id: vrabel-2026-08-28-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**28. 8.** — Vrabel pouští a podporuje video Koriny Rybářové, která na vlasteneckém setkání v
    Příčovech předala Petru Hájkovi pozvánku na demonstraci 3. 10. — Hájek následně na Protiproudu naznačil,
    že akce může být financovaná stejně jako Milion chvilek. Rybářová v odpovědi odmítá srovnání (demonstrace
    „Člověk na prvním místě" i předchozí akce stejných organizátorů z roku 2022 byly dle ní financované
    výhradně samotnými lidmi) a ptá se, proč Hájek akci veřejně napadá, když se jí sám neúčastní. Vrabel
    se k tomu připojuje osobní vzpomínkou na Hájka z divadla Kámen (2021/2022), kde hodinu a půl mluvil
    o nemožnosti změny skrze politické strany, než ho „převálcoval" nepozvaný Jindřich Rajchl (v té době
    jeho bezplatný advokát) ohlášením vlastní strany — a Hájek na to jen mlčel. Zdůrazňuje, že nestojí
    na straně žádné z „ODS klik" (motoristé s Klausem ml., PRO/Trikolóra s Hrdličkou, Naše Česko s Kubou
    a Dlouhým), a odmítá být zatahován do sporů mezi nimi o „korito" — [Facebook Live 28. 8.](_zdroje.md#ladislav-vrabel--facebook-live-28-8-2026)'
- id: vrabel-2026-08-28-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Sušenky" z recyklovaného PET plastu jako budoucí potravina (Vrabel, 28. 8. 2026)
  text: 'Vědci z Illinoiské univerzity vyvíjejí technologii, která pomocí vody, kyslíku, vysoké teploty
    a tlaku rozloží odpadní PET plast a zemědělský odpad na jednodušší uhlíkaté látky, jež geneticky upravené
    mikroorganismy dále zpracují na bílkoviny a tuky vhodné k 3D tisku do „sušenek" (zatím nákladné —
    cca 60 dolarů/kg, cíleno primárně na zásobování astronautů). Vrabel to komentuje sarkasticky jako
    řešení jím dříve zmíněné predikce hladomoru v EU: srovnává to s oblečením z recyklovaného plastu (které
    nosit odmítá kvůli obsahu mikroplastů v těle) a s již běžným přidáváním hmyzí (červí) bílkovinné moučky
    do potravin v EU bez zvláštního označení — uzavírá, že po vyčerpání dobytka (nahrazeného laboratorním
    masem „od Billa Gatese") zbydou lidem už jen „plastové sušenky".'
  podtema: Elity a jejich plány
- id: vrabel-2026-08-28-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: MPSV škrtá podporu v nezaměstnanosti od 2027 — kritika priorit rozpočtu (Vrabel, 28. 8. 2026)
  text: Ministerstvo práce a sociálních věcí připravuje od ledna 2027 snížení podpory v nezaměstnanosti
    — v prvních měsících z letošních 80 % zpět na 65 % výdělku, maximální podpora klesne z 80 % na 60
    % průměrné mzdy (úspora cca 4,5 mld. Kč ročně); návrh kritizují odbory i zaměstnavatelé. Vrabel —
    ač se sám nepovažuje za zastánce silné sociální politiky — vyjadřuje podiv, že když se najdou peníze
    na zbraně pro Ukrajinu a příspěvky ukrajinským uprchlíkům, nenajdou se na podporu vlastních nezaměstnaných
    občanů; ironicky doplňuje, že řešením podle vlády může být práce ve zbrojovkách v Německu (nabízeny
    až 100 000 EUR/rok i pro nezkušené).
  podtema: USA — volební systém
- id: vrabel-2026-08-28-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'EU rozpočet 2028–2034: ČR hrozí škrty z kohezních fondů (Vrabel, 19. 6. 2026)'
  text: '**28. 8.** — Vrabel rozvádí tutéž tezi o Babišově rozpočtové „schizofrenii": zatímco Babiš odmítá,
    aby z českého rozpočtu šla byť koruna přímo Ukrajině, zároveň nemá problém s tím, že Macinka za ČR
    odsouhlasuje peníze z rozpočtu EU přímo na zbraně pro Ukrajinu (90 mld. EUR půjčky) — přitom ČR do
    rozpočtu EU sama přispívá, takže se jí tato platba nepřímo týká. Poukazuje, že jediným politikem,
    kterého slyšel otevřeně podporovat navýšení rozpočtu EU, je právě Andrej Babiš — v kontrastu s Friedrichem
    Merzem, který (poprvé se s ním Vrabel shoduje) navyšování odmítá s tím, že evropské státy na to nemají.
    Vrabel to čte jako důkaz, že Babišovi jde hlavně o zachování zemědělských fondů/Agrofertu, ne o zásadový
    postoj k penězům pro Ukrajinu.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-08-28-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Německý generál Kujat kritizuje pokračující podporu Ukrajiny — evropští politici se bojí přiznat
    chyby (Vrabel, 28. 8. 2026)
  text: Bývalý německý generál a předseda vojenského výboru NATO Harald Kujat kritizoval pokračující vojenskou
    podporu Ukrajiny — podle něj se evropští politici zdráhají přiznat chyby dosavadní politiky, ačkoli
    další financování války znamená jen další oběti a ničení; evropská politika by se měla soustředit
    na ukončení války a zlepšení situace ukrajinského obyvatelstva, ne na podporu současného vedení. Vrabel
    vítá, že podobné hlasy zaznívají i z tak vysokých vojenských pozic, a doplňuje odkaz na rozhovor s
    bývalým plukovníkem americké armády Douglasem McGregorem o Jugoslávii — ne všichni v USA a Německu
    byli v 90. letech pro bombardování Jugoslávie a pomoc Bosně.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-28-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenskyj nařídil až 1000 dronových úderů denně na Rusko (Vrabel, 28. 8. 2026)
  text: 'Podle agentury Reuters nařídil Volodymyr Zelenskyj armádě výrazně zvýšit počet útoků drony dlouhého
    doletu na cíle v Rusku — cílem je až 1000 úderů denně; útoky již přispěly k poklesu ruské produkce
    benzinu a problémům s dodávkami paliva. Vrabel to komentuje jako zoufalý krok: Ukrajina už podle něj
    nemá dostatek vojáků (mobilizace žen nebude vojenskou silou) ani protivzdušnou obranu, takže drony
    zůstávají jediným prostředkem boje. Očekává, že Rusko na podzim zahájí velkou ofenzivu a může zničit
    Zelenského režim, a vyjadřuje naději, že Rusko brzy získá od Číny technologie na dálkové rušení dronů,
    aby se omezily zbytečné civilní oběti — kritizuje pokračující zapojení ČR do „koalice ochotných" a
    muniční iniciativy.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-28-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trump obviňuje Čínu z vměšování do voleb — „kdo to říká, ten to je" (Vrabel, 17. 7. 2026)
  text: '**28. 8.** — Podle agentury Bloomberg Venezuela zvažuje vystoupení z OPEC (organizace, kterou
    před 60 lety pomáhala založit) — o možnosti se jednalo i s americkými představiteli, kteří zároveň
    vyjednávají o získání podílu na venezuelských ropných polích (v úvahu je i až stoletý pronájem některých
    ložisek). Vrabel to dává do souvislosti s vyprávěním bývalého plukovníka americké armády Douglase
    McGregora o Jugoslávii: nadřízený mu v roce 1998 řekl, že bombardování Srbska bude „začátek demokratizace
    Balkánu" směřující až k Rusku. Z toho Vrabel odvozuje obecný „vzorec demokratizace", který USA podle
    něj opakovaně aplikují (naposledy na Venezuelu, dříve i na balkánské státy) a chystají i na Grónsko,
    Kanadu a Kubu: (1) prohlásit vůdce země za diktátora, (2) zabít ho nebo unést a uvěznit, (3) dosadit
    nové vládce nebo zkorumpovat a zastrašit původní, (4) získat kontrolu nad ekonomikou a nerostným bohatstvím
    země pod americká křídla.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-28-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Lavrov: Rusko „přitvrdí" proti všemu, co ze Západu živí ukrajinské válečné úsilí — Vrabel:
    plán vyždímat a zdevastovat Evropu (Vrabel, 14. 8. 2026)'
  text: |-
    **28. 8.** — Lavrov v rozhovoru pro televizní stanici Al Arabiya označil současné změny ve světě za hlubokou transformaci, která může trvat celé generace — klíčový je podle něj přechod od unipolárního k multipolárnímu uspořádání, v němž sílí Čína, Indie, Brazílie a další státy „globálního jihu". Uvedl, že Rusko po zkušenostech od roku 2022 už nebude se Západem spolupracovat jako dřív, a označil Velkou Británii za jeden z nejnegativnějších faktorů ve vztazích Ruska se Západem. Vrabel doplňuje, že podobně jako Trump má oproti Bidenovi „lepší jméno" (méně nepřátelský vztah k Rusku), mají ho podle něj i Robert Fico a Andrej Babiš oproti Friedrichu Merzovi a Emmanuelu Macronovi — přiznává, že přesně nerozumí, čím si to Babiš zasloužil, ale považuje to za pozitivum pro ČR, byť nedostatečné.

    Ruské ministerstvo obrany zároveň oznámilo testovací odpal mezikontinentální balistické rakety z kosmodromu Pleseck (ověření elektronických a letových parametrů) — stejné místo, odkud Rusko dříve testovalo raketu RS Sarmat. Vrabel k tomu jen krátce vyjadřuje naději, že podobnou zbraň Rusko nevyzkouší na nějaké továrně na území ČR.
  podtema: Zahraniční aktéři a precedenty
