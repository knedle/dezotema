  text: '**11. 8.** — Rajchl dává tutéž příčinnou dvojici (Green Deal, ukrajinská migrace) do souvislosti
    s aktuálním číslem: nezaměstnanost v ČR dosáhla 5 %, nejvyšší hodnoty od přelomu ledna a února 2017
    (přes 9 let). Odmítá vysvětlení „odborníků" (např. nástup absolventů do zaměstnání) jako zamlčování
    skutečných příčin — znovu uvádí Zetor jako příklad firmy vyhnané z ČR vysokými cenami energií a přesun
    pracovních míst k ukrajinským migrantům na pozicích, o které by čeští občané měli zájem.'
