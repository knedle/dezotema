  nadpis: Saúdský princ žádá Trumpa o deeskalaci — Írán popírá tvrzení o jednáních (Vrabel, 3. 8. 2026)
  text: Saúdský korunní princ Muhammad bin Salman telefonicky vyzval Trumpa, aby se zdržel plánovaných
    útoků na Írán a usiloval o deeskalaci — krátce poté Trump oznámil zrušení připravovaných úderů s odůvodněním,
    že o to Írán požádal a nabídl obnovení bezpečné plavby Hormuzem. Íránské ministerstvo zahraničí ale
    popřelo, že by o cokoli takového žádalo nebo že by jednání probíhala, a uvedlo, že armáda je v nejvyšší
    bojové pohotovosti. Vrabel to čte jako Trumpovu snahu najít si alibi pro vlastní nekonzistentnost
    (srovnává to s dřívějším Zelenského výhrůžným ultimátem Bělorusku, kde si Zelenskyj rovněž připsal
    k dobru ústupek, ke kterému fakticky nedošlo) — zapadá to do jeho starší teze o „týdenním cyklu" eskalace
    a deeskalace (viz výše).
  podtema: Hormuz — aktualizace 6. 5. 2026
