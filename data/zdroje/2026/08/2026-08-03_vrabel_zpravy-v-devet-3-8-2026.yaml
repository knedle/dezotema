  nadpis: Sucho odstavuje jaderné elektrárny v Rumunsku a Maďarsku — kontrast se 4× levnější energií v
    Srbsku (Vrabel, 30. 7. 2026)
  text: '**3. 8.** — Doplňuje konkrétní hospodářské dopady sucha: podle kolegyně z Rakouska klesnou letos
    sklizně zelené produkce o cca 20 %, kvůli vysokým cenám pohonných hmot některé farmy hlásí propad
    výnosů 20–70 % a jedna farma musí kvůli nedostatku krmiva začít vybíjet dobytek. Zmiňuje i to, že
    pokles hladiny Dunaje v Srbsku odhalil potopené německé lodě z roku 1944 a v Rakousku vyplavaly kosti
    mamutů. Vrabel z toho vyvozuje, že evropské potraviny výrazně zdraží, a doporučuje divákům začít si
    pěstovat vlastní zeleninu na venkově („zachraň se, kdo může") — doplňuje, že ČR má díky přírodním
    poměrům (rybníky, řeky, lesy) mezi evropskými zeměmi nejlepší předpoklady, což z ní podle něj zároveň
    učiní cíl budoucí migrace ze zemí zasažených klimatickými změnami a stoupající hladinou moří.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-08-03-04
  typ: tvrzeni
