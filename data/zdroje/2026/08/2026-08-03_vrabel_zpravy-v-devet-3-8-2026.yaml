  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**3. 8.** — Upřesňuje termín demonstrace na **říjen** (dříve avizoval druhou polovinu září) a
    poprvé zveřejňuje strukturu: půjde o „desatero" — deset požadavků/témat. První a nejdůležitější bod
    je explicitní požadavek, aby ČR (prezident Pavel i vláda Babiše) nebyla „zavlečena" do žádné jaderné
    aliance — ani NATO nuclear sharing, ani americké, ani francouzské — s odůvodněním, že jde o životy
    všech obyvatel ČR, nikoli jen politickou preferenci. Slibuje postupně odhalovat další body desatera
    v dalších dnech. — [Zprávy v devět 3. 8.](_zdroje.md#ladislav-vrabel--zprávy-v-devět-3-8-2026)'
- id: vrabel-2026-08-03-05
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Obžalování v bitcoinové kauze jako „vrtěti psem" odvádějící pozornost od migračního paktu (Vrabel,
    3. 8. 2026)
  text: 'Ke zprávě, že olomoucké státní zastupitelství obžalovalo čtyři lidi v bitcoinové kauze (Tomáš
    Jiříkovský, exministr spravedlnosti Pavel Blažek, jeho bývalý náměstek Daňhel a advokát Karim Tyc
    — pro Blažka žalobkyně navrhuje 6,5 roku vězení) Vrabel vyjadřuje skepsi, že by Blažek („Don Pablo")
    reálně šel na tak dlouho do vězení — srovnává to s vlastním stíháním, kde mu média avizovala 8 let
    za nezaškrtnutou kolonku v žádosti o covidové odškodnění. Argumentuje, že jde o „vrtěti psem": kauza
    podle něj slouží k odvedení pozornosti veřejnosti od migračního paktu a situace v Ceutě právě ve chvíli,
    kdy europoslankyně za ANO Zuzana Dostálová otevřeně potvrdila jeho dlouhodobou tezi, že vládní „odmítnutí"
    migračního paktu je jen prohlášení bez právního účinku, protože pakt je vymahatelnou směrnicí/nařízením
    EU. Předpokládá, že buď Jiříkovský, nebo Blažek „odnesou" symbolický trest, aby se veřejnost uklidnila,
    ale skutečná mocenská struktura zůstane nedotčená.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: vrabel-2026-08-03-06
  typ: tvrzeni
  temata:
