  nadpis: Izrael odmítl dodat Ukrajině systém Iron Dome (Vrabel, 3. 8. 2026)
  text: Izrael zablokoval dodávky protiraketového systému Iron Dome na Ukrajinu z obavy, že by se technologie
    mohla dostat do rukou Íránu — místo toho vrátil USA dříve zapůjčené baterie Patriot, které Washington
    může přesměrovat na Ukrajinu. Vrabel to srovnává s Trumpovým odmítnutím dát Kyjevu licenci na výrobu
    Patriotů (obavy, že se technologie „obrátí" proti dárci) — v obou případech tak vlastník nejmodernější
    technologie raději podporuje Ukrajinu nepřímo, přes americký systém, než aby dal z ruky vlastní vybavení.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-08-03-03
