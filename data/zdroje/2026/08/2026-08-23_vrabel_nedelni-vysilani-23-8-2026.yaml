- id: vrabel-2026-08-23-01
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Proč je migrace pro ČR jiná než pro Británii, Německo, Francii či Španělsko (Vrabel, 23. 8.
    2026)
  text: 'V odpovědi na divácký dotaz, zda migraci do Británie skutečně způsobilo vystoupení z EU, Vrabel
    rozlišuje dva typy migrace do Evropy. Do Británie (Pákistánci, Indové), Francie (obyvatelé bývalých
    kolonií) i do Německa/Rakouska (Turci na práci od 60. let, později Syřané a Afghánci po otevření hranic
    2015) přišli migranti z důvodů, které s Evropskou unií nesouvisí — jde o důsledek vlastní koloniální
    minulosti těchto zemí nebo jejich vlastních dřívějších náborových programů. Pro ČR je ale migrace
    podle něj výhradně důsledkem členství v EU a migračního paktu: ČR nikdy nikoho nekolonizovala, nemá
    „žádné dluhy" vůči bývalým koloniím, a jediné, co „udělala hloupě", bylo otevření hranic ukrajinským
    uprchlíkům. Migrační pakt dnes podle něj nutí i státy bez vlastní kolonizační historie přijímat migranty
    v rámci „solidárního" přerozdělování ve prospěch přetížených zemí západní Evropy — což pro ČR na rozdíl
    od Británie apod. žádnou historickou logiku nemá.'
- id: vrabel-2026-08-23-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rozpad vlastenecké scény — obvinění z agenturní spolupráce s BIS/policií, cenzura na Raptor
    TV (Vrabel, 23. 8. 2026)
  text: Vrabel po setkání v Příčovech popisuje sebe jako „asi nejvíc nenáviděnou osobu v České republice"
    — nejen ze strany vládní koalice (kterou přirovnal k „zrádcům národa"), ale i uvnitř vlastenecké scény.
    Tvrdí, že Ivan David jako první v roce 2022 a následně Jindřich Rajchl a Lenka Tarabová šíří tvrzení,
    že podepsal spolupráci s policií a pracuje jako agent BIS; podobně o něm bývalý policejní prezident
    Stanislav Novotný veřejně prohlašuje totéž. Popisuje také, že vlastenecká televize Raptor TV (Žarko
    Jovanović, s nímž dříve úzce spolupracoval při organizaci demonstrací) na něj a jeho hnutí uvalila
    neoficiální cenzuru — moderátor Honza Dolenc odmítl natočit příznivce s trikem propagujícím plánované
    shromáždění 3. 10., a příspěvky informující o akci byly na stránce Raptor TV mazány jako „vrábelovský
    spam". Vrabel to dává do kontextu rozpadu vlastenecké scény na soupeřící politická ega před volbami,
    kde se z „vlastenectví" stal komerční produkt.
  osoby:
  - osoba: rajchl
    vztah: negativni
    kontext: Spolu s Tarabovou šíří tvrzení, že Vrabel je agent BIS/spolupracuje s policií; dříve zakázal
      ruské vlajky na demonstracích jako „protistranu"
  - osoba: tarabova
    vztah: negativni
    kontext: Spolu s Rajchlem šíří tvrzení, že Vrabel je agent BIS
  - osoba: stanislav-novotny
    vztah: negativni
    kontext: Bývalý policejní prezident — veřejně tvrdí, že Vrabel je agent BIS
  - osoba: zarko-jovanovic
    vztah: negativni
    kontext: Majitel Raptor TV — dle Vrabela uvalil na jeho hnutí neoficiální cenzuru (odmítnutí natáčet,
      mazání komentářů)
  podtema: Politická perzekuce
- id: vrabel-2026-08-23-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vlastní bezpečnostní situace — proč žije v Srbsku (Vrabel, 23. 8. 2026)
  text: 'V reakci na opakující se obvinění, že žije v Srbsku, protože je „nasazený", Vrabel vysvětluje
    okolnosti přestěhování: v květnu 2022 (ještě před velkými demonstracemi) se s manželkou přestěhovali
    do Srbska kvůli vážné, později smrtelné rakovině její matky — chtěl, aby manželka strávila poslední
    roky s matkou. Po její smrti v Srbsku zůstali. Návrat do ČR podle něj dnes komplikuje bezpečnostní
    situace: kvůli tomu, že Ukrajinci mají „různé seznamy lidí na odstřel", se v Česku musí pohybovat
    s ochrankou srovnatelnou s tou, kterou mají vládní představitelé — veřejné vystoupení v Praze pro
    něj znamená nutnost okamžitě odjet. Doufá v návrat, až se „situace změní".'
  podtema: Politická perzekuce
- id: vrabel-2026-08-23-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: „Kontrolní seznam" ztráty suverenity — jediné, co zbylo, je koruna (Vrabel, 23. 8. 2026)
  text: 'Vrabel systematicky prochází, co z České republiky ještě podle něj zbylo „české". Obyvatelstvo:
    odhaduje 1–2 miliony Ukrajinců v ČR (10–20 % populace), kteří se na rozdíl od dříve usazených Vietnamců
    podle něj „nepočešťují" — z ČR se tak stává „Česko-Ukrajinsko". Hranice: fakticky neexistují, volný
    pohyb umožňuje komukoli dojít z Afriky až do Kolína. Majetek: silnice a některé pozemky jsou ještě
    české, ale továrny, obchody, banky, doprava i média jsou většinově v zahraničních rukou (ČR na rozdíl
    od Srbska nemá zákon bránící cizincům kupovat zemědělskou půdu). Zákony a politika: rozhodují sponzoři
    a média řízené ze zahraničí (cituje Havlův výrok o „světovém režisérovi"), a zákony EU jsou nadřazené
    českým podle ústavy. Jediné, co podle něj zůstalo skutečně české, je koruna — a i tu považuje za dočasnou,
    používanou k zakrytí ostatních ústupků. Definuje vlastenectví jako boj za to, aby v zemi „bydleli
    Češi", mluvilo se česky a vydělané hodnoty zůstávaly doma — na rozdíl od dnešního stavu, kdy je ČR
    podle něj „v procesu rozmělňování se" do evropských struktur.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
