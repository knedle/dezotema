  nadpis: Programovatelné euro a Chat Control jako vzdání se suverenity — politici jsou v tom s EU (Šejna,
    15. 8. 2026)
  text: '**21. 8.** — Šejna pokračuje v kritice Chat Controlu a jmenovitě zmiňuje europoslance, kteří
    ho podpořili (Tomáš Zdechovský za KDU-ČSL, Danuše Nerudová za STAN). Odmítá oficiální zdůvodnění (ochrana
    dětí před sexuálním vydíráním a šířením nahých fotografií) jako zástěrku — skutečným cílem je podle
    něj plošné sledování soukromé komunikace všech občanů, včetně nevinných fotek z výletů nebo intimního
    obsahu mezi partnery, který by tak mohl kdokoli vidět. Označuje to za „opravdu komunistickou věc",
    ne jen socialistickou.'
