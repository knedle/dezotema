  nadpis: Akcelerační zóny snížené na 11 % — Šejna chválí Filipa Turka jako „vítěze" boje proti větrníkům
    (2. 8. 2026)
  text: 'Adam Šejna hodnotí vývoj akceleračních zón jako jednoznačné vítězství ministra Filipa Turka (Motoristé):
    podle něj se rozsah zón snížil na 11 % z původních 100 % — navazuje tím na dříve zdokumentovaný postup
    zúžení ze 110 na 61 lokalit (viz [ČR nemá od EU žádnou povinnost větrníky stavět](/temata/vetrniky.md#vrabel-2026-07-24-14)),
    byť s jiným metrikou (podíl plochy/zón, ne počet lokalit). Na rozdíl od Vrabelova skeptičtějšího rámování
    (zdůrazňujícího, že šlo o čistě dobrovolný vládní závazek, který mohl být zrušen zcela) Šejna Turkův
    výsledek prezentuje jako aktivní vybojovaný úspěch — spojuje ho s Turkovým bojem proti neziskovkám
    na ministerstvu životního prostředí a zdůrazňuje, že bez tohoto zmenšení by ČR musela EU platit vysoké
    sankce za nedodržení závazku předchozí vlády.'
  podtema: Kulturní a občanský odpor
