  nadpis: Fauci se odvolal na 5. dodatek — kontrast s beztrestností v ČR (Vrabel, 30. 7. 2026)
  text: '**21. 8.** — Zítko referuje o novém vývoji: David Morens, bývalý dlouholetý poradce (2006–2022)
    v kanceláři ředitele NIAID a blízký spolupracovník Fauciho, se u federálního soudu v Marylandu přiznal
    k jednomu bodu obžaloby ze spiknutí za účelem podvedení USA — konkrétně za skrývání federálních záznamů
    o původu covidu a o grantu na výzkum „rizika vzniku netopýřích koronavirů" (z něhož měl přes newyorskou
    neziskovku EcoHealth Alliance, vedenou Peterem Daszakem, plynout subgrant Wuhanskému institutu virologie);
    hrozí mu až 5 let vězení. Podle obžaloby si Morens s Daszakem a dalším spoluspiklencem posílal e-maily
    o covidu a zrušeném grantu přes soukromý Gmail účet místo služebního, aby obešli zákon o svobodném
    přístupu k informacím, a Morens měl sloužit jako „zadní kanál" k neidentifikovanému vysoce postavenému
    představiteli NIAID (dle soudních dokumentů zřejmě Fauci) — jako protislužbu měl od Daszaka dostat
    lahve vína a nabídku placené večeře v michelinské restauraci. Zítko to prezentuje jako důkaz, že se
    v USA téma covidového původu znovu otevírá, v kontrastu s postupem českého ministerstva spravedlnosti
    vůči Pekové (viz [Kauzy — třetí verze kauzy Peková](/temata/kauzy/2026.md#zitko-2026-08-21-05)).'
- id: zitko-2026-08-21-04
  typ: tvrzeni
  temata:
