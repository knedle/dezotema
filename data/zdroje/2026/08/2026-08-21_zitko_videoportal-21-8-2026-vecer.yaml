  nadpis: Fauci se odvolal na 5. dodatek — kontrast s beztrestností v ČR (Vrabel, 30. 7. 2026)
  text: '**21. 8. (večer, Janečkův článek)** — Zítko čte rozsáhlý text Karla Janečka reagující na Fauciho
    senátní slyšení. Janeček srovnává Fauciho odmítání odpovídat (111 odvolání na pátý dodatek, včetně
    otázky na barvu kravaty) s tím, jak covidoví „vědátoři" po celém světě požadovali bezpodmínečnou důvěru
    ve vědu. Fauciho označuje za „nejhoršího kouzelníka" a „zlosyna historického významu", který poškodil
    důvěru ve vědu víc než kdokoli od dob Josefa Mengeleho, a tvrdí, že lidé kladoucí legitimní otázky
    o původu viru a financování rizikového výzkumu byli systematicky dehonestováni. Žádá, aby byli k odpovědnosti
    voláni i čeští protějšky — jmenovitě uvádí Jana Konvalinku, Zdeňka Hella, Milana Kubka, Rastislava
    Maďara, Petra Smejkala, Jana Sempera, Václava Hořejšího, Jaroslava Flégra, Romana Chlíbka, Rudolfa
    Tachezyho a Vašákovou. Připomíná vlastní ranou kritiku covidových opatření (blog z 21. 3. 2020, veřejné
    vystoupení v listopadu 2021 proti očkování zdravých dětí), kterou nikdy nelitoval.'
  osoby:
  - osoba: anthony-fauci
    vztah: negativni
    kontext: Dle citovaného textu Karla Janečka „zlosyn historického významu" srovnatelný s Mengelem,
      poškodil důvěru ve vědu víc než kdokoli od 2. světové války
- id: zitko-2026-08-21-06
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Třetí verze kauzy Peková: ministr Tejc, moderátor Salaj jako iniciátor, podpora Karla Janečka
    (Zítko, 21. 8. 2026)'
  text: '**21. 8. (večer)** — Zítko rozvádí kauzu o další vrstvu: studii slovenské Akademie věd (SAV),
    kterou vláda použila ke zpochybnění Pekové posudku, označuje odborník Kevin McKernan (dle Zítka „jeden
    z pěti největších světových odborníků" v oboru) za rovněž podjatou — autoři studie měli mít nedeklarované
    financování od výrobců mRNA vakcín, což podle Zítka představuje neuvedený střet zájmů srovnatelný
    s tím, z čeho byla obviněna Peková. Zdůrazňuje, že žádná ze stran zpochybňujících Pekovou analýzu
    neprovedla rozbor stejných vzorků (těch 34 vzorků zůstává uloženo u Pekové v mrazáku). Zmiňuje také,
    že slovenský politik Marian Kotleba podal trestní oznámení na Mgr. Jana Pačese, PhD. — muže, který
    na Pekovou původně podal stížnost vydávaje se za soudního znalce, ač jím nikdy nebyl.'
  osoby:
  - osoba: marian-kotleba
    vztah: pozitivni
    kontext: Slovenský politik — podal trestní oznámení na Pačese, který se vydával za soudního znalce
      při útoku na Pekovou
  podtema: Trestní stíhání kritiků covidu
