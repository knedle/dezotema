  nadpis: Zelenskyj odmítá svobodné volby — vydělává na válce, EU financuje strach jako nástroj kontroly
    (Šejna, 24. 8. 2026)
  text: 'Šejna reaguje na Zelenského odmítnutí uspořádat svobodné volby, dokud neskončí konflikt s Ruskem
    (odůvodněné rizikem pro Ukrajinu za války). Tvrdí, že Zelenskyj se ve skutečnosti bojí prohrát — ví,
    že lidé na Ukrajině chtějí ukončení války, a odmítá riskovat volby, protože by je nevyhrál. Podle
    Šejny je jediným motivem vydělávání na pokračování konfliktu (peníze z EU, NATO a USA) a udržování
    napětí mezi Ruskem a Evropou, protože Rusko jednou dobyté území nikdy nevrátí — reálným řešením by
    bylo přijmout ztrátu části území výměnou za zachování zbytku svobodné Ukrajiny. Rozšiřuje to na obecnější
    tezi: EU podle něj udržuje evropské občany ve strachu z Ruska (které dle Šejny kvůli členství v NATO
    nezaútočí), aby ospravedlnila postupné omezování jejich svobod.'
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: Odmítá svobodné volby, protože by je prohrál; vydělává na pokračující válce financované EU/NATO/USA
  podtema: Stav Ukrajiny a mobilizace
