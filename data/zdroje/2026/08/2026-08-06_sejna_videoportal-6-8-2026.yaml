  nadpis: Demografická náhrada jako nevyhnutelná i v „nejlepším scénáři" (Adam Šejna, 6. 8. 2026)
  text: 'Šejna argumentuje, že negativní dopady migrace v EU jsou nevyhnutelné i v hypoteticky nejlepším
    scénáři: kdyby ve všech členských státech zvítězily patriotické strany, uzavřely hranice a deportovaly
    všechny nelegální migranty, stále by zůstala velká skupina lidí, kteří už mezitím získali občanství
    (podle něj i „vyžebrané" bez skutečného nároku) — ty už deportovat nelze. Tuto skupinu navíc podle
    něj bude nadále rychle rozšiřovat vyšší porodnost muslimských a jiných přistěhovaleckých komunit ve
    srovnání s původním obyvatelstvem, zatímco náprava „protirodinné propagandy" mezi mladými Evropany
    může trvat desítky let. Nadcházející volby do Evropského parlamentu označuje za poslední příležitost
    tento vývoj zvrátit. Mladým mužům radí dva způsoby osobní ochrany proti migrantským útokům: vydělat
    dostatek peněz na právníky pro případnou obhajobu při použití sebeobrany a fyzicky zesílit, aby útočníky
    odradili už svým vzhledem.'
