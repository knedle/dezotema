  nadpis: Pražský projekt Bubny-Zátory jako „15minutové město" — riziko omezení volného pohybu (Vrabel,
    20. 8. 2026)
  text: 'Praha připravuje projekt Bubny-Zátory za zhruba 90 miliard korun, který lze podle Vrabela popsat
    jako aplikaci konceptu „15minutového města" — obyvatelé mají mít bydlení, práci, školy, služby, obchody,
    zeleň i dopravu v docházkové/dojezdové vzdálenosti do 15 minut. Sám o sobě to považuje za hezkou myšlenku,
    ale upozorňuje na to, co se podle něj děje v britských testovacích projektech téhož konceptu: kdo
    by chtěl takovou čtvrť opustit, musí k tomu žádat radu o zvláštní povolení. Obává se, že jakmile bude
    mít někdo argument (nedostatek energie, škodlivost cestování), lidé s „vším v dosahu 15 minut" nebudou
    mít důvod ani prostředek se tomu bránit.'
- id: vrabel-2026-08-20-02
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Nová unijní regulace hotovosti (AMLR) — plán zbavit lidi hotovosti a úspor, investiční rady
    (Vrabel, 20. 8. 2026)
  text: 'EU od 10. 7. 2027 zavádí přísnější pravidla pro hotovostní platby (nařízení AMLR — Anti Money
    Laundering Regulation), oficiálně kvůli praní špinavých peněz a daňovým únikům; dotkne se zejména
    nákupu luxusního zboží (auta, šperky) a transakcí, kde je stranou firma. Vrabel vysvětluje mechanismus
    (studoval ho jako právník i při certifikaci na realitního makléře): zákon přenáší na firmy odpovědnost
    státu kontrolovat původ peněz klientů a postupně omezuje množství hotovosti, kterou lze mít/platit
    (uvádí limit cca 10 000 EUR / 270 000 Kč v ČR, ve Španělsku už nižší, kolem 3 000 EUR). Tvrdí, že
    skutečným cílem je zbavit svět hotovosti a nakonec i úspor obecně — v digitální ekonomice lze podle
    něj snadno zavést „datum spotřeby" peněz (historická praxe, např. Bavorsko), aby lidé nuceně utráceli
    a peníze se nehromadily jako „mrtvá voda" mimo oběh. Spojuje to s programem EU **Savings and Investments**
    (Ursula von der Leyen) — cílícím na přesun evropských úspor (odhaduje stovky miliard až biliony eur)
    do investic v AI a zbrojení — a s obecnější tezí o „K modelu" ekonomiky (bohatí bohatnou, střední
    třída chudne), kdy 12 amerických technologických firem tvoří 36 % hodnoty burzy, přestože jsou podle
    něj enormně „přepálené" a hrozí jim kolaps. Radí divákům aktivně chránit úspory: nenechávat peníze
    v bance (transparentní pro finanční úřad), diverzifikovat mezi drahé kovy (i ty budou podle něj brzy
    registrované v chystaném unijním registru), kryptoměny a zejména nemovitosti — doporučuje konkrétně
    investice do nemovitostí v Srbsku (mimo EU, ceny na zlomku českých) a Černé Hoře (očekává výprodej
    po zavedení vízové povinnosti pro Rusy).'
- id: vrabel-2026-08-20-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Berlínský spor o vyvlastnění bytů jako předzvěst bytové krize v ČR po migračním paktu (Vrabel,
    20. 8. 2026)
  text: 'V Berlíně dominuje zemským volbám spor o bydlení: levicová strana Die Linke podmiňuje vstup do
    vlády vyvlastněním velkých pronajímatelů (firem vlastnících 3000+ bytů, dohromady až 220 000 nemovitostí)
    — podobný návrh už jednou (nezávazně) podpořilo v referendu 2021 59 % voličů, Die Linke nyní vede
    průzkumy s téměř 20 %. Vrabel to dává do souvislosti s Prahou, kde je bytů podle něj také nedostatek,
    a s migračním paktem, který má začít platit od roku 2027: tvrdí, že EU pak bude vědět, kde jsou volné
    byty, aby do nich mohla umisťovat migranty, takže ani v ČR nezbudou volné byty. Za prvotní příčinu
    bytové krize označuje migraci v kombinaci se současným ekonomickým systémem, který podle něj už není
    klasický kapitalismus s nabídkou a poptávkou, ale „korporátní fašismus" — až dojdou volné byty, přijde
    na řadu vyvlastňování jako v Berlíně, což sám neschvaluje, ale považuje za nevyhnutelný důsledek.'
- id: vrabel-2026-08-20-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Rozpočet obrany 191 mld. Kč (2 % HDP) — SPD jako jednostranně zbrojařská strana (Vrabel, 20.
    8. 2026)
  text: Ministerstvo obrany bude v příštím roce hospodařit s 191 miliardami korun — meziroční nárůst o
    zhruba 36,2 miliardy — což má ČR umožnit splnit závazek 2 % HDP na obranu; peníze míří na modernizaci
    armády, nábor personálu a rozjeté zbrojní projekty. Vrabel k tomu dodává, že se předseda Sněmovny
    Tomio Okamura nedávno tajně sešel s Michalem Strnadem, největším českým zbrojařem. Kritizuje, že SPD
    (spolu s neoficiální koalicí s Trikolorou a Svobodnými) si z celé vlády vzala právě ministerstvo obrany
    a jediné, co v ní reálně dělá, je zbrojení — zatímco voliči, kteří tuto „vlasteneckou" koalici volili,
    čekali podle něj něco jiného.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-08-20-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Cvičení NATO Cyber Junction v Německu — paralela se Stalingradem, „chazarští bankéři" financují
    válku jako za Hitlera (Vrabel, 20. 8. 2026)
  text: 'V Německu probíhá (15. 8.–13. 9.) rozsáhlé cvičení Cyber Junction vedené americkou armádou v
    Evropě a Africe, s účastí vojáků zemí NATO a partnerských států včetně Ukrajiny — cílem je prověřit
    připravenost k pozemním operacím, rychlé nasazení a testovat bezpilotní systémy, umělou inteligenci
    a datově řízené velení. Vrabel k tomu poznamenává, že Němci si „válčení" s Ruskem už jednou vyzkoušeli
    u Stalingradu, a vyjadřuje pochybnost, že by tentokrát na rozdíl od druhé světové války šli do boje
    spolu s nimi i Američané — očekává, že stejně jako tehdy dají „globalisté bankéři" (opakuje svou tezi
    o „chazarských Židech", kteří údajně financovali Hitlerovo zbrojení) peníze na válku a nechají „odválčit"
    ji evropské národy samotné. Srovnává to s domácí situací: zatímco lidé v ČR nemají na topení, Michal
    Strnad buduje zbrojařské impérium, které má předčit německý Rheinmetall.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-08-20-06
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: První pád větrné elektrárny v ČR — u Podštátu na Přerovsku (Vrabel, 20. 8. 2026)
  text: U Podštátu na Přerovsku se zřítila přibližně 30 metrů vysoká, 25–30 let stará větrná elektrárna
    (součást čtyřčlenného parku provozovaného společností Vapol.cz) — nikdo nebyl zraněn, okolnosti vyšetřuje
    policie a podle starosty měla být brzy rekonstruována. Podle České společnosti pro větrnou energii
    jde o první pád větrné elektrárny v ČR; město nařídilo odbornou kontrolu zbývajících zařízení. Vrabel
    sarkasticky komentuje, že šlo o malou 30metrovou elektrárnu a ptá se, jaký „fičák" nastane, až budou
    padat plánované elektrárny o výšce 270 metrů — doporučuje důkladné zabetonování nově stavěných věží.
  dalsi_zdroje:
