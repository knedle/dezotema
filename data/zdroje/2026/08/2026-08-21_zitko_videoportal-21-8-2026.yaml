  nadpis: Trestní oznámení na Petra Fialu za „přípravu útočné války" (Zítko, 7. 8. 2026)
  text: '**21. 8.** — V souvislosti s kauzou Peková Zítko rekapituluje všechna tři svá dosud podaná trestní
    oznámení (genocida národa/vakcinační holokaust/sterilizace, příprava útočné války na Fialu, bitcoinová
    kauza ODS/Spolu/Brňáků) — beze změny oproti dřívějšímu obsahu. Nově nabízí hypotetický scénář: veřejnoprávní
    debata, v níž by proti Pekové a jemu samotnému stála „nejsilnější covidová sestava" (Primula, Adam
    Vojtěch, Válek, Fleger, Chlíbek, Kubek, Hořejší, Konvalenka, Maďar, Babiš, Fiala, případně i slovenští
    „federální pomocníci" Mikas, Čekan, Salaj, Sabaka, Jarčuška) — řečnicky se ptá, jak by taková konfrontace
    dopadla.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
- id: zitko-2026-08-21-08
  typ: tvrzeni
