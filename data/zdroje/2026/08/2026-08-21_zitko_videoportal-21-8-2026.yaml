  nadpis: Fauci se odvolal na 5. dodatek — kontrast s beztrestností v ČR (Vrabel, 30. 7. 2026)
  text: '**21. 8. (večer)** — Zítko referuje o krizi Světové zdravotnické organizace (WHO): organizace
    čelí bankrotu, celkem odešlo (rezignace + hromadná propouštění) přes 4 800 zaměstnanců, z toho 900
    (25 %) jen z evropské centrály v Ženevě. Hlavní vědecký ředitel WHO Jeremy Farrar rezignoval poté,
    co vyšlo najevo (v souvislosti s přiznáním Davida Morense — viz výše), že byl skrýván původ viru;
    datová manažerka Yukiko Nakatani je „na útěku" po vnitřních sporech. Krizi připisuje zejména zastavení
    financování ze strany USA (Trump vypověděl členství první den svého úřadu, platnost vypršela po roce)
    a odchodu Argentiny — v rozpočtu WHO tak vznikla díra 1,7 miliardy dolarů. Kritizuje, že český poslanec
    Jindřich Rajchl přes půl roku od svého „desatera" (přednesený 26. 1. na covidovém semináři v PS) nepodnikl
    žádné kroky k vystoupení ČR z WHO, ani vláda Andreje Babiše nezrušila Národní očkovací strategii nebo
    nevypověděla pandemickou smlouvu.'
  osoby:
  - osoba: david-morens
    vztah: rozporuplny
    kontext: Bývalý poradce Fauciho — přiznal vinu za skrývání záznamů o původu covidu, ale jeho trest
      je dle sdíleného komentáře jen „odvedení pozornosti od slona v místnosti"
- id: zitko-2026-08-21-05
  typ: tvrzeni
