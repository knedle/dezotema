  nadpis: 'Třetí verze kauzy Peková: ministr Tejc, moderátor Salaj jako iniciátor, podpora Karla Janečka
    (Zítko, 21. 8. 2026)'
  text: Zítko doplňuje kauzu dalšími jmény a detaily. Rozhodnutí o odebrání znaleckého razítka připisuje
    ministru spravedlnosti Jeronýmu Tejcovi; za spouštěč eskalace označuje moderátora Tomáše Salaje (kanál
    Niemand Nula), který podle něj načasovaně zaútočil na Pekovou souběžně s zpochybněním studie slovenské
    Akademie věd (SAV) doktorem Petrem Kotlárem — ministerstvo přitom podle Zítka vůbec neposuzovalo správnost
    jejích odborných závěrů, jen otázku nestrannosti (v tomto bodě se jeho popis shoduje s Tarabovou verzí
    výše). Přehrává starší klip, v němž Salaj během pandemie tvrdil, že po jejím skončení budou lidé rozdělení
    jen do tří skupin — ti, co covid přežili, ti, co se nechali očkovat, a mrtví — a vyzýval k očkování;
    z toho Zítko usuzuje, že podle Salajovy vlastní logiky by on i další neočkovaní měli být dávno mrtví.
    Cituje také komentář bývalého prezidentského kandidáta Karla Janečka, který kauzu srovnává s aktuálním
    znovuotevřením covidové odpovědnosti v USA a označuje Pekovou za jednu z „hrdinek covidové doby" —
    ztrátu razítka jí prý stát vzít mohl, ale odvahu a odbornost ne.
  osoby:
  - osoba: tomas-salaj
    vztah: negativni
    kontext: Moderátor a „covidový propagátor zapíchávání" — označen za iniciátora eskalace vůči Pekové,
      přehrán jeho starší výrok o očkování
  podtema: Trestní stíhání kritiků covidu
- id: zitko-2026-08-21-07
