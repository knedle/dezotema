  nadpis: Fiala se prý „přiznal" k dodávkám zbraní Ukrajině před 24. únorem 2022 (Zítko, 25. 8. 2026)
  text: |-
    Zítko tvrdí, že premiér Petr Fiala se „podřekl" a přiznal, že Česká republika dodávala zbraně a munici Ukrajině ještě před zahájením ruské „speciální operace" 24. února 2022 — což podle něj naplňuje skutkovou podstatu trestného činu podle § 406 a § 407 trestního zákoníku (příprava útočné války). Srovnává to s vlastní tezí o cvičení NATO „Černý lev" před invazí 1968 (viz [Petr Pavel](/temata/petr-pavel.md#zitko-2026-08-25-07)) jako důkaz opakujícího se vzorce — přípravy Západu na konflikt předcházející oficiálnímu zahájení bojů.

    ⚡ **Poznámka:** Tvrzení o konkrétním „přiznání" Petra Fialy nelze ověřit z veřejně dostupných zdrojů; § 406–407 trestního zákoníku se týkají přípravy útočné války vedené Českou republikou, nikoli dodávek zbraní třetí straně.
  osoby:
  - osoba: petr-fiala
    vztah: negativni
    kontext: Tvrzení, že se „přiznal" k dodávkám zbraní Ukrajině před 24. únorem 2022 — obviněn z přípravy
      útočné války (§406–407)
  podtema: Trestní stíhání kritiků covidu
- id: zitko-2026-08-25-05
