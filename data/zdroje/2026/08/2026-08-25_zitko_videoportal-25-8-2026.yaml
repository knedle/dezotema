  nadpis: Kritika vlasteneckého setkání v Příčovech — vyloučená témata a kritika panelistů (Zítko, 25.
    8. 2026)
  text: 'Zítko nezávisle na Vrábelově kritice téže akce (viz [Politický systém — Setkání v Příčovech](/temata/politicky-system.md))
    hodnotí vlastenecké setkání v Příčovech (23. 8.) jako akci, kterou „ukradli lidem politici a novináři"
    výběrem neutrálních, nekonfliktních témat. Vyjmenovává, co podle něj chybělo: ekonomické dopady Green
    Dealu a uhlíkových povolenek (odhaduje odliv 3,7 bilionu Kč ročně), otázka válečných reparací a právní
    kontinuity Československa (viz [Konspirace — Československo](/temata/konspirace-ceskoslovensko.md)),
    COVID-19 (výslech Fauciho v Kongresu, přiznání Davida Morense — viz [COVID a vakcíny](/temata/covid-vakciny.md))
    a tresty odsouzených kritiků covidových opatření (viz výše). Kritizuje konkrétní účastníky panelu
    o nezávislosti médií — moderátora Marka Stoniše (šéfredaktor deníku, který dle Zítka vyhodil redaktora
    Pavla Cimbála po kampani proti němu) za nominaci bývalého ministra Cyrila Svobody na „největšího bojovníka
    za svobodu projevu" — a označuje účast politika Petra Štěpánka (Trikolóra) i řešení blízkovýchodního
    konfliktu na panelu o „středoevropské spolupráci" za tematicky nepatřičné pro akci prezentovanou jako
    vlastenecká.'
  osoby:
  - osoba: marek-stonis
    vztah: negativni
    kontext: Šéfredaktor deníku T.O. a porotce ankety o svobodě projevu — kritizován za vyhození redaktora
      Pavla Cimbála a za nominaci Cyrila Svobody
  - osoba: cyril-svoboda
    vztah: negativni
    kontext: Nominován v anketě jako „největší hrdina svobody projevu" — Zítko to odmítá jako výsměch
      s ohledem na jeho roli v tvorbě ústavy
  podtema: Trestní stíhání kritiků covidu
