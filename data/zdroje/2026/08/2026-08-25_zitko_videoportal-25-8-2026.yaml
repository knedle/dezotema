  text: '**25. 8.** — Zítko v přehledu vlasteneckého setkání v Příčovech znovu opakuje výklad o neplatnosti
    rozdělení Československa (Havlova abdikace, zákon 542/1992, chybějící referendum) a o nároku na válečné
