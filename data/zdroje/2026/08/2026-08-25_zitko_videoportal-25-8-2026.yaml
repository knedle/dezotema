  nadpis: Hrad odpověděl na Pekovou petici o milost — zamítnutí přes úředníka, ne osobně (Zítko, 26. 6.
    2026)
  text: '**25. 8.** — Zítko v přehledu vlasteneckého setkání v Příčovech jmenuje čtyři osoby, za něž se
    Peková ve své petici o milost přimlouvala: Luboš Volný, Jana Petéková a Iveta Křížová byli odsouzeni
    za „šíření poplašné zprávy" v souvislosti s covidovými výroky, čtvrtým je sám Zítko (trest „tři roky
    natvrdo"). Samostatně zmiňuje případ Tomáše Čermáka, odsouzeného na 5,5 roku vězení za obvinění z
    „teroristického činu" (nikoli šíření poplašné zprávy) za jeho vyjádření o „covid mafii", masových
    vrazích a genocidě — obvinění, které dle Zítka na vlasteneckém setkání v Příčovech nikdo nezmínil.'
  podtema: Trestní stíhání kritiků covidu
- id: zitko-2026-08-25-04
  typ: tvrzeni
  temata:
