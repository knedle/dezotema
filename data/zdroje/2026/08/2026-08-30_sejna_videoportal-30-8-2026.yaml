  nadpis: Sdílený klip z rozhovoru o životopisu 1987 — výzva přestat volit „novodobé komunisty" (Šejna,
    23. 8. 2026)
  text: '**30. 8.** — K nové zprávě, že Pavel nabídl premiérovi a ministrovi zahraničí koordinaci zahraniční
    politiky, Šejna opakuje tutéž tezi a doplňuje srovnání: pokud prezident argumentuje, že nejmenoval
    Filipa Turka ministrem kvůli jeho dřívějším (a nepotvrzeným) výrokům, sám by kvůli vlastní minulosti
    neměl mít právo do zahraniční politiky vůbec zasahovat — protože byl vyškolen jako rozvědčík a okrádal
    o tajné informace státy, které dnes označuje za spojence.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
