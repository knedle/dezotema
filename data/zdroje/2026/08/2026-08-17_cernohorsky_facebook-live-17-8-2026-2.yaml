- id: cernohorsky-2026-08-17-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Očkování těhotných žen a chybějící odškodňovací fond — kritika Babišovy vlády (Černohorský,
    17. 8. 2026)
  text: |-
    Černohorský vytýká Babišově vládě, že v době covidu doporučila očkování těhotných žen jako bezpečné — v kontrastu se standardní lékařskou opatrností vůči podávání běžných léků těhotným. Tvrdí, že vakcíny „bez ptaní" plošně aplikovali i seniorům v domovech důchodců, což dává do souvislosti s odhadem 35 tisíc zemřelých seniorů. Odmítá jako nedostatečnou Babišovu omluvu ve stylu „stala se chyba" — trvá na tom, že odpovědnost nesou politici, ne odborníci, a kritizuje, že navzdory tomu dosud nevznikl žádný státní odškodňovací fond pro poškozené.

    ⚡ **Poznámka:** Číslo „35 tisíc mrtvých seniorů" nelze ověřit z veřejně dostupných zdrojů.
  podtema: Volání po tribunálu
- id: cernohorsky-2026-08-17-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Facebook penalizoval výrok o Evě Decroix jako „podněcování nenávisti a násilí" (Černohorský,
    17. 8. 2026)
  text: 'Černohorský popisuje aktuální dočasnou blokaci: Facebook mu znemožnil normální fungování účtu
    (nefunkční zobrazování komentářů, propad dosahu) poté, co pod opakovaně sdíleným videem s ministryní
    Evou Decroix napsal, že pokud mu ho ještě někdo pošle, „zablokuje ho, nebo ho rovnou utopí" — doprovázeno
    emoji vody. Toto vyjádření bylo Facebookem vyhodnoceno jako podněcování k nenávisti a násilí. Označuje
    to za absurdní ve srovnání s běžně tolerovaným obsahem sociálních sítí.'
  podtema: Blokování na sociálních sítích
- id: cernohorsky-2026-08-17-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Skorumpovaný „mafiánský systém" — státní zastupitelství a bitcoinová kauza (Vrabel, 2. 6. 2026)
  text: '**17. 8.** — Černohorský nezávisle komentuje totéž odvolání státní zástupkyně z bitcoinové kauzy
    (viz výše) a rozšiřuje to na obecnou tezi o 37 letech beztrestnosti napříč všemi porevolučními vládami
    — zdůrazňuje, že žádná politická strana (přestože disponují dostatečnými finančními prostředky) si
    nikdy nenajala tým špičkových právníků, aby korupční kauzy skutečně dotáhl k odsouzení; z toho usuzuje,
    že jde o systémovou shodu zájmů napříč celým politickým spektrem, ne o neschopnost.'
  podtema: Demokracie a politický systém
- id: cernohorsky-2026-08-17-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: SPD neplní vlastní slib přímé demokracie ani ve vlastní straně — nekonzistentní politika vůči
    Ukrajincům (Černohorský, 17. 8. 2026)
  text: 'Černohorský kritizuje SPD za to, že navzdory tomu, že přímá demokracie a odvolatelnost politiků
    byly jedním z hlavních volebních témat strany, samotný předseda Tomio Okamura žádnou vnitrostranickou
    přímou demokracii nezavedl. Vyjadřuje zklamání, že se od vstupu SPD do vlády nic v tomto směru nezměnilo.
    Ke konkrétnímu Okamurovu oznámení o ukončení podpory Ukrajincům od 1. srpna namítá zásadní nekonzistenci:
    opatření se netýká zpětně stávajících Ukrajinců v ČR (podle něj 300–400 tisíc lidí, které označuje
    za zneužívající systém), ale jen nově příchozích — takže ti, kdo už v ČR páchají podle něj trestnou
    činnost a čerpají dávky, budou nadále podporováni, zatímco veřejnost tomu tleská jako splněnému slibu.'
  podtema: USA — volební systém
- id: cernohorsky-2026-08-17-08
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Hormonálně navozené kojení u trans rodičů a adopce dětí náhradním mateřstvím v zahraničí — „banda
    psychopatů" (Černohorský, 17. 8. 2026)
  text: Černohorský reaguje na sdílené video popisující praxi, kdy si transgender rodiče (muži identifikující
    se jako ženy) nechávají hormonálně navodit laktaci, aby mohli kojit dítě. Označuje to za zdravotně
    i eticky nepřijatelné, zvlášť v kontrastu s dřívější lékařskou opatrností vůči podávání léků těhotným
    ženám. Zmiňuje konkrétní znalé případy z ČR, kdy si mužské páry nechaly v zahraničí (kde je to legální)
    vyrobit dítě prostřednictvím náhradní matky. Rozšiřuje kritiku na Prague Pride obecně (veřejné projevy
    sexuality na ulici, nárůst pohlavně přenosných chorob v komunitě) a na genderovou ideologii — volá
    po zákazu těchto praktik a trestněprávním postihu (blázinec, kriminál) pro organizace, které je podporují,
    protože je považuje za škodlivé pro děti.
  podtema: Eutanazie
- id: cernohorsky-2026-08-17-09
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Zrušení základní vojenské služby jako počátek „destrukce společnosti" (Černohorský, 17. 8. 2026)
  text: 'Černohorský tvrdí, že klíčovým momentem rozkladu společnosti bylo zrušení povinné vojenské služby
    — od té doby podle něj přestali muži „být chlapy": popisuje současné třicátníky a čtyřicátníky jako
    změkčilé „mamánky" neschopné manuální práce. Kritiku směřuje oboustranně i vůči ženám (přehnaná sexualizace
    na sociálních sítích, OnlyFans) a uzavírá obecnou tezí, že 37 let porevoluční politiky žádný z těchto
    problémů neřešilo.'
  podtema: Eutanazie
- id: cernohorsky-2026-08-17-10
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: 'Větrné elektrárny: nerecyklovatelné materiály, 8 000 tun betonu, nelze odmontovat — Černohorský'
  text: '**17. 8.** — Černohorský opakuje tutéž technickou kritiku (beton, přístupové silnice pro těžkou
    techniku, nemožnost odstranění) a doplňuje finanční rozměr: vláda si připisuje zásluhu za snížení
    cen elektřiny o pouhých 10 %, přestože ceny předtím vzrostly řádově víc; solární dotace stojí státní
    rozpočet cca 40 mld. Kč ročně a větrné elektrárny podle něj představují stejný typ dotačního „průtokáče".
    Ptá se, kdo za 25 let ponese finanční zátěž likvidace betonových základů — s odpovědí, že to bude
    přeneseno na dnešní děti. Kritizuje také, že vláda místo skutečných řešení (odchod z Lipské burzy,
    podpora domácích zemědělců) jen pokračuje v rámci Evropské unie.'
  podtema: Technická a environmentální kritika
