  nadpis: Nákup 44 tanků Leopard 2A8 za 39 mld. Kč — „pojízdné rakve" (Rajchl, 26. 8. 2026)
  text: Rajchl kritizuje kontrakt ČR na nákup 44 tanků Leopard 2A8 za 39 miliard Kč s odkazem na článek
    o opuštěných západních tancích v lesích u Slovjansku a Kramatorsku (životnost tanku v boji 5–6 minut).
    S náklady na údržbu a provoz odhaduje reálnou cenu na trojnásobek, k tomu je nutná rekonstrukce silnic
    a mostů, protože nové tanky jsou o 16 tun těžší než předchozí model. Přepočítává, že minuta nasazení
    tanku v případě války by stála zhruba miliardu korun. Tvrdí, že jediným smyslem nákupu jsou zisky
    zbrojařských korporací, a žádá peníze místo toho investovat do zdravotnictví, školství, důchodů a
    rodin. Navazuje na svůj opakovaný argument o zbrojení jako korupci ([EU válečná ekonomika, 3. 5. 2026](/temata/nato-zbrojeni-militarizace.md#rajchl-2026-05-03-06)).
  citace:
  - text: Jediné, k čemu slouží ten nákup tanků z vašich daní, z vašich těžce vydělaných peněz, jsou obrovské
      zisky zbrojařských korporací.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
