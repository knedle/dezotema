  nadpis: Bohoslužba za Prague Pride v kostele — „pošlapávání křesťanské víry" (Šejna, 2. 8. 2026)
  text: Adam Šejna kritizuje konání bohoslužby ve jménu Prague Pride v kostele, kde ji navštívil — považuje
    to za disrespekt vůči křesťanům, kteří přišli na běžnou bohoslužbu a místo toho narazili na téma Pride
    festivalu. Netvrdí, že by komunita LGBT neměla mít pochopení, ale argumentuje, že pokud sama žádá
    respekt, musí respektovat i právo křesťanů říkat, že podle jejich víry „tohle nepatří do normálního
    života" a nepatří to „do domu páně".
