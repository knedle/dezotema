  nadpis: Útok mačetou ve švédské škole a video „Allahu Akbar" v metru — výzva jít do ulic a svrhnout
    vládu (Vrabel, 21. 8. 2026)
  text: 'Ke zprávě o útočníkovi s mačetou, který vnikl do švédské školy a zranil několik lidí (policie
    podezřelého zadržela), Vrabel dodává příklad virálního videa z newyorského metra: muž v bílém hábitu
    vběhne do vagónu, zakřičí „Alláhu akbar" a hodí tašku na sedadlo — cestující v panice utíkají ven,
    než odhalí, že šlo o žert („Bůh je velký"). Z obou příkladů vyvozuje, že jediná obrana proti podobným
    hrozbám je „okamžitě jít do ulic a sundat tuhle vládu" — odmítá argument, že je třeba dát současné
    vládě šanci, protože „vládne krátce", s tím, že správné vládnutí znamená okamžitě si u EU vynutit
    ukončení migračního paktu, jinak politici „tam nemají co dělat".'
- id: vrabel-2026-08-21-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Projev u Českého rozhlasu 21. 8. — Pavel jako pokrytec; vlastní revizionistický výklad invaze
    1968 (Vrabel, 21. 8. 2026)
  text: |-
    Vrabel reaguje na týž projev Petra Pavla u budovy Českého rozhlasu (viz Rajchlova kritika výše, nezávisle formulovaná o dva dny později) — Pavel v něm vyzval k obraně nezávislých médií, odkázal na jejich roli v roce 1968 a varoval před „agresivními a rozpínavými tendencemi dnešního Ruska". Vrabel tvrdí, že národ Pavla nenávidí ne za komunistickou minulost, ale za pokrytectví: sloužil bývalému režimu jako student vojenské rozvědky, „převlékl kabát" a dnes kritizuje ty, jimž sloužil, aniž by dokázal držet konzistentní názor.

    Dále rozvádí vlastní, dlouhodobě opakovanou revizionistickou tezi o invazi 1968: podle něj nešlo o potlačení Pražského jara, ale o reakci na hromadění zbraní a vojáků NATO na západní straně aliance (především v Bavorsku) — respektive o vojenskou nutnost Sovětského svazu dozbrojit dvě utajovaná úložiště jaderných zbraní na českém území (které nazývá „Javor 1" a „Javor 2") poté, co tehdejší československý režim nesplnil dřívější dohodu se SSSR. Invazi rámuje jako záchranu Československa před tím, aby se v roce 1968 odehrálo totéž, co v roce 1989 — tedy před předčasným přechodem pod vliv NATO — a jako menší zlo oproti hrozící eskalaci studené války. Zdroje k tomuto tvrzení označuje za neveřejné (bývalí funkcionáři, kteří odmítli vystoupit na kameru). Zároveň odmítá Pavlovo srovnání roku 1968 s Ruskem na Ukrajině 2022: mezinárodní právo dle něj nikdy neoznačilo Rusko za agresora (Rada bezpečnosti OSN takové rozhodnutí nevydala), takže jde jen o Pavlův soukromý politický názor, ne o právní fakt. Dodává, že skutečným „rozkradením" země po roce 1989 byl Západ/NATO, ne sovětská přítomnost do roku 1991, kdy ČR měla vlastní bankovnictví, průmysl a obchod.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-08-21-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Farizejové" Babiš, Okamura, Macinka a Rajchl jako horší pokrytci než Pavel (Vrabel, 21. 8.
    2026)
  text: 'V reakci na komentáře pod svým videem (kde diváci nazývají Pavla „farizejem") Vrabel obrací tezi:
    největšími farizeji jsou podle něj právě politici, kteří toto slovo sami používají — Jindřich Rajchl,
    Tomio Okamura, Andrej Babiš a Petr Macinka. Na rozdíl od Pavla, který je podle Vrabela „aspoň konzistentní"
    ve své proNATO a protiruské pozici, tito politici u voličů vytvářejí dojem, že jsou protiváhou vůči
    Fialově prozápadní politice a snaží se s Ruskem vztahy urovnat — ačkoli to sami nikdy explicitně netvrdili,
    jen se prezentují jako „opozice" vůči předchozí vládě. Jako důkaz uvádí, že ČR se pod jejich vládou
    v žebříčku „nepřátelských zemí" Ruské federace posunula z 10. místa (za Fialy) na 5. místo — tedy
    zhoršila se, místo aby se zlepšila, jak by odpovídalo image budované touto koalicí (viz [Dvojí metr
    v dodávkách zbraní](nato-zbrojeni-militarizace.md#dvojí-metr-v-dodávkách-zbraní--německo-se-stydí-čr-se-chlubí-vrabel-8-8-2026)).'
  podtema: Demokracie a politický systém
- id: vrabel-2026-08-21-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: EU „28. režim" pro firmy jako krok k federalizaci — vlastenecké strany to umožnily (Vrabel,
    21. 8. 2026)
  text: Evropská komise připravuje novou právní formu podnikání (tzv. „28. režim"), prezentovanou jako
    zjednodušení a digitalizace zakládání firem umožňující obchodovat jednotně napříč všemi 27 (+1) členskými
    státy. Vrabel tomu nevěří — jako protipříklad uvádí čerstvě zavedená unijní pravidla pro balení výrobků,
    která malým e-shopům podnikajícím přes hranice ukládají registraci a placeného zástupce v každé jednotlivé
    zemi (stovky eur navíc na zemi), což je pro drobné prodejce likvidační. Skutečným smyslem „28. režimu"
    je podle něj další krok v postupné globalizaci obchodního práva směřující k jednotnému evropskému
    trhu a nakonec k „spojeným státům evropským", v nichž by národní státy zanikly. Za to viní „silnou
    podporu" politiků prezentujících se jako vlastenečtí — Andreje Babiše, Petra Macinku, Tomia Okamuru,
    Jindřicha Rajchla a Zuzanu Majerovou — kteří podle něj svým sjednocením ve volbách „utopili" hlasy,
    jež by jinak šly proti EU, a nikdy referendum o vystoupení z EU/NATO nepodmínili účastí ve vládě.
  citace:
  - text: Kdyby jsme byli u moci my, [...] tohle by byla jediná věc, přes kterou by nejel vlak.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-08-21-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Dezerce ukrajinských vojáků z výcviku v Německu; drastické video mučení vlastních vojáků (Vrabel,
    21. 8. 2026)
  text: |-
    Německý deník Die Zeit informoval, že v Sasku a Sasku-Anhaltsku úřady evidují zhruba 80 případů, kdy ukrajinští vojáci opustili výcvik v Německu — jako důvody uváděli obavu z nasazení na frontě, snahu vrátit se k rodinám nebo konflikty s nadřízenými (od roku 2022 prošlo výcvikem v Německu přes 29 000 ukrajinských vojáků). Vrabel to považuje za pochopitelné vzhledem k tomu, „co jim tam dělají" — v ČR je podle jeho odhadu vedeno trestní řízení kvůli neoprávněnému opuštění posádky proti čtvrt milionu Ukrajinců. Pouští divákům bez předchozího varování drastické video, které popisuje jako záznam toho, jak ukrajinská armáda zachází s vlastními vojáky — svazování ke stromu, polévání moči, vláčení za autem přivázaným lanem až k smrti — a tvrdí, že podobné praktiky se dříve používaly i civilně (např. veřejné potrestání zlodějů v obchodech) se souhlasem policie, a že týrání vojáků na frontě probíhá se souhlasem/schválením velitelů jednotek. Z toho vyvozuje obecné hodnocení „jejich mentality" a spojuje to s tím, že v ČR žije oficiálně půl milionu, neoficiálně až dva miliony Ukrajinců.

    ⚡ **Poznámka:** Tvrzení o systematickém mučení vojáků se schválením velitelů je založeno na jednom nepopsaném a needatovaném videu bez ověřitelného kontextu (zdroj, místo, okolnosti natočení neuvedeny) a je zobecněno na hodnocení celého národa.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-08-21-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: '⚡ Konflikt (obrácená role): Tusk by měl být uvězněn za schvalování sabotáže Nord Streamu (Vrabel,
    21. 8. 2026)'
  text: 'Polský premiér Donald Tusk zopakoval svůj dlouhodobě kritický postoj k Nord Streamu — podle něj
    by se měli stydět ti, kdo umožnili jeho výstavbu, ne ti, kdo plynovod vyřadili z provozu (sabotáží
    2022); zároveň odmítl měnit názor v souvislosti s vyšetřováním sabotáže. Vrabel — s odkazem na vlastní
    právnické vzdělání a závěrečnou práci na trestní činy — tvrdí, že Tuskův výrok naplňuje skutkovou
    podstatu trestného činu: schvaluje teroristický útok na strategickou energetickou infrastrukturu státu,
    a jako vysoký státní představitel by za takový veřejný výrok měl skončit ve vězení. (Role je zde obrácená
    oproti Rajchlově kritice Pavla výše — tam byl terčem kritiky ten, kdo NEschvaloval útok jako legitimní
    vojenský cíl; zde Vrabel kritizuje Tuska za to, že sabotáž fakticky schvaluje.)'
  podtema: Zahraniční aktéři a precedenty
