  nadpis: Rekordní zisky ropných firem (93 mld. $) — je Trump zachránce USA, nebo nástroj jejich rozkladu?
    (Vrabel, 21. 8. 2026)
  text: Osm největších ropných producentů (Exxon Mobil, Chevron, Shell aj.) vykázalo ve druhém čtvrtletí
    dohromady zisk téměř 93 miliard dolarů — zhruba dvojnásobek oproti stejnému období loňského roku,
    což vyvolalo kritiku politiků i ekologů. Donald Trump zisky označil za příliš vysoké a vyzval firmy
    ke snížení cen pohonných hmot; v Kongresu se diskutuje o mimořádném zdanění jejich zisku. Vrabel je
    přesvědčen, že Trump takto jedná záměrně, ale váhá nad motivem — buď jde o předvolební taktiku před
    podzimními volbami (svalit vinu za drahý benzín na ropné firmy), nebo je to jeden z dílčích kroků
    širší otázky, zda Trump skutečně chrání ekonomiku USA, nebo naopak — ať vědomě, či jako nástroj „globalistů"
    — urychluje její rozklad. Spojuje to s krokem amerického ministerstva financí (nákup dvojnásobného
    objemu dlouhodobých státních dluhopisů, čímž klesly jejich výnosy a prudce oslabil dolar) a rekordním
    veřejným dluhem USA nad 40 bilionů dolarů — v reakci na oslabení dolaru očekává příchod „správného
    času" nakupovat kryptoměny, což plánuje potvrdit divákům po víkendu.
  podtema: Elektřina — marže a ceny
