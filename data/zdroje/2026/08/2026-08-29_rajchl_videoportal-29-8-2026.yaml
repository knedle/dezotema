  nadpis: Petr Pavel a „paralelní zahraniční politika" — srovnání s polskou kohabitací (Rajchl, TV debata
    na Primě, 29. 8. 2026)
  text: 'V televizní debatě Rajchl kritizuje prezidenta Pavla za to, že při návštěvě Ukrajiny přislíbil
    dodávku letounů L-159, aniž by to s kýmkoli v ČR předem projednal — označuje to za „totální podraz
    bez skrupulí" a jako předpoklad možné budoucí shody „týmu Česká republika" (o niž usiluje Pavel) žádá,
    aby prezident přestal vést vlastní zahraniční politiku nezávislou na vládě. Srovnává českou situaci
    s polskou kohabitací prezidenta Nawrockého a premiéra Tuska: ačkoli mezi nimi panuje podobné napětí,
    v klíčových momentech (migrace, odsouzení Zelenského pojmenování jednotky po UPA) se dohodnout dokážou
    — na rozdíl od ČR — protože by polští občané politikům jednajícím proti národním zájmům okamžitě dali
    najevo nesouhlas. Opakuje odmítnutí eura, zrušení práva veta a „Spojených států evropských" jako fakticky
    likvidaci suverenity ČR a argumentuje, že vstup do EU v letech 2004–2005 byl jen politickým „výhledem",
    ne závazkem — po 21 letech (Lisabonská smlouva, migrační pakt, Green Deal, tedy změny, které při vstupu
    neexistovaly) mají občané právo svůj vztah k EU přehodnotit.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
