vyroky:
- id: vrabel-2026-08-26-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Evropský prokurátor zahájil trestní řízení kvůli dotacím Agrofertu (Vrabel, 14. 7. 2026)
  text: '**26. 8.** — Vrabel k novému případu (tři menší firmy z holdingu — Agro Rosochy, Zeus Brnížov,
    Lužánská zemědělská — mají podle platebních rozkazů okresních soudů vrátit Podpůrnému garančnímu rolnickému
    a lesnickému fondu téměř 1,4 mil. Kč za porušení pravidel střetu zájmu v letech 2017–2021, firmy podaly
    odpor; fond celkem vymáhá 22 mil. Kč od 25 spřízněných firem Agrofertu) opakuje a rozvádí svou tezi
    o Babišově střetu zájmu: vložení Agrofertu do svěřeneckého fondu neznamená, že ho Babiš neřídí nepřímo,
    a hlavně z něj má prokazatelný užitek — firmu jednou zdědí jeho děti a průběžně z ní plynou zisky.
    Zdůrazňuje, že to neznamená podporu žádné vládní ani opoziční strany (ODS, STAN, Motoristé) — všechny
    označuje za „mafiánské" a zkorumpované stejně jako Babiše.'
  podtema: Agrofert a dotace EU
- id: vrabel-2026-08-26-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Pevnost Amerika" / TechNate — USA stahuje techniku z NATO, ždímání světa přes digitální měny
    (Vrabel, 5. 6. 2026)
  text: '**26. 8.** — K úvaze Donalda Trumpa přejmenovat Ontarijské jezero (na hranici s Kanadou) na „Lake
    America" Vrabel dodává, že technokraté už ve 30. letech minulého století nakreslili mapu plánovaného
    „technátu" — sahajícího od Bolívie přes Mexiko, celý záliv, USA, Kubu a Kanadu až po Grónsko. Jako
    důkaz reálného vlivu této technokratické skupiny dnes jmenuje konkrétní osoby na vysokých pozicích:
    Elona Muska, J. D. Vance, Petera Thiela a Alexe Karpa (Palantir).'
  podtema: Globalistická agenda a další výklady
- id: vrabel-2026-08-26-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Bill Gates přiznal, že ho AI předčila v programování — WHO, eugenika a transhumanismus (Vrabel,
    26. 8. 2026)
  text: 'Bill Gates v rozhovoru pro New York Times přiznal, že současné systémy umělé inteligence ho v
    programování „do značné míry překonaly", a označil AI za jeden z nejnebezpečnějších nástrojů, jaké
    lidstvo vytvořilo. Vrabel na to reaguje nedůvěrou vůči samotnému Gatesovi: připomíná, že Gates je
    druhým největším sponzorem WHO a jako soukromá osoba se „Significant Control" má přístup k jednáním
    o pandemické smlouvě a mezinárodních zdravotnických předpisech (IHR), přestože tam nemají přístup
    ani volení poslanci jednotlivých zemí — dokládá tím své starší tvrzení, že WHO je fakticky soukromá,
    ne veřejná organizace. Poukazuje na to, že Gates zároveň vydělal obrovské peníze na vakcínách a skupuje
    nejvíc zemědělské půdy v USA, a připomíná jeho dlouhodobý zájem o eugeniku. Propojuje to s tématem
    transhumanismu (zmiňuje Muskův Neuralink) jako možným cílem „velkého resetu": AI podle něj nemusí
    být nebezpečná tím, že by dosáhla singularity, ale tím, že je v rukou lidí jako Gates, kteří ji mohou
    použít k tomu, aby obyčejným lidem vnutili potřebu technologických „vylepšení" a získali nad nimi
    absolutní kontrolu (sledování skrze telefony a datová centra).'
  citace:
  - text: Bill Gates nás měl varovat před Billem Gatesem.
  podtema: Globalistická agenda a další výklady
- id: vrabel-2026-08-26-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Ceuta: sexuální napadení nezletilých migrantů jako „kulturní" jev — apel na ochranu dětí (Vrabel,
    10. 8. 2026)'
  text: '**26. 8.** — Vrabel se sám opravuje: dřívější tvrzení, že Lex Ukrajina 7 přinesla „nová" (Babišova)
    vláda, nebylo přesné — šlo jen o prodloužení novelou z května 2026 toho, co zavedla už vláda předchozí.
    Zároveň upřesňuje, že vláda rozhodla samostatně (mimo Lex Ukrajina) i o zvláštním dlouhodobém pobytu
    pro Ukrajince: zatímco pobyt na základě dočasné ochrany se do pětiletého požadavku pro občanství počítá
    jen z poloviny, při přechodu na tento nový status se počítá celý čas. Zdůrazňuje, že obě vlády (předchozí
    i současná) v tomto ohledu prosazují stejnou linii — umožnit Ukrajincům trvalý pobyt v ČR.'
- id: vrabel-2026-08-26-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: EU odmítla zaregistrovat iniciativu Save Europe Act; migrační pakt jako nevyhnutelnost (Vrabel,
    23. 7. 2026)
  text: '**26. 8.** — Vrabel cituje vyjádření Tomia Okamury z Příčovy, že vláda se rozhodla migrační pakt
    „platit" (finančně přispívat, ale nebrat migranty) — což podle Vrabela potvrzuje jeho vlastní prosincovou
    předpověď, že žádné skutečné odmítnutí paktu nenastane, jen silné prohlášení. Dodává, že EU nenechá
    ČR takto platit dlouho a migranti nakonec začnou přijíždět stejně — jediným řešením zůstává vystoupení
    z EU — [Facebook Live 26. 8. 2026](_zdroje.md#ladislav-vrabel--facebook-live-26-8-2026)'
- id: vrabel-2026-08-26-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'AfD Weidelová: uzavření hranic a plán vrátit syrské uprchlíky — Německo v „nezvratném rozkladu"
    (Vrabel, 26. 8. 2026)'
  text: 'Šéfka německé AfD Alice Weidelová v rozhovoru pro ZDF ostře kritizovala migrační politiku a bezpečnostní
    situaci v Německu — ženy se podle ní bojí chodit ven kvůli útokům noži a skupinovým znásilněním páchaným
    migranty ze Sýrie a Afghánistánu. AfD chce uzavřít německé hranice a je připravena prosazovat i vystoupení
    Německa ze Schengenu; zvažuje také hromadné vracení asi 1,3 milionu syrských uprchlíků, což by byl
    v Evropě precedens. Vrabel k tomu dodává vlastní hodnocení: vystoupení ze Schengenu Německu nepomůže
    a rozklad západní Evropy (kvůli demografii a migrantům s občanstvím, kteří mají mnoho dětí) už nelze
    zvrátit — čeká „velmi tvrdý konflikt, kde poteče hodně krve". Staví do kontrastu Českou republiku,
    která díky rozhodnutí z roku 2015 nepustit migranty z islámských zemí pořád má šanci se tomuto scénáři
    vyhnout, pokud se lidé „znovu probudí" — narůstajícím problémem ČR je jen migrace z Ukrajiny.'
- id: vrabel-2026-08-26-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Ohlášení veřejného shromáždění „Člověk na prvním místě" (3. 10. 2026) — bez politiků s placenou
    funkcí (Vrabel, 9. 8. 2026)
  text: '**26. 8.** — V reakci na komentáře, které chystané shromáždění 3. 10. označují za protivládní
    demonstraci (mj. Petr Hájek z Protiproudu navrhující spojení s Milionem chvilek), Vrabel odmítá, že
    by šlo o akci namířenou proti konkrétním politikům či stranám (Babišovi, motoristům) nebo o podporu
    jiných: zdůrazňuje, že „člověk není na prvním místě" pro žádnou z dosavadních vlád (ani ODS, ani současnou),
    a cílem je změna celého systému bez závislosti na bohatých elitách, ne výměna jedné garnitury za druhou.'
  podtema: USA — volební systém
- id: vrabel-2026-08-26-08
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Trumpův zákaz genderové výuky na školách — jedna dobrá věc uprostřed „katastrofy" (Vrabel, 26.
    8. 2026)
  text: 'Donald Trump prohlásil, že americké veřejné školy byly varovány: pokud budou dětem tvrdit, že
    jsou „uvězněné v nesprávném těle", bude to jeho administrativa považovat za zneužívání dětí. Vrabel
    s tímto konkrétním krokem souhlasí („po dlouhé době něco, pod co bych se podepsal") a přirovnává ho
    i ke snížení počtu povinných dětských vakcín v USA (ze 17 na 11). Rámuje ho ale jako výjimku v širším
    vzorci, kdy vlády „naoko" udělají pár populárních kroků, aby zakryly horší kroky v oblasti globalismu
    a válek — přirovnává to k tomu, jak si Tomio Okamura přivlastnil Vrabelovo dlouhodobé téma české koruny
    v ústavě jako vlastní nový požadavek.'
  podtema: Eutanazie
- id: vrabel-2026-08-26-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Pokus o žhářský útok na muniční továrnu — zadrženi 2 Lotyši a Ukrajinec, ne „čučkaři" (Vrabel,
    26. 8. 2026)
  text: K dříve avizovanému žhářskému útoku na továrnu vyrábějící drony Vrabel doplňuje, že byli zadrženi
    dva lotyšští občané (jeden v Německu, jeden na Slovensku) a jeden Ukrajinec. Krátce konstatuje, že
    tedy nešlo o žádné náhodné výtržníky („čučkaři"), ale znovu o Ukrajince — bez dalšího rozvedení, protože
    o motivu útoku nemá kromě mediálních zpráv žádné další informace.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-26-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Kosovo a Metochie — útlak Srbů má být vyřešen po skončení války na Ukrajině (Vrabel, 25. 8.
    2026)
  text: '**26. 8.** — Vrabel rozvíjí obecnou tezi „historického práva" na území: namísto mezinárodněprávních
    konceptů (územní celistvost, sebeurčení) navrhuje kritérium, kdo na daném území dlouhodobě žije, hospodaří
    a buduje stát. Aplikuje ji na tři případy současně — Kosovo a Metochie historicky patří Srbům (Albánci
    tam přišli jako pozdější přistěhovalci), Donbas a Krym patří Rusům (jako historicky rusky osídlené
    oblasti), zatímco zbytek dnešní Ukrajiny (vzniklé až 1991) má právo na vlastní stát jen tam, kde se
    místní obyvatelstvo samo hlásí k ukrajinské identitě. Očekává, že v důsledku podobných sporů dojde
    k celkovému „přerozdělování světa" a kreslení nových map.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-26-12
  typ: predikce
  temata:
  - migrace
  nadpis: Ukrajina se na podzim zhroutí kvůli ruské ofenzivě a nedostatku energií
  text: V souvislosti s návštěvou šéfa CIA Radcliffa v Moskvě Vrabel odhaduje, že ukrajinská armáda dále
    kolabuje (nedostatek vojáků, munice, protivzdušné obrany) a že na podzim 2026 zahájí Rusko těžkou
    ofenzivu, na niž už Ukrajina nebude mít energetické ani obranné kapacity — v důsledku toho může „velmi
    rychle" dojít ke zhroucení Ukrajiny.
  citace:
  - text: Vidíme, že Ukrajina se blíží k kolapsu, protože co se týče podzimu, tak rusové jim dají nějakou
      těžkou ofenzivu... a prostě může velmi rychle skončit.
  predikce:
    horizont: podzim 2026
    stav: ceka
