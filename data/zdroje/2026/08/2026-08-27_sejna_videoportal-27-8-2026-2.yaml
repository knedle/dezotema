  nadpis: Vláda nepopírá klima, jen odmítá politiku ničící průmysl — odpověď „panu Klusovi" (Filip Turek,
    sdílené video, 27. 8. 2026)
  text: 'Filip Turek reaguje na výrok (přisuzovaný „panu Klusovi"), že kdo popírá klimatickou změnu, je
    „hloupý, nebo zaplacený". Odmítá to jako nepravdivé zjednodušení: současná vláda podle něj změnu klimatu
    nepopírá, jen odmítá politiku, která pod záminkou její záchrany ničí evropský průmysl a zdražuje život
    lidem. Argumentuje, že EU produkuje jen asi 6 % světových emisí skleníkových plynů, přesto má jedny
    z nejpřísnějších klimatických pravidel na světě — což vede k vytlačování výroby mimo Evropu a jejímu
    dovozu ze zemí s mírnějšími ekologickými standardy, aniž by to planetě pomohlo. Odpovědnost za současné
    důsledky Green Dealu klade na předchozí vládu, která evropskou zelenou politiku prosazovala. Kritiku
    každého nesouhlasu s Green Dealem jako hlouposti nebo korupce označuje za urážku, ne argument.'
  podtema: EU a Green Deal
