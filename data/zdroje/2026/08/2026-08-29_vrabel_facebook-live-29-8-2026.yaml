- id: vrabel-2026-08-29-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Druhá světová válka jako „válka proti Slovanům", Rockefellerové financovali Hitlera i Zelenského
    (Vrabel, 25. 8. 2026)
  text: '**29. 8.** — Vrabel rozvíjí tutéž tezi u zprávy, že americký ministr financí Scott Bessent ve
    svém příspěvku pro Financial Times o Teheránské konferenci (1943) zmínil jen Roosevelta a Churchilla
    a opomněl Stalina (na což upozornil až čtenář z Oxfordu). Vrabel to označuje za „nebetyčnou drzost"
    — zdůrazňuje, že o výsledku 2. světové války rozhodl především Sovětský svaz (bitva u Stalingradu),
    zatímco zásluhy Británie a USA jsou ve srovnání „zanedbatelné". Opakuje tezi, že šlo o „válku globalistů
    proti Slovanům", v níž bylo Německo jen „prostředníkem" financovaným globalisty — stejně jako je dnes
    prostředníkem Ukrajina — a že kdyby SSSR válku nevyhrál, globalisté by dnes ovládali i východní Evropu
    (Sovětský svaz), stejně jako už ovládají Spojené státy a západní Evropu.'
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-08-29-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Essex nasazuje soukromé hlídky proti migrantům v azylovém centru — analogie islamizace s Mohamedem,
    Kosovem a Sýrií (Vrabel, 29. 8. 2026)
  text: Ke zprávě, že v anglickém hrabství Essex budou v azylových centrech (Wethersfield, kapacita se
    má zvýšit z ~800 na 1245, max. 1700 osob) nově působit soukromé bezpečnostní hlídky (Operation Vanguard)
    kvůli obavám místních, zejména žen, z každodenních přesunů skupin migrantů do okolních měst, Vrabel
    čerpá z vlastní roční zkušenosti života v Británii. Tvrdí, že země je „zislamizovaná" (starostové
    největších měst, včetně Londýna, jsou muslimové) a že v Británii operuje na 400 paralelních islámských
    soudů podle práva šaría vedle britského soudního systému (od článku, který sám překládal kolem roku
    2010). Islamizaci popisuje jako opakující se historický vzorec podle vzoru Mohameda v Medíně (postupné
    etablování, pak převzetí moci a vyvraždění odporu) — u 5 % muslimské populace v zemi prý začíná tlak
    na zavedení práva šaría, u 20 % dochází k plnému obratu země na islámskou; jako příklady uvádí Kosovo
    (vyhnání původního obyvatelstva), Sýrii a Egypt (90. léta „harmonie" vystřídané „brutálními čistkami"
    křesťanů). Cituje video, kde muslimští migranti oznamují obyvateli domu (podle Vrabela možná Židovi),
    že barák „dostanou" — ne dnes, ale časem. Uzavírá, že totéž čeká i ČR, pokud neuzavře hranice a nevystoupí
    z EU, a opakuje tezi, že vláda migrační pakt fakticky neodmítla, protože nepodnikla žádné kroky k
    vyloučení ČR z jeho vymahatelnosti.
- id: vrabel-2026-08-29-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Ohlášení veřejného shromáždění „Člověk na prvním místě" (3. 10. 2026) — bez politiků s placenou
    funkcí (Vrabel, 9. 8. 2026)
  text: '**29. 8.** — Vrabel opakuje a doplňuje katalog nesplněných slibů novým rámováním: zahraniční
    politika Petra Fialy, Petra Pavla (Hradu) i současné vlády Andreje Babiše je podle něj „bez výjimek
    naprosto totožná" — liší se jen v tom, co se veřejnosti říká, nikoli v hlasování a prosazované politice
    (jaderný deštník od Francie, podpora NATO, plnění zbrojního průmyslu, podpora Ukrajiny). Jako doklad
    uvádí, že SPD/ministr obrany Zůna nikdy neumožní referendum o vystoupení z NATO/EU, a že Pavel s Babišem
    si k dohodě o francouzském jaderném deštníku „notovali" postupně (Pavel v březnu, Babiš o dva měsíce
    později) — a přesto Babiš následně schválil dalších 40 mld. pro Ukrajinu.'
  podtema: USA — volební systém
- id: vrabel-2026-08-29-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ruský dronový útok na muniční sklad zabil 37 lidí — logický vojenský cíl (Vrabel, 29. 8. 2026)
  text: Podle agenturní zprávy zahynulo při nočním ruském dronovém útoku na sklad v ukrajinské obci Mila
    nejméně 37 lidí a dalších 42 bylo zraněno, evakuováno bylo přes 380 osob; poškozeno bylo nejméně 50
    obytných budov včetně domova pro seniory. Zelenskyj uvedl, že ve skladu byly munice, drony a výbušniny,
    jejichž následné exploze rozšířily škody. Vrabel komentuje, že si nedokáže představit, že by Rusko
    neútočilo na muniční sklady a podobná zařízení, až se konflikt „rozjede víc", a varuje diváky žijící
    poblíž takových zařízení, aby s tím počítali.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-29-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: NATO není připraveno na válku s Ruskem — kritika velvyslance Koneckého (Vrabel, 29. 8. 2026)
  text: 'Český velvyslanec při NATO David Konecký prohlásil, že aliance je schopna okamžitě a účinně bránit
    každý kus svého území proti případnému ruskému útoku, byť rozsáhlý konflikt v nejbližších letech nepředpokládá.
    Vrabel to označuje za nesmysl a nazývá ho „psychopatem" (→ [stochastický teror](stochasticky-teror.md)):
    NATO podle něj nemá funkční protivzdušnou obranu (odkazuje na neschopnost sestřelovat i jen drony
    přelétávající nad územím EU) ani dostatek vojáků navzdory 550 milionům obyvatel Evropy. Poukazuje
    na ekonomickou neudržitelnost obrany proti levným dronům a raketám (vzlet stíhačky stojí čtvrt milionu
    eur, dron 10 tisíc eur) a na to, že proti ruským zbraním jako Buerevestnik, Sarmat, Kinžál nebo Orešnik
    nemá Aliance žádnou obranu. Zmiňuje také plánovanou továrnu na drony na Slovensku jako nebezpečnou
    eskalaci. Nabízí dvě možná vysvětlení pokračujícího zbrojení: buď jde (podobně jako v Orwellově „1984")
    o nástroj neustálé války k udržení kontroly nad vlastním obyvatelstvem skrze strach a ekonomický tlak,
    nebo o reálnou přípravu na válku s Ruskou federací — vzhledem k tomu, že se boje již přenesly na ruské
    území, přiklání se spíše k druhé variantě.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-08-29-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Smrt Radko Mladiće — revizionistický výklad Srebrenice, Joe Biden jako strůjce bosenské války
    (Vrabel, 27. 8. 2026)
  text: '**29. 8.** — Vrabel navazuje zprávou, že policie prověřuje vyjádření zástupce šéfredaktora Parlamentních
    listů Radima Panenky k Mladičově úmrtí — Panenka zpochybnil spravedlnost procesu a označil jeho odsouzení
    za výsledek „politizovaného tribunálu". Vrabel se staví na jeho stranu a srovnává Haagský tribunál
    s podobnými mezinárodními soudy, které podle něj slouží k perzekuci „antiglobalistických" politických
    oponentů. Nabízí vlastní teorii, proč musela být Jugoslávie rozbita: v 80. letech dávala coby vojensky
    neutrální stát dohromady další neutrální země (hnutí nezúčastněných, do NATO ani východního bloku),
    což podle Vrabela představovalo nebezpečný precedens — dnes prý stejnou roli hraje vojensky neutrální
    Srbsko, které pořádá obdobná setkání „nezúčastněných" zemí. Avizuje připravované video s advokátem
    Goranem Petronjevičem (obhájcem Miloševiće) reagující na rozhovor bývalého plukovníka americké armády
    Douglase McGregora, který měl veřejně pojmenovat konkrétní americké, německé a další důstojníky a
    politiky podílející se na rozbití Jugoslávie v 90. letech.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-29-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo chystá tvrdší opatření proti Rusku — spekulace o „false flag" u incidentu v Halle (Vrabel,
    29. 8. 2026)
  text: 'K agenturní zprávě, že německá vláda (kancléř Friedrich Merz) připravuje nová opatření proti
    ruským subjektům (reakce mj. na srpnový incident s dronem u letiště Halle) a že se souběžně v Bruselu
    chystá další sankční balík EU, Vrabel poznamenává, že Rusko už dříve ústy Marie Zacharovové a Sergeje
    Lavrova avizovalo, že eskalující zapojení Británie do konfliktu je jen otázkou času, než na ni Rusko
    zareaguje stejným způsobem — a že Německo teď nechce zůstat pozadu. K incidentu v Halle dodává vlastní
    spekulaci: šlo o letadlo naložené zbraněmi, u kterého byl nalezen a zneškodněn dron/výbušnina — připouští,
    že mohlo jít o ruský pokus zničit zbraně mířící na ruské území, ale stejně tak o „false flag" operaci
    pod cizí vlajkou, kterou si Němci zinscenovali, aby ukázali útok Ruska na jejich letadlo. Zároveň
    upozorňuje na politický kontext v pozadí — blížící se zemské volby v jedné ze spolkových zemí (podle
    něj v Sasku), kde má vyhrát AfD, a snahu ostatních stran a spolkové vlády tomu zabránit, což označuje
    za popření demokracie.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-29-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Fico na oslavách SNP: „bez Ruska není mír v Evropě" — Vrabel souhlasí (29. 8. 2026)'
  text: Robert Fico na oslavách 82. výročí Slovenského národního povstání prohlásil, že v Evropě nelze
    zajistit bezpečnost a mír bez Ruska, že EU potřebuje více diplomacie a méně zbraní a rusofobie a že
    nacismus „zůstal v hlavách lidí". Vrabel s ním souhlasí a odmítá představu EU jako „mírového projektu".
    V návaznosti opakuje ohlášení vlastního veřejného shromáždění 3. 10. na Malostranském náměstí (tentokrát
    ne přímo „za urovnání vztahů s Ruskou federací" jako minule, ale se stejným cílem) a chystaného dokumentu
    adresovaného Ruské federaci s ujištěním, že Česká republika s ní nechce konflikt.
  podtema: Zahraniční aktéři a precedenty
