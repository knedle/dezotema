  nadpis: UFO poblíž letadla při seskoku padákem (Boldy, 23. 8. 2026)
  text: Boldy popisuje, že při skoku volným pádem u Kunovic jeho přítelkyně vyfotila a natočila „neidentifikovatelný
    létající objekt" — kulovité těleso, které prolétlo poblíž jejich letadla v odhadované výšce kolem
    tří kilometrů. Vylučuje, že by šlo o vrtulník, letadlo nebo dron, a slibuje detailnější rozbor fotografií
