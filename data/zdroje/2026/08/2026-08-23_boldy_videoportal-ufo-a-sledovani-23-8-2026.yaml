  text: '**23. 8.** — Boldy tvrdí, že mu od chvíle, kdy se začal tématem klubu Dialog zabývat (asi dva
    týdny), opakovaně selhává kamera na notebooku — přestože zkoušel restart a různá řešení, kamera vydrží
    funkční jen několik minut, než se znovu vypne. Uvádí, že mu (blíže nespecifikovaná) aplikace ukázala,
    že ho sledují další čtyři neznámá zařízení. Dává si to do souvislosti s vlastním výzkumem klubu a
    slibuje pokračování tématu v příštím vysílání.'
