  nadpis: Trestní oznámení na Petra Fialu za „přípravu útočné války" (Zítko, 7. 8. 2026)
  text: '**8. 8.** — Zítko čte kompletní text obou trestních oznámení (na Fialu a v bitcoinové kauze)
    a jako „důkaz" k oznámení na Fialu pouští klip z jeho vlastního TV vystoupení o rozsahu vojenské pomoci
    Ukrajině (89 tanků, 226 bojových vozidel, munice v hodnotě 10 mld. Kč) — z Fialovy věty, že „ČR se
    ještě před vypuknutím ruské agrese rozhodla darovat munici", dovozuje důkaz přípravy útočné války,
    ačkoli věta samotná jednoznačně neurčuje přesné datum ani rozsah před 24. 2. 2022. V bitcoinové kauze
    doplňuje jméno velitele NCOZ jako „podplukovník Brejcha" — zbytek (soupis podezřelých, částky, blockchain)
    je opakování beze změny.'
  podtema: TV debata Rajchl vs. Grolich — zemědělské dotace a cena elektřiny (29. 7. 2026)
