  nadpis: Kritika Petra Pavla — vlajka, drahé vstupenky a opakovaná narážka na plat (Černohorský, 28.
    8. 2026)
  text: 'Černohorský pokračuje v dlouhodobé kritice Petra Pavla: připomíná, že prezident při startu nějakého
    závodu použil státní vlajku způsobem, který srovnává s „vytíráním silnice" — v kontrastu s dřívějším
    pobouřením kolem jiného nedopatření se státní vlajkou. Zmiňuje, že vstupenky na veřejné setkání s
    prezidentem měly stát 5 000 Kč. Opakuje svou obvyklou narážku, že Pavel není schopen „uživit manželku"
    z prezidentského platu.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Kritizován za použití státní vlajky při startu závodu; drahé vstupenky (5000 Kč) na veřejné
      setkání; opakovaná narážka na neschopnost „uživit manželku"
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-08-28-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Kritika zadlužení za Fialovy vlády a návrh zrušit ODS, STAN, Piráty, KDU-ČSL a TOP 09 (Černohorský,
    27. 8. 2026)
  text: '**28. 8.** — Černohorský se k tématu vrací obšírněji: celkový státní dluh (blížící se 4 bilionům
    Kč, roční obsluha 100–140 mld. Kč) přičítá výhradně Fialově vládě — „kdo se první utrhl ze řetězu,
    byla právě ta Fialová vláda" — a označuje za pokrytecké, že tatáž opozice teď napadá u Ústavního soudu
    hospodaření vlády Babiše. Přirovnává to k domácnosti, která šetří tak, že chodí kázat úspory sousedovi
    místo toho, aby začala u sebe — v tomto duchu zmiňuje i příklad radních Prahy 1/2, kteří prodali 12
    000 parkovacích karet na jen 9 000 skutečných míst. Vlastní dřívější vulgární označení političek nahrazuje
    na žádost kamarádky eufemismem „kosočtverec bez čárky" a v tomto duchu navrhuje přejmenovat Českou
    republiku na „banánový absurdistán" (s cedulí na hranicích i v němčině).'
  podtema: USA — volební systém
- id: cernohorsky-2026-08-28-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Podrobný rozbor poslaneckých platů a náhrad — „ať začnou šetřit u sebe" (Černohorský, 28. 8.
    2026)
  text: |-
    V reakci na vlastní téma šetření státního rozpočtu Černohorský podrobně rozebírá příjmy poslanců: základní plat řadového poslance pro rok 2026 činí 106 433 Kč (násobeno koeficientem valorizace 1,08), k tomu přistupují paušální náhrady (na ošacení, stravné, dopravu) v řádu desítek tisíc korun měsíčně, které jsou dle něj vypláceny v čistém, bez zdanění a bez sociálního/zdravotního pojištění a bez nutnosti cokoli dokládat — poslanec tak reálně utratí jen zlomek z paušálu na dopravu a zbytek si ponechává. Celkový měsíční příjem takto dosahuje řádově 180 000–200 000+ Kč čistého, přičemž poslanci v hlavním sále Sněmovny v roce 2025 zasedali jen asi 70–75 dní. Doplňuje, že výkon poslaneckého mandátu podle ústavy (čl. 26–27) není právně „prací" ani „zaměstnáním" a nevztahuje se na něj zákoník práce ani osobní odpovědnost za hlasování — což používá jako vysvětlení, proč si poslanci mohou dovolit i pít alkohol v budově Sněmovny. Uzavírá, že pokud politici chtějí skutečně šetřit, měli by začít těmito vlastními výhodami, ne škrty u občanů.

    ⚡ **Poznámka:** Konkrétní částky paušálních náhrad a jejich zdanění nelze ověřit z veřejně dostupných zdrojů v podobě, v jaké je Černohorský prezentuje.
  podtema: USA — volební systém
- id: cernohorsky-2026-08-28-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vlastní politická vize „Čest Svoboda Respekt" — decentralizované společenství místo politiky
    (Černohorský, 28. 8. 2026)
  text: |-
    Černohorský představuje svou alternativu k tradičním politickým stranám: spolek/společenství „Čest Svoboda Respekt" s vlastním rozpočtem nezávislým na státu (inspirovaným organizační strukturou KSČ), rozděleným do decentralizovaných „buněk" po celé republice, s cílem prosadit celostátní referendum. Slibuje, že případný poslanecký plat by z poloviny posílal na transparentní účet. K tomu navrhuje federativnější uspořádání ČR se zahrnutím symbolů Moravy a Slezska do státní vlajky jako reakci na „pragocentrismus". Kritizuje současný systém sběru podpisů pod peticemi (elektronické petice bez podpory známé osobnosti nebo poslance jsou dle něj k ničemu) a tvrdí, že členská základna jeho společenství (11 000+ lidí) by dokázala rychle nasbírat 10 000 podpisů potřebných k projednání petičním výborem Sněmovny.

    Rekapituluje vlastní dosavadní aktivity jako doklad akceschopnosti: účast na sundání ukrajinské vlajky ze sochy maršála Koněva, dvoudenní shromáždění před Úřadem vlády (které mělo přispět k tomu, že vláda nepodepsala jeden ze dvou Globálních kompaktů OSN o migraci), a spolu se Zdeňkem Chytrým podíl na zablokování zákona „manželství pro všechny" a Istanbulské úmluvy — v této souvislosti opakuje odmítání adopce dětí homosexuálními páry.
  podtema: USA — volební systém
- id: cernohorsky-2026-08-28-05
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Pokles porodnosti jako měřítko úpadku společnosti (Černohorský, 28. 8. 2026)
  text: Černohorský staví dnešní porodnost (v průměru ~82 000 dětí ročně za poslední tři roky) do kontrastu
    s obdobím socialismu, kdy se běžně rodilo 120–160 tisíc dětí ročně, a to i v „nejhorších" letech po
    roce 1968 — z čehož usuzuje, že dnešní doba je pro zakládání rodin hůře nastavená než tehdejší totalitní
    režim. Za měřítko blahobytu společnosti považuje právě počet dětí, ne subjektivní tvrzení politiků,
    že „se máme nejlíp, jak jsme se kdy měli". Vyjadřuje znepokojení nad tím, kolik z dnešních narozených
    dětí tvoří děti přistěhovalců, ukrajinských uprchlíků a Romů namísto Čechů, Moravanů a Slezanů. Na
    modelovém příkladu běžné rodiny (otec 35 tis. čistého, matka 25 tis.) rozebírá, jak výpadek příjmu
    během mateřské dovolené nutí rodiny šetřit na téměř všem (kvalitě potravin, dopravě, kosmetice, telekomunikacích)
    kromě samotného dítěte — s odkazem na statistiku, že 13 % (1,3 mil.) lidí v ČR neušetří z výplaty
    ani korunu.
  podtema: Eutanazie
