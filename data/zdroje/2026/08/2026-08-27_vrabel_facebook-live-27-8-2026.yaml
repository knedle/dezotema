  nadpis: Írán označil exilová média (Radio Farda) za vojenské cíle — riziko útoku i na ČR (Vrabel, 27.
    8. 2026)
  text: Íránské ozbrojené síly zařadily několik persko-jazyčných zahraničních médií, včetně Radio Farda
    (provozovaného americkou RFE/RL se sídlem v Praze), na seznam potenciálních vojenských cílů s odůvodněním,
    že jde o nástroje amerických a izraelských zpravodajských služeb. Vrabel s hodnocením Íránu souhlasí
    — srovnává to s vlastní tezí o západních médiích, která podle něj obdobně rozvracela Srbsko a organizovala
    kyjevský Majdan 2014 — a varuje, že přítomnost takového média v Praze činí Českou republiku potenciálním
    terčem íránské odvety (byť malým, jako sabotáž nebo výbuch), zejména po zprávě, že ministr zahraničí
    Petr Macinka předvolal íránského velvyslance „na kobereček". Kritizuje bezpodmínečnou proizraelskou
    zahraniční politiku české vlády (vetování unijních rezolucí proti Izraeli) jako řízenou tím, „kde
    tečou peníze", ne principem strany práva, a varuje, že Írán má balistické rakety s doletem až do ČR.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-08-27-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Nová EU legislativa NGT1 umožní neoznačené GMO potraviny — srovnání se Srbskem (Vrabel, 27.
    8. 2026)
  text: 'Podle Centra biologie rostlin a biodiverzity Slovenské akademie věd nová legislativa EU zařazuje
    rostliny upravené novými genomovými technikami (kategorie NGT1) mezi odrůdy, které lze od klasického
    šlechtění laboratorně těžko odlišit — potraviny z takových rostlin proto nebudou muset být označovány
    jako GMO. Slovenská vláda zvažuje žalobu k Soudnímu dvoru EU. Vrabel to kritizuje jako přípravu na
    dovoz geneticky modifikovaných potravin nejnižší kvality z USA bez možnosti spotřebitele rozeznat
    rozdíl, a dává do kontrastu Srbsko, kde je prodej GMO potravin zákonem zakázán a stát naopak dotuje
    pastviny, chov krav a výsadbu ovocných sadů. Jako další příklad „šílenství" unijní zemědělské politiky
    uvádí nizozemské nařízení nutící farmáře podávat kravám léky proti tvorbě metanu (s rizikem úhynu
    zvířat) pod hrozbou uzavření podniku. Předpokládá, že kombinace energetické krize (uzavřený Hormuzský
    průliv), likvidace zemědělství v EU a rostoucí inflace povede k nedostatku potravin — v této souvislosti
    zmiňuje i skeptickou reakci na predikci bývalého amerického důstojníka Karpinského, že kvůli zničeným
    černomořským přístavům (nedostatek hnojiv a obilí) bude v EU příští rok „hlad": sám tomu nevěří pro
    vyspělé západní země, ale jeho manželka na základě vlastní zkušenosti z 90. let v Jugoslávii (kdy
    si den před začátkem bombardování raději koupila dva chleby místo jednoho) varuje, že podobný nedostatek
    může přijít nečekaně rychle.'
  podtema: Elektřina — marže a ceny
- id: vrabel-2026-08-27-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**27. 8.** — Vrabel potvrzuje přesné datum a místo demonstrace „Člověk na prvním místě": **3.
    10. 2026, Malostranské náměstí** v Praze. Zdůrazňuje, že iniciativa vzešla od jeho manželky (dosud
    odmítající jakékoli demonstrace kvůli osobní zkušenosti s následnou perzekucí), která myšlenku sama
    navrhla jako reakci na riziko rozmístění jaderných zbraní. Argumentuje, že jde o jinou kategorii rizika
    než např. výroba dronů (kde podle něj hrozí smrt jen zaměstnancům konkrétní továrny): jaderný zásah
    na území ČR by se dotkl každého. Jako precedens uvádí Polsko, které oficiálně (z úrovně náměstka ministra
    obrany) odmítlo rozmístění jaderných zbraní na svém území navzdory podpoře jaderného odstrašení v
    rámci NATO, a vyzývá, aby totéž udělala ČR — bez ohledu na to, zda je u moci Babiš, nebo Pavel. Popisuje
    osobní motivaci: i přes život v Srbsku se chce jednou vrátit do rodného Českého Krumlova a nechce
    se obávat radioaktivní kontaminace půdy a vody — [Facebook Live 27. 8.](/zdroje/2026-08.md#2026-08-27_vrabel_facebook-live-27-8-2026)'
- id: vrabel-2026-08-27-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Odchod šéfa BIS Koudelky — Vrabel: „dvojitý agent CIA" (25. 7. 2026)'
  text: '**27. 8.** — K výroční zprávě BIS za rok 2025 Vrabel poukazuje na to, co považuje za vnitřní
    rozpor: zpráva na jednu stranu přiznává, že se BIS nepodařilo spolehlivě prokázat u žádného bezpečnostního
    incidentu v ČR přímé zapojení Ruska, zároveň ale tvrdí, že Rusko dlouhodobě útočí přes „agenty na
    jedno použití" a že hrozba opět roste. Označuje to za „schizofrenní" výrok a navrhuje, aby Koudelka
    (těsně před koncem funkčního období) podstoupil psychiatrické vyšetření. Připomíná vlastní zkušenost
    z dřívější výroční zprávy BIS (2023/2024), kde měl být terčem pokusu neurčeného „ruského vlivového
    agenta" o navázání kontaktu — Vrabel tvrdí, že k žádnému takovému kontaktu nedošlo a že šlo o připravenou
    mediální kampaň (avizovanou předem v televizi) s cílem vykreslit ho jako ruského spolupracovníka,
    podobně jako podle něj Koudelka dělá dnes s celým Ruskem.'
- id: vrabel-2026-08-27-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'EU rozpočet 2028–2034: ČR hrozí škrty z kohezních fondů (Vrabel, 19. 6. 2026)'
  text: '**27. 8.** — Předseda Evropské rady Antonio Costa objížděl členské státy včetně Prahy, aby před
    koncem roku dojednal shodu na rozpočtu 2028–2034; Babiš při jednání odmítl škrty v zemědělských a
    kohezních fondech s tím, že ČR nesmí dostat o 228 mld. Kč méně. Vrabel to označuje za další „schizofrenii":
    rozpočet EU má příjmovou i výdajovou stranu, které se musí rovnat — pokud tedy ČR jako čistý příjemce
    prosadí vyšší celkový rozpočet, bude muset zároveň platit více do příjmové části, takže si nutně nepolepší
    tolik, jak Babiš naznačuje. Tvrdí, že Babišovi ve skutečnosti nejde o obyčejné zemědělce, ale o zachování
    vysokých zemědělských dotací, z nichž nepřímo profituje přes svěřenecký fond a firmu Agrofert.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-08-27-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: USA a NATO řeší budoucí rozmístění sil v Evropě — kritika ministra obrany Zůny (Vrabel, 27.
    8. 2026)
  text: 'Generální tajemník NATO Mark Rutte oznámil, že USA po jednání s náměstkem ministra obrany Colbym
    v Bruselu konzultují se spojenci budoucí rozmístění amerických sil v Evropě — cílem má být „silnější
    Evropa a Kanada" v rámci NATO; evropské země a Kanada už zvýšily obranné výdaje o více než 139 mld.
    USD. Vrabel to komentuje sarkasticky: za ČR na jednáních zastupuje ministr obrany za SPD (stranu přímé
    demokracie), který prosazuje větší zbrojení a samostatnost Evropy kvůli případnému konfliktu s Ruskem
    — staví to do kontrastu s dřívějšími sliby strany o odmítání zahraničních vojenských závazků.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-08-27-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Šéf CIA Ratcliffe v Moskvě — spekulace: Rusko předem varuje USA před akcí proti „koalici ochotných"
    (Vrabel, dovětek, 26. 8. 2026)'
  text: '**27. 8.** — Vrabel doplňuje časové detaily (schůzka v Kremlu trvala jen 3–4 hodiny včetně cesty
    z letiště, Ratcliffe přiletěl vojenským transportním letounem C-17) jako důkaz narychlo svolaného,
    neplánovaného jednání na vysoké úrovni. Spojuje to s čerstvým ruským testem střely s jaderným pohonem
    Burevestnik (přezdívané „létající Černobyl" kvůli úniku radiace při předchozím testu) a s tiskovou
    konferencí mluvčí ruského MZV Marie Zacharovové, kterou obsáhle cituje: Rusko obviňuje evropské lídry
    ze sabotáže rusko-amerických mírových iniciativ; nalezené německé součástky v ukrajinských dronech
    činí Německo poprvé přímo odpovědným za smrt civilistů při útoku na ruské území (obec Chorly v Chersonské
    oblasti); použití britských raket Ukrajinou k úderům na Rusko přibližuje okamžik, kdy Rusko oficiálně
    označí Spojené království za stranu konfliktu. Dodává protichůdné zprávy západních médií: CBC News
    tvrdila, že Ratcliffe varoval Rusko před útoky na členské země NATO, zatímco Donald Trump pro Axios
    podobná varování popřel a novinky označil za nepřesné — Vrabel z toho usuzuje, že šlo o skutečně závažné
    jednání (možná týkající se Íránu), které zůstává záměrně nejasné.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-27-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Výbuch auta v Petrohradu zabil ruského důstojníka — teroristický útok (Vrabel, 27. 8. 2026)
  text: Podle serveru Fontanka zahynul v Petrohradu při explozi nastražené nálože ve svém autě vysoce
    postavený ruský podplukovník, jeho manželka utrpěla těžká zranění. Vrabel to hodnotí jako jednoznačný
    teroristický útok — u manželky jako civilistky bez výhrad, u vojáka „těžko říct", ale i tak jde podle
    něj o terorismus.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-27-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Smrt Radko Mladiće — revizionistický výklad Srebrenice, Joe Biden jako strůjce bosenské války
    (Vrabel, 27. 8. 2026)
  text: |-
    Ke zprávě o úmrtí bývalého bosensko-srbského generála Radka Mladiće (84 let) ve vazbě v Haagu — kde si odpykával doživotní trest za genocidu ve Srebrenici — Vrabel nabízí vlastní historický výklad. Připomíná, že Srbsko žádalo o jeho propuštění na svobodu kvůli zhoršujícímu se zdraví, což bylo odmítnuto. K bosenské válce 90. let tvrdí, že ji rozehrál americký senátor (později viceprezident a prezident) Joe Biden, který prosadil v Kongresu financování a vyzbrojení bosenských muslimů (cca 51 mil. dolarů na samopaly) a později doporučoval bombardování Bělehradu a mostů na řece Drině — dokládá to citací dobového videa s Bidenovým výrokem. Ke Srebrenici cituje (dobovým videozáznamem) samotného Mladiće, jak před vojenskou operací nechal autobusy evakuovat civilisty (ženy, děti, starce) do bezpečí na muslimské území — což podle Vrabela neodpovídá definici genocidy (snaha o vyhlazení etnika včetně dětí). Odkazuje na knihu českého profesora Rajka Dolečka o Srebrenici a na to, že v letech před masakrem bylo napadeno a vyvražděno přes 200 srbských vesnic v okolí bosensko-muslimskými jednotkami. Vyjadřuje přesvědčení, že v Republice srbské je Mladić uctíván jako hrdina.

    ⚡ **Poznámka:** Jde o revizionistický výklad srebrenického masakru (mezinárodně uznávaného jako genocida rozsudky ICTY) — zachyceno věcně jako Vrabelovo tvrzení, bez potvrzení z nezávislých zdrojů.
  podtema: Zahraniční aktéři a precedenty
