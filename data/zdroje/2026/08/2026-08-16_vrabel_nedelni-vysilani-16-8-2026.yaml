vyroky:
- id: vrabel-2026-08-16-01
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Skorumpovaný „mafiánský systém" — státní zastupitelství a bitcoinová kauza (Vrabel, 2. 6. 2026)
  text: '**16. 8.** — Vrabel rozpracovává konkrétní mechanismus první z „pěti reforem" (změna politického
    systému): pokud politik nesplní klíčové body svého volebního programu, měl by o něj na základě petice
    a soudního přezkumu (kde se porovná volební program s reálnými kroky) přijít mandát — se třemi „ukázkovými"
    případy odvolání by se podle něj politici báli nechat se zkorumpovat lobbisty (např. energobarony
    kvůli drahé elektřině, nebo kvůli placení za Ukrajinu). Druhým bodem je zákaz lobbingu jako trestného
    činu korupce — dnes je podle něj legální, aby politika navštívil zástupce zbrojařské firmy nebo jiný
    „oligarcha" a nabídl mu peníze výměnou za hlasování.'
  podtema: Demokracie a politický systém
- id: vrabel-2026-08-16-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Ohlášení veřejného shromáždění „Člověk na prvním místě" (3. 10. 2026) — bez politiků s placenou
    funkcí (Vrabel, 9. 8. 2026)
  text: '**16. 8.** — Vrabel opakuje ohlášení akce (Malostranské náměstí, 3. 10. 2026, název „Člověk na
    prvním místě") a doplňuje konkrétní katalog nesplněných slibů vládní koalice od voleb 2022 jako důkaz,
    že demonstrace fungují jen do té míry, kolik lidí na ně přijde: Andrej Babiš slíbil zrušení České
    muniční iniciativy, ale po summitu NATO ji zachoval (ČR dnes dodává přes polovinu veškeré munice pro
    Ukrajinu a je na 5. místě žebříčku „nepřátelských zemí" Ruska, dřív na 10.); slíbil zrušení nákupu
    F-35, ale po telefonátu s Trumpem a intervenci ministra obrany Zůny (SPD) nákup potvrdil; slíbil,
    že ze státního rozpočtu nepůjdou peníze na Ukrajinu, ale schválil 90 mld. EUR pro Ukrajinu (60 mld.
    na zbraně) i dalších 140 mil. Kč přes program PURL; energetická politika (rušení uhelných dolů a elektráren,
    pokračující Green Deal a emisní povolenky i pod vládou motoristů, dovoz německé solární energie místo
    zlevnění vlastní výroby) zůstala beze změny; zdravotnictví trpí nedostatkem léků (nyní na rakovinu
    prsu) a centralizací nemocnic; digitalizace (chat control, datová centra) pokračuje; případ jeho manželky
    (bezdůvodně souzené jako „bezpečnostní hrozba") zůstává nevyřešen; nový zákon Lex Ukrajina 7 umožňující
    Ukrajincům žádost o trvalý pobyt (viz [Migrace](/temata/migrace.md)) odporuje sliby o ukrajinizaci.
    Zavádí vlastní kvantifikovanou tezi o síle demonstrací: 1000 lidí prosadí „promile" programového prohlášení
    vlády, 100 000 lidí 10 %, milion lidí 100 % — protože teprve při takovém počtu se politici skutečně
    obávají o vlastní pozici. Doplňuje jmenovitý výčet spoluorganizátorů demonstrací z roku 2022 (Milan
    Loprajs, David Tesař, Václav Hrabák, Jindřich Rajchl, Zuzana Majerová, Michal Semín, Jana Hamplová
    a další) jako důkaz, že hnutí nikdy nebylo jen jeho vlastní.'
  podtema: USA — volební systém
- id: vrabel-2026-08-16-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Evropu u mírových jednání budou zastupovat Německo, Británie a Francie — teorie o anglosaských
    globalistech proti Slovanům (Vrabel, 16. 8. 2026)
  text: 'Po měsících sporu o to, kdo bude za Evropu vyjednávat s Ruskem (viz [Boj o vyjednavače EU–Rusko,
    9. 6.](/temata/valka-ukrajina-prubeh/2026.md#vrabel-2026-06-09-07)), padlo rozhodnutí: Německo, Británii
    a Francii. Vrabel u každého ze tří zástupců zdůrazňuje osobní vazby na globalistické finanční struktury:
    Friedrich Merz (Německo) je bývalý předseda představenstva BlackRock Deutschland — firmy, která má
    od roku 2022 spravovat poválečnou obnovu Ukrajiny; Emmanuel Macron (Francie) dříve pracoval pro banku
    rodiny Rothschildů; britského zástupce spojuje s tím, že Británie díky islamizaci velkých měst (muslimští
    starostové) fakticky reprezentuje „muslimskou Evropu", a že to byl právě britský premiér, kdo v dubnu
    2022 zmařil rozjednanou mírovou dohodu přesvědčením Zelenského, aby ve válce pokračoval. Ani jeden
    z menších/středních států (Španělsko, Itálie, Polsko, Balkán) podle Vrabela zastoupen nebude. Z toho
    vyvozuje, že jednání povedou výhradně „anglosasové" hájící zájmy globalistických struktur, ne zájmy
    „Slovanů" — odkazuje na starší tezi Štefana Harabína (leden 2023), že anglosaské mocnosti systematicky
    vyvolávají konflikty mezi slovanskými národy.'
  podtema: Vyjednávání a mír
