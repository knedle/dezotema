  nadpis: Média jako podpora „řízené sebevraždy" — zavedení eura a Chat Control (Šejna, 15. 8. 2026)
  text: V souvislosti se svou kritikou zavedení eura a Chat Control (viz [Suverenita a EU](suverenita-eu.md#euro-jako-vzdání-se-svobody--petr-pavel-a-opozice-zaprodávají-republiku-šejna-15-8-2026))
    Šejna tvrdí, že média v tomto procesu podporují politiky tím, že „vymývají mozky" lidem, aby si mysleli,
    že odevzdávání koruny, soukromí a suverenity evropskému establishmentu je „naprosto v pořádku".
  podtema: Mainstream jako politický aktivismus
- id: sejna-2026-08-15-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Euro jako vzdání se svobody — Petr Pavel a opozice „zaprodávají" republiku (Šejna, 15. 8. 2026)
  text: Šejna tvrdí, že Petr Pavel se netají přáním zavést v ČR euro a že v tom nejde sám — stejný postoj
    má podle něj i většina opozice. Vzdání se koruny rovná se dle jeho slov vzdání se svobody; politici
    tím podle něj zaprodávají republiku „evropskému establishmentu" (spolu s pravem veta a suverenitou
    obecně). Celý proces označuje za „řízenou sebevraždu" — navazuje na jeho tezi o digitálním euru a
    Chat Control (viz [Digitální kontrola](digitalni-kontrola.md#programovatelné-euro-a-chat-control-jako-vzdání-se-suverenity--politici-jsou-v-tom-s-eu-šejna-15-8-2026)).
  podtema: Česká suverenita
