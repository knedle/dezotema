- id: sejna-2026-08-15-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Programovatelné euro a Chat Control jako vzdání se suverenity — politici jsou v tom s EU (Šejna,
    15. 8. 2026)
  text: 'Šejna popisuje digitální euro jako programovatelnou měnu: zatímco dnes stát u bankovních peněz
    vidí kolik jich člověk má, ale ne za co přesně platí, digitální euro by toto rozlišení smazalo a umožnilo
    „evropskému establishmentu" zakázat platbu komukoli, s kým nesouhlasí. K tomu přidává Chat Control,
    který označuje za „bezprecedentně protiústavní" — a upozorňuje na pokrytectví: čeští politici, kteří
    se ohledně Petra Pavla oháněli ústavou, Chat Control sami podpořili. Uzavírá, že v tomto procesu (spolu
    s odevzdáním práva veta, koruny a soukromí) nejde jen o EU, ale i o vlastní české politiky, kteří
    „zaprodávají" zemi. Navazuje na Rajchlovu kritiku Chat Control ze 14. 8. výše.'
- id: sejna-2026-08-15-02
