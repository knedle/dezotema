  nadpis: Meme „6-7" a píseň Baby Shark jako démonická čísla (Boldy, 22. 8. 2026)
  text: Boldy tvrdí, že rozšířený dětský meme/fráze „6-7" má skrytý démonický význam. Odvozuje ho od písně
    rappera Skrily (Doot Doot), který podle Boldyho vyznává africko-karibské náboženství s obětními rituály,
    jemuž má vděčit za úspěch v hudebním průmyslu. Poukazuje, že zadáním slova „satanic" do gematrické
    kalkulačky vyjde číslo 67. Dále tvrdí, že populární píseň Baby Shark (17 miliard zhlédnutí na YouTube)
    obsahuje v textu šestinásobné opakování fráze po třech řádcích (tedy „666") a že samotná melodie má
    odlišný, s reinkarnací a démony spojený původ. Varuje rodiče, aby dětem zakázali frázi opakovat, protože
    „přivolává síly, které doma nechcete" — děti jsou dle něj cílem démonů jako nositelé „nejčistší duše".
    Slibuje podrobnější rozbor (vč. příběhu americké matky Molly) v následujícím vysílání.
  podtema: Okultismus
