  text: 'Zítko sdílí a schvaluje teorii navazující na jeho opakovanou tezi o QFS a opuštění „admirality
    law": 21. září 2026 (250. výročí USA, 5×50 let) odpovídá biblickému „jubilejnímu roku" (den smíření
    podle hebrejského kalendáře) a má symbolizovat definitivní konec starého finančního systému a nástup
    „systému založeného na aktivech". Jako doprovodná nebeská znamení uvádí zatmění Slunce (12. 8.), konjunkci
    šesti planet, roj Perseid a zatmění Měsíce (27.–28. 8.) — přechodné období má trvat od 13. 8. do 11.
    9. 2026. Viz [predikce.md](predikce.md).'
