  nadpis: '„Americké jubileum" 21. 9. 2026: konec starého finančního systému'
  text: Zítko sdílí a schvaluje teorii, podle níž 21. září 2026 (250. výročí USA, biblické „jubileum")
    symbolizuje konec starého finančního systému („admirality law") a přechod ke „novému systému založenému
    na aktivech" (QFS). Přípravné období má probíhat od 13. 8. do 11. 9. 2026, jako nebeská znamení uvádí
    zatmění Slunce (12. 8.) a Měsíce (27.–28. 8.) a konjunkci šesti planet. Předpovídá, že ke změně dojde
    „letos", nikoli v nejisté budoucnosti.
