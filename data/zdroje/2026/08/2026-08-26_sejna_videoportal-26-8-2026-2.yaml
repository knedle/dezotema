  nadpis: Piráti ve Sněmovně jako „jedno velké divadlo" (Šejna, 26. 8. 2026)
  text: V krátkém videu Adam Šejna tvrdí, že Piráti v Poslanecké sněmovně nedělají nic jiného než divadlo
    — neustále přicházejí s novými „rekvizitami", aby se s nimi vyfotili, pronesli pár efektních vět a
    sdíleli to na sociálních sítích pro uspokojení vlastních voličů. Ironicky předjímá, že brzy požádají
    o dotaci na ministerstvu kultury.
