  nadpis: Islamizace jako „největší a nejnebezpečnější problém" — historie tureckého útlaku Srbů (Vrabel,
    25. 8. 2026)
  text: V návaznosti na téma Kosova (viz [Válka, NATO a Rusko](valka-nato-rusko.md#kosovo-a-metochie-útlak-srbů-má-být-vyřešen-po-skončení-války-na-ukrajině-vrabel-25-8-2026))
    Vrabel líčí historii tureckého („janičárského") útlaku Srbů na Balkáně (napichování na kůl, únosy
    dětí za účelem převýchovy na vojáky), aby doložil, že Srbsko zůstalo na rozdíl od zbytku Evropy „etnicky
    čisté" a bez muslimské populace, protože se islamizaci dlouhodobě bránilo. Explicitně řadí islamizaci
    nad válku s Ruskem i nad digitalizaci/globalizaci jako „největší a nejnebezpečnější" problém, kterému
    se věnuje od roku 2013.
- id: vrabel-2026-08-25-04
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Projev u Českého rozhlasu 21. 8. — Pavel jako pokrytec; vlastní revizionistický výklad invaze
    1968 (Vrabel, 21. 8. 2026)
  text: '**25. 8.** — opakuje stejnou tezi bez posunu: invaze 1968 podle něj zabránila na 20 let tomu,
    co se stalo až v roce 1989 (rozpad východního bloku), a bez sovětských vojsk by k tomu došlo o 20
    let dřív, podobně jako na kyjevském Majdanu 2014. Připouští, že při invazi zemřelo 108 lidí a že je
    pochopitelné, že nikdo nemá rád cizí vojska ve své zemi.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-08-25-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Kritika mobilizace ukrajinských žen do armády (Vrabel, 25. 8. 2026)
  text: Bývalý zvláštní vyslanec USA pro Ukrajinu Keith Kellogg v rozhovoru podpořil mobilizaci ukrajinských
    žen do armády s tím, že bojují stejně dobře jako muži. Vrabel to ostře odmítá — souhlasí nanejvýš
    s tím, aby ženy sloužily jako zdravotnice, ne v bojových jednotkách — a považuje to za další stupeň
    vyčerpání ukrajinského národa, který podle něj čeká vyvraždění „do posledního Ukrajince" i „do posledních
    Ukrajinek". Kritizuje zároveň praxi jednotek TCK, které nuceně odvádějí muže do armády na ulicích.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-25-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina jako „neúspěšný stát" bez práva na územní celistvost (Vrabel, 25. 8. 2026)
  text: U příležitosti 35. výročí ukrajinské nezávislosti (USA se nepřipojily ke společnému prohlášení
    přes 50 zemí při OSN vyzývajícímu k ukončení ruské války) Vrabel tvrdí, že Ukrajina jako stát vzniklý
    uměle v roce 1991 „se nepovedla" a nemá právo dovolávat se územní celistvosti, protože její vznik
    sám o sobě porušil poválečné (1945) uspořádání hranic. Odkazuje na ústavní převrat na Majdanu 2014,
    kdy se dle něj k moci dostali nacisté (jmenuje zesnulého zakladatele praporu Azov) a vyvolali občanskou
    válku, do níž pak zasáhlo Rusko na obranu obyvatel hlásících se k ruské národnosti. Stejnou logikou
    zpochybňuje i ukrajinský nárok na Krym, který byl dle něj historicky od 16.–17. století součástí Ruska
    a Ukrajině ho v 50. letech pouze administrativně přidělil Chruščov.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-25-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Paralela s 2. světovou válkou — Evropa má být „obětována", aby si USA udržely dominanci (Vrabel,
    25. 8. 2026)
  text: 'Vrabel rozvíjí analogii: stejně jako po 2. světové válce z konfliktu ekonomicky nejvíc profitovaly
    USA (převzaly světovou rezervní měnu, zatímco Evropa byla zničena a Sovětský svaz „vykrvácel"), předpokládá,
    že i dnešní válka skončí obdobně — zničením/oslabením především východní Evropy ve prospěch udržení
    americké dominance (viz [Predikce](predikce.md#ladislav-vrabel--evropa-bude-obětována-miliony-mrtvých-slovanů-25-8-2026)).
    Odhaduje na základě amerických „ex-plukovníků" celkové ztráty milion až 2,5 milionu na straně Ukrajiny
    a několik set tisíc na straně Ruska — s tím, že „kanónenfutrem" jsou v tomto konfliktu opět Slované,
    zatímco žoldnéřů z anglosaských zemí je málo.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-25-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Kosovo a Metochie — útlak Srbů má být vyřešen po skončení války na Ukrajině (Vrabel, 25. 8.
    2026)
  text: 'V souvislosti se zprávou o výroku Dmitrije Medveděva (dvojí metr Západu — uznání nezávislosti
    Kosova, ale odmítání stejného práva pro Jižní Osetii a Abcházii) Vrabel líčí dlouhodobý útlak Srbů
    v Kosovu a Metochii: doporučuje divákům dokument České televize „Uloupené Kosovo" jako klíč k pochopení
    budoucnosti Evropy v otázkách migrace a islamizace (rozpad Jugoslávie jako předobraz osudu Evropy).
    Tvrdí, že jednotky KFOR (přítomné od 90. let) jen nečinně přihlížely ničení srbských kostelů a hřbitovů
    albánskou většinou. Odkazuje na dřívější slib ruského velvyslance Srbsku, že po skončení konfliktu
    na Ukrajině se otázka Kosova vyřeší (viz [Predikce](predikce.md#ladislav-vrabel--otázka-kosova-se-vyřeší-po-válce-na-ukrajině-srbský-národ-se-spojí-25-8-2026)),
    a spojuje to s obecnějším postřehem o slábnoucí schopnosti NATO/USA vojensky i politicky ovládat dění
    po celém světě (vedle KLDR a Číny jako rostoucích vojenských velmocí).'
  podtema: Zahraniční aktéři a precedenty
