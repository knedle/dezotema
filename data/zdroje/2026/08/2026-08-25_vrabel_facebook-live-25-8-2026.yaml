  nadpis: Agenda 2030 jako reálná vládní politika vedoucí k technokracii (Vrabel, 25. 8. 2026)
  text: Vrabel tvrdí, že Agenda 2030 není „výmysl", ale reálně zakotvená politika — odkazuje na vládní
    programové prohlášení a stránku www.2030.cz, kde jednotlivá ministerstva rozpracovávají desítky agend
    OSN/EU do vlastní působnosti. Předpovídá, že po válce (viz [Predikce](predikce.md#ladislav-vrabel--po-válce-nahradí-demokracii-technokracie-25-8-2026))
    dojde k přechodu demokracie na technokracii — vládu založenou na datech a algoritmech místo zkorumpovaných
    politiků — a jako klíčové postavy budoucí technokratické společnosti (existující dle něj od 20. let
    minulého století) jmenuje Elona Muska, Petera Thiela a Alexe Karpa (zakladatele Palantiru). Spojuje
    to s postupující digitalizací peněz (tokenizace majetku, přechod na digitální měnu), narůstajícím
    kamerovým dohledem a výstavbou datacenter, které mají sloužit primárně novému finančnímu systému.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-08-25-02
