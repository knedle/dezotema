- id: vrabel-2026-08-25-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Agenda 2030 jako reálná vládní politika vedoucí k technokracii (Vrabel, 25. 8. 2026)
  text: Vrabel tvrdí, že Agenda 2030 není „výmysl", ale reálně zakotvená politika — odkazuje na vládní
    programové prohlášení a stránku www.2030.cz, kde jednotlivá ministerstva rozpracovávají desítky agend
    OSN/EU do vlastní působnosti. Předpovídá, že po válce (viz [Predikce](/temata/konspirace/2026.md#vrabel-2026-08-25-09))
    dojde k přechodu demokracie na technokracii — vládu založenou na datech a algoritmech místo zkorumpovaných
    politiků — a jako klíčové postavy budoucí technokratické společnosti (existující dle něj od 20. let
    minulého století) jmenuje Elona Muska, Petera Thiela a Alexe Karpa (zakladatele Palantiru). Spojuje
    to s postupující digitalizací peněz (tokenizace majetku, přechod na digitální měnu), narůstajícím
    kamerovým dohledem a výstavbou datacenter, které mají sloužit primárně novému finančnímu systému.
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-08-25-02
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Druhá světová válka jako „válka proti Slovanům", Rockefellerové financovali Hitlera i Zelenského
    (Vrabel, 25. 8. 2026)
  text: |-
    Vrabel tvrdí, že druhá světová válka nebyla především válkou proti Židům, ale válkou proti Slovanům — s odkazem na počet zabitých Slovanů oproti obětem holokaustu. Tvrdí, že rodina Rockefellerů (jmenovitě David Rockefeller) financovala nacistické Německo, včetně výroby plynu Cyklon B pro koncentrační tábory, a že tatáž „rodina hazarských židů" dnes financuje Volodymyra Zelenského — se závěrem, že hlavním beneficientem obou válek jsou Spojené státy (po 2. světové válce ovládly světovou rezervní měnu skrze Brettonwoodský systém). Podobně vyzdvihuje financování Adolfa Hitlera americkými firmami (Ford, Coca-Cola).

    ⚡ **Poznámka:** Tvrzení o financování nacismu i dnešní ukrajinské vlády konkrétní židovskou rodinou/„hazarskými židy" je antisemitský konspirační topos; srov. [BRICS vs unipolární svět: konflikt o dolar a globalistickou „chazarskou" nadvládu](/temata/konspirace/2026.md#vrabel-2026-06-08-02).
  osoby:
  - osoba: david-rockefeller
    vztah: negativni
    kontext: Tvrzení, že financoval nacistické Německo (výrobu Cyklonu B) i dnes financuje Volodymyra
      Zelenského (→ [konspirace](/temata/konspirace.md))
  dalsi_zdroje:
  - 2026-09-27_vrabel_nedelni-vysilani-27-9-2026
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-08-25-03
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Islamizace jako „největší a nejnebezpečnější problém" — historie tureckého útlaku Srbů (Vrabel,
    25. 8. 2026)
  text: V návaznosti na téma Kosova (viz [Válka, NATO a Rusko](/temata/valka-nato-rusko.md#kosovo-a-metochie-útlak-srbů-má-být-vyřešen-po-skončení-války-na-ukrajině-vrabel-25-8-2026))
    Vrabel líčí historii tureckého („janičárského") útlaku Srbů na Balkáně (napichování na kůl, únosy
    dětí za účelem převýchovy na vojáky), aby doložil, že Srbsko zůstalo na rozdíl od zbytku Evropy „etnicky
    čisté" a bez muslimské populace, protože se islamizaci dlouhodobě bránilo. Explicitně řadí islamizaci
    nad válku s Ruskem i nad digitalizaci/globalizaci jako „největší a nejnebezpečnější" problém, kterému
    se věnuje od roku 2013.
- id: vrabel-2026-08-25-04
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Projev u Českého rozhlasu 21. 8. — Pavel jako pokrytec; vlastní revizionistický výklad invaze
    1968 (Vrabel, 21. 8. 2026)
  text: '**25. 8.** — opakuje stejnou tezi bez posunu: invaze 1968 podle něj zabránila na 20 let tomu,
    co se stalo až v roce 1989 (rozpad východního bloku), a bez sovětských vojsk by k tomu došlo o 20
    let dřív, podobně jako na kyjevském Majdanu 2014. Připouští, že při invazi zemřelo 108 lidí a že je
    pochopitelné, že nikdo nemá rád cizí vojska ve své zemi.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-08-25-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Kritika mobilizace ukrajinských žen do armády (Vrabel, 25. 8. 2026)
  text: Bývalý zvláštní vyslanec USA pro Ukrajinu Keith Kellogg v rozhovoru podpořil mobilizaci ukrajinských
    žen do armády s tím, že bojují stejně dobře jako muži. Vrabel to ostře odmítá — souhlasí nanejvýš
    s tím, aby ženy sloužily jako zdravotnice, ne v bojových jednotkách — a považuje to za další stupeň
    vyčerpání ukrajinského národa, který podle něj čeká vyvraždění „do posledního Ukrajince" i „do posledních
    Ukrajinek". Kritizuje zároveň praxi jednotek TCK, které nuceně odvádějí muže do armády na ulicích.
  osoby:
  - osoba: keith-kellogg
    vztah: negativni
    kontext: Bývalý zvláštní vyslanec USA pro Ukrajinu — kritizován za podporu mobilizace ukrajinských
      žen do armády
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-25-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina jako „neúspěšný stát" bez práva na územní celistvost (Vrabel, 25. 8. 2026)
  text: U příležitosti 35. výročí ukrajinské nezávislosti (USA se nepřipojily ke společnému prohlášení
    přes 50 zemí při OSN vyzývajícímu k ukončení ruské války) Vrabel tvrdí, že Ukrajina jako stát vzniklý
    uměle v roce 1991 „se nepovedla" a nemá právo dovolávat se územní celistvosti, protože její vznik
    sám o sobě porušil poválečné (1945) uspořádání hranic. Odkazuje na ústavní převrat na Majdanu 2014,
    kdy se dle něj k moci dostali nacisté (jmenuje zesnulého zakladatele praporu Azov) a vyvolali občanskou
    válku, do níž pak zasáhlo Rusko na obranu obyvatel hlásících se k ruské národnosti. Stejnou logikou
    zpochybňuje i ukrajinský nárok na Krym, který byl dle něj historicky od 16.–17. století součástí Ruska
    a Ukrajině ho v 50. letech pouze administrativně přidělil Chruščov.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-25-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Paralela s 2. světovou válkou — Evropa má být „obětována", aby si USA udržely dominanci (Vrabel,
    25. 8. 2026)
  text: 'Vrabel rozvíjí analogii: stejně jako po 2. světové válce z konfliktu ekonomicky nejvíc profitovaly
    USA (převzaly světovou rezervní měnu, zatímco Evropa byla zničena a Sovětský svaz „vykrvácel"), předpokládá,
    že i dnešní válka skončí obdobně — zničením/oslabením především východní Evropy ve prospěch udržení
    americké dominance (viz [Predikce](/temata/valka-ukrajina-prubeh/2026.md#vrabel-2026-08-25-10)). Odhaduje
    na základě amerických „ex-plukovníků" celkové ztráty milion až 2,5 milionu na straně Ukrajiny a několik
    set tisíc na straně Ruska — s tím, že „kanónenfutrem" jsou v tomto konfliktu opět Slované, zatímco
    žoldnéřů z anglosaských zemí je málo.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-25-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Kosovo a Metochie — útlak Srbů má být vyřešen po skončení války na Ukrajině (Vrabel, 25. 8.
    2026)
  text: 'V souvislosti se zprávou o výroku Dmitrije Medveděva (dvojí metr Západu — uznání nezávislosti
    Kosova, ale odmítání stejného práva pro Jižní Osetii a Abcházii) Vrabel líčí dlouhodobý útlak Srbů
    v Kosovu a Metochii: doporučuje divákům dokument České televize „Uloupené Kosovo" jako klíč k pochopení
    budoucnosti Evropy v otázkách migrace a islamizace (rozpad Jugoslávie jako předobraz osudu Evropy).
    Tvrdí, že jednotky KFOR (přítomné od 90. let) jen nečinně přihlížely ničení srbských kostelů a hřbitovů
    albánskou většinou. Odkazuje na dřívější slib ruského velvyslance Srbsku, že po skončení konfliktu
    na Ukrajině se otázka Kosova vyřeší (viz [Predikce](/temata/valka-nato-rusko/2026.md#vrabel-2026-08-25-11)),
    a spojuje to s obecnějším postřehem o slábnoucí schopnosti NATO/USA vojensky i politicky ovládat dění
    po celém světě (vedle KLDR a Číny jako rostoucích vojenských velmocí).'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-08-25-09
  typ: predikce
  temata:
  - konspirace
  nadpis: Po válce nahradí demokracii technokracie
  text: Vrabel předpovídá, že po skončení války dojde ke změně politického systému — vysoká nezaměstnanost,
    ekonomické problémy a nedůvěra k politikům povedou k tomu, že lidé sami budou volat po vládě „bez
    chyb" řízené technologiemi/AI namísto zkorumpovaných politiků. Za klíčové postavy budoucí technokratické
    společnosti (existující od 20. let minulého století) označuje Elona Muska, Petera Thiela a Alexe Karpa.
  citace:
  - text: Pravděpodobně přijde nový systém technokracie... a jejíž hlavní protagonisté... jsou dneska
      vlastně v ústředí těch organizací.
  predikce:
    horizont: neurčeno (po skončení války na Ukrajině)
    stav: ceka
- id: vrabel-2026-08-25-10
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: Evropa bude „obětována", miliony mrtvých Slovanů
  text: Podle paralely s 2. světovou válkou (kdy z konfliktu ekonomicky nejvíc těžily USA, zatímco Evropa
    byla zničena) Vrabel předpovídá, že v následujících měsících a letech bude obětí současné války především
    východní Evropa, aby si USA udržely dominanci. Odhaduje na základě amerických „ex-plukovníků" celkové
    ztráty na straně Ukrajiny mezi milionem a 2,5 milionu a na straně Ruska několik set tisíc.
  citace:
  - text: Obětí téhle války... bude z velké části Evropy, a především východní Evropy... ten, kdo bude
      mít největší ztráty... jsou Slovani.
  predikce:
    horizont: příští měsíce a roky
    stav: ceka
- id: vrabel-2026-08-25-11
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Otázka Kosova se vyřeší po válce na Ukrajině, srbský národ se spojí
  text: Vrabel odkazuje na dřívější slib ruského velvyslance Srbsku, že po skončení konfliktu na Ukrajině
    se vyřeší otázka Kosova, a předpovídá, že srbský národ bude nakonec spojený (včetně otázky Republiky
    srbské).
  citace:
  - text: Rusové slíbily už asi před rokem... že až skončí konflikt na Ukrajině, tak se vyřeší otázka
      Kosova... myslím si, že to tak dopadne, že srbský národ bude nakonec spojený.
  predikce:
    horizont: po skončení války na Ukrajině
    stav: ceka
- id: vrabel-2026-08-25-12
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Politiku ČR bude časem určovat spíš Rusko než USA
  text: Vrabel uvádí, že od roku 2022 dlouhodobě odhaduje, že s postupným úpadkem dominance NATO/USA ve
    světě bude o politickém směřování České republiky časem rozhodovat spíš Ruská federace než Spojené
    státy. Sám dodává, že situace se může vyvinout i opačně (ČR zůstane v EU, která upadne do „chalifátu"
    a občanské války).
  citace:
  - text: Co mě se týče, tak od roku 2022 typuju na to, že ten, kdo bude určovat politiku v České republice,
      bude spíš Ruská federace než Spojené státy.
  predikce:
    horizont: neurčeno
    stav: ceka
