  nadpis: Doporučení filmu „2073" jako potvrzení Agendy 2030 (Boldy, 25. 8. 2026)
  text: Boldy doporučuje divákům dokumentární/hraný film „2073" (2024), který podle něj obsahuje autentické
    záběry z dnešního světa dokládající, co světoví lídři a korporace lidem provádějí, doplněné fiktivní
    linkou popisující budoucnost. Tvrdí, že film obsahuje události odehrávající se od roku 2036, a že
    tomu, kdo zná skutečné cíle Agendy 2030, tyto předpovědi „krásně zapadají jako mozaika" — film tak
    podle něj funguje jako potvrzení jeho vlastní interpretace Agendy 2030.
  podtema: Náboženský a okultní výklad moci
