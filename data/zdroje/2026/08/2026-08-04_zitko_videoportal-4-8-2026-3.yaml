  nadpis: 'Zítkův vlastní soudní spor: zákaz pobytu v Praze, soudkyně Rajfová (Zítko, 4. 8. 2026)'
  text: Zítko popisuje vlastní trestní řízení u Obvodního soudu pro Prahu 2 (kauza „vylomené/vysazené
    dveře") jako důkaz zkorumpovanosti justice. Soudkyně Daniela Rajfová jej podle jeho tvrzení při jednání
    opakovaně (5×) vykázala z jednací síně, takže nebyl přítomen dokazování ani výpovědím svědků; u vynesení
    rozsudku navíc chyběl i uváděný státní zástupce Svoboda. Rozsudek — zákaz pobytu v Praze na 24 měsíců
    a podmínka — napadá jako vydaný v rozporu s čl. 37 a 38 Listiny základních práv a svobod (rovnost
    účastníků řízení, právo na veřejné projednání věci v jeho přítomnosti). Uvádí, že se proti rozsudku
    odvolal v poslední den lhůty, ale Městský soud v Praze jej potvrdil bez konání odvolacího jednání
    a bez podpisu soudce na doručeném rozhodnutí. Incident zdokumentovala i Mladá fronta DNES; Zítko odmítl
    u soudu prokázat totožnost korporátní průkazkou a podal na soudkyni trestní oznámení, které dle něj
    nikdo neřeší. Dává to do souvislosti s uvězněním Reinera Füllmicha jako součást stejného vzorce umlčování
    nepohodlných kritiků justicí.
