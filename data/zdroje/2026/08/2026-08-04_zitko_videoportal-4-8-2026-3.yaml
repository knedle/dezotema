  nadpis: Fauci se odvolal na 5. dodatek — kontrast s beztrestností v ČR (Vrabel, 30. 7. 2026)
  text: '**4. 8.** — Zítko doplňuje k témuž slyšení další detaily a odhady. V sedmi amerických státech
    (Pensylvánie, Florida, Texas, Arizona, Oklahoma, Missouri, Louisiana) byly podány žádosti o trestní
    stíhání Fauciho a dalších představitelů covidové agendy (obvinění z vraždy, terorismu, vydírání, podvodu
    aj.); floridský generální prokurátor po slyšení oznámil zahájení samostatného vyšetřování. Cituje
    britského poslance, který odhaduje počet celosvětově zabitých vakcínou na 150 milionů, a tvrdí, že
    podle statistiky VAERS způsobila covid vakcína v roce 2021 sama o sobě víc než 50 % všech úmrtí v
    souvislosti s vakcínami za předchozích 33 let dohromady — počet obětí v USA má být vyšší než součet
    obětí 1. a 2. světové války, Korejské a Vietnamské války.'
- id: zitko-2026-08-04-03
