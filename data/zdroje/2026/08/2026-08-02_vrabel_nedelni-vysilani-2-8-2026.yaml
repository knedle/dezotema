- id: vrabel-2026-08-02-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Centralizace zdravotnictví (Vojtěch) — kritika voličů za opakovanou volbu stejných politiků
    (Vrabel, 16. 7. 2026)
  text: '**2. 8.** — Vrabel na dotaz diváka odpovídá, že vystoupení z VHO (soukromé organizace) je otázkou
    jediného rozhodnutí vlády — dává příklad Donalda Trumpa, který z VHO vystoupil jedním dekretem. Místo
    toho ministerstvo Adama Vojtěcha oznámilo obnovení spolupráce s VHO a rozšíření očkování do lékáren.
    Zmiňuje kontakt Jamese Roguského (odborník na VHO, vystupující na kanálu Redacted), podle nějž VHO
    buduje rozsáhlý systém sledování komunikace a kontroly webů pod záštitou boje s „dezinformacemi" o
    očkování — což spojuje s dřívějším hlasováním Kateřiny Konečné v Evropském parlamentu pro potírání
    „dezinformací" o vakcínách.'
  podtema: Hantavirus
- id: vrabel-2026-08-02-02
