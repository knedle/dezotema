  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**2. 8.** — K plánované podzimní demonstraci upřesňuje: půjde o výslovně nadstranickou akci bez
    podpory politiků kandidujících ve volbách, s tématy války, jaderných zbraní, digitalizace, koruny
    a ekonomiky. Zvažuje pozvat i jednotlivé politiky jako řečníky (nikoli za strany) — jmenuje europoslance
    Ivana Davida (SPD) a senátorku Kovářovou jako lidi, kteří se mu líbí, i komunistické aktivisty Josefa
    Skálu a Petra Bureše. Zdůrazňuje, že podpis dohody o francouzské jaderné alianci (viz výše) je pro
    něj tím nejnebezpečnějším krokem, kterému chce demonstrací zabránit. Plánování je zatím v počáteční
    fázi (cca 10 hodin práce, „pár desítek lidí"). — [Nedělní vysílání 2. 8.](_zdroje.md#ladislav-vrabel--nedělní-vysílání-2-8-2026)'
- id: vrabel-2026-08-02-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rekonstrukce Václavského náměstí jako záměrné znemožnění demonstrací — vlastní perzekuce po
    roce 2022 (Vrabel, 2. 8. 2026)
  text: 'Vrabel tvrdí, že čtyřletá rekonstrukce tramvajové trati na Václavském náměstí (plánovaná do roku
    2027) je záměrně protahovaná, aby znemožnila konání velkých demonstrací na místě se silným symbolickým
    významem — argumentuje, že výměna kolejí, kanalizace a dlažby technicky nemůže trvat čtyři roky. Podobně
    dává do souvislosti zbourání prostoru pod Národním muzeem (po jeho demonstraci s vysokou účastí) a
    zaplocení okolí Úřadu vlády i legislativní zákaz shromažďování před Parlamentem. Popisuje vlastní
    zkušenost z let po roce 2022: media ho po masové demonstraci vykreslila jako „gangstera" (nekoupený
    lístek na autobus před 20 lety, vymyšlená provozovna na Vltavě), byl odsouzen za nezaškrtnutí kolonky
    v žádosti o náhradu covidové škody a jeho manželku soud zatížil vykonstruovaným dluhem 2,5 mil. Kč
    (policie sama v protokolu zaznamenala, že žalobce si „namaloval" 570 tis. Kč z požadovaného milionu,
    soud přesto důkaz nepřipustil). Tvrdí, že šlo o koordinovanou kampaň „naming and shaming" (odkazuje
    na vlastní organizaci Kryt) s cílem politicky ho zlikvidovat a rozdělit vlastenecké hnutí pomlouváním
    (že „pracuje pro policii a tajné služby").'
  podtema: USA — volební systém
- id: vrabel-2026-08-02-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ruský útok na sklad munice v Chmelnycku — „atomový" hřib z podzemního protiatomového krytu (Vrabel,
    2. 8. 2026)
  text: Vrabel komentuje záběry obrovského oblaku připomínajícího houbu po jaderném výbuchu, který vznikl
    po ruském útoku na sklad munice v Chmelnycké oblasti — vysvětluje, že šlo o starý protiatomový sklad
    ještě ze Sovětského svazu, kde Ukrajinci skladovali zbraně (podle dostupných zpráv možná i munici
    s ochuzeným uranem). Tvrdí, že Rusko disponuje raketami (zmiňuje Kinžal a Orešnik) se speciálními
    hlavicemi schopnými prorazit až 100 metrů do země, než detonují — což umožňuje zničit i takto chráněné
    podzemní sklady. Dává to do souvislosti se svou tezí o riziku pro Českou republiku, pokud by se na
    jejím území nacházely sklady zbraní nebo případně francouzské jaderné zbraně (viz [jaderne-zbrane.md](jaderne-zbrane.md))
    — rozdíl mezi zásahem běžného skladu munice a skladu s jadernou municí by byl podle něj zásadní.
  podtema: Vyjednávání a mír
- id: vrabel-2026-08-02-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trump obviňuje Čínu z vměšování do voleb — „kdo to říká, ten to je" (Vrabel, 17. 7. 2026)
  text: '**2. 8.** — K vlastnímu zamyšlení o porušování mezinárodního práva doplňuje konkrétní popis zásahu
    USA ve Venezuele: podle Vrabela přijeli, zajali prezidenta i jeho ženu a přepadli palác — čistý „banditismus"
    vůči suverénní zemi, srovnatelný s americkým útokem na Írán (zabití nejvyššího duchovního vůdce, přirovnává
    k zabití papeže) — [Nedělní vysílání 2. 8.](_zdroje.md#ladislav-vrabel--nedělní-vysílání-2-8-2026)'
  podtema: Zahraniční aktéři a precedenty
