      diplomatické nasazení
- id: vrabel-2026-07-23-04
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: 'Arménie: trestní stíhání opozice a síť Rothschild–Trump–Kushner (Vrabel, 6. 6. 2026)'
  text: '**23. 7.** — Vrabel rozvádí tutéž tezi obecněji: skutečnou světovou mocí nejsou zvolení politici,
    ale soukromí bankéři, kterým jsou státy zadlužené — americký Fed (soukromá banka) i centrální banky
    evropských zemí. Tvrdí, že tyto banky založily rodiny „chazarských Židů" vyhnané před staletími z
    Ruska, které se rozšířily po Evropě a USA; ti podle něj skutečně rozhodují o válkách, ovládají média
    i organizace jako Globsec a Bilderberg — z čehož vyvozuje, že americkému prezidentovi (Trumpovi) je
    pro ně nakonec „úplně jedno", je-li nahrazen demokraty, protože obchodní a válečná agenda USA se tím
    nezmění.'
- id: vrabel-2026-07-23-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: EU odmítla zaregistrovat iniciativu Save Europe Act; migrační pakt jako nevyhnutelnost (Vrabel,
    23. 7. 2026)
  text: 'Evropská komise odmítla zaregistrovat Evropskou občanskou iniciativu Save Europe Act (zastavení
    přistěhovalectví nezápadních migrantů, posílení hranic, remigrace neintegrovaných), pod niž se za
    měsíc podepsalo ~590 tisíc lidí (k postoupení Evropskému parlamentu je potřeba milion podpisů z členských
    států) — komise důvod uvedla rozpor se „základními hodnotami EU", konkrétně se zásadami rovnosti a
    nediskriminace. Organizátoři ohlásili odvolání právní cestou. Vrabel (sám spoluautor jiné evropské
    občanské iniciativy) argumentuje, že odmítnutí nebylo otázkou nedostatečného počtu hlasů — i 590 tisíc
    je významné číslo —, ale principiální: požadavek na remigraci migrantů je pro Evropskou komisi neslučitelný
    se „solidaritou" jako základním stavebním kamenem EU, na níž stojí i migrační pakt. Z toho vyvozuje,
    že představa, že česká vláda migrační pakt jednoduše odmítne a tím věc vyřeší, je „velmi naivní" —
    pakt je pro EU stejně zásadní jako odmítnutí remigrace, a začne k nám „velmi brzy" (odhaduje leden
    až březen) přivážet migranty z islámských zemí. Ilustruje nadřazenost práva EU (čl. 10 Ústavy — mezinárodní
    smlouvy nad českým právem) přirovnáním k šestiletému dítěti, které nemá jinou možnost než poslechnout
    rodiče.'
  citace:
  - text: Migrační pakt je záležitost, která je pro Evropskou komisi úplně stejně postavená na evropských
      hodnotách, jako [byla] odmítnuta remigrace.
- id: vrabel-2026-07-23-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Vučič a „konec volného trhu" — British Steel jako důkaz (Vrabel, 18. 7. 2026)
  text: '**23. 7.** — Vrabel kritizuje návštěvu Andreje Babiše a Karla Havlíčka v Bělehradu: místo aby
    se od Srbska (ekonomicky rostoucí, bez migrantů, vojensky neutrální, nemusí poslouchat EU) učili,
    jak vypadá suverenní politika, přesvědčovali Srbsko o výhodách vstupu do EU — totéž podle Vrabela
    dělal už dřív Tomio Okamura. Jako doklad srbské suverenity cituje odmítnutí prezidenta Vučiče podepsat
    závěrečnou deklaraci kyjevského summitu „Ukrajina a jihovýchodní Evropa" (uznávající Rusko za agresora)
    — Srbsko dál obchoduje s Ruskem i Čínou a nepřipojilo se k žádným sankcím. Vučiče znovu označuje za
    „nejlepšího politika na světě", kterého si přeje mít místo Babiše a Havlíčka.'
  citace:
  - text: Aleksandar Vučič se nepřipojil ani k jedné sankci proti Ruské federaci [...] je prezidentem
      suverénní země Srbska. Jeho zvolili srbští občané a on nebude poslouchat příkazy ani z Evropské
      unie, ani z žádných jiných globalistických organizací.
  osoby:
  - osoba: aleksandar-vucic
    vztah: pozitivni
    kontext: Jediný na kyjevském summitu nepodepsal deklaraci uznávající Rusko za agresora — Vrabel znovu
      „nejlepší politik na světě"
  - osoba: andrej-babis
    vztah: negativni
    kontext: V Bělehradu přesvědčoval Srbsko o vstupu do EU, místo aby se od Vučiče učil suverenní politice
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-23-07
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Zasypání posledního černouhelného dolu ČSM v Karviné jako likvidace suverenity (Vrabel, 23.
    7. 2026)
  text: 'Na Karvinsku začalo zasypávání první jámy dolu ČSM — posledního činného černouhelného dolu v
    ČR (těžba skončila v lednu 2026); do téměř kilometr hluboké jámy míří přibližně 45 tisíc kubíků hlušiny,
    další jámy budou následovat, čímž skončí éra černouhelné těžby v Česku. Vrabel na příkladu ukazuje
    mechanismus fungování EU: nejprve nasype dotace a fondy (silnice, školy, zemědělství, turistika),
    výměnou za úpravu zákonů, které připraví právní rámec pro pozdější řízení země zvenčí — a jakmile
    Evropská komise nařídí likvidaci fosilních paliv, česká vláda nerostné bohatství nechá zatopit vodou
    a zasypat kamenem, aby ho už nikdo nemohl vytěžit. Zdůrazňuje, že jde o nevratné zničení hodnoty (na
    rozdíl od pouhého dočasného odstavení), a to bez racionálního důvodu kromě zisku firem podílejících
    se na zasypávání. Připomíná čl. 10 Ústavy (mezinárodní smlouvy nadřazené českému právu) jako právní
    základ této podřízenosti — Česká republika je podle něj fakticky „protektorát Evropské unie".'
  citace:
  - text: Zasypáváme svoje uhelné doly, naše bohatství, naši energii [...] aby se k tomu nikdo nemohl
      dostat.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-23-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Rubio–Lavrov na ASEANu: Rusko diplomaticky „vyhrálo", další vyzbrojování Ukrajiny „neakceptovatelné"
    (Vrabel, 23. 7. 2026)'
  text: Na okraj summitu ASEAN (kam Rusko ani USA formálně nepatří, obě byly jen přizvány jako přátelské
    státy) došlo na žádost americké strany k bilaterálnímu, 35minutovému jednání ministra zahraničí Marka
    Rubia se Sergejem Lavrovem. Zatímco USA vydaly jen velmi obecné vyjádření, Rusko zveřejnilo diplomatickou
    cestou (web ministerstva zahraničí) podrobnější popis jednání. Podle Vrabelova výkladu Lavrov Rubiovi
    na rovinu popsal situaci na bojišti (ruská armáda dle něj nikde neprohrává, opak toho, co píší americká
    a evropská média) a připomněl, že Rusko akceptovalo vše dohodnuté mezi Trumpem a Putinem v Anchorage,
    zatímco USA dohodu nedodržely. Lavrov výslovně řekl, že Rusko si je vědomo americké role při navádění
    ukrajinských raket hluboko na ruské území (Starlink + zpravodajské informace) a že další vyzbrojování
    Ukrajiny ze strany USA je „nepřijatelné, neakceptovatelné". Vrabel to hodnotí jako diplomatickou výhru
    Ruska (USA o schůzku samy požádaly, Rubio odešel jako „ne vítěz") a jako signál, že Rusko přestává
    před Američany předstírat roli usilující o mír — chystá se dokončit „speciální vojenskou operaci"
    alespoň v části Donbasu a je ochotno k diplomatickému řešení jen za vlastních podmínek, nikoli podmínek
    Ukrajiny.
  citace:
  - text: Rusové jsou připraveni diplomatickému řešení konfliktu, ale pouze za ruských podmínek, ne za
      podmínek Ukrajiny.
  osoby:
  - osoba: sergej-lavrov
    vztah: neutralni
    kontext: 'Na ASEANu řekl Rubiovi, že další vyzbrojování Ukrajiny ze strany USA je „neakceptovatelné"
      — Vrabel: diplomatická výhra Ruska'
  - osoba: marco-rubio
    vztah: rozporuplny
    kontext: Odešel ze schůzky s Lavrovem na ASEANu jako „ne vítěz" — USA si schůzku samy vyžádaly
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-23-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Polský generální štáb očekává ruskou invazi po roce 2027; Poláci jsou „mentálně už ve válce"
    (Vrabel, 23. 7. 2026)
  text: Generální štáb polských ozbrojených sil pro případ vojenského konfliktu s Ruskem uvedl, že případnou
    ruskou invazi očekává nejdříve po roce 2027 — součástí příprav je i budování obranných opatření v
    rámci projektu „Východní štít", na němž polští a němečtí vojáci společně pracují (ženijní úkoly, výměna
    zkušeností, úprava terénu ke zpomalení postupu nepřátelských jednotek). Vrabel k tomu pouští úryvek
    vystoupení neidentifikovaného polského důstojníka, který argumentuje, že Polsko nesmí pasivně čekat
    na ruský útok a v případě signálů o hrozícím napadení by mělo udeřit jako první — což Vrabel označuje
    za „velmi nebezpečné slovo". Navazuje na svou opakovanou tezi (naposledy v nedělním vysílání), že
    za čtyři a půl roku protiruské propagandy a sankcí se z mnoha Poláků, zejména důstojníků, stali „absolutní
    fanatici" a že Poláci jsou už „mentálně ve válce" s Ruskem — s odkazem na záběry z pohraničí, kde
    se rozvíjejí zátarasy a rozmisťuje technika. Srovnává postoj polského důstojníka s vyjádřením šéfredaktorky
    Russia Today, která argumentuje, že zatímco Rusko do Evropy neposlalo jediný tank ani raketu, Evropa
    posílá do Ruska tisíce zbraní — Rusko podle ní drží odstup, ale při pokračující jednotné eskalaci
    Evropy varuje Sergej Lavrov, že válka „nebude konvenční", což implikuje i jaderný konflikt.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-23-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: ČR podporuje čečenskou exilovou vládu (Ičkerie) — „další podporovaný převrat" (Vrabel, 18. 7.
    2026)
  text: '**23. 7.** — Doplňuje detaily jednání (proběhlo o víkendu v pražské kavárně za přísných bezpečnostních
