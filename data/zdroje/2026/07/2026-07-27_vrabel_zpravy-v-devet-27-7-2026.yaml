  nadpis: 'České státní dluhopisy klesají — Vrabel: vinna zahraniční politika, ne „mezinárodní situace"
    (Vrabel, 27. 7. 2026)'
  text: 'České státní dluhopisy v posledních dvou týdnech výrazně ztratily na hodnotě, jejich výnosy (náklady
    na financování státního dluhu) vzrostly téměř na čtyřleté maximum — ekonomové to připisují zhoršené
    náladě na světových trzích po eskalaci na Blízkém východě a obavám z inflace. Vrabel toto vysvětlení
    odmítá: podle něj je hlavní příčinou zahraniční politika samotné ČR — postup z 10. na 5. místo na
    ruském seznamu nepřátelských zemí dělá z ČR nestabilnější, potenciálně tranzitní zemi pro budoucí
    konflikt. Jako další faktory uvádí rostoucí zadlužení, slábnoucí ekonomiku, vysoké vstupní ceny energie
    pro firmy, byrokracii a migraci (zmiňuje anekdotický postřeh o rostoucím počtu žen v hidžábu v Praze
    jako „ukazatel nestability").'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-27-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Odchod šéfa BIS Koudelky — Vrabel: „dvojitý agent CIA" (25. 7. 2026)'
  text: '**27. 7.** — V souvislosti s přípravou letošní zprávy o extremismu odešli z ministerstva vnitra
    úředníci, kteří se dlouhodobě podíleli na jejím sestavování — dle serveru Parlamentní listy kvůli
    neshodám nad podobou dokumentu a v minulosti podporovali zásahy státu proti „rizikovému obsahu" na
    internetu. Vrabel Parlamentní listy označuje za „hlásnou troubu" současné vlády, podobně jako ostatní
    média — podle něj jde jen o „rekorytarizaci" (výměnu lidí na postech, aby si noví mocní dosadili vlastní
    lidi), ne o skutečnou změnu přístupu. Jedinou reálnou změnou ve zprávě o extremismu je dle něj vyřazení
    vládního SPD ze seznamu sledovaných subjektů — jinak systém zůstává stejný: připomíná, že jeho hnutí
    neúspěšně žádalo ústavně-právní výbor Poslanecké sněmovny (JUDr. Vesecká), aby přehodnotil a rehabilitoval
    jeho manželku, kterou bezpečnostní služby označily za „bezpečnostní ohrožení státu" — výbor odpověděl,
    že do takových záležitostí nemá v úmyslu zasahovat. Jako doklad pokračující represe uvádí, že ve vězení
    zůstává Tomáš Čermák (za politická prohlášení) a že byl před dvěma měsíci odsouzen člověk za mikinu
    a auto s písmenem „Z".'
- id: vrabel-2026-07-27-05
