  nadpis: 'Hormuzský průliv každý pátek: Trump prý manipuluje trh s ropou (Vrabel, 17. 7. 2026)'
  text: '**27. 7.** — Vrabel popisuje, jak Trump tentokrát pozměnil své obvyklé schéma: napjatou situaci
    vygradoval oznámením možných úderů na Írán a hlasováním v Senátu o volné ruce k útoku, ceny ropy díky
    tomu vyskočily přes 100 dolarů — a poté, namísto obvyklého oznámení „na konci týdne" (kdy se cena
    stihne uklidnit ještě před uzavřením burz), oznámil ústup od útoku na Írán v neděli, tedy den, kdy
    to nikdo nečekal, takže se propad ceny projevil hned v pondělí. Vrabel to čte jako důkaz, že lidé
    z Trumpova okolí (jmenuje „realitní makléře" Kushnera a Witkoffa) předem vědí o načasování oznámení
    a vsázejí na pokles i růst ceny ropy, čímž kasírují „stovky milionů, možná miliardy" dolarů — přirovnává
    Trumpa k hráči, který střídavě „otevírá a zavírá" Hormuzský průliv každý týden podle potřeby.'
  podtema: Manipulace trhu s ropou
