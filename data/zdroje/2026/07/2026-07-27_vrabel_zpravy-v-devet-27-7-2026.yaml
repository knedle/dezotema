  nadpis: 'Výměna lídrů bez voleb: Burnham v UK a odstoupení prezidenta v Maďarsku (Vrabel, 18. 7. 2026)'
  text: '**27. 7.** — Vrabelova predikce se potvrzuje: Volodymyr Zelenskyj se setkal s Burnhamem při jeho
    prvním přijetí zahraničního představitele od nástupu do funkce — Burnham hned prohlásil, že Británie
    „v žádném případě nebude měnit kurz" podpory Ukrajiny. Vrabel to komentuje sarkasticky („spálená šunka")
    jako potvrzení, že žádná změna oproti Starmerovi nenastala. Zelenskyj v rozhovoru pro Sky News zároveň
    oznámil záměr postavit ve Velké Británii velký závod na výrobu dronů a vyjádřil naději, že Londýn
    bude v tomto směru „postupovat stejně".'
  podtema: Kritika soudnictví
- id: vrabel-2026-07-27-07
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Sankce EU brání Španělsku hasit požáry ruskými vrtulníky Kamov (Boldy, 27. 7. 2026)
  text: '**Téhož dne** — Vrabel nezávisle přináší stejnou zprávu s dalšími detaily: deset ruských hasicích
    vrtulníků Ka-32 zůstalo ve Španělsku na zemi, protože provozovatelé (soukromé firmy najímané místními
    samosprávami) kvůli sankcím EU nemohou sehnat náhradní díly ani servis od ruských specialistů; roli
    hraje i pozastavení certifikace ze strany Evropské agentury pro bezpečnost letectví (EASA). Dodává,
    že požáry zasáhly i oblíbenou oblast jihozápadní Francie kolem Bordeaux (pláže Biscarrosse, Hossegor)
    a že podle jedné z divaček oheň postupuje ke zbrojařským závodům — ironicky doufá, že to uspíší nasazení
    hasicí techniky.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-27-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Putin: západní Ukrajina by mohla připadnout Polsku, Maďarsku a Rumunsku (Vrabel, 27. 7. 2026)'
  text: Ruský prezident Vladimir Putin v posledním vystoupení uvedl, že západní části Ukrajiny by v budoucnu
    (dle něj v horizontu několika let až desetiletí) mohly připadnout státům, kterým historicky patřily
    před připojením k Ukrajině za vlády Stalina — tedy Polsku, Maďarsku a Rumunsku; označil to za „historický
    návrat". Zároveň zopakoval kritiku ukrajinské politiky vůči rusky mluvícímu obyvatelstvu. Vrabel to
    spojuje se svou opakovanou tezí, že Ukrajina je fakticky „prodaná" a hluboce zadlužená (90 mld. eur
    jen z posledního unijního balíčku, vše ve formě půjček) — i po skončení války podle něj Ukrajina zůstane
    natolik zadlužená vůči EU a Mezinárodnímu měnovému fondu, že jí fakticky nebude patřit, a nevylučuje,
    že si část jejího území nakonec „vezmou" sousední státy (Polsko, případně Rumunsko). Připomíná i to,
    že export ukrajinského obilí (dříve 80 % přes Černé moře) je nyní blokován ruským uzavřením přístavů
    u Oděsy, což dále prohlubuje ukrajinskou fiskální závislost na západních půjčkách.
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-27-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Putin navýšil počet ozbrojených sil na 2,43 milionu; USA omezují dovoz strategických surovin
    (Vrabel, 27. 7. 2026)
  text: Vladimir Putin podepsal s platností od 1. srpna dekret zvyšující celkový počet ruských ozbrojených
    sil na 2 426 130 osob (z toho 1 535 000 vojáků) — navýšení o 25 tisíc oproti dosavadnímu stavu, navazující
    na již dříve oznámené doplnění záloh o 140 tisíc. Vrabel srovnává tento počet s kapacitami zemí NATO
    (Německo plánuje 460 tisíc, Polsko stovky tisíc) a konstatuje, že ani component společně nedosahují
    ruského 1,5milionového aktivního stavu — pokud by Evropa chtěla vážně vést válku s Ruskem, musela
    by výrazně navýšit počty vojáků, které „se budou muset odněkud vzít". Očekává, že po ruských prezidentských
    volbách (18.–20. září) může následovat další mobilizace. V souvislosti s tím zmiňuje samostatnou zprávu,
    že USA od roku 2027 zakážou americkému obrannému průmyslu nákup vybraných strategických surovin z
    Číny, Ruska, Íránu a Severní Koreje — komentuje to jako další krok k odstřižení dodavatelských řetězců
    mezi znepřátelenými bloky.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-27-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 85. výročí masakru v Garavicích — paralela chorvatského a ukrajinského nacionalismu (Vrabel,
    27. 7. 2026)
  text: 'V Garavicích u bosenského Bihaće si připomněli 85 let od masakru, při němž jednotky chorvatských
    ustašovců v roce 1941 zavraždily podle historických záznamů přibližně 12 000 civilistů — Srbů, Židů
    a Romů, včetně žen a dětí; místo patří mezi největší popraviště Srbů na území tehdejšího nezávislého
    státu Chorvatsko. Vrabel zprávu dává do přímé paralely se svou opakovanou tezí o dnešním ukrajinském
    nacionalismu — způsobem, jakým podle něj „funguje nacismus": nejprve rétorické odepření práva na existenci
    určité skupině (cituje výrok současného velitele ukrajinské armády, že Rusko „nemá právo na existenci"),
    poté jeho násilné vyloučení. Řadí to do jedné linie s dřívějším rozborem chorvatské operace Oluja
    (1995) a se svým dlouhodobým tvrzením o cíleném vyvražďování Rusů na Ukrajině od roku 2014.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-27-11
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: ČR nemá od EU žádnou povinnost větrníky stavět — jen dobrovolný závazek 30 % OZE (Vrabel, 24.
    7. 2026)
  text: '**27. 7.** — Vláda akcelerační zóny skutečně schválila — ze 110 na 61 lokalit, s přísnějšími
    podmínkami posuzování dopadů (hluk, světelné efekty, ochrana přírody), ale beze změny cílového podílu
    30,1 % elektřiny z obnovitelných zdrojů do roku 2030. Vrabel opravuje mediální rámování „vláda omezila
    větrníky ve prospěch lidí/přírody": ve skutečnosti šlo o vládou zcela dobrovolné rozhodnutí schválit
    akcelerační zóny jako takové (viz výše — povinnost k tomu neexistovala), přičemž menší plocha zón
    neznamená méně turbín, jen jejich hustší nasazení na vymezeném území a omezené pravomoci ministerstva
    životního prostředí i obcí tyto stavby v zóně zastavit. Zdůrazňuje, že vláda mohla místo toho zvolit
    jinou energetickou koncepci (malé jaderné reaktory — o jednání s Rosatomem na toto téma se dle něj
    nyní poprvé mluví veřejně), ale rozhodla se pokračovat v agendě Green Dealu zahájené vládou Petra
    Fialy v rámci Národního plánu obnovy.'
  podtema: Politická reakce v ČR
