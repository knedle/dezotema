  nadpis: Spor vláda vs. prezident jako mediální distrakce od skutečných problémů — Rajchl (21. 7. 2026)
  text: V krátkém pozdravném videu po návratu z dovolené Rajchl sám relativizuje mediální pozornost věnovanou
    vztahu vlády a prezidenta — očekávaný večerní střet s Janem Jakobem na CNN Prima News má být opět
    o tomto tématu, které ale nepovažuje za podstatné. Podle něj Pavel „vychutnává si svoji Kim Ir-senizaci"
    a neuvěřitelnou adoraci opozičních „patolízalů", ale to nijak nezlepšuje životy občanů. Za skutečně
    důležitá témata označuje Green Deal, nedostatek lékařů a zdravotních sester v příštích 10–15 letech
    a nízké invalidní důchody — sliboval si, že tato témata do debaty přesto prosadí.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-07-21-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Obhajoba klienta stíhaného za komentář proti demonstraci na podporu Pavla — Rajchl (21. 7. 2026)
  text: Rajchl zmiňuje, že bezprostředně po návratu z dovolené obhajoval u okresního soudu v Chebu „obyčejného
    člověka", kterého se podle něj současný „represivní systém s přetrvávajícími proukrajinskými tendencemi"
    snažil kriminalizovat pouze za to, že na Facebooku vyjádřil nesouhlasný komentář s demonstrací na
    podporu Petra Pavla. Řadí případ k obecnější tezi o selektivním vymáhání práva vůči kritikům prezidenta
    a vlády.
  podtema: Politická perzekuce
