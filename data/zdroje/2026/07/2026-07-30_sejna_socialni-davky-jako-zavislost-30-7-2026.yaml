  nadpis: Sociální dávky jako závislost — analogie s krmením divoké zvěře (Šejna, 30. 7. 2026)
  text: 'Adam Šejna (Restart Česko) přirovnává vyplácení sociálních dávek ke krmení divoké zvěře: stejně
    jako se zvíře, kterému se dává jídlo zdarma, přestane o potravu snažit samo a stane se závislým, i
    lidé, kterým stát dává „úplně všechno zadarmo bez potřeby jakékoliv práce", si na tento stav zvyknou
    natolik, že už nikdy nebudou pracovat.'
