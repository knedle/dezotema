  nadpis: Nerudová kritizuje Turka za nežalování Pavla — Šejnova obhajoba (28. 7. 2026)
  text: 'Ke stejné kauze se váže výrok Danuše Nerudové, že se Filip Turek „ráno podíval do zrcadla a spatřil
    tam nulu" — poté, co se Turek rozhodl nežalovat prezidenta Pavla za jeho výroky o jeho osobě (výroky
    opírající se dle Šejny o nepodložené tvrzení Ester Pokorné). Šejna se staví za Turka: nežalovat každého,
    kdo o člověku řekne něco nelichotivého, je podle něj rozumné chování, ne slabost — a vyčítá Nerudové,
    že sama Turka dlouhodobě kritizuje za „dětinské a nedospělé" výroky, zatímco její vlastní komentář
    hodnotí jako ještě nižší úroveň.'
  citace:
  - text: Zkuste se chovat trošičku jako politik. [...] Zkuste nejnižší úroveň, na kterou jste se mohla
      snížit. Gratuluju.
