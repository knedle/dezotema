  nadpis: ÚS rozhodl o Pavlovi rychleji než v případech násilných trestných činů — Šejna (29. 7. 2026)
  text: 'Adam Šejna (Restart Česko) navazuje na kauzu předběžného opatření Ústavního soudu ve prospěch
    účasti Petra Pavla na summitu NATO v Ankaře (viz [ÚS uložil akreditovat Pavla na summit (24. 6.)](/temata/petr-pavel.md#rajchl-2026-06-24-01)).
    Cituje Pavlovo prohlášení, že „nezávislá justice je pilířem naší demokracie", a obrací ho proti němu:
    srovnává rychlost rozhodnutí ÚS v Pavlův prospěch (do dvou dnů) s běžnými soudy, kde rodiče dětských
    obětí sexuálního násilí čekají na pravomocný rozsudek podstatně déle. Z toho vyvozuje, že člověk,
    který sám podkopává důvěru občanů ve vlastní justici, by neměl kázat o nestrannosti soudů.'
  citace:
  - text: Nemyslím si, že člověk, který podkopává důveru českých občanů vůči naší vlastní justici, by
      měl kázat o tom, že soudy mají být nestrané.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
