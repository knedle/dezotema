vyroky:
- id: vrabel-2026-07-05-01
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: „Odebrání pravomocí prezidenta" jako mediální manipulace — Vrabel o Vondráčkovi (5. 7. 2026)
  text: 'Předseda Sněmovny Libor Vondráček prosadil změnu, po níž titulky médií hlásaly, že parlament
    „odebral pravomoci prezidenta". Vrabel vysvětluje skutečný mechanismus: u jmenování na některé zahraniční
    pozice dosud platilo, že návrh připraví ministerstvo zahraničí, schválí vláda a prezident provede
    formální jmenovací akt — nově tento poslední krok provede rovnou vláda/premiér bez prezidentova podpisu.
    Jde tedy jen o přesun čistě formálního úkonu, ne o věcnou pravomoc, ale titulek „odebrali pravomoci
    prezidentovi" vyzní jako zásadní oslabení hlavy státu. Vrabel to řadí do stejné kategorie jako polemiku
    o odebrání Zelenského vyznamenání (viz [Rajchlův návrh na odebrání Řádu bílého lva](/temata/valka-ukrajina-prubeh.md#formální-návrh-na-odebrání-řádu-bílého-lva-zelenskému-jednomyslná-podpora-spd-pozitivní-reakce-polska-a-slovenska-rajchl-5-7-2026))
    — jde o „líbivé řeči" a mediální divadlo, které odvádí pozornost od skutečně zásadních jednání (jaderné
    zbraně, peníze pro Ukrajinu, členství v NATO).'
  osoby:
  - osoba: libor-vondracek
    vztah: negativni
    kontext: 'Prosadil změnu prezentovanou jako „odebrání pravomocí prezidenta" — Vrabel: jde jen o formální
      přesun jmenovacího úkonu, mediální manipulace'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-07-05-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Film Citizen Vigilant a sen o zabití Zelenského — „systém, ne člověk" (Vrabel, 5. 7. 2026)
  text: 'K diváckému dotazu na (v Německu zakázaný) nízkorozpočtový film Citizen Vigilant — kde hlavní
    hrdina vraždí zkorumpované soudce a pachatele, které systém nepotrestal — Vrabel film chválí jako
    „nastavení zrcadla společnosti" a rozvíjí vlastní tezi o dvou pilířích spravedlnosti (odstrašení a
    trest): když systém přestane trestat, lidé si podle něj nakonec vezmou spravedlnost do vlastních rukou,
    a přesně to podle něj vede k stavu, jaký je dnes na Ukrajině. Popisuje vlastní sen z téže noci, v
    němž objevil byt Volodymyra Zelenského a zvažoval, zda by ho měl zabít — nakonec ho „nezabil", mimo
    jiné proto, že by ho systém (kabala) stejně nahradil jiným loutkovým vůdcem (např. Valerijem Zalužným),
    protože podle Vrabela nejde o konkrétní osoby, ale o strukturu moci, která si politiky vybírá a formuje
    bez ohledu na to, kdo konkrétně sedí ve funkci. Dokládá to paralelou: nejede na summit NATO odmávat
    peníze Fiala, ale Babiš — výsledek je stejný. Doplňuje srovnání se svým vlastním sporem s justicí
    (žalované trestní oznámení manželky na insolvenčního správce, které opakovaně řeší tentýž zaujatý
    policista v Českých Budějovicích) jako příklad „mafiánsky" propojené struktury moci (soudci, policie,
    státní zástupci, politici).'
  podtema: Prezident a demokracie
- id: vrabel-2026-07-05-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Hodnocení AfD jako „jediné alternativy" pro Německo; SPD jako „falešná karta" (Vrabel, 5. 7.
    2026)
  text: 'Na dotaz k AfD Vrabel odkazuje na projev Alice Weidelové, s nímž prý souzní, a osobně se hlásí
    k jádru programu strany (migrace, boj proti globalismu, obrana proti deindustrializaci Německa) —
    zmiňuje, že bývalý partner jeho kamarádky patřil mezi tři zakladatele AfD, motivované migrační krizí.
    Výslovně se distancuje od frakce spojené se sudetoněmeckým Landsmannschaftem a požadavkem na zrušení
    Benešových dekretů. AfD označuje za „jedinou alternativu" pro Německo navzdory tomu, že je to už velká
    strana s „různě špinavými hrami" a různou mírou napojení jednotlivých členů na NATO — přeje si, aby
    na rozdíl od jiných stran po zvolení nezradila voličům slibovanou politiku. Kontrastuje to s SPD:
    přestože v ní má osobní přátele, označuje ji za absolutně centrálně řízenou stranu, kde si žádný poslanec
    netroufne jít proti Tomiu Okamurovi — toho samotného nazývá „falešnou kartou".'
  osoby:
  - osoba: alice-weidelova
    vztah: pozitivni
    kontext: Její projev na sjezdu AfD Vrabel označuje za velmi blízký vlastnímu pohledu na politiku
  - osoba: tomio-okamura
    vztah: negativni
    kontext: „Falešná karta" — SPD je absolutně centrálně řízená strana, nikdo si netroufne jít proti
      němu
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-05-04
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: '⚡ Konflikt: Vrabel odmítá Rajchlův návrh na odebrání Řádu bílého lva jako prázdné gesto (5.
    7. 2026)'
  text: 'Ve stejný den, kdy Rajchl (viz výše) prezentuje svůj formální návrh jako důležitý čin národní
    cti, Vrabel jej hodnotí opačně — jako „jenom líbivé řeči": odebrat vyznamenání může výhradně prezident
    svým rozhodnutím, a Petr Pavel to nikdy neudělá, takže návrh nic nezmění. Připomíná, že Miloš Zeman
    coby bývalý prezident už řád nemůže vzít zpět a jeho vlastní výzvy k „nápravě" jsou jen snahou zachránit
    si tvář za to, že vyznamenání Zelenskému sám udělil. Podle Vrabela podobná gesta (stejně jako spor
    o „odebrání pravomocí prezidenta" — viz [petr-pavel.md](/temata/petr-pavel.md#vrabel-2026-07-05-01))
    slouží jen k tomu, aby lidé měli pocit, že „někdo za ně bojuje", zatímco válka a posílání peněz na
    Ukrajinu pokračují beze změny.'
  citace:
  - text: To jsou jenom líbivý řeči, aby lidi dávali lajky. [...] A lidi umírají dál a válka jede dál.
  osoby:
  - osoba: rajchl
    vztah: rozporuplny
    kontext: Návrh na odebrání Řádu bílého lva Zelenskému označen za „jenom líbivé řeči" bez reálného
      efektu
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-07-05-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Konkrétní návrh: ČR podle vzoru Srbska — vojenská neutralita + obchod se všemi bloky (Vrabel,
    5. 7. 2026)'
  text: 'Vrabel syntetizuje svůj dlouhodobý obdiv k Srbsku (viz výše) do konkrétního zahraničněpolitického
    programu pro ČR. Model: vojenská neutralita (Srbsko i uprostřed NATO odmítá vojenské závazky) kombinovaná
    s obchodem se všemi velkými bloky najednou — EU (největší srbský export), Čínou (bezcelní obchod s
    tisíci výrobky, výstavba dálnic/železnic, jediná evropská výroba humanoidních robotů), Ruskem (přímá
    dohoda s Putinem o ceně plynu pod tržní úrovní) i USA. Srbsko podle něj dokazuje, že malá země (7
    mil. obyvatel) nemusí volit stranu — může být součástí čínské iniciativy Belt and Road a zároveň obchodovat
    se Západem. Pro ČR (11 mil. obyvatel) navrhuje stejný recept: neúčastnit se případné války s Ruskem
    na svém území („chcete válčit s Ruskem? Ne přes Českou republiku"), udržet obchodní vztahy s Ruskem
    i Německem současně, a do bezpečnostně-vojenské roviny BRICSu (na niž se BRICS podle Vrabela posouvá,
    viz [BRICS se mění na bezpečnostní pakt, 4. 7.](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-04-12))
    se nezapojovat, dokud to nebude nutné — pouze v ekonomické/obchodní rovině. Připouští, že takovou
    politiku by v ČR dnes neprosadil žádný politik.'
  podtema: Zahraniční aktéři a precedenty
