      glosa o „mimoni"
  podtema: Dvojí metr v médiích
- id: rajchl-2026-07-05-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Rovné podmínky pro Ukrajince jako pro Čechy; „dovolená" na Ukrajině jako důkaz, že nejsou skuteční
    uprchlíci (Rajchl, 5. 7. 2026)
  text: 'Polsko zrušilo bezplatné bydlení pro ukrajinské uprchlíky (nastavilo pro ně stejná pravidla jako
    pro Poláky) — čeští mainstreamoví komentátoři to označili za bezcitné, Rajchl naopak žádá stejný krok
    pro ČR: srovnává to s českými emigranty před rokem 1989, kteří v cizině nedostávali žádné výhody a
    museli začínat od nuly (příklad vlastní sestřenice v USA). Za klíčový argument považuje to, že uprchlíci
    z Ukrajiny běžně jezdí „na dovolenou" zpět na Ukrajinu — což je podle něj v přímém rozporu s postavením
    uprchlíka (přirovnání: Kajínek by se také nemohl vrátit „na návštěvu" do věznice, ze které utekl).
    Navrhuje, aby návrat na Ukrajinu byl umožněn pouze těm, kdo splní podmínky českého azylového zákona;
    jinak jde o ekonomickou migraci, ne o útěk před válkou. Doplňuje vlastní zkušenost, kdy se ukrajinská
    žena bránila brzkému konci války, protože by tím přišla o dávky na bydlení.'
- id: rajchl-2026-07-05-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: 'Rajchl rozvíjí svůj dřívější návrh 15% rovné daně (viz [Flat tax 15 %, 3. 5.](#flat-tax-15--dph-15--adresné-dluhopisy-a-státní-obchodník-s-plynem--rajchl-3-5-2026))
    o konkrétní vzor Irska: to je díky nízké 12,5% korporátní dani a odbourané byrokracii jedinou zemí
    z bývalé skupiny „PIIGS" (Portugalsko, Itálie, Irsko, Řecko, Španělsko), která se z dluhové krize
    vymanila opačnou cestou než škrty — v roce 2025 mělo nejvyšší růst HDP v EU (12,2 %, rychleji než
    Čína) a přebytkový státní rozpočet, přestože je vojensky neutrální a téměř nic nedává na zbrojení.
    Rajchl navrhuje pro ČR: rovnou 15% daň se stabilitou na 4 roky a minimem výjimek (jednoduché daňové
    přiznání „na pivní tácek"), zrušení šedé ekonomiky (fakturační podvody se přestanou vyplácet), zpětné
    přilákání zahraničních firem k danění v ČR (dnes odchází ročně oficiálně 613 mld. Kč, neoficiálně
    přes bilion). Doplňuje protekcionistický balíček: adresné dluhopisy na konkrétní stavby (D3, D47,
    Dukovany) s úrokem 6–7 % místo úroků zahraničním bankám, veřejné zakázky primárně pro české firmy
    (odkazuje na spočítaných 45 % návratnosti veřejných peněz do rozpočtu do 3 let u českých firem, oproti
    téměř nulové návratnosti u zahraničních — příklad Onsemi, 10 mld. Kč za 1000 pracovních míst), vlastní
    potravinový řetězec nakupující od českých zemědělců (vzor: chorvatský řetězec Plodine) a jednotné
    místo kontaktu pro velké stavby místo obcházení 65 úřadů.'
  citace:
  - text: Národní pilíř, peníze naší ekonomiky, protekcionalismus našeho trhu, našich podnikatelů. Už
      dost bylo globalismu.
