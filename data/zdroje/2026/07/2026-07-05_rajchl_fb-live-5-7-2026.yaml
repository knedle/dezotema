- id: rajchl-2026-07-05-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Von der Leyen: bez nových vlastních zdrojů klesne rozpočet EU o 40 % — souvislost s financováním
    Ukrajiny (Vrabel, 4. 7. 2026)'
  text: 'Rajchl (5. 7.) i Vrabel (5. 7.) na totéž oznámení reagují nezávisle na sobě shodným odmítnutím:
    Rajchl vzkazuje, že by jako premiér EU „ani vindru" nedal a rozpočet EU by nechal škrtnout klidně
    o 40 % (obsahuje prý hlavně klimatickou agendu, Ukrajinu a „LGBTQ"), Vrabel dodává přesnější kontext
    programu „Savings and Investments" (von der Leyenová dlouhodobě cílí na soukromé úspory Evropanů,
    odhadem 300–600 mld. eur) jako alternativního zdroje k navýšení daní.'
  osoby:
  - osoba: ursula-von-der-leyen
    vztah: negativni
    kontext: 'Chce nové daně pro EU, jinak škrtne 40 % rozpočtu — Rajchl: „ani vindru", ať klidně škrtne'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: rajchl-2026-07-05-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Formální návrh na odebrání Řádu bílého lva Zelenskému — jednomyslná podpora SPD, pozitivní reakce
    Polska a Slovenska (Rajchl, 5. 7. 2026)
  text: Poté, co polský prezident Karol Nawrocki oficiálně odebral Zelenskému Řád Bílé orlice (na čemž
    se shodlo celé polské politické spektrum od Tuska po Kaczyńského) a polský ministr obrany pohrozil
    vetem vstupu Ukrajiny do EU, pokud Ukrajina neustoupí, Rajchl svou dřívější rétorickou výzvu (viz
    [7. 6.](#emisní-povolenky--spekulativní-derivátový-trh-němci-v-kleštích-penzijní-fondy--válka-povolenkám-zrušit-ets1ets2-i-za-cenu-vystoupení-z-eu-zelenský-upa--adorace-neonacismu-odebrat-řád-bílého-lva-čr-mlčí-vs-polsko-v4--čr-nedokáže-najít-národní-shodu-napříč-spektrem-7-6-2026)
    a [21. 6.](#21-6--zelenský-adoruje-nacismus-upa-pavlovo-mlčení--urážka-předků-odebrat-řád-bílého-lva-ať-ukrajinci-vrátí-polsku-i-peníze-zrušit-dočasnou-ochranudávky-ukrajincům--automatická-deportace-vyvrácení-statistiky-v-lásky-o-vězních-ukrajinské-děti-se-neasimilují-a-brzdí-výuku-vs-plaga-21-6-2026))
    povýšil na formální parlamentní návrh na odebrání Řádu bílého lva Volodymyru Zelenskému — poslanecký
    klub SPD (15 poslanců) ho podpořil jednomyslně, Tomio Okamura okamžitě bez váhání. Připomíná, že řád
    zavedl v roce 1922 T. G. Masaryk, který fašismus označoval za „patologickou sedlinu na národní demokracii"
    — dnes ho drží člověk pojmenovávající jednotky po UPA. Rajchl zdůrazňuje, že podstatné je návrh vůbec
    vyslovit bez ohledu na šanci na úspěch, a klade důraz na to, že Polákům (kterým Ukrajina „po čtyřech
    letech pomoci za 226 mld. Kč plivla do obličeje") tím chtěl ukázat solidaritu V4. Návrh přivítal europoslanec
    Jaroslav Tyška v Polsku (50 tis. lajků) i místopředseda Slovenské národní rady Andrej Danko.
  osoby:
  - osoba: volodymyr-zelensky
    vztah: negativni
    kontext: Formální parlamentní návrh na odebrání Řádu bílého lva; jednomyslná podpora klubu SPD
  podtema: Stav Ukrajiny a mobilizace
- id: rajchl-2026-07-05-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina po válce bude „ukřivděná" a obrátí se proti Západu — analogie s Výmarskou republikou
    (Rajchl, 5. 7. 2026)
  text: 'Rajchl varuje, že polská reakce na spor o Řád Bílé orlice (žádná omluva, jen vracení vyznamenání
    a nevděk) je předzvěstí toho, jak se Ukrajina zachová po skončení války vůči celému Západu: bude se
    cítit zrazená a podvedená (částečně oprávněně — v Istanbulu 2022 byla mírová dohoda na stole, ale
    Boris Johnson zablokoval západní garance) a obrátí se proti těm, kdo ji financovali. Klíčové je pro
    něj varování polského historika Šviatla, že Ukrajina bude mít po válce nejlépe vyzbrojenou a vycvičenou
    armádu v Evropě — přirovnává to k nacistickému Německu, které jen 6 let po hyperinflaci a hladomoru
    Výmarské republiky rozpoutalo světovou válku, protože ho Západ (ze strachu ze spojení s komunistickým
    SSSR) finančně a vojensky „vychoval" jako protiváhu Stalinovi. Rajchl vidí paralelu v dnešním financování
    Ukrajiny (90 mld. eur z EU, plánovaných 70 mld. dolarů přes NATO) jako vytváření „přehrady mezi Ruskem
    a námi", která se může stejně jako Německo obrátit proti svým sponzorům. Uzavírá, že by na Ukrajinu
    neposlal „už ani korunu" a apeloval by na uzavření míru za každou cenu.'
  podtema: Stav Ukrajiny a mobilizace
