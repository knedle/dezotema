- id: vrabel-2026-07-24-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Húsíové zaútočili na tankery v Báb al-Mandabu; ropa nad 100 $ poprvé od května (Vrabel, 23.
    7. 2026)
  text: '**24. 7.** — Vrabel doplňuje, že v Báb al-Mandabu od roku 2024 operuje vlastní vojenská mise
    Evropské unie (Vrabel si nebyl jistý přesným názvem — patrně Aspides), v jejímž rámci momentálně působí
    tři evropské fregaty (aktuálně španělská, řecká a francouzská) a jež má na kontě zajištění průjezdu
    už přes 6 000 lodí. Operaci velí řecký admirál, politicky ji ale řídí komisařka pro zahraniční věci
    a bezpečnost Kaja Callas, která zdůraznila, že húsíjské útoky porušují mezinárodní právo na svobodnou
    plavbu. Vrabel to uvádí jako důkaz, že EU není jen politické uskupení, ale reálně vede vlastní vojenskou
    misi v aktivním konfliktu s Húsíji — a varuje, že se pro Evropu může toto křídlo ukázat jako „velmi,
    velmi horké".'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-24-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'USA zavedly nová cla 10–12,5 % na 60 zemí; Kallas: „EU se to netýká", ale už máme 15 % (Vrabel,
    24. 7. 2026)'
  text: 'Spojené státy v pátek zavedly nová cla ve výši 10–12,5 % na zboží od 60 obchodních partnerů (včetně
    EU a Číny) s odůvodněním, že tyto země dostatečně neomezily dovoz zboží od nucené pracovní síly —
    krok následoval poté, co vypršela platnost dočasného globálního 10% cla poté, co Nejvyšší soud USA
    v únoru zrušil Trumpovo plošné reciproční clo 10–50 % vydané na základě Zákona o národních nouzových
    situacích. Evropská komisařka pro zahraniční věci Kaja Kallas k tomu uvedla, že se to EU netýká, protože
    již má s USA vlastní obchodní dohodu. Vrabel to komentuje jako „komedii nevídanou": ona samostatná
    dohoda, kterou vyjednala Ursula von der Leyen, totiž znamená clo ve výši 15 % — vyšší než nově zavedené
    clo pro ostatní partnery, které mělo EU teprve postihnout. Navazuje na svou opakovanou kritiku „diverzifikace"
    od ruských energií výměnou za dražší americké dodávky a nevýhodnou obchodní dohodu (GMO potraviny
    bez cla pro USA, 15% clo na evropský export) — srovnává německou ekonomiku (krize VW, obviňování Číny
    z „nekalé konkurence" kancléřem Merzem) s výsledkem vlastního rozhodnutí odstřihnout se od levných
    zdrojů energie.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-24-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Merz obviňuje Čínu z „nekalé konkurence"; Vrabel: Německo si za krizi může samo (24. 7. 2026)'
  text: 'Německý kancléř Friedrich Merz začíná prosazovat tvrdší postoj vůči Číně — reaguje na úbytek
    pracovních míst, pokles vývozu automobilů a rostoucí obchodní deficit; obviňuje Čínu z „nekalé konkurence"
    a záměrně podhodnocené měny, přestože ještě nedávno prosazoval opatrnější přístup. Vládní postoj není
    jednotný (ministerstvo zahraničí chce tvrdší postup, ministerstvo hospodářství se obává čínské odvety),
    ale tlak malých a středních podniků žene Berlín k tvrdší reakci. Vrabel si všímá německé přezdívky
    kancléře „Schmerz" (od Schmerzen — bolest) a odmítá rámování viny na Čínu: Německo si ekonomické problémy
    (statisíce ohrožených míst ve Volkswagenu) způsobilo samo tím, že se odstřihlo od levných ruských
    energií výměnou za dražší americké dodávky a nevýhodnou obchodní dohodu s USA. Ptá se, v čem konkrétně
    má spočívat „nekalá" čínská konkurence, když čínská auta jsou prostě levnější a často kvalitnější
    — odmítá i běžně používaný rámec „fair konkurence" (Ursula von der Leyen) jako ekonomicky nesmyslný:
    konkurence podle něj přirozeně znamená, že někdo umí a někdo neumí, a Evropa v tuto chvíli neumí,
    protože se nechala zatáhnout do her, které nemůže vyhrát.'
  osoby:
  - osoba: friedrich-merz
    vztah: negativni
    kontext: 'Obviňuje Čínu z nekalé konkurence kvůli krizi VW — Vrabel: Německo si za to může samo odstřižením
      od ruských energií'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-24-04
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: 'EU pokutovala Google za DMA; Vrabel: Google je americký armádní projekt (23. 7. 2026)'
  text: '**24. 7.** — Vrabel rozvádí tezi na základě zpráv o vyostřeném sporu USA–EU kolem kontroly digitálních
    služeb: Trump požaduje poplatky za využívání infrastruktury amerických technologických platforem a
    hrozí omezením jejich dostupnosti pro EU (zmiňován konkrétně Google Maps); EU to označila za porušení
    mezinárodních pravidel a pohrozila sankcemi vůči americkým technologickým firmám. Vrabel tvrdí, že
    celý „Big Five" (Google, YouTube apod.) jsou americké armádní/vojenské projekty — Google Mapy fungují
    na amerických vojenských GPS satelitech, ke kterým EU nemá vlastní náhradu (evropský navigační systém
    je teprve ve vývoji). Uvádí i X/Twitter Elona Muska jako příklad pokrytectví: Musk vystupuje jako
    „bojovník za svobodu", ale jeho satelitní internet Starlink umožňuje Ukrajině navádět rakety hluboko
    do Ruska — bez něj by válka „okamžitě" skončila. Z toho vyvozuje, že když Trump pohrozí vypnutím Google
    Maps pro Evropu, může se to klidně stát, protože jde o suverénní americkou vojenskou infrastrukturu,
    nikoli o soukromou firmu — a znovu vyzývá k vystoupení z EU/NATO jako jediné cestě k energetické i
    technologické suverenitě.'
- id: vrabel-2026-07-24-05
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Okamura v Číně: obdiv k automobilkám a případ zadrženého Čecha (Vrabel, 23.–24. 7. 2026)'
  text: '**24. 7.** — Čína v reakci na sankce EU vůči Rusku přidala na svůj exportní sankční seznam dalších
    14 subjektů z EU, mezi nimi českou firmu Tatra Trucks (vojenské/speciální nákladní automobily) — Čína
    jí s okamžitou platností přestane dodávat zboží dvojího užití. Mluvčí Tatry uvedl, že to na firmu
    nebude mít prakticky žádný dopad, protože ČR s Čínou téměř neobchoduje. Vrabel z toho vyvozuje, že
    Okamurova cesta reálný obchod s Čínou nezajistí — česká zahraniční politika je fakticky politikou
    EU, a EU vede vůči Rusku sankční politiku, jejímž vedlejším důsledkem jsou i čínské protisankce vůči
    ČR. Kritizuje, že voliči vlastenecké politiky sázeli na SPD/Okamuru jako na sílu, která povede k vystoupení
    z EU — předvolební téma „vystoupení z EU" ale strana po volbách opustila stejně jako ostatní, a dnes
    je pro většinu veřejnosti „mimo téma". Srovnává to s vlastním pozorováním, že se „vlastenecký odpor"
    (domobrana, demonstrace) rozpadá, zatímco ČR se v zahraniční politice vůči Rusku i Číně drží ještě
    tvrději při USA/EU než za vlády Petra Fialy — připomíná, že ČR pod Babišem poskočila z 10. na 5. místo
    na ruském seznamu nepřátelských zemí.'
- id: vrabel-2026-07-24-06
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Babišův plán vládní čtvrti v Letňanech — spekulace o prodeji budov (Vrabel, 24. 7. 2026)
  text: Premiér Andrej Babiš chce obnovit plán na výstavbu vládní čtvrti v pražských Letňanech (místo
    dříve zamýšlené nemocnice) — administrativní komplex pro cca 10 000 státních zaměstnanců, který by
    nahradil část ministerstev sídlících v centru Prahy. Projekt naráží na blízkost vojenského letiště
    Praha-Kbely (rostoucí význam pro armádu ČR i NATO) a vyžadoval by souhlas pražského magistrátu. Vrabel
    připomíná, že Babiš se stejným plánem přišel už v minulém volebním období, a spekuluje, že motivací
    je snaha získat peníze na zbrojení (viz zakázky pro Černou Horu a Chorvatsko) prodejem historických
    budov ministerstev v centru Prahy soukromým investorům — ty jsou dle něj udržované, v perfektním stavu
    a v cenné lokalitě, tedy potenciálně hodnotné v řádu miliard korun.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: ČR dodá Černé Hoře zbraně za 24,2 mil. eur — vláda tvrději prosazuje globalistické zájmy
      EU/NATO, než sliboval v kampani
- id: vrabel-2026-07-24-07
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Členské státy EU zruší ochranu ukrajinským mužům v bojeschopném věku — Vrabel: nehumánní dvojí
    metr (24. 7. 2026)'
  text: 'Členské státy EU se shodly, že nově příchozím ukrajinským mužům v bojeschopném věku (23–60 let)
    už nebude udělována ochrana — podle českého ministerstva vnitra by to mělo snížit tlak na dlouhodobě
    vytížené kapacity pro přijímání uprchlíků; muži 18–65 let tvoří přibližně polovinu nově příchozích
    z Ukrajiny, přesný počet mužů v odvodovém věku ministerstvo ani nesleduje. Vrabel rozhodnutí ostře
    odsuzuje jako „naprosto nehumánní" a v přímém rozporu s Ženevskými konvencemi a mezinárodním právem
    na ochranu před válkou: tito muži budou vráceni zpět na Ukrajinu, kde je Teritoriální obranné síly
    (TCK) narukují na frontu, kde pravděpodobně zemřou. Staví do kontrastu, jak snadno získávají ochranu
    v EU lidé přicházející ze zemí bez aktuální války (Sýrie, Afghánistán, Eritrea, africké státy) — stačí
    tvrzení o původu bez dokladů — zatímco lidé prchající ze skutečné probíhající války na Ukrajině mají
    být násilně vraceni zpět. Zdůrazňuje, že nejde o obranu lidí páchajících trestnou činnost nebo aktivně
    podporujících válku („sláva Ukrajině" — takové rád pošle bojovat), ale o muže, kteří se chtějí jen
    vyhnout účasti ve válce, mají rodiny a nechtějí bojovat — jejich násilné odeslání zpět označuje za
    „zločin proti lidskosti". Připomíná, že stejný osud čeká Čechy, pokud by válka přišla i do ČR (a uprchlíci
    ze Srbska).'
  citace:
  - text: Jestli někdo utíká z Ukrajiny, protože nechce být součástí té války, tak ho zákonem vzít a násilně
      ho odvést na Ukrajinu je zločin proti lidskosti.
- id: vrabel-2026-07-24-08
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Vučič a „konec volného trhu" — British Steel jako důkaz (Vrabel, 18. 7. 2026)
  text: '**24. 7.** — Vrabel doplňuje kontrastní příklad Černé Hory: ČR jí dodá zbraně a vojenský materiál
    za 24,2 milionu eur (~584 mil. Kč), dohodu oznámili premiéři Babiš a Milojko Spajić; prezident Pavel
    přijal černohorského premiéra a vyjádřil podporu vstupu Černé Hory do EU. Na rozdíl od Srbska se Černá
    Hora do EU sama těší a usiluje o vstup — Vrabel to komentuje ambivalentně (klientům radícím s nemovitostmi
    v Černé Hoře říká, že vstup zvýší ceny nemovitostí, ale i odliv lidí ze země). Zdůrazňuje, že jde
    o vůbec první zbrojní zakázku ČR se zemí NATO, a vyjadřuje překvapení, jak tvrdě dnešní vláda (přes
    předvolební billboardy „Česko na prvním místě") prosazuje globalistické zájmy EU/NATO — připomíná,
    že Babišovi kdysi psal SMS s výhradami ke stejné rétorice v kampani. Rozšiřuje o postřeh, že podobně
    cestuje i ministr zahraničí Petr Macinka (do Chorvatska „za naše peníze" přesvědčovat o navýšení zbrojení,
    s příslibem kontraktů od Michala Strnada přes kontakty v americkém Kongresu) i v Izraeli, kde vystupuje,
    „jako by rozhodoval za celý svět".'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-24-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Rubio–Lavrov na ASEANu: Rusko diplomaticky „vyhrálo", další vyzbrojování Ukrajiny „neakceptovatelné"
    (Vrabel, 23. 7. 2026)'
  text: '**24. 7.** — Vrabel dovysvětluje kontext jednání: rok předtím v Anchorage (po dlouhých přípravných
    schůzkách Jareda Kushnera a Steva Witkoffa, „realitních makléřů" bez politického mandátu, pověřených
    přímo Trumpem) přišly USA s tajným mírovým plánem přezdívaným „3 plus 2" — Rusko by okupovalo a formálně
    převzalo pouze Doněck, Luhansk a Krym („3"), plus Záporožskou a Chersonskou oblast („2"), a dál by
    nepostupovalo. Rusko dle svých vlastních prohlášení (Lavrov) svůj díl dohody plnilo a rok čekalo na
    plnění ze strany USA; teprve na ASEANu Rubio poprvé přiznal, že žádná písemná dohoda nikdy neexistovala
    a že plán padá, protože Ukrajina podmínky odmítá přijmout. Mluvčí Kremlu Dmitrij Peskov v reakci uvedl,
    že Rusko v důsledku pádu plánu přehodnocuje svůj postup — už se neomezí jen na Donbas a Krym, ale
    bude dále okupovat ukrajinské území jako „nárazníkovou zónu", kamkoli „vstoupí noha ruského vojáka".
    Vrabel to označuje za zásadní obrat, kterého si dosud nikdo v médiích nevšiml.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-24-10
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Ukrajinské útoky na sklady Wildberries v Petrohradu — Vrabel: „40 dní terorismu" (24. 7. 2026)'
  text: Ukrajina znovu zaútočila na sklady největšího ruského internetového prodejce Wildberries, tentokrát
    v Petrohradu a Leningradské oblasti — v logistických centrech v Šušarech a Utkinově Závodu vypukly
    rozsáhlé požáry, v dalším skladu v Novosaratovce byly hospitalizovány tři osoby, poškozen byl i sklad
    drůbežárny po útoku dronem; provoz obou center byl dočasně pozastaven. Vrabel útok označuje za teroristický
    a připomíná, že Volodymyr Zelenskyj vyhlásil (ne doslova, ale fakticky) „40 dní tlaku na Rusko" —
    čemuž Vrabel říká „40 dní terorismu". Ruská federace se s tím podle něj bude muset nějak vypořádat.
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-24-11
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: F-35 jako příprava útoku na Rusko, tanky po D35, cvičení u Suvalk, dvojí metr u Ukrajiny — Vrabel
    (13. 6. 2026)
  text: '**24. 7.** — Městský soud v Praze v kauze spolku Českoslovenští vojáci v záloze za mír rozhodl:
    Ivan Kratochvíl dostal roční podmíněný trest a pětiletý zákaz organizování spolků zaměřených na vojenský/polovojenský
    výcvik; Vladimír Šádler dostal podmíněný trest za nezákonné ozbrojování; ostatní obžalovaní i spolek
    byli obžaloby zproštěni, obvinění z podpory terorismu se nepotvrdilo. Státní zástupce se na místě
    odvolal. Vrabel to hodnotí jako „velmi dobrou zprávu" — sám čelil obdobnému obvinění (hrozilo mu 8
    let) za „zaškrtnutou kolonku v žádosti" a případ nakonec padl — a srovnává s Tomášem Čermákem, odsouzeným
    na 5,5 roku za terorismus kvůli hyperbolickým výrokům na internetu („to je naprostá brutalita, co
    se mu stalo... stát se mu bude muset jednou omluvit a rehabilitovat ho").'
  osoby:
