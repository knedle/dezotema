  nadpis: Údajná smrt Lindseyho Grahama a návrh 500% cel na země obchodující s ruskou ropou (Vrabel, 12.
    7. 2026)
  text: '**24. 7.** — Vrabel potvrzuje, že zpráva o Grahamově smrti byla pravdivá: ukrajinská veřejnoprávní
    stanice Suspilne informovala, že Volodymyr Zelenskyj 28. 7. odcestuje do USA na jeho pohřeb (pozvánku
    od organizátorů obdržel přímo). Sdílí video Alexandra Dugina, který Grahamovy výroky za poslední roky
    (jako jednoho z nejagresivnějších podporovatelů „agrese Západu proti Rusku") označuje za natolik extrémní,
    že přirovnání k nacismu je „slabé". Vyjadřuje pochybnost o oficiální příčině smrti („krátká nemoc")
    vzhledem k tomu, že Graham byl ještě dva dny předtím zdravě v Kyjevě s dronem po boku Zelenského —
    a shrnuje kolující spekulace, že za smrtí mohli stát Íránci, Rusové nebo Izraelci, aniž se sám přiklání
    ke konkrétní verzi.'
  osoby:
  - osoba: lindsey-graham
    vztah: neutralni
    kontext: Potvrzena smrt — Zelenskyj jede na pohřeb; Vrabel pochybuje o oficiální příčině a zmiňuje
      spekulace o vraždě (Írán/Rusko/Izrael)
  podtema: Zahraniční aktéři a precedenty
