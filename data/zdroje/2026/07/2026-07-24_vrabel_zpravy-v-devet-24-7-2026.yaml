  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Bulharsko odmítá vstup do koalice ochotných (Radev, Vrabel 14. 7. 2026)
  text: '**24. 7.** — Vrabelova skepse se potvrzuje: bulharský parlament schválil dočasné rozmístění až
    8 amerických tankovacích letounů KC-135 a 250 vojáků na základně Bezmer (24. 7. – 1. 10.); NATO (mluvčí
    plukovník Martin O''Donnell) přislíbilo Bulharsko bránit v případě íránské odvety, premiér Radev zdůraznil,
    že letouny budou sloužit jen k logistice, ne k bojovým operacím. Írán už předtím Bulharsko varoval
    před zapojením do americké vojenské kampaně. Vrabel to čte jako přesné zopakování vzorce, který popsal
    u Radeva už dřív (i u vlastního trestního stíhání za výrok z roku 2022, že se ČR stává terčem pro
    Rusko) — s tím rozdílem, že zatímco kritika vůči Rusku ho stála žalobu, u Íránu jde vše mnohem rychleji:
    Írán rovnou prohlásil, že poskytnutí letiště Američanům dělá z Bulharska legitimní cíl odvety. Předjímá,
    že se tak Evropě otevírá druhé, „íránské" válečné křídlo vedle ruského — obklíčena z obou stran.'
  osoby:
  - osoba: rumen-radev
    vztah: rozporuplny
    kontext: Bulharský prezident schválil americká tankovací letadla na základně Bezmer — potvrzuje Vrabelovu
      dřívější skepsi vůči jeho „proruskému" obratu
