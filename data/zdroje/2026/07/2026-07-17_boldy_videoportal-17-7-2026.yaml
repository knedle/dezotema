- id: boldy-2026-07-17-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Boldy: vakcíny jako biologická zbraň a nástroj snižování populace (17. 7. 2026)'
  text: 'Boldy tvrdí, že vakcíny mají sloužit jako biologická zbraň — odkazuje na patent, který má vyvěšený
    na svém profilu. Necituje očekávání nové pandemie, ale existující plán: Bill Gates prý už na konferenci
    TED v roce 2017 řekl, že snížení populace o 10–15 % „bude daleko lepší". Jako projev tohoto plánu
    uvádí nárůst rakovin a zdravotních problémů u mladých lidí po covidu a po vakcínách a pokles porodnosti.
    Argumentuje, že nejde primárně o „zabíjení" lidí (to se prý děje pomalu jídlem, vzduchem), ale o snížení
    porodnosti tak, aby populace za 10–20 let klesala (více úmrtí než porodů) — odvolává se na statistiku
    růstu populace, který prý za 6 let sledování „brutálně zpomalil". Navazuje na [Vakcíny COVID-19 =
    biologické zbraně (Francis Boyle)](#francis-boyle-vakcíny-covid-19--biologické-zbraně-hromadného-ničení--zítko-4-5-2026)
    a [Propad porodnosti o třetinu](#propad-porodnosti-o-třetinu--data-z-úzis-zítko).'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: boldy-2026-07-17-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: YouTube smazal přes milion videí o vakcínách; umlčovaní vědci (Boldy, 17. 7. 2026)
  text: 'Boldy tvrdí, že „bývalá šéfka YouTube" nedávno přiznala smazání více než jednoho milionu videí
    o vakcínách označených za „antivax" — přestože prý šlo o tisíce studií a tisíce vědců s důkazy. Účelem
    cenzury dle Boldyho bylo, aby se informace „k lidem nedostaly". Do stejné linie řadí umlčování nepohodlných
    vědců: ti, kdo začnou mluvit, prý ztrácejí práci, jsou „dehonestováni" a končí „sebevraždou" (naznačuje,
    že jde o vraždy). Jako příklad zmizení informací uvádí přenos konference uznávaných vědců z Rakouska,
    Německa a Velké Británie, který prý sledoval živě na YouTube, a poté „se slehla zem" — žádné informace
    o vědcích ani videu už nedohledal. Uzavírá, že tvrzení „vědecky to není dokázáno" a odkaz na „vědecký
    konsenzus" jsou důsledkem toho, že nesouhlasné studie byly smazány, a že věda „neslouží lidem, ale
    financím". Navazuje na [Boldy: 13 vědců zavražděno po odkrytí volné energie](konspirace.md#boldy-13-vědců-zavražděno-po-odkrytí-volné-energie-24-5-2026).'
  podtema: Blokování na sociálních sítích
- id: boldy-2026-07-17-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Geoinženýrství: patenty od 1896, Bill Gates přes neziskovky, vesmírná zrcadla (Boldy, 17. 7.
    2026)'
  text: 'Boldy rozvádí tezi o geoinženýrství: přirozené klimatické cykly (dle něj se klima mění každých
    12 000, resp. 24 000 let) nepopírá, ale tvrdí, že existuje přes 120 patentů na modifikaci počasí —
    první z roku 1896 na rozhánění mlhy, bombardování mraků od r. 1880. Financování dnes prý zajišťuje
    Bill Gates a jeho neziskové organizace ve spojení s bankami; neziskovky označuje za „černou díru",
    která má znemožnit dohledatelnost. Nejnovějším plánem má být rozmístění cca tisíce obřích zrcadel
    přibližně 1650 km nad zemským povrchem simulujících měsíční svit — což by dle Boldyho zlikvidovalo
    noční živočichy a rostliny („všechno umělé"). Lidi, kteří geoinženýrství a chemtrails zpochybňují
    (jmenuje slovenský kanál „Vědátor SK"), označuje za „NPC" bez schopnosti si informace ověřit. Navazuje
    na [Chemtrails a záměrná kontaminace ovzduší](#chemtrails-a-záměrná-kontaminace-ovzduší).'
  podtema: Elity a jejich plány
- id: boldy-2026-07-17-04
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Většina lidí jako „NPC"; jen ~1 miliarda lidí má „duši" a kritické myšlení (Boldy, 17. 7. 2026)
  text: 'Boldy opakovaně označuje většinovou populaci za „chodící NPCčka" — lidi neschopné vlastního kritického
    myšlení a úsudku, kteří jen bagatelizují. Odvolává se na blíže neurčeného „vědce", podle nějž je maximální
    počet lidí „s duší a s kritickým myšlením" na světě jedna miliarda. Jako příklad utajitelnosti rozsáhlých
    plánů uvádí projekt Manhattan: prý na něm pracovalo ~100 000 lidí, z nichž 99,9 % do poslední chvíle
    nevědělo, na čem dělají — z toho vyvozuje, že i dnes lze utajit rozsáhlé operace.'
  podtema: Elity a jejich plány
- id: boldy-2026-07-17-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Prezidenti jako „jedna panda ve dvou táborech"; nejbohatší nejsou nejmocnější (Boldy, 17. 7.
    2026)
  text: Boldy tvrdí, že prezidenti jako Trump a Putin jsou „jedna stejná panda, rozdělená do dvou táborů"
    — přirovnává to k fandění fotbalovým týmům na mistrovství světa (kdo je neutrální, „dělá to špatně").
    Lidé s největšími majetky (jmenuje Billa Gatese) podle něj nejsou nejmocnějšími lidmi na světě; nad
    nimi stojí struktury, které jim dávají rozkazy. Navazuje na [Nadnárodní elity a projekt „Velký Izrael"](#nadnárodní-elity-a-projekt-velký-izrael),
    kde jsou Gates, Rothschildové a Rockefellerové označeni za „loutky".
  podtema: Elity a jejich plány
- id: boldy-2026-07-17-06
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: GMO a průmyslové potraviny jako nástroj likvidace (Boldy, 17. 7. 2026)
  text: 'Boldy tvrdí, že GMO (geneticky modifikované organismy) jsou „velké ohrožení pro lidstvo": v USA
    se prý od roku 2023 přidávají do rostlin, včely je roznášejí dál a existují na to „sovětské studie".
    Do stejné linie řadí umělé maso z 3D tiskáren a pasterizované mléko — u něj popisuje osobní „test":
    litr kupovaného mléka nechal týden odstát a zůstala prý jen čtvrtina „sražené sračky" a zbytek voda.
    Dochází k závěru, že cílem je přechod „na všechno umělé". Navazuje na [Skupování orné půdy a kontrola
    potravin jako globalistická agenda](#skupování-orné-půdy-a-kontrola-potravin-jako-globalistická-agenda-vrabel-3-6-2026)
    a na [mRNA v rostlinách a potravinovém řetězci](covid-vakciny.md#mrna-v-rostlinách-a-potravinovém-řetězci).'
  podtema: Elity a jejich plány
