  nadpis: USA povolí Saúdské Arábii obohacovat uran; dvě zemětřesení v Íránu (Vrabel, 26. 7. 2026)
  text: |-
    Spojené státy jsou připraveny povolit Saúdské Arábii obohacování uranu ve spolupráci s americkou firmou Westinghouse — Vrabel poukazuje na to, že o povolení už nerozhoduje Mezinárodní agentura pro atomovou energii ve spolupráci s OSN, ale přímo Donald Trump, a srovnává to s odepřením práva na jadernou energetiku Íránu (který byl za totéž bombardován). Vysvětlení vidí v tom, že Saúdská Arábie na rozdíl od Íránu nakoupila velké množství amerických státních dluhopisů. Souběžně došlo v Íránu ke dvěma silným zemětřesením v rychlém sledu (magnituda až 5,7) — Vrabel to komentuje ironickou narážkou na možnost cíleného ovlivňování počasí/geologické aktivity, aniž by tvrzení blíže rozvádí.

    ⚡ **Poznámka:** Narážka na řízené vyvolání zemětřesení není ničím podložena.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-26-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Slevy na jízdném pro seniory a studenty v nedohlednu; EU ruší povinné označování geneticky upravených
    plodin (Vrabel, 26. 7. 2026)
  text: 'Vrabel kriticky komentuje dvě zprávy týdne: česká vláda odkládá zavedení slev na jízdném pro
    seniory a studenty s odůvodněním, že si to (v řádu miliard korun) nemůže dovolit — v kontrastu staví
    Bělehrad, kde je městská hromadná doprava pro seniory zdarma. Ironicky spojuje chybějící prostředky
    s prioritním financováním Ukrajiny (90 mld. přes EU, plánovaných dalších 70 mld. přes NATO). Druhou
    zprávou jsou nová pravidla EU ohledně geneticky upravených plodin, podle nichž spotřebitelé ztratí
    možnost poznat na obalu, zda byla potravina vyrobena pomocí genové editace — Vrabel to dává do souvislosti
    s nedávno dohodnutým dovozem amerických potravin bez cla, u nichž tak podle něj spotřebitelé už nebudou
    moci rozeznat geneticky upravený původ.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-26-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Vrabel brání Štefana Bartóka, viní ex-přítelkyni a Michaelu Pírkovou z lživého obvinění
  text: Bývalý policista a dlouholetý spolupracovník Vrabela na vlastenecké scéně Štefan Bartók byl vzat
    do vazby, obviněn z týrání přítelkyně a jejího dítěte. Vrabel se staví na jeho obranu — popisuje,
    že vztah Bartóka a jeho přítelkyně (jménem Jana) sledoval prakticky celou dobu, sám se s ním o problémech
    v soukromí bavil, a nikdy neměl pocit, že by byl Bartók agresivní. Naznačuje, že přítelkyně měla opakované
    psychické záchvaty a labilní stavy, a spolu s další ženou (Michaelou Pírkovou) obvinění zkonstruovaly;
    vyjadřuje přání, aby pro obě bylo „připraveno speciální oddělení pekla" a lituje, že Bartók coby bývalý
    policista to ve vazbě nemusí mít lehké. Zdůrazňuje, že podobné falešné obvinění z týrání dítěte znal
    i z vlastní rodiny a jeho dopady na dítě jsou velmi těžké. Zmiňuje, že celá „vlastenecká scéna" (patriotická
    opozice mimo parlamentní strany) je v současnosti silně rozprášená — jako další příklad uvádí i vlastní
    případ místopředsedy hnutí Pavla Fíly a osudy Ivana Kratochvíla.
  osoby:
