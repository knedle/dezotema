      oddělení pekla"
  podtema: Kauza Štefan Bartók — obvinění z týrání a Vrabelova exekuce manželky (Vrabel, 26. 7. 2026)
- id: vrabel-2026-07-26-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Exekuce proti Vrabelově manželce kvůli účtu na demonstrace
  text: Vrabel dále popisuje, že jeho manželka čelí exekuci na základě soudního rozhodnutí týkajícího
    se bankovního účtu, na který se vybíraly (dle Vrabela zcela legálně) peníze na demonstrace. Označuje
    rozhodnutí soudu za výsledek koordinovaného postupu policie, státních zástupců a soudců ve spojení
    s tajnými službami — „hajzl soud" bez řádného odůvodnění. Zmiňuje také, že se mu dříve podařilo u
    soudu prosadit právo zastupovat manželku (což mu bylo předtím odepřeno) a dostat syna z „šílených
    řízení".
  podtema: Kauza Štefan Bartók — obvinění z týrání a Vrabelova exekuce manželky (Vrabel, 26. 7. 2026)
- id: vrabel-2026-07-26-05
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: 'Arménie: trestní stíhání opozice a síť Rothschild–Trump–Kushner (Vrabel, 6. 6. 2026)'
  text: '**26. 7.** — Vrabel zasazuje tutéž tezi do dlouhého historicko-náboženského rámce: skutečný civilizační
    konflikt je podle něj starý jako Byzantská a Římská říše — římská (katolická) linie zavedla prodej
    odpustků (dle Vrabela „úplatkářství") a převzala od židovské tradice bankovní systém založený na úrocích
    (na rozdíl od islámského bankovnictví, kde jsou úroky zakázané, i pravoslaví, které úročení odmítá).
    Tvrdí, že katolická církev dodnes kanonizuje válečné zločince a po 2. světové válce je schovávala
    ve Vatikánu — jako příklad uvádí chorvatský koncentrační tábor Jasenovac, který měl za 2. světové
    války sloužit k vyvražďování pravoslavných Srbů. Dodává obvinění z rozšířené pedofilie v katolické
    církvi včetně tvrzení o nalezených dětských kosterních pozůstatcích v klášterech. Z toho vyvozuje,
    že „chazarští Židé" v USA jsou pokračovateli téže římsko-bankéřské linie, řídí globalizaci skrze WTO,
    MMF a Světovou banku od 50. let minulého století a jejich moc se přesouvala mezi centry (Nizozemsko
    → Británie 1944 → USA) podle toho, kde se tiskla světová rezervní měna.'
- id: vrabel-2026-07-26-06
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: EU a Ukrajina spouští projekt FREJA (protiraketová obrana); Rheinmetall expanduje do Polska
    (Vrabel, 26. 7. 2026)
  text: Evropská unie a Ukrajina spustily projekt FREJA — vývoj nového evropského systému obrany proti
    balistickým raketám; zakládajícími zeměmi jsou Švédsko, Francie, Německo a Itálie. Vrabel s ironií
    konstatuje, že Česká republika mezi zakládajícími členy není, přestože podle něj vláda obvykle nechce
    vynechat žádnou příležitost k zapojení do podobných projektů („my přece chceme montovat balistické
    rakety na svém území, abychom z toho měli nějaké peníze") — předpokládá, že se ČR k projektu později
    připojí jen v podřízené roli výrobního subdodavatele, zatímco hlavní rizika (stát se cílem) ponese
    sama. Dále zmiňuje, že německá zbrojovka Rheinmetall (najvětší světový výrobce munice, více než USA)
    expanduje výstavbou nových továren do Polska — komentuje to jako ironii vzhledem k německé roli ve
    2. světové válce. Doplňuje, že Švýcarsko zrušilo výjimku z vojenské služby pro duchovní osoby — ironicky
    poznamenává, že zatímco švýcarští kněží budou muset nastoupit vojenskou službu, přistěhovalí muslimové
    jako cizinci povinnosti nepodléhají.
  podtema: EU jako vojenská struktura
