  text: '**11. 7.** — Zítko podrobněji rozvádí tezi o zcinknutých prezidentských volbách USA 2020: tvrdí,
    že sledoval Bidenův předvolební projev („podivný", zmínka o narození babičky v Pensylvánii), který
    interpretuje jako signál zákulisního „hoření" volebních výsledků v Pensylvánii — následně měly být
    napěchovány korespondenční hlasy, zfalšovány elektronické hlasy, vypnut internet a volební systém
    Dominion měl být řízen ze zahraničí. Prohlašuje se za vítěze starých sázek s „faktčekry" (jmenuje
    konkrétní osoby), kteří tvrdili, že Biden vyhrál férově, a vyzývá je, aby uznali prohru a zaplatili
    dohodnuté částky.'
  podtema: Okultismus
- id: zitko-2026-07-11-02
