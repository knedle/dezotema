  nadpis: Vlastní „Cena za svobodu projevu" a kritika oficiálních nominací (Zítko, 8. 7. 2026)
  text: '**11. 7.** — Zítko sleduje průběžné nominace jednotlivých porotců Společnosti pro obranu svobody
    projevu: Karolína Stoniková nominovala profesora Jaroslava Turánka, zatímco bývalý předseda Rady České
    televize Pavel Matocha vybral pětici Václav Klaus, Karel Janeček, Luboš Xaver Veselý, Jana Škopková
    a Aleš Borovan. Nominaci Václava Klause komentuje jako výsměch — připomíná, že Klaus je podle jeho
    dřívějších tezí strůjcem „vlastizrádného" rozdělení Československa (dohoda s Mečiarem), nikoli bojovníkem
    za svobodu slova, a stejně tak zpochybňuje, že by se Klaus či Cyril Svoboda kdy reálně za svobodu
    projevu perzekučně postavili. Vyzývá diváky, aby psali komentáře přímo pod nominace Pavla Matochy
    a moderátorky Martiny Kocijánové a aktivně tak ovlivnili veřejné hlasování.'
  podtema: Politická perzekuce
