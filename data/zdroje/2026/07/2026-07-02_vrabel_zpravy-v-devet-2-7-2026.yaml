  poznamka: 'Čtyři zpracovaná témata: (1) Soudní dvůr EU potvrdil, že sdílení obsahu Russia Today je trestný
    čin i pro soukromé osoby (až 5 let) — Vrabel maže celý archiv pořadu a přestává sdílet ruská média
    — [dsa-cenzura.md](dsa-cenzura.md). (2) Německo obžalovalo Ukrajince za Nord Stream, potvrzeno zapojení
    ukrajinských státních orgánů — [konspirace.md](konspirace.md). (3) Dvojí metr: aktivisté pašující
    drony na Ukrajinu bez povolení „nespáchali trestný čin", na rozdíl od Vrabelova vlastního odsouzení
    za chybu ve formuláři — [kauzy.md](kauzy.md). (4) Rostoucí nerovnost v ČR (Knight Frank) + teze o
    centralizaci moci „shora" (BlackRock/Vanguard) — [konspirace.md](konspirace.md). Ostatní zprávy (Tucker
    Carlson zakládá třetí stranu, EU dotace pro Jižní Kavkaz, digitální ID v USA, Kaja Kalas, Zelenskyj
    a rakety z Norska, Hormuzský průliv) jen rychlý přehled bez samostatného zpracování. Bez predikcí
    (nad rámec již zaznamenaných) a stoch. teroru. Pravidelný přehled zahraničních a domácích zpráv s
    komentářem'
vyroky:
- id: vrabel-2026-07-02-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Soudní dvůr EU: sdílení obsahu Russia Today je trestný čin i pro soukromé osoby (Vrabel, 2.
    7. 2026)'
  text: 'Soudní dvůr Evropské unie potvrdil odsouzení tří osob v Německu za zveřejnění videí Russia Today
    Deutschland na volně přístupném webu financovaném jen z dobrovolných darů — soud rozhodl, že nezáleží
    na tom, zda šlo o podnikání, jak dlouho byl obsah dostupný nebo jak široce se šířil; kdokoli, kdo
    je přímo či nepřímo odpovědný za zpřístupnění zakázaného obsahu veřejnosti, může být podle sankčních
    pravidel EU postihován jako „provozovatel". Podle citovaného německého zákona hrozí za porušení až
    5 let vězení. Vrabel to čte jako rozšíření zákazu RT za hranice vysílacích společností na jakoukoli
    soukromou osobu a v přímé reakci smazal veškerý archiv pořadu „Zprávy v devět" a oznámil, že přestává
    sdílet obsah z ruských médií (RT, Sputnik) — nadále bude jen mluvenou formou přebírat informace, případně
    sdílet obsah srbských médií. Přirovnává postup EU k mafii: nejdřív nabídne pomoc/dotace, pak si vynutí
    protislužbu — stejný mechanismus, jakým podle něj funguje čistý příjemce/čistý plátce v EU fondech.'
  citace:
  - text: Zveřejnění prostě jenom videa nebo článku z médií z Ruské federace, i když nepopírá žádnou genocidu
      nebo neschvaluje žádné válečné zločiny, už je u nás trestné.
  podtema: Trestání politického projevu
- id: vrabel-2026-07-02-02
  typ: tvrzeni
  temata:
