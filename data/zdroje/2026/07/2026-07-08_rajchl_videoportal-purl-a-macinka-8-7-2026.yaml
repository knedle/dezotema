  nadpis: Kategorické odmítnutí financování Ukrajiny přes program PURL — spor s Macinkou (Rajchl, 8. 7.
    2026)
  text: Rajchl reaguje na oznámení ministra zahraničí Petra Macinky, že přesměruje část mandatorních výdajů
    ministerstva zahraničí do programu **PURL** (viz [PURL a „NATO Review 3.0" — Vrabel, 18. 6.](/temata/nato-zbrojeni-militarizace.md#vrabel-2026-06-18-07)),
    jehož účelem je podle něj shromažďovat peníze evropských a kanadských daňových poplatníků na nákup
    amerických zbraní pro Ukrajinu. Kategoricky odmítá, aby z českého státního rozpočtu šla na zbraně
    pro Ukrajinu byť jediná koruna — odvolává se na předvolební slib i na závazek z programového prohlášení
    vlády prosazovat ukončení konfliktu diplomatickou cestou, který by tímto krokem (podobně jako dříve
    vláda Petra Fialy) byl porušen. Slibuje, že on i klub SPD budou požadovat revizi rozhodnutí bez ohledu
    na tlak EU či NATO, a dodává, že mu nezáleží na tom, aby ho za tento krok chválili Petr Pavel nebo
    Mark Rutte — naopak by to považoval za varovné znamení.
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: Jako ministr zahraničí oznámil přesměrování mandatorních výdajů do programu PURL na zbraně
      pro Ukrajinu — Rajchl s klubem SPD požaduje revizi rozhodnutí
  podtema: Zahraniční aktéři a precedenty
