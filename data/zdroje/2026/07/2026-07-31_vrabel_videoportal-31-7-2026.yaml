  nadpis: Migrační pakt vynutí přerozdělení do zemí, kde „ještě nejsou" — Polsko, ČR, Slovensko, Maďarsko
    (Vrabel, 31. 7. 2026)
  text: 'Vrabel k pokračující krizi v Ceutě (podle něj plánovaný příliv až 3 milionů migrantů) odmítá
    kroky některých vlád (italské hrozby uzavřením Schengenu, švédská výzva ke zrušení Schengenu) jako
    dočasný „populistický" gesta bez reálného efektu, protože migrační pakt zůstává právně závazný a vymahatelný.
    Tvrdí, že po legalizaci migrantů ve Španělsku bude následovat jejich přerozdělování — nikoli do Německa,
    Rakouska, Řecka, Nizozemska, Belgie, Švédska, Norska či Dánska, kde je podle něj „už jich moc", ale
    právě do zemí, kde dosud nejsou: Polska, České republiky, Slovenska a Maďarska. To dává jako důvod,
    proč musela být (dle jeho dřívějších tvrzení) vyměněna vláda v Maďarsku. Opakuje, že vládní tvrzení
    o „odmítnutí" migračního paktu jsou prázdná gesta a jediným legálním řešením zůstává vystoupení z
    EU.'
