  delka: 01:55:05
  poznamka: 'Většina obsahu (přes hodinu) je opakování už rozsáhle zdokumentované kritiky Petra Pavla
    (lži o komunistické minulosti, incident se standartou, žebrání o plat pro první dámu, Kolář jako poradce
    atd.) — nezpracováno jako duplicitní. Tři nově zpracovaná témata: (1) Únik dokumentu MO o žádosti
    na dopravu 35 osob do Ankary usvědčuje Hrad ze lži — [politicky-system.md](politicky-system.md). (2)
    Kontroverzní projev v Terezíně (přeživší „taky dělali chyby") + omluva za 3 dny — [politicky-system.md](politicky-system.md).
    (3) Pavel podporuje euro a vzdání se práva veta v zahraniční politice — [suverenita-eu.md](suverenita-eu.md).
    Vedlejší obsah: kritika pražské dopravní politiky, sněmovní návrh na zákaz alkoholu (STAN), osobní
    vzkazy divákům — nezpracováno. **Stoch. teror:** Černohorského vlastní schválení trestu smrti/oprátky
    pro Pavla; sdílený a odcitovaný výrok o „kulce mezi oči" pro Moniku Babišovou. Bez predikcí. Extrémně
    dlouhý „letní sestřih" — pokračování kauzy ÚS/Pavel/Ankara a obecná kritika Pavla'
vyroky:
- id: cernohorsky-2026-07-03-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Únik dokumentu MO o dopravě 35 osob do Ankary usvědčuje Hrad ze lži — Černohorský (3. 7. 2026)
  text: Černohorský poukazuje na to, že média zveřejnila dokument z ministerstva obrany (se jmenovaným
    zdrojem) obsahující žádost o leteckou přepravu 35 osob do Ankary — přestože Hrad předtím veřejně popíral,
    že by taková žádost vůbec existovala. Argumentuje, že pokud by šlo o padělek, jmenovaný úředník by
    se okamžitě ozval a označil dokument za fake, což se nestalo — považuje to tedy za usvědčení Petra
    Pavla ze lži.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-07-03-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Kontroverzní projev v Terezíně: přeživší „taky dělali chyby" — omluva za 3 dny (Černohorský,
    3. 7. 2026)'
  text: Černohorský ostře kritizuje Pavlův proslov při pietním aktu v Terezíně, kde měl prezident naznačit,
    že i přeživší nacistické okupace (včetně těch, kdo se po válce mstili retribucemi) se dopouštěli „chyb"
    — Černohorský to interpretuje jako srovnávání viny obětí s viníky. Argumentuje, že nikdo nemá právo
    hodnotit činy lidí, kteří prošli šesti lety okupace, perzekuce a nucených prací, natož je stavět na
    roveň pachatelům. Výrok vyvolal okamžitou kritiku a Pavel se za tři dny v mainstreamových médiích
    omluvil s tím, že to „takhle nemyslel" — Černohorský to považuje za další důkaz, že jde o „křiváka"
    neschopného postavit se rovně za vlastní slova.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-07-03-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Pavel podporuje euro a chce se vzdát práva veta v zahraniční politice — Černohorský (3. 7. 2026)
  text: Černohorský rozšiřuje kritiku Pavlova postoje k suverenitě o dva konkrétní body. Zaprvé, Pavel
    měl veřejně prohlásit, že „česká koruna je k ničemu" a brání rozvoji, a že je třeba přijmout euro
    — Černohorský to odmítá s odkazem na zdražení života na Slovensku po zavedení eura v roce 2009 a na
    to, že vlastní měnová politika (ČNB, úrokové sazby) je jedna z mála zbylých forem české suverenity.
    Zadruhé, Pavel měl podporovat zrušení práva veta ČR v některých zahraničněpolitických otázkách ve
    prospěch Evropské unie/Evropského parlamentu/Evropské komise — Černohorský se ptá, zda by se to týkalo
    i Benešových dekretů, na které si dělá nárok Německo i Maďarsko.
  citace:
  - text: Nějaké euro? Ty vole, jděte s tím do prdele! [...] Prezident České republiky? Ne, tohle je zaprodanec,
      kolaborant a velezrádce.
  podtema: Česká suverenita
