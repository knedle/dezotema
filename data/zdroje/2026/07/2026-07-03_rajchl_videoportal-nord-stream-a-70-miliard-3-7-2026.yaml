  poznamka: 'Pokračování kauzy ÚS/Pavel/Ankara — Pavel na summitu škodí kvůli špatným vztahům s USA, klíčovým
    bodem jednání je 70 mld. dolarů pro Ukrajinu; předpovídá, že Babiš půjčku v zákulisí podpoří i přes
    veřejné výhrady. S odkazem na zprávu o obžalobě Ukrajinců za Nord Stream (na příkaz státu) odmítá
    dál dávat peníze „sponzorům státního terorismu". Tematicky → [politicky-system.md](politicky-system.md).
