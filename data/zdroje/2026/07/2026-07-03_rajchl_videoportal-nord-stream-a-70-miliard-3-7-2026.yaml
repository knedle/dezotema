vyroky:
- id: rajchl-2026-07-03-01
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel na summitu škodí kvůli vztahům s USA; odmítá platit „sponzorům státního terorismu" — Rajchl
    (3. 7. 2026)
  text: 'V dalším rozhovoru Rajchl doplňuje důvod, proč by Pavel neměl na summit NATO jet: má špatné vztahy
    se Spojenými státy, které tam budou hrát klíčovou roli — zejména kvůli klíčovému bodu jednání, 70
    mld. dolarům pro Ukrajinu. Zároveň předpovídá, že Andrej Babiš bude tuto půjčku v zákulisí jednoznačně
    podporovat, i přes veřejné výhrady, protože „ji podporoval vždycky" stejně jako muniční iniciativu.
    Odmítá dál posílat peníze Ukrajině s odkazem na tentýž den zveřejněnou zprávu (Novinky.cz), že za
    vyhozením plynovodu Nord Stream stáli Ukrajinci na přímý pokyn státu — Ukrajinu tak označuje za „sponzora
    státního terorismu", kterému by ČR neměla dávat další půjčky ani dary, ale naopak by měla žádat reparace
    za útok na evropskou infrastrukturu.'
  citace:
  - text: Prosím vás, můžeme dál dávat peníze teroristům, kteří útočí na evropskou infrastrukturu?
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-07-03-02
  typ: predikce
  temata:
  - petr-pavel
  nadpis: Babiš bude v zákulisí podporovat půjčku Ukrajině i přes veřejné výhrady
  text: Rajchl je „naprosto jednoznačně přesvědčen", že Andrej Babiš bude na summitu NATO v zákulisí podporovat
    70 mld. dolarů pro Ukrajinu i muniční iniciativu, bez ohledu na veřejně deklarované výhrady — protože
    tuto podporu poskytoval „vždycky".
  citace:
  - text: Já jsem naprosto jednoznačně přesvědčen, že on bude tu půjčku Ukrajině podporovat. V zákulisí
      ji bude zcela jednoznačně podporovat.
  predikce:
    horizont: summit NATO v Ankaře, 7.–8. 7. 2026
    stav: castecne
    vyhodnoceni:
    - datum: 2026-11-20
      text: (spíše potvrzeno) — Babiš balík 70 mld. na summitu v Ankaře neblokoval a ČR jednorázově přispěla
        do PURL, přímý podíl ale veřejně odmítl
      stav: castecne
    - datum: 2026-11-20
      text: 'Ukrainian News a ČTK (červenec 2026): ČR balík podpoří, ale nebude do něj přispívat vlastními
