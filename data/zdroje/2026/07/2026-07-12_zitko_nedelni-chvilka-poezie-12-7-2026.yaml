  nadpis: Rozdělení ČSFR jako nulitní akt + „velká aliance" čistí Deep State (Zítko, 12. 6. 2026)
  text: '**13. 7. (2)** — Zítko komentuje oslavu výročí Deklarace o svrchovanosti Slovenské republiky
    (17. 7. 1992) pořádanou stranou Směr ve Staré Bystrici (11.–12. 7. 2026), na níž vystoupili oba hlavní
    aktéři rozdělení Československa — Václav Klaus a Vladimír Mečiar. Klaus ve svém projevu kritizoval
    současnou hlavu státu Petra Pavla, který byl ve stejnou dobu na Slovensku na festivalu Pohoda v Trenčíně
    (Zítko to ironicky komentuje jako „dva prezidenty na Slovensku"), a varoval před zpochybňováním „podstaty
    člověka, rodiny a státu". Mečiar oslavil deklaraci jako historický úspěch „mnoha pokolení". Zítko
    oba muže sarkasticky obviňuje z pokrytectví — připomíná, že rozdělení republiky proběhlo bez referenda
    pár týdnů po volbách 1992, v nichž ani jedna ze stran (HZDS, ODS) rozdělení nesliboval, a klade to
    za vinu tlaku Londýna a Berlína, který měl Německu ušetřit placení válečných reparací Československu
    (29 bilionů Kč / 9 550 tun měnového zlata). Doplňuje, že se akce nezúčastnil slovenský premiér Robert
    Fico (byl na dovolené v Chorvatsku) — pozdrav přednesl ministr financí Ladislav Kamenický, který kritizoval
    EU za vzdání se míru a tradičních hodnot a útoky na slovenskou suverenitu, včetně předražených cen
    energií a Green Dealu — což Zítko rovněž komentuje jako pokrytectví lidí, kteří sami rozdělili stát
    a připravili ho o suverenitu.'
