- id: vrabel-2026-07-29-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Malé modulární reaktory naráží na nedostatek obohaceného uranu — sankce na Rusko (Vrabel, 29.
    7. 2026)
  text: 'K mediální zprávě, že budoucnost malých modulárních reaktorů (SMR) je „zatím nejistá", Vrabel
    doplňuje kontext, který podle něj média zamlčují: projekt ČEZ s britskou firmou Rolls-Royce (o kterém
    informoval už na podzim 2025) naráží na to, že pro tyto reaktory chybí palivo — kvůli sankcím na ruský
    obohacený uran není co do nich dávat. Tvrdí, že tuto souvislost veřejnost zjistí z médií „o půl roku
    později", než o ní referoval sám. Spojuje to se svou tezí o postupující ekonomické devastaci a deindustrializaci
    Západu, která se podle něj naplno projeví, až se začnou „skládat banky a měny".'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-29-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Čínský pokrok v jaderné fúzi jako kontrast k „úpadku Západu" (Vrabel, 29. 7. 2026)
  text: Vrabel referuje o čínském technologickém pokroku ve vývoji komerční jaderné fúze (úspěšné testy
    supravodivých magnetů pro experimentální fúzní reaktor, dokončení plánováno na 2027, první elektřina
    z fúze kolem roku 2030) a staví to do kontrastu s tím, čím se podle něj zabývá Západ — válkou, zbrojením
    a tiskem nekrytých peněz vedoucím k inflaci. Bytové ceny, nájmy a jídlo jsou dle něj oproti stavu
    před deseti lety řádově dražší, což považuje za typický příznak blížícího se krachu ekonomického systému.
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-29-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**29. 7.** — Vrabel opakuje obavu z podpisu francouzské jaderné aliance (Rafale s raketami ASMP
    na území ČR) — bez nových argumentů, ale výslovně ji označuje za hlavní téma plánované podzimní demonstrace
    „Člověk na první místě" — [Zprávy v devět 29. 7.](/zdroje/2026-07.md#2026-07-29_vrabel_zpravy-v-devet-29-7-2026)'
- id: vrabel-2026-07-29-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: EU dotuje výzkum „zvířata a demokracie" — 340 tisíc eur na studium velryb a domácích mazlíčků
    (Vrabel, 29. 7. 2026)
  text: Vrabel s odkazem na slovenský zdroj vysmívá projektu podpořenému EU částkou 340 tisíc eur, který
    zkoumá, zda mohou zvířata (krabi, psi) vykonávat „politickou komunikaci" relevantní pro demokratické
    instituce, a samostatný výzkum vlivu velryb na geopolitiku. Označuje to za symbol plýtvání unijními
    prostředky a doporučuje peníze věnovat raději na zkoumání toho, „proč akademikům přeskočilo".
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-29-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Rusko uzavřelo přístavy u Oděsy — ukrajinský obilný koridor prakticky zastaven (Vrabel, 29.
    7. 2026)
  text: 'Vrabel referuje, že ruská vojenská technika fakticky uzavřela přístup do všech tří přístavů kolem
    Oděsy, přes které Ukrajina vyvážela zhruba 8 milionů tun obilí měsíčně (cca 80 % jejího exportu).
    Náhradní trasa po Dunaji zvládne maximálně 1,3 milionu tun měsíčně kvůli byrokratickým a kapacitním
    omezením. Vrabel z toho vyvozuje dvojí důsledek: zhoršení hladu ve světě (spolu s uzavřeným Hormuzským
    průlivem a zdraženými hnojivy/pohonnými hmotami) a další ekonomickou devastaci Ukrajiny — ztrátu příjmů
    do státní kasy, kterou bude muset dorovnávat EU formou dalších dluhopisů, jejichž jistinu a úroky
    nakonec zaplatí členské státy (včetně ČR) prostřednictvím plateb do unijních fondů. Navazuje na dřívější
    zprávy o poklesu propustnosti přístavů u Oděsy o ~30 % (viz [Ukrajina přešla k terorismu: izolace
    Krymu](/temata/valka-ukrajina-prubeh/2026.md#vrabel-2026-06-11-08)) — nyní jde o téměř úplné uzavření.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Reakce veřejnosti na ČT24 oslavující ukrajinské útoky na civilní cíle v Rusku (Vrabel, 29. 7.
    2026)
  text: 'Ke zprávě o ukrajinských dronových útocích na průmyslové cíle v Rusku (sklad, rafinerie v Rjazani)
    a ruských útocích na Ukrajinu (úmrtí civilisty v Chersonu) Vrabel neupozorňuje na samotnou zprávu,
    ale na reakce publika: na facebookovém příspěvku ČT24 napočítal 2 800 „lajků" a 780 srdíček proti
    jen 28 naštvaným smajlíkům u zprávy o útoku na ruské cíle. Z tohoto poměru vyvozuje, že drtivá většina
    české veřejnosti oslavuje útoky na civilní infrastrukturu nepřátelské strany, což považuje za znepokojivý
    stav společnosti — bez ohledu na to, kdo válku vyvolal.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Medveďčuk: žádný evropský cíl není pro Rusko mimo dosah — vojenská vs. politická rovina konfliktu
    (Vrabel, 29. 7. 2026)'
  text: 'Bývalý ukrajinský politik Viktor Medveďčuk prohlásil, že Kyjev se mylně domnívá, že vojenská
    infrastruktura v Německu je v bezpečí — žádný evropský cíl podle něj není pro Rusko mimo dosah. Vrabel
    s vojenskou stránkou výroku souhlasí (ruské zbraně mají technicky dosah na výrobny v Německu i Polsku),
    ale odděluje ji od politické roviny: dosud obě strany předstírají, že jde o konflikt Rusko–Ukrajina,
    nikoli Rusko–Západ, protože to je pro obě strany pohodlnější (Rusko se vyhýbá riziku 3. světové války,
    Západ vede válku „skrze Ukrajinu" bez vlastních ztrát). Přirovnává rostoucí napětí k „Čechovově pušce"
    — čím déle visí na zdi, tím jistěji bude nakonec použita — a upozorňuje, že poslední vyjádření ruské
    strany (obviňování USA/Evropy z přímé účasti) naznačují posun k otevřenému přiznání konfliktu Rusko–Západ.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Varování z armády: eskalace by mohla znamenat 50 % HDP na zbrojení (Vrabel, 29. 7. 2026)'
  text: 'Vrabel cituje varování „kamaráda z armády": veřejná představa o postupu k válce (nejdřív vojáci,
    pak zálohy, pak všeobecná mobilizace) je neúplná — již nyní podle něj probíhá přechod na válečnou
    ekonomiku (nové zbrojní továrny, výroba dronů) a česká armáda se připravuje na nasazení na slovensko-ukrajinské
    hranici. Pokud by ČR byla oficiálně vtažena do konfliktu s Ruskem, mohlo by to podle tohoto varování
    znamenat až 50 % HDP na výrobu zbraní (namísto dnešních cca 2 %) — s dopadem na uspokojování základních
    potřeb obyvatel.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenskyj: stížnost na odmítnutí NATO, Krym „není na stole", zvažuje žalobu na Lukašenka (Vrabel,
    29. 7. 2026)'
  text: 'Vrabel komentuje sérii Zelenského vyjádření: stížnost, že nechápe, proč Ukrajina není přijata
    do NATO (Vrabel argumentuje, že členství validní armády v konfliktu podle čl. 5 by okamžitě vtáhlo
    celou alianci do války — proto je pro ČR podle něj žádoucí, aby Ukrajina v NATO nebyla); prohlášení,
    že Krym zůstává ukrajinským územím a v současnosti není předmětem jednání; a zvažovanou žádost o zahájení
    trestního řízení proti běloruskému prezidentovi Alexandru Lukašenkovi u ukrajinského generálního prokurátora.
    Poslední bod Vrabel označuje za bezvýznamné politické divadlo bez reálné vymahatelnosti — přirovnává
    ho k tomu, že by s manželkou doma „odsoudili generála Pavla" v neformálním lidovém soudu.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-10
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Lavrov: Rusko bude o míru jednat, jen pokud to bude v jeho zájmu (Vrabel, 29. 7. 2026)'
  text: 'Ruský ministr zahraničí Sergej Lavrov k mediálním zprávám o novém mírovém plánu (nabídka vzájemného
    zastavení útoků ze vzduchu, projednávaná mezi Zelenským a Trumpem) uvedl, že Rusko žádnou oficiální
    nabídku dosud nedostalo a případnou nabídku bude posuzovat výhradně podle toho, zda bude v souladu
    s ruskými zájmy — nikoliv automaticky akceptovat. Vrabel vyzdvihuje věcný, neemotivní styl ruských
    představitelů (Lavrov, Peskov, Zacharovová, Medveděv) v kontrastu k nepředvídatelnosti Donalda Trumpa
    a vysvětluje posun rétoriky odkazem na předchozí zkušenost: po dohodě z Aljašky Rusko nabídku přijalo,
    ale USA po roce prohlásily, že „už neplatí", protože ji odmítli Ukrajinci.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-11
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Medveděv odmítá zprávy o nové mobilizaci — čísla o náboru vojáků (Vrabel, 29. 7. 2026)
  text: 'Dmitrij Medveděv označil zprávy o chystané nové vlně mobilizace v Rusku za lež a nepřátelskou
    propagandu — podle něj má ruská armáda dostatek personálu (přes 2,5 milionu lidí, z toho 1,5 milionu
    aktivních vojáků). Uvedl konkrétní čísla za první pololetí 2025: cca 200 tisíc podepsaných smluv s
    armádou, 16 tisíc dobrovolníků a 40 tisíc rekrutů do dronových jednotek. Vrabel k tomu dodává srovnání:
    přestože Rusko má výrazně méně obyvatel než celá Evropa (~160 milionů vs. 550 milionů), disponuje
    větší odhodlaností bojovat (odkazuje na zkušenost z 2. světové války i na aktuální pokles Putinovy
    popularity jen o 3 procentní body navzdory ukrajinským útokům na ruské území) a nedávno podepsalo
    nové dohody se Severní Koreou o vojenských zálohách.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-29-12
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Česká střela Narval 140 jako útočná zbraň — odmítnutí vojenské neutrality (Vrabel, 29. 7. 2026)
  text: K oznámení, že česká firma LPP Praha úspěšně otestovala střelu s plochou dráhou letu Narval 140
    (plně vyrobenou v ČR, autonomní naváděním bez GPS, dolet přes 600 km), Vrabel technický úspěch oceňuje,
    ale namítá, že jde o **útočnou** zbraň — určenou k ničení nepohyblivých cílů (mosty, letiště, základny)
    na nepřátelském území, nikoli k obraně vlastního území. Opakuje svůj dlouhodobý postoj, že ČR by měla
    být vojensky neutrální zemí bez útočných zbraní, upřednostňující diplomacii — přestože uznává, že
    vzhledem k blížící se válce se vyzbrojují i neutrální státy (dává příklad Srbska nakupujícího hypersonické
    rakety z Číny).
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-29-13
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Ekonomika sestřelování dronů: 500 tisíc dolarů na jeden desetitisícový dron (Vrabel, 29. 7.
    2026)'
  text: 'Vrabel spočítal náklady incidentu, kdy tři stíhačky F-16 vzlétly kvůli sestřelení ruských dronů
    nad Rumunskem: samotný vzlet stál 1,5 milionu dolarů, tři použité rakety dalších 1,2 milionu dolarů
    — dohromady kolem 500 tisíc dolarů na zničení jednoho dronu v hodnotě přibližně 10–12 tisíc dolarů.
    Z toho vyvozuje, že takto obrana NATO (deklarující ochranu „každého centimetru" aliančního území)
    není ekonomicky udržitelná a validuje jeho dřívější kritiku neefektivity západní protivzdušné obrany.'
  podtema: EU jako vojenská struktura
