  nadpis: Osobní svědectví o poškození očkováním — Jana Katarína Benke (13. 7. 2026)
  text: 'Moderátorka Jana Katarína Benke v rozhovoru s Pavlem Zítkem popisuje vlastní zkušenost: po covid
    vakcíně jí měly nastat silné bolesti bederní páteře, kvůli kterým přestala chodit a musela lézt po
    čtyřech — dodnes žije s trvalými následky a bere pravidelné léky, přičemž v Německu by na rozdíl od
    ČR měla nárok na asistentku kvůli takovému stupni postižení. Zmiňuje také, že její babička (dnes zesnulá)
    se nechala očkovat pod nátlakem rodiny a médií navzdory obavám, protože „v televizi říkali, že se
    nenakazíte". Kritizuje, že se v ČR poškozeným covid vakcínou nedaří domoci se odškodnění, na rozdíl
    třeba od Indie, kde je u nežádoucích účinků na oficiálním seznamu automaticky uznávána souvislost
    s očkováním.'
  osoby:
