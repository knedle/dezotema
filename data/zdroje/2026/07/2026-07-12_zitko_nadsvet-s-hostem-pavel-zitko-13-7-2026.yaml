  nadpis: Slovenští aktivisté René Baláž a Petr Švec označeni za odstraněné za nepohodlnost (Zítko, 13.
    7. 2026)
  text: V rozhovoru u Jany Kataríny Benke Zítko tvrdí, že covidoví „odpůrci" a kritici, kteří se stali
    nepohodlnými, jsou likvidováni energetickými zbraněmi nebo chemickou cestou — jako příklad uvádí slovenského
    aktivistu René Baláže a podplukovníka armády Petra Švece, o nichž tvrdí, že jsou mrtví a byli „odstraněni",
    protože na rozdíl od něj neměli „to štěstí". Řadí je k obecnější tezi, že kdokoliv nepohodlný pro
    systém (zmiňuje i domnělou smrt kritika Billa Gatese) může být takto umlčen.
