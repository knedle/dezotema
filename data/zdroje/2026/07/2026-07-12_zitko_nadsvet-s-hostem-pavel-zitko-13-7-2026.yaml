  nadpis: Dvojníci a klony politiků a celebrit
  text: '**13. 7.** — Zítko v rozhovoru u Jany Kataríny Benke doplňuje příklad Nicoláse Madura: tvrdí,
    že současný Maduro je dvojník, zatímco skutečný Maduro byl původně obyčejný řidič autobusu dosazený
    do prezidentské funkce drogovými kartely coby „kasička" Deep State. Uvádí to jako součást širší teze,
    že Deep State si podobné „loutky" (jmenuje i Ukrajinu a Venezuelu jako země, kde lidé žili pod hranicí
    chudoby) vytváří z chudých poměrů a financuje se přes obchod s dětmi a adrenochromem — z těchto zdrojů
    měla být podle něj financována i CIA.'
  osoby:
  - osoba: nicolas-maduro
    vztah: rozporuplny
    kontext: Dle Zítka dvojník — skutečný Maduro byl bývalý řidič autobusu dosazený drogovými kartely
      jako „kasička" Deep State
  podtema: Okultismus
- id: zitko-2026-07-12-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Rozdělení ČSFR jako nulitní akt + „velká aliance" čistí Deep State (Zítko, 12. 6. 2026)
  text: '**13. 7.** — Zítko doplňuje právní argumentaci novým odkazem: zákon č. 327/1991 Sb. prý stanovil,
    že jediným ústavním způsobem rozdělení Československa je referendum lidu — jelikož k němu nedošlo,
    je dle něj celé rozdělení „anulitní" a všechny zákony přijaté po 1. 1. 1993 jsou neplatné (včetně
    česko-německé deklarace 1997, kterou používá Sudetoněmecký Landsmannschaft). Podobně jako po první
    světové válce (Versailleská dohoda) a po druhé světové válce (kde dle Zítka nikdy nebyla podepsána
    mírová dohoda, jen příměří), i po ukončení konfliktu na Ukrajině má o budoucím uspořádání evropských
    států (obnova Československa i obnova Sovětského svazu) rozhodovat společná dohoda velmocí (USA, Ruská
    federace, Čína, Indie, země BRICS včetně Saúdské Arábie) — zmiňuje v této souvislosti i „petrohradskou
    konferenci". Jediné, o čem by se podle něj mělo hlasovat, je případné začlenění Podkarpatské Rusi
    zpět do hranic ČSR do roku 1939.'
