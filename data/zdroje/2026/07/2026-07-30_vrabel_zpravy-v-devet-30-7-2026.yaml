- id: vrabel-2026-07-30-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Sucho odstavuje jaderné elektrárny v Rumunsku a Maďarsku — kontrast se 4× levnější energií v
    Srbsku (Vrabel, 30. 7. 2026)
  text: Kvůli mimořádnému suchu a nízkému průtoku Dunaje musely být odstaveny oba bloky rumunské jaderné
    elektrárny Černá Voda (téměř pětina spotřeby elektřiny v zemi, výpadek ~1300 MW) — chladicí čerpadla
    nemohou fungovat pod bezpečnou hranicí hladiny vody; rumunský premiér vyzval domácnosti a průmysl
    k dobrovolnému omezení odběru ve večerní špičce. Podobně byl kvůli suchu odstaven jeden blok maďarské
    elektrárny Paks (pokles z 2000 na 1200 MW). Vrabel to řadí do širšího obrazu energetické krize Západu
    (spolu s předchozí zprávou o nedostatku uranu pro malé modulární reaktory, viz výše) a kontrastuje
    to se Srbskem, které díky zachování ruských energetických dodávek má 4,5× levnější elektřinu a 4×
    levnější plyn. Spekuluje, že klimatická agenda EU (přechod na elektřinu, dvojnásobná spotřeba do budoucna)
    povede k umělému nedostatku energie a deindustrializaci, přičemž zmiňuje i sérii útoků na elektrárny
    po celém světě (Maďarsko, Rumunsko, Austrálie, USA) jako možný širší vzorec.
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-30-02
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Fauci se odvolal na 5. dodatek — kontrast s beztrestností v ČR (Vrabel, 30. 7. 2026)
  text: |-
    Anthony Fauci byl předvolán k výslechu před americký Senát (na návrh senátora Randa Paula) ohledně původu COVID-19 a financování gain-of-function výzkumu — na více než sto otázek odpověděl odvoláním na pátý dodatek americké ústavy (právo nevypovídat, pokud by se tím mohl usvědčit) a nepromluvil prakticky vůbec, včetně banální otázky na datum. Vrabel to dává do souvislosti s tím, že Rand Paul předtím zveřejnil Fauciho soukromý deník, v němž měl na začátku pandemie 9 z 11 konzultovaných vědců uvést, že virus pravděpodobně unikl z laboratoře ve Wu-chanu — ačkoli Fauci veřejně tvrdil, že se odborníci shodují na přirozeném původu (trh se zvířaty).

    Vrabel to kontrastuje se situací v ČR: český ministr zdravotnictví z dob covidu je dnes znovu ministrem zdravotnictví bez jakéhokoli vyšetřování či důsledků, zatímco ministerstvo se chlubí novým plánem spolupráce se Světovou zdravotnickou organizací na období 2026–2027 (očkování, digitalizace a „potírání dezinformací" — což podle Vrabela v praxi znamená mazání účtů jako je ten jeho). Připomíná, že jediné „vyšetřování" covidu v ČR proběhlo formou parlamentního semináře svolaného Jindřichem Rajchlem, který skončil jen tím, že Andrej Babiš řekl, že je mu líto, že se stalo pár chyb — bez jakékoli odpovědnosti či nápravy. Sám Vrabel byl naopak odsouzen za podvod kvůli formuláři žádosti o odškodnění, zatímco stát podle něj sám podváděl na vakcínách zlikvidovaných za 8 miliard Kč.
- id: vrabel-2026-07-30-03
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: EU plán AI „gigatováren" — skutečným cílem je sběr dat, ne konkurenceschopnost (Vrabel, 30.
    7. 2026)
  text: 'Evropská komise vyhlásila plán na výstavbu až sedmi AI „gigatováren" s cílem posílit technologickou
    suverenitu Evropy vůči USA a Číně (10 mld. eur z veřejných zdrojů, očekávaných dalších 20 mld. eur
    soukromých investic; cíl Ursuly von der Leyenové: Evropa jako „přední kontinent" v umělé inteligenci).
    Vrabel to označuje za nereálné — Evropa dle něj v závodě o umělou inteligenci (mezi USA — OpenAI,
    Anthropic — a Čínou — DeepSeek a další) „není ani kvalifikovaná", nemá vlastní GPS systém ani komunikační
    infrastrukturu (Facebook, WhatsApp, Google běží přes USA) a technologicky zaostává o desetiletí. Skutečným
    smyslem gigatováren je podle něj shromažďování dat pro byrokracii — konkrétně evidenci veškerého movitého
    i nemovitého majetku občanů (včetně zlata a elektroniky) — nikoli konkurenceschopnost v AI.'
- id: vrabel-2026-07-30-04
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Sankční seznam EU z roku 2014: sdílení RT/Sputniku jako trestný čin (Vrabel, 30. 7. 2026)'
  text: 'Vrabel při přípravě rozhovoru pro ruské médium zjistil, že unijní nařízení Rady EU z roku 2014
    zařazuje tisíce osob a firem na sankční seznam s odůvodněním, že „ohrožují územní celistvost Ukrajiny"
    nebo „jednají v rozporu s ústavou Ukrajiny" — mezi ně patří i mediální domy jako RT a Sputnik. Z toho
    vyvozuje, že sdílení obsahu z takto sankcionovaných médií by mohlo být v ČR trestné až pětiletým odnětím
    svobody — přestože Ukrajina není členem EU a její ústava nemá s právním řádem Unie nic společného.
    Vrabel to označuje za absurdní: dohody podobného typu (viz [Bezpečnostní dohoda Polsko–Ukrajina](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-30-10))
    pak umožňují stíhat politicky nepohodlné lidi jako šiřitele „ruské propagandy".'
  podtema: Trestání politického projevu
- id: vrabel-2026-07-30-05
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Vrabel vyhlašuje zářijovou demonstraci proti jaderným zbraním v ČR — vysvětlení „jaderného deštníku"
    (Vrabel, 12. 7. 2026)
  text: '**30. 7.** — Vrabel znovu opakuje stejnou tezi (salámová metoda, útočné rakety, ne obranný „deštník")
    a naléhá, že demonstrovat je třeba **před** podpisem dohody Andrejem Babišem, ne až poté, kdy už „nebude
    pro co demonstrovat" — [Zprávy v devět 30. 7.](/zdroje/2026-07.md#2026-07-30_vrabel_zpravy-v-devet-30-7-2026)'
- id: vrabel-2026-07-30-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Eskalace v Ceutě: „obchod s dětmi", žádné hranice Španělsko–ČR (Vrabel, 30. 7. 2026)'
  text: Vrabel referuje o zhoršující se situaci ve španělské enklávě Ceuta (přibližně 1 500 migrantů za
    týden, přeplněné kapacity pro nezletilé) a spojuje ji se zprávou o legalizaci až 3 milionů nelegálních
    migrantů španělskou vládou. Pouští video údajného únosu dítěte za bílého dne a varuje, že obchod s
    dětmi „kvetoucí" v Americe se může rozšířit i do Evropy. Zdůrazňuje, že hraniční plot v Ceutě je (na
    rozdíl od dobře střeženého maďarsko-srbského plotu) záměrně prostupný, a připomíná, že mezi Španělskem
    a ČR neexistují žádné hranice — proto vyzývá k opatrnosti ohledně vlastních dětí, nikoli jen k politickému
    tlaku na vystoupení z EU.
- id: vrabel-2026-07-30-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Nuland přiznala sabotáž mírových jednání 2022 — USA/Francie doznaly cílení dronů (Vrabel, 30.
    7. 2026)
  text: |-
    Bývalá vysoká představitelka amerického ministerstva zahraničí Viktoria Nulandová v rozhovoru s ruským novinářem naznačila, že ona a další západní představitelé v roce 2022 nesouhlasili s částmi tehdejšího návrhu mírové dohody mezi Ruskem a Ukrajinou (dojednávané v Turecku, těsně před podpisem), protože by podle nich omezovaly budoucí vojenské možnosti Ukrajiny. Vrabel to čte jako potvrzení své dlouhodobé teze, že mírová jednání v březnu 2022 byla záměrně sabotována ze Západu (Boris Johnson a další přiletěli za Zelenským s příslibem plné podpory a zbraní) — s odkazem na pozdější přiznání Angely Merkelové, že Minské dohody sloužily jen k získání času na dozbrojení Ukrajiny.

    Souběžně Financial Times a dříve Politico potvrdily, že USA a Francie poskytují Ukrajině zpravodajské informace (satelitní snímky, souřadnice cílů) používané při plánování dronových úderů na ruské území. Vrabel to označuje za formální doznání toho, co tvrdí od začátku — že jde o válku Západu proti Rusku vedenou skrze Ukrajinu (financování, zbraně, zpravodajství), nikoli o čistě ukrajinský konflikt — a předpokládá, že Rusko na tento posun bude muset dříve či později reagovat.
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-30-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Raketa dopadla v Polsku — absence protivzdušné obrany NATO; Tusk „50 na 50" (Vrabel, 30. 7.
    2026)
  text: Raketa (podle polského premiéra Donalda Tuska pravděpodobně ruská střela typu Ch-101) dopadla
    na poli asi 45 km jižně od Lublinu; podle ukrajinské strany proti ní měl bezúspěšně zasahovat polský
    F-16. Vrabel z incidentu (dopad 300 km od českých hranic bez jakékoli reálné reakce kromě mediálního
    rozruchu) vyvozuje, že NATO nemá funkční protivzdušnou obranu — opakuje svou tezi o neúnosné ekonomice
    sestřelování dronů (500 tisíc dolarů na jeden zásah, viz výše) a poukazuje na absenci civilní ochrany
    (kryty, plynové masky) v ČR navzdory rétorice o přípravě na konflikt s Ruskem. Kritizuje Tuskovo prohlášení,
    že „příštích 100 dní" rozhodne o výsledku války a že šance na (ukrajinské) vítězství jsou „50 na 50"
    — označuje takovou předpověď za projev buď mentální nemoci, nebo prodejnosti zahraničním zájmům, a
    trvá na tom, že konflikt se v tak krátké době nemůže rozhodnout, protože ani jedna strana není ochotná
    se vzdát.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-30-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Výroba obrněných vozidel CV90 v Šenově — bezpečnostní riziko zbrojní výroby (Vrabel, 30. 7.
    2026)
  text: V podniku VOP CZ v Šenově u Nového Jičína byla zahájena výroba 246 bojových vozidel pěchoty CV90
    (švédská licence) pro armádu ČR — investice do infrastruktury přes 80 mil. Kč, dvě nové výrobní linky.
    Vrabel k tomu (s odkazem na vlastní anekdotu o europoslankyni Kateřině Konečné, rodačce právě z Nového
    Jičína) varuje, že zapojení do zbrojní výroby dělá z daných měst legitimní vojenský cíl v případě
    přímého konfliktu s Ruskem — analogicky k tomu, jak sám zdůvodňuje legitimitu ukrajinských útoků na
    ruské zbrojovky. Přirovnává situaci k seriálu *Peaky Blinders*, kde je bombardována birminghamská
    muniční továrna s dělnicemi uvnitř, a doporučuje divákům zvážit rizika práce v podobném provozu.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-30-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Bezpečnostní dohoda Polsko–Ukrajina jako nástroj k potírání opozice před válkou (Vrabel, 30.
    7. 2026)
  text: 'Polský prezident podepsal zákon naplňující bilaterální dohodu o spolupráci bezpečnostních složek
    Polska a Ukrajiny v boji proti kriminalitě — podle některých médií může vytvořit právní rámec pro
    působení ukrajinské bezpečnostní služby SBU přímo na polském území. Vrabel to spojuje s pozorováním
    bývalého vojenského zpravodajce, že rok před vypuknutím války se typicky podepisují bezpečnostní a
    obranné dohody a zároveň se vytvářejí zákony znemožňující jít proti připravované válce (likvidace
    politické opozice). Odkazuje na obdobný mechanismus, kterým podle něj funguje unijní sankční seznam
    z roku 2014 (viz [Sankční seznam EU: sdílení RT/Sputniku jako trestný čin](/temata/dsa-cenzura.md#vrabel-2026-07-30-04))
    — dohoda mezi Polskem a Ukrajinou by tak mohla sloužit k trestnímu stíhání politicky nepohodlných
    osob označených Kyjevem za „šíření ruské propagandy".'
  podtema: Zahraniční aktéři a precedenty
