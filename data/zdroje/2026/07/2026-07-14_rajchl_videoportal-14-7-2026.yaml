  nadpis: Zetor přesouvá výrobu z ČR kvůli Green Dealu — Rajchl slibuje tvrdý boj proti EU (Rajchl, 14.
    7. 2026)
  text: Výrobce malých traktorů Zetor po 80 letech definitivně končí s výrobou v Brně a přesouvá produkci
    do Asie (viz i [Vrabelův komentář ke stejné zprávě, 13. 7.](valka-nato-rusko.md)) — jde podle Rajchla
    o posledního výrobce malých traktorů, který v Evropě zůstal. Příčinou je dle něj Green Deal — „pomatená
    fanatická ideologie", která nijak nezlepšuje životní prostředí (globální uhlíková stopa se nezmění,
    výroba jen přechází jinam), ale slouží k obohacení západoevropských investičních a penzijních fondů,
    které profitují z obchodu s emisními povolenkami. Za stranu PRO deklaruje tvrdý a nekompromisní boj
    proti Green Dealu i proti Ursule von der Leyenové a jejímu vedení EU, pokud bude v prosazování této
    politiky pokračovat.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
