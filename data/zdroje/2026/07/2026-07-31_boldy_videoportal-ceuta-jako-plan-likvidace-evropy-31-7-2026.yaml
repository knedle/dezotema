vyroky:
- id: boldy-2026-07-31-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „Zombie virus" — incident ve Walmartu jako utajovaný experiment (Boldy, 31. 7. 2026)
  text: Boldy tvrdí, že ve světě koluje nový, médii zamlčovaný „zombie virus" — jako důkaz uvádí incident
    v americkém obchodě Walmart, kde měl muž „vypadající jako zombík" pokousat jiného člověka (oběť skončila
    v nemocnici, kde si měl personál všimnout, že se před očima měnil), a fakt, že obchod byl následně
    obklíčen Národní gardou — což podle Boldyho neodpovídá běžnému pokousání. Spojuje to se svou dřívější
    tezí o patentované vakcíně jako biologické zbrani a s tvrzením, že záření z 5G (a nastupujícího 6G)
    sítí způsobuje rakovinu — s odkazem na to, že zprávy CDC o riziku rakoviny z těchto technologií „čtené
    mezi řádky" varování potvrzují.
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-31-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Ceuta jako „plán elit na likvidaci Evropy" — Gates/Rockefeller financování (Boldy, 31. 7. 2026)
  text: 'Boldy interpretuje eskalaci v Ceutě (dle jeho čísel 49 tisíc migrantů) jako záměrný plán na likvidaci
    Evropy, nikoli živelnou krizi. Tvrdí, že španělská armáda vyslaná do ulic nebrání migrantům ve vstupu,
    ale naopak jim „odklízí cestu" a usnadňuje průchod, zatímco domobrana, která se snaží bránit obchody
    a domovy, nemá právo se bránit. Financování masové migrace přisuzuje neziskovým organizacím napojeným
    na Billa Gatese a Rockefellerovu nadaci po nedávné schůzce s Trumpem a Zuckerbergem, s jediným cílem:
    likvidací Evropy. Doplňuje spekulaci, že požáry ve Španělsku souvisejí s odmítnutím americké vojenské
    základny na jeho území. Cituje biblickou předpověď o „sarančatech" (přirovnání k příchozím přes moře)
    a předpovědi Nostradama a Baby Vangy, že Evropa (tak jak ji známe) do roku 2050 zanikne a stane se
    muslimským státem.'
- id: boldy-2026-07-31-03
  typ: predikce
  temata:
  - migrace
  nadpis: Evropa zanikne a stane se muslimským státem do roku 2050
  text: S odkazem na proroctví Nostradama (přirovnání migrantů přicházejících přes moře k „sarančatům")
    a Baby Vangy tvrdí, že Evropa tak, jak ji dnes známe, do roku 2050 zanikne a stane se muslimským státem
    — aktuální migrační krize v Ceutě je dle něj počátkem tohoto procesu.
  citace:
  - text: Stejně jako Evropu varovala Bába Vanga, která říkala, že do konce roku 2050 Evropa [...] zanikne
      a bude to vlastně muslimský stát.
  predikce:
    horizont: do konce roku 2050
    stav: ceka
