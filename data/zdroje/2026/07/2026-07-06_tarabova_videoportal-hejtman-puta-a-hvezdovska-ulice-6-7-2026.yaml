  nadpis: Hejtman Martin Půta (kandidát na Senát) — obvinění ze lži o opravě silnice
  text: Tarabová na místě v Mimoni ukazuje, že hejtman Liberecka Martin Půta ve svém videu prezentoval
    jako opravenou krajskou investici (4,5 mil. Kč) Hvězdovskou ulici — ve skutečnosti šlo o silnici ve
    vlastnictví sousedního města Ralska, zatímco skutečná Hvězdovská ulice v Mimoni, o níž se v komunikaci
    mluvilo, zůstává rozbitá a neopravená. Označuje to jako druhou v pořadí odhalenou nepravdu („lež č.
    2") a naznačuje, že vzhledem k opakování už nejde o omyl, ale o „vydírání".
