  nadpis: Kritika „farizejského" mentorování občanů — moderátor Jakob a herec Jiří Dvořák (Rajchl, 26.
    7. 2026)
  text: Rajchl kritizuje dva mediální projevy blahobytného pokrytectví. V debatě s moderátorem Janem Jakobem
    (patrně CNN Prima News) mu Jakob namísto věcné argumentace o EU/euru opakovaně vyčítal jeho podnikatelskou
    minulost („vykazujete vodu a pijete víno") — Rajchl to odmítá s tím, že Jakob sám v životě nic nevytvořil,
    jen se „přisál na státní cecík". Druhým příkladem je herec Jiří Dvořák, který veřejně prohlásil, že
    se lidé v ČR „mají jako prasata v žitě" a neváží si toho — Rajchl mu vyčítá, že takto může mluvit
    díky vlastním honorářům a tantiémům, ale je pokrytecké kázat to lidem vydělávajícím 20–25 tisíc měsíčně
    v Děčíně, Sokolově nebo Krnově. Sám se hlásí k tomu, že je bohatý, ale vyrůstal z chudých poměrů,
    a odmítá roli „povrchního mentora" — každý má jinou startovací čáru a i nízkopříjmové profese (popeláři,
    uklízečky, zdravotní sestry) jsou pro společnost nepostradatelné.
  podtema: Nová alternativní média
