  nadpis: Pavlovo veto rozpočtového zákona jako definitivní důkaz role „prezidenta opozice" (Rajchl, 26.
    7. 2026)
  text: 'Rajchl označuje Pavlovo veto zákona nezbytného pro sestavení státního rozpočtu (bez něj nelze
    škrtat mandatorní výdaje) za definitivní důkaz, že se Pavel „pasoval do role lídra opozice" — přestože
    sliboval být "prezidentem všech". Kontrastuje to s Pavlovým chováním vůči vládě Petra Fialy: čtyři
    roky nekritizoval ani jeden z Fialových kroků (včetně škrtů školkovného a slevy na manžela v konsolidačním
    balíčku), naopak jeho rozpočty (dle Rajchla „falešné jak pětník") nikdy nevetoval, ačkoli k tomu byl
    vyzýván — údajně proto, že mu bylo slíbeno, že rozpočet bude ještě upraven (což se nestalo). Od nástupu
    vlády Andreje Babiše je to naopak „samý naschvál": nejmenování Filipa Turka, trestní oznámení na Petra
    Macinku, žaloba k Ústavnímu soudu (kde předběžné opatření padlo do 24 hodin — Rajchl cituje spekulaci,
    že bylo napsáno ještě před podáním žaloby) a nyní veto rozpočtového zákona. Rajchl argumentuje, že
    veto je ekonomicky nerealistické — každý ekonom by potvrdil, že bez změny zákona rozpočet „poctivě"
    sestavit nelze — a uzavírá, že Pavel buď této ekonomické souvislosti nerozumí, nebo mu je to jedno;
    v obou případech jde o „faul na Českou republiku". Kritizuje také opozici (ODS, Piráty, STAN, KDU-ČSL,
    TOP 09) za to, že nemá vlastní témata a jen recykluje to, co „nadnáší" Pavlův marketingový tým.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-07-26-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Vzor Irska: 15% rovná daň, protekcionismus a dluhopisy — rozšíření programu PRO (Rajchl, 5.
    7. 2026)'
  text: '**26. 7.** — Rajchl oznamuje uspořádání semináře v Poslanecké sněmovně s odborníky na ekonomiku,
    který má zodpovědět, zda se ČR ještě ekonomicky vyplatí členství v EU — cituje nositele Nobelovy ceny
    Josepha Stiglitze, že se dle něj členství „už nevyplatí". Argumentuje analogií s manželstvím: ČR do
    EU vstupovala 1. 5. 2004 za zcela jiných podmínek (bez Green Dealu, bez Lisabonské smlouvy z 2009
    posilující bruselské centrum moci, bez masivní migrace) — pokud se svazek stal „vydíráním a uzurpací",
    má právo o rozvodu uvažovat, stejně jako v manželství, kde by po 22 letech zjistil, že partner je
    „tyran". Krátkodobě očekává pokles životní úrovně, střednědobě a dlouhodobě zlepšení. Doplňuje symbolický
    požadavek: sundat vlajky EU z českých budov (ČR je členem stovek dalších mezinárodních organizací,
    jejichž vlajky nevisí) jako symbol nadřazenosti Bruselu. Odmítá nálepkování debaty o EU/euru jako
    „proruské" — hodnotí to jako nedostatek věcných argumentů u oponentů.'
  podtema: Ekonomický program PRO
- id: rajchl-2026-07-26-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina po válce bude „ukřivděná" a obrátí se proti Západu — analogie s Výmarskou republikou
    (Rajchl, 5. 7. 2026)
  text: '**26. 7.** — Rajchl s radostí cituje rozhovor Elona Muska pro The Economist, v němž Musk popsal
    řešení války na Ukrajině „přesně tak", jak to on sám tvrdí už čtyři roky — tedy že šlo o dohodu dostupnou
    už v Istanbulu 2022. Vítá, že takto uvažuje i vlivný a racionální člověk, kterému je jedno, že ho
    za to budou nálepkovat jako „proruského kolaboranta" — takový pohled je podle Rajchla čistě pragmatický,
    nikoli ideologický.'
  podtema: Stav Ukrajiny a mobilizace
- id: rajchl-2026-07-26-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Rajchl: Ukrajina se zhroutí, ne eskaluje; Zelenskyj → Zalužný, mír u ~90 % Doněcka (19. 7.
    2026)'
  text: '**26. 7.** — Rajchl potvrzuje pokračování krize: po odvolání Fedorova z pozice ministra obrany
    a premiérky vypukly na Ukrajině nejsilnější demonstrace za celou válku s heslem „Zelju ven"; i spřízněná
    média (Seznam Zprávy) prý začínají psát o zhoršujícím se, potlačovatelském chování Zelenského (rušení
    televizních stanic do hodiny od spuštění vysílání). Rajchl usuzuje, že Zelenskyj odvolal Fedorova,
    protože ten odmítal rozkrádání zahraniční pomoci a chtěl peníze skutečně na obranu — dle průzkumů
    je dnes Fedorov mezi Ukrajinci populárnější než Zelenskyj, a proto (spekuluje Rajchl) se bude muset
    „při každém přejití ulice rozhlížet čtyřikrát". Trvá na predikci, že klíčová mírová dohoda přijde
    až po pádu Kramatorsku a Sloviansku (možná i Kupjansku) a bude podepsána novým, dosazeným prezidentem
    — nikoli Zelenským, kterého Vladimir Putin osobně „nikdy nepotká" — a bude podstatně horší, než jaká
    mohla být uzavřena už v Istanbulu 2022. Předpovídá, že jakmile bude dohoda podepsána, dnešní „rusobijci"
    (jmenuje Martina Dvořáka, „pana Bartoška", Piráty) budou předstírat, že o Zelenského korupci nemohli
    vědět.'
  podtema: Zahraniční aktéři a precedenty
