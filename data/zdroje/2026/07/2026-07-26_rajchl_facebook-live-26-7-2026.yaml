  nadpis: Zveřejňování státní příslušnosti pachatelů + automatické vyhoštění cizinců (Rajchl, 10. 6. 2026)
  text: '**26. 7.** — Rajchl opakuje a rozšiřuje soubor konkrétních opatření: krátkodobě zrušit sociální
    dávky pro ukrajinské migranty (přišli sem, musí se sami uživit — očekává, že se řada jich vrátí),
    automatické vyhoštění cizince za jakýkoli násilný trestný čin nebo přestupek (vzor Polsko — po demonstraci
    s vlajkou UPA vyhoštěny během 2 dnů desítky lidí), střednědobě ukončení dočasné ochrany, dlouhodobě
    ochrana hranic před „druhou vlnou" migrace po skončení války (vracející se ukrajinští vojáci hledající
    příbuzné v ČR). Argumentuje, že ukrajinská migrace po roce 2022 už nezaplňuje jen místa, o která Češi
    nemají zájem — jmenuje konkrétní příklad konkurzu na pozici účetní, kde si zaměstnavatel vybral ukrajinskou
    uchazečku inzerující se na Instagramu navzdory řadě českých uchazečů, přičemž do pár měsíců skončila.
    Ilustruje kontrastem: ukrajinští migranti čerpající sociální dávky v ČR si zároveň jezdí užívat luxusní
    dovolenou zpět do Oděsy (Rolls-Royce, Pagani, Ferrari) placenou z peněz „ukrajinských oligarchů",
    kteří na válce „zbohatli jak nikdy v historii". Uvádí i dva konkrétní videem doložené incidenty: mladý
    Ukrajinec drze nabíjející telefon v technické místnosti metra a opilá Ukrajinka odmítající uvolnit
    nemocniční vozík záchrance.'
