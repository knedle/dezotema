  nadpis: 'Útok mačetou na LGBTQ demonstraci v Berlíně — Rajchl: pokrytectví levice (26. 7. 2026)'
  text: 'Muž libanonského původu (dle Rajchla mediálně prezentovaný jako „německý státní občan") najel
    autem do davu na demonstraci LGBTQ v Berlíně, poté vystoupil z vozidla a začal sekat mačetou do lidí
    — jeden člověk zemřel, další byli zraněni. Rajchl vyjadřuje lítost nad ztrátami na životech, ale zdůrazňuje
    krutou ironii: značná část LGBTQ komunity dlouhodobě prosazovala otevřenou migrační politiku vůči
    lidem, kteří je dle jeho slov „považují za podlidi" a v zemích původu by je „ukamenovali, pověsili
    nebo zastřelili" — útok se jim tak podle něj vrátil „jako bumerang". Srovnává to s trestním stíháním
    SPD za volební plakát zobrazující migranta s nožem (odsouzeno jako podněcování rasové nenávisti),
    zatímco realita v Berlíně plakát „naplnila" doslova, jen s mačetou místo nože. Kritizuje pokrytectví
    Pirátů, kteří si na profil dávají černý rámeček s duhovou vlajkou, přestože sami dlouhodobě podporovali
    migrační pakt a masovou migraci. Opakuje své obecné řešení migrace: nulová tolerance vůči nelegálním
    příchozím (vzor Austrálie — vracet zachráněné do Maroka/Tuniska/Libye), tvrdé odmítnutí a prosazování
    remigrace — připomíná, že petici za remigraci s několika sty tisíci podpisy EU odmítla zaregistrovat
    (viz [Save Europe Act](#eu-odmítla-registrovat-iniciativu-save-europe-act-migrační-pakt-jako-nevyhnutelnost-vrabel-23-7-2026)),
    protože na to nemá věcné argumenty.'
