  nadpis: Policie nepotvrdila hajlování — výzva Pavlovi k jmenování a omluvě (Šejna, 28. 7. 2026)
  text: Adam Šejna (Restart Česko) se vrací ke kauze nejmenování Filipa Turka ministrem prezidentem Petrem
    Pavlem, odůvodněné obviněním z hajlování/nacistických gest. Tvrdí, že ani policie, která věc vyšetřovala,
    nedokázala tato obvinění potvrdit jako prokazatelná. Z toho vyvozuje, že Pavel jednal na základě něčeho,
    co sám označoval za jednoznačně prokázané, ačkoliv prokázané není — a vyzývá ho, aby Turka jako ministra
    jmenoval a omluvil se mu za dosavadní postup.
  citace:
  - text: Petře Pavleji, jmenujte Filipa Turka ministrem. [...] Je na vás, abyste napravil vaši chybu.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Nejmenoval Turka ministrem na základě nepotvrzeného obvinění; rozhodnutí ÚS v jeho prospěch
      rychlejší než u běžných soudů
  podtema: Kauza Filip Turek — nejmenování ministrem a spor s Nerudovou
