  nadpis: Perzekuce kritiků covidu v zahraničí — Rose, Noack, Gold (Zítko, 16. 7. 2026)
  text: 'Zítko sdílí sérii zahraničních svědectví, která dává do paralely s domácími případy (Zítko, Peková,
    Čermák): doktorka **Jessica Rose** (tým Dr. McCullougha) prezentuje studii o nárůstu myokarditidy
    u očkovaných dětí; doktor **Andreas Noack** z Rakouska, který během vlastního živého vysílání v listopadu
    2021 vysvětloval princip řezání cév nanočásticemi grafenu, byl podle Zítka za toto vysvětlení zavražděn
    poté, co k němu během vysílání vtrhla policie. Nejpodrobněji líčí případ americké lékařky **Simone
    Gold** (postavila se proti lockdownům a prosazovala hydroxychlorochin): byla zatčena FBI, označena
    vládou za teroristku, její dospívající syn byl sledován agenty TSA, bankovní účty zablokovány a pověst
    zničena — Zítko to popisuje jako vzorec „selektivního pronásledování", který se dle něj odehrával
    „všude na světě jako přes kopírák", a srovnává ho s trestním stíháním Tomáše Čermáka v ČR.'
