  poznamka: 'Zpracováno 11 témat: (1) Rajchlův nesplněný slib vystoupení z WHO vs. Trump — [covid-vakciny.md](covid-vakciny.md).
    (2) „Tartárie" a rok 1776 — [konspirace.md](konspirace.md). (3) Dvojí metr Turek vs. Fiala/Pavel (nehody)
    — [kauzy.md](kauzy.md). (4) Americká žaloba — 45 000 mrtvých, CDC 150 000 — [covid-vakciny.md](covid-vakciny.md).
    (5) Umlčovaní lékaři v zahraničí (Rose, Noack, Gold) — [kauzy.md](kauzy.md). (6) Cena za svobodu projevu
    — aktuální hlasy — [politicky-system.md](politicky-system.md). (7) Kauza Paukner — ČT a Svaz moderní
    energetiky — [media-propaganda.md](media-propaganda.md). (8) George Soros — konec impéria — [konspirace.md](konspirace.md).
    (9) Vyšetřování Fauciho (gain-of-function) — [covid-vakciny.md](covid-vakciny.md). (10) FDA/thimerosal
    — [covid-vakciny.md](covid-vakciny.md). (11) Dr. Pierre Corry — média jako spoluviníci — [covid-vakciny.md](covid-vakciny.md).
    Opakování beze změny (jen zdroj, bez rozšíření): Helmut Šterc 60 000 Němců, dvojníci Bibi/Biden/Fiala,
    MedBeds, tunely Central Park/adrenochrom, Bitcoin kauza, Pšenák/Oganesian prediktivní programování.
