  nadpis: 'FDA a thimerosal: rtuť v dětských vakcínách nikdy neprošla bezpečnostními testy (Zítko, 16.
    7. 2026)'
  text: Zítko sdílí tvrzení, že ředitel FDA přiznal, že konzervační látka thimerosal (na bázi rtuti),
    přidávaná do dětských vakcín od roku 1929, nikdy neprošla testy bezpečnosti pro použití u zdravých
    kojenců. Vyzývá diváky, aby zvážili, zda není jednodušší „odstranit příčinu" (přestat používat látku)
    než řešit následky sbírkami na léčbu nemocných dětí.
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
