  nadpis: 'Kauza Paukner: Česká televize a placený Green Deal obsah přes Svaz moderní energetiky (Zítko,
    16. 7. 2026)'
  text: 'Zítko sdílí a schvaluje analýzu nováčka na scéně Tomáše Pauknera (viz i dřívější zmínku o jeho
    odhalení předraženého nákupu vrtulníků Rakušanem) o financování Zeleného obsahu České televize. Podle
    Pauknerovy analýzy si Svaz moderní energetiky (lobby obnovitelných zdrojů) v projektu „Česko a Evropa
    řeší klima" (2022–2025, hrazeno Státním fondem životního prostředí i koncesionářskými poplatky) nejen
    zaplatil scénář a účast expertů prezentovaných jako nezávislých (ředitel PR agentury Obnovitelně Pro
    Ondřej Novák, Ondřej Přibyla z neziskovky Fakta o klimatu — financované mj. solárním baronem Krskem
    a evropskou nadací na podporu Green Dealu), ale „koupil si" i konkrétního zaměstnance ČT — meteorologa
    Michala Žáka, který začal aktivně vystupovat na akcích svazu. Ministr životního prostředí Petr Hladík
    je líčen jako ten, kdo zadal ČT požadovaný politický obsah bez řádného označení jako reklama/sponzorovaný
    obsah — Zítko to srovnává s hypotetickou situací, kdy by podobný pořad zadal Filip Turek: podle něj
    by v takovém případě vyšly do ulic statisíce lidí z Milionu chvilek. Vyzývá diváky, aby žádali vrácení
    koncesionářských poplatků od 12. 3. 2020 i odškodnění za újmu na zdraví způsobenou vysíláním ČT.'
  podtema: Nová alternativní média
