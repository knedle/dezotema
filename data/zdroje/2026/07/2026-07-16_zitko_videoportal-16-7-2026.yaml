  nadpis: 'Dr. Pierre Corry: novináři jako spoluviníci mlčení o úmrtích po vakcíně (Zítko, 16. 7. 2026)'
  text: 'Zítko cituje amerického lékaře Pierra Corryho, podle kterého je jedním z největších polistopadových
    (post-pandemických) skandálů to, o čem se v médiích neinformuje: když náhle zemřou mladí, zdánlivě
    zdraví lidé, novináři se odmítají zeptat, zda byli očkováni proti covidu a zda to mohlo být přispívajícím
    faktorem. Corry podle Zítka tvrdí, že každý novinář, který se odmítá na tuto souvislost ptát, je spoluviníkem.'
