  nadpis: Vlastní „Cena za svobodu projevu" a kritika oficiálních nominací (Zítko, 8. 7. 2026)
  text: '**16. 7.** — Zítko zveřejňuje průběžné výsledky hlasování: u Pavla Matochy vede Luboš Xaver Veselý
    (138 hlasů, po Matochově nedávném rozhovoru s ním), následuje Václav Klaus (75), Karel Janeček (25),
    Jana Škopková (15) a Aleš Borovan (nejméně) — u Martiny Kocijánové mezitím přibylo na 12 komentářů,
    poděkoval jmenovitě přispěvatelům (Petr Marhaňka, Romy Havlínová, Iveta Molnárová aj.). Zdůrazňuje,
    že žádný ze čtyř dosavadních porotců nenominoval nikoho z pronásledovaných kritiků covidu (Tomáš Čermák,
    Iveta Křížová, Luboš Volný, Jana Peterková, Pavel Hejátko), přestože podmínky ceny cílí právě na osoby
    pronásledované za svobodu projevu — kritizuje to jako důkaz netransparentnosti společnosti, která
    odmítla zveřejnit i to, koho reálně nominovalo přes 3000 hlasujících z řad veřejnosti.'
  podtema: Politická perzekuce
