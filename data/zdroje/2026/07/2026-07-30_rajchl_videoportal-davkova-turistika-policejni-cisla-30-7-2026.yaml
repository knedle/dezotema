  nadpis: Podvody s humanitárními dávkami — „dezinformace, která se stala pravdou" (Rajchl, 13. 6. 2026)
  text: '**30. 7.** — K nové policejní zprávě o téměř 300 odhalených případech neoprávněného čerpání dávek
    ukrajinskými migranty (škoda cca 18 milionů korun) — včetně případů, kdy byly ženy nucené podávat
    desítky žádostí o různé dávky — Rajchl trvá na tom, že jde jen o „špičku ledovce": s odkazem na své
    dřívější působení coby vyučující na policii tvrdí, že to policisté sami potvrzují, ale skutečný rozsah
    zůstává „pod kobercem" — [Videoportál 30. 7.](_zdroje.md#jindřich-rajchl--videoportál-dávková-turistika-policejní-čísla-30-7-2026)'
