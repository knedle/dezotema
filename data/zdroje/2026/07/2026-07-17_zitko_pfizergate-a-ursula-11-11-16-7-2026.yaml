  nadpis: ČT placená nejen solárníky, ale i farma a zbrojaři (Zítko, 16. 7. 2026)
  text: 'Zítko rozšiřuje tezi o placené propagandě v ČT (viz sekci výše): kromě solárních baronů si prý
    ČT „kupují" i farmaceutické a zbrojařské korporace, a to nejen přes koncesionářské poplatky, lobbing
    a neoznačené placené pořady, ale i přímými intervencemi a platbami nadnárodních korporací (odkaz na
    článek Martina Kiršnera a další sliby Tomáše Pauknera). Uzavírá, že „největší kšeft je válka a zdraví",
    nejde o objektivní zpravodajství, ale o placenou propagandu; ČT prý minimálně od 12. 3. 2020 neplní
    zákon o ČT (povinnost vysílat oponentní názory), takže diváci mají „oprávněnou možnost bránit se proti
    výpalnému" a žádat poplatky zpět za 6+ let.'
  podtema: Nová alternativní média
