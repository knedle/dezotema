  nadpis: 'Pupečníková krev: „nechat dotepat" vs. byznys s císařskými řezy (Zítko, 16. 7. 2026)'
  text: Zítko tvrdí, že pupečníková šňůra by se měla po porodu nechat „dotepat" (30–60 minut), aby dítě
    dostalo maximum kmenových buněk, krve a kyslíku — což prý u císařského řezu není možné, protože dítě
    musí rychle ven. To spojuje s obviněním, že v pražském Podolí se rodí „41 miminek císařským řezem",
    aby se mohlo kšeftovat s pupečníkovou krví pro farmaceutický průmysl. Dotepání šňůry a první mlezivo
    (kolostrum) označuje za „vakcínu, kterou dává maminka", již žádná injekce nenahradí. Spojuje to s
    propadem porodnosti o 30 %.
  podtema: „Pfizergate" a rod von der Leyenových (Zítko, 16. 7. 2026)
