  poznamka: 'Samostatné vysílání „Pfizergate a Uršula 11:11" (odlišné od Videoportálu 16. 7.). Zpracováno
    7 témat: (1) Pfizergate — von der Leyen SMS s Bourlou, „nacistický" rodokmen/eugenika, Heiko v Orgenesis
    — [covid-vakciny.md](covid-vakciny.md). (2) Pohřební služba Marlis (Německo): nadúmrtnost, rychlý
    rozklad, turbo rakoviny — [covid-vakciny.md](covid-vakciny.md). (3) Studie očkované vs. neočkované
    děti (Avdičová, 22 kategorií) — [covid-vakciny.md](covid-vakciny.md). (4) Pupečníková krev / byznys
    s císařskými řezy — [covid-vakciny.md](covid-vakciny.md). (5) Patent Pfizer na dálkové sledování (Bluetooth
    na hřbitově) — [digitalni-kontrola.md](digitalni-kontrola.md). (6) 40/50 mil. muslimů na dávkách (Petránek)
    — [migrace.md](migrace.md). (7) ČT placená solár/farma/zbrojaři — [media-propaganda.md](media-propaganda.md).
    Stoch. teror: 2 výroky (šarže E na média/politiky; schválení Čermáka „naházet do řeky"). Opakování
    beze změny (jen zdroj): Deep State/Central Casting reprízy, přistání na Měsíci/Kubrick/Area 51, volby
    2023 podvod, kauza Blažek/bitcoiny, Kirsch/CDC 150 mil., Cena za svobodu projevu (Čermák/Svoboda).
    Bez predikcí.'
