  nadpis: 'Pohřební služba Marlis (Německo): nadúmrtnost a rychlý rozklad těl (Zítko, 16. 7. 2026)'
  text: 'Zítko čte a komentuje svědectví německé majitelky pohřebního ústavu (Marlis / „Marta Scholler"):
    od roku 2021 prý dvojnásobná úmrtnost oproti dřívějšku, přeplněná krematoria a hromadění rakví (příklad
    18 úmrtí za víkend z jedné kliniky se 4 chladicími boxy), opakovaná úmrtí ve stejných rodinách (2–4
    za rok) i lidí kolem 50 let nalezených mrtvých v posteli. Popisuje „turbo rakoviny" od 2023, mizející
    posmrtnou ztuhlost a rychlý rozklad (zelenání břicha 3. den), který přičítá chemoterapii, morfiu/fentanylu
    a očkování. Zítko doplňuje vlastní starší tezi (od Igora z Nitry, 2022), že zaočkovaní umírají „zejména
    ráno" kvůli nedodržování pitného režimu a „stuhnutí krve" (odkaz na patology Cole, Hirschman, Hodkinson).
    Vedra označuje jen za spouštěč u oslabených očkovaných. Navazuje na [protokol covidových úmrtí (Peterson
    Pierre)](#pěti-krokový-protokol-jak-byli-pacienti-zabíjeni-v-nemocnicích) a [Remdesivir a ventilátory](#remdesivir-a-ventilátory-skutečná-příčina-covidových-úmrtí).'
  podtema: „Pfizergate" a rod von der Leyenových (Zítko, 16. 7. 2026)
