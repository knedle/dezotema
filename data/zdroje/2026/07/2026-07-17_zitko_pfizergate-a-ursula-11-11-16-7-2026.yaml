  nadpis: Studie „očkované vs. neočkované děti" — nemocnější ve 22 kategoriích (Zítko, 16. 7. 2026)
  text: "Zítko sdílí (přes Vladimíru Avdičovou) údajně „největší kohortovou studii\" srovnávající očkované\
    \ a neočkované děti, podle níž jsou očkované děti nemocnější ve všech 22 kategoriích chronických onemocnění:\
    \ rakovina +54 %, autismus +180 %, neurovývojové poruchy/ADHD +1254 %, autoimunitní onemocnění +1120\
    \ %, motorické postižení +810 %, poruchy řeči +803 %, duševní poruchy +696 %, astma +553 %. Do vakcín\
    \ dětem přisuzuje „koktejl\" (buňky potracených opičích plodů, SV40, grafen). Odkazuje na Nikolaase\
    \ Halschera (Meg Kaluo Foundation). \n\n⚡ **Poznámka:** Uváděná čísla pocházejí z aktivistických zdrojů,\
    \ nikoli z recenzované epidemiologie."
  podtema: „Pfizergate" a rod von der Leyenových (Zítko, 16. 7. 2026)
