  nadpis: 'Armádní informátor: chemtrails, morgelony a věže 5G jako nástroj „ovládnutí lidstva" (Zítko,
    21. 7. 2026)'
  text: 'Zítko sdílí video označené jako výpověď „armádního informátora" a spojuje ho s vlastní tezí o
    covidových opatřeních jako testu poslušnosti: chemtrails, morgelony (parazity aktivované dechem, které
    mají cíleně napadat epifýzu/mozkovou šišinku — „anténu pro napojení na zdroj informací") a věže mobilních
    sítí 5G měly společně sloužit k „ovládnutí lidstva" a zbavení se „zbytečných jedlíků". Roušky a PCR
    tyčinky podle něj sloužily ke kontaminaci morgelony, zatímco frekvence 5G sítí byly aktivovány pod
    označením COVID-19.'
