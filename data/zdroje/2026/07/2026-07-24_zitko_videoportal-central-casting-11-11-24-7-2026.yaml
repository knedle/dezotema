  nadpis: Dvojníci a klony politiků a celebrit
  text: |-
    **24. 7.** — Zítko čte a plně přejímá cizí text (autorka „Hanna Hanna"), který teorii dvojníků/Central Castingu rozšiřuje o nové příklady: francouzský prezident **Emmanuel Macron** byl po svém znovuzvolení nahrazen dvojníkem napojeným na Alianci — jako „důkaz" uvádí vlastní interpretaci Macronovy řeči těla těsně po vyhlášení vítězství (rychlé sečtení hlasů do dvou minut po uzavření volebních místností, „vytřeštěné oči", absence radosti u Macrona a jeho manželky, zatímco štáb kolem jásal) a tvrdí, že volební výsledky (58:42) byly ve Francii, na Slovensku i u Babiše v ČR identické, což čte jako důkaz řízeného „Dominion" mechanismu. Naproti tomu **Marine Le Pen** je dle textu skutečná a je součástí „Aliance" bojující proti Deep State. Jako další příklad „testu k odhalení zrádců" uvádí Prigožinovo tažení na Moskvu proti Putinovi coby zinscenovanou provokaci. Text rovněž kritizuje konkurenční konspirační výklady (odmítá jak „agenda 2030 / nový světový řád" katastrofismus, tak antisemitské výklady typu „za vším jsou Chabad Lubavič a Sion", i teorie o Venezuele/Íránu) jako "zoufalé nářky" bránící skutečnému porozumění.

    ⚡ **Poznámka:** V rámci stejného vysílání Zítko hypoteticky spekuluje (bez jmenování konkrétního zdroje či důkazu), že se podobné praktiky vydírání jako v kauze Epstein mohly odehrávat i v ČR — jmenovitě zmiňuje brněnskou primátorku **Markétu Vaňkovou** jako účastnici blíže nespecifikovaného večírku, na němž si podle jeho domněnky mohlo docházet k užívání drog a přítomnosti dětí. Jde o nepodloženou spekulaci, ne o tvrzené faktum.
