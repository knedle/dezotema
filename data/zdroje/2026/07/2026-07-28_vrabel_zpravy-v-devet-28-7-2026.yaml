    (Vrabel, 12. 7. 2026)
  text: '**28. 7.** — Vrabel opakuje tutéž tezi (Rafale/ASMP jako útočná, ne obranná zbraň) v souvislosti
    s úvahami o umístění francouzského „jaderného zastřešení" na území ČR — [Zprávy v devět 28. 7.](_zdroje.md#ladislav-vrabel--zprávy-v-devět-28-7-2026)'
- id: vrabel-2026-07-28-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: EU odmítla zaregistrovat iniciativu Save Europe Act; migrační pakt jako nevyhnutelnost (Vrabel,
    23. 7. 2026)
  text: '**28. 7.** — Ke zprávě o stažení německých námořních lodí z oblasti Adenského zálivu (viz [blizky-vychod.md](blizky-vychod.md))
    Vrabel s rasově motivovanou glosou o „opálených" německých vojácích dodává, že migrační pakt dál platí
    a vláda proti němu nic neudělala — jen v prosinci vydala prohlášení, že jej „neberou". Predikuje,
    že podobní vojáci „v maskáčích" budou brzy i v české armádě, protože i jiné země (USA, Rusko) nabírají
    migranty do armády výměnou za občanství — [Zprávy v devět 28. 7.](_zdroje.md#ladislav-vrabel--zprávy-v-devět-28-7-2026)'
- id: vrabel-2026-07-28-07
