  nadpis: Húsíové zaútočili na tankery v Báb al-Mandabu; ropa nad 100 $ poprvé od května (Vrabel, 23.
    7. 2026)
  text: '**28. 7.** — Německé námořnictvo stáhlo dvě lodě z oblasti Adenského zálivu/Rudého moře do východního
    Středomoří — oficiálním důvodem jsou bezpečnostní a technické problémy (mj. s chlazením). Vrabel k
    tomu připojuje rasově motivovanou glosu o „opálených" německých vojácích a spojuje zprávu se svou
    dlouhodobou kritikou migračního paktu (viz [migrace.md](migrace.md)).'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-28-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Křetínského EPH poprvé ve Fortune Global 500 — Vrabel: profit z vysokých cen elektřiny v ČR
    (28. 7. 2026)'
  text: Vrabel komentuje zprávu, že energetická skupina EPH (Energetický a průmyslový holding) miliardáře
    Daniela Křetínského se poprvé zařadila do žebříčku Fortune Global 500 největších firem světa podle
    tržeb. Vrabel to interpretuje jako přímý důkaz svého dlouhodobého tvrzení, že vysoké ceny elektřiny
    pro české domácnosti a firmy nejsou nešťastnou náhodou, ale výsledkem obchodního modelu, na kterém
    soukromí majitelé energetických firem (v tomto případě Křetínský) profitují.
  osoby:
  - osoba: daniel-kretinsky
    vztah: negativni
    kontext: 'Jeho firma EPH se poprvé zařadila do Fortune Global 500 — Vrabel: důkaz profitu z vysokých
      cen elektřiny pro české domácnosti'
  podtema: Manipulace trhu s ropou
