    odkaz — [jaderne-zbrane.md](jaderne-zbrane.md). (13) Meta zavádí video-selfie ověřování identity —
    [digitalni-kontrola.md](digitalni-kontrola.md). (14) Německo stahuje lodě z Adenu/Rudého moře — [blizky-vychod.md](blizky-vychod.md);
