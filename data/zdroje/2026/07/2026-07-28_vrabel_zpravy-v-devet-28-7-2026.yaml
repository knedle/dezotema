  nadpis: 'Írán: „memorandum" podepsáno (14. 6.), Hormuz otevřen 19. 6., Netanjahu nespokojen — Vrabel
    (15. 6. 2026)'
  text: '**28. 7.** — K novému setkání Netanjahua s Trumpem o íránském jaderném programu Vrabel opakuje
    svou skepsi: „stejný příběh 20 let" — srovnává opakovaná tvrzení o íránských jaderných zbraních s
    dřívějšími nepotvrzenými obviněními vůči Saddámu Husajnovi a Muammaru Kaddáfímu, které následně posloužily
    jako záminka k invazi/intervenci — [Zprávy v devět 28. 7.](_zdroje.md#ladislav-vrabel--zprávy-v-devět-28-7-2026)'
