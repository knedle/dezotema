- id: rajchl-2026-07-23-01
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Pavel „diletant nebo lhář": lhůta pro námitku podjatosti u ÚS (Rajchl, 23. 7. 2026)'
  text: 'Rajchl reaguje na Pavlovo tvrzení, že označovat soud předem za podjatý podkopává důvěru v justici
    — jako trestní právník ho označuje za projev buď naprosté neznalosti zákona o Ústavním soudu, nebo
    vědomé lži. Argumentuje §37 zákona o Ústavním soudu: námitku podjatosti lze uplatnit nejpozději při
    prvním ústním jednání ve věci, později se k ní už nepřihlíží — podjatost tedy nelze namítnout jindy
    než předem, což je přesný opak toho, co Pavel tvrdil. Osobně se přiklání k výkladu, že jde o vědomé
    lhaní, s cílem poškodit v očích veřejnosti vládu Andreje Babiše a vykreslit situaci jako nastolování
    totality. Navazuje na dřívější kritiku Pavlovy role v kauze ÚS a podjatosti předsedy Baxy (viz [ÚS
    uložil akreditovat Pavla na summit (24. 6.)](#ús-uložil-akreditovat-pavla-na-summit-rajchl-skandální-podjatý-baxa-24-6-2026)).'
  citace:
  - text: Petr Pavel tedy buď absolutně nezná zákon o ústavním soudu, anebo vědomě obelhává český národ.
      Já osobně jsem přesvědčen, že druhá varianta je ta správná.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Diletant nebo lhář" — tvrdil, že námitka podjatosti soudu předem podkopává důvěru v justici,
      opak toho, co stanoví §37 zákona o ÚS
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
