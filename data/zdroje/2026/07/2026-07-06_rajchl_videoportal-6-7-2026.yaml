vyroky:
- id: rajchl-2026-07-06-01
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Sabotáž Nord Streamu jako legitimní vojenský cíl — kritika Petra Pavla a médií (Rajchl, 6. 7.
    2026)
  text: K obžalobě Ukrajince německou prokuraturou za útok na Nord Stream (2022) Rajchl argumentuje, že
    pokud byl útok zaměřen na přerušení dodávek plynu a ropy do Evropy (a plateb Rusku za ně), šlo o „legitimní
    cíl" — plynovody jsou strategickým cílem, na který se za ozbrojeného konfliktu útočí stejně jako na
    vojenské cíle. Kritizuje Petra Pavla, že „evidentně schvaloval teroristický útok a vojenský zločin",
    a médiím/„pravdoláskařům" vyčítá dvojí metr — nevadí jim to, protože je pro ně důležitější Pavlův
    image (motorka, záchrana paraglidistů, portrét na známkách) než hodnocení jeho postojů k válečným
    zločinům.
  citace:
  - text: Pokud tento útok byl zaměřen na to, jak přerušit dodávky plynu a ropy do Evropy a zpětně peněz
      Rusku za tyto produkty, pak by to — říkám záměrně kondicionál — byl legitimní cíl.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Evidentně schvaloval teroristický útok a vojenský zločin" (sabotáž Nord Streamu) — kritika,
      že médiím/veřejnosti víc záleží na jeho image než na tomto postoji
  podtema: Zahraniční aktéři a precedenty
