    protiraketového štítu — [valka-nato-rusko.md](/temata/valka-nato-rusko.md). (10) Zpráva EK o právním
    státu (kritika ČR, pochvala Maďarska), „protektorát" — [suverenita-eu.md](/temata/suverenita-eu.md).
    (11) Emisní povolenky po 2030 + kvalifikovaná většina — [suverenita-eu.md](/temata/suverenita-eu.md).
    (12) EU vs. MOV — ruští sportovci na OH 2028 — [suverenita-eu.md](/temata/suverenita-eu.md). Stoch.
    teror: 1 výrok (Trump — vězení a zabavení majetku i rodině). Bez predikcí.'
