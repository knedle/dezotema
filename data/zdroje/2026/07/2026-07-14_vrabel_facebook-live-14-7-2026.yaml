  nadpis: Trump zrušil 20% tranzitní daň za Hormuz den po jejím oznámení — místo toho úplná blokáda íránských
    lodí (Vrabel, 14. 7. 2026)
  text: Den poté, co Trump oznámil 20% tranzitní daň za proplouvání Hormuzským průlivem, ji zrušil a nahradil
    úplnou blokádou lodí spojených s íránskými přístavy nebo nákladem. Vrabel komentuje rychlost a nepředvídatelnost,
    s jakou Trump obrací svá vlastní rozhodnutí, a spojuje to s možností tržního profitování z takto vyvolané
    volatility cen.
  podtema: Hormuz — aktualizace 6. 5. 2026
