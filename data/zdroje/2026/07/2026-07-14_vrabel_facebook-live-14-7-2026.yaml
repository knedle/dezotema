  nadpis: Evropský prokurátor zahájil trestní řízení kvůli dotacím Agrofertu (Vrabel, 14. 7. 2026)
  text: Evropský prokurátor zahájil trestní řízení ve věci dotací pro Agrofert poté, co na to reagoval
    na stížnost Pirátů. Vrabel připomíná, že Babišův střet zájmů nebyl vyřešen převodem firmy do svěřenského
    fondu, a nečeká žádné odsouzení — Babiš podle něj zůstává „užitečnou loutkou", která dělá vše, co
    globalisté chtějí, a proto mu podobná vyšetřování neuškodí.
  podtema: Agrofert a dotace EU
- id: vrabel-2026-07-14-05
  typ: tvrzeni
  temata:
