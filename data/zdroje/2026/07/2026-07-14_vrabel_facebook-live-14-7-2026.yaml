  nadpis: Bývalý analytik CIA Larry Johnson zesměšňuje plán útoku na Kharg Island (Vrabel, 14. 7. 2026)
  text: Bývalý analytik CIA Larry Johnson se posmívá myšlence amerického speciálního komanda na íránském
    ostrově Kharg — poukazuje na to, že by síly čelily nepřetržité dronové a raketové palbě a téměř nemožnému
    zásobování. Vrabel to považuje za „velmi vtipné" a žertuje, že by pro takovou misi bylo potřeba rovnou
    druhé záchranné mise.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-14-03
