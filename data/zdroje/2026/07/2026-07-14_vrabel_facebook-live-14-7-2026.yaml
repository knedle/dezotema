  nadpis: Vrabel brání Turka i přes nesouhlas s jeho postoji — kritika Babišova podrazu (14. 7. 2026)
  text: Poslanec Filip Turek (vládní zmocněnec pro Green Deal) způsobil v centru Prahy dopravní nehodu,
    když na křižovatce u Jipáku narazil do sanitního vozu s rozsvícenými majáky. Premiér Babiš po jednání
    s předsedou motoristů a vicepremiérem Petrem Macinkou uvedl, že pokud se záběry potvrdí, měl by Turek
    na post zmocněnce rezignovat; opozice žádala i rezignaci na poslanecký mandát. Vrabel nehodu hodnotí
    jako pravděpodobně Turkovu chybu (sanitka s majáky měla přednost bez ohledu na to, že Turek jel na
    zelenou), zároveň ale poukazuje na notoricky nepřehlednou křižovatku. Zásadně nesouhlasí s tím, že
    by nehoda měla mít jakoukoli souvislost s výkonem funkce vládního zmocněnce pro klimatickou změnu
    — takový důvod k rezignaci by podle něj dával smysl jen při prokázaném vlivu alkoholu či drog. Zdůrazňuje,
    že sám Turka nemá rád a považuje ho za nejhoršího „nácka" na české veřejné scéně kvůli jeho brutální
    podpoře Zelenského a urážkám Putina, přesto trvá na tom, že spravedlnost vyžaduje oddělit osobní nehodu
    od politické funkce. Kritizuje Babiše za to, že takto „podkopl" vlastního koaličního partnera — už
    dříve mu prý nepomohl při jmenování ministrem — a vidí v tom potvrzení Babišovy povahy.
  citace:
  - text: Ale to, co mám rád, je pravda. To, co mám rád, je spravedlnost. A prostě buďme spravedliví.
  podtema: Filip Turek — dopravní nehoda a tlak na rezignaci
- id: vrabel-2026-07-14-06
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Klimatické změny a chemtrails — „bílé slunce", těžké kovy (Vrabel, 20. 6. 2026)
  text: '**14. 7.** — Vrabel přidává nový konkrétní příklad údajné kontroly počasí: Americká Federální
    komunikační komise schválila společnosti Reflect Orbital povolení k testování technologie satelitních
    zrcadel, která mají odrážet sluneční světlo na noční část Země — oficiálně kvůli záchranným pracím
    nebo zvýšení výkonu solárních elektráren. Astronomové a ekologové varují před narušením astronomických
    pozorování, oslněním pilotů a řidičů a dopadem na ekosystémy. Společnost odmítá souvislost s vývojem
    zbraní nebo řízením počasí. Vrabel tomu ironicky nevěří a řadí projekt mezi nástroje globalistů k
    ovlivňování počasí i politických rozhodnutí — připomíná požáry na Havaji, kde podle jeho pozorování
    vyhořelo vše kromě domů s modrými střechami, což mu nedává smysl jako přirozený jev.'
  podtema: Historické konspirační výklady
- id: vrabel-2026-07-14-07
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Švédská europoslankyně nahlásila dánského kolegu policii za protimigrační slogan — dvojí metr
    (Vrabel, 14. 7. 2026)
  text: Švédská europoslankyně Abir Al-Sahlaniová nahlásila policii dánského kolegu Christophera Storma
    poté, co se na sociálních sítích ostře ohradil proti tomu, že v Evropském parlamentu kritizovala kolegy
    skandující protimigrační slogan „Pošlete je zpátky" — deník Guardian obvinil kritizované poslance,
    že „klesli na nové dno". Vrabel poukazuje na ironii, že Al-Sahlaniová se narodila v Iráku a sama takto
    vystupuje proti původním Dánům, kteří chtějí migranty posílat pryč z Dánska; předpokládá, že policie
    by mohla její oznámení vyhodnotit jako rasově motivovaný útok na minoritu a stíhat dánského politika.
    Zdůrazňuje, že podobný osud čeká i ČR — migrační pakt už platí a veřejná kritika Ukrajinců či přistěhovalců
    bude podle něj brzy stejně nemožná jako na Západě.
- id: vrabel-2026-07-14-08
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Britská policejní „barevná karta" jako důkaz rasového dvojího metru (Vrabel, 14. 7. 2026)
  text: Vrabel komentuje virální video britské policistky, která při zákroku u pouličního konfliktu použije
    kartu s odstíny barvy pleti, aby porovnala tón kůže útočníka (bílého Brita) a oběti — na základě toho
    okamžitě vytáhne obušek a začne útočníka bít, protože ho podle barvy pleti vyhodnotí jako viníka.
    Vrabel to popisuje jako „krásné, opravdu vkusné" video dokládající, že v britském systému je viník
    vždy ten světlejší a oběť vždy ta tmavší, bez ohledu na skutečný průběh konfliktu.
- id: vrabel-2026-07-14-09
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Doživotí za neuposlechnutí rozkazu — eskalace od Rajchlových zákonů (Vrabel, 14. 7. 2026)
  text: Ministerstvo spravedlnosti navrhuje zvýšit trest pro vojáky, kteří odmítnou uposlechnout bojový
    rozkaz — dosavadních 5 let by mělo nahradit rozpětí 5–30 let, případně doživotí. Vrabel vidí v tomto
    návrhu další krok na „eskalační křivce strachu", která podle něj začala Rajchlovými zákony z roku
    2023 (3 roky vězení za projev sympatií k Rusku či prorusky vnímané symboly — připomíná, že Nejvyšší
    soud potvrdil odsouzení za nálepku písmene „Z" na autě). Srovnává navrhovanou úpravu s brutální praxí
    ukrajinských odvodových jednotek TCK vůči vlastním občanům.
  podtema: Politická perzekuce
- id: vrabel-2026-07-14-10
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Orbán vyzývá k „právu na odpor" proti odvolání prezidenta Šujoka — paralela s Pavlovým slibem
    (Vrabel, 14. 7. 2026)
  text: 'Maďarský parlament schválil ústavní dodatek umožňující odvolání prezidenta Tamáse Šujoka, kterému
    dal 5 dní na podpis nebo rezignaci. Viktor Orbán se v reakci odvolává na „právo na odpor" a srovnává
    postup s ukrajinským „ústavním pučem" 2013–14. Vrabel k tomu přidává vlastní paralelu: připomíná Petr
    Pavlův předvolební slib z roku 2025 nejmenovat žádného ministra, který by chtěl vystoupit z EU/NATO
    — což podle něj představuje srovnatelné ústavní překročení pravomocí prezidenta vůči demokraticky
    zvolené vládě.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-14-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Ukrajinský parlament schválil demisi vlády Svyrydenkové — Zelenskyj jako „diktátor par excellence"
    (Vrabel, 14. 7. 2026)
  text: 'Ukrajinský parlament přijal demisi premiérky Julie Svyrydenkové (258 hlasů, potřeba bylo 226),
    čímž skončila celá vláda. Zelenskyj odchod naznačil už v neděli po jednání s ní, s odůvodněním potřeby
    „změny politické strategie". Vrabel odmítá, že by šlo o změnu strategie — ta zůstává stejná — a interpretuje
    pravidelnou (každoroční) obměnu vlády jako záměrnou taktiku nezvoleného prezidenta: brání tomu, aby
    se kdokoliv ve funkci „zahřál", vytvořil si politickou pozici nebo zahraniční vazby, a nutí úředníky
    k poslušnosti vůči Zelenskému. Zdůrazňuje, že současně s vládou byla vyměněna i velvyslankyně v USA
    a úředníci v trestním řízení, což opakuje závěr z předchozího dne — snahu ochránit se před vlastním
    stíháním a signalizovat novým lidem, že za rok mohou být vyměněni také. Vrabel to označuje za „diktátorství
    v moderním pojetí dotažené do absolutní briliantnosti" a předpokládá, že západní média a vlády (včetně
    české) budou i nadále líčit tyto kroky jako boj proti korupci a demokratizaci.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Koalice ochotných rozšiřuje protiraketovou obranu — Babiš chce ČR do projektu balistických střel
    (Vrabel, 14. 7. 2026)
  text: Andrej Babiš zveřejnil tříminutové video z jednání „koalice ochotných" v Paříži, kde evropské
    země (Francie, Británie, Německo, Dánsko, Itálie, Nizozemsko, Norsko, Španělsko, Švédsko) domlouvají
    novou integrovanou protiraketovou obranu. Babiš chce, aby se ČR k projektu připojila, a prosazuje,
    aby šlo o čistě unijní projekt bez Británie, srovnatelný s Airbusem. Vrabel tvrdí, že za eufemismem
    „protiraketová obrana" se ve skutečnosti skrývá výroba balistických střel určených k použití proti
    Rusku — a to na českém území, což by z ČR udělalo přímý cíl. Připomíná, že Babiš zároveň svaluje vinu
    za to, že ČR dosud v žádné takové koalici není, na předchozí Fialovu vládu, přestože sám do projektu
    tlačí. Zmiňuje také, že Francie souhlasila s dodávkou stíhaček Rafale Ukrajině a licencí na výrobu
    balistických střel (dohoda Macron–Zelenskyj). Jediné, co Vrabel na Babišově vystoupení hodnotí kladně,
    je slib, že ČR nepošle vojáky na Ukrajinu — tomu ale nevěří vzhledem k Babišově dosavadní politice.
    Celkově to Vrabel považuje za další důkaz, že Babiš je poslušná loutka EU/NATO — horší než Pavel s
    Fialou, protože svým voličům úspěšně lže (maloval si na tvář českou vlajku, sliboval „Česko na prvním
    místě", zatímco dělá opak).
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-13
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Bulharsko odmítá vstup do koalice ochotných (Radev, Vrabel 14. 7. 2026)
  text: 'Bulharský prezident Rumen Radev oznámil, že Bulharsko se nepřipojí ke „koalici ochotných". Navazuje
    na dřívější Vrabelovo hodnocení Radeva jako politika kontrolovaného oligarchy — Vrabel je vůči němu
    skeptický a předpovídá, že pokud bude příliš dlouho vzdorovat, čeká ho stejný osud jako Orbána: postupné
    odstavení podobnými metodami.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-14
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Rusko ovládlo ~95 % Donbasu — kritika mediálního rámování „Ukrajina vítězí" (Vrabel, 14. 7.
    2026)
  text: 'Podle Vrabelovy analýzy Rusko ovládá už přibližně 95 % Donbasu. Kritizuje западní média za to,
    že tuto realitu zastírají a naopak rámují situaci jako „Ukrajina vítězí" — přitom zaměňují ukrajinské
    dronové a teroristické útoky na ruské území (které nezískávají žádné území) s vojenským vítězstvím.
    Popisuje současnou fázi jako „křižovatku": buď Západ deeskaluje a umožní nasazení mírových sil, nebo
    dojde k další eskalaci. Poukazuje na to, že signatáři posledního summitu NATO (včetně Babiše) se stále
    zavázali k „suverenitě Ukrajiny" (právu vstoupit do EU/NATO), což podle něj znamená, že válka bude
    pokračovat, dokud Rusko nezíská celý Donbas a Krym.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-15
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Polsko uspořádá první společné vojenské cvičení koalice ochotných (Vrabel, 14. 7. 2026)
  text: Polský premiér Donald Tusk oznámil, že na podzim uspořádá na polském území první společné vojenské
    cvičení „koalice ochotných" za účasti Francie, Británie a Polska. Vrabel zároveň poznamenává, že Polsko
    v tuto chvíli neposílá Ukrajině další zbraně.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-16
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Marco Rubio: ICC vede „válku" proti USA přes mezinárodní právo — dvojí metr suverenity (Vrabel,
    14. 7. 2026)'
  text: 'Marco Rubio prohlásil, že Mezinárodní trestní soud (ICC) v Haagu a jeho podporovatelé vedou proti
    USA „válku" prostřednictvím mezinárodního práva; americké ministerstvo zahraničí oznámilo kroky k
    omezení schopnosti soudu zasahovat proti americkým vojákům a představitelům, odůvodněné obranou „suverenity"
    USA. ICC má jurisdikci ve 120 zemích včetně téměř celé Evropy a ČR; USA ani Rusko nejsou signatáři
    smlouvy. Vrabel na tom ukazuje dvojí metr slova „suverenita": pro USA znamená právo beztrestně napadat
    země, unášet a zabíjet hlavy států včetně duchovních vůdců a dětí, zatímco jakýkoli pokus trestního
    tribunálu tato jednání stíhat jako zločiny proti mezinárodnímu právu vede k tomu, že se USA snaží
    soud oslabit.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-17
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Rusko-americká posádka odstartovala k ISS — Vrabel: „aspoň někde ten mozek funguje" (14. 7.
    2026)'
  text: 'K Mezinárodní vesmírné stanici odstartovala smíšená rusko-americká posádka (loď Sojuz MS-29 z
    Bajkonuru) — dva ruští kosmonauti a americký astronaut na jeho první let, expedice má trvat 261 dní.
    Vrabel toto hodnotí pozitivně jako důkaz, že spolupráce mezi Ruskem a USA je možná, když je vůle.
    Navazuje na svou opakovanou tezi o „rozděl a panuj" (divide et impera): anglosaské mocnosti podle
    něj tlačí Slovany (Ukrajince a Rusy) do vzájemné války, která je stála už 3 miliony životů, protože
    na tomto konfliktu vydělávají — kasírují za zbraně, energie i „špatné GMO jídlo", zatímco Slované
    se navzájem vraždí.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-18
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Indie odmítá uspěchat obchodní dohodu s USA — BRICS jako protiváha NATO/EU (Vrabel, 14. 7. 2026)
  text: 'Indie odmítla uspěchat obchodní dohodu s Washingtonem poté, co USA nenabídly Indii celní výhody
    oproti Číně a nevyloučily nová cla ani po podpisu, a Indie zase odmítá otevřít citlivé segmenty zemědělského
    trhu americkým firmám. Vrabel to hodnotí kladně — ne každá vláda je zkorumpovaná, některé pracují
    pro vlastní zemi. Zároveň vyvrací Trumpovo opakované tvrzení, že zprostředkoval ukončení konfliktu
    Indie–Pákistán a že mu volal indický premiér: indická média i premiér to popírají. Připomíná, že Indie
    je jedním ze zakládajících členů BRICS (spolu s Brazílií, Ruskem, Čínou a Jihoafrickou republikou)
    a že BRICS dnes funguje jako opozice vůči NATO a EU — přestože Indie i Čína zároveň obchodují se Západem,
    svět se podle Vrabela jasně rozděluje na dva bloky; BRICS už dnes generuje víc obchodu než G7 dohromady
    a rychle roste.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-14-19
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Sahra Wagenknechtová: Německo se stává přímou stranou konfliktu na Ukrajině (Vrabel, 14. 7.
    2026)'
  text: Předsedkyně strany Rozum a Spravedlnost (BSW) Sahra Wagenknechtová varuje, že se Německo stává
    přímou stranou ukrajinského konfliktu, protože financuje německými zbraněmi a technologiemi údery
    na ruské vnitrozemí — čímž si podle ní „koleduje o odvetu". Upozorňuje, že v Rusku zaznívají hlasy
    volající po útocích na německé zbrojní závody, a označuje jednání vlády Friedricha Merze za nezodpovědné
    a překračující jednu červenou linii za druhou. Vrabel jen krátce komentuje, že Wagenknechtová (mimo
    AfD, s vlastní stranou) věci popisuje „naprosto přesně", a připomíná svou dřívější předpověď, že se
    realita začne veřejně probírat.
  podtema: Zahraniční aktéři a precedenty
