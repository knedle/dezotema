  nadpis: Zánik německých pivovarů a propouštění ve VW jako signál blížící se automatizace (Vrabel, 14.
    7. 2026)
  text: Vrabel komentuje uzavření dvou historických německých pivovarů (Eichbaum po ~350 letech, Hofbräuhaus
    Wolters po ~400 letech) a oznámení Volkswagenu o možném propuštění až 120 000 zaměstnanců. Tyto události
    dává do souvislosti se závodem mezi Anthropic, OpenAI a DeepMind o plnou automatizaci/AGI (umělou
    obecnou inteligenci), kterou předpovídá do roku 2027–2028 s dopadem nezaměstnanosti přes 50 % — a
    kritizuje, že tento dopad „nikdo politicky neřeší". Připomíná vlastní přednášku o ChatGPT na olomouckém
    náměstí v roce 2023 jako důkaz včasného upozornění na téma (viz [predikce.md](predikce.md)).
  podtema: Automatizace, AI/AGI a budoucnost práce
- id: vrabel-2026-07-14-04
