  - covid-vakciny
  nadpis: 'Údajné svědectví toxikologa Pfizeru: 60 000 mrtvých Němců po vakcíně Comirnaty (Zítko, 15.
    7. 2026)'
  text: |-
    Zítko cituje vystoupení muže představeného jako „hlavní toxikolog firmy Pfizer" Helmuta Šterce v německém Bundestagu (19. března), který měl uvést, že samotnou vakcínou Comirnaty (Pfizer-BioNTech) bylo v Německu zabito 60 000 lidí. Popisuje analýzu 26 000 výrobních šarží, z nichž 12 000 bylo prověřeno (výsledky měly být zveřejněny na 147 stránkách na blockchainu) a rozděleno do tří skupin podle síly účinku: neškodné placebo (dostali média, politici a další „spoluhráči"), středně škodlivé dávky (amputace končetin, trombózy, embolie) a nejsilnější šarže s letalitou v desítkách procent (až každý pátý příjemce zemřel). Tuto klasifikaci dává do souvislosti s vlastním trestním oznámením, které předložilo přes 2000 důkazů okresnímu soudu — podle Zítka je soudkyně bez ověření označila za „dezinformaci". Doplňuje citát japonského onkologa profesora Fukušimy, který genetické (mRNA) vakcíny označuje za nepřijatelnou formu genové terapie s vedlejšími účinky napříč orgány (vaječníky, mozek, játra, slezina, kostní dřeň) — Zítko z toho vyvozuje, že na území Československa probíhala prostřednictvím „korporací Česko a Slovensko" genocida a sterilizace obyvatelstva, včetně podpory povinného očkování 65+ ze strany prof. Berana (strana PRO).

    ⚡ **Poznámka:** Jde o neověřené a neověřitelné tvrzení bez dohledatelného zdroje (jméno „Helmut Šterc" ani odpovídající svědectví v oficiálních záznamech Bundestagu nelze dohledat).
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
- id: zitko-2026-07-15-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Dvojníci a klony politiků a celebrit
  text: '**15. 7.** — Zítko sdílí a plně podporuje rozhovor australského „whistleblowera" Ricarda Bossiho,
    který teorii dvojníků rozšiřuje na téměř všechny světové vůdce: odhaduje počet náhražek (herců, dublérů,
    klonů, hologramů) na 200 000. Jako důkaz uvádí viditelnou změnu vzhledu vlasů Petra Fialy a Petra
    Pavla za posledních 10–15 let a proměnu tváře Andreje Babiše. Podle Bossiho článku „bílé klobouky"
    (síly bojující proti Deep State) systematicky odstranily špičku Deep State (Clintonovi, Obamovi „už
    byli dávno popraveni") a nahradily je herci a loutkami, které jednají podle scénáře — ponechání „známých
    tváří" u moci má udržet iluzi kontinuity, zatímco se čistí celý systém (soudnictví, policie, byrokracie)
    „od gruntu". Konkrétně tvrdí, že v Izraeli nevládne Benjamin Netanjahu, ale skutečně vládne Saúdské
    Arábii muž jménem „Ben Solomon", a že britský premiér Keir Starmer říká „hloupé věci", protože mu
    bylo nařízeno je říkat jako součást scénáře zesměšňujícího politiky před veřejností. Jako modelový
    příklad „odstranění hlavy, ponechání těla" uvádí Venezuelu (Maduro zmizel, zbytek aparátu zůstal).
    Zítko tuto teorii prezentuje jako vysvětlující a doplňuje vlastní odkaz na šachovnici s nápisem „Checkmate"
    u wimbledonského finále coby náznak, že rozuzlení („šachmat"/„český mat") může přijít z Česka.'
  podtema: Okultismus
