  text: '**20. 7.** — Zítko doplňuje nominace dalších porotců: vývojář počítačových her Dan Vávra už svoji
    pětku odevzdal (příliš pozdě na ovlivnění); u Martiny Kocijánové, Vadima Petrova, Daniela Kajzera
    (Echo24) a Tomáše Kulidakise stále lze radit, protože nominace ještě neodevzdali. Kritizuje, že loni
    organizátoři odmítli zveřejnit rozložení hlasů mezi nominovanými (přes 3000 odevzdaných). U ankety
    Křišťálová lupa upozorňuje na kategorie „online video", „zpravodajství a publicistika" a „influencer"
    a vyzývá diváky k hlasování.'
