  nadpis: 'Zítkovo odvolání: „pravda nemůže být poplašná zpráva" (3. 6. 2026)'
  text: '**29. 7.** — Zítko upřesňuje stav odvolacího řízení: krajský soud v Ústí nad Labem věc uzavřel
    minulý čtvrtek (23. 7.) bez nařízení veřejného hlavního líčení — ačkoli on i jeho obhájce na veřejném
    líčení trvali (mj. aby bylo možné vyvrátit rozsudek soudkyně Dvořákové a nechat vypovídat molekulární
    bioložku Sonju Pekovou jako svědkyni). Výsledek rozhodnutí zatím nemá k dispozici. Popisuje dvě možné
    varianty: (1) krajský soud potvrdí tříletý nepodmíněný trest — což by dle něj bylo „možná první nepodmíněné
    odsouzení v Evropě" za covidové výroky (jinde padaly jen podmínky); nebo (2) věc vrátí s odůvodněním
    zpět okresnímu soudu v Chomutově.'
  podtema: Trestání politického projevu
- id: zitko-2026-07-29-02
