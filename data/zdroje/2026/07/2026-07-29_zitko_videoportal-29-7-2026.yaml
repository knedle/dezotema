  nadpis: '„Srdcem pro vlast" (2020): infiltrace nasazenou „trojkou" — Šlajch, Semper, Kořenář (Zítko,
    29. 7. 2026)'
  text: 'Zítko vzpomíná na počátky hnutí „Srdcem pro vlast" (2020, s Robertem Šmukem), kdy jim byl podle
    jeho tvrzení hned od startu „nasazen" novinář Aleš Trčka, který hnutí naservíroval tři konkrétní hosty
    s cílem ho zdiskreditovat a rozložit: Antonína Šlajcha (údajně dosud nevyplatil sázku 5000 Kč o to,
    že Joe Biden vyhrál volby 2020 „podvodem"), Jana Sempera (popisovaného jako cenzor Facebooku) a Patrika
    Kořenáře („vyvraceč dezinformací", kterého Zítko označuje za notorického lháře). Tuto trojici interpretuje
    jako záměrně sestavenou infiltrační skupinu nasazenou už v zárodku hnutí, aby ho „zničili a zadupali
    do země".'
  podtema: Nová alternativní média
- id: zitko-2026-07-29-04
  typ: tvrzeni
