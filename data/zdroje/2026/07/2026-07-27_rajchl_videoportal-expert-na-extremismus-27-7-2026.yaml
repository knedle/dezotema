  nadpis: Expert na extremismus (Aleš Michal) žádá jeho zařazení do zprávy o extremismu — Rajchl odmítá
    (27. 7. 2026)
  text: 'Rajchl reaguje na rozhovor „experta na extremismus" z Fakulty sociálních věd Aleše Michala pro
    Český rozhlas: ten kritizoval výroční zprávu o extremismu za to, že nezmiňuje Rajchla (ani další poslance
    vládní koalice) jako šiřitele „xenofobních postojů" a „předsudečné nenávisti" vůči Ukrajincům, a navrhl,
    aby tam byl napříště uveden. Rajchl odmítá, že by rozdmychával nenávist vůči Ukrajincům obecně — trvá
    na tom, že jde jen o reakci na současnou situaci a rozlišuje mezi Ukrajinci, kteří přišli před 24.
    únorem 2022, a těmi po tomto datu. Jako oporu cituje zprávu Institutu pro kriminologii, že Ukrajinci
    ovládli organizovaný zločin v ČR (navazuje na dřívější [NCOZ studii o organizovaném zločinu Ukrajinců,
    5. 5.](migrace.md#ncoz-studie-organizovaný-zločin-v-čr-ovládli-ukrajinci--rajchl-5-5-2026)). Argumentuje,
    že kdyby chtěl rozdmychávat skutečnou nenávist vůči etnické skupině obecně (uvádí příklad Vietnamců
    či Slováků, kteří v ČR slušně žijí a pracují), nikdo by mu nevěřil — napadá experta jako člověka schovávajícího
    se za akademický titul, který by v přímé debatě „dopadl jako sedlák u chlívku".'
  osoby:
  - osoba: ales-michal
    vztah: negativni
    kontext: „Expert na extremismus" (FSV) — v ČRo navrhl zařadit Rajchla do zprávy o extremismu za xenofobii
      vůči Ukrajincům; Rajchl ho označuje za schovávajícího se za akademický titul
  podtema: Nová alternativní média
