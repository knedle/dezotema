  nadpis: 'Zítkovo odvolání: Krajský soud v Ústí n. L. odmítl důkazy jako „nebylo v televizi" (2. 7. 2026)'
  text: 'Zítko líčí dosavadní průběh svého trestního stíhání za „šíření poplašné zprávy" (odsouzen na
    3 roky nepodmíněně): zadržení 10. 10. 2023, evropský zatýkací rozkaz vydaný přesto, že už měl advokáta
    s plnou mocí ho zastupovat, 110 dní vazby, a zásah ozbrojené jednotky 3. 2. 2025 bez následného obvinění.
    K odvolání u Krajského soudu v Ústí nad Labem (rok čekání) nyní dorazila první reakce — podle Zítka
    soud veškeré předložené důkazy (ověřené kopie, místopřísežná prohlášení, přeložený dokument CDC o
    cca 150 tisících úmrtích po očkování v USA k 28. 8. 2021) zařadil do kategorie „dezinformace" s odůvodněním,
    že to nebylo odvysíláno v televizi. Srovnává to s bitcoinovou kauzou (100+ mld. Kč), kde po roce stále
    nepadlo obvinění, a uzavírá, že justice funguje jako „ochranka gaunerů v korporaci".'
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
