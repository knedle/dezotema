  poznamka: 'Jediné zpracované téma: shrnutí Zítkova trestního stíhání (odsouzen 3 roky nepodmíněně za
    „šíření poplašné zprávy") — zadržení 10. 10. 2023, evropský zatýkací rozkaz i přes zplnomocněného
    advokáta, 110 dní vazby, ozbrojený zásah 3. 2. 2025 bez obvinění; první reakce Krajského soudu v Ústí
