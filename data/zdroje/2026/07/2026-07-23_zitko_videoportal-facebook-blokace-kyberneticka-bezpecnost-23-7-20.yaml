- id: zitko-2026-07-23-04
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Zítko: 30denní blokace za citaci zdravotní sestry — „kybernetická bezpečnost" jako záminka
    (22.–23. 7. 2026)'
  text: 'Zítko popisuje, jak byl profil „Pavel Zítko" (přejmenovaný na Československo TV2) 22. 7. 2026
    na 30 dní zablokován Facebookem oficiálně za porušení zásad „kybernetické bezpečnosti" — příspěvkem,
    který sdílel i s 1200 sledujícími po pouhých čtyřech dnech od registrace. Jako důkaz absurdity záminky
    cituje samotný „závadný" příspěvek: citaci zdravotní sestry Kimberly Overton, že covidoví pacienti
    neumírali na virus, ale na nemocniční protokoly. Poukazuje, že tentýž obsah (od jiného mluvčího, Dr.
    Petersona Pierra) sdílel už v roce 2021 bez jakéhokoli postihu — z čehož usuzuje, že skutečným cílem
    bylo omezit dosah kanálu (téměř milion zhlédnutí za 28 dní, nárůst o 782 %), ne řešit bezpečnostní
    hrozbu. Účet dostal navíc omezení: zákaz reklam a živého vysílání do 20. 8. 2026 a odpojení Messengeru.
    Zítko zároveň upozorňuje na existenci padělaného kanálu s ukradenou identitou a shodným počtem sledujících,
    který nevysílá živě. Jako zálohu pro případ úplného zablokování odkazuje na účet na Rumble a texty
    na Substacku.'
  podtema: Blokování na sociálních sítích
