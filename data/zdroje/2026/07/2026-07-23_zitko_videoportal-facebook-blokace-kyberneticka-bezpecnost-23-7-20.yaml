  poznamka: 'Zpracováno 8 témat: (1) 30denní FB blokace za citaci sestry Kimberly Overton pod záminkou
    „kybernetické bezpečnosti" — nová konkrétní kauza — [dsa-cenzura.md](/temata/dsa-cenzura.md). (2)
    Sestra Overton jako nový zdroj k protokolu Remdesivir/ventilátory — [covid-vakciny.md](/temata/covid-vakciny.md).
    (3) Neizolovaný virus / žaloba Werner (1,5 mil. euro) — dosud nezachyceno, doplněno — [covid-vakciny.md](/temata/covid-vakciny.md).
    (4) Šarže vakcín (12 000 na blockchainu) a pokles porodnosti −30 % — opakování beze změny, doplněn
    zdroj — [covid-vakciny.md](/temata/covid-vakciny.md). (5) Kauza bitcoinu — jmenovitě kritizuje vyšetřovatele
    Mazánka a Dragouna (NCOZ/Olomouc) — [kauzy.md](/temata/kauzy.md). (6) 17. listopad 1989 jako inscenace
    StB/KGB — nový „důkaz" (klip Evy Farné) — [konspirace-ceskoslovensko.md](/temata/konspirace-ceskoslovensko.md).
    (7) Volby USA 2020 — Dominion — opakování beze změny — [konspirace.md](/temata/konspirace.md). (8)
    Borelióza jako biologická zbraň (senátor Bennet, RFK ml.) — [nato-zbrojeni-militarizace.md](/temata/nato-zbrojeni-militarizace.md).
    Bez predikcí a stoch. teroru.'
