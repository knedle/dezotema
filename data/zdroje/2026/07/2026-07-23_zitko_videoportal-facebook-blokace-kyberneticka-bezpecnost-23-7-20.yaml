  nadpis: Sametová revoluce jako řízený rozpad StB a KGB
  text: '**23. 7.** — Zítko rozvíjí tezi o „agentu Zifčákovi" novým „důkazem": hudební videoklip Evy Farné
    a Miraje Navrátila (vzniklý dle Zítka 30. 3. 2026, symbolicky na den vzniku „vlajky Československé")
    prý obsahuje skrytou postavu „agenta Šmída" a je „prošpikovaný" indiciemi odkazujícími na inscenaci
    smrti studenta Martina Šmída 17. listopadu 1989 agentem StB Ludvíkem Zifčákem. Zítko klip označuje
    za hodný podrobnějšího samostatného rozboru „po sekvencích".'
- id: zitko-2026-07-23-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Lymeská borelióza jako biologická zbraň — senátor Bennet, Robert F. Kennedy ml. (Zítko, 23.
    7. 2026)
  text: 'Zítko cituje výměnu mezi americkým senátorem Michaelem Bennetem a ministrem zdravotnictví Robertem
    F. Kennedym ml.: senátor se dotazuje, zda je lymeská borelióza uměle vytvořená biologická zbraň, na
    což Kennedy odpovídá. Zítko z toho vyvozuje, že i borelióza a kontaminovaná klíšťata patří mezi uměle
    vytvořené patogeny používané proti lidem — v jedné linii s jeho dlouhodobými tezemi o SARS-CoV-2,
    HIV/AIDS, ptačí chřipce (H5N1), viru Zika a horečce dengue jako patentovaných, tedy uměle vytvořených
    chorobách.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
