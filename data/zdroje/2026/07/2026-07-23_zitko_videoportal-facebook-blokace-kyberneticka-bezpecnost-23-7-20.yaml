- id: zitko-2026-07-23-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Pěti-krokový protokol: jak byli pacienti zabíjeni v nemocnicích'
  text: '**23. 7.** — Zítko cituje jako druhý, nezávislý zdroj téže teze americkou zdravotní sestru (whistleblowerku)
    **Kimberly Overton** z JIP, která v rozhovoru s Petem Santillim tvrdí, že pacienti neumírali na COVID,
    ale na nemocniční protokoly (Remdesivir, ventilátor) — a že totéž pozorovala nejen ve své nemocnici,
    ale i jinde. Zítko zdůrazňuje, že právě sdílení jejího svědectví bylo Facebookem označeno za porušení
    „kybernetické bezpečnosti" (viz [DSA a cenzura](/temata/dsa-cenzura.md#zitko-2026-07-23-04)), zatímco
    identické tvrzení Petersona Pierra z roku 2021 postihu nepodléhalo.'
  osoby:
  - osoba: kimberly-overton
    vztah: pozitivni
    kontext: Americká zdravotní sestra (JIP), whistleblowerka — tvrdí, že covidoví pacienti umírali na
      nemocniční protokoly, ne na virus; kvůli citaci jejího svědectví byl Zítko na FB zablokován
  podtema: Protokol covidových úmrtí — Peterson Pierre
