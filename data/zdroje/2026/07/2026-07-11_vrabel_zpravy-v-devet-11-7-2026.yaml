  nadpis: Nová přísná pravidla pro pálení dřeva na zahrádkách (Vrabel, 11. 7. 2026)
  text: Podle nového výkladu ministerstva už pro legální rozdělání ohně na zahradě nestačí dodržet protipožární
    pravidla a vhodné povětrnostní podmínky — úředníci mají nově posuzovat i samotný účel spalování. Pokud
    je nakládání s dřevním odpadem vyhodnoceno jako „neúčelné", hrozí podle zákona o ochraně ovzduší pokuta
    až 50 000 Kč, podle zákona o odpadech až 1 000 000 Kč fyzické osobě (právnickým osobám až 10 000 000
    Kč). Vrabel to komentuje ironicky jako další příklad narůstající byrokratické šikany běžných lidí.
