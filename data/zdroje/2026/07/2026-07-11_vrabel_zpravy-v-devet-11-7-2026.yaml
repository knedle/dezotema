  nadpis: Novela stavebního zákona umožňuje demolici staveb bez souhlasu majitele (Vrabel, 11. 7. 2026)
  text: 'Poslaneckou sněmovnou prošla novela stavebního zákona, která podle kritiků nahrává developerům
    na úkor běžných vlastníků nemovitostí. Klíčové body: pokud developer nebo stát připravuje projekt
    se statusem „veřejného zájmu" (nová kategorie zón), může podat žádost o demolici cizí stavby (domu,
    chaty) bez souhlasu jejího majitele; současně novela dává stavebním úřadům možnost zpětně zlegalizovat
    černé stavby, pokud by jejich odstranění bylo vyhodnoceno jako nepřiměřený zásah. Vrabel to komentuje
    jako vyslaný signál, že „porušovat zákon se může vyplatit", a spojuje schválení s korupčním prostředím
    na úrovni obcí a krajů — developerské firmy dlouhodobě napojené na ODS a ČSSD (jmenuje podnikatele
    Tomáše Jadličku, „miliardy ve veřejných zakázkách") podle něj profitují z vazeb na poslance, kteří
    vzešli z „vlasteneckých projektů" zakládaných okolím Václava Klause mladšího — naznačuje, že schválení
    zákona může být formou splácení předvolební podpory.'
- id: vrabel-2026-07-11-04
