  poznamka: 'Zpracováno 12 témat: (1) Novela stavebního zákona umožňuje demolici bez souhlasu majitele,
    korupce developerů — [kauzy.md](kauzy.md). (2) Nová přísná pravidla pro pálení dřeva na zahrádkách
    — [kauzy.md](kauzy.md). (3) Trump vyhrožuje Íránu 1000 raketami — [blizky-vychod.md](blizky-vychod.md).
    (4) USA schvalují nové sankce proti Rusku (Graham) — [valka-nato-rusko.md](valka-nato-rusko.md). (5)
    Ukrajina eskaluje — nové velitelství, licence na Patrioty — [valka-nato-rusko.md](valka-nato-rusko.md).
    (6) Rusko přerušilo vodní cestu Don–Azovské moře, riziko hladomoru — [valka-nato-rusko.md](valka-nato-rusko.md).
    (7) Čína představila mikrovlnnou zbraň proti dronům — [valka-nato-rusko.md](valka-nato-rusko.md).
    (8) ⚡ Vrabel nesouhlasí s Contem — Rusko je nebezpečné, možný preventivní úder — [valka-nato-rusko.md](valka-nato-rusko.md).
    (9) Inflace jako nástroj okrádání o úspory (rozšíření teze) — [ceny-energie.md](ceny-energie.md).
    (10) Zpochybnění genocidy ve Srebrenici — [valka-nato-rusko.md](valka-nato-rusko.md). (11) Budanov:
    Ukrajina „kolébka pravoslaví" — Vrabel rozporuje — [valka-nato-rusko.md](valka-nato-rusko.md). (12)
    ČEZ — 191 mil. Kč na odměnách vedení — [kauzy.md](kauzy.md). Stoch. teror: opakované a vygradované
    přání zavraždění Trumpa — [stochasticky-teror.md](stochasticky-teror.md).'
