  nadpis: 'Trump: opakovaná ultimáta Íránu a podezření z manipulace cen ropy (Vrabel, 11. 6. 2026)'
  text: '**11. 7.** — Trump na síti Truth Social pohrozil Íránu „tisíci raket" a zcela zničit celou zemi,
    pokud by došlo k pokusu o atentát na jeho osobu (izraelské tajné služby měly Washington varovat před
    íránskou hrozbou). Vrabel na to reaguje mimořádně ostře: připomíná, že Trump sám zahájil zabíjením
    íránského duchovního vůdce Chameneího (za kterého truchlily desítky milionů lidí) i útokem na dětský
    internát, a uplatňuje princip „oko za oko" — otevřeně přeje Íránu, aby se mu podařilo Trumpa zabít,
    a označuje ho za „absolutní zlo" a největšího „gangstera" na světě, srovnatelného s padouchem z filmů
    o Jamesi Bondovi. Vyzývá, aby se „celý svět spojil" a USA embargem/sankcemi/společnou armádní akcí
    obklíčil a zastavil coby „světového nepřítele číslo jedna" (viz i [stochasticky-teror.md](stochasticky-teror.md)).'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-11-02
