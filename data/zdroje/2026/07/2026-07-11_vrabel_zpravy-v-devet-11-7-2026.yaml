  nadpis: Ukrajina eskaluje — nové velitelství pro útoky na Rusko, licence na výrobu Patriotů (Vrabel,
    11. 7. 2026)
  text: Zelenskyj oznámil zřízení nového specializovaného velitelství pro dalekonosné útoky na Ruskou
    federaci a vznik spojených sil rychlé reakce (útočné jednotky, drony, dělostřelectvo) pod velením
    brigádního generála Dmitrije Vološina. Zároveň Zelenskyj uvedl, že Ukrajina patří mezi tři země světa
    technologicky schopné vyrábět systémy Patriot, a Trump přislíbil Ukrajině licenci k jejich výrobě
    (podle všech zdrojů spíš verze PAC-2) — reálně se výroba pravděpodobně přesune do Německa, protože
    samotná výrobní kapacita je pro Rusko snadno viditelná ze satelitů a stala by se okamžitým cílem raket
    (Kinžal, Iskander, Orešnik) stejně jako plánované velitelství pro dalekonosné útoky.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-11-08
