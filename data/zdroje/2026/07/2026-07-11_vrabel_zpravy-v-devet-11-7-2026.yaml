  nadpis: USA schvalují nové sankce proti Rusku (Lindsey Graham) — konec éry mírových jednání (Vrabel,
    11. 7. 2026)
  text: 'Čtyři američtí senátoři v čele s republikánem Lindseym Grahamem oznámili, že se s Donaldem Trumpem
    dohodli na podpoře nového balíku sankcí proti Rusku i zemím obchodujícím s Moskvou — legislativa má
    jít brzy k hlasování v Kongresu. Vrabel to čte jako potvrzení trendu posledních týdnů (summit G7,
    summit NATO v Ankaře, rozmístění systému Palantir u ruských hranic — viz výše): éra jednání „z Aljašky"
    definitivně skončila a USA se vrací k tvrdé konfrontaci s Ruskem. Zdůrazňuje ironii, že Graham byl
    už za vlády Joe Bidena jedním z nejagresivnějších zastánců vyzbrojování Ukrajiny a Trump s ním byl
    v kampani ostře v rozporu — přesto dnes spolu vyhlašují sankce společně.'
  podtema: Zahraniční aktéři a precedenty
