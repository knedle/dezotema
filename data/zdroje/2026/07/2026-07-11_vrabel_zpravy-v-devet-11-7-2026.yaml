  nadpis: 'ČEZ: vedení si rozdělilo 191 mil. Kč na odměnách (Vrabel, 11. 7. 2026)'
  text: 'Vrabel doplňuje dřívější kritiku ČEZ (viz [Babiš a rozprodej ČEZ](#babiš-a-rozprodej-čez-rozkradená-republika-vrabel-4-6-2026))
    o nový detail: vedení společnosti si podle diváckého upozornění rozdělilo na odměnách celkem 191 mil.
    Kč. Připomíná, že nad ČEZ dozoruje syn Václava Klause (otec současného ministra zahraničí Petra Macinky),
    a peníze označuje za pocházející přímo z předražených plateb občanů za elektřinu.'
- id: vrabel-2026-07-11-06
  typ: tvrzeni
