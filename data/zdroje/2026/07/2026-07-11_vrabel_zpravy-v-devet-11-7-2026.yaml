  nadpis: Inflace jako okrádání; držet hotovost je „sebemrzačení" (Vrabel, 12. 6. 2026)
  text: '**11. 7.** — Vrabel opakuje a rozšiřuje tutéž tezi v kontextu výroku Ursuly von der Leyenové,
    že rozpočtu EU chybí 40 % — pokud se nenajdou „vlastní zdroje", zaplatí to členské státy buď přímo
    (daně), nebo nepřímo přes inflaci, která systematicky přesouvá rodinné úspory (nemovitosti, vklady,
    firmy) směrem k vrcholu „pyramidy moci". Doporučuje divákům dopředu přemýšlet, jak si ochránit majetek,
    protože peníze ztrácí hodnotu.'
  podtema: Energetika a Rusko
- id: vrabel-2026-07-11-03
