  nadpis: Europoslanci schválili „zákon o šmírování lidí" pod záminkou boje proti dětské pedofilii (Boldy,
    9. 7. 2026)
  text: Boldy sarkasticky komentuje schválení zákona Evropským parlamentem, který má oficiálně bojovat
    proti dětské pedofilii, ale podle něj ve skutečnosti slouží k plošnému sledování občanů. Srovnává
    to s dlouhodobým odposloucháváním ze strany americké Národní bezpečnostní agentury (NSA), které trvá
    už přes 20 let, a interpretuje krok EU jako další nástroj větší kontroly populace pod hlavičkou digitalizace
    a bezpečnosti.
