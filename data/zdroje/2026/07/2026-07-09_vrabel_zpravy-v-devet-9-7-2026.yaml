  nadpis: Globální vzorec perzekuce kritiků globalistické agendy (Vrabel, 9. 7. 2026)
  text: 'K zadržení producenta Russia Today Jamese Scotta v Londýně (2,5 hodiny vyslýchán podle protiteroristické
    legislativy, zabaveno elektronické zařízení, aniž byl z čehokoliv obviněn) Vrabel rozšiřuje seznam
    podobných případů pronásledování lidí kritických k „globalistické agendě" po celém světě: Scott Ritter
    (bývalý zbrojní inspektor OSN, nátlak na jeho ruskou manželku, aby ho udala jako ruského agenta),
    Petr Bystroň (poslanec Evropského parlamentu za AfD — sedm domovních prohlídek na základě obvinění
    z napojení na „ruského vlivového agenta", stejná technika, jakou se dle Vrabela pokusili použít i
    na něj samotného v Bělehradě), Julian Assange, Russell Brand (obviněn z několika znásilnění), Reiner
    Füllmich (stále ve vězení v Německu) a Tomáš Čermák (stále ve vězení v ČR). Vrabel to shrnuje jako
    systém, kdy elitářská vláda „oligarchů" a miliardářů (Trump, Babiš a další) pracujících pro nadnárodní
    bankovní/finanční zájmy potřebuje umlčet skutečnou opozici — nejprve skrze policii, státní zástupce
    a vykonstruované soudní procesy, v krajním případě vězením nebo zabíjením.'
  podtema: Politická perzekuce
- id: vrabel-2026-07-09-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Maďarský influencer zadržen za výrok na podporu Orbána — právo na odpor (Vrabel, 9. 7. 2026)
  text: Maďarský tvůrce obsahu Ištvan Šakáč byl 8. 7. zadržen po domovní prohlídce (sedm policistů) poté,
    co na Facebooku napsal, že pokud by byl Viktor Orbán nezákonně „odveden" (zatčen), nenechají to bez
    odezvy. Vrabel jeho výrok obhajuje s odkazem na institut práva na odpor zakotvený v článku 23 Listiny
    základních práv a svobod ČR — pokud by šlo o nezákonný zákrok proti dlouholetému premiérovi, je podle
    něj legitimní, aby se jeho příznivci postavili na odpor. Srovnává to s vlastní výzvou k odporu na
    Václavském náměstí v roce 2022 a řadí zadržení Šakáče do stejné kategorie jako pronásledování britského
    aktivisty „Tommyho Robinsona" — jako součást vzorce popsaného výše.
  podtema: Politická perzekuce
- id: vrabel-2026-07-09-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Potyčky ve Lvově s náboráři — Vrabel schvaluje odpor proti mobilizaci (9. 7. 2026)
  text: Ve Lvově došlo k potyčkám mezi obyvateli a pracovníky ukrajinských náborových center poté, co
    se náboráři pokusili zadržet mladého muže. Vrabel to interpretuje jako důkaz, že se Zelenského režim
    „rozpadá" kvůli nedostatku vojáků na frontě — připomíná i nedávné vyjádření bývalého velitele Valerije
    Zalužného, že Ukrajina navzdory tvrzením o vítězství ve skutečnosti nevítězí. Odpor obyvatel vůči
    násilnému odvádění (dle některých odhadů Ukrajina ztratila přes 2,5 milionu lidí) jednoznačně schvaluje
    jako legitimní postavení se za vlastní práva proti „jednomu procentu mocných", i když lituje, že to
    lidem došlo tak pozdě.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-07-09-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Německo kupuje rakety Tomahawk — „obranná" zbraň, která je ve skutečnosti útočná (Vrabel, 9.
    7. 2026)
  text: 'Německý kancléř Friedrich Merz na okraji setkání v Ankaře oznámil dohodu s USA o nákupu a rozmístění
    řízených střel Tomahawk, s odůvodněním, že tím Německo „odstraňuje důležitou strategickou mezeru v
    obraně". Vrabel toto označení odmítá: Tomahawk je podle něj čistě útočná zbraň určená k likvidaci
    cílů na cizím území, nikoli k obraně vlastního — na rozdíl třeba od systému Patriot, kterým lze střely
    sestřelovat. Řadí ji do stejné kategorie jako jaderné zbraně na palubě francouzských Rafale (rakety
    ASMP) nebo amerických F-35 (klouzavé bomby B61), které mu chce dodat Andrej Babiš — jaderné zbraně
    podle něj nelze použít k obraně vlastního území, aniž by si stát sám kontaminoval vlastní půdu radioaktivitou,
    takže jejich jediný smysl je útok na nepřítele. Dokládá to osobní vzpomínkou manželky (Srbka) na bombardování
    Jugoslávie NATO v roce 1999 (78 dní, Tomahawky letící „pomalu" a nepředvídatelně, Srbové chránící
    mosty improvizovanými večírky) jako příklad toho, že NATO — navzdory své sebeprezentaci jako obranné
    aliance — už jednou útočilo na cizí, neagresivní zemi a dodnes drží vojska v Kosovu. Podobně odmítá
    rámování chystaného „jaderného deštníku" (možná dohodnutého na příštím jednání „koalice ochotných"
    v Paříži) jako obranného nástroje — jde podle něj o umístění útočných jaderných zbraní, ne o štít.'
  osoby:
  - osoba: friedrich-merz
    vztah: negativni
    kontext: 'Prezentuje nákup raket Tomahawk jako „obranu" — Vrabel: jde o čistě útočnou zbraň, zavádějící
      rétorika'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-07-09-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Vláda hodnotí 6 měsíců — neplněné klíčové sliby, PURL nakonec ČR stejně zaplatí (Vrabel, 9.
    7. 2026)
  text: |-
    K vládnímu hodnocení prvního půl roku (Babiš: splněno/rozpracováno 978 z celkových úkolů programu, jako úspěchy uvádí nízkou inflaci a ceny energie) Vrabel namítá, že podstatné není plnění procent programu, ale klíčových předvolebních slibů — a ty podle něj plněny nejsou: snížení věku odchodu do důchodu (vláda to svaluje na EU), konec zelené politiky (motoristé nyní prosazují umístění 500 větrníků do ČR, protože to chce EU) a zastavení plateb na zbraně Ukrajině. K poslednímu bodu počítá konkrétní dopad: Babiš v prosinci na summitu EU odsouhlasil 90 mld. eur pro Ukrajinu (z toho 60 mld. na zbraně) — ČR sice za půjčku neručí (na rozdíl od ostatních členských států), ale to je podle Vrabela horší, protože to znamená, že ČR ji platí přímo přes příspěvky do rozpočtu EU bez ohledu na to, zda EU zkrachuje. Jen úrok (cca 32 %) z českého podílu vychází na řádově miliardu korun ročně, což při odhadované 15leté splatnosti dělá zhruba 45 miliard Kč — proto označuje Babišovo tvrzení, že ČR neposílá peníze na zbraně, za „čistou lež". Podobně kritizuje ministra zahraničí Petra Macinku za cestu do Německa k výročí konce 2. světové války („líbat nohy Němcům") a oznámení příspěvku do programu PURL (viz výše).

    Ministr obrany Jaromír Zuna (SPD) k příspěvku do PURL uvedl, že nejde o porušení koaliční smlouvy, přiznal však, že o něm předem nevěděl. Vrabel namítá, že nejde o formální porušení smlouvy, ale o porušení předvolebních slibů SPD — strana slibovala zrušení letadel F-35 i české muniční iniciativy, a nakonec dělá pravý opak (Zuna letadla F-35 naopak označil za „skvělou volbu pro ČR").
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: Hodnocení 6 měsíců vlády — tvrzení o neplacení zbraní Ukrajině označeno za „čistou lež" (ČR
      platí ~45 mld. přes rozpočet EU)
  - osoba: petr-macinka
    vztah: negativni
    kontext: Cesta do Německa „líbat nohy Němcům"; oznámil příspěvek do PURL; kritizován za podřízenost
      vůči USA v otázce Grónska
  - osoba: jaromir-zuna
    vztah: negativni
    kontext: Obhajuje příspěvek do PURL jako neporušující koaliční smlouvu, ač SPD slibovalo zrušení F-35
      a muniční iniciativy — nyní F-35 označuje za „skvělou volbu"
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-09-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Bývalý polský poslanec posílá humanitární pomoc ruským vojákům (Vrabel, 9. 7. 2026)
  text: Bývalý polský poslanec Krzysztof Tołwiński zakoupil léky a zdravotnický materiál pro příslušníky
    ruské armády, čímž chtěl vyjádřit nesouhlas se zahraniční politikou polské vlády vůči Rusku, a nabídl
    další pomoc, pokud by ji ruští vojáci potřebovali. Vrabel jeho krok schvaluje a odmítá, že by šlo
    o kolaboraci či zradu — v situaci, kdy je podle něj „99 % společnosti zfanatizováno" protiruskou náladou,
    vidí v takovém gestu jen vyvážení extrémní protiruské fóbie, ne podporu Ruska jako takového. Srovnává
    to s vlastní organizací demonstrace za urovnání vztahů s Ruskou federací v roce 2024 — cílem není
    práce pro Rusko, ale snaha o normální diplomatické vztahy ČR se všemi zeměmi světa.
  osoby:
  - osoba: krzysztof-to-winski
    vztah: pozitivni
    kontext: Bývalý polský poslanec — posílá humanitární pomoc ruským vojákům, Vrabel to schvaluje jako
      vyvážení protiruské hysterie
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-09-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Solovjov: „boj proti zkorumpovanému satanistickému Západu" — Vrabel souhlasí (9. 7. 2026)'
  text: 'Ruský moderátor Vladimír Solovjov ve svém pořadu prezentoval pohled Kremlu na válku na Ukrajině:
    Rusko podle něj vede boj proti zkorumpovanému Západu a ruský voják představuje obránce tradičních
    hodnot. Vrabel s tímto výkladem souhlasí a rozvíjí ho vlastní tezí, kterou prý zastává od roku 2022:
    politický systém na Západě je „pokřivený", politici pracují pro peníze, ne pro lidi, a jejich nenasytnost
    je nakonec žene k podpoře zbrojního průmyslu (kde se točí „stovky miliard") a k prosazování válek,
    aby peníze dál přitékaly. Popisuje Západ jako „totálně morálně v troskách" — občané zemí jsou zadluženi,
    majetek byl rozprodán globalistům, malé podniky zlikvidovány ve prospěch nadnárodních firem neplatících
    daně, a evropský průmysl se přeorientovává na neustálou výrobu a ničení zbraní. Uzavírá, že současný
    konflikt je skutečně bojem proti „zlu, které rozkvetlo na Západě".'
  osoby:
  - osoba: vladimir-solovjov
    vztah: pozitivni
    kontext: Ruský moderátor — jeho výklad boje proti „zkorumpovanému satanistickému Západu" Vrabel podepisuje
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-09-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Trump a Grónsko — dvojí metr mezinárodního práva (9. 7. 2026)
  text: 'Donald Trump prohlásil, že další přítomnost amerických vojsk v Evropě bude záviset na tom, zda
    se USA podaří uzavřít „dobrou dohodu" ohledně Grónska a zda evropští spojenci poskytnou skutečnou
    podporu USA v Íránu — s odůvodněním, že získání Grónska je potřebné „pro bezpečnost světa", nikoli
    přímo USA. Vrabel na tom ukazuje dvojí metr mezinárodní politiky: Trump si nárokuje cizí území (Grónsko,
    dříve Venezuela, Kuba) bez ohledu na chartu OSN, územní celistvost či mezinárodní právo — sám prohlásil,
    že jedinou hranicí je pro něj „jeho svědomí" — a svět na to jen přihlíží. Kritizuje reakci české a
    evropské diplomacie (konkrétně ministra Macinku) jako podřízenou vůči USA — Evropa podle něj po „diverzifikaci"
    od ruských energií skončila v závislosti na dražších amerických dodávkách a nyní i na vynuceném dovozu
    geneticky modifikovaných potravin výměnou za energie, což označuje za pokračování koloniálního vztahu
    USA k Evropě od roku 1974.'
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: 'Nárokuje si Grónsko bez ohledu na mezinárodní právo („jediná hranice je moje svědomí") —
      Vrabel: „vůbec bych se nedivil, kdyby ho někdo zavraždil" (→ [stoch. teror](../stochasticky-teror.md))'
  dalsi_zdroje:
  - 2026-09-22_vrabel_zpravy-v-devet-22-9-2026
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-09-13
