  nadpis: Havárie vrtulníku „Oliver 3" jako vražda, ne nehoda (Boldy, 7. 7. 2026)
  text: 'K havárii dvou vrtulníků v Brazílii, při níž zemřel zpěvák (Boldym označovaný jako „Oliver 3"),
    Boldy tvrdí, že jeden z vrtulníků byl řízen na dálku — podobně jako už dříve sestřelené letadlo nad
    řekou (rovněž s vědci na palubě). Motivem vraždy mělo být to, že zpěvák byl „zasvěcený" (v klipu má
    prý znak oka), ale začal mluvit o tématech, která podle Boldyho odhalují skutečné fungování světa:
    viděl na Antarktidě „ledovou zeď", mluvil o fungování Hollywoodu a o tom, že materiální hodnoty jsou
    zbytečné — tedy o věcech, o kterých dlouhodobě mluví „konspirátoři". Boldy to interpretuje jako potvrzení
    vlastních tezí, že svět, který lidem ukazují, je jen „zlaté pozlátko".'
  podtema: Elity a plánování dezinformací skrze popkulturu
