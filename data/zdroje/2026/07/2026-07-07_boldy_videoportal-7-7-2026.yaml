  nadpis: '''Ndrangheta ovládá evropské podsvětí (Boldy, 7. 7. 2026)'
  text: Boldy doporučuje dokument o italské mafii 'Ndrangheta a tvrdí, že jde o nejmocnější mafii světa,
    figurující s kokainem v 84 zemích (z 80 %), což je podle něj potvrzeno i německým vyšetřováním. Podle
    Boldyho 'Ndrangheta ovládá evropské podsvětí včetně Německa a České republiky. Zmiňuje slovenského
    novináře (patrně Jána Kuciaka), který o působení mafie na Slovensku psal knihu.
  podtema: Organizovaný zločin a mafie
