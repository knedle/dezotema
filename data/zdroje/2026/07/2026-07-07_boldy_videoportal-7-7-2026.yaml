  nadpis: 'Boldy: 13 vědců zavražděno po odkrytí volné energie (24. 5. 2026)'
  text: '**7. 7.** — Boldy doplňuje konkrétní příklad: vědkyně Amy Eskridge, která zkoumala volnou energii
