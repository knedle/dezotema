  nadpis: Světu vládne Satan — společný kult za všemi náboženstvími a vládami; angličtina jako „čarodějnický
    jazyk" (Boldy, 7. 7. 2026)
  text: Boldy tvrdí, že světu nevládne Bůh, ale Satan — argumentuje tím, že napříč různými náboženstvími
    se všechny politické strany a vlády světa scházejí u jednoho společného kultu, který spojuje se jmény
    „Saturn", „Satan" a „Black Cube". Tuto tezi propojuje s tvrzením, že angličtina je „čarodějnický jazyk"
    — jeho celosvětová dominance má podle něj souviset právě s touto vládou Saturna/Satana.
