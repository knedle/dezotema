  nadpis: Oganesianův gang — krádeže a poškozování registračních značek (Zítko, 28. 7. 2026)
  text: Zítko sdílí a komentuje video, kde se Vojtěch Přenák (dle Zítka člen „Oganesianova gengu") sám
    natočil, jak vrtačkou rozvrtal dopravní registrační značku — k tomu dodává, že tatáž skupina (spolu
    s „Blujovou" a dalším členem přezdívaným „Buštipan") se dlouhodobě vyznačuje přelepováním a krádežemi
    registračních značek, mj. u poslankyně Kateřiny Konečné, senátora Vydláka a dalších lidí v obcích
    Kurdějov a Soběšovice — což podle Zítka naplňuje skutkovou podstatu až tří paragrafů trestního zákoníku.
    Kritizuje, že si Přenák dřív na sociálních sítích „hrdinsky" dovolával ochrany ministra vnitra Rakušana,
    ačkoli ten už ve funkci není (nahradil ho Metnar) — a spekuluje, že pod novým vedením ministerstva
    nemusí být trestní stíhání tak shovívavé jako dřív.
- id: zitko-2026-07-28-03
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: „20 pravidel přežití v systému" — konspirační heuristika (Zítko, 28. 7. 2026)
  text: 'Zítko přednáší (jako „opakovačku z covid logiky", verze 2026) dvacetibodový seznam obecných pravidel
    pro rozpoznávání manipulace „systémem": co je oficiálně prohlašováno za bezpečné a účinné, je ve skutečnosti
    nebezpečné pro občana a výhodné jen pro toho, kdo na tom vydělává; výzva „důvěřuj vědě" znamená „nepokládej
    otázky"; shoda všech odborníků signalizuje, že jsou placeni ze společného zdroje; cokoli je oficiálně
    nazváno „dezinformací", je téměř jistě pravda; agresivní veřejné zesměšňování tématu znamená, že ohrožuje
    základy systému; politik-miliardář nikdy nejedná pro dobro lidí, ale pro posílení vlastní moci; a
    pokud je řešením problému více kontroly a méně svobody, byl problém vytvořen záměrně. Na tuto heuristiku
    napojuje konkrétní aplikaci: Československo nikdy nebylo členem EU ani NATO (viz [Rozdělení Československa
    jako vlastizrada](/temata/konspirace-ceskoslovensko.md)), zákaz kouření v restauracích byl „testem
    poslušnosti" a Green Deal (emisní povolenky, štítky na domy) je dalším uměle vytvořeným problémem
    k ospravedlnění další kontroly.'
  podtema: Náboženský a okultní výklad moci
- id: zitko-2026-07-28-04
  typ: tvrzeni
