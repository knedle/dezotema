    jako nástroj indoktrinace (Rockefeller, Agenda 2030) — [konspirace.md](/temata/konspirace.md). (5)
    údajná písemná odpověď Kanceláře prezidenta o neplatnosti vlády k 1. 1. 1993 — [konspirace-ceskoslovensko.md](/temata/konspirace-ceskoslovensko.md).
    Opakování beze změny (jen zdroj, bez rozšíření): Deník N financovaný miliardáři, Bitcoin kauza (100+
