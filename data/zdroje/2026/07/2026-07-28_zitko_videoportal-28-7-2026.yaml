- id: zitko-2026-07-28-01
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Piloti a vakcíny: „třetí pilot maskovaný za stevarda" (Zítko, 28. 7. 2026)'
  text: Zítko tvrdí (s odvoláním na informaci „od pilota") a na spis uložený u okresního soudu v Chomutově
    (kauza, v níž byl obžalován za šíření poplašné zprávy), že po zavedení covidových vakcín docházelo
    u pilotů k opakovaným kolapsům ve vysoké letové hladině — s odkazem na dokument CDC z 28. 8. 2021
    dokládající zaznamenané případy pilotů British Airways. Letecké společnosti na to podle něj zareagovaly
    zavedením „třetího pilota" fakticky maskovaného za stevarda — pracovníka schopného pilotovat v případě,
    že by oba řádní piloti kolabovali současně —, přičemž odbory měly spor o to, aby byl tento záložní
    pilot placen jako pilot, ne jako stevard. Soudkyně Iva Dvořáková, která jeho případ rozhodovala, celý
    tento spis podle Zítka bez dalšího zkoumání označila za dezinformaci.
- id: zitko-2026-07-28-02
  typ: tvrzeni
  temata:
