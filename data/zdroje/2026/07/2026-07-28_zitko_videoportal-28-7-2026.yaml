  nadpis: Školství jako nástroj indoktrinace — Rockefeller, Agenda 2030 (Zítko, 28. 7. 2026)
  text: 'Zítko kritizuje současný vzdělávací systém: děti stráví 15 let života uvnitř instituce, sedí
    v lavicích pod umělým osvětlením, jedí průmyslově zpracované jídlo a učí se nazpaměť fakta, která
    nikdy nepoužijí, přičemž jsou trestány za samostatné myšlení místo pokládání otázek. Tvrdí, že se
    na principu poslušnosti („držet hubu a krok") nic nezměnilo od reforem Marie Terezie a Josefa II.
    — tehdy šlo o výchovu vojáků a kněží, dnes o výchovu „ne příliš chytrých dělníků, aby byli schopni
    odporu", což připisuje záměru Johna D. Rockefellera. Do stejné linie řadí Agendu 2030 a koncept „patnáctiminutových
    měst", které mají dle něj vytvořit „digitální koncentrák", a dodává, že inkluze a další školská nařízení
    současný stav ještě zhoršují.'
  podtema: Náboženský a okultní výklad moci
- id: zitko-2026-07-28-05
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Údajná písemná odpověď Kanceláře prezidenta republiky potvrzuje neplatnost vlády k 1. 1. 1993
    (Zítko, 28. 7. 2026)
  text: 'Zítko k dosavadní argumentaci (viz výše) doplňuje nový důkaz: podle něj obdržel oficiální písemnou
    odpověď přímo z Kanceláře prezidenta republiky, která potvrzuje, že vláda České republiky nebyla k
    1. 1. 1993 nikdy formálně jmenována — protože v té době neexistoval platně zvolený prezident, který
    by jmenování mohl provést (Havel skončil v úřadu 20. července 1992, znovu zvolen až 2. února 1993).'
