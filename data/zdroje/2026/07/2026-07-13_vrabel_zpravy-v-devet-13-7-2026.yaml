vyroky:
- id: vrabel-2026-07-13-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: USA obnovují „blokádu" Hormuzu — 20% poplatek z hodnoty přepravovaného nákladu (Vrabel, 13.
    7. 2026)
  text: Donald Trump oznámil, že USA obnovují kontrolu nad Hormuzským průlivem a budou od proplouvajících
    lodí vybírat poplatek ve výši 20 % hodnoty přepravovaného nákladu za „zajištění bezpečnosti" trasy,
    kterou prochází pětina světových dodávek ropy a plynu. Vrabel to ironizuje jako „mýtné" srovnatelné
    s DPH a přirovnává k tomu, že by si kdokoli mohl analogicky začít vybírat poplatky na jakémkoliv strategickém
    úseku silnice — poukazuje na absurditu toho, že USA takto zpoplatňují cizí mezinárodní vodní cestu.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-13-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Rubio ovládá výnosy z venezuelské ropy přes loutkovou prezidentku — „americký Macinka" (Vrabel,
    13. 7. 2026)
  text: 'Podle deníku New York Times americký ministr zahraničí Marco Rubio rozhoduje o rozdělování výnosů
    z venezuelského vývozu ropy, které nejprve inkasuje Washington a teprve poté „dle vlastního uvážení"
    uvolňuje venezuelské vládě — je v pravidelném kontaktu s prozatímní prezidentkou Rodríguezovou. Vrabel
    to popisuje jako čistě mafiánský model: srovnává ho s únosem venezuelského prezidenta (uvězněného
    v USA, viz [dřívější zápis o Madurovi](#nepsaná-pravidla-mezi-hlavami-států--usa-varovaly-írán-před-dalším-atentátem-kontrast-s-venezuelou-vrabel-3-7-2026))
    a dosazením loutky, která plní pokyny „amerického jednatele" — Rubia označuje za „amerického Macinku".'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-13-03
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Írán hrozí válkou zemím podporujícím USA vojensky — plán ČR poslat radary do Hormuzu; Macinka
    v Izraeli (Vrabel, 13. 7. 2026)
  text: Teherán varoval, že jakoukoli logistickou či vojenskou pomoc americkým silám bude považovat za
    přímé zapojení do války proti Íránu. Vrabel na to upozorňuje v souvislosti s tím, že ČR se údajně
    chystá vyslat do oblasti Hormuzu vlastní radary — z íránského pohledu by se tak ČR mohla stát legitimním
    cílem. Zmiňuje také, že ministr zahraničí Petr Macinka odcestoval na dvoudenní návštěvu Izraele s
    doprovodem 30 českých podnikatelů, a připomíná, že česká vláda předem oznámila, že bude vetovat jakoukoli
    případnou rezoluci EU proti Izraeli — řadí to k důkazům jednostranné proamerické a proizraelské orientace
    české zahraniční politiky.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-13-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Evropská komise se reformuje — unijní úředníci přímo v hlavních městech členských zemí (Vrabel,
    13. 7. 2026)
  text: 'Evropská komise zvažuje první komplexní reformu svého fungování za posledních 20 let: větší využití
    umělé inteligence, rychlejší nábor zaměstnanců a možnost vysílat unijní úředníky přímo do hlavních
    měst členských států — konečná doporučení má do konce roku 2026 předložit Ursula von der Leyenová.
    Vrabel to komentuje jako další krok k tomu, že EU „krok po kroku" nahrazuje státní správu jednotlivých
    zemí vlastní širší byrokratickou sítí přímo v jejich hlavních městech, zatímco vlády (Babiš odmítající
    referendum o vystoupení z EU) proces mlčky přihlížejí. Předjímá, že výsledkem bude postupné rozpuštění
    ČR jako svébytného státu — se zachováním jen formálního označení „Česko" na značkách.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-13-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Maďarsko: ústavní většina TISZA odvolává prezidenta Šujoka (Vrabel, 13. 7. 2026)'
  text: Maďarský parlament schválil sedmnáctý dodatek ústavy ukončující mandát prezidenta Tamáše Šujoka
    (139 pro, 6 proti, poslanci Fideszu hlasování bojkotovali) — premiér Peter Magyar obvinil opozici
    (Fidesz) z pokusu ovládnout prezidentský úřad, zatímco vládní TISZA po volbách disponuje ústavní většinou
    umožňující měnit základní zákon. Vrabel to označuje za nedemokratický precedens srovnatelný s modely
    nacistického Německa nebo Stalinovým stylem vlády — na svém žebříčku „nejhorších politických podvodníků
    světa" řadí Petera Magyara na čtvrté místo (za Zelenským, Trumpem a „Reichelem", jeho posměšnou přezdívkou
    pro Jindřicha Rajchla).
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-13-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Vláda připravuje legislativu pro přechod na „válečnou nebo obrannou ekonomiku" (Vrabel, 13.
    7. 2026)
  text: 'Vláda podle Vrabela úkolovala ministerstva vnitra a obrany připravit do 12 měsíců návrhy legislativních
    změn krizového řízení — ministr obrany Jaromír Zuna zdůvodnil to zastaralostí předpisů z 90. let a
    potřebou reagovat na „nové technologie a charakter rizik". Vrabel čte formulaci doslovně: dokument
    má „zlepšit řízení přechodu státu na válečnou nebo obrannou ekonomiku" — což podle něj znamená, že
    vláda nepřímo přiznává přípravu na válku, ovšem s horizontem déle než rok. Propojuje to s výrokem
    generálního tajemníka NATO Marka Rutteho o nutné „revoluci průmyslu" a s programy Rearm Europe a SAFE
    (viz výše) — jde podle něj o dlouhodobě plánovanou proměnu celého ekonomického modelu Evropy, ne jen
    o urychlení výroby zbraní.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-13-07
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Nová vojenská biolaboratoř v Orlických horách — spojenecký systém NATO (Vrabel, 13. 7. 2026)
  text: Armáda ČR (Vojenský zdravotní ústav) chystá zásadní rekonstrukci vojenského výzkumného a nemocničního
    komplexu v Orlických horách s laboratořemi nejvyššího stupně biologického zabezpečení — objekt slouží
    k biologické ochraně státu i jako součást „spojeneckého systému v rámci NATO". Vrabel to komentuje
    sarkasticky s odkazem na svá dřívější tvrzení o amerických biolaboratořích na Ukrajině (Ebola, mor,
    virus Marburg) — vyjadřuje pochybnost, zda podobný objekt v ČR neřídí ve skutečnosti Američané, a
    žertuje, že doufá, že při rekonstrukci „neunikne nějaký virus".
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-13-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Údajná otrava Lindseyho Grahama Ruskem — zemřel 24 hodin po návštěvě Kyjeva (Vrabel, 13. 7.
    2026)
  text: 'Vrabel rozvíjí včerejší zprávu o smrti senátora Lindseyho Grahama: upozorňuje, že Graham zemřel
    na „zástavu srdce" doslova do 24 hodin poté, co se v Kyjevě fotil se Zelenským u sestřeleného ruského
    dronu, přičemž na fotkách vypadal zdravě — spekuluje, že mohl být otráven nebo jinak „vypnut" Ruskem.
    Dodává otázku, kdo bude další, a poukazuje na nesoulad: pokud by naopak Írán zabil Trumpa, byl by
    to podle mezinárodního práva a rétoriky Západu terorismus, zatímco smrt Grahama (podle jeho spekulace
    ruskou rukou) nikdo takto nerámuje.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-13-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Nová francouzská koalice pro obranu proti balistickým střelám — ČR nepodepsala (Vrabel, 13.
    7. 2026)
  text: Ve Francii vznikla nová mezinárodní koalice pro integrovanou obranu proti balistickým střelám
    (mj. Německo, Británie, Švédsko, Itálie) — Česká republika se k ní podle oficiálních zpráv zatím nepřipojila
    a nic nepodepsala. Vrabel to hodnotí pozitivně a vyzývá k udržení tlaku na vládu Andreje Babiše, aby
    smlouvu nepodepsala — spojuje to se svou avizovanou zářijovou demonstrací proti umístění jaderných/protiraketových
    systémů na území ČR (viz [jaderne-zbrane.md](jaderne-zbrane.md)), protože podpis takové dohody podle
    něj otevírá cestu k francouzskému „jadernému deštníku" po celé Evropě.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-13-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Petrodolar, petrojuan a predikce možného kolapsu americké ekonomiky do konce roku (Vrabel, 13.
    7. 2026)
  text: 'K aktuální zprávě, že Čína rozšiřuje dohody o obchodu s ropou v juanech se Saúdskou Arábií, SAE
    a Katarem, Vrabel podrobně vykládá historii petrodolarového systému: Brettonwoodská dohoda (1944)
    jako základ poválečného globalismu, francouzský požadavek na výměnu dolarů za zlato (1972), kterému
    USA nemohly vyhovět, a následná dohoda Henryho Kissingera s OPEC/Saúdskou Arábií (1973) — ropa se
    od té doby prodává výhradně v dolarech výměnou za americkou vojenskou ochranu Saúdské Arábie. Podle
    Vrabela tím USA fakticky tisknou „bezcenné papírky" za reálné zboží a dodnes na tomto mechanismu bohatnou.
    Připomíná, že Saddám Husajn (záměr obchodovat ropu v eurech) a Muammar Kaddáfí byli za pokus systém
    opustit zlikvidováni pod záminkou vymyšlených zbraní hromadného ničení. Když Saúdská Arábie loni neobnovila
    bezpečnostní dohodu s USA, Trump podle Vrabela zareagoval rozpoutáním konfliktu na Blízkém východě
    — princip „mafie": kdo nechce platit za ochranu, dostane válku. Uzavírá odhadem (s výhradou nejistoty),
    že amerického ekonomika by se mohla zhroutit do konce roku 2026 kvůli rozpadu petrodolarového systému
    a přechodu zemí Perského zálivu k obchodu s Čínou v petrojuanech.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-13-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Německo financuje 50 000 útočných dronů pro Ukrajinu — „oko za oko" varování (Vrabel, 13. 7.
    2026)
  text: 'Německo financuje nákup 50 000 útočných dronů pro Ukrajinu (ukrajinská firma Skyeton, software
    americké Auterion, kontrakt ~90 mil. eur) — v rámci širšího plánu 100 000 dronů od více západních
    států a dalších 150 000 z Británie. Vrabel na to reaguje principem „oko za oko, zub za zub": pokud
    Německo financuje desetitisíce dronů určených k útoku na Rusko, je podle něj logické očekávat, že
    Rusko odpoví srovnatelným počtem dronů namířených na Německo — dodává, že si to nepřeje (má v Německu
    část rodiny), ale považuje to za spravedlivě předvídatelný důsledek.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-13-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Zelenskyj vyměnil vládu i vyšetřovatele uprostřed korupčního vyšetřování (Vrabel, 13. 7. 2026)
  text: 'Volodymyr Zelenskyj oznámil rozsáhlé vládní změny včetně odvolání velvyslankyně USA Ščefanie
    Šyrinové (Oksany Markarovové), která čelila podezřením z korupce — současně vyměnil i vedení orgánů
    trestního řízení, což Vrabel interpretuje jako snahu vyhnout se vlastnímu trestnímu stíhání. Podává
    mimořádně tvrdé shrnutí Zelenského kariéry: bývalý herec a komik (kritizuje jeho dřívější vulgární
    estrádní vystoupení), zvolený prezidentem s podporou ukrajinského oligarchy a Západu navzdory předvolebním
    slibům ukončit konflikt na Donbasu; za jeho vlády Ukrajina ztratila Donbas, přišla o 1–2,5 milionu
    obyvatel na frontě a zadlužila se na 200 mld. dolarů vůči BlackRock a MMF; zakázal opozici, ruskou
    kulturu a sportovce a přesunul zemi z pravoslavného na katolický kalendář. Označuje ho za „nejhorší
    prototyp člověka 21. století" a nejhoršího politického podvodníka na světě (za ním v jeho žebříčku
    následují Trump, Rajchl a Peter Magyar).'
  podtema: Zahraniční aktéři a precedenty
