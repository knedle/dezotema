  nadpis: David Icke zakázán do ~30 zemí; Německo hrozí vězením za sdílení RT — Boldy (19. 7. 2026)
  text: Boldy komentuje zákaz vstupu Davida Ickeho do zhruba 30 zemí jako další případ umlčování nepohodlných
    postav („chtějí umlčet, protože se o tato témata zajímá čím dál víc lidí"). Řadí sem i to, že v Německu
    má podle něj hrozit až pět let vězení za sdílení a podporu televize RT a názorů oponujících vládnoucímu
    narativu — označuje to za „totalitní režim" a „korporátní darwinismus" (buď sdílíš mainstream a jsi
    volný, nebo sdílíš „pravdu" a jdeš „za katr"). Navazuje na jeho tezi o cenzuře Facebooku a mazání
    videí (viz [YouTube smazal přes milion videí](/temata/dsa-cenzura.md#boldy-2026-07-17-02)).
  osoby:
  - osoba: david-icke
    vztah: pozitivni
    kontext: Zákaz jeho vstupu do ~30 zemí označen za umlčování nepohodlné postavy
  podtema: Trestání politického projevu
- id: boldy-2026-07-19-04
