    antikrist 2017/Musk roboti — [konspirace.md](/temata/konspirace.md). (7) [sloučeno do 6]. (8) IceCube
    Antarktida vyvolává zemětřesení, kritika Alatry — [konspirace.md](/temata/konspirace.md). (9) Darkweb:
    zbraně/děti/vrazi — [konspirace.md](/temata/konspirace.md). (10) „Civilizace s amnézií": obři, dávné
    technologie — [konspirace.md](/temata/konspirace.md). (11) David Icke zakázán do ~30 zemí, Německo/RT
    — [dsa-cenzura.md](/temata/dsa-cenzura.md). (12) Střelba na FF UK + Klánovický les jako odvedení pozornosti
    — [konspirace.md](/temata/konspirace.md). Opakování beze změny (jen zmíněno): sionismus/Izrael třetí
    chrám a trojský kůň migrace, vakcíny bio zbraň/patent, ''Ndrangheta, cenzura FB, NPC/projekt Manhattan,
    adrenochrom/tunely. Bez predikcí a stoch. teroru.'
