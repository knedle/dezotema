- id: boldy-2026-07-19-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Boldy: Trump otevírá „brány pekelné" proti Íránu; USA varují své občany (19. 7. 2026)'
  text: Boldy komentuje Trumpovo prohlášení při nových úderech na Írán, že se „proti Íránu otevřou brány
    pekelné", a americké „červené varování" občanům po celém světě. Trumpa označuje za loutku (připomíná
    podání ruky s Babišem — „jedna ruka, všechny loutky") a spojuje to se svým dřívějším výkladem [Trump
    = Abaddon](/temata/konspirace/2026.md#boldy-2026-03-05-01). Souběžně tvrdí, že jakmile začal opět
    vysílat, Facebook mu blokuje nahrávání videí a z Izraele ho někdo „špehuje" (upozornění antiviru).
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: „Loutka" (ruka s Babišem), otevírá „brány pekelné" proti Íránu; jako „včelař" má likvidovat
      obyčejné lidi (odkaz na Abaddon)
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: boldy-2026-07-19-02
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: 'Boldy: sociální sítě manipulují myšlením přes „světla na kamerách" (19. 7. 2026)'
  text: |-
    Boldy tvrdí, že sociální sítě přímo manipulují myšlením uživatelů — čím víc času na nich člověk tráví, tím je „manipulovatelnější". Popisuje, že sám si dal dvouměsíční pauzu od vysílání, protože cítil, že to „s ním dělá špatně" (bezdůvodné konflikty). Naznačuje, že „přes světla na kamerách" dokážou vkládat lidem myšlenky do hlavy. Řadí to k propagandě vtloukané lidem do hlavy.

    ⚡ **Poznámka:** Tvrzení o ovládání myšlenek „přes světla na kamerách" nemá oporu ve faktech.
- id: boldy-2026-07-19-03
  typ: tvrzeni
  temata:
