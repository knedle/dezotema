  nadpis: Voda jako komodita na burze a datacentra AI (Boldy, 19. 7. 2026)
  text: Boldy varuje, že voda se dostala na americkou burzu a bude se s ní obchodovat — cena „daná od
    přírody" tak může rapidně vyšplhat. Spojuje to s výrokem nástupce Klause Schwaba na Světovém ekonomickém
    fóru, že „lidé by vodu neměli mít zadarmo". Důvod poptávky po vodě vidí v datacentrech umělé inteligence,
    která spotřebují „brutální množství" vody na chlazení. Upozorňuje, že Nvidia (protože nestíhá stavět
    velká datacentra) nabízí lidem malá domácí datacentra na fasádu za ~120 dolarů měsíčně se slibem výdělku
    až 22 tis. dolarů ročně — čímž se prý přesouvá spotřeba vody a nákladů na chlazení na samotné občany
    („NPC"). Navazuje na [Tokenizace majetku a digitální diktatura](/temata/konspirace/2026.md#boldy-2026-03-12-04).
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Mistrovství světa ve fotbale jako okultismus; míč ovládaný AI (Boldy, 19. 7. 2026)
  text: Boldy tvrdí, že mistrovství světa ve fotbale je zmanipulované a prosycené okultismem a numerologií.
    Trump si prý zavolal šéfovi FIFA Infantinovi, aby zrušil červenou kartu americkému hráči; FIFA má
    dle Boldyho během MS „větší pravomoci než státy". Výhru předpovídá Argentině kvůli číslu 19 (hraje
    se 19., Messi i Lamine Yamal spojení s číslem 19) — Messiho řadí k „Baphometu"; odkazuje na plakát
    Adidasu s „kozou" (goat) Messim a mladým Yamalem coby „předání žezla". Míč Trionda má prý zabudovanou
    technologii (trojhranné jádro), díky níž jej umělá inteligence dálkově ovládá a mění směr; VAR je
    jen klam, protože rozhoduje stejně rozhodčí. Uvádí i Bellinghama (číslo 10, desátý gól). Navazuje
    na [dvojníky a okultismus](/temata/konspirace/2026.md#boldy-2026-03-12-07).
  osoby:
  - osoba: lionel-messi
    vztah: negativni
    kontext: Řadí ho k „Baphometu"; MS ve fotbale dle Boldyho zmanipulované okultismem/numerologií
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-06
  typ: tvrzeni
  temata:
