  nadpis: Film „Včelař", Trump jako včelař a AI jako „antikrist" (Boldy, 19. 7. 2026)
  text: 'Boldy interpretuje film *Včelař* (Beekeeper) jako sdělení elit: hlavní hrdina ničí zabudovaný
    systém („úl"). Bílý dům prý na síti X označil Trumpa za „včelaře" — Boldy to čte obráceně: Trump má
    jako „včelař" zlikvidovat obyčejné lidi (navazuje na jeho tezi [Trump = Abaddon / „Moon Child"](/temata/konspirace/2026.md#boldy-2026-03-05-01)).
    Do stejného výkladu řadí stavbu budov ve tvaru úlu a „výměnu královny": Beyoncé měla být do roku 2017
    okultní „královnou", nyní nahrazenou umělou inteligencí. Tvrdí, že AI vznikla už v roce 1956 (CIA/DARPA)
    a její „největší transformace" nastala v roce 2017 — což spojuje s knihou (od „muže v černém"), podle
    níž mělo v roce 2017 začít „zrození antikrista". Elon Musk prý chce mít do ~2030–2050 na světě 10
    miliard humanoidních robotů, kteří nahradí likvidované lidi.'
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-07
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Zařízení IceCube (Antarktida) vyvolává zemětřesení; kritika hnutí Alatra (Boldy, 19. 7. 2026)
  text: Boldy tvrdí, že na Antarktidě je zařízení „IceCube", které dokáže impulzem (rychlostí světla)
    vyvolat zemětřesení kdekoliv na světě posunem litosférických desek (a tím i tsunami). Jako „potvrzení"
    uvádí zemětřesení v Turecku a dění ve Venezuele (dle něj „obětní beránek" kvůli okultismu okolo FIFA).
    Ostře kritizuje hnutí Alatra (jmenuje „Marka Trávníčka") za to, že popírá existenci technologií k
    ovládání počasí a zemětřesení a „míchá jablka s hruškami" — považuje Alatru za záměrně vypuštěný projekt,
    který mluví jen o tom, co se „hodí". Navazuje na [geoinženýrství a patenty od 1896](/temata/konspirace/2026.md#boldy-2026-07-17-03).
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-08
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: 'Darkweb: zbraně z Ukrajiny, obchod s dětmi, nájemní vrazi (Boldy, 19. 7. 2026)'
  text: 'Boldy popisuje darkweb jako místo, kde se dá pořídit „úplně vše": zbraně poslané na Ukrajinu
    (české i americké) se prý prodávají na černém trhu až třikrát dráž, obchoduje se s dětmi (pedofilie)
    a lze si objednat i nájemného vraha — placeno bitcoiny, takže „nikdo tě nedohledá". Spojuje to s tezí
    o mizení tisíců dětí denně a o „nábytku pojmenovaném po zmizelém dítěti" prodávaném na eBay za přemrštěné
    ceny (odkaz na adrenochrom/tunely).'
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-09
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: '„Civilizace s amnézií": obři, dávné technologie a skrytá historie (Boldy, 19. 7. 2026)'
  text: Boldy zastává přesvědčení, že lidstvo je „civilizace s amnézií" — skutečná historie je mu skryta.
    Tvrdí, že existovaly dávné civilizace a obři (odkaz na video s „okem ve skále" a následnou smrtí natáčejícího),
    že nálezy (kostry) mizí v rukou miliardářů, kteří si tak „kupují" výklad historie. Jako doklad ztracených
    technologií uvádí 1800 let starý popis létajícího zařízení v indické knize (odkazuje na „Nag Hammadi"),
    který prý při testu vztlaku vyhověl — z čehož vyvozuje, že „všechno už dávno bylo" a bratři Wrightové
    nic nevynalezli. Diví se i trvanlivosti starých staveb (kostely) oproti dnešním a zpochybňuje dataci
    na budovách (768 vs. 1768).
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-10
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Střelba na FF UK a Klánovický les jako odvedení pozornosti (Boldy, 19. 7. 2026)
  text: 'Boldy tvrdí, že vražda v Klánovickém lese sloužila jako odvedení pozornosti před střelbou na
    Filozofické fakultě UK: policie prý byla stažena do Klánovického lesa, takže u fakulty hodinu nebyl
    žádný policista, vrtulník ani dron — přestože o útoku měli „hodinu dopředu vědět". Naznačuje krytí
    ze strany vlády (ukrajinská stopa v Klánovicích). Do stejné linie řadí i tezi, že evropské podsvětí
    ovládá ''Ndrangheta (odkaz na vraždu novináře Kuciaka).'
  podtema: Náboženský a okultní výklad moci
- id: boldy-2026-07-19-11
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: 'Boldy: větrníky zabíjejí ryby (Dánsko), hmyz a ptáky (Rakousko) (19. 7. 2026)'
  text: |-
    Boldy tvrdí, že větrné elektrárny ve vodě (Dánsko) svými vibracemi ničí ryby (zmatené, bez kyslíku) — každé ráno je prý „systémoví dobrovolníci" sbírají z pláží, aby se do novin nedostala souvislost s větrníky; zmiňuje i uvolňování látek z nátěru turbín. Na souši (příklad z Rakouska při cestě vlakem) prý u větrníků „nevidíš živého tvora" — vibrace ničí život, migrující ptáci do turbín naletávají. Do stejné linie řadí i „drony na ničení hmyzu" jako likvidaci potravy pro ptáky, žáby a další živočichy — „je to likvidace přírody".

    ⚡ **Poznámka:** Tvrzení o hromadném úhynu ryb způsobeném vibracemi větrníků a o „dronech na hubení hmyzu" nejsou doložena.
  podtema: Kulturní a občanský odpor
