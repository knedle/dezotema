vyroky:
- id: vrabel-2026-07-03-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Izrael testuje Iron Dome/Iron Beam — právo na obranu vs. plány na „Velký Izrael" (Vrabel, 3.
    7. 2026)
  text: Izraelské ministerstvo obrany oznámilo úspěšné testy modernizované verze protivzdušného systému
    Iron Dome ve spojení s laserovým systémem Iron Beam, které mají zvládat masivnější a rychlejší útoky.
    Vrabel k investicím do vlastní obrany (včetně Izraele — zmiňuje i vlastní zkušenost se všudypřítomnou
    vojenskou přítomností v zemi) principiálně nic nenamítá, ale opakuje svou tezi, že současná izraelská
    vláda nejde jen o obranu, nýbrž plní sionistické plány na „Velký Izrael" a chce ovládnout celý Blízký
    východ (viz [Írán „telenovela"... Izrael, „Velký Izrael" — 13. 6.](#írán-telenovela-38-a-manipulace-ropy-izrael-velký-izrael-a-netanjahu-řídící-usa--vrabel-13-6-2026))
    — vadí mu především útoky na Gazu a Libanon.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-03-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Nepsaná pravidla mezi hlavami států — USA varovaly Írán před dalším atentátem, kontrast s Venezuelou
    (Vrabel, 3. 7. 2026)
  text: 'Írán se připravuje na masový smuteční obřad (odhad až 20 mil. lidí) za zabitého nejvyššího vůdce;
    současně vyšlo najevo, že USA během konfliktu tajně varovaly Teherán před izraelským plánem zabít
    další vrcholné íránské představitele, se kterými chtěl Washington po konci války jednat. Vrabel z
    toho vyvozuje obecnou úvahu o diplomacii: mezi hlavami států platí nepsaná pravidla vzájemného respektu
    k funkci (ne k osobě), díky nimž zůstávají otevřené dveře k jednání — příkladem je podle něj i to,
    že Rusko mohlo Zelenského „milionkrát" zabít, ale neudělalo to. Kontrastuje to s přístupem USA: v
    Íránu rovnou „pozabíjeli celé vedení", a k venezuelskému exprezidentovi Nicolási Maduru, drženému
    ve vězení v USA, se objevila fotografie vyhublého, vyhladovělého muže — Vrabel připouští, že jde pravděpodobně
    o ilustrační obrázek vytvořený umělou inteligencí (přístup k Madurovi ve vězení není reálný), ale
    považuje za věrohodné, že ho tam Američané skutečně mučí hladem. Celkově to čte jako důkaz, že USA
    po rozpadu východního bloku obvykle nevyjednávají, ale likvidují režim, dosazují loutky a „všechno
    rozkradou".'
  osoby:
  - osoba: nicolas-maduro
    vztah: neutralni
    kontext: Zmíněn ve vazbě v USA — vyhublá fotka (pravděpodobně AI), Vrabel považuje za věrohodné, že
      je mučen hladem
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-03-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Litva ruší ústavní zákaz jaderných zbraní a cizích vojenských základen (Vrabel, 3. 7. 2026)
  text: |-
    Litevské parlamentní strany se dle Vrabela dohodly na zrušení ústavního zákazu jaderných zbraní a zahraničních vojenských základen na svém území (zákaz platil od rozpadu SSSR, zrušení vyžaduje dvoutřetinovou většinu). Vrabel to řadí vedle „nejnebezpečnějších věcí poslední doby" jako je česká muniční iniciativa — pobaltské země podle něj závodí v přibližování jaderných zbraní k ruské hranici, zatímco on opakovaně varuje „nedávejte ty vypálené sirky zpátky do krabičky".

    Ve vysílání 5. 7. Vrabel doplňuje odhad konkrétní distribuce: Německo má jaderné zbraně získat od Británie, Polsko od Francie — v kontextu očekávání, že na summitu NATO v Ankaře se bude jednat o rozmístění jaderných zbraní napříč evropskými zeměmi (Finsko, pobaltské státy) jako reakce na ukrajinské rakety s deklarovaným doletem až 2000 km (systém Flamingo).
  dalsi_zdroje:
  - 2026-07-05_vrabel_nedelni-vysilani-5-7-2026
- id: vrabel-2026-07-03-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Ukrajina a Německo zřizují pracovní skupinu na násilný návrat mužů v brančím věku — dvojí metr
    vůči migrantům z islámských zemí (Vrabel, 3. 7. 2026)
  text: 'Ukrajinský velvyslanec v Německu oznámil vznik společné ukrajinsko-německé pracovní skupiny,
    která má řešit právní a praktické mechanismy „motivující" ukrajinské muže v brančím věku žijící v
    Německu k dobrovolnému návratu domů. Vrabel to čte jako přípravu na to, že německá policie bude tyto
    muže vyhledávat a nuceně dopravovat zpět na Ukrajinu, kde je následně TCK jednotky označí za kolaboranty
    a dezertéry a pošlou na nejhorší bojové akce. Stěžejní je pro něj dvojí metr: zatímco váleční uprchlíci
    z Ukrajiny mají být nuceně vraceni do války, migranti z afrických a islámských zemí (i bez probíhající
    války v zemi původu) jsou v EU „nedotknutelní" a navíc jim má být garantováno přerozdělení přes migrační
    pakt. Za touto asymetrií vidí zájem umožnit Ukrajině pokračovat ve válce („potřebujeme tam do posledního
    Ukrajince"). Navazuje na [EU zúží dočasnou ochranu pro ukrajinské muže (18. 6.)](valka-ukrajina-prubeh.md#dánskoeu-omezují-dočasnou-ochranu-ukrajinským-mužům-aby-zabránily-útěku-před-mobilizací--čistý-fašismus-vrabel-27-6-2026).'
- id: vrabel-2026-07-03-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: TCK brutalita a nespokojenost v ukrajinském parlamentu — 66 % chce mír (Vrabel, 3. 7. 2026)
  text: 'Poslanec ukrajinského parlamentu veřejně kritizoval ministra Fedorova za tvrzení, že je „ukrajinské
    nebe chráněné" — podle něj existují „dvě Ukrajiny": realita ministra a realita občanů, kteří vidí
    hořící Kyjev a oběti na infrastruktuře. Vrabel to čte jako důkaz, že po 4,5 letech války lidem dochází
    trpělivost, a dokládá to videi jednotek TCK násilně odvlékajících muže z ulic (několik mužů najednou
    tahá jednoho do auta, manželky odháněné pepřovým sprejem) — podle něj to dávno není odvod, ale únos.
    Cituje průzkum, podle nějž 66 % Ukrajinců preferuje okamžitý mír před vítězstvím nad Ruskem, a odhaduje,
    že reálné číslo bude ještě vyšší. Rozšiřuje [Ukrajinci nechtějí bojovat — TCK „lov lidí" (6. 6.)](#ukrajinci-nechtějí-bojovat--tck-lov-lidí-a-úplatek-12-000--vrabel-6-6-2026)
    a [TCK: násilná mobilizace a úmrtí na odvodové komisi (12. 6.)](#tck-na-ukrajině-násilná-mobilizace-a-úmrtí-na-odvodové-komisi-vrabel-12-6-2026).'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-07-03-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Povinná vojenská služba ČR vs. Srbsko — stejná délka, jiný důvod (Vrabel, 3. 7. 2026)
  text: 'K vlastnímu tématu tříměsíční povinné vojenské služby (viz [Macinka prosazuje povinnou vojenskou
    službu, 26.–27. 6.](#petr-macinka-prosazuje-povinnou-tříměsíční-vojenskou-službu--vrabel-varuje-muže-v-branném-věku-26-6-2026))
    Vrabel doplňuje zprávu od známého ze Srbska, kde se zavádí stejně dlouhá (tříměsíční) povinná vojenská
    služba — vojákům tam nově pořizují herny s Playstation na volný čas. Klíčový rozdíl je ale podle Vrabela
    v důvodu: v Srbsku se služba zavádí kvůli skutečné obraně země, kdežto v ČR kvůli závazkům vůči „bukurešťské
    devítce", tedy fakticky kvůli přípravě na konflikt s Ruskem.'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-07-03-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'USA stahují tankovou brigádu z Pobaltí, Trump: podpora NATO je „absurdní" — snaha donutit Evropu
    ke sjednocené armádě (Vrabel, 3. 7. 2026)'
  text: 'Trump před summitem NATO v Ankaře na síti Social napsal, že je „absurdní", aby USA dál udržovaly
    jednostranný vztah s aliancí — spojenci prý pro Ameriku nebyli, když šlo o operace proti Íránu, a
    chce, aby si Evropa hájila obranu sama. Souběžně Pentagon stahuje z Pobaltí americkou tankovou brigádu
    (zatím nejasné, zda ji něco nahradí), zatímco evropské státy v NATO zůstávají podle expertů dál výrazně
    závislé na USA (zpravodajství, protivzdušná obrana, satelity). Vrabel to čte jako potvrzení své starší
    teze (viz [PURL a „NATO Review 3.0" (18. 6.)](#purl-a-nato-review-30-usa-přesouvá-zbrojení-i-riziko-na-evropu-vrabel-18-6-2026)):
    cílem je záměrně nechat NATO vypadat rozbité, aby se Evropa „semkla" a vytvořila vlastní armádu —
    v takovém scénáři budou vojáky do případné války s Ruskem dodávat hlavně země „bukurešťské devítky"
    (ČR, Polsko, Slovensko aj.), protože Německo (270 tis. vojáků) a Polsko (cíl 400 tis.) spolu s Ruskem,
    Čínou a Severní Koreou nedají dohromady dost lidí bez mobilizace. Doplňuje odhad, že pokud konflikt
    bude pokračovat „lidským způsobem", je třeba počítat s mobilizací.'
  osoby:
  - osoba: donald-trump
    vztah: rozporuplny
    kontext: Prohlásil podporu NATO za „absurdní" a stahuje americká vojska z Pobaltí — Vrabel to čte
      jako záměrnou strategii donutit Evropu ke sjednocené armádě
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-07-03-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Babiš a Okamura tvrdí, že ČR neplatí Ukrajině — přitom už schválili 30 z 70 mld. eur (Vrabel,
    3. 7. 2026)
  text: 'Vrabel reaguje na tvrzení Andreje Babiše a Tomia Okamury, že Česká republika „nebude platit"
    novou půjčku 70 mld. eur pro Ukrajinu, o níž se má jednat na summitu v Ankaře. Upozorňuje, že z této
    částky je zhruba 30 mld. (necelá polovina) ve skutečnosti součástí už dřív schválených 90 mld. eur
    z prosince, které Babišova vláda odsouhlasila na základě mandátu od vlády i s vědomím Okamury. Argumentuje
    přirovnáním k rodinnému rozpočtu: to, že peníze neplyne přímo z českého státního rozpočtu, ale z rozpočtu
    EU (kam ČR přispívá 2,24 %), neznamená, že je ČR neplatí — stejně jako manželka platící z rodinné
    výplaty stále platí manželovými penězi, i když formálně platba jde z jejího účtu. Označuje tvrzení
    „neplatíme" za lež, protože ČR už úroky z vyplacených částek fakticky platí.'
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: Tvrdí, že ČR neplatí Ukrajině, přitom už schválil 30 z 70 mld. eur — označeno za lež
  - osoba: tomio-okamura
    vztah: negativni
    kontext: Stejně jako Babiš veřejně tvrdí, že ČR neplatí Ukrajině, přestože k tomu dal mandát vlády
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-07-03-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Ministerstvo obrany koupilo bytový komplex v Jincích pro vojáky — Vrabelova vlastní zkušenost
    s šikanou na vojně (Vrabel, 4. 7. 2026)
  text: 'Ministerstvo obrany koupilo rezidenční komplex v Jincích (274 mil. Kč, původně určený jako seniorské
    bydlení) k ubytování vojáků, především příslušníků dělostřeleckého pluku — investice má dle ministerstva
    stabilizovat personál a zvýšit atraktivitu vojenské služby. Vrabel na zprávu reaguje osobní vzpomínkou
    na vlastní základní vojenskou službu v Příbrami: přestože sám neměl větší problémy, byl svědkem brutální
    šikany („mazáci" jednoho vojína „rozjížděli") a musel využít svých kontaktů, aby ho ochránil; zmiňuje
    i kamaráda, který vojnu psychicky nezvládal a musel přesluhovat. Uzavírá, že je mu líto „každého kluka
    navlíknutého do munduru".'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-07-03-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: USA varovaly Polsko před ruským útokem; Polsko nepředá Ukrajině MiGy-29 (Vrabel, 3. 7. 2026)
  text: 'The Telegraph píše, že Washington oficiálně varoval Polsko před rostoucím napětím v nadcházejících
    měsících a nastínil možné scénáře — dronové útoky na kritickou infrastrukturu (elektrárny) i simulované
    letecké údery testující polskou protivzdušnou obranu. Vrabel to komentuje jako „klasiku": rozehrát
    válku v Polsku je scénář, který podle něj zná už z minula. Rozvíjí vlastní „karmickou" tezi — čím
    víc se o možném ruském útoku na Polsko mluví, tím reálnější riziko se vytváří (ať už jako skutečný
    záměr, false flag, nebo vyprovokování Ruska). Souběžně Polsko rozhodlo vyřadit své stíhačky MiG-29
    ze služby, místo aby je (podle dřívější dohody výměnou za ukrajinskou dronovou technologii) předalo
    Ukrajině — Vrabel to čte jako diplomatickou trhlinu mezi oběma zeměmi, byť polskou politickou scénu
    k Ukrajině popisuje jako celkově rozpolcenou.'
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-07-03-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Moldavský premiér rezignoval — paralela s českými politiky předstírajícími odpor k financování
    Ukrajiny (Vrabel, 3. 7. 2026)
  text: Moldavský premiér Aleksandru Munteanu oznámil rezignaci se slovy, že už nemůže vykonávat funkci
    v souladu se svými zásadami a hodnotami. Vrabel otevřeně přiznává, že nezná pozadí (nátlak, kompromitující
    materiál, nebo upřímné rozhodnutí) — motivaci vidí v současném dění v Moldavsku, kde se EU snaží zemi
    „získat pro sebe", aby ji mohla v budoucí válce připojit k Rumunsku. Z toho odvozuje obecnější úvahu
    o politicích, kteří jdou s „globalisty" podporujícími zbrojení a válku proti Rusku, zatímco veřejně
    předstírají opak — dává si to do souvislosti s českými politiky, kteří na sociálních sítích prezentují
    odpor k posílání peněz Ukrajině, ale ve skutečnosti vyjednávají o zbrojení a hlasují pro schválení
    peněz (viz [Babiš a Okamura tvrdí, že ČR neplatí Ukrajině — 3. 7.](nato-zbrojeni-militarizace.md#babiš-a-okamura-tvrdí-že-čr-neplatí-ukrajině--přitom-už-schválili-30-z-70-mld-eur-vrabel-3-7-2026)).
    Připomíná vlastní zkušenost z počátku ruské invaze (24. 1. 2022, spolupráce s Jakubem Wolbertem/hnutím
    Cípl PES) — jak rychle politici i spolupracovníci „vycouvali", jakmile šlo o riziko vězení za protiválečné
    demonstrace.
