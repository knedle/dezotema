  - blizky-vychod
  nadpis: Teorie „týdenního cyklu" eskalace a deeskalace u Íránu — vázáno na burzu (Vrabel, 10. 7. 2026)
  text: 'K aktuálním zprávám o dočasném omezení vojenských operací mezi Íránem a USA (zprostředkovávají
    Pákistán a Katar) Vrabel opakuje tezi, kterou prý sleduje od začátku zpráv o konfliktu: každý týden
    se opakuje stejný vzorec — pondělí a úterý eskalace a útoky, ve středu a čtvrtek se situace „lepší",
    v pátek přichází dobré zprávy a klid, o víkendu se znovu začne útočit a v pondělí je opět „katastrofa".
    Toto střídání dává do souvislosti s obchodováním na burze: Donald Trump podle něj potřebuje na víkend
    nízké ceny ropy a rostoucí akciové trhy, aby bylo možné obchodovat, a cyklus se tak opakuje již čtyřicátý
    týden, aniž by si toho podle Vrabela někdo všiml.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-10-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenskyj schválil památníky UPA/Bandera na Ukrajině i ve Venezuele — spolufinancuje EU (Vrabel,
    10. 7. 2026)
  text: Volodymyr Zelenskyj podepsal dekret o výstavbě památníků věnovaných Ukrajinské povstalecké armádě
    (UPA) a osobnostem ukrajinského nacionalistického hnutí (Šuchevyč, Bandera, Melnyk) — jeden komplex
    na Ukrajině, druhý přímo ve Venezuele, kam po válce podle Vrabela odešla část ukrajinských nacistických
    kolaborantů (podobně jako do Evropy přes katolickou církev v Římě). Celkové náklady komplexu odhaduje
    na cca 70 mil. eur (~1,75 mld. Kč), na financování se má podílet i Evropská unie. Vrabel to komentuje
    sarkasticky — srovnává částku se „směšnou" sumou, kterou ČR posílá na PURL (viz výše), a navrhuje,
    aby stát podobně jako platí zájezdy na Ukrajinu, hradil důchodcům zájezdy k tomuto památníku, aby
    na vlastní oči viděli, jak UPA za války „rozpárávala těhotné ženy a vyřezávala nemluvňata". Zasazuje
    spor do kontextu vyostřených vztahů s Polskem kolem stejného tématu (viz výše) a předpokládá, že po
    volbách polský protest opět „zavře" a spolupráce s Ukrajinou na vstupu do EU bude pokračovat jako
    dřív.
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-07-10-04
