  poznamka: 'Zpracováno 10 témat: (1) Trump nevylučuje bezletovou zónu nad Ukrajinou — [valka-nato-rusko.md](valka-nato-rusko.md).
    (2) Teorie „týdenního cyklu" eskalace/deeskalace Írán vázaná na burzu — [blizky-vychod.md](blizky-vychod.md).
