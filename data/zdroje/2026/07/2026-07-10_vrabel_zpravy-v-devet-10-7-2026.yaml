  nadpis: Dotace 9,5 mil. Kč na obnovu německých hrobů v ČR (Vrabel, 10. 7. 2026)
  text: Ministerstvo pro místní rozvoj (vede Petra Mrázová) vyhodnotilo první dotační výzvu na podporu
    obnovy hrobů významných německých rodáků v ČR — v hodnotě zhruba 9,5 mil. Kč, s odůvodněním naplňování
    česko-německé deklarace o vzájemných vztazích. Vrabel to komentuje sarkasticky jako „směšně malou"
    částku ve srovnání s penězi posílanými na Ukrajinu (viz PURL výše) — ironicky navrhuje čtenářům napsat
    Babišovi o navýšení rozpočtu programu.
  podtema: Germanizace, restituce a „Česko je plán“
- id: vrabel-2026-07-10-02
  typ: tvrzeni
