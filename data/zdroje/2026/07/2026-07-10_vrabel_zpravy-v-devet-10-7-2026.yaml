    (6) EU 6. klastr s Ukrajinou vs. Srbsko 20 let čeká — [valka-nato-rusko.md](valka-nato-rusko.md).
    (7) Okamura kritizuje PURL, ač SPD řídí obranu — pokrytectví — [valka-nato-rusko.md](valka-nato-rusko.md).
    (8) Střet policie s demonstranty v Berlíně kvůli Rheinmetall — [valka-nato-rusko.md](valka-nato-rusko.md).
    (9) Zelenskyj schválil památníky UPA/Bandera (Ukrajina + Venezuela) — [valka-nato-rusko.md](valka-nato-rusko.md).
