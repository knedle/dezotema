  nadpis: Hormonálně upravené španělské vepřové maso vyváženo do střední/východní Evropy — potravinová
    soběstačnost (Vrabel, 12. 7. 2026)
  text: 'Vrabel reaguje na zprávu (sdílenou divačkou), že Španělsko poráží ročně na 50 milionů prasat,
    přičemž maso z hormonálně kastrovaných zvířat neputuje na domácí španělský trh, ale do zemí střední
    a východní Evropy včetně ČR. Argumentuje, že to je důkaz nutnosti potravinové soběstačnosti, kterou
    sám prosazuje od roku 2022 ve svém programu „Česká republika na první místě" — kritizuje globalistický
    model levného dovozu (společně s ukrajinským obilím a polskými kuřaty), z něhož podle něj profituje
    mj. Andrej Babiš (vlastní zemědělsko-chemický byznys), zatímco českým spotřebitelům škodí zdravotně
    nekvalitní potraviny. Doplňuje osobní radu z gastronomické praxe: nešetřit na jídle (kvalitní maso,
    máslo místo margarínu, vlastní vývary místo hotových směsí), protože nekvalitní strava se nakonec
    prodraží na zdravotní péči.'
  podtema: Ekonomický program PRO
