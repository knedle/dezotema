  nadpis: Vrabelův postoj ke spojení Česka a Slovenska — respekt k slovenské vůli, preference decentralizace
    (Vrabel, 12. 7. 2026)
  text: Na divácký dotaz, zda vidí budoucnost ve znovusjednocení Československa, Vrabel odpovídá zdrženlivě.
    Osobně má na Slovensko silnou rodinnou vazbu (babička i její manžel ze Slovenska) a dobré zkušenosti
    ze spolupráce se slovenskou vlasteneckou scénou (Štefan Harabín, protesty proti Fialově vládě v lednu
    2023) — z jeho vlastního dotazování slovenských účastníků demonstrací ale vyplynulo, že Slováci jsou
    na svou samostatnost hrdí a spojení nechtějí, což vnímá jako varování před tím, aby to česká vlastenecká
    scéna vnucovala. Explicitně kritizuje ty, kdo v ČR tvrdí, že „jsme pořád Československo" — podle něj
    jde o fakticky nesprávné tvrzení (samostatné státy s vlastní měnou, právním systémem i mezinárodním
    uznáním po desetiletí). Sjednocení by podle něj muselo vzejít z referenda na Slovensku, ne z české
    iniciativy. Osobně preferuje opačný směr — decentralizaci veřejné správy směrem k menším komunitám
    a lokální samostatnosti namísto centralizace nebo sjednocování států.
  podtema: Ekonomický program PRO
- id: vrabel-2026-07-12-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Green Deal jako „apokalypsa Evropy": pět klíčových nařízení a kalkulace vystoupení z EU — Rajchl
    (14. 6. 2026)'
  text: '**12. 7.** — Vrabel k témuž nařízení (EPBD4, viz výše) doplňuje konkrétní číslo: v ČR se povinnost
    bezemisních budov týká přibližně 700 000 rodinných domů postavených před rokem 1980 — tedy z velké
    části domů dnešních důchodců. Popisuje to jako útok na majetek: kdo nebude mít na renovaci peníze,
    o dům podle něj může fakticky přijít. Kontrastuje to s Babišovou předvolební rétorikou (sliboval „vyhnat
    Uršulu" von der Leyenovou) a jeho současným vstřícným chováním k ní na unijní scéně.'
  podtema: EU a Green Deal
- id: vrabel-2026-07-12-05
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Údajná smrt Lindseyho Grahama a návrh 500% cel na země obchodující s ruskou ropou (Vrabel, 12.
    7. 2026)
  text: Vrabel referuje o nepotvrzené zprávě, že senátor Lindsey Graham (kterého den předtím označil za
    „největšího amerického válečného štváče") zemřel — sám vyjadřuje pochybnost, ale bere zprávu jako
    pravděpodobně pravdivou. Upozorňuje, že Graham byl krátce předtím s Donaldem Trumpem předkladatelem
    návrhu zákona (nikoliv exekutivního nařízení, tedy vymahatelného soudně), který by uvalil 500% cla
    na obchod se všemi zeměmi nakupujícími ruskou ropu a plyn (Indie, Čína, Slovensko aj.). Varuje, že
    by to znamenalo rozdělení světového obchodu a mohlo vážně narušit fungování americké i evropské ekonomiky
    — přirovnává to k dopadu horšímu než uzavření Hormuzského průlivu.
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-12-06
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Letiště Karlovy Vary předáno armádě pro potřeby NATO (Vrabel, 12. 7. 2026)
  text: Na divácký dotaz Vrabel potvrzuje zprávu (zaznělo i v rozhlase), že letiště v Karlových Varech
    se předává armádě a upravuje pro potřeby NATO — řadí to k dalším příkladům přeměny civilní infrastruktury
    ČR na vojenskou/logistickou kapacitu aliance (viz Macinkovo oznámení o roli ČR jako „logistického
    centra", výše).
  podtema: Zahraniční aktéři a precedenty
