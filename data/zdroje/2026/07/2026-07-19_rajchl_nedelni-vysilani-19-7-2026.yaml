  poznamka: 'Zpracováno 11 témat (nedělní vysílání): (1) „Okurková sezóna" — po summitu switch na útoky
    na opozici, plot u Rajchlovy zahrady jako titulka Seznamu, řízení Seznamu (Čárenský/Lukačevič) — [media-propaganda.md](/temata/media-propaganda.md).
    (2) Turkova nehoda + dvojí metr vůči Jurečkovi (nedbalost vs. úmysl) — [kauzy.md](/temata/kauzy.md).
    (3) Petr Pavel „prezident opozice", výrok „demokracie v ohrožení" — [politicky-system.md](/temata/politicky-system.md).
    (4) Vláda neplní sliby (munice, F-35, PURL), ultimátum FARA/ČT do podzimu, volby 2028 — [politicky-system.md](/temata/politicky-system.md),
    [fara-neziskovky.md](/temata/fara-neziskovky.md). (5) Green Deal „highway to hell" — ETS1/2, RED3,
    EPBD4, moratorium na větrníky, Dukovany, „válka s Bruselem", odchod z EU — [suverenita-eu.md](/temata/suverenita-eu.md).
    (6) Chorvatsko a euro = „konec Chorvatska" — [suverenita-eu.md](/temata/suverenita-eu.md). (7) Ukrajina
    se zhroutí, Zelenskyj→Zalužný — [valka-nato-rusko.md](/temata/valka-nato-rusko.md) + [predikce.md](/predikce/index.md).
    (8) Írán — masivní útok USA „příští týden", DPH nula na PHM/plyn — [blizky-vychod.md](/temata/blizky-vychod.md),
    [ceny-energie.md](/temata/ceny-energie.md) + [predikce.md](/predikce/index.md). Bez stoch. teroru.'
