  - blizky-vychod
  nadpis: 'Rajchl: přípravy USA na „masivní útok na Írán příští týden" (19. 7. 2026)'
  text: Rajchl upozorňuje, že k íránským břehům se přesouvají americká plavidla a tankovací lodě a že
    se „příští týden" dá očekávat masivní útok na Írán (s výhradou, že jednání ještě probíhají a může
    se stát cokoliv). Varuje před dopadem na energetiku (nejvíce v Evropě) a navrhuje připravit legislativu
    pro rychlejší zásahy státu — místo stropování cen možnost krátkodobě snížit DPH na pohonné hmoty a
    plyn na nulu (viz [ceny-energie.md](/temata/ceny-energie.md)). Viz [Predikce](/predikce/index.md).
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: rajchl-2026-07-19-02
  typ: tvrzeni
