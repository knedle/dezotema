  nadpis: 'Rajchl: místo stropování cen krátkodobě snížit DPH na PHM a plyn na nulu (19. 7. 2026)'
  text: 'V souvislosti s očekávaným útokem USA na Írán a možným cenovým šokem v energetice navrhuje Rajchl
    připravit legislativu pro rychlé zásahy státu: místo stropování cen mít nástroj krátkodobě snížit
    DPH na pohonné hmoty a plyn na nulu — „lepší být připraven než překvapen".'
  podtema: Manipulace trhu s ropou
- id: rajchl-2026-07-19-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Boldy: Pavlovo pokrytectví — Černochová bourala loni bez následků, Turkovi hrozí kvůli tomu
    rezignace (15. 7. 2026)'
  text: '**19. 7.** — Rajchl Turka hájí a staví ho do kontrastu s Marianem Jurečkou: nehoda je nedbalost
    (křižovatka je nepřehledná, zleva jezdí jen tramvaje, ke srážce by došlo tak jako tak), a i kdyby
    ji zavinil Turek, není to důvod ke složení mandátu ani funkce zmocněnce pro Green Deal. Klíčový argument
    — rozdíl mezi nedbalostí a úmyslem: Jurečka podle Rajchla úmyslně lhal celému národu (o době, kdy
    se dozvěděl o střelbě na FF UK, a o ukončení vánočního večírku ministerstva, který prý pokračoval
    do čtyř do rána), přesto neodstoupil (Fiala prý argumentoval, že „mu to bylo líto") — a nyní jde Jurečka
    do pořadu 360° volat po Turkově odvolání. To Rajchl označuje za „definici bezpáteřnosti" a farizejství
    (řadí sem i Rakušanův šifrovaný telefon).'
  osoby:
  - osoba: filip-turek
    vztah: pozitivni
    kontext: Hájí ho po dopravní nehodě jako nedbalost, ne důvod ke složení mandátu/funkce; kontrast s
      Jurečkovou úmyslnou lží
  - osoba: marian-jurecka
    vztah: negativni
    kontext: „Definice bezpáteřnosti" — úmyslně lhal o střelbě na FF UK a večírku, neodstoupil, přesto
      volá po Turkově odvolání
  podtema: Filip Turek — dopravní nehoda a tlak na rezignaci
- id: rajchl-2026-07-19-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: '„Okurková sezóna": plot kolem Rajchlovy zahrady jako titulka místo velkých kauz; řízení Seznamu
    (Rajchl, 19. 7. 2026)'
  text: 'Rajchl popisuje, jak média v den skončení summitu NATO „přeřadila" z tématu Pavel/summit na útoky
    na opozici (Turek, Foldyna, on sám). Jako doklad nevyváženosti uvádí, že Seznam Zprávy dvakrát za
    týden přinesl článek o tom, že si (firma, jejímž je společníkem) oplotila 20 let vlastněný pozemek
    u Prahy — legálně, po dohodě se sousedy, kvůli bezdomovcům (připomíná případ zavražděné Aničky) —
    zatímco „velké kauzy" (Rakušanův předražený nákup vrtulníků tři dny před volbami, Bíštan, dozimetr,
    kanceláře) zůstávají bez pozornosti. Řízení Seznamu dokládá tvrzením Tomáše Pauknera, že šéfredaktor
    „Čárenský" dostal těsně před nástupem desítky milionů od „Lukačeviče" do ztrátové firmy (koupě třetiny
    ztrátové firmy za desítky milionů). Navazuje na [Dvojí metr v kauzách: byty vs. Pauknerovy korupce](/temata/media-propaganda.md#rajchl-2026-06-21-04).'
  podtema: Nová alternativní média
- id: rajchl-2026-07-19-05
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Petr Pavel jako „prezident opozice" a výrok o „demokracii v ohrožení" (Rajchl, 19. 7. 2026)
  text: 'Rajchl komentuje Pavlův rozhovor (mj. promítaný na Colours of Ostrava — kritizuje politizaci
    apolitické akce) a jeho výrok, že demokracie v ČR je ohrožena, jako „extrémně nebezpečný" z úst hlavy
    státu. Vykládá ho jako signál, že Pavel se svým „loutkovodičem" (Petr Kolář — Rajchl upozorňuje na
    rozpor, zda je či není oficiální poradce) hodlá tlačit na transformaci ČR z parlamentní demokracie
    na prezidentskou republiku a staví se do role „prezidenta opozice" (odmítnutí konzultačních schůzek
    Babišem považuje za správné). Obrací argument: demokracie je podle něj ohrožena naopak Pavlem, politickými
    neziskovkami (Člověk v tísni, Milion chvilek) jednajícími bez volebního mandátu a vychýlenými médii
    (ČT/ČRo). Odmítá i Pavlovu narážku, že Macinkovo tvrzení o „ústavním puči" by mohlo být šířením poplašné
    zprávy. Navazuje na [ÚS akreditace Pavla — prezidentská republika](/temata/petr-pavel.md#rajchl-2026-06-24-01)
    (Rajchl 24. 6.).'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Prezident opozice"; výrok „demokracie v ohrožení" jako nebezpečný signál k transformaci
      ČR na prezidentskou republiku
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-07-19-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vláda neplní vlastní sliby dostatečně; ultimátum k zákonu FARA a ČT do podzimu (Rajchl, 19.
    7. 2026)
  text: 'Rajchl kritizuje vládu ANO/SPD/Motoristé zprava: neplní dostatečně důsledně vlastní předvolební
    sliby vtělené do programového prohlášení — muniční iniciativa nebyla zrušena (tlak Francie/Británie),
    nákup F-35 nebyl zastaven (Rajchl očekává, že nakonec vůbec nebudou dodány), a 140 mil. na program
    PURL (ukrajinské zbraně) je porušením slibu, že na ukrajinské zbraně nepůjde „ani koruna" (mandatorní
    výdaj lze podle něj převést do rozpočtové rezervy). Dává vládě čas do podzimu: pokud sama nepředloží
    zákon FARA, předloží ho sám, „ať se každý ukáže" (viz [fara-neziskovky.md](/temata/fara-neziskovky.md)).
    Požaduje také zásadní změnu financování ČT (prosazuje dobrovolné koncesionářské poplatky — „nebudu
    platit za propagandu proti sobě") a koncentraci sil do prezidentských voleb 2028 za jednoho kandidáta
    schopného porazit Pavla (analogie s vlastní dřívější výzvou volit Babiše místo Bašty).'
  podtema: Kritika soudnictví
- id: rajchl-2026-07-19-07
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Green Deal jako „highway to hell"; moratorium na větrníky, „válka s Bruselem", příprava na odchod
    z EU (Rajchl, 19. 7. 2026)
  text: 'Rajchl reaguje na přiznání Evropské komise, že emisní povolenky brzdí evropský průmysl („soudruzi
    objevili Ameriku" — stejně jako u odklonu od jádra to prý přiznají pozdě a přesto povolenky nezruší,
    protože je vlastní německé penzijní/investiční fondy, které by při odpisu „zítra zkrachovaly"). Zasazuje
    to do řetězce „schodů do pekla": ETS1 (7 000 Kč/osoba ročně) → ETS2 → RED3 (42,5 % elektřiny z OZE
    do 2030) → EPBD4 (bezemisní budovy, nutné rekonstrukce za statisíce, jinak nutnost prodeje) — v kombinaci
    s nástupem AI to prý bude „apokalypsa" na trhu práce (odchod firem, příklad Zetoru). Konkrétní požadavky:
    moratorium na větrné elektrárny „ani jednu jedinou" (jako ve Francii), plný příklon k jaderné energii,
    odmítnutí „vazalských" notifikačních podmínek EU pro dostavbu Dukovan (do 2096 prodávat 70 % výroby
    přes lipskou burzu jen jako zálohu za OZE), a neplacení emisních povolenek — i za cenu pokuty 50 mld.
    ročně se to prý vyplatí. Uzavírá, že „příští roky nebudeme muset válčit s Moskvou, ale s Bruselem",
    a vyzývá k přípravě na odchod nebo rozpad EU; problémem není nedostatek odvážných politiků, ale chybějící
    mandát od voličů (SPD + Stačilo jen ~13 %).'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: rajchl-2026-07-19-08
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Chorvatsko a euro = „konec Chorvatska" (Rajchl, 19. 7. 2026)
  text: 'Rajchl opakuje a doplňuje své pozorování z Chorvatska: euro (zavedeno 1. 1. 2023) tam podle něj
    proklínají i ti, kdo ho původně chtěli — Chorvatsko prudce zdražilo, přišlo o cenovou výhodu vůči
    Itálii/Španělsku/Francii a ztrácí turisty. Varuje před přijetím eura v ČR jako před „strčením hlavy
    do oprátky". Rozšiřuje dřívější [anketu z Chorvatska (16. 7.)](/temata/suverenita-eu/2026.md#rajchl-2026-07-16-01).'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: rajchl-2026-07-19-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Rajchl: Ukrajina se zhroutí, ne eskaluje; Zelenskyj → Zalužný, mír u ~90 % Doněcka (19. 7.
    2026)'
  text: 'Proti Pavlovu tvrzení, že Ukrajina má „dva měsíce" do ruské eskalace, Rajchl předpovídá naopak
    zhroucení ukrajinské fronty. Odvolání populárního ministra obrany Michajla Fedorova (dle Rajchla vynucené
    USA) považuje za první „dominovou kostku" k pádu Zelenského — vyvolalo teprve druhé masové protesty
    za celou válku (první byly kvůli rušení protikorupčních agentur NABU/SAPO, za nimiž prý též stáli
    naštvaní Američané). Opakuje svou dlouhodobou tezi: válka skončí, až Rusko ovládne přes 90 % Doněcké
    oblasti (Konstantinivka už fakticky padla, chystá se ofenziva na Sloviansk, Kramatorsk, obležen Kupjansk)
    — pak Putin s Trumpem uzavřou dohodu (Rusko vymění zbytek Doněcka za část Charkovské oblasti, aby
    Trump „dostal něco"), Zelenskyj bude vyměněn za v Londýně připraveného Zalužného („výměna jedné loutky
    za druhou") a přijde mír. Zdůrazňuje, že čím déle válka trvá, tím horší podmínky pro Ukrajinu (analogie
    s minskými dohodami a jednáními 2022) — vinu za devastaci Ukrajiny přičítá „válečným štváčům" včetně
    „pětky" české opozice. Viz [Predikce](/predikce/index.md).'
  podtema: Zahraniční aktéři a precedenty
- id: rajchl-2026-07-19-10
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Zhroucení ukrajinské fronty, pád Zelenského a nástup Zalužného
  text: Nepředpovídá ruskou eskalaci (jak tvrdil Pavel), ale zhroucení ukrajinské fronty. Válka skončí,
    až Rusko ovládne přes 90 % Doněcké oblasti (po pádu Konstantinivky, Sloviansku, Kramatorsku, Kupjansku);
    pak Putin s Trumpem uzavřou dohodu (Rusko vymění zbytek Doněcka za část Charkovské oblasti), Zelenskyj
    bude nahrazen v Londýně připraveným Zalužným a přijde mírové jednání. Odvolání Fedorova považuje za
    první „dominovou kostku" pádu Zelenského.
  citace:
  - text: Očekávám, že se blíží ta válka ke konci, Zelenský už má tu židli hodně rozkymácenou.
  predikce:
    horizont: neurčeno (řádově měsíce)
    stav: ceka
