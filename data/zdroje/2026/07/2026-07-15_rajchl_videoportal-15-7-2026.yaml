  nadpis: SPD odmítá Mezinárodní komisi pro odškodnění Ukrajiny jako další podvod EU (Rajchl, 15. 7. 2026)
  text: 'Poslanecký klub SPD (Rajchl po konzultaci s Okamurou) jednomyslně nepodpoří návrh na zřízení
    Mezinárodní komise pro odškodnění Ukrajiny, který má být v nejbližších měsících předložen Poslanecké
    sněmovně. Rajchl vysvětluje mechanismus jako podvod: veškeré škody má nakonec uhradit Ruská federace,
    ale až poté, co se ke komisi dobrovolně připojí a jednostranně uzná protiprávnost své agrese i závazek
    bez výhrad zaplatit vyčíslené škody — což Rajchl označuje za zcela nereálný scénář („to dřív přistane
    UFO"). Do té doby by náklady komise (nové úřednické posty) hradily členské státy, tedy i ČR z daní
    občanů. Rajchl to staví do kontrastu s vlastní pozicí SPD coby ochránce peněženek občanů proti byrokracii
    EU.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
