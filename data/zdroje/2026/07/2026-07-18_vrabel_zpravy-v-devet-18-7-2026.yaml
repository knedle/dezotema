- id: vrabel-2026-07-18-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Noční údery USA na Írán, íránské odvety na Záliv a cestovní varování (Vrabel, 18. 7. 2026)
  text: 'Vrabel referuje o pokračující eskalaci: americké noční údery na Írán si vyžádaly nejméně 3 oběti,
    Teherán podnikl odvety na cíle v Kuvajtu, Bahrajnu a Jordánsku (škody na energetice) a tvrdí, že u
    Hormuzského průlivu vybuchly dva ropné tankery (americké velení to popírá). K výzvě USA, aby jejich
    občané zvážili cesty na Blízký východ (severní Izrael, Gaza), Vrabel dodává, že to platí i pro Čechy
    — doporučuje raději cestovat do „vojensky neutrálního" Srbska. Válku podle něj netřeba dál komentovat:
    „nepokračuje, ale rozvíjí se".'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-18-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'EU akční plán elektrifikace: 2× elektřiny, konec fosilů, chytré elektroměry (Vrabel, 18. 7.
    2026)'
  text: 'Vrabel referuje o novém akčním plánu Evropské komise pro elektrifikaci (představen 17. 7.), o
    němž slyšel projev komisaře pro energetiku Dana Jørgensena na kanálu EU Debates: EU chce během desetiletí
    zdvojnásobit výrobu elektřiny, odstřihnout se od uhlí, plynu a ropy a přejít na elektromobilitu a
    elektrické vytápění (tepelná čerpadla místo plynu/kamen). Vrabel to označuje za „zelenou myšuge" a
    „větrník-kum-zdar": zdroje mají být soláry a větrníky (Německo prý cílí na 1000 GW v solárech, ČEZ
    malé jaderné reaktory s Rolls-Roycem), stojí to stovky miliard eur a povede to k „flexibilní" spotřebě
    řízené chytrými elektroměry („prát jen v noci"). Rámuje to jako pokračování snahy von der Leyenové
    a Babiše „snížit ceny elektřiny" novým energetickým systémem a varuje, že se to citelně dotkne všech.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-18-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Francie stáhla zlaté rezervy z Fedu (napětí Trump–Macron) (Vrabel, 18. 7. 2026)
  text: Vrabel zmiňuje jako „docela tvrdou" a „zásadní" zprávu, že Francie kvůli napětí mezi Trumpem a
    Macronem oficiálně stáhla veškeré své zlaté rezervy uložené u Federálního rezervního systému v New
    Yorku. Přiznává, že ji slyší poprvé, proto ji zatím nekomentuje a slibuje se k ní vrátit v nedělním
    vysílání.
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-18-04
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: EU pravidla pro děti online jako předstupeň chat control a digitálního ID (Vrabel, 18. 7. 2026)
  text: 'K návrhu Evropské komise na společná pravidla bezpečnějšího používání digitálních služeb dětmi
    (děti do 13 let bez samostatného přístupu na sociální sítě, do 2 let bez obrazovek, větší odpovědnost
    platforem) Vrabel dodává vlastní výklad: je to prý předstupeň schváleného „chat control" — kontroly
    veškeré komunikace na Messengeru a WhatsAppu — k němuž jsou potřeba obří datacentra (enormní spotřeba
    elektřiny a vody na chlazení). Skutečným cílem podle něj je, aby nikdo nemohl na sociální sítě pod
    falešným jménem kritizovat vládu: přístup na internet má být podmíněn digitálním ID. Označuje EU za
    „totalitní systém s totální kontrolou", kde jsou zprávy čteny, archivovány a vyhodnocovány na „nebezpečná
    slova"; závěr přednáší v sarkastické rovině („buďte poslušné ovce, pište, že milujete Babiše"). Navazuje
    na [chat control 2.0](#) a digitální ID.'
- id: vrabel-2026-07-18-05
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Světové ekonomické fórum jako projekt CIA (Malone, Schwab, Kissinger) — Vrabel (18. 7. 2026)
  text: 'Vrabel přebírá tvrzení amerického lékaře Roberta Malonea, že Světové ekonomické fórum (WEF) je
    od svého vzniku (1971) spojeno s americkou CIA a že jeho zakladatele Klause Schwaba měl „ovlivnit"
    bývalý ministr zahraničí Henry Kissinger. Vrabel dodává, že ho to nepřekvapuje, protože na CIA je
    podle něj napojené i české ministerstvo zahraničí, které „chodí pro rozkazy" na americké ministerstvo
    zahraničí, a CIA má prý „pod kontrolou naše volby i média". Zároveň Malonea hájí jako „otce mRNA",
    který jako jeden z prvních varoval před mRNA vakcínami a byl za to umlčen coby „dezinformátor" (kritizuje
    absurditu, že vynálezce technologie je označen za dezinformátora těmi, kdo „to vědí líp" — von der
    Leyen, Babiš). Navazuje na tezi o [USA/CIA měnících vlády 73×](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-17-09)
    (dnes prý otevřeně: Venezuela, Írán).'
  osoby:
  - osoba: robert-malone
    vztah: pozitivni
    kontext: „Otec mRNA" umlčený jako dezinformátor; Vrabel přebírá jeho tvrzení o napojení WEF na CIA
  podtema: Náboženský a okultní výklad moci
- id: vrabel-2026-07-18-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Výměna lídrů bez voleb: Burnham v UK a odstoupení prezidenta v Maďarsku (Vrabel, 18. 7. 2026)'
  text: 'Vrabel na dvou zprávách kritizuje „výměnu vůdců bez voleb": v Británii se novým premiérem stal
    Andy Burnham (zvolen jen vnitrostranicky lejbristy, bez celostátních voleb) — Vrabel ho ironicky překřtil
    na „Andyho Palšunku" (burn + ham) a předpovídá, že bude „naprosto stejný jako Starmer", stejně jako
    je u nás „Andy" Babiš stejný jako Fiala („lidi vystřízliví"). V Maďarsku prezident Tamás Šujok podepsal
    ústavní dodatek ukončující jeho vlastní mandát poté, co ho nový premiér Péter Magyar (strana TISA)
    označil za „loutku Fideszu" a vyzval k odstoupení — Vrabel to ironizuje jako „demokracii po maďarsku"
    (prezident se zvoleným mandátem na 5 let odvolán, protože se novému premiérovi „nelíbil"), kterou
    EU přesto vítá; Magyar si prý dosadí vlastní loutku.'
  osoby:
  - osoba: andy-burnham
    vztah: negativni
    kontext: Nový premiér UK zvolený bez celostátních voleb — ironicky „Palšunka", prý bude stejný jako
      Starmer
  - osoba: peter-magyar
    vztah: negativni
    kontext: Nový maďarský premiér — donutil prezidenta Šujoka odstoupit, aby si dosadil „vlastní loutku"
      („demokracie po maďarsku")
  podtema: Kritika soudnictví
- id: vrabel-2026-07-18-07
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Nawrocki odmítl zákon o svazcích osob stejného pohlaví — Vrabel k LGBT (18. 7. 2026)
  text: 'K odmítnutí polského prezidenta Nawrockého podepsat zákon o právním uznání stejnopohlavních párů
    (a jeho odmítnutí adopce) zaujímá Vrabel podle svých slov „jiný názor než většina": registrované partnerství
    považuje za férové — dvěma lidem, kteří spolu žijí, umožňuje společné jmění, dědictví, zastupování
    partnera a vdovský důchod (moderátorka Zuzka dodává, že v ČR to už platí a EU nutí ostatní země taková
    manželství uzavřená jinde uznat). Odmítá ale adopci/výchovu dětí stejnopohlavními páry („jdou dětem
    divným příkladem") a hlavně „tlačení na děti" — Prague Pride (v čele s Kateřinou Konečnou), zvířecí
    motivy před dětmi a nátlak ve školách (příklad z Německa: srbská matka pokutována, když syn odmítl
    růžové šatičky). Shrnuje: co kdo dělá v soukromí a jaká má majetková práva mu nevadí, dokud to „nevystavuje
    s kameramanem" a netlačí na děti.'
  podtema: Eutanazie
- id: vrabel-2026-07-18-08
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Rekordní státní dluh ČR (342 tis. Kč/obyvatel) jako důsledek rozprodeje republiky (Vrabel, 18.
    7. 2026)
  text: 'Ke zprávě, že státní dluh ČR vzrostl v 1. pololetí o 49,2 mld. Kč na rekordní úroveň (přes 342
    tis. Kč na obyvatele včetně nemluvňat) a do konce roku má dosáhnout téměř 4 bilionů, Vrabel argumentuje,
    že republika byla od roku 1989 „rozebraná, rozprodaná a rozkradená" a předaná „globalistickému západnímu
    kapitálu" (banky s mateřskými sídly mimo ČR, průmysl, potraviny, benzín; zrušené aerolinky, konec
    Zetoru, úvahy o prodeji letiště), přičemž se stále víc zadlužuje. Varuje řeckým scénářem: když byla
    země předlužená, přišel MMF s drastickými opatřeními a „zabavoval lidem peníze z účtů". Klíčová otázka
    podle něj zní: „komu všichni dlužíme" a „kdo nás ovládá".'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-18-09
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Vučič a „konec volného trhu" — British Steel jako důkaz (Vrabel, 18. 7. 2026)
  text: Vrabel pouští a chválí projev srbského prezidenta Aleksandara Vučiče, který varuje před zhoršující
    se globální situací, vyzývá k posílení armády, ekonomiky a k tvorbě zásob (potraviny, voda) a prohlašuje,
    že „volný trh už neexistuje" kvůli bariérám a válkám. Vrabel označuje Vučiče za „nejlepšího politika
    na světě" a tvrdí, že by ČR řídil úplně stejně. Jako potvrzení Vučičovy teze uvádí britské znárodnění
    ocelárny British Steel (dříve čínská Jingye Group) z důvodu „národní bezpečnosti", proti němuž se
    ohradil Peking — obchodní zájmy se dnes prý neprosazují trhem, ale „násilím", clny, sankcemi a válkami;
    svět je „na divokém západě" a dělí se na dva tábory. Rozšiřuje dřívější [Srbsko jako model suverenity](#).
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-18-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Ukrajinské útoky přímo na Moskvu (8 mrtvých) jako zlomová eskalace (Vrabel, 18. 7. 2026)
  text: 'K nočním ukrajinským dronovým a raketovým útokům na Moskevskou a Tambovskou oblast (zásah logistického
    centra Wildberries v Kotovsku, sklad v Moskvě, ropný objekt) Vrabel zdůrazňuje, že jde o útoky „našimi
    drony, dělostřeleckými granáty z české muniční iniciativy, za naše peníze, s naší politickou i vojenskou
    podporou" — tedy i o útoky NATO. Označuje to za možný zlomový okamžik: od roku 2022 se říkalo, že
    Západ nesmí dodat zbraně na údery na ruské území, protože by to znamenalo třetí světovou válku; teď
    se prý „vraždí lidé na ulicích přímo v Moskvě" — přesně to, čeho se Rusko obávalo a čím zdůvodnilo
    speciální vojenskou operaci. Očekává, že Rusko bude muset přehodnotit vývoj konfliktu; situaci označuje
    za „absolutně nebezpečnou" a „velmi silnou eskalaci". Obyčejní Rusové prý tlačí vládu k odvetě.'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-18-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: ČR podporuje čečenskou exilovou vládu (Ičkerie) — „další podporovaný převrat" (Vrabel, 18. 7.
    2026)
  text: K jednání představitelů exilové vlády Čečenské republiky Ičkerie v Praze (kritika Kadyrova, výzva
    k podpoře nezávislosti na ruské nadvládě) Vrabel ironizuje, že „už dlouho jsme nepodpořili žádný teroristický
    režim" (naposledy Izrael a USA). Tvrdí, že se ČR (za současného ministra zahraničí) staví do role
    USA/Západu a jezdí po státech podporovat opoziční strany, možná i finančně a přes tajné služby — „vypadá
    to, že budeme podporovat nějaké převraty". Připomíná čečenskou vazbu na islámský stát a teroristické
    útoky (škola v Beslanu, Dagestán). Navazuje na tezi o [USA/CIA měnících vlády 73×](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-17-09).
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-18-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Zelenský otevírá archivy k Volyni — smír s Polskem jen „aby se vlk nažral" (Vrabel, 18. 7. 2026)
  text: 'K oznámení, že Zelenskyj otevře archivy SBU a MZV k volyňskému masakru a umožní exhumace (přivítáno
    Donaldem Tuskem), je Vrabel skeptický: jde prý o gesto, „aby se vlk nažral a koza zůstala celá" —
    cílem je urovnat polsko-ukrajinský vztah (napjatý po sporu o UPA a po výrocích polského prezidenta),
    aby mohla pokračovat „společná válka proti Rusku". Věřit Zelenskému je podle něj nebezpečné. Navazuje
    na [Krize Polsko–Ukrajina kvůli UPA](/temata/valka-ukrajina-prubeh/2026.md#cernohorsky-2026-06-28-03).'
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-18-13
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'EU–Ukrajina: společná výroba dronů a „sladění standardů" — válku vede EU (Vrabel, 18. 7. 2026)'
  text: Evropská komise spustila s Ukrajinou dohodu o vývoji a výrobě dronů a protidronových systémů,
    uvolnila další 1 mld. eur (~25 mld. Kč) a chce do 2026 zahájit společnou výrobu (do budoucna i protibalistické
    střely), přičemž von der Leyen mluví o „integraci ukrajinské obranné ekonomiky" a „sladění standardů".
    Vrabel to bere jako důkaz své teze, že válku proti Rusku nevede Ukrajina, ale EU/NATO/koalice ochotných
    — Ukrajina je jen „nájemný vrah", jemuž „podáváme zbraně a vedeme ruku". Ironizuje, co znamená „sladění
    standardů" (jestli i mobilizační jednotky TCK budou verbovat v Teplicích/Kolíně a přivazovat lidi
    ke stromům). Varuje, že výrobny zbraní se kvůli ruským úderům přesouvají do EU (Dánsko, Německo, ČR),
    takže Rusko dříve či později zaútočí i na evropské území — „nevíte dny ani hodiny, kdy rakety začnou
    lítat na evropské území". Navazuje na [EU povolila Ukrajině čínské komponenty](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-16-10).
  podtema: Zahraniční aktéři a precedenty
- id: vrabel-2026-07-18-14
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Odvolání Syrského a hlasování Bundestagu o Fedorovovi — „Německo velí Ukrajincům" (Vrabel, 18.
    7. 2026)
  text: 'K informaci (Financial Times), že Zelenskyj zvažuje odvolání vrchního velitele Syrského poté,
    co se protesty kvůli odvolání ministra obrany Fedorova změnily v požadavek na výměnu vojenského vedení,
    Vrabel přidává „vtip": německý Bundestag prý den předtím veřejně jednal a hlasoval o tom, zda by se
    měl Fedorov vrátit na post ministra obrany. Přirovnává to k operaci Barbarossa — „Němci velí Ukrajincům"
    — a naznačuje, že nad tím vším stojí „někdo jiný". Navazuje na [záznam z 16. 7. (odvolání Fedorova)](/temata/valka-nato-rusko/2026.md#vrabel-2026-07-16-10).'
  podtema: Zahraniční aktéři a precedenty
