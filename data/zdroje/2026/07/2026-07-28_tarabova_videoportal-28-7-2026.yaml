  nadpis: Petr Pavel a fotografování na F1 v Maďarsku — „PR opičárny" (Tarabová, 28. 7. 2026)
  text: Lenka Tarabová kritizuje Petra Pavla za zveřejněné fotografie z jeho návštěvy okruhu Hungaroring
    v Maďarsku, kde fotografoval auta jako svůj koníček. Poukazuje, že pro běžného člověka (i profesionální
    sportovní fotografy) je téměř nemožné získat na podobné akce akreditaci, a ptá se, jakým způsobem
    se na akci dostal prezident — srovnává to se způsobem, jakým se dostal na večeři s tureckým prezidentem
    Erdoğanem v Ankaře (kde si účast „vybrečel"). Odmítá argument části veřejnosti, že jde o „geniální
    reklamu" a „skvělou propagaci" — ptá se, propagaci čeho. Kritizuje, že prezident cestuje za peníze
    daňových poplatníků, aby si užíval svého koníčku, a nechává se u toho fotografovat pro sociální sítě;
    to označuje (citujíc Václava Klause) za „falešné a prázdné".
  citace:
  - text: Já jako člověk, který patří přece jenom k těm politicky trochu náročnějším, tak bych čekala
      od prezidenta víc.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: tarabova-2026-07-28-02
