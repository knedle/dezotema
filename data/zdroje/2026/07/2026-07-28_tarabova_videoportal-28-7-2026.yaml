  nadpis: 'Petr Pavel — seznam nesplněných slibů a lží: Kolář, blokování vlády, veto rozpočtu (Tarabová,
    28. 7. 2026)'
  text: 'Tarabová shrnuje řadu Pavlových výroků, které podle ní odporují jeho pozdějším činům: sliboval,
    že jediný, kdo bude mít na Hradě slovo, bude „Kolář" — nesplnil; tvrdil, že Kolář není poradce, aby
    později přiznal, že poradcem je; sliboval, že nebude blokovat sestavování nové vlády, a přesto blokoval;
    prohlašoval, že nebude aktivistickým prezidentem, a stal se jím; tvrdil, že sestavování rozpočtu je
    čistě záležitostí vlády, do níž prezident nemá zasahovat, aby ho následně vetoval (viz [Pavlovo veto
    rozpočtového zákona — Rajchl (26. 7.)](/temata/petr-pavel.md#rajchl-2026-07-26-05)). Tarabová sama
    uvádí, že věcně nikdo nechce narůstající veřejný dluh, ale připomíná, že za posledních let žádná vláda
    (levá ani pravá) nebyla ochotná skutečně šetřit a osekat mandatorní výdaje — a paradoxně by takovou
    revoluci čekala spíš od „pravicové" vlády Petra Fialy než od vlády Andreje Babiše.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
