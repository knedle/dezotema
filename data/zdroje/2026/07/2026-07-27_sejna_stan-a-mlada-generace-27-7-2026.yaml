  nadpis: STAN slibuje mladé generaci ochranu, přitom jedná proti jejím zájmům — Šejna (27. 7. 2026)
  text: 'Adam Šejna (Restart Česko) kritizuje hnutí STAN za to, že se prezentuje jako strana hájící zájmy
    mladé generace, zatímco podle něj jedná opačně: aktivně podporuje LGBT agendu, kterou označuje za
    škodlivou pro děti; hlásá odpovědné hospodaření s rozpočtem, zatímco předseda strany (Vít Rakušan)
    nakupoval předražené doplňky ke zbraním za státní peníze; podporuje zvyšování daní, což dle Šejny
    demotivuje podnikání; a čtyři roky u moci nepomohla se snížením cen bytů, naopak podle něj podpořila
    „nekontrolovanou imigraci z Ukrajiny", která ceny bydlení v Praze i jinde zvýšila. Uzavírá, že přesvědčit
    mladou generaci, že strana za ni bojuje, zatímco proti ní ve skutečnosti jedná, je „největší zločin,
    který může politická strana udělat".'
  citace:
  - text: Ta strana totiž říká mladým lidem, že za ně bojuje, přičemž proti ním aktivně bojuje.
  osoby:
  - osoba: vit-rakusan
    vztah: negativni
    kontext: Předražený nákup doplňků ke zbraním za státní peníze, hlava strany podporující zvyšování
