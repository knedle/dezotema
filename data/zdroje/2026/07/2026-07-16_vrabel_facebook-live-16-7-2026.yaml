  nadpis: Volodymyr Zelenský, Michailo Fedorov, Oleksandr Syrskyj
  text: jmenovaní terči (v souvislosti se smrtí dronového operátora ve sdíleném videu) odsouzeni k představě
    věčného mučení v pekle
  citace:
  - text: Bohužel další člověk, o kterýho prostě planeta přišla. [...] i Fedorov, i Zelenský, který jsou
      i sirský, který to má pod kontrolou, tohle jsou zodpovědní za tohle. A v pekle už. [...] Vaří se
      hrnce s vodou, tam už se rovnou roztápí železní plotny a ty se tam budou nekonečně grillovat.
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: Odvolal oblíbeného ministra obrany Fedorova, aby si udržel kontrolu — dehumanizován spolu
      s Fedorovem a Syrským přáním pekelného utrpení (→ [stoch. teror](../stochasticky-teror.md))
  teror:
    terc: Volodymyr Zelenský, Michailo Fedorov, Oleksandr Syrskyj
    hranicni: false
- id: vrabel-2026-07-16-12
  typ: stoch-teror
  temata:
  - blizky-vychod
  nadpis: Donald Trump
  text: v reakci na zabití přibližně 180 dívek ve škole při americkém úderu na Írán; jmenovaný terč, výzva
