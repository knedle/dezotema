  text: '**16. 7.** — Rajchl na dovolené v Chorvatsku doplňuje neformální anketu mezi místními obyvateli
    o spokojenosti se zavedením eura (1. 1. 2023): z oslovených lidí nenašel jediného spokojeného. Cituje
    konkrétní postřeh jedné ženy o psychologickém efektu přechodu — dřív dostávali za jedno euro sedm
    kun, ale to, co dřív stálo jednu kunu, dnes stojí jedno euro, takže vše vnímají jako sedmkrát dražší.
    Používá to jako argument proti tvrzení, že by euro v ČR nikomu nezdražilo život — bohatnou dál jen
    nejbohatší, obyčejní lidé podle něj na přechod doplatí.'
