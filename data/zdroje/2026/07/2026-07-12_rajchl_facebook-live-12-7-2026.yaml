vyroky:
- id: rajchl-2026-07-12-01
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Mír bude odrážet aktuální kontrolu území — čím déle válka trvá, tím hůř pro Ukrajinu (Rajchl,
    12. 7. 2026)
  text: Rajchl opakuje svou dlouhodobou tezi, že jakákoliv budoucí mírová dohoda bude vycházet z faktické
    kontroly území v okamžiku podpisu — proto podle něj každý další den a měsíc trvání konfliktu zhoršuje
    vyjednávací pozici Ukrajiny. Zdůrazňuje, že netleská žádné ze stran (obě podle něj lhaly, proto válka
    vůbec trvá) a sám chce jen mír. Predikuje, že pokud se do dvou měsíců neuzavře dohoda, nedojde k eskalaci
    (jak předpokládá Petr Pavel), ale ke zhroucení Ukrajiny kvůli vyčerpání zdrojů (viz [predikce.md](predikce.md))
    — a že zastánci pokračování války si pak budou zpětně nárokovat, že chtěli mír „odjakživa".
  podtema: Vyjednávání a mír
- id: rajchl-2026-07-12-02
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina se do dvou měsíců zhroutí, pokud nedojde k mírové dohodě
  text: Jakákoliv budoucí mírová dohoda bude odrážet aktuální kontrolu území v okamžiku jejího podpisu
    — čím déle válka trvá, tím horší vyjednávací pozici bude mít Ukrajina. Pokud se do dvou měsíců neuzavře
    mírová dohoda, nedojde podle Rajchla k eskalaci (jak předpokládá Petr Pavel), ale ke zhroucení Ukrajiny,
    protože jí docházejí zdroje. Dodává, že zastánci pokračování války budou později tvrdit, že vždy chtěli
    mír.
  citace:
  - text: Pokud do dvou měsíců nedojde k uzavření té dohody, tak podle mého názoru — ne, že dojde k eskalaci,
      jak to říká Petr Pavel — ale prostě ta Ukrajina se zhroutí, protože jí prostě dochází už úplně všechno.
  predikce:
    horizont: cca 2 měsíce od 12. 7. 2026 (do poloviny září 2026)
    stav: vyvraceno
    vyhodnoceni:
    - datum: 2026-11-20
      text: mírová dohoda nevznikla, a přesto se Ukrajina do poloviny září nezhroutila; válka pokračuje
        i v listopadu
      stav: vyvraceno
    - datum: 2026-11-20
      text: Doloženo pozdějšími záznamy o válce (září–listopad).
