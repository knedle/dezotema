  nadpis: Odmítnutí narativu „Ukrajina bojuje za ČR" a zbrojení proti Rusku — vzor Irska (Rajchl, 8. 7.
    2026)
  text: 'V reakci na sněmovní projev Martina Kupky o nutnosti navýšit obranné výdaje kvůli „odstrašení"
    Ruska Rajchl odmítá dva argumenty najednou: že se na Ukrajině bojuje za Českou republiku ("ani jednu
    vteřinu") a že podpora Ukrajiny pomáhá i ČR — místo toho tvrdí, že peníze z českých daní končí u "ukrajinských
    zlodějů", kteří si za ně kupují "zlaté toalety a bidety". Investice do obrany podle něj Rusko neodstrašují,
    protože Rusko nemá důvod ČR napadnout — stačí mu sledovat, jak se Evropa ničí sama masivní migrací
    z Afriky a Green Dealem. Jako alternativní vizi pro ČR opakuje vzor Irska (12,2% růst HDP v loňském
    roce, jen 0,2% HDP na obranu, přebytkový rozpočet) a odmítá "krmení zbrojařských korporátů" penězi,
    za které se nakupují zbraně, jež budou za pět let jen "muzejními exponáty".'
  osoby:
  - osoba: martin-kupka
    vztah: negativni
    kontext: Sněmovní projev o odstrašení Ruska a podpoře Ukrajiny označen za „litánie" a „blábory a nesmysly";
      přirovnán k „eurohuérům"
  podtema: Zahraniční aktéři a precedenty
