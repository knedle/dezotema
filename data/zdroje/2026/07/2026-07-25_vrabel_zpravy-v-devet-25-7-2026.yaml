  nadpis: 'Hormuzský průliv každý pátek: Trump prý manipuluje trh s ropou (Vrabel, 17. 7. 2026)'
  text: '**25. 7.** — Vrabel opravuje mediální rámování zdražení pohonných hmot v ČR (ceny už přes týden
    „určuje volný trh"): není to trh, ale přímý důsledek Trumpova uzavření Hormuzského i Báb al-Mandabského
    průlivu. Doplňuje ekonomický detail: dočasné vládní snížení spotřební daně z pohonných hmot (jedno
    z opatření reagujících na zdražování) stálo státní rozpočet asi 3,5 miliardy Kč — částku dává do souvislosti
    se zbrojními výdaji vlády (prodej letiště, budov aj., viz [Letňany](/temata/kauzy.md)). Vyzývá diváky,
    ať při tankování nenadávají trhu, ale vládě (Babiš, Macinka) a Donaldu Trumpovi osobně.'
  podtema: Manipulace trhu s ropou
- id: vrabel-2026-07-25-04
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Odchod šéfa BIS Koudelky — Vrabel: „dvojitý agent CIA" (25. 7. 2026)'
  text: 'K blížícímu se odchodu ředitele Bezpečnostní informační služby (BIS) Michala Koudelky Vrabel
    cituje bývalého pracovníka tajných služeb a signatáře Charty 77 Jana Schneidera, který kritizuje Koudelkovo
    působení kvůli únikům informací novinářům v kauzách Vrbětice, Ricin a případu čínského novináře. Vrabel
    se ztotožňuje s kritikou, ale jde dál: považuje Koudelku za pravděpodobně dvojitého agenta, pracujícího
    nejen pro české tajné služby, ale i pro americkou CIA — a předpokládá, že i jeho nástupce bude „jezdit
    do CIA, aby mu tam řekli, jak se má v ČR postupovat" a bude posuzovat politickou scénu očima toho,
    kdo podporuje, nebo naopak nepodporuje nepřátelství vůči Rusku. Z vlastní zkušenosti (i zkušenosti
    manželky) popisuje zásah tajných služeb jako „horší než mor, horší než exekutor, horší než inkvizitor".
    Předpovídá, že žádná z uvedených kauz (Vrbětice, Ricin, vyhoštění osmdesátky ruských diplomatů) nebude
    nikdy skutečně vyšetřena — podobně jako kauza COVID, kde politici slibovali vyšetřování a potrestání
    viníků, ale ve výsledku spolu dnes bez problémů vládnou. Očekává, že podobně jako v minulosti (kauzy
    Rath, Bárta) se najde jen „obětní beránek", jehož případ média nafouknou, aby veřejnost uklidnily,
    zatímco systémové problémy zůstanou nevyřešené.'
  osoby:
  - osoba: michal-koudelka
    vztah: rozporuplny
    kontext: Odcházející šéf BIS — dle Vrabela pravděpodobně dvojitý agent CIA; kritizován i Janem Schneiderem
