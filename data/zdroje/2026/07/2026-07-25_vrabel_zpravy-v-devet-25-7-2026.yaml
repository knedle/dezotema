- id: vrabel-2026-07-25-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Vučič a „konec volného trhu" — British Steel jako důkaz (Vrabel, 18. 7. 2026)
  text: |-
    **25. 7.** — Vrabel sdílí a doporučuje patnáctiminutový rozhovor Vučiče pro švýcarskou (německy vysílající) televizi. Vučič v něm připomíná vlastní zkušenost s válkou (bombardování NATO v 90. letech, zničená kancelář, ztráta 30 % mužů v 1. i velké ztráty ve 2. světové válce) a odmítá, že by Srbsko válku chtělo — je vojensky neutrální a do konfliktu nevstupuje, přiznává ale, že ekonomické důsledky se Srbsku nevyhnou. Předpovídá, že dosavadní čtyři a půl roku konfliktu byly jen „prokrastinací" a že po ruských volbách koncem září přijde během několika týdnů výrazná eskalace ze strany Ruska — válka se podle něj musí ukončit tím, že jedna strana zvítězí, a Západ nemá v úmyslu nechat Rusko „na pokoji" ani po případném dobytí Donbasu. Na otázku, proč to neřekne nahlas západním politikům, odpovídá, že ho stejně neposlouchají („máš svůj názor, ale jsi malá země, my máme svoje cíle"). Popisuje, že odmítl podepsat blíže neurčenou rezoluci na Ukrajině kvůli článku 11, který měl zřizovat samostatný mezinárodní soud pro ruské zločiny na Ukrajině — to považuje za zbytečné dublování existující Charty a rezolucí OSN, jen „přiživující oheň". Klíčové: je přesvědčen, že Vladimir Putin použije jaderné zbraně, pokud to bude považovat za nutné — a klade řečnickou otázku, která země by si vůbec troufla na jaderný odvetný úder proti Rusku. Vrabel k tomu doplňuje aktuální zprávu: Vučič oznámil, že americká cla na srbské zboží budou dočasně (po dobu jednání) nulová, dlouhodobě se mají pohybovat kolem 10–12 %, zatímco ČR a celá EU mají 15 % — staví to do kontrastu s tím, že Srbsko je vojensky neutrální, mimo EU i NATO, a přesto si vyjednalo lepší podmínky s USA než „po kotníky zabořená" ČR (jmenuje Macinku a Babiše) — a znovu Vučiče označuje za politický vzor, „krasobruslaře na ostří nože" balancujícího mezi USA, Ruskem, Čínou i EU.

    > „Aleksandar Vučič si je jistý, že Vladimir Putin použije jaderné zbraně, pokud to bude potřeba. [...] Která země by si troufla poslat jadernou bombu na Rusko?" — Ladislav Vrabel (parafráze Vučiče), [Zprávy v devět 25. 7. 2026](/zdroje/2026-07.md#2026-07-25_vrabel_zpravy-v-devet-25-7-2026)
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-07-25-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Rubio–Lavrov na ASEANu: Rusko diplomaticky „vyhrálo", další vyzbrojování Ukrajiny „neakceptovatelné"
    (Vrabel, 23. 7. 2026)'
  text: '**25. 7.** — Washington se po měsících neúspěchů znovu snaží obnovit trilaterální jednání (USA–Ukrajina–Rusko)
    ještě před zimou; Rubio se sešel s Lavrovem v Manile, souběžně telefonovali Zelenskyj s Witkoffem
    a Kushnerem. Vrabel poukazuje na absurdní rozpor ve výrocích Donalda Trumpa: poté, co Lavrov na jednání
    s Rubiem znovu zopakoval, že další americké dodávky zbraní Ukrajině jsou nepřijatelné, Trump na sociálních
    sítích napsal, že žádné zbraně Ukrajině nedodává — USA prý jen prodávají zbraně zemím NATO a EU, a
    co ty s nimi dále dělají, o tom „nemá tušení". Vrabel to označuje za do očí bijící lež vzhledem k
    veřejně známým faktům (Musk poskytuje Starlink, USA dodávají naváděcí data pro rakety). Očekává, že
    Rusko už nebude ochotné dál hrát roli v předstírané mírové hře, kterou hrálo rok po Anchorage. Doplňuje,
    že Zelenskyj plánuje, že Ukrajina bude do roku 2027 schopná nasadit drony s doletem až 1000 km (aktuálně
    mají obě strany drony s doletem kolem 3000 km) a buduje výrobní kapacity pro drony přímo ve Spojených
    státech; ukrajinská armáda navíc v červenci zřídila speciální jednotku pro koordinaci dálkových úderů
    na ruské území.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-25-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Ukrajinský generál Drapatyj: „Rusko nemá právo na existenci" — Vrabel: čistý nacismus (25.
    7. 2026)'
  text: 'Moskva odsoudila výroky velitele ukrajinských pozemních sil Michaila Drapatého (dosazeného Volodymyrem
    Zelenským) z rozhovoru z roku 2023, který nyní zveřejnil kanál Ukrajiner na YouTube — Drapatyj v něm
    prohlásil, že Rusko coby národ „nemá právo na existenci", že se u něj po tisíce let civilizačně nic
    nezměnilo (mentalita ani „imperiální ambice"), a kriticky se vyjádřil i o obyvatelích Donbasu: označil
    je za osadníky a „kriminální živly" bez ukrajinského národního povědomí, závislé na sociálních dávkách
    bez ohledu na zemi pobytu. Mluvčí ruského MZV Marija Zacharovová i mluvčí Kremlu Peskov výroky označili
    za neonacistické — Peskov dodal, že tím Drapatyj fakticky potvrzuje smysl „speciální vojenské operace"
    (denacifikace Ukrajiny). Vrabel s hodnocením souhlasí bez výhrad: říkat, že ruský národ nemá právo
    na existenci, je podle něj čistý nacismus, a takový člověk podle něj patří do vězení, nikoli do velení
    ukrajinské armády — dodává, že tam se pravděpodobně brzy dostane, pokud „nezemře při té denacifikaci".'
  osoby:
  - osoba: michailo-drapatyj
    vztah: negativni
    kontext: 'Velitel ukrajinských pozemních sil — výrok „Rusko nemá právo na existenci" a o Donbasu jako
      „kriminálních živlech" — Vrabel: čistý nacismus'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-25-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Rusko odřízlo Ukrajinu od černomořských přístavů; USA chrání kazašskou ropu Chevronu (Vrabel,
    25. 7. 2026)
  text: 'Vrabel upozorňuje na podle něj v médiích téměř nezmiňovanou zásadní změnu taktiky: Rusko posledních
    deset dní útočí na moldavské/černomořské přístavy a odřízlo Ukrajině přístup ke třem přístavům, čímž
    ji fakticky zbavilo přístupu k moři — tvrdý zásah do ukrajinské ekonomiky, protože export přes moře
    (především obilí) před válkou tvořil 19–20 % ukrajinského HDP. Zásadně to podle něj mění vnímání konfliktu,
    protože prý nezapadá do převažujícího mediálního rámce „Ukrajina vítězí". Souběžně USA vyzvaly Ukrajinu,
    aby přestala útočit na tankery přepravující kazašskou ropu v oblasti Novorossijsku v Černém moři —
    varování přišlo po stížnosti americké společnosti Chevron (15% podíl v konsorciu CPC) poté, co byl
    zasažen jí pronajatý tanker; Washington považuje kaspický ropovod za důležitou alternativu k ruským
    energetickým surovinám pro Evropu. Vrabel z rychlosti, s jakou Ukrajina na americkou žádost přestala
    na kazašskou ropu útočit, usuzuje, že je jasně vidět, „kdo tu válku řídí".'
  podtema: Vyjednávání a mír
- id: vrabel-2026-07-25-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'USA čelí nedostatku munice kvůli Ukrajině a Íránu — Vrabel: „válčí, kde můžou" (25. 7. 2026)'
  text: 'Americký senátor Mark Kelly upozornil na výrazný úbytek zásob munice a zbraňových systémů USA
    (Tomahawky, ATACMS, SM-3, Patriot) v důsledku zásobování Ukrajiny i konfliktu s Íránem — varoval,
    že v případě rozsáhlejšího konfliktu by USA mohly mít omezenou schopnost dlouhodobé obrany. Debata
    rovněž srovnává vojenské přístupy: zatímco Rusko a Írán sázejí na jednodušší a levnější zbraně vyráběné
    ve velkém, USA spoléhají na technologicky vyspělé, ale výrazně dražší systémy. Vrabel to komentuje
    sarkasticky — sám si nedostatek munice vysvětluje tím, že „kdyby Američané neničili Rusy, mohli by
    mít HIMARS, kdyby neničili Íránce, mohli by mít Patrioty, a kdyby nevyvraždili indiány, mohli by mít
    tomahawky" — tedy že nedostatek zbraní je přímým důsledkem vlastní politiky vedení válek na více frontách
    najednou.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-25-10
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Rumunsko sestřelilo dron podruhé za 24 hodin; Lockheed Martin buduje radary proti dronům (Vrabel,
    25. 7. 2026)
  text: 'Rumunská stíhačka F-16 sestřelila bezpilotní letoun, který ráno narušil vzdušný prostor země
    — do akce byly vyslány dva stíhací letouny, dron byl sestřelen přibližně 10 km západně od města Gorga.
    Jde už o druhý sestřelený dron nad Rumunskem během 24 hodin, přičemž oba incidenty se odehrály téměř
    identicky. Vrabel nabízí několik možných výkladů: může jít o ruský dron jako varování nebo test připravenosti,
    o provokaci vypuštěnou někým jiným než Ruskem, anebo o postupné vytváření záminky pro budoucí eskalaci
    („aby jednoho dne mohla jiskra zažehnout" a bylo možné tvrdit, že Rusko napadlo členskou zemi NATO).
    Zdůrazňuje ironii nákladů — ptá se, kolik stojí nasazení dvou stíhaček F-16 na jeden dron. V souvislosti
    s tím uvádí zprávu, že americká zbrojovka Lockheed Martin navázala spolupráci se dvěma rumunskými
    firmami na vývoji a testování radarů proti dronům přímo v Rumunsku — což zapadá do jeho opakované
    teze o postupném rozmisťování prvků protiraketové/protidronové obrany NATO ve východoevropských zemích,
    čímž se tyto země samy stávají potenciálním cílem ruské armády.'
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-25-11
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Ukrajinské námořnictvo poprvé velí mnohonárodním silám NATO (Vrabel, 25. 7. 2026)
  text: Ukrajinské námořnictvo poprvé ve své novodobé historii získalo oprávnění velet mnohonárodním silám
    NATO při námořních protiminových operacích — stalo se tak během cvičení Sea Breeze 2026, kdy byla
    ukrajinská jednotka oficiálně začleněna do velitelského systému aliance; jde o historicky první případ,
    kdy NATO svěřilo ukrajinskému námořnictvu velení nad podřízenými mnohonárodnostními silami tohoto
    typu. Vrabel to dává do kontextu opakovaných výzev evropských představitelů, že by „byla škoda nevyužít"
    ukrajinské bojové zkušenosti při budování společné evropské armády — Ukrajina podle něj fakticky velí
    spojeným jednotkám NATO, aniž by byla formálním členem aliance (neplatí příspěvky, nemá povinnosti,
    jen čerpá). Připomíná, že Rusko v roce 2022 označilo členství Ukrajiny v NATO za „červenou linii"
    — dnes tam probíhá nejvíc vojenských cvičení NATO, jsou tam tajné pobočky CIA a Ukrajina fakticky
    NATO velí — z čehož usuzuje, že konflikt nemá žádné brzké řešení a vyzývá diváky, aby se na dlouhou
    eskalaci připravili.
  podtema: EU jako vojenská struktura
- id: vrabel-2026-07-25-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'EU umožní prodej nákladu ze zadržených lodí „ruské stínové flotily" — Vrabel: banditismus (25.
    7. 2026)'
  text: V rámci 21. sankčního balíčku proti Rusku Evropská unie umožní členským státům prodat náklad z
    lodí spojených s tzv. ruskou stínovou flotilou, které byly zadrženy při námořních kontrolách — dosud
    mohly být lodě jen zadrženy, nyní je možné zabavené zboží (nejen ropu, ale i obilí a další ruské produkty)
    přímo prodat. Cílem je dál omezit fungování stínové flotily, kterou Rusko využívá k obcházení sankcí.
    Vrabel to označuje za „klasický banditismus" a srovnává s postupem Donalda Trumpa vůči Venezuele (zajetí
    prezidenta s manželkou, uvěznění, ukradení venezuelské ropy) — EU si podle něj vzala z tohoto přístupu
    příklad a nyní krade a prodává ruskou ropu a obilí na moři stejným způsobem. Varuje, že podobné jednání
    bude mít následky („karma, zákon příčiny a následku"), které Evropskou unii bolestně dostihnou.
  podtema: Zahraniční aktéři a precedenty
