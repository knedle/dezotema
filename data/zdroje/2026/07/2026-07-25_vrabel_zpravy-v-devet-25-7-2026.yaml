  nadpis: Húsíové zaútočili na tankery v Báb al-Mandabu; ropa nad 100 $ poprvé od května (Vrabel, 23.
    7. 2026)
  text: '**25. 7.** — Húsíové zaútočili drony a raketami i na ropná zařízení Saudi Aramco v Saúdské Arábii
    (oblasti Džidda, Janbú) — podle prvních zpráv byl provoz omezen i na letištích v Rijádu a Džiddě;
    saúdské letectvo v odvetě zaútočilo na telekomunikační infrastrukturu v jemenské Hodajdě. Souběžně
    USA a Velká Británie připravují v Londýně jednání ministrů obrany s cílem vytvořit mezinárodní koalici
    (válečné lodě, minolovky, bezpilotní systémy) na ochranu lodní dopravy v Hormuzském průlivu po útocích
    na obchodní lodě, z nichž USA viní Írán. Vrabel poukazuje na paralelu s vlastní vojenskou misí EU
    v Báb al-Mandabu (viz výše) — respektive na to, že se konflikt „rozjíždí z jednoho průlivu na druhý",
    a předpokládá, že brzy bude nutné otevírat vojensky i samotný Hormuz. Doplňuje glosu k místnímu dopadu:
    v Děčíně kvůli čerpání vody na mytí lodí námořní flotily prý klesá hladina v řece — ironicky poznamenává,
    že ministr Macinka „má napoleonský komplex" a jezdí radit jiným zemím, jako by ČR byla velmoc, zatímco
    na ni samotnou by při zapojení do konfliktu mohly létat íránské rakety stejně jako na Bulharsko.'
  podtema: Hormuz — aktualizace 6. 5. 2026
