  nadpis: US Senát odmítl omezit Trumpovy vojenské pravomoci vůči Íránu (Vrabel, 25. 7. 2026)
  text: 'Americký Senát poměrem hlasů 49:47 zablokoval rezoluci (předloženou demokraty v rámci zákona
    o válečných pravomocích), která měla prezidenta Trumpa zavázat k získání souhlasu Kongresu pro další
    vojenské operace proti Íránu. Trump si tak podle Vrabela zachovává plnou ústavní volnost jednání jako
    vrchní velitel ozbrojených sil — včetně možnosti nasadit jaderné zbraně. Vrabel z těsného, ale napříč
    stranami rozděleného hlasování usuzuje, že rozdělení na republikány a demokraty je iluzorní: když
    jde o Ameriku, Izrael, Rusko nebo Ukrajinu, hlasují obě strany fakticky stejně — přirovnává to k současné
    české koalici a opozici, které si sice navzájem nadávají, ale při hlasováních o klíčových zahraničněpolitických
    otázkách jednají shodně. Z toho vyvozuje, že Trump nebude mít důvod se před podzimními volbami do
    Kongresu (midterms) „brzdit" a bude moci ve válce s Íránem pokračovat bez omezení.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-07-25-03
