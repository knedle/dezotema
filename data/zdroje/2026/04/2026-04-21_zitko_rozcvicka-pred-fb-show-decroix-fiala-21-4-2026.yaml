  nadpis: 'USA: vakcíny přejmenovány na „biologické zbraně" — Zítko (duben 2026)'
  text: 'Pavel Zítko ve vysílání ze dne 21. 4. 2026 oznamuje jako přelomovou zprávu: americký ministr
    obrany Pete Hegseth (dle Zítka) nově definoval COVID vakcíny jako „biologické zbraně", v souladu s
    označením profesora Francise Boylea. Vakcinace má být napříště dobrovolná. Zítko hodnotí tento krok
    jako potvrzení toho, co říkal od počátku pandemie: mRNA injekce nikdy nebyly léčivem, ale experimentální
    intervencí bez odpovídajících bezpečnostních studií.'
