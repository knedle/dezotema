  nadpis: Národní očkovací strategie — hlasování výboru pro zdravotnictví (29. 4. 2026)
  text: 'Tarabová informuje o hlasování sněmovního výboru pro zdravotnictví (29. dubna 2026) o Národní
    očkovací strategii (NOS). Výbor má 25 členů (14 koalice ku 11 opozice) — hlasování proběhlo v koaliční
    většině. Jediný, kdo byl otevřeně proti, byl poslanec SPD Dr. Sýla; Jindřich Rajchl byl přítomen jako
    nehlasující pozorovatel (jako europoslanec má právo navštívit jakýkoli výbor). NOS připravená pod
    ministerstvem Válka byla dle Tarabové neoprávněně schválena karetářskou vládou Petra Fialy, která
    v té době již byla v demisi. WHO označuje za soukromou organizaci financovanou Billem Gatesem. Jako
    škodlivé účinky očkování uvádí autismus, ADHD, ekzémy, alergie a onkologická onemocnění u dětí. Vyzývá
    k odmítnutí jakýchkoli nátlaků: „nátlaky jsou pro otroky." Připomíná komunální volby 9.–10. října
    2026 a výměnu 27 senátorských křesel jako příležitost ke změně.'
  osoby:
  - osoba: rajchl
    vztah: pozitivni
    kontext: Přítomen na výboru jako pozorovatel; Tarabová ho uvádí jako symbol boje PRO proti NOS
  - osoba: bill-gates
    vztah: negativni
    kontext: Označen za klíčového finančního podporovatele WHO — důkaz, že WHO je soukromá, nikoliv mezivládní
      instituce
  podtema: Svobodný vysílač CS — Peková, Zítko (9. 4. 2026)
