  text: 'Rajchl zveřejnil AI-generované video, kde jako Petr Pavel (v první osobě) říká věci jako: „Budu
    se muset tvářit, že mě nenasral Macinka s tím Rudým právem" (narážka na Pavlův rozhovor v komunistickém
    deníku, jehož výtisky prý dal zlikvidovat), „jak mě komunistická rozvědka chválila, co za bezvadnýho
    perspektivního kádra", a komentuje, že Minář organizuje pro něj na Letné „největší demonstraci na
    podporu bývalého komunistického rozvědčíka, jaká kdy v dějinách téhle země byla." Na konci deepfake
    Rajchl (jako fake Pavel) sám přizná, že šlo o AI. Účelem videa je dvojí: zesměšnit Pavlovu komunistickou
    minulost a zároveň demonstrovat manipulativní potenciál AI deepfake videí.'
