- id: rajchl-2026-04-19-01
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Fremrova výpověď: Rakušan byl aktivní v šifrované síti'
  text: 'V týdnu od 14. dubna 2026 vypovídali v kauze Dozimetr Jiří Fremr, Jiří Pospíšil a Serge Borenstein.
    Jiří Fremr ve výpovědi uvedl, že šifrovaná síť KryptoCalt — komunikační platforma, v níž špičky Hnutí
    STAN běžně komunikovaly — byla standardním nástrojem, a že v ní byl aktivní i Vít Rakušan. Rakušan
    přitom opakovaně veřejně tvrdil, že šifrovaný telefon nikdy nepoužil a dal ho hrát svým dětem. Rajchl
    tento rozpor označuje za jednoznačné usvědčení ze lži. Poukazuje na nerovnováhu v trestním stíhání:
    ke stíhání Martina Dvořáka stačila výpověď jednoho svědka (Matěj Augustín), ke stíhání Marka Schneidera
    jedna výpověď (Pavel Dovhomilú) — ale pro stíhání STAN a TOP 09 nestačí výpovědi 7–8 svědků, kteří
    shodně uvádějí, že strany peníze inkasovaly. Rajchl byl nominován do nové parlamentní vyšetřovací
    komise pro kauzu Dozimetr.'
  osoby:
  - osoba: vit-rakusan
    vztah: negativni
    kontext: Jiří Fremr ve výpovědi potvrdil, že Rakušan byl aktivní v šifrované síti KryptoCalt — přímý
      rozpor s Rakušanovými dřívějšími tvrzeními
  podtema: Kauza Dozimetr
- id: rajchl-2026-04-19-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Rajchl: dobrovolné koncesionářské poplatky jako jediné spravedlivé řešení'
  text: |-
    Rajchl v živém vysílání z 19. dubna 2026 jde dál než zrušení poplatků: navrhuje jejich zavedení jako *dobrovolných*. Efekt: ČT by musela bojovat o každého diváka a nabízet program pro co nejširší okruh. Dnes konzervativně smýšlející občané platí povinně, ačkoliv pro ně ČT nevysílá — „oni se na nás můžou vykašlat." Historické srovnání: Tomio Okamura nebyl pozván k Václavu Moravcovi 9 let, Petr Maďar (nový maďarský premiér) byl v maďarské státní televizi ignorován 1,5 roku a nyní hrozí, že obrazovku zcela ztmaví — čeští progresivisté Maďarovi tleskají, Okamurově absenci bagatelizovali. Stardance a reality show patří na komerční televize; ČT je televize veřejné služby. Viz také: [Tarabová: ČT a ČRo zrušit](/temata/media-propaganda.md#tarabova-2026-04-18-01).

    V poslanecké sněmovně (**26. 6. 2026**), v debatě odbočivší od služebního zákona k ČT (Marian Jurečka), Rajchl návrh zopakoval konkrétněji: nechť si ČT stanoví dobrovolný poplatek v libovolné výši (třeba 10 tisíc Kč měsíčně) a rozpočet klidně 50 miliard Kč ročně — ale jen od těch, kdo o službu stojí. Argumentuje, že by to politiky zcela vyvázalo z vlivu na veřejnoprávní média („my do toho nebudeme moci sáhnout") a přinutilo ČT soutěžit o diváka místo vysílání jen pro „eurounijní prokyjevskou" voličskou základnu. Odmítá logiku přirovnání k pojistnému systému — jde o platbu za konkrétní službu, kterou část platících odmítá a která je navíc uráží („dezoláti" apod.), a poukazuje na porušení etického kodexu ČT (čl. 23.4) při stávce redaktorů. Připomíná, že koalice poplatky zvýšila půl roku před volbami, ač to neslíbila.
  citace:
  - text: Nenuďte nás, abychom si platili propagandu, která nás pomlouvá, dehonestuje a lže o nás.
  - text: Chci si zaplatit za službu, která mě bude nějakým způsobem obohacovat, a ne která mě bude pomlouvat
      a urážet.
