  nadpis: 'Petition: Sudetoněmecký Landsmannschaft prohlásit za extremistický — Vrabel (29. 4. 2026)'
  text: 'Vrabel ve vysílání 29. dubna 2026 informuje o petici iniciativy „ČR na prvním místě", která žádá
    vládu, aby Sudetoněmecký Landsmannschaft prohlásila za extremistickou organizaci a zakázala jí pořádat
    sjezd v Brně. Vrabel tuto snahu vítá a zasazuje ji do kontextu: sjezd v Brně (22.–24. 5. 2026) se
    blíží a dosud nikdo formální kroky nepodnikl. Iniciativa sbírá podpisy online.'
  podtema: Parlament, politické a stranické reakce
