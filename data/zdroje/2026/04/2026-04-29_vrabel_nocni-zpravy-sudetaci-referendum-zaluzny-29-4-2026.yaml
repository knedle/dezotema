  poznamka: 'Noční zprávy (kratší). Klíčová témata: petice ČR na prvním místě za zákaz Landsmannschaftu;
    Macinka podepsal přistoupení ČR k „bunker koalici" pro Ukrainu; návrh zákona o referendu — 300 000
    podpisů, EU/NATO exit výslovně vyloučen; Petr Pavel: Rusko má 1,5 mil. vycvičených vojáků, militarizovaná
    ekonomika, možné testování NATO v Pobaltí; Druzhba severní větev zastavena od 1. 5. (tranzitní zóna
    Bryansk ostřelována); EU zmrazuje eurofundy pro Slovensko; Zalužný: syna přiměje přísahat na dobytí
    zpět obsazených území.'
