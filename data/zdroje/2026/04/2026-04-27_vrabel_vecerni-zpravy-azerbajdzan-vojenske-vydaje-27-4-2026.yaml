  poznamka: 'Večerní zprávy se Zuzkou. Klíčová témata: Babiš jednal v Ázerbájdžánu o 2 mld. m³ plynu/rok
    (~30 % spotřeby ČR); česká plynová zásobovací struktura (Norsko 40–50%, LNG 30–40%, Německo 10–20%
    incl. neoficiální ruský plyn); spotřeba plynu klesla z 9–10 na 6,75 mld. m³; SIPRI 2025 vojenské výdaje
    (USA 954 mld., Čína 336, Rusko 190, Německo 114, Ukraina 84); Druzhba severní větev a Berlín; Hormuz
    ohrožuje katarské LNG; Merz přidělil 233 mil. EUR Ukraině + 30 mil. EUR Černobyl; podmínky Merze pro
    vstup Ukrainy do EU (územní ústupky); Putin setkal s Araghdžím (rusko-íránské strategické partnerství);
    Kubilius — Evropská obranná unie; Andrew Haag (Pentagon) propuštěn za tvrzení, že ukrajinskě peníze
    byly rozkradeny.'
