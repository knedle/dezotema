  nadpis: Odmítnutí EU armády a jaderného štítu — diplomacie místo přípravy na válku
  text: 'Rajchl ve televizní debatě s europoslancem Zdechovským (28. dubna 2026) odmítá vznik společné
    evropské armády s argumentem, že by ji fakticky ovládalo Německo — s ohledem na historickou zkušenost
    je to pro ČR nepřijatelné. Odmítá i připojení k francouzskému jadernému štítu: bezpečnost ČR by to
    nesnižovalo, nýbrž snižovalo. Kategoricky odmítá jakoukoli přípravu na jadernou válku a cituje Einsteina:
    nevím, čím bude vedena třetí světová válka, ale čtvrtá bude vedena klacky a kameny. Česká zahraniční
    politika by měla stát na silné diplomacii a politice všech azimutů, nikoliv na vyhrožování. Odmítá
    nálepku „milovníka Ruska": „Nemiluju Rusko, miluju Českou republiku."'
  citace:
  - text: Jaderná válka je zánik světa a to si musíme všichni uvědomit. Takže já tohle absolutně odmítám
      tu myšlenku a já se chci připravovat na mír, nikoliv na válku.
