- id: rajchl-2026-04-05-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Usmrcení autem vs. verbální trestný čin — stejný trest
  text: |-
    Rajchl v živém vysílání 5. 4. 2026 komentuje rozsudek v kauze Adama Coubala — podnikatele, který jel Porschem a srazil ženu s kočárkem; žena zemřela. Coubal dostal podmíněný trest.

    Ve stejné době dostala pedagog Martina Bednářová podmíněný trest za to, že žákům řekla, že „v Kijevě se nic neděje" a že ČT je ovlivněna. Rajchl srovnání poukazuje:

    - Obě kauzy vedly k podmínce — de facto bez reálného trestu.
    - Za usmrcení z nedbalosti (zničení celé rodiny) je stejný nebo mírnější trest než za verbální výrok.
    - Coubal byl dle médií sponzorem Petra Pavla — tato informace v médiích chyběla, zatímco Rajchl tvrdí, že by u sponzora ANO nebo PRO byla v titulku.
  citace:
  - text: Usmrcení z nedbalosti mají podmínku a za verbální projev trestný čin mají podmínku. Za oboje.
      Jestli mi to někdo vysvětlí — já se pak omluvím. Ale nevysvětlí, protože to prostě vůbec nedává
      smysl.
  osoby:
  - osoba: adam-coubal
    vztah: negativni
    kontext: Srazil Porschem ženu s kočárkem, ta zemřela — dostal podmínku; Rajchl to označuje za dvojí
      metr vůči verbálním trestným činům; Coubal byl Pavlův sponzor
  - osoba: martina-bednarova
    vztah: neutralni
    kontext: Pedagog, dostal podmínku za tvrzení, že „v Kijevě se nic neděje"; Rajchl srovnává s Coubalovým
      případem jako důkaz dvojího metru
  podtema: Kauza Adam Coubal — dvojí metr justice
- id: rajchl-2026-04-05-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Nora Friedrichová (DVTV) — Rajchlova výzva opakování odmítnuta
  text: 'V živém vysílání 5. 4. 2026 Rajchl popisuje, jak Nora Friedrichová opakovaně volala a psala.
    Rajchl odepsal: „odmítám se s nikým, jako jste vy, bavit" — a zdůvodnil to vzájemným vědomím minulosti
    (narážka na kauzy kolem DVTV). Friedrichová mu poté napsala s novou otázkou, Rajchl odepsal: „Vy asi
    nerozumíte ani psanému textu." Rajchl v živém vysílání vyhlásil: DVTV, Forum24, Deník N, Reflex a
    Respekt — v životě rozhovor nedá. Macinkovo barování Deníku N z tiskové konference označuje za správné.'
  citace:
  - text: Já jim jenom nebudu zvyšovat v žádném případě sledovanost. A oni zase napsali, že stejně mají
      zájem o ten rozhovor. To víte, že máte, protože by to byl nejsledovanější rozhovor ve vaší historii
      a ještě byste si na tom vydělali peníze. Ale já si počkám, až klidně zkrachujete.
  osoby:
  - osoba: nora-fridrichova
    vztah: negativni
    kontext: Volala a psala Rajchlovi; odmítl jakýkoli kontakt; označuje DVTV jako žumpu; Friedrichová
      nahrávala bez upozornění
  podtema: Mainstream jako politický aktivismus
- id: rajchl-2026-04-05-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Článek o „121letých sponzorech" PRO — Rajchl: typografická chyba, záměrná lež'
  text: 'Rajchl v živém vysílání 5. 4. 2026 reaguje na titulkový článek iDnes/e-dnes o tom, že PRO má
    tři sponzory ve věku 121 let. Vysvětluje: u jednoho dárce 1300 Kč se při zadávání přehodily číslice
    5 a 0 — z 1950 vzniklo 1905. Chybu ohlásili a závazně slíbili opravit do termínu odevzdání výroční
    zprávy (1. dubna). Přesto titulka zůstala. Rajchl to označuje za záměrné překroucení chyby v evidenci
    stovek dárců ve prospěch senzace — a poukazuje, že stejný iDnes neuvedl, že Adam Coubal (Porsche případ)
    byl sponzorem Petra Pavla.'
  podtema: Mainstream jako politický aktivismus
- id: rajchl-2026-04-05-05
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Petr Pavel na summit NATO nepoletí — Rajchl to schvaluje
  text: 'V živém vysílání 5. 4. 2026 Rajchl komentuje rozhodnutí, že Petr Pavel se nezúčastní summitu
    NATO a místo něj pojedou Andrej Babiš, Petr Macinka a Jaromír Zuna. Rajchl to označuje za správné:
    zahraniční politika musí být jednohlasná. Pavel dlouhodobě nevyjadřuje podporu zahraničnímu směřování
    Babišovy vlády — kdyby jel, partnerům by sděloval protichůdné signály (Babiš: 2 % HDP na obranu nestačí;
    Pavel: 5 %). Mandát od občanů z říjnových voleb mají vládní strany, nikoliv prezident.'
  citace:
  - text: Pokud má být zahraniční politika v jakékoliv země čitelná, tak musí být jednohlasná. [...] Petr
      Pavel dlouhodobě dokazuje, že nehodlá respektovat zahraniční směřování vlády Andreje Babiše. [...]
      Ať sedí doma.
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: Nevysílán na summit NATO; jeho zahraniční politika neslučitelná s vládní linií (5 % vs. 2
      % HDP na obranu)
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-04-05-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Minář jako „defraudant" — 7 milionů na stranu, která nevznikla
  text: 'Rajchl v živém vysílání 5. 4. 2026 rozšiřuje svoji kritiku Mináře o finanční argument: Minář
    vybral 7 milionů Kč na projekt nové politické strany — stranu však nikdy nezaložil. Rajchl uvádí,
    že PRO (která se do sněmovny dostala) stálo ho za zakladatelský kapitál cca 100–150 tisíc Kč. Minář
    přitom kritizuje Rajchla za to, že jako bohatý člověk bojuje za chudé — Rajchl oponuje příklady Kennedyů,
    Trumpa a Babiše.'
  citace:
  - text: Ty ses chceš vysmívat někomu, kdo je předsedou politické strany, kterou si sám, se svými spolupartnery,
      prostě dokázal někam dostat. Ty, který si vzal sedm milionů korun a vůbec si ji nezaložil. Proto
      tě nazývám Mikuláš defraudautem.
  podtema: Prezident a demokracie
