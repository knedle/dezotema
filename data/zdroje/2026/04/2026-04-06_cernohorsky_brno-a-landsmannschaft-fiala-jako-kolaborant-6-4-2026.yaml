- id: cernohorsky-2026-04-06-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  - kauzy
  nadpis: Posselt v Pohořelicích — veřejné projevy za zrušení dekretů
  text: Černohorský zmiňuje konkrétní řeči Bernda Posselta v Pohořelicích (v rámci akcí financovaných
    z veřejných prostředků přes Meeting Brno), v nichž Posselt veřejně volá po zrušení Benešových dekretů
    a poukazuje na nutnost „historického smíření" s přerozdělením majetku. Pokusy občanů zjistit detaily
    přes zákon o svobodném přístupu k informacím narazily na finanční bariéry (tisíce Kč za pětileté výpisy,
    přes 100 tisíc za desetileté záznamy). Viz také [Kauzy — Meeting Brno](/temata/kauzy/2026.md#cernohorsky-2026-04-02-05).
  osoby:
  - osoba: bernd-posselt
    vztah: negativni
    kontext: Předseda Sudetoněmeckého Landsmannschaftu; veřejně volá po zrušení Benešových dekretů na
      akcích financovaných z ČR
  podtema: Bernd Posselt a požadavky na zrušení dekretů
- id: cernohorsky-2026-04-06-02
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Fiala v projektu „Pan Evropa" — spojení s Posseltovou agendou od mládí
  text: Jiří Černohorský tvrdí, že Petr Fiala není spojen s Landsmannschaftem a Bernd Posselt náhodně
    ani jen jako premiér — jde podle něj o dlouhodobé propojení. Posselt byl dle Černohorského součástí
    projektu „Pan Evropa" již v době, kdy se do tohoto projektu zapojil mladý Fiala; Havel a Schwarzenberg
    prý v 80. letech cestovali do Německa s výslovným záměrem připravit prolomení Benešových dekretů.
    Černohorský to označuje za důkaz, že dnešní politické kroky jsou výsledkem desetiletí plánování.
  osoby:
  - osoba: petr-fiala
    vztah: negativni
    kontext: Označen za „kolaboranta" — od mládí zapojen v projektu Pan Evropa s Bernd Posseltrem
  - osoba: vaclav-havel
    vztah: negativni
    kontext: V 80. letech cestoval do Německa s cílem připravit prolomení Benešových dekretů
  - osoba: karel-schwarzenberg
    vztah: negativni
    kontext: V 80. letech cestoval s Havlem do Německa s cílem připravit prolomení Benešových dekretů
  podtema: Politici a Landsmannschaft
- id: cernohorsky-2026-04-06-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Pekarová: plat 394 tisíc + „dejte si dva svetry" (Černohorský)'
  text: 'Černohorský se vrací k tématu platů politiků s aktualizovanými čísly: předsedkyně sněmovny Markéta
    Pekarová Adamová pobírá 394 000 Kč měsíčně (přidala si z dřívějších 350 000 Kč). Zároveň veřejně vyzývala
    občany, kteří si nestěžují na ceny energií, aby si oblékli dva svetry. Tuto kombinaci Černohorský
    komentuje vulgarismem „ludra" a označuje za symbol morálního bankrotu vládnoucí politické třídy.'
  osoby:
  - osoba: marketa-pekarova-adamova
    vztah: negativni
    kontext: Označena za „ludru" — plat 394 tis./měs. + vyzývá občany „dejte si dva svetry"
  podtema: Sociální politika — senioři
- id: cernohorsky-2026-04-06-04
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Zelenský vyhrožuje Orbánovi — EU nečinná a blokuje jeho sítě
  text: Černohorský uvádí, že Volodymyr Zelenský veřejně vyhrožoval Viktoru Orbánovi a jeho rodině — Evropská
    unie na to nereagovala a žádný z jejích lídrů Zelenského neodsoudil. Zároveň tvrdí, že EU zablokovala
    přítomnost Orbána na sociálních sítích, zatímco Zelenský si dělá, co chce. Tuto asymetrii označuje
    za důkaz, že EU slouží ukrajinskému a ne unijnímu zájmu.
  osoby:
  - osoba: viktor-orban
    vztah: pozitivni
    kontext: Zelenský mu vyhrožoval a EU nijak nezasáhla; EU blokuje jeho sociální sítě — Černohorský
      to označuje za skandál
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: Veřejně vyhrožoval Orbánovi a jeho rodině; EU nezasáhla a blokovala naopak Orbánovy sítě
  podtema: EU jako vojenská struktura
