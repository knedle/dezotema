- id: zitko-2026-04-01-03
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Rajchl slíbil pomoc s prezidentským dopisem — a nesplnil
  text: 'Peková na akci v Soběšovicích uvádí, že se spoléhala na Jindřicha Rajchla, který na semináři
    o COVID-19 ve sněmovně (26. 1. 2026) veřejně prohlásil, že se celou svojí osobností za petici k prezidentovi
    postaví. Peková proto nikoho jiného neoslovila. Rajchl nakonec nepomohl, proto petici organizuje sama
    po své ose. Při hledání mezinárodní podpory kontaktovala i Alaina Berseta (generální sekretář Rady
    Evropy, bývalý švýcarský ministr zdraví, „sám těžký covidián"), Barackou Obamovu nadaci a ruskou ambasádu
    — vše bez praktického výsledku. Jako filosofický postoj uvádí: „Tuto hru v tuto chvíli není možné
    objektivně vyhrát, ale není možné ji nehrát."'
  osoby:
