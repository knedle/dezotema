  nadpis: Minář šířil dezinformace na Letné — výzva k rezignaci
  text: 'Rajchl v krátkém videu (8 sekund) reaguje na výrok Mikuláše Mináře proneseného na demonstraci
    Letná 2026, kde Minář tvrdil, že Rajchl nosí boty z krokodýlí kůže. Rajchl to označuje za lež a prokazatelnou
    dezinformaci — demonstruje divákům svůj skutečný pár obnošených second-hand bot s padající podrážkou.
    Aplikuje na Mináře jeho vlastní princip rovného metru: pokud Minář od jiných vyžaduje rezignaci za
    veřejné lži, sám by rezignovat měl.'
  podtema: Prezident a demokracie
