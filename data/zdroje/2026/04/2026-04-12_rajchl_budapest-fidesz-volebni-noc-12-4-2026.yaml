  nadpis: 'EU vydírá Maďarsko: přijmout 21 000 migrantů, nebo zaplatit 10 miliard Kč'
  text: 'Rajchl v živém vysílání z Budapešti (12. 4. 2026) popisuje konkrétní příklad bruselského vydírání:
    EU dala Maďarsku ultimátum — buď přijme přibližně 21 000 muslimů v rámci migračního paktu, nebo zaplatí
    pokutu ve výši přibližně 10 miliard Kč. Rajchl to uvádí jako přímý důkaz, proč je zásadní, aby V4
    zůstalo jednotné a nepodlehlo bruselskému tlaku — bez Orbána a Maďarska by ČR neměla spojence, kteří
    takový příkaz odmítají.'
  podtema: Evropský parlament a V4 strategie
