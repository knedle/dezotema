  nadpis: 'Ceny Anděl: vulgární výstupy vůči politikům — argument pro zrušení ČT poplatků'
  text: 'Rajchl v živém vysílání z Budapešti (12. 4. 2026) zmiňuje galavečer Cen Anděl, kde účinkující
    adresovali přítomným politikům vulgární a hanlivé vzkazy. Tuto událost využívá jako argument pro zrušení
    povinných televizních poplatků: veřejnoprávní média podobné výstupy nekritizují ani nekorigují, a
    tím de facto legitimizují útoky na politické představitele, za jejichž přenos občané platí z vlastní
    kapsy.'
  podtema: Česká televize a mainstreamová média
