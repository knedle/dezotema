    (Dubrovník, Trojmoří summit, Babiš); SAE opouští OPEC a OPEC+; estonský prezident: válka mohla skončit
    2022; Merz: Ukraina nevstoupí do EU 2027–2028 bez územních ústupků; Trump Merzovi: starej se o Německo,
