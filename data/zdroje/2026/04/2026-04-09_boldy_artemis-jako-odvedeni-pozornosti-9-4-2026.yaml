  nadpis: Artemis jako AI podvod — Trump hrozí vymazáním civilizace (Boldy)
  text: Boldy tvrdí, že záběry mise NASA Artemis jsou AI-generované záběry ze starých archivů — mise slouží
    jako odvedení pozornosti veřejnosti od skutečného dění. Za skutečně závažnou ignorovanou zprávu označuje
    výrok Donalda Trumpa, v němž pohrozil „vymazáním celé civilizace" — média ho podle Boldyho záměrně
    přešla. Zpochybňuje, zda Trump přednášející v Bílém domě je skutečná osoba, nebo klon či robot. Blížící
    se ekonomická krize (viz níže) je dle Boldyho právě tím, co elity zakrývají mediálním spektáklem kolem
    vesmírných misí.
  podtema: Elity a jejich plány
