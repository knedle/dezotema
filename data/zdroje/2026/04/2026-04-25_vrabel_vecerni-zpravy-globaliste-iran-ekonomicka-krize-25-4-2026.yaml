vyroky:
- id: vrabel-2026-04-25-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: EU ekonomika v sutinách — ztráta levných ruských energií jako příčina krize
  text: |-
    Ladislav Vrabel v krátkém analytickém blogu k hospodářské situaci Evropy (25. dubna 2026) tvrdí, že evropská ekonomická prosperita byla po druhé světové válce postavena na jednom základním modelu: nakoupit levné energie (plyn a ropu) z Ruska, vyrobit z nich kvalitní výrobky (zejména německá auta) a prodat je do světa za prémiové ceny. Odpojením od ruských energií od roku 2022 tento model definitivně skončil. Výsledkem je ekonomika bez konkurenční výhody: německé automobilky propouštějí, čínský BYD nabízí automobily za ceny, se kterými Evropa bez levné energie nedokáže soutěžit.

    Christine Lagarde, prezidentka ECB, dle Vrabela varovala, že situace se v příštích měsících nezlepší a nelze vyloučit zavedení přídělů potravin v Evropě.

    Jako příklad fungující alternativy cituje Srbsko: prezident Vučić vyjednal přímo s Putinem prodloužení kontraktu na dodávky plynu na tři měsíce za zhruba 50 % tržní ceny — aby doplnil zásobníky po zimě. Vrabel tvrdí, že česká vláda by mohla učinit totéž, ale nemá politickou vůli.
  citace:
  - text: Tohle je model, na kterém Evropa zbohatla od druhé světové války. Bohužel Evropa od roku 2022
      nemá plyn... to znamená, Evropa musí jít teď bojovat do Hormuzského průlivu, aby si vybojovala nějaký
      plyn.
  osoby:
  - osoba: christine-lagarde
    vztah: neutralni
    kontext: 'Citována jako zdroj: ECB prezidentka varuje před nezlepšením energetické situace a možnými
      příděly potravin'
  podtema: Rusko a energetická krize EU
- id: vrabel-2026-04-25-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: JP Morgan investuje do evropské obrany — „globalisté financují válku jako za Hitlera"
  text: Vrabel komentuje zprávu o tom, že JP Morgan Chase plánuje investovat 1,5 bilionu USD do strategických
    projektů v Evropě — v oblastech obrany, energetiky, infrastruktury a umělé inteligence. Tuto investici
    interpretuje jako důkaz, že velké globalistické korporace záměrně financují zbrojní průmysl a připravují
    válku v Evropě — přičemž přirovnává situaci k tomu, jak americké firmy (Coca-Cola a další, přes švýcarské
    fondy) financovaly Hitlera a druhou světovou válku. Současná Evropa přešla na model ekonomiky postavené
    na výrobě zbraní, protože svůj původní model (levné energie + qualitní výrobky) ztratila.
  podtema: Rusko a energetická krize EU
- id: vrabel-2026-04-25-03
  typ: predikce
  temata:
