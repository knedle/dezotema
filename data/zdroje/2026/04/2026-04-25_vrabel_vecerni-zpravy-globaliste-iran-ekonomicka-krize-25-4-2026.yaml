  nadpis: Příděly potravin v Evropě
  text: Evropu čeká ekonomická krize hlubší než v době COVIDu, přičemž nelze vyloučit zavedení přídělů
    potravin — toto varování cituje z vystoupení Christiny Lagarde (prezidentky ECB).
