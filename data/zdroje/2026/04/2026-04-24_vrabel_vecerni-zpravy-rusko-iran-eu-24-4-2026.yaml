- id: vrabel-2026-04-24-02
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Predikce: Rusko zaútočí na Evropu v létě 2026 — Vrabel'
  text: |-
    Vrabel ve večerním vysílání (24. 4. 2026) predikuje s „velmi vysokou pravděpodobností", že Rusko v létě 2026 podnikne útok na evropská území mimo Ukrajinu — konkrétně zmiňuje jako nejpravděpodobnější cíle Německo, Francii nebo Británii. Logiku útoku vysvětluje takto: pokud Rusko usoudí, že Evropa aktivně válčí proti Rusku přes Ukrajinu, může dospět k závěru, že preventivní úder na zdroj (evropské zbrojní kapacity, velitelství) je strategicky výhodnější než čekat na přímý útok z Evropy. Cituje Scotta Rittera jako experta, který hovoří o rozhodující letní ofenzívě.

    Vrabel uvádí tři podmínky, které mu celkový scénář potvrzují: (1) NATO je fakticky „papírový drak" bez USA (Trump o tom mluvil otevřeně), (2) USA nezasáhne (nepomohly ani při útoku na Írán), (3) Rusko ekonomicky vydělává i přes sankce — je na koni, neporazitelné a uklidnit se nechce.
  osoby:
  - osoba: scott-ritter
    vztah: pozitivni
    kontext: Citován jako autoritativní vojenský expert — Ritter předpovídá rozhodující ruskou ofenzívu
      léto 2026
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-04-24-03
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Rusko zaútočí na Evropu v létě 2026
  text: Rusko s „velmi vysokou pravděpodobností" podnikne v létě 2026 útok na evropská území mimo Ukrajinu
    — pravděpodobně na Německo, Francii nebo Británii. Vrabel vychází z analýzy Scotta Rittera o plánované
    rozhodující ofenzívě a z vlastního přesvědčení, že Evropa se fakticky stala stranou konfliktu tím,
    že vyrábí zbraně a financuje Kyjev. Rusko zároveň spoléhá na nezasáhnutí USA (Trumpův výrok o NATO
    jako „papírovém drakovi").
