  temata:
  - covid-vakciny
  nadpis: Šarže označené „E" jako extrémně smrtelné
  text: Zítko tvrdí, že koncentrace škodlivých složek v COVID vakcínách se mezi šaržemi lišila až stonásobně.
    Šarže označené písmenem „E" podle něj znamenají „extrémně smrtelné" — syndromy náhlého úmrtí kojenců
    (SIDS) i dospělých (SADS) jsou svázány zejména s těmito šaržemi.
  podtema: Šarže vakcín
