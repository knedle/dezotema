  nadpis: Trojnásobně nižší mzdy při stejných cenách — ČR jako ekonomická kolonie
  text: 'Rajchl v krátkém videu z 9. dubna 2026 rozvíjí argument ekonomické kolonizace ČR novým způsobem:
    česká kupní síla je zhruba třetinová oproti německé, přestože ceny v obchodech jsou srovnatelné. Jako
    příklad uvádí pokladní v Lidlu — česká a německá prodávají stejný objem zboží za stejné ceny, ale
    česká dostává třetinový plat. Dříve, kdy byly ceny v ČR třikrát nižší, byl nižší plat adekvátní; dnes
    tomu tak není. Situaci označuje za postavení „skutečné ekonomické kolonie": naprostá většina hodnoty
    práce občanů neslouží k rozvoji ČR, ale k obohacení Západu. Vzájemný vztah byl symetrický, dnes je
    asymetrický. K tomu přidává migrační pakt jako další křivdu: ČR nenesla odpovědnost za migrační vlnu
    způsobenou německou politikou „wir schaffen das", přesto po ní chce EU, aby za ni platila.'
  podtema: Česká suverenita
