  - dsa-cenzura
  nadpis: Změna trestního zákoníku v oblasti svobody slova do konce dubna 2026
  text: Ministr spravedlnosti Jeroním Tejc v reakci na interpelaci Zuzany Majerové avizoval, že vláda
    připravuje změnu trestního zákoníku, která zúží okruh trestných činů postihujících výroky, a návrh
    zveřejní „možná už konec tohoto měsíce" (tj. do konce dubna 2026).
  citace:
  - text: My skutečně plánujeme změny... navrhujeme, aby v oblasti trestního práva se zůžil počet oblastí,
      za které by mohl být daný člověk ve chvíli, kdy se vyjadřuje, postižen. Myslím si, že to bude možná
      už konec tohoto měsíce.
