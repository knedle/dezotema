  nadpis: Petr Pavel lže o Ústavě — frackovitost a summit NATO v Ankaře (9. 4. 2026)
  text: 'Rajchl v krátkém videu z 9. dubna 2026 kritizuje chování Petra Pavla, který si „vydupával" účast
    na summitu NATO v Ankaře. Označuje to jako „frackoství" přesahující veškerou míru důstojnosti hodné
    prezidenta. Tvrdí, že Pavel opakovaně lže o Ústavě: zahraniční politiku a složení delegace na summitu
    NATO určuje vláda ČR, nikoliv prezident — žádný právní nárok neexistuje. Jako analogický případ uvádí
    kauzu Filipa Turka, kdy Pavel rovněž prý ohýbal Ústavu a tiskovou konferencí s ohlášením trestního
    oznámení na Macinku skončila do ztracena.'
  citace:
  - text: Aby se přestal chovat jako král a šašek v jednom.
