vyroky:
- id: tarabova-2026-04-26-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Sjezd Landsmannschaftu v Brně — německý ministr vnitra a bavorský premiér jako hosté
  text: 'Tarabová v nedělním vysílání z 26. dubna 2026 informuje o nové eskalaci: bylo potvrzeno, že sjezd
    Landsmannschaftu v Brně (22.–24. 5. 2026) navštíví německý ministr vnitra a předseda Bavorské spolkové
    vlády. Tarabová je označuje za „opravdu zásadní figury", které dodávají celé akci „na mnohem vyšší
    relevanci." Hodnotí to jako přímý politický tlak Německa na ČR a v kontextu nevyplacených válečných
    reparací za nepřijatelné.'
  podtema: Sudetoněmecký sjezd v Brně 2026
- id: tarabova-2026-04-26-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Ukrajinskí migranti — napětí a „servilita"
  text: 'Tarabová přidává konkrétní bezpečnostní rozměr (26. 4. 2026): od roku 2022 dramaticky narůstá
    kybernetická kriminalita — telefonní šmejdi se vydávají za bankéře nebo policisty a vylákávají peníze
    od seniorů. Odborníci na kyberbezpečnost toto narůstání přímo spojují se začátkem ukrajinské migrace.
    Vedle toho část Ukrajinců pobírá sociální dávky neoprávněně: fyzicky pobývají na Ukrajině a jednou
    měsíčně přijíždějí dávky vyzvednout. Státní týmy přitom monitorují „nebezpečné komentáře na internetu"
    místo vyšetřování zmíněné kriminality. Za řešení považuje automatické vyhoštění všech cizinců, kteří
    na území ČR spáchají trestný čin.'
- id: tarabova-2026-04-26-03
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Petr Pavel a „Spojené státy evropské" — útok na českou suverenitu (26. 4. 2026)
  text: Lenka Tarabová označuje Pavlovo veřejné „vyhlášení budoucího směřování do Spojených států evropských"
    za „naprosto nepokrytý kolaborantský útok na svrchovanost České republiky." Faktický zánik ČR jako
    samostatného státu by podle ní znamenal návrat do horší pozice, než jakou měla v Rakousku-Uhersku.
    Označuje to za „poplivání" Masaryka, Beneše, Štefánika, Kramáře a Rašína — kteří český stát budovali
    za cenu riskování životů (Rašín a Kramář byli Habsburky odsouzeni k trestu smrti). Pavel, Piráti a
    STAN se podle Tarabové snaží to, co bylo za 110 let vydobyto, „zašlapat do země a vrátit nás do nějakého
    většího evropského subteritoria, kde bychom nerozhodovali vůbec o ničem."
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Kolaborantský útok na svrchovanost ČR" — vyhlásil směřování do Spojených států evropských,
      čímž by fakticky zanikla ČR
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
