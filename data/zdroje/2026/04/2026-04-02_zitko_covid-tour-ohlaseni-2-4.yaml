  nadpis: Přistání na Měsíci jako podvod — NASA Artemis jako pokračování
  text: Pavel Zítko označuje přistání na Měsíci (Apollo) za historický podvod a misi NASA Artemis za jeho
    pokračování. Odkazuje se na Stanleyho Kubricka, o němž tvrdí, že původní přistání natočil jako fikci,
    podepsal 88stránkovou dohodu o mlčenlivosti na 15 let, a po jejím vypršení zahrnul do posledního filmu
    (*Eyes Wide Shut*) jména aktérů — načež zemřel na infarkt, který mohl být vyvolán CIA injekční látkou
    způsobující srdeční selhání.
  podtema: Historické konspirační výklady
