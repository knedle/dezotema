  nadpis: Politici dostali placebo — vakcínové šarže byly záměrně odlišné
  text: 'Zítko tvrdí, že Babišova vláda — včetně poslanců, senátorů a jejich rodin — dostala při očkování
    v roce 2020 záměrně odlišné injekce: ne připravené vakcíny, ale placebo, vitamín C nebo vitamín B12.
    Cílem bylo budovat důvěru veřejnosti — pokud by politici po očkování zemřeli, vyslali by jasný varovný
    signál, pokud by přežili bez újmy, potvrdilo by to bezpečnost vakcíny. Výběr šarží měl být záměrný:
    politici dostali bezpečné látky, ostatní obyvatelstvo ostré šarže.'
