  nadpis: Kolaborant = kdo chce euro a zrušení veta, ne kdo jedná s Ruskem
  text: 'Rajchl v krátkém videu z 11. dubna 2026 přeformuloval pojem „kolaborace" v reakci na diskusi
    o Maďarsku: za kolaboranta neoznačuje toho, kdo obchoduje s Ruskem nebo hájí maďarské právo veta,
    ale toho, kdo chce nutit ČR přijmout euro a zrušit právo veta v EU. Tím přímo napadá oponenty označující
    ekonomické kontakty s Ruskem za kolaboraci. Jako „neférové zasahování" označuje aktivity EU prostřednictvím
    paktu DSA a tajných služeb ve volbách v Maďarsku — oproti tomu otevřenou americkou podporu konzervativní
    vlády považuje za standardní politiku; o tomto rozdílu mluvil i JD Vance.'
  citace:
  - text: Na rozdíl od vás, který byste nám chtěl nutit euro a zrušit právo VETA, to je vlastní zrada,
      to je kolaborace.
