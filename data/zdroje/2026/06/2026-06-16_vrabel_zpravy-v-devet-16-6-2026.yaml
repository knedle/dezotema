  nadpis: 'Británie: Liz Truss („migrace jako zbraň"), Tommy Robinson a policejní brutalita — Vrabel (16.
    6. 2026)'
  text: Vrabel cituje bývalou britskou premiérku **Liz Truss**, která prý otevřeně obvinila „globalistické
    elity", že využívají masovou migraci jako zbraň k oslabení národních států a zničení západní civilizace
    zevnitř; instituce řízené „levicovou ideologií" potlačují diskusi o roli migrace v růstu kriminality
    a umlčují ty, kdo na to upozorňují. Připomíná opakované zatýkání aktivisty **Tommyho Robinsona** (i
    historku, kdy byl zatčen on, nikoli odsouzení pachatelé groomingu) a pouští videa britské **policejní
    brutality** (vlečení plačícího pětiletého dítěte do auta při zatýkání otce, výhrůžky slzným plynem
    matce s miminkem; demonstrant sražený o ocelovou tyč). Paralelu vidí v ČR (vlastní zkušenost z demonstrace
    — policie pustila ukrajinského útočníka a zatkla jeho). Cituje Trumpa („Evropa páchá sebevraždu")
    a opakuje tezi, že jediná ochrana ČR je odstřižení od EU; varuje před občanskou válkou a vyzývá k
    protestům „dokud je čas".
