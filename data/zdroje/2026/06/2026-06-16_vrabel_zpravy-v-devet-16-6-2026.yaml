  nadpis: 'Írán memorandum: detaily a Izrael jako překážka — Vrabel (16. 6. 2026)'
  text: 'Vrabel po prostudování vojenských analytiků upřesňuje stav íránské dohody: nejde o mír, ale o
    **memorandum o porozumění** (obsah neznámý); Hormuz má být otevřen „v příštích dnech", ale konečná
    dohoda se bude vyjednávat **60–90 dní**. Írán prý odmítá zastavit obohacování uranu a požaduje uvolnění
    zmrazených aktiv (Západ jich od ~2015 zadržel 120–150 mld. $; mělo by se uvolnit ~10 %, cca 6,6 +
    6,6 mld. — jde o íránské peníze, ne americké, jako kdysi Obamovy „palety hotovosti" po prohře v Haagu).
    Trump pohrozil, že pokud Írán získá/vyvine jadernou zbraň, „zažije peklo". Klíčová podmínka Íránu:
    zastavení útoků na Libanon — což Izrael odmítá (Netanjahu: „není to konec konfliktu", chce pád íránského
    režimu). Írán navíc nově chce **Rusko a Čínu jako garanty** dohody — porušení by pak mohlo vést k
    velkému konfliktu. Vrabel uzavírá, že ani jedna strana neslevila ze stanovisek a není jisté, že dohoda
    dopadne.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-16-02
