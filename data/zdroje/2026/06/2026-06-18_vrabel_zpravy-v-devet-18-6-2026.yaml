  nadpis: Palantir/Anthropic a technologická suverenita EU — Vrabel (18. 6. 2026)
  text: 'Francouzská zpravodajská agentura ukončila smlouvu s americkým Palantirem a nahradila ho domácím
    konkurentem; obavy o technologickou suverenitu EU vzrostly poté, co USA zablokovaly cizincům přístup
    k „hraničním modelům" společnosti Anthropic. Francie i Německo navíc přecházejí ve veřejné správě
    z Windows na Linux/open source. Vrabel to čte jako boj o moc mezi „nejvyššími patry globalistů" v
    USA a EU (USA odposlouchávaly i spojence za Merkelové) a jako rozdělení digitálního světa: Evropa
    nechce být přímo kontrolována a řízena z USA. Varuje ale, že to neznamená svobodu — kontrolu nad daty
    a chováním občanů jen převezme EU místo USA.'
- id: vrabel-2026-06-18-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: EU zúží dočasnou ochranu pro ukrajinské muže (18–60) — Vrabel (18. 6. 2026)
  text: Evropská komise chce prodloužit dočasnou ochranu pro uprchlíky z Ukrajiny, ale zúžit její rozsah
    — Německo a další státy podporují omezení pro muže ve vojenském věku (uváděno 23–60, resp. 18–60),
    zejména pro nově příchozí. Vrabel to čte jako krok, jak ukrajinské muže schopné boje „posílat na frontu".
    Zároveň opakuje, že vytvořením dočasné ochrany se Ukrajinci trvale přesunuli do hostitelských zemí
    (ČR, Polsko) a „už nikdy neodejdou", čímž se tyto země „rozbily". Komentuje fotku Ursuly von der Leyen
    s ukrajinskou (ne unijní) vlajkou na prsou — „kouká na mě peklo".
- id: vrabel-2026-06-18-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Rostoucí policejní brutalita na „globalistickém Západě" — Vrabel (18. 6. 2026)
  text: 'Vrabel upozorňuje na případ, kdy německá policie zmlátila a zadržela Poláky, kteří se chtěli
    pomodlit a zanechat kříž na hřbitově v Berlíně (vyvolalo reakce v Polsku i Německu). Zasazuje to do
    vzorce, kterého si všímá „poslední týdny": výrazně zvýšená policejní brutalita na Západě — vedle Německa
    i v Británii a u propalestinských demonstrací proti izraelským útokům na Gazu. Vyvozuje, že „globalistický
    Západ" dává policii pokyn být brutální.'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-06-18-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: '⚡ Konflikt: Haagský rozhodčí rozsudek o Krymu (15. 6. 2026) — Vrabel vs. Zítko'
  text: |-
    **Vrabel (18. 6.):** vyvrací zprávu kolující mezi „vlastenci", že soud prý rozhodl, že Krym patří Rusku. Vysvětluje rozdíl mezi **rozhodčím soudem** (jurisdikci má jen takovou, jaká mu je smluvně svěřena) a mezinárodním soudem. Šlo o spor z bilaterální smlouvy o užívání Kerčského mostu a okolních vod (rozsudek ~480 stran); Ukrajina uspěla jen v jediném bodě (Rusko nedodalo všechny zprávy dle směrnice o životním prostředí), v ostatních nárocích neuspěla. Soud podle něj výslovně konstatoval, že **nemá jurisdikci** rozhodovat o tom, komu Krym patří: „žádný soud nerozhodl, že Krym je ruský".

    **Zítko / ČsTV2 (18. 6. večer):** tentýž rozsudek prezentuje jako „právní knockout" a velkou porážku Ukrajiny i Západu. Tvrdí, že panel pěti rozhodců (Alžírsko, UK, Mexiko, Rusko, Korea) po 10 letech (2016–2026) jednomyslně rozhodl ve prospěch Ruska: zamítl ukrajinské nároky na zdroje vod Krymu a Azovu, reparace, mezinárodní status Kerčského průlivu pro vojenské lodě i demontáž Krymského mostu a uznal **Azovské moře za vnitřní vody Ruska** (most i inspekce plavidel legální). Doplňuje, že dle čl. 106–107 Charty OSN je Rusko jako nástupnický stát SSSR oprávněno „zasáhnout proti nacismu kdekoli". Západní média podle něj o rozsudku mlčí.

    Jádro sporu: zda rozsudek čehokoli „rozhodl o příslušnosti Krymu" (Zítko: ano, ve prospěch Ruska) nebo šlo jen o dílčí námořní spor bez jurisdikce nad svrchovaností (Vrabel).
  podtema: Příčiny a odpovědnost za válku
- id: vrabel-2026-06-18-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'PURL a „NATO Review 3.0": USA přesouvá zbrojení i riziko na Evropu (Vrabel, 18. 6. 2026)'
  text: 'K iniciativě **PURL** (evropští spojenci nakupují americké zbraně pro Ukrajinu) a oznámení ministra
    války Petea Hegsetha Vrabel popisuje měnící se model financování války: USA chtějí jen dodávat zbraně
    a inkasovat, kdežto „umírat mají Evropané". Dodávky raket mohou mít formu licence/komponentů s výrobou
    v Evropě a na Ukrajině (rozjezd 6–18 měsíců). Rutte oznámil okamžité omezení amerického příspěvku
    do krizových sil NATO (mezeru zaplní evropští spojenci) a „NATO Review 3.0" — půlroční inspekci amerických
    sil v Evropě s cílem nezvratně přesunout vedoucí roli na Evropu („největší transformace v historii
    NATO"). Vrabel to čte tak, že vzniká „nová forma NATO": Evropa jako „Eastern flank", kde budou vojáci
    přímo v případném konfliktu s Ruskem, zatímco USA zůstanou „za vodou".'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-18-08
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Útoky na Moskvu jako eskalace „NATO/EU vs. Rusko"; analogie Jugoslávie 1999 (Vrabel, 18. 6.
    2026)
  text: 'K opakovaným ukrajinským dronovým útokům na ropnou rafinérii u Moskvy (černý kouř nad městem,
    „déšť ropy" v některých čtvrtích) Vrabel tvrdí, že jde o „zprávu, která mění situaci na bojišti":
    drony se vyrábějí v Německu a dalších zemích EU (financováno i z fondů, kam přispívá ČR), takže nejde
    o „jen ukrajinské", ale o útoky **Ukrajiny a NATO**. Protože Rusko zatím neodpovědělo, útočník „získává
    chuť" a útočí brutálněji. Přirovnává to k zahájení bombardování Jugoslávie NATO v roce 1999 (rafinérie
    Pančevo u Bělehradu). Predikuje, že Rusko brzy „přizná", že už neválčí s Ukrajinou, ale s EU a NATO,
    a začne se tvrdě bránit (cituje Solovjova: ze střetu se stala konfrontace s celým NATO). Doplňuje
    další „teroristické" útoky: ukrajinský dron zabil civilního řidiče kamionu (Belgorod) a autobus s
    běloruskými dětmi (Brjansk) — Lukašenko to označil za „otevřený fašismus".'
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-06-18-09
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Putin na summitu Rusko–ASEAN: Rusko není izolované (Vrabel, 18. 6. 2026)'
  text: K účasti Vladimíra Putina na plenárním zasedání summitu Rusko–ASEAN v Kazani (35 let vztahů, ~10
    zemí jihovýchodní Asie) Vrabel argumentuje, že Rusko není izolovaná země, jak tvrdí čeští politici
    a EU („zemljanka, kde vybírají čipy z praček"), ale největší země světa a stále významný světový politický
    hráč. Summit bere jako důkaz šíře ruských mezinárodních vazeb.
  podtema: Zahraniční aktéři a precedenty
