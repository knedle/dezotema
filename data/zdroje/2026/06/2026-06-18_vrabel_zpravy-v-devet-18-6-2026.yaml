  nadpis: Izrael přerušil kontakt s Kallas; Vrabel paradoxně za Kallas proti české vládě (18. 6. 2026)
  text: 'Po výrocích Kaji Kallas přirovnávajících izraelské zacházení s Palestinci k apartheidu izraelský
    ministr zahraničí Gideon Sa''ar oznámil ukončení veškerého kontaktu s ní. Vrabel — jinak Kallas ostře
    kritický — v této věci stojí za jejím postojem: Izrael podle něj „provádí genocidu" v Gaze a Libanonu,
    zatímco česká vláda (Babiš, Macinka) deklaruje bezvýhradnou podporu Izraele a hodlá vetovat evropské
    rezoluce. Doplňuje, že Izrael porušil příměří dvojitým útokem na civilní vozidlo a poté na zdravotníky.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-18-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Írán bude vybírat poplatky v Hormuzu; tři neslučitelné pozice (Vrabel, 18. 6. 2026)
  text: 'Íránský parlamentní předseda Ghalibaf potvrdil, že Írán bude vybírat poplatky za průjezd Hormuzským
    průlivem — což Vrabel předpovídal (a Macron tvrdil opak). Trump zároveň stáhl požadavek, aby se Írán
    vzdal balistických raket (silný konvenční odstrašující prostředek prý snižuje potřebu jaderného).
    Írán nepovažuje mír za uzavřený, dokud Izrael neopustí Libanon; Netanjahu odmítá stáhnout vojska z
    jižního Libanonu. Vrabel shrnuje tři neprotínající se pozice: Írán (zmrazená aktiva, konec sankcí,
    volný obchod, poplatky, odchod USA z BV, konec války v Libanonu/Gaze) × USA (Írán bez suverenity a
    obohacování uranu, poplatky pro USA) × Izrael (likvidace íránského režimu, pokračování války) — jediný
    společný bod je otevřený Hormuz kvůli penězům; Izrael je „rušivý element", který nechce konec konfliktu.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-18-03
  typ: tvrzeni
