  poznamka: Útoky na Moskvu = eskalace NATO/EU vs. Rusko (analogie Jugoslávie 1999, drony z DE); PURL
    + NATO Review 3.0 (USA přesouvá zbrojení/riziko na Evropu, Eastern flank); Izrael přerušil kontakt
    s Kallas — Vrabel za Kallas proti čes. vládě (genocida Gaza/Libanon); Hormuz poplatky (Ghalibaf) +
    Trump/Írán rakety + tři neslučitelné pozice; EU zúží dočasnou ochranu pro ukr. muže (na frontu), VDL
    s ukr. vlajkou; Putin Rusko-ASEAN (Rusko není izolované); policejní brutalita na Západě (Poláci v
    Berlíně, propalestinské demonstrace); Palantir/Anthropic = tech. suverenita EU (přechod na Linux);
    oprava dezinformace — haagský rozhodčí soud NErozhodl, že Krym je ruský. Zprávy v devět s komentářem
    (moderátorka Zuzka)
