  poznamka: 'Dvě témata: (1) Zklamání z reakce vlastenecké scény na sjezd Landsmannschaftu v Brně (květen
    2026) — kritika Robina Čumpelíka za napadení Konečné/Stačilo na demonstraci; hlavní stížnost, že slíbený
    otevřený dopis s 300–500 tisíci podpisy nikdy nevznikl, akce skončila jen politickými proslovy; vlastenecká
    scéna se tříští na stranické značky (PRO/SPD/Trikolora/Svobodní/KSČM/ČSR) — [benesovy-dekrety.md](benesovy-dekrety.md).
    (2) Eskalace kauzy ÚS/Pavel/Ankara — Pavel by neměl jet vůbec, ÚS „chyboval", skutečným strůjcem je
    lobbista Petr Kolář (obviněn ze zbrojařských kšeftů a profitování z válečných obětí); predikuje, že
    vláda Babiše/Macinky kauzu politicky ustojí — [politicky-system.md](politicky-system.md). **Stoch.
    teror:** explicitní násilné fantazie vůči Petru Pavlovi („nakopal bych tě do prdele, kopal bych tě
    až do Kyjeva") a Petru Kolářovi („vykopal bych ho z hradu, kopal bych ho až do Bruselu"); dehumanizace
    Pavla („jsi míň než hovno v trávě"). Vysvětlení pauzy ve vysílání + pokračování kauzy ÚS/Pavel/Ankara'
