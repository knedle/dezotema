  rezim: standard
  delka: 00:47:48
  poznamka: 'Dvě témata: (1) Zklamání z reakce vlastenecké scény na sjezd Landsmannschaftu v Brně (květen
    2026) — kritika Robina Čumpelíka za napadení Konečné/Stačilo na demonstraci; hlavní stížnost, že slíbený
    otevřený dopis s 300–500 tisíci podpisy nikdy nevznikl, akce skončila jen politickými proslovy; vlastenecká
    scéna se tříští na stranické značky (PRO/SPD/Trikolora/Svobodní/KSČM/ČSR) — [benesovy-dekrety.md](benesovy-dekrety.md).
    (2) Eskalace kauzy ÚS/Pavel/Ankara — Pavel by neměl jet vůbec, ÚS „chyboval", skutečným strůjcem je
    lobbista Petr Kolář (obviněn ze zbrojařských kšeftů a profitování z válečných obětí); predikuje, že
    vláda Babiše/Macinky kauzu politicky ustojí — [politicky-system.md](politicky-system.md). **Stoch.
    teror:** explicitní násilné fantazie vůči Petru Pavlovi („nakopal bych tě do prdele, kopal bych tě
    až do Kyjeva") a Petru Kolářovi („vykopal bych ho z hradu, kopal bych ho až do Bruselu"); dehumanizace
    Pavla („jsi míň než hovno v trávě"). Vysvětlení pauzy ve vysílání + pokračování kauzy ÚS/Pavel/Ankara'
vyroky:
- id: cernohorsky-2026-06-26-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: Zklamání z reakce na sjezd v Brně — slíbený otevřený dopis se nikdy nerealizoval (Černohorský,
    26. 6. 2026)
  text: 'Měsíc po sjezdu Černohorský vysvětluje, proč dočasně přerušil vysílání: zlomilo ho, jak vlastenecká
    scéna kauzu Landsmannschaftu odbyla. Kritizuje výstup aktivisty Robina Čumpelíka, který na akci u
    brněnského výstaviště veřejně napadl Kateřinu Konečnou a hnutí Stačilo za to, že na protest přišli
    s vlastními stranickými tričky — sám ale nechápe tuhle kritiku, protože nedělní shromáždění na Dominikánském
    náměstí (Konečná, Reichel, Zeman, slovenský Bláha) bylo otevřeně politickou akcí od začátku. Hlavní
    zdroj frustrace: čtyřdenní mobilizace lidí do Brna měla vyústit v otevřený dopis podepsaný politiky,
    odborníky a historiky se stovkami tisíc podpisů (300–500 tisíc), adresovaný vládě i opozici s požadavkem,
    aby se podobný sjezd („nacistická prasárna") už nikdy nekonal na území ČR — nic z toho se nestalo,
    akce skončila jen politickými proslovy bez konkrétního výstupu, takže se scénář může opakovat v Liberci
    nebo Chebu. Vidí v tom důkaz, že se vlastenecká scéna nedokáže sjednotit napříč stranickými značkami
    (PRO, SPD, Trikolora, Svobodní, KSČM, Česká společnost Respekt) a přirovnává stranické tříštění k
    dobytku značkovanému plackami.'
  citace:
  - text: Přestaňte se značkovat jako dobytek.
  osoby:
  - osoba: robin-cumpelik
    vztah: negativni
    kontext: Kritizován za veřejné napadení Kateřiny Konečné/Stačilo na brněnské demonstraci kvůli stranickým
      tričkům
  - osoba: katerina-konecna
    vztah: pozitivni
    kontext: Bráněna proti Čumpelíkově kritice — účast na politické demonstraci na Dominikánském náměstí
      byla legitimní
  podtema: Sudetoněmecký sjezd v Brně 2026
- id: cernohorsky-2026-06-26-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Kauza vyvrcholila: Pavel by neměl jet vůbec, skutečným viníkem je lobbista Petr Kolář (Černohorský,
    26. 6. 2026)'
  text: 'Černohorský mění postoj: zatímco dřív kritizoval hlavně ÚS, teď tvrdí, že Petr Pavel by na summit
    NATO do Ankary neměl jet vůbec — i kdyby to ÚS „doporučil", vláda (Andrej Babiš coby nejvyšší ústavní
    činitel v parlamentním systému) by rozhodnutí neměla respektovat, protože ÚS „na to neměl právo" a
    jeho rozhodnutí je „naprostá šaškárna", kterou „právníci rozsekají". Skutečným strůjcem celé kauzy
    podle něj není samotný Pavel („obyčejná loutka/marioneta"), ale poradce Petr Kolář — lobbista, kterého
    obviňuje z domlouvání zbrojařských kšeftů a napojení na „našeho zbrojaře" ziskujícího na válce na
    Ukrajině; Pavlovu přítomnost na summitu považuje jen za záminku, aby se tam Kolář mohl dostat a sjednávat
    provize. Zpochybňuje také oficiální zdůvodnění cesty (čl. 63 Ústavy — reprezentace státu navenek),
    protože o státních zakázkách stejně rozhoduje vláda Babiše, takže Pavel by na summitu „stejně nic
    nezmohl". Zdůrazňuje, že ČR je parlamentní, nikoliv prezidentský systém. Zároveň predikuje, že vláda
    Babiše/Macinky kauzu politicky ustojí navzdory mediální kampani, protože „právní pravda" je na jejich
    straně.'
  citace:
  - text: Petr Pavel do žádné Ankary nepojede. [...] Tohle není o tom, že bych nerespektoval rozhodnutí
      ústavního soudu — to, co předvedl ústavní soud, je naprostá šaškárna.
  osoby:
  - osoba: petr-kolar
    vztah: negativni
    kontext: Označen za skutečného strůjce kauzy Ankara — lobbista domlouvající zbrojařské kšefty, obviněn
      ze „zabíjení dalších a dalších lidí"; terč explicitní násilné fantazie
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Míň než hovno v trávě" — pouhá „loutka/marioneta" Petra Koláře; terč explicitní násilné
      fantazie (vykopání, kopání až do Kyjeva)
  - osoba: petr-macinka
    vztah: pozitivni
    kontext: „Velice inteligentní borec", ne hlupák — jeho ironické výroky („soudruh prezident") interpretovány
      jako záměrné vyjádření zoufalství nad Pavlem
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
