vyroky:
- id: rajchl-2026-06-17-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Dobrovolné poplatky by donutily ČT „bojovat o diváka" — Rajchl (17. 6. 2026)
  text: |-
    Rajchl se vrací k návrhu **dobrovolných koncesionářských poplatků** (viz [Rajchl: dobrovolné poplatky](/temata/media-propaganda.md#rajchl-2026-04-19-02) a [Ipsos 14. 6.](/temata/media-propaganda.md#rajchl-2026-06-14-03)) a označuje je za „to nejlepší možné řešení". Opakuje data Ipsos (15 % důchodců, 40 % studentů by platilo) a odhaduje, že při reálném placení by souhlas klesl pod 10 %. Dva argumenty: (1) politici by ztratili veškerý vliv — nerozhodovali by o rozpočtu ani výši poplatků a ČT by se stala „naprosto nezávislou"; (2) ČT by musela „bojovat o diváka" a nabízet obsah i lidem, kterým dnes „vůbec nic neříká".

    Tvrdí, že ČT dnes „vysílá jenom pro úzkou skupinku euroliberálních oveček", které ostatní povinně platí. Jmenovitě označuje Marka Wollnera, Noru Friedrichovou a Zuzanu Černou (kteří z ČT odešli) za „neúspěšné lidi" se „zkrachovalými projektíky" (u Černé tvrdí sledovanost „asi 20 lidí"). Naopak vyjmenovává novináře, jejichž obsah by si rád zaplatil: Tomáš Paukner, Markéta Dobijášová, Angelika Bazalová (investigativa), Marek Stoniš, Tomáš Kulidakis (politika) a Pavel Štrunz (Echo24).
  citace:
  - text: A proto vysílá jenom pro úzkou skupinku euroliberálních oveček, my ostatní jim to platíme, tuhle
      jich propagandu.
  osoby:
  - osoba: marek-wollner
    vztah: negativni
    kontext: Po odchodu z ČT označen za „neúspěšného" se „zkrachovalým projektíkem"
  - osoba: zuzana-cerna
    vztah: negativni
    kontext: Po odchodu z ČT označena za „neúspěšnou", sledovanost „asi 20 lidí"
  - osoba: tomas-paukner
    vztah: pozitivni
    kontext: Jmenován mezi novináři, jejichž investigativu by si Rajchl rád zaplatil v „nové" ČT
  - osoba: pavel-strunz
    vztah: pozitivni
    kontext: Echo24, vysoká sledovanost — Rajchl by si rád zaplatil jím moderovanou debatu
  podtema: Nová alternativní média
