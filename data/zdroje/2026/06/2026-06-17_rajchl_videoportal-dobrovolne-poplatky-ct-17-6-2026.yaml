  poznamka: 'Návrh dobrovolných koncesionářských poplatků jako „nejlepší řešení" (Ipsos: 15 % důchodců,
    40 % studentů; reálně < 10 %); politici by ztratili vliv, ČT by musela „bojovat o diváka"; kritika
    „euroliberálních oveček", odejdivší novináři (Wollner, Friedrichová, Černá) označeni za „neúspěšné",
    vlastní seznam preferovaných (Paukner, Dobijášová, Bazalová, Stoniš, Kulidakis, Štrunz). „Řešení problému
    s Českou televizí: dobrovolné koncesionářské poplatky"'
