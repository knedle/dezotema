  nadpis: Léky na obezitu pro děti (Novo Nordisk / Wegovy) místo prevence — Tarabová (12. 6. 2026)
  text: 'Lenka Tarabová kritizuje, že premiér Babiš, ministr zdravotnictví Vojtěch a ministr pro prevenci
    a sport Šťastný navštívili nově otevřenou dánskou továrnu firmy Novo Nordisk v Jevanech — která odkoupila
    areál od Novavaxu (dříve vyráběl komponenty pro vakcínu COVID-19) a má vyrábět léky na cukrovku a
    obezitu, včetně pro děti a mládež; Vojtěch slíbil prosadit jejich hrazení z pojištění. Tarabová poukazuje
    na vlastnickou strukturu (nadace Novo Holdings, mezi investory BlackRock a Vanguard) a vyjmenovává
    nežádoucí účinky léku Wegovy (semaglutid, jako Ozempic): od běžných (nevolnost, zvracení, průjem)
    po závažné (zánět slinivky, poškození ledvin, riziko nádoru štítné žlázy u hlodavců, vzácná „oční
    mrtvice" NAION). Argumentuje, že místo „řešení důsledku chemií" by se měla řešit příčina — kvalita
    potravin (éčka, soli), složení nápojů, více hodin tělocviku a vedení dětí k pohybu rodiči. Mluví za
    sebe i za pracovní skupinu pro sport hnutí PRO.'
  citace:
  - text: Takže zase budeme chemií řešit důsledek a nebudeme se zabývat příčinou?
  podtema: Hantavirus
