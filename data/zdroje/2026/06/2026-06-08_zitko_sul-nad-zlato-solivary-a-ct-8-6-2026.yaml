  poznamka: 'Z velké části recap stálých tezí (vlastizrada 1992 / ČSR trvá / korporace a akcionáři, COVID
    jako biologická zbraň/genocida, Deep State, 4. července, adrenochrom/tribunál — nezpracováno). Nové:
    privatizace jako řízená likvidace čs. průmyslu Západem na příkladu Solivary Prešov (Rakušané/Mečiar/J&T/Delaware,
    projekt Zbudza pro ruskou ropu/plyn zmařen, Poldi Kladno, slov. zbrojovky); rozšíření ČT „výpalné"
    (plat GŘ Chudárka 346 800 + bonusy, 3000 vs 500 zaměstnanců, neoprávněné poplatky od 12. 3. 2020).
    Zhlédnutí: 633'
