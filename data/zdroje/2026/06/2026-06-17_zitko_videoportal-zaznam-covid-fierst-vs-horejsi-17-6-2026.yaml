  poznamka: FB zablokoval živé vysílání na 3 kanálech („kyberšikana" za fotku z UFC Freedom 250 s Trumpem)
    = cenzura; rozbor článku Tomáše Fiersta „jak bys řešil covid" (reakce na Václava Hořejšího) + Zítkovy
