  nadpis: 'Babišova tiskovka o vakcínách: vinu hodil na podřízené (Zítko, 3. 6. 2026)'
  text: Zítko komentuje tiskovou konferenci Andreje Babiše k nákupům vakcín. Tvrdí, že Babiš „zahrál neználka"
    — odpovědnost za nákupy svedl na úřednici „paní Baťovou" (jméno, které Zítko slyšel poprvé) a na odborníky
    Romana Chlíbka a Romana Prymulu, sám prý „byl jenom premiér" a nechal se „napálit". Zítko Babiše vyzývá,
    aby šel na rozbor krve v nezávislé laboratoři — ukázalo by se, zda mu skutečně píchli „ostrou" šarži
    (spike proteiny, oxid grafenu), nebo zda dostal „prominentní placebo" (fyziologický roztok), jak Zítko
    předpokládá (navazuje na jeho dřívější tezi, že vláda dostala při očkování placebo, viz [konspiraci
    — Trump-Putin-Xi aliance](konspirace-deep-state-qanon.md#trump-putin-a-xi-jako-koordinovaná-aliance-proti-deep-state--zítko-čte-mcintosh)).
