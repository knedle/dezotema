  poznamka: 'Hlavní bloky: Bitcoin „Blažcoin" (Jiříkovský >100 mld), měnová reforma 1953 + inflace (1
    mld → 8,7 bil.), válečné reparace a ČSR jako trvající stát, Babišova tiskovka o vakcínách, „viry se
    šíří jen TV" + patentované nemoci, Zítkovo odvolání, QAnon (adrenochrom, Bieber/Obama, QFS, 250$ bankovka),
    OSN před kolapsem. Zhlédnutí: 124'
