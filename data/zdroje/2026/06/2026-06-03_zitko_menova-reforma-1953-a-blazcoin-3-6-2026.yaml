  nadpis: 'Zítkovo odvolání: „pravda nemůže být poplašná zpráva" (3. 6. 2026)'
  text: Zítko se vrací ke svému odsouzení — soudkyně Mgr. Iva Dvořáková z Chomutova ho jako „možná jediného
    v Evropě" odsoudila nepodmíněně na tři roky za „šíření poplašné zprávy" v souvislosti s výroky o covidu
    a vakcínách v letech 2020–2023. Zítko trvá na tom, že „pravda nikdy nemůže být poplašnou zprávou,
    tudíž ani trestným činem", tvrdí, že soudkyně porušila jedenáct zákonů (podal trestní oznámení), a
    očekává, že krajský soud v Ústí nad Labem rozsudek v odvolání zruší a přizná odškodnění — vedené prý
    proti více než třiceti osobám napříč ČR i Slovenskem. Zatím mu ale prý žádné předvolání k odvolacímu
    soudu nepřišlo. Odmítá výsměch odpůrců typu „proč Zítko ještě nesedí". Navazuje na dřívější covidové
    rozsudky (viz [Konkrétní případy odsouzených za covidové výroky](#konkrétní-případy-odsouzených-za-covidové-výroky)).
  citace:
  - text: Pravda nikdy nemůže být poplašnou zprávou, tudíž ani trestným činem.
  osoby:
  - osoba: iva-dvorakova
    vztah: negativni
    kontext: Soudkyně z Chomutova — odsoudila Zítka nepodmíněně na 3 roky za „šíření poplašné zprávy";
      dle Zítka porušila 11 zákonů (podal TO)
  podtema: Trestání politického projevu
- id: zitko-2026-06-03-04
  typ: tvrzeni
  temata:
