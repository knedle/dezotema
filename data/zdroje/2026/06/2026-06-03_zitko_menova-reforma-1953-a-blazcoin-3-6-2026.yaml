  nadpis: Měnová reforma 1953 a inflace jako „okrádání" — argument pro hotovost (Zítko, 3. 6. 2026)
  text: 'Zítko připomíná měnovou reformu z konce května 1953 jako „loupež století": prezident Zápotocký
    týden předtím ujišťoval „naše měna je pevná", a pak proběhla výměna většinou v poměru 50:1, která
    připravila Čechoslováky o úspory (následovaly sebevraždy). Z toho rozvíjí tezi o dlouhodobém okrádání
    inflací: z 1 miliardy korun v oběhu (po reformě 1953, pro české země) se prý dostalo na ~8,7 bilionu
    korun v roce 2026 (700–750 mld. hotovosti + ~8 bil. „virtuálních" peněz na účtech) — tedy zhruba 8
    700násobné znehodnocení. Tištění „ničím nekrytých" peněz (zlatý standard zrušen 1971) označuje za
    skrytou loupež úspor a argumentuje pro zákonné právo na hotovost a pro uchování hodnoty ve zlatě/stříbře.
    Navazuje na jeho a Vrabelovu kritiku CBDC/bezhotovostní společnosti (viz [CBDC a digitální euro](digitalni-kontrola.md#cbdc-a-digitální-euro-jako-nástroj-kontroly--velký-reset-vrabel-31-5-2026)).'
  osoby:
  - osoba: antonin-zapotocky
    vztah: negativni
    kontext: Týden před měnovou reformou 1953 ujišťoval „naše měna je pevná" — Zítko uvádí jako klasický
      příklad lži režimu před okradením lidí
- id: zitko-2026-06-03-06
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: Válečné reparace a výzva mocnostem obnovit ČSR (Zítko, 3. 6. 2026)
  text: 'Zítko opakuje svůj výklad, že Německo dluží válečné reparace Československé republice (ne ČR
    ani SR), a přebírá výpočet „hnutí Jasan" (inženýr Jasan): 28–29 bilionů korun ve zlatě (~9 550 tun)
    — což je dle něj víc než deklarované měnové zlato USA (8 311 tun) a víc než „20 bilionů", s nimiž
    operovala Konečná. Opírá se o zákon 11/1918 a pařížskou dohodu z 21. 12. 1945 (náhrada za 360 000
    zabitých Čechoslováků). ČR a SR označuje za „korporace" vzniklé protiprávně 1. 1. 1993 bez referenda,
    zatímco ČSR „nikdy nezanikla". Vyzývá světové mocnosti — Trumpa (USA), Putina (Rusko jako nástupce
    SSSR) a Si Ťin-pchinga (Čína) — aby pomohly obnovit státnost ČSR a vymoci pohledávku v rámci „vojenského
    mezinárodního práva". Rozšiřuje existující výklad (viz [Villa Tugendhat, tři koruny](#villa-tugendhat-tři-koruny-a-možnost-obnovení-čs-občanství--zítko-20-4-a-20-5-2026),
    [Deutschland, Čechland nebo Československo?](#deutschland-čechland-nebo-československo--sdl-sjezd-jako-důkaz-záměny-pojmů-26-5-2026)).'
