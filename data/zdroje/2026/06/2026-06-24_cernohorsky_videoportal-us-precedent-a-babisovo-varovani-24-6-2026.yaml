  poznamka: 'Stejná kauza jako u Rajchla ze stejného dne, jiný úhel: Černohorský líčí sled událostí jako
    podezřelý — vláda odmítne zařadit Pavla do delegace do Ankary, Pavel „pláče" a podává na ÚS „směšnou
    kompetenční žalobu", následně je hotovo „resumé" předjímající rozhodnutí, ačkoliv soud ještě nezasedal.
    Připomíná staré předvolební video Andreje Babiše varující, že pokud se na Hrad dostane „loutka" ovládaná
    Petrem Fialou a DSSS, „utrhne se ze řetězu" — to považuje za naplňující se varování. Hodnotí to jako
    „velice nebezpečný precedent": prezidentský systém začíná bojovat s parlamentní demokracií, „fialovo-modrožlutá
    banda" a „tleskači Milionu chvilek" si to prý neuvědomují. Tematicky → [politicky-system.md](politicky-system.md).
    Bez predikcí a stoch. teroru. Zhlédnutí: 63 951 | Reakce na kauzu Pavel vs. delegace do Ankary'
