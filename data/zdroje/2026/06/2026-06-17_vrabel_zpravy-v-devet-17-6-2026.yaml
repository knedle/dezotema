  poznamka: G7 jako „válečná schůzka" (Rutte „aktivace obranných systémů NATO", Merz/Karney, šéf Luftwaffe,
    Trump „liška podšitá", USA přesouvá placení na Evropu); Hormuz — Trump VIP poplatky za tankery + česká
    „flotila z Děčína", Katar LNG roky mimo provoz; Ukrajina nábor cizinců (30–50 %) a žoldáci 140 tis.
    Kč, nevydávat uprchlíky; program SAFE jako skryté zbrojení z peněz ČR (Rumunsko 16,68 mld €); „bateriový
    zákon" — baterioví baroni a ČEZ; Španělsko legalizuje ~1 mil. migrantů + EP návratová centra + agenda
    2030; sankce neúčinné (Fabrizio Pagani, ex-G20), 21. balíček; Zelenský nelegitimně na G7/NATO, ale
    70 mld. $ jistá; Senát zamítl zpřísnění změny pohlaví + kritika trans-gender ve školách (výrok stochastického
    teroru). Zprávy v devět s komentářem (moderátorka Zuzka)
vyroky:
- id: vrabel-2026-06-17-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Hormuz: Trump chce „VIP poplatky" za průjezd, evropská a česká účast; Katar LNG roky mimo provoz
    (Vrabel, 17. 6. 2026)'
  text: 'Vrabel upozorňuje, že Trumpova administrativa (šéfka aparátu Susie Wiles) připravuje zpoplatněné
    „VIP povolení" pro průjezd ropných tankerů Hormuzským průlivem s doprovodem amerického námořnictva
    — a zvažuje i nucené poskytování pojištění přes zákon o válečné výrobě. Považuje za absurdní, že USA,
    „které jsou někde jinde", chtějí „kasírovat" lodě, zatímco volný průjezd mají fakticky zajišťovat
    evropské (francouzské, britské) válečné lodě — včetně „celé flotily z Děčína" / českého „námořního
    dělostřelectva", jehož účast přislíbili Macinka a Babiš. Politicky to ČR staví na jednu stranu konfliktu;
    Vrabel z toho vyvozuje růst rizika teroristických útoků a migrace i v ČR (migrační pakt už platí).
    Odmítá optimismus, že je krize u konce: cituje Bloomberg, že Katar (závod Ras Laffan, ~20 % světových
    dodávek LNG, dvě linky poškozené íránskými raketami v březnu) obnoví jen polovinu produkce do měsíce
    a plné obnovení „potrvá roky" — tankery i terminály jsou poškozené, těžbu „nezapne klíček". Krizi
    přičítá Trumpovi.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-17-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: '„Bateriový zákon": po solárních baronech přicházejí „baterioví baroni" (Vrabel, 17. 6. 2026)'
  text: 'K studii poradenské společnosti AFRY (pro Beyond Fossil Fuels), podle níž ve frontách na připojení
    k distribučním sítím v Evropě čeká ~455 GW bateriových úložišť a 375 GW obnovitelných zdrojů (zablokovaná
    hodnota přes 100 mld. EUR, vč. ČR), Vrabel připomíná „tiše" přijatý český zákon z listopadu 2025.
    Vysvětluje mechanismus: protože přechodem od stabilní (uhelné/jaderné) energetiky k OZE vzniká při
    větru/slunci přebytek, který je třeba „odvést", stát zavádí dotované bateriové úložiště. Vybraní „spřátelení
    energobaroni" uzavřou smlouvu s ČEZ a připojí baterie do páteřní sítě: při přebytku elektřinu „stáhnou"
    (ČEZ jim zaplatí), při nedostatku ji dodají zpět (ČEZ zaplatí znovu). Náklady ponese stát/občané —
    Vrabel je odhaduje řádově podobně jako náklady na solární barony („tolik, kolik byl náš [státní] dluh").
    Finanční toky, které dříve protékaly přes solární barony, „teď protečou přes baterijové barony".'
  podtema: Energetika a Rusko
- id: vrabel-2026-06-17-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Sankce proti Rusku jsou neúčinné — Fabrizio Pagani (ex-G20) (Vrabel, 17. 6. 2026)
  text: 'Vrabel cituje bývalého vyjednavače za G20 Fabrizia Paganiho, podle něhož ekonomická válka Washingtonu
    nemůže Rusko k ničemu přinutit, protože Moskva už svou ekonomiku úspěšně izolovala. Vrabel souhlasí:
    Rusko sice sankcemi a omezením obchodu trpí, ale vybudovalo vlastní platební systém, navázalo se na
    BRICS, exportuje do Asie a postavilo nová potrubí — na plynu a ropě dnes vydělává „tolik, kolik před
    konfliktem", protože ceny vzrostly a našli se jiní odběratelé. Chystaný 21. balíček sankcí (mj. zákaz
    vystupování ruských umělců v EU) označuje za absurdní: „za chvilku budou sankce proti červené barvě,
    protože připomíná ruskou vlajku".'
  podtema: Energetika a Rusko
- id: vrabel-2026-06-17-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Španělsko legalizuje ~1 mil. migrantů; EU „bojuje jen s nelegální migrací" (Vrabel, 17. 6. 2026)
  text: 'Ke zprávě, že Španělsko eviduje ~900 tis. (a dle NGO brzy přes milion) žádostí o legalizaci pobytu
    migrantů, Vrabel opakuje svou tezi: evropským politikům nejde o zabránění migraci, ale o její **kontrolu**
    — proto bojují pouze proti „nelegální" migraci a poté ji hromadně legalizují (analogie s Merkelovou).
    Souběžně Evropský parlament schválil zpřísnění pravidel pro navracení nelegálních migrantů (vč. návratových
    center mimo EU) — Vrabel to označuje za kosmetický „byrokratický" krok, protože EP je „absolutně globalistický"
    a antiglobalistická agenda by neprošla. Zařazuje to do širší „globalistické agendy 2030" (očkování,
    války, digitální měna, Green Deal, „červi místo hovězího", vyvlastňování domů), s níž „nelze bojovat
    a vyhrát"; jediné řešení vidí v tom, aby ČR „dokud má ústavu" vystoupila z EU/NATO a klimatických
    i migračních struktur a „uzavřela se, aby se v ní dalo žít" — jinak ji čeká totéž co Británii, Německo
    či Švédsko.'
- id: vrabel-2026-06-17-05
  typ: tvrzeni
  temata:
  - rodina-deti
  nadpis: Trans-gender ideologie ve školách jako manipulace dětí — Vrabel (17. 6. 2026)
  text: |-
    K zamítnutí novely o zpřísnění podmínek pro změnu pohlaví Senátem (pro zrušení zákona 42 senátorů) Vrabel deklaruje lhostejnost k tomu, „kdo s kým spí" a k soukromému životu dospělých (vč. homosexuálních párů), „dokud do toho netáhnou děti a zvířata". Ostře ale odmítá „trans-gender ideologii" propagovanou neziskovkami ve školách: líčí scénář, kdy neziskovky a psychologové opakovaně „přemlouvají" chlapce do dívčího oblečení a dívky do mužských rolí, až dítě po „výplachu mozku" uvěří, že je opačného pohlaví; v 16 letech následuje nevratná operace a doživotní hormonální léčba, takže člověk skončí podle Vrabela jako „zmrzák", který nemůže mít rodinu. Srovnává to s vykonstruovanými obviněními učitelů ze zneužití, z nichž manipulované dítě „neví, jak ven".

    Výrok na konci pasáže (lidé podílející se na této agendě „by potřebovali malý dvorek ohnaný ostnatým drátem, dlouhý bič a dobrého dozorce") je veden v [stochasticky-teror.md](stochasticky-teror.md#přehled-výroků).
  podtema: Šmírování dětí státem
- id: vrabel-2026-06-17-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajina najímá cizince a žoldáky za 140 tis. Kč; nevydávat uprchlíky (Vrabel, 17. 6. 2026)
  text: 'Vrabel uvádí, že ukrajinský ministr obrany Fedorov plánuje obsadit 30–50 % útočných a pěchotních
    jednotek zahraničními rekruty (přes soukromé náborové agentury) a Ukrajina nabízí žoldákům ~140 000
    Kč měsíčně — což čte jako důkaz vážného nedostatku vojáků a „nucených únosů" na ulicích. Kategoricky
    odmítá výzvy k vydávání ukrajinských uprchlíků v branném věku zpět na Ukrajinu: pro ně by to byla
    „poprava" (zacházení jako s dezertéry). Žádá soudit případné kriminálníky podle českých zákonů a deportovat
    až za závažné činy, ne plošně. Argumentuje empatií („představte si Českou republiku ve válce") a tvrdí,
    že hlavní obětí konfliktu jsou sami Ukrajinci — země bude na konci „vybydlená, zdevastovaná, zadlužená",
    připravená na „digitální stát s novým naváženým obyvatelstvem". Pasáž doprovází opakovaný černý humor
    o sebevrazích, kteří mohou jít „rychle ukončit život" na frontu. K žadatelce, podle níž utekli jen
    bohatí Ukrajinci, dodává, že život bohatého i chudého má stejnou hodnotu.'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-17-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenský na G7 a NATO: nelegitimní účast, ale 70 mld. dolarů jistá (Vrabel, 17. 6. 2026)'
  text: Vrabel zpochybňuje, proč byl Zelenský na summitu G7 (sdružení nejvyspělejších demokratických ekonomik),
    když je Ukrajina „několikrát zkrachovalá", zcela závislá na západních penězích a fakticky nedemokratická
    (bez opozice, voleb a s prezidentem po vypršení mandátu). Rutte oznámil, že na summit NATO v Ankaře
    (7.–8. 7.) nebude Zelenský vpuštěn na plenární zasedání (jen na okraj) a nekoná se rada NATO–Ukrajina
    na nejvyšší úrovni. Vrabel přesto očekává, že se v Ankaře rozhodne o dalších 70 mld. dolarů pro Ukrajinu,
    které „zaplatíme my všichni" — včetně peněz pro žoldáky. Komentuje i Zelenského zjevně lepší zdravotní
    stav („naučil se zacházet s kokainem"), což čte jako špatnou zprávu, protože konflikt tím bude pokračovat.
    Sám se vymezuje jako „na straně lidí, ne politických stran ani velmocí" a politiku označuje za „velké
    divadlo".
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-17-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: G7 jako „válečná schůzka"; Rutte a „aktivace obranných systémů NATO" (Vrabel, 17. 6. 2026)
  text: 'Vrabel čte summit G7 ve Francii jako „válečnou schůzku zemí NATO plus přidružených": všichni
    mluví o vítězství nad Ruskem a o Ukrajině jako budoucím členu EU, v závěrečném prohlášení chybí jakákoli
    zmínka o mírovém urovnání (naopak přísnější sankce na ruský ropný/plynárenský sektor a navýšení vojenské
    podpory). Znepokojil ho Mark Rutte, který používá nový termín „aktivace obranných/bezpečnostních systémů
    NATO" — Vrabelovi to zní, jako by se připravovala válka; zároveň Rutte oznámil, že ČR a několik zemí
    sice letos nedají 2 % HDP, ale „udělají vše" pro jejich překročení (Babiš to slíbil). Merz označil
    ruský požadavek na Donbas za nepřijatelný a tvrdil, že Rusko nikdy neuspělo v útočných válkách — Vrabel
    mu „připomíná německé 20. století". Kanadský premiér Karney prohlásil, že „Putin tuto válku prohraje".
    USA podle Rutteho přenášejí odpovědnost (a placení) na Evropu (550 mil. obyvatel vs. 330 mil. v USA,
    8 hodin letu). Trump je dle Vrabela „liška podšitá" — na společné fotce se jako jediný neotočil k
    fotografovi; „spirit of Anchorage" (nabídka Rusku) zůstal neimplementován, protože Evropa tlačí na
    pokračování konfliktu. Vrabel připomíná i výrok šéfa Luftwaffe (z 16. 6.), že Německo je „připraveno
    válčit s Ruskem klidně dnes večer", a soudí, že bez summitu G7 by svět byl „spíš lepší".'
  citace:
  - text: Je to opravdu i těžko číst ty zprávy, protože to je všude jenom válka, příprava na válku, zbrojení,
      zbraně a šíření nenávisti vůči Rusku.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-17-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Program SAFE jako skryté zbrojení z peněz ČR; Rumunsko (Vrabel, 17. 6. 2026)
  text: 'K úvěru 16,68 mld. EUR pro Rumunsko z programu SAFE (z toho ~10 mld. na obranné projekty 2026–2030)
    Vrabel rozvíjí kritiku celého programu: jde podle něj o mechanismus, jak se příspěvky ČR (a dalších
    zemí) do EU „vezmou a převedou do programu SAFE", z něhož se financuje zbrojení, „protože sami bychom
    tolik do zbrojení nedávali" — a to způsobem, „aby si toho občané nevšimli". Připomíná, že premiér
    Babiš se před třemi dny radoval, kolik ČR z programu SAFE dostane. Rumunsko označuje za „skorumpovanou,
    prodanou" zemi, která už při rozbíjení Jugoslávie poskytla základny k útokům na Srbsko výměnou za
    vstup do EU, a nyní se z ní buduje logistický uzel NATO na jihovýchodním křídle.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
