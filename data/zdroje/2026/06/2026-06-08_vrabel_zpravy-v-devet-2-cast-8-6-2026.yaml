- id: vrabel-2026-06-08-10
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Mírové podmínky EU/Ukrajiny (UK, Francie, Německo) jen recyklace — Rusko odmítá příměří jako
    první krok (Vrabel, 8. 6. 2026)
  text: 'K společnému prohlášení Ukrajiny, Velké Británie, Francie a Německa o pěti podmínkách „udržitelného
    míru" (úplné příměří jako předpoklad jednání, hranice na současné linii kontaktu, bezpečnostní záruky
    a možná přítomnost nadnárodních sil, zmrazení ruských aktiv a vyplacení válečních škod, souhlas EU
    a NATO) Vrabel namítá, že nejde o žádnou novinku — „bezpodmínečné příměří jako první krok" se opakuje
    roky. Rusko podle něj dlouhodobě odmítá příměří jako první krok a trvá na opačném pořadí: nejprve
    dohodnout a podepsat podmínky míru, teprve pak mír. Skupinu lídrů ironicky označuje za „klasickou
    partu kokainovou" a jejich prohlášení za „úplně zbytečné". Navazuje na [Zelenského otevřený dopis
    Putinovi (5. 6.)](#zelenského-otevřený-dopis-putinovi--putin-odmítá-příměří-před-vyjednáváním-vrabel-5-6-2026).'
  osoby:
  - osoba: vladimir-putin
    vztah: pozitivni
    kontext: „Velmi rozumný politik"; ale pod tlakem Moskvy, která ho má za „slabého" a žádá tvrdý protiútok
      na NATO/Evropu
  podtema: Vyjednávání a mír
- id: vrabel-2026-06-08-12
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: NATO eskaluje válku „salámovou metodou"; F-35 jako scénář jaderného náletu na Rusko (Vrabel,
    8. 6. 2026)
  text: 'Ke zprávě o sestřelení neidentifikovaného dronu nad Lotyšskem stíhačkami NATO (mise Baltic Air
    Policing) Vrabel rozvíjí tezi, že aliance konflikt s Ruskem záměrně stupňuje „salámovou metodou":
    místo nasazení protivzdušné obrany vysílá do vzduchu stíhačky, takže si veřejnost zemí NATO postupně
    zvyká na to, že „naše stíhačky bojují s Ruskem". Připomíná, že kdyby někomu v roce 2016 řekli, že
    2026 budeme „prakticky ve válce s Ruskem", nevěřil by — a přesto jsme tam. Zopakoval svou „černou
    vizi" z roku 2022, za niž byl dle svých slov odsouzen: NATO podle něj může zformovat „kleště" států
    kolem Ruska (Finsko, Pobaltí, ČR, Maďarsko, Balkán) a poslat na Rusko roj ~500 z ~1 200 letadel F-35A,
    která letí jako „roj" a nesou klouzavé jaderné bomby B-61 — to by mohlo prolomit ruskou protivzdušnou
    obranu. Navazuje na [Jaderné zbraně USA v Polsku a Pobaltí + obhajoba F-35 (2. 6.)](jaderne-zbrane.md#jaderné-zbraně-usa-v-polsku-a-pobaltí--obhajoba-výroku-o-f-35-vrabel-2-6-2026).'
  citace:
  - text: A to je na tomto nebezpečný, že se to neustále snaží eskalovat dál. [...] Salámovou metodou.
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-06-08-13
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Tlak v Rusku na protiútok: Moskva považuje Putina za „slabého" (Vrabel, 8. 6. 2026)'
  text: 'Vrabel s odvoláním na rozhovor s (blíže neurčeným) ruským analytikem tvrdí, že lidé v Moskvě
    jsou stále nespokojenější s Putinem — ne kvůli válce, ale proto, že jeho odpověď na ukrajinské/„NATO"
    útoky (zmiňuje útok na kolej se studentkami) považují za nedostatečnou a Rusko se podle nich „tváří
    jako slabé". Mnozí politici i lidé na ulicích prý žádají, aby Rusko uznalo, že je pod útokem NATO
    a EU, a „jednalo adekvátně" — třeba vypnutím elektřiny či komunikací v Paříži, Berlíně nebo Londýně.
    Vrabel uzavírá, že pokud budou pokračovat „každodenní teroristické útoky" na ruské civilisty, Rusko
    z vojensko-strategického hlediska nakonec udeří zpět — „nedávejte ty sirky zpátky do té krabičky".
    Nevylučuje, že terčem může být i menší země jako ČR („predátor loví ve stádu tu nejslabší laň"). Navazuje
    na [Predikce: Rusko zaútočí na Evropu v létě 2026](#predikce-rusko-zaútočí-na-evropu-v-létě-2026--vrabel).'
  citace:
  - text: '...může se stát i to, že bude zautočeno na nějakou menší zemi, třeba na Českou republiku.'
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-06-08-14
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Dánsko přesouvá ukrajinskou zbrojní výrobu — „udělalo ze sebe cíl" (Vrabel, 8. 6. 2026)
  text: Vrabel kritizuje rozhodnutí dánské vlády nabídnout své území pro přemístění ukrajinské zbrojní
    výroby (aby ji ochránila před ruskými útoky). Argumentuje, že tím Dánsko udělalo „ze svojí země a
    ze svých vlastních občanů vojenský cíl" — výrobny zbraní jsou podle dříve deklarovaného ruského postoje
    legitimním vojenským cílem. Dánský národ jinak hodnotí vřele (vzdělaný, pomáhal za 2. světové války),
    o to méně chápe rozhodnutí premiéra. Navazuje na [Rusko prohlásilo ČR za „spolupracovníka"](nato-zbrojeni-militarizace.md#rusko-prohlásilo-čr-za-spolupracovníka--česká-zbrojní-výroba-pro-ukrajinu-jako-casus-belli).
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-06-08-16
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Možný ruský vojenský úder na evropské město
  text: Vrabel považuje za „docela pravděpodobné", že Rusko pod tlakem pokračujících útoků podnikne vojenský
    úder na nějaké evropské město; nevylučuje, že terčem by mohla být i menší země jako Česká republika
    („predátor loví ve stádu tu nejslabší laň"). Zároveň tvrdí, že svět je „pravděpodobně před velkým
    vojenským konfliktem".
  citace:
  - text: '...připadá mi i docela pravděpodobné, že by se mohl stát nějaký útok na nějaké evropské městě.'
  predikce:
    horizont: neurčeno (brzy)
    stav: ceka
