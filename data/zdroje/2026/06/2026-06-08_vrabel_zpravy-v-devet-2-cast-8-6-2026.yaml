  nadpis: 'Vlastenecký kandidát na prezidenta: Sládek, případně Daniel Landa — Vrabel (8. 6. 2026)'
  text: V úvaze o vlasteneckém prezidentském kandidátovi Vrabel doporučuje Miroslava Sládka, ale vyzývá
    diváky, aby zvážili i Daniela Landu — kterého označuje za „prvního a největšího vlastence v České
    republice". Argumentuje Landovou rétorikou sebeobrany (odkaz na jeho starší texty ve smyslu „když
    seš slabší, vezmi do ruky předměty") jako analogií k tomu, že napadený se musí bránit hned a tvrdě.
    Připouští, že Landovi „napsali spoustu špíny".
  citace:
