  poznamka: 'Hlavní bloky: eskalace NATO–Rusko (dron Lotyšsko, salámová metoda, F-35/B-61 scénář jaderného
    náletu), Dánsko přesouvá ukrajinskou zbrojní výrobu, tlak v Rusku na protiútok (Putin „slabý", úder
    na evropské město), BRICS vs unipolární svět + globalistická „chazarská" nadvláda (Rothschild/Rockefeller),
    Írán pravděpodobně má jaderné zbraně, příprava na válku „zachraň se kdo můžeš" + bunkry, Turecko jako
    nevyzpytatelný člen NATO + „druhá armáda" v civilu, vlastenecký kandidát (Sládek/Landa), mírové podmínky
    EU/Ukrajiny jako recyklace (Rusko odmítá příměří). Zprávy v devět s komentářem, 2. část (moderátorka
    Zuzka)'
