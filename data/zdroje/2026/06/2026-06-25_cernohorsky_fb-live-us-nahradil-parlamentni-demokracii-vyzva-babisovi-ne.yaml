    Pinočeta na Hradě" nebo v nasazení cizí armády (Bundeswehr / jednotky EU) na českém území. Sám ale
    odhaduje nízkou pravděpodobnost, protože český národ „nepůjde do ulic" a armáda ČR je kvůli předchozí
