- id: cernohorsky-2026-06-25-01
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: ÚS „nahradil" parlamentní demokracii; výzva Babišovi rozhodnutí nerespektovat — Černohorský
    (25. 6. 2026)
  text: 'Černohorský ve více než hodinovém živém vysílání kauzu vyhrocuje na maximum. Argumentuje, že
    Ústavní soud jako soudní moc nemá právo „vykládat", co má vláda dělat — může zákon zrušit jako protiústavní,
    ale nemůže vládě přikazovat, jak konkrétně jednat vůči třetí straně (Pavlově účasti na summitu); v
    tom vidí zásah do dělby moci a nahrazení parlamentní demokracie. Vyzývá Andreje Babiše, aby rozhodnutí
    ÚS **nerespektoval**, i za cenu mediální bouře („co tady udělá modrožlutá banda, to je nepředstavitelné")
    — a naopak varuje, že podřízení se je „prohra, kterou si Petr Pavel bude vykládat jako vítězství".
    Zároveň přiznává obavu z eskalace: pokud by Babiš odmítl uposlechnout, mohlo by to podle něj vyústit
    až v „novodobého Pinočeta na Hradě" nebo nasazení cizí armády (Bundeswehr/jednotky EU) v ČR — odhaduje
    ale, že k tomu reálně nedojde, protože český národ „nepůjde do ulic" a armáda ČR je kvůli Černochové
    v „dezolátním stavu". Připomíná, že předseda ÚS Josef Baxa vstoupil do KSČ v roce 1988.'
  citace:
  - text: Ústavní soud nemá právo nahrazovat parlamentní demokracii a vykládat něco, co vláda má dělat.
  osoby:
  - osoba: andrej-babis
    vztah: rozporuplny
    kontext: Vyzývá ho nerespektovat rozhodnutí ÚS jako „lepší variantu"; zároveň chválen jako jediný
      premiér po letech, co snížil schodek rozpočtu
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Šašek", „imbecil", „kašpar na kolobrndě" — kompetenční žaloba k ÚS kvůli Ankaře hodnocena
      jako trapné, dětinské chování
  - osoba: jana-cernochova
    vztah: negativni
    kontext: Ministryně obrany — tričko „fuck off Putin", nekompetentní doporučení firmy; armáda ČR v
      „dezolátním stavu" kvůli jejímu odzbrojování
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-06-25-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Bilance politiky od r. 1993: „rozkradená země", Babiš vs. „idioti" ve vládě Fialy — Černohorský
    (25. 6. 2026)'
  text: |-
    Černohorský shrnuje 33 let české polistopadové politiky jako sled „podvodů a krádeží" (ODS, ČSSD) a tvrdí, že země byla „rozkradená doslova do písmene" — západní kapitál skoupil české pozemky, lesy i firmy, ze státního majetku nezůstalo prakticky nic. Jedinou výjimku vidí v **Andreji Babišovi**, který jako první premiér po letech dokázal snížit schodek státního rozpočtu (než ho zastavil covid). Ostře kontrastuje předchozí generaci politiků (Klaus, Zeman, Topolánek, Paroubek, Sobotka — „šmejdi, podvodníci", ale ne „idioti") se současnou vládní garniturou Petra Fialy, kterou označuje za „tupé", nekompetentní: ministr zahraničí **Jan Lipavský** (Nutella v Německu levnější/větší jako argument), ministr životního prostředí **Petr Hladík** („ČR se otepluje 2× rychleji než kdekoliv na světě"), ministryně obrany **Jana Černochová** (tričko „fuck off Putin", doporučení firmy od „bankovní úřednice"), ministr dopravy **Martin Kupka** i **Vít Rakušan** jsou dle něj příklady „debilů", které by v minulosti nikdo do vysoké politiky nepustil. Celou vládní koalici označuje za „fialovo-modrožlutou bandu" a srovnává současnou politickou scénu se sitcomem.

    > „Pravda je extrém. [...] Tam nelze jinak, než být extrémista." — Ladislav Vrabel, [Nedělní vysílání 21. 6. 2026](/zdroje/2026-06.md#2026-06-21_vrabel_nedelni-vysilani-21-6-2026)
  citace:
  - text: Nikdy jste nemohli nikoho nazvat naprostým idiotem. A Fiala — tupej, blbej idiot, a obklopil
      se víceméně tím samým.
  osoby:
  - osoba: jan-lipavsky
    vztah: negativni
    kontext: Ministr zahraničí — příklad „nekompetence" vlády Fialy (výrok o Nutelle v Německu)
  - osoba: petr-hladik
    vztah: negativni
    kontext: Ministr životního prostředí — výrok „ČR se otepluje 2× rychleji než kdekoliv na světě" hodnocen
      jako nesmysl
  - osoba: vit-rakusan
    vztah: negativni
    kontext: „Ten by měl lozit kanálama" — dehumanizující urážka v kontextu jeho kritiky vlády Babiše
  podtema: Politická kultura
