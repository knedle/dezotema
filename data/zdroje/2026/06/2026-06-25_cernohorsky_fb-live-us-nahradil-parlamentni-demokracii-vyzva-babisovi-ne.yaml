  poznamka: 'Dvě témata: (1) Vyhrocené pokračování kauzy z 24. 6. — Černohorský argumentuje, že ÚS coby
    soudní moc nemá právo „vykládat", co má vláda dělat (jen rušit zákony), a nahradil tak parlamentní
    demokracii; vyzývá Babiše, aby rozhodnutí nerespektoval, i za cenu mediální bouře. Varuje před rizikem
    eskalace („novodobý Pinočet na Hradě", nasazení Bundeswehru/armády EU), ale odhaduje, že k tomu nedojde
    (národ „nepůjde do ulic", armáda ČR „v dezolátním stavu" kvůli Černochové). Předseda ÚS Josef Baxa
    vstoupil do KSČ v roce 1988. (2) Bilance 33 let české politiky od 1993: země „rozkradená doslova do
    písmene", chválí Babiše za snížení schodku rozpočtu, ostře kritizuje ministry vlády Fialy jako nekompetentní
    (Lipavský, Hladík, Černochová, Kupka, Rakušan) — vs. minulá generace (Klaus/Zeman/Topolánek/Paroubek/Sobotka),
    kteří byli „šmejdi", ale ne „idioti". **Predikce:** podmíněná — pokud by konflikt ÚS/Babiš eskaloval,
    hrozí „novodobý Pinočet na Hradě" nebo nasazení cizí armády v ČR (odhaduje nízkou pravděpodobnost).
    **Stoch. teror:** graficko-sexuální degradace Josefa Baxy („dělají felaci Petru Pavlovi", „Baxa nastavil
    svůj anál"); Vít Rakušan „by měl lozit kanálama". Tematicky → [politicky-system.md](politicky-system.md).
    Pokračování kauzy ÚS/Pavel/Ankara + obecná bilance politiky'
