- id: vrabel-2026-06-19-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Hormuz: opakovaný cyklus „mír → pokles cen ropy → zisk"; Írán znovu uzavřel po útocích na Libanon
    (Vrabel, 19. 6. 2026)'
  text: 'Vrabel popisuje opakující se schéma kolem Hormuzu (v průlivu ~600 lodí, riziko kolizí a min):
    „už po 38." Trump oznámí mír a otevření průlivu → spadnou ceny ropy; když pak Rubio oznámil, že J.
    D. Vance nakonec nepoletí na podpis, začaly padat akcie, krypto, zlato i stříbro. Vrabel z toho dovozuje,
    že Trump a jeho okruh „zase vydělali pár set miliard". Mezitím íránské revoluční gardy (IRGC) oznámily
    opětovné uzavření Hormuzu po více než 100 izraelských útocích na Libanon — íránské ministerstvo zahraničí
    (Baghaí) to ale popřelo a deklarovalo, že průliv zůstává průjezdný (25 lodí za den) v souladu s memorandem.
    Vrabel: Írán není jednotný (IRGC vs. vláda); očekává spíše vleklý konflikt do podzimních primárek
    v USA, ne rychlé řešení. Agentura Reuters mezitím oznámila příměří Izrael–Hezballáh „podle nejmenovaného
    zdroje" — Vrabel ironizuje její důvěryhodnost a radí počkat, zda příměří vydrží aspoň týden (poslední
    3,5 měsíce se „příměří" objevuje každý pátek a v sobotu se zase bombarduje).'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-19-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Média jako „stochastický terorismus": pobodání poslance AFD a štvaní proti Vrabelovi (19. 6.
    2026)'
  text: 'K pobodání poslance AFD Michaela Meistera před jeho domem Vrabel přímo používá termín **stochastický
    terorismus**: média a „levičáci" podle něj nálepkováním politiků jako „fašoun/nácek" z nich dělají
    „legitimní cíl útoku" pro nepříčetné stoupence, přičemž si zachovávají popiratelnost. Vztahuje to
    na sebe: v roce 2023 ho Ukrajinec s přítelkyní polil (žluto-modrou) barvou, policie a úřady byly nečinné
    (Aliance národních sil podala TO), ministerstvo vnitra ho údajně zařadilo do „naming and shaming"
    skupiny — Vrabel proto očekává jako „další krok" útok nožem a chodí s ochrankou. Mediální štvaní (jmenuje
    ČT, Novinky) označuje za cílenou likvidaci, která „by měla být trestná"; srovnává s útoky na Fica,
    Trumpa a smrtí místopředsedy u Tommyho Robinsona. (Jde o Vrabelův popis jevu, nikoli jeho vlastní
    výrok stochastického teroru.)'
  podtema: Nová alternativní média
- id: vrabel-2026-06-19-03
