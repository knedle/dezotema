  nadpis: Florida, islám a migrační pakt platný v ČR — Vrabel (19. 6. 2026)
  text: 'Vrabel komentuje video z Floridy, kde muslimové napadli kazatele čtoucího Bibli, a obhajuje svou
    znalost islámu (studoval Korán, šaríu, Síru i hadísy) proti kritikům: problém prý není v neznalosti
    Koránu, ale v tom, jak se „islámská komunita chová ke svému okolí" — podle vzoru Mohameda a šaríi
    je učení netolerantní vůči nevěřícím (konvertovat, nebo nepřítel). V Německu uvádí „80 útoků nožem
    za den". Vše zasazuje do varování, že **migrační pakt vstoupil v ČR v platnost 12. 6. 2026** a je
    pro ni — navzdory prohlášením vlády, že ho neuplatní — závazný a právně vymahatelný, dokud bude ČR
    v EU (která „jen přitvrzuje").'
- id: vrabel-2026-06-19-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: grooming gangy, 250 tis. zneužitých dívek — studie Ruperta Lowea (Vrabel, 19. 6.
    2026)'
  text: Vrabel upozorňuje na nevládní studii britského poslance **Ruperta Lowea** (16. 6.), podle níž
    bylo v Británii více než **250 tisíc** bílých britských dívek znásilněno, sexuálně vykořisťováno nebo
    zneužito převážně pákistánskými muslimskými gangy, zatímco policie, místní úřady a další orgány je
    opakovaně nedokázaly ochránit (ze strachu z obvinění z rasismu/xenofobie) — systematický celostátní
    vzorec a institucionální utajování (nejznámější Rotherham, „grooming" přes vydírání fotkami). Studie
    nebyla hrazena z veřejných peněz, ale z darů ~24 tis. lidí (790 tis. liber). Vrabel ji uvádí jako
    varování pro ČR po podpisu migračního paktu a kritizuje kriminalizaci těch, kdo na to upozorňují.
- id: vrabel-2026-06-19-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Demokracie = vláda elit, ne lidu" — Vrabel (19. 6. 2026)
  text: 'V úvaze nad Trumpovým výrokem „moje moc je neomezená" Vrabel rozvíjí tezi, že západní země mají
    „plnou pusu demokracie" (řecky demos kratos = vláda lidu), ale ve skutečnosti jde o vládu elit: lidé
    se na vládě nepodílejí, jejich jediný vstup jsou volby (kde volí podle slibů). Elity podle něj o demokracii
    mluví právě proto, aby se nestalo to, čeho se bojí — že lidem „dojde trpělivost" jako za francouzské
    revoluce a převezmou moc. „Lidové soudy" dnes nelze ani navrhnout, aniž by to bylo označeno za útok
    na stát; soudy jsou „nezávislé na právu" a rozhodují ve prospěch režimu. Trumpovo počínání bere jako
    ukázku, že na Západě „vláda lidu vůbec není".'
  podtema: Represe a policejní brutalita na Západě
- id: vrabel-2026-06-19-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'EU rozpočet 2028–2034: ČR hrozí škrty z kohezních fondů (Vrabel, 19. 6. 2026)'
  text: K nejpalčivějšímu bodu červnového summitu EU — víceletému rozpočtu na roky 2028–2034 (~1,7 bilionu
    EUR / přes 41 bilionů Kč) — Vrabel upozorňuje, že ČR hrozí velké škrty z kohezních fondů, protože
    z hlediska evropských tabulek už patří mezi „dostatečně rozvinuté" státy. Původní návrh Komise by
    ČR mohl připravit až o ~243–250 mld Kč; podle výzkumníka IEP Filipa Kšenka přitom evropské fondy financují
    ~40–50 % veřejných investic v Česku, takže výpadek by znamenal „citelné ztráty".
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-06-19-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenského náborová propaganda a odebrání řádu (Navrocki) — Vrabel (19. 6. 2026)
  text: |-
    Dva body k Ukrajině a Zelenskému:

    - **Náborová propaganda:** Vrabel ukázal video, v němž ukrajinský voják v tričku s Banderou popíjí pivo na německém Bierfestu, chystá se na koncert do Belgie a vychvaluje „skvělý život vojáka" bojujícího za Ukrajinu (oproti těm, kdo se „schovávají" před TCK). Podle sociálních sítí měl autor vazby na Rádio Svoboda / Hlas Ameriky (americké neziskovky). Vrabel zároveň důrazně upřesňuje, že nikoho nenavádí jít bojovat za Ukrajinu — jde o „sebevražednou misi" (~75 % šance smrti/zmrzačení).
    - **Odebrání řádu:** polský prezident Karol Navrocki oficiálně odebral Zelenskému Řád Bílé orlice kvůli pojmenování jednotky po UPA (volyňský masakr, 80–100 tis. obětí). Vrabel se ptá, kdy ČR odebere Zelenskému Řád Bílého lva (udělil ho Miloš Zeman), a kritizuje „vlastence" z SPD adorující Zemana (řadí ho k „falešné trojce" Klaus/Zeman/Havel a Česko-německé deklaraci 1997). Viz [Zelenský a UPA (31. 5.)](#zelenský-pojmenoval-jednotku-po-upa--důkaz-nacistické-ideologie-výzva-k-odebrání-řádu-pavlovi-rajchl-31-5-2026).
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-19-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: EU jedná s Ruskem na vlastní pěst (Costa) — spor o vyjednavače (Vrabel, 19. 6. 2026)
  text: 'Předseda Evropské rady António Costa dvakrát zavolal do Ruska kvůli možným budoucím jednáním
    o Ukrajině — aniž se EU shodla, kdo ji má zastupovat. Vrabel to označuje za „parádní komedii": EU
    za 4,5 roku nedokázala určit vyjednavače, menší státy se brání dominanci Německa a Francie (Meloni
    navrhuje „středně velký stát", aby si velcí nevyjednávali výhody). Část zemí včetně ČR (Babiš) i Pobaltí
    tvrdí, že „není správný čas" jednat s Ruskem — Vrabel ironicky: ani podle něj ještě nepřišel správný
    čas „jet se omluvit a domluvit ropu a plyn", protože Evropa stojí proti Rusku.'
  podtema: Vyjednávání a mír
- id: vrabel-2026-06-19-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Ramstein, summit NATO a militarizace ČR — zbrojní biznis bez kontroly (Vrabel, 19. 6. 2026)
  text: |-
    Vrabel spojuje několik zpráv do teze, že válka je „obrovská příležitost krást, jako kdyby nebylo zítra":

    - **Ramstein (18. 6.):** Ukrajina získala 2,5–4 mld $ (přes 1 mld na PURL, ~0,5 mld na munici z české iniciativy, ~1 mld na výrobu dronů). „Biznis bez výběrových řízení, větší než za covidu"; ukrajinští představitelé na fotkách „jak ze žurnálu", ne jako země ve válce.
    - **Summit NATO:** bude se řešit dalších ~70 mld $ pro Ukrajinu (Babiš „odmává" — po dřívějších 90 mld EUR) a „NATO 3.0" — finanční oddělení od USA (Američané vnímají „Ameriku a NATO" odděleně), takže náklady ponese Evropa. Lavrov poprvé mluvil „velmi tvrdě" → očekává údery na řídící/logistická centra v Kyjevě (Kinžaly do bunkrů, snad i Orešník).
    - **2 % HDP — odvádění pozornosti:** Vrabel kritizuje „vlastence", že se hádají, zda Fiala/Babiš plní 2 % (Babiš letos nesplní, slibuje od příštího roku) — místo jediné podstatné otázky: vystoupit z NATO, nebo ne. Přirovnává to k učitelce, která dětem podsune spor o „natřepaný polštář", aby neřešily důležité.
    - **Letiště Karlovy Vary → vojenské; SPD jako lídr militarizace:** převod pod ministra obrany Jaromíra Zůnu (SPD); Vrabel ostře kritizuje SPD za rozpor s předvolební protiválečnou rétorikou — dnes je podle něj „lídrem" přestavby letišť na vojenská a posílání dalekonosných raket (z české muniční iniciativy) na ruské území.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-19-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Zelenský vyhrožuje Bělorusku; vstup Ukrajiny do NATO = válka s Ruskem (Vrabel, 19. 6. 2026)
  text: 'Vrabel popisuje další eskalaci: Zelenský v projevu vyhrožuje Bělorusku válkou — má stáhnout zbraně
    rozmístěné na hranicích s Ukrajinou, jinak to „udělá Ukrajina". Bělorusko má přitom na hranici Iskandery
    a (dle Vrabela) i jaderné zbraně a strategické partnerství s Ruskem. K avizovanému návratu otázky
    vstupu Ukrajiny do NATO na summit Vrabel varuje: jakmile Ukrajina vstoupí do NATO, je ČR „okamžitě
    ve válce s Ruskem" (a vstup do EU znamená být ve vojensko-politické alianci se státem ve válce). Poslední
    týden podle něj potvrdil, že se konflikt „neuklidňuje, ale eskaluje".'
  podtema: Eskalace a hrozba rozšíření konfliktu
