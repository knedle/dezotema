  nadpis: Stížnost Blažka, Tice a Daňhela zamítnuta (30. 6. 2026)
  text: Zítko informuje, že stížnost skupiny kolem Pavla Blažka, Karima Tice a Daňhela (spolu s dalšími
    desítkami zapojených lidí, kteří se dle Zítka podíleli na pokusu ukrást a zlegalizovat přes 100 miliard
    Kč v Jiříkovského bitcoinech) byla zamítnuta. Vrchní státní zastupitelství v Olomouci na případu pracuje
    přes rok; státní zástupkyně Lastovecká byla mezitím odvolána. Zítko odhaduje, že jediným důvodem stížnosti
    byla snaha vyhnout se vězení, a připomíná, že NCOZ má už rok k dispozici veškeré důkazy a specifikaci
    trestných činů i zapojených osob (viz jeho dřívější analýza v pořadu Rozpleteno).
  podtema: Korupce na Ukrajině — Mindić, Firepoint, Kvartal 95
