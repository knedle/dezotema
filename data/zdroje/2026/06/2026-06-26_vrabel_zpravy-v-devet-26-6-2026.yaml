- id: vrabel-2026-06-26-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: 'Digitální euro: konkrétní scénáře kontroly nákupů, expirujících peněz a vynucené poslušnosti
    (Vrabel, 26. 6. 2026)'
  text: 'V reakci na schválení pozice Evropského parlamentu k digitálnímu euru (výbor ECON, 43:14:1 hlasů,
    23. 6. 2026) Vrabel rozvádí konkrétní scénáře zneužití programovatelné měny. Stát by mohl kvůli klimatickým
    cílům omezit nákup hovězího masa nebo benzínu na pevný týdenní/měsíční limit navázaný na uhlíkovou
    stopu; mohl by soudně nařídit snížený „rozpočet" konkrétní osobě jako trest (příklad: Robert Kutý).
    Historické analogie zneužití peněz jako nástroje nátlaku: Kanada 2022 (ministryně financí Chrystia
    Freeland zmrazila účty účastníkům konvoje truckerů i lidem, kteří jim jen nosili jídlo a benzín —
    stávka tím skončila), Řecko (MMF nařídil strhávat prostředky z účtů nad 100 tisíc eur a omezil hotovostní
    výběry na 40–50 eur denně), Čína (rutinní zmrazování účtů díky již existujícím digitálním penězům).
    Historicky se také zaváděly peníze s expirací (Bavorsko — platnost 30 dní, aby se rychleji utrácely
    při krizi). Spojuje to s výrokem Ursuly von der Leyenové, že „vysoké úspory Evropanů jsou problém",
    který má vyřešit program Savings and Investments. Jako krajní, konspirační scénář zmiňuje propojení
    s univerzálním základním příjmem podmíněným „řádným občanstvím" — s odkazem na výrok Aleny Schillerové,
    že neočkovaným je „potřeba dělat život těžký", by dle Vrabela stát mohl digitální dávky neočkovaným
    omezit na životní minimum. Vyzývá k podpoře senátorky Vlasty Kovářové (jediná, kdo dle něj za hotovost
    aktivně bojuje) a k demonstraci za zachování hotovosti.'
  citace:
  - text: Suverenita je cash, hotovost. [...] A finanční stabilita — no tak vy si spoříte do polštáře.
  osoby:
  - osoba: ursula-von-der-leyen
    vztah: negativni
    kontext: Citovaný výrok, že „vysoké úspory Evropanů jsou problém" — spojeno s programem Savings and
      Investments jako přípravou na digitální euro
  - osoba: vlasta-kovarova
    vztah: pozitivni
    kontext: Senátorka — jediná, kdo dle Vrabela aktivně bojuje za zachování hotovosti; zaslouží si „velký
      dík"
- id: vrabel-2026-06-26-02
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Summit Ankara: 70 mld. dolarů je vedlejší, hlavní je členství Ukrajiny v NATO — Vrabel (26.
    6. 2026)'
  text: 'Vláda přijala zásady, se kterými česká delegace pojede na summit NATO v Ankaře (2 % HDP na obranu
    do konce roku); spor o to, kdo delegaci povede (Pavel vs. Babiš), Vrabla „až tak nezajímá" — cokoliv
    se tam schválí, musí stejně potvrdit vláda. Predikuje, že Česko nakonec 70 mld. dolarů pro Ukrajinu
    schválí (odkazuje na svůj dřívější odhad, že Pavel na summit nakonec pojede, který se potvrdil) —
    Babiš prý bude předstírat odpor a pak stejně podepíše, jako v prosinci s 90 mld. Zdůrazňuje, že částka
    je vedlejší: skutečně zásadní otázkou summitu je, zda NATO odsouhlasí členství Ukrajiny, což by znamenalo
    přímý vojenský konflikt s Ruskou federací. Kriticky glosuje, že Petr Macinka na cestě do Washingtonu
    domlouval zbrojní kontrakty s americkými firmami a nyní „konkuruje" Petru Kolářovi coby zprostředkovatel.'
  citace:
  - text: Ono nejde jenom o těch 70 miliard, jde taky o to, že Ukrajina se má stát členem NATO, a to je
      ta nejzásadnější věc. [...] Pokud NATO rozhodne, že přijme Ukrajinu do NATO, tak jsme v přímém vojenském
      konfliktu s Ruskou federací.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: 'Predikce: bude předstírat odpor vůči požadavku 70 mld. $ pro Ukrajinu na summitu NATO, ale
      nakonec schválí — stejně jako 90 mld. v prosinci'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-26-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Petr Macinka prosazuje povinnou tříměsíční vojenskou službu — Vrabel varuje muže v branném věku
    (26. 6. 2026)
  text: |-
    Vrabel opakovaně zdůrazňuje jako „šokující" a „neuvěřitelné" video, v němž Petr Macinka veřejně prosazuje zavedení povinné tříměsíční základní vojenské služby v ČR pro všechny. Spojuje to s celkovým trendem směřování k válce (americké tvrzení, že „Ukrajina vyhrává", jako příprava veřejnosti na schválení dalších peněz a členství v NATO na summitu v Ankaře) a přímo vyzývá diváky v záloze i v brance věku, aby si připravili „záložní plán".

    Následující den (**27. 6.**) Vrabel reaguje na Macinkovo propagandistické video, v němž ministr zahraničí obhajuje návrh povinného tříměsíčního vojenského výcviku jako protipól „ufňukaných" Pirátů (osobně napadá Zdeňka Hřiba za jeho „modrou knížku" — zdravotní osvobození od vojny). Vrabel poukazuje na hlubokou pokrytectví: Macinka sám na vojně nikdy nebyl, přesto posílá na vojnu ostatní; téže Macinka na cestě do USA vyjednává zbrojní kontrakty a dělá z ČR „zbrojařskou zemi pro Spojené státy" (viz [Macinka a americké zbrojní kontrakty](nato-zbrojeni-militarizace.md#zbrojní-byznys-bez-výběrových-řízení--kolář-a-macinka-jako-zprostředkovatelé-vrabel-5-6-2026)), zatímco ve videu tvrdí, že chce investovat do mladých lidí místo do zbraní. Sám Vrabel odmítá povinnou vojenskou službu i pro Německo (kvůli WWII by podle něj Německo nemělo mít armádu „dalších tisíc let") i pro ČR — z osobní zkušenosti popisuje vojnu jako šokující zkušenost a vyzývá lidi, kteří to obhajují (zejména ženy v komentářích), ať si to nejdřív sami vyzkoušejí.
  citace:
  - text: Macinka už tady prosazuje, že má být tříměsíční vojenská služba. [...] Vy, kdo jste v zálohách
      vojenských, tak bych opravdu přemýšlel nad záložním plánem. A vy, kdo jste ve vojenském věku, tak
      přemýšlejte, pro Boha, do budoucna.
  - text: On jde podepisovat kontrakty do Kongresu, domlouvat kontrakty na zbrojení pro Českou republiku
      [...], ale křičí proti Petrovi Pavlovi, že on nás prodává americkým zbrojařům.
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: Prosazuje povinnou tříměsíční vojenskou službu — „neuvěřitelné"; na cestě do USA domlouval
      zbrojní kontrakty, konkuruje Petru Kolářovi
