- id: vrabel-2026-06-26-04
  typ: predikce
  temata:
  - valka-ukrajina-prubeh
  nadpis: ČR nakonec schválí 70 mld. dolarů pro Ukrajinu ze summitu NATO
  text: Bez ohledu na to, kdo povede českou delegaci na summitu NATO v Ankaře (Pavel nebo Babiš), Vrabel
    předpovídá, že vláda nakonec schválí požadovaných 70 mld. dolarů pro Ukrajinu — stejně jako v prosinci
    schválila 90 mld. Andrej Babiš prý bude nejprve předstírat odpor („že ne, že ne, že ne"), ale nakonec
    to podepíše. Odkazuje na svou dřívější úspěšnou predikci, že Petr Pavel na summit nakonec pojede navzdory
    počátečnímu odmítnutí.
  citace:
  - text: Bych se znovu vsadil [...], že Česká republika nakonec do toho půjde a bude dávat ty peníze
      do NATO, těch sedmdesát miliard.
  predikce:
    horizont: summit NATO v Ankaře, 7.–8. 7. 2026
    stav: castecne
    horizont_do: 2026-07-08
    vyhodnoceni:
    - datum: 2026-11-20
      text: balík 70 mld. byl v Ankaře přijat a ČR ho neblokovala, přímý český příspěvek ale schválen
