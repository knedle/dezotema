  poznamka: 'Tři zpracovaná témata: (1) Digitální euro — konkrétní scénáře kontroly nákupů/expirujících
    peněz/vynucené poslušnosti (Kanada, Řecko, Čína jako precedenty), výzva bojovat za hotovost — [digitalni-kontrola.md](digitalni-kontrola.md).
    (2) Summit NATO Ankara — 70 mld. dolarů pro Ukrajinu je vedlejší, hlavní otázkou je členství Ukrajiny
    v NATO (= přímý konflikt s Ruskem); predikuje schválení peněz vládou — [valka-nato-rusko.md](valka-nato-rusko.md).
    (3) Petr Macinka prosazuje povinnou tříměsíční vojenskou službu — varování mužům v branném věku —
    [valka-nato-rusko.md](valka-nato-rusko.md). Ostatní zprávy (VW propouštění, MiCA regulace kryptoměn,
    Hormuz/Írán, Izrael–Libanon dohoda, Krym stav nouze, Lavrov vs. Rubio spor o Aljašku) jen rychlý přehled
    bez samostatného zpracování. **Predikce:** ČR nakonec schválí 70 mld. dolarů pro Ukrajinu (viz [predikce.md](predikce.md)).
    Bez stoch. teroru. Pravidelný přehled zahraničních a domácích zpráv s komentářem'
