  nadpis: Pavel proti zájmům ČR (koruna, veto, USE); Polsko jako kontrast (Rajchl, 10. 6. 2026)
  text: 'Ke sporu vláda–hrad Rajchl uvádí Polsko jako příklad funkčního modelu: prezident Nawrocki a premiér
    Tusk jsou na opačné politické lince, ale na zásadních věcech (suverenita, bezpečnost, bohatství) se
    shodnou. V ČR se podle něj Pavel neshodne ani na ponechání české koruny, zachování práva veta či odmítnutí
    „Spojených států evropských" — což jsou věci, pod které by se 90 % občanů nepodepsalo. Pavlovo počínání
    označuje za „proti zájmům ČR" a za „diplomatické faux pas nejhoršího kalibru", protože vznik USE by
    znamenal konec svrchovanosti ČR.'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
