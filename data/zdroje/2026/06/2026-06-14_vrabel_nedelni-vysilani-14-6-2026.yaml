  poznamka: Eskalace NATO–Rusko (parabola školní šikany, „není to Ukrajina, je to Západ", riziko úderu
    na česká letiště s F-35), odmítá „menší zlo" preventivního ruského jaderného úderu — chce deeskalaci/odzbrojení;
    AI drony vraždící bez člověka (Ukrajina test, Erik Trump továrna); ČR předem oznámila veto EU rezoluce
    proti Izraeli; migrační pakt připravovala Babišova vláda (Hamáček), nelze opustit bez vystoupení z
    EU (Vondráček), Konečná pro migrační cesty; AI DNA vakcína; Macinka „malý Heydrich"; šaría (Bill Warner).
    Pravidelné nedělní živé vysílání (z velké části rekapitulace týdne + Q&A)
vyroky:
- id: vrabel-2026-06-14-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Česká vláda předem oznámila veto případné EU rezoluce proti Izraeli — Vrabel (14. 6. 2026)
  text: Vrabel označuje za „neuvěřitelné", že česká vláda předem vydala prohlášení, že bude vetovat jakoukoli
    připravovanou rezoluci EU proti Izraeli. Připomíná, že EU zatím chystá vůči Izraeli jen rezoluci (odsouzení),
    nikoli sankce. Tvrdí, že izraelská vláda se v Gaze dopouští genocidy a její počínání v Libanonu „není
    o moc lepší" — výroky izraelského premiéra a ministra obrany jsou podle něj takové, „za které by normální
    člověk v ČR šel do vězení". Česká vláda to dle něj naopak podporuje a „zavírá oči".
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-14-02
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migrační pakt připravovala Babišova vláda (Hamáček); nelze opustit bez vystoupení z EU — Vrabel
    (14. 6. 2026)
  text: 'Vrabel zdůrazňuje, že migrační pakt **připravovala už vláda Andreje Babiše** (ministr vnitra
    Hamáček), Fialova vláda jej jen dokončila a podepsala — „říkat dnes, že to udělala vláda Petra Fialy,
    není pravda". Babišovo prohlášení z prosince, že vláda pakt „odmítla" a že ČR „neručí" za půjčku Ukrajině,
    označuje za „levárnu" (analogie: nelze „odmítnout vynést odpadky", když je to dohodnuté a vymahatelné).
    Pakt je dle něj právně vymahatelný; pokus o neplnění by vedl k zastavení evropských peněz (ekonomický
    kolaps) a prohře u Evropského soudu. Jedinou cestou ven je **vystoupení z EU** (čl. 50 Lisabonské
    smlouvy, ~2 roky) — to ocenil i u Libora Vondráčka, který to voličům přiznal. Varuje, že „Overtonovo
    okno" pro odchod se zavírá (analogie s Katalánskem). Připomíná, že Kateřina Konečná hlasovala v EP
    „pro vytváření migračních cest" z Afriky. Výjimka ČR (kvůli ~450–480 tis. Ukrajincům) platí jen ~2
    roky.'
- id: vrabel-2026-06-14-03
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Eskalace NATO–Rusko: „není to Ukrajina, je to Západ"; AI drony vraždící bez člověka — Vrabel
    (14. 6. 2026)'
  text: |-
    V nedělním vysílání Vrabel rozvíjí na dotazy svou tezi o blížící se přímé válce NATO–Rusko (parabola „školní šikany"): útoky hluboko do Ruska (rafinérie, sklady, energetika; teroristické útoky na autobus a studentskou kolej) nedělá Ukrajina sama, ale **Západ/NATO** — západní piloti, operátoři raket dlouhého doletu, dronaři, satelitní navádění (CIA), peníze a zbraně (90 mld., 60 % na zbraně; muniční iniciativa). Rusko se dle něj snaží vyhnout válce s NATO, ale jednoho dne bude muset přiznat, že je s NATO ve válce, a bránit se; pokud ruská tajná služba zjistí přípravu hromadného jaderného úderu (F-35 + bomby B-61), „začnou lítat rakety i na česká a polská letiště s F-35".

    Na dotaz, zda by preventivní ruský jaderný úder nebyl „menší zlo" než třetí světová válka, Vrabel odpovídá, že **není zastáncem tohoto řešení** — třetí světová válka se podle něj „teprve vaří" (nové zbrojovky, dohody, cvičení), spouštěčem nemusí být Ukrajina, a globalisté („chazarští váleční štváči" napojení na zbrojaře) do války s Ruskem cíleně provokují. Řešením je deeskalace a tlak občanů na jaderné odzbrojení, ne první jaderná rána. Sám staví v podhůří úkryt pro případ války.

    K týdnu navíc: Ukrajina otestovala ~10 **dronů řízených výhradně umělou inteligencí** (bez operátora), které samy zabíjely ruské vojáky — Vrabel to sarkasticky komentuje („sláva Ukrajině") jako „poprvé v historii stroj zabíjí lidi bez člověka"; připomíná továrnu Erika Trumpa na robotická zařízení s AI a dohodu se Zelenským testovat je na Ukrajině.
  podtema: Eskalace a hrozba rozšíření konfliktu
