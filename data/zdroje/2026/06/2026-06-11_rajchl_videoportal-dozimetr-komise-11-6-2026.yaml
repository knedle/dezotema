  nadpis: 'Dozimetr: proč se nestíhají STAN a TOP 09 (Rajchl, 11. 6. 2026)'
  text: 'Ke vzniku parlamentní vyšetřovací komise v kauze Dozimetr Rajchl klade „nezodpovězené" otázky.
    Kauza je pojmenovaná po Věslavu Michalíkovi (jedno z pěti „podezřelých úmrtí"), který měl klíčově
    vypovídat. Lidé jako Kos či Augustin se do svých funkcí dostali jen díky moci STAN a TOP 09 v Praze;
    Jakub Michálek (Piráti) veřejně řekl, že je STAN „překroužkoval černými penězi z Dozimetru". Rajchl
    poukazuje na dvojí metr: stačilo jedno svědectví ke stíhání Marka Schneidera (ODS) a Martina Dvořáka,
    ale STAN a TOP 09 jako právnické osoby — proti nimž je pět vzájemně se kryjících svědectví a které
    měly být „na vrcholu pyramidy" — se nestíhají. Navazuje na [Kauza Dozimetr](/temata/kauzy/2026.md#rajchl-2026-03-15-07).'
  podtema: Kauza Ladislav Vrabel — dotační podvod
