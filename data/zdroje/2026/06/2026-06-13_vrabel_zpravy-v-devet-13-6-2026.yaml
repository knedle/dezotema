- id: vrabel-2026-06-13-01
  typ: tvrzeni
  temata:
  - benesovy-dekrety
  nadpis: 'Lidice: „válku vedli Němci, ne abstraktní nacisté" — Vrabel (13. 6. 2026)'
  text: K 84. výročí vyhlazení Lidic Vrabel kritizuje formulaci ČT (a obecně mainstreamu), že obec vypálili
    „nacisté" po atentátu na zastupujícího říšského protektora — podle něj se tím záměrně odděluje pojem
    „nacisté" od Němců. Trvá na tom, že druhou světovou válku rozpoutalo a vedlo **Německo** — demokraticky
    zvolená německá vláda, kterou miliony Němců vítaly (anšlus, zábor ČSR, Polsko, Paříž). Za „největší
    ostudu české politiky" označuje, že ministr zahraničí Jan Lipavský jel slavit výročí konce války do
    Německa a označil pozvání za „významné". Připomíná i [česko-německou deklaraci 1997](#česko-německá-deklarace-1997-jako-vzdání-se-válečných-reparací--vrabel-7-5-2026)
    (Havel, Zeman), kterou Německu „odpustila viny" a přiznala český „díl viny" — varuje, že s vymíráním
    pamětníků se historie přepisuje.
  osoby:
  - osoba: jan-lipavsky
    vztah: negativni
    kontext: „Největší ostuda české politiky" — jel slavit výročí konce WWII do Německa a označil pozvání
      za významné
  podtema: Podstata dekretů, odsun a smíření
- id: vrabel-2026-06-13-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Írán „telenovela" 38× a manipulace ropy; Izrael, „Velký Izrael" a Netanjahu řídící USA — Vrabel
    (13. 6. 2026)
  text: |-
    Vrabel rozšiřuje tezi o opakujícím se scénáři (viz [11. 6.](#trump-opakovaná-ultimáta-íránu-a-podezření-z-manipulace-cen-ropy-vrabel-11-6-2026)): Trump ve čtvrtek/pátek oznámí blízký podpis mírové dohody s Íránem (tentokrát „v neděli na své 80. narozeniny" + otevření Hormuzu), ~20 minut předtím se masivně shortuje ropa, o víkendu íránský ministr Arákčí dohodu popře (chce „účtovat za Hormuz") a následuje bombardování Libanonu/jižního Íránu. Tvrdí, že tento cyklus proběhl „38× za sebou", investoři na něm vydělali miliardy a Trump by za to mohl být nakonec souzen.

    K izraelským úderům na jižní Libanon (70+ úderů, Hezbollah; poškozeno starověké město Týr) Vrabel tvrdí, že Izrael cíleně ničí historii a kulturní památky (analogie s Kosovem) v rámci projektu **„Velký Izrael"** — aby se popřela existence Palestiny a vznikly „rezorty" (Trump + Kushner). Cituje Trumpovo prohlášení, že „USA nemají suverenitu" a válku fakticky řídí Netanjahu; vysvětluje to vlivem „sionistů / chazarských židů" (Rothschild, Rockefeller, centrální banky, vlastnictví světa „čtyřmi firmami") — odkaz na Karla Gotta o „tajných spolcích řídících svět".
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-13-03
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: Ozempic pro děti „jeden z nejnebezpečnějších léků"; nová AI DNA vakcína — Vrabel (13. 6. 2026)
  text: |-
    Ke zprávě, že ministr Adam Vojtěch při otevření závodu Novo Nordisk oznámil možné hrazení léků na hubnutí obézním dětem z pojištění (do konce roku, dle SÚKL), Vrabel reaguje ostře (viz [stochastický teror](stochasticky-teror.md)): Ozempic označuje za „jeden z nejnebezpečnějších léků současnosti", varuje rodiče, aby si zjistili nežádoucí účinky dřív, než ho komukoli (zvlášť dítěti) podají, a dovolává se práva na informovaný souhlas (Norimberský proces). Vojtěcha označuje za lobbistu pokračujícího v „agendě" z covidu.

    Dále informuje o nové vakcíně **vyrobené umělou inteligencí**, testované 6 měsíců na 39 lidech a publikované ve vědeckém časopise: není na bázi mRNA, ale **DNA**, a má být širokospektrální (mj. proti koronavirům). Výrobci tvrdí, že DNA se nezapojí do lidské DNA; Vrabel cituje dr. Petera McCullougha, který prý nechápe, jak si tím mohou být jistí, a riziko zásahu do lidské DNA nevylučuje. Vrabel se omlouvá za dřívější tvrzení, že další vakcíny budou výhradně mRNA.
  podtema: Hantavirus
- id: vrabel-2026-06-13-04
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Gabbard oficiálně odtajnila dokumenty o 120 biolaboratořích — „konspirace se stala pravdou"
    (Vrabel, 13. 6. 2026)
  text: Vrabel referuje, že Tulsi Gabbardová (ředitelka Národní rozvědky USA, končící k 30. 6.) na webu
    NDI oficiálně zveřejnila **odtajněné dokumenty** o více než 120 biologických laboratořích ve více
    než 30 zemích financovaných vládou USA — včetně laboratoří na Ukrajině, kde se pracovalo s nebezpečnými
    patogeny; předchozí administrativu obvinila ze zatajování financování. Dokumenty jsou částečně začerněné
    (bezpečnost). Vrabel to staví jako „dárek na rozloučenou" a další případ, kdy „ruská propaganda /
    konspirace" z roku 2022 (Nulandové přiznání Rubiovi) byla po 4,5 letech potvrzena oficiálním zdrojem
    USA. Rozšiřuje [40 z 120 — Gabbard a Hegseth (Rajchl, 31. 5.)](#biolaboratoře-usa-na-ukrajině-40-z-120--gabbard-a-hegseth-potvrdili-rajchl-31-5-2026).
  osoby:
  - osoba: tulsi-gabbard
    vztah: pozitivni
    kontext: „Dárek na rozloučenou" — oficiálně odtajnila dokumenty o 120 biolaboratořích USA ve 30 zemích
      (NDI); potvrzení dřívější „konspirace"
- id: vrabel-2026-06-13-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migrační pakt platí i pro ČR; Británie před občanskou válkou; islám vs. křesťanství — Vrabel
    (13. 6. 2026)
  text: 'Vrabel ke vstupu migračního paktu v platnost opakuje, že od „včerejška" se „migrantský mor" přenáší
    i do dalších zemí EU včetně ČR. Vít Rakušan vyjednal, že ČR letos nemusí brát migranty z Blízkého
    východu a Afriky (kvůli půl milionu přijatých Ukrajinců), ale „od příštího roku" prý začnou jezdit
    autobusy lidí z Afriky a Blízkého východu (Afričany označuje za „ještě víc násilné"). K rezignaci
    britské politiky (Starmer, odstoupení „Don Haleyho") tvrdí, že žádné PR nevrátí důvěru — Británie
    se ekonomicky zhoršila (drahé nájmy, daně, jídlo), všude jsou migranti (Pákistánci, Indové, Afričané)
    a násilností přibývá. Predikuje Evropě **občanskou válku** (Belfast, Francie). Klíčová teze: křesťanská
    a islámská kultura jsou „absolutně neslučitelné" — staví „zlaté pravidlo" a respekt k ženám proti
    právu šaría (zmiňuje provdávání nezletilých dívek). Navazuje na [Migrační pakt vstoupil v platnost
    (12. 6.)](#migrační-pakt-vstoupil-v-platnost--vláda-ho-podle-vrabela-neodmítla-12-6-2026).'
- id: vrabel-2026-06-13-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Umělý konflikt vláda vs. prezident; Babiš/Macinka „předstírají opozici" vůči Fialovi — Vrabel
    (13. 6. 2026)
  text: Vrabel tvrdí, že vláda Andreje Babiše vyhrála volby na narativu, že je opakem Fialovy vlády (protože
    „lidi Fialu nenávidí"), ale fakticky vede „úplně stejnou" zahraniční politiku — NATO, EU, USA. Jako
    důkaz uvádí ministra Petra Macinku, který chce obchod s Čínou jen „tam, kam nám to povolí EU" a vyzývá
    k „obezřetnosti" — Vrabel to srovnává se Srbskem (Vučić, bezcelní obchod, miliardové dohody) a označuje
    za stejný kurz jako za Fialy. „Uměle vytvořený" konflikt vláda vs. prezident Pavel (přehraný i v citovaném
    videu Macinkova „politického tatínka") podle něj slouží k tomu, aby lidé měli pocit, že „nežijeme
    v totalitě" a existují různé politické názory — přitom „dělají úplně to samé". Češe označuje za „politicky
    natvrdlé", protože narativu uvěřili.
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: „Obrovské zklamání" — obchod s Čínou „jen jak povolí EU"/obezřetnost = stejná politika jako
      Fiala; vláda Babiše jen předstírá opozici vůči Fialovi
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-13-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: F-35 jako příprava útoku na Rusko, tanky po D35, cvičení u Suvalk, dvojí metr u Ukrajiny — Vrabel
    (13. 6. 2026)
  text: |-
    V komentáři Vrabel propojuje několik zpráv do téze o blížící se válce s Ruskem:

    - **F-35:** Poláci letouny dostali (ČR je „jen přeplatí"). Vrabel je čte jako útočná letadla (ne obranná) schopná letět v roji a komunikovat mezi sebou, navíc nosiče jaderných zbraní; USA do nich montuje techniku a bez jejich souhlasu „nepoletí". Závěr: USA rozmísťuje nosiče jaderných zbraní na hranice s Ruskem, aby v konfliktu „poslala Evropany válčit s Ruskem" a sama zůstala nejsilnější — kritizuje servilitu Babiše a Macinky. Navazuje na [F-35 jako scénář jaderného náletu (8. 6.)](valka-nato-rusko.md#nato-eskaluje-válku-salámovou-metodou-f-35-jako-scénář-jaderného-náletu-na-rusko-vrabel-8-6-2026).
    - **Tanky Leopard 2A4** poprvé pojedou po dálnici D35 (16. 6., 9 ks + vyprošťovací vozidlo) — Vrabel: „jako kdyby se chystalo, že se budou německé tanky přes ČR přesouvat směrem k Rusku."
    - **Cvičení u Suvalského koridoru** (Litva/Polsko/Německo/Francie, 16.–26. 6., ~10 000 vojáků, 600 ks techniky) u Kaliningradu označuje za cílenou provokaci a eskalaci („nedávejte sirky zpátky do krabičky"). Válku čeká „na spadnutí", oficiálně se mluví o roce 2029.
    - **Dvojí metr u Ukrajiny:** bojovat za Ukrajinu je povoleno (financujeme to — 90mld balíček, 30 % na chod státu, 60 % na zbraně; voják bere ~140 000 Kč/měs.), zatímco Ivan Kratochvíl a českoslovenští vojáci v záloze jsou stíháni za podporu ruských separatistů (soud 24. 7., hrozí 10 let). Ukrajina je v bankrotu a chce dalších 20 mld. dolarů.
  osoby:
  - osoba: ivan-kratochvil
    vztah: pozitivni
    kontext: Souzen (hrozí 10 let, soud 24. 7.) za podporu bojujících na straně ruských separatistů —
      Vrabel jako příklad dvojího metru (za Ukrajinu bojovat lze); „nejvíc vláčený", přitom proti nikomu
      nevypovídal
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-13-08
  typ: predikce
  temata:
  - migrace
  nadpis: Od roku 2027 začnou do ČR jezdit autobusy migrantů z Afriky a Blízkého východu
  text: Vrabel tvrdí, že výjimka ČR z přerozdělování migrantů (kvůli přijatým Ukrajincům) skončí a „od
    příštího roku" (2027) začnou do ČR jezdit autobusy lidí z Afriky a Blízkého východu v rámci migračního
    paktu.
  citace:
  - text: Od příštího roku prostě se budou procházet. Začnou jezdit k nám autobusy lidí z těch zemí Blízkého,
      středního východu a Afriky.
  predikce:
    horizont: od roku 2027
    stav: ceka
