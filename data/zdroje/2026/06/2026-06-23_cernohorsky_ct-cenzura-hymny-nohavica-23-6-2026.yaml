  poznamka: Cenzura hymny v podání Jarka Nohavicy ze strany ČT — Černohorský ji označuje za „nehoráznost"
    a porušení Ústavy / Listiny základních práv (čl. 17 odst. 3 „Cenzura je nepřípustná"); tvrdí, že ČT
    to měla připravené předem („Závada není na vašem přijímači" jako za socialismu) a ocenzurovala hymnu,
    protože „nezapadá do jejich ukrajinského nacistického konceptu"; ČT „jde na ruku prozápadním/proukrajinským"
    zájmům a má být zrušena — žádné koncesionářské poplatky („výpalné"), 8 miliard ani koruna z rozpočtu.
    Tematicky → [dsa-cenzura.md](dsa-cenzura.md) (shoda s Rajchlem). Bez predikcí a stoch. teroru. Reakce
    na sdílení hymny v podání Jarka Nohavicy (děkuje za ~100 zpráv)
