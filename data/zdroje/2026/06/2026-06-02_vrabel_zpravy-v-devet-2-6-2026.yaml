  poznamka: '„Zprávy v devět s komentářem" (se Zuzkou), 14 zpravodajských bloků. Klíčová témata: nová
    fáze SVO — ruské masivní údery (729 prostředků) jako odveta za Starobělsk, cílení „rozhodovacích center";
    ruský zákaz vývozu leteckého paliva — Vrabel viní válku USA v Íránu/Hormuz a nedostatek kerosinu,
    ne ukrajinské drony (kritika ČT); výzva Zemanovi odebrat Zelenskému Řád bílého lva; ukrajinizace ČR
    („Česko-Ukrajinsko" — vlajky, migranti, univerzity); Pegasus/NSO konference v Praze vs. manželka jako
    bezpečnostní ohrožení; EU obchodní dohoda s USA (cla 15 %) jako „diktatura tvářící se jako demokracie";
    jaderné zbraně USA v Polsku/Pobaltí + obhajoba výroku o F-35; Izrael/Gaza genocida + apriorní podpora
    české vlády (Ben Gvir), Trump vs. Netanyahu; muniční iniciativa jako spoluzodpovědnost ČR za teror
    proti ruským civilistům; rezignace státní zástupkyně + bitcoinová kauza = skorumpovaný systém; Británie
    — případ Henryho Novaka, hate crime, „obrácený rasismus"; Srbsko (růst 32 %, ruští uprchlíci bez výhod
    vs. Ukrajinci); útoky na lodě v Černém moři.'
