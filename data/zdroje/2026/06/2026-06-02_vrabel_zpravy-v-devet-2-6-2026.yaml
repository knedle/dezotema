  nadpis: Genocida v Gaze a apriorní podpora Izraele českou vládou (Vrabel, 2. 6. 2026)
  text: 'Vrabel tvrdí, že v Gaze (a vůči Libanonu) dochází ze strany Izraele ke genocidě civilního obyvatelstva,
    a kritizuje českou vládu (Babiš, Macinka, Pavel jako „trumpisté") za to, že předem ohlásila, že zablokuje
    jakékoli sankce nebo rezoluce EU proti Izraeli — i kdyby tam byly páchány válečné zločiny. Klíčová
    teze: zločiny je třeba soudit „podle činů, ne podle sympatií" — stejně jako odsoudil Trumpa za „válečné
    zločiny" a odsoudil by i Putina, kdyby je páchal. Apriorní krytí Izraele označuje za „chucpé". Izraelského
    ministra Bena Gvira (jako pojmenovaný příklad) považuje za člověka, který by měl být souzen Mezinárodním
    trestním soudem za válečné zločiny. Zmiňuje i posun Trumpa, který nově označil Netanyahua za „blázna"
    a „nevděčného" — Vrabel to čte jako tlak americké veřejnosti, která vnímá dění v Gaze jako genocidu,
    a předpovídá, že česká vláda (mající zároveň „trumpisty" i bezvýhradnou podporu Izraele) se bude muset
    „kroutit".'
  citace:
  - text: Je potřeba soudit každého podle jeho činů, a ne podle nějakých sympatií.
- id: vrabel-2026-06-02-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Ruský zákaz vývozu leteckého paliva — příčinou je válka v Íránu, ne ukrajinské drony (Vrabel,
    2. 6. 2026)
  text: 'Vrabel reaguje na zprávu (komentovanou v ČT), že Rusko poprvé od začátku války zakázalo vývoz
    leteckého paliva do konce listopadu — což média spojují s ukrajinskými údery na ruské rafinerie. Vrabel
    to označuje za „propagandu české televize". Podle něj je skutečnou příčinou válka USA v Íránu a omezení
    dopravy přes Hormuzský průliv: přes Hormuz neproudí kvalitní těžká ropa z Blízkého východu vhodná
    pro výrobu kerosinu, na trh se dostává jen méně vhodná ropa (Venezuela aj.), takže je ve světě nedostatek
    kerosinu. Rusko má vlastních zásob dostatek, ale stejně jako Srbsko či Čína u strategických komodit
    zakázalo jejich vývoz. Některé evropské aerolinky už kvůli nedostatku a zdražování paliva ruší spoje.'
  podtema: Letecké palivo a kerosin
- id: vrabel-2026-06-02-03
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Pegasus a konference NSO Group v Praze — dvojí metr „bezpečnostního ohrožení" (Vrabel, 2. 6.
    2026)
  text: Vrabel upozorňuje, že ve dnech 2.–4. 6. se v pražském hotelu Clarion koná veletrh prodejců špionážního
    softwaru, kde se sejdou zástupci soukromých firem, zpravodajských služeb a policie z celého světa;
    hlavním sponzorem je izraelská NSO Group (software Pegasus, který se dokáže nabourat do telefonu a
    ovládat ho bez vědomí majitele — dle citované analýzy Amnesty International naboural 10 000 telefonů
    včetně telefonu prezidenta Macrona). Vrabel kontrastuje tuto konferenci s tím, že jeho manželka byla
    prohlášena za „bezpečnostní ohrožení státu" bez zdůvodnění (viz [Kauzy — Bojana Vrabelová](kauzy.md))
    — podle něj by se měly tajné služby zabývat spíš takovými technologiemi než likvidací aktivistů. Označuje
    za příznačné, že ČR „bere na svá bedra ty nejnebezpečnější věci z celého světa" (paralela s muniční
    iniciativou).
- id: vrabel-2026-06-02-04
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Jaderné zbraně USA v Polsku a Pobaltí — obhajoba výroku o F-35 (Vrabel, 2. 6. 2026)
  text: 'Ke zprávě (Financial Times), že USA zvažují rozmístění jaderných zbraní v Polsku a pobaltských
    státech, Vrabel připomíná svůj soudní spor o F-35: Ústavní soud ho osvobodil s tím, že šlo o politický
    názor (požívá ústavní ochrany). Vrabel tvrdí, že byl mediálně zesměšňován za výrok, že „ČR bude útočit
    na Rusko jadernými zbraněmi" — což ale neřekl. Jeho skutečné tvrzení: nekupovat F-35, protože jsou
    to především nosiče jaderných zbraní (B-61); pokud ČR bude mít nosiče, stává se potenciálním cílem
    Ruské federace, a pokud by je použila, jistým cílem ruského jaderného úderu. Spekuluje, že Ústavní
    soud ho osvobodil i proto, „že se to chystá, že ČR bude mít jaderné zbraně". Navazuje na záznam [F-35
    jako jaderné nosiče B-61 (23. 5.)](#f-35-jako-jaderné-nosiče-b-61--čr-vstupuje-do-nuclear-sharing--vrabel-23-5-2026).'
- id: vrabel-2026-06-02-05
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: ČT jako propaganda ve „Zprávách v devět" — kerosin a univerzity (Vrabel, 2. 6. 2026)
  text: 'Vrabel ve své relaci „Zprávy v devět", v níž komentuje zpravodajství (mj. ČT), opakovaně označuje
    jeho rámování za propagandu sloužící ukrajinskému narativu. Dva příklady z 2. 6.: (1) zprávu o ruském
    zákazu vývozu leteckého paliva ČT dle Vrabela „hned dělá propagaci Ukrajincům" tím, že příčinu svádí
    na ukrajinské drony na rafineriích, ačkoli skutečnou příčinou je dle Vrabela íránská krize a nedostatek
    kerosinu (viz [Ceny energií — letecké palivo](ceny-energie.md#ruský-zákaz-vývozu-leteckého-paliva--příčinou-je-válka-v-íránu-ne-ukrajinské-drony-vrabel-2-6-2026));
    (2) zprávu o spolupráci Západočeské univerzity s Ukrajinou čte jako jednostrannou „proukrajinskou"
    orientaci médií i institucí.'
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-06-02-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Británie: případ Henryho Novaka a „obrácený rasismus" (Vrabel, 2. 6. 2026)'
  text: |-
    Ke zveřejněnému policejnímu záznamu z Británie — kde po útoku nožem zemřel 18letý student Henry Novak, zatímco policie spoutala jeho a soustředila se na muže tmavé pleti, který tvrdil, že byl rasově napaden — Vrabel tvrdí, že britská policie jedná na základě rasy a náboženství, nikoli činu. Z vlastní zkušenosti (žil v Británii) popisuje, že kritika islámu/muslimů je tam považována za „hate crime"; uvádí i příklad kamarádky odsouzené poté, co ji homosexuální barman obvinil ze sexuálního napadení. Tento mechanismus označuje za „obrácený rasismus" — protiústavní i v ČR (posuzování podle rasy/náboženství). Varuje, že migrační pakt přinese tuto situaci do ČR „od roku 2027".

    Tentýž případ komentuje i **Rajchl** (3. 6. 2026): zdůrazňuje, že vrah (Vikram Digma) byl v UK odsouzen na doživotí, ale policie po příjezdu po pouhém obvinění z rasismu spoutala oběť (která s pouty na rukou vykrvácela), nikoli pachatele. Označuje to za „důsledek falešné politiky" a dává to do souvislosti s rozsudkem nad SPD za předvolební plakát (viz [DSA a cenzura — trestání politického projevu](dsa-cenzura.md#rozsudek-nad-spd-za-předvolební-plakát--posvěcení-cenzury-rajchl-3-6-2026)).

    Ve vysílání **4. 6. 2026** Vrabel případ rozvedl s promítnutím videa: vraha jmenuje jako Vikrama Digwu (23letý sik), který Henryho Novaka cestou domů pětkrát bodl „rituálním nožem" (sikové mají z náboženských důvodů výjimku ze zákazu dlouhých nožů). Policie podle Vrabela místo záchrany umírajícího (který pětkrát opakoval „I can't breathe") spoutala jeho a soustředila se na pachatele tvrdícího, že šlo o rasový útok — a zatkla „bílého". Spojuje to s protesty v Southamptonu (Henry, Henry), s Tommym Robinsonem (demonstrace 1,5 mil. v Londýně) a Nigelem Faragem, kteří volají po ukončení „obráceného rasismu vůči bílému muži". Dává to do souvislosti s odsouzením SPD za plakát „chirurgové z dovozu" a opakuje, že tohle čeká ČR s migračním paktem.
  dalsi_zdroje:
  - 2026-06-03_rajchl_videoportal-rozsudek-nad-spd-a-cenzura-3-6-2026
  - 2026-06-04_vrabel_zpravy-v-devet-4-6-2026
- id: vrabel-2026-06-02-07
  typ: tvrzeni
  temata:
  - migrace
  nadpis: 'Srbsko jako kontrast: růst a ruští uprchlíci bez výhod (Vrabel, 2. 6. 2026)'
  text: 'Vrabel cituje srbského prezidenta Vučiće (odmítl spekulace o vízovém režimu pro Rusy; uvedl růst
    ekonomiky o 32 % v 1. čtvrtletí) a používá Srbsko jako protiklad k ČR. Do Srbska podle něj přišlo
    mnoho Rusů prchajících před válkou — ale na rozdíl od ukrajinských uprchlíků v ČR nemají žádná „speciální
    práva": dlouho čekají na víza, nedostávají od státu peníze, chovají se „s pokorou" a nejsou hlasití
    (často IT pracovníci pracující online). Vučić podle Vrabela rychle vyvrátil zprávu o zrušení víz Rusům
    (spojovanou s přibližováním k EU), což Vrabel hodnotí jako důkaz, že Srbsko nepodléhá tlaku EU a drží
    suverénní, multivektorovou politiku. Navazuje na jeho opakované hodnocení Srbska jako modelu suverenity.'
- id: vrabel-2026-06-02-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Skorumpovaný „mafiánský systém" — státní zastupitelství a bitcoinová kauza (Vrabel, 2. 6. 2026)
  text: |-
    Vrabel komentuje rezignaci státní zástupkyně Petry Alexové Polákové (odvolané z vyšetřovacího týmu k bitcoinové kauze, podle ní kvůli ztrátě důvěry ve vedení — jmenovala Bradáčovou a Dragouna). Vrabel z toho rozvíjí obecnou tezi o ČR jako „skorumpovaném mafiánském systému": státní zástupci jsou dosazováni tak, aby vyhovovali politickému establishmentu, ten ekonomickým strukturám v zemi, a ty „globalistickým ekonomickým strukturám ve světě"; kariérní postup žalobců se odvíjí od politické vstřícnosti, a žalobci, kteří vyšetřují korupci ve vysokých patrech, jsou „občas zavražděni". Spekuluje, že odvolání může souviset s tím, že ministr spravedlnosti dle něj „pere špinavé peníze" v bitcoinové kauze (zopakování jeho výroku „před rokem").

    Z toho vyvozuje program kompletní změny systému (připraven dle něj 2022/2023): odvolatelnost politiků, trestní a majetková odpovědnost za rozhodnutí, vymahatelnost předvolebních slibů přes petice a soudy. Dokud k tomu nedojde, „budeme se motat v kruhu lobbistů, skorumpovaných politiků, policie, žalobců a soudců".
  citace:
  - text: Jsme v systému, který je prostě potřeba kompletně změnit.
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-02-09
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: EU jako „diktatura tvářící se jako demokracie" — obchodní dohoda s USA (Vrabel, 2. 6. 2026)
  text: 'Ke schválení zrušení dovozních cel EU na americké výrobky (součást loňské dohody Trump–von der
    Leyen) Vrabel rozvíjí tezi, že EU není demokracie, ale „diktatura tvářící se jako demokracie". Argumentuje
    obráceným postupem rozhodování: von der Leyen — která podle něj k tomu „nemá žádnou pravomoc" — se
    dohodne s Trumpem na obchodu za 750–800 miliard EUR, podepíše smlouvu zásadně ovlivňující „naše peněženky",
    a teprve poté ji Komise, Evropská rada a Evropský parlament „odmávají". Správný demokratický postup
    by byl opačný: podnět od lidí/parlamentu → mandát pro vyjednavače → jednání. Dohodu označuje za nevýhodnou:
    EU bude platit 15% clo na své výrobky, USA nulové. Navazuje na jeho dřívější tezi o EP jako divadle
    (viz [EP jako divadlo](#evropský-parlament-jako-divadlo--skutečná-moc-je-v-komisi)).'
  citace:
  - text: Myslím si, že tohleto je nějaká diktatura, která se tváří jako demokracie.
  podtema: Evropský parlament a V4 strategie
- id: vrabel-2026-06-02-10
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Nová fáze SVO: ruské masivní údery jako odveta za Starobělsk (Vrabel, 2. 6. 2026)'
  text: 'Vrabel popisuje ruský úder z noci na 2. 6. jako nejmasivnější od začátku války: Rusko vyslalo
    729 vzdušných prostředků (656 dronů, 73 raket — Zirkon, Iskander, Kh-101, Kalibr). Cílem bylo deset
    zbrojních výrobních zařízení a tři náborová/rekrutační centra v Kyjevě. Vrabel to rámuje jako vstup
    speciální vojenské operace do „nové fáze" — odvety za ukrajinský útok na vysokou školu ve Starobělsku
    (21 mrtvých studentek), po němž se Rusko rozhodlo cílit nejen vojenské cíle, ale i „rozhodovací centra".
    Předpovídá, že útoky „můžou jít ještě mnohem dál a hloubějí". K ukrajinskému tvrzení o sestřelení
    604 ze 729 cílů je skeptický — „připadá mi to jako ukrajinská vojenská propaganda." Navazuje na záznam
    z [1. 6.](#) (Starobělsk, Babiš schválil 90 mld. EUR / 60 % na zbraně).'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-02-11
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Útoky na lodě v Černém moři + Budanovova „flexibilita" (Vrabel, 2. 6. 2026)
  text: Vrabel přebírá ruský narativ (Marija Zacharovová) o útoku dronem-kamikaze (300 kg trhaviny) na
    tureckou loď u řeckého ostrova a tvrdí, že Ukrajina páchá „teroristické útoky" na lodě v Černém moři
    a svaluje vinu na Rusko. Kritizuje českou vládu, že apriorně považuje Ukrajinu za „napadený stát",
    který „může dělat, co chce" — podle Vrabela by takové činy měly být odsouzeny v souladu s mezinárodním
    právem. K rozporu mezi výroky šéfa prezidentské kanceláře Budanova (jeden den hrozí útoky hluboko
    do Ruska, druhý den tlumočí Zelenského příkaz ukončit válku do zimy) Vrabel ironicky oceňuje jeho
    „flexibilitu" — přirovnává ji k českým politikům, kteří „jeden den řeknou, že je zeď černá, druhý
    den bílá, přestože je zelená".
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-02-12
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Výzva Zemanovi: odebrat Zelenskému Řád bílého lva (Vrabel, 2. 6. 2026)'
  text: V reakci na zprávu, že bývalý polský velvyslanec vrátil ukrajinské vyznamenání kvůli glorifikaci
    OUN/UPA, Vrabel jako předseda hnutí ČR na prvním místě vyzývá Miloše Zemana, aby Volodymyru Zelenskému
    odebral Řád bílého lva — nebo se veřejně omluvil za to, že nejvyšší české státní vyznamenání udělil
    „lídru neonacistického/fašistického režimu Ukrajiny". Tvrdí, že Zelenský si vyznamenání nezaslouží.
    Výrok navazuje na Vrabelovo dřívější hodnocení Zemana jako „nácka" (viz [Politický systém — brněnská
    demonstrace](politicky-system.md#brněnská-demonstrace--zklamání-z-vlastenecké-scény-vrabel-31-5-2026))
    a Ukrajiny jako „fašistického státu z definice".
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-02-13
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: '„Česko-Ukrajinsko": obava ze symbiotického státu (Vrabel, 2. 6. 2026)'
  text: 'Ke zprávě o chystané spolupráci Západočeské univerzity v Plzni s ukrajinskými partnery (a americkou
    Argonne National Laboratory) Vrabel uvádí, že spolupráce univerzit je obecně v pořádku, ale vadí mu
    jednostranná orientace „pořád jenom na Ukrajinu" — proč ne Čína, Japonsko, Rusko, Jižní Amerika. Z
    toho rozvíjí obavu, že se z ČR stává „přidružená země Ukrajiny": začalo to ukrajinskými vlajkami na
    vládních budovách (cizí stát), pokračuje upřednostňováním ukrajinských migrantů před českým obyvatelstvem
    a společnými integračními programy. Navazuje na jeho dřívější termín „Česko-Ukrajinsko" (viz [Politický
    systém — rektorka JAMU](politicky-system.md#rektorka-jamu-odvolaná-za-sundání-ukrajinské-vlajky--česko-ukrajinsko-vrabel-28-5-2026)).'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-02-14
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Muniční iniciativa = spoluzodpovědnost ČR za teror proti ruským civilistům (Vrabel, 2. 6. 2026)
  text: 'Vrabel reaguje na zprávu, že Ukrajina žádá od muniční iniciativy velkorážovou munici s větším
    dostřelem. Interpretuje to takto: Ukrajina nezvládá frontu (nedostatek vojáků, munice, protivzdušné
    obrany — kterou si USA stáhly do Íránu), proto zvolila novou taktiku — „působit teror na ruském území",
    útoky na ropnou infrastrukturu (ekonomický tlak) a na civilisty (psychologický tlak). Munice s dlouhým
    doletem má tomuto účelu sloužit. Klíčová teze: Česká muniční iniciativa znamená, že ČR „vzala na sebe
    zodpovědnost" za dodávky zbraní proti Rusku, za nimiž se ostatní (anonymní) země „schovávají" — a
    tím nese spoluzodpovědnost i za teroristické útoky proti ruským civilistům a dětem (Starobělsk). Babiš
    podle Vrabela vyhrál volby se slibem zrušení muniční iniciativy, ale postavil se za ni (jen bez českých
    peněz) — zodpovědnost tím zůstává. Vrabel rovněž tvrdí, že Západ se z pozice „dáváme zbraně Ukrajině"
    přesunul do pozice „vede válku proti Rusku" — Ukrajina už válku nefinancuje vůbec, vše (stát, platy
    „žoldáků", zbrojení) financuje Západ.'
