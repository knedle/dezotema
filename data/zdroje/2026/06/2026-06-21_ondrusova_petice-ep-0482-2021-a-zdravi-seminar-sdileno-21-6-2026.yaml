  poznamka: 'Petice EP **0482/2021** prezentována jako spor „zdraví občanů vs. ekonomické zájmy investorů":
    spojuje občanské iniciativy 15+ zemí, ČR a SR se připojily 12/2025; výbor EP pro petice 25. 9. 2025
    ponechal petici otevřenou = uznání, že VtE mohou škodit zdraví (hluk, infrazvuk, otázky neuzavřeny);
    březen 2026 mezinárodní konference v EP (vědci, lékaři, poslanci + lobby Wind Europe) — závěr: pochybnosti
    o dopadech na zdraví musí být důsledně přezkoumány. Chybějící legislativní limity na infrazvuk (ČR/SK/jinde);
    WHO 2018 doporučila obezřetnost; princip předběžné opatrnosti (Aarhuská úmluva, dohovor o krajině,
    smlouva o EU, RED3, ústava, Listina). „Najskôr zdravie, potom byznys"; nejsou proti zelené energii,
    ale „kde vyrobit, tam spotřebovať" (nenarušit síť, levnější); EU peníze = půjčka splácená všemi, zisk
    pár investorům. Slovenský premiér deklaroval, že VtE netřeba, ale příprava pokračuje „papírovo" (příprava
    pro další vládu). Výzva k volební účasti (10. měsíc) — „nemôže 5 poslancov rozhodnúť o zdraví celej
    dediny"; kniha „Negatívne účinky veterných elektrární" (200–300 studií, 800 odkazů, překlad do angličtiny
    pro Brusel). Bez predikcí a stoch. teroru. Sněmovní seminář „Příliš drahý vítr" — petice Evropského
    parlamentu Řečník: Ing. Katarína Ondrušová (slovenská aktivistka — informovanost o dopadech VtE)'
