    WHO 2018 doporučila obezřetnost; princip předběžné opatrnosti (Aarhuská úmluva, dohovor o krajině,
    smlouva o EU, RED3, ústava, Listina). „Najskôr zdravie, potom byznys"; nejsou proti zelené energii,
    ale „kde vyrobit, tam spotřebovať" (nenarušit síť, levnější); EU peníze = půjčka splácená všemi, zisk
    pár investorům. Slovenský premiér deklaroval, že VtE netřeba, ale příprava pokračuje „papírovo" (příprava
    pro další vládu). Výzva k volební účasti (10. měsíc) — „nemôže 5 poslancov rozhodnúť o zdraví celej
    dediny"; kniha „Negatívne účinky veterných elektrární" (200–300 studií, 800 odkazů, překlad do angličtiny
