  poznamka: 'Rajchl v reakci na Mariana Jurečku a Piráty opakuje a rozvádí návrh dobrovolných koncesionářských
    poplatků ČT (viz [Organizovaný zločin v politice, 19. 4. 2026](/temata/media-propaganda.md#rajchl-2026-04-19-02)):
    kdo chce, zaplatí i vysokou částku (rozpočet klidně 50 mld. Kč), kdo nechce, neplatí nic — argumentuje,
    že to zcela vyváže ČT z politického vlivu a donutí ji soutěžit o diváka. Odmítá logiku pojistného
    systému, poukazuje na porušení etického kodexu ČT (čl. 23.4) při redaktorské stávce a na zvýšení poplatků
    koalicí půl roku před volbami navzdory opačným slibům. Tematicky → [media-propaganda.md](/temata/media-propaganda.md).
    Bez predikcí a stoch. teroru. Zhlédnutí: 121 816 | Faktické poznámky v Poslanecké sněmovně (debata
    odbočila od služebního zákona k ČT)'
