  nadpis: 'ETS2: zastropování na 45 EUR je lež — zrušit emisní povolenky (Rajchl, 11. 6. 2026)'
  text: 'Rajchl reaguje na zprávu, že cena emisní povolenky ETS2 bude „zastropována" na 45 EUR. Tvrdí,
    že nejde o skutečný strop: po dosažení 45 EUR Evropská unie jen dvakrát ročně uvolní další 4 miliony
    povolenek (dohromady ~8 % ročně emitovaného množství), takže cena poroste dál. ETS2 označuje za „obrovský
    kšeft" a „zelenou lež"; má-li Evropa zůstat bohatá, je podle něj nutné zrušit emisní povolenky včetně
    ETS1. Navazuje na [Emisní povolenky: ČR platí 17× víc než Němci](/temata/suverenita-eu/2026.md#rajchl-2026-06-04-02).'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
