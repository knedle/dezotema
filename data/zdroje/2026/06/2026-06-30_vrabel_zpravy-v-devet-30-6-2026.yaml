- id: vrabel-2026-06-30-01
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Británie: 300 mld. liber na zbrojení; jaderné zbraně se posouvají blíž k Rusku (Vrabel, 30.
    6. 2026)'
  text: |-
    Britský premiér Keir Starmer představil desetiletý plán navýšení obranného rozpočtu (z 2,3 na 2,7 %, cíl 3 % HDP) — 300 mld. liber během čtyř let, včetně 5 mld. na drony a 115 mil. na AI technologie; slibuje ~60 000 pracovních míst. Vrabel to kontrastuje s vlastní zkušeností ze života v Británii (2000–2013): běžní lidé si podle něj často nemohli dovolit topit (platili si elektřinu předplacenou kartou) a žili na hranici chudoby — obří vojenské výdaje tak jdou na úkor obyčejných lidí, kterým „stát nedá ani na topení". Odmítá zdůvodnění výdajů „obranou Británie" — poukazuje, že britské rakety týden předtím útočily hluboko na ruské území, takže případný ruský protiúder by nebyl nevyprovokovaný. Souběžně USA investují 4+ mld. dolarů do modernizace vojenských základen ve Velké Británii (Lakenheath, Mildenhall, Fairford) včetně nových bunkrů pro skladování jaderných zbraní — Vrabel to čte jako další krok v postupu jaderných zbraní směrem k Rusku: z Británie se mají později přesunout do Polska, podobně jako z Francie do ČR (viz [Jaderné zbraně v ČR, 19. 5.](/temata/jaderne-zbrane.md#vrabel-2026-05-19-03)). USA zároveň vyvíjí první novou jadernou hlavici po 40 letech pro ponorky třídy Columbia.

    Vrabel dále rozebírá dvě možné cesty jaderné politiky: (1) cesta „jaderného odstrašení" prosazovaná Pavlem od roku 2014 v NATO — podle Vrabela vede nevyhnutelně k jaderné výměně, protože ruská doktrína („mrtvá ruka") předepisuje použití jaderných zbraní při ohrožení existence státu; (2) cesta odzbrojení podle vzoru Gorbačov–Reagan (Reykjavík) — postupné omezování a satelitní kontrola arzenálů jako jediná skutečná cesta k míru.
  citace:
  - text: Jaderná výměna mezi Ruskou federací a Evropou je existenční hrozbou minimálně pro Evropu určitě.
  osoby:
  - osoba: keir-starmer
    vztah: negativni
    kontext: 300 mld. liber na zbrojení, zatímco běžní Britové si nemohou dovolit topit — „lidi zlikviduje"
- id: vrabel-2026-06-30-05
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'Wikileaks: Petr Kolář jako velvyslanec radil USA přejmenovat raketovou základnu na „radar"
    a počkat na vládu Topolánka (Vrabel, 30. 6. 2026)'
  text: 'Vrabel cituje (dle vlastních slov z uniklých dokumentů Wikileaks) epizodu z doby, kdy byl Petr
    Kolář velvyslancem ČR ve Spojených státech: měl jednat s americkými partnery bez vědomí Ministerstva
    zahraničí ČR a doporučil jim dvě věci ohledně plánované americké protiraketové základny v Brdech.
    Zaprvé, aby o projektu nemluvili jako o „raketové základně", ale jako o „radaru" — česká veřejnost
    to prý lépe přijme, i když šlo fakticky o raketovou základnu. Zadruhé, aby s jednáním počkali, až
    skončí vláda Jiřího Paroubka a nastoupí vláda Mirka Topolánka, protože za Paroubka by projekt neprošel.
    Vrabel to hodnotí jako jednání „naprosto proti zájmům České republiky" a jako důkaz dlouhodobého vzorce
    — Kolář dodnes (jako poradce na Hradě) prosazuje jaderné zbrojení a zbrojní kontrakty bez ohledu na
    to, kdo je u moci.'
  osoby:
  - osoba: petr-kolar
    vztah: negativni
    kontext: Dle Wikileaks jako velvyslanec v USA jednal mimo rámec MZV — radil přejmenovat raketovou
      základnu na „radar" a počkat na vládu Topolánka místo Paroubka; „naprosto proti zájmům ČR"
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-30-06
  typ: predikce
  temata:
  - jaderne-zbrane
  nadpis: Babiš do ~2 let ustoupí EU a zruší slib snížení důchodového věku
  text: Babiš slíbil vrátit věk odchodu do důchodu na 65 let, což Evropská komise kritizuje jako dlouhodobě
    neúnosné (+2 % HDP na výdaje). Vrabel předpovídá, že Babiš tento slib za přibližně dva roky vzdá a
    nechá o věci rozhodnout Evropskou unii — podle stejného vzorce, jaký už uplatnil u F-35, muniční iniciativy
    a jaderných zbraní pro ČR.
  citace:
  - text: Bych tipnul, že to bude trvat tak dva roky, než Andrej Babiš poleví úplně a nechá to, aby to
      rozhodla Evropská unie.
  osoby:
  - osoba: andrej-babis
    vztah: rozporuplny
    kontext: 'Predikce: do ~2 let ustoupí EU a vzdá se slibu snížení důchodového věku na 65 let, jako
      už učinil u F-35/muniční iniciativy/jaderných zbraní'
  predikce:
    horizont: ~2 roky (do cca poloviny 2028)
    stav: ceka
