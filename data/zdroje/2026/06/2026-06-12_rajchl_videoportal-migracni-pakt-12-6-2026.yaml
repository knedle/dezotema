  nadpis: 'Migrační pakt: Rakušan jediný z V4 pro; odmítnout lze jen na úrovni EU (Rajchl, 12. 6. 2026)'
  text: 'Rajchl připomíná, že Vít Rakušan jako jediný z V4 hlasoval pro migrační pakt (Polsko a Maďarsko
    proti, Slovensko se zdrželo). Vysvětluje, že vládní „odmítnutí" paktu je jen gesto pro voliče — změnou
    vnitřní legislativy se nic nevyřeší, pakt lze odmítnout jen na evropské úrovni ve spojení s dalšími
    státy. Upozorňuje, že ESLP brání návratům migrantů (stačí tvrdit ohrožení např. kvůli sexuální orientaci)
    a že volba je „přijmout kvótu, nebo platit" (Maďarsko: 19 tis. migrantů, nebo 10 mld. Kč). Uzavírá,
    že jde o placení za německé chyby („otevřeli brány", selhalý sociálně-inženýrský projekt). Navazuje
    na [EU vydírá Maďarsko](suverenita-eu.md#eu-vydírá-maďarsko-přijmout-21-000-migrantů-nebo-zaplatit-10-miliard-kč).'
