  poznamka: 'Pokračování tématu z 24. 6. — Rajchl v debatě 360° rozebírá předběžné opatření ÚS (akreditace
    Pavla na summit NATO): jde o „zcela výjimečný nástroj", podle něj použitý „podruhé v historii" v podobném
    typu sporu; cituje disentní stanoviska soudců **Jaromíra Vintra a Veroniky Řepkové** (nástroj jen
    pro výjimečné případy s hrozbou mimořádné škody) — z Pavlovy cesty žádná mimořádná škoda nehrozí.
    Dvojí metr: u valorizace důchodů seniorů (podání existovalo) ÚS předběžné opatření sám nevydal, ač
    mohl. Opakuje podjatost předsedy ÚS **Josefa Baxy** (2019 demonstrace Milionu chvilek + podpis výzvy
    „chvilka pro rezignaci" k demisi Babiše) — „tím se sám spolitizoval". Moderátorka připomíná, že rozhodovalo
    15 soudců (2 disenty, oba jmenováni Pavlem). Tematicky → [politicky-system.md](politicky-system.md).
    Bez predikcí a stoch. teroru. Zhlédnutí: 77 037 | Sestřih z debaty 360° o rozhodnutí ÚS'
