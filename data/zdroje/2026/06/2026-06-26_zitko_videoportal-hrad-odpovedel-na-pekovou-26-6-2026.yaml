  poznamka: 'Jediné zpracované téma: Soňa Peková zveřejnila odpověď Kanceláře prezidenta republiky na
    svou petici (7. 5. 2026, přes 1000 podpisů) žádající milost/přezkoumání trestů 4 osob odsouzených
    za covidové výroky — odpověděl úředník (ředitel legislativního odboru), ne Pavel osobně; milost je
    vyhrazena jen pro humanitární případy, žádost o osobní jednání zamítnuta. Zítko to spojuje se svou
    tezí o soudech jako „soukromých firmách" a poukazuje na kontrast rychlosti ÚS v Pavlově vlastní kauze
    (Ankara) vs. měsíce/půl roku u běžných případů. Zbytek videa: logistika (4denní blokace profilu na
    FB, falešný klon, přesun na Rumble/Substack) a pozvánka na sraz v Penzionu Ráj 4.–6. 7. 2026 — nezpracováno
    (osobní/organizační). Tematicky → [kauzy.md](kauzy.md). Bez predikcí a stoch. teroru. Zhlédnutí: 553
    | Facebook blokace/klon profilu (logistika) + čtení odpovědi Hradu + pozvánka na akci v červenci'
