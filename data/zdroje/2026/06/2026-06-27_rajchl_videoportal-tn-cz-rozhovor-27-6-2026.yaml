  poznamka: 'Pokračování kauzy ÚS/Pavel/Ankara — Rajchl odmítá, že vyloučením Pavla z delegace byla porušena
    ústavní zvyklost: zvyklostí bylo, že o složení delegace rozhoduje vláda, ne že prezident musí být
    vždy zahrnut — dosud se to prostě nestalo, jde tedy o bezprecedentní, nikoli protiprávní situaci.
    Zpochybňuje přínos Pavlovy účasti kvůli výměně administrativy v USA (Biden→Trump) a připomíná Pavlův
    starší výrok, že mu Trump „odpuzuje jako lidská bytost". Kritizuje nejisté vystoupení soudců ÚS na
    tiskovce. Tematicky → [politicky-system.md](/temata/politicky-system.md). Bez predikcí a stoch. teroru.
