  poznamka: 'Rozhovor z velké části shrnuje již zdokumentovaná témata (tři body summitu NATO, nemožnost
    vojensky porazit Rusko, jaderná triáda/„mrtvá ruka", cesta odzbrojení a la Reykjavík, Kolář jako zbrojní
    zprostředkovatel, vzorec porušování slibů Babišem). Tři nově zpracované prvky: (1) Petr Pavel prosazoval
    jaderné zbraně v ČR už jako generál NATO, museli ho brzdit Američané — [jaderne-zbrane.md](jaderne-zbrane.md).
    (2) Proč globalisté „pustili" Babiše k moci — slib zamítnutí referenda o EU/NATO jako lakmusový papírek
    — [konspirace.md](konspirace.md). (3) Varování, že „okno" pro legální vystoupení ČR z EU se brzy uzavře
    (federalizace EU), s precedentem tvrdého zásahu Španělska proti katalánským politikům — [suverenita-eu.md](suverenita-eu.md).
    Bez predikcí (nad rámec již zaznamenaných) a stoch. teroru. Hostování v pořadu Petr Budeš TV'
