- id: vrabel-2026-06-30-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Pavel prosazoval jaderné zbraně v ČR už jako generál NATO — museli ho brzdit sami Američané
    (Vrabel, 30. 6. 2026)
  text: 'V rozhovoru pro Petr Budeš TV Vrabel tvrdí, že Petr Pavel byl už v době, kdy působil jako generál
    v NATO, jediným zástupcem z východního bloku, který požadoval umístění jaderných zbraní na území ČR
    a dalších východoevropských zemí — natolik intenzivně, že ho v tom museli krotit samotní Američané.
    Vrabel to čte jako důkaz, že Pavlův současný postoj k jaderným zbraním (návrh z března 2026, aby se
    ČR zapojila do francouzského jaderného „deštníku") není nová pozice, ale dlouhodobý rys, a spekuluje,
    že právě proto byl Pavel „vybrán" pro roli prezidenta v tomto historickém období — v návaznosti na
    varování profesora Staňka (ještě před covidem) a Oskara Krejčího (2020, „osa zla": Rusko, Čína, Indie),
    že se dlouhodobě připravuje válka.'
- id: vrabel-2026-06-30-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: 'Proč globalisté „pustili" Babiše k moci: slib zamítnutí referenda jako lakmusový papírek (Vrabel,
    30. 6. 2026)'
  text: V rozhovoru pro Petr Budeš TV Vrabel rozvádí svou tezi o CIA/globalistickém výběru politiků na
    konkrétním příkladu Andreje Babiše. Během předvolební kampaně 2025 Babiš i jeho hnutí mluvili o vystoupení
    z EU a NATO — dokud veřejně neprohlásil, že v žádném případě nepřipustí referendum o vystoupení z
    EU ani z NATO. Podle Vrabela právě v tento okamžik přišlo (od CIA či amerického ministerstva zahraničí,
    „přes 4 kanály") schválení, že se Babiš může stát premiérem, protože garantoval, že bude nadále pracovat
    pro EU a NATO — přirovnává to k Robertu Ficovi na Slovensku, který sliboval odmítnutí migrantů a zbraní
    pro Ukrajinu, a nakonec obojí dělá. Jako důkaz konzistence tohoto vzorce vyjmenovává, že Babiš porušil
    sliby ohledně F-35, muniční iniciativy, vakcinace (spolupodíl na násilném očkování) a nyní i slibu
    nesouhlasu se 70 mld. dolarů pro Ukrajinu — vsází se, že totéž se stane i s tímto slibem.
  citace:
  - text: V tomhle tom okamžiku, kdy se postavil za ty globalisty a jasně to slíbil, tak najednou bylo
      povoleno někde z CIA [...], že Andrej Babiš se může stát premiérem České republiky, protože bude
      pracovat pro EU a pro NATO.
- id: vrabel-2026-06-30-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: „Okno" pro vystoupení z EU se brzy zavře — varování na příkladu Katalánska (Vrabel, 30. 6. 2026)
  text: 'V rozhovoru pro Petr Budeš TV Vrabel varuje, že ČR má už jen omezený čas (podle něj „možná ještě
    několik let, možná už ani ne"), kdy je vystoupení z Evropské unie legálně možné — v okamžiku, kdy
    se EU „zfederalizuje", se toto okno uzavře a další pokusy o odtržení už nebudou tolerovány. Jako varovný
    precedens uvádí Katalánsko: když se katalánští politici pokusili o odtržení od Španělska, byli zatčeni,
    zbiti policií a uvězněni — protože „Španělsko se nemůže rozpadat", stejně jako se federalizovaná EU
    nebude moci nechat rozpadnout. Sám počítá s tím, že pokud bude toto stanovisko prosazovat dál, hrozí
    mu podobný osud. Uvádí to jako naléhavý apel: jediná cesta ke změně systému vede přes vystoupení z
    EU i NATO, dokud je to ještě legální možnost.'
  podtema: Česká suverenita
