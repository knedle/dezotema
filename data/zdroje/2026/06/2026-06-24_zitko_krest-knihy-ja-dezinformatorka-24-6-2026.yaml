  poznamka: 'Křest beletristické knihy **Jany Peterkové „Já, dezinformátorka"** — milostný román prolínaný
    s osudy „dezinformátorů" (Tomáš Čermák ve vězení); „dezinformátor = ten, kdo mluví pravdu" (nálepka
    systému/médií od covidu, odkaz na Tuckera Carlsona); inspirace David Icke; paralela s K. H. Máchou
    (musel si „Máj" vydat sám kvůli cenzuře/germanizaci) — vydalo „Spoutané nakladatelství" (i Pfizergate
    od F. Baldá); dle Peterkové jediný beletristický počin o době 2020–24. Zítkův recap (opakování): COVID
    = pokusy na lidech / porušení Norimberského kodexu / „masové vraždy, genocida a sterilizace národa",
    pokles porodnosti −30 % za 4 roky (vinou očkovaných žen); vlády Babiše i Fialy „se nechali napálit"
    farmaceutické mafii; korporace Česko vs. ČSR (zákon 11/1918); šarže na „E" (96 % úmrtnost) a 22R–22Z
    (5 % šarží = >70 % mrtvých); výzva k vojenskému tribunálu (kniha Günthera Franka „Zločin v režii státu").
    **Stoch. teror:** Zítko doporučil šarži „E" „zejména pro členy vlády, parlamentu a jejich rodiny".
    Média/cenzura: otevřený dopis TV NOVA (red. Michala Klárová) i Seznamu (Kristýna Ciroková — „Putinova
    děvka" rétorika) s výzvou referovat o knize/covidu pravdivě; ČT každý den porušuje zákon (Dvořák/Souček/Chudárek
    „přes 300 tis."), poplatky vrátit od 12. 3. 2020, „ať platí Minář a jeho parta"; Facebook blok (15.
    6. fotka Trump+Gaethje) + falešný klon (1200 lidí za 4 dny, zablokován Zítkův profil). Kritika Rajchla
    (desatero z 26. 1. = předstírání — VHO/očkovací strategie nesplněny, Kotlár „ztichl") a Babiše (rozdal
    koblihy, superstar zpěvák ve zdravotnickém týmu, roušky za 777 Kč). Logistika (sv. Jan = výročí Zítkova
    zatčení 2 roky) nezpracována. Křest knihy „Já, dezinformátorka" v Doksech u Máchova jezera (Jana Peterková
    + kmotr Pavel Zítko)'
