  poznamka: 'Lavrov — „spirit of Anchorage" jako možné získání času pro vyzbrojení Ukrajiny (analogie
    minských dohod / Merkelové), cíle SVO (neutrální/nezařazená/nejaderná Ukrajina, zrušení diskriminace
    ruského jazyka a pravoslaví, uznání Krymu/Donbasu/Novoruska), Bělorusko vtahováno do konfliktu (Rusko
    poskytne vojenskou pomoc dle dohody o svazovém státě), výzva diplomatům opustit Kyjev = příprava tvrdého
    útoku na Kyjev. Bělorusko — Zelenský schválil údery na běloruské rafinerie (běloruský benzín do Ruska
    +13×), „poslední šance couvnout"; Vrabel: vysoká pravděpodobnost války NATO+Ukrajina vs. Bělorusko
    „během pár dnů" (predikce). Pavel a summit NATO — vláda rozhodla, že nepojede, Hrad podal kompetenční
    žalobu k ÚS; Vrabel vyjmenoval všech 19 summitů NATO (1999–2025) a kdo ČR zastupoval — vždy prezident
    (Havel/Klaus/Zeman/Pavel), jen 2022 vedl delegaci Fiala (Zeman měl zákaz létat) → „ostuda" je umělé
    téma odvádějící pozornost od ženutí do války; Storm Shadow (dolet ~450 km) na ruské území den po Starmerově
    pádu. Írán/USA — Mike Waltz (OSN): vojenské řešení na stole, Trump „z pozice síly"; Rubio: USA do
    Íránu investovat nebude (memorandum ~300 mld $ byla „hra"), Trump chce 350 mld $ od Evropy; Vrabel:
    Trump nedává prostor diplomacii, ale kapitulaci, dlouhodobý cíl = „pevnost Amerika"/TechNate a ovládnutí
    komodit, konflikt po podzimních primárkách bude pokračovat. Policejní brutalita Západu (dánský novinář
    Lars Andersson zatčen doma za kritiku premiérky, Británie, němečtí policisté zmlátili Poláky na hřbitově)
    = „předválečný stav" / likvidace opozice (covid jako „test" zlomení lidí); ČR zastrašování (Čermák,
    odznak Z, Kutý). Migrace — muslimové = mladí muži „jedou dobýt Evropu"; francouzská žena dostala podmínku
    za „nenávist" poté, co byla sexuálně napadena migrantem (pachatel na svobodě). Albánie/Srbsko — protesty
    proti Kushnerovým rezortům (Albánci násilím, Srbové bez násilí ubránili rozbombardovanou budovu v
    Bělehradě — architekti otevřený dopis); Vrabel fandí, protesty mají smysl (Francouzská revoluce, Srbsko
    Rio Tinto / dvoje volby); ČR 2022 „nevydržela", podpora Rajchla = „největší politická chyba". V4 —
    Babiš jede na summit V4 s novým maďarským premiérem Magyarem; vlastenci jásají, ale V4 je zase jednotná
    jen proto, že Magyar (i Babiš) mají na válku stejný názor jako ostatní (Orbán byl jiný) = příprava
    na mobilizaci. Putin — multipolární svět, modernizace jaderné triády, Istanbulské dohody 2022 + Anchorage
    modality. Polsko vs. Ukrajina — historická paměť (Volyň) vítězí nad prozápadní touhou, Nawrocki odebral
    řád, Poláci domobrana (Braun/Konfederace). Sense8 (Wachowski) — společnost rozdělena vertikálně (elity
    vs. lid), ne horizontálně; elity vytvářejí konflikty, aby si udržely bohatství. Predikce: válka Bělorusko
    vs. NATO/Ukrajina možná „během pár dnů". Bez stoch. teroru. Zprávy v devět s komentářem (moderátorka
    Zuzka)'
