vyroky:
- id: vrabel-2026-06-23-01
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Francouzka odsouzena za „nenávist" po sexuálním napadení migrantem — Vrabel (23. 6. 2026)
  text: 'Vrabel tvrdí, že migrační pakt přivádí převážně mladé muže z islámských zemí, kteří „vypadají,
    jako kdyby jeli dobýt Evropu", a tak se i chovají. Jako příklad „potlačování svobody slova" uvádí
    francouzský případ: ženu, do jejíhož bytu se vloupal a sexuálně ji napadl migrant (dle Vrabela z africké/islámské
    země), prý soud odsoudil k podmíněnému trestu (cca 1,5 roku) za to, že po incidentu veřejně prohlásila,
    že bezpečnost Francouzů nejvíc ohrožují migranti z Afriky a Blízkého východu — tedy za „šíření nenávisti
    vůči určitým rasám"; pachatel přitom zůstal na svobodě. Zasazuje to do teze, že ČR „kopíruje" dvě
    cesty současně — ukrajinskou (likvidace opozice, militarizace) a západní (migrace + trestání projevu
    podle rasy/náboženství). Navazuje na [Británie: Henry Novak a „obrácený rasismus" (2. 6.)](#británie-případ-henryho-novaka-a-obrácený-rasismus-vrabel-2-6-2026).'
- id: vrabel-2026-06-23-02
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Výčet 19 summitů NATO jako důkaz, že „ostuda Pavla" je umělé téma — Vrabel (23. 6. 2026)
  text: 'Vrabel reaguje na celonárodní debatu, zda smí Petr Pavel na summit NATO (vláda rozhodla, že ne,
    Hrad podal kompetenční žalobu k ÚS), tím, že prošel všech **19 summitů NATO od vstupu ČR (1999–2025)**
    a kdo na nich ČR reprezentoval: Washington 1999 (Havel), Řím 2002, Praha 2002 (Havel), Istanbul 2004,
    Brusel 2005, Riga 2006, Bukurešť 2008, Štrasburk/Kehl 2009, Lisabon 2010, Chicago 2012 (Klaus), Newport
    2014, Varšava 2016, Brusel 2018, 2021 (Zeman), Vilnius 2023, Washington 2024, Haag 2025 (Pavel). Závěr:
    delegaci **vždy vedl prezident**, jedinou výjimkou byl rok 2022, kdy Zeman nesměl ze zdravotních důvodů
    létat a zastoupil ho premiér Fiala. Vrabel z toho dovozuje, že nikoho nikdy nezajímalo, kdo ČR na
    summitu zastupuje — „umělá aféra" má jen odvést pozornost od toho, že se ČR ženou do války; je mu
    „jedno", zda pojede Pavel nebo Babiš, protože „oba tam udělají úplně to samé" (podpoří NATO, vstup
    Ukrajiny do EU/NATO, 82 mld pro Ukrajinu). Předpovídá, že Pavel nakonec u ÚS uspěje a pojede. Rozšiřuje
    [Spor Pavel vs. Babiš a Starmerova rezignace jako „iluze demokracie" (22. 6.)](#spor-pavel-vs-babiš-o-summit-kompetenční-žaloba-a-starmerova-rezignace-jako-iluze-demokracie--vrabel-22-6-2026).'
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-23-03
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: V4 je zase jednotná, protože i Maďarsko souhlasí s válkou — Vrabel (23. 6. 2026)
  text: 'K odletu Andreje Babiše na summit V4 (s novým maďarským premiérem Peterem Magyarem) Vrabel reaguje
    na nadšení „vlastenců" na sociálních sítích („konečně V4 pohromadě, vláda zdravého rozumu"). Cituje
    ČTK, podle níž byla spolupráce V4 v minulých letech oslabená kvůli odlišným pohledům na válku — Orbánovo
    Maďarsko udržovalo dobré vztahy s Moskvou. Vrabel z toho vyvozuje opačné čtení než vlastenci: V4 se
    zase může scházet právě proto, že nový maďarský premiér Magyar (i Babiš) už má na válku „stejný názor
    jako ostatní" lídři (Ukrajina do EU, Rusko agresor, NATO zachránce, plnění závazků). Sjednocená V4
    tak podle něj není dobrá zpráva, ale příprava na to, „jak budou mobilizovat vaše syny". Navazuje na
    jeho tezi o Magyarovi jako „falešném mesiáši" a o umělé „opozici".'
  osoby:
  - osoba: peter-magyar
    vztah: negativni
    kontext: Nový maďarský premiér — díky němu je V4 zase „jednotná", protože má na válku stejný názor
      jako ostatní (na rozdíl od Orbána) = příprava na mobilizaci
  podtema: Evropský parlament a V4 strategie
- id: vrabel-2026-06-23-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Lavrov: „spirit of Anchorage" jako možné získání času; příprava útoku na Kyjev; Bělorusko (Vrabel,
    23. 6. 2026)'
  text: 'Vrabel rozebírá tvrdé vyjádření Sergeje Lavrova. Lavrov prý naznačil obavu, že summit Trump–Putin
    na Aljašce (Anchorage) mohl — podobně jako minské dohody — sloužit jen k „získání času" pro vyzbrojení
    Ukrajiny; přímo to přirovnal k tomu, jak Angela Merkelová („rodič jedna") později přiznala, že minské
    dohody měly Ukrajině dát čas se vyzbrojit. Lavrov zopakoval cíle SVO (neutrální, nezařazená a nejaderná
    Ukrajina; zrušení diskriminace ruského jazyka a kanonického pravoslaví; uznání „nové reality" Krymu,
    Donbasu a Novoruska) a varoval, že Bělorusko je vtahováno do konfliktu — Rusko mu dle dohody o svazovém
    státě poskytne v případě úderů na běloruské území vojenskou pomoc. Klíčové: trvá doporučení zahraničním
    státům **evakuovat diplomaty z Kyjeva** — Vrabel to čte jako jasný signál přípravy tvrdého ruského
    útoku na Kyjev. Doplňuje, že Evropa záměrně útočí na Rusko jen z ukrajinského území (Storm Shadow
    den po Starmerově pádu), aby nepřišly odvetné údery na EU — proto „obětním beránkem" zůstává Ukrajina.
    Navazuje na [Barbarossa 2.0 (22. 6.)](#barbarossa-20-tanky-do-litvy-mladí-ukrajinci-s-ss-symboly-české-motory-pro-drony-vrabel-22-6-2026).'
  citace:
  - text: Je úplně evidentní, že se Rusové chystají na tvrdý útok na Kyjev.
  osoby:
  - osoba: sergej-lavrov
    vztah: neutralni
    kontext: Citován — „spirit of Anchorage" mohl být získáním času (jako minské dohody/Merkelová); cíle
      SVO; Rusko poskytne Bělorusku vojenskou pomoc; výzva opustit Kyjev
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-06-23-05
  typ: predikce
  temata:
  - valka-nato-rusko
  nadpis: Válka Bělorusko vs. NATO/Ukrajina možná „během pár dnů"
  text: Vrabel považuje za „docela reálné" a „vysoce pravděpodobné", že po Zelenského opakovaných výhrůžkách
    (a schválení úderů na běloruské rafinerie) Ukrajina — fakticky NATO přes Ukrajinu — během příštích
    pár dnů zaútočí na Bělorusko, čímž se konflikt rozšíří o další zemi (Rusko slíbilo Bělorusku vojenskou
    pomoc). Mírně eskaluje jeho [predikci z 20. 6.](#ladislav-vrabel--konflikt-s-běloruskem-nepřijde-před-summitem-nato-20-6-2026)
    (že konflikt nepřijde před summitem NATO).
  citace:
  - text: Lze předpokládat s vysokou pravděpodobností, že se nám tady během příštích pár dnů může rozběhnout
      další válka, a to mezi Běloruskem a v podstatě NATO.
  predikce:
    horizont: dny (konec června 2026)
    stav: vyvraceno
    vyhodnoceni:
    - datum: 2026-11-20
      text: válka Běloruska s NATO nebo Ukrajinou v následujících dnech nevypukla
      stav: vyvraceno
    - datum: 2026-11-20
      text: Vrabel 26.–29. 6. mluví jen o výhrůžkách a jednáních.
