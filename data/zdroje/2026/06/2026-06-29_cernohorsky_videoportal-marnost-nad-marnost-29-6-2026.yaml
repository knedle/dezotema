vyroky:
- id: cernohorsky-2026-06-29-01
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Vláda nabídla kompromis — Pavel jen na jednu neformální akci; „marnost nad marnost" — Černohorský
    (29. 6. 2026)
  text: 'Vláda Andreje Babiše rozhodla, že se Petr Pavel může summitu NATO v Ankaře zúčastnit jen v omezené
    míře — jedné neformální večeře/akce, nikoli jako plnohodnotný člen delegace. Pavel to označil za rozpor
    s předběžným opatřením Ústavního soudu, které vládě zakázalo bránit mu v účasti. Černohorský to komentuje
    jako „marnost nad marnost": Pavlovi podle něj nelze vysvětlit, že ho na summitu ve skutečnosti nikdo
    ze současné vlády nechce, a připomíná starší video, kde Pavel stál stranou, zatímco si vláda (Babiš,
    motoristé, SPD) připíjela šampaňským po jmenování — čekal, zda si s ním někdo přiťukne.'
  citace:
  - text: Petřík Pavlík ne a ne to pochopit [...] že ho nikdo z vlády nechce na samitu NATO v Ankaře.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
