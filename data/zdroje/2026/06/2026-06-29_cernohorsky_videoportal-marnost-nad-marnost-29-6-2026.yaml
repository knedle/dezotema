  poznamka: 'Pokračování kauzy ÚS/Pavel/Ankara — vláda Babiše rozhodla, že se Pavel zúčastní summitu jen
    omezeně (jedna neformální akce/večeře), Pavel to označuje za rozpor s předběžným opatřením ÚS. Černohorský
    to komentuje jako „marnost nad marnost" — Pavel nechápe, že ho ve vládě nikdo nechce; připomíná starší
    video, kde stál stranou při přípitku vlády po jmenování. Tematicky → [politicky-system.md](/temata/politicky-system.md).
