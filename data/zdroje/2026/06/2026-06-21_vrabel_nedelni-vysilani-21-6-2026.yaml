  nadpis: V prezidentských volbách „vytáhnou herce" jako Zelenského
  text: Vrabel očekává, že proces „ukrajinizace" ČR je už daný a že v prezidentských volbách establishment
    „vytáhne" oblíbeného herce — stejně jako na Ukrajině vyšel Volodymyr Zelenský (původně populární herec
    slibující mír), který se pak stal „diktátorem". Prezidentem se podle něj stane ten, „koho vybere CIA".
  citace:
  - text: Předpokládám, že v těch prezidentských volbách vytáhnou herce. Oblíbeného herce. Stejně jako
      to bylo na Ukrajině.
  osoby:
  - osoba: volodymyr-zelensky
    vztah: negativni
    kontext: Přirovnán k lupiči v bance, který „neutekl"; vede „fašistický režim", vyhrožuje Bělorusku;
      posílá řády poštou zpět do Polska
  predikce:
    horizont: příští prezidentské volby (neurčeno)
