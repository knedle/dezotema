    (Aspen Institute), prezidenta „vybírá CIA", v prez. volbách „vytáhnou herce" jako Zelenského. Volební
    „podvod" SPD/PRO/Trikolora/Svobodní (koalice „Spojení" vydávaná za jednu stranu — 5 % místo 11 %,
    ÚS rozhodl proti, kmotr Hrdlička ovládá vlasteneckou scénu; Okamura přepisuje ČRNPM; Konečná/Bobošíková
    natahovaly spolupráci); kritika Rajchla (pokrytectví — porno „pro Němce", udával Kutý/Jaška/bratra
    za nášivky Wagner/Z, vyhrožování kvůli vlastnímu zveřejněnému videu) + Vrabel jako „pravdivostní extrémista"
    (pravda = extrém, kritika kultury „o nikom se nemluví"); politická likvidace manželky Bojany (BIS
    bezpečnostní hrozba bez možnosti soudu, insolvenční dluh ~3 mil. bez dokazování, ESLP až po vyčerpání
    ČR) + vlastní dotační odsouzení (covid = náhrada škody, ne dotace; přijal podmínku); Srbsko vs. ČR
    (studna „je vaše, voda už ne" = státní bohatství + statisícové pokuty, plán EU omezit noční elektřinu
    domácnostem, zákaz pálenky/očkování, elektřina ~2 Kč); migrace = Kalergiho plán (Ukrajinci přes slučování
    rodin → až 3 mil., muslimové do Evropy, „rozděl a panuj"); Facebook řízený vládou (zadní vrátka, potlačuje
    dosah Vrabela a nadhání Rajchla, „nebezpečnější než média"); manželka má kontakty na RF (advokát přítel
    Lavrova, Dugin online) — ale „nevyužíváme proti ČR". Stoch. teror: nezpracován (predikce ruských úderů
    na velitelská centra/„ručičky generálů NATO" = popis války, ne výzva). Predikce: Írán–USA konflikt
    na roky; kolaps Ukrajiny v zimě → mír; za 5 let vítězství Ruska/BRICS, poražená Evropa, občanská válka
    na Západě, ~3 mil. Ukrajinců v ČR; v prez. volbách „vytáhnou herce". Pravidelné nedělní živé vysílání
    (ze Srbska, ~440 diváků)'
