vyroky:
- id: vrabel-2026-06-21-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Srbsko vs. ČR: plán EU omezit noční elektřinu, „voda už není vaše" — Vrabel (21. 6. 2026)'
  text: 'Vrabel staví Srbsko jako protiklad „šikany" v ČR/EU a uvádí dva konkrétní příklady regulace.
    (1) **Noční elektřina:** EU prý uvažuje nutit domácnosti šetřit elektřinu večer a v noci, aby zbylo
    víc energie pro datová centra a „elektrifikovaný průmysl" — což spojuje s „klimatickou bruselskou
    politikou" cílící na deindustrializaci. (2) **Voda ze studny:** sdílí (s výhradou, že nepotvrzeno)
    zprávu, že za vlastní studnu hrozí od roku 2026 statisícové pokuty — „studna je vaše, ale voda už
    ne", protože podzemní voda je v ČR „státní bohatství" a majitel jen uživatel potřebující povolení
    k nakládání s vodami. Cituje známého, který se odstěhoval do Srbska: tam lze mít tři studny, pálit
    pálenku, není povinné očkování, elektřina je „za dvě koruny" a vytápění většího domu ~3–4 tis. Kč/měsíc
    — „a není to v EU". Doplňuje [Srbsko má levný plyn díky přímé dohodě Vučić–Putin](/temata/ceny-energie.md#rajchl-2026-03-28-01)
    a osobní [Srbsko jako model suverenity](/osoby/vrabel.md#suverenita-a-eu).'
  podtema: Energetika a Rusko
- id: vrabel-2026-06-21-02
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: CIA dosadila a řídí české elity (Klaus, Havel, Zeman); „prezidenta vybírá CIA" — Vrabel (21.
    6. 2026)
  text: Vrabel tvrdí, že převrat v roce 1989 „napsala a udělala CIA" a že si pro něj vybrala lidi, s nimiž
    spolupracovala a kteří byli „vyškoleni na Západě" (přes Svobodnou Evropu / Hlas Ameriky) — jmenuje
    Václava Klause, Václava Havla a Miloše Zemana. Od té doby prý čeští politici „jezdí na školení do
    Aspen Institutu" a jsou „pod kontrolou"; vše dle něj řídí ministerstvo zahraničí USA ve spolupráci
    s CIA. Z toho vyvozuje, že budoucího prezidenta „vybere CIA" a přes média se to „zahraje". Klause
    viní z „okupované privatizace" (kvůli čemuž se prý rozešel s Petrem Hájkem v Protiproudu), Zemanovi
    vyčítá podpis česko-německé deklarace 1997 a finální „rozkaz" ocenit Zelenského a postavit se proti
    Putinovi. Navazuje na Černohorského/Zítkův výklad [Sametové revoluce jako řízeného rozpadu](/temata/konspirace-ceskoslovensko.md#cernohorsky-2025-06-08-04)
    a na tezi, že prezidentské volby „vytáhnou herce" jako na Ukrajině (viz [Predikce](/predikce/index.md)).
  citace:
  - text: Prezident bude ten, koho vybere CIA. To bude prezident.
  osoby:
  - osoba: milos-zeman
    vztah: negativni
    kontext: Vyznamenal Zelenského Řádem bílého lva — má se omluvit/odebrat; označen za jednoho z „trojky"
      dosazené CIA (s Klausem a Havlem), podpis česko-německé deklarace 1997
  - osoba: vaclav-klaus
    vztah: negativni
    kontext: Zodpovědný za „okupovanou privatizaci", dosazen CIA; Macinka ho ocenil jako svého „politického
      otce"
  - osoba: vaclav-havel
    vztah: negativni
    kontext: Spolu s Klausem a Zemanem dosazen a vyškolen CIA při převratu 1989
- id: vrabel-2026-06-21-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Facebook „nebezpečnější než média" — řízené potlačování dosahu Vrabela, nadhánění Rajchla (Vrabel,
    21. 6. 2026)
  text: 'Vrabel rozvíjí tezi o Facebooku jako nástroji řízení společnosti (navazuje na [Facebook backdoor
    (24. 5.)](/temata/media-propaganda.md#vrabel-2026-05-24-05)). Tvrdí, že Facebook je „mnohem nebezpečnější
    než tradiční média", protože manipulace není vidět: u jeho příspěvků je „omezený dosah" (sdílení se
    dál nezobrazuje), zatímco politik, kterého prý FB „dostal za úkol" propagovat, má „deset tisíc lajků"
    a zobrazuje se i lidem, kteří ho neznají. Konkrétně srovnává sebe (potlačovaný) s Jindřichem Rajchlem
    (boostovaný) a tvrdí, že to vůbec není „organické" — uživatelé si myslí, že jde o přirozenou popularitu
    „hvězdy", ale „je to všechno umělé". Opírá se o to, že vláda má dle Zuckerberga „zadní vrátka" do
    Facebooku, a stejnou logiku přenáší na výsledek voleb a budoucí prezidentskou kampaň („udělají, aby
    tam byli ti správní lidé").'
  citace:
  - text: Facebook je mnohem nebezpečnější než média. [...] Vy nevidíte, komu se co zobrazuje.
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-06-21-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Volební „podvod" SPD/PRO/Trikolora; kmotr Hrdlička „ovládá vlasteneckou scénu" — Vrabel (21.
    6. 2026)
  text: |-
    Vrabel obviňuje volební uskupení „Spojení pro vás" (SPD + PRO + Trikolora + Svobodní) z podvodu na voličích: ač šlo o koalici, kandidovalo jako jediná politická strana — pro vstup do sněmovny jí tak stačilo 5 % místo koaličních 11 %, kterých by podle průzkumů nedosáhli. Hnutí ČR na prvním místě (a před ním dr. Sládek) to napadlo u soudu; krajské soudy prý daly za pravdu (jde o koalici, nelze registrovat jako jednu stranu), ale Ústavní soud rozhodl, že dodržení zákona by „narušilo volby" — Vrabel: podvod, kterým se do sněmovny dostali ti, kdo chtějí dělat zákony, „nikomu nevadí", zatímco obrana u soudu byla vykreslena jako udavačství. Tvrdí, že kvůli tomu jeho voliči (kromě „nejstatečnějších ~14 tisíc") odešli k SPD, které „přeskočí práh".

    Do širšího rámce klade tezi, že vlasteneckou scénu „vlastní" kmotr **Tomáš Hrdlička** (ODS): Okamura prý přišel do vyšší politiky přes Hrdličku a u toho byla „obětována" agenda hnutí Islám v ČR nechceme, aby měl Okamura scénu pod kontrolou — což mu prý potvrdili „úplně všichni" (Žárko Jovanović/Raptor TV, Bobošíková, Konečná). Okamura podle Vrabela „přepisuje" ČR na prvním místě (denně opakuje slogany, je v médiích). Dodává, že i Konečná (Stačilo) a Bobošíková ho údajně „natahovaly" se slíbenou spoluprací před eurovolbami a pak couvly. Navazuje na [Demonstrace 2022 zlikvidovány — opozice je dnes součástí vlády (24. 5.)](/temata/politicky-system/2026.md#vrabel-2026-05-24-06) a [SPD v koalici pořádá demonstrace proti vlastní vládní politice (19.–22. 5.)](/temata/politicky-system/2026.md#vrabel-2026-05-19-04).
  citace:
  - text: Oni řekli, nám stačí pět procent. [...] A to je podvod.
  osoby:
  - osoba: tomio-okamura
    vztah: negativni
    kontext: „Podvodník" — do vyšší politiky přes kmotra Hrdličku, „obětoval" agendu Islám v ČR nechceme;
      denně „přepisuje" ČR na prvním místě; koaliční volební podvod (5 % místo 11 %)
  - osoba: tomas-hrdlicka
    vztah: negativni
    kontext: Kmotr (ODS), který podle Vrabela „vlastní/ovládá vlasteneckou scénu" (SPD, PRO, Trikolora)
  - osoba: katerina-konecna
    vztah: negativni
    kontext: V EP hlasovala pro migrační cesty z Afriky, dnes „vlastenka"; „natahovala" Vrabela se slíbenou
      spoluprací před eurovolbami
  - osoba: miroslav-sladek
    vztah: pozitivni
    kontext: „Velmi tvrdý člověk"; na demonstraci napaden (vytržen megafon od Vrabela), správně připomněl
      Zemanovu roli v deklaraci 1997
  podtema: Volby
- id: vrabel-2026-06-21-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Vrabel jako „pravdivostní extrémista"; kritika kultury „o nikom se nemluví" — pokrytectví Rajchla
    (21. 6. 2026)
  text: |-
    Vrabel přijímá nálepku „extrémisty" a obrací ji: říká, že je „pravdivostní (pravdicový) extrémista", protože pravda je z principu extrém — nelze ji „ředit" půlpravdami a kompromisy („stačí jedna kapka lži a otráví celou nádrž pravdy"). Odmítá českou konvenci „o nikom se nemluví, špínu pod koberec" jako mechanismus, který znemožňuje pojmenovat základní problémy a dostat se „z marastu".

    Jako příklad pokrytectví, které pojmenovává, uvádí Jindřicha Rajchla: tvrdí, že Rajchl „udával" lidi za politický názor (Robert Kutý — dosud podmínka, Kuba Jašek — psychologické vyšetření a ztráta práce, Robertův bratr za odznak „Z" a nášivku Wagner Group) a že jako student natáčel porno „pro německou společnost", ač dnes káže „hodnoty rodiny". Zdůrazňuje, že neřeší Rajchlovo soukromí, jen to, co sám zveřejnil — a kritizuje, že kvůli vlastnímu (s kameramanem natočenému a uploadnutému) videu s manželkou pak označil jeho zveřejnění za „útok na rodinu". Stejnou optikou „pokrytectví" zmiňuje Zemana (řád Bílého lva) i Konečnou (dříve v EP hlasovala pro migrační cesty z Afriky, dnes „vlastenka"). Srov. [Vrabelovo hodnocení Rajchla — Zmíněné osoby](/osoby/vrabel.md#zmínění-lidé).
  osoby:
  - osoba: rajchl
    vztah: negativni
    kontext: „Pokrytec" — udával lidi za politický názor (Kutý, Jašek, bratr za nášivky Wagner/Z), natáčel
      porno „pro Němce", vyhrožoval kvůli vlastnímu zveřejněnému videu; Facebook ho uměle nadhání
  podtema: Politická kultura
- id: vrabel-2026-06-21-06
  typ: predikce
  temata:
