  poznamka: '„31/5 KORESPONDENCE S ČT". Zítko čte celou e-mailovou výměnu s referentkou ČT pro výběr poplatků:
    odmítá platit „výpalné", cituje §2 zák. 483/1991 o objektivitě a vyváženosti, ČT označuje za mediálního
    spolupachatele „zabíjení" očkováním (Norimberský kodex, propad porodnosti), hrozí mezinárodní žalobou
    (ICCPR 1966). Příměr „porno pro zahrádkáře". Tři příklady porušení: COVID propaganda, ignorace Zítkovy
    kandidatury 2022 (6 kandidátů Aspen Institutu), rozsudek Harabina (Rusko není agresor). Barry Young
    (NZ): smrtnost šarží Pfizer (21,4 %); vatikánský deník 1989 o mikročipech a „prasečí šipce". Závěr:
    pozvánka na webinář WELL ZONE (vagus nerv, frekvence). Zhlédnutí: 486'
