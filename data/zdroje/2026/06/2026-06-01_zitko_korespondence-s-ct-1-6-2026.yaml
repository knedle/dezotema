  nadpis: Dlouhodobě plánovaná „plandemie" — vatikánský deník 1989 (Zítko, 1. 6. 2026)
  text: 'Zítko ve vysílání 1. 6. 2026 prezentuje jako „důkaz" dlouhodobého plánování pandemie článek,
    který prý vyšel 1. srpna 1989 v oficiálním vatikánském deníku — tedy 37 let před vysíláním a ještě
    „za Československa". Článek měl nést titulek „Velký bratr se blíží" a odhalovat „tajný plán na označení
    každého muže, ženy a dítěte" kódovanými mikročipy implantovanými do každého člověka na světě, propojenými
    s centrálním počítačem schopným kohokoliv kdykoliv lokalizovat. Klíčová citace, kterou Zítko opakuje:
    „Vše, co bude muset vláda udělat, je vymyslet něco jako prasečí šipku a vakcínu proti ní." Zítko to
    spojuje s prasečí chřipkou roku 2009 (20 let po článku) i s pozdějším covidem jako naplněním téhož
    scénáře.'
  podtema: Původ a povaha pandemie
- id: zitko-2026-06-01-02
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Barry Young (Nový Zéland): konkrétní čísla smrtnosti šarží Pfizer (Zítko, 1. 6. 2026)'
  text: |-
    Zítko ve vysílání 1. 6. 2026 sdílí novozélandského informátora Barryho Younga, který dle Zítka prohledal vládní zdravotnickou databázi a byl za zveřejnění „smrtících šarží" zatčen po domovní prohlídce. Konkrétní čísla, která Zítko cituje:

    - **Šarže 1**: 152 úmrtí ze 711 očkovaných = 21,4 % zemřelo (těchto šarží mělo být údajně 26 000)
    - **Šarže 2**: 38 úmrtí z 221 = 17,2 %
    - **Šarže 3**: 48 úmrtí z 310 = 15,5 %
    - **Běžná míra úmrtnosti** za stejné období byla dle Younga pouze 0,75 %

    Young dle Zítka uzavírá, že statistická pravděpodobnost náhodnosti takových čísel je „1 ku 100 miliardám" — tedy je „statisticky nemožné, aby tato vakcína lidi nezabíjela", zejména u šarží začínajících písmenem „E". Zítko připojuje vlastní rámec: úmrtí nenastávala ihned po vpichu (to by vyvolalo ostražitost), ale v tempu 3–5 let. Doplňuje i další čísla z řečí jiných aktérů: Helmut Sterz v Bundestagu — 60 000 mrtvých jen po Pfizeru v Německu; britský poslanec — 150 milionů celosvětově; Tucker Carlson — 17 milionů.

    ⚡ **Konflikt:** Novozélandská zdravotní data o úmrtnosti šarží Barryho Younga (zaměstnance Te Whatu Ora) byla nezávisle vyhodnocena jako statisticky chybná interpretace — čísla nezohledňují, že nejstarší šarže byly podány nejstarší a nejnemocnější populaci. Regulační orgány tvrzení o stonásobně vyšší smrtnosti šarží nepotvrdily.
  osoby:
  - osoba: barry-young
    vztah: pozitivni
    kontext: 'Nová konkrétní čísla smrtnosti šarží Pfizer z NZ databáze: šarže 1 = 152/711 (21,4 %), šarže
      2 = 38/221 (17,2 %), šarže 3 = 48/310 (15,5 %); běžná úmrtnost jen 0,75 %, pravděpodobnost náhody
      „1 ku 100 miliardám"'
  podtema: Šarže vakcín
- id: zitko-2026-06-01-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Korespondenční válka Zítka s ČT o vrácení poplatků (1. 6. 2026)
  text: |-
    Ve vysílání z 1. 6. 2026 Zítko přečetl celou dosavadní e-mailovou výměnu s referentkou ČT pro výběr poplatků — text, který původně sepsal na žádost diváků, aby se mohli „bránit vymahačům výpalného". Zítko v něm žádá vrácení všech poplatků zaplacených od 12. 3. 2020 a opírá se o §2 odst. 2 písm. a) zákona č. 483/1991 Sb. (povinnost poskytovat objektivní, ověřené a vyvážené informace), který dle něj ČT trvale porušuje. Tři klíčové příklady jsou totožné s jeho dřívější argumentací (viz [Zákon č. 483/1991: tři příklady porušení, 4. 5. 2026](#zákon-č-4831991-tři-zdokumentované-příklady-porušení--argument-zítka-proti-placení-poplatků-4-5-2026)): COVID propaganda, ignorace jeho prezidentské kandidatury 2022 (ČT prý preferovala šest kandidátů „z linie Aspen Institute" — Pavel, Babiš, Nerudová, Fischer, Gilčer, Středula — a komolila mu jméno na „Jan Řídko / Petr Řídko") a ignorování slovenského rozsudku JUDr. Harabina (13. 1. 2026), že Rusko není agresor.

    Výměna eskalovala: referentka odpovídala formulářovými dopisy, které dle Zítka „jako kdyby e-mail ani nečetla" — proto ji v odpovědích oslovoval stále ostřeji („Paní Vymahačko, opravdu nevím, jestli máte nějaký kognitivní psychický problém se čtením textu"). ČT pracovníky obecně označil za „mentálně retardované jedince na pozici redaktorů". Jako rétorickou pomůcku použil příměr: je to prý stejné, jako kdyby placený porno-kanál vysílal 24 hodin pořady pro zahrádkáře (nebo naopak) — předplatitelé by oprávněně žádali vrácení peněz za obsah v rozporu s deklarovaným zaměřením. Zítko zároveň zformuloval širší obvinění: ČT je „mediální spolupachatel zabíjení", protože od 12. 3. 2020 nekriticky propagovala „experimentální genovou terapii", čímž porušila Norimberský kodex a podílela se na úmrtích, poškození zdraví i na propadu porodnosti. Hrozí mezinárodní žalobou na referentku osobně i na ČT podle Mezinárodního paktu o občanských a politických právech (ICCPR, 1966) a požaduje odškodné „v milionech korun".
  citace:
  - text: Koncesionářské poplatky není možný nazývat jinak než výpalné.
  podtema: ČT poplatky a omezování na sociálních sítích
