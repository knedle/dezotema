  nadpis: Píseň „Moravo, nenechci zničit svůj domov" — Boldy (3. 6. 2026)
  text: Boldy zveřejnil písňové video stylizované jako lidová moravská píseň, které vyjadřuje odpor proti
    výstavbě větrných elektráren na Moravě (zmíněny obce Celožnice a Moravany). Píseň staví větrníky do
    protikladu k tradiční krajině vinohradů a lesů, označuje přírodu za „svatou" a vyzývá k odeslání turbín
    „do Bruselu" i k společnému protestu v Praze.
  citace:
  - text: Dejte si je do Bruselu, lajenové na zahradu / My tu máme lesy, pole, vinohrady, neobří vrtule
      nad každou dědinou vzadu.
  - text: Tak pojedme do Prahy všichni spolu stát.
  podtema: Kulturní a občanský odpor
