  nadpis: Migrace jako Kalergiho plán; čekají nás mnohem větší vlny (Vrabel, 20. 6. 2026)
  text: 'Ke zprávě o rekordních počtech migrantů (304 mil. lidí žijících mimo zemi původu v roce 2024)
    Vrabel tvrdí, že hlavní příčinou migrace není ekonomika ani klima, ale „globalistická agenda": cílem
    je jeden světový stát s jednou světovládou řízenou elitami. Odvolává se na „Kalergiho plán" — vytvoření
    „nového evropského člověka", smíšeného a vykořeněného, který nebude vědět, „kým je", aby národy už
    nikdy nedržely pohromadě. EU podle něj proto „bojuje jen s nelegální migrací" naoko, ale promíchání
    populace je jejím principem (zboření národů kvůli „míru"). Předpovídá, že dosavadní příchod milionů
    z Afriky a Blízkého východu je teprve začátek — s válkami, vedry/klimatem a otevřenými hranicemi přijdou
    „desítky milionů" a velká demografická změna (viz [predikce](predikce.md)). ČR si podle něj situaci
    zhoršila migračním paktem (platným od 12. 6.) a otevřením hranic ukrajinským uprchlíkům. Navazuje
    na [Migrační pakt vstoupil v platnost — Kalergiho plán (12. 6.)](#migrační-pakt-vstoupil-v-platnost--vláda-ho-podle-vrabela-neodmítla-12-6-2026).'
- id: vrabel-2026-06-20-06
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Babiš = Pavel: žádná změna ve vládě, L-39 pro Ukrajinu (Vrabel, 20. 6. 2026)'
  text: Ke zprávě, že premiér Babiš chce s ukrajinskou stranou navrhnout partnerům (Norsko, Dánsko, Nizozemsko,
    Belgie) financování nákupu deseti cvičně-bojových letounů L-39 pro ukrajinské letectvo, Vrabel konstatuje
    „žádnou změnu" — Babiš pokračuje v podpoře zbrojení pro Ukrajinu. Připomíná, že jde o tatáž letadla,
    která dříve Ukrajincům nabízel prezident Pavel a Babiš to tehdy odmítl s tím, že je ČR potřebuje.
    Vyvozuje, že Babiš dělá „úplně to samé co Pavel" (paralela i s jadernými zbraněmi od Francie) — voliči,
    kteří čekali změnu, se dočkali jen rétoriky „Česko na prvním místě", kterou Babiš „uspí národ", a
    pak se pokračuje dál. Navazuje na [Umělý konflikt vláda vs. prezident; Babiš/Macinka „předstírají
    opozici" (13. 6.)](#umělý-konflikt-vláda-vs-prezident-babišmacinka-předstírají-opozici-vůči-fialovi--vrabel-13-6-2026).
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-20-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Válka NATO/EU/Ukrajina proti Rusku — „opona brzy spadne" (Vrabel, 20. 6. 2026)
  text: 'Vrabel ke svým předčítaným zprávám (z RT/Sputniku) opakuje tezi, že nejde o válku Ukrajiny proti
    Rusku, ale že ve válce s Ruskem je celý Západ — NATO, EU i Česká republika. Tiskové prohlášení Zelenského,
    von der Leyen a Antonia Costy (otevření prvního „klastru" přístupových jednání Ukrajiny s EU) označuje
    za lhaní: politici prý líčí, že „Ukrajina sama tvrdě útočí a vyhrává", zatímco realita je, že útoky
    vede Západ společně s Ukrajinou (zbraně, peníze na chod státu i výrobu zbraní, muniční iniciativa,
    vojáci). Předpovídá, že „opona brzy spadne" a lidé uvidí, že „král je nahý" — tedy že jde o válku
    NATO/EU/Ukrajiny proti Rusku. Cituje Trumpovo prohlášení, že Evropa má zaplatit 350 mld. $ za Bidenovy
    zbraně, i tezi, že Trump (sám biznismen, který válku spoluzaložil za prvního období) se po anglicku
    „vycouvává" a hraje mírotvorce. Navazuje na [Tři fáze konfliktu Západ–Rusko (31. 5.)](#tři-fáze-konfliktu-západrusko-od-majdanu-k-terorismu-na-ruském-území-vrabel-31-5-2026).'
  podtema: Příčiny a odpovědnost za válku
- id: vrabel-2026-06-20-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Zelenský vyhrožuje Bělorusku, Bělorusko hrozí „celým arzenálem" (Vrabel, 20. 6. 2026)
  text: 'Vrabel popisuje eskalaci vůči Bělorusku: Zelenský prý otevřeně pohrozil, že pokud Bělorusko do
    týdne nestáhne zbraně od ukrajinské hranice, udělá to Ukrajina sama. Běloruský poslanec Oleg Gajdukevič
    odpověděl, že výhrůžky, vydírání a ultimáta na Bělorusko neplatí; pokud Západ na Bělorusko zaútočí,
    nepůjde o „speciální vojenskou operaci", ale o použití „celého arzenálu sil a prostředků" — a do konfliktu
    se zaplete celá Evropa. Vrabel zdůrazňuje, že za Zelenským fakticky stojí NATO a EU, že Bělorusko
    je vyzbrojené (Iskandery podél hranice, údajně už jaderné zbraně) a varuje „nedávejte vypálené sirky
    zpátky do krabičky". Konflikt podle něj nepřijde hned — čeká se na summit NATO (viz [predikce](predikce.md)).'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-20-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zeman se obhajuje, proč ocenil Zelenského — Vrabel: zostudil ČR (20. 6. 2026)'
  text: 'Poté, co polský prezident odebral Zelenskému řád Bílé orlice, vyzval Vrabel opakovaně Miloše
    Zemana, aby se vyjádřil k udělení Řádu bílého lva Zelenskému. Zeman vydal prohlášení: dlouhodobě prý
    kritizoval ukrajinský nacionalismus (Bandera, Azov), ale Zelenského vyznamenal v roce 2022 „z jediného
    důvodu" — že při ruském útoku neutekl (paralela s rokem 1968); vnitřní problémy Ukrajiny (korupce,
    potlačování demokracie, uctívání válečných zločinců) se ale podle Zemana zhoršují a „za nic z toho
    by si Zelenský vyznamenání nezasloužil". Vrabel reakci odmítá: přirovnává Zelenského k lupiči, který
    v bance vraždí a bere rukojmí, a Zeman mu za to, že „neutekl", dává nejvyšší vyznamenání. Označuje
    udělení řádu za Zemanův „poslední politický čin", kterým „zostudil Českou republiku i sám sebe"; ČR
    by měla řád odebrat jako Polsko, a pokud toho Zeman není schopen, měl se aspoň omluvit národu. Připomíná
    Janu Lorencovou, která řád Bílého lva v roce 2022 na Václaváku vrátila. Navazuje na [Zelenského náborová
    propaganda a odebrání řádu (Navrocki) — Vrabel (19. 6.)](#zelenského-náborová-propaganda-a-odebrání-řádu-navrocki--vrabel-19-6-2026).'
  podtema: Stav Ukrajiny a mobilizace
