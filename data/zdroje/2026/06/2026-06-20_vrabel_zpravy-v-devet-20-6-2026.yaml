  nadpis: Biolaboratoře na Ukrajině cílené na „genetický profil" Rusů — Larry Johnson (Vrabel, 20. 6.
    2026)
  text: Vrabel přebírá tvrzení bývalého důstojníka CIA Larryho Johnsona, že USA na Ukrajině financovaly
    tajný vojensko-biologický program s nebezpečnými patogeny (antrax, mor, tularemie, Marburg, ebola).
    Podle Johnsona se patogeny upravovaly tak, aby byly navázané na „genetický profil" a zabíjely cíleně
    Rusy; Rusové prý přišli laboratoře uzavřít. Jako stavitele/financiéry jmenuje firmy Metabiota, Black
    & Veatch a CH2M Hill a americký státní rozpočet; existenci prý potvrdila i šéfka amerických tajných
    služeb. Johnson zároveň kritizoval Západ a WHO, že ruská varování označovaly za dezinformace. Rozšiřuje
    [Gabbard oficiálně odtajnila dokumenty o 120 biolaboratořích (13. 6.)](#gabbard-oficiálně-odtajnila-dokumenty-o-120-biolaboratořích--konspirace-se-stala-pravdou-vrabel-13-6-2026).
- id: vrabel-2026-06-20-04
