  nadpis: Írán–USA „memorandum o porozumění" jako kapitulace USA (14 bodů) — Vrabel (20. 6. 2026)
  text: 'Vrabel čte ze zveřejněného textu memoranda o porozumění mezi USA a Íránem (Al Jazeera / Al-Arabia)
    a prochází jeho 14 bodů: úplné ukončení války (vč. Libanonu), vzájemné respektování suverenity a nevměšování,
    konečná dohoda do ~60 dnů, zrušení námořní blokády a stažení amerických sil z regionu do 31 dnů, plán
    ekonomické obnovy Íránu za ≥300 mld. $, zrušení všech sankcí (vč. rezolucí RB OSN), íránský závazek
    nevyrábět jaderné zbraně, rozmrazení všech íránských aktiv (~100–150 mld. $), výjimky pro vývoz íránské
    ropy a konečná dohoda schválená rezolucí RB OSN (se souhlasem Ruska a Číny). Vrabel z toho vyvozuje,
    že jde o „absolutní kapitulaci USA": Spojené státy podle něj nedosáhly „ani centimetru" (Írán prý
    jaderné zbraně stejně nevyráběl), jen Trump bude moci tvrdit, že „zabránil íránské jaderné bombě".
    Navenek přitom Trump dál vyhrožuje (60 dní, jinak „brutální útok"). Hodnotí to jako Trumpovu „obrovskou
    ostudu" a geopolitickou ztrátu — válku rozpoutal zbytečně. Opakuje i tezi o shortování ropy/krypta
    těsně před Trumpovými oznámeními. Rozšiřuje [Írán „memorandum" podepsáno (15. 6.)](#írán-memorandum-podepsáno-14-6-hormuz-otevřen-19-6-netanjahu-nespokojen--vrabel-15-6-2026)
    a [Írán memorandum: detaily (16. 6.)](#írán-memorandum-detaily-a-izrael-jako-překážka--vrabel-16-6-2026).'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-20-02
