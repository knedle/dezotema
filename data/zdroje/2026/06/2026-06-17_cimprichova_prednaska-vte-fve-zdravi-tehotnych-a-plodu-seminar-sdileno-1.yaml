  poznamka: 'Vadné hodnocení dopadů VTE (akce MMR 15. 5.: 3měsíční biologické hodnocení, jedna modelová
    studie, jediný uznaný účinek nespavost); PFAS „věčné chemikálie" na vrtulích a jejich spad (štítná
    žláza, játra/ledviny, rakovina, střeva); dopady na těhotné a plod (potraty, hypertenze, nižší porodní
    váha, plodnost, „nefungují očkovací látky", přechod do mléka); infrazvuk a kortizol (274× studie);
    návrhy (stop VTE, §156 TZ, zrušit nadbytečné turbíny 220 vs 140, nezačít s prodejem ČEZ, zařadit prof.
    Turánka, porodnost 2025 nejnižší od 1785). Sněmovní seminář „Příliš drahý vítr" — vliv VTE na zdraví
    těhotných a plodu Řečník: Ing. Mgr. Pynelopi Cimprichová'
