  poznamka: 'Stávka ČT/ČRo + demonstrace Milionu chvilek na podporu ČT — Vrabel stávku vítá (doporučuje
    trvalou), ČT = válečná/globalistická propaganda, Minář placená nastrčená figurka (Halík mu pomáhal
    s diplomkou). Pavel vs. Babiš — summit NATO/kompetenční žaloba k ÚS: Vrabel nevidí jiný kurz Pavla
    než Babiš/Macinka, spor čte jako boj o zbrojní zakázky (Pavel/Kolář vs. Macinka/USA) nebo štvaní společnosti
    / „iluzi demokracie" + umělé téma odvádějící pozornost od ženutí do války. Starmer rezignoval = „cynický
    podvod demokratické obnovy" (cituje K. von Hofmeistera), paralela s ČR 2025 (volby = iluze, staronová
    vláda — Vojtěch/Šilerová/Havlíček/Babiš — jede stejný kurz: proti Rusku, pro NATO/EU/Agendu 2030)
    → potvrzení Rajchlovy predikce z 21. 6. Írán–USA jednání (Švýcarsko): pokrok (6 mld $ aktiv, IAEA
    inspektoři, deeskalace Libanon), ale Netanyahu nestahuje z Libanonu + spor o Hormuz (USA vs. Írán
    kdo vybírá poplatky), Trump dává Íránu hodně před primárkami; Sýrie — al-Šaraa odmítá vojensky zasáhnout
    proti Hizballáhu = „schizofrenní" pozice mezi Západem a islamisty (paralela Erdogan); Izrael — ČR
    jediná plně podporuje (Macinka veto rezolucí EU), zatímco USA (Vance/Trump kritika Netanyahua) i EU
    (ICC zatykač) se distancují. Polsko vs. Ukrajina — válka o vyznamenání (Nawrocki odebral řád Bílého
    orla, Ukrajinci vracejí řády poštou, Volyň, konference o obnově Ukrajiny Gdaňsk 25.–26. 6.); Trump
    chce 350 mld $ od Evropy za Bidenovu pomoc Ukrajině (Vrabel: nakonec zaplatíme, EU se zadluží vůči
    USA). Dánsko — pravicový extremismus mladých Ukrajinců (svastiky/SS, ~65 tis.), Evropa „se probouzí"
    k nacismu na Ukrajině; riziko ozbrojených Ukrajinců v EU (analogie Turci/džihad). Barbarossa 2.0 —
    Německo přesouvá tanky do Litvy + 5000 vojáků k běloruské hranici do 2027, Vilnius mobilizace; ruský
    náměstek MZV Bruško: militarizace NATO připomíná přípravu Barbarossy; ČR/CSG (Avia/Avianera Technologies)
    + Ukrainian Armor dohoda na motory pro ukrajinské řízené střely a drony (Eurosatory, kde promítali
    bombardování Moskvy). Západní dystopie — Německo zvyšuje důchodový věk na 73, Kanada eutanazie (50
    tis., i pro psychicky nemocné), ČR zvyšuje odchod do důchodu — stát potřebuje peníze na válku; Babiš
    plánuje vyšší schodek 2027 (2,8 % HDP). Macinka vs. Pavel — „šplhání" (Pavel kariérní rozvědčík, Macinka
    „podržtaška Klause"), ale oba dělají totéž; Babiš 2020 vyhostil ~80 ruských diplomatů a adoroval Zelenského
    = „žádná změna kurzu". Predikce: žádná nová (potvrzena Rajchlova o Starmerovi). Bez stoch. teroru.
    Zprávy v devět s komentářem (moderátorka Zuzka), v den výročí operace Barbarossa'
