- id: vrabel-2026-06-22-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Sýrie: al-Šaraa odmítá zasáhnout proti Hizballáhu — „schizofrenní" pozice (Vrabel, 22. 6. 2026)'
  text: 'K jednání USA o pomoci se situací v Libanonu Vrabel komentuje postoj syrského prezidenta Ahmeda
    al-Šaraa: ten odmítl, že by Sýrie vojensky zasáhla proti Hizballáhu, řekl, že cesta nevede přes vojenské
    operace, ale přes politická jednání, a označil Hizballáh za „jedinou sílu schopnou zabránit Izraeli
    v invazi hlouběji do Libanonu". Vrabel z toho vyvozuje, že al-Šaraa je v „schizofrenní situaci": navenek
    spolupracuje se Západem (díky němuž se dostal k moci), ale fakticky bude spíš tajně podporovat radikálnější
    islámské skupiny a nechce ani plně spolupracovat s Izraelem (trn v oku muslimskému světu). Přirovnává
    ho k tureckému prezidentu Erdoganovi — muslimskému lídrovi člena NATO, který zároveň dobře spolupracuje
    s Ruskem. Závěr: skutečným problémem je dle al-Šaraa „okupace, útlak a porušování suverenity izraelskou
    armádou", ne jen Hizballáh.'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-22-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Vrabel vítá stávku ČT/ČRo a demonstraci Milionu chvilek (22. 6. 2026)
  text: 'Vrabel reaguje na výstražnou stávku zaměstnanců ČT a Českého rozhlasu (proti změně financování)
    a na navazující demonstraci Milionu chvilek před ČT. Stávku vítá a ironicky doporučuje „dotáhnout
    ji k dokonalosti" — ke stoprocentní a trvalé — protože by si podle něj všichni „oddychli", kdyby skončilo
    médium dělající „válečnou a globalistickou propagandu". Účast „tisíců" před ČT bagatelizuje: jsou
    to prý hlavně lidé „nasátí" na ČT (zaměstnanci, externí firmy, jejich rodiny), takže stačilo, aby
    přišlo ~30 % z nich. Připomíná, že na Václavském náměstí dal divákům odhlasovat, že ČT nesmí na pódium.
    Mikuláše Mináře (nově s „copánky", aby vypadal „jako kluk z ulice") označuje za placenou nastrčenou
    figurku napojenou i na Sudetoněmecký Landsmannschaft, jemuž s diplomovou prací na FF UK pomáhal Tomáš
    Halík. K formě financování opakuje, že je „jedno", zda poplatky nebo daně — „stejně to zaplatíme";
    chce kompletní výměnu vedení ČT a vyvážené zpravodajství (jako požadoval 2022). Navazuje na [ČT a
    ČRo by měly být zrušeny — Tarabová](/temata/media-propaganda.md#tarabova-2026-04-18-01).'
  citace:
  - text: Bych jim doporučoval, aby to dotáhli k dokonalosti, ke stoprocentní stávce, trvalý.
  podtema: Česká televize a mainstreamová média
- id: vrabel-2026-06-22-03
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Spor Pavel vs. Babiš o summit (kompetenční žaloba) a Starmerova rezignace jako „iluze demokracie"
    — Vrabel (22. 6. 2026)
  text: |-
    Ke sporu o summit NATO (vláda rozhodla, že delegaci povede Babiš, Hrad chystá kompetenční žalobu k ÚS) Vrabel opakuje, že nevidí jediný kurz, v němž by se Pavel lišil od Babiše/Macinky — ptá se diváků, „jakou ostudu Pavel dělá" a co jiného by na summitu prosazoval. Spor čte buď jako boj o zbrojní zakázky (Pavel/Kolář vs. Macinka s kontakty v USA), nebo jako záměrné „štvaní společnosti" a „umělé téma" odvádějící pozornost od toho, že je ČR vtahována do války.

    Rezignaci britského premiéra Keira Starmera (22. 6.) — kterou média líčí jako vítězství demokracie a „nový kurz" — označuje (s citací komentátora K. von Hofmeistera) za „cynický podvod demokratické obnovy" v systému ovládaném globalistickými zájmy: vystřídá ho „jiný Starmer" a Británie zůstane ve stejných problémech, jen se „upustí tlak". Vidí přímou paralelu s ČR 2025: po vlně odporu proti Fialovi přišly volby a „staronová vláda" (Vojtěch, Šilerová, Havlíček, Babiš + Okamura/Macinka), ale kurz (proti Rusku, pro NATO/EU/Agendu 2030) se nezměnil — „krok A" z let 2022–2024 neměl ve volbách 2025 návaznost. Rozšiřuje [Umělý konflikt vláda vs. prezident (13. 6.)](/temata/politicky-system/2026.md#vrabel-2026-06-13-06) a [Summit NATO/OSN jako „divide et impera" (8. 6.)](/temata/petr-pavel.md#vrabel-2026-06-08-06).
  citace:
  - text: Je to iluze demokracie. To, co udělali dneska v Británii, to samé udělali v roce 25 v České
      republice.
  osoby:
  - osoba: keir-starmer
    vztah: neutralni
    kontext: Jeho rezignace (22. 6.) označena (s citací von Hofmeistera) za „cynický podvod demokratické
      obnovy" — vystřídá ho „jiný Starmer", kurz se nezmění
  - osoba: petr-macinka
    vztah: negativni
    kontext: Vetuje rezoluce EU proti Izraeli; „podržtaška Klause", k moci se „prošplhal" osobními kontakty
      — dělá ale totéž co Pavel (NATO/USA)
  - osoba: andrej-babis
    vztah: negativni
    kontext: Slibuje plnit závazky vůči NATO; v roce 2020 vyhostil ~80 ruských diplomatů a adoroval Zelenského
      — „žádná změna kurzu" oproti Fialovi
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-22-04
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: '„Barbarossa 2.0": tanky do Litvy, mladí Ukrajinci s SS symboly, české motory pro drony (Vrabel,
    22. 6. 2026)'
  text: |-
    V den výročí operace Barbarossa (22. 6.) Vrabel rámcuje militarizaci NATO jako přípravu na válku s Ruskem. Cituje ruského náměstka MZV Alexandra Bruška, podle něhož „pokračující militarizace NATO a EU se začíná podobat plánům nacistického Německa na invazi do SSSR v roce 1941". Konkrétně: Německo přesouvá tanky do Litvy a k běloruské hranici umístí do roku 2027 trvale ~5000 vojáků (Bild), Vilnius se připravuje na „totální mobilizaci", pobaltské země jsou „nejvíc nacifikované po Ukrajině". Výroba zbraní se přesouvá z Ukrajiny do zemí EU, aby je Rusko nemohlo bombardovat bez přímého útoku na EU — Vrabel opakuje, že „už jsme ve válce s Ruskem", jen Rusové se snaží udržet boje na území Ukrajiny (likvidace velitelských center / důstojníků NATO, mimo Zelenského palác a parlament).

    Dva konkrétní symptomy: (1) **Dánská státní TV** varuje před pravicovým extremismem mladých ukrajinských uprchlíků (svastiky, znaky SS; ~65 tis. mladých Ukrajinců) — Vrabel: Evropa „se probouzí" k nacismu na Ukrajině, který od roku 2022 popírala (Rajchl ještě 2023 hlásil lidi za písmeno Z); varuje, že ozbrojení Ukrajinci v EU mohou být bezpečnostním rizikem (analogie s Turky a hypotetickým „džihádem"). (2) **České zbrojní byznysy**: Avia (Avianera Technologies, skupina CSG Michala Strnada) podepsala s Ukrainian Armor dohodu o vývoji a dodávkách motorů pro ukrajinské řízené střely a drony — na veletrhu Eurosatory, kde se na velkém plátně promítalo bombardování Moskvy. Navazuje na [Útoky na Moskvu jako eskalace (18. 6.)](/temata/valka-nato-rusko/2026.md#vrabel-2026-06-18-08).
  citace:
  - text: My už jsme ve válce s Ruskem, jenom Rusové se snaží, aby z toho nebyla světová válka, aby se
      to odehrávalo na území Ukrajiny.
  podtema: Eskalace a hrozba rozšíření konfliktu
