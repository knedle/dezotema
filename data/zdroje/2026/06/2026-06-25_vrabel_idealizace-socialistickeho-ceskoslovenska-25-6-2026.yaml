  poznamka: 'Vrabel idealizuje socialistické Československo: ~220 tis. aktivních vojáků a obranné výdaje
    5–10 % HDP, a přesto stát zajišťoval bezplatné vzdělání a zdravotní péči, důchod v 60 letech (ženy
    dříve), stavěl byty/silnice/elektrárny/přehrady/továrny/školy, pomáhal zemím třetího světa, nulová
    nezaměstnanost bez ohledu na rasu/vyznání, „neonacismus nemyslitelný", lepší práce Sboru národní bezpečnosti,
    výrazně méně organizovaného zločinu a narkomanů. Klíčový kontrast: tehdejší dluh ~3,7 mld $ vs. dnešní
    ČR 169 mld $ (3,5 bil. Kč). V popisu dodává tezi o rozkrádání: „dřív se rozkradlo třeba 10 %, ale
    vrátilo se to do oběhu, dnes se krade mnohem víc a velká část se odváží ven ze země". Bez predikcí
    a stoch. teroru. Zhlédnutí: 9 242 | Krátké srovnání socialistického Československa s dneškem'
