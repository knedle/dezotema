  poznamka: 'Hlavní bloky: autonomní AI drony (ukr. test), Macinka „stát–stát–byznys"/Global Gateway (paralela
    s kuponovou privatizací), ETS2 strop 45 EUR + Nerudová, EK utajení vakcinačních smluv (struktura moci),
    schodek rozpočtu 350 mld, Norsko do EU, USA bombardovaly vodu v Íránu (terorismus), Trump ultimáta
    + manipulace ropy, Ukrajina terorismus/izolace Krymu/přístavy Oděsa, EU reforma diplomatické služby
    (Kallas), EU spor EPF Německo vs Polsko. Zprávy v devět s komentářem (moderátorka Zuzka)'
  prehled:
  - tema: Hlavní bloky
