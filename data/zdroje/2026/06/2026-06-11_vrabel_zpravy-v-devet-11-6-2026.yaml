      EU spor EPF Německo vs Polsko.
vyroky:
- id: vrabel-2026-06-11-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'USA bombardovaly vodní zařízení v Íránu — Vrabel: terorismus (11. 6. 2026)'
  text: Ke zprávě New York Times, že USA (CENTCOM) zasáhly vodní zařízení v íránské provincii Hormozgán
    a 20 000 obyvatel zůstalo odříznuto od dodávek vody v oblasti s extrémními teplotami, Vrabel označuje
    útok za teroristický a za porušení mezinárodního práva — odříznutí lidí od vody je humanitární katastrofa,
    nikoli válčení.
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-11-02
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Trump: opakovaná ultimáta Íránu a podezření z manipulace cen ropy (Vrabel, 11. 6. 2026)'
  text: 'Vrabel popisuje, jak Trump bombardoval Írán (bomby „za 250 milionů dolarů"), prohlásil, že Írán
    „už nemá obranu", a vzápětí zrušil avizované bombardování a oznámil blízkou dohodu (podle Vrabela
    už sedmé „konečné" ultimátum za měsíc). Tvrdí, že kolem Trumpa se opakuje vzorec spekulace s ropou:
    ~20 minut před Trumpovým oznámením někdo shortuje ropu, po oznámení cena klesne a spekulanti vydělají.
    Trumpa označuje za „nejkriminálnějšího prezidenta USA", jakého pamatuje.'
  osoby:
  - osoba: donald-trump
    vztah: negativni
    kontext: '„Nejkriminálnější prezident USA" — bombardoval vodní zařízení v Íránu (20k bez vody), opakovaná
      „konečná" ultimáta, manipulace cen ropy; Vrabel: „dal bych mu přesnou ránu" (viz [stochastický teror](../stochasticky-teror.md))'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-11-03
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'Soudní dvůr EU: Komise pochybila utajením vakcinačních smluv (Vrabel, 11. 6. 2026)'
  text: 'Vrabel vítá stanovisko generálního advokáta Soudního dvora EU, podle nějž Evropská komise pochybila,
    když nezveřejnila smlouvy na nákup covidových vakcín, a doporučil zveřejnit jména vyjednavačů i smluvní
    detaily. Popisuje korupční „strukturu moci": od covidu se podle něj nedělají tendry ani výběrová řízení
    — firmy (Pfizer, Moderna, Johnson&Johnson) vydělají miliardy, smlouvy jsou začerněné, nepoužité vakcíny
    se zlikvidují (ČR prý „vylila" 8 mld. Kč); na řetězci vydělají výrobci, zdravotnické firmy, média
    i dosazení politici (von der Leyen, Babiš). Odmítá ale představu, že by si vše „nakradla" jen von
    der Leyen či Babiš — jde podle něj o sdílenou strukturu moci.'
  podtema: Hantavirus
- id: vrabel-2026-06-11-04
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'Macinka: model „stát–stát–byznys", rozvojová politika jako byznys (Vrabel, 11. 6. 2026)'
  text: 'Vrabel kritizuje projev ministra zahraničí Petra Macinky na konferenci o investicích: Macinka
    mění českou rozvojovou politiku ze „staré" založené na „morální povinnosti" na model „strategického
    zájmu, ekonomické logiky a partnerství" (rozvoj jako investice, ne charita; princip „trade over aid";
    iniciativa Global Gateway). Vrabel to čte jako centrální řízení ekonomiky podřízené zájmům USA a EU
    (model „stát–stát–byznys") a jako pokračování v duchu kuponové privatizace Václava Klause, u nějž
    Macinka „vyrůstal". Připomíná, že Macinka v USA nabízel výrobu zbraní pro USA (a jejich následný nákup
    pro Ukrajinu).'
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: 'Mění rozvojovou politiku na „stát–stát–byznys"/Global Gateway (rozvoj jako byznys pro USA/EU);
      Vrabel: centrální řízení ekonomiky v duchu kuponové privatizace Klause'
  podtema: Ekonomický program PRO
- id: vrabel-2026-06-11-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Schodek rozpočtu může přesáhnout 350 mld. — čtvrtý nejvyšší (Vrabel, 11. 6. 2026)
  text: Ke stanovisku Národní rozpočtové rady (schodek 2027 může přesáhnout 350 mld. Kč; letos plánováno
    310 mld.) Vrabel ironicky „gratuluje" vládě ke čtvrtému nejvyššímu schodku v historii ČR — přestože
    schodek Fialovy vlády byl jedním z hlavních předvolebních argumentů Andreje Babiše. Zmiňuje i „únikovou
    doložku" EU umožňující vyšší schodek při zvýšených výdajích na obranu.
  podtema: Ekonomický program PRO
- id: vrabel-2026-06-11-06
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: ETS2 zastropování na 45 EUR a Danuše Nerudová — Vrabel (11. 6. 2026)
  text: 'Vrabel sarkasticky „gratuluje" vládě k zavedení emisních povolenek: cenový strop ETS2 na 45 EUR
    (na jehož vyjednání se podílela Danuše Nerudová) podle něj platí jen zhruba do roku 2027 a povolenky
    stejně přijdou. Green Deal a emisní povolenky označuje za „specialitu" EU, kterou žádná jiná země
    na světě (Čína, USA, Rusko…) nedělá; řešením je vystoupit z EU a vypovědět Agendu 2030. Doplňuje [Rajchlův
    výklad ETS2 jako lži (11. 6.)](#ets2-zastropování-na-45-eur-je-lež--zrušit-emisní-povolenky-rajchl-11-6-2026).'
  osoby:
  - osoba: danuse-nerudova
    vztah: negativni
    kontext: „Vyjednala" cenový strop ETS2 na 45 EUR — Vrabel sarkasticky „gratuluje"; strop platí jen
      do ~2027, povolenky stejně přijdou
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-06-11-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Autonomní AI drony zabíjejí bez člověka — „pokrok" (Vrabel, 11. 6. 2026)
  text: 'Ke zprávě magazínu New Scientist, že ukrajinské jednotky otestovaly deset plně autonomních dronů
    řízených umělou inteligencí, které samy vyhledaly a zabily ruské vojáky bez lidského operátora, Vrabel
    sarkasticky komentuje „pokrok": rozhodování o životě a smrti se přesouvá z člověka na algoritmus.
    Připomíná předvolební klip (kandidáta hovořícího o „rojových a bojových dronech" a F-35 jako „štítu
    a meči 21. století") jako kořen toho, kam ČR směřuje.'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-11-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Ukrajina přešla k terorismu: izolace Krymu a útoky na přístavy u Oděsy (Vrabel, 11. 6. 2026)'
  text: Vrabel tvrdí, že zatímco zahraniční média líčí, jak Ukrajina „začíná vyhrávat" (útoky hluboko
    do Ruska), ve skutečnosti přešla k „přímému terorismu". Popisuje kampaň izolace Krymu dronovými údery
    (přídělový systém paliva; doprava na dálnici Rostov–Mariupol–Melitopol–Krym klesla o dvě třetiny;
    velitel bezpilotních systémů Robert Brody „Maďar" slibuje plnou kontrolu nad silnicí) a útoky znemožňující
    rekreaci turistů na Krymu. Zmiňuje i pokles propustnosti přístavů u Oděsy o ~30 % (vývoz zemědělských
    produktů −40–50 %). Vše prý předpověděl Friedrich Merz (rakety Taurus na mosty z Krymu, 2024). Navazuje
    na [Ukrajinské útoky na civilní cíle jako terorismus](#ukrajinské-útoky-na-civilní-cíle-jako-terorismus--západ-jako-sponzor-vrabel-3-6-2026).
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-11-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: EU zvažuje rozpuštění diplomatické služby a omezení Kallas (Vrabel, 11. 6. 2026)
  text: K informaci Financial Times, že Francie, Německo a další státy diskutují o reformě či rozpuštění
    Evropské služby pro vnější činnost (EEAS) a omezení pravomocí šéfky unijní diplomacie Kaji Kallas
    (rozpočet ~1 mld. eur), Vrabel uvádí, že to souvisí s bojem o to, kdo bude za Evropu vyjednávat s
    Ruskem — von der Leyen a Kallas si podle něj „usurpují moc do vlastních rukou". Navazuje na [Boj o
    vyjednavače EU–Rusko (9. 6.)](#boj-o-vyjednavače-eurusko-schröder-lídři-vs-struktury-eu-vrabel-9-6-2026).
  podtema: Vyjednávání a mír
- id: vrabel-2026-06-11-10
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: 'EU spor o miliardy pro Ukrajinu: Německo vs. Polsko (EPF) (Vrabel, 11. 6. 2026)'
  text: 'Po odblokování 6,6 mld. eur z Evropského mírového nástroje (EPF) maďarskou vládou vznikl spor,
    zda mají peníze jít přímo Kyjevu (chce Merz), nebo na kompenzace státům, které už Ukrajině dodaly
    zbraně (požaduje Polsko: „to jsou naše peníze"). Vrabel vysvětluje mechanismus EPF (stát dodá zbraně,
    EU proplatí ~60 %) a předpovídá, že ČR (Babiš/Macinka) podpoří poslání peněz přímo na Ukrajinu.'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
