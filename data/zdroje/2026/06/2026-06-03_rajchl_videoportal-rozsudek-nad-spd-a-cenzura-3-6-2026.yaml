  poznamka: 'Komentář k (nepravomocnému) rozsudku Obvodního soudu pro Prahu 1: SPD pokutována 3 mil. Kč
    za předvolební plakát „nedostatek lékařů nevyřeší chirurgové z dovozu" — Rajchl to označuje za faktické
    posvěcení cenzury a tlak na autocenzuru, ohrožení svobody slova. Paralela: den předtím byl v UK odsouzen
    na doživotí Vikram Digma za rituální ubodání studenta Henryho Novaka; policie po obvinění z rasismu
    spoutala oběť (vykrvácela), ne pachatele — „důsledek falešné politiky". SPD potrestána „za odvahu
    říct pravdu". Zhlédnutí: 131 024'
