  nadpis: Rozsudek nad SPD za předvolební plakát = „posvěcení cenzury" (Rajchl, 3. 6. 2026)
  text: 'Rajchl komentuje (nepravomocný) rozsudek Obvodního soudu pro Prahu 1, jímž bylo hnutí SPD potrestáno
    peněžitým trestem 3 miliony Kč za předvolební plakát „nedostatek lékařů nevyřeší chirurgové z dovozu".
    Jako trestní právník jej označuje za „naprosto skandální" — jde o „faktické posvěcení cenzury" a hůře
    o vytváření tlaku na autocenzuru: aby se lidé báli sdílet názory, které nejsou „aktuálně přijatelné
    naší eurounijní společnosti", ze strachu z trestněprávní represe. SPD podle něj byla potrestána „za
    to, že měla odvahu říct pravdu", což považuje za „stokrát nebezpečnější než jakýkoliv předvolební
    plakát". Jako kontext uvádí paralelu s britským případem Henryho Novaka (viz [Suverenita a EU — Británie](/temata/migrace/2026.md#vrabel-2026-06-02-06)).
    Doufá, že SPD uspěje v odvolání a „svoboda slova v ČR zůstane zachována".'
  citace:
  - text: Jedná se o faktické posvěcení cenzury. A co hůře, jedná se o vytváření tlaku na autocenzuru.
  podtema: Trestání politického projevu
