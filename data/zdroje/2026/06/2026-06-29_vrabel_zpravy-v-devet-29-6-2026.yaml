- id: vrabel-2026-06-29-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Akcie Strnadovy zbrojovky −50 %; predikce dočasného růstu, dlouhodobě „vyhozeny do povětří"
    (Vrabel, 29. 6. 2026)
  text: 'Podle ankety ČTK mezi analytiky propadly akcie zbrojařských firem kvůli přestřelenému předchozímu
    růstu a spekulacím o konci války na Ukrajině — akcie Michala Strnada klesly o 50 %. Vrabel předpovídá,
    že před červencovým summitem NATO v Ankaře ceny opět porostou, protože se tam dohodnou zbrojní obchody
    za desítky až stovky miliard dolarů a lidé „lhostejní k lidským životům" budou znovu nakupovat. Dlouhodobě
    ale předpovídá opak: až se válka jednou obrátí, zbrojovky budou „zničeny, vyhozeny do povětří" a ztratí
    veškerou hodnotu, zatímco jejich vlastníci se budou skrývat v Brazílii nebo Argentině.'
  citace:
  - text: Jednoho dne ty zbrojovky budou zničený, jednoho dne budou vyhozeny do povětří, ztratí veškerou
      hodnotu, a ty lidi, který jsou vlastníci těch zbrojovek, tak se budou snažit schovávat v Brazílii
      nebo v Argentině.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
