- id: vrabel-2026-06-29-01
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: Únik sítě „Dialog" Petera Thiela — 200 vlivných lidí rozhoduje bez demokratické kontroly (Vrabel,
    29. 6. 2026)
  text: 'Na internet unikly interní záznamy ze soukromé sítě „Dialog" založené technologickým investorem
    Peterem Thielem — obsahují jména přes 200 účastníků z politiky, byznysu a technologického sektoru
    (únik způsobila chyba zabezpečení, ne hackerský útok). Vrabel to čte jako důkaz, že o životech lidí
    ve skutečnosti nerozhodují voliči, ale neveřejné skupiny vlivných osob bez jakékoli demokratické kontroly
    — přirovnává to k tomu, jak SPD dosadilo do vlády ministra obrany Jaromíra Zunu místo voliči zvoleného
    kandidáta (tam se to alespoň ví, kdo rozhoduje). Připomíná, kdo Thiel je: spoluzakladatel PayPalu
    (člen tzv. „PayPal mafie" s Elonem Muskem), hlavní sponzor viceprezidenta USA J. D. Vance (který pro
    něj dříve pracoval) a majitel firmy Palantir — technologie využívající umělou inteligenci k vyhodnocování
    bezpečnostních hrozeb a cílů, se schopností i vydat pokyn k jejich fyzické likvidaci. Thiela označuje
    za jednoho z nejnebezpečnějších a nejvýše postavených lidí současnosti.'
  citace:
  - text: To je 200 vlivných lidí, kteří se scházejí a rozhodují o našich životech, aniž bychom věděli,
      kdo to je. To nemá s demokracií co dělat.
  osoby:
  - osoba: peter-thiel
    vztah: negativni
    kontext: „Jeden z nejnebezpečnějších, nejvýše postavených lidí" — provozuje tajnou síť „Dialog" (200
      vlivných lidí), sponzor J. D. Vance, majitel Palantiru
  - osoba: j-d-vance
    vztah: negativni
    kontext: Americký viceprezident — dříve pracoval pro Petera Thiela, který je jeho hlavním sponzorem;
      „Thiel stojí za ním a on stojí za Thielem"
- id: vrabel-2026-06-29-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Tři skutečně zásadní otázky summitu NATO: peníze, členství Ukrajiny, jaderné zbraně pro ČR
    (Vrabel, 29. 6. 2026)'
  text: 'Vrabel tvrdí, že mediální spor o to, kdo povede českou delegaci na summitu NATO v Ankaře (Pavel
    vs. Babiš), je záměrné odvádění pozornosti od tří skutečně zásadních bodů jednání: (1) 70 mld. EUR
    ročně pro Ukrajinu na zbraně, (2) vstup Ukrajiny do NATO — což by znamenalo plnohodnotnou válku mezi
    NATO a Ruskem na území celé aliance, nejen na Ukrajině, a (3) vyzbrojení ČR jadernými zbraněmi od
    Francie — návrh, s nímž přišel Petr Pavel už v březnu 2026 a který v květnu/červnu potvrdil i Andrej
    Babiš (navazuje na [Jaderné zbraně v ČR: Babiš i Pavel shodně za, 19. 5. 2026](#jaderné-zbraně-v-čr-babiš-i-pavel-shodně-za-start-smlouva-skončila-19-5-2026)).
    Kritizuje česká média, že se místo těchto otázek věnují jen personální při o vedení delegace, a varuje,
    že bez ohledu na výsledek sporu o vedoucího delegace jsou to právě tyto tři body, které „naprosto
    jasně ohrožují naše životy".'
  citace:
  - text: Tam vůbec nejde o to, jestli na samit NATO pojede Petr Pavel nebo nepojede. [...] Jde o to,
      jakým způsobem bude Česká republika hlasovat ke třem základním otázkám.
  dalsi_zdroje:
  - 2026-07-03_vrabel_zpravy-v-devet-3-7-2026
- id: vrabel-2026-06-29-03
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Akcie Strnadovy zbrojovky −50 %; predikce dočasného růstu, dlouhodobě „vyhozeny do povětří"
    (Vrabel, 29. 6. 2026)
  text: 'Podle ankety ČTK mezi analytiky propadly akcie zbrojařských firem kvůli přestřelenému předchozímu
    růstu a spekulacím o konci války na Ukrajině — akcie Michala Strnada klesly o 50 %. Vrabel předpovídá,
    že před červencovým summitem NATO v Ankaře ceny opět porostou, protože se tam dohodnou zbrojní obchody
    za desítky až stovky miliard dolarů a lidé „lhostejní k lidským životům" budou znovu nakupovat. Dlouhodobě
    ale předpovídá opak: až se válka jednou obrátí, zbrojovky budou „zničeny, vyhozeny do povětří" a ztratí
    veškerou hodnotu, zatímco jejich vlastníci se budou skrývat v Brazílii nebo Argentině.'
  citace:
  - text: Jednoho dne ty zbrojovky budou zničený, jednoho dne budou vyhozeny do povětří, ztratí veškerou
      hodnotu, a ty lidi, který jsou vlastníci těch zbrojovek, tak se budou snažit schovávat v Brazílii
      nebo v Argentině.
  osoby:
  - osoba: michal-strnad
    vztah: rozporuplny
    kontext: Akcie jeho zbrojovky klesly o 50 % — Vrabel předpovídá dočasný růst před summitem NATO, dlouhodobě
      ale zánik zbrojařského byznysu
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-29-04
  typ: predikce
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Akcie zbrojovek porostou před summitem NATO, dlouhodobě „budou zničeny"
  text: 'I když akcie Michala Strnada aktuálně klesly o 50 % kvůli spekulacím o konci války, Vrabel předpovídá
    jejich krátkodobý růst před červencovým summitem NATO v Ankaře (kde se očekává schválení zbrojních
    obchodů za desítky až stovky miliard dolarů). Dlouhodobě ale předpovídá opak: zbrojovky „jednoho dne
    budou zničeny, vyhozeny do povětří" a ztratí veškerou hodnotu, jejich vlastníci se budou muset skrývat
    v Jižní Americe.'
  citace:
  - text: Uvidíme, jak dlouho to bude trvat, protože jednoho dne se to otočí, jednoho dne ty zbrojovky
      budou zničený.
