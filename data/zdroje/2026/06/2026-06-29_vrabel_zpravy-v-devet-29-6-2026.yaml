  nadpis: Únik sítě „Dialog" Petera Thiela — 200 vlivných lidí rozhoduje bez demokratické kontroly (Vrabel,
    29. 6. 2026)
  text: 'Na internet unikly interní záznamy ze soukromé sítě „Dialog" založené technologickým investorem
    Peterem Thielem — obsahují jména přes 200 účastníků z politiky, byznysu a technologického sektoru
    (únik způsobila chyba zabezpečení, ne hackerský útok). Vrabel to čte jako důkaz, že o životech lidí
    ve skutečnosti nerozhodují voliči, ale neveřejné skupiny vlivných osob bez jakékoli demokratické kontroly
    — přirovnává to k tomu, jak SPD dosadilo do vlády ministra obrany Jaromíra Zunu místo voliči zvoleného
    kandidáta (tam se to alespoň ví, kdo rozhoduje). Připomíná, kdo Thiel je: spoluzakladatel PayPalu
    (člen tzv. „PayPal mafie" s Elonem Muskem), hlavní sponzor viceprezidenta USA J. D. Vance (který pro
    něj dříve pracoval) a majitel firmy Palantir — technologie využívající umělou inteligenci k vyhodnocování
    bezpečnostních hrozeb a cílů, se schopností i vydat pokyn k jejich fyzické likvidaci. Thiela označuje
    za jednoho z nejnebezpečnějších a nejvýše postavených lidí současnosti.'
  citace:
  - text: To je 200 vlivných lidí, kteří se scházejí a rozhodují o našich životech, aniž bychom věděli,
      kdo to je. To nemá s demokracií co dělat.
- id: vrabel-2026-06-29-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: 'Tři skutečně zásadní otázky summitu NATO: peníze, členství Ukrajiny, jaderné zbraně pro ČR
    (Vrabel, 29. 6. 2026)'
  text: 'Vrabel tvrdí, že mediální spor o to, kdo povede českou delegaci na summitu NATO v Ankaře (Pavel
    vs. Babiš), je záměrné odvádění pozornosti od tří skutečně zásadních bodů jednání: (1) 70 mld. EUR
    ročně pro Ukrajinu na zbraně, (2) vstup Ukrajiny do NATO — což by znamenalo plnohodnotnou válku mezi
    NATO a Ruskem na území celé aliance, nejen na Ukrajině, a (3) vyzbrojení ČR jadernými zbraněmi od
    Francie — návrh, s nímž přišel Petr Pavel už v březnu 2026 a který v květnu/červnu potvrdil i Andrej
    Babiš (navazuje na [Jaderné zbraně v ČR: Babiš i Pavel shodně za, 19. 5. 2026](#jaderné-zbraně-v-čr-babiš-i-pavel-shodně-za-start-smlouva-skončila-19-5-2026)).
    Kritizuje česká média, že se místo těchto otázek věnují jen personální při o vedení delegace, a varuje,
    že bez ohledu na výsledek sporu o vedoucího delegace jsou to právě tyto tři body, které „naprosto
    jasně ohrožují naše životy".'
  citace:
  - text: Tam vůbec nejde o to, jestli na samit NATO pojede Petr Pavel nebo nepojede. [...] Jde o to,
      jakým způsobem bude Česká republika hlasovat ke třem základním otázkám.
  dalsi_zdroje:
