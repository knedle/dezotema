  nadpis: Bombardování nemocnic, 94 % půdy Gazy a protest židů proti mobilizaci (Vrabel, 3. 6. 2026)
  text: 'Vrabel rozšiřuje kritiku Izraele o tři body: (1) izraelský letecký útok na nemocnici Jabal Amel
    v libanonském Súru (mrtví vč. zdravotníků), den předtím na nemocnici Hiram — pokračující vysídlování
    obyvatel jižního Libanonu; (2) zpráva FAO, že Izrael zničil nebo poškodil 94 % zemědělské půdy v Gaze
    (využitelné zůstalo ~1,5 %), což zasazuje do globalistické agendy ovládnutí potravin a projektu „Velký
    Izrael" zasahujícího i na Ukrajinu; (3) protest izraelských (ultraortodoxních) židů proti povinné
    vojenské službě — Vrabel ho přirovnává k odporu proti tomu, „aby s nimi udělali totéž co s Ukrajinci".
    Klíčové rozlišení: nálada by neměla být „protižidovská" (obyčejní Židé jsou „v pořádku"), ale proti
    „sionistickému režimu", který rozpoutává války. Kritizuje ČR za apriorní podporu (ohlášené veto proti
    opatřením EU vůči izraelským ministrům) — Babiš a Macinka podle něj „mají ruce od krve". Navazuje
    na [Genocida v Gaze (2. 6.)](#genocida-v-gaze-a-apriorní-podpora-izraele-českou-vládou-vrabel-2-6-2026).'
