  nadpis: Kushnerovy realitní projekty na „hřbitovech" — protesty v Srbsku, Albánii, Gaze (Vrabel, 3.
    6. 2026)
  text: 'Vrabel ironicky komentuje realitní projekty Jareda Kushnera (Trumpova zetě) a Trumpa coby „realitních
    makléřů": luxusní hotelový komplex za 1,4 mld. USD na ekologicky citlivém pobřeží Albánie, neúspěšný
    pokus získat zbombardovanou budovu generálního štábu v centru Bělehradu (Srbsko muselo kvůli památkové
    ochraně měnit zákon; architekti i úředníci se vzepřeli a Kushner odešel) a plán turistických letovisek
    v Gaze — „na hřbitově, kde je zem prosáklá krví". Albánci si dle Vrabela vzali příklad ze srbských
    protestů. Vrabel staví do kontrastu „obyčejné" realitní makléřství (prodej domů lidem prchajícím před
    válkou) a vnucování projektů do zemí, kde je nikdo nechce.'
  osoby:
