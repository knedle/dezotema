- id: vrabel-2026-06-03-03
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Ztráta 3 bilionů eur odstřižením od ruské energie — „peníze se přesunuly nahoru" (Vrabel, 3.
    6. 2026)
  text: 'Vrabel cituje výrok Kirilla Dmitrijeva z Mezinárodního ekonomického fóra v Petrohradu, že evropské
    země od odstřižení od ruské energie ztratily zhruba 3 biliony eur (3 000 miliard). Ironicky to „bere
    z lepší stránky": peníze podle něj nezmizely, jen se „přesunuly zdola nahoru" — k těm, kdo dováží
    a přeprodávají ropu z USA či Venezuely nebo ji nakupují od Ruska a draho přeprodávají Evropě, tedy
    k elitám na vrcholu pyramidy. Občané to zaplatili z vlastních kapes. Navazuje na jeho tezi o evropském
    ekonomickém modelu postaveném na levné ruské energii (viz [EU ekonomika v sutinách](#eu-ekonomika-v-sutinách--ztráta-levných-ruských-energií-jako-příčina-krize)).'
  osoby:
  - osoba: kirill-dmitrijev
    vztah: neutralni
    kontext: 'Citován z fóra v Petrohradu: EU ztratila ~3 biliony eur odstřižením od ruské energie'
  podtema: Ekonomika, sankce a BRICS
- id: vrabel-2026-06-03-04
  typ: tvrzeni
  temata:
  - digitalni-kontrola
  nadpis: 'Odposlech telefonů: zadní vrátka pro vlády, FSB odhalila spyware (Vrabel, 3. 6. 2026)'
  text: Ke zprávě, že ruská FSB odhalila operaci zahraničních tajných služeb s nasazením spywaru do telefonů
    ruských představitelů (odposlech komunikace, skryté audio i video), Vrabel tvrdí, že většina telefonů
    a aplikací uživatele odposlouchává automaticky a má „zadní vrátka pro vlády" — odvolává se na (blíže
    neurčené) přiznání z okolí Trumpovy administrativy a na izraelský Pegasus (jímž byl odposloucháván
    i francouzský prezident). Sám prý používá telefon Pixel s operačním systémem, který nelze odposlouchávat
    a umožňuje aplikace „uzavřít do boxu". Navazuje na jeho výklad sítě 6G a digitální kontroly (viz [Síť
    6G jako planetární sledovací organismus](#síť-6g-jako-planetární-sledovací-organismus--vrabel-2-5-2026)).
- id: vrabel-2026-06-03-05
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Soudní zákaz dokumentu „Vina" a blokované weby — „ČR není svobodná země" (Vrabel, 3. 6. 2026)
  text: |-
    Vrabel komentuje předběžné soudní opatření zakazující šíření dokumentární série „Vina: případ fakulta" (vč. již zveřejněných dílů, se stažením z platforem). Ironicky to označuje za „pravou svobodu" — stát, který „smí něco zakázat", zatímco občan svobodný být nemusí. Spojuje to s blokováním webů Russia Today a Sputnik v ČR (které prý nelze otevřít, ani když je pošle kolegům do redakce), s perzekucí za odznáček „Z" a obecně se selektivní represí. Připomíná nevyjasněné okolnosti policejního zásahu na Karlově univerzitě (proč policie vyvedla studenty na nádvoří „na ránu"), uzavření případu parlamentní komisí, smrt vyšetřovatelky a sebevraždu muže před Úřadem vlády v roce 2022. Závěr: „Česká republika není svobodná země."

    > „To je přece ta pravá svoboda, že stát může něco zakázat, aby byl stát svobodný. Občaní být svobodný nemusí, ale stát…" — Ladislav Vrabel (ironicky), [Zprávy v devět 3. 6. 2026](_zdroje.md#ladislav-vrabel--zprávy-v-devět-3-6-2026)
  podtema: Trestání politického projevu
- id: vrabel-2026-06-03-06
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: 'Rozsudek nad SPD: souhlas v části o Romech, nesouhlas v části o migraci (Vrabel, 3. 6. 2026)'
  text: 'K témuž (nepravomocnému) rozsudku Obvodního soudu pro Prahu 1 (pokuta 3 mil. Kč pro SPD za dva
    předvolební plakáty) zaujímá Vrabel rozdělené stanovisko. V části o migraci (plakát proti migračnímu
    paktu) stojí jednoznačně za SPD: nejde podle něj o šíření nenávisti, protože „nenávist se musí týkat
    někoho, kdo žije v ČR" — odsoudit někoho za nenávist vůči migrantům, kteří v ČR nežijí, označuje za
    „nonsens" a doporučuje tento argument právnímu zástupci Okamury jako cestu k vítězství. Naopak v části
    o Romech (plakát o nevyplácení dávek rodinám, jejichž děti nechodí do školy) dává soudu spíše za pravdu:
    protiromskou rétoriku SPD odmítá jako „lacinou kartu", sám si dal podmínku vynechat „romskou otázku"
    z kampaně s M. Sládkem a vyzývá, aby se Romové a „původní obyvatelé" spojili proti islámské migraci,
    místo aby se rozdělovali. Srovnej s Rajchlovým hodnocením (viz [Rozsudek nad SPD = posvěcení cenzury](#rozsudek-nad-spd-za-předvolební-plakát--posvěcení-cenzury-rajchl-3-6-2026)).'
  citace:
  - text: To šíření nenávistí musí se týkat někoho, kdo žije v naší republice.
  podtema: Trestání politického projevu
- id: vrabel-2026-06-03-07
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Skupování orné půdy a kontrola potravin jako globalistická agenda (Vrabel, 3. 6. 2026)
  text: 'Vrabel propojuje zničení 94 % zemědělské půdy v Gaze s tím, co dle něj probíhá „po celém Západě":
    vyplácení nizozemských zemědělců za ukončení činnosti, skupování orné půdy Billem Gatesem (dle Vrabela
    největší vlastník orné půdy v USA) a globalisty na Ukrajině. Ústřední teze: „kdo ovládá jídlo, ovládá
    lidi" — chystá se změna v tom, kdo produkuje a kontroluje potravinový řetězec; v ČR ho podle Vrabela
    ovládá Andrej Babiš, který „bude spolupracovat s globalisty". Navazuje na jeho výklad globalistů útočících
    na rodinu, stát, národ a náboženství (viz [Globalisté bojují vždy proti čtyřem věcem](#globalisté-bojují-vždy-proti-čtyřem-věcem-rodina-stát-národ-náboženství-vrabel-17-5-2026)).'
  osoby:
  - osoba: bill-gates
    vztah: negativni
    kontext: Označen za největšího vlastníka orné půdy v USA; skupování půdy = globalistická kontrola
      potravin
  podtema: Globalistická agenda a další výklady
- id: vrabel-2026-06-03-08
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: Macinka jako převlek Barbary Škrlové — satirické „odhalení" dvojníka (Vrabel, 3. 6. 2026)
  text: Vrabel ve zjevně satirickém duchu „odhaluje", že ministr Petr Macinka je ve skutečnosti Barbara
    Škrlová, která se dříve „prezentovala jako Jan Lipavský" a říká „úplně ty stejné věci". Výrok paroduje
    proatlantickou kontinuitu české zahraniční politiky (Macinka = pokračovatel Lipavského) a využívá
    motiv záměny/dvojníků politiků (viz [Dvojníci a klony politiků a celebrit](#dvojníci-a-klony-politiků-a-celebrit)).
  osoby:
  - osoba: petr-macinka
    vztah: negativni
    kontext: „Ruce od krve" za krytí Izraele; satiricky „odhalen" jako převlek Barbary Škrlové (dříve
      Lipavský)
  podtema: Globalistická agenda a další výklady
- id: vrabel-2026-06-03-09
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migrační pakt, Ceuta a islám — jediná cesta ven je vystoupit z EU (Vrabel, 3. 6. 2026)
  text: 'Vrabel ke zprávě o stovkách migrantů prolamujících hraniční plot ve španělské Ceutě (loni rekord
    3 800, letos za 5 měsíců už 2 400) tvrdí, že čísla rostou poté, co Španělsko zlegalizovalo 800 000
    nelegálních migrantů. Hlavní teze: jediná legální cesta, jak se zbavit migračního paktu, je vystoupit
    z EU — pakt je soudně vymahatelný a patří k „základním pilířům EU"; pouhé odmítnutí ve Strakově akademii
    nestačí. ČR má výjimku do konce roku 2026 (kvůli přijetí 100 000 Ukrajinců), od roku 2027 ale bude
    muset přijímat migranty v rámci paktu. Islám v podobě práva šaría označuje za neslučitelný s lidskými
    právy a ústavou ČR (princip hijry — vystěhování za účelem islamizace; v šaríi prý chybí trest za zabití
    nemuslima). Kritizuje romskou organizaci Romea CZ za to, že hájí práva přistěhovalců — připomíná,
    že islámský stát v Sýrii zabíjel i ty, kdo bránili práva menšin (homosexuály), a vyzývá Romy, aby
    drželi s „původním obyvatelstvem". Británie podle Vrabela už „překročila bod návratu", ČR zatím ne,
    ale bez uzavření hranic a vystoupení z EU „za pět let Českou republiku nikdo nepozná".'
  citace:
  - text: Ten migrační pakt se neodmítá ve Strakově akademii, ten migrační pakt se odmítá tím, že vystoupíme
      z Evropské unie.
- id: vrabel-2026-06-03-10
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Referendum musí být obecné, ne omezené — kritika návrhu Tejce (Vrabel, 3. 6. 2026)
  text: 'Vrabel vítá, že vláda (ministr spravedlnosti Jeronim Tejc) předkládá ústavní zákon o celostátním
    referendu, ale ostře kritizuje parametry: 300 000 podpisů pro vyhlášení je podle něj příliš (mělo
    by stačit max. 100 000) a kvórum 35 % oprávněných voličů (~2,9 mil. hlasů) pro platnost je prakticky
    nedosažitelné. Zásadní výhrada: referendum musí být obecné — o čemkoli, včetně vstupu či vystoupení
    z EU a NATO; pokud vláda určuje, o čem občané smějí hlasovat, „nejsme v demokracii". Kritizuje i návrh
    poslance Koláře (TOP 09) zapsat členství v EU a NATO přímo do ústavy, čímž by se vystoupení stalo
    fakticky nemožným. Navazuje na opakovanou tezi o chybějícím prováděcím zákonu o referendu (srov. Černohorský,
    [Absence referenda](#absence-referenda-jako-důkaz-ne-demokracie--sjezd-lm-jako-konkrétní-příklad-25-5-2026)).'
  osoby:
  - osoba: jeronim-tejc
    vztah: neutralni
    kontext: Předkládá ústavní zákon o referendu — Vrabel vítá záměr, ale kritizuje parametry (300k podpisů,
      kvórum 35 %, vyloučení EU/NATO)
  podtema: Ekonomický program PRO
- id: vrabel-2026-06-03-11
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Návrat EET — znevýhodnění malých živnostníků (Vrabel, 3. 6. 2026)
  text: K plánovanému návratu elektronické evidence tržeb (ministryně financí Schillerová slibuje jednodušší
    systém a bezplatnou aplikaci) se Vrabel staví jednoznačně odmítavě. Z vlastní podnikatelské zkušenosti
    (živnost od 18 let, desítky provozů — restaurace, kavárny, bary) tvrdí, že kontrolní mechanismy vždy
    dopadají na malého živnostníka, zatímco velcí hráči napojení na veřejné zakázky dostávají úlevy a
    miliardové dotace. Odmítá státní kontrolu i „z Bruselu řízené plánované hospodářství"; ideál vidí
    ve „volném trhu" (odkazuje na Klausovu kupónovou privatizaci). Malí podnikatelé podle něj musí odpracovat
    mnohem více hodin než zaměstnanci, aby dosáhli srovnatelného příjmu.
  osoby:
  - osoba: alena-schillerova
    vztah: neutralni
    kontext: Prosazuje návrat EET s bezplatnou aplikací — Vrabel odmítá jako zátěž pro malé živnostníky
  podtema: Ekonomický program PRO
- id: vrabel-2026-06-03-12
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajinské útoky na civilní cíle jako „terorismus" — Západ jako sponzor (Vrabel, 3. 6. 2026)
  text: Vrabel označuje ukrajinské drony útočící na Leningradskou oblast (~30 dronů v době fóra v Petrohradu)
    a úder na civilní autobus v Jenakijevu (7 mrtvých, 11 zraněných) za teroristické útoky na civilní
    cíle. Přebírá výrok mluvčí ruského MZV Marije Zacharovové, že „Západ sponzoruje ukrajinský terorismus
    prostřednictvím NATO" a že kdyby si evropští občané uvědomili, že platí zabíjení civilistů, takové
    režimy by nevolili. Vrabel z toho vyvozuje spoluodpovědnost ČR a Západu — voliči Babiše prý dali hlas
    s očekáváním konce muniční iniciativy, financování i dodávek zbraní Ukrajině, k čemuž nedošlo. Navazuje
    na [Muniční iniciativa = spoluzodpovědnost ČR](nato-zbrojeni-militarizace.md#muniční-iniciativa--spoluzodpovědnost-čr-za-teror-proti-ruským-civilistům-vrabel-2-6-2026).
  osoby:
  - osoba: marija-zacharovova
    vztah: neutralni
    kontext: 'Citována souhlasně: „Západ sponzoruje ukrajinský terorismus prostřednictvím NATO"; kdyby
      občané věděli, že platí zabíjení civilistů, nevolili by takové režimy'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-03-13
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Obnovení ekonomických vztahů s Ruskem — absence ČR na fóru v Petrohradu (Vrabel, 3. 6. 2026)
  text: K Mezinárodnímu ekonomickému fóru v Petrohradu (s avizovaným vystoupením Putina 5. 6.) Vrabel
    konstatuje, že ČR tam nemá zastoupení, a volá po narovnání a obnovení obchodních vztahů s Ruskou federací
    — desítky let fungujícího partnerství (i za SSSR). Argumentuje, že Rusko je zdrojem nejlevnějšího
    a nejčistšího plynu a ropy a největší sousední jadernou velmocí. Navazuje na svou dřívější tezi, že
    EU se odpojením od ruských energií dobrovolně poškodila (viz [EU ekonomika vybudována na levném ruském
    plynu](ceny-energie.md#eu-ekonomika-vybudována-na-levném-ruském-plynu--vzdáváme-se-jí-dobrovolně-vrabel-18-5-2026)).
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-03-14
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: České vrtulníky Viper do Polska — „podřízenost NATO" (Vrabel, 3. 6. 2026)
  text: Vrabel komentuje první ostré zahraniční nasazení českých vrtulníků Viper (22. základna vrtulníkového
    letectva) v Polsku k ochraně vzdušného prostoru na východním křídle NATO, kde vystřídají vrtulníky
    Venom. Hodnotí to jako stupňování podřízenosti ČR vůči NATO a posílání českých vojáků „na hranice
    s Ruskou federací" — kde by v případě incidentu mohli „střílet ostrými".
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-03-15
  typ: tvrzeni
  temata:
  - vetrniky
  nadpis: Toxický odpad z německých turbín vyvážen do ČR; Turek instaluje 500 větrníků (Vrabel, 3. 6.
    2026)
  text: Vrabel ke zprávě německých médií o chybějícím systému likvidace vysloužilých větrných turbín (až
    500 000 tun materiálu v příštích 10 letech v Německu) upozorňuje na případ podnikatele Michaela Rota,
    který měl státní prostředky na likvidaci, ale část odpadu nelegálně vyvážel na skládky v zahraničí
    včetně ČR a Polska. Případ pomohla odhalit starostka obce Jiříkov, která vozidlo zablokovala autem
    (Vrabel jí navrhuje vyznamenání); požaduje, aby škody, sanaci a pokuty zaplatilo Německo. Zároveň
    kritizuje „zmocněnce pro větrníky" Filipa Turka, pod nímž se má do ČR instalovat 500 turbín. Z vlastní
    zkušenosti (pole větrníků mezi Maďarskem a Rakouskem) tvrdí, že z rychle se otáčejících listů (400+
    km/h) se uvolňuje sklolaminát a „jed" do ovzduší, který vítr roznáší do dálky. Navazuje na jeho tvrzení
    o 60 kg nanočástic na větrník (viz [konspirace.md — chemtrails a větrníky](konspirace.md#chemtrails-sypání-těžkých-kovů-do-atmosféry-větrníky-60-kg-nanočástic-vrabel-15-5-2026)).
  osoby:
  - osoba: filip-turek
    vztah: negativni
    kontext: „Zmocněnec pro větrníky" — pod ním se má do ČR instalovat 500 turbín; výmluva „protože Evropská
      unie"
  podtema: Kulturní a občanský odpor
