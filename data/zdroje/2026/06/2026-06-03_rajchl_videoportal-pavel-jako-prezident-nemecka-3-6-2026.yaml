  nadpis: Referendum o euru jako vůle „akcionářů země" — Pavel jako „prezident Německa" (3. 6. 2026)
  text: 'V krátkém klipu z TV debaty Rajchl opakuje, že o přijetí eura má rozhodnout referendum, protože
    otázka „přesahuje funkční mandát jakékoliv vlády". Argumentuje vůlí občanů: tři čtvrtiny občanů euro
    nechtějí, a politici nejsou od toho, aby občanům diktovali, co mají chtít, ale aby realizovali jejich
    vůli. Občany označuje za „akcionáře této země" a přirovnává roli politika k advokátovi plnícímu pokyny
    klienta. Petra Pavla obviňuje, že „si spletl zemi" a chová se jako prezident Německa — prosazuje přijetí
    eura, zrušení práva veta, zřízení Spojených států evropských a pomáhal Lichtenštejnům obejít Benešovy
    dekrety v jejich soudních sporech; to vše je dle Rajchla „v kategorickém protikladu se zájmy občanů".
    Navazuje na jeho dřívější pozice (viz [Petr Pavel: proponent EU superstátu](#petr-pavel-proponent-eu-superstátu--zánik-suverenity),
    [Petr Pavel jedná s Lichtenštejny](petr-pavel.md#petr-pavel-jedná-s-lichtenštejny-salámová-metoda-1719-4-2026)).'
  citace:
  - text: Oni jsou ti akcionáři této země. [...] Já jsem jako právník zvyklý realizovat pokyny svého klienta.
      Politici by k tomu měli přistupovat úplně stejně k názoru občanů.
  podtema: Česká suverenita
