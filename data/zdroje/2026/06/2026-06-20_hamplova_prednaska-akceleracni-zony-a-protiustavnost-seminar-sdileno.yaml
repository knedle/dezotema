  poznamka: 'Akcelerační zóny/oblasti pro VTE označuje za protiústavní („znásilnění práva") — protekční
    zjednodušené stavební řízení pro vybrané stavebníky (OZE) porušuje rovnost před zákonem; přímý zásah
    do samosprávy obcí (územní plány) a vlastnických práv bez konzultace; nepřezkoumatelnost výběru lokalit;
    nezohledněná kumulace vlivů na krajinu a životní prostředí. Podala připomínky jako občanka ČR (aktivní
    legitimace — dopad na celé území), žádá úplné vypuštění AO; s obcemi připravena jít soudním přezkumem
    až k Ústavnímu soudu (odkaz na opakované nálezy ÚS o zásazích do samosprávy). Sněmovní seminář „Příliš
    drahý vítr" — ústavně-právní rozbor akceleračních oblastí Řečník: Jana Zwyrtek Hamplová (senátorka,
    advokátka — veřejné a ústavní právo, samospráva)'
