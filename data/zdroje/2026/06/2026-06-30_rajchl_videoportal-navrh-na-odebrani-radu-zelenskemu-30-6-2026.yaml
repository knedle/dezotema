    Řád Bílé orlice napříč celým politickým spektrem). Připomíná vraždění Čechoslováků UPA do roku 1947
    („akce B") a cituje Masaryka (1926): fašismus je „sedlina naší národní demokracie". Tematicky → [valka-nato-rusko.md](valka-nato-rusko.md).
    Bez predikcí a stoch. teroru. Zhlédnutí: 35 421 | Tisková konference SPD'
