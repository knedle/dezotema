  poznamka: 'Hlavní bloky: Fico navrhuje Macrona jako vyjednavače EU–Rusko (Fico jako globalista, predikce
    SK jaderné zbraně), summit NATO/OSN jako „divide et impera" (Pavel vs Babiš dělají totéž), zvýšení
    plateb za státní pojištěnce o 24 mld = okrádání občanů na zbrojení, konec projektu FCAS + britské
    F-35 + cvičení Rammstein (zbrojní korupce, ČR nemá mít jaderné zbraně), Berlín protesty proti Merzovi
    vs „spící" ČR, Dozimetr parlamentní komise bez pravomoci („divadlo vlastenců"), Albánie/Kushner ostrov
    Sazan (rozšíření). Zprávy v devět s komentářem, 1. část (moderátorka Zuzka) — vysílání přerušeno ~v
    31. min. technickou závadou, pokračuje ve „2. části"'
