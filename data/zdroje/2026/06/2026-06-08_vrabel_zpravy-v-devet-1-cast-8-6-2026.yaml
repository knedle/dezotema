- id: vrabel-2026-06-08-05
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: 'Fico ukázal globalistickou tvář: prosadil Macrona jako vyjednavače EU–Rusko (Vrabel, 8. 6.
    2026)'
  text: |-
    K návrhu Roberta Fica, aby případná jednání s Putinem za EU vedl Emmanuel Macron, Vrabel (a jím komentovaný kritický hlas) reagují, že Fico tím „ztratil kredibilitu" ohledně slovenské suverenity. Macrona líčí jako symbol „zelené, chudé, multikulturní a gay Evropy" (Green Deal, francouzský multikulturalismus, zákon hrozící rodičům i psychologům trestem za odrazování dítěte od změny pohlaví, migrace). Fica zařazuje do svého vzorce politiků, kteří se nejdřív tvářili „pronárodně" a postupně odhalují, že jsou „globalisté taky" — stejně jako podle něj Andrej Babiš. Za jediného skutečně suverénního lídra v Evropě označuje Aleksandara Vučiće (Orbán „na půl cesty", Fico „pátý čaj po výluhu" od Vučiće). Navazuje na [Globalisté dosazují „falešné mesiáše" napříč Západem](#globalisté-dosazují-falešné-mesiáše-napříč-západem--magyar-trump-merz-babiš-vrabel-6-6-2026).

    > „Fico není národný politik. Ani přesvědčením, ani skutkami." — citováno Vrabelem, [Zprávy v devět (1. č.) 8. 6. 2026](_zdroje.md#ladislav-vrabel--zprávy-v-devět-1-část-8-6-2026)
- id: vrabel-2026-06-08-06
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Summit NATO/OSN jako „divide et impera" — Pavel a Babiš dělají v NATO totéž (Vrabel, 8. 6. 2026)
  text: 'Vrabel označuje celonárodní spor o to, zda Petr Pavel pojede na summit NATO, za uměle vytvořenou
    kauzu fungující na principu „rozděl a panuj" — má odvést pozornost od toho, že ČR je vtahována do
    války a okrádána (zbrojení, nábor vojáků, přesun munice). Tvrdí, že mezi Pavlem a Babišem není ve
    vztahu k NATO „žádný rozdíl" (oba prosazují jaderné zbraně od Francie, platby do NATO i zvyšování
    počtu vojáků); podstatné není, kdo ČR reprezentuje, ale „kdo podepíše, že Česká republika půjde do
    války s Ruskem". Předpovídá, že Pavel jakožto ústavní reprezentant státu nakonec na summit pojede
    a podepíše. Jediný reálný spor vidí v tom, „kdo bude dohazovat kšefty" a „kasírovat 100 miliony na
    úplatcích". Rozšiřuje [NATO summit: Pavel vs. Babiš jako falešná narativní distrakce (8. 5.)](#nato-summit-pavel-vs-babiš-jako-falešná-narativní-distrakce--vrabel-8-5-2026).'
  citace:
  - text: Divide et impera. Rozděl a panuj. [...] Rozděl společnost na dvě částky, poštvi proti sobě a
      vládni jim.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: vrabel-2026-06-08-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Zvýšení plateb za státní pojištěnce o 24 mld. = okrádání občanů na zbrojení (Vrabel, 8. 6. 2026)
  text: Ke schválenému zvýšení plateb za státní pojištěnce o 24 miliard Kč Vrabel tvrdí, že nejde o záchranu
    zdravotnictví, ale o „další krok, jak okrádat občany" — stát potřebuje víc peněz do rozpočtu, „aby
    mohl posílat peníze na válku, na zbraně na Ukrajinu". Žádné složité vysvětlování podle něj netřeba.
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-08-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: 'ČR jako „jedno obrovské divadlo": Dozimetr komise bez pravomoci, „spící" národ (Vrabel, 8.
    6. 2026)'
  text: 'Vrabel označuje parlamentní komisi pro vyšetřování kauzy Dozimetr (kterou prosadil Jindřich Rajchl)
    za „divadlo": vyšetřování trestné činnosti je podle ústavy výlučně v kompetenci orgánů činných v trestním
    řízení (policie, státní zástupci), trestní řízení je tajné a všichni v něm vázáni mlčenlivostí — parlamentní
    komise tak nemá žádnou pravomoc a nikdo jí nesmí nic sdělit. Připomíná, že když žádali o odškodnění
    politických vězňů, dostali od dr. Vesecké odpověď, že poslanci nesmějí vstupovat do řízení. Z toho
    dovozuje, že obraz „vlastenců ve vládě, kteří vše vyřeší", je iluze. Kontrastuje to s Německem, kde
    lidé proti Merzovi (77 % nespokojených) protestují, zatímco v ČR se „spí" a národ řeší jen, zda Pavel
    pojede na summit — probuzení přijde, „až jim to dojde".'
  podtema: Demokracie a politický systém
- id: vrabel-2026-06-08-11
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Zbrojní projekty (FCAS, britské F-35, cvičení Rammstein) jako korupce; ČR nemá mít jaderné zbraně
    (Vrabel, 8. 6. 2026)
  text: 'Ke konci francouzsko-německého projektu stíhačky FCAS, britskému zvažování zrušení nákupu 12
    jadernonosných F-35A a cvičení NATO Rammstein Flag 2026 (ČR vysílá 5 Gripenů a ~53 lidí z 21. brigády)
    Vrabel opakuje, že jde o „trapný boj o to, který zbrojař bude co vyrábět a který politik z toho dostane
    100 miliony do kapsy" — veřejné zakázky bez výběrových řízení placené občany (mj. přes zvýšené zdravotní
    pojištění). Hlavní teze k F-35 a Babišovu nápadu pořídit jaderné zbraně: ČR jako 11milionová země
    si nemůže dovolit mít jaderné zbraně proti 145milionovému Rusku — „když na to přijde, Rusko nás smaže
    z mapy během deseti minut, včetně civilistů". Jedinou správnou cestou je podle něj vystoupení z NATO;
    vše „mezi tím" (jestli Pavel pojede na summit, či ne) je nepodstatné. Navazuje na [NATO eskaluje válku
    „salámovou metodou" (2. č. 8. 6.)](valka-nato-rusko.md#nato-eskaluje-válku-salámovou-metodou-f-35-jako-scénář-jaderného-náletu-na-rusko-vrabel-8-6-2026).'
  podtema: NATO, zbrojení a militarizace ČR/Evropy
