  poznamka: 'Tři zpracovaná témata: (1) Právní rozbor čl. 63 Ústavy — Havlovo rozhodnutí 1993 přeneslo
    sjednávání smluv na vládu, prezidentův podpis bez kontrasignace nemá váhu; skutečným cílem cesty do
    Ankary je vzít s sebou poradce Petra Koláře kvůli zbrojním kšeftům (Strnadovy akcie +11 % po rozhodnutí
    ÚS); zmínka o 70 mld. EUR ročně pro Ukrajinu — [politicky-system.md](politicky-system.md). (2) Krize
    Polsko–Ukrajina eskaluje kvůli pojmenování jednotky po UPA — pochybnosti o Katyni a smolenské havárii
    2010 (považuje za záměrnou), predikce možného příchodu polské armády na hranice a rozpadu Ukrajiny
    — [valka-nato-rusko.md](valka-nato-rusko.md). (3) ⚡ Konflikt s Vrabelem: rekordní vedro (41,4 °C)
    je normální, „žádné klimatické změny se nedějí" — [konspirace.md](konspirace.md). Nezpracováno: varování
    před falešným profilem Pavla Cymbála na FB (osobní/logistika), opakovaná kritika hlasování o Hunkovi
    (již dříve zdokumentováno). Bez predikcí (mimo zmíněnou) a stoch. teroru nad rámec již zaznamenaného.
    Rekordní vedro + varování před falešným FB profilem + pokračování kauzy ÚS/Pavel + Polsko vs. Ukrajina'
vyroky:
- id: cernohorsky-2026-06-28-01
  typ: tvrzeni
  temata:
  - konspirace
  nadpis: '⚡ Konflikt: Rekordní vedro je normální, „žádné klimatické změny se nedějí" — Černohorský (28.
    6. 2026)'
  text: V reakci na teplotní rekord ČR (41,4 °C, překonání dřívějšího rekordu 40,4 °C z roku 2000) Černohorský
    tvrdí, že teploty kolem 40 °C nejsou v ČR ničím neobvyklým — odkazuje na vlastní přehled letních teplot
    od zániku ČSFR (1994) na svém Facebooku, podle něhož se teploty nad 35 °C objevují běžně „co dva roky".
    Uzavírá, že „žádné klimatické změny se nedějí" a označuje zastánce klimatických opatření (omezení
    fosilních paliv, aut, prosazování větrných elektráren) za „zelené, grindýlové fanatiky". Argumentuje,
    že ČR leží v mírném pásu (ne na poušti), takže by obnovitelné zdroje stejně nemohly nahradit fosilní/jadernou
    energii v poměru 50:50. Postoj je v přímém protikladu k Vrabelově opakované tezi o pozorovatelné změně
    klimatu (viz výše) — Vrabel klimatické změny bere jako fakt (byť s otevřenou příčinou), zatímco Černohorský
    jejich existenci rovnou popírá.
  citace:
  - text: Žádný klimatický katastrofy, prosím vás, nic takového se nekoná.
  podtema: Historické konspirační výklady
- id: cernohorsky-2026-06-28-02
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: 'Právní rozbor čl. 63: prezidentův podpis bez kontrasignace nemá váhu; skutečným cílem je vzít
    s sebou Koláře — Černohorský (28. 6. 2026)'
  text: 'Černohorský jde do detailu ústavní argumentace o pravomocích prezidenta sjednávat mezinárodní
    smlouvy (čl. 63 Ústavy). Připomíná, že už Václav Havel rozhodnutím č. 144/1993 Sb. přenesl sjednávání
    většiny mezinárodních smluv na vládu a ministry — prezident tedy fakticky sám žádné texty smluv nevyjednává.
    Klíčový argument: i kdyby chtěl prezident nějakou smlouvu sjednat osobně, jeho podpis bez kontrasignace
    (spolupodpisu premiéra nebo pověřeného ministra) nemá žádnou právní váhu — vláda tak má nad zahraničněpolitickými
    kroky prezidenta absolutní kontrolu. Z toho vyvozuje, že skutečným smyslem Pavlovy touhy jet do Ankary
    není nic, co by vyžadovalo jeho osobní účast, ale to, aby s ním mohl letět poradce Petr Kolář — lobbista
    s vazbami na zbrojní průmysl, který podle Černohorského domlouvá kontrakty (např. se Strnadovou zbrojovkou)
    bez jakékoli kontroly vlády. Jako nepřímý důkaz uvádí neověřenou informaci, že akcie Strnadovy zbrojařské
    firmy po rozhodnutí ÚS vzrostly o 11 %. Zmiňuje také, že na summitu NATO se má schvalovat dalších
    70 mld. EUR pro Ukrajinu — a to nikoli jednorázově, ale každoročně.'
  citace:
  - text: Nutnost spolupodpisu [...] kdyby chtěl prezident nějakou smlouvu sjednat osobně, jeho podpis
      nemá žádnou váhu bez spolupodpisu, tedy té kontrasignace.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: cernohorsky-2026-06-28-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Krize Polsko–Ukrajina eskaluje kvůli UPA; pochybnosti o Katyni a Smolensku; predikce rozpadu
    Ukrajiny (Černohorský, 28. 6. 2026)
  text: 'Černohorský navazuje na spor vyvolaný Zelenského pojmenováním vojenské jednotky po UPA (vyvraždění
    ~100 tisíc Poláků v letech 1943–44) — na rozdíl od Čechů jsou Poláci podle něj k urážkám svých padlých
    předků citliví a nenechají si to líbit; zmiňuje video údajného polského poslance pálícího vlajku Pravého
    sektoru a tvrzení, že Ukrajina Polsku vyhrožuje drony. Spekuluje, že by ho nepřekvapila tajná dohoda
    Polska s Ruskem na společné vojenské operaci. K tomu připojuje dvě otevřené pochybnosti: oficiální
    verzi Katyňského masakru nepovažuje za věrohodnou, a leteckou havárii polského prezidentského letadla
    u Smolenska (2010, zahynula celá polská vládní delegace) považuje za záměrnou akci s cílem zabránit
    polsko-ruskému usmíření. Předpovídá, že by se na hranici s Ukrajinou mohla objevit polská armáda a
    že situace může vyústit v rozpad/konec Ukrajiny — zejména pokud Poláci začnou vyhošťovat ukrajinské
    uprchlíky, což by vedlo k další migrační vlně do ČR.'
  citace:
  - text: Ukrajincům z toho nebude moc dvakrát dobře [...] a zazvonil konec a Ukrajiny je konec.
  podtema: Stav Ukrajiny a mobilizace
