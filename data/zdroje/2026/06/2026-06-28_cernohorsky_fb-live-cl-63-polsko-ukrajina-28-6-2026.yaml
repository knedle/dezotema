  poznamka: 'Tři zpracovaná témata: (1) Právní rozbor čl. 63 Ústavy — Havlovo rozhodnutí 1993 přeneslo
    sjednávání smluv na vládu, prezidentův podpis bez kontrasignace nemá váhu; skutečným cílem cesty do
    Ankary je vzít s sebou poradce Petra Koláře kvůli zbrojním kšeftům (Strnadovy akcie +11 % po rozhodnutí
    ÚS); zmínka o 70 mld. EUR ročně pro Ukrajinu — [politicky-system.md](politicky-system.md). (2) Krize
    Polsko–Ukrajina eskaluje kvůli pojmenování jednotky po UPA — pochybnosti o Katyni a smolenské havárii
    2010 (považuje za záměrnou), predikce možného příchodu polské armády na hranice a rozpadu Ukrajiny
    — [valka-nato-rusko.md](valka-nato-rusko.md). (3) ⚡ Konflikt s Vrabelem: rekordní vedro (41,4 °C)
    je normální, „žádné klimatické změny se nedějí" — [konspirace.md](konspirace.md). Nezpracováno: varování
    před falešným profilem Pavla Cymbála na FB (osobní/logistika), opakovaná kritika hlasování o Hunkovi
    (již dříve zdokumentováno). Bez predikcí (mimo zmíněnou) a stoch. teroru nad rámec již zaznamenaného.
    Rekordní vedro + varování před falešným FB profilem + pokračování kauzy ÚS/Pavel + Polsko vs. Ukrajina'
