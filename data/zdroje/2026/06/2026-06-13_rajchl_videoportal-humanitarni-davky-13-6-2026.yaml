  nadpis: Podvody s humanitárními dávkami — „dezinformace, která se stala pravdou" (Rajchl, 13. 6. 2026)
  text: K reportáži TV Nova o podvodech s humanitárními dávkami (tzv. dávková turistika, fiktivní adresy,
    nahlašování počtu osob; ztráty desítek milionů korun za 14 měsíců) Rajchl konstatuje, že totéž čtyři
    roky tvrdili „kolaboranti typu Rajchla" a byli za to označováni za prokremelské dezinformátory. Cituje
    údaj, že humanitární dávky zneužíval „každý pátý cizinec" (tj. Ukrajinec — nikdo jiný je nedostává),
    a označuje to za další „dezinformaci, která se stala pravdou".
