  nadpis: ČT „ocenzurovala" státní hymnu v podání Jarka Nohavicy (Rajchl, 21.–23. 6. 2026)
  text: |-
    Rajchl tvrdí, že Česká televize záměrně „utnula" přenos, kdy měl písničkář **Jarek Nohavica** zazpívat státní hymnu (dle popisu na MS v hokejbalu v Ostravě) — oficiálně kvůli „technickým problémům". Podle Rajchla šlo o cenzuru kvůli Nohavicovým mírovým postojům (aby nezaznělo nic proti „unijnímu směřování či válce"); komerční stanice (Nova, Prima) by to prý odvysílaly bez problému. Dne **23. 6. 2026** Rajchl gesto dotáhl: zveřejnil hymnu v Nohavicově podání s tím, že „zastupuje veřejnoprávní televizi" a „nechce za to nic" — rýpnutí do koncesionářských poplatků. Tematicky souvisí s [media-propaganda — ČT není strážce demokracie](media-propaganda.md#čt-není-strážce-demokracie-ale-probruselského-směřování-dobrovolné-poplatky--rajchl-21-6-2026).

    Touž cenzuru nezávisle (23. 6.) ostře odsoudil i **Jiří Černohorský**: označuje ji za „nehoráznost" a porušení Ústavy / Listiny základních práv (čl. 17 odst. 3 — „Cenzura je nepřípustná"), kterou ČT bere „za cár papíru". Tvrdí, že ČT cenzuru připravila předem („Závada není na vašem přijímači" jako za socialismu), protože Nohavica „nezapadá do jejich ukrajinského nacistického konceptu"; ČT „jde na ruku prozápadním/proukrajinským" zájmům a „má být zrušena" — žádné poplatky („výpalné"), 8 miliard ani koruna z rozpočtu.

    > „Scenzurovali Českou národní hymnu jenom proto, že jim nezapadá do jejich ukrajinského nacistického konceptu. […] Cenzura je nepřípustná." — Jiří Černohorský, [reel 23. 6. 2026](_zdroje.md#jiří-černohorský--čt-cenzura-hymny-nohavica-23-6-2026)
  citace:
  - text: Dovolím si zastoupit naši veřejnoprávní televizi a nabídnout vám naši hymnu v podání největšího
      českého barda Jarka Nohavici […]. A nechci za to nic.
