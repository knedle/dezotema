  poznamka: 'ČT = strážce probruselského směřování, ne demokracie (cenzura hymny J. Nohavicy, stávka jako
    protizákonné zneužití obrazovky, ČT horší/dražší než Nova/Prima/CNN Prima News), návrh dobrovolných
    koncesionářských poplatků (připojil se Zeman); dvojí metr v kauzách (média řeší byty, ignorují Pauknerovy
    kauzy — vrtulníky, Hladík, Dvořák/dozimetr; Seznam demaskuje Pauknerův pseudonym; Minář 7 mil. / Milion
    chvilek jako vlivová struktura); Petr Pavel jako „pózer/kašpár" (Le Mans/MotoGP, kult osobnosti à
    la Kim Čong-un, Eva Pavlová „Madonna", chybí v Lidicích, Babiš/Tykač lepší); Zelenský adoruje nacismus
    (UPA) — Pavlovo mlčení urážka předků, odebrat řád Bílého lva, ať Ukrajinci vrátí Polsku i peníze;
    zrušit dočasnou ochranu/dávky Ukrajincům + automatická deportace (vyvrácení statistiky V. Lásky o
    vězních); ukrajinské děti se neasimilují a brzdí výuku (vs. Plaga); Green Deal zničí evropský průmysl
    (čínští akcionáři skoupí automobilky, zavřená hliníkárna Žiar n. Hronom); zbrojení (F-35/munice/tanky)
    vs. záchrana životů (sbírky Bára/Pavlína, 1 mil. = 1 život), „odstrašování Putina" = lež. Predikce:
    Starmer „zítra" rezignuje. „Česká televize není strážcem demokracie. Je strážcem probruselského směřování
    ČR."'
