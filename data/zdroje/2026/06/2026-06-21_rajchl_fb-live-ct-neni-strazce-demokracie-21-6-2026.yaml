- id: rajchl-2026-06-21-03
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: ČT není strážce demokracie, ale probruselského směřování; dobrovolné poplatky — Rajchl (21.
    6. 2026)
  text: |-
    Rajchl věnoval celé vysílání médiím a tvrdí, že Česká televize „už roky dokazuje, že není strážcem demokracie, ale strážcem probruselského a prounijního směřování ČR" — upravuje obsah tak, aby vytvářela dojem neodpovídající realitě. Klíčové body:

    - **Cenzura Jaromíra Nohavicy.** ČT podle něj „rychle utnula" přenos, když měl Nohavica zazpívat hymnu na MS v hokejbalu v Ostravě — prý aby nezaznělo nic proti unijnímu směřování či válce (Nohavica apeluje na mír). Tvrdí, že Nova či Prima by to bez problému odvysílaly. (23. 6. Rajchl hymnu v Nohavicově podání sám zveřejnil „a nechce za to nic" — viz [dsa-cenzura.md](dsa-cenzura.md#čt-ocenzurovala-státní-hymnu-v-podání-jarka-nohavicy-rajchl-2123-6-2026).)
    - **Stávka zaměstnanců ČT je protizákonná.** Zaměstnanci placení z veřejných peněz nesmějí zneužívat obrazovku ČT k prosazování vlastních zájmů (jiný způsob financování, než určí vláda) — tím se podle něj „pohybují mimo zákonný rámec".
    - **ČT horší a dražší než komerční média.** CNN Prima News (ocenění za zpravodajství) dělá podle něj „stokrát lepší práci" se šestinou zaměstnanců a bez garantovaného rozpočtu; Nova i Prima jsou „mnohem objektivnější". Proč by ČT měla být výjimkou, která nemusí bojovat o diváka?
    - **Dobrovolné koncesionářské poplatky (řešení).** Navrhuje, aby si ČT vydělala na provoz dobrovolnými poplatky — pak by žádný politik neurčoval její rozpočet a ČT by musela bojovat o diváka. Sám deklaruje, že by rád platil i víc, kdyby reportáže dělali jím preferovaní novináři (Paukner, Dobijášová, Štrunc, Panenka), ale odmítá platit „za evropskou propagandu". K návrhu se prý připojil i Miloš Zeman; odkazuje na průzkum Ipsos (dobrovolně by platilo jen ~15 % důchodců).
  citace:
  - text: Pro demokracii v České republice by bylo lepší, kdyby tady žádná Česká televize nebyla.
  podtema: Česká televize a mainstreamová média
- id: rajchl-2026-06-21-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'Dvojí metr v kauzách: byty vs. Pauknerovy korupce; demaskování pseudonymu — Rajchl (21. 6.
    2026)'
  text: 'Rajchl tvrdí, že média a Milion chvilek řeší poslední měsíc „byty" (ministryně Mrázová, poradkyně
    Bárta, Prokop), ale ignorují mnohem závažnější korupční kauzy za desítky až stovky milionů, které
    „na stříbrném podnose" servíruje na Facebooku **Tomáš Paukner**: předražený nákup 20 let starých repasovaných
    vrtulníků, „malé domů" Hladíka (MŽP) a kauza náměstka Karla Dvořáka (justice za Blažka), který bez
    výběrového řízení dostával lukrativní zakázky od firem napojených na Prahu (odnož dozimetru). Seznam
    podle něj místo řešení kauz **změnil pravidla Seznam Médium**, aby Pauknera donutil odhalit identitu
    (ověření totožnosti) — to označuje za přímý útok na demaskování pseudonymu (kontrast s účtem „Julius
    Šuman", který média kdysi bez výhrad přebírala). Milion chvilek a Mikuláše Mináře (jemuž vyčítá zpronevěru
    7 mil. při zakládání nikdy nevzniklé strany) líčí jako „vlivovou strukturu" financovanou lidmi nesmířenými
    s výsledkem voleb, kteří si z Petra Pavla udělali náhradního „lídra opozice". Spravedlnost má podle
    něj „díky médiím jedno oko pootevřené" (řeší byty, ne dozimetr, vrtulníky či pět podezřelých úmrtí).'
  citace:
  - text: Jaký jste strážci demokracie, když si vybíráte jenom některé kauzy?
  podtema: Dvojí metr v médiích
- id: rajchl-2026-06-21-05
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Zrušit dočasnou ochranu a dávky, automatická deportace; vyvrácení statistiky Lásky; neasimilace
    dětí — Rajchl (21. 6. 2026)
  text: |-
    Rajchl opakuje výzvu zrušit dočasnou ochranu a veškeré dávky Ukrajincům: mnozí prý mezi čtyřma očima přiznávají, že „se modlí, ať válka neskončí" (jinak by museli mít živnost a přišli by o příspěvky), podnikají bez živnostenského oprávnění a neplatí daně ani pojistné. Žádá revizi pobytu příchozích po roce 2022 (kdo si nenašel práci, „tady nemá co dělat") a zavedení **automatické deportace** za jakýkoli trestný čin či násilný přestupek (analogie: host, který vám doma krade, musí pryč).

    - **Vyvrácení statistiky Václava Lásky.** Na Láskovu statistiku, že odsouzených Ukrajinců ve vězení je procentuálně méně než Čechů, reaguje, že jde o „demagogii nejtěžšího kalibru": při ~dvouleté délce trestního řízení se pachatelé z let 2024–2026 ještě ve vězení nenacházejí. Správné srovnání by bylo počtem **zahájených trestních řízení za poslední 4 roky** (ne tresty za 20 let) — pak „vypadnou úplně jiná čísla".
    - **Ukrajinské děti se neasimilují.** Proti tvrzení ministra Plagy o dobré asimilaci tvrdí, že velká část ukrajinských dětí do školy nechodí, nebo neumí pořádně česky; jediný žák nerozumějící výkladu zdržuje vzdělávání celé třídy. Navrhuje vytvořit jim vlastní třídy, ale ne na úkor vzdělávání českých dětí — zdůrazňuje, že nejde o národnost („i kdyby byli z Bangladéše").

    Navazuje na [Rozdíl mezi Ukrajinci před válkou a po válce (Rajchl, 16. 6.)](#rozdíl-mezi-ukrajinci-před-válkou-a-po-válce-zrušit-dávky-a-dočasnou-ochranu--rajchl-16-6-2026).
- id: rajchl-2026-06-21-06
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Petr Pavel jako „pózer/kašpár", ne osobnost — Rajchl (21. 6. 2026)
  text: 'Rajchl tvrdí, že ho uráží, jak Petr Pavel „degraduje" prezidentský úřad chováním „mediální hvězdy
    na úrovni Československo hledá Superstar": fotí závody Le Mans a MotoGP (s Valentinem Rossim), leze
    na stožáry jako „zachránce paraglidistů", komentuje koncesionářské poplatky. Prezident podle něj má
    být „morálním, mravním a intelektuálním lídrem" a pracovat pro občany — což Pavel nedělá. Adoraci
    v médiích (Pavel „sklidil větší aplaus" na koncertě; Eva Pavlová „jako Madonna", ženy chtějí její
    účes) přirovnává k „referování o Kim Čong-unovi" — horšímu než severokorejská propaganda; připomíná,
    že tatáž média se dříve smála kultu osobnosti kolem Putina (judo, hokej). Vyčítá Pavlovi, že se jel
    fotit na závody, místo aby byl v Lidicích. Na rozdíl od Klause, Zemana i Havla (s nimiž nesouhlasil,
    ale byli to „osobnosti" s nezpochybnitelným intelektem) je Pavel podle něj „pózer/reklamní figurka".
    Doufá ve změnu za rok a půl; jako lepší alternativy jmenuje Andreje Babiše a možnou kandidátku Ivanu
    Tykač. Navazuje na [Pavel „panák" — Tarabová (15. 6.)](#pavel-panák-vs-zeman-můj-prezident-favorit-marek-vašut--tarabová-15-6-2026).'
  citace:
  - text: Petr Pavel je kašpár, který se předvádí před televizními kamerami […] vyhrazuje pozici prezidenta
      naší země.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-06-21-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Polské odebrání řádu demaskovalo Zelenského; Pavlovo mlčení = urážka předků — Rajchl (21. 6.
    2026)
  text: 'Rajchl označuje odebrání nejvyššího polského vyznamenání (řád Bílé orlice) Zelenskému za „zásadní
    moment" — jedna „dírka do přehrady" lži, po níž se „celé sesype". Poláci podle něj Zelenského demaskovali:
    kdo adoruje nacismus, nepatří mu nejvyšší státní vyznamenání. UPA označuje za nacistickou jednotku,
    která ve Volyni vyvraždila desetitisíce lidí (včetně těhotných žen a dětí přibíjených na stromy) a
    do roku 1947 vraždila i Židy, Čechy a Slováky — pokud Zelenský pojmenuje jednotku po UPA, „je nacistou".
    Současnou Ukrajinu charakterizuje obrazem „boří se sochy Bulgakova a staví sochy Bandery". Pavlovo
    mlčení (jako držitele i udělovatele řádu Bílého lva Zelenskému) nazývá „obrovskou urážkou předků"
    a obviňuje opozici z dvojího metru (obviňuje vlastence z „náckovství" kvůli odporu k sjezdu Landsmannschaftu,
    ale tleská „otevřenému náckovi" Zelenskému). Vyzývá Pavla k odebrání řádu Bílého lva. Ukrajincům vracejícím
    polská vyznamenání ironicky doporučuje „dotáhnout to do konce" a vrátit Polsku i všechny peníze. Navazuje
    na [Zelenský pojmenoval jednotku po UPA — Rajchl (31. 5./7. 6.)](#zelenský-pojmenoval-jednotku-po-upa--důkaz-nacistické-ideologie-výzva-k-odebrání-řádu-pavlovi-rajchl-31-5-2026).'
  citace:
  - text: V tuto chvíli je naše nejvyšší vyznamenání v rukou člověka, který adoruje nacizmus. Takhle prosté
      to je.
  podtema: Stav Ukrajiny a mobilizace
- id: rajchl-2026-06-21-08
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Zbrojení vs. záchrana životů — peníze na zbraně místo na léčbu (Rajchl, 21. 6. 2026)
  text: 'Rajchl staví do protikladu výdaje na zbrojení a záchranu konkrétních lidských životů: jedna letová
    hodina F-35 (~1 milion Kč) by mohla zaplatit léčbu, kterou pojišťovna nehradí, a zachránit jeden život.
    Ilustruje to sbírkami pro nemocné (Bára z Opavy — české zdravotnictví jí ve 31 letech nabídlo jen
    paliativní péči, za 1 mil. Kč jí umožnili individuální léčbu ve Švýcarsku, která zabírá; Pavlína z
    Olomouckého kraje). Tvrdí, že „odstrašování Putina" a nutnost zbrojit (160 → 240 mld. Kč, tanky, BVP,
    munice, F-35) je „lež" a „snaha přetransformovat peníze do kapes zbrojařů, bankéřů a finančních institucí".
    Deklaruje, že jedním z hlavních směrů jeho politiky bude investovat do technologií a lidí zachraňujících
    životy, ne do „železa, které lidské životy ničí". Navazuje na svůj dřívější morální argument (1 tank
    Leopard = 745 mil. Kč = „745 zachráněných životů", [zdroj 18. 6.](_zdroje.md#jindřich-rajchl--videoportál-leopard-vs-záchrana-životů-18-6-2026)).'
  citace:
  - text: Zachránit lidský život je noblesní a ctnostné, zničit ho je nehumánní a odporné.
  dalsi_zdroje:
  - 2026-06-18_rajchl_videoportal-leopard-vs-zachrana-zivotu-18-6-2026
  podtema: NATO, zbrojení a militarizace ČR/Evropy
