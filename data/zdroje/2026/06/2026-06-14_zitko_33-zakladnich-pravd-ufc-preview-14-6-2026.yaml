  text: |-
    Ve vysílání „Poledník 11:11" Zítko přečetl satirický seznam **„33 základních pravd, o kterých se nepochybuje"** (autor Paramír Bagger / COVID-logika, Substack) jako ucelený průchod celým svým světonázorem. **Nepřináší nová tvrzení** — každé téma je už ve wiki zpracováno; níže je rozpis, ve kterém zazněla i v tomto zdroji ([ČsTV2 — 33 pravd, 14. 6. 2026](/zdroje/2026-06.md#2026-06-14_zitko_33-zakladnich-pravd-ufc-preview-14-6-2026)):

    - **Plochá Země** (zakřivení, voda „vodorovná") → [Plochá Země](/temata/konspirace/2026.md#zitko-2026-04-03-02)
    - **Přistání na Měsíci jako podvod** (van Allenovy pásy, Kubrick, vlající vlajka, smazaná telemetrie, Artemis na 1. apríla) → [Přistání na Měsíci jako podvod](/temata/konspirace/2026.md#zitko-2026-04-02-01)
    - **Popírání virologie** (viry „neizolovaní jednorožci") a **tělo se opraví vibracemi** → [covid-vakciny.md — Odmítání virologie](/temata/covid-vakciny/2026.md#tarabova-2026-04-02-01)
    - **Vakcíny jako „jedy"** (spike, oxid grafenu, SV40, potracené plody), Pfizer pokuta + právní imunita, mizející SMS smlouvy VDL/Baťová → [covid-vakciny.md — Vakcíny](/temata/covid-vakciny/2026.md#tarabova-2026-03-23-01), [covid-vakciny.md — Šarže](/temata/covid-vakciny/2026.md#cernohorsky-2026-05-25-02)
    - **Genocida/sterilizace = propad porodnosti** (111 → 77 tis., jen očkované ženy, ÚZIS 1,3 mil.) → [covid-vakciny.md — Porodnost Q1 (15. 6.)](/temata/covid-vakciny/2026.md#zitko-2026-06-15-01)
    - **Remdesivir jako příčina úmrtí** → [covid-vakciny.md — Protokol úmrtí](/temata/covid-vakciny/2026.md#zitko-2026-04-10-02)
    - **Ivermectin potlačen, dvouměsíční testování „bezpečné"** → [covid-vakciny.md](/temata/covid-vakciny.md)
    - **5G + španělská chřipka** (záření smaží lidi) → [covid-vakciny.md — 5G](/temata/covid-vakciny/2026.md#zitko-2026-04-10-03)
    - **Patentované nemoci** (Ebola/HIV/COVID, Rothschild 2015) → [covid-vakciny.md](/temata/covid-vakciny/2026.md#zitko-2026-03-27-01)
    - **Kalergiho plán + „chirurgové z dovozu"** → [migrace.md](/temata/migrace.md), [dsa-cenzura.md — rozsudek SPD](/temata/dsa-cenzura.md#zitko-2026-06-12-02)
    - **Okamura 3 mil. za plakát** vs. Zítkovy 3 roky za „poplašnou zprávu" → [dsa-cenzura.md](/temata/dsa-cenzura.md#zitko-2026-06-03-03)
    - **ČT „výpalné"** (cashback od 12. 3. 2020) → [media-propaganda.md — ČT výpalné](/temata/media-propaganda.md#zitko-2026-06-07-04)
    - **CO2/Green Deal/uhlíkové povolenky, soláry a větrníky** → [suverenita-eu.md — Green Deal](/temata/suverenita-eu/2026.md#rajchl-2026-03-15-15), [vetrniky.md](/temata/vetrniky.md)
    - **Vlastizrada 1992, ČSR trvá (zákon 11/1918), reparace 9 550 t zlata, vstup do EU/NATO nelegitimní** → [Recap „portál 11:11" (7. 6.)](/temata/konspirace-ceskoslovensko.md#zitko-2026-06-07-03), [Válečné reparace (3. 6.)](/temata/konspirace-ceskoslovensko.md#zitko-2026-06-03-06)
    - **Cinknuté volby (Dominion), Joe Biden dvojník (popraven, o půl metru vyšší)** → [Dvojníci a klony](/temata/konspirace/2026.md#boldy-2026-03-12-07)
    - **Měnová reforma 1953 + inflace** (1 mld → 8 bil. Kč, okrádání úspor/„paměti národa") → [Měnová reforma 1953 (3. 6.)](/temata/konspirace-ceskoslovensko.md#zitko-2026-06-03-05)
    - **Průmyslové jídlo/cukr vs. tuk, slunce „nebezpečné", astrologie vs. virologie** — drobné zdravotní teze v rámci téhož seznamu (bez samostatného záznamu)

    Navíc Zítko kriticky zmínil **Jindřicha Rajchla**, že na mítinku v Bystřci srovnával vakcínu (dle Zítka „biologickou zbraň") s alkoholem a cigaretou, a **Adama Vojtěcha** („zpívající ministr ze Superstáru") jako potřetí nominovaného na zdravotnictví.
  podtema: Globalistická agenda a další výklady
