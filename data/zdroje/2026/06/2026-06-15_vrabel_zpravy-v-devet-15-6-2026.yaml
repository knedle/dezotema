- id: vrabel-2026-06-15-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: 'Írán: „memorandum" podepsáno (14. 6.), Hormuz otevřen 19. 6., Netanjahu nespokojen — Vrabel
    (15. 6. 2026)'
  text: 'J. D. Vance oznámil, že USA a Írán 14. 6. „elektronicky podepsali mírovou dohodu" (Vrabel upřesňuje:
    jde jen o memorandum, podmínky se teprve dojednají do 60 dnů — obává se, že se protáhnou na 90+ a
    dohoda se nemusí naplnit). Trump tvrdí, že Hormuzský průliv je už částečně otevřen a od 19. 6. plně;
    zmírnění sankcí a uvolnění zmrazených aktiv (~100 mld. $) prý Írán dostane jen „bude-li dělat, co
    má". Vrabel poukazuje na rozpor: Macron prohlásil, že poplatky za průjezd Hormuzem jsou „nepřípustné",
    jako by se nevybíraly — přitom Írán je už vybírá a dohodl se o jejich dělení s Ománem. Spekuluje,
    že podpis memoranda může být záminkou pro vplutí západních (i českých) flotil do oblasti. Netanjahu
    je dle Reuters s memorandem nespokojen (izraelský činitel je označil za „hrozný pro Izrael"); Ben
    Gvir prohlásil, že Izrael není „banánová republika" a memorandum pro něj nic neznamená — Izrael si
    zachovává suverenitu a může dál bombardovat Libanon bez ohledu na dohody USA. Vrabel opakuje (s odkazem
    na Tuckera Carlsona), že „USA nemají suverenitu" a válku řídí Netanjahu, sponzorovaný přes Kushnera.
    Celý íránský příběh přirovnává k nekonečné telenovele („Esmeralda, 368. díl").'
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-15-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: „Český model transformace" pro Kubu = devastace; půjčka SAFE 2 mld € na zbrojení (Vrabel, 15.
    6. 2026)
  text: |-
    Ke zprávě, že USA (Rubio) zvažují pro Kubu „český model transformace z 90. let" a české MZV chystá k tématu přednášku Václava Klause na University of Miami, Vrabel varuje, že Kubánce čeká totéž co ČR: rozprodej a ztráta státního majetku, předlužení (ČR dnes míří k 350mld. schodku a bilionovým dluhům), likvidace malých a středních podnikatelů ve prospěch nadnárodních korporací (daňové prázdniny, pozemky/infrastruktura zdarma, zisky odváděné přes fakturace do daňových rájů). Sliby „platů jako na Západě" a „rovné startovní čáry" se podle něj nenaplnily. Jako paralelu uvádí Jugoslávii/Srbsko: prosperující země zničená sankcemi Západu (hyperinflace, lidé vybírající jídlo z popelnic) — bída Kuby tedy není dána „přestárlým vedením", ale 60 lety amerických sankcí.

    Zároveň ČR pod Babišem získala z evropského nástroje **SAFE** půjčku **2,06 mld € (50,3 mld Kč)** na vojenské vybavení a dostavbu dálnice D11. Vrabel ironicky „gratuluje" k dalšímu zadlužení — „bezpečí" (SAFE) ve skutečnosti slouží vyzbrojení EU a budování dálnic pro přesun tanků Leopard.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: „Gratulace" za další zadlužení — sjednal půjčku SAFE 2,06 mld € (50,3 mld Kč) na zbrojení
      a dálnici D11
  podtema: Energetika a Rusko
- id: vrabel-2026-06-15-03
  typ: tvrzeni
  temata:
  - covid-vakciny
  nadpis: 'HPV očkování: cíl 90% proočkovanosti (Vojtěch + Konečná) — Vrabel (15. 6. 2026)'
  text: K nové „národní strategii urychlení eliminace nádorových onemocnění způsobených HPV (2026–30)"
    — ministr Adam Vojtěch a hlavní hygienička Barbora Macková chtějí dosáhnout 90% proočkovanosti dětí
    do čtyř let — Vrabel připomíná, že Vojtěch prosazoval očkování už v covidu („po chvilce na střídačce
    je zpátky"). Doporučuje lidem zajímat se o nežádoucí účinky (slyšel o nich „hrůzné věci") a hodnotit
    „pro a proti"; neoznačuje HPV vakcínu výslovně za špatnou, ale odmítá rétoriku, že jde o „něco spásného,
    co vymýtí rakovinu". Uvádí, že prosazení této strategie v ČR je z velké části zásluha Kateřiny Konečné,
    která si očkovací strategie (vč. HPV) vzala v Europarlamentu za osobní téma — kvůli čemuž s ní měl
    Vrabel „potyčku".
  osoby:
  - osoba: adam-vojtech
    vztah: negativni
    kontext: Prosazuje 90% proočkovanost proti HPV (jako v covidu); Vrabel varuje před nežádoucími účinky
  podtema: Hantavirus
- id: vrabel-2026-06-15-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Protesty proti migraci napříč Evropou vs. „uspaná" ČR — Vrabel (15. 6. 2026)
  text: 'Vrabel popisuje vlnu protestů „prakticky všude" v Evropě: proti migraci (Británie, Irsko, Francie,
    Itálie, Londýn, Brusel, Německo), proti banderismu (Polsko, kde vznikají domobrany), proti G7 (Ženeva
    — ~16 000 lidí, zapálené budovy/banka) a v Albánii proti záboru pláže a ostrova Ivankou Trumpovou
    a Jaredem Kushnerem (statisíce lidí, požadavek na odstoupení premiéra). Zmiňuje i nově vzniklou „Irskou
    revoluční armádu" (maskovaní muži se samopaly hrozící bránit suverenitu proti dovozu migrantů). Kontrastuje
    to se sarkasticky popsanou „uspanou" ČR — jediná země „v klidu", protože pozornost lidí pohlcuje mediální
    hádka vláda vs. prezident; vlastenci jsou po sjezdu SdL vyčerpaní a praví protiglobalizační oponenti
    (např. Tomáš Čermák) zůstávají vězněni.'
- id: vrabel-2026-06-15-05
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: „Nové Česko" (Marek Kuba) jako uměle vyrobená strana — Vrabel (15. 6. 2026)
  text: 'Vrabel si v předvolebním průzkumu Kantar (pro ČT) všiml strany **Nové Česko** Marka Kuby a popisuje
    na ní mechanismus „výroby" politických stran. Kubu zná osobně: do politiky se dostal v jižních Čechách
    přes Pavla Dlouhého (kmotr z Hluboké), jako ministr průmyslu si pořídil firmu Battery Box, která dostává
    zakázky od ČEZ, a po ruském vstupu na Ukrajinu „hrdě nosil ukrajinský trojzubec" — nikdy nebyl vlastenec.
    Vrabel: strana bez reálného základu se vytvoří, dosadí se politik se sponzory v pozadí, média ho začnou
    zvát do pořadů a „najednou se objeví v průzkumech" — takto vznikají strany, které pak řídí zemi.'
  osoby:
  - osoba: marek-kuba
    vztah: negativni
    kontext: Strana „Nové Česko" (v průzkumu Kantar) = uměle vyrobená; Kuba (ex-min. průmyslu, firma Battery
      Box se zakázkami od ČEZ, nosil ukr. trojzubec) nikdy nebyl vlastenec
  podtema: Volby
