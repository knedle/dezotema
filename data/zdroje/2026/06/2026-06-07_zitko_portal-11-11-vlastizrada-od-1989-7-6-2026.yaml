  poznamka: 'Z velké části recap již zachycených témat (reparace 28 bil./ČSR trvá, bitcoin „Blažcoin"
    100 mld, QAnon dvojníci/central casting, COVID genocida) + esoterická numerologie portálu 6.6 (nezpracováno).
    Nové/rozšiřující: ČT výpalné (500/3000 zaměstnanců, mzdy, vrátit poplatky od 12. 3. 2020), Slovensko
