  nadpis: ODS jako systematické rozkrádání od roku 1989 — „1 bilion ročně odchází z ČR" (Zítko, 7. 6.
    2026)
  text: 'Zítko sdílí a komentuje sestřih kanálu Hranaři, který líčí korupci spojenou s ODS od 90. let
    jako jeden souvislý systém (ne jednotlivá selhání). Vyjmenovává řadu jmen napříč desetiletími (Klaus,
    Kočárník, Macek, Řebíček, Dalík, Janoušek, Oulický, Vondra, Drobil, Schneider, Tluchoř, Blažek, Bradáč,
    Vaňková, Bachbouk, Udženija…) a etapy: kupónová privatizace „bez hranic" (Stráský prý přiznal, že
    ani 1 % nešlo mezi lidi — proto se privatizace „na chvíli zastavila", aby se lépe rozkradla), padající/vytunelované
    banky placené daňovými poplatníky (přes 90 % bank je dnes v zahraničních rukou), Lehké topné oleje
    (~100 mld. v 90. letech), až po bitcoinovou kauzu „Blažcoin" (100 mld.). Zítko z toho dovozuje, že
    z ČR „odchází 1 bilion korun ročně" (čísло přebírá od Rajchla) a volá po obnově ČSR a svobodných volbách
    „na blockchainu" bez politických stran. Doplňuje euro: Pavel prý chce „vyvexlovat euro místo bonů",
    aby ČR platila dluhy předlužených zemí.'
  podtema: Kauza Ladislav Vrabel — dotační podvod
- id: zitko-2026-06-07-03
  typ: tvrzeni
  temata:
  - konspirace-ceskoslovensko
  nadpis: 'Recap „portál 11:11": vlastizrada 1989, reparace/ČSR a QAnon dvojníci (Zítko, 7. 6. 2026)'
  text: 'Ve vysílání k „portálu 6.6./11:11" Zítko zopakoval své dlouhodobé teze (bez nových detailů):
    vlastizrada a spiknutí proti lidu od roku 1989 (rozdělení ČSFR zákonem 542 bez referenda, dohoda Klaus–Mečiar
    u vily Tugendhat, uschlý strom jako „znamení"), trvající právní stát Československá republika a nárok
    na reparace 28 bilionů (9 550 tun zlata), neplatnost vstupu do EU/NATO (ČSR nikdy nebyla členem),
    a QAnon „central casting" / dvojníci (Fiala, Pavel, Babiš, Zeman prý „omládli/obrostli vlasem"), adrenochrom
    a blížící se „odtajnění" kolem 14. 6. (narozeniny Trumpa, UFC u Bílého domu), 24. 6. a 4. 7. Podrobné
    záznamy viz [Villa Tugendhat, tři koruny](#villa-tugendhat-tři-koruny-a-možnost-obnovení-čs-občanství--zítko-20-4-a-20-5-2026),
    [Válečné reparace a výzva mocnostem (3. 6.)](#válečné-reparace-a-výzva-mocnostem-obnovit-čsr-zítko-3-6-2026)
    a [QAnon: adrenochrom, Bieber/Obama (3. 6.)](konspirace-deep-state-qanon.md#qanon-adrenochrom-bieberobama-qfs-a-250-bankovka-s-trumpem-zítko-3-6-2026).'
- id: zitko-2026-06-07-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: 'ČT „výpalné": propočet 500 zbytečných zaměstnanců, výzva vrátit poplatky (Zítko, 7. 6. 2026)'
  text: 'Zítko rozvíjí svou „korespondenční válku" s Českou televizí (viz [korespondence s ČT, 1. 6.](osoby/zitko.md)).
    Z výroku Milana Friedricha (že při výpadku 1 miliardy z poplatků by ČT musela z 3 000 zaměstnanců
    propustit 500) počítá: mzdový náklad na jednoho takového „zbytečného" zaměstnance vychází na ~167
    000 Kč měsíčně (hrubá mzda ~125 000, čistá ~97 000) — zatímco komerční TV Nova vystačí s ~500 zaměstnanci
    celkem. Připomíná Moravcových 141 000 Kč/hodinu (~1,6 mil./měsíc) a ředitelových 300 000+. ČT označuje
    za „darmožrouty a lháře" porušující zákon o ČT (nevysílá pravdivé, vyvážené ani ověřené informace,
    vyloučila oponenty z covidových debat). Vyzývá koncesionáře, aby přestali platit a naopak žádali vrácení
    poplatků od 12. 3. 2020 (počátek „hry na COVID-19"). Moderátory v černém (na protest) označuje za
    spoluúčastníky „zabíjení biologickou zbraní", kteří „zaslouží čelit vojenskému tribunálu". Ve vysílání
    „Sůl nad zlato" (8. 6.) doplňuje konkrétní čísla: nový GŘ Hynek Chudárek má plat 346 800 Kč (6× průměrná
    mzda ČT) + pololetní bonusy až 5 platů (až 3,4 mil. Kč ročně), což převyšuje plat premiéra (294 000)
    a blíží se platu prezidenta (365 000); rada ČT je nominována politickými stranami a kritérium „vysílání
    pravdy / dodržování zákona o ČT" mezi podmínkami bonusů chybí. Opakuje výzvu žádat vrácení poplatků
    (od 12. 3. 2020) a odškodnění pro poškozené vakcínami.'
  osoby:
  - osoba: milan-friedrich
    vztah: neutralni
    kontext: Moderátor ČT, jehož výrok (500 z 3000 zaměstnanců při výpadku 1 mld) Zítko použil k propočtu
      „nadměrných" mezd ČT; reagoval prý přesměrováním poplatku jinam
