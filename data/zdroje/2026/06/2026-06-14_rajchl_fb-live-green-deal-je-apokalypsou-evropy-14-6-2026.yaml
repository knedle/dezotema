  nadpis: 'Ipsos: jen 15 % důchodců a 40 % studentů by dobrovolně platilo ČT — Rajchl (14. 6. 2026)'
  text: 'Rajchl cituje průzkum Ipsos: dobrovolně by koncesionářské poplatky platilo jen **15 % důchodců**
    a 40 % studentů (u nichž pochybuje, že by reálně platili). Opakuje svůj návrh **dobrovolných koncesionářských
    poplatků** přes set-top-box jako jediné spravedlivé řešení (viz [Rajchl: dobrovolné poplatky](/temata/media-propaganda.md#rajchl-2026-04-19-02)):
    kdo chce, ať platí (klidně 100 tisíc), ČT může vybrat „třeba 100 miliard", politici ztratí veškerý
    vliv a ČT bude muset vysílat pro všechny, aby získala předplatitele. Vyzývá 92 opozičních poslanců,
    kteří ČT brání jako „pilíř demokracie", ať dobrovolně pošlou peníze na její účet — „mluvit nic nestojí,
    poslat peníze bolí".'
  podtema: Nová alternativní média
- id: rajchl-2026-06-14-04
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Migrační pakt jako „vyděračský pakt"; Belfast jako varování — Rajchl (14. 6. 2026)
  text: |-
    Rajchl rozebírá migrační pakt jako mechanismus kvót a přerozdělování: deklarovaná „třetí možnost" (humanitární/finanční pomoc) platí jen na vlastní žádost, jinak zůstávají dvě — přijmout kvótu (ČR min. **30 000 migrantů**), nebo zaplatit **15 mld. Kč ročně** „výpalné" (Maďarsko už 19 000 / 10 mld.). Označuje to za „klasickou výpalnou politiku chicagské mafie", ne solidaritu — solidarita platí, jen když si někdo problém nezpůsobil sám, kdežto Německo si migraci („wir schaffen das") způsobilo a organizovalo samo; střední Evropa neměla kolonie, nemá tedy morální důvod platit. Tvrdí, že lodě převážejí migranty „sponzorované pašeráctví" politických neziskovek a že komisařka Ylva Johansson chce „o milion migrantů víc ročně". Soudržné odmítnutí Polska, Maďarska a Slovenska bere jako důkaz nevýhodnosti. Reaguje na výrok („Rajchl straší") odkazem na Belfast (súdánský útočník řezající hlavu na ulici) a deklaruje: „radši nálepku nácka, než abych mlčel" a kvůli paktu přišel jeden člověk páchající násilí — bezpečnost občanů je na prvním místě.

    Navazuje na [Migrační pakt: Rakušan jediný z V4 pro (Rajchl, 12. 6.)](/temata/migrace/2026.md#rajchl-2026-06-12-02).
  citace:
  - text: Tohle je vyděračský pakt. […] To je klasická výpalná politika mafie z Chicaga třicátých let.
