- id: rajchl-2026-06-14-05
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Green Deal jako „apokalypsa Evropy": pět klíčových nařízení a kalkulace vystoupení z EU — Rajchl
    (14. 6. 2026)'
  text: |-
    V nedělním FB Live označil Rajchl Green Deal za „apokalypsu evropské ekonomiky" a postupně rozebral pět nařízení, která jej tvoří:

    - **ETS1** — už dnes zdražuje elektřinu: ~7 000 Kč/rok na občana, přímý dopad 100 mld. Kč do rozpočtu, nepřímý ve stovkách miliard (proinflační tlak, brzda ekonomiky).
    - **ETS2** — rozšíření na pohonné hmoty, plyn, uhlí; zaplatí každý. Odhad **90–100 tisíc Kč na domácnost ročně**. „Zastropování" na 45 € je dle něj lež — EU jen 2× ročně vypustí +4 % povolenek, cena krátce klesne a poroste dál (viz [ETS2: zastropování je lež, 11. 6.](/temata/suverenita-eu/2026.md#rajchl-2026-06-11-02)).
    - **RED3** — závazek 42,5 % (možná 45 %) elektřiny z OZE do 2030; ČR je na ~20 %. Vynutí masivní výstavbu větrníků/solárů → nestabilní soustava a riziko blackoutů.
    - **EPBD4** — nové veřejné budovy bezemisní od 2028, soukromé od 2030; prodraží stavbu min. o 30 %. Nesplnění energetického štítku (A–G) znamená nemožnost nemovitost prodat, pronajmout, zastavit či zdědit bez závazku k rekonstrukci — Rajchl varuje, že investiční skupiny pak nemovitosti skoupí pod cenou. „Geniální" provázání: ETS zdraží i izolační materiály (styren/polystyren — výrobci dostanou jen poloviční povolenky zdarma). Vytápět půjde jen tepelnými čerpadly (plyn ani uhlí ne).
    - **CBAM** — uhlíkové clo na dovoz mimo EU (zdraží levné zboží z Číny a dalších).

    Závěr: souhrnný dopad těchto nařízení v horizontu 10–15 let převýší i náklady na vystoupení z EU (odhad **2–5 bilionů Kč**) — členství se tak „už ekonomicky nevyplatí". Rajchl navrhuje buď Green Deal v rámci EU zrušit (s AfD, Le Penovou, Melaniovou), nebo se připravit na odchod (dohody s Čínou/Indií/USA, vlastní banka, strategické provozy pod kontrolou státu) — „lepší rozvod než špatné manželství". Bez změny hrozí kolem 2030 „totální problém".
  citace:
  - text: Green Deal je skutečně apokalypsou evropské ekonomiky. […] Je to tak komplexně vymyšlený systém
      na likvidaci evropské ekonomiky, že to nemá obdoby.
  podtema: EU a Green Deal
- id: rajchl-2026-06-14-06
  typ: predikce
  temata:
  - suverenita-eu
  nadpis: Green Deal přivede Evropu kolem 2030 k „totálnímu problému"
  text: 'Rajchl předpovídá, že soubor nařízení Green Dealu (ETS1/ETS2, RED3, EPBD4, CBAM) přivede ČR a
    Evropu kolem roku 2030 do „totálního problému": bezemisní budovy povinné u nových veřejných staveb
    od 2028 a soukromých od 2030; drtivá většina lidí si nebude moci dovolit vlastní bydlení (skoupí ho
    investiční skupiny); ETS2 ~90–100 tis. Kč na domácnost ročně. Při vystoupení z EU a obratu (Čína/Indie/USA)
    by naopak ČR mohla být v roce 2035 „jednou z nejbohatších zemí Evropy".'
  citace:
  - text: Tohle všechno bude znamenat to, že kolem roku 2030, pokud by se to realizovalo, se dostaneme
      do totálního problému.
  predikce:
    horizont: 2028–2030 (nařízení), ~2030 kolaps / 2035 vize
    stav: ceka
