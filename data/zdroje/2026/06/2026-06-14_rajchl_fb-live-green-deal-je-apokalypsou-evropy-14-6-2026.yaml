  nadpis: Prodražení o dalších 40 miliard — Rajchl (14. 6. 2026)
  text: 'Rajchl odkazuje na Deník CZ s titulkem, že nákup F-35 se Česku prodraží o dalších **40 miliard
    Kč** — protože byly špatně spočítány provozní náklady. Připomíná, že přesně to tvrdil od počátku (a
    byl označován za „proruského dezinformátora"); garantuje, že to nebude konec, protože jedna letová
    hodina stojí ~milion Kč. Staví to do morálního kontrastu: na léčbu nemocných dětí se veřejně vybírají
    2–3 miliony, zatímco F-35 „propálí" milion za jednu letovou hodinu — společnost ochotná odmítnout
    drahou léčbu a zároveň utrácet desítky miliard za zbraně je „smrtelně nemocná".'
  podtema: 'Kauza F-35: nejhorší kontrakt ze všech zemí'
- id: rajchl-2026-06-14-02
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: Tři „dezinformace, co se staly pravdou" za jeden týden — Rajchl (14. 6. 2026)
  text: |-
    Rajchl uvádí jako důkaz nepoctivosti mainstreamu tři případy, kdy údajné „proruské dezinformace" byly během jednoho týdne potvrzeny samotnými oficiálními zdroji či mainstreamem — který je nyní referuje, „jako by se nechumelilo":

    - **Biolaboratoře (Echo24):** Tulsi Gabbardová přiznala, že USA financovaly přes 120 tajných laboratoří ve světě, z toho 40 na Ukrajině (gain-of-function výzkum zakázaný v USA). Viz [konspirace-deep-state-qanon.md](/temata/konspirace-deep-state-qanon.md#vrabel-2026-06-13-04).
    - **F-35 (Deník CZ):** nákup se prodraží o dalších 40 miliard kvůli špatně spočítaným provozním nákladům (1 letová hodina = milion Kč) — Rajchl to staví proti situaci, kdy se na léčbu nemocných dětí veřejně vybírá. Viz [kauzy.md](/temata/kauzy/2026.md#rajchl-2026-05-31-03).
    - **Ukrajinské dávky (TV Nova):** „každý pátý cizinec" pobíral dávky neoprávněně (dotační turistika, škody v desítkách milionů) — nikoli „ojedinělé případy", jak tvrdil ministr Jurečka.

    Rajchl: kdo se „nenechá okrádat, fandí Putinovi" je „logika blázna"; dezinformace se stávají pravdou „občas za rok, občas za pár dní".
  podtema: Nová alternativní média
