  poznamka: 'Čtyři zpracovaná témata: (1) Povinná vojenská služba — pokračování z 26. 6., Macinkovo propagandistické
    video a jeho pokrytectví (sám na vojně nebyl, přitom domlouvá zbrojní kontrakty v USA) — [valka-nato-rusko.md](valka-nato-rusko.md).
    (2) Dánsko/EU omezují dočasnou ochranu ukrajinským mužům v branném věku = „čistý fašismus" (+ karmická
    teze) — [valka-nato-rusko.md](valka-nato-rusko.md). (3) Nord Stream 2 žaluje EU u ESD, Litva/Estonsko/Polsko
    žádají zákaz ruské ropy — Vrabel: řešením je vystoupit z EU — [ceny-energie.md](ceny-energie.md).
    (4) Německý solární boom (1000 GW) promění ČR z vývozce na dovozce elektřiny — [ceny-energie.md](ceny-energie.md).
    Ostatní zprávy (Rubio/Lavrov spor o Aljašku, Kuba, AFD/migrace v Německu, Vučićova demonstrace, zákaz
    sociálních sítí v Austrálii, Binance/MiCA, OpenAI/Trump, Porsche přesun výroby) jen rychlý přehled
    bez samostatného zpracování. Bez predikcí a stoch. teroru. Pravidelný přehled zahraničních a domácích
    zpráv s komentářem'
vyroky:
- id: vrabel-2026-06-27-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Nord Stream 2 žaluje EU u ESD; Litva/Estonsko/Polsko chtějí úplný zákaz ruské ropy — Vrabel:
    řešením je vystoupit z EU (27. 6. 2026)'
  text: 'Švýcarská Nord Stream 2 AG podala žalobu k Evropskému soudnímu dvoru proti zákazu dovozu ruského
    plynu (má platit od konce roku 2027) — namítá, že jde fakticky o vyvlastnění komerčního využití plynovodu
    bez náhrady. Souběžně Litva a Estonsko vyzvaly EU k co nejrychlejšímu zákazu ruské ropy a polský ministr
    energetiky Wojciech Rona žádá úplné odmítnutí ruských dodávek do konce roku 2026 (i za cenu vyšších
    cen), zatímco Maďarsko a Slovensko jsou na ruských dodávkách silně závislé. Vrabel argumentuje, že
    zákaz plynovodu nevyvlastňuje samotné potrubí (vlastníci si ho „mohou nechat"), ale brání jeho komerčnímu
    využití. Klíčový argument: pokud Polákům/Pobaltí vadí ruská ropa, ať ji sami nekupují, ale nemají
    právo to vnucovat ostatním členským státům přes společnou politiku EU — řešením je, aby ČR z EU vystoupila
    a mohla si sama rozhodovat o nákupu levné a kvalitní ruské ropy/plynu (na které jsou uzpůsobené i
    české rafinerie), bez ohledu na politický názor na válku na Ukrajině. Politiky prosazující odstřižení
    od Ruska označuje za zkorumpované „fašisty", kteří chtějí Rusko okrást o suroviny — a varuje, že tlak
    na jadernou velmoc může eskalovat až k použití taktických jaderných zbraní.'
  citace:
  - text: Jestli Polákům rusové vadí [...], tak to přece nemusí kupovat. A nám, když nevadí, tak to kupovat
      můžeme. [...] Jediné, co je potřeba, je nebýt v Evropské unii.
  podtema: Energetika a Rusko
- id: vrabel-2026-06-27-02
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: Německý solární boom (1000 GW) promění ČR z vývozce na dovozce elektřiny — Vrabel (27. 6. 2026)
  text: 'Vrabel upozorňuje na plán Německa vybudovat až 1000 gigawattů solárních kapacit, což podle něj
    zásadně změní evropskou energetickou soustavu: ČR, která byla ještě v roce 2022 čistým vývozcem elektřiny
    v Evropě, se stane čistým dovozcem a bude draze nakupovat elektřinu z Německa vyrobenou ze slunce.
    Odpovědnost klade na Fialovu i Babišovu vládu (a jmenovitě na Petra Macinku, který byl 8. května na
    oslavě konce 2. světové války v Německu) za to, že ČR neinvestovala včas do vlastní energetické soběstačnosti
    a nechala „odevzdat" tento zdroj příjmů Německu. Zmiňuje také, že Německo plánuje ukončit spalování
    uhlí až v roce 2038 (hnědé uhlí o 8 let dříve), zatímco ČR se od uhlí odklání rychleji, přestože ho
    stále částečně dováží z Austrálie.'
  podtema: Energetika a Rusko
- id: vrabel-2026-06-27-03
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Dánsko/EU omezují dočasnou ochranu ukrajinským mužům, aby zabránily útěku před mobilizací —
    „čistý fašismus" (Vrabel, 27. 6. 2026)
  text: 'Dánská vláda mění pravidla dočasné ochrany tak, aby ji nešlo využívat k vyhýbání se ukrajinské
    mobilizaci (odůvodnění ministra pro imigraci Mortena Bødskova: „podkopává to ukrajinské válečné úsilí")
    — Vrabel upozorňuje, že ke stejnému kroku se chystá Evropská komise a Norsko to už zavedlo. Označuje
    to za „čistý fašismus": podle Ženevské konvence má člověk prchající před válkou nárok na ochranu v
    první bezpečné zemi bez ohledu na to, zda je vojenského věku — cílem omezení je poslat tyto muže zpátky
    na frontu, protože je Zelenskyj potřebuje do armády. Připojuje svou „karmickou" tezi, že politici
    prosazující takové kroky museli být v minulém životě v SS nebo jiné nacistické struktuře, protože
    nepochopili mezinárodní konvence o právu na útěk před válkou.'
  citace:
  - text: Za mě tohle je čistý fašismus. Tohle je čistý fašismus.
  podtema: Stav Ukrajiny a mobilizace
