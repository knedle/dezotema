  nadpis: Pavel by neměl na summit NATO — lídr opozice hrající proti vládě (Rajchl, 9. 6. 2026)
  text: 'V TV debatě Rajchl odmítá, aby prezident Petr Pavel jel na summit NATO (Ankara). Argumentuje,
    že neformální část jednání (kde se „dělají domluvy") je důležitější než formální a Pavel nemůže „připravit
    půdu", když Trumpa nazval „odpudivou lidskou bytostí" a své zahraniční cesty využívá ke kritice obranné
    politiky Babišovy vlády. Hlavní problém: Pavel je „lídr opozice", hraje proti vládě, zatímco ČR musí
    na summitu „mluvit jednou řečí" a být jednotná. Navazuje na [Summit NATO/OSN jako „divide et impera"
    (Vrabel, 8. 6.)](/temata/petr-pavel.md#vrabel-2026-06-08-06).'
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
