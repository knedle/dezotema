  nadpis: Odsouzení za „zaškrtnutí okýnka" jako politická perzekuce (Vrabel, 4. 6. 2026)
  text: |-
    Okresní soud v Českých Budějovicích odsoudil Vrabela za dotační podvod k 18měsíční podmínce (odklad 30 měsíců) a zákazu vést firmy na 2,5 roku. Vrabel hodnotí mediální popis (inkasování milionů „skrze fingovanou neexistující restauraci") za lež. Jeho verze: jako jednatel restaurací zavřených covidovými (později soudně zrušenými) opatřeními žádal stát o odškodnění; ve formuláři musel zaškrtnout „bezdlužnost vůči státu", ač firmy kvůli zavření neměly na odvody sociálního/zdravotního pojištění — za to byl po pěti letech odsouzen. Z více než 20 trestních řízení vedených proti němu od roku 2022 prý skončila všechna kromě tohoto jednoho; tvrdí, že jde o snahu umlčet politickou opozici a komentátora. Vinu klade na Babišovu vládu, která podniky zavřela (a poté na „covidovém semináři" přiznala chyby), ale neodškodnila je. Chystá se žalovat média a očišťovat jméno.

    K odsouzení se vrátil i **21. 6. 2026**: peníze označuje za „náhradu škody", ne dotace (stát firmy zavřel a měl povinnost nahradit škodu), jediné pochybení bylo zaškrtnutí kolonky o bezdlužnosti; k soudu se kvůli nákladům nebránil a „přijal podmínku".

    Dvojí metr rozvádí **2. 7. 2026** srovnáním se zprávou, že čeští občané (investor Jan Weverka, herec Ondřej Vetchý a bezpečnostní expert Milan Mikulecký), kteří v rámci sbírky „Drony Nemesis" bez povolení převáželi vojenské drony na Ukrajinu, byli po více než roce vyšetřování vojenskou policií zproštěni podezření ze spáchání trestného činu (možný jen kázeňský postih od armády). Vrabel poukazuje na nesoulad: vývoz zbraní bez povolení do válčící cizí země je „naprostá pohoda", zatímco jeho vlastní chybné zaškrtnutí kolonky o bezdlužnosti na žádosti o odškodnění vedlo k trestnímu odsouzení.
  citace:
  - text: Není to Vrabel, kdo krade. [...] Jsou to ty lidi, kteří rozkrádají ty miliardy ze státních rozpočtů.
  - text: Naopak za trestný čin byl odsouzený Ladislav Vrabel za to, že [...] zaškrtl kolonku, že ty firmy
      jsou bezdlužné vůči státu. [...] Ale vyvážet zbraně bez povolení do cizí země [...] to je v České
      republice naprostá pohoda.
