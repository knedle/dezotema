  nadpis: Rusko dosáhlo ekonomické suverenity vs. předlužený Západ (Vrabel, 4. 6. 2026)
  text: 'Vrabel komentuje prohlášení ruského ministra financí (Siluanova) z fóra v Petrohradu, že Rusko
    navzdory sankcím dosáhlo finanční a ekonomické suverenity — reálné příjmy obyvatel vzrostly za tři
    roky o více než 24 %, země brzy splatí zahraniční dluh a opírá se o vlastní zdroje. Vrabel to hodnotí
    jako vzor, jak by měl fungovat každý stát (vyrovnaný rozpočet), a staví to do kontrastu se Západem:
    USA mají ~38 bilionů dolarů „nesplatitelného" dluhu (na úrocích platí víc, než kolik vyčlení na splátky),
    většina západních ekonomik má dluh přes 100 % HDP. Systém se dle něj uměle udržuje „válkami a novodobým
    kolonialismem" — USA využívají EU a další státy k odčerpávání jejich bohatství. ČR podle něj žádnou
    takovou stabilitu nemá (Babiš plánuje 300 mld. dluh za rok, 40 % domácností nevyjde s příjmy), protože
    „se krade jako kdyby nebylo zítra". Připomíná, že Rusko podle jeho zdroje (ruský diplomat) v roce
    2022 přežilo jen díky Indii a Číně.'
  osoby:
  - osoba: anton-siluanov
    vztah: neutralni
    kontext: Ruský ministr financí — na fóru v Petrohradu prohlásil dosažení ekonomické suverenity (+24
      % reálné příjmy za 3 roky); Vrabel cituje jako vzor
  podtema: Ekonomika, sankce a BRICS
- id: vrabel-2026-06-04-02
  typ: tvrzeni
