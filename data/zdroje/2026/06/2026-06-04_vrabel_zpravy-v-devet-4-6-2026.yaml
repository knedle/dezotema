  nadpis: Babiš a rozprodej ČEZ — „rozkradená republika" (Vrabel, 4. 6. 2026)
  text: 'K záměru Andreje Babiše oddělit a prodat distribuci ČEZ Vrabel rozvíjí tezi o systémovém rozkrádání
    ČR. Kupónovou privatizaci označuje za nástroj, jímž státní majetek skončil v rukou elit a zahraničních
    firem (ne občanů). U ČEZ popisuje konkrétní praktiky: páteřní síť na jižní Moravě/Čechách (vlastněná
    německým provozovatelem) vede elektřinu z Německa do Rakouska „za naše peníze" a umožňuje při přetížení
    odpojit ČR místo Německa/Rakouska; regulátory/přepínače (Siemens, Bosch) se nakupují bez výběrových
    řízení; nový „bateriový" zákon (listopad) umožňuje vybraným lidem vydělávat na ukládání/dodávkách
    elektřiny (analogie se solárními barony). ČEZ podle něj dozoruje syn Václava Klause, zaměstnanci jezdí
    Porsche/Ferrari a odcházejí se „zlatými padáky" v desítkách milionů. Babiše označuje za jednoho z
    mála, kdo na rozprodeji republiky zbohatl (7. nejbohatší Čech, „550 milionů kapesného od otce do začátku").'
  citace:
  - text: Prakticky celá Česká republika je roz-kra-de-ná.
  osoby:
  - osoba: andrej-babis
    vztah: negativni
    kontext: Chce oddělit a prodat distribuci ČEZ („rozkradená republika"); navrhuje Merze jako vyjednavače
      za EU; za ČR v Evropské radě schválil odblokování přístupových rozhovorů s Ukrajinou; vinu za Vrabelovo
      odsouzení nese jeho covidová opatření
  podtema: Kauza Ladislav Vrabel — dotační podvod
