vyroky:
- id: vrabel-2026-06-09-01
  typ: tvrzeni
  temata:
  - blizky-vychod
  nadpis: Írán sestřelil americký vrtulník; Trump odmítá roli „mírového prezidenta" (Vrabel, 9. 6. 2026)
  text: Vrabel informuje, že Írán v noci sestřelil americký vrtulník (oba piloti podle Trumpa v pořádku)
    a Trump avizoval nutnost reakce; Trump zároveň prohlásil, že „nikdy neslíbil, že nezahájí žádnou novou
    válku" a vyčítání role „mírového prezidenta" ho rozčiluje. Vrabel z toho usuzuje, že konflikt bude
    „dlouhý a vleklý". Opakuje spekulace (z 8. 6.), že Írán má pravděpodobně 1–3 jaderné bomby a uran
    na 8–12 hlavic, případně s pomocí Číny a Ruska — což může vysvětlovat Trumpovo ostražitější chování.
    Navazuje na [Írán pravděpodobně už má jaderné zbraně (8. 6.)](#írán-pravděpodobně-už-má-jaderné-zbraně--možný-důvod-zvratu-usa-k-příměří-vrabel-8-6-2026).
  podtema: Hormuz — aktualizace 6. 5. 2026
- id: vrabel-2026-06-09-02
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Finsko schválilo dovoz jaderných zbraní — obkličování Ruska (Vrabel, 9. 6. 2026)
  text: Výbor finského parlamentu pro obranu schválil návrh zákona umožňující dovoz a skladování jaderných
    zbraní na finském území (od spojenců z NATO v rámci kolektivní obrany). Vrabel připomíná 1340 km dlouhou
    finsko-ruskou hranici a čte to jako další krok „obkličování" Ruska jadernými zbraněmi (vedle ČR a
    Polska) — scénář, před nímž podle svých slov varuje od roku 2022. Ironicky upozorňuje, že bezpečnostní
    výbor českého parlamentu vede Jana Černochová (ODS). Kreml plán označil za „koncentrovanou konfrontaci".
  osoby:
  - osoba: jana-cernochova
    vztah: negativni
    kontext: 'Předsedkyně bezpečnostního výboru PS (ODS) — Vrabel ironicky: „skvělá vlastenecká vláda"
      ji má v čele výboru ve stejné době, kdy Finsko schvaluje jaderné zbraně'
- id: vrabel-2026-06-09-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Francouzský jaderný arzenál +80 hlavic — nové kolo zbrojení (Vrabel, 9. 6. 2026)
  text: Podle zprávy SIPRI Francie mezi roky 2025 a 2026 zvýšila svůj jaderný arzenál zhruba o 80 hlavic
    na přibližně 730 a hlavní mocnosti modernizují arzenály. Vrabel to čte jako nové kolo jaderných závodů,
    před nímž varuje od roku 2022; jedinou cestou k trvalému míru jsou podle něj odzbrojovací smlouvy.
    Navazuje na [Jaderné odzbrojení jako jediná cesta k míru (6. 6.)](#jaderné-odzbrojení-jako-jediná-cesta-k-míru--výzva-vrabel-6-6-2026).
- id: vrabel-2026-06-09-04
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Právo veta jako pilíř suverenity — jeho zrušení = konec ČR (Vrabel, 9. 6. 2026)
  text: 'Vrabel vysvětluje právo veta jako základní nástroj suverenity: kterýkoli z 27 členských států
    může zablokovat rozhodnutí poškozující jeho zájmy (jako příklad uvádí, že Babiš mohl vetovat půjčku
    90 mld. EUR pro Ukrajinu). Jeho zrušení (přechod na rozhodování kvalifikovanou většinou) by podle
    Vrabela znamenalo konec ČR jako suverénního státu — malá země by neměla prakticky žádný hlas a EU
    by jí mohla nařídit cokoli (migrační pakt, „fašistický model prokuratury", i přejmenování země). Lidi
    prosazující zrušení veta označuje buď za skorumpované globalistickými strukturami, nebo (s odkazem
    na Martina Konvičku) za „sexuálně frustrované" se submisivně-masochistickými sklony.'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-06-09-05
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Zelenskyj: peníze z prodeje Chelsea a „humanitární pomoc" na zbraně (Vrabel, 9. 6. 2026)'
  text: Vrabel komentuje výzvu Zelenského v Londýně, aby ~2,4 mld. liber z prodeje fotbalového klubu Chelsea
    (Abramovič) — vyčleněných na humanitární pomoc — bylo použito na ukrajinskou protivzdušnou obranu
    a protiraketové systémy. Označuje to za starý vzorec „humanitární pomoci na zbraně" / „humanitárního
    bombardování" (paralela s Václavem Havlem).
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-09-06
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Pět podmínek míru (Zelenskyj, Starmer, Merz, Macron) jako pohřbení jednání (Vrabel, 9. 6. 2026)
  text: 'Vrabel rozebírá pět „nepřekročitelných" podmínek míru deklarovaných čtveřicí lídrů: (1) okamžité
    úplné příměří jako předpoklad jednání, (2) jednání na současné linii dotyku, (3) právně závazné bezpečnostní
    záruky včetně nasazení multinárodních sil na Ukrajině, (4) plná suverenita Ukrajiny včetně práva vstoupit
    do EU a NATO, (5) zmrazená ruská aktiva blokována do zaplacení reparací + souhlas EU/NATO. Tvrdí,
    že už první podmínka (příměří jako první krok) jednání pohřbívá — Rusko ji odmítá, poučeno z minských
    dohod (které dle Merkelové sloužily k dozbrojení Ukrajiny); příměří by jen umožnilo Ukrajinu dozbrojit
    a doplnit o vojáky. Navazuje na [Mírové podmínky EU/Ukrajiny jako recyklace (8. 6.)](#mírové-podmínky-euukrajiny-uk-francie-německo-jen-recyklace--rusko-odmítá-příměří-jako-první-krok-vrabel-8-6-2026).'
  podtema: Vyjednávání a mír
- id: vrabel-2026-06-09-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'Boj o vyjednavače EU–Rusko: Schröder, lídři vs. struktury EU (Vrabel, 9. 6. 2026)'
  text: 'Putin navrhl jako možného vyjednavače za Evropu Gerharda Schrödera (dobré vztahy, stavitel Nord
    Streamu); Kaja Kallas i von der Leyen to odmítly s tím, že nereprezentuje struktury EU. Vrabel popisuje
    mocenský boj: Evropská komise (von der Leyen, Kallas) chce vyjednávat za Evropu, ale za Evropu chtějí
    i Merz, Macron a Starmer (formát E3, mimo unijní struktury); Polsko (Tusk) a Itálie (Meloni) trvají,
    že dohody uzavřené bez nich nebudou závazné. EU navíc deklarovala, že nebude „mediátorem" (v tom výjimečně
    souhlasí s Putinem) — protože není nestranná a bude hájit zájmy Ukrajiny.'
  osoby:
  - osoba: gerhard-schroder
    vztah: pozitivni
    kontext: Putin ho navrhl jako vyjednavače EU–Rusko (dobré vztahy, stavitel Nord Streamu); Kallas i
      von der Leyen odmítly
  podtema: Vyjednávání a mír
- id: vrabel-2026-06-09-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: 'USA v RB OSN: „příměří první"; USA jako strůjce konfliktu (Vrabel, 9. 6. 2026)'
  text: USA (Dan Negro v Radě bezpečnosti OSN, s odkazem na Marka Rubia) vyzvaly k okamžitému příměří
    na Ukrajině a odsoudily ruské útoky na civilisty. Vrabel to čte jako nástup USA na linii „příměří
    jako první krok" (společně s Británií, Francií, Německem a Ukrajinou). Tvrdí, že to byly USA, kdo
    konflikt rozehrál (Majdan 2013, výcvik a zbrojení Ukrajiny už za Trumpova prvního období), že USA
    nejsou suverénní zemí (mají „loutkové vlády" financované sionistickými bankovními kruhy, Chabad Lubavič)
    a že stažení USA je jen strategický manévr s cílem dozbrojit Ukrajinu.
  podtema: Vyjednávání a mír
- id: vrabel-2026-06-09-09
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: EU nový balík sankcí proti Rusku — „odtud není cesta zpět" (Vrabel, 9. 6. 2026)
  text: K novému sankčnímu balíku Ursuly von der Leyen (90 ruských bank, transakční zákaz pro 35 z nich,
    zákaz kryptoměn, sankce na stínovou flotilu, zákaz vstupu ruských vojáků do EU, 170 dalších osob a
    subjektů) Vrabel tvrdí, že projev byl tak tvrdý, že jde o „konečnou" — EU si už nehraje na to, že
    by někdy chtěla mít s Ruskem obchodní či politické vztahy; cílem je podle něj „zničit Rusko ze všech
    stran". Balík čte jako absolutní odtržení Západu od Ruska.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-09-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Čína a Severní Korea prohlubují spolupráci — multipolární blok (Vrabel, 9. 6. 2026)
  text: K návštěvě Si Ťin-pchinga v Pchjongjangu (rozšíření spolupráce s Kim Čong-unem v politice, ekonomice,
    kultuře i obraně) Vrabel konstatuje, že vzniká silný blok Čína–Rusko–Severní Korea–Írán proti USA
    a EU. Bezpečnostní architektura z doby před čtyřmi lety je podle něj pryč; svět se dělí na BRICS a
    jejich strategické partnery vs. USA, EU a jejich partnery — naplnění Putinovy teze o konci unipolárního
    světa. Navazuje na [BRICS vs unipolární svět](konspirace.md#brics-vs-unipolární-svět-konflikt-o-dolar-a-globalistickou-chazarskou-nadvládu-vrabel-8-6-2026).
  podtema: Eskalace a hrozba rozšíření konfliktu
- id: vrabel-2026-06-09-11
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: Bulharsko ukončí vojenskou pomoc Ukrajině (Radev) — Vrabel skeptický (Vrabel, 9. 6. 2026)
  text: 'Nová bulharská vláda (prezident Rumen Radev, ministr obrany Stojanov) prohlásila, že ukončí vojenskou
    pomoc Ukrajině — konflikt prý nelze vyřešit vojensky a ukrajinská porážka je nevyhnutelná. Vrabel
    je skeptický: přirovnává to k „hře" Andreje Babiše (předvolební a povolební gesta). Radev podle něj
    není tvrdohlavý typ a brzy se „otočí", jakmile EU nabídne Bulharsku zbrojní zakázky.'
  osoby:
  - osoba: rumen-radev
    vztah: rozporuplny
    kontext: Nová bulharská vláda ukončí vojenskou pomoc Ukrajině; Vrabel skeptický — „hra jako Babiš",
      brzy se otočí za zbrojní zakázky
  podtema: Zahraniční aktéři a precedenty
