  delka: 01:03:31
  poznamka: 'Hlavní bloky: Pavel indoktrinace dětí (Kunovice) + školství PRO, Zelenský/UPA neonacismus,
    V4 shoda, Pavel/Ankara, Hřib útoky na poslankyně, Rada ČT (Rakušan vs. Matocha/Bradáč), Dozimetr komise
    (systémové selhání), selhání médií (ČT/Seznam), rozsudek SPD + migrace, emisní povolenky („válka"),
    ekonomická strategie PRO. Pozvánka na seminář o větrnících (logistika).'
  osoby:
  - osoba: volodymyr-zelenskyj
    vztah: negativni
    kontext: Pojmenoval jednotku po UPA = „adorace neonacismu" — měl by mu být odebrán řád Bílého lva;
      ČR mlčí, na rozdíl od Polska
vyroky:
- id: rajchl-2026-06-07-01
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Rozsudek nad SPD jako „pravda trestným činem" + obhajoba pojmenování migrace (Rajchl, 7. 6.
    2026)
  text: 'Rajchl znovu (viz [Rozsudek nad SPD = posvěcení cenzury, 3. 6.](/temata/dsa-cenzura.md#rajchl-2026-06-03-01))
    označuje rozsudek nad SPD za skandál: plakát podle něj jen spojuje dva faktické údaje (afričtí migranti
    páchají útoky bodnou/sečnou zbraní mnohonásobně častěji; většina těchto migrantů je černé pleti) —
    to není podněcování nenávisti, ale „pojmenování pravdy". Politickou hyperkorektnost a falšování statistik
    justicí označuje za hlavní příčinu úpadku Evropy. Jako příklady uvádí německého komika, který byl
    ve dne pobodán (5 ran) migrantem, jenž byl týž večer propuštěn jako „nebezpečný" (vražda nebyla dokonána),
    a případ Henryho Novaka (Vikram Digwa, sik). Pokud rozsudek potvrdí vyšší instance, „žijeme v zemi,
    kde je pravda trestným činem". Jako právník otevřeně zpochybňuje, že rozsudek má cokoli společného
    s právem — je podle něj „poplatný politické atmosféře".'
  podtema: Trestání politického projevu
- id: rajchl-2026-06-07-02
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: Dozimetr — vyšetřovací komise míří na „systémové selhání" (Rajchl, 7. 6. 2026)
  text: 'Rajchl vysvětluje cíl parlamentní vyšetřovací komise pro Dozimetr: nejde o to suplovat soud (úloha
    Kose, Dovhomily, Augustína, Rédla), ale odhalit „systémové selhání". To spatřuje v tom, že pět spolupracujících
    obviněných (kteří nesmějí lhát) shodně vypovědělo, že peníze z Dozimetru byly z velké části (jeden
    uvedl 80 %) určeny pro TOP 09 a STAN — a přesto nebylo zahájeno stíhání těchto stran jako právnických
    osob, ačkoli u Martina Dvořáka i Marka Schneidera stačila k obvinění jediná výpověď. Buď tedy obvinění
    lhali (pak mají přijít o status a být stíháni za křivé obvinění), nebo má následovat stíhání STAN/TOP
    09 (možný trest: zrušení strany — jako v případě 3mil. pokuty SPD). Komise může předvolávat aktéry
    i lidi z policie a státního zastupitelství a vyžádat audity a posudky; Rajchl ji rámuje jako nástroj
    k obnově důvěry ve spravedlnost a zmiňuje 5 podezřelých úmrtí. Naznačuje i možné komise pro Bitcoin,
    IKEM a Kampeličku. Navazuje na [STAN jako právnická osoba pod hrozbou zrušení](/temata/kauzy/2026.md#rajchl-2026-05-27-01).'
  podtema: Kauza Ladislav Vrabel — dotační podvod
- id: rajchl-2026-06-07-03
  typ: tvrzeni
  temata:
  - kauzy
  nadpis: 'Rada ČT: dvojí metr Matocha/Bradáč vs. Rakušan — výzva ke složení mandátu (Rajchl, 7. 6. 2026)'
  text: 'Při volbě nových radních ČT poukazuje Rajchl na dvojí metr: radní Matocha a Bradáč byli vyloučeni
    kvůli nahrávce (jejíž pravost popírají jako AI/fake), zatímco z přepisu nahrávky ze schůzky Víta Rakušana
    s vedením STAN jednoznačně plyne, že Rakušan měl informace z živého policejního spisu — a nikdo z
    účastníků (ani Rakušan) autenticitu těch slov nepopřel. Pokud by to byla pravda, šlo by o trestný
    čin zneužití pravomoci (a stejně tak u toho, kdo informace předal). Rajchl proto vyzývá Rakušana,
    aby do vyjasnění složil mandát — stejnou logikou, jakou STAN uplatnil na Matochu a Bradáče. Navazuje
    na [Rakušanův dvojí metr (22. 4.)](/temata/kauzy/2026.md#rajchl-2026-04-22-01).'
  osoby:
  - osoba: vit-rakusan
    vztah: negativni
    kontext: Z přepisu nahrávky plyne, že měl informace z živého policejního spisu (zneužití pravomoci)
      — Rajchl ho vyzývá složit mandát (dvojí metr vůči Matochovi/Bradáčovi)
  podtema: Kauza Ladislav Vrabel — dotační podvod
- id: rajchl-2026-06-07-04
  typ: tvrzeni
  temata:
  - media-propaganda
  nadpis: ČT a Seznam zastavily reportáže o Dozimetru; mediální krytí STAN (Rajchl, 7. 6. 2026)
  text: Rajchl označuje za „selhání médií", že Česká televize (podle vyjádření ředitele ČT2, zprostředkovaného
    portálem Lovný.cz) zastavila reportáž o Dozimetru, kterou připravovala investigativní novinářka „Kopková",
    a že server Seznam nepublikoval hotový materiál Markéty Dobiášové. Kontrastuje to s tím, že ČT (Reportéři
    ČT, dříve 168 hodin) „vyšetřuje každou blbost". Poukazuje na rozsáhlé mediální krytí hnutí STAN a
    na to, že se „od rána do večera" řeší byt poslankyně Mrázové či moštárna Filipa Turka (drobnosti),
    zatímco velké kauzy (Rakušanův předražený nákup vrtulníků odhalený analýzou Tomáše Pauknera, spackaný
    nákup F-35) zůstávají bez pozornosti.
  osoby:
  - osoba: tomas-paukner
    vztah: pozitivni
    kontext: „Vycházející hvězda" investigativní žurnalistiky — analýza předražených vrtulníků nakoupených
      Rakušanem těsně před volbami
  podtema: Nová alternativní média
- id: rajchl-2026-06-07-05
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Pavel a „indoktrinace dětí" ve školách — zákaz politické indoktrinace (Rajchl, 7. 6. 2026)
  text: 'Rajchl ostře kritizuje Petra Pavla za to, že při návštěvě školy v Kunovicích žákům řekl, že Rusko
    povede „hybridní válku" proti ČR a Evropě i po skončení konfliktu na Ukrajině. Označuje to za „nejhorší
    případ politické indoktrinace a vyvolávání strachu mezi dětmi" — politické spory podle něj patří do
    debat, ne do hlav studentů. V návaznosti připomíná tři body programu PRO pro základní školství: (1)
    přísný zákaz politické indoktrinace (vzor Florida), (2) zákaz plošné inkluze (ničí kvalitu vzdělání),
    (3) absolutní zákaz vstupu politických neziskovek (propagace transgenderu, klimatu, strašení Ruskem).
    Pavlovy výroky (euro, zrušení práva veta chránícího malé státy, Spojené státy evropské) označuje za
    snahu zrušit suverenitu ČR a za důvod, proč ho v roce 2028 nemít na Hradě.'
  osoby:
  - osoba: petr-pavel
    vztah: negativni
    kontext: „Indoktrinace dětí" ve škole v Kunovicích (hybridní válka s Ruskem i po Ukrajině); tlak na
      cestu do Ankary = „umanutost" bez přínosu pro ČR
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-06-07-06
  typ: tvrzeni
  temata:
  - petr-pavel
  nadpis: Cesta Pavla do Ankary jako „umanutost" bez přínosu pro ČR (Rajchl, 7. 6. 2026)
  text: Rajchl označuje tlak Petra Pavla na účast na summitu NATO v Ankaře za „utrucovitost/umanutost"
    bez jediného přínosu pro ČR — cokoli by tam vyjednal, zvládne i premiér Babiš. Téma slíbil rozvést
    v pořadu K věci na CNN Prima News.
  podtema: Prezident Petr Pavel — hodnocení Jiřím Černohorským
- id: rajchl-2026-06-07-07
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Hřibovy útoky na poslankyně a dvojí metr Pirátů vůči „mladým" (Rajchl, 7. 6. 2026)
  text: 'Rajchl kritizuje Zdeňka Hřiba (Piráti) za osobní útoky na poslankyně (Mrázová, Válková — zopakoval
    „lež" o spolupráci Válkové s Urválkem), kterým prý celý pirátský klub zatleskal — což je v rozporu
    s jejich stížnostmi, jak jsou konzervativci „zlí na ženy". Druhý dvojí metr: Piráti útočí na mladé
    politiky Motoristů (Adam Scheina, František Kubásek na MŽP) kvůli věku a chybějící maturitě, ač jde
    o schopné influencery, kteří si sami vybudovali silnou základnu — zatímco když kritiku mladých vznese
    Rajchl, spustí se „ohňostroj".'
  osoby:
  - osoba: zdenek-hrib
    vztah: negativni
    kontext: Osobní útoky na poslankyně (Mrázová, Válková) — pirátský klub jim tleskal; příklad dvojího
      metru Pirátů (kritika „útoků na ženy a mladé")
  podtema: Ekonomický program PRO
- id: rajchl-2026-06-07-08
  typ: tvrzeni
  temata:
  - politicky-system
  nadpis: Protekcionistická ekonomická strategie PRO — přednost českým firmám (Rajchl, 7. 6. 2026)
  text: 'Rajchl shrnuje směr PRO (rozvíjí [program PRO, 3. 5.](/temata/politicky-system/2026.md#rajchl-2026-05-03-04)):
    bez Green Dealu, emisních povolenek, migračního paktu a aktivní migrace z Ukrajiny; rovná daň 15 %,
    stabilní legislativa a otevřený protekcionismus — přednost českých firem u všech veřejných zakázek.
    Argument: ze zakázky dané české firmě se ~45 % vrátí do státního rozpočtu (daně, odvody), u zahraniční
    firmy „peníze už nikdy neuvidíte". Současný stav označuje za „koloniální systém z Bruselu": rovné
    ceny (bydlení, elektřina nejdražší), ale třetinové platy a nejhorší kvalita potravin — to není rovnostářství.'
  citace:
  - text: Cokoliv dáte české firmě [...] zhruba 45 % se vám vrátí do státního rozpočtu. Když to dáte zahraniční
      firmě, už ty peníze nikdy neuvidíte.
  podtema: Ekonomický program PRO
- id: rajchl-2026-06-07-09
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: Emisní povolenky jako spekulativní derivátový trh; Němci „v kleštích" — válka povolenkám (Rajchl,
    7. 6. 2026)
  text: 'Rajchl rozšiřuje svou kritiku emisních povolenek (viz [Emisní povolenky: ČR platí 17× víc (4.
    6.)](/temata/suverenita-eu/2026.md#rajchl-2026-06-04-02)) o mechanismus: vedle primárního trhu existuje
    sekundární trh s deriváty (futures, forwardy) až 200× větší, kde spekulativní kapitál vydělává. Německé
    banky, investiční a penzijní fondy mají velkou část portfolia v povolenkách — při zrušení systému
    by musely tvořit opravné položky a fakticky zbankrotovaly (analogie/horší než krize 2008), proto jsou
    „v kleštích" a nemohou odstoupit; ČR ale ještě může. Vyhlašuje povolenkám „nesmlouvavou válku": zrušení
    ETS1 i ETS2 je „cíl číslo jedna" PRO, a to i za cenu vystoupení z EU (pokuta by vyšla levněji než
    platit povolenky). Odmítá kompromis („zlodějina je zlodějina, nechci z velké zlodějiny dělat menší");
    kdo tvrdí, že povolenky jsou pro ČR pozitivní, je „lhář, nebo kolaborant".'
  citace:
  - text: Já vyhlašuji emisním povolenkám nesmlouvavou válku [...] zrušení emisních povolenek bude cíl
      číslo jedna, ze kterého já neuhnu ani o centimetr.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: rajchl-2026-06-07-10
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'V4: proč se Poláci a Maďaři shodnou na národních zájmech a ČR ne (Rajchl, 7. 6. 2026)'
  text: Rajchl klade za hlavní příčinu ekonomického zaostávání ČR neschopnost domácí politické scény shodnout
    se napříč spektrem na základních národních zájmech — na rozdíl od Polska a Maďarska. V Polsku se Tusk
    (euroliberál) i Nawrocki (národní konzervativec), kteří se navzájem nesnášejí, shodnou na odmítnutí
    Green Dealu, emisních povolenek a migrace i na odmítnutí adorace UPA. Nawrocki navíc slibuje referendum
    o Green Dealu. V ČR podle Rajchla naopak řada stran „podkopává českou suverenitu". Tuto shodu napříč
    spektrem označuje za to, co Polákům a Maďarům umožňuje hájit národní zájmy.
  osoby:
  - osoba: karol-nawrocki
    vztah: pozitivni
    kontext: 'Polský prezident — vzor: referendum o Green Dealu, ne migraci, návrh odebrat Zelenskému
      řád Bílé orlice; shoda napříč polským spektrem na národních zájmech'
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
