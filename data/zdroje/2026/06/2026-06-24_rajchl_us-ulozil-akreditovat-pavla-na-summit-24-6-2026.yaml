  poznamka: 'Ústavní soud (předběžné opatření) uložil vládě Andreje Babiše povinnost akreditovat prezidenta
    Petra Pavla na summit NATO v Ankaře. Rajchl to označuje za „zcela skandální", ÚS dle něj „vybočil
    ze svého rámce" a rozhodnutí posouvá ČR z parlamentní do prezidentské republiky = „otevření Pandořiny
    skříňky"; rychlost i odůvodnění označuje za „nevalidní". Předsedu ÚS **Josefa Baxu** označuje za podjatého
    — v roce 2019 se zúčastnil demonstrace spolku Milion chvilek proti vládě Babiše a podepsal výzvu „chvilka
    pro rezignaci" k demisi Babišovy vlády. Cituje i Zemana (ÚS „podjatý") a Macinku („ústavní puč").
    (Završuje ságu Pavel vs. summit — potvrzuje Vrabelův odhad, že Pavel u ÚS uspěje.) Bez predikcí a
    stoch. teroru. Zhlédnutí: 51 341 | Promo na pořad 360° (CNN Prima News) + reakce na rozhodnutí ÚS'
