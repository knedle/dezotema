  poznamka: 'Hlavní bloky: falešní mesiáši dosazení globalisty (Magyar protest, Trump/Merz/Babiš), Polsko
    vs. UPA, Putin v Petrohradu, ukrajinské útoky hluboko + blízký konec SVO, Ukrajinci nechtějí bojovat
    (TCK), lodě Azov/Černé moře, Arménie perzekuce + síť Rothschild–Trump, Braun v EP + hrozba zákazu
    AFD, vystoupení z EU jako záchrana, Starmer 2030 + zbrojení jako byznys, jaderné odzbrojení (výzva).
    Závěr: meta o pořadu + osobní (logistika, nezpracováno). Zprávy v devět s komentářem (moderátorka
    Zuzka)'
