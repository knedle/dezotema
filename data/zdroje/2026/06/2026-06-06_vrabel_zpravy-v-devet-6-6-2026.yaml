- id: vrabel-2026-06-06-01
  typ: tvrzeni
  temata:
  - ceny-energie
  nadpis: 'Putin v Petrohradu: „ekonomika znásilněna politikou", Evropa nejkritizovanější (Vrabel, 6.
    6. 2026)'
  text: 'Vrabel po opětovném poslechu Putinova projevu z fóra v Petrohradu shrnuje jeho hlavní poselství:
    evropská ekonomika byla „znásilněna" — stala se z ní politický nástroj (sankce, cla, vydírání), a
    proto nefunguje. Jako důkaz uvádí zavírání německých podniků a stěhování chemičky BASF do Číny. Evropu
    označuje (z pohledu světa) za „nejkritizovanější místo na světě" — víc než USA (kvůli Íránu) i Izrael.
    Kontrastuje to s pohledem, kde ekonomika = byznys a čísla, a politika slouží dobrým vztahům mezi zeměmi.
    Rozšiřuje záznam z [BRICS předčil G7](#brics-předčil-g7-putin-varuje-před-usdt-a-digitálním-eurem-vrabel-5-6-2026).'
  podtema: Ekonomika, sankce a BRICS
- id: vrabel-2026-06-06-02
  typ: tvrzeni
  temata:
  - dsa-cenzura
  nadpis: Braunovi vypnut mikrofon v EP; hrozba zákazu AfD jako potlačení demokracie (Vrabel, 6. 6. 2026)
  text: 'Vrabel ukazuje záznam, jak byl polskému europoslanci Grzegorzi Braunovi v Evropském parlamentu
    vypnut mikrofon poté, co řekl „přestaňte předstírat, že pomáháte Ukrajině, obětujete krev Ukrajinců"
    — s odůvodněním, že „taková pozice hraje do rukou Ruska". Vrabel to ironicky komentuje jako „demokracii"
    a Brauna označuje za obdivovaného „kolegu" (zmiňuje jeho kontroverzní činy: hašení židovské chanukové
    menory hasicím přístrojem v polském parlamentu, trhání a pálení vlajek EU). Spojuje to s úsilím zakázat
    v Německu a EP stranu AfD — podle průzkumů nejsilnější v zemi: zrušit „ve jménu demokracie" nejsilnější
    zvolenou stranu označuje za vnitřně rozporné a za stejný mechanismus, jakým jsou v ČR likvidovány
    menší strany (vč. jeho hnutí ČR na prvním místě).'
  podtema: Trestání politického projevu
- id: vrabel-2026-06-06-03
  typ: tvrzeni
  temata:
  - jaderne-zbrane
  nadpis: Jaderné odzbrojení jako jediná cesta k míru — výzva (Vrabel, 6. 6. 2026)
  text: 'V „zprávě dne" Vrabel rozvíjí argument (navazuje na Scotta Rittera, viz [Scott Ritter: jadernou
    válku nelze vyhrát (5. 6.)](#scott-ritter-jadernou-válku-nelze-vyhrát--návrat-k-odzbrojení-a-diplomacii-vrabel-5-6-2026)):
    protože jadernou válku nelze vyhrát (po prvních ~20 hlavicích jsou velmoci zničeny), nemá smysl jaderné
    zbrojení ani „odstrašení" — výroky generála Pavla a Babiše o nutnosti jaderných zbraní „kvůli odstrašení"
    označuje za nelogické. Jedinou cestou k trvalému míru jsou podle něj mnohostranné závazné smlouvy
    o odzbrojení (přes OSN, navázání na START a logiku Reykjavíku z 80. let): zbraně nejprve do hangárů,
    satelitní kontrola, zapečetění, závazek nepoužití a nakonec likvidace. Vyzývá diváky, aby tuto myšlenku
    šířili a tlačili na parlament.'
- id: vrabel-2026-06-06-04
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: Globalisté dosazují „falešné mesiáše" napříč Západem — Magyar, Trump, Merz, Babiš (Vrabel, 6.
    6. 2026)
  text: 'K protestům tisíců Maďarů proti premiéru Péteru Magyarovi (který „zradil" slib ochrany hranic
    a zrušil veto) Vrabel řadí Magyara do vzorce, který popisuje od roku 2020: globalistické elity v každé
    západní zemi po covidu/válce dosadí „falešného mesiáše" — politika, jenž se tváří jako bojovník za
    suverenitu a svobodu, ale po zvolení slouží elitám. Příklady: Trump (od něhož se odvrací i Tucker
    Carlson a Alex Jones), Merz (BlackRock, zrušil dluhovou brzdu), Babiš (nesplněné sliby: muniční iniciativa,
    F-35, 90 mld. pro Ukrajinu, jaderné zbraně), bulharský Radev, rumunský Georgescu (zakázán soudem).
    Klíčová teze: svět není rozdělen horizontálně (Rusko vs. Západ), ale vertikálně — „elity proti obyčejným
    lidem"; volíme ty, koho nám elity dosadí přes média a sponzory. Navazuje na [Trump jako mesijáš globalistů](#trump-jako-mesijáš-globalistů-předpověď-z-let-20202021--vrabel-5-5-2026).'
- id: vrabel-2026-06-06-05
  typ: tvrzeni
  temata:
  - konspirace-deep-state-qanon
  nadpis: 'Arménie: trestní stíhání opozice a síť Rothschild–Trump–Kushner (Vrabel, 6. 6. 2026)'
  text: 'Před parlamentními volbami v Arménii (7. 6.) Vrabel tvrdí, že je trestně stíháno šest politiků
    strany „Silná Arménie", která se nelíbí globalistům — paralela s předvolební vlnou stíhání v ČR (Babiš,
    Okamura, Vrabel) a v Německu (domovní prohlídky u Petra Bystroně, AfD). Popisuje „mafiánskou strukturu
    řízenou shora" rodinou Rothschildů (banky, média, finanční toky), příbuzensky propojenou s Trumpy
    (Kushnerova sestra je provdána za Neda Rothschilda) — proto spolu „objevili" albánský ostrov. Do politických
    funkcí se podle něj člověk dostane jen přes „mediální a trestní síto" (a sociální sítě, kde nepohodlní
    dostávají shadowban). Cíl v Arménii: odříznout zemi od ruského vlivu a zřídit americké vojenské základny
    pro budoucí útok na Rusko. Predikuje, že globalisté „svého člověka" dosadí (jako u Orbána/Magyara).
    Navazuje na [Arménie 50 mil. eur](valka-nato-rusko.md#arménie-50-mil-eur-a-polská-žádost-o-americkou-základnu--obkličování-ruska-vrabel-4-6-2026).'
- id: vrabel-2026-06-06-06
  typ: tvrzeni
  temata:
  - migrace
  nadpis: Vystoupení z EU jako „sobecká, ale jediná záchrana"; vstup Ukrajiny = volný pohyb milionů Ukrajinců
    (Vrabel, 6. 6. 2026)
  text: 'Vrabel popisuje svůj osobní obrat (kolem roku 2021): ač se cítil být Evropanem a měl blízké na
    Západě, dospěl k závěru, že ČR musí vystoupit z EU, zavřít hranice a uchovat si suverenitu a kulturu
    — i za cenu, že „nechá ostatní západní země padnout" (EU podle něj padne kvůli islámské migraci a
    „liberálnímu progresivismu"). Vystoupení označuje za „sobecké, ale záchranu". K hrozbě vstupu Ukrajiny
    do EU dodává: znamenal by nejen volný pohyb (nekvalitního) zboží a služeb, ale i volný pohyb osob
    — odhaduje ~2 miliony Ukrajinců v ČR; po skončení války a otevření hranic by váleční veteráni „frnk
    na západ" a uplatňovali by vůči Čechům morální i finanční nároky za to, že „za ně bojovali". Navazuje
    na [migrační pakt — jediná cesta vystoupit z EU (4. 6.)](#migrační-pakt-nelze-zrušit-zevnitř--čl-10-ústavy-srovnání-s-brexitem-vrabel-4-6-2026).'
- id: vrabel-2026-06-06-07
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajinské údery hluboko do Ruska, blízký konec SVO a útoky na lodě (Vrabel, 6. 6. 2026)
  text: 'Vrabel referuje o ukrajinských dronových úderech hluboko do Ruska (Kronštadt, Leningradská oblast
    ~1000 km, ropné sklady), které „se rusům nepodařilo zastavit". Zároveň cituje Putina: Luhanská republika
    je téměř celá a Doněcká z ~75 % pod kontrolou ruské armády, takže speciální vojenská operace „může
    brzy skončit" (následovala by denacifikace a demilitarizace, případně ze vzduchu). Útoky na ropná
    zařízení (zásobující zbraně) Vrabel z hlediska napadeného státu „až tak neodsuzuje", ale opakované
    útoky na civilisty (21 studentek) označuje za neospravedlnitelný „terorismus", jímž se Ukrajina snaží
    vyprovokovat Rusko. K útoku na lodě v Azovském moři doplňuje 5 mrtvých (vč. ruského občana) a potopení
    turecké rybářské lodi Duru 67 u Krymu; Turecko navrhuje bezpečnostní dohodu pro Černé moře. Navazuje
    na [ukrajinské útoky jako válečné zločiny (5. 6.)](#ukrajinské-útoky-na-záporožskou-je-lodě-v-azovu-a-dron-v-konstanci-jako-válečné-zločiny-vrabel-5-6-2026).'
  podtema: Průběh války, útoky a „terorismus"
- id: vrabel-2026-06-06-08
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Polsko žádá Ukrajinu o přejmenování jednotky po UPA (Vrabel, 6. 6. 2026)
  text: 'Vrabel komentuje výzvu polského ministra obrany, aby Ukrajina přejmenovala vojenskou jednotku
    pojmenovanou po Ukrajinské povstalecké armádě (UPA) — „existují hranice, které nelze překročit". Vrabel
    připomíná volyňské masakry (UPA upalovala polské děti) a brutální analogií (násilník bitý oběti přes
    hlavu) ironizuje polský postoj: Polsko dál Ukrajinu živí, platí a zbrojí, ale „jediné důležité" je
    pro něj změna jména jednotky. Zmiňuje agresivitu v ulicích Varšavy (návštěva 2024) a dřívější ukrajinské
    výhrůžky Polákům (zapalování domů kvůli dávkám).'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-06-09
  typ: tvrzeni
  temata:
  - valka-ukrajina-prubeh
  nadpis: Ukrajinci nechtějí bojovat — TCK „lov lidí" a úplatek 12 000 $ (Vrabel, 6. 6. 2026)
  text: 'Vrabel tvrdí (s odkazem na Putinova čísla o dezercích), že Ukrajinci nechtějí bojovat, a ilustruje
    to lidským příběhem: muže odvezly mobilizační jednotky TCK do výcvikového tábora; rodina ho po třech
    měsících našla a vykoupila písemně za 12 000 dolarů, on okamžitě odletěl do USA — o tři týdny později
    si pro něj TCK přišly domů. Vrabel z toho vyvozuje, že režim drží lidi ve válce násilím.'
  podtema: Stav Ukrajiny a mobilizace
- id: vrabel-2026-06-06-10
  typ: tvrzeni
  temata:
  - valka-nato-rusko
  nadpis: 'Starmer: Rusko napadne NATO 2030; zbrojení jako byznys a politický vliv (Vrabel, 6. 6. 2026)'
  text: 'K výroku Keira Starmera (tajné služby: ruský útok na NATO/Británii možný 2030) a výzvě ke zbrojení
    Vrabel opakuje tezi: kdo prosazuje zbrojení, má z toho buď přímo peníze (kontrakty bez výběrových
    řízení), nebo politický vliv (musí „papouškovat", že Rusko je agresor, aby získal funkci). Jmenuje
    Turka (předvolební sliby o třívrstvé obraně), Macinku (zbrojní kontrakty = „udělat ráno", vyděláno
    do konce života) a Borise Johnsona (přijel za Zelenským se sponzorem, který získal zakázku na zbraně
    za miliardy a sabotoval mír 2022). Zmiňuje ruskou EMP zbraň (mohla by v okruhu 30 km vyřadit veškerou
    elektroniku — analogie s knihou Tma Ondřeje Neffa) a varuje, že při pokračujícím ostřelování Ruska
    může „Orešník" přiletět už 2026/2027, ne až 2030.'
  podtema: Eskalace a hrozba rozšíření konfliktu
