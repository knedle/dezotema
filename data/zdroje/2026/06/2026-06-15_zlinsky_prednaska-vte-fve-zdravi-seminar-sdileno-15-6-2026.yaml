  poznamka: 'Vliv infrazvuku větrníků na zdraví — hlukoměry kalibrované na 1000–4000 Hz infrazvuk nezachytí,
    vlnová délka ~1 km (odstup 500 m směšný); mechanismus: CNS/porucha spánku, rezonance dutin a mozkových
    vln (REM), amygdala → kortizol/chronický stres, piezo1 receptory → cévy/ateroskleróza/fibróza srdce;
