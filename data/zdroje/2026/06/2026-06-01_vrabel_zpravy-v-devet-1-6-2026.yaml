  nadpis: 'Euroclear: Rusko vyhrálo arbitráž o zmrazená aktiva — Vrabel chce platby z platů eurokomisařů
    (1. 6. 2026)'
  text: Finanční depozitář Euroclear se odvolal proti rozhodnutí Moskevského arbitrážního soudu ve sporu
    o aktiva ruské centrální banky (pohledávka ~18,2 bilionu rublů). Vrabel připomíná, že EU čtyři roky
    drží zmrazená ruská aktiva, Ukrajině vyplácí úroky z jejich výnosů a uvažovala i o jejich úplné konfiskaci
    — Kaja Kallas prý tvrdila, že jako právnička si dokáže představit, „jak to udělat právně, aby to mohli
    ukrást." Tlak z USA a ECB tomu zabránil, proto si EU raději půjčila 90 miliard EUR. Rusko podle Vrabela
    podalo žalobu právem a vyhrálo; Euroclear se brání, protože platit nechce.
  citace:
  - text: Podle mě by to měly vzít jim z platu — od Uršuly von der Leyen přes Kaju Kalas až po Andreje
      Babiše, protože ty všichni to odmávali.
  podtema: NATO, zbrojení a militarizace ČR/Evropy
- id: vrabel-2026-06-01-07
  typ: tvrzeni
  temata:
  - nato-zbrojeni-militarizace
  nadpis: Norsko zvažuje vstup do EU — kvůli válce, EU jako vojenská struktura (Vrabel, 1. 6. 2026)
  text: 'Vrabel komentuje úvahy norského ministra zahraničí Espena Barta Eideho o vstupu Norska do EU.
    Norsko označuje za dosud bohatý, ale drahý sociální stát; vstupem do EU prý Norové „poznají, co to
    znamená být chudý". Skutečný důvod je dle Vrabela válka: EU se „salámovou metodou" postupně přeměňuje
    na vojenskou strukturu (Evropská vojenská komise, nové obranné programy) a Norsko se připojuje, aby
    v nadcházejícím konfliktu nebylo samo. Spojuje to s výzvou mluvčí EK Pauly Pinho, aby členské státy
    „uzavřely řady" a vystupovaly „jednotným hlasem" — což Vrabel glosuje: „Jeden velký evropský bratr."'
  podtema: EU jako vojenská struktura
