  poznamka: '„Zprávy v devět s komentářem" (se Zuzkou). Klíčová témata: euro jako ztráta suverenity (ČNB
    ztratí kontrolu úroků, odliv kapitálu) + Bulharsko měsíc po vstupu čelí sankcím EU za deficit; NATO
    5 % HDP — „opozice" (Piráti/STAN) posouvá laťku, aby koalice vypadala umírněně, ČR na prvním místě
    jediná pro vystoupení z NATO; Euroclear odvolání — Rusko vyhrálo arbitráž o zmrazená aktiva (von der
    Leyen/Kallas/Babiš ať platí z platu); Norsko vstupuje do EU kvůli válce (EU jako vojenská struktura,
    „velký evropský bratr"); Trump manipuluje cenou ropy přes výroky o Hormuzu/Íránu; tanker Tagor zadržen
    Francií = státní piráctví; Maďarsko — Magyar hrozí změnou ústavy k odvolání prezidenta Sulyoka; Starobělsk
    útok na kolej (21 studentek, video, Budanovovy výhrůžky) — ČR spoluzodpovědná (Babiš schválil 90 mld
    EUR, 60 % na zbraně).'
