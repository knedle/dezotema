  nadpis: 'NATO 5 % HDP: „opozice" posouvá laťku, aby koalice vypadala umírněně (Vrabel, 1. 6. 2026)'
  text: |-
    Vrabel reaguje na facebookový příspěvek Ivana Bartoše (Piráti), který v Litvě na parlamentním shromáždění NATO spoluschválil deklaraci o směřování k výdajům 5 % HDP na obranu, a kritizuje hnutí ANO za plán držet české výdaje na pouhých 1,76 % HDP. Vrabel z toho vyvozuje mechanismus, jakým je manipulováno veřejné mínění: skutečná opozice (Piráti, STAN) místo aby požadovala méně zbrojení, posouvá laťku na 5 % — tím vládní koaliční 2 % a přeměna ČR na „výrobnu zbraní pro Američany" (Macinka v Kongresu) vypadají umírněně a rozumně.

    Vrabel mapuje celé spektrum: jeho hnutí ČR na prvním místě je jediné pro úplné vystoupení z NATO (které označuje za „teroristickou organizaci" kvůli bombardování Jugoslávie 1999); PRO/SPD/Trikolora/Svobodní chtějí v NATO zůstat a navyšovat na ~2 %; ANO (Babiš, Macinka) drží 2 % a zbrojí; a „opozice" (Piráti/STAN) přidává 5 %. Závěr: česká parlamentní politika je „totalitární" — jediný povolený pohyb je mezi 2 % a 5 %, vystoupení z NATO není na stole. Stejně jako před volbami se voličům předložilo 10 „povolených" stran.
  citace:
  - text: 'Opozice by měla říkat: my nechceme být v NATO, my tam nechceme platit. A u nás je to tak, že
      koalice říká chceme platit 2 % a opozice říká my taky chceme být v NATO, ale chceme platit 5 %.'
  podtema: Ekonomický program PRO
- id: vrabel-2026-06-01-02
  typ: tvrzeni
  temata:
  - suverenita-eu
  nadpis: 'Euro: ČNB ztratí kontrolu nad úroky a kapitál odteče ven — Bulharsko jako varování (Vrabel,
    1. 6. 2026)'
  text: |-
    Vrabel reaguje na výroky Enrica Letty, Petra Pavla a EU, že odmítání eura je „hysterie" a že národní suverenita členských států je bez EU iluze. Vrabel odpovídá dvěma argumenty pro ztrátu suverenity přijetím eura:

    1. **Odliv kapitálu**: dokud existuje koruna, peníze vydělané v ČR (i zahraničními řetězci) se musí v ČR utratit. S eurem je lze vyvézt a utratit kdekoliv — „tímhle způsobem se může odsát další bohatství z České republiky ven", ad absurdum všechno.
    2. **Ztráta měnové politiky**: Česká národní banka dnes suverénně rozhoduje o úrokových sazbách, čímž řídí množství peněz v systému i inflaci. Po vstupu do eurozóny tuto pravomoc převezme Evropská centrální banka.

    Jako konkrétní varování uvádí **Bulharsko**: měsíc po vstupu do eurozóny (1. ledna) už čelí postupu EU při nadměrném schodku — EU mu nařizuje srazit deficit z 3,5 % pod 3 %, zavést závazný strop rozpočtu a hrozí pokutou až 0,05 % HDP každých 6 měsíců. Vrabel: „stráta suverenity minimálně v tomhle je naprosto evidentní." Premiér Radev navíc hodí vinu na předchozí proevropskou vládu, která prý maskovala čísla — stejnou rétoriku („může za to bývalá vláda") Vrabel slyší i v ČR a v Rumunsku. Přijetí eura v ČR považuje za nevyhnutelné, protože voliči v roce 2025 zvolili vládu, která zemi v EU zadržela.
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
