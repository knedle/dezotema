  nadpis: 'Maďarsko: premiér Magyar hrozí změnou ústavy k odvolání prezidenta Sulyoka (Vrabel, 1. 6. 2026)'
  text: Maďarský premiér Péter Magyar oznámil, že zahájí právní řízení k odvolání prezidenta Tamáse Sulyoka
    (jmenovaného předchozí Orbánovou vládou), a hrozí změnou ústavy, pokud Sulyok odmítne rezignovat.
    Sulyok varuje, že by to vyvolalo ústavní krizi. Magyar po dubnových volbách, v nichž porazil Orbána,
    slíbil odvolat osobnosti dosazené Orbánem za 16 let. Vrabel označuje krok za tvrdé „čistky" mířící
    až na hlavu státu a přirovnává Magyara k jednomu (nejmenovanému) českému politikovi, kterého považuje
    za „stejně zkaženého".
  podtema: EU, euro a geopolitika sousedů (Maďarsko, Srbsko)
- id: vrabel-2026-06-01-04
