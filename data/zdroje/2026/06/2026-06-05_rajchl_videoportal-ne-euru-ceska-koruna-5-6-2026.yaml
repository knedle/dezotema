  nadpis: Kategorické ne euru — argumenty pro českou korunu (Rajchl, 5. 6. 2026)
  text: |-
    Rajchl ve shrnujícím videu odmítá euro „kategoricky" — nikoli ze sentimentu, ale kvůli suverenitě a ekonomice. Argumenty: Bulharsko má hned po přijetí eura „obrovský problém"; v roce 2008 nemělo žádné (0 %) země eurozóny horší rating než ČR, dnes ho má 71 % z nich; růst HDP zemí mimo eurozónu je vyšší než v eurozóně; česká koruna patří k nejstabilnějším měnám a umožňuje vlastní měnovou politiku. Varuje před hrozbou digitálního eura ECB a ztrátou hotovosti. Přebírá analogii Vlastimila Tlustého: přijetí eura je jako dát převodovku auta „do Bruselu" — volant a pedály vám zůstanou, ale když ekonomika potřebuje „zařadit dvojku či trojku", nerozjedete se. Odmítá „marketingové floskule" o tom, že s eurem budeme „u velkého stolu" a budeme mít větší rozhodovací pravomoc — euro by podle něj jen zdražilo komodity. Navazuje na jeho dřívější pozice (viz [Euro a společná armáda jako ztráta suverenity](/temata/suverenita-eu/2026.md#rajchl-2026-03-15-13), [Referendum o euru jako vůle „akcionářů země"](/temata/suverenita-eu/2026.md#rajchl-2026-06-03-02)).

    > „V momentě, kdy se vzdáte vlastní národní měny a přijmete euro, tak je to to stejné, jako kdybyste převodovku z auta dali do Bruselu." — Jindřich Rajchl (cituje Vlastimila Tlustého), [Videoportál 5. 6. 2026](/zdroje/2026-06.md#2026-06-05_rajchl_videoportal-ne-euru-ceska-koruna-5-6-2026)
  podtema: Česká suverenita
