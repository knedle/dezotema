  nadpis: Izrael–Libanon příměří zprostředkované USA (Vrabel, 5. 6. 2026)
  text: Vrabel referuje o dohodě Izraele a Libanonu o příměří, zprostředkované Trumpovou administrativou
    (závazek zastavit nepřátelské akce a pokračovat v rozhovorech). Hodnotí ji jako „super zprávu" — vítá
    každou dohodu, která zastaví zabíjení — ale dává jí malou šanci na trvalost vzhledem k dosavadnímu
    chování Izraele.
