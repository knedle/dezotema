  nadpis: Černá hora vstoupí do EU nejpozději do roku 2028
  text: Na základě projevů ze summitu EU–Západní Balkán v Tivatu Vrabel tvrdí, že Černá hora vstoupí do
    EU „nejpozději do roku 2028" (pro investory do nemovitostí dobrá zpráva, pro zemi špatná). Srbsko
    podle něj naopak do EU nevstoupí (kvůli obchodu s Čínou a spolupráci s Ruskem).
  citace:
  - text: Do roku 2028 si myslím, že nejpozději Černá hora bude součástí Evropské unie.
