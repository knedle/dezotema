  nadpis: Aspen Institute dosazuje „loutky"; podvod v prezidentských volbách 2023 — Zítko (21. 6. 2026)
  text: Pavel Zítko (sám kandidát v prezidentských volbách 2023, kandidaturu prý vyhlásil 17 dní před
    uzávěrkou) popisuje volby jako řízený podvod, který „zmapoval jako insider". Tvrdí, že „první šestka"
    kandidátů byla předem „zaklincována" přes **Aspen Institute**; jakmile se on sám z posledního místa
    posunul na sedmé, „chazarská mafie jako majitel Fortuny" prý třikrát srazila jeho sázkový kurz z 1:60–1:70
    na 1:555. Dále uvádí, že jeho hlasovací lístky byly „okamžitě zkartovány/zašity" a navzdory zákonné
    povinnosti mu je ministerstvo vnitra při třech návštěvách nikdy nepředložilo ke kontrole. Tvrdí, že
    na ukradení identity prezidentského kandidáta (klon kanálu „Pavel Zítko, prezident 2023") podával
    trestní oznámení. Mechanismus „dosazování vybraných loutek" zobecňuje na „jakékoliv volby". Tematicky
    navazuje na Vrabelovu tezi, že [v prezidentských volbách „vytáhnou herce"](/temata/politicky-system/2026.md#vrabel-2026-06-21-05)
    i na [konspirační výklad CIA dosazující elity](/temata/konspirace-ceskoslovensko.md#vrabel-2026-06-21-02).
