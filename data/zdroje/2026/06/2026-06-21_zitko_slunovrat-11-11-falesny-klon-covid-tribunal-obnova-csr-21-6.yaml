  poznamka: 'Facebook/META kriminální praktiky — falešný klon kanálu „s ukradenou identitou" (kradená
    videa + „krávoviny", aby vypadal, že se Zítko zbláznil), FB manipuluje čísla sledujících (originál
    1000 za 3 dny → klon „dorovnán", živé sledování uměle sníženo na 50 při 1300–1400 zobrazeních), blokace
    živého vysílání na 3 kanálech na měsíc (záminka: fotka Trump+Justin Gaethje = „kyberšikana/kybernetická
    bezpečnost") i blokace pozvánky („spam") = cenzura; rozpoznání originálu podle počtu sledování (146)
    a příspěvků (135). COVID jako biologická zbraň — šarže na „E" a 22R–22Z (u 5 % šarží přes 75 % zemřelých),
    desítky milionů mrtvých globálně (60 tis. Německo dle toxikologa Pfizer H. Sterze), Comirnaty 15 stránek/50
    hl. vedlejších účinků (Indie), „nikdy nešlo o kolektivní imunitu" (přiznal Spahn); pokles porodnosti
    −30 % / −35 tis. dětí vs. 2021 (Q1 jen 17,5 tis., vč. „brigádních porodů" z Ukrajiny), data ÚZIS/Kovařík
    (1,3 mil. žen), vinu nesou vlády Babiše i Fialy (krevní testy by ukázaly placebo vs. ostrá šarže)
    = „genocida a sterilizace národa" → výzva k vojenskému tribunálu Norimberg 2.0 (stoch. teror). Obnova
    ČSR — zákon 542/1992 nulitní (bez podpisu prezidenta, Klaus ani Mečiar ho neměli v programu), ČSR
    „běží dál", válečné reparace 9500 t zlata (28–29 bil. Kč) jen pro ČSR (ne korporaci Česko); akademik
    Pjakin „99,9 % obnova ČSR"; QFS/kvantový finanční systém (kolaterální účty, rodný list jako burzovní
    papír, návrat ke zlatu, ISO 20022/Basel, odstávky bank, JFK „starter"/Trump „finisher", finále k 4.
    7.); kritika „mimoňů" (kteří jdou „mimo mě", propagovali očkování dětí 13. 12. 2021 v Kotvě) + výzva
    jít „místo nich"; Aspen Institute dosazuje „loutky" (první šestka prez. kandidátů 2023), Zítko jako
    insider — po posunu z posledního na 7. místo „chazarská mafie" (Fortuna) třikrát srazila jeho kurz
    z 1:60/1:70 na 1:555, hlasovací lístky zničeny/nepředloženy (3× na MV); bitcoiny 100+ mld (Blažek/Tyc/Daňhel,
    dvě tržiště Sheep 39 918 + Nucleus 5366 BTC, nečinnost NCOZ/Olomouc); kritika Rajchla (vládní poslanec
    SPD, nesplněné „desatero" z 26. 1. — VHO/očkovací strategie/pandemická smlouva), Füllmich a Peková
    (Pavel „neměl koule" odpovědět na otevřený dopis Pekové). Logistika (Ráj Litice 4.–6. 7., sv. Jan
    24. 6. — výročí jeho zatčení, křest knihy J. Peterkové) nezpracována. Živé vysílání na letní slunovrat
    (11:11) na náhradním profilu Pavel Zítko'
