  kapitola: „Pfizergate" a rod von der Leyenových (Zítko, 16. 7. 2026)
  nadpis: SMS-ky s Bourlou a objednávka 10 vakcín na obyvatele
  datum: null
  mluvci: null
  text: 'Zítko rozvíjí narativ „Pfizergate": Ursula von der Leyen měla přes nedohledatelné SMS domluvit
    s Albertem Bourlou (Pfizer) nákup vakcín za desítky miliard dolarů — dle jeho výpočtu přibližně 4,5
    miliardy dávek pro EU, tedy asi 10 vakcín na každého obyvatele včetně kojenců. Bourlu opakovaně označuje
    za „veterináře", u nějž prý všechna testovaná zvířata na mRNA uhynula. Navazuje na již dokumentované
    teze o začerněných smlouvách a nákupu za 100+ mld. EUR bez odpovědnosti výrobců (viz [Soudní dvůr
    EU: Komise pochybila utajením smluv](#soudní-dvůr-eu-komise-pochybila-utajením-vakcinačních-smluv-vrabel-11-6-2026)).'
